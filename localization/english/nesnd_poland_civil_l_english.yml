l_english:
 nesnd_poland_secret_societies:0 "Organise Secret Societies"
 nesnd_poland_secret_societies_desc:0 "Establish a [GetCulture('polish').GetName] minority movement in a partitioning country. Move 10 points towards the Reds and lose 10 relations with the target. Cooldown: 3 years. The network lasts 3 years, with a 20% annual chance of exposure."
 nesnd_poland_shelter_exiles:0 "Shelter Exiles"
 nesnd_poland_shelter_exiles_desc:0 "Support liberal and radical movements in a partitioning country, increasing their radicalism for 3 years. Move 10 points towards the Reds and lose 10 relations with the target. Cooldown: 3 years."
 nesnd_poland_covert_arms:0 "Covert Arms Supplies"
 nesnd_poland_exile_agitation:0 "Support from Exiles Abroad"
 nesnd_poland_civil.arms:0 "Supply the insurgents with arms."
 nesnd_poland_civil.government:0 "Supply the incumbent government."
 nesnd_poland_civil.neutral:0 "Remain neutral."
 nesnd_poland_civil.ultimatum:0 "Prepare an ultimatum during the civil war."
 nesnd_poland_civil.cancel:0 "Postpone the operation."
 nesnd_poland_civil_ultimatum_tt:0 "For one year we may press territorial demands on [SCOPE.sCountry('nesnd_poland_government').GetName] even while it is at civil war. The other ultimatum requirements still apply."
 nesnd_poland_sanctions_claim_tt:0 "The target gains grounds to demand sanctions against us."
 nesnd_poland_civil.1.t:0 "An Uprising Beyond the Frontier"
 nesnd_poland_civil.1.d:0 "[SCOPE.sCountry('nesnd_poland_rebels').GetName] has risen against [SCOPE.sCountry('nesnd_poland_government').GetName]. This [GetCulture('polish').GetName] secession challenges the frontier established in 1829. The Reds urge us to supply the insurgents and negotiate union after independence. The Whites fear retaliation by the powers."
 nesnd_poland_civil.2.t:0 "Revolution in a Partitioning Power"
 nesnd_poland_civil.2.d:0 "[SCOPE.sCountry('nesnd_poland_government').GetName] is fighting [SCOPE.sCountry('nesnd_poland_rebels').GetName] for control of the country. We could supply the revolutionaries and seek territory from their new government, or support the incumbent authorities in return for better relations. Preparing an ultimatum would weaken the consensus of 1829."
 nesnd_poland_civil.3.t:0 "Civil War in France"
 nesnd_poland_civil.3.d:0 "[SCOPE.sCountry('nesnd_poland_government').GetName] and [SCOPE.sCountry('nesnd_poland_rebels').GetName] are contesting the rule of France. French support matters to our territorial claims. Aid to the victor will strengthen that support after the war, while support for the defeated faction will weaken it."
 nesnd_poland_civil.4.t:0 "Union with Warsaw"
 nesnd_poland_civil.4.d:0 "[SCOPE.sCountry('nesnd_poland_union_country').GetName] proposes a union, transferring authority over our territory and people to its government. We can now decide freely whether to accept. Union would end our separate government. Refusal would preserve the existing frontier."
 nesnd_poland_civil.4.a:0 "Agree to the union."
 nesnd_poland_civil.4.b:0 "Retain our independent government."
 nesnd_poland_civil.5.t:0 "The Frontier after the Revolution"
 nesnd_poland_civil.5.d:0 "The civil war is over. [SCOPE.sCountry('nesnd_poland_union_country').GetName] supplied our revolution and now seeks recognition of its territorial claims. Victory has left the frontier dispute unresolved. We must decide whether to cede a state in return for better relations."
 nesnd_poland_civil.5.a:0 "Cede [SCOPE.sState('nesnd_poland_concession').GetName]."
 nesnd_poland_civil.5.b:0 "A change of government does not change the frontier."
 nesnd_poland_civil.6.t:0 "The Government Prevails"
 nesnd_poland_civil.6.d:0 "[SCOPE.sCountry('nesnd_poland_winner').GetName] has defeated the revolution. Our supplies have improved relations and strengthened support for the settlement of 1829."
 nesnd_poland_civil.6.a:0 "Continue negotiations with its government."
 nesnd_poland_civil.7.t:0 "The Victor in Paris"
 nesnd_poland_civil.7.d:0 "[SCOPE.sCountry('nesnd_poland_winner').GetName] has won the French civil war. Our choice during the conflict will shape the new government’s willingness to support us."
 nesnd_poland_civil.7.a:0 "Resume our dealings with Paris."
 nesnd_poland_civil.10.t:0 "Secret Societies"
 nesnd_poland_civil.10.d:0 "The Reds urge us to establish a [GetCulture('polish').GetName] minority movement in a partitioning country. Secret societies would organise support for secession, exposing us to accusations of foreign agitation."
 nesnd_poland_civil.11.t:0 "The Politics of Exile"
 nesnd_poland_civil.11.d:0 "We can shelter exiles from a partitioning country and support its liberal and radical movements against the authorities. This policy would intensify political conflict abroad and damage our relations with the target."
 nesnd_poland_civil.12.t:0 "Covert Support Exposed"
 nesnd_poland_civil.12.d:0 "[SCOPE.sCountry('nesnd_poland_conspiracy_target').GetName] has exposed our covert support for its opponents and demands that the powers hold us responsible for undermining the consensus of 1829."
 nesnd_poland_civil.12.a:0 "Accept the diplomatic consequences."
 nesnd_poland_civil.target_rus:0 "Choose [SCOPE.sCountry('nesnd_poland_rus').GetName]."
 nesnd_poland_civil.target_pru:0 "Choose [SCOPE.sCountry('nesnd_poland_pru').GetName]."
 nesnd_poland_civil.target_aus:0 "Choose [SCOPE.sCountry('nesnd_poland_aus').GetName]."
 nesnd_poland_arms_cost_tt:0 "Spend the equivalent of 3 weeks of our fixed income. The recipient’s military goods costs fall by 15% for 12 months."
