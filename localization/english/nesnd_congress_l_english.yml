l_english:
 je_nesnd_congress:0 "The Continental Congress"
 je_nesnd_congress_reason:0 "The settlement of 1829 preserved the Polish state while placing its frontiers under the supervision of the powers. France seeks to maintain this arrangement through congresses, while the partitioning powers demand an end to Polish expansion. Territorial claims, guarantees of independence and Polish migration require the delegates’ approval. Rejected demands deepen resentment against the settlement."
 nesnd_congress_order_bar:0 "Stability of the Settlement"
 nesnd_congress_order_bar_desc:0 "Stability: [GetGlobalVariable('nesnd_congress_order').GetValue|0] / 100"
 nesnd_congress_status_voting:0 "Convener: [GetGlobalVariable('nesnd_congress_chair').GetCountry.GetName]. Votes for: [GetGlobalVariable('nesnd_congress_yes').GetValue|0]. Votes against: [GetGlobalVariable('nesnd_congress_no').GetValue|0]. Voting closes after 60 days. Non-voters abstain, and tied proposals fail."
 nesnd_congress_status_recess:0 "Convener: [GetGlobalVariable('nesnd_congress_chair').GetCountry.GetName]. Each congress considers up to two proposals. Great Powers have two votes and other countries one. The convener receives one additional vote, or two when French resolve reaches 60."
 nesnd_congress_status_no_chair:0 "No member can currently convene a congress."
 nesnd_congress_request_btn:0 "Request a Congress"
 nesnd_congress_request_btn_desc:0 "Request a continental congress. Influence is reduced by 100 for one year. Another request cannot be made for five years."
 nesnd_congress_submit_btn:0 "Submit Polish Business"
 nesnd_congress_submit_btn_desc:0 "Choose a proposal for the congress. Further proposals here must wait one year after a reply. Each country may have one outstanding proposal, and a congress accepts no further proposals once voting begins. Territorial demands follow a peace settlement and may transfer only lands of the former Duchy of Warsaw held by a defeated power."
 nesnd_congress_sanctions_btn:0 "Sanction Poland"
 nesnd_congress_sanctions_btn_desc:0 "Request sanctions for the exposed clandestine network. Approval reduces the target’s influence by 100 and prestige by 10% for five years. Approval also reduces revolutionary pressure in A Forest of Bayonets by 5."
 nesnd_congress_request_cost:0 "Preparing the Continental Congress"
 nesnd_congress_sanction:0 "Congress Sanctions"
 nesnd_congress_guarantee_treaty:0 "Congress Guarantee of Independence"
 nesnd_congress.1.t:0 "A Vote at the Continental Congress"
 nesnd_congress.1.d:0 "[SCOPE.sCountry('congress_proposer').GetName] has submitted a proposal concerning [SCOPE.sCountry('congress_target').GetName]. Our delegates must state our position. Opposition from the Great Powers can obstruct a proposal, although no country possesses an individual veto."
 nesnd_congress.1.a:0 "Vote in favour."
 nesnd_congress.1.b:0 "Vote against."
 nesnd_congress.1.c:0 "Cast no vote."
 nesnd_congress.2.t:0 "The Congress Replies"
 nesnd_congress.2.pass:0 "Our proposal has secured a majority. The congress has adopted its terms."
 nesnd_congress.2.veto:0 "Our proposal has failed to secure a majority. The congress has refused to alter the existing arrangements, and this rejection will shape our attitude towards the continental settlement."
 nesnd_congress.2.invalid:0 "The countries or conditions concerned have changed. The congress has withdrawn the proposal from consideration."
 nesnd_congress.2.a:0 "We have received the reply."
 nesnd_congress.3.t:0 "Polish Demands"
 nesnd_congress.3.d:0 "The guarantees and frontiers established in 1829 continue to constrain our policy. We may seek a renewed guarantee of independence or ask a partitioning power to permit Polish emigration. Territorial demands must await a post-war congress, and a white peace cannot compel a transfer of land."
 nesnd_congress.3.guarantee:0 "Request a guarantee from [SCOPE.sCountry('congress_france').GetName]."
 nesnd_congress.3.cancel:0 "Submit no proposal for now."
 nesnd_congress.3.migrate_RUS:0 "Request Polish emigration from [SCOPE.sCountry('congress_rus').GetName]."
 nesnd_congress.3.migrate_PRU:0 "Request Polish emigration from [SCOPE.sCountry('congress_pru').GetName]."
 nesnd_congress.3.migrate_AUS:0 "Request Polish emigration from [SCOPE.sCountry('congress_aus').GetName]."
 nesnd_congress.1.land:0 "[SCOPE.sCountry('congress_proposer').GetName] requests one restoration state from the defeated [SCOPE.sCountry('congress_target').GetName]. Two states may be transferred if the proposer is keeping faith and French resolve reaches 60. The congress can dispose only of lands of the former Duchy of Warsaw still held by the defeated power."
 nesnd_congress.1.guarantee:0 "[SCOPE.sCountry('congress_proposer').GetName] requests a five-year political commitment from [SCOPE.sCountry('congress_target').GetName] to guarantee its independence. An existing guarantee will be reaffirmed at the congress. If no guarantee remains, a new guarantee treaty will be signed with a five-year binding period."
 nesnd_congress.1.migration:0 "[SCOPE.sCountry('congress_proposer').GetName] requests permission for 5% of the Polish population of [SCOPE.sCountry('congress_target').GetName] to emigrate. They will depart in batches under the current reception policy. Another such resolution concerning that country cannot pass for five years."
 nesnd_congress.1.sanctions:0 "Following the exposure of a clandestine network, [SCOPE.sCountry('congress_proposer').GetName] requests sanctions against [SCOPE.sCountry('congress_target').GetName]. Approval reduces the target’s influence by 100 and prestige by 10% for five years. Approval also reduces revolutionary pressure in A Forest of Bayonets by 5."
 nesnd_request_first_congress:0 "$nesnd_congress_request_btn$"
 nesnd_request_first_congress_desc:0 "$nesnd_congress_request_btn_desc$"
 nesnd_congress_vacancy_tt:0 "At least one of the two places on the agenda is free"
 nesnd_congress_no_request_tt:0 "No member has yet requested this sitting"
 nesnd_congress.4.t:0 "Request for a Continental Congress"
 nesnd_congress.4.chair:0 "Our request for a sitting has been sent to the convener, [SCOPE.sCountry('congress_recipient').GetName].\n\n$nesnd_congress.4.next$"
 nesnd_congress.4.pending:0 "We have requested a sitting of the Continental Congress. Once a convener is appointed, that government will take up our request.\n\n$nesnd_congress.4.next$"
 nesnd_congress.4.next:0 "The convener considers requests each month. When a proposal is ready, the members receive their ballots. If the agenda is empty, a vote must wait until $nesnd_lobby_name_kra$ accepts the invitation and submits a proposal."
 nesnd_congress.4.a:0 "We await the summons."
