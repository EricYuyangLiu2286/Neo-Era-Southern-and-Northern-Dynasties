l_english:
 law_nesnd_keju_voting:0 "Examination Franchise"
 law_nesnd_keju_voting_desc:0 "Only licentiates who have passed the civil examinations hold the right to vote and to stand for office, and may debate public affairs in the local and central assemblies of rites. Serving officials may not stand. The government sets the questions, and candidates must be able to study full-time, so voters are mostly literate men of some means."
 amendment_nesnd_keju_ministry_of_rites:0 "Supreme Authority of the Ministry of Rites"
 amendment_nesnd_keju_ministry_of_rites_desc:0 "The Ministry of Rites, with the senior Hanlin scholars, will redraw examination districts at every level and set each region's quota of licentiates to reflect the moral and literary standing of our provinces."
 amendment_nesnd_keju_wider_admissions:0 "Wider Admissions"
 amendment_nesnd_keju_wider_admissions_desc:0 "Overly strict pass marks and scarce quotas in some regions gravely harm the aim our Constitution guarantees: “all take part in government, all keep within the law, until the Great Unity is reached.” The court's Ministry of Rites will therefore enforce strict supervision, so that every capable licentiate will surely become a licentiate."
 nesnd_keju_can_enact_tt:0 "At least one primary culture belongs to the Sinosphere, and the Industrialists are not powerful."
 ideology_nesnd_confucian_constitutionalist:0 "Confucian Constitutionalists"
 ideology_nesnd_confucian_constitutionalist_desc:0 "$ideology_constitutionalist_desc$"
 ideology_nesnd_confucian_republican:0 "Confucian Republicans"
 ideology_nesnd_confucian_republican_desc:0 "$ideology_republican_desc$"
