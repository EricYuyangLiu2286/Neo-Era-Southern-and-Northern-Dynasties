l_english:
 nesnd_japan_war_collapse:0 "The Shogunate in Peril"
 nesnd_japan_war_collapse_reason:0 "Wu armies have crossed the sea. Kyoto sustains the court's authority, while Kanto holds the military strength of the great houses. If both fall, the Toyotomi can no longer command the domains. The victors will determine the boundaries and standing of the three successor governments."
 nesnd_japan_war_collapse_status:0 "While at war with Wu, hostile occupation of #bold both Kyoto and Kanto#! causes the shogunate to collapse. Either centre remaining free allows resistance to continue. An enforced Wu war demand also leads to the defeat settlement."
 nesnd_japan_war_collapse_fallen:0 "The shogunate has fallen. The Toyotomi, Tokugawa and imperial territories are being reorganised. Land still occupied by a third country awaits settlement of the fighting."
 nesnd_xiangyang_camp_journal:0 "The Xiangyang Camp"
 nesnd_xiangyang_camp_journal_reason:0 "Xiangyang commands the Han River and the inland military roads. Its soldiers follow Chen Dongyang's reforms, opposing both the Zheng usurpation and a return to the old gentry's rule. Central supply and regular drills give this inland army the means to hold its ground."
 nesnd_xiangyang_camp:0 "The Xiangyang Camp"
 nesnd_xiangyang_camp_desc:0 "Coordinated arms and provisions sustain a disciplined defence of the Han River."
 nesnd_capital_surrender_accept:0 "The cause is lost."
 nesnd_capital_surrender_tt:0 "This country will be annexed by Wu."
