l_english:
 nesnd_india_imperial_army:0 "Army of Hindustan"
 nesnd_india_reform:0 "Reform in Delhi"
 nesnd_india_reform_reason:0 "The old Mughal empire relied on the prestige of its sovereigns to bind the provinces together. Its rulers now face different demands. French merchants and officers have brought wealth and new weapons, along with new creditors. The state needs schools and workshops of its own to turn provincial revenues into the means to defend it."
 nesnd_india_schools:0 "Schools and Administration"
 nesnd_india_schools_reason:0 "The empire needs officials who can read its accounts and teachers who can educate the next generation. One college in Delhi cannot serve every province. Paper, teachers and regular funding must reach the districts together."
 nesnd_india_industry:0 "Workshops and Armies"
 nesnd_india_industry_reason:0 "Bengal's textiles are sold abroad, yet the imperial army still relies on outdated equipment. Mines, toolworks and railways can connect provincial resources and production, supplying weapons to the army and new livelihoods to workers."
 nesnd_india_school_service:0 "Provincial Education"
 nesnd_india_industrial_service:0 "Imperial Workshops"
 nesnd_india_society:0 "The Dynasty and India"
 nesnd_india_society_reason:0 "Living under one government does not make its subjects a nation. The provinces have their own languages, faiths and princes. As schools and cities grow, their inhabitants are asking who can speak for India. Dynasties, local leaders and the emerging national movement must each offer an answer."
 nesnd_india_society_status:0 "The provinces are seeking a common political home."
 nesnd_india_dynasty_bar:0 "Support for the Dynasty"
 nesnd_india_community_bar:0 "An Indian Nation"
 nesnd_india_dynasty_legitimacy:0 "Government Legitimacy"
 nesnd_india_dynasty_religion:0 "Religious policy"
 nesnd_india_dynasty_dependence:0 "Dependence on France"
 nesnd_india_community_education:0 "Schools and literacy"
 nesnd_india_community_representation:0 "Political representation"
 nesnd_india_community_unrest:0 "Social Turmoil"
 nesnd_india_caste:0 "Birth and Public Office"
 nesnd_india_caste_reason:0 "Schools have opened their doors, but inherited status still determines how far their pupils may rise. Appointing officers and officials by ability requires both new laws and education for families once excluded from it."
 nesnd_india_equal_service:0 "Open Public Service"
 nesnd_india_princes:0 "Among the Princes"
 nesnd_india_princes_reason:0 "Delhi, Nanjing and Paris each have terms to offer the Indian princes. Their rulers seek to preserve more than ancestral palaces: land, revenue and the right to decide their own future are at stake. Cooperation may bring assistance without securing independence."
 nesnd_india_princes_status:0 "Our sovereignty and local interests must be defended."
 nesnd_india_usm:0 "The Lands of Tianzhu"
 nesnd_india_usm_reason:0 "The Southern Court’s Indian possessions lie across the ocean, where merchants, garrisons and local princes pursue different interests. Nanjing may govern them directly or place them under a separate commission. Neither arrangement can improve local livelihoods by decree alone."
 nesnd_india_usm_status:0 "Our directly ruled lands in Tianzhu are not yet enough for a separate commission."
 nesnd_india_unified:0 "A New Order in India"
 nesnd_india_unified_reason:0 "Unification has erased borders without erasing differences between the provinces. The new state must sustain taxation, education and public services if its common laws are to mean anything beyond the court."
 nesnd_india_unified_reward:0 "A Common State"
 nesnd_india_choose_schools:0 "Prioritise Education"
 nesnd_india_choose_industry:0 "Prioritise Industry"
 nesnd_india_priority_desc:0 "Concentrate the government's staff and funding on this undertaking."
 nesnd_india_priority_tt:0 "Make this our reform priority. The other programme pauses without losing its gains."
 nesnd_india_program_months:0 "Months of Sustained Progress"
 nesnd_india_ready_month:0 "Construction and institutions meet the requirements"
 nesnd_india_dynastic_constitution:0 "A Crown for India"
 nesnd_india_republican_settlement:0 "India Belongs to Its People"
 nesnd_india_settlement_desc:0 "Give the provinces’ shared political demands a place in the constitution."
 nesnd_india_community_ready_tt:0 "An Indian Nation has reached 75."
 nesnd_india_dynasty_ready_tt:0 "Support for the Dynasty has reached 60."
 nesnd_india_national_settlement:0 "An Indian Settlement"
 nesnd_india_twelve_months_tt:0 "These conditions have been met for a total of twelve months."
 TZ1:0 "Tianzhu"
 TZ1_ADJ:0 "Tianzhu"
 nesnd_tianzhu_commission_name:0 "Tianzhu Pacification Commission"
 nesnd_establish_tianzhu:0 "Establish the Tianzhu Commission"
 nesnd_establish_tianzhu_desc:0 "Matters ten thousand li away are best left to those ten thousand li away."
 nesnd_establish_tianzhu_tt:0 "Transfer all our directly held states in mainland India, Ceylon and the Indian Ocean Territory to the Tianzhu Commission as a [concept_dominion]. Madras becomes its seat if we still hold it; otherwise our most populous state there does. The princely states remain our direct subjects."
 nesnd_tianzhu_governance:0 "Governing Tianzhu"
 nesnd_tianzhu_governance_reason:0 "Tianzhu’s merchants know the sea routes, while its villages follow a different order. The commissioner must maintain the ports and garrisons while extending schools and revenue services inland. Local princes and communities will not surrender their interests merely because Nanjing has appointed an official."
 YU1:0 "Yuanshan"
 YU1_ADJ:0 "Yuanshan"
 nesnd_yuanshan_commission_name:0 "Yuanshan Pacification Commission"
 nesnd_establish_yuanshan:0 "Establish the Yuanshan Commission"
 nesnd_establish_yuanshan_desc:0 "Place our Yuanshan possessions under a commissioner appointed by the central government."
 nesnd_establish_yuanshan_tt:0 "Transfer all our directly held states in South Africa to the Yuanshan Commission as a [concept_dominion]. Zululand becomes its seat if we still hold it; otherwise our most populous state there does. Our subjects keep their lands."
 nesnd_yuanshan_commission:0 "A Commission for Yuanshan"
 nesnd_yuanshan_commission_reason:0 "Yuanshan’s ports face two oceans and offer our fleets a foothold in southern Africa. A commission can be established only after we have secured and developed possessions there."
 nesnd_yuanshan_governance:0 "Governing Yuanshan"
 nesnd_yuanshan_governance_reason:0 "Yuanshan’s ports have become stations on the Southern Court’s sea routes, but administration inland is only beginning. Roads, revenue services and schools must follow the garrisons if the commission is to become more than a flag on the coast."
 nesnd_commission_governance_reward:0 "An Established Administration"
 nesnd_india_foreign:0 "Strength Through French Assistance"
 nesnd_india_foreign_reason:0 "France seeks to maintain its influence in India through trade, investment and military aid, while the government of [ROOT.GetCountry.GetName] needs teachers, engineers and officers. French expertise can train local specialists, but relying on it will prolong the country’s dependence on Paris."
 nesnd_india_foreign_status:0 "Foreign assistance calls for a policy of our own."
 nesnd_india_diplomatic_desc:0 "Submit a formal request for the other government to consider."
 nesnd_india_request_tt:0 "The other government will decide. Another approach may be made in six months. Accepted French assistance cannot be claimed again for four years."
 nesnd_india_union_request_tt:0 "Offer one state terms for joining India. It may refuse. Acceptance requires a settlement payment and ten years of princely pensions."
 nesnd_india_french_advisers:0 "French Advisers"
 nesnd_india_french_teachers:0 "French Teachers"
 nesnd_india_french_engineers:0 "French Engineers"
 nesnd_india_french_officers:0 "French Officers"
 nesnd_india_princely_pensions:0 "Princely Pensions"
 nesnd_india_diplomacy.1.t:0 "An Indian Delegation"
 nesnd_india_diplomacy.1.d:0 "Envoys from [SCOPE.sCountry('india_sender').GetName] have arrived with a request concerning relations between our countries. They await our reply."
 nesnd_india_diplomacy.1.a:0 "Accept these terms."
 nesnd_india_diplomacy.1.b:0 "We cannot agree."
 nesnd_india_diplomacy.2.t:0 "The Envoy Returns"
 nesnd_india_diplomacy.2.d:0 "[SCOPE.sCountry('india_partner').GetName] has accepted our request. The agreement is now in effect; making good use of it falls to us."
 nesnd_india_diplomacy.3.t:0 "The Request Declined"
 nesnd_india_diplomacy.3.d:0 "[SCOPE.sCountry('india_partner').GetName] has declined the delegation’s terms. We must seek another way forward."
 nesnd_india_diplomacy_ack:0 "Understood."
 nesnd_india_reply_aid_tt:0 "Provide a grant and four years of specialist assistance. The recipient pays the advisers’ expenses. The mission withdraws if the countries go to war or the recipient changes its overlord."
 nesnd_india_reply_autonomy_tt:0 "Increase the recipient’s autonomy by one level."
 nesnd_india_reply_independence_tt:0 "Recognise independence and establish a five-year truce."
 nesnd_india_reply_union_tt:0 "Our state will join the other country, bringing its lands and people into the union."
 nesnd_india_reply_defence_tt:0 "Conclude a defensive pact with a three-year binding period."
 nesnd_india_request_1:0 "Invite Teachers from [SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_india_request_2:0 "Invite Engineers from [SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_india_request_3:0 "Invite Officers from [SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_india_request_4:0 "Negotiate Autonomy"
 nesnd_india_request_7:0 "Request Independence"
 nesnd_india_request_6:0 "Invite a Princely State"
 nesnd_india_defence_fra:0 "Seek a Defensive Pact with [SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_india_defence_mug:0 "Seek a Defensive Pact with [SCOPE.sCountry('nesnd_label_mug').GetName]"
 nesnd_india_defence_usm:0 "Seek a Defensive Pact with [SCOPE.sCountry('nesnd_label_usm').GetName]"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName] asks France to send teachers and fund the first stages of its education program. The envoys hope to train local specialists, while the mission would extend French influence over education in their country."
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName] asks France to send mining and industrial engineers and provide funding to establish new industries. The envoys seek production techniques, while French businesses see opportunities in the proposed cooperation."
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName] asks France to send military instructors and help fund the reorganization of its army. The recipient seeks better training and equipment, while France would gain influence over the army's development."
 nesnd_india_diplomacy.1.d4:0 "The envoys of [SCOPE.sCountry('india_sender').GetName] request greater autonomy so that their government can manage more of its own affairs. We must decide whether to relinquish some of our authority as overlord."
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName] proposes a defensive pact. It seeks our aid if attacked and offers to undertake the same obligation in our defence."
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName] invites our country to join a united India, offering pensions to provide for the existing princes. Acceptance would end our separate government and place our lands and people under its authority."
 nesnd_india_diplomacy.1.d7:0 "[SCOPE.sCountry('india_sender').GetName] asks us to recognize its independence and allow its government to decide domestic and foreign affairs. Acceptance would end the existing subject relationship."
 nesnd_india_uprising:0 "Fire in the South"
 nesnd_india_uprising_reason:0 "The Southern Court relies on ports, garrisons and local allies to sustain its rule. Its opponents also need organisation, money and friends. Our government can assist them without treating their lands as its reward."
 nesnd_india_uprising_status:0 "Local resistance awaits its opportunity."
 nesnd_india_contact_desc:0 "Local organizers need messengers they can trust and backers willing to pay."
 nesnd_india_contact_tt:0 "Pay £5,000 and increase government wage costs by 2%. Organisation grows where turmoil is high or living standards are below 10. Transport, the extent of unrest and French officers affect its pace. Pausing ends maintenance and loses 2 preparation each month."
 nesnd_india_pause_tt:0 "Suspend contact and its maintenance cost. Local preparation falls by 2 each month."
 nesnd_india_resume_tt:0 "Resume contact and maintenance without paying the initial fee again."
 nesnd_india_launch_tt:0 "Pay £20,000 to support the rising. A local state is formed. Its former ruler demands the return of this state. The insurgents demand humiliation. An independent sponsor joins the insurgents. Sponsorship does not grant ownership of their land."
 nesnd_india_contact_cost:0 "Southern Organisation Fund"
 nesnd_india_revolt_war:0 "Defending Local Independence"
 nesnd_india_revolt_war_reason:0 "Our former ruler demands this land back. Negotiation and war will decide its independence. Foreign assistance must not become another country’s excuse to annex us."
 nesnd_india_revolt_resolved_tt:0 "The dispute has ended, and we retain the territory of the rising as an independent state."
 nesnd_india_revolt_survived:0 "Independence Preserved"
 nesnd_india_suppression_desc:0 "Devote additional policing resources to disrupting local organisations."
 nesnd_india_suppression_tt:0 "Pay £10,000 to reduce local preparation by 25. This action cannot be repeated for six months."
 nesnd_india_revolt.1.t:0 "A Rising in the South"
 nesnd_india_revolt.1.d:0 "Opponents of colonial rule in [SCOPE.sState('india_case_state').GetName] have seized the local administration and declared their independence. Recognition of their breakaway government is now a dispute between states."
 nesnd_india_revolt_ack:0 "The situation has changed."
