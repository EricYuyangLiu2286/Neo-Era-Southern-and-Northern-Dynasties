 nesnd_india_diplomacy.4.t:0 "Engaging Foreign Advisers"
 nesnd_india_diplomacy.4.d:0 "Our delegation is preparing to ask [SCOPE.sCountry('india_partner').GetName] for a grant of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0]. If it agrees, its advisers will serve here for four years. Whom should we invite?"
 nesnd_india_diplomacy.4.f:0 "“We shall meet the advisers’ expenses for the duration of their service in our country.”\n—Terms of engagement drafted by the mission"
 nesnd_india_diplomacy.4.1:0 "[GetStaticModifier('nesnd_india_french_teachers').GetName]"
