 nesnd_india_dynasty_journal:0 "The Dynasty’s Standing"
 nesnd_india_dynasty_journal_reason:0 "The dynasty’s old prestige still carries weight, but its subjects also judge their sovereign by the conduct of government. Respect for the provinces’ faiths and the court’s ability to make its own decisions will shape their loyalty."
