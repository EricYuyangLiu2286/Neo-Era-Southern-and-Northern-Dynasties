 nesnd_tianzhu_transfer_desc:0 "Land taken by the sword still needs someone to tax it, garrison it and count its households."
 nesnd_tianzhu_transfer_tt:0 "Transfer all our directly held states in mainland India, Ceylon and the Indian Ocean Territory to the Tianzhu Commission."
 nesnd_yuanshan_transfer:0 "Hand New Yuanshan Lands to the Commission"
 nesnd_yuanshan_transfer_desc:0 "A border drawn on a sea chart still needs someone to go ashore and set up the markers."
