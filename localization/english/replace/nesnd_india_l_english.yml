 nesnd_india_mission_country_tt:0 "Our country is an Indian princely state, an Indian empire or one of the southern states entitled to send a mission."
 nesnd_india_union_target_exists_tt:0 "At least one princely state is at peace and has [concept_relations] of #v 25#! or more with us."
 nesnd_india_union_invite_tt:0 "Invite this state to join us. If it is another country's [concept_subject], its [concept_overlord] is asked for consent first. Once the invitation goes out, or consent is refused, we may not open another negotiation for six months."
 nesnd_india_union_no_invite_tt:0 "We send no invitation now, and no negotiation is used up."
 nesnd_india_diplomacy.5.t:0 "Which State to Invite"
 nesnd_india_diplomacy.5.d:0 "We are preparing to invite a princely state to join [ROOT.GetCountry.GetName], and have set aside @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0] for the settlement allowance. That state may merge into our country, placing its lands and people under our government, or become our [concept_dominion] and keep its own government, laws, [concept_treasury] and army. It may also decline. Either way of joining gives its prince a pension."
 nesnd_india_diplomacy.5.f:0 "“The prince shall receive a pension. His lands and people shall either be merged into [ROOT.GetCountry.GetName], or govern themselves as a dominion of [ROOT.GetCountry.GetName].”\n—Terms of accession carried by the mission"
 nesnd_india_diplomacy.5.1:0 "Invite [SCOPE.sCountry('india_union_candidate_1').GetName]"
 nesnd_india_diplomacy.5.2:0 "Invite [SCOPE.sCountry('india_union_candidate_2').GetName]"
 nesnd_india_diplomacy.5.3:0 "Invite [SCOPE.sCountry('india_union_candidate_3').GetName]"
 nesnd_india_diplomacy.5.4:0 "Invite [SCOPE.sCountry('india_union_candidate_4').GetName]"
 nesnd_india_diplomacy.5.e:0 "Send no invitation for now."
 nesnd_india_partner_can_fund_tt:0 "Their [concept_gold_reserves] cover the grant we are asking for, and they are in neither [concept_default] nor [concept_bankruptcy]."
 nesnd_india_workshop_rate_tt:0 "Each @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_workshop_pounds_per_level')|0] of the grant entitles the contributing government to one level of [GetBuildingType('building_tooling_workshop').GetName], up to five. Levels already owned by [SCOPE.sCountry('india_partner').GetName]’s government count towards the total."
 nesnd_india_owned_by_our_government:0 "owned by our government"
