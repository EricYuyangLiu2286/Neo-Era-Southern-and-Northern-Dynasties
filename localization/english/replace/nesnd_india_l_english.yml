 nesnd_tianzhu.1.t:0 "The Commission Opens Its Office"
 nesnd_tianzhu.1.d:0 "The edict reached Tianzhu with the monsoon, and the commissioner received his seal to the sound of the harbour guns. From now on the garrisons, customs and lawsuits of Tianzhu need not wait half a year for a ship: the commission decides them on the spot. Nanjing only appoints the commissioner and collects the revenue on time.\n\nThe princes have a new superior to deal with, the merchant houses a new office to send their ledgers to, and the villages pay their land tax as before. For Nanjing the bargain could hardly be better: the credit goes to the court, the trouble stays in Tianzhu."
 nesnd_tianzhu.1.a:0 "The commissioner shall dispense the court's grace in its name."
 nesnd_tianzhu_founding_reward:0 "Commission Inaugurated"
