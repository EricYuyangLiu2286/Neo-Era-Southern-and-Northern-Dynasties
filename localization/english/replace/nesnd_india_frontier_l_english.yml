l_english:
 nesnd_india_frontier:0 "Himalayan Treaties"
 nesnd_india_frontier_void_conclusion:0 "We are no longer party to these negotiations."
 nesnd_india_frontier_reason_small_none_none:0 "[ROOT.GetCountry.GetName] may ask [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] for a [concept_trade_privilege], and [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] may ask us for [concept_military_access]. Either [concept_treaty] has a [concept_binding_period] of five years, and [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0] once on signing.\n\nWe hold no trade privilege from [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] at present.\nWe grant no military access to [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] at present."
