 nesnd_india_frontier_status_consent_5_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the treaty by which [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] grants [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] [concept_military_access], for five more years and with no further payment. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_answer_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us for a [concept_trade_privilege]. We would pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. We are a party to the treaty and decide for ourselves."
 nesnd_india_frontier_status_answer_3:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us for [concept_military_access], so that its armies may march through our land. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. We are a party to the treaty and decide for ourselves."
 nesnd_india_frontier_status_answer_4:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the [concept_trade_privilege] treaty between us, so that it keeps the privilege from us for five more years, with no further payment. We are a party to the treaty and decide for ourselves."
 nesnd_india_frontier_status_answer_5:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the treaty by which it grants us [concept_military_access], for five more years and with no further payment. We are a party to the treaty and decide for ourselves."
 nesnd_india_frontier.1.t:0 "They Agree"
 nesnd_india_frontier.1.d_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to our request. The two countries have signed a [concept_treaty] granting us a [concept_trade_privilege] from [SCOPE.sCountry('india_matter_to').GetName], with a [concept_binding_period] of five years. [SCOPE.sCountry('india_matter_to').GetName] has paid us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0]."
 nesnd_india_frontier.1.d_access:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to our request. The two countries have signed a [concept_treaty] by which [SCOPE.sCountry('india_matter_to').GetName] grants us [concept_military_access], with a [concept_binding_period] of five years. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0]."
 nesnd_india_frontier.1.d_renew_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew the treaty granting us a [concept_trade_privilege]. It remains the same treaty, and when its present term ends it runs for five more years."
 nesnd_india_frontier.1.d_renew_access:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew the treaty by which we grant it [concept_military_access]. It remains the same treaty, and when its present term ends it runs for five more years."
 nesnd_india_frontier.1.f:0 "“The two governments have reached agreement on this matter.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_frontier_signed_tt:0 "The agreement between the two countries is in effect."
 nesnd_india_frontier.2.t:0 "No Agreement"
 nesnd_india_frontier.2.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has withheld its consent as [concept_overlord], and our request ends there."
 nesnd_india_frontier.2.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request."
 nesnd_india_frontier.2.d_silent:0 "Our request went unanswered within the time allowed and has lapsed."
 nesnd_india_frontier.2.d_renew_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] does not agree to renew. When the treaty expires, we shall withdraw from it."
 nesnd_india_frontier.2.d_renew_silent:0 "Our request to renew went unanswered within the time allowed. When the treaty expires, we shall withdraw from it."
 nesnd_india_frontier.2.d_void:0 "Circumstances have changed and our request no longer stands."
 nesnd_india_frontier.2.f:0 "“These negotiations are suspended.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_frontier_failed_tt:0 "The request ends here. We may not open another negotiation until six months after it was made."
 nesnd_india_frontier_lapse_tt:0 "In the month the treaty expires, we withdraw from it."
 nesnd_india_frontier.3.t:0 "A Treaty Nears Its End"
 nesnd_india_frontier.3.d_trade:0 "Our treaty granting us a [concept_trade_privilege] from [SCOPE.sCountry('india_frontier_empire').GetName] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_frontier_trade_term'))]. It will not end of itself. We may ask [SCOPE.sCountry('india_frontier_empire').GetName] to renew it, or let it expire and withdraw from it then."
 nesnd_india_frontier.3.d_access:0 "Our treaty granting [concept_military_access] to [SCOPE.sCountry('india_frontier_empire').GetName] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_frontier_access_term'))]. It will not end of itself. We may ask [SCOPE.sCountry('india_frontier_empire').GetName] to renew it, or let it expire and withdraw from it then."
 nesnd_india_frontier.3.f:0 "“Whether this treaty is renewed when its binding period ends shall be settled between the two governments.”\n—Treaty between [SCOPE.sCountry('india_frontier_small').GetName] and [SCOPE.sCountry('india_frontier_empire').GetName]"
 nesnd_india_frontier.3.a:0 "Seek Renewal"
 nesnd_india_frontier.3.b:0 "Let It Expire"
 nesnd_india_frontier_renew_tt:0 "We ask [SCOPE.sCountry('india_frontier_empire').GetName] to renew, with no further payment. If [SCOPE.sCountry('india_frontier_empire').GetName] agrees, the term is extended by five years and the treaty stays the same one. A refusal, or no answer within thirty days, counts as not renewing."
 nesnd_india_frontier_let_lapse_tt:0 "In the month the treaty expires, we withdraw from it without the penalties of breaking it. [SCOPE.sCountry('india_frontier_empire').GetName] will be informed."
 nesnd_india_frontier.4.t:0 "The Treaty Expires"
 nesnd_india_frontier.4.d_trade:0 "The treaty granting [SCOPE.sCountry('india_frontier_small').GetName] a [concept_trade_privilege] from [SCOPE.sCountry('india_frontier_empire').GetName] has expired without renewal. [SCOPE.sCountry('india_frontier_small').GetName] has withdrawn from it without the penalties of breaking it."
 nesnd_india_frontier.4.d_access:0 "The treaty granting [SCOPE.sCountry('india_frontier_empire').GetName] [concept_military_access] through [SCOPE.sCountry('india_frontier_small').GetName] has expired without renewal. [SCOPE.sCountry('india_frontier_small').GetName] has withdrawn from it without the penalties of breaking it."
 nesnd_india_frontier.4.f:0 "“The Government has withdrawn from the treaty on the expiry of its term.”\n—Note from the Government of [SCOPE.sCountry('india_frontier_small').GetName] to the Government of [SCOPE.sCountry('india_frontier_empire').GetName]"
 nesnd_india_frontier_expired_tt:0 "The treaty between the two countries is no more."
