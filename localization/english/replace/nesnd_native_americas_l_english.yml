 nesnd_khanate_emergence:0 "Revival of the Plains Compact"
 nesnd_khanate_emergence_reason:0 "The American Civil War has shaken authority on the Great Plains. Dongzhou's new registration law has stirred Indigenous resentment, and community leaders are rallying supporters of the earlier uprising to establish a khanate of their own."
 nesnd_khanate_waiting_status:0 "Awaiting four connected, populated American states on the Great Plains. The United States must retain populated territory after cession."
 nesnd_khanate_established_tt:0 "The Indigenous khanate has actually received four states and established its government."
 nesnd_khanate_survival:0 "The Khanate's Struggle for Survival"
 nesnd_khanate_survival_reason:0 "Both the United States and Dongzhou demand the khanate's territory. The new khan must lead its communities against both powers and defend the lands on which their people have settled."
 nesnd_khanate_usa_status:0 "The United States has not ended its intervention against the khanate."
 nesnd_khanate_hus_status:0 "Dongzhou has not ended its intervention against the khanate."
 nesnd_khanate_survival_status:0 "Both interventions against the khanate have ended."
 nesnd_khanate_legacy_status:0 "The khanate has been established."
 nesnd_khanate_survived_tt:0 "The khanate survives and both independent interventions have reached an outcome."
 nesnd_suppress_native_khanate:0 "Intervene against the Plains Khanate"
 nesnd_suppress_native_khanate_reason:0 "Territorial cession and migration have changed the balance of power in North America. Our government seeks to annex the khanate, while the khanate intends to force its interveners to acknowledge its position."
 nesnd_khanate_intervention_status:0 "Our government is seeking to annex the khanate."
 nesnd_khanate_destroyed_tt:0 "Our country has annexed the Great Plains Khanate."
 nesnd_khanate_suppression_failed_tt:0 "The intervention has ended without annexation of the khanate by our country."
 nesnd_khanate_war:0 "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression:0 "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression_desc:0 "The intervening power demands annexation of the Great Plains Khanate; the khanate demands the humiliation of its opponent."
 dp_nesnd_khanate_suppression_tooltip:0 "#header $dp_nesnd_khanate_suppression$#!\n$dp_nesnd_khanate_suppression_desc$"
 NKH:0 "Great Plains Khanate"
 NKH_ADJ:0 "Great Plains"
 wg_nesnd_khanate_annex:0 "Annex the Khanate"
 wg_nesnd_khanate_annex_desc:0 "Annex the Great Plains Khanate."
 wg_nesnd_khanate_humiliation:0 "Humiliate the Intervener"
 wg_nesnd_khanate_humiliation_desc:0 "Force the government responsible for this intervention to accept humiliation."
 nesnd_khanate_army:0 "Army of the Plains Compact"
 nesnd_native_american_republic:0 "Establish an Indigenous Republic"
 nesnd_native_american_republic_desc:0 "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and a complete ordinary legal settlement."
 nesnd_native_khanate.2.t:0 "A State on the Plains"
 nesnd_native_khanate.2.d:0 "Both interventions have ended, and the khanate has preserved its government. Communities united to resist outside powers must now settle questions of taxation, defence and local authority if the plains compact is to endure."
 nesnd_native_khanate.2.a:0 "Preserve the state we have built."
 nesnd_native_khanate.3.t:0 "A Republic of Indigenous America"
 nesnd_native_khanate.3.d:0 "From the northern plains to the southern mountains, the Americas now answer to one government. The old state of Dongzhou is gone. The new [ROOT.GetCountry.GetName] has taken its name, abolished its social hierarchy and proclaimed republican government across the continent."
 nesnd_native_khanate.3.a:0 "Let the peoples of America shape their future."
 nesnd_a2_exodus_both_desc:0 "Manchu and Mongol communities have left for [SCOPE.sCountry('nesnd_a2_cne_country').GetName] or the west of [SCOPE.sCountry('nesnd_a2_usa_country').GetName]. Each community has a seventy percent chance of choosing the former and thirty percent the latter. Community sizes differ, so the actual population is not divided in an exact seventy-to-thirty ratio."
 nesnd_a2_exodus_cne_desc:0 "No receiving destination remains in the American west. The Manchu and Mongol communities have all moved to [SCOPE.sCountry('nesnd_a2_cne_country').GetName], and the planned division between two destinations has not taken place."
 nesnd_a2_exodus_usa_desc:0 "No receiving destination remains in the east. The Manchu and Mongol communities have all moved to western [SCOPE.sCountry('nesnd_a2_usa_country').GetName], and the planned division between two destinations has not taken place."
 nesnd_a2_exodus_none_desc:0 "Neither destination can receive the Manchu and Mongol communities. They remain where they live, and this migration has ended. The registration choice already enacted remains in force."
 nesnd_american_restoration.11.t:0 "The Union Offer Has Expired"
 nesnd_american_restoration.11.d:0 "The Inca court did not consent to union within the allotted time. Both states retain their governments and territory. Negotiations may be renewed after the waiting period."
 nesnd_american_restoration.11.a:0 "Retain separate governments for now."
 nesnd_american_restoration.12.t:0 "The Inca Court Declines Union"
 nesnd_american_restoration.12.d:0 "The Inca court has declined the union offer. A shared dynastic tradition has not proved sufficient to end the partition. Talks may resume after the waiting period."
 nesnd_american_restoration.12.a:0 "Leave room for future talks."
 nesnd_restore_native_hus:0 "Establish an Indigenous Republic"
 nesnd_restore_native_hus_desc:0 "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and a complete ordinary legal settlement."
 nesnd_native_americas_unified_tt:0 "Own every region in the Americas and Greenland in full, including uncolonized land and foreign portions of split states."
 nesnd_native_hus_restored_tt:0 "Adopt Indigenous primary cultures, establish a republic, and enact the complete settlement of twenty-four ordinary law groups."
 nesnd_american_restoration.13.t:0 "Reconstituting Dynastic Government"
 nesnd_american_restoration.13.d:0 "Dynastic supporters have reconvened the local communities to settle relations among court, local representatives, and countryside. The existing state will continue under a renewed political compact, bearing the divisions left by the earlier war."
 nesnd_american_restoration.13.a:0 "Preserve the state and renew its compact."
 nesnd_native_khanate.2.both:0 "Both intervening governments have been forced to accept humiliation, and the khanate retains its government. Victory has lent prestige to the Plains compact. Its communities must now turn their wartime alliance into lasting government."
 nesnd_native_khanate.2.one:0 "One intervention ended with the opponent's humiliation, and the other has also come to a close. The khanate has preserved its government. The plains communities must now carry their wartime cooperation into everyday rule."
 nesnd_native_khanate.2.none:0 "Both interventions have ended. Though it has forced neither opponent to accept humiliation, the khanate has preserved its government. Its communities must share the burdens of taxation and defence to sustain the new state."
 war_goal_wg_nesnd_restoration_settlement_type_name:0 "Unify the Country"
 war_goal_wg_nesnd_restoration_settlement_type_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
 war_goal_wg_nesnd_restoration_settlement:0 "Unify the Country: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_restoration_settlement_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
 war_goal_wg_nesnd_restoration_settlement_sway_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
 war_goal_wg_nesnd_khanate_annex_type_name:0 "Annex the Khanate"
 war_goal_wg_nesnd_khanate_annex_type_desc:0 "Annex the Great Plains Khanate."
 war_goal_wg_nesnd_khanate_annex:0 "Annex the Khanate: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_annex_desc:0 "Annex the Great Plains Khanate."
 war_goal_wg_nesnd_khanate_annex_sway_desc:0 "Annex the Great Plains Khanate."
 war_goal_wg_nesnd_khanate_humiliation_type_name:0 "Humiliate the Intervener"
 war_goal_wg_nesnd_khanate_humiliation_type_desc:0 "Force the government responsible for this intervention to accept humiliation."
 war_goal_wg_nesnd_khanate_humiliation:0 "Humiliate the Intervener: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_humiliation_desc:0 "Force the government responsible for this intervention to accept humiliation."
 war_goal_wg_nesnd_khanate_humiliation_sway_desc:0 "Force the government responsible for this intervention to accept humiliation."
 nesnd_native_khanate.4.t:0 "Broken Treaties Before Intervention"
 nesnd_native_khanate.4.d:0 "[SCOPE.sCountry('nesnd_khanate_opponent').GetName] has withdrawn from treaties with the khanate containing an alliance or defensive pact, clearing the way for intervention. Any trade or other provisions in the same treaties end with them. The withdrawing country bears the diplomatic cost of breaking its word. Neither country's treaties with third powers are included."
 nesnd_native_khanate.4.a:0 "The war begins with a broken promise."
 nesnd_final_native_restored_existing_tt:0 "Restored rule: Prestige +30, Rural Folk Approval +3, Construction Efficiency +10%. Lasts 120 months."

 nesnd_ui_restoration_no_dispute_tt:0 "Is not involved in a native restoration dispute."
 nesnd_ui_restoration_native_population_tt:0 "The country still has a native population."
 nesnd_ui_restoration_no_invitation_tt:0 "No restoration invitation is awaiting a reply."
 nesnd_ui_restoration_wait_over_tt:0 "The waiting period after the previous restoration proposal has ended."
 nesnd_ui_khanate_campaign_ended_tt:0 "The dispute over the Great Plains has ended."
 nesnd_ui_khanate_not_annexed_tt:0 "Our country has not annexed the Great Plains Khanate."
 nesnd_native_repression:0 "Military Repression"
 nesnd_restoration_repression_pressure_tt:0 "Restoration Pressure is at least #v 50#!."
 nesnd_restoration_mobilizing_status:0 "Restorationists have established local networks and are gathering people and supplies for an uprising. Preparation lasts #v 12 months#!."
 nesnd_restoration_mobilization_paused_status:0 "The twelve months of preparation are complete. Restoration Pressure is below #v 75#!, delaying the uprising."
 nesnd_restoration_mobilization_ready_status:0 "Preparation is complete. The restorationists will establish their own government once Restoration Pressure is at least #v 75#!, the original regions can sustain an uprising, and no union proposal or other civil war remains unresolved."
 nesnd_american_restoration.14.t:0 "Networks among the Communities"
 nesnd_american_restoration.14.d:0 "Supporters of the old dynasty have established ties with Indigenous communities. Local leaders are gathering people and supplies, seeking a new government that will protect their lands and autonomy.\n\nThese preparations will take twelve months. In [ROOT.GetCountry.GetName], disputes over land and local authority are moving towards armed confrontation. Local support and the prospect of an agreement on councils and land rights will determine whether the communities take up arms."
 nesnd_american_restoration.14.a:0 "Our rule is being challenged."
 notification_nesnd_restoration_repression_notice_name:0 "Restorationists Repressed"
 notification_nesnd_restoration_repression_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has used the army against the restoration movement. The restorationists have suffered a setback, and Indigenous resentment has deepened."
 notification_nesnd_restoration_repression_notice_tooltip:0 "#header $notification_nesnd_restoration_repression_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_repression_notice_desc$"
 notification_nesnd_restoration_mobilization_notice_name:0 "Restorationists Prepare an Uprising"
 notification_nesnd_restoration_mobilization_notice_desc:0 "Restorationists in [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] have begun twelve months of preparation for an uprising. Dynastic supporters and local communities are gathering people and supplies."
 notification_nesnd_restoration_mobilization_notice_tooltip:0 "#header $notification_nesnd_restoration_mobilization_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_mobilization_notice_desc$"
 notification_nesnd_restoration_country_created_notice_name:0 "A Restoration Government Emerges"
 notification_nesnd_restoration_country_created_notice_desc:0 "Restorationists from [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] have established their own government, dividing the former territory between two states."
 notification_nesnd_restoration_country_created_notice_tooltip:0 "#header $notification_nesnd_restoration_country_created_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_country_created_notice_desc$"
 notification_nesnd_restoration_war_started_notice_name:0 "War of Restoration Begins"
 notification_nesnd_restoration_war_started_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] and the restoration government are now at war. Both seek to annex the other."
 notification_nesnd_restoration_war_started_notice_tooltip:0 "#header $notification_nesnd_restoration_war_started_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_war_started_notice_desc$"
 notification_nesnd_restoration_dispatch_failed_notice_name:0 "The Restoration War Fails to Begin"
 notification_nesnd_restoration_dispatch_failed_notice_desc:0 "The restoration dispute involving [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has not led to war. The claim to reunification remains unresolved."
 notification_nesnd_restoration_dispatch_failed_notice_tooltip:0 "#header $notification_nesnd_restoration_dispatch_failed_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_dispatch_failed_notice_desc$"
 notification_nesnd_restoration_opponent_lost_notice_name:0 "An Opposing Government Disappears"
 notification_nesnd_restoration_opponent_lost_notice_desc:0 "The government that originally opposed [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] in the restoration dispute is gone. Their confrontation has ended."
 notification_nesnd_restoration_opponent_lost_notice_tooltip:0 "#header $notification_nesnd_restoration_opponent_lost_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_opponent_lost_notice_desc$"
 notification_nesnd_restoration_dispute_ended_notice_name:0 "The Restoration Dispute Ends"
 notification_nesnd_restoration_dispute_ended_notice_desc:0 "The restoration dispute involving [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has ended without either side annexing the other."
 notification_nesnd_restoration_dispute_ended_notice_tooltip:0 "#header $notification_nesnd_restoration_dispute_ended_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_dispute_ended_notice_desc$"
 notification_nesnd_restoration_settlement_notice_name:0 "The Restoration Struggle Is Decided"
 notification_nesnd_restoration_settlement_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has defeated and annexed the opposing government, taking control of its territory."
 notification_nesnd_restoration_settlement_notice_tooltip:0 "#header $notification_nesnd_restoration_settlement_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_settlement_notice_desc$"
 notification_nesnd_restoration_reopened_notice_name:0 "Restoration Demands Return"
 notification_nesnd_restoration_reopened_notice_desc:0 "Demands from dynastic supporters and local communities have returned to political life in [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]."
 notification_nesnd_restoration_reopened_notice_tooltip:0 "#header $notification_nesnd_restoration_reopened_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_reopened_notice_desc$"
 nesnd_restoration_war_victory_tt:0 "The restoration government has won and annexed its opponent."
 nesnd_restoration_war_terminal_tt:0 "The restoration dispute has ended."
 nesnd_restoration_war_not_victorious_tt:0 "The restoration government has not won."
