l_english:
 nesnd_hus_registration.1.t:0 "The Plains Compact Rises Again"
 nesnd_hus_registration.1.d:0 "[SCOPE.sCountry('nesnd_a2_khanate').GetName] has been established. Indigenous settlers from Dongzhou and the United States have brought their families, possessions and hopes of keeping their land to the new country. The khan chosen by their communities depends on their support, and must defend the homes they have found.\n\nThe United States refuses to give up the land it ceded, and Dongzhou wants the plains back too. For the settlers, whether the khanate survives decides whether they must pack up and move yet again."
 nesnd_hus_registration.1.a:0 "The Plains have new masters."
 nesnd_hus_registration.2.t:0 "Migration after Registration"
 nesnd_hus_registration.2.d:0 "After Indigenous registration was completed, Manchu and Mongol residents remained in the second tier. They have now left the republic: some for $CNE$, others for the American West, seeking a life on new ground."
 nesnd_hus_registration.2.a:0 "The choice has been made."
 war_goal_wg_nesnd_usm_annex_type_name:0 "$war_goal_annex_country_type_name$"
 war_goal_wg_nesnd_usm_annex_type_desc:0 "$war_goal_annex_country_type_desc$"
 war_goal_wg_nesnd_usm_annex:0 "$war_goal_annex_country$"
 war_goal_wg_nesnd_usm_annex_desc:0 "$war_goal_annex_country_desc$"
 war_goal_wg_nesnd_usm_annex_sway_desc:0 "$war_goal_annex_country_sway_desc$"
 nesnd_american_restoration:0 "Dynasties and Local Communities"
 nesnd_american_restoration_reason:0 "The restoration of the house of Moctezuma and the Andean court has won support among Indigenous villages. The republics promised liberty, yet their new rulers still encroach on common land and exact taxes. For those who work the fields, a change of flag in the capital has done little to lighten their burden.\n\nSupporters of the old dynasties are turning this resentment to their advantage. They promise to protect common land and local rights in return for the villages' people and arms. Rural communities, in turn, hope to use a monarch's prestige to resist the depredations of the new elite."
 nesnd_native_recognize:0 "Recognize the Dynasty and Local Compacts"
 nesnd_native_recognize_desc:0 "Recognise the rule of the old dynasty, allowing the court and local communities to negotiate a renewed political compact."
 nesnd_native_recognize_tt:0 "Restore an Indigenous monarchy. If an Inca court already exists, propose a union requiring its consent within ninety days."
 nesnd_native_negotiate:0 "Negotiate Councils and Land Rights"
 nesnd_native_negotiate_desc:0 "Discuss land rights and local councils with community representatives, so that rural demands can find an answer under the present government."
 nesnd_native_negotiate_tt:0 "Restoration Pressure falls by #p 15#! and any preparations for an uprising are halted. Local councils continue to ease support for restoration in the countryside."
 nesnd_native_suppress:0 "Suppress the Restoration Movement"
 nesnd_native_suppress_desc:0 "Use the army to break up restorationist meetings and networks, temporarily weakening rural resistance."
 nesnd_native_suppress_tt:0 "Restoration Pressure falls by #p 20#!. #n 5%#! of our Indigenous population become [Concept('concept_radical','Radicals')]."
 nesnd_native_local_councils:0 "Local Councils and Land Negotiations"
 nesnd_native_restored_rule:0 "Prestige of the Restored Dynasty"
 nesnd_native_exiles:0 "Indigenous Refuge Networks"
 nesnd_restoration_pressure_bar:0 "Restoration Pressure"
 nesnd_restoration_pressure_bar_desc:0 "$nesnd_restoration_pressure_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_restoration_pressure_base:0 "Expansion of Restoration Networks"
 nesnd_restoration_pressure_radicals:0 "Support among Radicals"
 nesnd_restoration_pressure_poverty:0 "Discontent in Poverty"
 nesnd_restoration_pressure_repression:0 "Mediation by Local Councils"
 nesnd_restoration_existing_court_status:0 "The Inca court has been established. When both countries are independent and at peace, we may propose a union, subject to the other government's agreement."
 nesnd_restoration_waiting_land_status:0 "The restorationists are seeking a core territory from which to rise. Land, population or the present wars still prevent them from breaking away to form a state."
 nesnd_restoration_politics_status:0 "Supporters of the old dynasty are seeking rural backing through demands for land and local rights."
 nesnd_native_restoration_war:0 "War of Dynastic Restoration"
 nesnd_native_restoration_war_reason:0 "The restorationists have formed a separate government, bringing village militias together under the old dynasty's name to claim rule over the whole country. The former government refuses to surrender the territory that has broken away. War will now decide who protects the common lands, who collects the taxes and whose orders the army obeys.\n\nBoth sides mean to annex the other and refuse any peace that leaves the country divided."
 nesnd_restoration_war_status:0 "Sovereignty over the country and its lands remains in dispute."
 nesnd_restoration_war_against:0 "Our forces are contesting rule over the country with [ROOT.GetCountry.MakeScope.Var('nesnd_restoration_opponent').GetCountry.GetName]. We seek to annex our opponent and end the division into two states."
 nesnd_restoration_war_mustering:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_restoration_opponent').GetCountry.GetName] still governs its territory. Both sides are mustering forces to pursue their claims to rule."
 nesnd_restoration_war:0 "War of Indigenous Restoration"
 dp_nesnd_native_restoration:0 "War of Indigenous Restoration"
 dp_nesnd_native_restoration_desc:0 "The Indigenous polity and the former government contest rule over the country. The victor will annex its opponent."
 dp_nesnd_native_restoration_tooltip:0 "#header $dp_nesnd_native_restoration$#!\n$dp_nesnd_native_restoration_desc$"
 wg_nesnd_restoration_settlement:0 "Unify the Country"
 wg_nesnd_restoration_settlement_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
 nesnd_american_restoration.1.t:0 "The Old Dynasty's Banner"
 nesnd_american_restoration.1.d:0 "The restorationists have established their own government. The old dynasty's name has drawn local militias to its cause, while village leaders hope the uprising will secure their common lands and autonomy. Those who once demanded concessions now demand that the government surrender the country.\n\nThe capital is equally unwilling to accept partition. Both sides seek to annex the other and refuse a peace that leaves two governments in place. Their struggle for authority has become a fight to the finish."
 nesnd_american_restoration.1.a:0 "Prepare for war."
 nesnd_american_restoration.2.t:0 "Refugees Arrive"
 nesnd_american_restoration.2.d:0 "Indigenous communities fleeing repression have crossed the border, bringing their families, local organisations and memories of a lost homeland. The places that receive them will become centres of a new network of refuge. Open land offers them somewhere to settle and, at last, to rest, if they can survive long enough to learn the ways of this unfamiliar country.\n\nIn time, perhaps their lives here may be better than those they left behind."
 nesnd_american_restoration.2.a:0 "May the Earth Mother bless us, and keep the soil fertile beneath the sun..."
 nesnd_american_restoration.3.t:0 "A Setback for the Restorationists"
 nesnd_american_restoration.3.d:0 "The army has broken up the restorationist meetings and cut the lines between local leaders. Those who wanted force are cheering; the Indigenous people hunted down in the searches are more certain than ever that this government protects only the men who took their land.\n\nThe movement has been beaten down for now, but the countryside's resentment runs deeper. The dynasty's supporters who escaped the soldiers will hardly let such an opportunity slip."
 nesnd_american_restoration.3.a:0 "Anyone else who gathers a crowd will get the same."
 nesnd_american_restoration.4.t:0 "A Compact with the Communities"
 nesnd_american_restoration.4.d:0 "The old dynasty has regained rule over the country. Village communities support the court, which upholds their local rights to preserve the compact. Representatives once turned away by the capital now have somewhere to bring their demands.\n\nThe monarch's power will depend on these people. Whether raising taxes or recruiting soldiers, the restored dynasty must remember whose support brought it back."
 nesnd_american_restoration.4.a:0 "The dynasty rests on the villages that support it."
 nesnd_american_restoration.5.t:0 "Reunification after the War"
 nesnd_american_restoration.5.d:0 "The opposing government has lost its last territory, and the country is reunited. The army is taking control of the provinces. Taxes collected by rival authorities during the war will once again be sent to a single capital.\n\nMany in the countryside followed the losing side. Its flag has come down, but their convictions have not come down with it."
 nesnd_american_restoration.5.a:0 "Restore order in the provinces first."
 nesnd_american_restoration.6.t:0 "The Restoration Struggle Interrupted"
 nesnd_american_restoration.6.d:0 "Changes in territory and government have cut the restoration struggle short. Our rival can no longer fight on, yet we have not taken all of its lands.\n\nWe must work out anew who is friend and who is foe, and settle the unfinished local questions within the new borders."
 nesnd_american_restoration.6.a:0 "First establish who now rules these lands."
 nesnd_american_restoration.10.t:0 "Recognition of One Inca Court"
 nesnd_american_restoration.10.d:0 "[SCOPE.sCountry('nesnd_restoration_applicant').GetName] proposes that both countries recognise the existing Inca court and that its territory be joined to ours. A shared dynastic tradition has given their representatives and ours a basis on which to discuss union.\n\nTheir local communities would come under our rule along with the land, counting on the court to protect their common land and local rights."
 nesnd_american_restoration.10.a:0 "Let one court preside over one country."
 nesnd_american_restoration.10.b:0 "A shared tradition is not yet enough to unite our states."
 nesnd_a2_itzcoatl_first:0 "Itzcoatl"
 nesnd_a2_moctezuma_last:0 "Moctezuma"
 nesnd_a2_amaru_first:0 "Yupanqui"
 nesnd_a2_amaru_last:0 "Amaru I"
 nesnd_a2_rumi_first:0 "Rumi"
 nesnd_a2_quispe_last:0 "Quispe"
 nesnd_a2_tatanka_first:0 "Tatanka"
 nesnd_a2_temur_last:0 "Temur"
 nesnd_khanate_emergence:0 "Revival of the Plains Compact"
 nesnd_khanate_emergence_reason:0 "The American Civil War has shaken authority on the Great Plains, while Dongzhou's new registration law has brought Indigenous grievances to the fore. Community leaders are renewing ties with supporters of the earlier uprising, hoping to use the upheaval in both countries to establish a khanate of their own.\n\nThis alliance is rooted in land. Where people move and how they are registered decide where they can survive. To win the communities' loyalty, a new khan must first promise to defend these things, and then have the strength to keep both powers out."
 nesnd_khanate_waiting_status:0 "Awaiting four connected, populated American states on the Great Plains. The United States must retain populated territory after cession."
 nesnd_khanate_established_tt:0 "The Indigenous khanate has received four states and established its government."
 nesnd_khanate_survival:0 "The Khanate's Struggle for Survival"
 nesnd_khanate_survival_reason:0 "The United States and Dongzhou both demand the khanate's annexation. Indigenous people who have only just settled on the Plains must take up arms again to defend the homes they struggled to obtain. Having acclaimed a common khan, the communities expect him to unite their scattered forces against the two invaders.\n\nThe new khan needs their men and their grain; the local leaders want to keep their own rights. War has knotted the peoples together, and if the knot comes loose, they will have to leave these plains."
 nesnd_khanate_usa_status:0 "The United States has not ended its intervention against the khanate."
 nesnd_khanate_hus_status:0 "Dongzhou has not ended its intervention against the khanate."
 nesnd_khanate_survival_status:0 "Both interventions against the khanate have ended."
 nesnd_khanate_legacy_status:0 "The khanate has been established."
 nesnd_khanate_survived_tt:0 "The khanate survives, and both separate interventions have ended."
 nesnd_suppress_native_khanate:0 "Intervene against the Plains Khanate"
 nesnd_suppress_native_khanate_reason:0 "Since the Great Plains were ceded, migrating peoples have poured onto the grasslands. With the backing of Indigenous communities, the khanate has set up a government and means to twist settlers, land and local militias into a single state. Let it put down roots, and our claim to this land will grow weaker by the year.\n\nWe will annex the khanate. The new khan, for his part, hopes to drive off the interveners and use a victory to stamp the Plains Compact's authority on every band."
 nesnd_khanate_intervention_status:0 "Our government is seeking to annex the khanate."
 nesnd_khanate_destroyed_tt:0 "Our country has annexed the Great Plains Khanate."
 nesnd_khanate_suppression_failed_tt:0 "The dispute over the Great Plains has ended. Our country has not annexed the khanate."
 nesnd_khanate_war:0 "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression:0 "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression_desc:0 "The intervening power demands the annexation of the Great Plains Khanate. The khanate demands the humiliation of its opponent."
 dp_nesnd_khanate_suppression_tooltip:0 "#header $dp_nesnd_khanate_suppression$#!\n$dp_nesnd_khanate_suppression_desc$"
 NKH:0 "Great Plains Khanate"
 NKH_ADJ:0 "Great Plains"
 wg_nesnd_khanate_annex:0 "Annex the Khanate"
 wg_nesnd_khanate_annex_desc:0 "Annex the Great Plains Khanate."
 wg_nesnd_khanate_humiliation:0 "Humiliate the Intervener"
 wg_nesnd_khanate_humiliation_desc:0 "Force the government responsible for this intervention to accept humiliation."
 nesnd_khanate_army:0 "Army of the Plains Compact"
 nesnd_native_american_republic:0 "Establish an Indigenous Republic"
 nesnd_native_american_republic_desc:0 "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and enact its republican laws."
 nesnd_native_khanate.2.t:0 "A State on the Plains"
 nesnd_native_khanate.2.d:0 "Both interventions are over, and the khanate has kept its government. The communities stood together against outside powers, and the settlers have finally made a home on the Plains.\n\nNow the new khan must talk taxes, defence and power with the local leaders. The quarrels shelved in wartime are being laid back on the table, one by one."
 nesnd_native_khanate.2.a:0 "We defended these plains together. We must govern them together."
 nesnd_native_khanate.3.t:0 "A Republic of Indigenous America"
 nesnd_native_khanate.3.d:0 "From the northern plains to the southern mountains, the Americas now answer to one government. The former state of Dongzhou is gone. The new [ROOT.GetCountry.GetName] has inherited its name, abolished the old social hierarchy and assumed rule over the continent as a republic.\n\nIndigenous peoples who once ran from office to office for land, status and local rights are now the masters of this country. A republic this large is theirs to carry from now on."
 nesnd_native_khanate.3.a:0 "Let the peoples of America shape their future."
 nesnd_a2_exodus_both_desc:0 "With registration complete, Manchu and Mongol communities left in the second tier have begun to leave the republic. Some have gone to [SCOPE.sCountry('nesnd_a2_cne_country').GetName], others to the west of [SCOPE.sCountry('nesnd_a2_usa_country').GetName], carrying their families and old ties to new lands.\n\nEach community has a seventy percent chance of choosing the former destination and thirty percent of choosing the latter. In the end, the equal registration they waited for never came."
 nesnd_a2_exodus_cne_desc:0 "The American West has nowhere left to receive these migrants. All the Manchu and Mongol communities leaving the republic have gone to [SCOPE.sCountry('nesnd_a2_cne_country').GetName]. Registration failed to give them the standing they had hoped for, and migration became a means of seeking a different life.\n\nFamilies and old connections travel east with them. Others will tend the homes they leave behind."
 nesnd_a2_exodus_usa_desc:0 "No destination in the east can receive these migrants. All the Manchu and Mongol communities leaving the republic have gone to the west of [SCOPE.sCountry('nesnd_a2_usa_country').GetName]. They carry their families and possessions to new lands, hoping to leave their second-tier status behind.\n\nWhat opportunities await them will become clear only after they arrive. Their former homes are already behind them."
 nesnd_a2_exodus_none_desc:0 "The Manchu and Mongol communities have found no place to receive them in the east and cannot move to the American West. They must remain in their present homes, living under the status assigned to them by registration.\n\nTheir plans to leave have come to nothing. The grievances that prompted them have not."
 nesnd_american_restoration.11.t:0 "The Union Offer Has Expired"
 nesnd_american_restoration.11.d:0 "The deadline has passed, and the Inca court never agreed to union. For all their shared dynastic tradition, the two governments still each rule their own land and people.\n\nTalks can be reopened later. For now, the two states stand apart as before."
 nesnd_american_restoration.11.a:0 "Retain separate governments for now."
 nesnd_american_restoration.12.t:0 "The Inca Court Declines Union"
 nesnd_american_restoration.12.d:0 "The Inca court has turned down the union. The two houses share a dynastic tradition and can call each other kin, but neither will give up its throne or its court.\n\nVillage land and local quarrels are still ours to deal with; we cannot wait on an answer from the court. Once the waiting period has ended, we may send envoys again."
 nesnd_american_restoration.12.a:0 "Leave room for future talks."
 nesnd_restore_native_hus:0 "Establish an Indigenous Republic"
 nesnd_restore_native_hus_desc:0 "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and enact its republican laws."
 nesnd_native_americas_unified_tt:0 "Own every region in the Americas and Greenland in full, including uncolonized land and foreign portions of split states."
 nesnd_native_hus_restored_tt:0 "Establish a republic with Indigenous primary cultures and enact laws in all twenty-four ordinary law groups."
 nesnd_american_restoration.13.t:0 "Reconstituting Dynastic Government"
 nesnd_american_restoration.13.d:0 "The dynasty's supporters have called the local communities together again to settle the terms between court and countryside. The restoration's legitimacy is established, but local leaders still want to know exactly where their land and their representatives stand under the new rule.\n\nThe court needs the villages behind it, and the villages need the court to protect them. This compact must be honoured in every tax and every levy of troops."
 nesnd_american_restoration.13.a:0 "Preserve the state and renew its compact."
 nesnd_native_khanate.2.both:0 "Both intervening governments have been forced to accept humiliation, and the khanate has preserved its government. The victory of the Army of the Plains Compact has brought prestige to the union between the new khan and the communities. Settlers can remain in their new homes.\n\nNow that the fighting is over, they must agree on how to raise taxes, how to share the burden of defence and which rights stay with each community. Battles already won will not hold up a lasting government."
 nesnd_native_khanate.2.one:0 "One intervention ended in the opponent's humiliation, and the other has also come to a close. The khanate has preserved its government and territory. Those who settled here can remain and earn their living on the Plains.\n\nThe communities gathered under the new khan's banner to hold off invasion; now the talk is of taxes, defence and local power. In war, everyone shouldered the load together; in peace, each will want to see what share comes to him."
 nesnd_native_khanate.2.none:0 "Both interventions have ended. The khanate forced neither opponent to accept humiliation, but it has preserved its government. The communities of the Plains can continue to build their new homes.\n\nThe new khan still leans on the local leaders and the settlers. How taxes and defence are shared out, and how each district's rights are kept: on these few things hangs a compact made to survive."
 war_goal_wg_nesnd_restoration_settlement_type_name:0 "Unify the Country"
 war_goal_wg_nesnd_restoration_settlement_type_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
