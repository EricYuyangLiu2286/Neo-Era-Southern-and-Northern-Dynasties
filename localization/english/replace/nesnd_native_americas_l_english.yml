l_english:
 nesnd_hus_registration.1.t:0 "The Plains Compact Rises Again"
 nesnd_hus_registration.1.d:0 "[SCOPE.sCountry('nesnd_a2_khanate').GetName] has been established. Indigenous communities from Dongzhou and the United States are settling there, looking to their new khan to defend their lands. Washington and the government of Dongzhou reject the loss of this territory. War on the Plains is imminent."
 nesnd_hus_registration.1.a:0 "A new government stands on the Plains."
 nesnd_hus_registration.2.t:0 "Migration after Registration"
 nesnd_hus_registration.2.d:0 "After Indigenous registration was completed, Manchu and Mongol residents remained in the second tier. They have now left the republic: some for $CNE$, others for the American West, seeking a life on new ground."
 nesnd_hus_registration.2.a:0 "The choice has been made."
 war_goal_wg_nesnd_usm_annex_type_name:0 "$war_goal_annex_country_type_name$"
 war_goal_wg_nesnd_usm_annex_type_desc:0 "$war_goal_annex_country_type_desc$"
 war_goal_wg_nesnd_usm_annex:0 "$war_goal_annex_country$"
 war_goal_wg_nesnd_usm_annex_desc:0 "$war_goal_annex_country_desc$"
 war_goal_wg_nesnd_usm_annex_sway_desc:0 "$war_goal_annex_country_sway_desc$"
 nesnd_american_restoration:0 "Dynasties and Local Communities"
 nesnd_american_restoration_reason:0 "The heirs of Moctezuma and the Andean court claim different inheritances. Both confront a question the republics have left unresolved: can Indigenous communities control their land and local government? Dynastic supporters appeal to old compacts, while rural communities resist dispossession. Recognition, negotiation, and repression offer sharply different futures."
 nesnd_native_recognize:0 "Recognize the Dynasty and Local Compacts"
 nesnd_native_recognize_desc:0 "Bring the old dynasty and local communities into a new political settlement."
 nesnd_native_recognize_tt:0 "Restore an Indigenous monarchy. If an Inca court already exists, propose a union requiring its consent within ninety days."
 nesnd_native_negotiate:0 "Negotiate Councils and Land Rights"
 nesnd_native_negotiate_desc:0 "Seek rural cooperation through local councils and negotiations over land."
 nesnd_native_negotiate_tt:0 "Reduce restoration pressure by fifteen points. Local councils continue to ease pressure during the negotiations."
 nesnd_native_suppress:0 "Suppress the Restoration Movement"
 nesnd_native_suppress_desc:0 "Use the army against the restoration movement, accepting displacement and rural radicalization."
 nesnd_native_suppress_tt:0 "Forty percent of each existing Indigenous population will migrate to a refuge with a suitable receiving state. Those with no available destination remain where they are. Receiving states gain 25% Migration Attraction for 60 months. Some political figures will go into exile; after migration, 15% of the remaining Indigenous population in our country becomes Radical."
 nesnd_native_local_councils:0 "Local Councils and Land Negotiations"
 nesnd_native_restored_rule:0 "Prestige of the Restored Dynasty"
 nesnd_native_exiles:0 "Indigenous Refuge Networks"
 nesnd_restoration_pressure_bar:0 "Restoration Pressure"
 nesnd_restoration_pressure_bar_desc:0 "The growing alliance between rural communities and dynastic supporters. At its peak, restorationists attempt an uprising where sufficient territory and population are available."
 nesnd_restoration_pressure_base:0 "Expansion of Restoration Networks"
 nesnd_restoration_pressure_radicals:0 "Support among Radicals"
 nesnd_restoration_pressure_poverty:0 "Discontent in Poverty"
 nesnd_restoration_pressure_repression:0 "Mediation by Local Councils"
 nesnd_restoration_existing_court_status:0 "The Inca court has been established. When both countries are independent and at peace, we may propose a union, subject to the other government's agreement."
 nesnd_restoration_waiting_land_status:0 "Restorationists seek a viable core. Territory, population, or current conflicts prevent a territorial uprising."
 nesnd_restoration_politics_status:0 "Dynastic supporters and local communities are gathering political support."
 nesnd_native_restoration_war:0 "War of Dynastic Restoration"
 nesnd_native_restoration_war_reason:0 "The restorationists have formed a government and demand that the central government surrender its authority. Community lands, the allegiance of the army and the dynasty's position are all at stake. Annexing the rival government would reunite the country; a negotiated peace would leave it divided."
 nesnd_restoration_war_status:0 "War and an actual settlement must decide the restoration's future."
 nesnd_restoration_war:0 "War of Dynastic Restoration"
 dp_nesnd_native_restoration:0 "War of Dynastic Restoration"
 dp_nesnd_native_restoration_desc:0 "The restored dynasty and the republic contest rule over the country. The victor will annex the defeated state."
 dp_nesnd_native_restoration_tooltip:0 "#header $dp_nesnd_native_restoration$#!\n$dp_nesnd_native_restoration_desc$"
 wg_nesnd_restoration_settlement:0 "Unify the Restoration Territories"
 wg_nesnd_restoration_settlement_desc:0 "Defeat the opposing government and annex its territory. Suppression first resolves Indigenous refuge and political exile."
 nesnd_american_restoration.1.t:0 "The Old Dynasty's Banner"
 nesnd_american_restoration.1.d:0 "Supporters of the old dynasty have joined local armed groups to break with the central government and form a government of their own. Communities seek to defend their lands, while restorationists demand the dynasty's return. Both sides are mobilizing local support."
 nesnd_american_restoration.1.a:0 "Prepare for war."
 nesnd_american_restoration.2.t:0 "Refugees Arrive"
 nesnd_american_restoration.2.d:0 "Indigenous communities displaced by repression have crossed the border, bringing family ties, local organizations, and memories of lost homes. Their destinations will anchor new refuge networks, though arrival does not immediately restore their livelihoods."
 nesnd_american_restoration.2.a:0 "Let them settle here."
 nesnd_american_restoration.3.t:0 "The Restoration Movement Suppressed"
 nesnd_american_restoration.3.d:0 "The army has dispersed the restoration movement, but the rural conflict persists. Families with a receiving destination begin to leave; those without one remain. Political representatives enter exile, while disputes over land and local authority endure."
 nesnd_american_restoration.3.a:0 "We must bear the consequences."
 nesnd_american_restoration.4.t:0 "A Compact with the Communities"
 nesnd_american_restoration.4.d:0 "The old dynasty has returned to the center of political life. Local communities have offered their support in pursuit of recognition for their land and representatives. Relations among court, assembly, and countryside will now develop under the new settlement."
 nesnd_american_restoration.4.a:0 "Let the new settlement begin."
 nesnd_american_restoration.5.t:0 "Reunification after the War"
 nesnd_american_restoration.5.d:0 "The rival government has lost its last territory, and the country is reunited. The newly acquired provinces still bear the wounds of war. Disputed land and the fate of those driven into exile now require the government's attention."
 nesnd_american_restoration.5.a:0 "Take responsibility for the country left by war."
 nesnd_american_restoration.6.t:0 "The Restoration Dispute Subsides"
 nesnd_american_restoration.6.d:0 "The restoration dispute has subsided. The government has not achieved unification through this confrontation. It must reconsider its course in light of the present borders and the forces that now hold power."
 nesnd_american_restoration.6.a:0 "Accept the present situation."
 nesnd_american_restoration.10.t:0 "Recognition of One Inca Court"
 nesnd_american_restoration.10.d:0 "[SCOPE.sCountry('nesnd_restoration_applicant').GetName] proposes recognizing the existing Inca court and joining our state. Union would end the partition and bring its local communities into the political settlement we must uphold."
 nesnd_american_restoration.10.a:0 "Accept the union."
 nesnd_american_restoration.10.b:0 "Retain separate governments."
