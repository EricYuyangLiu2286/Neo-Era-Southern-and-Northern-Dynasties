 nesnd_ui_khanate_not_annexed_tt:0 "We have not annexed the Great Plains Khanate."
 nesnd_native_repression:0 "Military Repression"
 nesnd_restoration_repression_pressure_tt:0 "Restoration Pressure is at least #v 50#!."
 nesnd_restoration_mobilizing_status:0 "Restorationists have established local networks and are gathering people and supplies for an uprising. Preparation lasts #v 12 months#!."
 nesnd_restoration_mobilization_remaining:0 "\nPreparations end in [GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_restoration_mobilization_timer')|v] days."
 nesnd_restoration_mobilization_paused_status:0 "The twelve months of preparation are complete. Restoration Pressure is below #v 75#!, delaying the uprising."
 nesnd_restoration_mobilization_ready_status:0 "Preparation is complete. The restorationists will establish their own government once Restoration Pressure is at least #v 75#!, the original regions can support an uprising, and no union proposal or other civil war is still pending."
 nesnd_american_restoration.14.t:0 "Networks among the Communities"
 nesnd_american_restoration.14.d:0 "Supporters of the old dynasty have established ties with Indigenous villages. Local leaders are gathering recruits and supplies, hoping a new government will protect their lands and autonomy. The restorationists intend to use this rural strength to restore the dynasty's rule.\n\nPreparations will last twelve months. The government of [ROOT.GetCountry.GetName] can still seek cooperation through negotiations over local councils and land rights, but delay gives the restorationists more time to organise. The response of the villages will determine the strength these networks can summon to arms."
 nesnd_american_restoration.14.f:0 "“After the harvest, bring every man who can serve and all the grain you can spare to the old meeting place.”\n- Message passed between the villages"
 nesnd_american_restoration.14.a:0 "Our rule is being challenged."
 notification_nesnd_restoration_repression_notice_name:0 "Restorationists Repressed"
 notification_nesnd_restoration_repression_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has used the army against the restoration movement. The restorationists have suffered a setback, and Indigenous resentment has deepened."
 notification_nesnd_restoration_repression_notice_tooltip:0 "#header $notification_nesnd_restoration_repression_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_repression_notice_desc$"
 notification_nesnd_restoration_mobilization_notice_name:0 "Restorationists Prepare an Uprising"
 notification_nesnd_restoration_mobilization_notice_desc:0 "Restorationists in [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] have begun twelve months of preparation for an uprising. Dynastic supporters and local communities are gathering people and supplies."
 notification_nesnd_restoration_mobilization_notice_tooltip:0 "#header $notification_nesnd_restoration_mobilization_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_mobilization_notice_desc$"
 notification_nesnd_restoration_country_created_notice_name:0 "A Restoration Government Emerges"
 notification_nesnd_restoration_country_created_notice_desc:0 "Restorationists from [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] have established their own government, dividing the former territory between two states."
 notification_nesnd_restoration_country_created_notice_tooltip:0 "#header $notification_nesnd_restoration_country_created_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_country_created_notice_desc$"
 notification_nesnd_restoration_war_started_notice_name:0 "War of Restoration Begins"
 notification_nesnd_restoration_war_started_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] and the restoration government are now at war. Both seek to annex the other."
 notification_nesnd_restoration_war_started_notice_tooltip:0 "#header $notification_nesnd_restoration_war_started_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_war_started_notice_desc$"
 notification_nesnd_restoration_dispatch_failed_notice_name:0 "The Restoration War Fails to Begin"
 notification_nesnd_restoration_dispatch_failed_notice_desc:0 "The restoration dispute involving [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has not led to war. The claim to reunification is still open."
 notification_nesnd_restoration_dispatch_failed_notice_tooltip:0 "#header $notification_nesnd_restoration_dispatch_failed_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_dispatch_failed_notice_desc$"
 notification_nesnd_restoration_opponent_lost_notice_name:0 "An Opposing Government Disappears"
 notification_nesnd_restoration_opponent_lost_notice_desc:0 "The government that originally opposed [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] in the restoration dispute is gone. Their confrontation has ended."
 notification_nesnd_restoration_opponent_lost_notice_tooltip:0 "#header $notification_nesnd_restoration_opponent_lost_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_opponent_lost_notice_desc$"
 notification_nesnd_restoration_dispute_ended_notice_name:0 "The Restoration Struggle Interrupted"
 notification_nesnd_restoration_dispute_ended_notice_desc:0 "Changes in territory and government have interrupted the restoration struggle involving [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]. We have not unified the land by annexing its opponent."
 notification_nesnd_restoration_dispute_ended_notice_tooltip:0 "#header $notification_nesnd_restoration_dispute_ended_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_dispute_ended_notice_desc$"
 notification_nesnd_restoration_settlement_notice_name:0 "The Restoration Struggle Is Decided"
 notification_nesnd_restoration_settlement_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has defeated and annexed the opposing government, taking control of its territory."
 notification_nesnd_restoration_settlement_notice_tooltip:0 "#header $notification_nesnd_restoration_settlement_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_settlement_notice_desc$"
 notification_nesnd_restoration_reopened_notice_name:0 "Restoration Demands Return"
 notification_nesnd_restoration_reopened_notice_desc:0 "Demands from dynastic supporters and local communities have returned to political life in [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]."
 notification_nesnd_restoration_reopened_notice_tooltip:0 "#header $notification_nesnd_restoration_reopened_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_reopened_notice_desc$"
 nesnd_restoration_war_victory_tt:0 "We have won the war and annexed our opponent."
 nesnd_restoration_war_terminal_tt:0 "The restoration dispute has ended."
 nesnd_restoration_war_not_victorious_tt:0 "We did not annex our opponent."
