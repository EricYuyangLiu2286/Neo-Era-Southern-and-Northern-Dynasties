 nesnd_a2_tatanka_first:0 "Tatanka"
 nesnd_a2_temur_last:0 "Temur"
 nesnd_khanate_emergence:0 "Revival of the Plains Compact"
 nesnd_khanate_emergence_reason:0 "The American Civil War has shaken authority on the Great Plains, while Dongzhou's new registration law has brought Indigenous grievances to the fore. Community leaders are renewing ties with supporters of the earlier uprising, hoping to use the upheaval in both countries to establish a khanate of their own.\n\nLand holds this alliance together. Migration and registration determine where people may live and who decides their status. To win the communities' support, a new khan must promise to defend these rights and possess the strength to resist intervention by both powers."
 nesnd_khanate_waiting_status:0 "Awaiting four connected, populated American states on the Great Plains. The United States must retain populated territory after cession."
 nesnd_khanate_established_tt:0 "The Indigenous khanate has received four states and established its government."
 nesnd_khanate_survival:0 "The Khanate's Struggle for Survival"
 nesnd_khanate_survival_reason:0 "The United States and Dongzhou both demand the khanate's annexation. Indigenous people who have only just settled on the Plains must take up arms again to defend the homes they struggled to obtain. Having acclaimed a common khan, the communities expect him to unite their scattered forces against the two invaders.\n\nThe new khan needs their recruits and supplies, while local leaders insist on retaining their rights. War has brought these peoples together. Whether their union can hold will determine whether they can remain on these plains."
 nesnd_khanate_usa_status:0 "The United States has not ended its intervention against the khanate."
 nesnd_khanate_hus_status:0 "Dongzhou has not ended its intervention against the khanate."
 nesnd_khanate_survival_status:0 "Both interventions against the khanate have ended."
 nesnd_khanate_legacy_status:0 "The khanate has been established."
 nesnd_khanate_survived_tt:0 "The khanate survives, and both separate interventions have ended."
 nesnd_suppress_native_khanate:0 "Intervene against the Plains Khanate"
 nesnd_suppress_native_khanate_reason:0 "Territorial cession and migration on the Great Plains have changed the balance of power in North America. With the support of Indigenous communities, the khanate has established a government and seeks to bind settlers, land and local militias into a new state. The longer we allow it to take root, the harder our territorial claims will be to uphold.\n\nOur government intends to end the khanate's rule through annexation. The new khan hopes to force the intervening powers to submit and win prestige for the Plains Compact. At stake are both the territory itself and the right to determine the lives of its Indigenous inhabitants."
 nesnd_khanate_intervention_status:0 "Our government is seeking to annex the khanate."
 nesnd_khanate_destroyed_tt:0 "We have annexed the Great Plains Khanate."
 nesnd_khanate_suppression_failed_tt:0 "The dispute over the Great Plains has ended. We have not annexed the khanate."
 nesnd_khanate_war:0 "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression:0 "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression_desc:0 "The intervening power demands the annexation of the Great Plains Khanate. The khanate demands the humiliation of its opponent."
 dp_nesnd_khanate_suppression_tooltip:0 "#header $dp_nesnd_khanate_suppression$#!\n$dp_nesnd_khanate_suppression_desc$"
 NKH:0 "Great Plains Khanate"
 NKH_ADJ:0 "Great Plains"
 wg_nesnd_khanate_annex:0 "Annex the Khanate"
 wg_nesnd_khanate_annex_desc:0 "Annex the Great Plains Khanate."
 wg_nesnd_khanate_humiliation:0 "Humiliate the Intervener"
 wg_nesnd_khanate_humiliation_desc:0 "Force the government responsible for this intervention to accept humiliation."
 nesnd_khanate_army:0 "Army of the Plains Compact"
 nesnd_native_american_republic:0 "Establish an Indigenous Republic"
 nesnd_native_american_republic_desc:0 "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and enact its republican laws."
 nesnd_native_khanate.2.t:0 "A State on the Plains"
 nesnd_native_khanate.2.d:0 "Both interventions have ended, and the khanate has preserved its government. The communities joined forces to resist outside powers, and those who migrated here can now remain and build their lives on the Plains.\n\nThe new khan must reach agreement with local leaders on taxation, defence and authority. Disagreements set aside while they fought together will return in the course of everyday government. The Plains Compact will endure only so long as the state serves the interests of those who hold it up."
 nesnd_native_khanate.2.a:0 "We defended these plains together. We must govern them together."
 nesnd_native_khanate.3.t:0 "A Republic of Indigenous America"
 nesnd_native_khanate.3.d:0 "From the northern plains to the southern mountains, the Americas now answer to one government. The former state of Dongzhou is gone. The new [ROOT.GetCountry.GetName] has inherited its name, abolished the old social hierarchy and assumed rule over the continent as a republic.\n\nIndigenous peoples who once petitioned for land, status and local rights have become the masters of the land. This vast republic is now their responsibility. They must decide how common laws will enter the lives of its many communities, and whose interests their newly acquired power will protect."
 nesnd_native_khanate.3.f:0 "“This Republic abolishes all castes. The people of every region shall enjoy equal rights under a common law.”\n- Declaration on the founding of the Republic"
 nesnd_native_khanate.3.a:0 "Let the peoples of America decide their future."
 nesnd_a2_exodus_both_desc:0 "With registration complete, Manchu and Mongol communities left in the second tier have begun to leave the republic. Some have gone to [SCOPE.sCountry('nesnd_a2_cne_country').GetName], others to the west of [SCOPE.sCountry('nesnd_a2_usa_country').GetName], carrying their families and old ties to new lands.\n\nEach community has a seventy percent chance of choosing the former destination and thirty percent of choosing the latter. Along with their people and possessions, the republic is losing the hopes they once held of an equal place within it."
 nesnd_a2_exodus_cne_desc:0 "The American West has nowhere left to receive these migrants. All the Manchu and Mongol communities leaving the republic have gone to [SCOPE.sCountry('nesnd_a2_cne_country').GetName]. Registration failed to give them the standing they had hoped for, and migration became a means of seeking a different life.\n\nFamilies and old connections travel east with them. Others will tend the homes they leave behind."
 nesnd_a2_exodus_usa_desc:0 "No destination in the east can receive these migrants. All the Manchu and Mongol communities leaving the republic have gone to the west of [SCOPE.sCountry('nesnd_a2_usa_country').GetName]. They carry their families and possessions to new lands, hoping to leave their second-tier status behind.\n\nWhat opportunities await them will become clear only after they arrive. Their former homes are already behind them."
 nesnd_a2_exodus_none_desc:0 "The Manchu and Mongol communities have found no place to receive them in the east and cannot move to the American West. They must remain in their present homes, living under the status assigned to them by registration.\n\nTheir plans to leave have come to nothing. The grievances that prompted them have not."
 nesnd_hus_registration.2.f:0 "“Our community was not admitted to the first-class register, and we have resolved to move to another country.”\n- Statement of a Manchu and Mongol community to the local office"
 nesnd_american_restoration.11.t:0 "The Union Offer Has Expired"
 nesnd_american_restoration.11.d:0 "The allotted time has passed without the Inca court agreeing to union. A shared dynastic tradition has not brought the two governments under a single authority. Each remains responsible for its own people and territory.\n\nLocal communities must reconcile their hopes for the court with the politics of the present. Talks may be renewed, but an unanswered proposal cannot alter the fact that two states still stand."
 nesnd_american_restoration.11.f:0 "“The deadline for the merger request has passed without a reply from the court. Until talks are resumed, each country will continue to govern its own land and people.”\n- Foreign ministry memorandum"
 nesnd_american_restoration.11.a:0 "Retain separate governments for now."
 nesnd_american_restoration.12.t:0 "The Inca Court Declines Union"
 nesnd_american_restoration.12.d:0 "The Inca court has refused the proposal for union. A common dynastic tradition may draw the two sides closer, but it has not persuaded their present rulers to accept a single state.\n\nOur government must continue to address land and local politics at home, rather than entrust these responsibilities to a reply from the court. Talks may be renewed once the waiting period has ended."
 nesnd_american_restoration.12.f:0 "“Our two countries honour the same ancestral king. For that very reason, neither may use his name to absorb the other.”\n- Reply of the Inca court"
 nesnd_american_restoration.12.a:0 "Leave room for future talks."
 nesnd_restore_native_hus:0 "Establish an Indigenous Republic"
 nesnd_restore_native_hus_desc:0 "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and enact its republican laws."
 nesnd_native_americas_unified_tt:0 "Own every region in the Americas and Greenland in full, including uncolonised land and foreign portions of split states."
 nesnd_native_hus_restored_tt:0 "Establish a republic with Indigenous primary cultures and enact laws in all twenty-four ordinary law groups."
 nesnd_american_restoration.13.t:0 "Reconstituting Dynastic Government"
 nesnd_american_restoration.13.d:0 "The dynasty's supporters have summoned local communities anew to discuss how power will be shared between court and countryside. The cause of restoration is established, but local leaders still want to know what place their lands and representatives will have under its rule.\n\nThe country must live with the divisions left by earlier struggles. The court needs rural support, and the countryside demands protection for its interests. Their compact will have reason to endure only when these claims take effect in everyday government."
 nesnd_american_restoration.13.f:0 "“First, each community shall keep its lands. Second, taxes shall be set jointly by the court and the local leaders. Third, who shall judge local cases is to be settled separately.”\n- Draft compact between the court and the local communities"
 nesnd_american_restoration.13.a:0 "Preserve the state and renew its compact."
 nesnd_native_khanate.2.both:0 "Both intervening governments have been forced to accept humiliation, and the khanate has preserved its government. The victory of the Army of the Plains Compact has brought prestige to the union between the new khan and the communities. Settlers can remain in their new homes.\n\nWar united them against outside powers. They must now agree on taxation, the burdens of defence and the rights retained by each community. The Plains Compact will need more than past victories to become a lasting government."
 nesnd_native_khanate.2.one:0 "One intervention ended in the opponent's humiliation, and the other has also come to a close. The khanate has preserved its government and territory. Those who settled here can remain and earn their living on the Plains.\n\nThe communities gathered beneath the new khan's banner to resist invasion. They must now discuss taxation, defence and local authority. In peacetime, those who shared the burdens of war will want to see what the common cause gives them in return."
 nesnd_native_khanate.2.none:0 "Both interventions have ended. The khanate forced neither opponent to accept humiliation, but it has preserved its government. The communities of the Plains can continue to build their new homes.\n\nThe new khan still depends on local leaders and settlers for support. How taxes and defence are shared, and how local rights are protected, will determine how long this compact for survival can endure."
 nesnd_native_khanate.2.f:0 "“The war being over, each community shall send delegates to settle taxation, defence and the rights of the localities.”\n- Resolution of the Great Council of the Plains"
 war_goal_wg_nesnd_restoration_settlement_type_name:0 "Unify the Country"
 war_goal_wg_nesnd_restoration_settlement_type_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
 war_goal_wg_nesnd_restoration_settlement:0 "Unify the Country: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_restoration_settlement_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
 war_goal_wg_nesnd_restoration_settlement_sway_desc:0 "Defeat the opposing government and annex its entire territory. The defeat of an Indigenous polity may drive some residents to flee and political figures into exile."
 war_goal_wg_nesnd_khanate_annex_type_name:0 "Annex the Khanate"
 war_goal_wg_nesnd_khanate_annex_type_desc:0 "Annex the Great Plains Khanate."
 war_goal_wg_nesnd_khanate_annex:0 "Annex the Khanate: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_annex_desc:0 "Annex the Great Plains Khanate."
 war_goal_wg_nesnd_khanate_annex_sway_desc:0 "Annex the Great Plains Khanate."
 war_goal_wg_nesnd_khanate_humiliation_type_name:0 "Humiliate the Intervener"
 war_goal_wg_nesnd_khanate_humiliation_type_desc:0 "Force the government responsible for this intervention to accept humiliation."
 war_goal_wg_nesnd_khanate_humiliation:0 "Humiliate the Intervener: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_humiliation_desc:0 "Force the government responsible for this intervention to accept humiliation."
 war_goal_wg_nesnd_khanate_humiliation_sway_desc:0 "Force the government responsible for this intervention to accept humiliation."
 nesnd_native_khanate.4.t:0 "Broken Treaties before Intervention"
 nesnd_native_khanate.4.d:0 "[SCOPE.sCountry('nesnd_khanate_opponent').GetName] has withdrawn from treaties with the khanate containing an alliance or defensive pact, clearing the way for intervention. Promises once intended to secure both countries have given way to demands for annexation and territory.\n\nAny trade or other provisions within those treaties end with them, and the withdrawing country bears the cost of breaking its word. A relationship on which the khanate could once rely has broken under the preparations for war."
 nesnd_native_khanate.4.f:0 "“This government announces its withdrawal from the treaties concluded with the Khanate. All articles contained in them are terminated.”\n- Note of withdrawal"
 nesnd_native_khanate.4.a:0 "The war begins with a broken promise."
 nesnd_final_native_restored_existing_tt:0 "Restored rule: [concept_prestige] +30, Rural Folk Approval +3, Construction Efficiency +10%. Lasts 120 months."

