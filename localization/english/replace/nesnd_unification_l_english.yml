 nesnd_uni_calm_button:0 "Ease Tensions"
 nesnd_uni_calm_button_desc:0 "The government sets aside public agitation for unity and steadies matters at home."
 nesnd_uni_calm_tt:0 "Call for Unity #r -1#! each month until we stop easing tensions"
 nesnd_uni_calm_end_button:0 "Stop Easing Tensions"
 nesnd_uni_calm_end_button_desc:0 "The government allows open talk of unity again."
 nesnd_uni_calm_end_tt:0 "Call for Unity no longer falls each month from easing tensions"
 nesnd_uni_not_calm_tt:0 "We are not easing tensions"
 nesnd_uni_not_mobilize_tt:0 "We are not rallying the nation"
 nesnd_uni_call_25_tt:0 "Call for Unity is at least #v 25#!"
 nesnd_uni_call_minus_25_tt:0 "Call for Unity #r -25#!"
 nesnd_uni_contact_calm_tt:0 "Living standards there are #v 8#! or higher, so no one there turns [concept_radical] over this"
 nesnd_uni_contact_desc_cn:0 "Since antiquity, uniting China out of chaos has been just by its very nature. We need only be ready."
 nesnd_uni.1.t:0 "A Claim Fades"
 nesnd_uni.1.d:0 "For years [SCOPE.sStateRegion('nesnd_uni_lost_region').GetName] appeared only in the dispatches and newspapers of [ROOT.GetCountry.GetName], and not a single soldier crossed the border for it. Fewer and fewer at home still speak of it, and the government no longer counts it among our territorial demands."
 nesnd_uni.1.f:0 "'Our government no longer advances any territorial claim to [SCOPE.sStateRegion('nesnd_uni_lost_region').GetName].'\n—Note to the foreign legations"
 nesnd_uni.1.a:0 "There will be other days."
 nesnd_uni_trend_status_standoff:0 "#bold North–South Standoff#!: [GetGlobalVariable('nesnd_uni_leader').GetCountry.GetName] and [GetGlobalVariable('nesnd_uni_second').GetCountry.GetName] each hold at least thirty-two whole regions of the Zhongzhou continent, among #v [GetGlobalVariable('nesnd_uni_rivals').GetValue|0]#! contenders."
