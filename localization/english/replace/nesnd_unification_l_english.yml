l_english:
 nesnd_uni_trend:0 "The Tide of Unification"
 nesnd_uni_trend_reason:0 "Since the Xuande Emperor died in 1433, no court has commanded the whole of the Zhongzhou continent for four hundred years. The Yan, Qin and Ming dynasties each bled their subjects in the name of unifying All Under Heaven, until they provoked the [Glossary('glossary_nesnd_chinese_revolution','Chinese Great Revolution')]. In 1816 the Chinese Federation made 'Unite the World, Revive the Nation' its final aim, yet the [Glossary('glossary_nesnd_southern_campaign','Southern Campaign')] that began in 1820 failed beneath the walls of Xiangyang.\n\nThe [Glossary('glossary_nesnd_treaty_of_yangzhou','Treaty of Yangzhou')] of 1835 divided north and south along the Yangtze, and Western Qin fell back on Ili. Yet princes great and small went on drilling their armies in their own domains, and the ideal of a united realm did not die with the armistice."
 nesnd_uni_trend_status_none:0 "No contender yet holds a whole region of the Zhongzhou continent."
 nesnd_uni_trend_status_order:0 "#bold From Chaos to Order#!: #v [GetGlobalVariable('nesnd_uni_rivals').GetValue|0]#! contenders, led by [GetGlobalVariable('nesnd_uni_leader').GetCountry.GetName]."
 nesnd_uni_trend_status_tripod:0 "#bold Three Legs of the Tripod#!: #v [GetGlobalVariable('nesnd_uni_rivals').GetValue|0]#! contenders, led by [GetGlobalVariable('nesnd_uni_leader').GetCountry.GetName]."
 nesnd_uni_trend_done:0 "[GetGlobalVariable('nesnd_uni_declared').GetCountry.GetName] has proclaimed the unification of China."
 nesnd_uni_trend_done_tt:0 "A state has proclaimed the unification of China"
 nesnd_uni_trend_done_others_tt:0 "The other contenders receive #bold $nesnd_uni_lost$#! for #v 10#! years"
 nesnd_uni_lead_bar:0 "Regions Held by the Leader"
 nesnd_uni_lead_bar_desc:0 "Leader: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 98#! regions"
 nesnd_uni_join_button:0 "Join the Contest"
 nesnd_uni_join_button_desc:0 "[ROOT.GetCountry.GetName] already holds whole regions of the Zhongzhou continent and cannot stand aside from the contest over it."
 nesnd_uni_join_owned_tt:0 "We own at least #v 3#! whole regions of the Zhongzhou continent"
 nesnd_uni_join_effect_tt:0 "We join the contest for All Under Heaven and open our own unification [concept_journal_entry]"
 nesnd_uni_declare_button:0 "Proclaim the Unification of China"
 nesnd_uni_declare_button_desc:0 "[ROOT.GetCountry.GetName] proclaims to All Under Heaven that the Zhongzhou continent is one again."
 nesnd_uni_declare_majority_tt:0 "We and our subjects hold at least #v 50#! whole regions of the Zhongzhou continent (of #v 98#!)"
 nesnd_uni_declare_all_tt:0 "As a power outside China, we and our subjects must hold all #v 98#! regions of the Zhongzhou continent"
 nesnd_uni_declare_claims_tt:0 "Gain a [concept_claim] on every region of the Zhongzhou continent we do not yet hold whole"
 nesnd_uni_declare_complete_tt:0 "The [concept_journal_entry] #bold $nesnd_uni_trend$#! is completed"
 nesnd_uni_order:0 "From Chaos to Order"
 nesnd_uni_order_desc:0 "Contenders have risen across the Zhongzhou continent, each vying for the right to unite it."
 nesnd_uni_tripod:0 "Three Legs of the Tripod"
 nesnd_uni_tripod_desc:0 "Only a few contenders remain in the Zhongzhou continent, each holding the others in check."
 nesnd_uni_celestial:0 "Celestial Empire"
 nesnd_uni_celestial_desc:0 "The Zhongzhou continent is united once more, and its neighbours look upon it as the Celestial Empire."
 nesnd_uni_lost:0 "The Tide Has Turned"
 nesnd_uni_lost_desc:0 "Another state has proclaimed unification, and our own claim to rule All Under Heaven has come to nothing."
 nesnd_uni_call_scale:0 "Call for Unity"
 nesnd_uni_call_scale_desc:0 "The call at home for a united realm."
 nesnd_uni_country:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_uni_je_name')]"
 nesnd_uni_country_concluded:0 "Unite All Under Heaven"
 nesnd_uni_je_name_cn:0 "Unite All Under Heaven"
 nesnd_uni_je_name_out:0 "Enter the Central Plains"
 nesnd_uni_country_reason_cn:0 "The [Glossary('glossary_nesnd_treaty_of_yangzhou','Treaty of Yangzhou')] gave north and south a pause in the fighting, yet the soldiers, gentry and journalists of [ROOT.GetCountry.GetName] still believe the age of division must end. None of them wants someone else to end it. Officers want glory in the field, merchants want the internal tolls swept away, and essayists invoke 'Great Unity' once more."
 nesnd_uni_country_reason_out:0 "The dynasties of the Central Plains have long failed to restore order, and their quarrels have spilled beyond the Zhongzhou continent into the trade routes, migrants and frontiers of [ROOT.GetCountry.GetName]. Six hundred years ago, when the Mongols rode south from the steppe, they too found a Zhongzhou continent split between north and south."
 nesnd_uni_country_status:0 "When #bold $nesnd_uni_morale_bar$#! reaches #v 0#!, we lose a random [concept_claim] on a region of the Zhongzhou continent, and $nesnd_uni_morale_bar$ returns to #v 100#!."
 nesnd_uni_country_status_qe1:0 "When #bold $nesnd_uni_morale_bar$#! reaches #v 0#!, we lose a random [concept_claim] on a region of the Zhongzhou continent, and $nesnd_uni_morale_bar$ returns to #v 100#!. Our claims on [GetStateRegion('STATE_GANSU').GetName] and [GetStateRegion('STATE_HEXI').GetName] are never lost this way."
 nesnd_uni_country_closed:0 "The contest for unification is over."
 nesnd_uni_call_bar:0 "Call for Unity"
 nesnd_uni_call_bar_desc:0 "Call for Unity: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_uni_morale_bar:0 "Fading Resolve"
