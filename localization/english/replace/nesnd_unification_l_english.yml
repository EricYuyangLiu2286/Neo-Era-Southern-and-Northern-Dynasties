 nesnd_uni_mobilize_button:0 "Rally the Nation"
 nesnd_uni_mobilize_button_desc:0 "Newspapers, lecterns and barracks all take up the cause of unity."
 nesnd_uni_mobilize_tt:0 "Call for Unity #g +1#! each month until we stop the campaign"
