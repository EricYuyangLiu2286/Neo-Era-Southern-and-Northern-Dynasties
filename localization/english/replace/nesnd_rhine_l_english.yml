l_english:
 nesnd_prussian_identity_tt:0 "We are Prussia, or the North German Confederation or Germany formed by Prussia"
 nesnd_prussian_identity_lost_tt:0 "We are no longer Prussia or a country formed by Prussia"
 nesnd_rhine_after_coalition_tt:0 "“A Common Defence for Germany” has been completed"
 nesnd_frm_identity_tt:0 "We are governed by the parliament at Frankfurt"
 nesnd_frm_identity_lost_tt:0 "We are no longer governed by the parliament at Frankfurt"
 nesnd_prussian_rhine:0 "The Rhine Question"
 nesnd_prussian_rhine_reason:0 "Since the Confederation of the Rhine was founded at Frankfurt, most of the lands along the Rhine have answered to it. The coal of the Ruhr and the workshops of Cologne and Düsseldorf pay their taxes to Frankfurt, and Frankfurt has long lived under the protection of Paris. The common defence has given [ROOT.GetCountry.GetName] a voice among the German states again, but the fate of the Rhine will not be settled at a conference table.\n\nOur chance will come when Paris is too busy to look east, or when the parliament on the Rhine turns of its own accord. When it does, the army will pay the price."
 nesnd_rhine_status_france_distracted:0 "Paris has no attention to spare for the Rhine. There will be no better time to mobilise."
 nesnd_rhine_status_parliament:0 "The parliament of [SCOPE.sCountry('nesnd_rhine_frm').GetName] has gone over to the German nationalists."
 nesnd_rhine_status_waiting:0 "Paris still holds the Rhine firmly. We must wait for France to be caught in a war or a default, or for the parliament on the Rhine to turn."
 nesnd_rhine_success_tt:0 "We have formed Germany, or at least #v 3#! of Rhineland, North Rhine, the Ruhr and Westphalia belong entirely to us or our subjects"
 nesnd_rhine_deadline_tt:0 "The year #v 1880#! has arrived"
 nesnd_rhine_shelter_exiles:0 "Shelter the Rhenish Exiles"
 nesnd_rhine_shelter_exiles_desc:0 "Those in the Frankfurt parliament who want to join with Prussia are finding it ever harder to keep their seats. Give them somewhere to stand, and they will carry our voice back to the Rhine."
 nesnd_rhine_parliament_open_tt:0 "The parliament of [SCOPE.sCountry('nesnd_rhine_frm').GetName] is still sitting"
 nesnd_rhine_exiles_cooldown_tt:0 "At least #v 3 years#! have passed since we last took in exiles"
 nesnd_rhine_mobilize:0 "Mobilise for the Rhine"
 nesnd_rhine_mobilize_desc:0 "Call up the reserves and send munitions to the western border. Such a posture cannot be kept up for long, and it will hide nothing from anyone."
 nesnd_rhine_window_tt:0 "France has no attention to spare for the Rhine, or the parliament on the Rhine has gone over to the German nationalists"
 nesnd_rhine_mobilize_cooldown_tt:0 "At least #v 5 years#! have passed since our last mobilisation"

 nesnd_frm_parliament:0 "The Parliament at Frankfurt"
 nesnd_frm_parliament_reason:0 "In 1829, while the King of Rome governed, German nationalists on the Rhine pushed [ROOT.GetCountry.GetName] into becoming a republic. Since then French radicals fleeing Napoleon's anti-radical Terror have taken refuge here, and the discontented of the German states have come to print their newspapers. The parliament has become the arena of every faction. The pro-French party holds its place through the protection and the markets of Paris, while the nationalists hope that the German states will one day unite.\n\nWhichever way the parliament leans will decide whether the Rhine stays within the French order or becomes the object of Prussian ambition."
 nesnd_frm_status_nationalist:0 "The nationalists have the upper hand in parliament."
 nesnd_frm_status_french:0 "The pro-French party holds parliament firmly."
 nesnd_frm_status_divided:0 "The pro-French party and the nationalists are deadlocked in parliament."
 nesnd_frm_nationalist_tt:0 "Nationalist leaning reaches #v 90#!"
 nesnd_frm_deadline_tt:0 "The year #v 1900#! has arrived"
 nesnd_frm_leaning:0 "Nationalist Leaning"
 nesnd_frm_leaning_desc:0 "Nationalist leaning: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_frm_leaning_movement:0 "The German national movement is active in and out of parliament"
 nesnd_frm_leaning_france_distracted:0 "Paris has no attention to spare for the Rhine"
 nesnd_frm_leaning_zollverein:0 "Prussia or its successor leads a power bloc"
 nesnd_frm_leaning_french_protection:0 "French protection"
 nesnd_frm_request_garrison:0 "Ask Paris for More Troops"
 nesnd_frm_request_garrison_desc:0 "The nationalists grow louder in parliament. So long as French troops stand on the Rhine, parliament is the only place they can make noise."
 nesnd_frm_garrison_cooldown_tt:0 "At least #v 2 years#! have passed since our last request"

 nesnd_rhine_war_footing:0 "Mobilised for the Rhine"
 nesnd_rhine_customs_concession:0 "Customs Concessions"
 nesnd_rhine_customs_firmness:0 "Firm on Tariffs"
 nesnd_rhine_protest:0 "Protest over the Rhine"
 nesnd_rhine_press_funding:0 "Subsidised Rhenish Press"
 nesnd_frm_french_garrison:0 "French Garrison"
 nesnd_frm_commune_aftermath:0 "After the Commune"

 nesnd_rhine.1.t:0 "A Border on the Rhine"
 nesnd_rhine.1.d:0 "The troops and officials of [ROOT.GetCountry.GetName] have entered the Rhenish states. Frankfurt can no longer hold the river for Paris, and our border now runs up to France itself. The government in Paris will not forget this."
 nesnd_rhine.1.f:0 "“They shall not have it,\nthe free German Rhine.”\n- Nikolaus Becker, “Rheinlied” (1840)"
 nesnd_rhine.1.a:0 "Hold the river."
 nesnd_rhine.2.t:0 "A Missed Moment"
 nesnd_rhine.2.d:0 "The appointed years have passed. The Rhenish states remain under Frankfurt, and French protection has not wavered. The staffs of the German states still remember the promise of a common defence, but no longer believe the Rhine Question will be settled in this generation."
 nesnd_rhine.2.f:0 "“When I think of Germany in the night,\nI am robbed of my sleep.”\n- Heinrich Heine, “Night Thoughts” (1844)"
 nesnd_rhine.2.a:0 "Leave it to those who come after."
 nesnd_rhine.3.t:0 "Arrivals from the Rhine"
 nesnd_rhine.3.d:0 "Another group has crossed the border from [SCOPE.sCountry('nesnd_rhine_frm').GetName]. Among them are deputies expelled from parliament, editors whose papers were shut down, and artisans who organised petitions in the workshops of the Rhine. They ask to reside in [ROOT.GetCountry.GetName], and hope to go on publishing and writing home.\n\nIf we take them in openly, the nationalists on the Rhine will take heart, and Paris will take it as a provocation."
 nesnd_rhine.3.f:0 "“We ask for no office and no relief. Only a table and a lamp, so that we may write home to the Rhine.”\n- A Rhenish editor's application for residence"
 nesnd_rhine.3.a:0 "Let them live openly and write freely."
 nesnd_rhine.3.b:0 "Settle them in the eastern provinces and forbid them to publish."
 nesnd_rhine.11.t:0 "The Customs Conference"
 nesnd_rhine.11.d:0 "The annual conference of the customs union has begun its haggling again. Every state complains that transit duties are too heavy, and merchants from [SCOPE.sCountry('nesnd_rhine_frm').GetName] are asking for news outside the hall. If the union's tariffs are low enough, Rhenish goods will cross the border, and the deputies at Frankfurt will remember who made them money."
 nesnd_rhine.11.f:0 "“A treaty can be torn up, but nobody blocks a trade road that everyone uses.”\n- The Prussian finance minister, addressing the customs conference"
 nesnd_rhine.11.a:0 "Give up some customs revenue to win the states' goodwill."
 nesnd_rhine.11.b:0 "The tariffs stay as they are."
 nesnd_rhine.12.t:0 "A Change of Garrison on the Rhine"
 nesnd_rhine.12.d:0 "Newly arrived French battalions have taken over the fortresses of [SCOPE.sCountry('nesnd_rhine_frm').GetName]. The Paris papers call it a routine rotation, but the people of the Rhenish towns can count how many more guns there are. Our envoy asks whether we should lodge a formal enquiry with Paris."
 nesnd_rhine.12.f:0 "“Dear Fatherland, rest quietly;\nfirm and true stands the watch on the Rhine!”\n- Max Schneckenburger, “Die Wacht am Rhein” (1840)"
 nesnd_rhine.12.a:0 "Lodge an enquiry with Paris."
 nesnd_rhine.12.b:0 "No comment."
 nesnd_rhine.13.t:0 "A War of Words in Frankfurt"
 nesnd_rhine.13.d:0 "Several newspapers in [SCOPE.sCountry('nesnd_rhine_frm').GetName] are quarrelling bitterly over the future of the Rhine. The pro-French papers say that years of peace and markets were the gift of Paris. The nationalist papers reply that Rhenish taxes feed the French garrison. Someone has come to ask whether we would pay to carry the second voice further."
 nesnd_rhine.13.f:0 "“What is the German's fatherland?\n… As far as the German tongue resounds.”\n- Ernst Moritz Arndt, “Des Deutschen Vaterland” (1813)"
 nesnd_rhine.13.a:0 "Quietly fund the nationalist papers."
 nesnd_rhine.13.b:0 "That is Frankfurt's own business."
 nesnd_rhine.21.t:0 "The Deutsch-Französische Jahrbücher"
 nesnd_rhine.21.d:0 "Several exiled radical writers have founded a journal in Frankfurt, the Deutsch-Französische Jahrbücher. Its contributors include a young doctor named Karl Marx and the Russian Bakunin. The first issue criticises not only Paris but the whole existing order. The French envoy has written to ask whether we intend to let it go on appearing."
 nesnd_rhine.21.f:0 "“… the ruthless criticism of all that exists …”\n- Karl Marx, letter to Arnold Ruge (September 1843), published in the Deutsch-Französische Jahrbücher"
 nesnd_rhine.21.a:0 "This is a republic. Let it be published."
 nesnd_rhine.21.b:0 "Ban it at the request of Paris."
 nesnd_rhine.22.t:0 "An Order of Expulsion"
 nesnd_rhine.22.d:0 "The congress of the Communist League in London has published a manifesto, and its author is the same Dr Marx of the Jahrbücher. The French representative in Frankfurt demands that he be expelled, but the nationalists in parliament say that [ROOT.GetCountry.GetName] is a republic, not a province of Paris."
 nesnd_rhine.22.f:0 "“A spectre is haunting Europe – the spectre of communism.”\n- Karl Marx and Friedrich Engels, The Communist Manifesto (1848)"
 nesnd_rhine.22.a:0 "Sign the expulsion order."
 nesnd_rhine.22.b:0 "Refuse to expel him."
 nesnd_rhine.23.t:0 "Parliament Changes Colours"
 nesnd_rhine.23.d:0 "The nationalists have won a majority in parliament. Their first motion is to remove the chancellor, on the grounds that he has yielded to Paris over the future of the Rhine. The French envoy protests that this is an open affront to relations between our two countries. Berlin, meanwhile, has sent its congratulations."
 nesnd_rhine.23.f:0 "“Unity and justice and freedom\nfor the German fatherland!”\n- August Heinrich Hoffmann von Fallersleben, “Das Lied der Deutschen” (1841)"
 nesnd_rhine.23.a:0 "Remove the chancellor."
 nesnd_rhine.23.b:0 "Pass a motion of censure, nothing more."
 nesnd_rhine.24.t:0 "The Frankfurt Commune"
 nesnd_rhine.24.d:0 "After years of depression, the workers of Frankfurt have seized the town hall and proclaimed a commune. Nationalists who want union with Prussia have taken to the streets in the confusion. Paris says that, if we ask, an intervention force can cross the Rhine within days."
 nesnd_rhine.24.f:0 "“The town hall belongs to the people.”\n- Notice posted by the Commune at the town hall door"
 nesnd_rhine.24.a:0 "Ask France to send troops."
 nesnd_rhine.24.b:0 "Our own soldiers and police will put it down."

 german_unification.3.d:0 "A nobleman of Saxon birth named [SCOPE.sCharacter('bismarck_scope').GetFullName] has risen to a prominent position among the [ROOT.GetCountry.GetAdjectiveNoFormatting] [SCOPE.gsInterestGroup('junkers').GetName]. Advocating for German national unity and political pragmatism, he offers his services to the state."
 german_unification.3.f:0 "“Politics is the art of the possible.”\n- Otto von Bismarck (1867)"
