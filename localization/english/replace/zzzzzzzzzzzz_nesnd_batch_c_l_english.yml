 nesnd_egypt_fra_industry:0 "French Steel Expertise"
 nesnd_egypt_usm_industry:0 "Southern Shipbuilding Cooperation"
 nesnd_egypt_sih_industry:0 "Indian Textile Cooperation"
 nesnd_egypt_gbr_industry:0 "British Food and Opium Enterprises"
 nesnd_egypt_qe1_industry:0 "Qin Armaments Cooperation"
 nesnd_egypt_tur_industry:0 "Ottoman Mining Cooperation"
 nesnd_egypt_independent_generation:0 "A Generation of Independence"
 nesnd_egypt_unsecured_independence:0 "A Dynasty Without Guarantees"
 nesnd_egypt_local_capability:0 "Egyptian Scholars and Craftsmen"
 nesnd_egypt_1825_treaty:0 "Egyptian Settlement of 1825"
 subject_type_nesnd_egypt_protectorate:0 "Protectorate"
 subject_type_nesnd_egypt_protectorate_no_icon:0 "Protectorate"
 nesnd_egypt_protectorate:0 "Egyptian Protectorate"
 nesnd_egypt_protectorate_desc:0 "Egypt retains its government and external diplomacy under the obligations of a protectorate settlement."
 nesnd_egypt_protectorate_pact_desc:0 "Egypt accepts the protection of its investment partner."
 nesnd_egypt.1.t:0 "A Generation of Independence"
 nesnd_egypt.1.d:0 "A generation of Egyptians has lived through thirty years of independent government. Foreign merchants retain their property and the powers retain their ambitions, but the government has preserved the right to choose the country’s course. Its future factories and schools can give that right firmer foundations."
 nesnd_egypt.1.a:0 "Let the next generation inherit it."
 nesnd_egypt.2.t:0 "The Protectorate Settlement"
 nesnd_egypt.2.d:0 "The dynasty has accepted its investment partner’s protection. The support brought in for factories, armaments and schools has become a relationship that constrains national sovereignty. The government still rules Egypt, but must now find its place within a different order."
 nesnd_egypt.2.a:0 "Recognize the settlement."
 nesnd_egypt.3.t:0 "The Guarantee Fails"
 nesnd_egypt.3.d:0 "Egypt’s room for independent action has been exhausted, with no current investment partner to assume its protection. Earlier development and transactions remain, but the dynasty can no longer appeal to outside support as evidence that it can preserve independence."
 nesnd_egypt.3.a:0 "The government must answer for this."
 nesnd_egypt.4.t:0 "Knowledge Takes Root"
 nesnd_egypt.4.d:0 "Universities are training specialists, while tooling workshops and a major industry have filled their workplaces. Ambitions once written in agreements are gaining substance through Egyptian teaching and labour. Capital may move; the capabilities established here deserve continued cultivation."
 nesnd_egypt.4.a:0 "Let learning and production grow together."
 nesnd_canon_no_pending_reply:0 "No diplomatic reply is pending"
 nesnd_canon_diplomatic_cooldown:0 "Six months have passed since the last proposal"
 nesnd_canon_no_french_alliance_tt:0 "The prospective partner is not allied to France"
 nesnd_canon_request_1_desc:0 "Seek a military alliance with a German state to share the risks of continental rivalry."
 nesnd_canon_request_11_desc:0 "Offer mutual defence to a German state without committing it to an offensive alliance."
 nesnd_canon_request_2_desc:0 "Open the federation to European investment in support of industry and continental armaments."
 nesnd_canon_request_3_desc:0 "Seek French political credit for the country’s Italian programme."
 nesnd_canon_request_4_desc:0 "Protect an Italian state through a defensive agreement and establish a basis for intervention."
 nesnd_canon_request_5_desc:0 "Seek an investment partner to support the country’s economic development."
 nesnd_canon_request_sent_tt:0 "Send the proposal and await a reply. It remains open for at most 45 days; another proposal cannot be sent for six months."
 nesnd_canon_accept_request_tt:0 "Accept the undertaking set out in the proposal."
 nesnd_canon_diplomacy.1.t:0 "A Proposal from Abroad"
 nesnd_canon_diplomacy.1.d:0 "A diplomatic proposal has reached the government. The envoy awaits an answer."
 nesnd_canon_diplomacy.1.alliance:0 "[SCOPE.sCountry('canon_sender').GetName] proposes a military alliance with a five-year binding period. Its envoy links the security of the German states to the continental order dominated by France and asks us to share the risks of diplomacy and war."
 nesnd_canon_diplomacy.1.defense:0 "[SCOPE.sCountry('canon_sender').GetName] proposes a defensive pact with a five-year binding period. It seeks a practical safeguard for national independence and expects both governments to fulfil their obligations if either is attacked."
 nesnd_canon_diplomacy.1.credit:0 "[SCOPE.sCountry('canon_sender').GetName] asks France to lend political credit to its Italian programme for six years. Its supporters hope French prestige will persuade domestic and foreign interests to accept the undertaking. The commitment itself does not alter the sovereignty of the Italian states."
 nesnd_canon_diplomacy.1.investment:0 "[SCOPE.sCountry('canon_sender').GetName] offers our investors access under an agreement with a five-year binding period. It hopes to attract factories and expertise while accepting the disputes over income and influence that foreign capital can bring. The agreement grants investment rights; construction remains a business decision."
 nesnd_canon_diplomacy.1.a:0 "Accept the proposal."
 nesnd_canon_diplomacy.1.b:0 "We cannot undertake this commitment."
 nesnd_canon_diplomacy.2.t:0 "The Envoy Returns with an Agreement"
 nesnd_canon_diplomacy.2.d:0 "The other government has accepted the terms, and the agreed undertaking is now in place. Further cooperation will depend on both countries continuing to fulfil their obligations."
 nesnd_canon_diplomacy.2.a:0 "Honour our commitment."
 nesnd_canon_diplomacy.3.t:0 "Negotiations Without Agreement"
 nesnd_canon_diplomacy.3.d:0 "These negotiations have produced no effective agreement. The other government either withheld its commitment or circumstances changed before the original terms could be settled. The envoy will return with that outcome."
 nesnd_canon_diplomacy.3.a:0 "Wait for another opportunity."
 nesnd_prussian_coalition:0 "A Common Defence for Germany"
 nesnd_prussian_coalition_reason:0 "The order maintained by France and the Rhenish Confederation divides Germany into states with different patrons. To gain a stronger voice, Prussia must persuade other governments that it is both able and willing to share their risks.\n\nAlliances and defensive pacts require genuine agreement. An army and armaments industry give those commitments weight. States still bound to France or a Rhenish overlord must first secure the diplomatic freedom to choose their position."
 nesnd_prussian_coalition_status:0 "Secure alliances or defensive pacts with three distinct German states and establish the necessary army and armaments capacity."
 nesnd_prussian_subordinate_status:0 "Subordination restricts independent diplomacy. Existing development and the history of cooperation remain."
 nesnd_prussian_rhine:0 "The Contest over the Rhenish Order"
 nesnd_prussian_rhine_reason:0 "Common defence gives the German states a stronger voice before France, but does not settle Germany’s future. Alliances may dissolve, the Rhenish states may free themselves from outside control, or Prussia may pursue unification.\n\nJoint staff cooperation depends on maintaining real agreements and military capacity. The claim to Alsace must still be addressed through diplomacy and war; a claim does not redraw a border."
 nesnd_prussian_rhine_resolved_tt:0 "Prussia’s state has formed Germany, or France no longer rules German subjects and the Rhenish Confederation is independent"
 nesnd_prussian_rhine_cooperating:0 "Shared military capacity and agreements continue to support the Rhenish policy."
 nesnd_prussian_rhine_paused:0 "Current cooperation is insufficient to sustain joint staff benefits. Earlier diplomatic achievements remain recorded."
 nesnd_prussian_joint_staff:0 "German Joint Staff Cooperation"
 nesnd_prussian_rhine_settlement:0 "A New German Standing"
 nesnd_austrian_italy:0 "The Italian Balance"
 nesnd_austrian_italy_reason:0 "French-backed republican projects, the Italian dynasties and papal power make unification a question for the European order. Austria can protect independent states through defensive agreements or bear the cost of intervention in a territorial dispute.\n\nA divided Italy is not the only possible outcome. Recognizing a new unifying power also means accepting limits to Vienna’s influence. Every decision must reckon with existing treaties, armies and interests."
 nesnd_austrian_waiting_status:0 "No Italian territorial dispute is currently available for Austrian intervention."
 nesnd_austrian_dispute_status:0 "[JournalEntry.GetCountry.MakeScope.Var('nesnd_austrian_enemy').GetCountry.GetName] is pressing [JournalEntry.GetCountry.MakeScope.Var('nesnd_austrian_target').GetCountry.GetName]."
 nesnd_austrian_committed_status:0 "Austria has joined the defending side and awaits the outcome of this dispute."
 nesnd_austria_intervene:0 "Intervene to Protect the Italian State"
 nesnd_austria_intervene_desc:0 "Commit Austria’s forces and prestige to the defence of the threatened state."
 nesnd_austria_intervene_tt:0 "Join the defending side in the current Italian dispute. Victory, territorial loss and stalemate have different consequences for Austrian influence."
 nesnd_austria_acknowledge:0 "Accept This Change in the Balance"
 nesnd_austria_acknowledge_desc:0 "Decline to use Austrian arms against the current territorial or unification demand."
 nesnd_austria_acknowledge_tt:0 "Decline intervention in this dispute. Another intervention cannot be proposed for 24 months."
 nesnd_austrian_cooldown_tt:0 "Twenty-four months have passed since the previous intervention decision"
 nesnd_austrian_current_dispute_tt:0 "An Italian territorial dispute is in the diplomatic negotiation phase"
 nesnd_austrian_italian_commitment:0 "The Cost of Italian Intervention"
 nesnd_austrian_concession:0 "Conceding the Italian Balance"
 nesnd_austrian_italian_defeat:0 "Italian Intervention Repulsed"
 nesnd_austrian_italian_influence:0 "Prestige from Defending Italy"
 nesnd_usa_continental:0 "Ambitions of a Continental Protector"
 nesnd_usa_continental_reason:0 "Federal expansionists portray the United States as the protector of white America and the western territories of the $HUS$ republic as an obstacle to their continental order. Frontier settlers and land interests stand behind this argument, alongside business groups seeking European capital.\n\nInvestment agreements can open the door to capital, but the federation must still build real industry, railways and armed forces. Claims against $HUS$ concern specific land. Diplomacy may secure a concession or turn the frontier into a battlefield."
 nesnd_usa_border_selected_status:0 "Selected disputed state: [JournalEntry.GetCountry.MakeScope.Var('nesnd_usa_border_state').GetState.GetName]."
 nesnd_usa_no_border_status:0 "No eligible $HUS$ territory currently borders the federation."
 nesnd_usa_civil_war_status:0 "Civil war has suspended new frontier offensives. Economic development and existing diplomatic undertakings continue."
 nesnd_usa_war_status:0 "The frontier demand has become a diplomatic dispute. Its result depends on ownership of the requested land."
 nesnd_usa_european_treaty_tt:0 "An effective European investment agreement is in force"
 nesnd_usa_claim_cooldown_tt:0 "Six months have passed since the last frontier claim"
 nesnd_usa_border_cooldown_tt:0 "Twenty-four months have passed since the last frontier dispute ended"
 nesnd_usa_civil_war_pause_tt:0 "The federation is not fighting a civil war"
 nesnd_usa_no_pending_war_tt:0 "No frontier demand or war remains unresolved"
 nesnd_usa_next_border:0 "Consider Another Frontier State"
 nesnd_usa_next_border_desc:0 "Select a $HUS$-held frontier state for consideration."
 nesnd_usa_next_border_tt:0 "Select an eligible neighbouring state without changing ownership of any territory."
 nesnd_usa_claim_border:0 "Assert the Selected Claim"
 nesnd_usa_claim_border_desc:0 "Direct the federation’s frontier policy toward the selected land."
 nesnd_usa_claim_border_tt:0 "Gain a claim on the selected state and lose 10 relations with $HUS$. Another claim cannot be asserted for six months."
 nesnd_usa_press_west:0 "Demand the Disputed State"
 nesnd_usa_press_west_desc:0 "Present a formal demand backed by the claim, leaving the other government to concede or resist."
 nesnd_usa_press_west_tt:0 "Start a Return State diplomatic play against $HUS$ for the selected state. Truces and existing agreements still apply. The first successful acquisition of the requested land grants a five-year military benefit."
 nesnd_usa_hus_confrontation:0 "American Frontier Dispute"
 nesnd_usa_european_capital:0 "European Capital Cooperation"
 nesnd_usa_continental_army:0 "Gains of the Continental Campaign"
 nesnd_usa_frontier_claim:0 "Frontier Diplomatic Mission"
 nesnd_italy_french_credit:0 "French Political Credit"
 nesnd_small_state_capital:0 "Foreign Capital Cooperation"
 nesnd_europe_america.1.t:0 "A German Commitment"
 nesnd_europe_america.1.d:0 "Three German states now cooperate with us through real agreements. The army and armaments industry give common defence a material foundation. The states retain their own governments, and the value of their cooperation depends on continued observance."
 nesnd_europe_america.1.a:0 "Let the staffs begin their work."
 nesnd_europe_america.2.t:0 "A Changed Rhenish Order"
 nesnd_europe_america.2.d:0 "The order that constrained the German states has changed. Unification or the retreat of outside domination has established a new standing for our country. Earlier cooperation has left political and military experience, while the future order remains to be shaped."
 nesnd_europe_america.2.a:0 "A new standing brings new responsibilities."
 nesnd_europe_america.3.t:0 "Austria Commits"
 nesnd_europe_america.3.d:0 "Austria has joined the defending side in the Italian dispute. Diplomatic assurances now carry military and financial commitments, and Vienna’s prestige will share in the outcome."
 nesnd_europe_america.3.a:0 "Honour the pledge of defence."
 nesnd_europe_america.4.t:0 "The Defence of Italy Succeeds"
 nesnd_europe_america.4.d:0 "The opposing power has accepted demands in this dispute, and the protected state has preserved its position. Austria’s voice in Italian affairs has gained renewed support."
 nesnd_europe_america.4.a:0 "Let the states remember our commitment."
 nesnd_europe_america.5.t:0 "Intervention Fails to Preserve the Balance"
 nesnd_europe_america.5.d:0 "Austria’s intervention has failed to preserve the position it sought to defend. Territorial demands, subordination or the disappearance of the protected state have undone the original commitment. Vienna must face the consequences in Italy."
 nesnd_europe_america.5.a:0 "Acknowledge the setback."
 nesnd_europe_america.6.t:0 "A Dispute Without Victory"
 nesnd_europe_america.6.d:0 "The dispute has ended without a result Austria can claim as a victory. The protected state survives, but the disagreement has not been decisively settled. Both sides must consider their next course."
 nesnd_europe_america.6.a:0 "Let the troops return for now."
 nesnd_europe_america.7.t:0 "The Frontier Demand Is Fulfilled"
 nesnd_europe_america.7.d:0 "The federation has acquired the $HUS$ territory demanded in this dispute. Its frontier claim has changed the actual border, bringing new prestige to the army and the commercial interests supporting expansion."
 nesnd_europe_america.7.a:0 "Govern the land we have acquired."
 nesnd_europe_america.8.t:0 "The Frontier Dispute Closes"
 nesnd_europe_america.8.d:0 "This dispute has not delivered all the requested land to the federation. The claim remains, but declarations cannot substitute for possession. The government will close this round before deciding its next course."
 nesnd_europe_america.8.a:0 "Address the result before us."
 nesnd_europe_america.10.t:0 "A Federal Territorial Demand"
 nesnd_europe_america.10.d:0 "The United States has demanded [SCOPE.sState('nesnd_usa_disputed_state').GetName]. Federal envoys call it the restoration of a rightful border; residents, landowners and the garrison face an immediate contest over sovereignty. Our government must decide its response through the diplomatic play now before it."
 nesnd_europe_america.10.a:0 "The frontier is not unclaimed land."
