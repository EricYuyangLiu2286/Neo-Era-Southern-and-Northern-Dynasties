 nesnd_egypt.3.unworkable:0 "An eligible investment partner remains, but the protection relationship could not be established. The government must acknowledge the failure of the settlement. The dynasty must continue to govern Egypt without using that unfulfilled guarantee to justify its independence policy."
 nesnd_egypt.6.t:0 "Independence Ends Elsewhere"
 nesnd_egypt.6.d:0 "Egypt has become subject to another overlord. The former investment arrangement has lost its basis, bringing this test of independence to an end. The government’s future position must now be determined by its actual subject relationship."
 nesnd_egypt.6.a:0 "Face the new circumstances."
