l_english:
 nesnd_egypt_independence:0 "The Price of Independence"
 nesnd_egypt_independence_reason:0 "The settlement of 1825 recognized Egypt’s release from Ottoman rule. Six powers guaranteed its independence in return for investment rights along the Nile. The dynasty gained breathing room, while its factories, schools and army acquired new creditors.\n\nForeign machinery and teachers can strengthen Egypt; foreign control of its economy can also erode its freedom of action. The government may choose a partner or withdraw its political commitment. Whether Egypt can still determine its own future after thirty years will depend on those choices and the economic order they leave behind."
 nesnd_egypt_with_investor_status:0 "Current partner: [JournalEntry.GetCountry.MakeScope.Var('nesnd_egypt_investor').GetCountry.GetName]. Foreign share of the economy: [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]."
 nesnd_egypt_without_investor_status:0 "No single power holds Egypt’s investment commitment. Foreign share of the economy: [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]."
 nesnd_egypt_investment_accounts:0 "Schools and Workshops of the Nile"
 nesnd_egypt_investment_accounts_reason:0 "Machinery can be purchased more quickly than a country can train the people who build, repair and operate it. Universities must educate local specialists, tooling workshops must supply equipment, and new industries must attract workers.\n\nThe government seeks an enduring foundation for Egyptian power. Whatever the source of its capital, an institution must teach and a factory must employ people before a promise becomes a national capability."
 nesnd_egypt_independence_bar:0 "Independence"
 nesnd_egypt_independence_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100"
 nesnd_egypt_sponsor_drain:0 "Commitment to the investment partner"
 nesnd_egypt_foreign_drain:0 "Foreign economic ownership above 25%"
 nesnd_egypt_generation_passed:0 "The independence settlement has endured for thirty years"
 nesnd_egypt_still_independent:0 "Independence remains above 0"
 nesnd_egypt_dependence_reached:0 "Independence has fallen to 0"
 nesnd_egypt_dependence_result:0 "When Independence is exhausted, Egypt accepts a qualified investment partner’s protection. If no partner can undertake it, or the relationship cannot be established, the dynasty bears the political cost of the failed guarantee."
 nesnd_egypt_investor_desc:0 "Choose a principal investment partner from the surviving, independent signatories able to undertake Egypt’s protection, seeking lasting support through construction, education and industry. The 1825 agreement still protects India’s historical investment rights; while subject to the Southern Court, it cannot lead Egypt’s new investment arrangement."
 nesnd_egypt_choose_cost:0 "A valid investment commitment costs 1 Independence each month. Changing partners does not reset Independence or the thirty-year term."
 nesnd_egypt_investor_none:0 "Choose no investment partner"
 nesnd_egypt_investor_none_desc:0 "Egypt will bear political responsibility for its own development."
 nesnd_egypt_none_effect:0 "Withdraw the investment commitment and its benefits. Existing foreign ownership still affects Independence."
