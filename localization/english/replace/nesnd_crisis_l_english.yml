 nesnd_huguang_preparations:0 "After Xiangyang"
 nesnd_huguang_preparations_reason:0 "When Zhu Banbo reorganised Huguang, he repaired the fortifications of Xiangyang, brought young officers into teaching, and exchanged military ironware for grain from Sichuan. Wounded and retired soldiers entered supply services and farming garrisons. Republicans who remained in Xiangyang helped the governor-general reform Yuelu Academy. Over twenty years, the army, land revenues and academies became closely bound to his government, with Chen Dongyang supporting it at court. Xiangyang’s troops came to be regarded as the leaders of the New Western Administration, an indispensable pillar of the Southern Ming federation.\n\nThe Zheng family once supported Zhu Banbo vigorously. Now it repeatedly accuses Xiangyang of withholding taxes and concealing households. Southern officers friendly to Huguang, including Shi Yuanfu and Lin Hanhan, have been posted away, while our republican allies at court face exclusion. We must prepare for the worst: reassess the soldiers and farming households of the garrisons, restore grain shipments from upriver, and win over the academy students who will soon enter political life."
 nesnd_hna_academy_button:0 "Reorganise the United Academies"
 nesnd_hna_academy_button_desc:0 "Yuelu Academy in Xiangyang is the intellectual centre of Huguang’s officials and aspiring politicians. Its students study and debate public affairs before taking the examinations of the Assembly of Rites to enter Southern political life. Loyalty to the Southern realm has guided their education since the academy’s foundation. With the Southern Administration pressing us at every turn, its teachers must distinguish the Zheng rulers who dominate the government from the Zhu imperial house. Students won over in the lecture hall today may stand with us as provincial delegates tomorrow."
 nesnd_hna_supply_button:0 "The Secret Jing–Shu Agreement"
 nesnd_hna_supply_button_desc:0 "Huguang’s workshops and Sichuan’s grain boats fed Xiangyang when we fought the Mu forces. As the divide between the Southern and Western Administrations deepens, we should renew our contacts in Sichuan, coordinate arms and grain supplies between the two provinces, and reopen the wartime depots along the river. If the ministers who threaten us make their move, Xiangyang must have food and weapons."
 nesnd_hna_veterans_button:0 "Call the Veterans’ Assemblies to Readiness"
 nesnd_hna_veterans_button_desc:0 "Under Zhu Banbo, Chu soldiers enjoyed better conditions than their Southern allies. He also borrowed northern practices of fixed service terms and veterans’ assemblies, sending trained former soldiers to lead farming settlers and rebuild communities exhausted by war. These assemblies are now well established. Their veterans know both the army and the countryside; calling them together to organise food, relief and supplies will give wartime mobilisation a firm local foundation."
 nesnd_crisis.20.a:0 "Put our own country in order first."
 nesnd_crisis.20.b:0 "Provide supplies to Huguang."
 nesnd_crisis.20.c:0 "Contact the Xiangfan garrison and prepare to march south."
 nesnd_crisis.20.c_subject_tt:0 "#r As a subject, we cannot send troops south on our own authority.#!"
 nesnd_crisis.20.c_no_war_tt:0 "If civil war does not break out in the south, our preparations will be in vain."
 nesnd_crisis.20.t:0 "A Pretender Takes the Southern Throne"
 nesnd_crisis.20.d:0 "News that the despised Wu have cast off Ming and claimed the throne has brought celebration among ministers north of the river. Some recall the Mu sovereign’s great [Glossary('glossary_nesnd_southern_campaign','southern expedition')]. If the pretenders are consumed by fighting the Western provinces, a new campaign might reunify the realm in a single stroke.\n\nFrontier commanders have requested funds and contacted “men of understanding” in Huguang. Yet our own realm is far from settled. Domestic government still requires troops and money; unfinished land reform would make a southern expedition more burdensome still. What could the empire gain by entering this struggle now?"
 nesnd_crisis.40.a:0 "Judge cases individually and retain local talent."
 nesnd_crisis.40.b:0 "Purge the old parties and rebuild military rule."
 nesnd_crisis.40.t:0 "Foundations of the New Dynasty"
 nesnd_crisis.40.d:0 "With the fighting ended, local civil and military authority is passing under Wu rule. The new dynasty must now govern: production and trade disrupted by war must recover, people must earn their living, and officials and scholars who opposed Zheng will not disappear with defeat.\n\nHangzhou’s accumulated military and fiscal strength can pay for reconstruction. We may judge opponents individually and retain experienced local officials, or use victory to purge the old parties and make the army the foundation of the new order. These decisions will show the realm what government in the Zheng family’s own name means."
 nesnd_early_accession:0 "Press for Early Accession"
 nesnd_early_accession_desc:0 "The Southern Administration commands the realm’s troops and revenues. Rally ministers supporting Zheng, petition the Ming court for abdication, and demand a response from the provinces and overseas states."
 nesnd_huguang_preparations_status:0 "Complete the academy, grain supply and veterans’ assembly preparations, worth #v 30#! each. Reaching #v 90#! grants local defence benefits for #v 10 years#!."
 nesnd_crisis.30.f:0 "“The garrison says the land belongs to the army. The county says it belongs to the state. We ask only this: what did our payment last year redeem?”"
 nesnd_crisis.33.f:0 "“When we marched, they said we were fighting for land to farm and a hearing for every grievance. Back in our own villages, we have to ask for it all again.”"
 nesnd_crisis.31.f:0 "“This province pays the troops and this province feeds them. If the ministers cannot send our wages, they must let us raise the money ourselves.”"
 nesnd_crisis.32.f:0 "“Lower the rents, let the tenants travel, and preserve the old holdings. Perhaps the garrisons will then end their resistance.”"
 nesnd_crisis.20.f:0 "“Some men who crossed the river in the former campaign remain in service. If Your Majesty considers another march south, let us first assess the grain and pay.”"
 nesnd_crisis.40.f:0 "“The provinces need work and commerce restored, so that soldiers and civilians can support themselves.”"
