l_english:
 nesnd_crisis.30.a:0 "Review the deeds and suspend the disputed cases."
 nesnd_crisis.30.b:0 "Refer the matter to the local consultative bureau."
 nesnd_crisis.30.c:0 "Order the garrisons to surrender their records and punish those who defy the law."
 nesnd_crisis.30.t:0 "The Survey Dispute"
 nesnd_crisis.30.d:0 "In some districts, after the land commissioners of [ROOT.GetCountry.GetName] went into the countryside with the new law, the military estates still collected rent by the old rules. Farmers who had already paid their redemption price were told by their “masters” that the fields they worked belonged to the military rolls, and that the rent must not be resisted. Several schoolteachers who had written petitions for the farmers were arrested for shielding concealed property.\n\nThe deeds submitted by the counties contradict the garrison registers. The county and provincial authorities want to take over the review, while the commissioners ask the court to send troops to seize the hidden records. As the matter drags on, the farmers who had hoped for land have gathered in their county towns, waiting for an answer from the new government that promised to free them."
 nesnd_crisis.33.a:0 "Dismiss the officials, provide compensation and reopen the case."
 nesnd_crisis.33.b:0 "Punish these unlawful assemblies!"
 nesnd_crisis.33.t:0 "Old Banners in the Hills"
 nesnd_crisis.33.d:0 "The arrests that followed the land surveys have brought Shanxi's veterans, local scholars and dispossessed farmers together. Republicans are using village schools and old army ties to pass documents around, calling on every county to elect delegates and put on trial the officers who seized farmland.\n\nHowever, as garrison after garrison refused to hand over the ringleaders, the delegates chosen in the agitation turned to demanding the removal of the chief land commissioner, a fresh review of titles, and compensation for the farmers who were robbed."
 nesnd_crisis.31.a:0 "Settle provincial powers and preserve their allegiance."
 nesnd_crisis.31.b:0 "The armies now answer to their own masters."
 nesnd_crisis.31.t:0 "Military Power Slips Away"
 nesnd_crisis.31.d:0 "Field commands everywhere have begun withholding the taxes that should go to the centre. Officers have taken over customs posts, granaries and local offices in the name of feeding their troops, and the land commissioners can only work where the garrisons allow. Unpaid units are demanding estates from their commanders one after another, and the old military blocs have gained wider power over the provinces.\n\nThe redeployment orders issued by [ROOT.GetCountry.GetName] keep coming back unanswered. The court must recognise the powers already held by the commands and the governors if it is to keep the provinces loyal to the centre; if it goes on losing control of army pay and officials, the provinces will set up governments of their own."
 nesnd_crisis.32.a:0 "Issue the decree and bring the land revolution to a close."
 nesnd_crisis.32.b:0 "The reform must continue."
 nesnd_crisis.32.t:0 "The Old Disaster of Anshi"
 nesnd_crisis.32.d:0 "Memorials from the provinces asking for land reform to stop have piled up at court, though they are no more than compromise documents that humiliate the court's ministers and even the Son of Heaven himself. Yet the rulers of [ROOT.GetCountry.GetName] have no choice but to bow to hard realities. Under the proposed compromise, land confirmed by the so-called “new deeds” would remain with the military households, who need only promise their tenants some reduction in rent and not prevent them from leaving to find work elsewhere. Estates, military land and lineage property not yet dealt with would be held by the local authorities as so-called “state public land”, to be let to tenants recruited by the government.\n\nIt would be a humiliation for the court. But if it issues such a decree, the court of [ROOT.GetCountry.GetName] can free the provinces from the endless cycle of surveys, petitions and riots. The local powers organised around the old land rights would also take part once again in collecting taxes and running the villages."
