 nesnd_huguang_preparations:0 "After Xiangyang"
 nesnd_huguang_preparations_reason:0 "When Zhu Banbo put Huguang in order, he repaired the fortifications of Xiangyang, gathered young officers to teach, and traded military ironware to Sichuan for grain. Wounded and discharged soldiers were assigned to supply services and farming garrisons, and the republicans who stayed in Xiangyang helped the governor-general's office reform Yuelu Academy. In twenty years, the governor-general's army, land revenue and academies grew into one body, and Chen Dongyang backed them at court. Men of the time came to see Xiangyang's troops as the head of the “New Western Administration”, and a pillar without which the Southern Ming federation could not have been founded.\n\nYet the Zheng family, once Zhu Banbo's strongest supporter, now repeatedly accuses Xiangyang at court of withholding taxes and hiding households from the registers. They have also posted away Shi Yuanfu, Lin Hanhan and other senior southern officers close to Huguang, along with many republican officials friendly to us. Every sign says we must prepare for the worst: reassess the soldiers and farming hands of the garrisons, restore grain shipments from upriver, and stir up opinion in the academy to win over the scholars. We must be ready for anything."
 nesnd_hna_academy_button:0 "Reorganise the United Academies"
 nesnd_hna_academy_button_desc:0 "Yuelu Academy in Xiangyang is the spiritual heart of Huguang's officials and its scholars of public affairs. Yet from its founding it has taught a “patriotic” loyalty to the Southern realm. Now, with the Southern Administration striking at us again and again, we must put its staff in order and have Yuelu's teachers, under our direction, gradually teach the difference between the Wa-Wu scum who seize the government and the Zhu Ming imperial house, uniting our own thinking against whatever may come."
 nesnd_hna_supply_button:0 "The Secret Jing–Shu Agreement"
 nesnd_hna_supply_button_desc:0 "In the recent war against the Mu bandits, Huguang's workshops and Sichuan's grain boats together fed the soldiers and people of Xiangyang. We should reorganise the arms production and grain shipments of the two provinces according to need, and reopen the wartime depots along the river, in case the treacherous ministers strike."
 nesnd_hna_veterans_button:0 "Call the Veterans’ Assemblies to Readiness"
 nesnd_hna_veterans_button_desc:0 "Since Zhu Banbo's day, Chu soldiers have been treated far better than their allies in the Southern army. This included fixed terms of service and veterans' assemblies learned from the North, meant to send disciplined, trained veterans to lead farming settlers into the villages and so quickly renew and improve the life of Huguang, long worn down by war. Today the assemblies are well established, and their veterans know both the barracks and the villages. Besides answering the call to mobilise the people in wartime, the assemblies can help us prepare the people economically and in their daily lives."
 nesnd_crisis.10.a:0 "With law as its foundation, the state can stand!"
 nesnd_crisis.10.t:0 "The Memorial on Constitutional Administration in the Provinces and Garrisons Is Adopted"
 nesnd_crisis.10.d:0 "The provincial delegates, the members of Southern Ming's parliament, have declared their support for the new laws by a majority in the Great Rites Assembly. The reforms of appointments, land tax and military funding, centred on the central government, have at last been gathered into a widely accepted set of provisions and written into Southern Ming's constitutional “Rites”. Under the new laws, the Ming court, or rather the Ming court as the present regime knows it, has finally drawn the line between the centre and the provinces on the local separatism that has persisted since the Rebellion of the Prince of Sai in the early 15th century of the Western calendar.\n\nAdministrative unity, of course, had been achieved when Chen Dongyang restored the provincial administrative commissions. But that policy never ordered the abolition of the enfeoffed lords, nor fixed the boundary between central and local power. It was only that the Southern and Western Administrations, facing the northern invasion, had stood together as never before, so that no one objected to Nanjing (in truth, Hangzhou) exercising military and civil authority, appointing and dismissing officials, and hunting down those who would not obey. Any who did object were long since ground to dust beneath the iron hooves and iron guns of the two Administrations. Now all these efforts are carved into stone at last, not to be changed for ten thousand generations."
 nesnd_crisis.11.a:0 "Publish the findings and proceed by the usual procedure."
 nesnd_crisis.11.b:0 "Investigate in secret, and spare no one!"
 nesnd_crisis.11.t:0 "Outside the Chief Minister’s Residence"
 nesnd_crisis.11.d:0 "While checking the chief minister's escort, his guards found a forged order changing the watch. The courier and his accomplices were soon seized by the Embroidered Uniform Guard and the Court of Judicial Review, and held separately according to their rank and part in the plot. The chief minister himself was rushed to a safe place, and returned home only once the culprits were in custody.\n\nThe investigation then spun out of control. It reached officials in key posts handling military procurement and shipping, and these suspects in turn had close dealings with great gentry families of the provinces, and even with the confined lords of the old fiefs. They seemed to hold vital information on several smuggling cases that the Ministry of Justice and the Court of Judicial Review had been quietly examining at the chief minister's request. Yet the Court of Judicial Review and the Embroidered Uniform Guard now disagree on the next step. The cabinet sees a trial by the Court, with the facts laid open to the judicial officers, as a way to begin a large internal inquiry in the open. The Guard insists the matter be kept quiet and investigated in secret, so as not to startle the snake, to lull the traitors and keep the affair from spreading."
 nesnd_crisis.20.a:0 "Put our own country in order first."
 nesnd_crisis.20.b:0 "Provide supplies to Huguang."
 nesnd_crisis.20.c:0 "Contact the Xiangfan garrison and prepare to march south."
 nesnd_crisis.20.t:0 "A Pretender Takes the Southern Throne"
 nesnd_crisis.20.d:0 "When word came that the Wa-Wu had betrayed Ming and proclaimed their own reign, the ministers north of the river congratulated one another. Some even recalled how the Mu Son of Heaven once rode south in his imperial carriage. After all, the false Wu and their Zheng dogs are too busy fighting the Western provinces to look north. A southern campaign to reunify the realm might succeed at a single stroke.\n\nAt the urging of interested parties, frontier commanders have asked for army funds and sent men to contact the “men of understanding” in Huguang. But our own dynasty is hardly in an age of great peace and prosperity. If land reform is still under way at home, who can say whether joining the Southern melee now will bring fortune or disaster?"
 nesnd_crisis.21.a:0 "Protect commerce and maintain relations."
 nesnd_crisis.21.b:0 "Receive those fleeing the South."
 nesnd_crisis.21.c:0 "Supply the provinces opposing Wu."
 nesnd_crisis.21.t:0 "Visitors from the South"
 nesnd_crisis.21.d:0 "Zheng fleets, trading houses and dependencies have carried news of the Southern war abroad. Merchants fear the seizure of their cargoes, while envoys from the rival sides seek recognition, military supplies and loans.\n\n[ROOT.GetCountry.GetName] has its own calculations in all this. Keeping trade open means dealing with whoever actually holds the ports and sea lanes; sheltering exiles or supplying the anti-Wu forces would bind the South's old and new powers more tightly to us."
 nesnd_crisis.40.a:0 "Judge cases individually and retain local talent."
 nesnd_crisis.40.b:0 "Purge the old parties and rebuild military rule."
 nesnd_crisis.40.t:0 "Foundations of the New Dynasty"
 nesnd_crisis.40.d:0 "The fighting is over, and local civil and military authority is passing to Wu one province after another. The question now is how to govern: production and trade broken by war must recover, the people of every province must go on living, and the officials and scholars who opposed the Zheng will not vanish with their defeat.\n\nThe army and treasury Hangzhou has built up over the years can pay for the rebuilding. From the first few decrees, the realm will learn what kind of court the Zheng mean to run in their own name."
 nesnd_crisis.41.a:0 "Reorganise government and the armed forces."
 nesnd_crisis.41.b:0 "Reward the armies according to custom."
 nesnd_crisis.41.t:0 "Back Across the Strait"
 nesnd_crisis.41.d:0 "The troops are returning from abroad. Local lords demand the rewards promised when they joined the campaign, merchants want shipping restored, and the government must arrange its garrisons and revenues.\n\nThe mainland war has handed [ROOT.GetCountry.GetName] a chance to put its army and government in order."
 nesnd_early_accession:0 "Press for Early Accession"
 nesnd_early_accession_desc:0 "The Southern Administration commands the realm’s troops and revenues. Rally ministers supporting Zheng, petition the Ming court for abdication, and demand a response from the provinces and overseas states."
 nesnd_huguang_preparations_status:0 "Complete the academy, grain supply and veterans’ assembly preparations, worth #v 30#! each. Reaching #v 90#! grants local defence benefits for #v 10 years#!."
 nesnd_crisis.11.f:0 "“Hold the prisoners separately and secure all correspondence. Tomorrow, the cabinet will return to the case.”"
 nesnd_crisis.30.f:0 "“The garrison says the land belongs to the army. The county says it belongs to the state. We ask only this: what did our payment last year redeem?”"
 nesnd_crisis.33.f:0 "“When we marched, they said we were fighting for land to farm and a hearing for every grievance. Back in our own villages, we have to ask for it all again.”"
 nesnd_crisis.31.f:0 "“This province pays the troops and this province feeds them. If the ministers cannot send our wages, they must let us raise the money ourselves.”"
 nesnd_crisis.32.f:0 "“Lower the rents, let the tenants travel, and preserve the old holdings. Perhaps the garrisons will then end their resistance.”"
 nesnd_crisis.10.f:0 "“Let every province and garrison act according to the constitution.”"
 nesnd_crisis.20.f:0 "“Some men who crossed the river in the former campaign remain in service. If Your Majesty considers another march south, let us first assess the grain and pay.”"
 nesnd_crisis.21.f:0 "“The cargo is loaded. We await only your answer: will the old trading papers still be honoured?”"
 nesnd_crisis.40.f:0 "“The provinces need work and commerce restored, so that soldiers and civilians can support themselves.”"
 nesnd_crisis.41.f:0 "“Every house still holds its promises from the expedition. Now that we have returned, we must settle them together.”"
