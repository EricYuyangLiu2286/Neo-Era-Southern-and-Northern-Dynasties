l_english:
 nesnd_india_diplomacy.1.d6_former:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to join it, offering a settlement allowance of @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and one princely pension for our prince. [SCOPE.sCountry('india_partner').GetOverlord.GetName] has given its consent as our [concept_overlord]. If we accept, we leave [SCOPE.sCountry('india_partner').GetOverlord.GetName], and [SCOPE.sCountry('india_sender').GetName] pays [SCOPE.sCountry('india_partner').GetOverlord.GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] in compensation. If we decline, we remain a [concept_subject] of [SCOPE.sCountry('india_partner').GetOverlord.GetName]."
 nesnd_india_diplomacy.1.d6_own:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to merge into it, offering a settlement allowance of @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and one princely pension for our prince. We are already a [concept_subject] of [SCOPE.sCountry('india_sender').GetName]; once merged, our lands and people come directly under its government. If we decline, things stay as they are."
 nesnd_india_diplomacy.1.d8_merge:0 "[SCOPE.sCountry('india_sender').GetName] asks to be merged into [ROOT.GetCountry.GetName]. Its lands and people would come under our government. We would pay a settlement allowance of @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and take on one princely pension for its prince."
 nesnd_india_diplomacy.1.d8_dominion:0 "[SCOPE.sCountry('india_sender').GetName] asks to become a [concept_dominion] of [ROOT.GetCountry.GetName], keeping its own government, laws, [concept_treasury] and army. We would pay [SCOPE.sCountry('india_sender').GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and take on one princely pension for its prince."
 nesnd_india_diplomacy.1.merge:0 "Merge into [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_diplomacy.1.dominion:0 "Become a dominion of [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_union_reply_merge_tt:0 "We merge into [SCOPE.sCountry('india_sender').GetName], and our states, people and army pass to it. [SCOPE.sCountry('india_sender').GetName] pays a settlement allowance of @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and records one princely pension for our prince."
 nesnd_india_union_reply_dominion_tt:0 "We become a [concept_dominion] of [SCOPE.sCountry('india_sender').GetName], keeping our own states, government, laws, [concept_treasury] and army. [SCOPE.sCountry('india_sender').GetName] pays us @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and records one princely pension for our prince."
 nesnd_india_union_reply_former_tt:0 "We first leave [SCOPE.sCountry('india_partner').GetOverlord.GetName]. [SCOPE.sCountry('india_sender').GetName] also pays [SCOPE.sCountry('india_partner').GetOverlord.GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] in compensation."
 nesnd_india_union_reply_decline_tt:0 "The matter ends here. Treaties, funded projects and other cooperation between the two countries stay as they are, and both sides are informed."
 nesnd_india_union_reply_take_merge_tt:0 "[SCOPE.sCountry('india_sender').GetName] merges into our country, and its states, people and army pass to us."
 nesnd_india_union_reply_take_dominion_tt:0 "[SCOPE.sCountry('india_sender').GetName] becomes our [concept_dominion], keeping its own states, government, laws, [concept_treasury] and army."
 nesnd_india_union_reply_take_pay_tt:0 "We pay a settlement allowance of @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and record one princely pension for the prince of [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_union_reply_take_compensation_tt:0 "[SCOPE.sCountry('india_sender').GetName] first leaves [SCOPE.sCountry('india_sender').GetOverlord.GetName], and we also pay [SCOPE.sCountry('india_sender').GetOverlord.GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] in compensation."
 nesnd_india_union_host_free_tt:0 "Is not a [concept_subject] of any country"
 nesnd_india_union_host_exists_tt:0 "There is a country we could join"
 nesnd_india_union_no_project_tt:0 "We have no local project or other matter under way"
 nesnd_india_union_not_own_subject_tt:0 "We are not already their [concept_subject]"
 nesnd_india_union_ask_not_own_subject_tt:0 "We are not already a [concept_subject] of [SCOPE.sCountry('india_union_host').GetName]"
 nesnd_india_union_can_pay_tt:0 "The [concept_treasury] of the receiving country can pay the settlement allowance and any compensation due"
 nesnd_india_union_ask_button:0 "Ask to Join [SCOPE.sCountry('nesnd_label_india_empire').GetName]"
 nesnd_india_union_ask_button_desc:0 "Ask [SCOPE.sCountry('nesnd_label_india_empire').GetName] to take us in. We choose how we would join: by merging, or as its [concept_dominion]."
 nesnd_india_union_ask_button_tt:0 "Choose how we would join."
 nesnd_india_union_status_ask_consent:0 "We have asked to join [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], and await the consent of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_await').GetCountry.GetName] as our [concept_overlord]."
 nesnd_india_union_status_ask_sent:0 "We have asked to join [ROOT.GetCountry.MakeScope.Var('nesnd_india_request_partner').GetCountry.GetName], and await its answer."
 nesnd_india_union_status_invite_consent:0 "We have invited [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to join us, and await the consent of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_await').GetCountry.GetName] as its [concept_overlord]."
 nesnd_india_union_status_invite_sent:0 "We have invited [ROOT.GetCountry.MakeScope.Var('nesnd_india_request_partner').GetCountry.GetName] to join us, and await its answer."
 nesnd_india_union_status_consent_invite:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] invites our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to join it, offering [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] a settlement allowance of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] accepts, it leaves us, merging into [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] or becoming its [concept_dominion]. Only after our consent does the invitation reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may still decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] accepts, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] in compensation."
 nesnd_india_union_status_consent_ask_merge:0 "Our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to be merged into [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which would take it away from us. Only after our consent does the request reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may agree or decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] agrees, it pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] in compensation."
 nesnd_india_union_status_consent_ask_dominion:0 "Our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to become a [concept_dominion] of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which would take it away from us. Only after our consent does the request reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may agree or decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] agrees, it pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] in compensation."
 nesnd_india_unified_status:0 "We and our [Concept('concept_subject', '$concept_subjects|q$')] hold #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#! of the populated [Concept('concept_state', '$concept_states|q$')] of $region_north_india$ and $region_south_india$."
 nesnd_india_unified_share_tt:0 "We and our [Concept('concept_subject', '$concept_subjects|q$')] hold at least #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_unified_share_needed')|0]%#! of the populated [Concept('concept_state', '$concept_states|q$')] of $region_north_india$ and $region_south_india$ (now #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!)"
 nesnd_india_union.1.t:0 "The New Standing of [SCOPE.sCountry('india_union_prince').GetName]"
 nesnd_india_union.1.d_host_merge:0 "[SCOPE.sCountry('india_union_prince').GetName] has merged into our country. We have paid a settlement allowance of @money![SCOPE.GetValue('india_union_price')|0] and taken on one princely pension for its prince. Its lands and people are now under our government."
 nesnd_india_union.1.d_host_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName] has become our [concept_dominion], keeping its own government, laws, [concept_treasury] and army. We have paid it @money![SCOPE.GetValue('india_union_price')|0] and taken on one princely pension for its prince."
 nesnd_india_union.1.d_prince_dominion:0 "[SCOPE.sCountry('india_union_empire').GetName] has agreed to our request, and we are now a [concept_dominion] of [SCOPE.sCountry('india_union_empire').GetName]. We keep our own government, laws, [concept_treasury] and army. [SCOPE.sCountry('india_union_empire').GetName] has paid us @money![SCOPE.GetValue('india_union_price')|0] and taken on one princely pension for our prince."
 nesnd_india_union.1.d_former_merge:0 "[SCOPE.sCountry('india_union_prince').GetName] has left us and merged into [SCOPE.sCountry('india_union_empire').GetName]. We had given our consent, and [SCOPE.sCountry('india_union_empire').GetName] has paid us @money![SCOPE.GetValue('india_union_price')|0] in compensation."
 nesnd_india_union.1.d_former_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName] has left us and become a [concept_dominion] of [SCOPE.sCountry('india_union_empire').GetName]. We had given our consent, and [SCOPE.sCountry('india_union_empire').GetName] has paid us @money![SCOPE.GetValue('india_union_price')|0] in compensation."
 nesnd_india_union.1.f:0 "“The princely pension shall be paid from the treasury of [SCOPE.sCountry('india_union_empire').GetName] for ten years.”\n—Instrument of accession between [SCOPE.sCountry('india_union_empire').GetName] and [SCOPE.sCountry('india_union_prince').GetName]"
 nesnd_india_union_merged_tt:0 "The states, people and army of [SCOPE.sCountry('india_union_prince').GetName] now belong to [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union_dominion_tt:0 "[SCOPE.sCountry('india_union_prince').GetName] is a [concept_dominion] of [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union_compensated_tt:0 "We receive @money![SCOPE.GetValue('india_union_price')|0] in compensation."
 nesnd_india_union_paid_former_tt:0 "We have also paid [SCOPE.sCountry('india_union_former').GetName] @money![SCOPE.GetValue('india_union_price')|0] in compensation."
 nesnd_india_union.2.t:0 "Declined"
 nesnd_india_union.2.d_we_decline_invite:0 "We have declined the invitation of [SCOPE.sCountry('india_sender').GetName], and things stay as they are. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.d_we_decline_request:0 "We have declined the request of [SCOPE.sCountry('india_sender').GetName] to join us. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.d_invite_declined:0 "[SCOPE.sCountry('india_union_decliner').GetName] has declined our invitation. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.d_request_declined:0 "[SCOPE.sCountry('india_union_decliner').GetName] has declined our request to join it. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.f:0 "“The Government thanks you for your goodwill, but cannot accept this arrangement.”\n—Note of reply from the Government of [SCOPE.sCountry('india_union_decliner').GetName]"
 nesnd_india_union_unchanged_tt:0 "Treaties, funded projects and other cooperation between the two countries stay as they are."
 nesnd_india_union.3.t:0 "Consent Withheld"
 nesnd_india_union.3.d_invite_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has refused, as [concept_overlord], to let [SCOPE.sCountry('india_matter_to').GetName] accept our invitation. The invitation never reached [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_union.3.d_invite_silent:0 "[SCOPE.sCountry('india_matter_permit').GetName] did not answer within the time allowed, and the invitation never reached [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_union.3.d_invite_void:0 "Circumstances have changed, and this invitation to [SCOPE.sCountry('india_matter_to').GetName] no longer stands. Should we still wish to invite it, we must do so afresh."
 nesnd_india_union.3.d_ask_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has refused, as our [concept_overlord], to let us join [SCOPE.sCountry('india_matter_to').GetName]. The request never reached [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_union.3.d_ask_silent:0 "[SCOPE.sCountry('india_matter_permit').GetName] did not answer within the time allowed, and our request to join [SCOPE.sCountry('india_matter_to').GetName] was never sent."
 nesnd_india_union.3.d_ask_void:0 "Circumstances have changed, and our request to join [SCOPE.sCountry('india_matter_to').GetName] no longer stands."
 nesnd_india_union.3.f:0 "“A subject may not leave its overlord without the overlord's consent.”\n—Memorandum of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_union_no_consent_tt:0 "No money has been paid, and no subject relation has changed."
 nesnd_india_union_wait_tt:0 "We may not open another negotiation for six months."
 nesnd_india_union.4.t:0 "Asking to Join"
 nesnd_india_union.4.d:0 "[ROOT.GetCountry.GetName] may ask to join [SCOPE.sCountry('india_union_host').GetName]. Merged into it, our lands and people would come under the government of [SCOPE.sCountry('india_union_host').GetName]. As a [concept_dominion] of [SCOPE.sCountry('india_union_host').GetName], we would keep our own government, laws, [concept_treasury] and army. If [SCOPE.sCountry('india_union_host').GetName] agrees, it pays @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] either way, and takes on one princely pension for our prince."
 nesnd_india_union.4.f:0 "“Our state wishes to join yours, and asks your Government to set out its terms.”\n—Letter of [ROOT.GetCountry.GetName] to [SCOPE.sCountry('india_union_host').GetName]"
 nesnd_india_union.4.merge:0 "Ask to merge into [SCOPE.sCountry('india_union_host').GetName]."
 nesnd_india_union.4.dominion:0 "Ask to become a dominion of [SCOPE.sCountry('india_union_host').GetName]."
 nesnd_india_union.4.later:0 "Not now."
 nesnd_india_union_ask_merge_tt:0 "We ask [SCOPE.sCountry('india_union_host').GetName] to merge us into it. If [SCOPE.sCountry('india_union_host').GetName] agrees, it pays a settlement allowance of @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] and records one princely pension for our prince, and our states, people and army pass to [SCOPE.sCountry('india_union_host').GetName]."
 nesnd_india_union_ask_dominion_tt:0 "We ask [SCOPE.sCountry('india_union_host').GetName] to take us in as its [concept_dominion]. If [SCOPE.sCountry('india_union_host').GetName] agrees, it pays us @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] and records one princely pension for our prince, and we keep our own states, government, laws, [concept_treasury] and army."
 nesnd_india_union_ask_consent_tt:0 "We are a [concept_subject] of [ROOT.GetCountry.GetOverlord.GetName], whose consent must come first; only then is the request passed to [SCOPE.sCountry('india_union_host').GetName]. If [SCOPE.sCountry('india_union_host').GetName] agrees, it also pays [ROOT.GetCountry.GetOverlord.GetName] @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] in compensation."
 nesnd_india_union_ask_wait_tt:0 "Until an answer comes, we cannot open another negotiation."
 nesnd_india_union_ask_later_tt:0 "We make no request now, and no negotiation is used up."
