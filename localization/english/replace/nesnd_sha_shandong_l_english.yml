l_english:
 nesnd_sha_crossing:0 "Across the Sea"
 nesnd_sha_crossing_reason:0 "After the fall of Qi, some of the republicans who had fought for Shandong crossed the sea. Others stayed in Dengzhou and Laizhou. In the century since, several governments have ruled that coast, while the settlements in the far north have grown into a country in their own right. Some of the men offering to guide our ships ashore want to be rid of a garrison. Others want a voice for the local republicans. Their agreement is less certain when it comes to who should command the troops that land.\n\nThe National Assembly can finance contacts with the old adherents in Shandong. It must wait until the authorities in Bianliang are otherwise occupied before making its territorial demand public. The claim came from the exiles of Shandong. The expense will fall on all of [JournalEntry.GetCountry.GetName]."
 nesnd_sha_qilu:0 "The Qilu Compact"
 nesnd_sha_qilu_reason:0 "Dengzhou and Laizhou gave the northern republic the name it still bears. Some deputies speak of Shandong as their ancestral home. Others have never seen the province and want to know whether its harbours will admit Denglai shipping on lasting terms. Both will sign a proposal to open a port. The terms they offer across the water are plain enough. The treasury will pay for a harbour under the republic’s jurisdiction.\n\nIf those governing Shandong acknowledge a republic themselves, there is another way into Dengzhou. The two governments can exchange credentials as allies, each retaining its territory. Such a compact would give Denglai a hearing in Shandong. It would scarcely entitle the National Assembly to levy taxes there."
 nesnd_sha_old_guard:0 "The Old Adherents of Denglai"
 nesnd_sha_old_guard_desc:0 "Old adherents #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_sha_qi_disorder:0 "Provincial disorder has reached 50"
 nesnd_sha_qi_war:0 "The government is at war"
 nesnd_sha_qi_south:0 "Bianliang has intervened in the south"
 nesnd_sha_qi_reform:0 "The land reform has succeeded"
 nesnd_sha_qi_rebels:0 "The Han Republican Army is in the field"
 nesnd_sha_qi_fleet:0 "Denglai can project naval power"
 nesnd_sha_land_agents:0 "Send Agents to Dengzhou and Laizhou"
 nesnd_sha_land_agents_desc:0 "Finance agents familiar with the Shandong coast to learn which of the old adherents will receive a landing party."
 nesnd_sha_agents_terms:0 "Contacts can be funded once every #v 12#! months. There is a #v 5%#! chance the agents are caught, costing #r 20#! relations with the government in Bianliang."
 nesnd_sha_coastal_aid:0 "Support the Northern Republicans"
 nesnd_sha_coastal_aid_desc:0 "Finance a year of organising by republicans in Shandong, Hejian and Yanjing. Recruitment is in local hands."
 nesnd_sha_coastal_aid_terms:0 "In the districts of Shandong, Hejian and Yanjing under Bianliang’s rule, attraction to the Radical Movement rises by #g 15%#! for a year. Each gains #r 5%#! [concept_radicals] at the outset and again after six and twelve months. A #v 20%#! chance of discovery costs #r 30#! relations."
 nesnd_sha_coastal_funding:0 "Funds for the Northern Republicans"
 nesnd_sha_coastal_societies:0 "Republican Organising on the Coast"
 nesnd_sha_court_gentry:0 "Cultivate the Northern Landowners"
 nesnd_sha_court_gentry_desc:0 "Finance contacts with landowners opposed to the government’s land policy and support their efforts to influence politics at home."
 nesnd_sha_gentry_terms:0 "Landowner political strength rises by #v 10%#! and approval falls by #r 2#! for #v 24#! months. Wait a further #v 24#! months before renewing these contacts. A #v 20%#! chance of discovery costs #r 30#! relations."
 nesnd_sha_gentry_opposition:0 "Landowner Opposition to Land Policy"
 nesnd_sha_homecoming_prestige:0 "A Return to Shandong"
 nesnd_sha_homecoming_army:0 "Victory Across the Sea"
 nesnd_sha_shandong_settled_status:0 "The Shandong settlement is in force. The assembly may now reconsider the form of government."
 nesnd_sha_crossing_status:0 "Send agents or support the republicans. Once the old adherents reach #v 100#!, wait for war, revolution or failed land reform in the north. A truce with the government of Shandong prevents a demand."
 nesnd_sha_claim_ready:0 "The assembly has laid claim to Shandong. Secure land there to complete the crossing. A truce without a foothold requires fresh contacts ashore."
 nesnd_sha_qi_allied_status:0 "Denglai has allied with the republican government in Shandong. Once the alliance is a year old, if the ally still governs both the provincial capital and the port as a republic and is at peace with Bianliang, Denglai will ask it to open Dengzhou as a Denglai port; its consent completes the crossing. After a refusal Denglai must wait five years to ask again. While the alliance lasts, the assembly makes no territorial demand on its ally."
 nesnd_sha_qilu_status:0 "Ask the government holding the port to open Dengzhou. An alliance or common power bloc with the republican government holding Shandong’s provincial capital can also conclude the compact."
 nesnd_sha_crossing_landed:0 "Denglai holds territory in Shandong."
 nesnd_sha_qilu_open_port:0 "Denglai holds the Shandong treaty port or the entire province."
 nesnd_sha_qilu_allied:0 "The republican government holding Shandong’s provincial capital is allied with Denglai or shares its power bloc."
 nesnd_sha_qi_deadline:0 "Fifteen-Year Term"
 nesnd_sha_qi_on_deadline:0 "When the Term Expires"
 nesnd_sha_qi_time_up:0 "The assembly’s fifteen-year term for its Shandong policy has expired."
 nesnd_sha_qi_bankrupt:0 "The government has declared bankruptcy"
 nesnd_sha_qi_republic:0 "The government is republican"
 nesnd_sha_qi_against_north:0 "At war with the government in Bianliang"
 nesnd_sha_qi_subject:0 "The country is a subject"
 nesnd_sha_qi_passage_terms:0 "Bring #v 5,000–10,000#! North Chinese people from Bianliang’s jurisdiction to Denglai’s capital, at a cost of #r 10#! relations."
 nesnd_sha_open_dengzhou:0 "Request a Port in Shandong"
 nesnd_sha_open_dengzhou_desc:0 "Ask the government holding the Shandong port to cede jurisdiction over it. Denglai pays upon delivery."
 nesnd_sha_open_dengzhou_terms:0 "Denglai pays #v 5%#! of its GDP, at least @money!#v 7,500#!, to the government ceding the port. A refusal permits a new approach after #v 60#! months."
 nesnd_sha_republic_league:0 "Propose a Republican League"
 nesnd_sha_republic_league_desc:0 "Invite them into a power bloc under Denglai’s leadership. If Denglai already leads a bloc, the proposal is for admission to it."
 nesnd_sha_republic_league_terms:0 "On acceptance Denglai leads the bloc and they join it. A new bloc takes the form of an Ideological Union. A refusal permits a new approach after #v 24#! months."
 nesnd_sha_league_of_republics:0 "League of Republics"
 nesnd_sha_qi.1.t:0 "Lights off Dengzhou"
 nesnd_sha_qi.1.d:0 "Word has come from the Dengzhou coast. Men who once carried letters only so far as the house of a trusted friend will now tell a shipmaster where to anchor and wait ashore to receive the republic’s troops. [SCOPE.sCountry('nesnd_sha_qi_host').GetName] still holds the provincial capital. Denglai has gained no territory overnight, but the National Assembly can at last press its claim in public."
 nesnd_sha_qi.1.f:0 "“If it is letters you wish to send, I can find you a fishing boat. If I am to receive an army on the beach, I should like the assembly to tell me how many ships it means to send.” — A Shandong contact to Denglai’s delegate"
 nesnd_sha_qi.1.a:0 "Lay claim to Shandong in the name of the republic."
 nesnd_sha_qi.2.t:0 "Two Republics"
 nesnd_sha_qi.2.d:0 "The old adherents report a different flag over the provincial capital. [SCOPE.sCountry('nesnd_sha_qi_host').GetName] too governs in the name of a republic. The National Assembly once assured its friends in Shandong that when the day came to land, their troops would stand on the same side. It can keep that promise by acknowledging a government across the water with which it can sign a treaty. If the deputies still demand sovereignty over Shandong, they must explain in public how men serving the same republican cause have come to face each other under arms."
 nesnd_sha_qi.2.f:0 "“They call themselves the people in Shandong, as we do in the far north. I ask the house to word its next order plainly, so the men receiving it know whom they are to fire upon.” — Debate in Denglai’s assembly"
 nesnd_sha_qi.2.a:0 "Ally with the republican government in Shandong and fight alongside it."
 nesnd_sha_qi.2.b:0 "Maintain the assembly’s claim to sovereignty over Shandong."
 nesnd_sha_qi.3.t:0 "A Return to Shandong"
 nesnd_sha_qi.3.d:0 "A territorial demand has at last become land in Shandong under the direct jurisdiction of [ROOT.GetCountry.GetName]. Some of those coming ashore truly are coming home. They have relatives here, even kinsmen willing to take them to the family graves. Others in the ranks have never seen Shandong. The republic has posted them here. Those waiting for their letters back home are in Liaodong or on the far side of the sea.\n\nThe National Assembly may decide separately whether to move its seat to Qingdao. There is at last ground in Shandong on which that debate can take place."
 nesnd_sha_qi.3.f:0 "“Mother asked me to bring her a handful of earth from the family grave. The officer who crossed with me was born on Sakhalin. He gave me leave as soon as he heard. He had to stay on the quay to receive the next ship.” — A letter home from a Shandong soldier"
 nesnd_sha_qi.3.a:0 "Enter our Shandong territory on the map of the republic."
 nesnd_sha_qi.4.t:0 "Fifteen Years across the Water"
 nesnd_sha_qi.4.d:0 "The assembly allowed fifteen years for the crossing. The term is up, and not a single district of Shandong pays its taxes to Denglai. The old mandate no longer entitles the deputies to draw upon the treasury for a landing. Families with ties to Shandong may still raise their own passage money. A foothold for the republic must wait for another attempt."
 nesnd_sha_qi.4.f:0 "“In fifteen years we have learned the sea passage well enough. I cannot yet ask this house to mark the roads ashore on a map of our own country.” — A Denglai delegate reporting to the assembly"
 nesnd_sha_qi.4.a:0 "Let the mandate for the crossing expire."
 nesnd_sha_qi.5.t:0 "A Port Opens in Shandong"
 nesnd_sha_qi.5.d:0 "Shipowners trading with Shandong used to learn of a change in port regulations only after they arrived. Now [ROOT.GetCountry.GetName] has a port of its own in the province. It may issue clearances and inspect manifests, and must pay for customs enforcement and repairs to the quays. The merchants who backed the proposal have already sent their cargoes. Deputies who favour a further step inland have begun to enquire about Qingdao."
 nesnd_sha_qi.5.f:0 "“Every ship calling at this port must hold a licence issued by this country, and may unload only after customs has inspected its manifest.”\n- Regulations of the port of Dengzhou"
 nesnd_sha_qi.5.a:0 "Clear our ships through the Shandong port."
 nesnd_sha_qi.6.t:0 "The Compact of Qilu"
 nesnd_sha_qi.6.d:0 "The republican government in Shandong and Denglai have entered a common alliance. Letters from the province once passed from hand to trusted hand before reaching a deputy. Shipping, the affairs of expatriates and the movements of a common enemy can now be discussed by accredited envoys.\n\nJurisdiction over Shandong remains with its government. For many deputies in the far north, an ally there is enough to show the constituents who paid for the venture."
 nesnd_sha_qi.6.f:0 "“Each government affixes its own seal. We are rather closer comrades now than we were when so many of our friends would trust us only with a whispered message.” — Denglai’s envoy to the National Assembly"
 nesnd_sha_qi.6.a:0 "Acknowledge our ally’s jurisdiction in Shandong."
 nesnd_sha_qi.7.t:0 "Passage for the Exiles"
 nesnd_sha_qi.7.d:0 "When the northern republicans and the government came to blows, men fleeing their posts often took their families. At the coast they found shipowners willing to hold berths pending a guarantee from the assembly, but unwilling to pay a family’s passage out of sympathy. If Denglai undertakes to receive them, those who choose to go can settle in the republic’s capital. Bianliang will learn who gave them a way out."
 nesnd_sha_qi.7.f:0 "“Once they board I can put their names on the manifest. I shall need the assembly’s word that they will be allowed ashore.” — A shipowner offering passage"
 nesnd_sha_qi.7.a:0 "Admit the exiles to settle in the capital."
 nesnd_sha_qi.7.b:0 "Decline to guarantee passage."
 nesnd_sha_qi.8.t:0 "Looking towards Shandong"
 nesnd_sha_qi.8.d:0 "For fifteen years Denglai’s envoys have sought a port or hoped for a compact with Shandong. The assembly’s term has expired without terms sufficient to justify the mission. Our ships may still cross as before. On arrival their masters must still ask whose orders prevail ashore."
 nesnd_sha_qi.8.f:0 "“Being able to see Shandong from the sea scarcely obliges its officials to open their doors. If a deputy has another proposal, let him bring a fresh motion.” — Debate in the National Assembly"
 nesnd_sha_qi.8.a:0 "Conclude the Shandong mission."
 nesnd_sha_open_dengzhou_action_name:0 "$nesnd_sha_open_dengzhou$"
 nesnd_sha_open_dengzhou_action_propose_name:0 "$nesnd_sha_open_dengzhou$"
