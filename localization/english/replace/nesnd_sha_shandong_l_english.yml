 nesnd_sha_open_dengzhou_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] offers to buy jurisdiction over the Shandong port, payable on transfer."
 nesnd_sha_open_dengzhou_proposal_notification_effects_desc:0 "$nesnd_sha_open_dengzhou_terms$"
 nesnd_sha_open_dengzhou_proposal_accepted_name:0 "Terms Agreed for the Shandong Port"
 nesnd_sha_open_dengzhou_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] has accepted our proposal for a port in Shandong."
 nesnd_sha_open_dengzhou_proposal_declined_name:0 "Port Request Declined"
 nesnd_sha_open_dengzhou_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] declined the proposal. Talks may resume in five years."
 nesnd_sha_open_dengzhou_action_notification_name:0 "$nesnd_sha_open_dengzhou_proposal_accepted_name$"
 nesnd_sha_open_dengzhou_action_notification_desc:0 "$nesnd_sha_open_dengzhou_proposal_accepted_desc$"
 nesnd_sha_open_dengzhou_proposal_third_party_accepted_name:0 "$nesnd_sha_open_dengzhou_proposal_accepted_name$"
 nesnd_sha_open_dengzhou_proposal_third_party_accepted_desc:0 "$nesnd_sha_open_dengzhou_proposal_accepted_desc$"
 nesnd_sha_open_dengzhou_proposal_third_party_declined_name:0 "$nesnd_sha_open_dengzhou_proposal_declined_name$"
 nesnd_sha_open_dengzhou_proposal_third_party_declined_desc:0 "$nesnd_sha_open_dengzhou_proposal_declined_desc$"
 nesnd_sha_republic_league_action_name:0 "$nesnd_sha_republic_league$"
 nesnd_sha_republic_league_action_propose_name:0 "$nesnd_sha_republic_league$"
 nesnd_sha_republic_league_proposal_notification_name:0 "An Invitation from Denglai"
 nesnd_sha_republic_league_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName] invites our government into a power bloc under its leadership."
 nesnd_sha_republic_league_proposal_notification_effects_desc:0 "$nesnd_sha_republic_league_terms$"
 nesnd_sha_republic_league_proposal_accepted_name:0 "Agreement on the Republican League"
 nesnd_sha_republic_league_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName] has accepted our proposal for a republican league."
 nesnd_sha_republic_league_proposal_declined_name:0 "League Invitation Declined"
 nesnd_sha_republic_league_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName] declined the proposal. Talks may resume in two years."
 nesnd_sha_republic_league_action_notification_name:0 "$nesnd_sha_republic_league_proposal_accepted_name$"
 nesnd_sha_republic_league_action_notification_desc:0 "$nesnd_sha_republic_league_proposal_accepted_desc$"
 nesnd_sha_republic_league_proposal_third_party_accepted_name:0 "$nesnd_sha_republic_league_proposal_accepted_name$"
 nesnd_sha_republic_league_proposal_third_party_accepted_desc:0 "$nesnd_sha_republic_league_proposal_accepted_desc$"
 nesnd_sha_republic_league_proposal_third_party_declined_name:0 "$nesnd_sha_republic_league_proposal_declined_name$"
 nesnd_sha_republic_league_proposal_third_party_declined_desc:0 "$nesnd_sha_republic_league_proposal_declined_desc$"
 nesnd_sha_qi_joint_tt:0 "After #v 12#! months of alliance, if the ally still governs the provincial capital as a republic and is not at war with the government in Bianliang, Denglai will ask it to open Dengzhou as a Denglai treaty port. Its consent completes the crossing."
 nesnd_sha_qi.9.t:0 "Denglai Asks for Dengzhou"
 nesnd_sha_qi.9.d:0 "Envoys of [SCOPE.sCountry('nesnd_sha_qi_petitioner').GetName] have presented a letter asking us to open Dengzhou as their treaty port, with its harbour and customs run by their own officials. Our two countries have now been allied for a year."
 nesnd_sha_qi.9.f:0 "“We respectfully ask your government to open Dengzhou as a treaty port for our country, with its harbour and customs administered by officers we appoint.”\n- Letter of state from [SCOPE.sCountry('nesnd_sha_qi_petitioner').GetName]"
 nesnd_sha_qi.9.a:0 "Open Dengzhou"
 nesnd_sha_qi.9.b:0 "Refuse"
 nesnd_sha_qi.10.t:0 "Dengzhou Refused"
 nesnd_sha_qi.10.d:0 "[SCOPE.sCountry('nesnd_sha_qi_host').GetName] has refused to open Dengzhou as a Denglai port. The alliance stands, but the assembly may not raise the matter again for five years."
 nesnd_sha_qi.10.a:0 "Let the matter rest"
