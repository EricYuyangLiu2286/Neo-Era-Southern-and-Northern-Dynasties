 ce_culture_reunification: "Integrate National Cultures"
 ce_culture_event.1.t: "A Unified Chinese Nation"
 ce_culture_event.1.d: "More than four centuries have passed since the Chenghua Emperor, who sought to reform the Ming court, died; nearly a century has passed since Li Hezu and Zhao Mingdi launched the first civic revolution. At last, the vast land of Shenzhou stands united under the banner of [ROOT.GetCountry.GetName]. The people of this age have achieved immortal merit. Yet our leaders are already looking ahead: what form will this new China take as it stands among the nations of the world?"
 ce_culture_event.1.f: "The King of Qin swept through the Six States, what tiger-eyed grandeur! / He waved his sword and split the drifting clouds, the lords all came from west to bow...\n- Li Bai, Ancient Airs (59 poems)"
 ce_culture_event.1.1: "With all peoples united, a great nation can be built!"
 
 ce_culture_event.2.t: "Revival of the Chinese Nation"
 ce_culture_event.2.d: "Great change has struck the long-divided lands of Ming. The Southern Ming-Northern Hua divide has been broken, and the realm is united again. Since the modern Enligtenment Movement, progressive scholars and civic thinkers have spoken of a new Chinese national identity; now that ideal has entered reality. One of the world's most populous and oldest nations now stands once more beneath one banner, eager to reclaim a rightful place in the world for a unified Chinese state."
 ce_culture_event.2.f: "When ape and man bowed farewell...\n- Anonymous of the Eastern International"
 ce_culture_event.2.1: "Is this where Heaven's mandate returns?"
 ce_culture_event.2.2: "Let us hope they do not mean to restore a central empire."
 
 ce_unification_chinese_culture: "Unify Huaxia"
 ce_unification_chinese_culture_desc: "With the end of the [Glossary('glossary_nesnd_beiming_zhanguoshi','Northern Ming Warring States')] age, people have grown weary of endless power struggles among feudal lords, [Glossary('glossary_nesnd_fanzhen','military governors')], and warlords. From Li Hezu to Chen Dongyang and Mu Zhongtang, one lesson has become clear: only by unifying the Chinese nation under a modern national identity can final peace be won, rather than returning to old feudal hierarchies. As the old saying goes: 'The Six States fell, the four seas became one; script was unified, axles matched; so it has been for two thousand years.'"
