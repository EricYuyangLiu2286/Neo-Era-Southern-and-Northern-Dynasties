l_english:
 nesnd_phi_service_recovery:0 "Funding the Luzon Garrison"
 nesnd_phi_service_recovery_reason:0 "The Chu army’s passage south brought more Huguang voices to Luzon’s garrisons. The soldiers who sailed with Lin Zexu draw their pay and drill here, passing news of home through letters read in camp. The islands must support these troops and keep ships and sailors ready for the court’s overseas expeditions.\n\nThe Pacification Commission therefore seeks to renegotiate garrison funding, coastal defence and annual tribute. If the court can call upon the ships, their pay and supplies cannot depend indefinitely on Luzon’s local revenues alone. The islands must also settle soldiers and civilians, cultivate land and develop industry, yet their income keeps flowing into barracks and fleets. How much the centre will bear, and how much Luzon can retain, will shape the lives of this overseas army and the people who sustain it."
 nesnd_phi_status_external:0 "The subject relationship, shared market or peace required by the military funding agreement has changed. Subsidy payments will not continue.\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_stalled:0 "The central government has not made the agreed payments. It may be in [concept_default] or have suspended its obligations. Military and civilian expenses must find another source of funds.\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_pending:0 "Both countries must confirm the proposal within 120 days. Payments and any agreed ship transfers begin only after signature.\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_active:0 "The central government is making the agreed payments. The subsidy lasts 12 months from signature.\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_review:0 "The subsidy has ended. Sustain military funding, the garrison and civilian livelihoods for three consecutive months to consolidate the gains. Renewal requires a fresh agreement between both countries.\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_proposal:0 "Request central funding for the garrison, or negotiate a division of naval responsibilities.\n$nesnd_phi_status_details_link$"
 nesnd_phi_service_bar:0 "Military and Civilian Funding"
 nesnd_phi_service_bar_desc:0 "$nesnd_phi_service_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_phi_service_bar_detail:0 "Weekly balance excluding construction: #v £[Country.MakeScope.Var('nesnd_phi_budget').GetValue|0]#!\nCrew required for a fully staffed fleet: #v [Country.MakeScope.Var('nesnd_phi_needed_crew').GetValue|0]#!\nUnemployed workforce: #v [Country.MakeScope.Var('nesnd_phi_unemployment').GetValue|%1]#!\nStarving workforce: #v [Country.MakeScope.Var('nesnd_phi_starving').GetValue|%1]#!\n\nUpdated monthly. Both workforce shares use the country's total workforce."
 nesnd_phi_continuity_bar:0 "Financial Stability"
 nesnd_phi_continuity_bar_desc:0 "$nesnd_phi_continuity_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_phi_continuity_bar_detail:0 "Four requirements:\nFinances: a nonnegative balance excluding construction, no [concept_default] and no [concept_bankruptcy] penalty. While a subsidy is active, the overlord must fulfil its payments.\nArmy: at least #v 35 battalions#!.\nNavy: at least #v 40 surviving ships#! under the garrison plan or #v 20#! under the naval division, each with at least #v 75%#! crew. Naval maintenance fulfilment must be at least #v 80%#!.\nLivelihoods: unemployment at most #v 12%#! and starvation at most #v 15%#! of the workforce.\n\nEach peaceful month meeting all four requirements adds #p 1 month#!. An unmet condition or the end of the subsidy resets the count. Once a funding agreement has entered force and its subsidy has ended, #v 3 consecutive qualifying months#! complete the Journal Entry."
 nesnd_phi_request_a_button:0 "Negotiate Garrison Funding"
 nesnd_phi_request_a_button_desc:0 "Ask the central government to share the overseas garrison’s expenses under the two countries’ existing political commitments.\n\n$nesnd_phi_route_1_terms_tt$"
 nesnd_phi_request_b_button:0 "Divide Naval Responsibilities"
 nesnd_phi_request_b_button_desc:0 "Ask the central government to take charge of the ocean-going warships. Luzon will retain its frigates and the Western Administration’s garrison to share responsibility for defending the islands.\n\n$nesnd_phi_route_2_terms_tt$"
 nesnd_phi_cancel_request_button:0 "Withdraw the Proposal"
 nesnd_phi_cancel_request_button_desc:0 "Withdraw the unsigned proposal. Another may be submitted after 30 days. Existing diplomatic agreements remain in force."
 nesnd_phi_withdraw_button:0 "End the Subsidy Early"
 nesnd_phi_withdraw_button_desc:0 "Withdraw from the subsidy treaty negotiated here. Leaving during its binding period incurs the treaty’s Infamy and relations penalties. Tribute reductions, exemption from military service and other treaties retain their own terms. Ships already transferred remain with the central government."
 nesnd_phi_route_1_terms_tt:0 "The central government pays Luzon #v £8,000#! a week for #v 12 months#!. A separate treaty reduces the share of income paid in tribute by #v 10 percentage points#!. Luzon retains its fleet and garrison. The central government needs at least #v £10,000#! in weekly surplus excluding construction, #v £100,000#! in reserves, and eligibility for both treaties. The subsidy treaty is withdrawn at the end of the year. The tribute reduction retains its own terms."
 nesnd_phi_route_2_terms_tt:0 "On the first agreement, Luzon transfers #v 20 ships of the line#! that it owns and that are not in battle. It retains #v 20 frigates#! and the garrison. The central government pays #v £3,000#! weekly for #v 12 months#!, and concludes separate agreements for reduced tribute and exemption from military service. It needs at least #v £5,000#! in weekly surplus excluding construction and #v £60,000#! in reserves. Renewals do not transfer more ships. The subsidy ends after a year. The other agreements retain their own terms."
 nesnd_phi_usm_accept_tt:0 "Approve the proposal and return it to Luzon for final confirmation. At signature, both countries must still meet the agreed financial, subject and fleet requirements before payments or ship transfers can begin."
 nesnd_phi_reject_tt:0 "Return the proposal. Another may be submitted after 90 days."
 nesnd_phi_defer_tt:0 "Do not sign this agreement. Negotiations may resume after 30 days."
 nesnd_phi_finance.reject:0 "We cannot authorize this expense."
 nesnd_phi_finance.defer:0 "Return it for further negotiation."
 nesnd_phi_finance.cancel:0 "Withhold our signature."
 nesnd_phi_finance.1.t:0 "Paying the Luzon Garrison"
 nesnd_phi_finance.1.d:0 "The Luzon Pacification Commission argues that the northern threat has receded and asks the court to share anew the cost of its garrison and ocean-going fleet. The ships already await the court’s summons, yet their pay and daily supplies have long come from Luzon’s local revenues. The islands must pay tribute while supporting forces that may be sent overseas at any moment.\n\nThe Commission argues that, large though Luzon is, the southern peoples have submitted and the Chinese heartland is close at hand. Settlement, cultivation and industry are now more pressing concerns. If all revenue is spent on troops, local livelihoods cannot recover, and the ships will ultimately lose their means of support as well. The proposal therefore requests #v £8,000#! a week for one year, with a separate reduction in tribute. The court must now answer who should bear this military expense."
 nesnd_phi_finance.1.a:0 "Approve the funding and seek Luzon’s consent."
 nesnd_phi_finance.2.t:0 "The Fleet Returns to Central Command"
 nesnd_phi_finance.2.d:0 "Luzon proposes to divide responsibility for ocean-going service and the defence of the islands. The ships of the line in the Nanyang Detached Fleet would belong to the main force of the Three Oceans Navy, with the central government arranging their overseas service and upkeep. Light frigates would remain in the islands, while the Pacification Commission would continue to organise and train the Western Administration’s garrison to deter the unsubdued tribes.\n\nThis division would separate the court’s ocean-going ventures from Luzon’s local expenses. The Commission requests exemption from military service, reduced annual tribute and #v £3,000#! a week for one year. It hopes to devote the money saved to cultivation and industry, lifting soldiers and civilians out of the stagnation left by war. The court’s command of the warships would carry the burden of maintaining them."
 nesnd_phi_finance.2.a:0 "The Chief Minister’s proposal is sound. Approved."
 nesnd_phi_finance.3.t:0 "The Funding Authorisation"
 nesnd_phi_finance.3.d:0 "The central government has approved garrison funding of #v £8,000#! a week for one year. Reduced tribute is also included in the proposal. The garrison and Luzon squadron would retain their existing deployment, without joining the court’s main force.\n\nThe Pacification Commission has won an opportunity to share the expense, but Luzon must still maintain the troops and ships. Once we sign, it will fall to us to decide how this money should serve both military pay and civilian livelihoods."
 nesnd_phi_finance.3.a:0 "Is this really an instruction from Hangzhou? Affix the seal and spend it as agreed."
 nesnd_phi_finance.4.t:0 "The Great Ships Join the Main Fleet"
 nesnd_phi_finance.4.d:0 "The central government has agreed to the proposed division of naval duties. Under this arrangement, the ships of the line belong to the court’s main force, while the frigates and the Western Administration’s garrison remain in Luzon. The centre bears the upkeep of the ocean-going warships, allowing the Pacification Commission to concentrate on the islands’ garrison and coastal defence.\n\nThe proposal covers the transfer of ships, reduced tribute and exemption from service, with #v £3,000#! a week in subsidies for the first year. Once transferred, the warships remain under central control. Luzon may negotiate further funding if difficulties persist. The agreement before us still awaits the Commission’s final signature."
 nesnd_phi_finance.4.a:0 "Is this really an instruction from Hangzhou? Affix the seal and spend it as agreed."
 nesnd_phi_finance.5.t:0 "New Arrangements for Expenditure"
 nesnd_phi_finance.5.d:0 "The military funding agreement has been signed, and the court has begun paying the agreed sums. The Pacification Commission can at last rearrange its expenditure, without pouring all the islands’ income into barracks and fleets.\n\nThis year of assistance comes at a timely moment. Settling military households, cultivating land and developing industry must yield something before the payments end. Otherwise, at this time next year we shall be asking the court for the same soldiers’ pay all over again."
 nesnd_phi_finance.5.a:0 "Settlement, industry and restored livelihoods in Luzon are my responsibility."
 nesnd_phi_finance.6.t:0 "The Subsidy Expires"
 nesnd_phi_finance.6.d:0 "Word has come from the court that Luzon’s annual subsidy has expired. The Pacification Commission must henceforth maintain military and civilian affairs from its existing income, petitioning separately if further difficulties arise. Other military and diplomatic obligations remain subject to their respective terms.\n\nThe soldiers in camp still need their pay, and settlement and cultivation in the districts cannot stop. The year we won for ourselves has now run out."
 nesnd_phi_finance.6.a:0 "What a miser..."
 nesnd_phi_finance.7.t:0 "Funding Interrupted"
 nesnd_phi_finance.7.d:0 "The agreed payments have stopped. The Pacification Commission must find new funds for soldiers’ pay and daily expenses. The districts had little enough to spare for cultivation and civilian needs. Now more of that money must be diverted.\n\nThe arrangements between our two countries are no longer what they were at signature. Securing further assistance will take some persuasion."
 nesnd_phi_finance.7.a:0 "What a miser..."
 nesnd_phi_finance.8.t:0 "The Garrison Sustained"
 nesnd_phi_finance.8.d:0 "For three months after the central subsidy ended, Luzon has sustained its military and civilian finances. The garrison and navy have their pay, while local production and employment can support present expenditure.\n\nThe Pacification Commission no longer has to halt civilian affairs in the districts whenever military funds are needed. The overseas troops can settle into their duties, and the military households and civilians who sustain them have livelihoods they can maintain."
 nesnd_phi_finance.8.a:0 "This is our success."
 nesnd_phi_finance.10.t:0 "Revised Terms"
 nesnd_phi_finance.10.d:0 "After negotiations, the two countries have amended the military funding treaty. The payments and obligations previously agreed will now follow the new terms.\n\nThe Pacification Commission must rearrange its expenditure accordingly. When payments are due, and who bears which responsibilities, will determine how much remains for soldiers’ pay and local revenues. We should read the new treaty closely before making plans."
 nesnd_phi_finance.10.a:0 "Oh, let me have a look..."

 nesnd_phi_request_cash_a_button:0 "Negotiate a Fixed Garrison Subsidy"
 nesnd_phi_request_cash_a_button_desc:0 "Ask the central government to make a weekly contribution towards the garrison and ocean-going naval service under the two countries’ existing political commitments.\n\n$nesnd_phi_cash_1_terms_tt$"
 nesnd_phi_request_cash_b_button:0 "Divide Naval Duties with Fixed Funding"
 nesnd_phi_request_cash_b_button_desc:0 "Agree that the central government will take charge of the ships of the line while Luzon retains its frigates and garrison, then arrange annual funding for the divided duties.\n\n$nesnd_phi_cash_2_terms_tt$"
 nesnd_phi_cash_1_terms_tt:0 "The central government pays Luzon #v £8,700#! weekly for #v 12 months#!. Luzon retains its garrison and fleet. Tribute continues under the existing subject relationship. This agreement neither reduces the tribute rate nor changes Liberty Desire. The central government needs at least #v £10,000#! in weekly surplus excluding construction, #v £100,000#! in reserves, and eligibility for the subsidy treaty. Payments begin only after both governments consent and end after the agreed year."
 nesnd_phi_cash_2_terms_tt:0 "The first agreement transfers #v 20 ships of the line#! to the central government. Luzon retains #v 20 frigates#! and the garrison, and gains exemption from military service if eligible. The central government pays #v £3,700#! weekly for #v 12 months#!. Tribute continues at the existing rate. The central government needs at least #v £5,000#! in weekly surplus excluding construction and #v £60,000#! in reserves. Renewals do not transfer additional ships. The end of the year terminates only this subsidy."
 nesnd_phi_finance.11.t:0 "The Garrison’s Annual Expenses"
 nesnd_phi_finance.11.d:0 "Luzon asks the central government to share the annual cost of its garrison and naval defence. The Pacification Commission is willing to remit tribute as before. It argues, however, that troops and ships awaiting the court’s summons should receive part of their support from the central treasury.\n\nThe proposal requests #v £8,700#! a week for one year. The court’s ocean-going forces and Luzon’s local livelihoods both draw upon the islands’ revenues. If the districts must bear the whole expense, they will have ever less room to restore production."
 nesnd_phi_finance.11.a:0 "Approve the subsidy and seek Luzon’s consent."
 nesnd_phi_finance.12.t:0 "Signing for Annual Funding"
 nesnd_phi_finance.12.d:0 "The central government has approved a subsidy of #v £8,700#! a week for one year. Tribute will be remitted as before, and the Pacification Commission will continue to maintain the fleet and garrison, with the court meeting part of the expense from its treasury.\n\nThe payments still await Luzon’s final signature. This contribution can ease our immediate difficulties, but it cannot administer the islands for us. Providing for the soldiers in camp while allowing local livelihoods to recover remains the Commission’s responsibility."
 nesnd_phi_finance.12.a:0 "Sign, and account for each use of the funds."
 nesnd_phi_finance.13.t:0 "Annual Funding for Divided Naval Duties"
 nesnd_phi_finance.13.d:0 "Luzon requests funding for a division between ocean-going service and local naval defence. Under the proposed arrangement, twenty ships of the line belong to the central navy, with their bases, crews and supplies arranged by the centre. The frigates and garrison remain to defend the islands. The court provides for the warships serving with its main force.\n\nThe Pacification Commission would continue to remit tribute, while requesting #v £3,700#! a week for one year and exemption from military service under the agreed terms. It hopes to gain some respite from the constant demands of ocean-going warfare, and attend to local cultivation and livelihoods."
 nesnd_phi_finance.13.a:0 "Approve the division of duties and its annual funding."
 nesnd_phi_finance.14.t:0 "Ships and Annual Funding"
 nesnd_phi_finance.14.d:0 "The central government has accepted the proposal to divide naval responsibilities. Under its terms, twenty ships of the line belong to central command, while frigates and garrison troops remain to defend the islands. The upkeep of the transferred warships falls to the centre.\n\nThe Pacification Commission will receive #v £3,700#! a week for one year. Tribute and exemption from service follow their respective terms. With military duties apportioned, the revenues retained must sustain Luzon’s own livelihoods. This agreement still awaits our final signature."
 nesnd_phi_finance.14.a:0 "Sign and complete the handover."

