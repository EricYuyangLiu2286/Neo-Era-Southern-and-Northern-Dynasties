l_english:
 nesnd_south_indochina_envoy:0 "Send Envoys to the South"
 nesnd_south_indochina_envoy_desc:0 "The overseas vassals and colonies are subjects of the Southern realm and must send troops when their overlord calls them to war. We will send envoys asking them to keep their armies at home during the succession dispute."
 nesnd_indochina_envoy_window_tt:0 "The civil war has not begun."
 nesnd_indochina_envoy_cooldown_tt:0 "#v Six months#! have passed since our last envoys."
 nesnd_indochina_envoy_target_tt:0 "An overseas subject of the Southern realm has not yet given its final answer."
 nesnd_indochina_envoy_outcome_tt:0 "The envoys travel to the subject that leans towards Wu the least and has not yet answered, arriving in #v 7 days#!. It may refuse. Each state can be approached #v twice#! at most."
 nesnd_indochina_envoys:0 "Envoys to the South"
 nesnd_indochina_envoys_desc:0 "The officials travelling with the envoys have left their posts."
 nesnd_indochina.1.t:0 "Envoys from [SCOPE.sCountry('nesnd_indochina_sender').GetNameNoFormatting]"
 nesnd_indochina.1.t_rumour:0 "Rumours of War in the South"
 nesnd_indochina.1.d:0 "Envoys from [SCOPE.sCountry('nesnd_indochina_sender').GetName] have arrived in [ROOT.GetCountry.GetName]. They say that the Zheng family of Hangzhou has long held the army and treasury of [SCOPE.sCountry('nesnd_indochina_overlord').GetName] and will sooner or later replace the dynasty. When that happens the Western provinces will rise, and [ROOT.GetCountry.GetName], as a subject, will be called upon to march north. [SCOPE.sCountry('nesnd_indochina_sender').GetName] asks us to keep our armies at home when the time comes, paying tribute as before but sending no troops with our overlord."
 nesnd_indochina.1.d_rumour:0 "News from [SCOPE.sCountry('nesnd_indochina_overlord').GetName] says that the Ming court and Hangzhou are now openly hostile, and a war over the succession could break out at any moment. As a subject, [ROOT.GetCountry.GetName] will be called upon to march with its overlord. Before the fighting starts, the government must decide whether to answer the call or keep our armies at home and go on paying tribute."
 nesnd_indochina.1.a:0 "Wait and See"
 nesnd_indochina.1.a_tt:0 "When the succession war breaks out, we will not join our overlord. If Hangzhou's side wins the civil war, it may hold this against us."
 nesnd_indochina.1.b:0 "Keep Our Obligations"
 nesnd_indochina.2.t:0 "Word from the South"
 nesnd_indochina.2.d_accepted:0 "[SCOPE.sCountry('nesnd_indochina_target').GetName] has accepted our request and is now a tributary of [SCOPE.sCountry('nesnd_indochina_overlord').GetName] that sends no troops. Its armies will not march north when the succession war breaks out."
 nesnd_indochina.2.d_refused:0 "[SCOPE.sCountry('nesnd_indochina_target').GetName] has turned our envoys away and will still march with [SCOPE.sCountry('nesnd_indochina_overlord').GetName]."
 nesnd_indochina.2.a:0 "One army fewer against us."
 nesnd_indochina.2.b:0 "We must look for other means."
 nesnd_indochina.3.t:0 "A Secret Report from the Embroidered Guard"
 nesnd_indochina.3.d_envoy:0 "Embroidered Guard report: a mission from [SCOPE.sCountry('nesnd_indochina_sender').GetName] has recently arrived in [SCOPE.sCountry('nesnd_indochina_target').GetName]. An informer among its attendants learned that the two have made a private agreement: if [SCOPE.sCountry('nesnd_indochina_sender').GetName] takes up arms against the court, [SCOPE.sCountry('nesnd_indochina_target').GetName] will keep its forces at home and send no troops."
 nesnd_indochina.3.d_rumour:0 "Embroidered Guard report: an informer at the court of [SCOPE.sCountry('nesnd_indochina_target').GetName] has learned that [SCOPE.sCountry('nesnd_indochina_target').GetName] has quietly resolved to keep its forces at home if the provinces take up arms against the court. No other envoy was found behind it. The decision is [SCOPE.sCountry('nesnd_indochina_target').GetName]'s own."
 nesnd_indochina.3.d_refused:0 "Embroidered Guard report: [SCOPE.sCountry('nesnd_indochina_sender').GetName] sent an envoy to [SCOPE.sCountry('nesnd_indochina_target').GetName], urging it to keep its forces at home if [SCOPE.sCountry('nesnd_indochina_sender').GetName] takes up arms against the court. [SCOPE.sCountry('nesnd_indochina_target').GetName] turned the envoy away and says it will answer the court's call to arms when the time comes."
 nesnd_indochina.3.a:0 "Put it on file and say nothing."
 nesnd_indochina.10.t:0 "Reckoning in the South"
 nesnd_indochina.10.d:0 "The succession war is over. [SCOPE.sCountry('nesnd_indochina_target').GetName] kept its armies at home during the war and still only pays tribute to [ROOT.GetCountry.GetName], with no duty to send troops."
 nesnd_indochina.10.a:0 "Restore Its Military Obligations"
 nesnd_indochina.10.b:0 "Call It to Account"
 nesnd_indochina.10.c:0 "Let It Pass"
 nesnd_indochina.10.c_tt:0 "[SCOPE.sCountry('nesnd_indochina_target').GetName] remains a tributary that sends no troops."
