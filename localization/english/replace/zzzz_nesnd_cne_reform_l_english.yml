l_english:
 ce_cne_land_reform_goal:0 "Establish land rights and sustain employment, education and living standards for twelve consecutive months."
 nesnd_reform_completion_tt:0 "Reach 100 reform progress, twelve consecutive healthy months, and disorder below 50."
 nesnd_reform_failure_tt:0 "Disorder reaches 90 with twelve consecutive crisis months, turmoil over 40%, legitimacy below 25, and war or bankruptcy."
 nesnd_land_completion_bar:0 "Land Reform"
 nesnd_land_completion_bar_desc:0 "Reform: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_land_disorder_bar:0 "Regional Disorder"
 nesnd_land_disorder_bar_desc:0 "Disorder: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_reform_status_warmup:0 "Collecting three months of provincial statistics.\n$nesnd_land_rules_link$"
 nesnd_reform_status_regions:0 "#n Persistent local hardship#!: #v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_neglected_regions').GetValue|0]#! significant states have suffered severe unemployment or starvation for six consecutive months. The healthy streak is interrupted.\n$nesnd_land_rules_link$"
 nesnd_reform_status_law:0 "#bold Land legislation pending.#! Adopt peasant proprietorship, commercialized or collectivized agriculture.\n$nesnd_land_rules_link$"
 nesnd_land_status_admin:0 "#n Bureaucratic deficit#! interrupts the healthy-month streak and adds 0.5 monthly disorder.\n$nesnd_land_rules_link$"
 nesnd_land_status_war:0 "#n Wartime reform#! interrupts the healthy-month streak and adds 0.5 monthly disorder.\n$nesnd_land_rules_link$"
 nesnd_reform_status_healthy:0 "#p Reform is consolidating#!: #v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_good_months').GetValue|0]#! consecutive healthy months.\n$nesnd_land_rules_link$"
 nesnd_land_status_normal:0 "Reform month #v [ROOT.GetCountry.MakeScope.Var('nesnd_land_months').GetValue|0]#!; healthy months #v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_good_months').GetValue|0] / 12#!.\n$nesnd_land_rules_link$"
 nesnd_land_rules_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules Statistics and reform requirements#!#!"
 nesnd_land_rules:0 "#bold Current statistics#!\nUnemployed share of workforce: #v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!\nWorkforce in starving households: #v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!\nWorkforce-weighted household SoL: #v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!\nPopulation-weighted market access: #v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!\n\n#bold Healthy month#!\nPeasant proprietorship, commercialized or collectivized agriculture; schools level 2 and 48% literacy; unemployment at most 6%, starvation at most 8%, SoL at least 11, market access at least 85%; nonnegative bureaucracy, peace and no bankruptcy. Social security level 2 with SoL 12 permits unemployment up to 12%.\n\nHealthy months add 2 progress and reduce disorder by 1. With land rights, unemployment at most 10%, starvation at most 12%, SoL 10.5, access 80%, schools level 1 and no bankruptcy, partial progress adds 0.5 monthly. Completion requires 100 progress, twelve consecutive healthy months and disorder below 50. Completion within 48 months with 24 healthy months and disorder below 30 earns an additional reward.\n\nThese monthly indicators cover currently owned reform states, including Shengjing, Outer Manchuria and Amur. National and state unemployment use unemployed workforce divided by total workforce. Market access is weighted by state population; SoL and starvation by pop workforce. Subsistence peasants count as employed.\n\n#bold Regional living conditions#!\nA state with at least 500,000 people interrupts consolidation if unemployment exceeds 20%, starving workforce exceeds 25%, or severely starving workforce exceeds 10% for six consecutive months. Actual employment, basic goods supply, relief or industrial adjustment must bring it below these severe-hardship thresholds."
 nesnd_land_survey:0 "Fund Public Workshops"
 nesnd_land_survey_desc:0 "Finance workshops and practical schools to support the movement of rural households into new occupations."
 nesnd_land_survey_outcome_tt:0 "Pay half a week of gross income, at least £25,000. The Chinese state with the highest unemployment gains twelve months of construction, qualification growth and education support. Twelve-month cooldown."
 nesnd_land_review:0 "Review Land Disputes"
 nesnd_land_review_desc:0 "Review conflicting military and civil titles, and protect the property awarded to farming households."
 nesnd_land_review_outcome_tt:0 "Pay one tenth of weekly gross income, at least £5,000; reduce disorder by 5 and conduct twelve months of appeals. Twelve-month cooldown."
 nesnd_land_military:0 "Fund Transitional Relief"
 nesnd_land_military_desc:0 "Extend existing relief payments to households seeking work and struggling to meet their daily needs."
 nesnd_land_military_outcome_tt:0 "Pay one tenth of weekly gross income, at least £5,000. Among Chinese states with starving households, the one with the highest unemployment receives twelve months of additional welfare payments worth 10% of normal wages, charged to the actual welfare budget. Requires social security. Twelve-month cooldown."
 nesnd_reform_public_workshops:0 "Public Workshops and Practical Schools"
 nesnd_reform_transitional_relief:0 "Transitional Relief"
 nesnd_crisis.33.d:0 "Unemployed farm families and veterans have gathered in the towns of Shanxi. Republican organizers are calling on local schools and former army comrades to demand an inquiry into land distribution and relief. Several garrisons have joined the assemblies, and provincial officials have asked the court to decide on their demands for compensation and the dismissal of local officers."
 nesnd_crisis.30.c:0 "The new law binds every garrison."
 flavorCNE.6.d:0 "Land commissioners in [SCOPE.sState('cne_land_reform_mess_imprisonment_state').GetName] have arrested villagers who drafted petitions over disputed titles. The garrison widened the arrests to teachers and clerks. Their families have brought their deeds to the provincial authorities and demanded a public hearing; the commissioners have requested that the prisoners remain under military jurisdiction."
 flavorCNE.7.d:0 "Manufacturers and merchants in [SCOPE.sState('cne_land_reform_industrialists_support_state').GetName] have offered financial support for land reform. Their growing workshops need workers, roads and reliable employment contracts. Their delegates now seek a role in provincial economic affairs and representation within the imperial government."
 flavorCNE.8.d:0 "Rural families are arriving in [SCOPE.sState('cne_land_reform_peasants_in_city_state').GetName] to seek wages. Employment brokers send them to workshops and docks, deducting fees for recruitment and lodging. Workers have accused the brokers of withholding contracts and enforcing old debts. Employers have asked the authorities to uphold the current recruitment arrangements."
 cne_landreform_completion_tracker_add_2:0 "Land Reform progress #p increases by 2#!"
 cne_landreform_completion_tracker_add_1:0 "Land Reform progress #p increases by 1#!"
