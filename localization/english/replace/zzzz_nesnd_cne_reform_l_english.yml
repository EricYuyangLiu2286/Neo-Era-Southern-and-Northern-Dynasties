 nesnd_land_status_normal:0 "Reform month #v [ROOT.GetCountry.MakeScope.Var('nesnd_land_months').GetValue|0]#!; healthy months #v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_good_months').GetValue|0] / 12#!.\n$nesnd_land_rules_link$"
 nesnd_land_survey:0 "Fund Public Workshops"
 nesnd_land_survey_desc:0 "Finance workshops and practical schools to support the movement of rural households into new occupations."
 nesnd_land_review:0 "Review Land Disputes"
 nesnd_land_review_desc:0 "Review conflicting military and civil titles, and protect the property awarded to farming households."
 nesnd_land_review_outcome_tt:0 "Pay one tenth of weekly gross income, at least £5,000; reduce disorder by 5 and conduct twelve months of appeals. Twelve-month cooldown."
 nesnd_land_military:0 "Fund Transitional Relief"
 nesnd_land_military_desc:0 "Extend existing relief payments to households seeking work and struggling to meet their daily needs."
 nesnd_reform_public_workshops:0 "Public Workshops and Practical Schools"
 nesnd_reform_transitional_relief:0 "Transitional Relief"
 nesnd_crisis.33.d:0 "Unemployed farm families and veterans have gathered in the towns of Shanxi. Republican organizers are calling on local schools and former army comrades to demand an inquiry into land distribution and relief. Several garrisons have joined the assemblies, and provincial officials have asked the court to decide on their demands for compensation and the dismissal of local officers."
 nesnd_crisis.30.c:0 "The new law binds every garrison."
 flavorCNE.6.d:0 "Land commissioners in [SCOPE.sState('cne_land_reform_mess_imprisonment_state').GetName] have arrested villagers who drafted petitions over disputed titles. The garrison widened the arrests to teachers and clerks. Their families have brought their deeds to the provincial authorities and demanded a public hearing; the commissioners have requested that the prisoners remain under military jurisdiction."
 flavorCNE.7.d:0 "Manufacturers and merchants in [SCOPE.sState('cne_land_reform_industrialists_support_state').GetName] have offered financial support for land reform. Their growing workshops need workers, roads and reliable employment contracts. Their delegates now seek a role in provincial economic affairs and representation within the imperial government."
 flavorCNE.8.d:0 "Rural families are arriving in [SCOPE.sState('cne_land_reform_peasants_in_city_state').GetName] to seek wages. Employment brokers send them to workshops and docks, deducting fees for recruitment and lodging. Workers have accused the brokers of withholding contracts and enforcing old debts. Employers have asked the authorities to uphold the current recruitment arrangements."
 cne_landreform_completion_tracker_add_2:0 "Land Reform progress #p increases by 2#!"
 cne_landreform_completion_tracker_add_1:0 "Land Reform progress #p increases by 1#!"
