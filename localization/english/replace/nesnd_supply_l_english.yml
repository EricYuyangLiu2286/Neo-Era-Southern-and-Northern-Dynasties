l_english:
 nesnd_supply_preparations:0 "Fragile Trade"
 nesnd_supply_preparations_reason:0 "Wu shipping brings rice from the Southern Seas, distant timber and foreign goods into the Southern realm, and inland workshops, garrisons and academies can no longer do without them. Each province has its own powers, but production and livelihoods can hardly be separated from the common market. When ports close and trade routes are cut, the losses spread far beyond them.\n\nWhile the Ming court and Hangzhou dispute the succession, [ROOT.GetCountry.GetName] must still keep its government and forces running. Offices need paper, garrisons need recruits and arms, and academy students are moving from the lecture hall into politics. We must keep trading with willing partners and help local workshops, schools and villages through the present turmoil."
 nesnd_supply_preparations_lobby:0 "Wu shipping brings rice from the Southern Seas, timber from afar and goods from many countries into the Southern realm, and inland workshops, garrisons and academies have long depended on them. When any port closes or trade route is cut, the losses spread far beyond it. While the Ming court and Hangzhou dispute the succession, $nesnd_lobby_name_hna$, $nesnd_lobby_name_sih$ and $nesnd_lobby_name_gng$ must each keep their offices and troops supplied and protect the livelihoods of its workshops, schools and villages."
 nesnd_supply_status_war:0 "#n War has reached the trading routes.#! Requisitions and disrupted shipping have broken the previous period of stability.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_inputs:0 "#n Workshops and garrisons lack reliable supplies.#! Paper, tools and arms are straining their budgets.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_jobs:0 "#n Workshops and offices still lack workers.#! More posts must be filled to keep them running.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_livelihood:0 "#n Jobs and food remain insecure.#! Unemployment, grain prices and famine threaten commercial life.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_diplomacy:0 "Commercial contacts remain undecided. Send envoys to discuss them, or leave trade to the merchants.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_stable:0 "#p Supplies, jobs and food are becoming stable.#! Hold them steady for a season to secure lasting trade.\n$nesnd_supply_rules_link$"
 nesnd_supply_readiness_bar:0 "Foundations of trade"
 nesnd_supply_readiness_bar_desc:0 "$nesnd_supply_readiness_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_supply_continuity_bar:0 "Weeks of stable trade"
 nesnd_supply_continuity_bar_desc:0 "$nesnd_supply_continuity_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 12#!"
 nesnd_supply_invite_desc:0 "Send envoys to discuss commercial relations and improve diplomatic ties. Existing market exchange continues."
 nesnd_supply_invitation_tt:0 "The envoys arrive in seven days and serve for six months."
 nesnd_supply_no_pending_envoy_tt:0 "No trade mission is awaiting a reply"
 nesnd_supply_no_partner_tt:0 "We have no official trade liaison with another country"
 nesnd_supply_envoy_interval_tt:0 "This is our first mission, or at least #v 6 months#! have passed since we last sent envoys"
 nesnd_supply_self_available_tt:0 "We have yet to leave trade in the hands of the merchants"
 nesnd_supply_partner_valid_tt:0 "We are still in contact with our trade partner"
 nesnd_supply_trade_interval_tt:0 "This is our first proposal for reciprocal trade privileges, or at least #v 6 months#! have passed since our last proposal"
 nesnd_supply_commercial_arrangement_tt:0 "We share a market with another country, maintain contact with a trade partner, or have left trade to the merchants"
 nesnd_supply_twelve_weeks_tt:0 "Supplies, staffing, jobs and food, and trade regulations have met their requirements for #v 12 consecutive weeks#!"
 nesnd_supply_accept_tt:0 "Establish commercial contact."
 nesnd_supply_self:0 "Leave Commerce to the Merchants"
 nesnd_supply_self_desc:0 "Withdraw the special mission and pending requests, leaving merchants to continue their existing trade. Market membership and signed treaties remain unchanged."
 nesnd_supply_end_contact:0 "End Commercial Contacts"
 nesnd_supply_end_contact_desc:0 "Recall the mission and end these commercial contacts. Existing market exchange and signed treaties continue."
 nesnd_supply_end_contact_tt:0 "End these contacts. If this leaves our trade regulations unsettled, consecutive stable weeks restart. Signed treaties remain in force."
 nesnd_supply_trade:0 "Negotiate Reciprocal Trade"
 nesnd_supply_trade_desc:0 "Give the two countries’ merchants reciprocal trading advantages through a treaty."
 nesnd_supply_trade_request_tt:0 "In #v 7 days#!, propose a reciprocal trade treaty binding for #v 2 years#!. They may accept or refuse."
 nesnd_supply_finish:0 "Trade Routes Stabilise"
 nesnd_supply_finish_desc:0 "After supplies, staffing, jobs and food, and trade remain stable for #v 12 weeks#!, first completion grants #p +10%#! import and export trade advantage for #v 2 years#!. If we then enter the Jingnan War against Wu, we gain #p +10%#! training rate and #p −5%#! mobilisation goods requirements for #v 1 year#! upon joining."
 nesnd_supply_dismiss:0 "Put Trade Talks on Hold"
 nesnd_supply_dismiss_desc:0 "Recall the mission and take up trade talks again later. Existing mission expenses remain due until their term ends."
 nesnd_supply_envoys:0 "Commercial Mission Abroad"
 nesnd_supply_verified:0 "Trade Routes Reopened"
 nesnd_supply_treaty:0 "Reciprocal Trade Agreement"
 nesnd_supply_resume:0 "Renew Commercial Contacts"
 nesnd_supply_resume_desc:0 "Reconnect with merchants, secure supplies and employment, and reopen trade with other states."
 nesnd_supply.1.t:0 "Merchants Lead the Way"
 nesnd_supply.1.d:0 "Envoys from [SCOPE.sCountry('nesnd_supply_requester').GetName] have brought a request from their merchants. They hope to maintain procurement contacts between the two countries and exchange information about supplies of paper, timber and manufactured goods, preserving trading opportunities as the political situation changes.\n\nSuch contacts could win us new customers, but officials must receive the mission and merchants must do the legwork. [ROOT.GetCountry.GetName] may send someone to hear what they want to buy."
 nesnd_supply.1.f:0 "“Our merchants ask that the two countries keep open a purchasing liaison and exchange news of supplies of paper, timber and workshop goods.”\n- Merchants' request conveyed by the envoy"
 nesnd_supply.1.a:0 "Invite them to discuss it."
 nesnd_supply.1.b:0 "Our domestic affairs must come first."
 nesnd_supply.2.t:0 "A Reciprocal Trade Agreement"
 nesnd_supply.2.d:0 "[SCOPE.sCountry('nesnd_supply_requester').GetName] proposes a formal treaty granting reciprocal trade advantages. Merchants hope to expand their markets, while those buying supplies seek more stable commercial relations. Once signed, both countries will be bound by its terms."
 nesnd_supply.2.f:0 "“The two countries shall grant each other trade preferences, to be applied under this treaty from the day of signature.”\n- Draft treaty of reciprocal commerce"
 nesnd_supply.2.a:0 "Approve the treaty."
 nesnd_supply.2.b:0 "The terms need further discussion."
 nesnd_supply.3.t:0 "Trade and Daily Bread"
 nesnd_supply.3.d:0 "For the past season, workshops and garrisons in [ROOT.GetCountry.GetName] have been able to buy what they need, while schools, offices and factories have filled their posts. Merchants have renewed their trading contacts, and people across the states have supported themselves through production and exchange.\n\nThe Southern political dispute continues. The cargo ships leaving our ports give us the means to keep trading through it."
 nesnd_supply.3.f:0 "“All under heaven bustle along in pursuit of profit. All under heaven hurry to and fro for the sake of gain.”\n- Records of the Grand Historian, Biographies of the Money-Makers"
 nesnd_supply.3.a:0 "Keep trade flowing."
 nesnd_supply_invite_hna:0 "Send Envoys to [SCOPE.sCountry('nesnd_label_hna').GetName]"
 nesnd_supply_invite_sih:0 "Send Envoys to [SCOPE.sCountry('nesnd_label_sih').GetName]"
 nesnd_supply_invite_gng:0 "Send Envoys to [SCOPE.sCountry('nesnd_label_gng').GetName]"
 nesnd_supply_invite_yn1:0 "Send Envoys to [SCOPE.sCountry('nesnd_label_yn1').GetName]"
 nesnd_supply_invite_cne:0 "Send Envoys to [SCOPE.sCountry('nesnd_label_cne').GetName]"
 nesnd_supply_invite_fra:0 "Send Envoys to [SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_supply_hus_preparations:0 "The Republic’s Trade Routes"
 nesnd_supply_hus_ready_shared_status:0 "Preparations have remained stable for #v 12 weeks#!. Select “#bold Continue in the Common Market#!” to confirm the present trade regulations."
 nesnd_supply_hus_ready_autonomous_status:0 "Preparations have remained stable for #v 12 weeks#!. Select “#bold Manage Our Own Trade#!” to confirm the present trade regulations."
 nesnd_supply_hus_review_complete_tt:0 "The present trade regulations have been confirmed."
 nesnd_supply_hus_review_effect_tt:0 "Confirm the present trade regulations and complete preparations."
 nesnd_supply_hus_preparations_reason:0 "Immigrants and merchant ships built the republic's coastal towns. The war against Wu brought the states of Dongzhou together, and the alliance with $nesnd_lobby_name_cne$ opened new markets for our goods. Work in the harbours, production in the mills and the provinces' revenue now all depend on this trade.\n\nNow news of the southern succession dispute has crossed the ocean, and the once-steady trade of the world has sailed into deep and uncertain waters. To be sure, as the Southern Court's long-standing overseas 'rebel state', the republic lies an ocean away from the Middle Land and keeps its own independent course. We may remain in the common market that has grown up around the northern empire, or draw up our own terms of trade and go our own way. But this decision must be made with care, for we still have an old enemy on our own continent... What matters now is to keep the mills running and the economy moving, so that we gain the upper hand in the contest for mastery of the Dongzhou continent."
 nesnd_supply_hus_preparations_lobby:0 "Immigrants and merchant ships built the coastal towns of $nesnd_lobby_name_hus$. The states of Dongzhou came together in the war against Wu, and the alliance with $nesnd_lobby_name_cne$ opened new markets for the republic's goods. Now news of the southern succession dispute has crossed the ocean, and the republic must decide whether to stay in the common market of the northern empire. On the Dongzhou continent, meanwhile, our old enemy $nesnd_lobby_name_usa$ contends with us for mastery."
 nesnd_supply_finish_shared:0 "Continue in the Common Market"
 nesnd_supply_finish_shared_desc:0 "Continue trading in the existing common market. After #v 12 weeks#! of stable trade, first completion grants #p +15%#! import and export trade advantage for #v 2 years#!."
 nesnd_supply_finish_autonomous:0 "Manage Our Own Trade"
 nesnd_supply_finish_autonomous_desc:0 "Continue trading in the market we already control. After #v 12 weeks#! of stable trade, first completion grants #p +15%#! import and export trade advantage for #v 2 years#!."
 nesnd_supply_status_bankruptcy:0 "#n The treasury is bankrupt.#! Finances must recover before a new period of stability can be established.\n$nesnd_supply_rules_link$"
 nesnd_supply_workforce_ready_tt:0 "National workforce unemployment is at most #v 12%#!, and at most #v 20%#! in states with at least #v 50,000#! workers."
 nesnd_supply_rules_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_supply_rules Supplies, jobs and food#!#!"
 nesnd_supply_rules:0 "#bold Supplies#!\n[GetGoods('paper').GetName], [GetGoods('tools').GetName] and [GetGoods('small_arms').GetName] must have no local shortages and cost no more than #v 50%#! above base price. Dongzhou also requires [GetGoods('hardwood').GetName].\n\n#bold Buildings and workers#!\nEach required building type must have at least one building staffed to #v 75%#! without input shortages. Huguang requires a [GetBuildingType('building_university').GetName] and a [GetBuildingType('building_barrack').GetName]. Sichuan requires a [GetBuildingType('building_tooling_workshop').GetName] and either an [GetBuildingType('building_iron_mine').GetName] or a [GetBuildingType('building_logging_camp').GetName]. Guangxi requires a [GetBuildingType('building_paper_mill').GetName] and a [GetBuildingType('building_logging_camp').GetName]. Dongzhou requires a [GetBuildingType('building_port').GetName] and a [GetBuildingType('building_government_administration').GetName]. If recruitment is difficult, check [concept_pop_qualifications], [concept_building_wage] and input supplies.\n\n#bold Jobs and food#!\nUnemployed workers may be at most #v 12%#! of the national workforce. States with at least #v 50,000#! workers have a limit of #v 20%#!. [GetPopType('peasants').GetName] count as employed. There must be no famine or local grain shortage, and grain must cost no more than #v 25%#! above base price.\nUnemployed workforce: #v [Country.MakeScope.Var('nesnd_supply_unemployed').GetValue|0] / [Country.MakeScope.Var('nesnd_supply_workforce').GetValue|0]#! (#v [Country.MakeScope.Var('nesnd_supply_unemployment').GetValue|%1]#!). States above the local unemployment limit: #v [Country.MakeScope.Var('nesnd_supply_critical_states').GetValue|0]#!.\n\n#bold Stable commerce#!\nA shared market automatically meets the trade-regulations requirement. A country alone in its market may choose a contact or leave trade to its merchants. Maintain all four conditions for #v 12 weeks#!. War, bankruptcy, a change of market or failure of any condition restarts the consecutive count."
