l_english:
 nesnd_japan_war_collapse:0 "The Shogunate in Peril"
 nesnd_japan_war_collapse_reason:0 "Envoys from Kyoto are asking for reinforcements. The lords of Kanto want to know how many men will remain to defend Edo. With dispatches from both cities on the table, which domains can the Toyotomi spare for the field?"
 nesnd_japan_war_collapse_status:0 "The shogunate falls if forces on Wu’s side in the Jingnan War occupy #bold both Kyoto and Kanto#!. A Wu war demand enforced against Japan also triggers the defeat settlement."
 nesnd_xiangyang_camp_journal:0 "The Xiangyang Camp"
 nesnd_xiangyang_camp_journal_reason:0 "Xiangyang commands the Han River and the inland military roads. Its soldiers follow Chen Dongyang's reforms, opposing both the Zheng usurpation and a return to the old gentry's rule. Central supply and regular drills give this inland army the means to hold its ground."
 nesnd_xiangyang_camp:0 "The Xiangyang Camp"
 nesnd_xiangyang_camp_desc:0 "Coordinate arms and provisions, restore discipline in the camps, and hold the Han River."
 nesnd_capital_surrender_accept:0 "The cause is lost."
 nesnd_capital_surrender_tt:0 "We will be annexed by Wu."
