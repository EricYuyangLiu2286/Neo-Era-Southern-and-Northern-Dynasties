l_english:
 nesnd_japan_war_collapse:0 "The Shogunate in Peril"
 nesnd_japan_war_collapse_reason:0 "$nesnd_lobby_name_jap$ has joined the Jingnan War against $nesnd_lobby_name_usm$. If Wu's forces hold Kyoto and Kanto at the same time, the Toyotomi can no longer fight on."
 nesnd_japan_war_collapse_status:0 "The shogunate is defeated when Wu's forces occupy #bold both Kyoto and Kanto#!, or when Wu enforces a war demand on $nesnd_lobby_name_jap$."
 nesnd_xiangyang_camp_journal:0 "The Xiangyang Camp"
 nesnd_xiangyang_camp_journal_reason:0 "Xiangyang commands the Han River and the routes into the Jianghan plain, the hub through which the Southern realm moves its inland armies. The soldiers of [ROOT.GetCountry.GetName] in the camp follow Chen Dongyang's reforms and oppose both the Zheng usurpation and a return of the old gentry. Strict organisation of supply, scientific drill and the legacy of Zhu Banbo have forged the spirit of the Western Administration's army at Xiangyang."
 nesnd_xiangyang_camp_journal_lobby:0 "Xiangyang commands the Han River and the routes into the Jianghan plain, the hub through which the Southern realm moves its inland armies. The soldiers of $nesnd_lobby_name_hna$ in the camp follow Chen Dongyang's reforms and oppose both the Zheng usurpation and a restoration of the old gentry. Strict organisation of supply, scientific drill and the legacy of Zhu Banbo have shaped the spirit of the Western Administration's army at Xiangyang."
 nesnd_xiangyang_camp:0 "The Xiangyang Camp"
 nesnd_xiangyang_camp_desc:0 "Coordinate arms and provisions, restore discipline in the camps, and hold the Han River."
 nesnd_capital_surrender_accept:0 "The cause is lost."
 nesnd_capital_surrender_tt:0 "We will be annexed by Wu."
 battle_condition_nesnd_southwest_miasma:0 "Fever and Mountain Roads"
 battle_condition_nesnd_southwest_miasma_desc:0 "The mountain and rainforest roads of the southwest are rough and fever-ridden. Food and ammunition struggle to reach the front."
