 nesnd_small_states.2.far_south:0 "The sea between Australia and New Zealand has become a common trading route for their producers. Ports can hire workers and local industries have found outlets for their goods, giving the Far South more than a single centre of production on which to depend.\n\nFarmers and labourers have firmer livelihoods, and the government can draw revenue from their work. The schools and local services it hopes to maintain will depend on the goods crossing these waters, and on the people who produce them."
 nesnd_small_states.2.burma:0 "Viable industries have taken root in the upper country around $STATE_MANDALAY$ and the lower reaches at $STATE_PEGU$. Transport carries their produce to market, providing farmers, labourers and merchants with a steadier living.\n\nThese links between the upper and lower country give the government the means to attend to local affairs. With revenue to support them, administration and education can become more than aspirations. The division of that revenue will help determine how much each region gains from this growth."
 nesnd_small_states.2.siam:0 "More dependable market links now connect production in Bangkok and the provinces. The centres of population and wealth need goods from elsewhere, while provincial producers need customers if they are to pay wages and taxes.\n\nThese ties bring the government more revenue, along with competing demands on its use. The army needs supplies, and the provinces need schools and public services. Those whose work fills the treasury will expect the state to take an interest in their lives."
 nesnd_small_states.6.far_south:0 "Production and shipping between Australia and New Zealand can now support public affairs in both regions. Offices have staff and education has a firmer footing. The Far South is acquiring the revenue and trained people it needs to sustain its own affairs.\n\nThe government can speak with greater confidence abroad. Whoever sits across the negotiating table, the wealth created by these communities and the public institutions they maintain give substance to our claim to greater independence."
 nesnd_small_states.6.burma:0 "Production, transport and public services have gained a more secure footing in the upper country and the lower reaches around $STATE_PEGU$. The government has revenue, and local people can undertake administration and teaching. Relations between the two regions now extend well beyond the exchange of goods.\n\nBurma can draw on these resources to conduct its own affairs. Foreign relations will still require care, but the country has more wealth and trained people on which to rely when faced with demands from abroad."
 nesnd_small_states.6.siam:0 "Production in Bangkok and the provinces can now sustain public services, with firmer foundations for administration, education and defence. Government revenue is becoming the means to uphold our autonomy.\n\nThis achievement will hardly end disagreement. The provinces want schools and improvements, the army requires dependable supplies, and the central government has expenses of its own. The argument now concerns what kind of country this revenue should sustain as much as where the money is to come from."
 nesnd_small_livelihood_journal:0 "The Livelihood of the Country"
 nesnd_small_livelihood_journal_reason:0 "A small country's freedom of action often rests on the livelihoods of ordinary people. Farmers must be able to pay their taxes, labourers to find work, and merchants to carry goods to willing buyers before the government can afford administration, education and defence. When producers are overwhelmed by rent, debt and unemployment, every grand undertaking makes another demand on people who can scarcely bear it.\n\nForeign capital can bring money and knowledge, and an overlord's support may ease some burdens. To have a stronger voice in these relationships, the country needs viable local industries and opportunities for its people to learn new skills. The means to conduct affairs of state begin in these seemingly modest concerns."
 nesnd_small_subject_status:0 "[ROOT.GetCountry.TryGetOverlordTooltipEntry]\nPopulation living in states with unemployment at or below 10%: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]. Population in states with at least 80% market access: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]."
 nesnd_small_independent_status:0 "The country is independent. Population living in states with unemployment at or below 10%: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]. Population in states with at least 80% market access: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]."
 nesnd_small_targets_lost:0 "The selected regions no longer have the population or regional centres needed to sustain development. Wait for local conditions to recover, or select two regions within the present borders."
 nesnd_small_economy_journal:0 "Making a Living"
 nesnd_small_economy_journal_reason:0 "Government expenditure rests on the work of people who must first earn their own living. Farmers need buyers for their harvests, artisans and labourers need employment, and goods need roads and ports to reach their customers. A lasting obstruction at any point spreads hardship to others.\n\nOur existing industries provide a place to begin. When these businesses can employ people and earn an income, households will have something to put aside, and the country will have the means to consider a more distant future."
 nesnd_small_economy_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_governance_journal:0 "Local Foundations"
 nesnd_small_governance_journal_reason:0 "As industries begin to earn an income, the provinces need more people capable of managing public affairs. Tax collection, local services and the education of children cannot depend indefinitely on favours among a handful of acquaintances. Teachers and administrators need dependable salaries, while those pursuing an education need some prospect of employment when it is complete.\n\nEstablishing these institutions will give the government a lasting claim on local support. At least some of the taxes people surrender should return to them as public services on which they can depend."
 nesnd_small_governance_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_regional_economy_journal:0 "Regional Production and Markets"
 nesnd_small_regional_economy_journal_reason:0 "Centres of population and wealth need the produce of other regions, whose farms, mines, fisheries, forests and workshops in turn need wider markets. However plentiful a region's resources, they will bring little income to its inhabitants while producers remain cut off from buyers.\n\nThe government must encourage production in both regions and open the routes along which their goods can travel. A common market allows different products to complement one another, and places with related industries to divide their work. If these businesses prosper, both regions will have reason to maintain their ties."
 nesnd_small_regional_economy_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_regional_governance_journal:0 "Governing the Regions"
 nesnd_small_regional_governance_journal_reason:0 "Goods already pass between the regions, but the people who administer public affairs cannot all remain in one place. Taxes come from both regions, and administration and education need a footing in both. Otherwise, every increase in production will leave more local affairs to be decided far away.\n\nThe government needs people to undertake this work and schools to train their successors. Giving local inhabitants the skills to enter new occupations will spare the country from having to seek every capable official in the same few cities."
 nesnd_small_regional_governance_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_order_journal:0 "The Responsibilities of Self-Government"
 nesnd_small_order_journal_reason:0 "Independence or extensive autonomy allows us to decide more of our own affairs. It also places a greater share of the burden of trade and defence on our government. People expect freedom from interference to bring some improvement in their lives.\n\nIndustries need materials and customers, the provinces need schools and administrators, and the army needs support. The wealth and abilities of our people must sustain these institutions if our political freedom is to endure."
 nesnd_small_order_months_tt:0 "Accumulate 24 qualifying months"
 nesnd_small_working_status:0 "All conditions are met this month, adding to the total of qualifying months."
 nesnd_small_paused_status:0 "Some conditions are unmet this month. The total of qualifying months does not increase."
 nesnd_small_dispute_journal:0 "A Domestic Dispute"
 nesnd_small_dispute_journal_reason:0 "Hardship is encouraging local people to seek a common remedy. Some demand changes to the ownership of land and the conditions of labour. Others want a greater voice in public affairs. Burdens once borne by each household alone are becoming the demands of a movement.\n\nThe government may allow them to organise, promise a response through legislation, or send the police to silence them. Those who enjoy the existing arrangements and those who seek to change them will judge from our response whose interests the government intends to defend."
 nesnd_small_dispute_status:0 "The local movement is still waiting for its demands to be addressed."
