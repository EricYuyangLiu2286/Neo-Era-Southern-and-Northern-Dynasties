 nesnd_small_livelihood_journal:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_small_economy_name')]"
 nesnd_small_livelihood_journal_reason:0 "The treasury of [ROOT.GetCountry.GetName] is filled from what farmers, labourers and merchants earn. Goods must reach markets with buyers, and workshops and plantations must have hands and a surplus, before the government can collect its taxes and pay for administration and an army.\n\nWithin a market led by another power, merchants and guilds can grow their trade along the routes already open. The government can also begin to build a market of its own, with its own hold on materials and buyers. Whichever course it takes, the state must not fall so deep into debt that it cannot pay."
 nesnd_small_dispute_journal:0 "A Domestic Dispute"
 nesnd_small_dispute_journal_reason:0 "Hardship is encouraging local people to seek a common remedy. Some demand changes to the ownership of land and the conditions of labour. Others want a greater voice in public affairs. Burdens once borne by each household alone are becoming the demands of a movement.\n\nLandowners, employers and the holders of old privileges have no wish to give up what they have. Those who want change are waiting for the government's answer."
 nesnd_small_observation_months:0 "Qualifying Months"
 nesnd_small_qualified_month:0 "All three conditions met this month"
 nesnd_small_public:0 "Train Local People"
 nesnd_small_public_desc:0 "Local administration and industry need literate, skilled people. Fund a year of public provision to help residents qualify for new occupations."
 nesnd_small_public_tt:0 "Pay the weekly amount set at the start of the programme for 12 months, temporarily improving Qualifications Growth and Taxation Capacity. The programme cannot be cancelled early or started again while it is running."
 nesnd_small_specialise_button:0 "Build on the Present Market"
 nesnd_small_specialise_button_desc:0 "Merchants and guilds hope to expand within the present market. Support their use of established trading routes to find more buyers for local production."
 nesnd_small_specialise_button_tt:0 "Qualifications Growth improves and [concept_authority] falls by 25 for 12 months. The effect ends if the market owner changes or we gain a market of our own."
 nesnd_small_own_market_button:0 "Prepare a Market of Our Own"
 nesnd_small_own_market_button_desc:0 "Prepare a market of our own, taking responsibility for the supply of materials, production and the sale of our goods."
 nesnd_small_own_market_button_tt:0 "Preparations last 12 months and do not immediately change market ownership. If we already have our own market, public investment can begin. Qualifying industries must have no input shortages during preparations."
 nesnd_small_request_market:0 "Request Market Autonomy"
 nesnd_small_request_market_desc:0 "Ask the present market owner to let us establish our own market, taking responsibility for supply, demand and transport."
 nesnd_small_request_market_tt:0 "Ask the [concept_market_owner] to allow a [concept_market] of our own"
 nesnd_small_request_defence_tt:0 "Send the proposal for a five-year defensive treaty."
 nesnd_small_states.continue:0 "There is still much to be done."
 nesnd_small_states.4.t:0 "A Change in Market Relations"
 nesnd_small_states.4.d:0 "Our market relations have changed, ending the temporary permits under which merchants and enterprises traded in the former market. The supplies, customers and transport connections on which they relied must be secured under new circumstances.\n\nWorkshops and trading houses that cannot find new buyers may have to close, and those who work for them will have to find another living."
 nesnd_small_states.4.f:0 "“Our country now belongs to a different market, and the temporary licences we held have lapsed. Members must find raw materials, buyers and transport anew in the new market.”\n- Circular from the chamber of commerce to its members"
 nesnd_small_states.11.t:0 "A Promise Kept"
 nesnd_small_states.11.d:0 "We have enacted the legal reform we promised to the provinces. Those who organised to demand it now believe that they too can influence national affairs. They can invoke the law of the land against practices they have long endured.\n\nThose who profited from the old ways will not easily accept their loss. Political disputes will follow the new law into everyday life, and the government must see that its laws are enforced."
 nesnd_small_states.11.f:0 "“Goodness alone is not enough for government. Laws alone cannot carry themselves out.”\n- Mencius, Li Lou I"
 nesnd_small_states.12.t:0 "A Broken Promise"
 nesnd_small_states.12.d:0 "The promised deadline has passed, and the legal reform people were waiting for has not been enacted.\n\nThose who trusted the government and waited patiently are losing faith, and their unanswered demands are hardening into deeper resentment."
 nesnd_small_states.12.f:0 "“The deadline for the legal reform the government promised has passed, and it has not been carried out. We ask the government to state when it will keep its word.”\n- Petition of the people"
 nesnd_small_states.10.t:0 "Demands from Local Organisations"
 nesnd_small_states.10.land:0 "Hardship among local farmers and labourers is drawing support to the land reform movement. Ownership of the soil and control over labour determine how much they can keep after a year's work, and whether they can escape their old dependencies.\n\nThose who demand change have organised. To answer their demands, we must challenge established rights and those who hold them. If we merely ask them to endure, what reason have they to place their trust in the present order?"
 nesnd_small_states.10.labor:0 "Growing hardship among labourers has brought local support to the labour movement. Workers want a voice in wages, hours and protection at work, hoping to avoid facing their employers alone. Employers see demands that will alter their costs and their authority over labour.\n\nThe workers have organised and want the government to declare where it stands."
 nesnd_small_states.10.representation:0 "Local liberal and radical movements are seeking wider support. People excluded by their status or political qualifications want a voice in the affairs that govern their lives. Those who already hold power may have little desire to admit them.\n\nThey have organised, and they will not leave the argument on paper any longer."
 nesnd_small_states.10.f:0 "“We ask the government to reform the present system so that those who labour may keep what they earn.”\n- Petition submitted to the government by the movement"
 nesnd_small_states.10.organise:0 "Let them organise and state their demands openly."
 nesnd_small_states.10.organise_tt:0 "The relevant movement gains #p +15%#! support weight and [concept_authority] falls by #n 25#! for #v 12 months#!. #v 1%#! of the affected population becomes [concept_radical]. A local character supporting the movement, if available, gains #p +10#! Popularity for #v 12 months#!."
 nesnd_small_states.10.promise_land:0 "We shall change the tenure of the land."
 nesnd_small_states.10.promise_land_tt:0 "Reform land tenure within 24 months by enacting Peasant Proprietorship, Commercialised Agriculture or Collectivised Agriculture. The relevant [concept_interest_group] gains +2 Approval while the promise remains in force. Enacting the reform in time gains [Concept('concept_loyalist','$concept_loyalists|q$')]. If the deadline passes without reform and the demand is still unmet, [Concept('concept_radical','$concept_radicals|q$')] increase."
 nesnd_small_states.10.promise_debt:0 "Promise to end debt bondage."
 nesnd_small_states.10.promise_debt_tt:0 "Enact [GetLawType('law_slavery_banned').GetName] within 24 months. The relevant [concept_interest_group] gains +2 Approval while the promise remains in force. Enacting the reform in time gains [Concept('concept_loyalist','$concept_loyalists|q$')]. If the deadline passes without reform and the demand is still unmet, [Concept('concept_radical','$concept_radicals|q$')] increase."
 nesnd_small_states.10.promise_labor:0 "Working people deserve the protection of the law."
 nesnd_small_states.10.promise_labor_tt:0 "Reform labour rights within 24 months by enacting [GetLawType('law_regulatory_bodies').GetName] or [GetLawType('law_worker_protections').GetName]. The relevant [concept_interest_group] gains +2 Approval while the promise remains in force. Enacting the reform in time gains [Concept('concept_loyalist','$concept_loyalists|q$')]. If the deadline passes without reform and the demand is still unmet, [Concept('concept_radical','$concept_radicals|q$')] increase."
 nesnd_small_states.10.promise_caste:0 "We shall remove the restrictions of caste."
 nesnd_small_states.10.promise_caste_tt:0 "Reform the caste system within 24 months by enacting [GetLawType('law_hindu_caste_not_enforced').GetName] or [GetLawType('law_affirmative_action').GetName]. The relevant [concept_interest_group] gains +2 Approval while the promise remains in force. Enacting the reform in time gains [Concept('concept_loyalist','$concept_loyalists|q$')]. If the deadline passes without reform and the demand is still unmet, [Concept('concept_radical','$concept_radicals|q$')] increase."
 nesnd_small_states.10.promise_representation:0 "Promise a wider voice in the affairs of the country."
 nesnd_small_states.10.promise_representation_tt:0 "Widen political participation within 24 months by enacting Wealth Voting, Census Suffrage or Universal Suffrage. The relevant [concept_interest_group] gains +2 Approval while the promise remains in force. Enacting the reform in time gains [Concept('concept_loyalist','$concept_loyalists|q$')]. If the deadline passes without reform and the demand is still unmet, [Concept('concept_radical','$concept_radicals|q$')] increase."
 nesnd_small_states.10.suppress:0 "Send the police to put a stop to these organisations."
 nesnd_small_states.10.suppress_tt:0 "The relevant movement loses #n 15%#! support weight and [concept_authority] falls by #n 50#! for #v 12 months#!. #v 2%#! of the affected population becomes [concept_radical]."
 nesnd_small_states.20.t:0 "A Proposal from the Local Government"
 nesnd_small_states.20.autonomy:0 "The government of [SCOPE.sCountry('canon_sender').GetName] points to progress in its economy and administration as grounds for managing more of its own affairs. It argues that it can now bear these responsibilities, and that the overlord's restrictions should be relaxed accordingly.\n\nSome of our ministers fear that any restriction relaxed now will later be cited as a precedent for further demands."
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName] seeks a negotiated end to subjection, with its own government assuming responsibility for domestic and foreign affairs. It hopes that recognition of independence will allow the two countries to live at peace.\n\nAgreement means relinquishing our overlordship and the disputes its maintenance might provoke. Their demand reaches beyond freedom to administer a few matters locally: they wish to decide the future of their country."
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName] has asked to establish a separate market and manage its own production and trade. Its merchants and producers would have to arrange their supplies and find their buyers, changing the existing exchange of goods between our countries."
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName] seeks a defensive treaty with us, hoping for an ally it can rely on if it is attacked.\n\nOur generals will first weigh our relations with them and the strong neighbours that surround them."
 nesnd_small_accept_tt:0 "Accept the proposal."
 nesnd_small_refuse_tt:0 "Refuse the proposal. Rejecting a request for greater autonomy increases the subject's [concept_liberty_desire] and harms relations."
