 nesnd_small_states.2.far_south:0 "Australia's population and processing centres now maintain effective links with local production in New Zealand. Working ports carry goods to market. These industries support the Far South's growth and provide revenue for local services."
 nesnd_small_states.2.burma:0 "Production in the upper country around $STATE_MANDALAY$ and the lower country at $STATE_PEGU$ now reaches the market through existing transport. Better earnings for farmers and merchants support livelihoods and give the government more room to provide administration and education."
 nesnd_small_states.2.siam:0 "Production outside Bangkok is now linked to the population and fiscal centre. The existing army still draws on national revenue, while local development raises the question of how administration and education should be distributed."
 nesnd_small_states.6.far_south:0 "Production and shipping now link Australia and New Zealand, while schools and public offices can sustain local services. The government has more revenue and trained personnel with which to conduct foreign affairs and plan development in both regions."
 nesnd_small_states.6.burma:0 "Production and public services have gained a stable footing in the upper country and the lower reaches around $STATE_PEGU$. Markets and transport linking the two have increased public revenue, while schools train new personnel. Burma can use these strengths to seek better terms abroad."
 nesnd_small_states.6.siam:0 "Production, public services and defence now connect Bangkok with the provinces. Government revenue must support the army as well as schools and local administration. Its allocation remains a matter of national debate."
 nesnd_small_livelihood_journal:0 "The Livelihood of the Country"
 nesnd_small_livelihood_journal_reason:0 "Farmers, artisans and merchants bear the costs of rent, taxation and changing markets. Greater autonomy requires income from local production and people trained to staff schools and public offices. Foreign investment can bring money and expertise, and support from an overlord can ease the burden, but the country must still sustain itself through local work and enterprise."
 nesnd_small_subject_status:0 "[ROOT.GetCountry.TryGetOverlordTooltipEntry]\nPopulation living in states with unemployment at or below 10%: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]. Population in states with at least 80% market access: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]."
 nesnd_small_independent_status:0 "The country is independent. Population living in states with unemployment at or below 10%: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]. Population in states with at least 80% market access: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]."
 nesnd_small_targets_lost:0 "The selected regions no longer retain sufficient population or their actual centres. Regional work is paused. Restore the conditions or select two regions within the present territory."
 nesnd_small_economy_journal:0 "Making a Living"
 nesnd_small_economy_journal_reason:0 "Existing industries can sustain the country if they provide work, earn a profit and reach their markets."
 nesnd_small_economy_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_governance_journal:0 "Local Foundations"
 nesnd_small_governance_journal_reason:0 "The provinces need teachers, administrators and reliable public funding. Schools and government services must extend beyond the capital if more people are to gain an education and enter new occupations."
 nesnd_small_governance_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_regional_economy_journal:0 "Regional Production and Markets"
 nesnd_small_regional_economy_journal_reason:0 "The population center and the surrounding regions have different strengths in agriculture, mining, fishing, forestry and manufacturing. Transport links to the market can turn these resources into industries that supply and support one another."
 nesnd_small_regional_economy_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_regional_governance_journal:0 "Governing the Regions"
 nesnd_small_regional_governance_journal_reason:0 "Public revenue must support more than the capital. Both regions need functioning administration, while schools and universities prepare residents for new occupations."
 nesnd_small_regional_governance_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_order_journal:0 "An Order We Can Sustain"
 nesnd_small_order_journal_reason:0 "Independence or extensive autonomy gives the government more authority, along with responsibility for trade, law and defence. Local producers need dependable customers, schools need funding, and the borders need reliable allies and troops."
 nesnd_small_order_months_tt:0 "Accumulate 24 qualifying months"
 nesnd_small_working_status:0 "Conditions are met this month; observation can continue."
 nesnd_small_paused_status:0 "Some conditions are unmet this month. Previously earned qualifying months are retained."
 nesnd_small_dispute_journal:0 "A Domestic Dispute"
 nesnd_small_dispute_journal_reason:0 "Hardship and restrictive laws have given a local movement support. The government may permit organisation, promise legal reform or use the police to suppress it. Each choice affects particular interests."
 nesnd_small_dispute_status:0 "The movement is seeking support. A promise of reform is fulfilled only by an actual change in law."
 nesnd_small_observation_months:0 "Qualifying Months"
 nesnd_small_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] months"
 nesnd_small_qualified_month:0 "Construction and operating conditions met"
 nesnd_small_public:0 "Train Local People"
 nesnd_small_public_desc:0 "Administration and industry need people able to take on new duties. A year of public spending can help build those skills."
 nesnd_small_public_tt:0 "Pay the weekly quote fixed when the programme begins for 12 months. Qualifications and tax capacity receive temporary help. The programme cannot be cancelled early or duplicated."
 nesnd_small_specialise_button:0 "Specialise within the Present Market"
 nesnd_small_specialise_button_desc:0 "Merchants and guilds seek wider outlets within the present market, with greater room to manage local business."
 nesnd_small_specialise_button_tt:0 "For 12 months, qualifications improve and authority falls by 25. The arrangement ends if the market owner changes or the country controls its own market."
 nesnd_small_own_market_button:0 "Prepare a Market of Our Own"
 nesnd_small_own_market_button_desc:0 "Market autonomy requires more than permission: producers still need inputs, transport and customers."
 nesnd_small_own_market_button_tt:0 "Choose a 12-month policy without immediately changing market ownership. Public investment becomes available after actual market autonomy. Qualifying industries must have no input shortages."
 nesnd_small_retarget_button:0 "Select New Regional Centres"
 nesnd_small_retarget_button_desc:0 "The government may reorganise production and services within its present territory, but the new arrangement must prove itself."
 nesnd_small_retarget_button_tt:0 "Select the largest state and remaining directly owned states as two regions. Current regional observation resets. Another revision is unavailable for 24 months. Past rewards are not repeated."
 nesnd_small_restore_geography_button:0 "Restore the Homeland Connection"
 nesnd_small_restore_geography_button_desc:0 "Recovered regions may rejoin the homeland programme, once current transport and services can support them."
 nesnd_small_restore_geography_button_tt:0 "Only valid original homeland groups and centres can be restored. Regional observation restarts, with the same 24-month interval."
 nesnd_small_order_button:0 "Build a Sustainable Political Order"
 nesnd_small_order_button_desc:0 "Consolidate our laws, public services and defence."
 nesnd_small_order_button_tt:0 "Choose the objective matching current sovereignty and accumulate 24 qualifying months within 120 months. A change of sovereignty branch restarts observation. The shared reward is granted once."
 nesnd_small_request_autonomy:0 "Request Greater Autonomy"
 nesnd_small_request_autonomy_desc:0 "The local government seeks more authority on the strength of its practical achievements."
 nesnd_small_request_autonomy_tt:0 "Ask the actual direct overlord. Approval applies the native autonomy increase, verifies the outcome, reduces liberty desire and establishes a truce."
 nesnd_small_request_independence:0 "Negotiate Peaceful Independence"
 nesnd_small_request_independence_desc:0 "The country seeks responsibility for its own affairs and must give the overlord practical grounds to agree."
 nesnd_small_request_independence_tt:0 "Ask the actual direct overlord for peaceful independence. Success requires actual independence. Native diplomatic options remain available after refusal."
 nesnd_small_request_market:0 "Request Market Autonomy"
 nesnd_small_request_market_desc:0 "Controlling the market brings responsibility for supply and transport and requires the present market owner's agreement."
 nesnd_small_request_market_tt:0 "Ask the current [concept_market_owner] to allow a [concept_market] of our own. If no separate market has been established within thirty days of their agreement, the request will be treated as unsuccessful."
 nesnd_small_defence_fra:0 "Discuss Defence with $FRA$"
 nesnd_small_defence_fra_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_fra_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_gbr:0 "Discuss Defence with $GBR$"
 nesnd_small_defence_gbr_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_gbr_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_usm:0 "Discuss Defence with $USM$"
 nesnd_small_defence_usm_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_usm_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_mug:0 "Discuss Defence with $MUG$"
 nesnd_small_defence_mug_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_mug_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_phi:0 "Discuss Defence with $PHI$"
 nesnd_small_defence_phi_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_phi_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_dei:0 "Discuss Defence with $DEI$"
 nesnd_small_defence_dei_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_dei_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_yn1:0 "Discuss Defence with $YN1$"
 nesnd_small_defence_yn1_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_yn1_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_bur:0 "Discuss Defence with $BUR$"
 nesnd_small_defence_bur_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_bur_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_sia:0 "Discuss Defence with $SIA$"
 nesnd_small_defence_sia_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_sia_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_dai:0 "Discuss Defence with $DAI$"
 nesnd_small_defence_dai_desc:0 "Mutual defence requires two independent countries and an effective treaty."
 nesnd_small_defence_dai_tt:0 "Propose a five-year defensive treaty. It counts only after approval and actual entry into force."
 nesnd_small_defence_neighbour:0 "Seek a Neighbour's Protection"
 nesnd_small_defence_neighbour_desc:0 "Review the eligible neighbour with the best relations before making a formal proposal."
 nesnd_small_defence_neighbour_tt:0 "Review the selected neighbour before sending. Equal relations favour the country with higher GDP."
 nesnd_small_request_defence_tt:0 "Send the proposal for a five-year defensive treaty."
 nesnd_small_states.continue:0 "The work continues."
 nesnd_small_states.2.t:0 "A Firmer Livelihood"
 nesnd_small_states.2.d:0 "Production has provided a steadier livelihood for farmers and workers. These activities support revenue and skills, giving local development firmer foundations."
 nesnd_small_states.3.t:0 "People to Govern"
 nesnd_small_states.3.d:0 "Administration and education can now shoulder more local responsibilities. New occupations and knowledge give the government a practical basis for greater autonomy; how it uses them remains a political choice."
 nesnd_small_states.4.t:0 "A Change in Market Relations"
 nesnd_small_states.4.d:0 "The former owner no longer directs the country's market. The temporary arrangement with merchants and guilds has ended. Existing industries remain, while supply and transport must adapt to the new market relationship."
 nesnd_small_states.5.t:0 "An Unfinished Order"
 nesnd_small_states.5.d:0 "Years have passed without laws, markets and defence jointly sustaining the intended arrangement. The government may try again when conditions improve. Existing industries, schools and laws remain."
 nesnd_small_states.6.t:0 "An Order We Can Sustain"
 nesnd_small_states.6.d:0 "Local production, schools and administration have gained a stable footing, while foreign agreements have given the country greater room to act. The government has more revenue and trained personnel with which to face changing markets, provincial disputes and pressure from abroad."
 nesnd_small_states.11.t:0 "A Promise Fulfilled"
 nesnd_small_states.11.d:0 "The promised reform has become law. Its beneficiaries have reason to believe that their demands can be answered, while established interests face a new distribution of benefits."
 nesnd_small_states.12.t:0 "A Broken Promise"
 nesnd_small_states.12.d:0 "The promised term has passed, and the old law still binds those who sought change. The government's failure to act has deepened local resentment."
 nesnd_small_states.10.t:0 "Demands from Local Organisations"
 nesnd_small_states.10.land:0 "Rents and debt bondage weigh on local farmers and labourers. Land reformers are organising them to change who controls land and work. The government must decide how to respond to this existing movement."
 nesnd_small_states.10.labor:0 "Hardship among labourers has strengthened the labour movement. Wages, hours and protection at work have become matters of dispute. The government's approach to organisation and law will affect the balance between workers and employers."
 nesnd_small_states.10.representation:0 "An existing liberal or radical movement is seeking local support. Caste or political restrictions prevent residents from participating in public affairs. Demands for change place the distribution of power under pressure."
 nesnd_small_states.10.organise:0 "Permit local organisation."
 nesnd_small_states.10.organise_tt:0 "The relevant movement gains #p +15%#! support weight and Authority falls by #n 25#! for #v 12 months#!. #v 1%#! of the affected population becomes Radical. A local character supporting the movement, if available, gains #p +10#! Popularity for #v 12 months#!."
 nesnd_small_states.10.promise_land:0 "Promise land reform."
 nesnd_small_states.10.promise_land_tt:0 "Within 24 months, change land tenure through legislation to peasant proprietorship, commercialised agriculture or collectivised agriculture. The relevant interest group receives +2 approval in the meantime. Fulfilling the promise gains Loyalists. An unfulfilled demand at the deadline gains Radicals."
 nesnd_small_states.10.promise_debt:0 "Promise to end debt bondage."
 nesnd_small_states.10.promise_debt_tt:0 "Within 24 months, change slavery through legislation to slavery banned. The relevant interest group receives +2 approval in the meantime. Fulfilling the promise gains Loyalists. An unfulfilled demand at the deadline gains Radicals."
 nesnd_small_states.10.promise_labor:0 "Promise protection at work."
 nesnd_small_states.10.promise_labor_tt:0 "Within 24 months, change labour rights through legislation to regulatory bodies or worker protections. The relevant interest group receives +2 approval in the meantime. Fulfilling the promise gains Loyalists. An unfulfilled demand at the deadline gains Radicals."
 nesnd_small_states.10.promise_caste:0 "Promise to remove caste restrictions."
 nesnd_small_states.10.promise_caste_tt:0 "Within 24 months, change caste through legislation to caste not enforced or affirmative action. The relevant interest group receives +2 approval in the meantime. Fulfilling the promise gains Loyalists. An unfulfilled demand at the deadline gains Radicals."
 nesnd_small_states.10.promise_representation:0 "Promise wider representation."
 nesnd_small_states.10.promise_representation_tt:0 "Within 24 months, change the distribution of power through legislation to wealth voting, census suffrage or universal suffrage. The relevant interest group receives +2 approval in the meantime. Fulfilling the promise gains Loyalists. An unfulfilled demand at the deadline gains Radicals."
 nesnd_small_states.10.suppress:0 "Use the police to suppress organisation."
 nesnd_small_states.10.suppress_tt:0 "The relevant movement loses #n 15%#! support weight and Authority falls by #n 50#! for #v 12 months#!. #v 2%#! of the affected population becomes Radical."
 nesnd_small_states.20.t:0 "A Proposal from the Local Government"
 nesnd_small_states.20.autonomy:0 "The government of [SCOPE.sCountry('canon_sender').GetName] argues that its economy and administration can bear greater responsibilities and asks us to relax our control over its internal affairs. Acceptance will increase its autonomy."
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName] asks to end direct subjection peacefully and assume responsibility for its own affairs. Relinquishing overlordship will change both countries' rights and obligations and may settle the dispute through negotiation."
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName] asks to control its own market. Local merchants and producers would take responsibility for supplies and customers. We must decide whether to grant that right."
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName] proposes a defensive treaty. Both countries will assume the obligations of its effective terms, and war may put their economic and diplomatic ties to the test."
 nesnd_small_accept_tt:0 "Accept the proposed autonomy, independence, market or defence arrangement."
 nesnd_small_refuse_tt:0 "Refuse the proposal. Rejecting a request for greater autonomy increases the subject's Liberty Desire and harms relations."
 nesnd_small_states.21.t:0 "Choosing a Neighbour"
 nesnd_small_states.21.d:0 "[SCOPE.sCountry('small_receiver').GetName] is the eligible neighbour with the best current relations. The government may send a formal defensive proposal or leave the matter for now."
 nesnd_small_states.21.a:0 "Send the formal proposal."
 nesnd_small_states.21.b:0 "Leave it for now."
