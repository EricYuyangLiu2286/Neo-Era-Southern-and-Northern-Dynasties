 nesnd_small_states.continue:0 "There is still much to be done."
 nesnd_small_states.2.t:0 "A Firmer Livelihood"
 nesnd_small_states.2.d:0 "Our existing industries are beginning to provide farmers and labourers with a steadier livelihood. Goods can reach the market, employers can pay wages, and more households can support themselves through their work.\n\nTheir greater security also gives the government a dependable source of taxation. Every sum entering the treasury was once part of a household's living. Peace in the provinces and stability at home require the people who create this wealth to be able to carry on their work."
 nesnd_small_states.3.t:0 "Hands for Local Government"
 nesnd_small_states.3.d:0 "Administration and education now have foundations the country can sustain. Public affairs have people to attend to them, knowledge has a means of spreading, and local industries can hope to find workers trained for new occupations.\n\nThe more people learn, the more readily they can take part in national life and explain what they expect of their government. These institutions give the state more capable hands, while requiring those in power to attend more closely to the livelihoods of the governed."
 nesnd_small_states.4.t:0 "A Change in Market Relations"
 nesnd_small_states.4.d:0 "Our market relations have changed, bringing an end to the temporary arrangements under which merchants and enterprises operated in the former market. The supplies, customers and transport connections on which they relied must be secured under new circumstances.\n\nA government may change its direction, but producers must still find buyers for their goods. Their ability to carry on trading will shape employment and income in the provinces."
 nesnd_small_states.5.t:0 "An Unfinished Order"
 nesnd_small_states.5.d:0 "Years have passed without the government bringing law, trade and local enterprise together to sustain its intended programme of self-government. Existing industries and schools can continue their work, but the conditions needed to support the country's affairs remain incomplete.\n\nThe undertaking must be deferred. It may be resumed when the necessary conditions are in place. Meanwhile, the wealth and skills already acquired will need to be sustained through the daily life of the country."
 nesnd_small_states.6.t:0 "An Order We Can Sustain"
 nesnd_small_states.6.d:0 "Local industries can now support education and administration, and the country has the market connections and defensive strength needed to sustain its autonomy. With trained people and revenue at its disposal, the government has more to rely on in its dealings with foreign powers.\n\nThe public has paid for these achievements through taxes and labour. What people hope to receive in return is a country in which they can earn their living in peace."
 nesnd_small_states.11.t:0 "A Promise Fulfilled"
 nesnd_small_states.11.d:0 "The government has enacted the legal reform it promised to the provinces. Those who organised to demand it now have reason to believe that they can influence national affairs. Practices they once had to endure can at last be challenged in the name of the law.\n\nThe beneficiaries of the old arrangements will hardly forget their loss. Political disputes will follow the new law into everyday life, and the government must ensure that its legislation is enforced."
 nesnd_small_states.12.t:0 "A Broken Promise"
 nesnd_small_states.12.d:0 "The promised deadline has passed, but the legal reform people awaited has still not arrived. The gentlemen in the capital asked the provinces for patience. The old restrictions remain, and they have little to show for the trust they demanded.\n\nThose who believed the government are losing faith. The passage of a deadline has done nothing to ease their hardships, and unanswered demands are hardening into deeper resentment..."
 nesnd_small_states.10.t:0 "Demands from Local Organisations"
 nesnd_small_states.10.land:0 "Hardship among local farmers and labourers is drawing support to the land reform movement. Ownership of the soil and control over labour determine how much they can keep after a year's work, and whether they can escape their old dependencies.\n\nThose who demand change have organised. To answer their demands, the government must challenge established rights and those who hold them. If we merely ask them to endure, what reason have they to place their trust in the present order?"
 nesnd_small_states.10.labor:0 "Growing hardship among labourers has brought local support to the labour movement. Workers want a voice in wages, hours and protection at work, hoping to avoid facing their employers alone. Employers see demands that will alter their costs and their authority over labour.\n\nThe government must decide how to treat these organisations. Allowing workers to speak, promising legislation or sending in the police will shape the means by which both sides can defend their interests."
 nesnd_small_states.10.representation:0 "Local liberal and radical movements are seeking wider support. People excluded by their status or political qualifications want a voice in the affairs that govern their lives. Those who already hold power may have little desire to admit them.\n\nThe advocates of wider participation have organised, and the government can no longer leave the argument on paper. Whether it permits their activities and is prepared to change the law will determine how these people regard the state."
 nesnd_small_states.10.organise:0 "Let them organise and state their demands openly."
 nesnd_small_states.10.organise_tt:0 "The relevant movement gains #p +15%#! support weight and Authority falls by #n 25#! for #v 12 months#!. #v 1%#! of the affected population becomes Radical. A local character supporting the movement, if available, gains #p +10#! Popularity for #v 12 months#!."
 nesnd_small_states.10.promise_land:0 "We shall change the tenure of the land."
 nesnd_small_states.10.promise_land_tt:0 "Reform land tenure within 24 months by enacting Peasant Proprietorship, Commercialized Agriculture or Collectivized Agriculture. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_debt:0 "Promise to end debt bondage."
 nesnd_small_states.10.promise_debt_tt:0 "Abolish slavery through legislation within 24 months. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_labor:0 "Working people deserve the protection of the law."
 nesnd_small_states.10.promise_labor_tt:0 "Reform labour rights within 24 months by enacting Regulatory Bodies or Workers' Protections. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_caste:0 "We shall remove the restrictions of caste."
 nesnd_small_states.10.promise_caste_tt:0 "Reform the caste system within 24 months by enacting Caste Not Enforced or Affirmative Action. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_representation:0 "Promise a wider voice in the affairs of the country."
 nesnd_small_states.10.promise_representation_tt:0 "Widen political participation within 24 months by enacting Wealth Voting, Census Suffrage or Universal Suffrage. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.suppress:0 "Send the police to put a stop to these organisations."
 nesnd_small_states.10.suppress_tt:0 "The relevant movement loses #n 15%#! support weight and Authority falls by #n 50#! for #v 12 months#!. #v 2%#! of the affected population becomes Radical."
 nesnd_small_states.20.t:0 "A Proposal from the Local Government"
 nesnd_small_states.20.autonomy:0 "The government of [SCOPE.sCountry('canon_sender').GetName] points to progress in its economy and administration as grounds for managing more of its own affairs. It argues that it can now bear these responsibilities, and that the overlord's restrictions should be relaxed accordingly.\n\nAcceptance will grant the local government greater autonomy. We must judge whether less interference will preserve this relationship, and how much we are prepared to spend to retain our present authority."
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName] seeks a negotiated end to subjection, with its own government assuming responsibility for domestic and foreign affairs. It hopes that recognition of independence will allow the two countries to live at peace.\n\nAgreement means relinquishing our overlordship and the disputes its maintenance might provoke. Their demand reaches beyond freedom to administer a few matters locally: they wish to decide the future of their country."
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName] has asked to establish a separate market and manage its own production and trade. Its merchants and producers would have to arrange their supplies and find their buyers, changing the existing exchange of goods between our countries.\n\nWe must decide whether to grant this freedom."
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName] seeks a defensive treaty with our country. It hopes to gain an ally on whom it can depend, while we would gain a partner in resisting attacks from abroad.\n\nOnce a treaty is signed, an attack on our partner may bring us into war. This friendly proposal asks something of our army and treasury as well."
 nesnd_small_accept_tt:0 "Accept the proposed arrangement."
 nesnd_small_refuse_tt:0 "Refuse the proposal. Rejecting a request for greater autonomy increases the subject's Liberty Desire and harms relations."
 nesnd_small_states.21.t:0 "Choosing a Neighbour"
 nesnd_small_states.21.d:0 "The government is preparing to propose a common defence agreement to [SCOPE.sCountry('small_receiver').GetName]. Relations are friendly and our territories lie close together. Armies able to support one another would give a foreign aggressor reason to hesitate.\n\nThe envoys have drawn up their proposal and await our decision."
 nesnd_small_states.21.a:0 "Send the formal proposal."
 nesnd_small_states.21.b:0 "Leave it for now."
