 nesnd_small_public:0 "Train Local People"
 nesnd_small_public_desc:0 "Local administration and industry need literate, skilled people. Fund a year of public provision to help residents qualify for new occupations."
 nesnd_small_public_tt:0 "Pay the weekly amount set at the start of the programme for 12 months, temporarily improving Qualifications Growth and Taxation Capacity. The programme cannot be cancelled early or started again while it is running."
 nesnd_small_specialise_button:0 "Build on the Present Market"
 nesnd_small_specialise_button_desc:0 "Merchants and guilds hope to expand within the present market. Support their use of established trading routes to find more buyers for local production."
 nesnd_small_specialise_button_tt:0 "Qualifications Growth improves and Authority falls by 25 for 12 months. The arrangement ends if the market owner changes or we gain a market of our own."
 nesnd_small_own_market_button:0 "Prepare a Market of Our Own"
 nesnd_small_own_market_button_desc:0 "Prepare a market of our own, taking responsibility for the supply of materials, production and the sale of our goods."
 nesnd_small_own_market_button_tt:0 "Preparations last 12 months and do not immediately change market ownership. If we already have our own market, public investment can begin. Qualifying industries must have no input shortages during preparations."
 nesnd_small_retarget_button:0 "Redraw Development Areas"
 nesnd_small_retarget_button_desc:0 "Set separate development targets for the most populous state and for the remaining populated states together."
 nesnd_small_retarget_button_tt:0 "Make the most populous state we own one region, and our remaining states the other, selecting new centres for both. Current regional qualifying months reset to zero. Another revision is unavailable for 24 months. Rewards already received cannot be claimed again."
 nesnd_small_restore_geography_button:0 "Restore the Homeland Connection"
 nesnd_small_restore_geography_button_desc:0 "Bring the two homeland regions back into a common undertaking, restoring the recovered territories to the economic and public life of the country."
 nesnd_small_restore_geography_button_tt:0 "Once the original homeland regions again meet the population and regional-centre requirements, restore their development targets and begin accumulating qualifying months anew. The 24-month interval between revisions still applies."
 nesnd_small_order_button:0 "Sustain Our Self-Government"
 nesnd_small_order_button_desc:0 "Use our present autonomy to develop our laws, market, public services and defence."
 nesnd_small_order_button_tt:0 "Begin development as an independent or highly autonomous country, accumulating 24 qualifying months within 120 months. Qualifying months must be accumulated anew if our independent or subject status changes, or if we lose our high autonomy. The completion reward can be claimed only once."
 nesnd_small_request_autonomy:0 "Request Greater Autonomy"
 nesnd_small_request_autonomy_desc:0 "Point to the strength of our local economy and administration, and ask the overlord to let us manage more of our own affairs."
 nesnd_small_request_autonomy_tt:0 "Ask our direct overlord for greater autonomy. Approval increases autonomy, reduces Liberty Desire and establishes a truce with the overlord."
 nesnd_small_request_independence:0 "Negotiate Peaceful Independence"
 nesnd_small_request_independence_desc:0 "Propose peaceful independence to the overlord, seeking a negotiated end to subjection and responsibility for our own domestic and foreign affairs."
 nesnd_small_request_independence_tt:0 "Ask our direct overlord to agree to peaceful independence. Diplomatic means of seeking autonomy remain available if the proposal is refused."
 nesnd_small_request_market:0 "Request Market Autonomy"
 nesnd_small_request_market_desc:0 "Ask the present market owner to let us establish our own market, taking responsibility for supply, demand and transport."
 nesnd_small_request_market_tt:0 "Ask the [concept_market_owner] to allow a [concept_market] of our own"
