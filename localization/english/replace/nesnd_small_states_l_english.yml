 nesnd_small_defence_neighbour:0 "Discuss Defence with a Neighbour"
 nesnd_small_defence_neighbour_desc:0 "Seek a friendly neighbour with whom to arrange common defence against attack."
 nesnd_small_defence_neighbour_tt:0 "Review the eligible neighbour with the best relations before deciding whether to propose a defensive treaty. If relations are equal, the country with the higher GDP is chosen."
 nesnd_small_request_defence_tt:0 "Send the proposal for a five-year defensive treaty."
 nesnd_small_states.continue:0 "There is still much to be done."
 nesnd_small_states.2.t:0 "A Firmer Livelihood"
 nesnd_small_states.2.d:0 "Our industries have begun to give farmers and labourers a steady way to make a living. Goods find buyers, employers can pay wages, and more and more households live by their own work.\n\nWith these households settled, the treasury has a tax base it can count on."
 nesnd_small_states.3.t:0 "Hands for Local Government"
 nesnd_small_states.3.d:0 "The offices and schools are open at last, and they can be kept open. Public business has people to handle it, books have teachers, and the workshops are starting to find hands who can read and know a trade.\n\nThe more people read, the more clearly they can say what they want from their government."
 nesnd_small_states.4.t:0 "A Change in Market Relations"
 nesnd_small_states.4.d:0 "We have changed markets, and the temporary deals that merchants and companies struck under the old one have lapsed. Materials, customers and transport must all be found again in the new market.\n\nThe government can change course in a moment; the producers' goods are still sitting in their warehouses."
 nesnd_small_states.5.t:0 "An Unfinished Order"
 nesnd_small_states.5.d:0 "Years have gone by, and law, trade and local industry have still not managed to carry our programme of self-government. The workshops and schools we built go on working, but the conditions the state needs have never all come together.\n\nThe undertaking must be set aside for now. When the conditions are met, it can be taken up again."
 nesnd_small_states.6.t:0 "An Order We Can Sustain"
 nesnd_small_states.6.d:0 "Local industry can pay for schools and offices, and our markets and defences are enough to stand on our own. With people and money in hand, the government has more to bargain with when it deals with foreign powers.\n\nThese savings were built up by the people, tax by tax and day's work by day's work."
 nesnd_small_states.11.t:0 "A Promise Fulfilled"
 nesnd_small_states.11.d:0 "The government has carried out the legal reform it promised the provinces. Those who organised for it now know they can move national policy. What they once had to swallow, they can now challenge in the name of the law.\n\nThe masters who lost by it will not let the matter rest. The new law is on the books; now someone has to enforce it."
 nesnd_small_states.12.t:0 "A Broken Promise"
 nesnd_small_states.12.d:0 "The promised deadline has passed, but the legal reform people awaited has still not arrived. The gentlemen in the capital asked the provinces for patience. The old restrictions remain, and they have little to show for the trust they demanded.\n\nThose who believed the government are losing faith. The passage of a deadline has done nothing to ease their hardships, and unanswered demands are hardening into deeper resentment..."
 nesnd_small_states.10.t:0 "Demands from Local Organisations"
 nesnd_small_states.10.land:0 "Farmers and labourers in the provinces are struggling, and the land reform movement is gaining support. Who owns the land and who commands the labour decide how much they keep after a year's toil, and whether they can ever be free of their old masters.\n\nThose who want change have organised. If we tell them to keep enduring, why should they go on believing in this order?"
 nesnd_small_states.10.labor:0 "Labourers' lives are growing harder, and the labour movement has won hearts in the provinces. Workers want to bargain over pay, hours and safety at work, and no longer face their employers one by one. To the employers, these demands strike at their profits and at their command over their workers."
 nesnd_small_states.10.representation:0 "Local liberal and radical movements are rallying support. Those shut out by birth or political qualification want a say in the affairs that rule their lives; those already inside are in no hurry to make room for them.\n\nThey have organised, and the argument can no longer be kept on paper."
 nesnd_small_states.10.organise:0 "Let them organise and state their demands openly."
 nesnd_small_states.10.organise_tt:0 "The relevant movement gains #p +15%#! support weight and Authority falls by #n 25#! for #v 12 months#!. #v 1%#! of the affected population becomes Radical. A local character supporting the movement, if available, gains #p +10#! Popularity for #v 12 months#!."
 nesnd_small_states.10.promise_land:0 "We shall change the tenure of the land."
 nesnd_small_states.10.promise_land_tt:0 "Reform land tenure within 24 months by enacting Peasant Proprietorship, Commercialized Agriculture or Collectivized Agriculture. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_debt:0 "Promise to end debt bondage."
 nesnd_small_states.10.promise_debt_tt:0 "Abolish slavery through legislation within 24 months. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_labor:0 "Working people deserve the protection of the law."
 nesnd_small_states.10.promise_labor_tt:0 "Reform labour rights within 24 months by enacting Regulatory Bodies or Workers' Protections. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_caste:0 "We shall remove the restrictions of caste."
 nesnd_small_states.10.promise_caste_tt:0 "Reform the caste system within 24 months by enacting Caste Not Enforced or Affirmative Action. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.promise_representation:0 "Promise a wider voice in the affairs of the country."
 nesnd_small_states.10.promise_representation_tt:0 "Widen political participation within 24 months by enacting Wealth Voting, Census Suffrage or Universal Suffrage. The relevant Interest Group gains +2 Approval while the promise remains in force. Enacting the reform in time gains Loyalists. If the deadline passes without reform and the demand remains unresolved, Radicals increase."
 nesnd_small_states.10.suppress:0 "Send the police to put a stop to these organisations."
 nesnd_small_states.10.suppress_tt:0 "The relevant movement loses #n 15%#! support weight and Authority falls by #n 50#! for #v 12 months#!. #v 2%#! of the affected population becomes Radical."
 nesnd_small_states.20.t:0 "A Proposal from the Local Government"
 nesnd_small_states.20.autonomy:0 "The government of [SCOPE.sCountry('canon_sender').GetName] cites the progress of its economy and administration as grounds for running more of its own affairs. By its account, it can bear these responsibilities, and the overlord's restrictions ought to be loosened.\n\nIf we agree, its autonomy will rise one step."
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName] asks to negotiate an end to its subordination, with its own government taking charge of affairs at home and abroad, and the two countries remaining at peace after independence.\n\nWhat they want this time is to decide their country's future for themselves. To agree is to give up our overlordship, and with it the quarrels we might fight to keep it."
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName] asks to set up a separate market and run its own production and trade. Its merchants would arrange their own materials and buyers, and the existing flow of goods between our countries would change with it."
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName] asks for a defensive treaty with our country. They want an ally they can count on.\n\nOnce the treaty is signed, an attack on them may draw our army into war."
 nesnd_small_accept_tt:0 "Accept the proposed arrangement."
 nesnd_small_refuse_tt:0 "Refuse the proposal. Rejecting a request for greater autonomy increases the subject's Liberty Desire and harms relations."
 nesnd_small_states.21.t:0 "Choosing a Neighbour"
 nesnd_small_states.21.d:0 "The government means to propose a common defence to [SCOPE.sCountry('small_receiver').GetName]. Our countries are on good terms and our borders lie close; if our armies can support each other, an aggressor will have to think twice.\n\nThe envoy's letter is already drafted."
 nesnd_small_states.21.a:0 "Send the formal proposal."
 nesnd_small_states.21.b:0 "Leave it for now."
