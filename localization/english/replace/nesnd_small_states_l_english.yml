 nesnd_small_dispute_ignored_tt:0 "The time to answer has passed without any decision from the government, and the original grievance remains."
 nesnd_small_invest_button:0 "Invite Foreign Investment"
 nesnd_small_invest_button_tt:0 "Up to three countries we can invite are put forward, those with the best relations first. We then choose which one to approach."
 nesnd_small_invest_available_tt:0 "There is at least one country we can invite to invest"
 nesnd_small_defence_button:0 "Seek a Defensive Pact"
 nesnd_small_defence_button_desc:0 "A small country's army can hardly hold off a strong neighbour alone. A common defence agreement with a friendly country lets the two armies support each other."
 nesnd_small_defence_button_tt:0 "Up to three countries we can approach are put forward, those with the best relations first. We then choose which one to offer a five-year defensive treaty."
 nesnd_small_defence_available_tt:0 "There is at least one country we can offer a defensive treaty"
 nesnd_small_states.23.t:0 "Choosing an Investor"
 nesnd_small_states.23.d:0 "The government of [ROOT.GetCountry.GetName] means to invite foreign capital to open works and build roads and railways. Merchants and banks from several countries might be willing to put up the money, and our envoys must first decide which country to approach."
 nesnd_small_states.23.f:0 "'Our country welcomes foreign capital to open works and build roads.'\n— A note from the government to the foreign legations"
 nesnd_small_states.23.1:0 "Invite [SCOPE.sCountry('small_invest_1').GetName]"
 nesnd_small_states.23.2:0 "Invite [SCOPE.sCountry('small_invest_2').GetName]"
 nesnd_small_states.23.3:0 "Invite [SCOPE.sCountry('small_invest_3').GetName]"
 nesnd_small_states.23.e:0 "Not yet."
 nesnd_small_states.24.t:0 "Choosing a Defence Partner"
 nesnd_small_states.24.d:0 "The government of [ROOT.GetCountry.GetName] is preparing to offer a five-year defensive treaty. Several countries are on friendly terms with us or share our borders. If our armies could support each other, a foreign aggressor would have reason to hesitate. Our envoys must first decide which country to approach."
 nesnd_small_states.24.f:0 "“The cheekbone and the jaw depend on each other. When the lips are gone, the teeth are cold.”\n- Zuo Zhuan, Fifth Year of Duke Xi (a proverb quoted by Gong Zhiqi)"
 nesnd_small_states.24.1:0 "Approach [SCOPE.sCountry('small_defence_1').GetName]"
 nesnd_small_states.24.2:0 "Approach [SCOPE.sCountry('small_defence_2').GetName]"
 nesnd_small_states.24.3:0 "Approach [SCOPE.sCountry('small_defence_3').GetName]"
 nesnd_small_states.24.e:0 "Not yet."
