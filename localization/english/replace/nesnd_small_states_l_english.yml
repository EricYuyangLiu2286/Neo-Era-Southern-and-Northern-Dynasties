 nesnd_small_states.2.far_south:0 "More and more cargo ships are crossing the sea between Australia and New Zealand. The ports can afford to hire dockhands, the interior has found buyers for its produce, and the Far South no longer lives off a single source of wealth.\n\nFarmers and labourers have a surer living, and the government's revenue has grown with it. The schools and local services of the years ahead will depend on the goods carried over this sea, and on the people who produce them."
 nesnd_small_states.2.burma:0 "Upriver at $STATE_MANDALAY$ and downriver at $STATE_PEGU$, industries have found their feet. Transport carries the produce of both to market, and farmers, labourers and merchants all have money coming in.\n\nNow that taxes have somewhere to come from, offices and schools are more than talk. But how that money is shared out, upriver and downriver each have their own reckoning."
 nesnd_small_states.2.siam:0 "Trade between Bangkok and the outer provinces has settled into a steady course. The crowded, wealthy capital needs what the provinces produce; the provincial workshops and estates, with a market at last, can pay wages and pay their taxes.\n\nOnce money reached the treasury, the hands held out for it soon followed: the army wants its pay, and the provinces want schools and funds for public business. Those who earned this revenue for the country now expect the country to do something for their lives in return."
 nesnd_small_states.6.far_south:0 "The production and shipping of Australia and New Zealand can now pay for public affairs in both. The offices are staffed and the schools are open; the Far South earns its own money and trains its own people.\n\nThe government stands a little straighter when it deals with foreign powers. The wealth these communities have built is the ground on which the Far South claims its independence."
 nesnd_small_states.6.burma:0 "Production, transport and public business have found firm footing upriver and downriver at $STATE_PEGU$. The treasury has an income, local people are serving as officials and teachers, and the two halves of the country now exchange far more than goods.\n\nBurma can run its own affairs on these savings. When foreign powers make their next demand, the court will have both money and men behind it."
 nesnd_small_states.6.siam:0 "Production in Bangkok and the outer provinces can now pay for public business, and administration, schools and defence all have something to stand on. Little by little, the treasury's income is turning into the means for Siam to stand alone.\n\nMore money has brought more quarrels. The provinces want schools and public works, the army wants its pay on time, and the capital has bills of its own. The argument is no longer only about where the money comes from, but about what kind of Siam it should build."
 nesnd_small_livelihood_journal:0 "The Livelihood of the Country"
 nesnd_small_livelihood_journal_reason:0 "A small country's independence rests on the ordinary family's rice bowl. Only when farmers can pay their taxes, labourers can find work and merchants can carry goods to a buyer can the government afford its officials, schools and soldiers. If those who produce are crushed under rent, debt and idleness, every great affair of state can only be squeezed out of them.\n\nForeign capital brings money and know-how, and the overlord is willing to carry part of the load. But to be heard among these powers, the country's industries must run on their own, and its people must learn new skills."
 nesnd_small_subject_status:0 "[ROOT.GetCountry.TryGetOverlordTooltipEntry]\nPopulation living in states with unemployment at or below 10%: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]. Population in states with at least 80% market access: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]."
 nesnd_small_independent_status:0 "The country is independent. Population living in states with unemployment at or below 10%: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]. Population in states with at least 80% market access: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]."
 nesnd_small_targets_lost:0 "The selected regions no longer have the population or regional centres needed to sustain development. Wait for local conditions to recover, or select two regions within the present borders."
 nesnd_small_economy_journal:0 "Making a Living"
 nesnd_small_economy_journal_reason:0 "The treasury's money comes from what the people produce, and the producers must first feed themselves. Farmers must sell their harvest, artisans and labourers need work, and goods must get over the roads and onto the ships before they reach a buyer. Let any link stay blocked for long, and poverty passes all the way down the chain.\n\nWe start with the industries we already have. Once the workshops can hire people and turn a profit, households can put something by, and only then can the country speak of the future."
 nesnd_small_economy_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_governance_journal:0 "Local Foundations"
 nesnd_small_governance_journal_reason:0 "Now that industry earns an income, the provinces are short of people who can get things done. Collecting taxes, running public business and teaching children cannot depend for ever on favours from a few acquaintances. Teachers and clerks need salaries paid on time, and students need to see where their learning will take them.\n\nAt least part of the taxes people hand over ought to come back to them as schools and public offices they can use."
 nesnd_small_governance_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_regional_economy_journal:0 "Regional Production and Markets"
 nesnd_small_regional_economy_journal_reason:0 "The crowded, wealthy places need the produce of other regions, and the farms, mines, fisheries, forests and workshops of those regions need bigger markets. While producers and buyers stay apart, no amount of wealth in the ground will put money in the inhabitants' pockets.\n\nProduction must be built up in both regions, and the road between them opened. Regions with different produce can trade what each lacks; those with similar trades can divide the work. Keep the business going long enough, and neither region can do without the other."
 nesnd_small_regional_economy_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_regional_governance_journal:0 "Governing the Regions"
 nesnd_small_regional_governance_journal_reason:0 "Goods already move between the two regions, but the people who run public affairs cannot all crowd into one place. Taxes are raised in both, so offices and schools must take root in both. Otherwise, the more the provinces produce, the more of their business must be referred to someone far away.\n\nThe country needs people to do the work, and schools to train those who will follow them. When local people can take on new posts, the country need no longer search the same few cities for every capable hand."
 nesnd_small_regional_governance_months_tt:0 "Accumulate 12 qualifying months"
 nesnd_small_order_journal:0 "The Responsibilities of Self-Government"
 nesnd_small_order_journal_reason:0 "Independence, or broad autonomy, means deciding many things for ourselves, and carrying the burden of trade and defence on our own shoulders. The people want to be free of outside meddling; even more, they want their lives to get better.\n\nThe workshops need materials and buyers, the provinces need schools and officials, and the army must be paid. Only if the country's own resources can bear all this will self-rule be more than a phrase."
 nesnd_small_order_months_tt:0 "Accumulate 24 qualifying months"
 nesnd_small_working_status:0 "All conditions are met this month, adding to the total of qualifying months."
 nesnd_small_paused_status:0 "Some conditions are unmet this month. The total of qualifying months does not increase."
 nesnd_small_dispute_journal:0 "A Domestic Dispute"
 nesnd_small_dispute_journal_reason:0 "When life becomes unbearable, people in the provinces band together to find a way out. Some want new rules for land and hired labour; others want a say in national affairs. Hardships once suffered behind each family's closed door have become the demands of a movement.\n\nPermit them to organise, promise legislation, or call in the police: whatever the government does, landlords, employers and those who want change will all see whose side it is on."
 nesnd_small_dispute_status:0 "The local movement is still waiting for its demands to be addressed."
 nesnd_small_observation_months:0 "Qualifying Months"
 nesnd_small_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] months"
 nesnd_small_qualified_month:0 "Development conditions met"
 nesnd_small_public:0 "Train Local People"
 nesnd_small_public_desc:0 "Offices and workshops alike lack people who can read and have a trade. Spend a year of public funds teaching residents new occupations."
 nesnd_small_public_tt:0 "Pay the weekly amount set at the start of the programme for 12 months, temporarily improving Qualifications Growth and Taxation Capacity. The programme cannot be cancelled early or started again while it is running."
 nesnd_small_specialise_button:0 "Build on the Present Market"
 nesnd_small_specialise_button_desc:0 "Merchants and guilds want to grow their business within the market we already belong to. Follow the existing trade routes and find more buyers for local goods."
 nesnd_small_specialise_button_tt:0 "Qualifications Growth improves and Authority falls by 25 for 12 months. The arrangement ends if the market owner changes or we gain a market of our own."
 nesnd_small_own_market_button:0 "Prepare a Market of Our Own"
 nesnd_small_own_market_button_desc:0 "Open a market of our own, and keep materials, production and sales in our own hands."
 nesnd_small_own_market_button_tt:0 "Preparations last 12 months and do not immediately change market ownership. If we already have our own market, public investment can begin. Qualifying industries must have no input shortages during preparations."
 nesnd_small_retarget_button:0 "Redraw Development Areas"
 nesnd_small_retarget_button_desc:0 "Set separate development targets for the most populous state and for the remaining populated states together."
 nesnd_small_retarget_button_tt:0 "Make the most populous state we own one region, and our remaining states the other, selecting new centres for both. Current regional qualifying months reset to zero. Another revision is unavailable for 24 months. Rewards already received cannot be claimed again."
 nesnd_small_restore_geography_button:0 "Restore the Homeland Connection"
 nesnd_small_restore_geography_button_desc:0 "Bring the two homeland regions back into a common undertaking, restoring the recovered territories to the economic and public life of the country."
 nesnd_small_restore_geography_button_tt:0 "Once the original homeland regions again meet the population and regional-centre requirements, restore their development targets and begin accumulating qualifying months anew. The 24-month interval between revisions still applies."
 nesnd_small_order_button:0 "Sustain Our Self-Government"
 nesnd_small_order_button_desc:0 "Now that we govern ourselves, our laws, market, public business and defence are ours alone to run."
 nesnd_small_order_button_tt:0 "Begin development as an independent or highly autonomous country, accumulating 24 qualifying months within 120 months. Qualifying months must be accumulated anew if our independent or subject status changes, or if we lose our high autonomy. The completion reward can be claimed only once."
 nesnd_small_request_autonomy:0 "Request Greater Autonomy"
 nesnd_small_request_autonomy_desc:0 "We can collect our own taxes and staff our own offices. It is time the overlord handed more of our affairs back to us."
 nesnd_small_request_autonomy_tt:0 "Ask our direct overlord for greater autonomy. Approval increases autonomy, reduces Liberty Desire and establishes a truce with the overlord."
 nesnd_small_request_independence:0 "Negotiate Peaceful Independence"
 nesnd_small_request_independence_desc:0 "Negotiate with the overlord and end our subordination with dignity, taking full charge of our own affairs at home and abroad."
 nesnd_small_request_independence_tt:0 "Ask our direct overlord to agree to peaceful independence. Diplomatic means of seeking autonomy remain available if the proposal is refused."
 nesnd_small_request_market:0 "Request Market Autonomy"
 nesnd_small_request_market_desc:0 "Ask the owner of our market to let us set up on our own, running supply, demand and transport ourselves."
 nesnd_small_request_market_tt:0 "Ask the current [concept_market_owner] to allow a [concept_market] of our own. If no separate market has been established within thirty days of their agreement, the request will be treated as unsuccessful."
 nesnd_small_defence_fra:0 "Discuss Defence with $FRA$"
 nesnd_small_defence_fra_desc:0 "Negotiate a defensive treaty, agreeing to stand together against attacks from abroad."
 nesnd_small_defence_fra_tt:0 "Propose a five-year defensive treaty. The treaty is concluded if the other country agrees."
