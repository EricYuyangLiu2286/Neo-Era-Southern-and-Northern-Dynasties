l_english:
 nesnd_shu_army_journal:0 "The Army of Shu"
 nesnd_shu_army_journal_reason:0 "Shu is ringed by mountains: north through Jiange lies Hanzhong, east through the Kui Gate lies Chu. The Shu garrison has long held these passes. Xiao Huli once stopped the Northern Dynasty at Jiange and even pushed back to the walls of Hanzhong. Now that the Jingnan War has begun, the provincial government has turned the northern garrisons east and raises arms and grain locally, without waiting for convoys from Jiangnan.\n\nAs long as we remain in the Jingnan War, the garrisons of Shu are levied under wartime rules."
 nesnd_shu_army:0 "The Army of Shu"
 nesnd_shu_army_end_tt:0 "Our journal for the Second Jingnan War has ended."
 nesnd_shu_army_conclusion:0 "The Jingnan War is over for us. The garrisons of Shu return to their posts and the wartime levies end."

 nesnd_continue_war_bar_name:0 "Continue the War"
 nesnd_continue_war_bar_desc:0 "#tooltippable;tooltip:[JournalEntry.GetTooltipTag],nesnd_continue_war_bar_rules_tt $nesnd_continue_war_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 5#! months#!"
 nesnd_continue_war_bar_rules_tt:0 "#title Continue the War#!\nWhile some anti-Wu country is not at war with us, the bar gains #v +1#! each month; when none is left it resets to zero.\nAt #v 5#! months the court opens a Jingnan play against one of them and draws in every other anti-Wu country not yet fighting; the war still allows #bold no negotiated peace#!.\nA [concept_truce] does not prevent the war. Countries still answering a holdout offer or subject to another country are not counted."
 nesnd_continue_war_bar_month:0 "An anti-Wu country is not yet at war with us"

 nesnd_celestial_collapse_mainland_tt:0 "We hold no territory on the Chinese mainland (Taiwan and Hainan excluded)."
 nesnd_celestial_collapse_peace_tt:0 "We are not at war with any anti-Wu country, and no Jingnan play is under way."
 nesnd_celestial_collapse_outcome_tt:0 "#bold The Celestial Empire dissolves#!: we disband the power bloc we lead and release all our subjects. The Ming loyalists choose one country as the #bold Ming Court in Exile#! and form the United Federation of Ming."
 nesnd_celestial_collapse_conclusion:0 "With the mainland lost, the Celestial Empire can no longer be upheld even in name."

 nesnd_celestial_collapse.1.t:0 "The Celestial Empire Dissolves"
 nesnd_celestial_collapse.1.d:0 "Wu's army has withdrawn from the last counties of the Chinese mainland. The Zheng court now commands only islands at sea and the ports along its routes.\n\nThe Celestial Empire rested on the Wu court's authority over the provinces and princely domains: its subjects paid tribute, sent troops, and let the court conduct their foreign affairs. With the mainland gone, the court can neither protect its subjects nor collect their tribute. It has declared the Celestial Empire dissolved, and each subject is now independent. The Ming loyalists have begun to choose a court in exile and to restore the Ming claim."
 nesnd_celestial_collapse.1.f:0 "When one commoner rose in revolt, the seven ancestral temples fell, the ruler died at the hands of others, and the world laughed. Why? Because benevolence was not practised, and the positions of attack and defence had been reversed.\n— Jia Yi, The Faults of Qin"
 nesnd_celestial_collapse.1.a:0 "Wu's banner still flies at sea."
 nesnd_celestial_collapse.2.a:0 "The Celestial Empire is a name of the past."

 nesnd_ming_federation_bloc:0 "United Federation of Ming"
 nesnd_celestial_collapse.3.t:0 "The United Federation of Ming"
 nesnd_celestial_collapse.3.d:0 "The Ming loyalists have chosen [ROOT.GetCountry.GetName] as the court in exile. Its government will form the United Federation of Ming around common trade. The other loyalist countries join as vassals: they keep their own governments and armies and recognise the court as overlord.\n\nIf the Ming emperor still lives in exile and rules no other country, the court will send envoys to bring him here."
 nesnd_celestial_collapse.3.f:0 "When the nine branches of kin were at peace, he ordered the hundred clans; when the hundred clans were enlightened, he harmonised the myriad states.\n— Canon of Yao, Book of Documents"
 nesnd_celestial_collapse.3.a:0 "Harmony among the states begins at the court."

 nesnd_celestial_collapse.4.t:0 "Envoys from the Court in Exile"
 nesnd_celestial_collapse.4.d:0 "Envoys from [SCOPE.sCountry('nesnd_federation_court').GetName] have arrived in [ROOT.GetCountry.GetName]. They ask us to join the United Federation of Ming as a vassal and recognise the court as our overlord.\n\nThe letter also states that if we refuse, the court will regard every region we govern as Ming land and reserve the right to recover it."
 nesnd_celestial_collapse.4.f:0 "Under the wide heaven, all is the king's land; to the borders of the land, all are the king's servants.\n— Beishan, Minor Odes, Book of Songs"
 nesnd_celestial_collapse.4.a:0 "Recognise the court as overlord and join the federation."
 nesnd_celestial_collapse.4.b:0 "We govern ourselves and answer to no court."
 nesnd_celestial_collapse.4.b_tt:0 "[SCOPE.sCountry('nesnd_federation_court').GetName] gains #bold claims#! on every region where we hold territory."

 nesnd_celestial_collapse.5.t:0 "The Throne Restored"
 nesnd_celestial_collapse.5.d:0 "The court in exile was founded as a republic. Now that the loyalist countries have chosen it to carry the Ming claim, the government has agreed to adopt monarchy and to recognise [SCOPE.sCharacter('nesnd_federation_emperor').GetFullName] as emperor.\n\nIf the country was governed by autocracy, it adopts landed voting; technocracy and every other voting law remain."
 nesnd_celestial_collapse.5.f:0 "There are not two suns in the sky, nor two kings on earth, nor two masters in a house, nor two supremes among the honoured.\n— Record of Rites, Fang Ji"
 nesnd_celestial_collapse.5.a:0 "Recognise the emperor and set the order of names right."
