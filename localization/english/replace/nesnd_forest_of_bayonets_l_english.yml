l_english:
 je_forest_of_bayonets_reason: "At the [Glossary('glossary_nesnd_settlement_of_1829','settlement of 1829')], the powers of [GetGeographicRegion('geographic_region_europe').GetName] reached a compromise over the frontiers in the east. The three Bonaparte emperors took different views on the political rights of their subjects. Napoleon I sought to suppress radicals throughout Europe. His successor Joseph ended the policy and permitted the exiled nobility to return. In 1832 Napoleon III appointed one of the returning exiles, Louis-Philippe, Duke of Orléans, as his foreign minister. Even with the Duke in the cabinet, his followers made their case for a wider franchise in guarded terms in the salons and newspapers of Paris.\n\nEven with these efforts, however, the dream of Liberty, Equality, and Fraternity is not dead. [Concept('concept_revolution', '$concept_revolutionary|q$')] forces remain dedicated to overthrowing the Congress order, and the resentment of the impoverished and disenfranchised working class has created the threat of social eruption within every European capital. Given a sufficient spark, all of Europe may find itself aflame.\n\n@warning! If [Concept('concept_revolution', '$concept_revolutionary|q$')] activity hits critical mass, the fragile Congress order will erupt into a #b Revolutionary Spring#!"
 je_springtime_of_the_peoples_reason: "The struggle for political rights has spread from the press to the barricades. [GetIdeology('ideology_radical').GetName] demands are winning support across #b Europe#!. Liberal revolutionaries hoist tricolor flags, and cry out for liberty, equality, and fraternity.\n\n#b To the Barricades!:#!\nIf a #tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_movements_list_tt Liberal#! or #tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt Socialist#! [concept_political_movement] becomes [Concept('concept_insurrection', '$concept_insurrectionary|q$')] in our [Concept('concept_capital_state','$concept_capital_state_short|q$')] whilst this [concept_journal_entry] is active, revolutionary forces may attempt to seize power over our country."
 glossary_nesnd_settlement_of_1829: "$treaty_name_kra_fra_relationship$"
 glossary_nesnd_settlement_of_1829_desc: "In 1829, developments in the Ming lands led the European powers to agree on a semi-independent Polish government seated in Krakow. Warsaw and other Polish lands remained under the rule of neighbouring powers."
