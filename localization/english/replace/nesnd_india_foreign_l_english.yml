 nesnd_india_overseas_void_conclusion:0 "We no longer pursue these overseas negotiations."
 nesnd_india_frontier_trade_button_desc:0 "Ask [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] to grant us a [concept_trade_privilege]."
 nesnd_india_frontier_access_button_desc:0 "Ask them to grant us [concept_military_access], so that our armies may march through their territory."
 nesnd_india_overseas_trade_button_desc:0 "We choose one of the local governments in this direction and ask it to grant our traders [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]."
 nesnd_india_overseas_port_button_desc:0 "We choose one of the local governments in this direction and ask it to cede one of its states with a $building_port$ to us as a [concept_treaty_port]."
 nesnd_india_frontier_ask_trade_tt:0 "We ask [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] for a [concept_trade_privilege]. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of five years, and [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0] on signing."
 nesnd_india_frontier_consent_own_tt:0 "We are a subject of [ROOT.GetCountry.GetOverlord.GetName], whose consent must come first."
 nesnd_india_frontier_consent_empire_tt:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] is a subject of [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetOverlord.GetName], whose consent is needed as well."
 nesnd_india_frontier_accept_trade_tt:0 "The two countries sign a [concept_treaty]: [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] receives a [concept_trade_privilege] from us, with a [concept_binding_period] of five years. We pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] once."
 nesnd_india_frontier_accept_access_tt:0 "The two countries sign a [concept_treaty]: we grant [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] [concept_military_access], so that its armies may march through our land, with a [concept_binding_period] of five years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] once."
 nesnd_india_frontier_accept_renew_tt:0 "The treaty between us stays in force, and its term is extended by five years. The [concept_binding_period] is not extended: once the original one ends, either side may withdraw without the penalties of breaking the treaty. We pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]."
 nesnd_india_overseas_ask_trade_tt:0 "We ask it to grant us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|0] on signing."
 nesnd_india_overseas_consent_first_tt:0 "It is a [concept_subject] of another country. The matter first needs the consent of its [concept_overlord], and goes to it only after that."
 nesnd_india_overseas_ask_port_tt:0 "We ask it to cede one of its states with a $building_port$ to us as a [concept_treaty_port]. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years and no date of expiry, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|0] on signing."
 nesnd_india_overseas_member_turn_tt:0 "This request puts its diplomatic correspondence on a six-month cooldown, during which it cannot make requests of other countries."
 nesnd_india_overseas_accept_trade_tt:0 "The two countries sign a [concept_treaty]: [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] receives [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] from us, with a [concept_binding_period] of ten years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] once."
 nesnd_india_overseas_accept_port_tt:0 "The two countries sign a [concept_treaty]: we cede to [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] as a [concept_treaty_port] the most populous state with a $building_port$ that we can cede in this direction, with a [concept_binding_period] of ten years and no date of expiry. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] once."
 nesnd_india_overseas_accept_renew_tt:0 "The treaty between us stays in force, and its term is extended by ten years. The [concept_binding_period] is not extended: once the original one ends, either side may withdraw without the penalties of breaking the treaty. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]."
 nesnd_india_treaty_upkeep_ours_trade_tt:0 "Once the treaty is in force, we bear the base maintenance cost of the [concept_trade_privilege] article: @inf!#v [GetArticleType('trade_privilege').GetCost|0]#! [concept_influence]."
 nesnd_india_treaty_upkeep_ours_access_tt:0 "Once the treaty is in force, we bear the base maintenance cost of the [concept_military_access] article: @inf!#v [GetArticleType('military_access').GetCost|0]#! [concept_influence]."
 nesnd_india_treaty_upkeep_ours_port_tt:0 "Once the treaty is in force, we bear the base maintenance cost of the [concept_treaty_port] article: @inf!#v [GetArticleType('treaty_port').GetCost|0]#! [concept_influence]."
 nesnd_india_treaty_upkeep_theirs_trade_tt:0 "Once the treaty is in force, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] bears the base maintenance cost of the [concept_trade_privilege] article: @inf!#v [GetArticleType('trade_privilege').GetCost|0]#! [concept_influence]. We bear none."
 nesnd_india_treaty_upkeep_theirs_access_tt:0 "Once the treaty is in force, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] bears the base maintenance cost of the [concept_military_access] article: @inf!#v [GetArticleType('military_access').GetCost|0]#! [concept_influence]. We bear none."
 nesnd_india_treaty_upkeep_theirs_port_tt:0 "Once the treaty is in force, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] bears the base maintenance cost of the [concept_treaty_port] article: @inf!#v [GetArticleType('treaty_port').GetCost|0]#! [concept_influence]. We bear none."
 nesnd_india_frontier_empire_exists_tt:0 "There is a Mughal government with which we may make the treaty (Hindustan, India, Dravida Nadu, or a government carried on from one of them)"
 nesnd_india_frontier_no_trade_tt:0 "We hold no treaty granting us a trade privilege"
