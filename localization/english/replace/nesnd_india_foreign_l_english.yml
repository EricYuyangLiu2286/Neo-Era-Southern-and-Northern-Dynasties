l_english:
 nesnd_india_overseas:0 "Overseas Dealings"
 nesnd_india_overseas_reason:0 "Since [ROOT.GetCountry.GetName] won international recognition, the regions around India, [GetStrategicRegion('region_himalayas').GetName], [GetStrategicRegion('region_indonesia').GetName], [GetStrategicRegion('region_east_africa').GetName], [GetStrategicRegion('region_arabia').GetName] and [GetStrategicRegion('region_greater_persia').GetName], have become the first destinations for its merchants and diplomats. Some are already worked by other powers, and which governments sign with whom and open their markets to whom will decide whether [ROOT.GetCountry.GetName] can establish itself beyond India.\n\nThe banks and merchant houses at home want the government to sign [concept_foreign_investment_rights] [Concept('concept_treaty','$concept_treaties|q$')] with regional states so that our capital and our emigrants can follow. The Foreign Ministry and the army would rather press territorial claims on hostile neighbours. The powers already established in these regions watch every move [ROOT.GetCountry.GetName] makes and may protest or come to treat it as a rival."
 nesnd_india_overseas_status_ongoing:0 "Current fee for signing [concept_foreign_investment_rights]: @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!. Directions with active [concept_foreign_investment_rights] and qualifying [concept_interest_tier]: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_established_dirs')|0] / 3#!."
 nesnd_india_overseas_status_done:0 "The Indian Ocean trade network is established. Current fee for signing [concept_foreign_investment_rights]: @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!."
 nesnd_india_overseas_lost_conclusion:0 "[ROOT.GetCountry.GetName] has lost its independence or international recognition, and our overseas dealings have collapsed."
 nesnd_india_overseas_lost_effect_tt:0 "Existing [concept_foreign_investment_rights] [Concept('concept_treaty','$concept_treaties|q$')] remain in force until they expire, and existing [Concept('concept_claim','$concept_claims|q$')] remain."
 nesnd_india_overseas_void_conclusion:0 "[ROOT.GetCountry.GetName] no longer holds imperial authority in India, and overseas dealings cease."
