 nesnd_india_overseas_fir_button_desc:0 "Spend accumulated dealings and treasury funds to sign a ten-year [concept_foreign_investment_rights] [concept_treaty] with a state in this region."
 nesnd_india_overseas_claim_button_desc:0 "Spend full dealings in this direction to press a [concept_claim] on a regional state's most populous unclaimed state."
 nesnd_india_overseas_fir_button_tt:0 "List up to three states in this region from highest to lowest [concept_relations]. Selecting one spends #v 50#! dealings and a quarter of our income (at least @money!10,000) to sign ten-year [concept_foreign_investment_rights] directly, and establishes a [concept_cultural_community] of our largest primary culture in its capital."
 nesnd_india_overseas_claim_button_tt:0 "List up to three states in this region from lowest to highest [concept_relations]. Selecting one resets dealings in this direction to zero and grants us a [concept_claim] on its most populous unclaimed state in the region."
 nesnd_india_overseas_bar_50_tt:0 "Dealings in this direction have reached #v 50#!"
