 nesnd_india_overseas_fir_button_desc:0 "Spend 50 of the dealings in this direction and pay the signing cost to sign a ten-year $foreign_investment_rights$ treaty with a country of the region, allowing our investors to invest there. Our primary culture forms a [concept_cultural_community] in its capital."
 nesnd_india_overseas_claim_button_desc:0 "Reset the dealings in this direction to zero, and lay a [concept_claim] on the most populous state of a country in the region that we do not yet claim."
 nesnd_india_overseas_fir_button_tt:0 "Choose the country to sign with."
 nesnd_india_overseas_claim_button_tt:0 "Choose where to assert our interests."
 nesnd_india_overseas_bar_50_tt:0 "Dealings in this direction are at least #v 50#!"
 nesnd_india_overseas_bar_100_tt:0 "Dealings in this direction reach #v 100#!"
 nesnd_india_overseas_treasury_tt:0 "We can afford the signing cost of #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|D]#!"
 nesnd_india_overseas_has_fir_target_tt:0 "A country of the region can sign $foreign_investment_rights$ with us"
 nesnd_india_overseas_has_claim_target_tt:0 "A country of the region holds a state there that we do not yet claim"
 nesnd_india_overseas_no_existing_fir_tt:0 "The two countries have no $foreign_investment_rights$ treaty yet"
 nesnd_india_overseas_interest_2_tt:0 "Our [concept_interest_tier] in the strategic region of the other country's capital is at least 2"
 nesnd_india_overseas_autonomy_tt:0 "Both countries may conduct an assertive foreign policy of their own"
 nesnd_india_overseas_treaty_allowed_tt:0 "The two countries can sign this treaty at present"
 nesnd_india_overseas_has_unclaimed_state_tt:0 "The other country still holds the state, and we do not yet claim it"
 nesnd_india_overseas_spend_50_tt:0 "Dealings in this direction #r -50#!"
 nesnd_india_overseas_diaspora_tt:0 "Our largest [Concept('concept_primary_cultures','$concept_primary_culture$')] forms a [concept_cultural_community] in the other country's capital."
 nesnd_india_overseas_reset_bar_tt:0 "Dealings in this direction are reset to zero."
 nesnd_india_overseas_not_now_tt:0 "No treaty is signed for now."
 nesnd_india_overseas_claim_not_now_tt:0 "No interests are asserted for now."
 nesnd_india_overseas.1.t:0 "Investment Rights"
 nesnd_india_overseas.1.d:0 "Our dealings with [SCOPE.sStrategicRegion('india_overseas_region').GetName] are now close enough to negotiate $foreign_investment_rights$ with a government there. Once signed, our firms and banks may set up business in its territory, and our people will follow."
 nesnd_india_overseas.1.f:0 "'The other contracting party shall permit our subjects to reside in its territory, to open business houses, to acquire property and to carry on their trade without hindrance.'\n— Investment rights treaty"
 nesnd_india_overseas.1.a:0 "[SCOPE.sCountry('india_overseas_pick_1').GetName]"
 nesnd_india_overseas.1.b:0 "[SCOPE.sCountry('india_overseas_pick_2').GetName]"
 nesnd_india_overseas.1.c:0 "[SCOPE.sCountry('india_overseas_pick_3').GetName]"
 nesnd_india_overseas.1.d_opt:0 "Not Now"
 nesnd_india_overseas.2.t:0 "Indian Investors"
 nesnd_india_overseas.2.d:0 "[SCOPE.sCountry('india_overseas_investor').GetName] has signed an $foreign_investment_rights$ treaty with us. Business houses from [SCOPE.sCountry('india_overseas_investor').GetName] will open in our country one after another, and their countrymen have already settled in our capital."
 nesnd_india_overseas.2.f:0 "'This government shall permit the subjects of [SCOPE.sCountry('india_overseas_investor').GetName] to reside within its territory, to open business houses, to acquire property and to carry on their trade without hindrance.'\n— Investment rights treaty"
 nesnd_india_overseas.2.a:0 "Noted"
 nesnd_india_overseas.2.a_tt:0 "The investors of [SCOPE.sCountry('india_overseas_investor').GetName] may invest in our country for ten years, and their people have formed a [concept_cultural_community] in our capital."
 nesnd_india_overseas.3.t:0 "Asserting Our Interests"
 nesnd_india_overseas.3.d:0 "Our dealings with [SCOPE.sStrategicRegion('india_overseas_region').GetName] are now very close. The empire can lay claim to the land of a country there."
 nesnd_india_overseas.3.f:0 "'The persons and property of our subjects in that land must be protected by our government.'\n— Note from the foreign ministry"
 nesnd_india_overseas.3.a:0 "[SCOPE.sCountry('india_overseas_pick_1').GetName]: [SCOPE.sState('india_overseas_claim_state_1').GetName]"
 nesnd_india_overseas.3.b:0 "[SCOPE.sCountry('india_overseas_pick_2').GetName]: [SCOPE.sState('india_overseas_claim_state_2').GetName]"
 nesnd_india_overseas.3.c:0 "[SCOPE.sCountry('india_overseas_pick_3').GetName]: [SCOPE.sState('india_overseas_claim_state_3').GetName]"
 nesnd_india_overseas.3.d_opt:0 "Not Now"
 nesnd_india_overseas.4.t:0 "An Indian Claim"
 nesnd_india_overseas.4.d:0 "[SCOPE.sCountry('india_overseas_claimer').GetName] has laid claim to our [SCOPE.sState('india_overseas_claimed_state').GetName]."
 nesnd_india_overseas.4.f:0 "'The persons and property of our subjects in that land must be protected by our government.'\n— Note from the other government"
 nesnd_india_overseas.4.a:0 "Take Note"
 nesnd_india_overseas.4.a_tt:0 "[SCOPE.sCountry('india_overseas_claimer').GetName] now claims our [SCOPE.sState('india_overseas_claimed_state').GetName]."
 nesnd_india_overseas.5.t:0 "Indian Expansion"
 nesnd_india_overseas.5.d:0 "The influence of [SCOPE.sCountry('india_overseas_actor').GetName] in [SCOPE.sStrategicRegion('india_overseas_region').GetName] is growing, and we or our subjects hold territory there too."
 nesnd_india_overseas.5.f:0 "'Firms and settlers from [SCOPE.sCountry('india_overseas_actor').GetName] grow more numerous here every year.'\n— Report of an official in our possessions"
 nesnd_india_overseas.5.a:0 "Lodge a Protest"
 nesnd_india_overseas.5.b:0 "Treat Them as Rivals"
 nesnd_india_overseas.5.b_tt:0 "We treat [SCOPE.sCountry('india_overseas_actor').GetName] as an enemy."
 nesnd_india_overseas.5.c:0 "Ignore It"
 nesnd_india_overseas.5.c_tt:0 "No response is made."
 nesnd_india_overseas.6.t:0 "A Power Responds"
 nesnd_india_overseas.6.d_protest:0 "[SCOPE.sCountry('india_overseas_reactor').GetName] has protested against our expansion in [SCOPE.sStrategicRegion('india_overseas_region').GetName]."
 nesnd_india_overseas.6.d_rival:0 "[SCOPE.sCountry('india_overseas_reactor').GetName] now regards us as its rival in [SCOPE.sStrategicRegion('india_overseas_region').GetName]."
 nesnd_india_overseas.6.d_ignore:0 "[SCOPE.sCountry('india_overseas_reactor').GetName] has made no response to our expansion in [SCOPE.sStrategicRegion('india_overseas_region').GetName]."
 nesnd_india_overseas.6.f:0 "'The other side has made its position clear.'\n— Report of the foreign ministry"
 nesnd_india_overseas.6.a:0 "Noted"
 nesnd_india_overseas.6.a_protest_tt:0 "[concept_relations] with [SCOPE.sCountry('india_overseas_reactor').GetName] #r -20#!."
 nesnd_india_overseas.6.a_rival_tt:0 "[SCOPE.sCountry('india_overseas_reactor').GetName] treats us as an enemy."
 nesnd_india_overseas.6.a_ignore_tt:0 "Nothing changes."
 nesnd_india_overseas.7.t:0 "Established Overseas"
 nesnd_india_overseas.7.d:0 "We have established ourselves in three directions, and our capital has set up business abroad."
 nesnd_india_overseas.7.f:0 "'Ships from India calling at this port grow more numerous every year.'\n— Annual report of the customs house"
 nesnd_india_overseas.7.a:0 "Set Sail"
