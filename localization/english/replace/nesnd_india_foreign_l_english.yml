 nesnd_india_overseas_they_can_pay_trade_tt:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] holds at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|0] in [concept_gold_reserves], is not in [concept_default] and has not declared [concept_bankruptcy]"
