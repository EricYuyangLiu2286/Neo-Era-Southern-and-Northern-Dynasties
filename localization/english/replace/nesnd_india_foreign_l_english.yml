 nesnd_india_frontier_reason_empire_x_x:0 "Neither Bhutan nor Nepal exists any longer, and [ROOT.GetCountry.GetName] has no one with whom to conclude either kind of [concept_treaty]."
 nesnd_india_frontier_reason_empire_x_0:0 "[ROOT.GetCountry.GetName] may conclude two kinds of [concept_treaty] with [SCOPE.sCountry('india_frontier_nep').GetName]: it lets our armies march through its land, or we grant it a [concept_trade_privilege]. We pay for either on signing and half that sum on renewal, and before either expires the two governments must settle whether to renew it. A trade privilege can be signed only when each country has its own [concept_market]. A subject can sign one only after its overlord grants it its own market, and if the granting country loses its own market an existing treaty is frozen.\n\nWe have neither treaty with [SCOPE.sCountry('india_frontier_nep').GetName]."
 nesnd_india_frontier_reason_empire_x_t:0 "[ROOT.GetCountry.GetName] may conclude two kinds of [concept_treaty] with [SCOPE.sCountry('india_frontier_nep').GetName]: it lets our armies march through its land, or we grant it a [concept_trade_privilege]. We pay for either on signing and half that sum on renewal, and before either expires the two governments must settle whether to renew it. A trade privilege can be signed only when each country has its own [concept_market]. A subject can sign one only after its overlord grants it its own market, and if the granting country loses its own market an existing treaty is frozen.\n\nThe treaty granting [SCOPE.sCountry('india_frontier_nep').GetName] a [concept_trade_privilege] from us expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_frontier_nep').MakeScope, 'nesnd_india_frontier_trade_term'))]."
 nesnd_india_frontier_reason_empire_x_a:0 "[ROOT.GetCountry.GetName] may conclude two kinds of [concept_treaty] with [SCOPE.sCountry('india_frontier_nep').GetName]: it lets our armies march through its land, or we grant it a [concept_trade_privilege]. We pay for either on signing and half that sum on renewal, and before either expires the two governments must settle whether to renew it. A trade privilege can be signed only when each country has its own [concept_market]. A subject can sign one only after its overlord grants it its own market, and if the granting country loses its own market an existing treaty is frozen.\n\nThe treaty granting us [concept_military_access] through [SCOPE.sCountry('india_frontier_nep').GetName] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_frontier_nep').MakeScope, 'nesnd_india_frontier_access_term'))]."
