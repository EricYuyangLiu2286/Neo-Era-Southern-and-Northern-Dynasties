 nesnd_india_overseas.2.t:0 "They Agree"
 nesnd_india_overseas.2.d_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has granted our request. The two countries have signed a [concept_treaty], and our traders now enjoy [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] in [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_overseas.2.d_port:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to cede [SCOPE.sState('india_overseas_port_signed').GetName] to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. The two countries have signed a [concept_treaty]."
 nesnd_india_overseas.2.d_renew_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew. Its treaty granting us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] will stay in force once the present term ends."
 nesnd_india_overseas.2.f:0 "“The Government has reached agreement with the other government on this matter.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_overseas_signed_trade_tt:0 "The treaty has a [concept_binding_period] of ten years and expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_matter_to').MakeScope, 'nesnd_india_frontier_overseas_trade_term'))]. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|0]."
 nesnd_india_overseas_signed_port_tt:0 "The treaty has a [concept_binding_period] of ten years and no date of expiry. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|0]."
 nesnd_india_overseas_renewed_trade_tt:0 "When the present term ends, it is extended by ten years. The [concept_binding_period] is not extended: once the original one ends, either side may withdraw without the penalties of breaking the treaty. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_renew_payment')|0]."
 nesnd_india_overseas.3.t:0 "No Agreement"
 nesnd_india_overseas.3.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has refused its consent as [concept_overlord], and our request goes no further."
 nesnd_india_overseas.3.d_renew_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] will not renew."
 nesnd_india_overseas.3.d_renew_silent:0 "Our request to renew received no answer in time."
 nesnd_india_overseas.3.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request."
 nesnd_india_overseas.3.d_silent:0 "Our request received no answer in time and has been dropped."
 nesnd_india_overseas.3.d_void:0 "Circumstances have changed, and our request no longer stands."
