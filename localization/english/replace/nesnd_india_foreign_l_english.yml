 nesnd_india_overseas_own_market_tt:0 "We have a [concept_market] of our own and are not inside another country's market"
 nesnd_india_frontier_empire_can_pay_tt:0 "The [concept_gold_reserves] of [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] cover @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0], and it is in neither [concept_default] nor [concept_bankruptcy]"
 nesnd_india_frontier_no_access_tt:0 "They have no treaty granting military access"
