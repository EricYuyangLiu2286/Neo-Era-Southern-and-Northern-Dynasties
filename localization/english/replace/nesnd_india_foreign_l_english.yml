 nesnd_india_overseas_fir_button_desc:0 "Expend 50 of our sway in this direction and pay the signing cost to conclude a ten-year $foreign_investment_rights$ treaty with a country of the region, under which our investors may invest in its territory. Our primary culture forms a [concept_cultural_community] in its capital."
 nesnd_india_overseas_claim_button_desc:0 "Reset our sway in this direction to zero, and lay a [concept_claim] on the most populous state of a country in the region that we do not yet claim."
 nesnd_india_overseas_fir_button_tt:0 "Choose the country to sign with."
 nesnd_india_overseas_claim_button_tt:0 "Choose where to assert our interests."
