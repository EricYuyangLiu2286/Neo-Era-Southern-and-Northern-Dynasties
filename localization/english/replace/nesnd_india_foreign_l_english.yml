l_english:
 nesnd_india_overseas:0 "National Capital Abroad"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName] is an independent state and is recognised as such by the powers. For nearly a century the foreign trade and shipping of India have been a monopoly of foreigners, and the partition of the markets of the world among the powers is of long standing. If the national capital of India is to be employed abroad, 'fair competition' alone will not serve: it must invest and acquire actively with the power of the state behind it, and even bring the districts which yield vital resources directly within the national territory. The regions adjoining India, however, are for the most part possessions of the powers. Our expansion in them may well provoke a fresh round of intervention by the powers. In these circumstances we should be prepared for war in defence of the interests of India..."
 nesnd_india_overseas_status_ongoing:0 "Directions established: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_established_dirs')|0]#! / 3"
 nesnd_india_overseas_status_done:0 "The empire has established itself in three directions."
 nesnd_india_overseas_lost_conclusion:0 "We have lost our independence or our recognition, and with it our sway overseas."
 nesnd_india_overseas_lost_effect_tt:0 "Our sway in every direction is reset to zero."
 nesnd_india_overseas_void_conclusion:0 "We are no longer an Indian empire."
