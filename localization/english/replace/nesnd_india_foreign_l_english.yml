 nesnd_india_frontier_we_can_pay_renew_tt:0 "Our [concept_gold_reserves] cover @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_renew_payment')|0], and we are in neither [concept_default] nor [concept_bankruptcy]"
 nesnd_india_frontier_treaty_stands_tt:0 "The treaty between us is still in force"
 nesnd_india_frontier_they_can_pay_tt:0 "The [concept_gold_reserves] of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] cover @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0], and it is in neither [concept_default] nor [concept_bankruptcy]"
 nesnd_india_overseas_has_local_tt:0 "This direction has a local government we can deal with"
