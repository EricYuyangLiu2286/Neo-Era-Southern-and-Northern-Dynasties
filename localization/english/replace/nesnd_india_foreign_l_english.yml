 nesnd_india_overseas_no_existing_fir_tt:0 "The two countries have no $foreign_investment_rights$ treaty yet"
 nesnd_india_overseas_interest_2_tt:0 "Our [concept_interest_tier] in the strategic region of the other country's capital is at least 2"
 nesnd_india_overseas_autonomy_tt:0 "Both countries may conduct an assertive foreign policy of their own"
 nesnd_india_overseas_treaty_allowed_tt:0 "The two countries can sign this treaty at present"
