l_english:
 nesnd_india_overseas:0 "Overseas Dealings"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName] answers to no foreign overlord. For more than a century the sea trade and shipping of the subcontinent have been mostly in French and Ming hands. If our capital is to do business abroad, the government must itself conclude treaties with the governments of the lands around us. Most of those lands are already under the rule of the powers or pay tribute to $nesnd_lobby_name_qe1$, and every enterprise [ROOT.GetCountry.GetName] opens and every community of our people it settles there must be contested with the countries already established."
 nesnd_india_overseas_status_ongoing:0 "Directions established: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_established_dirs')|0]#! / 3"
 nesnd_india_overseas_status_done:0 "The empire has established itself in three directions."
 nesnd_india_overseas_lost_conclusion:0 "We have lost our independence or our recognition, and our dealings overseas have come to an end."
 nesnd_india_overseas_lost_effect_tt:0 "All records of dealings in every direction are void."
 nesnd_india_overseas_void_conclusion:0 "We are no longer an Indian empire."
 nesnd_india_ocean_trade_modifier:0 "Overseas Dealings"
 nesnd_india_overseas_lost:0 "Influence Abroad Lost"
