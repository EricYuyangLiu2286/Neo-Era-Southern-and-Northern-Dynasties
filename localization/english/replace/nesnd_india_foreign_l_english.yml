l_english:
 nesnd_india_overseas:0 "Overseas Dealings"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName] has won international recognition and is building commercial and diplomatic links across five surrounding strategic regions. By maintaining our [concept_interest_tier], signing active [Concept('concept_treaty','$concept_treaties|q$')], cultivating good [concept_relations] and expanding mutual [concept_trade], we build dealings in each direction to secure [concept_foreign_investment_rights] or press a [concept_claim].\n\n[GetStrategicRegion('region_himalayas').GetName]: interest tier [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_himalayas').Self).GetName], treaties #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_himalayas')|0]#!, $relations_cordial$ or better #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_himalayas')|0]#!, trade @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_himalayas')|0]#!, dealings #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_himalayas')|1]#! (#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_himalayas')|1]#! to sign)\n[GetStrategicRegion('region_indonesia').GetName]: interest tier [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_indonesia').Self).GetName], treaties #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_indonesia')|0]#!, $relations_cordial$ or better #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_indonesia')|0]#!, trade @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_indonesia')|0]#!, dealings #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_indonesia')|1]#! (#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_indonesia')|1]#! to sign)\n[GetStrategicRegion('region_east_africa').GetName]: interest tier [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_east_africa').Self).GetName], treaties #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_east_africa')|0]#!, $relations_cordial$ or better #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_east_africa')|0]#!, trade @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_east_africa')|0]#!, dealings #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_east_africa')|1]#! (#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_east_africa')|1]#! to sign)\n[GetStrategicRegion('region_arabia').GetName]: interest tier [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_arabia').Self).GetName], treaties #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_arabia')|0]#!, $relations_cordial$ or better #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_arabia')|0]#!, trade @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_arabia')|0]#!, dealings #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_arabia')|1]#! (#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_arabia')|1]#! to sign)\n[GetStrategicRegion('region_greater_persia').GetName]: interest tier [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_greater_persia').Self).GetName], treaties #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_persia')|0]#!, $relations_cordial$ or better #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_persia')|0]#!, trade @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_persia')|0]#!, dealings #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_persia')|1]#! (#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_persia')|1]#! to sign)"
 nesnd_india_overseas_status_ongoing:0 "Current fee for signing [concept_foreign_investment_rights]: @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!. Directions with active [concept_foreign_investment_rights] and qualifying [concept_interest_tier]: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_established_dirs')|0] / 3#!.\nA [concept_treaty] for [concept_foreign_investment_rights] can also be enforced through a [concept_diplomatic_play]."
 nesnd_india_overseas_status_done:0 "The Indian Ocean trade network is established. Current fee for signing [concept_foreign_investment_rights]: @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!.\nA [concept_treaty] for [concept_foreign_investment_rights] can also be enforced through a [concept_diplomatic_play]."
 nesnd_india_overseas_lost_conclusion:0 "[ROOT.GetCountry.GetName] has lost its independence or international recognition, and our overseas dealings have collapsed."
 nesnd_india_overseas_lost_effect_tt:0 "Existing [concept_foreign_investment_rights] [Concept('concept_treaty','$concept_treaties|q$')] remain in force until they expire, and existing [Concept('concept_claim','$concept_claims|q$')] remain."
 nesnd_india_overseas_void_conclusion:0 "[ROOT.GetCountry.GetName] no longer holds imperial authority in India, and overseas dealings cease."
