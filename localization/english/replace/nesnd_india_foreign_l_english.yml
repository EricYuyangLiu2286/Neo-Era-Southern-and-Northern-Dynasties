l_english:
 nesnd_india_frontier_reason_small_none_none:0 "[ROOT.GetCountry.GetName] and [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] may conclude two kinds of [concept_treaty]: [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] grants us a [concept_trade_privilege], or we let the armies of [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] march through our land. [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] pays for either on signing and half that sum on renewal, and before either expires the two governments must settle whether to renew it. A trade privilege can be signed only when each country has its own [concept_market]. A subject can sign one only after its overlord grants it its own market, and if the granting country loses its own market an existing treaty is frozen.\n\nWe hold no trade privilege from [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] at present.\nWe grant no military access to [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] at present."
 nesnd_india_frontier_reason_small_none_on:0 "[ROOT.GetCountry.GetName] and [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] may conclude two kinds of [concept_treaty]: [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] grants us a [concept_trade_privilege], or we let the armies of [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] march through our land. [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] pays for either on signing and half that sum on renewal, and before either expires the two governments must settle whether to renew it. A trade privilege can be signed only when each country has its own [concept_market]. A subject can sign one only after its overlord grants it its own market, and if the granting country loses its own market an existing treaty is frozen.\n\nWe hold no trade privilege from [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_empire').GetCountry.GetName] at present.\nOur treaty granting [concept_military_access] to [ROOT.GetCountry.MakeScope.Var('nesnd_india_frontier_access_with').GetCountry.GetName] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_frontier_access_term'))]."
