 nesnd_india_overseas_port_button_desc:0 "We choose one of the local governments in this direction and ask it to cede one of its states with a $building_port$ to us as a [concept_treaty_port]."
 nesnd_india_frontier_consent_own_tt:0 "We are a subject of [ROOT.GetCountry.GetOverlord.GetName], whose consent must come first."
 nesnd_india_overseas_ask_trade_tt:0 "We ask it to grant us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|K] on signing."
 nesnd_india_overseas_consent_first_tt:0 "It is a [concept_subject] of another country. The matter first needs the consent of its [concept_overlord], and goes to it only after that."
 nesnd_india_overseas_ask_port_tt:0 "We ask it to cede one of its states with a $building_port$ to us as a [concept_treaty_port]. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years and no date of expiry, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|K] on signing."
 nesnd_india_overseas_member_turn_tt:0 "This request puts its diplomatic correspondence on a six-month cooldown, during which it cannot make requests of other countries."
 nesnd_india_overseas_accept_trade_tt:0 "The two countries sign a [concept_treaty]: [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] receives [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] from us, with a [concept_binding_period] of ten years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] once."
 nesnd_india_overseas_accept_port_tt:0 "The two countries sign a [concept_treaty]: we cede to [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] as a [concept_treaty_port] the most populous state with a $building_port$ that we can cede in this direction, with a [concept_binding_period] of ten years and no date of expiry. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] once."
 nesnd_india_overseas_accept_renew_tt:0 "The treaty between us stays in force, and its term is extended by ten years. The [concept_binding_period] is not extended: once the original one ends, either side may withdraw without the penalties of breaking the treaty. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]."
 nesnd_india_treaty_upkeep_ours_trade_tt:0 "Once the treaty is in force, we bear the base maintenance cost of the [concept_trade_privilege] article: @inf!#v [GetArticleType('trade_privilege').GetCost|0]#! [concept_influence]."
 nesnd_india_treaty_upkeep_ours_port_tt:0 "Once the treaty is in force, we bear the base maintenance cost of the [concept_treaty_port] article: @inf!#v [GetArticleType('treaty_port').GetCost|0]#! [concept_influence]."
 nesnd_india_treaty_upkeep_theirs_trade_tt:0 "Once the treaty is in force, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] bears the base maintenance cost of the [concept_trade_privilege] article: @inf!#v [GetArticleType('trade_privilege').GetCost|0]#! [concept_influence]. We bear none."
 nesnd_india_treaty_upkeep_theirs_port_tt:0 "Once the treaty is in force, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] bears the base maintenance cost of the [concept_treaty_port] article: @inf!#v [GetArticleType('treaty_port').GetCost|0]#! [concept_influence]. We bear none."
 nesnd_india_own_markets_tt:0 "Trade privileges require a market of our own"
 nesnd_india_overseas_own_market_tt:0 "Trade privileges require a market of our own"
 nesnd_india_frontier_treaty_stands_tt:0 "The treaty between us is still in force"
 nesnd_india_overseas_has_local_tt:0 "This direction has a local government we can deal with"
 nesnd_india_overseas_port_claimed_tt:0 "Another country has a [concept_claim] on this state, or the state is among the aims of '$nesnd_per_west_journal$'"
 nesnd_india_overseas_navy_top_20_tt:0 "Our [concept_naval_power_projection] is among the first 20 in the world (we are [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_navy_rank')|0])"
 nesnd_india_overseas_treaty_possible_tt:0 "Under the terms of the article itself, the two countries can sign this treaty now"
 nesnd_india_overseas_still_local_tt:0 "It is a local government of this direction: its capital lies here, or it holds a peopled state here"
 nesnd_india_overseas_has_port_state_tt:0 "It has a state in this direction that could become our [concept_treaty_port]: one with a $building_port$ that is not a treaty port already"
 nesnd_india_overseas_rank_fits_tt:0 "Its [concept_rank] is no higher than ours (required by the [concept_treaty_port] article)"
 nesnd_india_overseas_they_can_pay_trade_tt:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] holds at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|K] in [concept_gold_reserves], is not in [concept_default] and has not declared [concept_bankruptcy]"
 nesnd_india_overseas_they_can_pay_port_tt:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] holds at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|K] in [concept_gold_reserves], is not in [concept_default] and has not declared [concept_bankruptcy]"
 nesnd_india_overseas_they_can_pay_renew_tt:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] holds at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_renew_payment')|K] in [concept_gold_reserves], is not in [concept_default] and has not declared [concept_bankruptcy]"
 nesnd_india_frontier.3.t:0 "A Treaty Nears Its End"
 nesnd_india_frontier.3.d_overseas_trade:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] grants us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_frontier_small').MakeScope, 'nesnd_india_frontier_overseas_trade_term'))]. Before then we must decide whether to ask [SCOPE.sCountry('india_frontier_small').GetName] to renew it."
 nesnd_india_frontier.3.f:0 "“Whether this treaty is renewed when its binding period ends shall be settled between the two governments.”\n—Treaty between [SCOPE.sCountry('india_frontier_small').GetName] and [SCOPE.sCountry('india_frontier_empire').GetName]"
 nesnd_india_frontier.3.a:0 "Seek Renewal"
 nesnd_india_overseas_renew_tt:0 "We ask [SCOPE.sCountry('india_frontier_small').GetName] to renew. If [SCOPE.sCountry('india_frontier_small').GetName] agrees, the term is extended by ten years under the same treaty, the [concept_binding_period] is not extended, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_renew_payment')|K] on its agreement. A refusal, or no answer within thirty days, counts as not renewing."
 nesnd_india_frontier_renew_later_tt:0 "We have another negotiation open, so the request to renew cannot go now. Once that negotiation is over, we shall be asked again whether to renew. If no chance comes before the treaty expires, it counts as not renewing."
 nesnd_india_overseas_renew_consent_tt:0 "[SCOPE.sCountry('india_frontier_small').GetName] is a [concept_subject] of [SCOPE.sCountry('india_frontier_small').GetOverlord.GetName], whose consent is needed first."
 nesnd_india_frontier.3.b:0 "Let It Expire"
 nesnd_india_overseas_let_lapse_tt:0 "The treaty ends in the month it expires, and neither side bears the penalties of breaking it. [SCOPE.sCountry('india_frontier_small').GetName] will be informed."
 nesnd_india_frontier.4.t:0 "The Treaty Expires"
 nesnd_india_frontier.4.d_overseas_trade:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] granted [SCOPE.sCountry('india_frontier_empire').GetName] [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] has expired without renewal and has ended."
 nesnd_india_frontier.4.f:0 "“The Government has withdrawn from the treaty on the expiry of its term.”\n—Note from the Government of [SCOPE.sCountry('india_frontier_small').GetName] to the Government of [SCOPE.sCountry('india_frontier_empire').GetName]"
 nesnd_india_frontier_expired_tt:0 "The treaty between the two countries is at an end, and neither side bears the penalties of breaking it."
 nesnd_india_overseas.1.t:0 "Whom to Approach Overseas"
 nesnd_india_overseas.1.d_trade_1:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_indonesia').GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments with the best [concept_relations] with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_trade_2:0 "We mean to ask one of the local governments on the [GetStrategicRegion('region_persian_gulf').GetName] coast for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments with the best [concept_relations] with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_trade_3:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_east_africa').GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments with the best [concept_relations] with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_port_1:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_indonesia').GetName] to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments with the best [concept_relations] with us."
 nesnd_india_overseas.1.d_port_2:0 "We mean to ask one of the local governments on the [GetStrategicRegion('region_persian_gulf').GetName] coast to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments with the best [concept_relations] with us."
 nesnd_india_overseas.1.d_port_3:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_east_africa').GetName] to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments with the best [concept_relations] with us."
 nesnd_india_overseas.1.f:0 "“The envoy is to open negotiations for a treaty with that government without delay, and to grant no terms beyond those set out in these instructions.”\n—Instructions of the Government of [ROOT.GetCountry.GetName] to its envoy overseas"
 nesnd_india_overseas.1.a:0 "Approach [SCOPE.sCountry('india_overseas_pick_1').GetName]"
 nesnd_india_overseas.1.b:0 "Approach [SCOPE.sCountry('india_overseas_pick_2').GetName]"
 nesnd_india_overseas.1.c:0 "Approach [SCOPE.sCountry('india_overseas_pick_3').GetName]"
 nesnd_india_overseas.1.d:0 "Approach [SCOPE.sCountry('india_overseas_pick_4').GetName]"
 nesnd_india_overseas.1.e:0 "Not Now"
 nesnd_india_overseas_not_now_tt:0 "We make no request for now, and our chance to negotiate is not used up."
 nesnd_india_overseas.2.t:0 "They Agree"
 nesnd_india_overseas.2.d_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has granted our request. The two countries have signed a [concept_treaty], and our traders now enjoy [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] in [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_overseas.2.d_port:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to cede [SCOPE.sState('india_overseas_port_signed').GetName] to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. The two countries have signed a [concept_treaty]."
 nesnd_india_overseas.2.d_renew_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew. Its treaty granting us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] will stay in force once the present term ends."
 nesnd_india_overseas.2.f:0 "“The Government has reached agreement with the other government on this matter.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_overseas_signed_trade_tt:0 "The treaty has a [concept_binding_period] of ten years and expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_matter_to').MakeScope, 'nesnd_india_frontier_overseas_trade_term'))]. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|K]."
 nesnd_india_overseas_signed_port_tt:0 "The treaty has a [concept_binding_period] of ten years and no date of expiry. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|K]."
 nesnd_india_overseas_renewed_trade_tt:0 "When the present term ends, it is extended by ten years. The [concept_binding_period] is not extended: once the original one ends, either side may withdraw without the penalties of breaking the treaty. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_renew_payment')|K]."
 nesnd_india_overseas.3.t:0 "No Agreement"
 nesnd_india_overseas.3.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has refused its consent as [concept_overlord], and our request goes no further."
 nesnd_india_overseas.3.d_renew_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] will not renew."
 nesnd_india_overseas.3.d_renew_silent:0 "Our request to renew received no answer in time."
 nesnd_india_overseas.3.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request."
 nesnd_india_overseas.3.d_silent:0 "Our request received no answer in time and has been dropped."
 nesnd_india_overseas.3.d_void:0 "Circumstances have changed, and our request no longer stands."
 nesnd_india_overseas.3.f:0 "“The negotiations between this country and that government have been broken off.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_overseas_lapse_tt:0 "The treaty ends in the month it expires, and neither side bears the penalties of breaking it."
 nesnd_india_overseas_failed_tt:0 "The request goes no further. We may not open another negotiation until six months after it was made."
