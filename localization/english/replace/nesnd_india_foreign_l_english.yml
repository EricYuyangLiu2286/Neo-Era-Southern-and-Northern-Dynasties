 nesnd_india_frontier.1.t:0 "They Agree"
 nesnd_india_frontier.1.d_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to our request. The two countries have signed a [concept_treaty] granting us a [concept_trade_privilege] from [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_frontier.1.d_access:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to our request. The two countries have signed a [concept_treaty] by which [SCOPE.sCountry('india_matter_to').GetName] grants us [concept_military_access]."
 nesnd_india_frontier.1.d_renew_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew the treaty granting us a [concept_trade_privilege]."
 nesnd_india_frontier.1.d_renew_access:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew the treaty by which we grant it [concept_military_access]."
 nesnd_india_frontier_signed_trade_tt:0 "The treaty has a [concept_binding_period] of five years and expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_frontier_trade_term'))]. [SCOPE.sCountry('india_matter_to').GetName] has paid us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0]."
 nesnd_india_frontier_signed_access_tt:0 "The treaty has a [concept_binding_period] of five years and expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_matter_to').MakeScope, 'nesnd_india_frontier_access_term'))]. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|0]."
 nesnd_india_frontier_renewed_tt:0 "When the present term ends, it is extended by five years. The [concept_binding_period] is not extended: once the original one ends, either side may withdraw without the penalties of breaking the treaty. [SCOPE.sCountry('india_matter_to').GetName] has paid us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_renew_payment')|0]."
 nesnd_india_frontier.1.f:0 "“The two governments have reached agreement on this matter.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_frontier.2.t:0 "No Agreement"
 nesnd_india_frontier.2.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has withheld its consent as [concept_overlord], and our request ends there."
 nesnd_india_frontier.2.d_renew_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] does not agree to renew. When the treaty expires, we shall withdraw from it."
 nesnd_india_frontier.2.d_renew_silent:0 "Our request to renew went unanswered within the time allowed. When the treaty expires, we shall withdraw from it."
 nesnd_india_frontier.2.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request."
 nesnd_india_frontier.2.d_silent:0 "Our request went unanswered within the time allowed and has lapsed."
 nesnd_india_frontier.2.d_void:0 "Circumstances have changed and our request no longer stands."
 nesnd_india_frontier.2.f:0 "“These negotiations are suspended.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_frontier_lapse_tt:0 "In the month the treaty expires, we withdraw from it."
 nesnd_india_frontier_failed_tt:0 "The request ends here. We may not open another negotiation until six months after it was made."
 nesnd_india_frontier.3.t:0 "A Treaty Nears Its End"
 nesnd_india_frontier.3.d_trade:0 "Our treaty granting us a [concept_trade_privilege] from [SCOPE.sCountry('india_frontier_empire').GetName] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_frontier_trade_term'))]. Before then we must decide whether to ask [SCOPE.sCountry('india_frontier_empire').GetName] to renew it."
 nesnd_india_frontier.3.d_overseas_trade:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] grants us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_frontier_small').MakeScope, 'nesnd_india_frontier_overseas_trade_term'))]. Before then we must decide whether to ask [SCOPE.sCountry('india_frontier_small').GetName] to renew it."
 nesnd_india_frontier.3.d_access:0 "Our treaty granting [concept_military_access] to [SCOPE.sCountry('india_frontier_empire').GetName] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_frontier_access_term'))]. Before then we must decide whether to ask [SCOPE.sCountry('india_frontier_empire').GetName] to renew it."
 nesnd_india_frontier.3.f:0 "“Whether this treaty is renewed when its binding period ends shall be settled between the two governments.”\n—Treaty between [SCOPE.sCountry('india_frontier_small').GetName] and [SCOPE.sCountry('india_frontier_empire').GetName]"
 nesnd_india_frontier.3.a:0 "Seek Renewal"
 nesnd_india_overseas_renew_tt:0 "We ask [SCOPE.sCountry('india_frontier_small').GetName] to renew. If [SCOPE.sCountry('india_frontier_small').GetName] agrees, the term is extended by ten years under the same treaty, the [concept_binding_period] is not extended, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_renew_payment')|0] on its agreement. A refusal, or no answer within thirty days, counts as not renewing."
 nesnd_india_frontier_renew_tt:0 "We ask [SCOPE.sCountry('india_frontier_empire').GetName] to renew. If [SCOPE.sCountry('india_frontier_empire').GetName] agrees, the term is extended by five years under the same treaty, the [concept_binding_period] is not extended, and [SCOPE.sCountry('india_frontier_empire').GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_renew_payment')|0] on agreeing. A refusal, or no answer within thirty days, counts as not renewing."
 nesnd_india_frontier_renew_later_tt:0 "We have another negotiation open, so the request to renew cannot go now. Once that negotiation is over, we shall be asked again whether to renew. If no chance comes before the treaty expires, it counts as not renewing."
 nesnd_india_overseas_renew_consent_tt:0 "[SCOPE.sCountry('india_frontier_small').GetName] is a [concept_subject] of [SCOPE.sCountry('india_frontier_small').GetOverlord.GetName], whose consent is needed first."
 nesnd_india_frontier.3.b:0 "Let It Expire"
 nesnd_india_overseas_let_lapse_tt:0 "The treaty ends in the month it expires, and neither side bears the penalties of breaking it. [SCOPE.sCountry('india_frontier_small').GetName] will be informed."
 nesnd_india_frontier_let_lapse_tt:0 "In the month the treaty expires, we withdraw from it without the penalties of breaking it. [SCOPE.sCountry('india_frontier_empire').GetName] will be informed."
 nesnd_india_frontier.4.t:0 "The Treaty Expires"
 nesnd_india_frontier.4.d_trade:0 "The treaty granting [SCOPE.sCountry('india_frontier_small').GetName] a [concept_trade_privilege] from [SCOPE.sCountry('india_frontier_empire').GetName] has expired without renewal, and [SCOPE.sCountry('india_frontier_small').GetName] has withdrawn from it."
 nesnd_india_frontier.4.d_overseas_trade:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] granted [SCOPE.sCountry('india_frontier_empire').GetName] [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] has expired without renewal and has ended."
 nesnd_india_frontier.4.d_access:0 "The treaty granting [SCOPE.sCountry('india_frontier_empire').GetName] [concept_military_access] through [SCOPE.sCountry('india_frontier_small').GetName] has expired without renewal, and [SCOPE.sCountry('india_frontier_small').GetName] has withdrawn from it."
 nesnd_india_frontier.4.f:0 "“The Government has withdrawn from the treaty on the expiry of its term.”\n—Note from the Government of [SCOPE.sCountry('india_frontier_small').GetName] to the Government of [SCOPE.sCountry('india_frontier_empire').GetName]"
 nesnd_india_frontier_expired_tt:0 "The treaty between the two countries is at an end, and neither side bears the penalties of breaking it."
 nesnd_india_overseas.1.t:0 "Whom to Approach Overseas"
 nesnd_india_overseas.1.d_trade_1:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_indonesia').GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments with the best [concept_relations] with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_trade_2:0 "We mean to ask one of the local governments on the [GetStrategicRegion('region_persian_gulf').GetName] coast for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments with the best [concept_relations] with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_trade_3:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_east_africa').GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments with the best [concept_relations] with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_port_1:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_indonesia').GetName] to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments with the best [concept_relations] with us."
 nesnd_india_overseas.1.d_port_2:0 "We mean to ask one of the local governments on the [GetStrategicRegion('region_persian_gulf').GetName] coast to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments with the best [concept_relations] with us."
 nesnd_india_overseas.1.d_port_3:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_east_africa').GetName] to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments with the best [concept_relations] with us."
 nesnd_india_overseas.1.f:0 "“The envoy is to open negotiations for a treaty with that government without delay, and to grant no terms beyond those set out in these instructions.”\n—Instructions of the Government of [ROOT.GetCountry.GetName] to its envoy overseas"
 nesnd_india_overseas.1.a:0 "Approach [SCOPE.sCountry('india_overseas_pick_1').GetName]"
 nesnd_india_overseas.1.b:0 "Approach [SCOPE.sCountry('india_overseas_pick_2').GetName]"
 nesnd_india_overseas.1.c:0 "Approach [SCOPE.sCountry('india_overseas_pick_3').GetName]"
 nesnd_india_overseas.1.d:0 "Approach [SCOPE.sCountry('india_overseas_pick_4').GetName]"
 nesnd_india_overseas.1.e:0 "Not Now"
