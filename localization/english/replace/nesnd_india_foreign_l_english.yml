 nesnd_india_overseas_fir_east_africa_button:0 "[GetStrategicRegion('region_east_africa').GetName]: Sign Investment Rights"
 nesnd_india_overseas_claim_east_africa_button:0 "[GetStrategicRegion('region_east_africa').GetName]: Assert Interests"
 nesnd_india_overseas_fir_arabia_button:0 "[GetStrategicRegion('region_arabia').GetName]: Sign Investment Rights"
 nesnd_india_overseas_claim_arabia_button:0 "[GetStrategicRegion('region_arabia').GetName]: Assert Interests"
 nesnd_india_overseas_fir_persia_button:0 "[GetStrategicRegion('region_greater_persia').GetName]: Sign Investment Rights"
 nesnd_india_overseas_claim_persia_button:0 "[GetStrategicRegion('region_greater_persia').GetName]: Assert Interests"
 nesnd_india_overseas_fir_button_desc:0 "Spend accumulated dealings and treasury funds to sign a ten-year [concept_foreign_investment_rights] [concept_treaty] with a state in this region."
 nesnd_india_overseas_claim_button_desc:0 "Spend full dealings in this direction to press a [concept_claim] on a regional state's most populous unclaimed state."
 nesnd_india_overseas_fir_button_tt:0 "List up to three states in this region from highest to lowest [concept_relations]. Selecting one spends #v 50#! dealings and a quarter of our income (at least @money!10,000) to sign ten-year [concept_foreign_investment_rights] directly, and establishes a [concept_cultural_community] of our largest primary culture in its capital."
 nesnd_india_overseas_claim_button_tt:0 "List up to three states in this region from lowest to highest [concept_relations]. Selecting one resets dealings in this direction to zero and grants us a [concept_claim] on its most populous unclaimed state in the region."
 nesnd_india_overseas_bar_50_tt:0 "Dealings in this direction have reached #v 50#!"
 nesnd_india_overseas_bar_100_tt:0 "Dealings in this direction have reached #v 100#!"
 nesnd_india_overseas_treasury_tt:0 "[concept_gold_reserves] are at least the signing fee of @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!"
 nesnd_india_overseas_has_fir_target_tt:0 "At least one state in this region can sign [concept_foreign_investment_rights] with us"
 nesnd_india_overseas_has_claim_target_tt:0 "At least one state in this region holds a state we do not yet [concept_claim]"
 nesnd_india_overseas_no_existing_fir_tt:0 "We do not already hold an active [concept_foreign_investment_rights] [concept_treaty] with this country"
 nesnd_india_overseas_interest_2_tt:0 "Our [concept_interest_tier] in this country's capital region is at least $interest_tier_engaged$"
 nesnd_india_overseas_autonomy_tt:0 "Both countries have the diplomatic autonomy to initiate a [concept_diplomatic_play]"
 nesnd_india_overseas_treaty_allowed_tt:0 "Both countries meet the treaty rules for [concept_foreign_investment_rights]"
 nesnd_india_overseas_has_unclaimed_state_tt:0 "This country holds a state in the region without our [concept_claim]"
 nesnd_india_overseas_spend_50_tt:0 "Dealings in this direction decrease by #r 50#!."
 nesnd_india_overseas_diaspora_tt:0 "Establish a [concept_cultural_community] of our largest primary culture in the partner's capital state if one is not already present."
 nesnd_india_overseas_reset_bar_tt:0 "Dealings in this direction reset to zero."
 nesnd_india_overseas_not_now_tt:0 "Sign no treaty for now, leaving dealings and gold reserves unchanged."
 nesnd_india_overseas_claim_not_now_tt:0 "Press no claim for now, leaving dealings unchanged."
 nesnd_india_overseas.1.t:0 "Overseas Investment Charter"
 nesnd_india_overseas.1.d:0 "Commercial agents sent to [SCOPE.sStrategicRegion('india_overseas_region').GetName] have returned with replies from local courts. Domestic banks and merchant houses stand ready to finance mills and enterprises as soon as [ROOT.GetCountry.GetName] names the signatory, and clerks and accountants accompanying the mission are prepared to open branch offices in its capital."
 nesnd_india_overseas.1.f:0 "'Bills of exchange and articles of association are ready at our ports. Once the government names the signatory, our staff will proceed to its capital to open a branch.'\n— Report of the Overseas Chamber of Commerce to the Treasury"
 nesnd_india_overseas.1.a:0 "Sign with [SCOPE.sCountry('india_overseas_pick_1').GetName]"
 nesnd_india_overseas.1.b:0 "Sign with [SCOPE.sCountry('india_overseas_pick_2').GetName]"
 nesnd_india_overseas.1.c:0 "Sign with [SCOPE.sCountry('india_overseas_pick_3').GetName]"
 nesnd_india_overseas.1.d_opt:0 "Do Not Sign Yet"
 nesnd_india_overseas.2.t:0 "Indian Houses Open in the Capital"
 nesnd_india_overseas.2.d:0 "Envoys from [SCOPE.sCountry('india_overseas_investor').GetName] have signed an agreement in our capital permitting their investors to build workshops and trading houses on our soil. Arriving with the first remittances, [SCOPE.sCulture('india_overseas_culture').GetName] merchants and artisans have begun leasing quarters near the commercial districts and markets to settle and trade."
 nesnd_india_overseas.2.f:0 "'From this day, subjects of the signatory power may lease plots in this city, open warehouses and hire local hands upon payment of the stipulated duties.'\n— Notice of the Capital Commerce Office"
 nesnd_india_overseas.2.a:0 "Enforce the charter as signed."
 nesnd_india_overseas.2.a_tt:0 "We have signed a ten-year [concept_foreign_investment_rights] [concept_treaty] with [SCOPE.sCountry('india_overseas_investor').GetName], and a [SCOPE.sCulture('india_overseas_culture').GetName] [concept_cultural_community] is now present in our capital."
 nesnd_india_overseas.3.t:0 "Asserting Interests Abroad"
 nesnd_india_overseas.3.d:0 "Commercial networks and transport links from [ROOT.GetCountry.GetName] now operate across [SCOPE.sStrategicRegion('india_overseas_region').GetName], and diplomatic officials and military commanders are pressing the cabinet to state where our sphere lies. Ministers must choose a target among the regional governments on poor terms with us and formally proclaim our claim."
 nesnd_india_overseas.3.f:0 "'Unless we declare our rights openly, these routes and markets will pass into another power's hands.'\n— Confidential Memorandum of the Foreign Ministry to the Cabinet"
 nesnd_india_overseas.3.a:0 "Assert interests against [SCOPE.sCountry('india_overseas_pick_1').GetName]"
 nesnd_india_overseas.3.b:0 "Assert interests against [SCOPE.sCountry('india_overseas_pick_2').GetName]"
 nesnd_india_overseas.3.c:0 "Assert interests against [SCOPE.sCountry('india_overseas_pick_3').GetName]"
 nesnd_india_overseas.3.d_opt:0 "Not Now"
 nesnd_india_overseas.4.t:0 "A Territorial Claim from [SCOPE.sCountry('india_overseas_claimer').GetName]"
 nesnd_india_overseas.4.d:0 "[SCOPE.sCountry('india_overseas_claimer').GetName] has delivered a formal note claiming sovereignty over [SCOPE.sState('india_overseas_claimed_state').GetName]. Garrisons and provincial authorities have been ordered to keep watch against any pretext for intervention."
 nesnd_india_overseas.4.f:0 "'Your government's note advances an unfounded claim to our territory, which this ministry altogether rejects.'\n— Diplomatic Reply of the Foreign Ministry"
 nesnd_india_overseas.4.a:0 "Record the note."
 nesnd_india_overseas.4.a_tt:0 "[SCOPE.sCountry('india_overseas_claimer').GetName] now holds a [concept_claim] on [SCOPE.sState('india_overseas_claimed_state').GetName]."
 nesnd_india_overseas.5.t:0 "Indian Expansion in [SCOPE.sStrategicRegion('india_overseas_region').GetName]"
 nesnd_india_overseas.5.d:0 "Consuls report that [SCOPE.sCountry('india_overseas_actor').GetName] has been opening commercial agencies, concluding treaties and expanding trade routes across [SCOPE.sStrategicRegion('india_overseas_region').GetName]. Because [ROOT.GetCountry.GetName] or its dependencies hold territory in this region, ministers must decide how to respond."
 nesnd_india_overseas.5.f:0 "'Their trading houses and envoys are active across the region, and local governments have begun negotiating treaties directly with [SCOPE.sCountry('india_overseas_actor').GetName].'\n— Urgent Despatch from the Consulate"
 nesnd_india_overseas.5.a:0 "Deliver a diplomatic protest."
 nesnd_india_overseas.5.b:0 "Treat them as a rival."
 nesnd_india_overseas.5.b_tt:0 "Our diplomacy will treat [SCOPE.sCountry('india_overseas_actor').GetName] as a hostile rival."
 nesnd_india_overseas.5.c:0 "Pay no heed for now."
 nesnd_india_overseas.5.c_tt:0 "Take no diplomatic action against [SCOPE.sCountry('india_overseas_actor').GetName]."
 nesnd_india_overseas.6.t:0 "A Great Power's Reply Overseas"
 nesnd_india_overseas.6.d_protest:0 "The ambassador of [SCOPE.sCountry('india_overseas_reactor').GetName] has delivered a formal note to our Foreign Ministry protesting that the commercial and diplomatic activity of [ROOT.GetCountry.GetName] in [SCOPE.sStrategicRegion('india_overseas_region').GetName] infringes upon its established standing."
 nesnd_india_overseas.6.d_rival:0 "Our envoys report that the cabinet of [SCOPE.sCountry('india_overseas_reactor').GetName] has deliberated on the advance of [ROOT.GetCountry.GetName] in [SCOPE.sStrategicRegion('india_overseas_region').GetName] and instructed its diplomats and commanders to treat us as a rival."
 nesnd_india_overseas.6.d_ignore:0 "Although the government of [SCOPE.sCountry('india_overseas_reactor').GetName] is aware of our growing presence in [SCOPE.sStrategicRegion('india_overseas_region').GetName], it has lodged no protest and taken no countermeasures."
 nesnd_india_overseas.6.f:0 "'The legations of the great powers follow every commercial treaty and dealing we conclude in the neighbouring regions.'\n— Monthly Bulletin of the Foreign Ministry"
 nesnd_india_overseas.6.a:0 "Noted."
 nesnd_india_overseas.6.a_protest_tt:0 "Our [concept_relations] with [SCOPE.sCountry('india_overseas_reactor').GetName] have fallen by #r 20#!."
 nesnd_india_overseas.6.a_rival_tt:0 "[SCOPE.sCountry('india_overseas_reactor').GetName] now regards us as a rival."
 nesnd_india_overseas.6.a_ignore_tt:0 "[SCOPE.sCountry('india_overseas_reactor').GetName] has taken no action."
 nesnd_india_overseas.7.t:0 "Indian Ocean Trade"
 nesnd_india_overseas.7.d:0 "After years of patient diplomacy, [ROOT.GetCountry.GetName] holds both standing and investment charters across three surrounding regions. Across regional ports and markets, Indian merchant houses, diaspora communities and scheduled steamers now form a year-round network linking regional produce with our workshops."
 nesnd_india_overseas.7.f:0 "'Scheduled sailings to overseas ports have increased again this quarter, and remittances between our branch houses settle without interruption.'\n— Annual Report of the Indian Ocean Shipping Association"
 nesnd_india_overseas.7.a:0 "Both the monsoon and the steamship serve our trade."
