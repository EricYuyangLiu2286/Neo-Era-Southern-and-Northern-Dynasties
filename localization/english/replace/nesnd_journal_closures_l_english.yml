l_english:
 nesnd_journal_closures_header:0 "This agenda ends when:"
 nesnd_journal_closures_effect_header:0 "On conclusion:"
 nesnd_journal_closures_parent_cne:0 "This undertaking ends with “$ce_cne_land_reform$”."
 nesnd_journal_closures_parent_qin:0 "This court agenda ends with “$nesnd_qe1_agenda_journal$”."
 nesnd_journal_closures_restoration_tt:0 "This country is no longer involved in the former indigenous restoration talks, or the dispute has become a confrontation between governments."
 nesnd_journal_closures_restoration_conclusion:0 "This country’s former indigenous restoration talks have ended."
 nesnd_journal_closures_austria_tt:0 "Austria has lost its independence, or this country no longer continues the Austrian state."
 nesnd_journal_closures_austria_conclusion:0 "Austria can no longer conduct its intervention in Italy on the former basis."
 nesnd_journal_closures_america_tt:0 "$HUS$ no longer exists or has become an indigenous successor state, or this country is no longer the United States of America."
 nesnd_journal_closures_america_conclusion:0 "The continental expansion agenda centred on $HUS$ has ended."
 nesnd_journal_closures_india_society_tt:0 "The country is no longer an Indian imperial state with completed reforms and Nationalism."
 nesnd_journal_closures_india_society_conclusion:0 "The former agenda of building a common Indian identity has ended."
 nesnd_journal_closures_india_princes_tt:0 "This country is no longer a local state holding territory in India."
 nesnd_journal_closures_india_princes_conclusion:0 "The former Indian princely state’s diplomatic arrangements have ended."
 nesnd_journal_closures_india_dynasty_tt:0 "The monarchy has been abolished, or the programme of building a common Indian identity has ended."
 nesnd_journal_closures_india_dynasty_conclusion:0 "This country’s agenda of sustaining political allegiance to the dynasty has ended."
 nesnd_journal_closures_india_france_tt:0 "France no longer exists, or this country is no longer an Indian imperial or local state."
 nesnd_journal_closures_india_france_conclusion:0 "The former diplomatic requests to France and French advisory arrangements have ended."
 nesnd_journal_closures_india_uprising_tt:0 "The country is no longer an Indian imperial state; or no uprising contact is under way and neither the Southern Dynasty nor its Tianzhu Commission rules land in $STATE_CIRCARS$, $STATE_KURNOOL$, $STATE_MADRAS$, $STATE_MYSORE$, $STATE_TRAVANCORE$ or $STATE_GUJARAT$."
 nesnd_journal_closures_india_uprising_conclusion:0 "The former programme of uprising contacts has ended."
 nesnd_journal_closures_japan_cohesion_tt:0 "This country is no longer one of the three Japanese states."
 nesnd_journal_closures_japan_cohesion_conclusion:0 "The national cohesion agenda of the former Japanese state has ended."
 nesnd_journal_closures_japan_foreign_tt:0 "This country is no longer one of the three Japanese states."
 nesnd_journal_closures_japan_foreign_conclusion:0 "The diplomatic requests of the former Japanese state have ended."
 nesnd_journal_closures_ottoman_recovery_tt:0 "This country no longer continues the Ottoman state."
 nesnd_journal_closures_ottoman_recovery_conclusion:0 "The military and political arrangements supporting Ottoman recovery have ended."
 nesnd_journal_closures_ottoman_unity_tt:0 "This country no longer continues the Ottoman state."
 nesnd_journal_closures_ottoman_unity_conclusion:0 "The Ottoman state’s former cohesion policy has ended."
 nesnd_journal_closures_persia_west_tt:0 "Persia has left the westward expansion policy supported by Western Qin, or this country no longer continues the Persian state."
 nesnd_journal_closures_persia_west_conclusion:0 "The agenda of westward expansion with Western Qin’s support has ended."
 nesnd_journal_closures_persia_east_tt:0 "Persia has left its policy of covertly challenging Western Qin, or this country no longer continues the Persian state."
 nesnd_journal_closures_persia_east_conclusion:0 "The expansion agenda directed against Western Qin’s frontier has ended."
 nesnd_journal_closures_qin_court_tt:0 "The country is no longer Western Qin, or any of the following applies: Universal Suffrage or a Council Republic has been enacted, fewer than five states remain under direct rule, or the three-way court arrangement has ended."
 nesnd_journal_closures_qin_court_conclusion:0 "The former court arrangements among the imperial house, the literati and the army have ended."
 nesnd_journal_closures_qin_unity_tt:0 "The country is no longer Western Qin, or the Western Qin Empire has dissolved."
 nesnd_journal_closures_qin_unity_conclusion:0 "The former arrangements for a common identity across Western Qin’s lands have ended."
 nesnd_journal_closures_south_succession_tt:0 "The Southern Dynasty’s Ming–Wu dispute has been settled or has become a civil war."
 nesnd_journal_closures_south_succession_conclusion:0 "The Ming–Wu dispute has moved beyond the former phase of debate and alignment."
 nesnd_journal_closures_xiangyang_tt:0 "This country no longer owns the whole Xiangyang region."
 nesnd_journal_closures_xiangyang_conclusion:0 "The Xiangyang camp no longer has its full territorial base, ending its military support."
