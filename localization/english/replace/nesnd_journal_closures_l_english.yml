l_english:
 nesnd_journal_closures_header:0 "This agenda ends when:"
 nesnd_journal_closures_effect_header:0 "On conclusion:"
 nesnd_cohesion_fixed_by_ideas_conclusion:0 "National identities have settled as social thought has changed. Cultural affiliation across the country no longer rises and falls with cohesion."
 nesnd_cohesion_fixed_by_ideology_conclusion:0 "The spread of new political ideologies has redefined how ethnicity, popular identity, class and the national cause relate to one another. Cultural affiliation across the country no longer rises and falls with cohesion."
 nesnd_journal_closures_parent_cne:0 "While $ce_cne_land_reform$ is in effect."
 nesnd_journal_closures_parent_qin:0 "While $nesnd_qe1_agenda_journal$ is in session."
 nesnd_journal_closures_restoration_tt:0 "We are no longer involved in the former indigenous restoration talks, or the dispute has become a confrontation between governments."
 nesnd_journal_closures_restoration_conclusion:0 "We have withdrawn from the former indigenous restoration talks."
 nesnd_journal_closures_austria_tt:0 "Austria has lost its independence, or we no longer continue the Austrian state."
 nesnd_journal_closures_austria_conclusion:0 "Austria can no longer conduct its intervention in Italy on the former basis."
 nesnd_journal_closures_america_tt:0 "$HUS$ no longer exists or has become an indigenous successor state, or we are no longer the United States of America."
 nesnd_journal_closures_america_conclusion:0 "The continental expansion agenda centerd on $HUS$ has ended."
 nesnd_journal_closures_india_society_tt:0 "The country is no longer an Indian imperial state with completed reforms and Nationalism."
 nesnd_journal_closures_india_society_conclusion:0 "The former agenda of building a common Indian identity has ended."
 nesnd_journal_closures_india_princes_tt:0 "We are no longer a local state holding territory in India."
 nesnd_journal_closures_india_princes_conclusion:0 "Our diplomacy as an Indian princely state has ended."
 nesnd_journal_closures_india_dynasty_tt:0 "[GetLawType('law_monarchy').GetName] has been abolished, or the programme of building a common Indian identity has ended."
 nesnd_journal_closures_india_dynasty_conclusion:0 "The campaign to win the provinces' allegiance to the dynasty has ended."
 nesnd_journal_closures_india_france_tt:0 "Our country is no longer eligible to send these missions."
 nesnd_journal_closures_india_france_conclusion:0 "The mission will cease seeking aid. Any [GetStaticModifier('nesnd_india_french_advisers').GetName] still serving in our country will depart."
 nesnd_journal_closures_india_uprising_tt:0 "The country is no longer an Indian imperial state; or no uprising contact is under way and neither the Southern Dynasty nor its Tianzhu Commission rules land in $STATE_CIRCARS$, $STATE_KURNOOL$, $STATE_MADRAS$, $STATE_MYSORE$, $STATE_TRAVANCORE$ or $STATE_GUJARAT$."
 nesnd_journal_closures_india_uprising_conclusion:0 "The former programme of uprising contacts has ended."
 nesnd_journal_closures_japan_cohesion_tt:0 "We are no longer one of the three Japanese states."
 nesnd_journal_closures_japan_cohesion_conclusion:0 "The national cohesion agenda of the former Japanese state has ended."
 nesnd_journal_closures_japan_foreign_tt:0 "We are no longer one of the three Japanese states."
 nesnd_journal_closures_japan_foreign_conclusion:0 "The diplomatic requests of the former Japanese state have ended."
 nesnd_journal_closures_ottoman_recovery_tt:0 "We no longer continue the Ottoman state."
 nesnd_journal_closures_ottoman_recovery_conclusion:0 "The Ottoman government's plan for military and political recovery has ended."
 nesnd_journal_closures_ottoman_unity_tt:0 "We no longer continue the Ottoman state."
 nesnd_journal_closures_ottoman_unity_conclusion:0 "The Ottoman state’s former cohesion policy has ended."
 nesnd_journal_closures_persia_west_tt:0 "Persia has left the westward expansion policy supported by Western Qin, or we no longer continue the Persian state."
 nesnd_journal_closures_persia_west_conclusion:0 "The agenda of westward expansion with Western Qin’s support has ended."
 nesnd_journal_closures_persia_east_tt:0 "Persia has left its policy of covertly challenging Western Qin, or we no longer continue the Persian state."
 nesnd_journal_closures_persia_east_conclusion:0 "The expansion agenda directed against Western Qin’s frontier has ended."
 nesnd_journal_closures_qin_court_tt:0 "The country is no longer Western Qin, or any of the following applies: [GetLawType('law_universal_suffrage').GetName] or [GetLawType('law_council_republic').GetName] has been enacted, fewer than five states remain under direct rule, or the three-way court council has ended."
 nesnd_journal_closures_qin_court_conclusion:0 "The imperial house, the literati and the army no longer deliberate together."
 nesnd_journal_closures_qin_unity_tt:0 "The country is no longer Western Qin, or the Western Qin Empire has dissolved."
 nesnd_journal_closures_qin_unity_conclusion:0 "The Western Qin court has abandoned its policy of a common identity across its lands."
 nesnd_journal_closures_south_succession_tt:0 "The Southern Dynasty’s Ming–Wu dispute has been settled or has become a civil war."
 nesnd_journal_closures_south_succession_conclusion:0 "The Ming–Wu dispute has moved beyond the former phase of debate and alignment."
 nesnd_journal_closures_xiangyang_tt:0 "We no longer own the whole Xiangyang region."
 nesnd_journal_closures_xiangyang_conclusion:0 "The Xiangyang camp no longer has its full territorial base, ending its military support."
 nesnd_journal_closures_no_effect_tt:0 "The journal ends with no further effect."
 nesnd_journal_closures_poland_war_prep_tt:0 "The war preparation modifiers from each stage are removed."
 nesnd_journal_closures_poland_block_tt:0 "The containment modifiers from each stage are removed."
 nesnd_journal_closures_restoration_effect_tt:0 "“$nesnd_native_local_councils$” is removed."
 nesnd_journal_closures_austria_effect_tt:0 "“$nesnd_austrian_italian_commitment$” is removed."
 nesnd_journal_closures_india_order_effect_tt:0 "Our tax, military and schooling arrangements with our [Concept('concept_subject','$concept_subjects|q$')] are dissolved, and “$nesnd_india_order_tax_central$”, “$nesnd_india_order_army_central$” and “$nesnd_india_order_school_central$” are removed."
 nesnd_journal_closures_india_foreign_effect_tt:0 "Any unanswered request lapses, and “$nesnd_india_french_advisers$”, “$nesnd_india_french_teachers$”, “$nesnd_india_french_engineers$” and “$nesnd_india_french_officers$” are removed."
 nesnd_journal_closures_japan_cohesion_effect_tt:0 "The change of culture forecast for the next monthly update is cancelled, and “$nesnd_jp_unity_concord$”, “$nesnd_jp_unity_discord$”, “$nesnd_jp_divided_councils$”, “$nesnd_unity_material_assistance$” and “$nesnd_unity_political_assistance$” are removed."
 nesnd_journal_closures_japan_foreign_effect_tt:0 "Any unanswered request lapses."
 nesnd_journal_closures_ottoman_recovery_effect_tt:0 "“$nesnd_ottoman_qin_reform$” and the military modifiers that followed it are removed."
 nesnd_journal_closures_ottoman_unity_effect_tt:0 "“$nesnd_ottoman_divided_provinces$” and “$nesnd_ottoman_common_allegiance$” are removed."
 nesnd_journal_closures_conversion_plan_tt:0 "The change of culture forecast for the next monthly update is cancelled."
 nesnd_journal_closures_conversion_subsidy_tt:0 "The change of culture forecast for the next monthly update is cancelled, and “$nesnd_unity_material_assistance$” and “$nesnd_unity_political_assistance$” are removed."
 nesnd_journal_closures_small_livelihood_effect_tt:0 "“$nesnd_small_specialised_market$”, “$nesnd_small_own_market$”, “$nesnd_small_public_investment$” and “$nesnd_small_public_services$” are removed."
 nesnd_journal_closures_shu_army_effect_tt:0 "“$nesnd_sih_xiao_holds$” and “$nesnd_sih_wei_rules$” are removed."
