l_english:
 JTK: "Fu"
 JTK_ADJ: "Tokugawa"
 JIM: "Wa"
 JIM_ADJ: "Imperial Japanese"
 nesnd_toyotomi_sang: "Sang"
 nesnd_united_japan: "Japan"
 nesnd_wu_eastern_question: "The Eastern Settlement"
 nesnd_wu_eastern_question_reason: "The Toyotomi unified Japan with Ming and Wu assistance and fought beside the Zheng in Korea. Their old alliance bound the garrisons in Kyushu to the interests of Japan’s lords. With affairs in the south settled, the court is considering an expedition: send former western officers overseas and establish imperial and Tokugawa governments alongside the Toyotomi, while placing Kyushu and Shikoku under direct Wu administration. The settlement would also reshape overseas garrisons and maritime trade."
 nesnd_wu_eastern_question_status: "Readiness: #v finance and administration, army and government, navy and supplies#!. All three are required to send terms."
 nesnd_wu_eastern_question_status_offer: "The terms have been delivered. Await the Japanese response and the court decision."
 nesnd_wu_eastern_question_status_war: "The intervention is in a [concept_diplomatic_play] or war. Partition requires enforcement of its war goal."
 nesnd_wu_eastern_question_goal: "Settle the negotiations or preserve the current arrangement."
 nesnd_japan_send_terms: "Propose the eastern settlement"
 nesnd_japan_send_terms_desc: "Divide authority among the Emperor, Toyotomi and Tokugawa."
 nesnd_japan_send_terms_requirements: "Nonnegative income and bureaucracy; legitimacy at least 50; army and naval projection at least Japan's; a nonzero fleet with at least 90% maintenance fulfillment. Neither country may be at war or committed to a diplomatic play, nor have a mutual truce. Japan must fully own Kanto, Kyoto, Kansai and Chugoku. Japan must retain a Toyotomi monarchy, with Fu and Wa not yet existing."
 nesnd_japan_accept_status_quo: "Preserve the existing settlement"
 nesnd_japan_accept_status_quo_desc: "Keep the current borders and Japanese government; retain resources for the mainland and other overseas commitments."
 nesnd_japan_partition_tt: "#bold Territorial settlement#!\nJapanese Kyushu and Shikoku pass to Wu. Tokugawa Fu receives Kanto and existing northern Japanese holdings; Imperial Wa receives Kyoto and Osaka. Toyotomi retains the rest of Kansai, Chugoku and Korean holdings. New states become Wu protectorates. An independent Toyotomi state also becomes a protectorate; an existing subject relationship is retained. #v Foreign territory is not transferred.#!"
 nesnd_japan_war_tt: "If Japan is a Wu subject, it will become independent as the [concept_diplomatic_play] begins. Wu demands the reorganization of Japan; Japan demands Wu’s humiliation. #v The territorial settlement takes effect only if Wu’s war goal is enforced.#!"
 dp_nesnd_eastern_intervention: "Intervention in Japan"
 wg_nesnd_japan_reorganization: "Reorganize Japan"
 wg_nesnd_japan_reorganization_action_name: "Reorganize Japan"
 nesnd_japan_reunification: "One Realm"
 nesnd_japan_reunification_reason: "Alliances across the strait once helped the Toyotomi conquer their rivals and allowed the mainland court to intervene in Japan. Taxes, armies and commerce now follow competing authorities. [ROOT.GetCountry.GetName] seeks the principal islands and the freedom to govern their affairs."
 nesnd_japan_reunification_status: "Progress counts the #v nine fully controlled core regions#!. Independence is also required. Hokkaido, Ryukyu and Korea are outside this journal's territorial requirements."
 nesnd_japan_reunification_goal: "Become independent and fully control Kanto, Kyoto, Kansai, Chugoku, Kyushu, Shikoku, Tokai, Tohoku and Hokushinetsu."
 nesnd_japan_integrated: "A United Realm"
 nesnd_japan.1.t: "The Eastern Fiefs"
 nesnd_japan.1.d: "Envoys from Nanjing have brought new terms. Kyoto and Osaka would recognize the Emperor, with a regent conducting the government; the Tokugawa would rule from Edo, the Toyotomi would retain a reduced western domain, and Wu would administer Kyushu and Shikoku directly. The mainland court whose armies helped establish Toyotomi power now proposes to divide it. Retainers have reported the strength and supplies of the garrisons to [ROOT.GetCountry.GetRuler.GetFullName], who must decide how to answer."
 nesnd_japan.1.a: "Preserve the Toyotomi domain."
 nesnd_japan.1.b: "Japan shall decide its own affairs."
 nesnd_japan.1.c: "Negotiate for a united Japan."
 nesnd_japan.2.t: "The Toyotomi Reply"
 nesnd_japan.2.d: "Japan asks the court to withdraw the partition proposal and retain a unified Toyotomi government. The proposed expedition would establish new Japanese governments and divide the forces and revenues now commanded by the Toyotomi. It would also require new arrangements for military spending, shipping and overseas defence. The decision rests with [ROOT.GetCountry.GetRuler.GetFullName]."
 nesnd_japan.2.a: "Escort the expedition to Japan."
 nesnd_japan.2.b: "Accept their request."
 nesnd_japan.3.t: "Four Eastern Governments"
 nesnd_japan.3.d: "The settlement in Japan is in force. The Toyotomi retain Chugoku and the remainder of Kansai; the Tokugawa take Edo and the northern domains. Kyoto and Osaka recognize the Emperor, with a regent conducting Wa’s government. Wu administers Kyushu and Shikoku directly. The new governments take charge of local revenues and armies, dividing the resources once commanded by the Toyotomi."
 nesnd_japan.3.a: "Set the administrations in order."
 nesnd_japan.4.t: "The Expedition Concludes"
 nesnd_japan.4.d: "The conflict has ended without implementation of the partition. Fleets and garrisons will redeploy under the existing borders and agreements."
 nesnd_japan.4.a: "Honor the current settlement."
 nesnd_japan.5.t: "The Realm United"
 nesnd_japan.5.d: "Honshu now answers to one independent government. [ROOT.GetCountry.GetName] is bringing the revenues and armies of the former domains under common authority. Merchants in the castle towns await a settlement of tolls and taxes as they prepare to trade beyond the old domain boundaries."
 nesnd_japan.5.a: "Restore the country's strength."
 nesnd_wu_eastern_question_progress: "Readiness: #v [JournalEntry.GetGoalProgressValue|0] / [JournalEntry.GetGoalAddValue|0]#!"
 nesnd_japan_reunification_progress: "Core regions: #v [JournalEntry.GetGoalProgressValue|0] / [JournalEntry.GetGoalAddValue|0]#!"
 nesnd_japan_tokugawa_successor_name: "Iechika"
 nesnd_japan_yamato_successor_name: "Yorihito"
 nesnd_japan.2.d_commander: "Japan asks to retain its unified government. [SCOPE.sCharacter('nesnd_japan_commander').GetFullName] has been charged with preparing the expedition. Former western officers will leave the mainland with their commander, supported by the fleet, treasury and allied Japanese lords. Victory would provide territories for the Emperor and Tokugawa. The court must now decide whether to pursue the terms by force."
 dp_nesnd_eastern_intervention_desc: "Wu demands separate Imperial, Tokugawa, Toyotomi and directly administered territories in Japan."
 dp_nesnd_eastern_intervention_tooltip: "#header $dp_nesnd_eastern_intervention$#!\n$dp_nesnd_eastern_intervention_desc$"
 war_goal_wg_nesnd_japan_reorganization: "Reorganize Japan"
 war_goal_wg_nesnd_japan_reorganization_desc: "$nesnd_japan_partition_tt$"
