 nesnd_jp_korea_governor_terms:0 "Local taxation capacity #g +15%#!, effects of local [concept_turmoil] #r +10%#!, national government wages #r +5%#!. Expand and staff the local administrations to file the tax rolls."
 nesnd_jp_korea_councils_terms:0 "Local education access #g +10#! percentage points, effects of [concept_turmoil] #g −10%#!, taxation capacity #r −10%#!, national government wages #r +5%#!. Invest in education and staff a local university to vote the school grant."
 nesnd_jp_korea_year_tt:0 "All requirements must hold at #v 12#! consecutive monthly reviews (currently #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_jp_korea_months')|0]/12#!). A failed review starts the count over."
 nesnd_jp_register_korea:0 "File the Tax Rolls"
 nesnd_jp_register_korea_desc:0 "Have each collector sign his roll. If a household is charged twice, it will know whose door to knock on."
 nesnd_jp_endow_korea:0 "Vote the School Grant"
 nesnd_jp_endow_korea_desc:0 "Put the teachers’ salaries to a vote. Post the sums where parents can read the names beside them."
 nesnd_jp_register_korea_reward:0 "Ratify the governors’ charter and conclude $nesnd_jp_korea$. Our current holdings gain $nesnd_jp_korea_tax_rolls$ for #v 3#! years, granting #g +10%#! taxation capacity. The governors stay in office at the existing administrative cost."
 nesnd_jp_endow_korea_reward:0 "Ratify the councils’ charter and conclude $nesnd_jp_korea$. Our current holdings gain $nesnd_jp_korea_school_fund$ for #v 3#! years, granting #g +5#! percentage points of education access. The councils stay in office at the existing administrative cost."
 nesnd_jp_korea_tax_rolls:0 "Certified Tax Rolls"
 nesnd_jp_korea_school_fund:0 "Local School Fund"
 nesnd_jp_korea_charter_header:0 "Ratification of the Charter"
 nesnd_jp_korea_charter_tt:0 "We have filed the tax rolls or voted the school grant and ratified the charter"
 nesnd_jp_korea_charter_conclusion:0 "The charter has taken effect. Local taxes and civil affairs remain under the appointed administration. An independent government can still offer to return the holdings through $nesnd_jp_foreign$."
 nesnd_jp_korea_treaty_header:0 "A Negotiated Return"
 nesnd_jp_korea_treaty_tt:0 "After independence, our envoy from $nesnd_jp_foreign$ has secured Korean or suzerain consent to the transfer"
 nesnd_jp_korea_no_land_tt:0 "We no longer own any holdings in $STATE_BUSAN$ or $STATE_YANGHO$"
 nesnd_jp_korea_treaty_conclusion:0 "Our holdings in $STATE_BUSAN$ and $STATE_YANGHO$ have passed to Korea under the settlement."
 nesnd_jp_korea_exit_header:0 "End of Charter Proceedings"
 nesnd_jp_korea_exit_effect_header:0 "Local Administration"
 nesnd_jp_korea_exit_tt:0 "We lose our last holding, Korea ceases to exist, or the Korean Restoration Movement opens"
 nesnd_jp_korea_exit_conclusion:0 "The charter proceedings have closed. If a restoration movement arises after Korea falls, every country holding land on the peninsula will face it."
 nesnd_jp_coast.1.t:0 "The Tax Roll"
 nesnd_jp_coast.1.d:0 "The governor called for the year’s receipts along with the rolls. One boatman had paid at the ferry and again at the town gate. Both slips bore an official seal. The collectors offered to strike one entry so the books would balance. The boatman asked to have both receipts bound into the roll. Whoever charged him twice next year could sign for it in front of him. The governor agreed."
 nesnd_jp_coast.1.f:0 "“Both receipts presented by the boatman are to be bound into the tax register. Anyone who collects the tax a second time must sign in his presence.”\n- The governor's instruction"
 nesnd_jp_coast.1.a:0 "Keep both receipts."
 nesnd_jp_coast.2.t:0 "The School Vote"
 nesnd_jp_coast.2.d:0 "The council had just read out the teachers’ salaries when a voice from the back asked how children on the far bank were to attend. A ferryman offered a crossing each morning and evening if the school fund would pay the fare. The clerk opened the ledger and asked him to name his price. A second ferryman raised his hand."
 nesnd_jp_coast.2.f:0 "“Agreed: pupils from across the ferry are to be carried over to the school by a boatman morning and evening. The fare is to be paid from the school fund, the price to be settled.”\n- Minutes of the council"
 nesnd_jp_coast.2.a:0 "Take down both bids."
 nesnd_jp_foreign.1.t:0 "An Envoy from [SCOPE.sCountry('jp_sender').GetNameNoFormatting]"
 nesnd_jp_foreign.1.d1:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] seeks greater authority over its own affairs and asks us to relax the present subject relationship. The envoy argues that greater autonomy would let the local government respond to domestic needs while preserving ties between our countries."
 nesnd_jp_foreign.1.d2:0 "An envoy from [SCOPE.sCountry('jp_sender').GetNameNoFormatting] asks us to end the subject relationship. Their government seeks control over diplomacy, the military and trade, and wishes to deal with us as an independent country. We must decide whether to relinquish our authority as overlord."
 nesnd_jp_foreign.1.d3:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] wishes to reform appointments, military administration and political representation. Its envoy seeks our assent so that the government can rally supporters and pursue its programme. The existing subject relationship would remain in place."
 nesnd_jp_foreign.1.d4:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] is seeking funds for workshop construction. Its envoy asks us for a grant to expand production and train skilled workers, arguing that growing industry would deepen ties between our countries."
 nesnd_jp_foreign.1.d5:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] proposes a settlement over southern Korea. Its government offers to relinquish claims to Busan and Yangho and transfer any territory it still holds there to Korea. The envoy asks us to accept these terms and settle the dispute."
 nesnd_jp_foreign.1.d6:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] asks us to recognise its government as the leader of Japanese unification and place our territory under its rule. Accepting would end our existence as a separate state."
 nesnd_jp_foreign.1.d7:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] seeks our permission to negotiate union with other Japanese subjects. Its government would lead the union, with each invited country surrendering its separate government only by consent. We must decide whether to allow such negotiations within the existing subject order."
 nesnd_jp_foreign.1.d:0 "An envoy from [SCOPE.sCountry('jp_sender').GetNameNoFormatting] has arrived with a proposal concerning relations between our countries and awaits our reply."
 nesnd_jp_foreign.1.f:0 "“Our envoy respectfully presents this letter of state and asks that Your Court permit our country to manage its own affairs.”\n- Letter presented by the vassal's envoy"
 nesnd_jp_foreign.1.a:0 "Accept the proposal."
 nesnd_jp_foreign.1.b:0 "We cannot accept these terms."
 nesnd_jp_foreign.2.t:0 "The Reply from [SCOPE.sCountry('jp_partner').GetNameNoFormatting]"
 nesnd_jp_foreign.3.t:0 "The Reply from [SCOPE.sCountry('jp_partner').GetNameNoFormatting]"
 nesnd_jp_foreign.2.d:0 "Our envoy has returned from [SCOPE.sCountry('jp_partner').GetNameNoFormatting] with an agreement. Their government has accepted the proposal."
 nesnd_jp_foreign.2.a:0 "Proceed as agreed."
 nesnd_jp_foreign.3.d:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting] has rejected the terms carried by our envoy. We failed to persuade them to concede, and the exchange has strained relations between our countries."
 nesnd_jp_foreign.3.a:0 "We must consider another course."
 nesnd_jp_toyotomi_court_name:0 "Hidetaka"
 nesnd_jp_development.2.d_court:0 "The court has confirmed new rules for representation and public office. The monarch still has the company of old retainers, but provincial administration is admitting officials with a different education.\n\nReformers loyal to the crown believe these concessions will preserve the monarchy. Whether those who have gained a voice will be satisfied remains an open question."
 nesnd_jp_development.2.d_military:0 "The officers have secured the centralised government they sought. Recruitment, training and supplies come under common direction, and local officials must carry out the government’s orders. Arsenals and tool workshops equip the expanded army, giving the military administration the means to enforce its policy in the provinces."
 nesnd_jp_development.2.d_representative:0 "Those entitled to vote now choose their representatives, and newspapers can debate the conduct of government. Officials face new rules of appointment, while political argument has spread beyond the old ruling families.\n\nSchools are bringing more people into this world. How the next generation will use these rights is theirs to decide."
 nesnd_jp_development.2.f:0 "“The new law is promulgated throughout the realm from this day, and all are to observe it.”\n- Decree of promulgation"
 nesnd_jp_sovereign_year:0 "Has remained independent for #v 12#! consecutive months"
 nesnd_jp_establish_edo:0 "The Government in Edo"
 nesnd_jp_establish_edo_reason:0 "Edo now governs extensive northern territories. Garrisons can hold the roads, but they cannot conduct every part of provincial administration. The government needs officials to organise its revenue and spending, while the castle towns must accommodate merchants, craftsmen and people seeking work away from home. A country that can pay for ordinary government will be better placed to seek greater powers."
 nesnd_jp_establish_kyoto:0 "Kyoto and Osaka"
 nesnd_jp_establish_kyoto_reason:0 "The courtiers of Kyoto and the merchants of Osaka have different connections and interests. Courtly rank does not pay soldiers, and private wealth does not become public revenue of its own accord. Officials must organise taxation and administration in the territories they govern so that the towns can pay for the new government."
 nesnd_jp_establish_toyotomi:0 "The Toyotomi Retainers"
 nesnd_jp_establish_toyotomi_reason:0 "Partition has deprived the Toyotomi retainers of their former authority over Japan, but the troops and households remaining in the west still need support. Old prestige cannot settle who collects the revenue or conducts local government. A working administration must be established in the surviving territories, with castle towns serving as centres of government, taxation and employment."
 nesnd_jp_establishment_required_tt:0 "The country has established a functioning provincial administration."
 nesnd_jp_independence_cooldown_tt:0 "At least six months have passed since our last independence play."
 nesnd_jp_settled_administration:0 "Provincial Administration Established"
 nesnd_jp_union_permission_required_tt:0 "Our overlord has authorised us to unite the Japanese states."
 nesnd_jp_foreign.2.d1:0 "Our overlord has agreed to loosen its control, granting us a more autonomous status. The two governments have established a five-year truce."
 nesnd_jp_foreign.2.d2:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting] has recognised our independence. The subject relationship is dissolved, and a five-year truce now stands between us. Our government will conduct its own domestic and foreign affairs."
 nesnd_jp_foreign.2.d3:0 "Our overlord has given its assent to domestic reform. We may pursue changes to public appointments, military administration and representation while the subject relationship remains in force."
 nesnd_jp_foreign.2.d4:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting] has provided development funds. The grant will support construction and the training of skilled workers. Further funding of this kind will be unavailable for three years."
 nesnd_jp_foreign.2.d5:0 "The Korean settlement has been accepted. Our claims to Busan and Yangho have been withdrawn, and any territory we still held there has passed to Korea. Future relations across the strait will proceed within these borders."
 nesnd_jp_foreign.2.d7:0 "Our overlord has authorised negotiations for union with the other Japanese subjects. Our envoys may now approach them, though each invited government must still consent to the union."
 nesnd_jp_foreign.2.f:0 "“The two countries agree to a truce of five years. The suzerain has granted our request, and the matters concerned will henceforth be decided by our own government.”\n- Text of the agreement between the two countries"
