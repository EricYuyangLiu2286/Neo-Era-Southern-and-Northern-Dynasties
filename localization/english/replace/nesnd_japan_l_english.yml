 nesnd_jp_court_debate:0 "Reform of the Monarchy"
 nesnd_jp_court_settlement:0 "A Constitutional Settlement"
 nesnd_jp_military_debate:0 "The Officers’ Reform Campaign"
 nesnd_jp_military_settlement:0 "Military Renewal"
 nesnd_jp_representative_debate:0 "The Movement for Representation"
 nesnd_jp_representative_settlement:0 "Representative Government Established"
 nesnd_jp_reform_effort:0 "The Reformers’ Campaign"
 nesnd_jp_independent_state:0 "The Standing of an Independent State"
 nesnd_jp_home_waters:0 "Kyushu and Shikoku Reunited"
 nesnd_jp_opening_dispute:0 "The Debate over Opening"
 nesnd_jp_development.1.t:0 "The Foundations of Independence"
 nesnd_jp_development.1.d:0 "Foreign envoys now deal directly with our government. Defence and overseas affairs, once conducted through an overlord, rest on institutions of our own.\n\nThe merchants and local leaders who supported independence have not retired from public life. They have brought new petitions, expecting the government to honour its promises."
 nesnd_jp_development.1.f:0 "“We supported independence because you promised that merchants would have a say in the government of the country. We ask you now to keep that promise.”\n- Joint petition of merchants and local notables"
 nesnd_jp_development.1.a:0 "We shall decide our own affairs."
 nesnd_jp_development.2.t:0 "Reform Takes Root"
 nesnd_jp_development.2.d:0 "A new system of appointing officials is in place, and the laws have changed how power is distributed. Families accustomed to holding local office by birth must now contend with positions and powers defined by the state. Officials, soldiers and merchants who took part in reform are finding their places within it, and it now governs the daily work of the offices."
 nesnd_jp_development.2.a:0 "Let these reforms endure."
 nesnd_jp_foreign:0 "Diplomacy in East Asia"
 nesnd_jp_foreign_reason:0 "Aid from the mainland court helped the Toyotomi subdue Japan, binding tribute and maritime trade to the politics of the islands. Greater autonomy touches an overlord’s revenue, naval interests and influence in Japan. Those interests endure even when the old obligations are dissolved."
 nesnd_jp_korea:0 "Across the Strait"
 nesnd_jp_korea_reason:0 "In the Imjin War of 1592 the allied armies of the Toyotomi and the State of Wu defeated a Korea backed by the Ming court at Yanjing and by Qi. Korea ceded all its territory south of Hanseong and moved its court to Pyongyang. Only when the State of Yan sent its army into the peninsula was the Wu and Japanese advance halted. For more than two centuries since, [GetStateRegion('STATE_BUSAN').GetName] and [GetStateRegion('STATE_YANGHO').GetName] have been fiefs of the Toyotomi house's samurai daimyo.\n\nThe daimyo's rule rests on a bargain. Those yangban landlords willing to bow kept their estates and farmed the taxes for the daimyo, who did not merely ignore how they bled their serfs but gladly indulged it. The samurai read the Confucian classics for self-cultivation alone and never treated them as a qualification for office, so a Korean scholar steeped in the classics can find no road into office under the daimyo. The daimyo have also pressed the Japanese language and the martial arts on their domains, while Chinese characters remain in common use, Korea and Japan alike living under the influence of the Northern Ming states. The daimyo have patronised Buddhism as well, whereas the Joseon dynasty had favoured Confucianism over Buddhism from its founding, seizing temple lands, merging the sects and barring monks from Hanseong itself. To the Korean gentry, the daimyo are nothing but a band of warriors who have never read the sages.\n\nSuch rule ought to have collapsed long ago. Wu, however, needed a puppet at the southern tip of the peninsula to hold Yan and its vassal court at Pyongyang in check, and time and again it stood behind the daimyo. So the daimyo held their ground and became the firmest pillar of the Toyotomi shogunate, their samurai the warriors most loyal to the Toyotomi house. As for the Koreans, the shogunate and the Japanese domains have only ever known repression. No one has ever meant to give them an assembly."
 nesnd_jp_envoy_away:0 "Our envoy is awaiting a reply."
 nesnd_jp_envoy_rest:0 "The delegation is not yet ready to depart again. Envoys may be sent once every #v 6#! months."
 nesnd_jp_subject_treaties:0 "The country remains subject to an overlord and may negotiate over autonomy and development. Envoys may be sent once every #v 6#! months."
 nesnd_jp_independent_treaties:0 "The country may seek foreign assistance and union on its own behalf. Envoys may be sent once every #v 6#! months."
 nesnd_jp_korea_undecided:0 "Both provinces are still ruled by samurai deputies and cannot be incorporated. No policy has yet been chosen for our holdings, and once chosen it cannot be changed."
 nesnd_jp_seek_autonomy:0 "Seek Greater Autonomy"
 nesnd_jp_seek_autonomy_desc:0 "Ask the overlord to relax its control and raise our subject relationship by one autonomy level.\n\nAcceptance will establish a #v 5#!-year truce between the two countries."
 nesnd_jp_seek_independence:0 "Negotiate Independence"
 nesnd_jp_seek_independence_desc:0 "Ask the overlord to end the subject relationship and recognise our right to govern our own affairs.\n\nAcceptance will establish a #v 5#!-year truce between the two countries."
 nesnd_jp_seek_reform_permission:0 "Request Leave to Reform"
 nesnd_jp_seek_reform_permission_desc:0 "Seek the overlord’s assent to domestic reform, allowing us to reconsider appointments, military administration and political representation."
 nesnd_jp_seek_union_permission:0 "Request Leave to Unite"
 nesnd_jp_seek_union_permission_desc:0 "Ask the overlord to permit negotiations with other Japanese subjects over a voluntary union."
 nesnd_jp_seek_overlord_capital:0 "Seek Development Funds from the Overlord"
 nesnd_jp_seek_overlord_capital_desc:0 "Ask the overlord to fund workshops and the training of skilled workers, giving domestic production room to grow.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_cne:0 "Seek Capital from the North"
 nesnd_jp_seek_capital_cne_desc:0 "Seek development funds from $nesnd_lobby_name_cne$, offering closer commercial ties as a reason to support our growing industries.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_hus:0 "Seek Capital from Dongzhou"
 nesnd_jp_seek_capital_hus_desc:0 "Approach Dongzhou for funds to build workshops, making the case for closer trade and industrial development.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_usm:0 "Seek Capital from [SCOPE.sCountry('nesnd_label_usm').GetName]"
 nesnd_jp_seek_capital_usm_desc:0 "[SCOPE.sCountry('nesnd_label_usm').GetName] has long-standing commercial ties with $nesnd_lobby_name_jap$. Draw on these connections to seek funds for workshops and the training of skilled labour.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_independence_play:0 "An Ultimatum for Independence"
 nesnd_jp_independence_play_desc:0 "Issue an ultimatum for independence, opening an independence [concept_diplomatic_play] and preparing to enforce the demand through war."
 nesnd_jp_union_jap:0 "Invite [SCOPE.sCountry('nesnd_label_jap').GetName] to Join Us"
 nesnd_jp_union_jap_desc:0 "Propose a union to [SCOPE.sCountry('nesnd_label_jap').GetName]. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_union_jtk:0 "Invite [SCOPE.sCountry('nesnd_label_jtk').GetName] to Join Us"
 nesnd_jp_union_jtk_desc:0 "Propose a union to [SCOPE.sCountry('nesnd_label_jtk').GetName]. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_union_jim:0 "Invite [SCOPE.sCountry('nesnd_label_jim').GetName] to Join Us"
 nesnd_jp_union_jim_desc:0 "Propose a union to [SCOPE.sCountry('nesnd_label_jim').GetName]. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_korean_governor:0 "Open the Korean Examinations"
 nesnd_jp_korean_governor_desc:0 "Times have changed, and we have come to see that samurai daimyo are not fit to rule the land of Goryeo. Think about it: what would the 'men of Tang' do?"
 nesnd_jp_korean_councils:0 "Back a Korean Kampaku"
 nesnd_jp_korean_councils_desc:0 "There will be no assembly. We shall raise a kampaku from the Korean gentry to command both provinces in the name of [ROOT.GetCountry.GetName], with deputies and yangban alike under his authority."
 nesnd_jp_korean_envoy:0 "Negotiate a Korean Settlement"
 nesnd_jp_korean_envoy_desc:0 "Offer $nesnd_lobby_name_kor$ the return of our holdings. If $nesnd_lobby_name_kor$ has an overlord, the offer goes to its overlord. Acceptance transfers our land in $STATE_BUSAN$ and $STATE_YANGHO$ to $nesnd_lobby_name_kor$ and relinquishes our claims to both regions."
 nesnd_jp_foreign_workshops:0 "Foreign Development Assistance"
 nesnd_jp_korea_governor:0 "Korean Examinations Opened"
 nesnd_jp_korea_councils:0 "Korean Kampaku Backed"
 nesnd_jp_korea_administration:0 "Administration of the Korean Holdings"
 nesnd_jp_korea_land_tt:0 "We hold territory in [GetStateRegion('STATE_BUSAN').GetName] or [GetStateRegion('STATE_YANGHO').GetName]"
 nesnd_jp_korea_envoy_free_tt:0 "We have no diplomatic request awaiting a reply"
 nesnd_jp_korea_envoy_wait_tt:0 "We have not dispatched an envoy in the last #v 6#! months"
 nesnd_jp_korea_home_tt:0 "We will retain territory after returning our Korean holdings"
 nesnd_jp_korea_control_tt:0 "We control every holding we own in $STATE_BUSAN$ and $STATE_YANGHO$"
 nesnd_jp_korea_current_tt:0 "This is the current policy for our holdings."
 nesnd_jp_korea_governor_terms:0 "This policy cannot be changed once chosen.\nGrievances between the deputies and the gentry cost #r 3#! progress each month. Each of the following conditions met adds #g 1#! each month:\n• [concept_bureaucracy] is not negative\n• We control both provinces\n• [concept_turmoil] is below #v 25%#! in both provinces\n• Both provinces have a level #v 2#! or higher [GetBuildingType('building_government_administration').GetName] with at least #v 50%#! of its jobs filled\n• Both provinces have a [GetBuildingType('building_university').GetName]"
 nesnd_jp_korea_councils_terms:0 "This policy cannot be changed once chosen.\nGrievances between the deputies and the gentry cost #r 3#! progress each month. Issue both the Promote Social Mobility and the Greener Grass Campaign [concept_decree]s in [GetStateRegion('STATE_BUSAN').GetName] and in [GetStateRegion('STATE_YANGHO').GetName]. Each decree in force adds #g 2#! each month. If [concept_turmoil] reaches #v 25%#! in either province, progress falls by #r 10#! each month."
 nesnd_jp_korea_exam_status:0 "The Korean examinations are open. The progress bar below lists the monthly conditions. The reform is complete when its progress reaches #v 100#!."
 nesnd_jp_korea_kampaku_status:0 "The Korean kampaku has taken office. The progress bar below lists the monthly conditions. The reform is complete when its progress reaches #v 100#!."
 nesnd_jp_korea_route_open_tt:0 "No policy has been chosen for our holdings"
