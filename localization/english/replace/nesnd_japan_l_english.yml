l_english:
 JTK: "Fu"
 JTK_ADJ: "Tokugawa"
 JIM: "Wa"
 JIM_ADJ: "Imperial Japanese"
 nesnd_toyotomi_sang: "Sang"
 nesnd_united_japan: "Japan"
 nesnd_wu_eastern_question: "The Eastern Settlement"
 nesnd_wu_eastern_question_reason: "The Toyotomi unified Japan with Ming and Wu assistance and fought beside the Zheng in Korea. Their old alliance bound the garrisons in Kyushu to the interests of Japan’s lords. With affairs in the south settled, the court is considering an expedition: send former western officers overseas and establish imperial and Tokugawa governments alongside the Toyotomi, while placing Kyushu and Shikoku under direct Wu administration. Overseas garrisons and maritime trade both ride on the expedition.\n\nIf Japan submits to Wu anew during these proceedings, the Wu court will impose its settlement on the domains. If Japan ceases to exist, the proceedings lapse."
 nesnd_wu_eastern_question_status: "Nanjing may send its terms now. An outright refusal brings the expedition into the countdown to war. If Japan makes a counteroffer, Wu must be ready in at least two of the three areas of finance, army strength and naval strength to choose war."
 nesnd_wu_eastern_question_status_offer: "The envoys have departed for Japan, and the court awaits its reply."
 nesnd_wu_eastern_question_status_war: "The intervention is in a [concept_diplomatic_play] or war. Partition requires enforcement of its [concept_war_goal]."
 nesnd_japan_send_terms: "Propose the Three-Way Settlement"
 nesnd_japan_send_terms_desc: "Send envoys to propose separate domains for the Toyotomi, the Tokugawa and the Emperor. If Japan refuses, the expedition begins at once."
 nesnd_japan_send_terms_requirements: "Wu and Japan are at peace, with no truce between them, and neither is committed to a [concept_diplomatic_play]. Japan is independent or a Wu subject, is ruled by a Toyotomi, Tokugawa or Yamato monarch, and fully owns Kyoto, Kanto, Kansai and Chugoku. Fu and Wa have yet to be established. Japanese holdings in Honshu, Hokkaido, Kyushu and Shikoku must be controlled by Japan or Wu."
 nesnd_japan_accept_status_quo: "Preserve the existing settlement"
 nesnd_japan_accept_status_quo_desc: "Keep the current borders and Japanese government; keep the fleet and the army's pay for the mainland and the other overseas domains."
 nesnd_japan_partition_tt: "#bold Territorial settlement#!\nJapanese holdings in Kyushu and Shikoku pass to Wu. The Tokugawa establish Fu in Edo and the northern domains. Wa rules Kyoto and Osaka in the Emperor’s name. The Toyotomi govern the remainder of Kansai, Chugoku and their existing Korean holdings. Fu and Wa become Wu protectorates. Toyotomi Japan retains its existing subject status or becomes a protectorate if independent. Each realm claims the other two seats where the respective rival fully owns the region. #v Foreign territory is not transferred.#!"
 nesnd_japan_war_tt: "Japan immediately becomes independent if it is a Wu subject. Wu demands the reorganisation of the Japanese domains, and Japan demands the humiliation of Wu. The [concept_diplomatic_play] opens in the countdown to war. Either side may still back down."
 dp_nesnd_eastern_intervention: "Intervention in Japan"
 wg_nesnd_japan_reorganization: "Reorganise Japan"
 wg_nesnd_japan_reorganization_action_name: "Reorganise Japan"
 nesnd_japan_reunification: "One Realm"
 nesnd_japan_reunification_reason:0 "Alliances across the strait once helped the Toyotomi conquer their rivals and allowed the mainland court to intervene in Japan’s successions, domains and wars. Taxes, armies and commerce now follow competing authorities. [ROOT.GetCountry.GetName] must reunite Honshu and secure the freedom to govern its own affairs."
 nesnd_japan_reunification_status:0 "Unite Honshu under an independent government."
 nesnd_japan_integrated: "A United Realm"
 nesnd_japan.1.t: "The Eastern Fiefs"
 nesnd_japan.1.d: "The envoys from Nanjing propose to divide the realm. Kyoto and Osaka would recognise the Emperor, the Tokugawa would rule from Edo, and the Toyotomi would govern western Kansai and Chugoku. Wu would administer Kyushu and Shikoku directly. The levies and revenues of the eastern domains would henceforth answer to several governments. The retainers have submitted estimates of the troops and provisions available to the council."
 nesnd_japan.1.f: "“The enfeoffment proposed by Nanjing: Kyoto and Osaka to keep the Emperor's title, the Tokugawa to rule from Edo, the Toyotomi to govern western Kansai and Chugoku, and Kyushu and Shikoku to come under the direct rule of the Wu court. The troops and provisions available in each domain are listed in the attached register.”\n- Report of the retainers"
 nesnd_japan.1.a: "Accept the three-way settlement."
 nesnd_japan.1.b: "Japan shall decide its own affairs."
 nesnd_japan.1.c: "Negotiate for a united Japan."
 nesnd_japan.2.t: "Japan’s Reply"
 nesnd_japan.2.d: "Japan’s envoys have declined the proposed settlement. An expedition would require Nanjing to provide funds and ships to install the three houses in their domains. The court may also withdraw its demands and leave Japan under a single government. The decision rests with the court in Nanjing."
 nesnd_japan.2.a: "Escort the expedition to Japan."
 nesnd_japan.2.b: "Withdraw the proposal."
 nesnd_japan.3.t: "Four Eastern Governments"
 nesnd_japan.3.d: "The settlement in Japan is in force. The Toyotomi govern Chugoku and the remainder of Kansai. The Tokugawa take Edo and the northern domains. Kyoto and Osaka recognise the Emperor as sovereign of Wa. Wu administers Kyushu and Shikoku directly. Each government now collects its own revenues and commands its own troops."
 nesnd_japan.3.f: "“From this month, goods passing between the four domains will be taxed by each domain in turn.”\n- Notice of the Osaka town magistrate"
 nesnd_japan.3.a: "Set the administrations in order."
 nesnd_japan.4.t: "The Expedition Concludes"
 nesnd_japan.4.d: "The conflict has ended without implementation of the partition. Fleets and garrisons will redeploy under the existing borders and agreements."
 nesnd_japan.4.f: "“The enfeoffment of Japan having been abandoned, the fleet and garrisons are to redeploy along the present borders, and military funds and trade routes are to be handed over item by item.”\n- Order of the court"
 nesnd_japan.4.a: "Honour the current settlement."
 nesnd_japan.5.t: "The Realm United"
 nesnd_japan.5.d: "Honshu now answers to one independent government. [ROOT.GetCountry.GetName] is bringing the revenues and armies of the former domains under common authority. Merchants in the castle towns await a settlement of tolls and taxes as they prepare to trade beyond the old domain boundaries."
 nesnd_japan.5.f: "“How may the realm be settled?” I answered: “By being made one.”\n- Mencius, King Hui of Liang, Part One"
 nesnd_japan.5.a: "Restore the country's strength."
 nesnd_eastern_defeat_tt: "Wu backs down in this play, loses the ensuing war, or accepts Japan’s demand for humiliation."
 nesnd_eastern_defeat_conclusion: "Wu could not impose its terms on Japan. The court has abandoned the proposed division of the domains."
 nesnd_eastern_timeout_conclusion: "After ten years of deliberation, the court has withdrawn its proposal to divide the Japanese domains."
 nesnd_eastern_submission_tt: "Japan submits to Wu anew while the settlement is under consideration."
 nesnd_eastern_submission_conclusion: "Japan has submitted to Wu. The Wu court has claimed the right to settle the domains."
 nesnd_eastern_invalid_conclusion: "The Wu court can no longer pursue negotiations with Japan on the original terms."
 nesnd_eastern_failure_effect_tt: "For #v 30 years#! Japan gains #g +10%#! [concept_prestige] and #g +10%#! [concept_bureaucracy], and each domestic [concept_interest_group] gains #g +5#! approval. National Cohesion immediately rises by #g 25#! points, up to 100. About #v one tenth#! of the people of Han heritage living in Japanese-held states on Honshu, Hokkaido, Kyushu and Shikoku flee to the Wu capital."
 nesnd_eastern_vindication: "Authority over the Domains"
 nesnd_eastern_ig_confidence: "Support for the Stand against Wu"
 nesnd_japan.6.t: "The Eastern Appointments Withdrawn"
 nesnd_japan.6.d: "The court has struck the division of the Japanese domains from its agenda. [SCOPE.sCountry('eastern_japan').GetName] will decide who may govern from Edo and who may collect the duties at Osaka. The former western troops earmarked for service overseas must await appointments at home."
 nesnd_japan.6.d_refugees: "$nesnd_japan.6.d$\n\nFamilies who kept warehouses for Wu merchants or shipped provisions from the Japanese ports have begun arriving in [SCOPE.sState('eastern_refuge').GetName]. Some have brought official warrants and ask to be paid. Others simply ask to register their households."
 nesnd_japan.6.f: "“I left home young and come back old. My accent is unchanged, my hair grown thin. The children see me and do not know me. Laughing, they ask where the stranger is from.”\n- He Zhizhang, Returning Home"
 nesnd_japan.6.a: "Put the proposals on file."
 nesnd_japan.7.t: "Jurisdiction over the Domains"
 nesnd_japan.7.d: "[SCOPE.sCountry('eastern_wu').GetName] has failed to divide the Japanese domains. Whenever lords disputed a boundary, their retainers used to wait for word of Nanjing’s intentions before pressing a claim. A ruling at home can now settle the matter, and land registers long withheld are coming in for examination."
 nesnd_japan.7.d_refugees: "$nesnd_japan.7.d$\n\nReports from the coastal domains tell of families long settled in the ports who fear that their trade with Wu may be held against them. Some have entrusted their warehouses to relatives and taken ship for the mainland."
 nesnd_japan.7.f: "“The papers in the domains' land disputes have all been submitted for judgment.”\n- Report of the finance office"
 nesnd_japan.7.a: "Call for the registers from each domain."
 nesnd_japan_reunification_progress: "Core regions: #v [JournalEntry.GetGoalProgressValue|0] / [JournalEntry.GetGoalAddValue|0]#!"
 nesnd_japan_tokugawa_successor_name: "Iechika"
 nesnd_japan_yamato_successor_name: "Yorihito"
 nesnd_japan.2.d_commander: "Japan’s envoys have declined the settlement. [SCOPE.sCharacter('nesnd_japan_commander').GetFullName] has been charged with planning an expedition. Officers of the former western army would sail with their commander, while Nanjing must provide the fleet, pay and reinforcements. The court must decide whether to take up arms or withdraw its proposal."
 nesnd_japan.2.f: "“Our country cannot accept this command.”\n- Reply of the Japanese envoy"
 dp_nesnd_eastern_intervention_desc: "Wu demands separate Imperial, Tokugawa, Toyotomi and directly administered territories in Japan."
 dp_nesnd_eastern_intervention_tooltip: "#header $dp_nesnd_eastern_intervention$#!\n$dp_nesnd_eastern_intervention_desc$"
 war_goal_wg_nesnd_japan_reorganization_type_name: "$wg_nesnd_japan_reorganization$"
 war_goal_wg_nesnd_japan_reorganization_type_desc: "Establish separate domains for the Toyotomi, the Tokugawa and the Emperor, and place Japanese holdings in Kyushu and Shikoku under direct Wu rule."
 war_goal_wg_nesnd_japan_reorganization: "Reorganise Japan"
 war_goal_wg_nesnd_japan_reorganization_desc: "$nesnd_japan_partition_tt$"
 nesnd_jp_mining:0 "Iron in the Hills"
 nesnd_jp_mining_reason:0 "Collecting taxes and raising soldiers were once the duties of the warrior class. Mining and manufacturing require merchants as well. The mineral wealth of the north gives Edo new revenues, but also new partners: men without swords who are growing wealthy and expect the government to protect their businesses."
 nesnd_jp_arsenals:0 "Arsenals and Shipyards"
 nesnd_jp_arsenals_reason:0 "Arsenals and shipyards bring military spending into the towns. Contractors want orders they can count on; officers resent having to bargain over the price of their equipment. As the workshops grow, these negotiations are becoming part of the business of government."
 nesnd_jp_metal_cities:0 "Beyond the Castle Town"
 nesnd_jp_metal_cities_reason:0 "The castle town grew around the lord’s fortress and the homes of his retainers. Now workers, apprentices and shopkeepers are settling in new streets, with children who need schooling. A town built to serve its lord is becoming a society with demands of its own."
 nesnd_jp_cash_crops:0 "Cotton, Silk and Tea"
 nesnd_jp_cash_crops_reason:0 "The ports bring the prices of distant markets into the countryside. Cotton, silk and tea have found new buyers, and both landowners and merchants want a larger share of the proceeds. The work of rural households is increasingly governed by decisions made far from their villages."
 nesnd_jp_textiles:0 "The Sound of the Looms"
 nesnd_jp_textiles_reason:0 "Merchants who once bought cotton and silk from scattered households are bringing weavers together in larger mills. Wage work offers a new living to people leaving the land, though it also subjects familiar skills to the discipline of a foreman. For the merchants, it promises closer control over production."
 nesnd_jp_consumer_goods:0 "Goods for the People"
 nesnd_jp_consumer_goods_reason:0 "Food, furniture and household goods are finding customers beyond the wealthiest homes. Their manufacturers have acquired a reason to care about ordinary incomes. Families struggling to feed themselves have little to spend on other goods, limiting sales and putting pressure on prices and profits."
 nesnd_jp_living_standards:0 "A Better Living"
 nesnd_jp_living_standards_reason:0 "Families who have found work in the mills must still pay rent, buy food and find money for their children’s schooling. They have brought labour and tax revenue to the towns, and expect a share in their prosperity. The promise of a better life will be judged against these everyday expenses."
 nesnd_jp_food_supply:0 "Feeding the Towns"
 nesnd_jp_food_supply_reason:0 "Harvests, fishing boats and grain merchants feed the towns. When food prices rise, complaints from the markets soon reach the authorities. We must keep food coming into the towns at prices their people can afford."
 nesnd_jp_food_cities:0 "The Growth of the Towns"
 nesnd_jp_food_cities_reason:0 "The grain trade brings customers, and craftsmen and apprentices settle near them. New neighbourhoods need schools. Offices and booksellers need paper. Town institutions are taking on duties once left to village households and clans."
 nesnd_jp_food_processing:0 "Food for the Towns"
 nesnd_jp_food_processing_reason:0 "The towns need food that can be stored and carried over long distances. Grain and fish merchants want customers beyond the harvest season. Canning offers a way to combine purchasing, processing and transport in one business, while food factories could provide work after the harvest is over."
 nesnd_jp_living_year:0 "The living standard, school and urban development goals have been met for #v 12#! consecutive months"
 nesnd_jp_metal_foundries:0 "Metalworking Expansion"
 nesnd_jp_arsenal_towns:0 "Arsenals and Shipyards Flourish"
 nesnd_jp_industrial_cities:0 "Flourishing Industrial Towns"
 nesnd_jp_cash_crop_trade:0 "Cash Crop Expansion"
 nesnd_jp_textile_trade:0 "Textile Expansion"
 nesnd_jp_consumer_trade:0 "Flourishing Consumer Industries"
 nesnd_jp_towns_prosper:0 "Prosperous Towns"
 nesnd_jp_rural_markets:0 "Farming and Fishing Prosper"
 nesnd_jp_growing_cities:0 "Growing Towns"
 nesnd_jp_food_exports:0 "A Flourishing Food Industry"
 nesnd_jp_cohesion:0 "National Cohesion"
 nesnd_jp_cohesion_reason:0 "The domains of the shogunate, rural clans and merchants of the castle towns once upheld their own local orders. Schools and public administration connect distant communities, while flourishing commerce ties more households to one another. Order at home and the country’s fortunes in war will decide whether people trust a common government."
 nesnd_jp_cohesion_bar_name:0 "National Cohesion"
 nesnd_jp_cohesion_bar_desc:0 "$nesnd_jp_cohesion_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_jp_cohesion_order_desc:0 "Government [concept_authority]"
 nesnd_jp_cohesion_living_desc:0 "Living Conditions and Public Finances"
 nesnd_jp_cohesion_learning_desc:0 "Schools and Administration"
 nesnd_jp_cohesion_conflict_desc:0 "Unrest and Conflict"
 nesnd_jp_cohesion_victory_desc:0 "Military Victories and Defeats"
 nesnd_jp_cohesion_doubt:0 "Public trust in the government is faltering, and local divisions are deepening.\nEach month, one eligible owned state and one primary-culture [concept_pop] within it are randomly selected. #v 25%#! of that Pop adopts either [GetCulture('han').GetName] or [GetCulture('ce_wuu').GetName] culture, with an equal chance of either."
 nesnd_jp_cohesion_doubt_jiangnan:0 "Public trust in the government is faltering, and local divisions are deepening.\nEach month, one eligible owned state and one primary-culture [concept_pop] within it are randomly selected, excluding Japanese Pops. #v 25%#! of that Pop adopts [GetCulture('japanese').GetName] culture."
 nesnd_jp_cohesion_calm:0 "The regions continue to uphold a common political order."
 nesnd_jp_cohesion_confident:0 "Confidence in a shared future encourages cultural assimilation.\nEach month, there is a #v 30%#! chance for people in one eligible owned [concept_state] to adopt [GetCulture('japanese').GetName] culture, up to #v 10%#! of that state's total population. Religion remains unchanged."
 nesnd_jp_cohesion_confident_jiangnan:0 "Confidence in a shared future encourages cultural assimilation.\nEach month, there is a #v 30%#! chance for people in one eligible owned [concept_state] to adopt [GetCulture('ce_wuu').GetName] culture, up to #v 10%#! of that state's total population. Religion remains unchanged."
 nesnd_jp_divided_councils:0 "A Divided Society"
 nesnd_jp_politics:0 "The Question of Government"
 nesnd_jp_politics_reason:0 "After unifying Japan, the Toyotomi advanced into Korea with the Wu ruler's aid and secured their domains to the east. The authority of the Ming court, their own armies and Osaka's financial houses kept the Taiko shogunate in power. New wealth and learning are changing these relationships. Merchants, officers and scholars seek a greater say in government. Disputes over appointments, the army and the law now concern who will control the state."
 nesnd_jp_court_reform:0 "Reform under the Crown"
 nesnd_jp_court_reform_reason:0 "The old retainers want reform carried out in the monarch’s name. Merchants and officials trained in the new schools seek legal protection from arbitrary levies and local power. The crown can bring them together, but their respective rights remain to be settled."
 nesnd_jp_military_reform:0 "The Military Ascendant"
 nesnd_jp_military_reform_reason:0 "The officers regard the army as the one institution the country can rely on. They seek common control over recruitment, training and supplies, bringing provincial forces under national direction. Arsenals and tool workshops would equip this army, while a concentrated government could carry the officers’ programme into the provinces."
 nesnd_jp_representative_reform:0 "A Voice in Government"
 nesnd_jp_representative_reform_reason:0 "Scholars debate public affairs, merchants watch taxation, and local communities seek someone to speak for them. Advocates of representative government would bring these concerns into an elected assembly and subject those in power to open debate. Wider education can allow more people to understand the laws and take part in public life."
 nesnd_jp_nation:0 "A Nation of Our Own"
 nesnd_jp_nation_reason:0 "The promises made in pursuit of independence now confront the government. Who will pay for defence, who will set the tariffs, and how much authority will remain in local hands? Those who contributed money and those who served expect a place in the new state."
 nesnd_jp_new_army:0 "An Army for the Nation"
 nesnd_jp_new_army_reason:0 "The old armies rested on hereditary warriors and local loyalties, with recruitment and training varying between domains. The country needs organised manpower, trained officers and forces that answer to a common command. Whether defence rests on a standing army or a national militia, military service must answer to the nation."
 nesnd_jp_open_diplomacy:0 "Dealing with the World"
 nesnd_jp_open_diplomacy_reason:0 "Tributary ties and maritime restrictions once left diplomacy and trade in an overlord's hands. We need to open our ports, send out merchant ships and negotiate with other countries in our own name. Lasting sovereignty will give these exchanges a government they can rely upon."
 nesnd_jp_open_ports:0 "Opening the Ports"
 nesnd_jp_open_ports_reason:0 "Japan’s overseas trade has long been confined to a few designated ports by strict prohibitions. Merchants seek distant raw materials and wider markets for their produce. We must arrange the opening of the ports and confront those whose influence rests on the old restrictions."
 nesnd_jp_islands:0 "Kyushu and Shikoku"
 nesnd_jp_islands_reason:0 "Honshu has been reunited, but the question of Kyushu and Shikoku remains unsettled. Their ports and sea routes matter to trade and defence in southern Japan. We may seek the remaining territories or accept the existing borders and relinquish our claims."
 nesnd_jp_choose_court:0 "Reform through the Crown"
 nesnd_jp_choose_court_desc:0 "The dynasty can bring loyal retainers and reformers together. Preserve the crown, appoint capable officials, and give representative deliberation and enterprise a place in the state."
 nesnd_jp_choose_military:0 "Back the Officers"
 nesnd_jp_choose_military_desc:0 "The army needs a common command, and the state needs orders that can be carried through. Back the officers in reorganising recruitment and supply, drawing provincial manpower and revenues into a common defence."
 nesnd_jp_choose_representative:0 "Expand Representation"
 nesnd_jp_choose_representative_desc:0 "Public affairs concern everyone who pays taxes, serves or earns a living. Bring more representatives into government, subject officials to public debate, and let voters influence the conduct of the state."
 nesnd_jp_fund_court_schools:0 "Fund Schools and Law Reform"
 nesnd_jp_fund_court_schools_desc:0 "Pay the teachers who explain the new laws and the clerks who draft them."
 nesnd_jp_fund_court_schools_modifier:0 "School and Drafting Grants"
 nesnd_jp_consult_retainers:0 "Negotiate with the Old Retainers"
 nesnd_jp_consult_retainers_desc:0 "The old retainers will surrender their seals if they have a say in the date of the handover."
 nesnd_jp_consult_retainers_modifier:0 "The Retainers’ Agreement"
 nesnd_jp_issue_royal_edict:0 "Issue a Royal Edict"
 nesnd_jp_issue_royal_edict_desc:0 "Ask the monarch to sign the edict. The merchants and scholars who meant to speak on the bill will remember whose signature silenced them."
 nesnd_jp_issue_royal_edict_modifier:0 "Rule by Edict"
 nesnd_jp_order_domestic_arms:0 "Order Arms at Home"
 nesnd_jp_order_domestic_arms_desc:0 "Place the arms order with domestic workshops and commission the tools their gunsmiths need."
 nesnd_jp_order_domestic_arms_modifier:0 "Domestic Arms Orders"
 nesnd_jp_retain_domain_instructors:0 "Retain the Domain Instructors"
 nesnd_jp_retain_domain_instructors_desc:0 "Let the domains turn in their muster rolls and keep the instructors their soldiers know."
 nesnd_jp_retain_domain_instructors_modifier:0 "Domain Instructors"
 nesnd_jp_centralise_drill:0 "Give Army Command Control of Training"
 nesnd_jp_centralise_drill_desc:0 "The domains will supply the recruits and army headquarters will appoint the instructors. The officer corps will decide who may train its men."
 nesnd_jp_centralise_drill_modifier:0 "Centralised Drill"
 nesnd_jp_fund_local_schools:0 "Endow Local Schools"
 nesnd_jp_fund_local_schools_desc:0 "A grant will put more desks in the local schools. A child who can read a public notice today can read a ballot in years to come."
 nesnd_jp_fund_local_schools_modifier:0 "Local School Grants"
 nesnd_jp_seat_local_notables:0 "Ask Local Notables to Chair Debates"
 nesnd_jp_seat_local_notables_desc:0 "Give the chair to a local notable and the district may accept the assembly’s decisions. Younger speakers will have to wait to be heard."
 nesnd_jp_seat_local_notables_modifier:0 "Chairs for Local Notables"
 nesnd_jp_debate_bills_publicly:0 "Open Bills to Public Debate"
 nesnd_jp_debate_bills_publicly_desc:0 "Print the bill and let those who come to hear it take a copy home. Ministers will have to defend its clauses in public."
 nesnd_jp_debate_bills_publicly_modifier:0 "Public Readings of Bills"
 nesnd_jp_intervention_ready:0 "The six-month interval since the last reform measure has elapsed"
 nesnd_jp_intervention_funded_terms:0 "After this grant, the next reform measure can be taken in #v 6 months#!."
 nesnd_jp_intervention_unfunded_terms:0 "No treasury payment. The next reform measure can be taken in #v 6 months#!."
 nesnd_jp_intervention_wait:0 "Another reform measure will be available on #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_jp_reform_effort_cooldown'))]#!."
 nesnd_jp_abandon_reform:0 "Shelve the Reforms"
 nesnd_jp_abandon_reform_desc:0 "Withdraw the current programme and end the government’s reform campaign. Reform progress is lost, and reforms cannot be proposed again for #v 24#! months. Existing laws and buildings remain."
 nesnd_jp_mercantile_ports:0 "Open Ports under Mercantilism"
 nesnd_jp_protected_ports:0 "Open Ports under Protectionism"
 nesnd_jp_islands_settlement:0 "Accept the Existing Borders"
 nesnd_jp_islands_settlement_desc:0 "Relinquish our territorial claims to Kyushu and Shikoku and accept the current borders."
 nesnd_jp_court_policy:0 "Constitutional reform proceeds under the crown."
 nesnd_jp_military_policy:0 "Centralise command and reorganise the army and its supplies."
 nesnd_jp_representative_policy:0 "Expand representation and protect public debate."
 nesnd_jp_unsettled_policy:0 "The government has yet to choose a course for reform."
 nesnd_jp_nation_subject:0 "The country is a subject again, with foreign affairs constrained by its overlord."
 nesnd_jp_nation_independent:0 "The country governs its own domestic and foreign affairs."
 nesnd_jp_reform_settled:0 "Reform progress is full and the chosen reforms have remained in force for #v 12#! months"
 nesnd_jp_nation_complete:0 "Industrial, military and diplomatic development is complete, and the country has remained independent for #v 12#! consecutive months"
 nesnd_jp_political_bar_name:0 "Reform Progress"
 nesnd_jp_nation_bar_name:0 "Nation Building"
 nesnd_jp_political_bar_desc:0 "#tooltippable;tooltip:[JournalEntry.GetTooltipTag],nesnd_jp_political_bar_monthly_tt $nesnd_jp_political_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!#!"
 nesnd_jp_political_bar_monthly_tt:0 "#title Monthly change#!\nAdministration and learning (policy chosen, nonnegative [concept_bureaucracy], [concept_literacy] ≥25%): [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_administration')|=+1]\nAll goals of the chosen policy met: [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_laws')|=+1]\nAt war: [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_war')|=+1]\n[concept_radicals] ≥25%: [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_radicals')|=+1]"
 nesnd_jp_nation_bar_desc:0 "$nesnd_jp_nation_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_jp_political_administration_desc:0 "Administration and Learning"
 nesnd_jp_political_laws_desc:0 "Institutional Reform"
 nesnd_jp_court_debate:0 "Reform of the Monarchy"
 nesnd_jp_court_settlement:0 "A Constitutional Settlement"
 nesnd_jp_military_debate:0 "The Officers’ Reform Campaign"
 nesnd_jp_military_settlement:0 "Military Renewal"
 nesnd_jp_representative_debate:0 "The Movement for Representation"
 nesnd_jp_representative_settlement:0 "Representative Government Established"
 nesnd_jp_reform_effort:0 "The Reformers’ Campaign"
 nesnd_jp_independent_state:0 "The Standing of an Independent State"
 nesnd_jp_home_waters:0 "Kyushu and Shikoku Reunited"
 nesnd_jp_opening_dispute:0 "The Debate over Opening"
 nesnd_jp_development.1.t:0 "The Foundations of Independence"
 nesnd_jp_development.1.d:0 "Foreign envoys now deal directly with our government. Defence and overseas affairs, once conducted through an overlord, rest on institutions of our own.\n\nThe merchants and local leaders who supported independence have not retired from public life. They have brought new petitions, expecting the government to honour its promises."
 nesnd_jp_development.1.f:0 "“We supported independence because you promised that merchants would have a say in the government of the country. We ask you now to keep that promise.”\n- Joint petition of merchants and local notables"
 nesnd_jp_development.1.a:0 "We shall decide our own affairs."
 nesnd_jp_development.2.t:0 "Reform Takes Root"
 nesnd_jp_development.2.d:0 "A new system of appointing officials is in place, and the laws have changed how power is distributed. Families accustomed to holding local office by birth must now contend with positions and powers defined by the state. Officials, soldiers and merchants who took part in reform are finding their places within it, and it now governs the daily work of the offices."
 nesnd_jp_development.2.a:0 "Let these reforms endure."
 nesnd_jp_foreign:0 "Diplomacy in East Asia"
 nesnd_jp_foreign_reason:0 "Aid from the mainland court helped the Toyotomi subdue Japan, binding tribute and maritime trade to the politics of the islands. Greater autonomy touches an overlord’s revenue, naval interests and influence in Japan. Those interests endure even when the old obligations are dissolved."
 nesnd_jp_korea:0 "Across the Strait"
 nesnd_jp_korea_reason:0 "The mines and ports of southern Korea carry trade across the strait. Local merchants depend on those routes, while provincial elites resist surrendering civil affairs to officials from across the sea. Arguments often come down to who will control the next levy."
 nesnd_jp_envoy_away:0 "Our envoy is awaiting a reply."
 nesnd_jp_envoy_rest:0 "The delegation is not yet ready to depart again. Envoys may be sent once every #v 6#! months."
 nesnd_jp_subject_treaties:0 "The country remains subject to an overlord and may negotiate over autonomy and development. Envoys may be sent once every #v 6#! months."
 nesnd_jp_independent_treaties:0 "The country may seek foreign assistance and union on its own behalf. Envoys may be sent once every #v 6#! months."
 nesnd_jp_korea_across_the_strait:0 "We no longer hold land in $STATE_BUSAN$ or $STATE_YANGHO$."
 nesnd_jp_korea_governors_status:0 "The governor is compiling the tax rolls. File them after twelve consecutive qualifying months (#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_jp_korea_months')|0]/12#!)."
 nesnd_jp_korea_councils_status:0 "The councils are organising local instruction. Vote the school grant after twelve consecutive qualifying months (#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_jp_korea_months')|0]/12#!)."
 nesnd_jp_korea_undecided:0 "Appoint governors to register taxpayers or put the councils in charge of local schools. Once independent, we may offer to return our holdings through $nesnd_jp_foreign$."
 nesnd_jp_seek_autonomy:0 "Seek Greater Autonomy"
 nesnd_jp_seek_autonomy_desc:0 "Ask the overlord to relax its control and raise our subject relationship by one autonomy level.\n\nAcceptance will establish a #v 5#!-year truce between the two countries."
 nesnd_jp_seek_independence:0 "Negotiate Independence"
 nesnd_jp_seek_independence_desc:0 "Ask the overlord to end the subject relationship and recognise our right to govern our own affairs.\n\nAcceptance will establish a #v 5#!-year truce between the two countries."
 nesnd_jp_seek_reform_permission:0 "Request Leave to Reform"
 nesnd_jp_seek_reform_permission_desc:0 "Seek the overlord’s assent to domestic reform, allowing us to reconsider appointments, military administration and political representation."
 nesnd_jp_seek_union_permission:0 "Request Leave to Unite"
 nesnd_jp_seek_union_permission_desc:0 "Ask the overlord to permit negotiations with other Japanese subjects over a voluntary union."
 nesnd_jp_seek_overlord_capital:0 "Seek Development Funds from the Overlord"
 nesnd_jp_seek_overlord_capital_desc:0 "Ask the overlord to fund workshops and the training of skilled workers, giving domestic production room to grow.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_cne:0 "Seek Capital from the North"
 nesnd_jp_seek_capital_cne_desc:0 "Seek development funds from the northern government, offering closer commercial ties as a reason to support our growing industries.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_hus:0 "Seek Capital from Dongzhou"
 nesnd_jp_seek_capital_hus_desc:0 "Approach Dongzhou for funds to build workshops, making the case for closer trade and industrial development.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_usm:0 "Seek Capital from [SCOPE.sCountry('nesnd_label_usm').GetName]"
 nesnd_jp_seek_capital_usm_desc:0 "[SCOPE.sCountry('nesnd_label_usm').GetName] has long-standing commercial ties with Japan. Draw on these connections to seek funds for workshops and the training of skilled labour.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_independence_play:0 "An Ultimatum for Independence"
 nesnd_jp_independence_play_desc:0 "Issue an ultimatum for independence, opening an independence [concept_diplomatic_play] and preparing to enforce the demand through war."
 nesnd_jp_union_jap:0 "Invite [SCOPE.sCountry('nesnd_label_jap').GetName] to Join Us"
 nesnd_jp_union_jap_desc:0 "Propose a union to [SCOPE.sCountry('nesnd_label_jap').GetName]. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_union_jtk:0 "Invite [SCOPE.sCountry('nesnd_label_jtk').GetName] to Join Us"
 nesnd_jp_union_jtk_desc:0 "Propose a union to [SCOPE.sCountry('nesnd_label_jtk').GetName]. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_union_jim:0 "Invite [SCOPE.sCountry('nesnd_label_jim').GetName] to Join Us"
 nesnd_jp_union_jim_desc:0 "Propose a union to [SCOPE.sCountry('nesnd_label_jim').GetName]. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_korean_governor:0 "Appoint Governors"
 nesnd_jp_korean_governor_desc:0 "The cargo on a merchant’s manifest and the fields on a village deed must both find their way onto the governor’s rolls."
 nesnd_jp_korean_councils:0 "Establish Local Councils"
 nesnd_jp_korean_councils_desc:0 "The local scholars will raise money for schools. They expect a seat when the money is voted."
 nesnd_jp_korean_envoy:0 "Negotiate a Korean Settlement"
 nesnd_jp_korean_envoy_desc:0 "Offer Korea the return of our holdings. If Korea has an overlord, the offer goes to its overlord. Acceptance transfers our land in $STATE_BUSAN$ and $STATE_YANGHO$ to Korea and relinquishes our claims to both regions."
 nesnd_jp_foreign_workshops:0 "Foreign Development Assistance"
