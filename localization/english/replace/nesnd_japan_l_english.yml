 JTK: "Fu"
 JTK_ADJ: "Tokugawa"
 JIM: "Wa"
 JIM_ADJ: "Imperial Japanese"
 nesnd_toyotomi_sang: "Sang"
 nesnd_united_japan: "Japan"
 nesnd_wu_eastern_question: "The Eastern Settlement"
 nesnd_wu_eastern_question_reason: "The Toyotomi ended the Warring States with Ming and Wu help, then fought beside the Zheng for Korea. Generations of alliance have tangled the Kyushu garrisons up with the interests of Japan's lords. Now that the South is settled, the court has begun to talk of an eastern expedition: ship the old western army across the sea, raise up the Emperor and the Tokugawa alongside the Toyotomi, give each of the three houses its own lands, and place Kyushu and Shikoku under direct Wu rule. The overseas garrisons and sea trade would all have to be carved up anew."
 nesnd_wu_eastern_question_status: "Nanjing is considering its terms for Japan. An expedition requires readiness in at least two of the three areas of finance, army strength and naval strength."
 nesnd_wu_eastern_question_status_offer: "The envoys have crossed the sea. No reply has come yet."
 nesnd_wu_eastern_question_status_war: "The intervention is in a [concept_diplomatic_play] or war. Partition requires enforcement of its war goal."
 nesnd_japan_send_terms: "Propose the Three-Way Settlement"
 nesnd_japan_send_terms_desc: "Send envoys to propose separate domains for the Toyotomi, the Tokugawa and the Emperor."
 nesnd_japan_send_terms_requirements: "Wu and Japan are at peace, with no truce between them, and neither is committed to a diplomatic play. Japan is independent or a Wu subject, is ruled by a Toyotomi, Tokugawa or Yamato monarch, and fully owns Kyoto, Kanto, Kansai and Chugoku. Fu and Wa have yet to be established."
 nesnd_japan_accept_status_quo: "Preserve the existing settlement"
 nesnd_japan_accept_status_quo_desc: "Leave Japan's government and borders as they are. Keep the fleet and the soldiers' pay for the homeland and our other overseas domains."
 nesnd_japan_partition_tt: "#bold Territorial settlement#!\nJapanese holdings in Kyushu and Shikoku pass to Wu. The Tokugawa establish Fu in Edo and the northern domains. Wa rules Kyoto and Osaka in the Emperor’s name. The Toyotomi govern the remainder of Kansai, Chugoku and their existing Korean holdings. Fu and Wa become Wu protectorates. Toyotomi Japan retains its existing subject status or becomes a protectorate if independent. Each realm claims the other two seats where the respective rival fully owns the region. #v Foreign territory is not transferred.#!"
 nesnd_japan_war_tt: "If Japan is a Wu subject, it will become independent as the [concept_diplomatic_play] begins. Wu demands the reorganization of Japan; Japan demands Wu’s humiliation. #v The territorial settlement takes effect only if Wu’s war goal is enforced.#!"
 dp_nesnd_eastern_intervention: "Intervention in Japan"
 wg_nesnd_japan_reorganization: "Reorganize Japan"
 wg_nesnd_japan_reorganization_action_name: "Reorganize Japan"
 nesnd_japan_reunification: "One Realm"
 nesnd_japan_reunification_reason:0 "The alliance across the strait swept away the Toyotomi's rivals, and it also invited the mainland court into Japan's successions, fiefs and wars. Today the taxes of the castle towns flow into many separate treasuries, and every army and merchant answers to a different master. To rebuild a single government, [ROOT.GetCountry.GetName] must first bring Honshu together, then take its own affairs, at home and abroad, back into its own hands."
 nesnd_japan_reunification_status:0 "Unite Honshu under an independent government."
 nesnd_japan_integrated: "A United Realm"
 nesnd_japan.1.t: "The Eastern Fiefs"
 nesnd_japan.1.d: "The envoys from Nanjing have brought a plan to partition the realm: Kyoto and Osaka for the Emperor, Edo for the Tokugawa, the rest of Kansai and the Chugoku region for the Toyotomi, and Kyushu and Shikoku under direct Wu rule. The soldiers and taxes of the eastern domains would be split among several houses. The retainers have laid the muster rolls and grain ledgers before [ROOT.GetCountry.GetRuler.GetFullName]."
 nesnd_japan.1.a: "Accept the three-way settlement."
 nesnd_japan.1.b: "Japan shall decide its own affairs."
 nesnd_japan.1.c: "Negotiate for a united Japan."
 nesnd_japan.2.t: "Japan’s Reply"
 nesnd_japan.2.d: "Japan's envoys have refused the partition. An expedition means raising money and ships and escorting the three houses into their new domains; the alternative is to withdraw the demand and leave Japan united. The envoys' reply now lies before [ROOT.GetCountry.GetRuler.GetFullName]."
 nesnd_japan.2.a: "Escort the expedition to Japan."
 nesnd_japan.2.b: "Withdraw the proposal."
 nesnd_japan.3.t: "Four Eastern Governments"
 nesnd_japan.3.d: "The settlement in Japan is in force. The Toyotomi govern Chugoku and the remainder of Kansai. The Tokugawa take Edo and the northern domains. Kyoto and Osaka recognize the Emperor as sovereign of Wa. Wu administers Kyushu and Shikoku directly. Each government now collects its own revenues and commands its own troops."
 nesnd_japan.3.a: "Set the administrations in order."
 nesnd_japan.4.t: "The Expedition Concludes"
 nesnd_japan.4.d: "The fighting over the eastern expedition is done, and Japan has not been divided into three. Fleets and garrisons will redeploy along the current borders, and army funds and trade routes must be handed over item by item. Eastern affairs will be handled under the peace treaties now in force."
 nesnd_japan.4.a: "Honor the current settlement."
 nesnd_japan.5.t: "The Realm United"
 nesnd_japan.5.d: "At last, all of Honshu answers to one independent government. [ROOT.GetCountry.GetName] has taken over the old lords' taxes and armies, and domains that once went their own way now follow a single code of law. The castle-town merchants are waiting for tolls and levies to be settled anew, so they can carry their trade beyond the old domain borders."
 nesnd_japan.5.a: "Restore the country's strength."
 nesnd_wu_eastern_question_progress: "Readiness: #v [JournalEntry.GetGoalProgressValue|0] / [JournalEntry.GetGoalAddValue|0]#!"
 nesnd_japan_reunification_progress: "Core regions: #v [JournalEntry.GetGoalProgressValue|0] / [JournalEntry.GetGoalAddValue|0]#!"
 nesnd_japan_tokugawa_successor_name: "Iechika"
 nesnd_japan_yamato_successor_name: "Yorihito"
 nesnd_japan.2.d_commander: "Japan's envoys have refused the partition. [SCOPE.sCharacter('nesnd_japan_commander').GetFullName] has been ordered to plan the expedition; the officers of the old western army are waiting to sail with him, and the fleet, the pay and the domains' auxiliaries must all come from Nanjing. War, or withdraw the partition?"
 dp_nesnd_eastern_intervention_desc: "Wu demands separate Imperial, Tokugawa, Toyotomi and directly administered territories in Japan."
 dp_nesnd_eastern_intervention_tooltip: "#header $dp_nesnd_eastern_intervention$#!\n$dp_nesnd_eastern_intervention_desc$"
 war_goal_wg_nesnd_japan_reorganization: "Reorganize Japan"
 war_goal_wg_nesnd_japan_reorganization_desc: "$nesnd_japan_partition_tt$"
 nesnd_japan_reorganization:0 "Japanese Administrative Reorganisation"
 nesnd_jp_mining:0 "Iron in the Hills"
 nesnd_jp_mining_reason:0 "Collecting taxes and raising soldiers were once the duties of the warrior class. Mining and manufacturing require merchants as well. The mineral wealth of the north gives Edo new revenues, but also new partners: men without swords who are growing wealthy and expect the government to protect their businesses."
 nesnd_jp_arsenals:0 "Arsenals and Shipyards"
 nesnd_jp_arsenals_reason:0 "Arsenals and shipyards bring military spending into the towns. Contractors want dependable orders; officers resent having to bargain over the price of their equipment. As the workshops grow, these negotiations are becoming part of the business of government."
 nesnd_jp_metal_cities:0 "Beyond the Castle Town"
 nesnd_jp_metal_cities_reason:0 "The castle town grew around the lord’s fortress and the homes of his retainers. Now workers, apprentices and shopkeepers are settling in new streets, with children who need schooling. A town built to serve its lord is becoming a society with demands of its own."
 nesnd_jp_cash_crops:0 "Cotton, Silk and Tea"
 nesnd_jp_cash_crops_reason:0 "The ports bring the prices of distant markets into the countryside. Cotton, silk and tea have found new buyers, and both landowners and merchants want a larger share of the proceeds. The work of rural households is increasingly governed by decisions made far from their villages."
 nesnd_jp_textiles:0 "The Sound of the Looms"
 nesnd_jp_textiles_reason:0 "Merchants who buy up raw silk and cotton have begun gathering the weavers under one roof. Familiar handwork has moved into bigger mills, where wages come on time and the foreman's rules must be obeyed. People leaving the land have found a new hope; the merchants have tightened their grip on rural production."
 nesnd_jp_consumer_goods:0 "Goods for the People"
 nesnd_jp_consumer_goods_reason:0 "The trade in food, furniture and household wares is spreading from a few wealthy houses into many more homes. The men who run these workshops have started to worry about ordinary wages: if customers can barely feed themselves, nothing sells and prices cannot rise."
 nesnd_jp_living_standards:0 "A Better Living"
 nesnd_jp_living_standards_reason:0 "Those who have gone into the mills now reckon up the rent, the price of rice and the cost of their children's schooling. The towns owe their labour and their tax revenue to these people, and they want their own share of the prosperity. Whether the government's promise of a new life holds good will be measured by these few expenses."
 nesnd_jp_food_supply:0 "Feeding the Towns"
 nesnd_jp_food_supply_reason:0 "The harvest, the fishing boats and the grain dealers feed the towns. When grain prices rise, the grumbling in the markets soon reaches the government offices. Only when carriers are willing to bring food in, and townspeople can afford to buy it, will the streets stay calm."
 nesnd_jp_food_cities:0 "The Growth of the Towns"
 nesnd_jp_food_cities_reason:0 "The grain trade brings customers, and craftsmen and apprentices settle near them. New neighbourhoods need schools. Offices and booksellers need paper. Town institutions are taking on duties once left to village households and clans."
 nesnd_jp_food_processing:0 "Food for the Towns"
 nesnd_jp_food_processing_reason:0 "The towns need food that keeps and travels, and the grain and fish dealers want buyers outside the harvest season. Canning lets them join buying, processing and shipping into a single business. With food works open, labourers no longer lose their jobs the moment the harvest ends."
 nesnd_jp_living_year:0 "The living standard, school and urban development goals have been met for #v 12#! consecutive months"
 nesnd_jp_metal_foundries:0 "Metalworking Expansion"
 nesnd_jp_arsenal_towns:0 "Arsenals and Shipyards Flourish"
 nesnd_jp_industrial_cities:0 "Flourishing Industrial Towns"
 nesnd_jp_cash_crop_trade:0 "Cash Crop Expansion"
 nesnd_jp_textile_trade:0 "Textile Expansion"
 nesnd_jp_consumer_trade:0 "Flourishing Consumer Industries"
 nesnd_jp_towns_prosper:0 "Prosperous Towns"
 nesnd_jp_rural_markets:0 "Farming and Fishing Prosper"
 nesnd_jp_growing_cities:0 "Growing Towns"
 nesnd_jp_food_exports:0 "A Flourishing Food Industry"
 nesnd_jp_cohesion:0 "National Cohesion"
 nesnd_jp_cohesion_reason:0 "Under the shogunate, the domains, the rural clans and the castle-town merchants each kept order in their own corner. Now schools and government offices tie near and far together, and trade binds more and more livelihoods to one another. Whether life is secure, and whether the country can protect them in war, the people are watching."
 nesnd_jp_cohesion_bar_name:0 "National Cohesion"
 nesnd_jp_cohesion_bar_desc:0 "$nesnd_jp_cohesion_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_jp_cohesion_order_desc:0 "Government Authority"
 nesnd_jp_cohesion_living_desc:0 "Living Conditions and Public Finances"
 nesnd_jp_cohesion_learning_desc:0 "Schools and Administration"
 nesnd_jp_cohesion_conflict_desc:0 "Unrest and Conflict"
 nesnd_jp_cohesion_victory_desc:0 "Military Victories and Defeats"
 nesnd_jp_cohesion_doubt:0 "Public trust in the government is faltering, and local divisions are deepening.\nEach month, one eligible owned state and one primary-culture [concept_pop] within it are randomly selected. #v 25%#! of that Pop adopts either [GetCulture('han').GetName] or [GetCulture('ce_wuu').GetName] culture, with an equal chance of either."
 nesnd_jp_cohesion_doubt_jiangnan:0 "Public trust in the government is faltering, and local divisions are deepening.\nEach month, one eligible owned state and one primary-culture [concept_pop] within it are randomly selected, excluding Japanese Pops. #v 25%#! of that Pop adopts [GetCulture('japanese').GetName] culture."
 nesnd_jp_cohesion_calm:0 "The regions continue to uphold a common political order."
 nesnd_jp_cohesion_confident:0 "Confidence in a shared future encourages cultural assimilation.\nEach month, there is a #v 30%#! chance for people in one eligible owned [concept_state] to adopt [GetCulture('japanese').GetName] culture, up to #v 10%#! of that state's total population. Religion remains unchanged."
 nesnd_jp_cohesion_confident_jiangnan:0 "Confidence in a shared future encourages cultural assimilation.\nEach month, there is a #v 30%#! chance for people in one eligible owned [concept_state] to adopt [GetCulture('ce_wuu').GetName] culture, up to #v 10%#! of that state's total population. Religion remains unchanged."
 nesnd_jp_divided_councils:0 "A Divided Society"
 nesnd_jp_politics:0 "The Question of Government"
 nesnd_jp_politics_reason:0 "After unifying Japan, the Toyotomi advanced into Korea with the Wu ruler's aid and secured their domains to the east. The authority of the Ming court, their own armies and Osaka's financial houses sustained the Taiko shogunate. Now new money and new learning have loosened the old hold on power, and merchants, officers and scholars all want a say in state affairs. The quarrels over appointments, the army and the law come down, in the end, to who will run the government."
 nesnd_jp_court_reform:0 "Reform under the Crown"
 nesnd_jp_court_reform_reason:0 "The old retainers want reform carried out in the monarch's name. Merchants and officials schooled in the new learning want the law to shield them from arbitrary levies and local strongmen. The crown's name can bring all these people into one room, but each man's rights must still be drawn up, clause by clause."
 nesnd_jp_military_reform:0 "The Military Ascendant"
 nesnd_jp_military_reform_reason:0 "The officers regard the army as the country’s most dependable institution. They seek common control over recruitment, training and supplies, bringing provincial forces under national direction. Arsenals and tool workshops would equip this army, while a concentrated government could carry the officers’ programme into the provinces."
 nesnd_jp_representative_reform:0 "A Voice in Government"
 nesnd_jp_representative_reform_reason:0 "Scholars debate public affairs, merchants watch taxation, and local communities seek someone to speak for them. Advocates of representative government would bring these concerns into an elected assembly and subject those in power to open debate. Wider education can allow more people to understand the laws and take part in public life."
 nesnd_jp_nation:0 "A Nation of Our Own"
 nesnd_jp_nation_reason:0 "The promises made in the struggle for independence must now be paid out one by one. Who pays for the army, who sets the tariffs, how far local authority reaches: none of it is settled. Those who gave money and those who gave service are all waiting for their place in the new state."
 nesnd_jp_new_army:0 "An Army for the Nation"
 nesnd_jp_new_army_reason:0 "The old armies rested on hereditary warriors and local ties, and every house recruited and drilled in its own way. The country needs organised recruits, trained officers and forces that answer to a single command."
 nesnd_jp_open_diplomacy:0 "Dealing with the World"
 nesnd_jp_open_diplomacy_reason:0 "Tribute and the maritime bans once bound both diplomacy and trade to the overlord's arrangements. Now we must send out merchant ships and open our ports in our own name, and bargain with other countries over our own interests."
 nesnd_jp_open_ports:0 "Opening the Ports"
 nesnd_jp_open_ports_reason:0 "For many years Japan's overseas trade has been penned into a few ports by strict prohibitions. Merchants want raw materials from afar and wider markets for Japanese goods. Those who have lived off the old bans will not give up the ports easily."
 nesnd_jp_islands:0 "Kyushu and Shikoku"
 nesnd_jp_islands_reason:0 "Honshu is united, but Kyushu and Shikoku have not all been recovered. Their ports and sea lanes are the gateway to southern Japan's trade and defence."
 nesnd_jp_choose_court:0 "Reform through the Crown"
 nesnd_jp_choose_court_desc:0 "The dynasty's name can gather old retainers and reformers into one camp. The monarch stays on the throne, new officials are appointed all the same, and both deliberation and enterprise are put to work for the country.\n\nThe policy cannot be changed for #v 12#! months. Changing policy resets reform progress."
 nesnd_jp_choose_military:0 "Back the Officers"
 nesnd_jp_choose_military_desc:0 "The army needs one command, and orders must be carried through to the end. Let the officers reorganise recruitment and supply, and gather the manpower and money of every province into the nation's defence.\n\nThe policy cannot be changed for #v 12#! months. Changing policy resets reform progress."
 nesnd_jp_choose_representative:0 "Expand Representation"
 nesnd_jp_choose_representative_desc:0 "Those who pay taxes, serve in the ranks and earn a living carry the weight of every state affair. Put more representatives in the chamber, and officials will have to answer in public, and citizens will have a vote to speak with.\n\nThe policy cannot be changed for #v 12#! months. Changing policy resets reform progress."
 nesnd_jp_advance_reform:0 "Fund the Reformers"
 nesnd_jp_advance_reform_desc:0 "Fund the advocates of reform so that their proposals can more quickly become law."
 nesnd_jp_abandon_reform:0 "Shelve the Reforms"
 nesnd_jp_abandon_reform_desc:0 "Withdraw the current programme and end the government’s reform campaign. Reform progress is lost, and reforms cannot be proposed again for #v 24#! months. Existing laws and buildings remain."
 nesnd_jp_mercantile_ports:0 "Open Ports under Mercantilism"
 nesnd_jp_mercantile_ports_desc:0 "Allow merchants to trade overseas, using tariffs to support state revenue and domestic commerce."
 nesnd_jp_protected_ports:0 "Open Ports under Protectionism"
 nesnd_jp_protected_ports_desc:0 "Open the sea routes to obtain the materials our factories need, while using tariffs to support domestic producers in the wider market."
 nesnd_jp_islands_settlement:0 "Accept the Existing Borders"
 nesnd_jp_islands_settlement_desc:0 "Relinquish our territorial claims to Kyushu and Shikoku and accept the current borders."
 nesnd_jp_court_policy:0 "Constitutional reform proceeds under the crown."
 nesnd_jp_military_policy:0 "Centralize authority and reorganize the army and its supplies."
 nesnd_jp_representative_policy:0 "Expand representation and protect public debate."
 nesnd_jp_unsettled_policy:0 "The government has yet to choose a course for reform."
 nesnd_jp_nation_subject:0 "The country is a subject again, with foreign affairs constrained by its overlord."
 nesnd_jp_nation_independent:0 "The country governs its own domestic and foreign affairs."
 nesnd_jp_reform_settled:0 "Reform progress is full and the chosen reforms have remained in force for #v 12#! months"
 nesnd_jp_nation_complete:0 "Industrial, military and diplomatic development is complete, and the country has remained independent for #v 12#! consecutive months"
 nesnd_jp_political_bar_name:0 "Reform Progress"
 nesnd_jp_nation_bar_name:0 "Nation Building"
 nesnd_jp_political_bar_desc:0 "$nesnd_jp_political_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_jp_nation_bar_desc:0 "$nesnd_jp_nation_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_jp_political_administration_desc:0 "Administration and Learning"
 nesnd_jp_political_laws_desc:0 "Institutional Reform"
 nesnd_jp_political_opposition_desc:0 "War and Radicalism"
 nesnd_jp_court_debate:0 "Reform of the Monarchy"
 nesnd_jp_court_settlement:0 "A Constitutional Settlement"
 nesnd_jp_military_debate:0 "The Officers’ Reform Campaign"
 nesnd_jp_military_settlement:0 "Military Renewal"
 nesnd_jp_representative_debate:0 "The Movement for Representation"
 nesnd_jp_representative_settlement:0 "Representative Government Established"
 nesnd_jp_reform_effort:0 "The Reformers’ Campaign"
 nesnd_jp_independent_state:0 "The Standing of an Independent State"
 nesnd_jp_home_waters:0 "Kyushu and Shikoku Reunited"
 nesnd_jp_opening_dispute:0 "The Debate over Opening"
 nesnd_jp_development.1.t:0 "The Foundations of Independence"
 nesnd_jp_development.1.d:0 "Foreign envoys now come straight to our government. The defence and overseas affairs we once handled through an overlord now run on rules of our own.\n\nThe merchants and local men who backed independence have not gone home. They are at our door with new petitions, asking the government to keep its old promises."
 nesnd_jp_development.1.a:0 "We shall decide our own affairs."
 nesnd_jp_development.2.t:0 "Reform Takes Root"
 nesnd_jp_development.2.d:0 "The new rules for appointing officials have taken hold, and the laws have redrawn how much power each class holds. Those who once ran their districts by right of birth must now work within posts and powers set by the government. The officials, soldiers and merchants who carried the reform are finding their places in the new order."
 nesnd_jp_development.2.a:0 "Let these reforms endure."
 nesnd_jp_foreign:0 "Diplomacy in East Asia"
 nesnd_jp_foreign_reason:0 "Troops from the mainland court helped the Toyotomi subdue Japan, and ever since, tribute and sea trade have been tangled up with the politics of the islands. Every measure of autonomy we win costs the overlord a measure of revenue, naval security and control over Japan. Those interests will not vanish just because the old treaty is dissolved."
 nesnd_jp_korea:0 "Across the Strait"
 nesnd_jp_korea_reason:0 "The mines and ports of southern Korea sustain trade across the strait. Local merchants depend on those routes, while provincial elites resist surrendering civil affairs to officials from across the sea. Arguments often come down to who will control the next levy."
 nesnd_jp_envoy_away:0 "Our envoy is awaiting a reply."
 nesnd_jp_envoy_rest:0 "The delegation is not yet ready to depart again. Envoys may be sent once every #v 6#! months."
 nesnd_jp_subject_treaties:0 "The country remains subject to an overlord and may negotiate over autonomy and development. Envoys may be sent once every #v 6#! months."
 nesnd_jp_independent_treaties:0 "The country may seek foreign assistance and union on its own behalf. Envoys may be sent once every #v 6#! months."
 nesnd_jp_korea_across_the_strait:0 "Territorial questions in Korea remain open to negotiation."
 nesnd_jp_korea_governors_status:0 "Governors direct taxation and civil administration in our Korean territories."
 nesnd_jp_korea_councils_status:0 "Local councils take part in civil administration and education."
 nesnd_jp_korea_undecided:0 "The government has yet to settle how its Korean territories will be administered."
 nesnd_jp_seek_autonomy:0 "Seek Greater Autonomy"
 nesnd_jp_seek_autonomy_desc:0 "Ask the overlord to relax its control and raise our subject relationship by one autonomy level.\n\nAcceptance will establish a #v 5#!-year truce between the two countries."
 nesnd_jp_seek_independence:0 "Negotiate Independence"
 nesnd_jp_seek_independence_desc:0 "Ask the overlord to end the subject relationship and recognize our right to govern our own affairs.\n\nAcceptance will establish a #v 5#!-year truce between the two countries."
 nesnd_jp_seek_reform_permission:0 "Request Leave to Reform"
 nesnd_jp_seek_reform_permission_desc:0 "Seek the overlord’s assent to domestic reform, allowing us to reconsider appointments, military administration and political representation."
 nesnd_jp_seek_union_permission:0 "Request Leave to Unite"
 nesnd_jp_seek_union_permission_desc:0 "Ask the overlord to permit negotiations with other Japanese subjects over a voluntary union."
 nesnd_jp_seek_overlord_capital:0 "Seek Development Funds from the Overlord"
 nesnd_jp_seek_overlord_capital_desc:0 "Ask the overlord to fund workshops and the training of skilled workers, giving domestic production room to grow.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_cne:0 "Seek Capital from the North"
 nesnd_jp_seek_capital_cne_desc:0 "Use the promise of commercial cooperation as our opening, and ask the northern government to fund factories in Japan.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_hus:0 "Seek Capital from Dongzhou"
 nesnd_jp_seek_capital_hus_desc:0 "On the strength of trade and industry, ask Dongzhou for money to build workshops.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_seek_capital_usm:0 "Seek Capital from the South"
 nesnd_jp_seek_capital_usm_desc:0 "The southern government has traded with Japan for many years. Follow those old connections and ask for a grant: capital for our workshops, and craftsmen to train our own.\n\nAfter receiving assistance, further funding is unavailable for #v 3#! years."
 nesnd_jp_independence_play:0 "An Ultimatum for Independence"
 nesnd_jp_independence_play_desc:0 "Issue an ultimatum for independence, opening an independence [concept_diplomatic_play] and preparing to enforce the demand through war."
 nesnd_jp_union_jap:0 "Invite $JAP$ to Join Us"
 nesnd_jp_union_jap_desc:0 "Propose a union to $JAP$. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_union_jtk:0 "Invite $JTK$ to Join Us"
 nesnd_jp_union_jtk_desc:0 "Propose a union to $JTK$. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_union_jim:0 "Invite $JIM$ to Join Us"
 nesnd_jp_union_jim_desc:0 "Propose a union to $JIM$. If accepted, their country will be annexed into ours and governed by our state."
 nesnd_jp_korean_governor:0 "Appoint Governors"
 nesnd_jp_korean_governor_desc:0 "Appoint governors to centralize taxation and civil administration in our Korean territories, giving the government closer control over local revenue and affairs.\n\nKorean policy cannot be changed again for #v 24#! months."
 nesnd_jp_korean_councils:0 "Establish Local Councils"
 nesnd_jp_korean_councils_desc:0 "Bring local councils into civil administration and education, seeking local cooperation to ease resistance to our rule.\n\nKorean policy cannot be changed again for #v 24#! months."
 nesnd_jp_korean_envoy:0 "Negotiate a Korean Settlement"
 nesnd_jp_korean_envoy_desc:0 "Offer a settlement to Korea or its overlord. If accepted, our holdings in Busan and Yangho will pass to Korea, and we will relinquish our claims to both regions.\n\nEnvoys may be sent once every #v 6#! months."
 nesnd_jp_foreign_workshops:0 "Foreign Development Assistance"
 nesnd_jp_korea_governor:0 "Government by Governors"
 nesnd_jp_korea_councils:0 "Local Councils"
 nesnd_jp_korea_administration:0 "Korean Administration"
 nesnd_jp_foreign.1.t:0 "An Envoy from [SCOPE.sCountry('jp_sender').GetNameNoFormatting]"
 nesnd_jp_foreign.1.d1:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] wants a larger hand in its own affairs and asks us to loosen the terms of its subordination. Its envoy says that with more autonomy they would not need to wait on our approval for every domestic matter, while the ties between our countries would stay as they are."
 nesnd_jp_foreign.1.d2:0 "An envoy from [SCOPE.sCountry('jp_sender').GetNameNoFormatting] demands an end to the subject relationship. From now on they would run their own diplomacy, army and trade, and deal with us as an independent country."
 nesnd_jp_foreign.1.d3:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] wishes to reform appointments, military administration and political representation. Its envoy seeks our assent so that the government can rally supporters and pursue its programme. The existing subject relationship would remain in place."
 nesnd_jp_foreign.1.d4:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] is raising money to build workshops. Its envoy asks us for a grant to help expand production and train skilled workers."
 nesnd_jp_foreign.1.d5:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] proposes a settlement over southern Korea. Its government offers to relinquish claims to Busan and Yangho and transfer any territory it still holds there to Korea. The envoy asks us to close this old case for good."
 nesnd_jp_foreign.1.d6:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] asks us to recognize its government as the leader of Japanese unification and place our territory under its rule. Accepting would end our existence as a separate state."
 nesnd_jp_foreign.1.d7:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting] seeks our permission to negotiate union with other Japanese subjects. Its government would lead the union, with each invited country surrendering its separate government only by consent."
 nesnd_jp_foreign.1.d:0 "An envoy from [SCOPE.sCountry('jp_sender').GetNameNoFormatting] has arrived with a proposal concerning relations between our countries and awaits our reply."
 nesnd_jp_foreign.1.a:0 "Accept the proposal."
 nesnd_jp_foreign.1.b:0 "These terms we cannot accept."
 nesnd_jp_foreign.2.t:0 "The Reply from [SCOPE.sCountry('jp_partner').GetNameNoFormatting]"
 nesnd_jp_foreign.3.t:0 "The Reply from [SCOPE.sCountry('jp_partner').GetNameNoFormatting]"
 nesnd_jp_foreign.2.d:0 "Our envoy has brought word from [SCOPE.sCountry('jp_partner').GetNameNoFormatting]: they have agreed."
 nesnd_jp_foreign.2.a:0 "Carry it out as agreed."
 nesnd_jp_foreign.3.d:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting] has turned down the terms our envoy carried. They would not give an inch, and relations between our countries are the worse for it."
 nesnd_jp_foreign.3.a:0 "We must consider another course."
 nesnd_jp_toyotomi_court_name:0 "Hidetaka"
 nesnd_jp_development.2.d_court:0 "A new law has fixed the rules for deliberation and appointment. The old retainers still stand beside the monarch, but a different kind of official, versed in practical affairs, has begun to fill the provincial offices.\n\nReformers loyal to the dynasty believe these concessions will let the monarchy endure. Whether those who have won a voice will rest content with it, no one can say."
 nesnd_jp_development.2.d_military:0 "The officers have secured the centralized government they sought. Recruitment, training and supplies come under common direction, and local officials must carry out the government’s orders. Arsenals and tool workshops equip the expanded army, giving the military administration the means to enforce its policy in the provinces."
 nesnd_jp_development.2.d_representative:0 "Those entitled to vote now choose their representatives, and newspapers can debate the conduct of government. Officials face new rules of appointment, while political argument has spread beyond the old ruling families.\n\nThe new schools keep bringing more people into this world."
 nesnd_jp_sovereign_year:0 "Has remained independent for #v 12#! consecutive months"
 nesnd_jp_establish_edo:0 "The Government in Edo"
 nesnd_jp_establish_edo_reason:0 "Edo now rules wide lands in the north. Its garrisons can hold the roads, but they cannot run the provinces. The government must hire officials and bring revenue and spending into a single ledger, and the castle towns must make room for merchants, craftsmen and people come from afar to find work. Only when these places can carry the daily business of government will Edo have its hands free to seek greater powers."
 nesnd_jp_establish_kyoto:0 "Kyoto and Osaka"
 nesnd_jp_establish_kyoto_reason:0 "The courtiers of Kyoto and the merchants of Osaka each have their own circles and their own calculations. Court titles do not pay soldiers, and merchants' money does not flow into the treasury of its own accord. The officials in charge of revenue must put the income and business of the present territories in order, so that the two cities can support the new government."
 nesnd_jp_establish_toyotomi:0 "The Toyotomi Retainers"
 nesnd_jp_establish_toyotomi_reason:0 "Since the partition, the Toyotomi can no longer command all of Japan. Yet not one of the soldiers and retainers in the western provinces has gone, and all of them wait for their rice stipends. Old prestige alone can no longer decide where the annual tax is collected or who governs the villages. The Toyotomi regime must set up reliable magistrates' offices in the lands it still holds, and make the castle towns into places for collecting taxes, doing government business and hiring labour."
 nesnd_jp_establishment_required_tt:0 "The country has established a functioning provincial administration."
 nesnd_jp_independence_cooldown_tt:0 "At least six months have passed since our last independence play."
 nesnd_jp_settled_administration:0 "Provincial Administration Established"
 nesnd_jp_union_permission_required_tt:0 "Our overlord has authorised us to unite the Japanese states."
 nesnd_jp_mercantile_ports_junior_desc:0 "Replace seclusion with mercantilism and permit overseas commerce. The common market’s tariffs remain under the control of its leading country."
 nesnd_jp_protected_ports_junior_desc:0 "Adopt protectionist trade laws and open our ports. The common market’s tariffs remain under the control of its leading country."
 nesnd_jp_foreign.2.d1:0 "Our overlord has agreed to loosen its hold, raising us one step towards autonomy. The two governments have agreed a five-year truce. Matters that once needed permission at every turn can now be taken in hand ourselves."
 nesnd_jp_foreign.2.d2:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting] has recognized our independence. The subject relationship is dissolved, and a five-year truce now stands between us. Our government will conduct its own domestic and foreign affairs."
 nesnd_jp_foreign.2.d3:0 "Our overlord has given its assent to domestic reform. The government may pursue changes to public appointments, military administration and representation while the subject relationship remains in force."
 nesnd_jp_foreign.2.d4:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting] has agreed to provide development funds, so the money to expand workshops and train craftsmen has been found. No further grant of this kind will be available for three years."
 nesnd_jp_foreign.2.d5:0 "The Korean settlement has been accepted. Our claims to Busan and Yangho have been withdrawn, and any territory we still held there has passed to Korea."
 nesnd_jp_foreign.2.d7:0 "Our overlord has authorized negotiations for union with the other Japanese subjects. Our envoys may now approach them, though each invited government must still consent to the union."
 nesnd_japan_unification_bar_name:0 "Japanese Heartland"
 nesnd_japan_unification_bar_desc:0 "$nesnd_japan_unification_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 7#!"
 nesnd_japan_unification_bar_change:0 "Territorial changes"

 nesnd_japan_force_ready_tt:0 "The army and navy both project power, and at least two preparations are complete.\n#v Finance#!　The weekly balance and bureaucracy are nonnegative.\n#v Army#!　Legitimacy is at least 50 and army power projection matches or exceeds Japan’s.\n#v Navy#!　Naval maintenance fulfillment is at least 90% and naval power projection matches or exceeds Japan’s."
 nesnd_jp_culture_preview_state:0 "\nNext month, some residents of [ROOT.GetCountry.MakeScope.Var('nesnd_jp_next_state').GetState.GetName] are expected to adopt [ROOT.GetCountry.MakeScope.Var('nesnd_jp_next_target').GetCulture.GetName] culture."
 nesnd_jp_culture_preview_none:0 "\nNo state is expected to see a cultural shift next month."
