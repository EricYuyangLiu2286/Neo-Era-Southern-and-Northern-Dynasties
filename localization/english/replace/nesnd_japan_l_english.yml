 nesnd_jp_policy_representative_current:0 "Current policy: Representative Government."
 nesnd_jp_policy_representative_choose:0 "Adopt Representative Government: Enactment speed +10%, Landowner approval −2, Armed Forces approval −1, Industrialist approval +1."
