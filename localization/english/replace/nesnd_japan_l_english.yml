 nesnd_jp_jingnan_stance: "The Outer Vassal's Course"
 nesnd_jp_jingnan_stance_reason: "[ROOT.GetCountry.GetName] is the largest of the Ming court's outer vassals. Two hundred years ago the Toyotomi ended the Warring States with the support of the Ming Prince of Wu, and the Zheng house and the shogunate have dealt with each other ever since. Today the Zheng at Hangzhou hold the armies and revenues of the Southern Ming, the court at Nanjing and the provinces are deadlocked over the succession, and civil war could break out at any moment. The shogunate must decide before the fighting starts: accept the Zheng as overlords and send troops to their aid, use the Southern Ming's turmoil to seek independence, or stay out of the war."
 nesnd_jp_jingnan_stance_status_none: "The shogunate has not yet decided. It will answer when the southern dispute is locked."
 nesnd_jp_jingnan_stance_status_against: "The shogunate currently intends to seek independence. This intention will stand when the southern dispute is locked."
 nesnd_jp_jingnan_stance_status_wu: "The shogunate currently intends to accept the Zheng as overlords. This intention will stand when the southern dispute is locked."
 nesnd_jp_jingnan_stance_status_neutral: "The shogunate currently intends to stay out of the war. This intention will stand when the southern dispute is locked."
 nesnd_jp_stance_against_button: "Seek Independence"
 nesnd_jp_stance_against_button_desc: "Civil war in the Southern Ming is our chance to cast off the name of an outer vassal. As soon as war begins, the shogunate will take the field against the Zheng and cease to be a vassal of the Ming court."
 nesnd_jp_stance_against_tt: "When the southern dispute is locked, [ROOT.GetCountry.GetName] joins the side against Wu and goes to war with Wu. Our intention cannot be changed for #v 12 months#!."
 nesnd_jp_stance_wu_button: "Declare Submission"
 nesnd_jp_stance_wu_button_desc: "The Zheng helped the Toyotomi win their realm. If the Zheng mean to rule all under Heaven, the shogunate will accept them as overlords and send troops as soon as war begins."
 nesnd_jp_stance_wu_tt: "When the southern dispute is locked, [ROOT.GetCountry.GetName] joins the war on Wu's side. Our intention cannot be changed for #v 12 months#!."
 nesnd_jp_stance_neutral_button: "Stay Out"
 nesnd_jp_stance_neutral_button_desc: "The quarrel between Nanjing and Hangzhou over the succession is not worth the shogunate's troops."
 nesnd_jp_stance_neutral_tt: "When the southern dispute is locked, [ROOT.GetCountry.GetName] remains neutral and does not join the war. Our intention cannot be changed for #v 12 months#!."
 nesnd_jp_jingnan_cooldown_tt: "#v 12 months#! have passed since we last changed our intention."
 nesnd_jp_jingnan_stance_end_tt: "The southern dispute has been locked, or the Zheng have taken the throne."
 nesnd_jp_jingnan_stance_conclusion: "The southern dispute has been decided, and the shogunate need weigh its course no longer."
