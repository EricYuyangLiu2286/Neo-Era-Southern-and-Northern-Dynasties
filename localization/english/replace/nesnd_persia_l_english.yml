l_english:
 nesnd_per_future_progress:0 "The Near-Western Empire's Future"
 nesnd_per_future_delta_desc:0 "The Court's Preparations"
 nesnd_per_future_bar_desc:0 "$nesnd_per_future_progress$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_per_future_status_choice:0 "The court has yet to settle its relations with Ili."
 nesnd_per_future_status_aid:0 "The government has chosen to seek support from Ili for expansion to the west."
 nesnd_per_future_status_covert:0 "Our envoys are approaching Central Asian leaders opposed to Ili."
 nesnd_per_future_journal:0 "The Future of the Near-Western Empire"
 nesnd_per_future_journal_reason:0 "The Tang-Persian court knows both the military government of Qin and the merchants and great families of Persia. The Near-Western War brought land and prestige, but left the Empire's future course unsettled.\n\nMarching west with Ili's help means fighting Muslim states, and the Persians will see only the Tang wielding a Qin sword once again. Seeking a path through Western Qin's own quarrels leaves the Tang without a patron, but also spares them the name of Qin lackeys."
 nesnd_per_west_journal:0 "Renew the Far-Western War"
 nesnd_per_west_journal_reason:0 "The court has turned its attention beyond Mesopotamia. Qin military traditions and Persian wealth will drive a new campaign of expansion. The Ottomans, Egypt and the states of Arabia may seek powerful allies of their own.\n\nEvery claim pressed further west adds to the grumbling against the Tang in the mosques."
 nesnd_per_east_journal:0 "Renew the Near-Western War"
 nesnd_per_east_journal_reason:0 "Ili's authority is under challenge. The court intends to pursue its own interests along the routes through Central Asia and India. The frontiers of its former overlord now attract the attention of Persian commanders.\n\nThe Persians are glad enough to see the army turned against the Qin."
 nesnd_per_seek_aid_button:0 "Send Envoys to Ili"
 nesnd_per_seek_aid_button_desc:0 "Request Qin assistance in reforming our administration and army, in preparation for expansion to the west."
 nesnd_per_subvert_button:0 "Approach the Peoples of Western Qin"
 nesnd_per_subvert_button_desc:0 "Cultivate local leaders opposed to Ili and prepare to cast off our overlord's rule and expand eastward."
 nesnd_per_aid_law:0 "Legal Advisers from Ili"
 nesnd_per_aid_building:0 "Foreign Craftsmen"
 nesnd_per_aid_legitimacy:0 "Qin Endorsement"
 nesnd_per_claim_cost:0 "Frontier Negotiations"
 nesnd_per.1.a:0 "Welcome their assistance."
 nesnd_per.1.t:0 "Legal Advisers from Ili"
 nesnd_per.1.d:0 "The officials sent by Qin bring experience beyond military administration. Working with local clerks, they are putting the laws in order so that officials, merchants and landowners need no longer contend with several conflicting sets of rules for the same business."
 nesnd_per.1.f:0 "“The Qin law officers and the local clerks are to put the laws in order together, so that every matter touching officials, merchants and landowners is handled under a single set of rules.”\n- Decree of the royal court"
 nesnd_per.2.a:0 "Welcome their assistance."
 nesnd_per.2.t:0 "Foreign Craftsmen"
 nesnd_per.2.d:0 "The craftsmen who accompanied the mission have arrived in our workshops. They are teaching surveying, construction and machine maintenance. Local workers and merchants must now turn those skills into lasting enterprises."
 nesnd_per.2.f:0 "“The craftsmen who came with the mission are assigned to the workshops to teach surveying, construction and the repair of machinery.”\n- Workshop assignment list"
 nesnd_per.3.a:0 "Welcome their assistance."
 nesnd_per.3.t:0 "The Qin Envoy at Court"
 nesnd_per.3.d:0 "The Qin envoy has affirmed his court's support for our government. Officers and merchants with ties to Ili are reassured, and the endorsement has quieted the court's opponents for the time being."
 nesnd_per.3.f:0 "“The Emperor of Great Qin greets your sovereign and wishes our two realms to remain allies for ever.”\n- State letter read by the Qin envoy at court"
 nesnd_per.4.a:0 "Our course lies westward."
 nesnd_per.4.t:0 "A Western Course"
 nesnd_per.4.d:0 "Our tributary relationship with Ili is settled, and we have chosen expansion to the west. Commanders are preparing new campaigns, while merchants seek markets along the routes the army will take."
 nesnd_per.5.a:0 "The Near-Western War enters a new chapter."
 nesnd_per.5.t:0 "Opportunity in the East"
 nesnd_per.5.d:0 "Our preparations among the local powers of Western Qin are complete. The court will pursue its own ambitions in Central Asia and India, free of orders from Ili."
 nesnd_per.5.f:0 "“From this day, our orders are our own.”\n- Edict proclaimed at court"
 nesnd_per.6.a:0 "Deliver the note to the foreign courts."
 nesnd_per.6.t:0 "A Frontier Claim"
 nesnd_per.6.d:0 "The court has formally asserted its claim to [SCOPE.sStateRegion('nesnd_per_claim_region').GetName]. Commanders and merchants can prepare their next moves. Possession of the territory must still be secured through diplomacy or war."
 nesnd_per.6.f:0 "“Our court hereby formally asserts its rights to [SCOPE.sStateRegion('nesnd_per_claim_region').GetName].”\n- Note to the neighbouring states"
 nesnd_per.7.a:0 "Suspend the negotiations."
 nesnd_per.7.t:0 "A Power Objects"
 nesnd_per.7.d:0 "A foreign power has opposed our claim to [SCOPE.sStateRegion('nesnd_per_claim_region').GetName]. The court has failed to secure recognition. It must improve its diplomatic position before renewing the demand."
 nesnd_per_future_complete_tt:0 "Progress towards $nesnd_per_future_progress$ has reached #v 100#!."
 nesnd_per.4.d_unavailable:0 "We have chosen expansion to the west, but the proposed tributary relationship with Ili has not taken effect. Commanders and merchants can still pursue a western policy, drawing on the troops, revenues and support presently available."
 nesnd_per.4.f:0 "“The court having resolved to expand westwards, the military administration is preparing an expedition, and merchants are to follow the army to open markets.”\n- Marching orders of the military administration"
