 nesnd_per_west_complete_conclusion:0 "From the Mediterranean shore to the Red Sea and the Gulf of Oman, the lands of the Far West now lie under Tang robes."
 dyn_c_per_tang_caliphate:0 "Tang-Robed Caliphate"
 dyn_c_per_tang_caliphate_adj:0 "Tang-Robed"
 nesnd_per.8.t:0 "Three Robes Made One"
 nesnd_per.8.d:0 "Baghdad of the Black-Robed, Damascus of the White-Robed, Cairo of the Green-Robed: all now fly the banner of the Tang robes. The Sharif of Mecca has sent the keys of the holy city, and from the Friday pulpits the ulama recite the caliph's title for the sovereign of the Tang-Persian Empire. A descendant of the Tang now sits in the seat the Abbasids left empty so long ago.\n\nThe Tang at court call it the completion of two hundred years of Qin's westward march; the Persians call it one more crown on a foreign head. From now on, every Muslim must answer one question: does the word of the Tang-Robed Caliph count?"
 nesnd_per.8.f:0 "'Three colours of robe, one household under heaven.' - newly carved inscription in Baghdad"
 nesnd_per.8.a:0 "Now Arabia too lies under Tang robes."
 nesnd_per.8.a.tt:0 "The country's name follows its ruling culture and state faith (Tang and Sunni: '$dyn_c_per_tang_caliphate$'; Tang and Shia: '$dyn_c_per_tang_imamate$'; otherwise '$dyn_c_per_western_tang$'; Persian or Arab rulers take their own titles), and it adopts a black, white and green flag."
 dyn_c_per_tang_imamate:0 "Tang-Robed Imamate"
 dyn_c_per_tang_imamate_adj:0 "Tang-Robed"
 dyn_c_per_western_tang:0 "Western Tang"
 dyn_c_per_western_tang_adj:0 "Western Tang"
 dyn_c_per_persian_caliphate:0 "Persian Caliphate"
 dyn_c_per_persian_caliphate_adj:0 "Persian"
 dyn_c_per_iran_shahdom:0 "Shahdom of Iran"
 dyn_c_per_iran_shahdom_adj:0 "Iranian"
 dyn_c_per_iran_empire:0 "Iranian Empire"
 dyn_c_per_iran_empire_adj:0 "Iranian"
 dyn_c_per_arab_caliphate:0 "Arab Caliphate"
 dyn_c_per_arab_caliphate_adj:0 "Arab"
 dyn_c_per_arab_imamate:0 "Arab Imamate"
 dyn_c_per_arab_imamate_adj:0 "Arab"
 dyn_c_per_arab_empire:0 "Arab Empire"
 dyn_c_per_arab_empire_adj:0 "Arab"
 nesnd_per.8.d_shia:0 "Baghdad of the Black-Robed, Damascus of the White-Robed, Cairo of the Green-Robed: all now fly the banner of the Tang robes. The Sharif of Mecca has sent the keys of the holy city, but the Shia ulama will recite no caliph's title for any king; from their pulpits they call the sovereign of the Tang-Persian Empire the guardian of the Imams.\n\nThe Tang at court call it the completion of two hundred years of Qin's westward march; the Sunni scholars say the holy cities have fallen to heretics. From now on, every Muslim must answer: does the word of the Tang-Robed Imamate count?"
 nesnd_per.8.d_other:0 "Baghdad of the Black-Robed, Damascus of the White-Robed, Cairo of the Green-Robed: all now fly the banner of the Tang robes. The court has asked the ulama for no title at all, and written one old word on its edicts instead: Tang.\n\nThe Tang say the Western Liao once ruled Transoxiana without taking up the local faith; the ulama say a court that does not bow to God holding the holy cities is a shame on every Muslim. The edicts of the Western Tang will reach as far as its soldiers do."
 nesnd_per.8.d_foreign:0 "Baghdad, Damascus and Cairo all belong to this court now. What the old Tang garrisons never finished, the new dynasty has. The keys of the holy city have been brought to the palace, and the pulpits recite a new title.\n\nThe Tang robes have faded, but the lands of the Far West remain. The new court must answer what will hold so great a realm together."
 nesnd_per.9.t:0 "Credentials for the Envoys"
 nesnd_per.9.d:0 "The envoys are ready to leave. The court must decide whom they are to meet. The officers want to send them to Ili to request Western Qin advisers for a campaign in the west. Merchants who know Central Asia offer instead to carry private letters to chiefs who resent Ili’s rule."
 nesnd_per.9.f:0 "“If names are not correct, speech does not accord with the truth. If speech does not accord with the truth, affairs cannot succeed.”\n- The Analects, Zilu"
 nesnd_per_route_choice_available_tt:0 "When “$nesnd_per.9.t$” is open, choose the route in the event."
