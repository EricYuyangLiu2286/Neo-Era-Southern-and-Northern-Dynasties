 fra_unrest.21.t: "Missed Opportunity"
 fra_unrest.21.d: "The opportunity to change to a new dynasty has been missed, and now the political situation in France is sliding in a direction unimaginable to the former monarchists..."
 fra_unrest.21.f: "'Stupidity lies in the haste to draw conclusions.' — 'A Reply' by Gustave Flaubert"
 fra_unrest.21.1: "We shall wait and see."

 fra_unrest.22.t: "Missed Opportunity"
 fra_unrest.22.d: "The opportunity to change to a new dynasty has been missed, and now the Bonapartes have stabilized their position. The secret support gathered among our leaders is rapidly dissipating, as if it never happened."
 fra_unrest.22.f: "'Stupidity lies in the haste to draw conclusions.' — 'A Reply' by Gustave Flaubert"
 fra_unrest.22.1: "We shall wait and see."

 ce_french_empire_oreleans_progress_bar_100_tt: "Progress bar reaches #g 100%#!"

 ce_french_support_dynasty_button: "Defend the Dynasty"
 ce_french_support_dynasty_button_desc: "The path of Bonaparte is the only way to the unity and prosperity of the [ROOT.GetCountry.GetAdjective] nation. Revolutionary monarchy and Napoleonic constitutionalism are the only way to achieve both stability and justice."

 ce_french_against_dynasty_button: "March Towards the Republic"
 ce_french_against_dynasty_button_desc: "Either revolution or empire. Any compromise is to numb the [ROOT.GetCountry.GetAdjective] citizens. We are a nation that dares to be independent and is good at self-defense, and we absolutely do not need a tyranny that threatens our lives to rule over us!"

 ce_french_orleans_dynasty_button: "The Third King"
 ce_french_orleans_dynasty_button_desc: "There is a force in Bonaparte's government that does not belong to the hypocritical revolutionary dictatorship, nor to the bloody republicanism, nor is it a supporter of the old regime. It symbolizes a British-style constitutionalism, a moderate, stable but resilient social form."
 je_ce_orleans_dynasty_support: "Establish a New Dynasty"
 je_ce_orleans_dynasty_support_reason: "Napoleon's descendants and their military supporters have a natural arrogance that makes them unsuitable for a stable and prosperous constitutional government. The world today is one of constitutionalism and reason, no longer a world that can be dominated by a military regime. Let alone for France to lead the Western world to victory in the East-West confrontation."
 je_ce_orleans_dynasty_support_goal: "Establish a New Dynasty"
