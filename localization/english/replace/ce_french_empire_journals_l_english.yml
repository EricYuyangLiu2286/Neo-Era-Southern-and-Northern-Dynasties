 fra_unrest.1.t: "Imperial Internal Affairs"
 fra_unrest.1.d: "Napoleon's mighty empire brought greatness, but never stability. The French people, proud and restless by nature, could never accept being mere subjects. When his successor softened the iron grip and abolished the terror campaigns, new problems emerged—ruling such a vast realm demanded everything from the throne itself.\n\nEmperor Joseph, with his heart burdened by the weight of the empire, had a sudden death in 1832. His young, ambitious cousin and heir Louis quickly formed a new cabinet. He promised social equality, prosperity, and a constitutional order where a strong monarch would lead with the people's welfare at heart. \n\n However, after two decades listening promises after promises from the Bonapartes, the French grow impatient. How much longer must they wait?"
 fra_unrest.1.f: "'The Empire is peace.' — Emperor Charles Louis Napoléon Bonaparte at his coronation ceremony in Reims Cathedral, 1832"
 fra_unrest.1.1: "Right is secondary."
 fra_unrest.2.t: "Bonapartist Victory"
 fra_unrest.2.d: "We have finally proven to the people that the reforms promised by the Bonaparte dynasty since 1829 are real and realistic. The vision of Bonapartism is not just about manipulates laws, agendas, or social conflicts to keep people quite and hopeless, but a truth based on ideas of a constitutional state and benevolent big government. \n\n At least to some extent, we have followed the teachings of Emperor Napoleon and found a balance between radical ideologies and the old ways, between elites and the masses, for the French nation and the French society."
 fra_unrest.2.f: "'...the law, in its majestic equality, forbids the rich as well as the poor to sleep under bridges, to beg in the streets, and to steal bread...' — Anatole France, The Red Lily"
 fra_unrest.2.1: "When Paris in prosperous, Europe flourishes. When Paris in deficit, Europe declines."
 fra_unrest.3.t: "The Post-Bonaparte Era"
 fra_unrest.3.d: "The demise of an empire is not always spectacular; it can also be silent. The Senate reform of 1835 perfected the concept of 'imperial citizens' rather than 'subjects,' and attempted (at least once again) to grant propertied citizens 'dignity, duty, and the right to vote.' From that moment on, the 'Frenchmen belonging to the dynasty and the state' of the post-revolutionary and Napoleonic era of autocracy disappeared. It was as if they had never existed, nor should they have. Thus, the reform of that empire and its self-demise in the process of reform became inevitable."
 fra_unrest.3.f: "'The existence of a nation is a daily plebiscite.' — Ernest Renan, 'What is a Nation?'"
 fra_unrest.3.1: "Without Napoleon, what do we have left?"
 ce_french_empire_has_ended: "Did not become a #b Republic#! by the time the relevant [concept_journal_entry] ended."
 ce_french_empire_has_not_ended: "Became a #b Republic#! before the relevant [concept_journal_entry] was invalidated."
 ce_french_empire_has_ended_alt: "Chose a system other than monarchy or republic."
 
 fra_unrest.4.t: "Strange Bedfellows"
 fra_unrest.4.d: "The [SCOPE.gsInterestGroup('monarchists_in_opposition').GetLeader.GetIdeology.GetName] [SCOPE.gsInterestGroup('monarchists_in_opposition').GetName] and the [SCOPE.gsInterestGroup('republicans_in_opposition').GetLeader.GetIdeology.GetName] [SCOPE.gsInterestGroup('republicans_in_opposition').GetName] have realized their common goal: to overthrow the current regime. Some die-hard supporters have even taken this a step further, supporting each other in various opposition activities such as court cases, printing leaflets, and forming cliques."
 fra_unrest.4.f: "'The enemy of my enemy is my friend, isn't it? Of course, those scoundrels don't understand the direction of developments. Once we achieve our goal, we can burn the bridge.'"
 fra_unrest.4.a: "To destroy the establishment, all parties must unite."
 fra_unrest.4.b: "It's better to be alone than in bad company."
 fra_unrest.4.c: "This cooperation is too forced and has no future."
 
 fra_unrest.6.b: "This is thanks to the soldiers, not the leaders."
 fra_unrest.6.4: "I hear that in the distant Western Qin, the iron fists elect the emperor, not the other way around."
 
 fra_unrest.7.4: "Entrepreneurs should have a higher status!"
 
 fra_unrest.8.t: "Populist Political Trend"
 fra_unrest.8.d: "In the cities of [ROOT.GetCountry.GetAdjective], a sentiment different from the usual [SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName] is brewing. With the recent promotion of some grassroots politicians to high positions in the state, even the working class, who once only had the energy to work from dawn to dusk and cared little for neighborhood life, have begun to actively participate in community activities. It's as if by electing a high-ranking person of their choice, their housing problems of leaking roofs and chaotic tiles will immediately receive the state's help."
 fra_unrest.8.f: "'Fallen houses will be managed, smelly water will be managed, too hot will be managed, too cold will be managed, infectious diseases will be managed, black intermediaries will be managed, and market bullies will also be managed! His Majesty is one of us!'"
 fra_unrest.8.1: "The high and mighty Bonaparte is a Bonaparte of the past."
 fra_unrest.8.2: "There's nothing wrong with encouraging community politics..."
 fra_unrest.8.3: "The essence of [SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName] is to solve problems for the national economy and people's livelihood, not to chant scriptures and pray!"
 fra_unrest.8.4: "Isn't this a kind of republican sentiment?"

 fra_unrest.9.t: "Divine Intervention"
 fra_unrest.9.d: "The clergy of [ROOT.GetCountry.GetAdjective] have been politically active since ancient times. Cardinal Richelieu is but the most famous among them, serving as advisors, bureaucrats, and propagandists in successive [ROOT.GetCountry.GetAdjective] courts. Even if scholars call the emperors' ruling art [SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName] and explain it rationally and modernly, it does not prevent a part of the clergy from constantly exerting the influence of divine right of kings on the Bonaparte dynasty."
 fra_unrest.9.f: "'Does not God demand that the monarch rule? Is the shepherd's power granted by the sheep? Does the shepherd not work wholeheartedly for the welfare and prosperity of his flock? Should it not be God, rather than mortals, who judges an incompetent king?'"
 fra_unrest.9.1: "Come in, friends in black."
 fra_unrest.9.2: "It's enough to allow some clergy to hold government positions, right?"
 fra_unrest.9.3: "[SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName] is inseparable from loyalty to the Lord."
 fra_unrest.9.4: "Render unto God what is God's, and unto Caesar what is Caesar's."

 fra_unrest.10.t: "A Question from [SCOPE.sCharacter('partisan_character').GetFullName]"
 fra_unrest.10.d: "As social sentiment continues to rise amidst today's political and economic reforms, some constitutional monarchist ideas, different from general Bonapartism, have begun to spread. Whether it's a simple reflection on it or some new trend of thought, it points to certain noble high-level officials in the government who are not from the Bonaparte family. The famous politician [SCOPE.sCharacter('partisan_character').GetFullName] is one of them.\n\nToday, [SCOPE.sCharacter('partisan_character').GetFullName], claiming to represent the entire [SCOPE.sCharacter('partisan_character').GetInterestGroup.GetName], published some comments on the current political situation in our country's major newspapers. Although [SCOPE.sCharacter('partisan_character').GetHerHis] tried his best to conceal his desire to criticize the current situation and packaged his words with various neutral analyses and data, it has caused a great stir in the folk and political circles of [ROOT.GetCountry.GetAdjective]."
 fra_unrest.10.f: "#bold [SCOPE.sCharacter('partisan_character').GetFullNameNoFormatting]: 'My heart is sincere towards the [SCOPE.sCharacter('partisan_character').GetCustom('french_dynasty_name')]. But judging from the statistical data published by various universities recently, many phenomena in our society really cannot be said to be reasonable...'#!\n\n[SCOPE.sCharacter('partisan_character').GetFullNameNoFormatting], as a prolific monarchist and a political figure of the [SCOPE.sCharacter('partisan_character').GetInterestGroup.GetNameNoFormatting], has long been known for his writings and speeches calling for reconciliation, and rarely expresses his criticism of actual policies. The people of [SCOPE.sState('capital_scope').GetCityHubName] have both supported and slandered [SCOPE.sCharacter('partisan_character').GetLastNameNoFormatting]'s declaration this morning. (Continued on page two)"
 fra_unrest.10.1: "We must reflect deeply..."
 fra_unrest.10.2: "Refute him with an editorial supporting the government!"

 fra_unrest.12.t: "The Death of Charles X"
 fra_unrest.12.d: "The Bonaparte dynasty's use of the so-called 'revolutionary monarchy' banner to talk about the glory of the [ROOT.GetCountry.GetAdjective] nation always strengthens people's memory of the era of the Sun King.\n\nThus, since Emperor Joseph liberalized speech, there have always been voices among the people calling for the overthrow of the republican-era verdicts. These voices cry out for 'Citizen Louis,' calling for the restoration of the Bourbon family's citizenship and their readmission to the country. But the more this happens, the more vigilant the rulers of the Bonaparte dynasty become, only allowing the family to be sheltered by their cousins in [SCOPE.sCountry('slovenia_owner_scope').GetName], and never mentioning any pardon.\n\nHowever, perhaps riding on the coattails of some social issue, the news of the death of the current head of the Bourbon family, Charles Philippe, who called himself 'King Charles X of France in exile,' has caused a stir in the country. Thousands of supporters of the old monarch from various provinces and villages have gathered on the streets of [SCOPE.sState('capital_scope').GetCityHubName] to petition for his body to be returned to [ROOT.GetCountry.GetNameNoFormatting] for burial. Supporters of the republicans and the current regime have launched counter-protests to obstruct them."
 fra_unrest.12.f: "The uncrowned king is dead, but few are prepared to weep as they once did. Thousands call for the body of the exiled king to be returned to France for burial. 'Tradition,' they say. Thousands more swear to burn the corpse. 'Cholera,' they say."
 fra_unrest.12.1: "How could this Charles share power with you, what nonsense!"
 fra_unrest.12.2: "Compared to the republicans who are quick to use the butcher's knife, I still prefer the old regime."
 ce_allow_you_to_chose_bourbon_tt: "Unlocks a new journal option: #b Bourbon Restoration#!"

 fra_unrest.13.t: "The Great March"
 fra_unrest.13.d: "After the outbreak of the Great Revolution, the [ROOT.GetCountry.GetAdjective] people are always restless and happy to voice their demands. Just like earlier today, some people from unknown origins gathered in a church on the outskirts of [SCOPE.sState('capital_scope').GetCityHubName]. Before the nearby police station could act, these people had already formed ranks. A little after lunchtime, they appeared collectively on the streets of [SCOPE.sState('capital_scope').GetCityHubName], holding banners and red and white flags, shouting slogans like 'Republic' or 'Civil Rights' and some foul language cursing His Majesty. They marched in neat steps towards the imperial palace..."
 fra_unrest.13.f: "'Little Napoleon, rules with sycophants. The island barbarian is not the rightful ruler, still give us civil rights!'"
 fra_unrest.13.1: "Send out the military and police!"
 fra_unrest.13.2: "They're cursing Little Napoleon, what does that have to do with me, [SCOPE.sCharacter('ruler_of_france_character').GetFullNameNoFormatting]?"
 
 fra_unrest.14.t: "Backroom Deal"
 fra_unrest.14.d: "The [ROOT.GetCountry.GetAdjective] army is not a monolith. Even in the days of Napoleon the Great, people had their own interests and circles. Besides those with strong ties to the establishment and tradition represented by Bonaparte, rising political factions can always find a breakthrough in people's hearts. Wasn't Napoleon the Great himself once a beloved general and supporter of the 'Republic'?"
 fra_unrest.14.f: "'[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting], look at the streets, look at the world, think about yourself, think about this deposit slip, do you really want to stand against these things and history itself?'"
 fra_unrest.14.1: "[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting] gives them limited support."
 fra_unrest.14.2: "[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting] is convinced by republicanism!"
 fra_unrest.14.3: "[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting] is convinced by socialism!"

 fra_unrest.15.t: "Speaking Out for Republicanism"
 fra_unrest.15.d: "Republicanism is spreading in the streets and alleys, especially this year. Perhaps because of short-term stock market fluctuations that caused some factories to close, or perhaps because of some vicious cases arising from labor disputes, or perhaps due to the instigation of some mysterious forces, many opinion leaders of the [SCOPE.gsInterestGroup('ce_republican_ig').GetName] have taken to the streets, calling for a more open and popular sovereign government."
 fra_unrest.15.f: "'Is the [SCOPE.gsInterestGroup('ce_republican_ig').GetName] made up of cowards? True monarchy is when people are their own kings in their hearts!'"
 fra_unrest.15.1: "Demons and ghosts, suppress them with tranquility."
 fra_unrest.15.2: "Launch a counter-protest to confront them."
 ce_french_republican_unity: "Republican Ideological Trend"

 fra_unrest.16.t: "Major Scandal"
 fra_unrest.16.d: "Earlier this month, a notorious pro-republican newspaper published an investigative report on Mr. [SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting]. The author detailed his undercover interviews at a company clearly linked to [SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting]'s cronies. He discovered that this company acted almost like the authorities' black glove, not only operating morally reprehensible businesses like opium and usury within our country, but also participating in the trafficking of children and young female citizens.\n\nUnder the current legal system of our dynasty, the enslavement of citizens is explicitly illegal. But they have been profiting handsomely by leveraging their relationship with [SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting]'s cronies."
 fra_unrest.16.f: "'[SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting] may genuinely know nothing about this. But he chose such people as his attendants, doesn't that also prove his incompetence?'"
 fra_unrest.16.1: "Someone is about to 'commit suicide' to escape punishment."
 fra_unrest.16.2: "Let that fool leave the country and hide for a while."
 fra_unrest.16.3: "Find a way to attack the authenticity of the case, and then make that fool and the reporter disappear!"

 fra_unrest.17.t: "Republican Uprising"
 fra_unrest.17.d: "Due to economic problems, popular discontent, social conflicts, or some other messy issues, the popular call for republicanism has finally reached a peak. Thus, after many years, scattered barricades and concentrated processions have appeared in Paris and the major provincial cities. Many high-level government officials are at their wits' end, not knowing how to mobilize resources to solve this major chaos..."
 fra_unrest.17.f: "'The truth is on its way, and nothing can stop it!'"
 fra_unrest.17.1: "Alright! Alright! We should make concessions to them on key issues."
 fra_unrest.17.2: "Never compromise with them! We still have political power to mobilize."
 fra_unrest.17.3: "Raise funds from entrepreneurs, with money there is a way..."
 fra_unrest.17.4: "Where are my generals?"
 fra_unrest.17.5: "Mobilize the influence of the nobles and gentry!"

 fra_unrest.18.t: "The Orléanists of the Empire"
 fra_unrest.18.d: "Louis-Philippe was the son of Louis-Philippe II, Duke of Orléans. After the outbreak of the Great Revolution, he fled to England for a time, and after England made peace with Napoleon, he traveled to the United States and the Great Ming, and was deeply impressed by the constitutional democracies of these countries. During his exile in the Southern Ming, he was hired as a French and Western history teacher for the crown prince, receiving the robes and salary of a Hanlin Academy scholar.\n\nIn early 1830, Louis-Philippe responded to Emperor Joseph's call for reconciliation and returned to the country. As the first great noble among the returning old aristocracy and an expert on the East, he was soon summoned by Emperor Joseph, became his advisor on Eastern affairs, and joined the Imperial Senate. He then came into contact with Crown Prince Louis Bonaparte and shrewdly infiltrated his circle of confidants. After Joseph's sudden death in 1832 and Louis's accession, Philippe leaped to become the Empire's Foreign Minister, playing an important role in stabilizing the regime of Napoleon III.\n\nAs the face of the Napoleonic regime, Foreign Minister Louis-Philippe presented a loyal and amiable image to the empire's internal and external audiences, and was beloved by the citizens for completing several important treaties that defended the empire's interests. Taking advantage of the emperor's indulgence, Louis and his supporters gathered a group of followers known as the 'Orléanists,' who subtly but persistently expressed their views on expanding constitutionalism and the electoral system in various salons and newspapers. To this day, the mark of Louis-Philippe and his supporters can be found in almost every corner of the empire's foreign and trade affairs."
 fra_unrest.18.f: "'True opportunity only favors the prepared mind.'"
 fra_unrest.18.1: "I believe that the statesmen of the Empire should have a higher loyalty."
 FRA_ORL_popularity: "Popularity of the Moderate Faction"

 fra_unrest.19.t: "Orléanist Coup"
 fra_unrest.19.d: "In the treacherous political situation of the empire, no one expected the Bonaparte dynasty to collapse almost overnight. As military and police forces supporting Louis-Philippe's ideas stormed the imperial palace and provincial governments, the Bonapartist leader [SCOPE.sCharacter('fra_old_ruler_scope').GetFullNameNoFormatting] fled in haste. Foreign commentators could not understand how the Orléanists, originally seen as a pillar of the constitution, could have come to oppose [SCOPE.sCharacter('fra_old_ruler_scope').GetFullNameNoFormatting] and usurp the empire of Napoleon the Great from within.\n\nMeanwhile, within the French Empire, the nascent Orléans dynasty, under [SCOPE.sCharacter('french_monarch_scope').GetFullNameNoFormatting], while rewarding merit, is also nervously taking over or reshaping the administrative structure of the empire to conform to their and their supporters' vision of a constitutional monarchy."
 fra_unrest.19.f: "The more things change, the more they stay the same. The barons of old owned forges and fields. Today, they control machines and warehouses of goods. For a wise king, it matters not which keys these barons hold, so long as the keys are in the right hands."
 fra_unrest.19.1: "My loyalty to the constitution and the citizens is above my personal honor or disgrace."
 fra_unrest.19.2: "Only resolute reform can save the French Empire."
 fra_unrest.19.3: "Only resolute reform can save the French economy."
 ce_successful_coup_legitimacy: "Successful Coup"
 FRA_ORL_success: "The Industrialist Monarch"

 fra_unrest.20.t: "The Return of the Bourbons"
 fra_unrest.20.d: "Louis Bonaparte, calling himself 'Napoleon III,' is obsessed with his grand 'industrialization' plan. While he roams the capitalist circles of Parisian high society, rural France is dying. Soldiers who bought land and farms with their merits are losing money year after year due to the impact of industrial goods, on the verge of bankruptcy.\n\nBecause of this, a sentiment is spreading in the countryside, a feeling of betrayal. This sentiment was exploited by interested parties at the time of Charles X's death and reached a tipping point. Finally, using the opportunity of Charles X's coffin being returned for burial and the pressure from conservative and peasant protests, the new leader of the Bourbon family, the successor of Saint Louis, [SCOPE.sCharacter('FRA_ce_bor_leader_scope').GetFullNameNoFormatting], announced that he had reached an agreement with the Bonapartes to return to his homeland in exchange for renouncing the 'exiled French throne.'\n\nAfter a period of preparation, [SCOPE.sCharacter('FRA_ce_bor_leader_scope').GetFullNameNoFormatting] arrived in Paris last Saturday and appeared at the regular mass at Notre Dame the next day. Despite the advance deployment of military and police to monitor and control, the scene still attracted a large crowd of citizens..."
 fra_unrest.20.f: "'...What the legitimate monarchs of Europe must understand is... our real problem is that our souls no longer yearn for salvation, it is the life-and-death struggle with the heathens (especially the Ming people) in all fields, it is that we no longer use the sacred order to define our own and our subjects' positions...' — 'Letter from Barcelona, December 26, 1831' by the Bourbon heir Charles-Philippe (King Charles X of France in exile)"
 fra_unrest.20.1: "Divine right of kings, inviolable."
 
 fra_unrest.23.t: "Bourbon Restoration"
 fra_unrest.23.d: "Due to the complete disappointment of the government with the Bonapartist regime, a swift coup brought [ROOT.GetCountry.GetRuler.GetFullName] to power smoothly. Surprisingly and expectedly, the heir of the Bourbon family did not choose a traditional lavish ceremony, but appeared at the coronation in a simple black cloak like a clergyman and the old robes of Charles X. After a morning of devout worship and meetings with representatives of towns and the church, [ROOT.GetCountry.GetRuler.GetSheHe|U] was anointed in the Reims Cathedral and crowned as the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of [ROOT.GetCountry.GetName]."
 fra_unrest.23.f: "'Divine Providence has called me to this sacred land to assume the great responsibility of the King of France. Before the altar of the Lord who weighs the many monarchs and nations with one and the same heavenly balance, I promise to be loyal to the charter of this land, the sacred order, and Christian civilization, and I once again solemnly swear to uphold it.'"
 fra_unrest.23.1: "Long live the successor of Saint Louis!"
 fra_unrest.23.2: "If rule is not absolute, there is absolutely no rule."
 fra_unrest.23.3: "The sacred order will come!"
