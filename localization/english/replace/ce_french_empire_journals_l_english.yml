 ce_french_bourbon_dynasty_button: "Bourbon Restoration"
 ce_french_bourbon_dynasty_button_desc: "The revolution was a storm that almost destroyed the [ROOT.GetCountry.GetAdjective] nation. Our traditions of piety, loyalty, elegance, and chivalry have all been harmed by it. The subversive ideas and corrupt practices that followed have poisoned us to this day, leading us further and further away from the kingdom of God. This era cannot continue. We must have the glorious [ROOT.GetCountry.GetAdjective] monarchy return."
 je_ce_bourbon_dynasty_support: "Restore an Old Dynasty"
 je_ce_bourbon_dynasty_support_reason: "The Bonapartists and the Republicans are equally obsessed with the ravings of 'revolution' and 'civil rights.' And since its birth, this raving has brought nothing but slaughter, trampling, and destruction to humanity. It turns ruler and subject against each other, father and son against each other, makes peasants and soldiers kill their officers, and causes a country's economy to decline due to strikes and barricades. Christian civilization is in a life-and-death race with the atheists of the East, and we will not allow such ideas to continue to rage. We should welcome the return of the true king appointed by the sacred order!"
 je_ce_bourbon_dynasty_support_goal: "Restore an Old Dynasty"

