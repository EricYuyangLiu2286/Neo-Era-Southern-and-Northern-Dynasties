l_english:
 je_the_eastern_border_reason: "A Pacific squadron needs passage down the Amur and an anchorage on the coast. The western frontier presents a different question. Since the late sixteenth century, caravans bound for Ili and the Kyrgyz pastures have crossed lands governed by Western Qin. A settlement on the coast cannot settle who may tax a caravan at a mountain pass."
 je_the_eastern_border_treaty_of_aigun_desc: "The Amur links the Siberian posts to the Pacific. If the Chinese government holds the disputed bank, Russia can propose a boundary and terms for navigation."
 je_the_eastern_border_treaty_of_beijing_desc: "The harbours of Primorye could shelter and provision a Pacific squadron. If the Chinese government holds this coast, Russia can ask it to cede land for a port."
 je_the_eastern_border_russia_chuguchak_protocol_desc: "A boundary agreed at Chuguchak would determine who garrisons the passes and who collects dues when herds cross them. Russia can seek concessions from the Chinese government on land that government actually holds."
 russo_chinese.2.d: "Delegates have met at Chuguchak to draw the western boundary. The line on their maps runs between Russian outposts, summer pastures and the roads that serve the mountain markets. The Russian delegation must decide which lands to include in the protocol."
 russo_chinese.2.f: "“The delegates of both sides discussed the boundary to be drawn section by section. The lands to be included in the protocol are shown on the attached map.”\n- Minutes of the conference at Tacheng"
 je_pacify_the_steppes_reason: "Kazakh herders move with the seasons. Russian posts on the northern steppe demand obedience from passing caravans and the nearby camps. The oases and caravan roads farther south came under Western Qin in the late sixteenth century. A fort can command a river crossing without commanding the pastures to which the herds will move next.\n\nThe garrisons depend on chiefs who have accepted Russian protection to keep their supply routes open. Their opponents are visiting the same camps in search of allies."
 je_pacify_the_steppes_lobby: "#v Unlocked by DLC: Sphere of Influence#!\nRussia holds forts on the northern Kazakh steppe and can call on some chiefs under its protection. Whether the garrisons will have horses and fodder come spring still depends on the people who range beyond the posts."
 je_the_last_kazakh_khan: "Under the Khan’s Standard"
 je_the_last_kazakh_khan_reason: "Kazakh chiefs who have taken up arms have proclaimed a khan and challenged the Russian garrisons on the steppe. To regain control of the districts in revolt, Russia must defeat the government they have rallied around."
 kazakhstan_events.1.d: "Kazakh chiefs have proclaimed a khan and called on the pastoral camps to join them. The rising on the steppe now has a standard of its own. The roads carrying food and ammunition between the Russian forts lie directly in its path."
 kazakhstan_events.1.f: "“The Kazakh chiefs have raised a khan and called the herdsmen to revolt. The supply roads between the forts are the first to be threatened. I request reinforcements to escort the convoys without delay.”\n- Report of the frontier commander to the governor-general"
 kazakhstan_events.3.d: "The frontier garrisons have secured the roads onto the steppe. Russia must now decide how to govern the Kazakh districts under its authority and whether to press territorial claims farther south along the caravan routes."
 kazakhstan_events.3.f: "“The roads into the steppe are once again in our hands. I await the governor-general's orders on how the districts of the revolt are to be governed.”\n- Report of the frontier garrison"
 notification_kazakhstan_ride_of_kenesary_notification_desc: "[SCOPE.sCharacter('kenesary_scope').GetFullName] has begun a campaign against [SCOPE.sCountry('russia_scope').GetAdjective] garrisons and their allies on the steppe."
 je_conquest_of_central_asia_reason: "Southbound caravans cross the Kazakh steppe to reach the towns of Transoxiana and Khwarazm. Bukhara, Khiva and Fergana came under Western Qin in the late sixteenth century. To control the roads onward to Persia and India, Russia must secure the passes, river crossings and market towns on which those roads depend."
 je_conquest_of_central_asia_lobby: "#v Unlocked by DLC: Sphere of Influence#!\nThe cities of Transoxiana and the oases of Khwarazm have a long history under Western Qin. Extending Russia’s frontier to the southern caravan roads would mean taking control of the posts that already govern them."
 russian_central_asia.1.d: "South of the steppe, the river roads connect the markets of Bukhara, Khiva and Fergana. Russian cavalry can ride those roads, but it cannot carry commerce past every customs post by force. We must decide whether to seek the cooperation of the local authorities or press its demands with troops."
 russian_central_asia.1.f: "“Whether our advance along the line of Bukhara, Khiva and Fergana should begin with negotiation with the local authorities or with force to compel their submission is a question for the Council of Ministers.”\n- Memorandum of the Foreign Ministry to the Council of Ministers"
 russian_central_asia.2.t: "The Southern Caravan Roads"
 russian_central_asia.2.d: "Russia now commands several of the principal caravan roads across Central Asia. Beyond the oases, traffic must still cross the passes into the Afghan highlands to reach India or Persia. Frontier officers want to push the line farther south. Merchants would sooner have the roads already won made safe for travel."
 russian_central_asia.2.f: "“We ask that the trade routes already opened be made secure before any further advance to the south is considered.”\n- Petition of the merchants to the Ministry of Finance"
 je_conquest_of_central_asia_turkmen_button_desc: "Caravans travelling south along the eastern Caspian cross Turkmen pastures. Garrisoning the wells and stopping places would give the army control of traffic, but also bring it into conflict with the herders who depend on that water."
 russian_central_asia.3.d: "Repeated attacks along the eastern Caspian road have led merchants to ask the garrisons for escorts. Russia has ordered an expedition into the Turkmen pastures to secure the wells and campsites along the route."
 je_eastern_frontier_reason: "The roads from Herat run west into Persia and north through the oasis of Merv into Transoxiana. Persian rulers have long laid claim to Khorasan. Western Qin began collecting tolls and stationing troops along these routes in the late sixteenth century. To turn a claim into government, Persia must take the eastern provinces, keep their roads open and restore Merv.\n\nIf Persian captives are found in the conquered oases, we must also decide whether to free them and whether to #tooltippable #tooltip:je_eastern_frontier_tt_5 resettle#!#! them elsewhere."
 greater_khorasan_button_desc: "Persian rulers have long regarded Herat as the gateway to Khorasan. A public claim to Greater Khorasan would bring Persia into negotiations with the governments that hold its gates and passes, and commit it to the cost of a campaign if negotiations fail."
 persian_baluchistan_button_desc: "The wells and caravan routes across the Turkmen pastures matter to the security of Persia’s frontier. An expedition north could provide escorts for merchants, but its camps would draw on the same scarce water as the local herds."
 persia_resettle_merv_button_desc: "Merv’s walls survive, but the fortunes of the oasis depend on water reaching its fields from the Murghab. To bring settlers back, the government must repair the banks and clear the canals so farmers can harvest grain and passing caravans can find provisions."
 persia_events.1.d: "Persia and its subjects now hold the territories sought in Khorasan, Khwarazm and Transoxiana, and Merv has been restored. The eastern passes and caravan posts will require permanent garrisons if those gains are to last."
 persia_events.1.f: "“Khorasan, Khwarazm and Transoxiana have been brought under our rule. Troops are to be stationed permanently at the eastern passes and along the post roads.”\n- Decree of the Shah"
 persia_events.3.d: "Persia has ordered an expedition into the Turkmen pastures to the north. Its officers intend to hold the wells, escort caravans across the desert and use their garrisons to restrict the movement of local armed groups."
 persia_events.3.f: "“The wells along the route are to be occupied and held at once. Every caravan crossing the desert is to be given an escort.”\n- Orders for the expedition to the Turkmen pastures"
 persia_events.5.d: "After entering [SCOPE.sState('persia_slave_liberate_state_scope').GetName], the troops found enslaved people of [SCOPE.sCulture('persian_culture').GetName] culture. Families have come looking for missing relatives. Others are asking for the right to stay or return home. The slaveholders oppose losing their labour."
 persia_events.5.f: "“All who are searching for lost relatives in this province are to register at the army camp. Whether those set free may stay or return home is for the government to decide.”\n- Notice posted by the army"
 persia_events.2.d: "[SCOPE.sState('herat_scope').GetName] now lies under Persian authority. The road east leads towards Kabul, and the caravan route north to Merv. To hold that junction, the garrison will have to keep its own supply road open."
 event_effects_kazakhstan_events.1_tt: "• The #v $dyn_c_kazakh_khanate$#! rises in the Russian-subject Senior Zhuz or on Russian-held land in Syr Darya, including land held by a Kazakh subject. It takes Russian and Russian-subject Kazakh holdings in Syr Darya and Semirechye.\n• Any of the three zhuzes still subject to Russia joins the khanate if its [concept_liberty_desire] exceeds #v 60#!.\n• [GetPlayer.MakeScope.ScriptValue('large_radicals')|-=1%] of [GetCulture('kazak').GetName] [Concept('concept_pop', '$concept_pop|q$')] in all remaining [GetCulture('kazak').GetName] [Concept('concept_subject', '$concept_subjects|q$')] become more [concept_radical]\n• All remaining [GetCulture('kazak').GetName] [Concept('concept_subject', '$concept_subjects|q$')] get #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_kazakh_ungovernable_provinces_tt $modifier_kazakh_ungovernable_provinces$#!"
 event_effects_kazakhstan_events.3_tt: "• Russia annexes its Kazakh subjects with land in Central Asia, except $BKH$.\n$event_effect_choose_one$\n• Russia claims regions held by local Central Asian states, alone or together with Russia. Regions with any other outside owner or an owner with Manchu or Han as a primary culture are excluded.\n• Kazakh homelands held by Russia gain #tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_defeat_of_kenesary_khan_tt $modifier_defeat_of_kenesary_khan$#!."
