l_english:
 nesnd_india_foreign_affairs:0 "Indian Affairs"
 nesnd_india_foreign_affairs_reason:0 "The governments of $region_north_india$ and $region_south_india$ often put matters to other governments for an answer. They ask for money to build [GetBuildingType('building_university').GetName], [GetBuildingType('building_tooling_workshop').GetName] or [GetBuildingType('building_railway').GetName], for which the government that pays may take ownership. Hindustan sells property to its overlord or buys it back, and a stricken country asks Hindustan or its overlord for famine relief. A [concept_subject] needs the consent of its [concept_overlord] before another government may take ownership in it, or before it leaves its overlord to join Hindustan or an empire that succeeds it. A [concept_puppet] needs that consent for any matter at all. One such matter now awaits the answer of [ROOT.GetCountry.GetName]."
 nesnd_india_matter_status_consent_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent to engage engineers from [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for a survey and the training of craftsmen, for which [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]."
 nesnd_india_matter_status_consent_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent: the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] towards the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName], taking no ownership."
 nesnd_india_matter_status_consent_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent: the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] for the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName] and own it. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] is our [concept_subject], and the matter needs our consent."
 nesnd_india_matter_status_fund_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] offers @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] to engage our engineers for a survey and the training of local craftsmen."
 nesnd_india_matter_status_fund_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] towards the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. We would take no ownership."
 nesnd_india_matter_status_fund_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] to build the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. One level would be built at once and belong to our government."
 nesnd_india_union_status_consent_ask_dominion:0 "Our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to become a [concept_dominion] of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which would take it away from us. Only after our consent does the request reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may agree or decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] agrees, it pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] in compensation."
 nesnd_india_union_status_consent_ask_merge:0 "Our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to be merged into [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which would take it away from us. Only after our consent does the request reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may agree or decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] agrees, it pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] in compensation."
 nesnd_india_union_status_consent_invite:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] invites our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to join it, offering [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] a settlement allowance of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] accepts, it leaves us, merging into [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] or becoming its [concept_dominion]. Only after our consent does the invitation reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may still decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] accepts, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] in compensation."
 nesnd_mug_status_answer_9:0 "#v [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! states of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] are struck by a [concept_harvest_condition] and their farms yield less. It asks us for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] for relief."
 nesnd_mug_status_consent_9_1:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName], our [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetSubjectType.GetName], has states struck by a [concept_harvest_condition] and asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] for relief. The request needs our consent before it goes to the other government."
 nesnd_mug_status_consent_9_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] has states struck by a [concept_harvest_condition] and asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], one of our [Concept('concept_subject', '$concept_subjects|q$')], for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] for relief. Our subject needs our consent to pay it."
 nesnd_india_matter_status_done:0 "The matter has been answered."
 nesnd_india_matter_permit_button:0 "Give Consent"
 nesnd_india_matter_forbid_button:0 "Withhold Consent"
 nesnd_india_matter_accept_button:0 "Agree"
 nesnd_india_matter_decline_button:0 "Decline"
 nesnd_india_matter_answered_header:0 "#title Give an Answer#!\n"
 nesnd_india_matter_answered_effect_header:0 "#title Once Answered:#!\n$EFFECT$"
 nesnd_india_matter_answered_conclusion:0 "We have given our answer."
 nesnd_india_matter_answered_tt:0 "We have answered the matter"
 nesnd_india_matter_closed_tt:0 "The matter is no longer listed here."
 nesnd_india_matter_timeout_conclusion:0 "No answer was given within thirty days."
 nesnd_india_matter_timeout_tt:0 "We are taken to have given no answer, and their request lapses."
 nesnd_india_matter_void_conclusion:0 "Their request was withdrawn or no longer stands."
 nesnd_india_matter_consent_desc:0 "Answer the matter as [concept_overlord]."
 nesnd_india_matter_unanswered_tt:0 "We have not yet answered the matter"
 nesnd_india_matter_permit_tt:0 "We give our consent. The request then goes to the other government, which decides for itself."
 nesnd_india_matter_forbid_tt:0 "We withhold our consent. The request ends here."
 nesnd_india_matter_answer_desc:0 "Answer the terms put to us."
 nesnd_india_matter_fund_survey_tt:0 "We send engineers to make the survey and train local craftsmen for #v 24#! months."
 nesnd_india_matter_fund_grant_tt:0 "We pay the grant towards the foundation and take no ownership."
 nesnd_india_matter_fund_stake_tt:0 "One level is built at once and belongs to our government."
 nesnd_india_matter_fund_terms_tt:0 "They owe us an [concept_obligation], and [concept_relations] between us improve by #g 25#!."
 nesnd_india_matter_decline_tt:0 "We decline. The request ends here."
 nesnd_mug_status_answer_7:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName], our [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetSubjectType.GetName], offers our government one level of property in its country for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]."
 nesnd_mug_status_answer_8:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName], our [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetSubjectType.GetName], asks to buy back one level of the property we hold in its country for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]."
 nesnd_india_matter_forbid_rift_tt:0 "We withhold our consent and the request ends here. The requesting country gains a negative [concept_diplomatic_catalyst] towards us, and [concept_relations] between us fall by #r 15#!."
 nesnd_india_matter_decline_rift_tt:0 "We decline and the request ends here. The requesting country gains a negative [concept_diplomatic_catalyst] towards us, and [concept_relations] between us fall by #r 15#!."
