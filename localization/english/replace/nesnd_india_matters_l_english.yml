l_english:
 nesnd_india_foreign_affairs:0 "Indian Affairs"
 nesnd_india_foreign_affairs_reason:0 "The governments of $region_north_india$ and $region_south_india$, and Bhutan and Nepal, often put matters to other governments for an answer. They ask for money to build [GetBuildingType('building_university').GetName], [GetBuildingType('building_tooling_workshop').GetName] or [GetBuildingType('building_railway').GetName], for which the government that pays may take ownership. They negotiate a [concept_treaty] for a [concept_trade_privilege], [concept_military_access] or a [concept_treaty_port]. Hindustan asks its overlord for a loan or to redeem its subject status, and a stricken country asks Hindustan or its overlord for famine relief. A subject needs the consent of its [concept_overlord] before another government may take ownership in it or march through it, or before it leaves its overlord to join Hindustan (or India, Dravida Nadu or a like empire). A [concept_puppet] needs that consent for any matter at all. One such matter now awaits the answer of [ROOT.GetCountry.GetName]."
 nesnd_india_matter_status_consent_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent to engage engineers from [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for a survey and the training of craftsmen, for which [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]."
 nesnd_india_matter_status_consent_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent: the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] towards the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName], taking no ownership."
 nesnd_india_matter_status_consent_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent: the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] for the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName] and own it. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] is our subject, and the matter needs our consent."
 nesnd_india_matter_status_fund_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] offers @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] to engage our engineers for a survey and the training of local craftsmen."
 nesnd_india_matter_status_fund_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] towards the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. We would take no ownership."
 nesnd_india_matter_status_fund_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] to build the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. One level would be built at once and belong to our government."
 nesnd_india_frontier_status_consent_2_1:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for a [concept_trade_privilege]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_consent_2_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for a [concept_trade_privilege]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_consent_3_1:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for [concept_military_access], so that the armies of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] may march through [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_consent_3_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for [concept_military_access], so that the armies of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] may march through [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_consent_4_1:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the [concept_trade_privilege] treaty between them for five more years, with no further payment. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_consent_4_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the [concept_trade_privilege] treaty between them for five more years, with no further payment. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_consent_5_1:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the treaty by which [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] grants [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] [concept_military_access], for five more years and with no further payment. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_consent_5_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the treaty by which [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] grants [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] [concept_military_access], for five more years and with no further payment. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our subject, and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_frontier_status_answer_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us for a [concept_trade_privilege]. We would pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. The decision is ours alone."
 nesnd_india_frontier_status_answer_3:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us for [concept_military_access], so that its armies may march through our land. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of five years. The decision is ours alone."
 nesnd_india_frontier_status_answer_4:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the [concept_trade_privilege] treaty between us, so that it keeps the privilege from us for five more years, with no further payment. The decision is ours alone."
 nesnd_india_frontier_status_answer_5:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the treaty by which it grants us [concept_military_access], for five more years and with no further payment. The decision is ours alone."
 nesnd_india_union_status_consent_ask_dominion:0 "Our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to become a [concept_dominion] of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which would take it away from us. Only after our consent does the request reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may agree or decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] agrees, it pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] in compensation."
 nesnd_india_union_status_consent_ask_merge:0 "Our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to be merged into [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which would take it away from us. Only after our consent does the request reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may agree or decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] agrees, it pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] in compensation."
 nesnd_india_union_status_consent_invite:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] invites our [concept_subject] [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to join it, offering [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] a settlement allowance of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] accepts, it leaves us, merging into [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] or becoming its [concept_dominion]. Only after our consent does the invitation reach [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], which may still decline. If [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] accepts, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] in compensation."
 nesnd_mug_status_answer_7:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName], our [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetSubjectType.GetName], asks us for a loan of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]. If we agree we pay it at once, and it repays @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_weekly')|0] each week under a repayment [concept_treaty], about @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years. If it falls into [concept_default] or declares [concept_bankruptcy] while repaying, it is in breach: it leaves the repayment treaty, the unpaid remainder is not pursued, and it grants us a [concept_trade_privilege] for ten years instead."
 nesnd_mug_status_answer_8:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName], our [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetSubjectType.GetName], asks to redeem its subject status for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]. If we agree we take the money and it becomes independent at once. The #v [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.ScriptValue('nesnd_mug_overlord_levels')|0]#! building levels we own there are not affected, and any loan it has not yet repaid is still repaid."
 nesnd_mug_status_answer_9:0 "#v [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! states of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] are struck by a [concept_harvest_condition] and their farms yield less. It asks us for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] for relief. If we agree, those states suffer less from [concept_harvest_condition] for twelve months and our [concept_relations] improve by #g +25#!. The money is not repaid."
 nesnd_mug_status_consent_9_1:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName], our [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetSubjectType.GetName], has states struck by a [concept_harvest_condition] and asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] for relief. The request needs our consent before it goes to the other government."
 nesnd_mug_status_consent_9_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] has states struck by a [concept_harvest_condition] and asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], one of our [Concept('concept_subject', '$concept_subjects|q$')], for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] for relief. Our subject needs our consent to pay it."
 nesnd_india_overseas_status_consent_10:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_status_consent_11:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to cede one of its states with a $building_port$ as a [concept_treaty_port]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_status_consent_12:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the treaty granting it [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] for ten more years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_status_consent_13:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the treaty ceding it a [concept_treaty_port] for ten more years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_status_answer_10:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of ten years. The decision is ours alone."
 nesnd_india_overseas_status_answer_11:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us to cede one of our states with a $building_port$ to it as a [concept_treaty_port]: the most populous of those we could cede in that direction. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of ten years. The decision is ours alone."
 nesnd_india_overseas_status_answer_12:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the treaty by which we grant it [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]: the term would be extended by ten years with no further payment."
 nesnd_india_overseas_status_answer_13:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the treaty by which we ceded it a [concept_treaty_port]: the term would be extended by ten years with no further payment."
