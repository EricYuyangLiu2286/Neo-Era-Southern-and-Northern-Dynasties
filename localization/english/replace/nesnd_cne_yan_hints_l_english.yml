l_english:
 nesnd_cne_yan.1.t:0 "A Birthday Banquet in $STATE_SHENGJING$"
 nesnd_cne_yan.1.d:0 "The governor's office of $STATE_SHENGJING$ has forwarded a routine report. In the provincial capital, several hereditary military families ennobled by the former Yan court held three days of banquets for the birthday of an elderly lady. Before the banquets, the hosts sent their guest list to the governor's office. Neither the provincial administrator nor the garrison commander was invited, however. Puzzled, the office went through the list and checked each guest's record. Every record was clear. All were Yan soldiers who had submitted to us during [Glossary('glossary_nesnd_zhang_baili_expedition','Zhang Baili’s expedition')], and all came from military families still serving under the present dynasty.\n\nSeveral guests on the list came from the military colonies of $STATE_SONGJIANG$ and $STATE_NORTHERN_MANCHURIA$ and are no kin of these households. According to the constables ordered to watch over the occasion, the music played at table was old court songs of the former dynasty. The old lady sat on the north side facing south, with several long tables set out before her. The guests sat facing one another and raised their cups towards her to wish her long life.\n\nThe governor's office finds that the banquet broke no regulation and has filed the report for the record."
 nesnd_cne_yan.1.f:0 "“The guest list has been duly submitted. Old music was played, but no breach of regulation was observed. Respectfully filed for the record.” — Report of the $STATE_SHENGJING$ governor's office"
 nesnd_cne_yan.1.a:0 "Let the old nobility have their family feasts."
 nesnd_cne_yan.2.t:0 "The $STATE_SONGJIANG$ Accounts"
 nesnd_cne_yan.2.d:0 "Checking last year's accounts for the northeastern provinces, the Ministry of Revenue found several discrepancies in $STATE_SONGJIANG$. Several state granaries reported losses to rats many times higher than in past years. A batch of timber permits issued by the authorities has no counterfoils. A quantity of Dongzhou silver dollars of unusually fine quality has also appeared in the local market, and the money shops cannot say how it came in.\n\nOnce the ministry's junior officials had worked out the errors, they asked the $STATE_SONGJIANG$ authorities for an explanation. The reply, however, told a different story. Dongzhou merchants who came to fell and haul timber had hired hands from the state forest farms and bought grain from them. The silver was their payment for the labour, and the grain was old stock released at the regulated price under the granary rules, not sold privately. Only because the northeastern forests are so vast, and the clerks of such poor quality, had nobody thought to check the figures again.\n\nThe reply came with a convincing bundle of correspondence, receipts and rubbings taken from the forest farm ledgers. At the end were sworn statements from several granary officials, neatly written and in complete agreement."
 nesnd_cne_yan.2.f:0 "“The grain shortfall has been found to be loss to rats. The silver dollars were brought in by passing merchants. The forest districts are remote and hard to inspect.” — Reply of the $STATE_SONGJIANG$ governor's office to the Ministry of Revenue"
 nesnd_cne_yan.2.a:0 "Frontier accounts have always been like this."
 nesnd_cne_yan.3.t:0 "Missing from the Armoury Register"
 nesnd_cne_yan.3.d:0 "A routine inventory of arms by the garrison in $STATE_NORTHERN_MANCHURIA$ found a quantity of muskets and powder missing against the register. The storekeeper in charge reports that the muskets had rusted through with damp and were burned behind the barracks. Yet no one in the garrison saw the ironwork that such a burning would have left.\n\nAn inspector sent by the Ministry of War found muskets of the same pattern in several Jurchen stockades along the river, with the numbers scraped off the stocks. The people of the stockades said they had bought them from passing merchants in exchange for furs. When the inspector asked where the merchants had gone, they said only that they had headed for the coast."
 nesnd_cne_yan.3.f:0 "“A number of muskets in store rusted through with damp and have been burned behind the barracks.” — Note in the armoury register of the $STATE_NORTHERN_MANCHURIA$ garrison"
 nesnd_cne_yan.3.a:0 "A few more hunting guns among the Jurchens are nothing remarkable."
 nesnd_cne_yan.4.t:0 "A Night's Roll Call"
 nesnd_cne_yan.4.d:0 "The commander of the $STATE_SONGJIANG$ patrol battalion reports that at one night's roll call nearly half of the battalion's Liaodong-born soldiers were missing. They drifted back before dawn with pine resin on their clothes, and when questioned, every one of them said he had been at a wedding in a neighbouring village.\n\nThe commander had them caned according to battalion rules, and the matter might have ended there. When he later made enquiries in the nearby villages, however, he found that no family had held a wedding that night. On the same night, soldiers at several posts in $STATE_AMUR$ and $STATE_BOLI$ had also asked for leave."
 nesnd_cne_yan.4.f:0 "“At one night's roll call nearly half the Liaodong-born soldiers were absent. They returned one by one the next morning, claiming to have attended a wedding in a neighbouring village, and have each been caned.” — Report of the $STATE_SONGJIANG$ patrol battalion commander"
 nesnd_cne_yan.4.a:0 "Soldiers will drink. The cane will see to it."
 nesnd_cne_yan.5.t:0 "Blue Cloth in the Forest"
 nesnd_cne_yan.5.d:0 "A boundary commissioner sent to the northeast by the Ministry of War has returned from the forests where $STATE_SONGJIANG$ meets $STATE_NORTHERN_MANCHURIA$, and has appended a page of observations to his report. In several valleys there are large, freshly cleared patches, with orderly footprints and cart tracks on the ground. It is impossible to tell whether they were left by a merchant caravan, by local bandits or by the patrol battalions, though there is little to choose between the last two. Outside the gates of several nearby stockades hung lengths of blue cloth that seemed to bear something embroidered in white thread. The settler guards at the gates took them down as soon as strangers appeared.\n\nOn the way back, the guide said that the old people in the stockades all expect the swallows, the yanzi bird, to come north early this year. He asked the commissioner whether that was a good omen."
 nesnd_cne_yan.5.f:0 "“Several freshly cleared patches in the forest. Blue cloth embroidered in white hangs at the stockade gates and is taken down when strangers approach.” — Observations appended to the boundary commissioner's report"
 nesnd_cne_yan.5.a:0 "The swallows return every spring."
