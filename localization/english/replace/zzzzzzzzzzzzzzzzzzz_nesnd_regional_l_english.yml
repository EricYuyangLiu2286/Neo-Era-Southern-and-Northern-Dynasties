 nesnd_regional.1.t:0 "An Argument at the Station"
 nesnd_regional.1.d:0 "Trains from Silesia bring coal and iron to Berlin, along with new petitions. Railway companies seek support for freight services, while manufacturers want to expand the production of machinery and tools. The officers favour more transport capacity, though they have drawn up their own calculations for its use. The government must decide where further support will go."
 nesnd_regional.1.a:0 "Let the railways carry more."
 nesnd_regional.1.b:0 "Our workshops need their own machinery."
 nesnd_regional.2.t:0 "Voices from the Provinces"
 nesnd_regional.2.d:0 "Provincial schools are training a new generation of teachers and officials. Some want them to serve their own communities; others would bring them into Vienna's administration. Both claim to be strengthening the country. Their disagreement concerns where education and authority should take root."
 nesnd_regional.2.a:0 "Support education in the provinces."
 nesnd_regional.2.b:0 "Strengthen the central administration."
 nesnd_regional.3.t:0 "Ledgers from the Coast"
 nesnd_regional.3.d:0 "Shipping records and tax accounts are beginning to show the results of recent investment. Merchants ask that support remain with the ports, while treasury officials see an opportunity to strengthen administration. The government cannot rely indefinitely on extraordinary levies. Further investment calls for a choice."
 nesnd_regional.3.a:0 "Support the ports and their commerce."
 nesnd_regional.3.b:0 "Put administration on a lasting footing."
 nesnd_regional.4.t:0 "More than Cotton"
 nesnd_regional.4.d:0 "Egyptian workshops can now turn more of the country's cotton into cloth. Manufacturers seek help to expand. Teachers warn the government that an industry cannot prosper for long if literacy and technical knowledge remain the preserve of a few. The first gains of prosperity have brought another decision."
 nesnd_regional.4.a:0 "Help the textile workshops expand."
 nesnd_regional.4.b:0 "Schools must keep pace with industry."
 nesnd_regional.5.t:0 "The Capital and the States"
 nesnd_regional.5.d:0 "Schools, ports and workshops have given the government achievements more substantial than declarations. Provincial representatives want continued support for local works; the government in the capital wants to consolidate its authority. New construction can spread without necessarily bringing political credit to those who sponsored it."
 nesnd_regional.5.a:0 "Continue the local works."
 nesnd_regional.5.b:0 "Make this a foundation for public confidence."
 nesnd_regional.6.t:0 "A School and a Railway"
 nesnd_regional.6.d:0 "Schools and transport in the South are beginning to show new life. Freed people seek wider access to education, while business interests press for continued railway support. Emancipation was a beginning. Further investment will shape the place of the newly free in the economy that follows."
 nesnd_regional.6.a:0 "Widen access to education."
 nesnd_regional.6.b:0 "Support the South's railways."
 nesnd_regional.7.t:0 "From the Mines to Lima"
 nesnd_regional.7.d:0 "Railways have linked some mining districts to the coast, and Lima's merchants are discussing larger investments. Mine owners want to expand production. Engineers fear that a shortage of skilled people will leave new machinery idle. The government can support further output or invest in the knowledge needed to sustain it."
 nesnd_regional.7.a:0 "Help the mines increase production."
 nesnd_regional.7.b:0 "Train people to master these techniques."
 nesnd_regional.unavailable:0 "Circumstances no longer permit this arrangement."
 nesnd_regional.8.t:0 "Unfinished Works"
 nesnd_regional.8.d:0 "The promised programme of improvements has not been completed. Schools, industry and transport remain pressing concerns, but the expectations surrounding this undertaking have faded. What has been built will remain in use. What was promised will not be so easily forgotten."
 nesnd_regional.8.a:0 "The work before us remains."
