l_english:
 # 任务65 第④批：经济线「大食的矿冶」
 nesnd_per_mines_1_journal:0 "Mines of the Tazi: Ore and Timber"
 nesnd_per_mines_1_journal_reason:0 "Iron lies in the hills of Isfahan and Kerman, sulfur and lead in the western passes, and the forests of Mazandaran run past the horizon. Our forebears opened a few mines; most have long since caved in.\n\nReopen them, and the Iranian plateau will have the means to cast cannon and forge iron."
 nesnd_per_mines_2_journal:0 "Mines of the Tazi: Coal and Steel"
 nesnd_per_mines_2_journal_reason:0 "The ore is out of the mountains, but there is no coal to smelt it, no furnace to melt it, and no railway to bring the two together. If a spine of steel could join Isfahan to Kerman, the Tazi would no longer have to beg foreigners for rails and gun barrels."
 nesnd_per_mines_3_journal:0 "Mines of the Tazi: Oil and Motors"
 nesnd_per_mines_3_journal_reason:0 "Black oil has seeped from the sands of Khuzestan and Fars since antiquity, and the ancients used it only for lamps and caulking boats. Now the new Western machines crave it above all else, and whoever holds the wells holds the next century by the throat."
 nesnd_per_mines_status_tang:0 "The mines and workshops lie wholly in Tang hands."
 nesnd_per_mines_status_persian:0 "The bazaar merchants have taken their seat among the mines and workshops."
 nesnd_per_mines_status_none:0 ""
 nesnd_per_mines_1_goal_tt:0 "#v 20#! levels of mining buildings and #v 15#! levels of logging camps"
 nesnd_per_mines_2_goal_tt:0 "#v 20#! levels of coal mines, #v 30#! of iron mines, #v 10#! of steel mills and #v 20#! of railways"
 nesnd_per_mines_3_goal_tt:0 "#v 30#! levels of oil rigs and #v 10#! of automotive industry"
 nesnd_per_mines_1_reward_tt:0 "'$nesnd_per_mines_boom$' for #v 10#! years, halved if '$nesnd_per_tension_journal$' is at least #v 70#!. The next stage opens once steelworking and railways are researched."
 nesnd_per_mines_2_reward_tt:0 "'$nesnd_per_steel_belt$' for #v 10#! years, halved if '$nesnd_per_tension_journal$' is at least #v 70#!. The next stage opens once pumpjacks and the combustion engine are researched."
 nesnd_per_mines_3_reward_tt:0 "'$nesnd_per_gulf_oil$' for #v 10#! years, halved if '$nesnd_per_tension_journal$' is at least #v 70#!."
 nesnd_per_mines_timeout_tt:0 "No reward for this stage; the next stage opens as usual."
 nesnd_per_mines_1_conclusion:0 "Lamps burn again in long-silent shafts, and axes ring once more through the forests of Mazandaran."
 nesnd_per_mines_2_conclusion:0 "The furnaces of Isfahan burn day and night, and the rails reach on, stage by stage, towards Kerman."
 nesnd_per_mines_3_conclusion:0 "Derricks crowd the shores of the Gulf, and the first motor car rolls out through the factory gates."
 nesnd_per_mines_timeout_conclusion:0 "Twenty years have slipped by, and this stage of the road was never finished."
 nesnd_per_concession_tang_button:0 "Tang Monopoly"
 nesnd_per_concession_tang_button_desc:0 "Profit stays at home, power stays in our hands. The mines and workshops are for the Tang alone."
 nesnd_per_concession_persian_button:0 "Persian Shareholders"
 nesnd_per_concession_persian_button_desc:0 "Better the bazaar's silver earn interest down a mine shaft than breed resentment at the bottom of a chest."
 nesnd_per_concession_open_tt:0 "No concession has been chosen for this stage"
 nesnd_per_concession_tang_tt:0 "For this stage, '$nesnd_per_concession_tang$' (construction +10%); '$nesnd_per_tension_journal$' #r +0.05#! per month."
 nesnd_per_concession_persian_tt:0 "For this stage, '$nesnd_per_tension_journal$' #g -0.05#! per month; the Martial Clans are displeased."
 nesnd_per_concession_tang:0 "Tang Monopoly"
 nesnd_per_oil_foreign_button:0 "Grant to Foreign Capital"
 nesnd_per_oil_foreign_button_desc:0 "Foreign firms bring the money and the machines. All we need do is collect the rent."
 nesnd_per_oil_self_button:0 "Develop the Fields Ourselves"
 nesnd_per_oil_self_button_desc:0 "Better slow than lost. The wells must stay in our own hands."
 nesnd_per_oil_foreign_tt:0 "Receive #v 10%#! of GDP now; '$nesnd_per_oil_foreign$' for #v 10#! years. Under Tang rule, '$nesnd_per_tension_journal$' #r +0.05#! per month for #v 10#! years."
 nesnd_per_oil_self_tt:0 "'$nesnd_per_oil_self$' for #v 10#! years. Under Tang rule, '$nesnd_per_tension_journal$' #g -0.03#! per month for #v 10#! years."
 nesnd_per_oil_foreign:0 "Foreign Oil Concession"
 nesnd_per_oil_self:0 "National Oil Fields"
 nesnd_per_mines_boom:0 "Mines Revived"
 nesnd_per_mines_boom_half:0 "Mines Revived (Halved)"
 nesnd_per_steel_belt:0 "Isfahan Steel Belt"
 nesnd_per_steel_belt_half:0 "Isfahan Steel Belt (Halved)"
 nesnd_per_gulf_oil:0 "Gulf Oil Fields"
 nesnd_per_gulf_oil_half:0 "Gulf Oil Fields (Halved)"
 nesnd_per_tension_src_ev7:0 "Miners' strike"
 nesnd_per_tension_src_ev8:0 "Sabotage of railways and wells"
 nesnd_per_tension_src_concession:0 "Economic concessions"
 nesnd_per_tension_src_oil:0 "Oil concession"
 nesnd_per_mines.1.t:0 "Strike Below Ground"
 nesnd_per_mines.1.d:0 "The miners of [SCOPE.sState('nesnd_per_mines_state').GetName] have laid down their picks. Persians and Kurds go down the shafts, and Tang keep the ledgers. In a year their wages have not risen by a single coin, yet the tunnels have fallen in twice, and not all the men buried beneath the rock have been dug out. Patrols now shadow the ringleaders day and night, and the air of the pits smells of powder not yet lit."
 nesnd_per_mines.1.f:0 "'Persian bones below ground, Tang ledgers above it.' - scrawled on a wall at the pithead"
 nesnd_per_mines.1.a:0 "A few troublemakers. Arrest them."
 nesnd_per_mines.1.a.tt:0 "#r 10%#! of the state's population becomes radical; '$nesnd_per_tension_journal$' #r +0.04#! per month for #v 36#! months"
 nesnd_per_mines.1.b:0 "Shore up the shafts, and raise the pay."
 nesnd_per_mines.1.b.tt:0 "'$nesnd_per_tension_journal$' #g -0.04#! per month for #v 36#! months"
 nesnd_per_mines.2.t:0 "Fire by Night"
 nesnd_per_mines.2.d:0 "In a single night, a stretch of railway and several derricks in [SCOPE.sState('nesnd_per_mines_state').GetName] went up in flames. Beside the ashes a note was nailed: 'What is Iran's belongs to the Iranians.' The local governor reports that everyone in the nearby villages knows who set the fires, and not one of them will speak."
 nesnd_per_mines.2.f:0 "'They lay their rails to carry our mountains away one wagon at a time.' - on the back of the note"
 nesnd_per_mines.2.a:0 "Search house by house. Someone will talk."
 nesnd_per_mines.2.a.tt:0 "#r 10%#! of the state's population becomes radical; '$nesnd_per_tension_journal$' #r +0.04#! per month for #v 36#! months"
 nesnd_per_mines.2.b:0 "Repair the line, and invite a few local notables to buy in. Let them guard it themselves."
 nesnd_per_mines.2.b.tt:0 "'$nesnd_per_tension_journal$' #g -0.04#! per month for #v 36#! months"
 nesnd_per_mines.3.t:0 "Mines of the Tazi"
 nesnd_per_mines.3.d:0 "From the forests of Mazandaran to the wells of Khuzestan, from the furnaces of Isfahan to the motor works of Tehran, [ROOT.GetCountry.GetAdjective] has spent decades waking the wealth that slept beneath its soil. The foreigners who come from afar now come for more than carpets."
 nesnd_per_mines.3.f:0 "'The carpets were our ancestors' craft. The wells are ours.' - a Tehran engineer"
 nesnd_per_mines.3.a:0 "The plateau's lifeblood has risen to the surface at last."
