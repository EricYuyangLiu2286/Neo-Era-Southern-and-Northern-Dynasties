l_english:
 je_nesnd_polish_exile: "The Polish Pilgrims"
 je_nesnd_polish_exile_reason: "The rule of the partitioning powers remains incompatible with the aspirations of their [GetCulture('polish').GetName] subjects. Defeated uprisings and exclusionary laws drive successive parties towards $nesnd_lobby_name_kra$ or political allies in Paris. The receiving country gains workers and supporters, while the movement for restoration abroad loses part of its population. Resettlement places a further demand upon the host country’s treasury."
 nesnd_polish_exile_speed_row: "Departure laws and border policies"
 nesnd_polish_exile_complete: "This wave of emigration has ended. Further defeats or exclusionary laws may bring new emigrants until resettlement ends in 1900."
 nesnd_polish_exile_complete_tt: "No [GetCulture('polish').GetName] emigrants remain awaiting departure."
 nesnd_polish_exile_timeout: "The special resettlement programme ends in 1900. Those who have not departed remain in their present homes."
 nesnd_polish_exile_totals: "Deadline: 1 January 1900.\nArrived in this wave: [GetGlobalVariable('nesnd_polish_exile_arrived').GetValue|0]. Deaths in transit: [GetGlobalVariable('nesnd_polish_exile_dead').GetValue|0]."
 nesnd_polish_exile_waiting: "No route is currently available. Limited admission requires a receiving state with an understaffed building. Emigration cannot proceed between belligerents.\n$nesnd_polish_exile_totals$"
 ce_polish_exile_open_btn: "Open the Borders"
 ce_polish_exile_open_btn_desc: "New parties travel to our states. Each arrival costs three weeks of fixed income. Losses range from 0–5%, rising to 5–10% when the country of departure closes its border."
 ce_polish_exile_limited_btn: "Limit Admission"
 ce_polish_exile_limited_btn_desc: "Receiving states must have an understaffed building. Departure proceeds at half speed, and each arrival costs three weeks of fixed income. Existing routes to our states also require vacancies."
 ce_polish_exile_paris_btn: "Send Emigrants to Paris"
 ce_polish_exile_paris_btn_desc: "New parties travel to [GetStateRegion('STATE_ILE_DE_FRANCE').GetName] under $nesnd_lobby_name_fra$, without a resettlement payment from us. Each arrival adds 1 to French Will, up to a total of 10, and moves Reds and Whites 2 points towards the Reds."
 ce_polish_exile_release_btn: "Permit Departure"
 ce_polish_exile_release_btn_desc: "Restore normal departure speed. Each departing party reduces radicals among our [GetCulture('polish').GetName] population by 1%."
 ce_polish_exile_blockade_btn: "Close the Border"
 ce_polish_exile_blockade_btn_desc: "Reduce departure speed to one quarter and increase losses by 5 percentage points. Each departing party increases radicals among our [GetCulture('polish').GetName] population by 1%."
 nesnd_polish_exile_bar_1: "The Exiles’ Journey"
 nesnd_polish_exile_bar_1_desc: "The Exiles’ Journey: [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/100"
 nesnd_polish_exile_route_1: "[GetCulture('polish').GetName] emigrants from [GetGlobalVariable('nesnd_polish_exile_source_1').GetCountry.GetName] are travelling from [GetGlobalVariable('nesnd_polish_exile_from_1').GetState.GetName] to [GetGlobalVariable('nesnd_polish_exile_to_1').GetState.GetName]. Still awaiting departure from that country: [GetGlobalVariable('nesnd_polish_exile_source_1').GetCountry.MakeScope.Var('nesnd_polish_exile_due').GetValue|0]."
 nesnd_polish_exile_status_1: "$nesnd_polish_exile_route_1$\n$nesnd_polish_exile_totals$"
 nesnd_polish_exile_not_open_tt:0 "Our borders are not currently open to all Polish exiles"
 nesnd_polish_exile_not_limited_tt:0 "Limited admission is not currently in force"
 nesnd_polish_exile_not_paris_tt:0 "New groups of Polish exiles are not currently being sent to Paris"
