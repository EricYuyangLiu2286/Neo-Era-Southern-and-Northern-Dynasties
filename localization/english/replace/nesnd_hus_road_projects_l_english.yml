l_english:
 nesnd_hus_road_parent_choose:0 "Choose a charter, a public tender or a locally financed transport project to see its site and construction requirements."
 nesnd_hus_road_parent_active:0 "The chosen project has its own [concept_journal_entry] with the construction requirements and consecutive months met. After the funding term ends, the government can change the plan or select a new site."
 nesnd_hus_road_reselect:0 "Change the Plan or Project Site"
 nesnd_hus_road_reselect_desc:0 "The appropriation runs for twelve months. When it expires, the government can end the present contract and offer a new contract."
 nesnd_hus_road_reselect_tt:0 "End the current project and clear its operating streak. Payments already made are retained. A new contract is priced when selected."
 nesnd_hus_road_missing_site:0 "The original site or its starting capacity can no longer be verified. A new site can be chosen when the funding term ends."
 nesnd_hus_road_site_tt:0 "The project state is inhabited and under our control."
 nesnd_hus_road_peace_tt:0 "We are not fighting a war in the project’s strategic region."
 nesnd_hus_road_credit_tt:0 "We are not in default."
 nesnd_hus_road_access_tt:0 "The project state has at least #v 80%#! [concept_market_access]."
 nesnd_hus_road_link_tt:0 "The state has a port or railway of at least #v 1 level#! with at least #v 50%#! employment."
 nesnd_hus_road_charter_capacity_tt:0 "Tooling workshops, iron mines and logging camps with at least #v 75%#! employment and a positive weekly profit contribute enough levels to meet the contract target."
 nesnd_hus_road_tender_capacity_tt:0 "The project state has a railway of at least #v 1 level#! with at least #v 50%#! employment."
 nesnd_hus_road_local_capacity_tt:0 "The project state has a port or railway of at least #v 1 level#! with at least #v 50%#! employment."
 nesnd_hus_road_charter_project:0 "Chartered Works and Freight"
 nesnd_hus_road_charter_project_chosen_tt:0 "A chartered contract is in force."
 nesnd_hus_road_charter_project_reason:0 "The Dongqing merchants need timber and iron to reach the docks. Contractors must put their workshops to work, find buyers and keep freight moving. The target adds 20% to the starting level, rounded up, with a minimum increase of two levels and a maximum of eight."
 nesnd_hus_road_charter_project_bar:0 "Industrial operating streak"
 nesnd_hus_road_charter_project_bar_desc:0 "$nesnd_hus_road_charter_project_bar$  #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#! months"
 nesnd_hus_road_charter_project_status:0 "Contractor: [ROOT.GetCountry.GetCustom('nesnd_hus_road_signatory')]\n[ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_target').GetState.GetName]   Industry levels: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_levels')|0]#!   Starting level: #v [ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_baseline').GetValue|0]#!   Target: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_goal')|0]#!   Qualifying levels: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_operating_levels')|0]#!\n[concept_market_access]: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_market_access')|0%]#!   Consecutive months met: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_months')|0] / 3#!."
 nesnd_hus_road_charter_project_conclusion: "The works undertaken by [ROOT.GetCountry.GetCustom('nesnd_hus_road_signatory')] are complete. The industries and freight links met their terms for three consecutive months.[ROOT.GetCountry.GetCustom('nesnd_hus_road_site_receipt')]"
 nesnd_hus_road_tender_project:0 "Railways by Public Tender"
 nesnd_hus_road_tender_project_chosen_tt:0 "A public railway tender is in force."
 nesnd_hus_road_tender_project_reason:0 "Bidders have promised the inland towns a regular train service. The government will inspect staffing and operation. An existing railway may take on the contract."
 nesnd_hus_road_tender_project_bar:0 "Railway operating streak"
 nesnd_hus_road_tender_project_bar_desc:0 "$nesnd_hus_road_tender_project_bar$  #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#! months"
 nesnd_hus_road_tender_project_status:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_target').GetState.GetName]   Railway levels: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_levels')|0]#!   Levels at 50% employment or above: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_staffed_rail_levels')|0] / 1#!\n[concept_market_access]: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_market_access')|0%]#!   Consecutive months met: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_months')|0] / 3#!."
 nesnd_hus_road_tender_project_conclusion:0 "The publicly tendered railway met the contract terms for three consecutive months."
 nesnd_hus_road_local_project:0 "Locally Financed Ports and Railways"
 nesnd_hus_road_local_project_chosen_tt:0 "A locally financed transport contract is in force."
 nesnd_hus_road_local_project_reason:0 "Coastal merchants want working docks, while inland towns want a reliable train service. Either can carry local freight if enough people are employed and the route reaches the market."
 nesnd_hus_road_local_project_bar:0 "Transport operating streak"
 nesnd_hus_road_local_project_bar_desc:0 "$nesnd_hus_road_local_project_bar$  #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#! months"
 nesnd_hus_road_local_project_status:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_target').GetState.GetName]   Port and railway levels: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_levels')|0]#!   Levels at 50% employment or above: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_staffed_link_levels')|0] / 1#!\n[concept_market_access]: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_market_access')|0%]#!   Consecutive months met: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_months')|0] / 3#!."
 nesnd_hus_road_local_project_conclusion:0 "The locally financed transport works met the contract terms for three consecutive months."
 nesnd_hus_road_executive: "[ROOT.GetCountry.MakeScope.Var('nesnd_road_contractor').GetCompany.GetName] (executive: [ROOT.GetCountry.MakeScope.Var('nesnd_road_contractor').GetCompany.GetExecutive.GetFullName])"
 nesnd_hus_road_company: "[ROOT.GetCountry.MakeScope.Var('nesnd_road_contractor').GetCompany.GetName]"
 nesnd_hus_road_merchants: "Domestic contractors"
 nesnd_hus_road_site_named: " Site: [ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_target').GetState.GetName]."
 nesnd_hus_road_site_unspecified: ""
