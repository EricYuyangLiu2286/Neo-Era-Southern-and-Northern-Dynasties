l_english:
 nesnd_sha_conspiracy:0 "The Monarchist Conspiracy"
 nesnd_sha_conspiracy_reason:0 "The national republicans defeated the King of Qi's followers in Kamchatka, but they could not convince every family that crossed the sea with the king that their descendants' future should be decided by ballots. The republic in the far north was founded by the sword, and the old houses remember that too. Now that [JournalEntry.GetCountry.GetName] holds Shandong, the assembly must tax the landlords there, levy grain from the countryside and have the army enforce its orders. Those who want a monarch restored finally have something to bargain with.\n\nThe republic reclaimed Shandong on the strength of Qi's old borders. The old houses of Qi demand their former rank on the strength of the same history."
 nesnd_sha_plot_bar:0 "The Conspiracy"
 nesnd_sha_plot_bar_desc:0 "Conspiracy #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_sha_plot_royal_status:0 "The constitutional royalists would place a sovereign above the republic. As the conspiracy grows, they and the reactionaries gain support more readily in the states."
 nesnd_sha_plot_corporate_status:0 "The corporatists want the state organised by occupation, with seats assigned to representatives of the trades. As the conspiracy grows, they and the reactionaries gain support more readily in the states."
 nesnd_sha_plot_quiet_status:0 "Conspiracy progress has fallen to zero. The inquiry can close after twelve consecutive months at zero."
