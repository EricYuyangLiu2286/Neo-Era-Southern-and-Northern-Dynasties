 nesnd_sha_plot_royal_ledgers:0 "Accounts of the Royalist Patrons"
 nesnd_sha_plot_corporate_ledgers:0 "Accounts of the Corporatist Patrons"
 nesnd_sha_plot_investigate:0 "Investigate the Restoration Party"
 nesnd_sha_plot_investigate_desc:0 "Authorise officials to trace the party’s funds and contacts. The inquiry ties up [concept_authority] for a year. A further two years must pass before it can be renewed. A wide search will also turn more people against the government."
 nesnd_sha_plot_publish:0 "Publish the Old Families’ Accounts"
 nesnd_sha_plot_publish_desc:0 "Fund the examination and publication of the old families’ accounts so people in each state can see who is paying for a change of regime. Publication carries weight for two years. Four more must pass before it can be repeated."
 nesnd_sha_plot_inquiry:0 "Inquiry into the Restoration Party"
 nesnd_sha_plot_stable:0 "The Republic Endures"
 nesnd_sha_plot_new_order:0 "The New Order After the Coup"
 nesnd_sha_plot_coup_tt:0 "Conspiracy progress has reached #v 100#! and [Concept('concept_radical','$concept_radicals$')] make up at least #v 20%#! of the population."
 nesnd_sha_plot_quiet_tt:0 "Conspiracy progress has remained at zero for #v 12#! consecutive months."
 nesnd_sha_plot_institutions_tt:0 "The landowners, rural folk and armed forces are all marginalised, schools are at least level three, and at least two of Egalitarianism, Human Rights and Political Agitation have been researched."
 nesnd_sha_plot_deadline:0 "Twenty-Five-Year Term"
 nesnd_sha_plot_on_deadline:0 "When the Term Expires"
 nesnd_sha_plot.1.t:0 "The Republic Endures"
 nesnd_sha_plot.1.d:0 "The monarchist and corporatist organisations have collapsed one after another. The landowners, the rural folk and the army have lost their hold on the assembly, and a generation raised in the schools recognises only the laws of the republic. Sons of the old houses of Qi who want office must compete for votes like everyone else."
 nesnd_sha_plot.1.f:0 "“All who seek public office, whatever their birth, shall be chosen by election.”\n- Article of the republic's electoral law"
 nesnd_sha_plot.1.a:0 "Let the people elect the next assembly."
 nesnd_sha_plot.2.t:0 "The Last Page of the Republican Calendar"
 nesnd_sha_plot.2.d:0 "The army has gone over to the monarchists. Soldiers sealed off the assembly hall and arrested republican deputies and newspaper editors from a list; those who resisted were shot on the spot. From the next day, orders moving troops have been issued in the monarch's name, and the surviving deputies have been summoned back to swear allegiance to the new sovereign. The rank the old houses spent years pursuing is now written into law."
 nesnd_sha_plot.2.f:0 "“No one on the list is to get away.”— The officer guarding the assembly hall"
 nesnd_sha_plot.2.a:0 "Issue the orders of government in the sovereign’s name."
 nesnd_sha_plot.3.t:0 "The Trades Take Their Seats"
 nesnd_sha_plot.3.d:0 "The corporatists did not invoke the King of Qi. Representatives chosen by the trades entered the assembly hall under military escort and took over the government the people had elected. Deputies who refused to give up their seats were taken away, and the leaders of protests in the docks and workshops were arrested. From now on the city employers speak in the name of their trades, and the great landowners of the countryside claim to speak for the tenants who work their land."
 nesnd_sha_plot.3.f:0 "“The guild voted for me and my employer chose my representative. All that's left to me is to turn up for work.”— A dockworker"
 nesnd_sha_plot.3.a:0 "Constitute the new government through the corporations."
