l_english:
 nesnd_regional_native_restoration:0 "Indigenous Communities and Local Government"
 nesnd_regional_native_restoration_reason:0 "Indigenous communities seek control over their land and a voice for local representatives. The central government insists on its authority over the provinces. Whether local councils can offer a compromise, or the dispute leads to independence and war, will shape the region’s future."
 nesnd_regional_native_war:0 "The Struggle for Local Rule"
 nesnd_regional_native_war_reason:0 "Indigenous communities have established a separate government and now contest the former government’s authority. Land, military allegiance and the political standing of local communities are at stake. Annexing the opposing country would end their divided rule."
 nesnd_regional_native_war_status:0 "The Indigenous polity and the former government remain divided over who should rule."
 nesnd_regional_native_request_status:0 "A political agreement awaits a reply within #v 90 days#!. Armed preparations cannot lead to an uprising while the request remains open."
 nesnd_regional_native_mobilizing_status:0 "Local armed groups are gathering for #v 12 months#! of preparations."
 nesnd_regional_native_paused_status:0 "The twelve months of preparations are complete, but Resistance Pressure is below #v 75#!. The uprising remains on hold."
 nesnd_regional_native_ready_status:0 "Preparations are complete. The original territory must still be able to form a country, Resistance Pressure must reach #v 75#!, and there must be no other civil war or unanswered agreement request."
 nesnd_regional_native_political_status:0 "Local communities continue to seek political rights, although no territory can currently form an independent country."
 nesnd_regional_native_pressure_status:0 "Indigenous communities are seeking land and local political power. At #v 100#! Resistance Pressure, local groups begin #v 12 months#! of preparations if a viable territory is available."
 nesnd_regional_native_pressure_bar:0 "Resistance Pressure"
 nesnd_regional_native_pressure_bar_desc:0 "$nesnd_regional_native_pressure_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_regional_native_pressure_growth:0 "Growth of Local Organizations"
 nesnd_regional_native_release_button:0 "Recognize Local Independence"
 nesnd_regional_native_release_button_desc:0 "Recognize an Indigenous country in the selected territory, allowing local communities to live under their own government."
 nesnd_regional_native_release_effect_tt:0 "Release the selected state as an independent Indigenous country."
 nesnd_regional_native_request_button:0 "Propose a Political Agreement"
 nesnd_regional_native_request_button_desc:0 "Seek an agreement with an existing independent Indigenous country over local councils and land rights."
 nesnd_regional_native_request_effect_tt:0 "The recipient has #v 90 days#! to reply. Only acceptance grants the local council modifier shown below, improves relations by #p 25#!, reduces Resistance Pressure by #p 25#! and halts preparations for an uprising. Another request cannot be sent for #v 12 months#!."
 nesnd_regional_native_negotiate_button:0 "Negotiate Councils and Land Rights"
 nesnd_regional_native_negotiate_button_desc:0 "Bring local representatives into negotiations over councils and land rights to secure cooperation in the countryside."
 nesnd_regional_native_negotiate_effect_tt:0 "Resistance Pressure falls by #p 15#! and any preparations for an uprising are halted."
 nesnd_regional_native_suppress_button:0 "Suppress Local Resistance"
 nesnd_regional_native_suppress_button_desc:0 "Send the army to disperse gatherings and disrupt contact between local leaders."
 nesnd_regional_native_suppress_effect_tt:0 "Resistance Pressure falls by #p 20#!. #n 5%#! of our Indigenous population become [Concept('concept_radical','Radicals')]."
 nesnd_regional_native_release_state_tt:0 "The selected state of [ROOT.GetCountry.MakeScope.Var('nesnd_regional_native_peace_seed').GetState.GetName] is fully owned, has at least #v 100,000#! people and at least #v 35%#! of the prospective country’s Indigenous culture, and contains no more than half our population. At least #v 150,000#! people and another populated state remain in our country."
 nesnd_regional_native_no_release_state_tt:0 "No territory currently meets the conditions for independence."
 nesnd_regional_native_request_free_tt:0 "No political agreement request is awaiting a reply."
 nesnd_regional_native_request_wait_tt:0 "At least #v 12 months#! have passed since the last political agreement request, or none has been sent."
 nesnd_regional_native_partner_tt:0 "An appropriate independent Indigenous country with a centralized government exists and is not at war with us."
 nesnd_regional_native_recognized_tt:0 "Local independence has been recognized, or the struggle for rule has been settled by annexation."
 nesnd_regional_native_war_victory_tt:0 "The Indigenous polity has won and annexed its opponent."
 nesnd_regional_native_war_terminal_tt:0 "The struggle for rule has ended."
 nesnd_regional_native_war_not_victorious_tt:0 "The Indigenous polity has not won."
 nesnd_regional_native_restored_rule:0 "Prestige of the Local Communities"
 nesnd_regional_native.1.t:0 "War Breaks Out"
 nesnd_regional_native.1.d:0 "War has begun between the Indigenous polity and the former government, with each demanding the other’s annexation. Land, armed forces and the political standing of local communities are at stake."
 nesnd_regional_native.1.a:0 "Prepare for the confrontation."
 nesnd_regional_native.2.t:0 "Local Resistance Suppressed"
 nesnd_regional_native.2.d:0 "The army has dispersed gatherings and disrupted contact between local leaders. The Armed Forces support the use of force, but resentment has deepened in the countryside. Disputes over land and local power remain unsettled."
 nesnd_regional_native.2.a:0 "The dispute is not over."
 nesnd_regional_native.3.t:0 "The Question of Rule Settled"
 nesnd_regional_native.3.d:0 "The opposing government’s entire territory has been annexed by [ROOT.GetCountry.GetName]. Divided rule has ended, and local communities must now seek their place under the new government."
 nesnd_regional_native.3.a:0 "Take charge of the new territory."
 nesnd_regional_native.4.t:0 "An Unsettled Local Order"
 nesnd_regional_native.4.d:0 "The dispute has ended without our country annexing its opponent. The government must still address local claims to land and political rights."
 nesnd_regional_native.4.a:0 "Face the situation as it stands."
 nesnd_regional_native.5.t:0 "Communities Organize"
 nesnd_regional_native.5.d:0 "Local leaders are bringing communities and armed groups together to establish a separate government. Preparations will take twelve months. Negotiations can still ease the crisis."
 nesnd_regional_native.5.a:0 "Support is gathering in the countryside."
 nesnd_regional_native.6.t:0 "Refugees Arrive"
 nesnd_regional_native.6.d:0 "People displaced by the defeat of an Indigenous polity have arrived in [ROOT.GetCountry.GetName]. They bring family ties and the need to rebuild their livelihoods."
 nesnd_regional_native.6.a:0 "Let them settle here."
 nesnd_regional_native.7.t:0 "An Agreement on Local Councils"
 nesnd_regional_native.7.d:0 "[SCOPE.sCountry('regional_native_sender').GetName] seeks our support for a political agreement on local councils and land rights. An agreement would improve relations and ease Indigenous resistance within their country."
 nesnd_regional_native.7.a:0 "Accept the agreement."
 nesnd_regional_native.8.t:0 "Local Independence Recognized"
 nesnd_regional_native.8.d:0 "The selected territory has become an independent Indigenous country. Local communities will live under their own government, while our country retains its remaining territory."
 nesnd_regional_native.8.a:0 "Recognize our new neighbour."
 nesnd_regional_native.7.b:0 "Reject the agreement."
 nesnd_regional_native.9.t:0 "The Reply to Our Agreement"
 nesnd_regional_native.9.a:0 "Understood."
 nesnd_regional_native.9.accepted:0 "The agreement has been accepted. Local councils have been recognized, relations have improved, and resistance in the countryside has eased."
 nesnd_regional_native.9.refused:0 "The agreement has been rejected. The two countries have not reached a common position on local councils and land rights."
 nesnd_regional_native.9.expired:0 "No agreement was reached, and the request has lapsed."
 notification_nesnd_regional_native_repression_notice_name:0 "Local Resistance Suppressed"
 notification_nesnd_regional_native_repression_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has used the army against Indigenous organizations, deepening resentment in the countryside."
 notification_nesnd_regional_native_repression_notice_tooltip:0 "#header $notification_nesnd_regional_native_repression_notice_name$#!\n$notification_nesnd_regional_native_repression_notice_desc$"
 notification_nesnd_regional_native_mobilization_notice_name:0 "Indigenous Groups Begin Preparations"
 notification_nesnd_regional_native_mobilization_notice_desc:0 "Local armed groups in [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] have begun twelve months of preparations for an uprising."
 notification_nesnd_regional_native_mobilization_notice_tooltip:0 "#header $notification_nesnd_regional_native_mobilization_notice_name$#!\n$notification_nesnd_regional_native_mobilization_notice_desc$"
 notification_nesnd_regional_native_country_created_notice_name:0 "An Indigenous Polity Emerges"
 notification_nesnd_regional_native_country_created_notice_desc:0 "An Indigenous territory formerly ruled by [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has established its own government."
 notification_nesnd_regional_native_country_created_notice_tooltip:0 "#header $notification_nesnd_regional_native_country_created_notice_name$#!\n$notification_nesnd_regional_native_country_created_notice_desc$"
 notification_nesnd_regional_native_war_started_notice_name:0 "War of Indigenous Restoration Begins"
 notification_nesnd_regional_native_war_started_notice_desc:0 "War has begun between [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] and the Indigenous polity, with each demanding the other’s annexation."
 notification_nesnd_regional_native_war_started_notice_tooltip:0 "#header $notification_nesnd_regional_native_war_started_notice_name$#!\n$notification_nesnd_regional_native_war_started_notice_desc$"
 notification_nesnd_regional_native_dispatch_failed_notice_name:0 "War Fails to Materialize"
 notification_nesnd_regional_native_dispatch_failed_notice_desc:0 "War has not begun between [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] and the Indigenous polity. Their struggle for rule has come to a halt."
 notification_nesnd_regional_native_dispatch_failed_notice_tooltip:0 "#header $notification_nesnd_regional_native_dispatch_failed_notice_name$#!\n$notification_nesnd_regional_native_dispatch_failed_notice_desc$"
 notification_nesnd_regional_native_opponent_lost_notice_name:0 "The Confrontation Ends"
 notification_nesnd_regional_native_opponent_lost_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] can no longer contest rule with its former opponent. The dispute has ended."
 notification_nesnd_regional_native_opponent_lost_notice_tooltip:0 "#header $notification_nesnd_regional_native_opponent_lost_notice_name$#!\n$notification_nesnd_regional_native_opponent_lost_notice_desc$"
 notification_nesnd_regional_native_dispute_ended_notice_name:0 "The Local Dispute Subsides"
 notification_nesnd_regional_native_dispute_ended_notice_desc:0 "The dispute between [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] and the Indigenous polity has ended without either annexing the other."
 notification_nesnd_regional_native_dispute_ended_notice_tooltip:0 "#header $notification_nesnd_regional_native_dispute_ended_notice_name$#!\n$notification_nesnd_regional_native_dispute_ended_notice_desc$"
 notification_nesnd_regional_native_settlement_notice_name:0 "The Struggle for Rule Is Settled"
 notification_nesnd_regional_native_settlement_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has annexed its opponent’s entire territory, settling the struggle for rule."
 notification_nesnd_regional_native_settlement_notice_tooltip:0 "#header $notification_nesnd_regional_native_settlement_notice_name$#!\n$notification_nesnd_regional_native_settlement_notice_desc$"
 notification_nesnd_regional_native_reopened_notice_name:0 "Local Demands Return"
 notification_nesnd_regional_native_reopened_notice_desc:0 "Indigenous communities in [SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] are again pressing claims to local government and land rights."
 notification_nesnd_regional_native_reopened_notice_tooltip:0 "#header $notification_nesnd_regional_native_reopened_notice_name$#!\n$notification_nesnd_regional_native_reopened_notice_desc$"
 notification_nesnd_regional_native_peace_recognized_notice_name:0 "Indigenous Independence Recognized"
 notification_nesnd_regional_native_peace_recognized_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName] has recognized the independence of an Indigenous territory."
 notification_nesnd_regional_native_peace_recognized_notice_tooltip:0 "#header $notification_nesnd_regional_native_peace_recognized_notice_name$#!\n$notification_nesnd_regional_native_peace_recognized_notice_desc$"
 nesnd_regional_native_repression_pressure_tt:0 "Resistance Pressure is at least #v 50#!."
 nesnd_regional_native_accept_effect_tt:0 "Acceptance lowers Resistance Pressure in [SCOPE.sCountry('regional_native_sender').GetName] by #p 25#! and halts any preparations there for an uprising."
