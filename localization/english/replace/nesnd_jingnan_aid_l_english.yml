l_english:
 nesnd_external_intervene:0 "Send troops against Wu"

 nesnd_wu_resolve_bar_name:0 "Army Morale"
 nesnd_wu_resolve_bar_desc:0 "#tooltippable;tooltip:[JournalEntry.GetTooltipTag],nesnd_wu_resolve_bar_rules_tt $nesnd_wu_resolve_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!#!"
 nesnd_wu_resolve_bar_rules_tt:0 "#title Army Morale#!\nChanges only while the Second Jingnan War is being fought, starting at #v 30#!.\nEach month #r -1#! while the current round of the war is under #v 24#! months old, #r -1.5#! once it reaches #v 24#! months.\nForeign countries at war with us: [SCOPE.sCountry('nesnd_label_cne').GetName] counts #v 2#! points, every other country #v 1#!, up to #v 4#! points in all, each worth #g +1#! a month. In the first two months after a foreign country enters the war, each of its points adds a further #g +7.5#! a month. The anti-Wu countries of the south and $nesnd_lobby_name_jap$ do not count as foreign.\nAbove #v 50#!, the closer morale is to #v 100#!, the closer we come to offence #g +15%#!, defence #g +15%#!, morale loss #g -20%#! and military goods cost #g -15%#!.\nBelow #v 50#!, the closer morale is to #v 0#!, the closer we come to offence #r -10%#!, defence #r -5%#!, morale loss #r +25%#! and military goods cost #r +10%#!."
 nesnd_wu_resolve_drag:0 "Brother against brother"
 nesnd_wu_resolve_drag_long:0 "The war has dragged on past two years"
 nesnd_wu_resolve_foreign:0 "Foreign countries fight on the enemy side"
 nesnd_wu_resolve_fresh:0 "A foreign country has just entered the war"
 nesnd_wu_resolve_high:0 "United against the Foreigner"
 nesnd_wu_resolve_low:0 "Wavering Morale"

 nesnd_jingnan_aid.1.t:0 "The Demands of Our Foreign Allies"
 nesnd_jingnan_aid.1.d:0 "The Wu court has fallen. During the Jingnan War, foreign countries sent troops to fight the Wu army on the anti-Wu side. Their envoys have now come to [ROOT.GetCountry.GetName] asking the new court for land and treaties according to where and how each of them fought."
 nesnd_jingnan_aid.1.a:0 "Reward each of them as they ask."
 nesnd_jingnan_aid.1.b:0 "Send envoys with our thanks, and nothing more."
 nesnd_jingnan_aid_cne_east_tt:0 "[SCOPE.sCountry('nesnd_aid_cne').GetName] receives whatever we hold of Subei, Chuzhou and Hefei, and both sides observe a ten-year truce."
 nesnd_jingnan_aid_cne_west_tt:0 "We owe [SCOPE.sCountry('nesnd_aid_cne').GetName] an obligation and grant it investment rights and trade privileges in our country, binding for ten years. Both sides observe a ten-year truce."
 nesnd_jingnan_aid_qe1_tt:0 "We owe [SCOPE.sCountry('nesnd_aid_qe1').GetName] an obligation and grant it trade privileges and transit rights in our country, binding for ten years."
 nesnd_jingnan_aid_hus_tt:0 "We grant [SCOPE.sCountry('nesnd_aid_hus').GetName] a treaty port, binding for ninety-nine years, and trade privileges in our country, binding for ten years. The port goes in Zhejiang, or failing that in Fujian, Minjiang or Western Guangdong, in that order. If none of the four is in our hands or can take a port, there is no treaty port."
 nesnd_jingnan_aid_treaty_note_tt:0 "Each treaty is concluded under the ordinary treaty rules. Any article that does not meet them will not take effect."
 nesnd_jingnan_aid_refuse_tt:0 "Relations with each of these countries #r -30#!."

 nesnd_jingnan_aid.2.t:0 "The Answer from [SCOPE.sCountry('nesnd_aid_patron').GetName]"
 nesnd_jingnan_aid.2.d0:0 "With the Wu court gone, [SCOPE.sCountry('nesnd_aid_patron').GetName] sent envoys to thank us and nothing else: no land and no treaty. Everything we sent our troops for has come to nothing."
 nesnd_jingnan_aid.2.d1:0 "With the Wu court gone, [SCOPE.sCountry('nesnd_aid_patron').GetName] has ceded to us whatever it held of Subei, Chuzhou and Hefei, and both sides observe a ten-year truce."
 nesnd_jingnan_aid.2.d2:0 "With the Wu court gone, [SCOPE.sCountry('nesnd_aid_patron').GetName] has acknowledged that it owes us an obligation and granted us investment rights and trade privileges in its territory. Both sides observe a ten-year truce."
 nesnd_jingnan_aid.2.d3:0 "With the Wu court gone, [SCOPE.sCountry('nesnd_aid_patron').GetName] has acknowledged that it owes us an obligation and granted us trade privileges and transit rights in its territory."
 nesnd_jingnan_aid.2.d4:0 "With the Wu court gone, [SCOPE.sCountry('nesnd_aid_patron').GetName] has given us a treaty port in [SCOPE.sState('nesnd_aid_port').GetName] and trade privileges in its territory."
 nesnd_jingnan_aid.2.d5:0 "With the Wu court gone, [SCOPE.sCountry('nesnd_aid_patron').GetName] has granted us trade privileges in its territory. No treaty port could be set up in Zhejiang, Fujian, Minjiang or Western Guangdong."
 nesnd_jingnan_aid.2.a:0 "So be it."
 nesnd_jingnan_aid_land_reform_tt:0 "Land Revolution completion #g +10#!"

 nesnd_jingnan_aid.3.t:0 "The Wu Court Demands an Indemnity"
 nesnd_jingnan_aid.3.d:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName] has pacified the south and demands that the countries which sent troops against it pay for the war. We have been forced to sign: for the next five years we pay [SCOPE.sCountry('nesnd_aid_patron').GetName] each week a tenth of our fixed income at the time of signing."
 nesnd_jingnan_aid.3.d_cne:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName] has pacified the south and demands that the countries which sent troops against it pay for the war. We have been forced to sign: for the next five years we pay [SCOPE.sCountry('nesnd_aid_patron').GetName] each week a tenth of our fixed income at the time of signing. [SCOPE.sCountry('nesnd_aid_patron').GetName] has also laid claim to Hanzhong and Northern Anhui."
 nesnd_jingnan_aid.3.d_no_treaty:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName] has pacified the south and demands that the countries which sent troops against it pay for the war. No indemnity treaty was concluded, so for now we pay nothing."
 nesnd_jingnan_aid.3.d_cne_no_treaty:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName] has pacified the south and demands that the countries which sent troops against it pay for the war. No indemnity treaty was concluded, so for now we pay nothing, but [SCOPE.sCountry('nesnd_aid_patron').GetName] has laid claim to Hanzhong and Northern Anhui."
 nesnd_jingnan_aid.3.a:0 "We have no choice."

 nesnd_jingnan_aid_treaty_name:0 "Post-Jingnan Commercial Treaty"
 nesnd_jingnan_aid_port_treaty_name:0 "Zhejiang Port Treaty"
 nesnd_jingnan_reparation_treaty_name:0 "Jingnan Indemnity Treaty"
