l_english:
 concept_nesnd_operating_requirements: "Operating Requirements"
 concept_nesnd_operating_requirements_desc: "The weekly grant is fixed when a plan and its project site or sites are chosen. Payments run for twelve months.\nThe project is reviewed monthly. Each project [concept_state] must remain populated and under our control, with at least 80% [concept_market_access]. Our country must be clear of [concept_default] and must not be fighting in a war whose diplomatic play began in the state’s strategic region.\nThe project journal lists the buildings, [concept_building_level], [concept_occupancy], profits, [concept_institution] levels and political backing required by the chosen plan. Three consecutive successful reviews complete the project. A failed review resets the count to zero. If the site becomes ineligible, another can be chosen when the current grant expires."
 nesnd_project_peace_tt: "Our country is not fighting in a war whose diplomatic play began in this project state’s strategic region."
 nesnd_project_no_site: "former site unavailable"
 nesnd_project_no_choice: "No plan selected"
 nesnd_project_choose: "Choose a plan and its project state. Each plan lists its requirements before work begins."
 nesnd_project_meets: "The project currently meets its [concept_nesnd_operating_requirements]."
 nesnd_project_fails: "The project does not yet meet the [concept_nesnd_operating_requirements] listed below."
 nesnd_project_locked: "The original site is no longer eligible. Another may be chosen when the grant expires."
 nesnd_project_reselect: "The original site is no longer eligible. Another may now be chosen."
