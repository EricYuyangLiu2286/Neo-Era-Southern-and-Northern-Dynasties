l_english:
 law_nesnd_hus_hierarchy_abolished:0 "Abolition of the Social Hierarchy"
 law_nesnd_hus_hierarchy_abolished_desc:0 "The registers no longer assign a rank by descent. The standing of each community is governed by the country’s $lawgroup_citizenship$ law."
 law_nesnd_per_hierarchy_abolished:0 "Abolition of the Social Hierarchy"
 law_nesnd_per_hierarchy_abolished_desc:0 "The articles of the Tang code that prescribed rank by descent have been repealed. The Tang, the Iranians and the other peoples of the realm now come under its $lawgroup_citizenship$ law."
 nesnd_hierarchy_abolition.1.t:0 "The End of the Graded Registers"
 nesnd_hierarchy_abolition.1.d:0 "The peoples now recognised as primary cultures in [ROOT.GetCountry.GetName] extend beyond those accorded first rank by the old registers. The government has abolished the ranks and can now revise its citizenship laws."
 nesnd_hierarchy_abolition.1.a:0 "Repeal the old provisions."
 nesnd_hierarchy_abolition.2.t:0 "The End of the Tang Order"
 nesnd_hierarchy_abolition.2.d:0 "The Tang are no longer among the primary cultures of [ROOT.GetCountry.GetName]. The articles that placed them in the first rank and the peoples of Iran in a separate rank have been repealed."
 nesnd_hierarchy_abolition.2.a:0 "Promulgate the new law."
