l_english:
 nesnd_external_choose_wu:0 "Correspond with [SCOPE.sCountry('nesnd_label_usm').GetName]"
 nesnd_external_choose_sih:0 "Contact [SCOPE.sCountry('nesnd_label_sih').GetName]"
 nesnd_external_choose_hus:0 "Send Republican Envoys to [SCOPE.sCountry('nesnd_label_hus').GetName]"
 nesnd_external_choose_fra:0 "Write to [SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_external_hus_title:0 "A Letter from Across the Sea"
 nesnd_external_hus_desc:0 "News of the Southern succession has reached Dongzhou. The Zheng maritime empire that we fought for independence is again divided over who should rule it. Its opponents may seek support from our republic, while merchants watch for changes to the ports and routes on which they depend.\n\nWe can pursue those openings, but assistance abroad will draw on our own treasury and industry. We must decide which relationships serve the republic and how much help we can afford to promise."
 nesnd_external_fra_title:0 "Between Two Seas"
 nesnd_external_fra_desc:0 "Southern envoys seek recognition and the continuation of old agreements, while India remains divided by disputes over the southern coast. French merchants, creditors and officers have interests in both regions. We must decide whom to support and how far our money and arms should follow our diplomacy."
 nesnd_external_qe1_title:0 "The Mountains of Bashu"
 nesnd_external_qe1_desc:0 "Caravans from Sichuan have brought news of the Southern dispute. Since the defeat at Dunhuang, Western Qin has had to consider its military strength and finances carefully. Renewed war in the east would make the roads through Bashu more important to trade and security alike. We should decide whether to cultivate Sichuan, support the anti-Wu coalition, or keep our resources at home."
 nesnd_external_sha_title:0 "Dispatches in the Snow"
 nesnd_external_sha_desc:0 "News of the Southern succession has reached the northern republic. Exiles recognise familiar names among those now disputing power, and some are already seeking contacts in Dongzhou. A friendly republic might supply funds or arms, but our government must decide what help it needs and how close a relationship it can afford."
 nesnd_external_bur_title:0 "The River Mouth and the Court"
 nesnd_external_bur_desc:0 "The Southern succession may alter the court’s relations with a powerful neighbour. Trade along the rivers and the obligations inherited from existing treaties remain immediate concerns. Before committing money or arms to either side, we must consider our own status and which government can best protect our interests."
 nesnd_external_mug_title:0 "The Southern Coast"
 nesnd_external_mug_desc:0 "The Southern succession offers another opening to raise our claims on the Indian coast. Ming possessions in Mysore and the privileges of coastal traders remain sources of contention. Our ministers may seek French assistance in money or arms. If Southern rule still holds land in Mysore, we can also press our territorial claim."
 nesnd_external_gbr_title:0 "After the Blockade"
 nesnd_external_gbr_desc:0 "The old alliance between France and Ming placed heavy pressure on British trade routes. A disputed succession in the Southern realm may create openings for commerce and diplomacy. Merchants seek access to its ports, while we weigh the expense of supporting a foreign partner."
 nesnd_external_rus_title:0 "Dispatches from the East"
 nesnd_external_rus_desc:0 "Russia’s long eastern frontier gives the Southern dispute consequences far beyond its place of origin. A reliable trading partner or a government willing to accept our support might strengthen our position. We may wait for the outcome, or commit funds and arms while the rivals still need foreign friends."
 nesnd_external.1.f:0 "“Report at once the particulars of the Southern succession, and who now controls each port.”\n- Foreign ministry instruction to envoys abroad"
 nesnd_external_policy:0 "Diplomacy in the Southern Crisis"
 nesnd_external_policy_reason:0 "The Southern succession has placed old treaties, trade routes and overseas dependencies in question. Our government must choose which relationships to cultivate and whether to offer assistance or seek it from abroad. Existing agreements continue to bind their parties while new proposals are negotiated."
 nesnd_external_follow:0 "Prepare our response and make further enquiries."
 nesnd_external_decline:0 "Attend to our own affairs first."
 nesnd_external_choose_desc:0 "Arrange for our envoy to open talks with this government."
 nesnd_external_choose_opposition:0 "Contact the leader of the anti-Wu alliance"
 nesnd_external_choose_opposition_desc:0 "Send an envoy to the leader of the anti-Wu alliance to learn what its armies need."
 nesnd_external_offer_money:0 "Provide Military Funds"
 nesnd_external_offer_money_desc:0 "Offer our partner @money!#v 500#! a week from our treasury under a treaty binding for #v 1 year#!. Its government may decline."
 nesnd_external_offer_arms:0 "Negotiate Arms Deliveries"
 nesnd_external_offer_arms_desc:0 "Offer our partner a shipment of #v 10#! units of small arms under a treaty binding for #v 1 year#!. Its government may decline."
 nesnd_external_status_choose:0 "Select a partner, then consider the available terms."
 nesnd_external_status_selected:0 "Our envoy has opened talks with #bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#! and awaits instructions."
 nesnd_external_status_pending:0 "Our envoy awaits a reply. An unsigned request may still be withdrawn."
 nesnd_external_status_committed:0 "The treaty has been signed. Its fulfilment, suspension and withdrawal terms are available in the treaty interface."
 nesnd_external_money_title:0 "An Offer of Funds"
 nesnd_external_money_desc:0 "The envoy from [SCOPE.sCountry('nesnd_external_requester').GetName] offers @money!#v 500#! each week under a treaty binding for #v 1 year#!. Acceptance would establish the transfer between our treasuries."
 nesnd_external.2.f:0 "“Our treasury will pay a weekly sum for one year, and this commitment shall be entered in the treaty between our two countries.”\n- Grant proposal presented by the envoy"
 nesnd_external_arms_title:0 "An Offer of Arms"
 nesnd_external_arms_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName] offers a transfer of #v 10#! small arms under a treaty binding for #v 1 year#!. Its envoy has presented the terms for our government to accept or refuse."
 nesnd_external.3.f:0 "“In conclusion, the arms of others either fall from your back, or they weigh you down, or they bind you fast.”\n- Machiavelli, The Prince, chapter XIII, tr. W. K. Marriott"
 nesnd_external_accept:0 "Approve the treaty."
 nesnd_external_refuse:0 "Decline the offer."
 nesnd_external_commitment_tt:0 "The treaty takes effect at once. Transfers continue beyond the binding period until the treaty is ended or renegotiated."
 nesnd_external_request_money:0 "Request Financial Assistance"
 nesnd_external_request_money_desc:0 "Ask our partner to pay us @money!#v 500#! a week under a treaty binding for #v 1 year#!. Its government may decline."
 nesnd_external_request_arms:0 "Request Arms"
 nesnd_external_request_arms_desc:0 "Ask our partner to supply us with #v 10#! units of small arms under a treaty binding for #v 1 year#!. Its government may decline."
 nesnd_external_request_money_title:0 "A Request for Assistance"
 nesnd_external_request_money_event_desc:0 "The envoy from [SCOPE.sCountry('nesnd_external_requester').GetName] requests financial assistance of @money!#v 500#! each week under a treaty binding for #v 1 year#!."
 nesnd_external.5.f:0 "“Our country lacks the means to meet its needs. We respectfully ask your government for weekly assistance for one year, to be secured by treaty.”\n- Letter of state asking for aid"
 nesnd_external_request_arms_title:0 "An Arms Request from Abroad"
 nesnd_external_request_arms_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName] requests a transfer of #v 10#! small arms under a treaty binding for #v 1 year#!. Its envoy awaits our decision on the proposed deliveries."
 nesnd_external.6.f:0 "“We respectfully ask your government to deliver a consignment of small arms and to conclude a treaty for one year.”\n- Note accompanying the letter of state"
 nesnd_external_accept_request:0 "Approve the assistance and sign."
 nesnd_external_refuse_request:0 "Our resources are needed elsewhere."
 nesnd_external_reconsider:0 "Choose Another Partner"
 nesnd_external_reconsider_desc:0 "Choose another partner before an aid agreement is signed."
 nesnd_external_mysore:0 "Raise the Mysore Question"
 nesnd_external_mysore_desc:0 "Assert a claim on Mysore while [SCOPE.sCountry('nesnd_label_usm').GetName] still holds land there. Relations with [SCOPE.sCountry('nesnd_label_usm').GetName] fall by #v 10#!. This establishes a claim without transferring territory or starting a war."
 nesnd_external_mysore_tt:0 "Gain a claim on Mysore and lose #v 10#! relations with the Southern government."
 nesnd_external_cancel_request:0 "Withdraw the Request"
 nesnd_external_cancel_request_desc:0 "Withdraw the unsigned request. Existing treaties remain in force."
 nesnd_external_dismiss:0 "Set the Matter Aside"
 nesnd_external_dismiss_desc:0 "Close the diplomatic mission and withdraw pending requests. Treaties already in force must be handled separately through diplomacy."
 nesnd_external_resume:0 "Reopen Southern Diplomacy"
 nesnd_external_resume_desc:0 "Resume negotiations while the Southern crisis is still open. An aid agreement already concluded cannot be repeated through this mission."
 nesnd_external_end_title:0 "Our Envoys Return"
 nesnd_external_end_desc:0 "The Southern succession has reached a settlement. Our envoys have completed their mission, but treaties already signed remain in force. We must continue meeting those obligations and attend to the relationships that survive the crisis."
 nesnd_external_end_option:0 "Close the mission and keep our agreements."
 nesnd_external_contact_offer_tt:0 "Select this government as the recipient of a possible grant or arms shipment."
 nesnd_external_contact_request_tt:0 "Select this government as the one to approach for funds or arms."
 nesnd_external_agenda_live_tt:0 "Our government can still send an envoy over the Southern succession."
 nesnd_external_no_target_tt:0 "Our envoy has yet to choose a partner."
 nesnd_external_no_pending_tt:0 "No proposal is awaiting a reply."
 nesnd_external_no_commitment_tt:0 "We have yet to sign an aid treaty over the Southern succession."
 nesnd_external_wu_available_tt:0 "The Wu government survives and our countries are at peace with each other."
 nesnd_external_sih_available_tt:0 "Sichuan has its own government and our countries are at peace with each other."
 nesnd_external_hus_available_tt:0 "The Civic Republic of Dongzhou survives and our countries are at peace with each other."
 nesnd_external_fra_available_tt:0 "France survives and our countries are at peace with each other."
 nesnd_external_opposition_available_tt:0 "The anti-Wu alliance has a leader whose country is at peace with ours."
 nesnd_external_target_valid_tt:0 "Our partner still represents the same side and is at peace with us."
 nesnd_external_no_cooldown_tt:0 "We have sent no aid proposal in the past #v 6 months#!."
 nesnd_external_india_free_tt:0 "We have no outstanding request or aid pledge in our Indian diplomacy."
 nesnd_external_export_room_tt:0 "The market can export at least #v 10#! more small arms."
 nesnd_external_import_room_tt:0 "The market can import at least #v 10#! more small arms."
 nesnd_external_money_terms_tt:0 "The two countries can sign a treaty for @money!#v 500#! a week, binding for #v 1 year#!."
 nesnd_external_arms_terms_tt:0 "The two countries can sign a treaty to supply #v 10#! units of small arms, binding for #v 1 year#!."
 nesnd_external_agenda_over_tt:0 "The Southern succession is settled, or no party remains for our envoy to approach."
 nesnd_external_dismissed_tt:0 "Our government has recalled its envoy and closed the talks."
 nesnd_external_status_refused:0 "#bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#! declined our proposal. The treaty went unsigned."
 nesnd_external_end_no_partner_desc:0 "Our envoy has returned home. There is no longer a government to receive the letter concerning the Southern succession. Any treaties already signed remain in force."
 nesnd_external.4.f:0 "“The succession dispute in the South has been settled, and I hereby report the end of my mission. The treaties concluded earlier remain in force.”\n- The envoy's report on his return"
 nesnd_external_cancelled_tt:0 "Recall the outstanding proposal. A fresh approach must wait until #v 6 months#! after the last dispatch."
 nesnd_external_dismiss_tt:0 "Recall our envoy, withdraw any unanswered proposal and close these talks."
 nesnd_external_reconsider_tt:0 "End the envoy’s present assignment so that another partner can be chosen."
 nesnd_external_mysore_unclaimed_tt:0 "We have yet to press our Mysore claim during the Southern succession."
 nesnd_external_offer_money_tt:0 "In #v 7 days#! our envoy will offer a treaty paying our partner @money!#v 500#! a week. Its government may accept or decline."
 nesnd_external_offer_arms_tt:0 "In #v 7 days#! our envoy will offer to supply our partner with #v 10#! units of small arms. Its government may accept or decline."
 nesnd_external_request_money_tt:0 "In #v 7 days#! our envoy will ask our partner to pay us @money!#v 500#! a week. Its government may accept or decline."
 nesnd_external_request_arms_tt:0 "In #v 7 days#! our envoy will ask our partner to supply us with #v 10#! units of small arms. Its government may accept or decline."
 nesnd_external_refuse_tt:0 "Decline the proposal and send the envoy home with our reply."
 nesnd_external_donor_at_peace_tt:0 "The government providing the money or arms is at peace."
 nesnd_external_status_await_partner:0 "Our envoy awaits a reply from #bold [ROOT.Var('nesnd_external_pending').GetCountry.GetName]#!."
 nesnd_external_status_signed_partner:0 "We have signed an aid treaty with #bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#!. Its terms and deliveries appear in our treaties."
