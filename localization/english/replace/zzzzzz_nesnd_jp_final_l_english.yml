l_english:
 nesnd_jp_establish_edo:0 "The Government in Edo"
 nesnd_jp_establish_edo_reason:0 "Edo now governs extensive northern territories. Garrisons can hold the roads, but they cannot conduct every part of provincial administration. The government needs officials to organise its revenue and spending, while the castle towns must accommodate merchants, craftsmen and people seeking work away from home. A country capable of sustaining ordinary government will be better placed to seek greater powers."
 nesnd_jp_establish_kyoto:0 "Kyoto and Osaka"
 nesnd_jp_establish_kyoto_reason:0 "The courtiers of Kyoto and the merchants of Osaka have different connections and interests. Courtly rank does not pay soldiers, and private wealth does not become public revenue of its own accord. Officials must organise taxation and administration in the territories they govern so that the towns can sustain the new government."
 nesnd_jp_establish_toyotomi:0 "The Toyotomi Retainers"
 nesnd_jp_establish_toyotomi_reason:0 "Partition has deprived the Toyotomi retainers of their former authority over Japan, but the troops and households remaining in the west still need support. Old prestige cannot settle who collects the revenue or conducts local government. A dependable administration must be established in the surviving territories, with castle towns serving as centres of government, taxation and employment."
 nesnd_jp_establishment_required_tt:0 "The country has established a functioning provincial administration."
 nesnd_jp_independence_cooldown_tt:0 "At least six months have passed since our last independence play."
 nesnd_jp_settled_administration:0 "Provincial Administration Established"
 nesnd_jp_union_permission_required_tt:0 "Our overlord has authorised us to unite the Japanese states."
 nesnd_jp_mercantile_ports_junior_desc:0 "Replace seclusion with mercantilism and permit overseas commerce. The common market’s tariffs remain under the control of its leading country."
 nesnd_jp_protected_ports_junior_desc:0 "Adopt protectionist trade laws and open our ports. The common market’s tariffs remain under the control of its leading country."
