 nesnd_sha_arms_contract:0 "Dongzhou Arms Contract"
 nesnd_sha_east_of_baikal:0 "The Eastern Shore Restored"
 nesnd_rus_far_east_victor:0 "Victor of the Far Eastern War"
 nesnd_sha_failed_expedition:0 "Defeat in the Far North"
 nesnd_sha_land_of_gold:0 "Land of Gold"
 nesnd_sha_private_diggings:0 "Diggings Open to All"
 nesnd_sha_prospect:0 "Prospect for Gold"
 nesnd_sha_prospect_desc:0 "Survey $STATE_KOLYMA$, $STATE_YAKUTSK$ or $STATE_OKHOTSK$, starting with the richest remaining gold deposit."
 nesnd_sha_survey_land_tt:0 "We hold territory in $STATE_KOLYMA$, $STATE_YAKUTSK$ or $STATE_OKHOTSK$."
 nesnd_sha_survey_deposit_tt:0 "At least one of our territories there still has gold deposits to survey."
 nesnd_sha_survey_ready_tt:0 "At least #v 24#! months have passed since the last survey, or this is the first."
 nesnd_sha_survey_limit_tt:0 "The assembly has funded fewer than #v 3#! surveys."
 nesnd_sha_attract_exiles:0 "Offer Passage to the Northern Exiles"
 nesnd_sha_attract_exiles_desc:0 "Charter passage for North Chinese migrants and arrange a destination in Denglai. The cost is halved while the northern government is at war or its disorder reaches #v 30#!."
 nesnd_sha_ships_ready_tt:0 "At least #v 36#! months have passed since the previous passage was chartered, or this is the first."
 nesnd_sha_north_sea_company:0 "North Sea Company"
 nesnd_sha_northern_league:0 "Northern Maritime Trade League"
 nesnd_sha_score_warm:0 "Amicable relations"
 nesnd_sha_score_friendly:0 "Friendly relations"
 nesnd_sha_score_four_mines:0 "Four levels of gold mines and fields in Denglai"
 nesnd_sha_score_two_goals:0 "Two of Denglai’s three objectives met"
 nesnd_sha_score_west:0 "Dongzhou’s western triumph"
 nesnd_sha_score_war:0 "Dongzhou is at war"
 nesnd_sha_north.1.t:0 "The Rising on the Lake"
 nesnd_sha_north.1.d:0 "The war between Russia and the borderland insurgents has ended. The new government holds Irkutsk. Dispatches to the lakeshore can at last arrive without a Russian official first breaking the seal. Denglai has a five-year truce with Russia. We can open talks on union, though people who have only just won their own freedom may be unwilling to bow to another flag."
 nesnd_sha_north.1.f:0 "“This government thanks Denglai for its help. On the question of merging our two countries, we can give no answer until the people here have deliberated on it.”\n- Reply of the new government at Irkutsk"
 nesnd_sha_north.1.a:0 "Lay the reply before the assembly."
 nesnd_sha_north.2.t:0 "East of Baikal"
 nesnd_sha_north.2.d:0 "Irkutsk can once again be coloured in on Denglai’s map. The first arrivals carried no maps. They had lists of neighbours’ names handed down by their parents. Sometimes they had reached the third house before someone ran out of the first and called a visitor by a childhood name."
 nesnd_sha_north.2.f:0 "“We went from door to door with the names of the neighbours our forebears left us, and we have found the families we used to live beside.”\n- A letter home to Denglai"
 nesnd_sha_north.2.a:0 "Go ashore."
 nesnd_sha_north.3.t:0 "Back beyond the Snow Line"
 nesnd_sha_north.3.d:0 "The letters have stopped coming. Denglai had hoped its compatriots could hold their ground east of the lake, but the reports from Irkutsk no longer warrant a fresh appropriation. Families from the border are still waiting at the harbour. We must first bring back those willing to return."
 nesnd_sha_north.3.f:0 "“A missing dispatch can be written again next year. If a man goes missing, where is his mother to look for him next year?”"
 nesnd_sha_north.3.a:0 "Suspend relief and reconsider in twelve months."
 nesnd_sha_north.4.t:0 "Names on the Grain Sacks"
 nesnd_sha_north.4.d:0 "The assembly spent the morning arguing over who should draw the sacks of grain sent to the frontier. The officers wanted them issued against the volunteer rolls. Fishing families brought letters from home. A volunteer freezing to death, they said, was no less a loss than someone whose name had never made the roll."
 nesnd_sha_north.4.f:0 "“Families not on the roll are freezing too. We ask the assembly to issue grain by household, and not only by the roll of volunteers.”\n- Petition of the fishermen to the assembly"
 nesnd_sha_north.4.a:0 "Supply the households first."
 nesnd_sha_north.4.b:0 "Issue grain against the volunteers’ roll."
 nesnd_sha_north.5.t:0 "A Letter Left Unsealed"
 nesnd_sha_north.5.d:0 "An open letter from east of the lake asks the Denglai press to print it in full. Its authors demand the right to choose their own representatives and name their settlements at the foot of the page. Republican deputies want those names on the front page so readers on the mainland can see who is prepared to join them. The officers hesitate over the signatures. Once a merchant ship carries the paper into Russia, the Cossacks will know which villages to search for the signatories."
 nesnd_sha_north.5.f:0 "“I signed my name. I know what awaits me if the Russians get hold of it. Give the bearer two days to get back before you print it. His name isn’t on that letter.” — A postscript"
 nesnd_sha_north.5.a:0 "Send it to the press."
 nesnd_sha_north.5.b:0 "Wait for the bearer to get home."
 nesnd_sha_north.6.t:0 "East of the Snow Line"
 nesnd_sha_north.6.d:0 "Twelve years on, our government still cannot register a single farm in Irkutsk. The old relief ledger is worn at its corners. Some children listed in it now have children of their own. The assembly closes the account and reserves the money that remains for its ventures by sea."
 nesnd_sha_north.6.f:0 "“The lake will still be there. First find us a harbour a ship can reach in winter.”"
 nesnd_sha_north.6.a:0 "Close the northern accounts."
 nesnd_sha_north.7.t:0 "Gold in the Pan"
 nesnd_sha_north.7.d:0 "The surveyors tipped a little packet of gold dust onto the assembly table. The deputies passed it round before the merchants spoke. They would bring shovels, timber and flour if private digging were allowed. The treasurer gathered the grains back into the packet. His bills for the winter had already been written."
 nesnd_sha_north.7.f:0 "“We are willing to carry shovels, timber and grain to the goldfields, provided the assembly permits private working.”\n- Request of the merchants"
 nesnd_sha_north.7.a:0 "Open the diggings to private miners."
 nesnd_sha_north.7.b:0 "Bring the workings under state management and remit the proceeds to the treasury."
 nesnd_sha_north.8.t:0 "Land of Gold"
 nesnd_sha_north.8.d:0 "People once counted the ships in harbour to reckon how long the food might last. They still count them. Now they know which carries timber, which takes on whale oil, and which will bring back payment from the buyers in Dongzhou. With more families settled in the north, the assembly can at last unroll the southern half of its chart."
 nesnd_sha_north.8.f:0 "“This year there were more ships in and out of the harbour carrying timber, buying whale oil and bringing home payment from buyers in Dongzhou.”\n- Annual report of the harbour office"
 nesnd_sha_north.8.a:0 "Trace the coast south."
 nesnd_sha_north.9.t:0 "When the Gold Runs Out"
 nesnd_sha_north.9.d:0 "Twelve years have passed and the assembly has yet to deliver all three things it promised. Some of the prospectors have raised families here. Others have shipped out again. There is still grain in store and open water beyond the harbour. Denglai cannot wait for everything in the north to be in order before setting out. It must make the next voyage with what it has."
 nesnd_sha_north.9.f:0 "“I haven’t forgotten what I owe you. If you’re going south, I’ll put it in writing for you to take along.”"
 nesnd_sha_north.9.a:0 "Enter the figures as they stand."
 nesnd_sha_north.10.t:0 "A Fishery Inside the Claim"
 nesnd_sha_north.10.d:0 "A new mining claim encloses a stretch of bank where local families set their nets. The miners want to unload timber there. The fishing families can point to net stakes they have used for years. The mine can produce a deed bearing the government seal. The fish run lasts only a few days. By the time the families find someone willing to speak for them at the government office, the whole bank may be stacked with timber."
 nesnd_sha_north.10.f:0 "“Mark the place for our nets on that paper, sir. Next year there may be another man in charge of the mine. He’ll honour the seal. He may not honour my stakes.” — A fisherman on the riverbank"
 nesnd_sha_north.10.a:0 "Reserve the bank for the nets."
 nesnd_sha_north.10.b:0 "Allow the sheds within the claim."
 nesnd_sha_north.11.t:0 "Passengers in the Ice"
 nesnd_sha_north.11.d:0 "A ship carrying migrants has been caught in drift ice on the Sea of Okhotsk. Nobody on shore can yet reach the hull. At night a voice carries across the ice. There are children aboard. Could someone bring coal first? The fishing families knew what that plea meant. Before dawn they have harnessed their sledges."
 nesnd_sha_north.11.f:0 "“I couldn’t make out the ship’s name. I heard the man well enough. Come on.”"
 nesnd_sha_north.11.a:0 "Clear the wharf for the rescue."
 nesnd_sha_north.12.t:0 "A Tariff in the League"
 nesnd_sha_north.12.d:0 "Merchants within the league have brought Denglai a tariff account, asking its delegates to speak for goods shipped from the north. Dongzhou buyers want to know the landed price of whale oil and timber. A fish seller on the wharf is making a different calculation. If the next ship returns without grain, how much rice will his basket of fish buy?"
 nesnd_sha_north.12.f:0 "“We trade our fish for rice. When the ships come back with empty holds, the price of rice goes up. When you settle the tariff, we ask that the grain trade be taken into account as well.”\n- Petition of the fishermen at the quay"
 nesnd_sha_north.12.a:0 "Present the exporters’ case."
 nesnd_sha_north.12.b:0 "Hear the fishing families first."
