l_english:
 nesnd_sha_far_north:0 "Intrigue in the Far North"
 nesnd_sha_far_north_reason:0 "Children raised in Kamchatka scarcely believe their grandfathers grew wheat west of Lake Baikal. Yet the old men can name the bend where a boat might moor and the meadow where horses could graze in early summer. The Russian settlers’ uprising and the Cossack expedition put those lands under new masters. Some of the people stayed. The Liaodong families of Irkutsk and Upper Yeniseysk still speak the language of their Denglai kin. Their winters are just as long.\n\nEven the most impatient deputy knows our troops could scarcely escort a grain convoy as far as the lake. Let us hear what the people on its shores have to say."
 nesnd_sha_gold_alliance:0 "Gold and Allies"
 nesnd_sha_gold_alliance_reason:0 "The shipowners of Sakhalin have traded with Dongzhou for generations. When a shipload of Jurchen or Mongol captives reached Dongzhou, buyers from its agricultural settlements paid in silver and took the people away. Some Denglai merchants put capital into the settlements themselves. The price of a ship, the price of land and the price of a person appeared on the same ledger page.\n\nNow that Denglai hopes to open the Kolyma mines, the merchants of Sakhalin turn first to familiar firms across the sea. The mines need pit props and winter provisions. Several cargoes must be paid for before the first gold is washed. Whether Dongzhou firms will take a stake depends on the mining rights Denglai is prepared to grant."
 nesnd_sha_far_north_bar:0 "Sentiment in the Far North"
 nesnd_sha_far_north_bar_desc:0 "Borderland secession #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_sha_relief_status:0 "Letters still reach Denglai from the lake. Reports on secession among the peoples of the Russian borderland arrive weekly."
 nesnd_sha_revolt_status:0 "A rising in the Russian borderland is under way. The settlement of its war with Russia will decide who holds the lake."
 nesnd_sha_lake_status:0 "The seceding country has secured a foothold in Irkutsk. The assembly may now demand its incorporation."
 nesnd_sha_gold_status:0 "The assembly has staked its promise to the newcomers on mines, population and access to Dongzhou. Proposals to Dongzhou are available through diplomacy. Once either a gold mine or a whaling station reaches level three in a northern state, the $nesnd_sha_north_sea_company$ becomes available in the Companies panel."
 nesnd_sha_gold_eight_tt:0 "Gold mines and gold fields total at least #v 8#! levels nationwide."
 nesnd_sha_partner_tt:0 "Share a market with Dongzhou or hold an investment rights treaty with it."
 nesnd_sha_merge_defeat_tt:0 "The opposing demand has been enforced against Denglai in the play for Irkutsk."
 nesnd_sha_relief:0 "Send Relief to Our Northern Kin"
 nesnd_sha_relief_desc:0 "Appropriate a year’s funds to renew contact with settlements in the Russian north. People will remember whose grain reached them this winter."
 nesnd_sha_relief_ready_tt:0 "Previous relief payments and any recovery period have ended. The lake settlements have yet to gain independence."
 nesnd_sha_relief_terms_tt:0 "Establish Support Separatism against Russia. Non-Russian Pops in the two borderlands gain #v 10%#! [Concept('concept_radical','$concept_radicals$')] now and #v 3%#! every three months for a year."
 nesnd_sha_volunteers:0 "Muster the Volunteers"
 nesnd_sha_volunteers_desc:0 "Pay the volunteers willing to support their kin and muster them at Yakutsk."
 nesnd_sha_halfway_tt:0 "Secession progress of one people in the Russian borderland has reached #v 50%#!."
 nesnd_sha_no_volunteers_tt:0 "The Yakutsk volunteers have yet to muster."
 nesnd_sha_volunteer_army:0 "Yakutsk Volunteers"
 nesnd_sha_arms:0 "Order Arms from Dongzhou"
 nesnd_sha_arms_desc:0 "Order supplies from Dongzhou merchants at public expense. They offer half price while Dongzhou enjoys its western triumph."
 nesnd_sha_reunite:0 "Demand Union with the Far North"
 nesnd_sha_reunite_desc:0 "Deliver the assembly’s terms to the seceding country that holds Irkutsk."
 nesnd_sha_lake_free_tt:0 "The independent secessionists hold land in Irkutsk and Denglai can initiate a play against them."
 nesnd_sha_merge_wargoal_tt:0 "Demand annexation of the seceding country. Russia cannot join this play. They may demand Denglai’s humiliation."
 nesnd_sha_annex_lake:0 "Union with the Far North"
