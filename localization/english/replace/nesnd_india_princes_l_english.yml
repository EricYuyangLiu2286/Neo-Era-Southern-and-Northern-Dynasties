 IR5_ADJ:0 "$STATE_TRAVANCORE$"
 dp_nesnd_india_travancore:0 "The $STATE_TRAVANCORE$ Rising"
 dp_nesnd_india_travancore_desc:0 "$STATE_TRAVANCORE$ has declared independence, and its former ruler moves to take it back."
 IR6:0 "$STATE_GUJARAT$"
 IR6_ADJ:0 "$STATE_GUJARAT$"
 dp_nesnd_india_gujarat:0 "The $STATE_GUJARAT$ Rising"
 dp_nesnd_india_gujarat_desc:0 "$STATE_GUJARAT$ has declared independence, and its former ruler moves to take it back."
 nesnd_india_mission_country_tt:0 "We are an Indian empire, princely state or small state"
 nesnd_india_partner_can_fund_tt:0 "The other government's [concept_gold_reserves] can cover the sum, and it is not in [concept_default] or [concept_bankruptcy]"
 nesnd_india_workshop_site_tt:0 "We have a state where a $building_tooling_workshop$ can be built or expanded"
 nesnd_india_union_target_exists_tt:0 "There is a princely state to invite: [concept_relations] with us at least 25, and not at war or in a diplomatic play"
 nesnd_india_project_idle_tt:0 "We have no local project under way"
 nesnd_india_project_site_exists_tt:0 "We have a state where this building can be built"
 nesnd_india_project_no_deal_tt:0 "The state has no funding agreement still within its five years"
 nesnd_india_project_fresh_tt:0 "The state has no building of this kind yet"
 nesnd_india_project_funds_tt:0 "Our [concept_gold_reserves] can cover the sum, and we are not in [concept_default] or [concept_bankruptcy]"
 nesnd_india_project_site_tt:0 "The state chosen by [SCOPE.sCountry('india_sender').GetName] is still theirs and can still be built in"
 nesnd_india_union_host_free_tt:0 "The empire is not a subject of any country"
 nesnd_india_union_host_exists_tt:0 "There is an Indian empire to join"
 nesnd_india_union_no_project_tt:0 "We have no local project under way"
 nesnd_india_union_not_own_subject_tt:0 "The state is not our subject"
 nesnd_india_union_sender_not_subject_tt:0 "[SCOPE.sCountry('india_sender').GetName] is not our subject"
 nesnd_india_union_dominion_rank_tt:0 "The empire's [concept_rank] is at least [concept_minor_power] and higher than the state's, and the state is no higher than [concept_minor_power]"
 nesnd_india_union_can_pay_tt:0 "The empire's [concept_gold_reserves] can cover the sum (twice over when the former overlord must be compensated)"
 nesnd_india_union_community_tt:0 "$nesnd_india_community_bar$ is at least #v 60#!"
 nesnd_india_project_fee_tt:0 "[SCOPE.sCountry('india_sender').GetName] can still pay the survey fee"
 nesnd_india_project_site_fresh_tt:0 "No building of the same kind has been built in the chosen state meanwhile"
 nesnd_india_project_name_1:0 "[GetBuildingType('building_university').GetName]"
 nesnd_india_project_name_2:0 "[GetBuildingType('building_tooling_workshop').GetName]"
 nesnd_india_project_name_3:0 "[GetBuildingType('building_railway').GetName]"
 nesnd_india_project_name_4:0 "Engineering Survey"
 nesnd_india_project_name_0:0 "Local Project"
 nesnd_india_diplomacy.1.t:0 "An Envoy from [SCOPE.sCountry('india_sender').GetName]"
 nesnd_india_diplomacy.1.t9:0 "A Princely State's Project"
 nesnd_india_diplomacy.1.t10:0 "An Offer to Sell a Factory"
 nesnd_india_diplomacy.1.t11:0 "An Offer to Buy Back a Factory"
 nesnd_india_diplomacy.1.t12:0 "A Plea for Famine Relief"
 nesnd_india_diplomacy.1.d1:0 "The envoy of [SCOPE.sCountry('india_sender').GetName] asks us for a grant and for teachers to teach in their schools for four years. In return [SCOPE.sCountry('india_sender').GetName] will owe us a debt in diplomacy, and our teachers will carry our language and learning into Indian classrooms."
 nesnd_india_diplomacy.1.d2:0 "The envoy of [SCOPE.sCountry('india_sender').GetName] asks us for a grant and for engineers to help them build a $building_tooling_workshop$. The grant will be counted as our ownership of the works, and [SCOPE.sCountry('india_sender').GetName] will also owe us a debt in diplomacy."
 nesnd_india_diplomacy.1.d3:0 "The envoy of [SCOPE.sCountry('india_sender').GetName] asks us for a grant and for officers to train their army for four years. In return [SCOPE.sCountry('india_sender').GetName] will open its territory to our army for five years and owe us a debt in diplomacy."
 nesnd_india_diplomacy.1.d4:0 "[SCOPE.sCountry('india_sender').GetName] formally asks for greater autonomy and a larger say in its own affairs. Should we refuse, the discontent of [SCOPE.sCountry('india_sender').GetName] with us will come into the open."
 nesnd_india_diplomacy.1.d5:0 "The envoy of [SCOPE.sCountry('india_sender').GetName] proposes that our two countries sign a defensive treaty for three years: should either be attacked, the other will send troops to its aid."
 nesnd_india_diplomacy.1.d6_own:0 "[ROOT.GetCountry.GetName] is already a subject of [SCOPE.sCountry('india_sender').GetName], which now invites us to merge into the empire formally. The empire will provide for the prince's family, and our state will cease to exist. Should we refuse, [SCOPE.sCountry('india_sender').GetName] will lay claim to our land."
 nesnd_india_diplomacy.1.d6_former:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to join the empire. Our present overlord has agreed to let us go, and [SCOPE.sCountry('india_sender').GetName] will compensate it. The prince may merge the state into the empire, or become a dominion of the empire, keeping the state's own government, laws, treasury and army. Should we refuse, [SCOPE.sCountry('india_sender').GetName] will lay claim to our land."
 nesnd_india_diplomacy.1.d6_merge_only:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to merge into the empire, which will provide for the prince's family. The standing of our two countries does not allow us to join as a dominion. Should we refuse, [SCOPE.sCountry('india_sender').GetName] will lay claim to our land."
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to join the empire. The prince may merge the state into the empire, which will provide for the royal family, or become a dominion of the empire, keeping the state's own government, laws, treasury and army and accepting a sum from the empire. Should we refuse, [SCOPE.sCountry('india_sender').GetName] will lay claim to our land."
 nesnd_india_diplomacy.1.d8_dominion:0 "The prince of [SCOPE.sCountry('india_sender').GetName] asks to become our [concept_dominion]. The state would keep its own government, laws, treasury and army; we would pay the prince a sum and bear princely pensions for ten years."
 nesnd_india_diplomacy.1.d8_merge:0 "The prince of [SCOPE.sCountry('india_sender').GetName] asks that the state be merged into our empire, with the empire providing for the prince's family. We would pay a sum and bear princely pensions for ten years."
 nesnd_india_diplomacy.1.d9_survey:0 "[SCOPE.sCountry('india_sender').GetName] asks us to send engineers to survey their land, and will pay the fee."
 nesnd_india_diplomacy.1.d9_grant:0 "[SCOPE.sCountry('india_sender').GetName] asks us for a grant to build a university in [SCOPE.sState('india_project_site').GetName]. In return they will owe us a debt in diplomacy."
 nesnd_india_diplomacy.1.d9_workshop:0 "[SCOPE.sCountry('india_sender').GetName] asks us to pay for a $building_tooling_workshop$ in [SCOPE.sState('india_project_site').GetName]. The level built would belong to us, and they would owe us a debt in diplomacy."
 nesnd_india_diplomacy.1.d9_railway:0 "[SCOPE.sCountry('india_sender').GetName] asks us to pay for a $building_railway$ in [SCOPE.sState('india_project_site').GetName]. The level built would belong to us, and they would owe us a debt in diplomacy."
 nesnd_india_diplomacy.1.d10:0 "[SCOPE.sCountry('india_sender').GetName] offers to sell us one level of a factory in [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_mug_deal_state').GetState.GetName] for #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#!."
 nesnd_india_diplomacy.1.d11:0 "[SCOPE.sCountry('india_sender').GetName] offers #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#! to buy back one level of a factory we hold in [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_mug_deal_state').GetState.GetName]."
 nesnd_india_diplomacy.1.d12:0 "[SCOPE.sCountry('india_sender').GetName] has been struck by famine and asks us for #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#! to relieve the stricken states."
 nesnd_india_diplomacy.1.d:0 "The envoy of [SCOPE.sCountry('india_sender').GetName] has brought a request."
 nesnd_india_diplomacy.1.f:0 "'Our government has a request to make, and sends this envoy to present it in person. We await your answer.'\n— Letter carried by the envoy"
 nesnd_india_diplomacy.1.a:0 "Agree"
 nesnd_india_reply_aid_tt:0 "[SCOPE.sCountry('india_sender').GetName] hosts our advisers for four years and owes us an [concept_obligation]."
 nesnd_india_reply_teacher_tt:0 "We gain [GetStaticModifier('nesnd_india_teaching_mission').GetName] for four years."
 nesnd_india_reply_engineer_tt:0 "We take ownership of a $building_tooling_workshop$ in [SCOPE.sCountry('india_sender').GetName], one level per 25,000 of the grant, at most 5."
 nesnd_india_reply_officer_tt:0 "[SCOPE.sCountry('india_sender').GetName] gives us [concept_military_access] for five years."
 nesnd_india_reply_relations_tt:0 "[concept_relations] with [SCOPE.sCountry('india_sender').GetName] #g +25#!"
 nesnd_india_reply_autonomy_tt:0 "The [concept_autonomy] of [SCOPE.sCountry('india_sender').GetName] rises by one level, and its [concept_liberty_desire] -20."
 nesnd_india_reply_defence_tt:0 "Our two countries sign a [concept_defensive_pact] for three years, and [concept_relations] with [SCOPE.sCountry('india_sender').GetName] #g +25#!."
 nesnd_india_reply_project_survey_tt:0 "We send engineers to [SCOPE.sCountry('india_sender').GetName], who pay the fee."
 nesnd_india_reply_project_grant_tt:0 "[SCOPE.sCountry('india_sender').GetName] owes us an [concept_obligation], and [concept_relations] with [SCOPE.sCountry('india_sender').GetName] #g +25#!."
 nesnd_india_reply_project_stake_tt:0 "We own the new level of [SCOPE.sCountry('india_sender').GetCustom('nesnd_india_project_name')] in [SCOPE.sState('india_project_site').GetName], [SCOPE.sCountry('india_sender').GetName] owes us an [concept_obligation], and [concept_relations] with [SCOPE.sCountry('india_sender').GetName] #g +25#!."
 nesnd_india_reply_project_decline_tt:0 "[concept_relations] of [SCOPE.sCountry('india_sender').GetName] with us #r -15#!"
 nesnd_india_union_reply_take_dominion_tt:0 "[SCOPE.sCountry('india_sender').GetName] becomes our [concept_dominion] and gains [GetStaticModifier('nesnd_india_prince_privileges').GetName]."
 nesnd_india_union_reply_take_merge_tt:0 "[SCOPE.sCountry('india_sender').GetName] merges into our country."
 nesnd_india_union_reply_take_pay_tt:0 "We pay #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#! and bear [GetStaticModifier('nesnd_india_princely_pensions').GetName] for ten years."
 nesnd_india_union_reply_take_compensation_tt:0 "[SCOPE.sCountry('india_sender').GetName] first leaves its overlord, and we pay that overlord the same sum in compensation."
 nesnd_india_diplomacy.1.merge:0 "Merge into the Empire"
 nesnd_india_union_reply_merge_tt:0 "Our state merges into [SCOPE.sCountry('india_sender').GetName] and ceases to exist."
 nesnd_india_union_reply_former_tt:0 "Our state first leaves its present overlord, and [SCOPE.sCountry('india_sender').GetName] pays it the same sum in compensation."
 nesnd_india_diplomacy.1.dominion:0 "Become a Dominion"
 nesnd_india_union_reply_dominion_tt:0 "Our state becomes a [concept_dominion] of [SCOPE.sCountry('india_sender').GetName], keeps its government, laws, treasury and army, receives #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#!, and gains [GetStaticModifier('nesnd_india_prince_privileges').GetName]."
 nesnd_india_diplomacy.1.b:0 "Refuse"
 nesnd_india_union_reply_decline_tt:0 "Refuse the request of [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_refusal_tt:0 "Refuse the request of [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_diplomacy.2.t:0 "Request Granted"
 nesnd_india_diplomacy.2.d:0 "[SCOPE.sCountry('india_partner').GetName] has granted our request, and the agreement takes effect today."
 nesnd_india_diplomacy.2.f:0 "'Our government agrees to your request.'\n— The reply"
 nesnd_india_diplomacy_accepted_tt:0 "The agreement takes effect."
 nesnd_india_diplomacy_ack:0 "Noted"
 nesnd_india_diplomacy.3.t:0 "Request Refused"
 nesnd_india_diplomacy.3.d:0 "Our request to [SCOPE.sCountry('india_partner').GetName] has not been granted, or was struck down by an overlord before it arrived."
 nesnd_india_diplomacy.3.f:0 "'Our government is unable to agree to your request.'\n— The reply"
 nesnd_india_diplomacy_refused_tt:0 "The request lapses."
 nesnd_india_diplomacy.6.t:0 "A Subject's Request"
 nesnd_india_diplomacy.6.d_project_survey:0 "[SCOPE.sCountry('india_sender').GetName] wishes to ask [SCOPE.sCountry('india_partner').GetName] to send engineers for a survey, which requires our consent under the terms of subjecthood."
 nesnd_india_diplomacy.6.d_project_grant:0 "[SCOPE.sCountry('india_sender').GetName] wishes to ask [SCOPE.sCountry('india_partner').GetName] for a grant to build a university in [SCOPE.sState('india_project_site').GetName], which requires our consent under the terms of subjecthood."
 nesnd_india_diplomacy.6.d_project_stake:0 "[SCOPE.sCountry('india_sender').GetName] wishes to ask [SCOPE.sCountry('india_partner').GetName] to pay for [SCOPE.sCountry('india_sender').GetCustom('nesnd_india_project_name')] in [SCOPE.sState('india_project_site').GetName], and the level built would belong to [SCOPE.sCountry('india_partner').GetName]. This requires our consent under the terms of subjecthood."
 nesnd_india_diplomacy.6.d_union_invite:0 "[SCOPE.sCountry('india_sender').GetName] invites our subject [SCOPE.sCountry('india_partner').GetName] to join its empire. If [SCOPE.sCountry('india_partner').GetName] accepts, it will leave us, and [SCOPE.sCountry('india_sender').GetName] will compensate us. This requires our consent under the terms of subjecthood."
 nesnd_india_diplomacy.6.d_union_ask:0 "Our subject [SCOPE.sCountry('india_sender').GetName] asks to join the empire of [SCOPE.sCountry('india_partner').GetName]. If this is granted, [SCOPE.sCountry('india_sender').GetName] will leave us, and [SCOPE.sCountry('india_partner').GetName] will compensate us. This requires our consent under the terms of subjecthood."
 nesnd_india_diplomacy.6.d_famine:0 "[SCOPE.sCountry('india_sender').GetName] wishes to ask [SCOPE.sCountry('india_partner').GetName] for famine relief funds, which requires our consent under the terms of subjecthood."
 nesnd_india_diplomacy.6.d:0 "A request between [SCOPE.sCountry('india_sender').GetName] and [SCOPE.sCountry('india_partner').GetName] requires our consent under the terms of subjecthood."
 nesnd_india_diplomacy.6.f:0 "'A subject shall submit any agreement with another government to its overlord for review.'\n— Terms of the subject treaty"
 nesnd_india_diplomacy.6.a:0 "Permit"
 nesnd_india_diplomacy.6.b:0 "Forbid"
 nesnd_india_consent_permit_tt:0 "The request goes on to [SCOPE.sCountry('india_partner').GetName]."
 nesnd_india_consent_forbid_tt:0 "The request lapses."
 nesnd_india_consent_forbid_rift_tt:0 "The request lapses, and the [concept_relations] of [SCOPE.sCountry('india_sender').GetName] with us #r -15#!."
 nesnd_india_diplomacy.7.t:0 "Whom to Ask for Aid"
 nesnd_india_diplomacy.7.d:0 "Several powers with interests in India have said they are willing to provide money and men to help [ROOT.GetCountry.GetName] found schools, factories and a modern army. The money is not a gift: to accept it is to incur a debt in diplomacy, and the advisers will bring their own country's ways into our schools, factories and barracks."
 nesnd_india_diplomacy.7.d_subject:0 "[ROOT.GetCountry.GetName] is a subject of [ROOT.GetCountry.GetOverlord.GetName], and the only foreign government we may ask for aid is our overlord. It is willing to provide money and men to help us found schools, factories and a modern army, and once we accept, we will owe it a debt in diplomacy."
 nesnd_india_diplomacy.7.f:0 "'Resolved: that envoys be sent abroad to ask for funds and advisers.'\n— Minutes of the council of state"
 nesnd_india_diplomacy.7.1:0 "[SCOPE.sCountry('india_aid_candidate_1').GetName]"
 nesnd_india_diplomacy.7.2:0 "[SCOPE.sCountry('india_aid_candidate_2').GetName]"
 nesnd_india_diplomacy.7.3:0 "[SCOPE.sCountry('india_aid_candidate_3').GetName]"
 nesnd_india_diplomacy.7.e:0 "Not Now"
 nesnd_india_aid_choice_cancel_tt:0 "No request is sent."
 nesnd_india_diplomacy.8.t:0 "Mutual Defence"
 nesnd_india_diplomacy.8.d:0 "[ROOT.GetCountry.GetName] has too few troops to hold its borders alone. $nesnd_lobby_name_fra$, $nesnd_lobby_name_usm$ and the Indian empire all keep armies on the subcontinent, and a defensive treaty with any one of them would give any neighbour with designs on our land something more to consider."
 nesnd_india_diplomacy.8.f:0 "'Should either party be attacked, the other shall send troops to its aid.'\n— Draft defensive treaty"
 nesnd_india_diplomacy.8.fra:0 "[SCOPE.sCountry('india_defence_fra').GetName]"
 nesnd_india_diplomacy.8.emp:0 "[SCOPE.sCountry('india_defence_emp').GetName]"
 nesnd_india_diplomacy.8.usm:0 "[SCOPE.sCountry('india_defence_usm').GetName]"
 nesnd_india_diplomacy.8.e:0 "Not Now"
 nesnd_india_defence_choice_cancel_tt:0 "No proposal is sent."
 nesnd_india_diplomacy.5.t:0 "Which Prince to Invite"
 nesnd_india_diplomacy.5.d:0 "The reform of [ROOT.GetCountry.GetName] is complete and the national community is growing firm, and the empire can now afford to take in the states. Several princes on good terms with us may be willing to hear our terms: to merge into the empire, or to keep their own courts and armies as dominions, while the empire pays for it and provides for their families."
 nesnd_india_diplomacy.5.f:0 "'The empire wishes to settle a lasting arrangement with your state. The terms will be presented in person by our envoy.'\n— Letter from the empire to a prince"
 nesnd_india_diplomacy.5.1:0 "[SCOPE.sCountry('india_union_candidate_1').GetName]"
 nesnd_india_union_invite_tt:0 "Send this prince an invitation. If the state is another country's subject, its overlord is asked first."
 nesnd_india_diplomacy.5.2:0 "[SCOPE.sCountry('india_union_candidate_2').GetName]"
 nesnd_india_diplomacy.5.3:0 "[SCOPE.sCountry('india_union_candidate_3').GetName]"
 nesnd_india_diplomacy.5.4:0 "[SCOPE.sCountry('india_union_candidate_4').GetName]"
 nesnd_india_diplomacy.5.e:0 "Not Now"
 nesnd_india_union_no_invite_tt:0 "No invitation is sent."
 nesnd_india_diplomacy.4.t:0 "What Kind of Aid"
 nesnd_india_diplomacy.4.d:0 "[SCOPE.sCountry('india_partner').GetName] has agreed to hear our request. The other government will pay the costs, and its advisers will serve here for four years. What remains is to decide what kind of men to ask for."
 nesnd_india_diplomacy.4.f:0 "'The persons requested shall be chosen by your government, shall serve in our country for four years, and shall be paid for by your government.'\n— Letter requesting aid"
 nesnd_india_diplomacy.4.1:0 "[GetStaticModifier('nesnd_india_french_teachers').GetName]"
 nesnd_india_mission_request_tt:0 "Send the request to [SCOPE.sCountry('india_partner').GetName]. If it is granted, we receive a grant of #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|D]#!, host its advisers for four years, and owe [SCOPE.sCountry('india_partner').GetName] an [concept_obligation]."
 nesnd_india_officer_upkeep_tt:0 "If it is granted, we give [SCOPE.sCountry('india_partner').GetName] [concept_military_access] for five years."
 nesnd_india_diplomacy.4.2:0 "[GetStaticModifier('nesnd_india_french_engineers').GetName]"
 nesnd_india_workshop_rate_tt:0 "If it is granted, [SCOPE.sCountry('india_partner').GetName] takes ownership of #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_workshop_levels')|0]#! levels of a $building_tooling_workshop$ in our country (one level per 25,000 of the grant, at most 5)."
 nesnd_india_diplomacy.4.3:0 "[GetStaticModifier('nesnd_india_french_officers').GetName]"
 nesnd_india_project.1.t:0 "What to Build"
 nesnd_india_project.1.d:0 "The court of [ROOT.GetCountry.GetName] means to undertake something of real use to the state. A university would train officials and engineers for us, a tooling workshop would free our craftsmen from imported tools, and a railway would carry grain and goods from the interior to the ports. If it is not yet clear where to begin, we could first bring in men who know the work to survey our land and roads."
 nesnd_india_project.1.f:0 "'The state intends to undertake one modern enterprise, the funds for which shall be raised separately.'\n— Resolution of the prince's court"
 nesnd_india_project.1.a:0 "[GetBuildingType('building_university').GetName]"
 nesnd_india_project_next_tt:0 "Next, choose the site."
 nesnd_india_project.1.b:0 "[GetBuildingType('building_tooling_workshop').GetName]"
 nesnd_india_project.1.c:0 "[GetBuildingType('building_railway').GetName]"
 nesnd_india_project.1.e:0 "Engineering Survey"
 nesnd_india_project_next_survey_tt:0 "Next, choose whom to ask for the survey."
 nesnd_india_project.none:0 "Drop It"
 nesnd_india_project_none_tt:0 "No project is undertaken."
 nesnd_india_project.2.t:0 "Choosing a Site"
 nesnd_india_project.2.d:0 "Several of our states could take the [ROOT.GetCountry.GetCustom('nesnd_india_project_name')]. The most populous need it most and will find workers most easily."
 nesnd_india_project.2.f:0 "'The circumstances of each state are reported faithfully above, for the court to decide.'\n— Report to the prince's court"
 nesnd_india_project.2.1:0 "[SCOPE.sState('india_project_site_1').GetName]"
 nesnd_india_project_next_funding_tt:0 "Next, choose who pays."
 nesnd_india_project.2.2:0 "[SCOPE.sState('india_project_site_2').GetName]"
 nesnd_india_project.2.3:0 "[SCOPE.sState('india_project_site_3').GetName]"
 nesnd_india_project.3.t:0 "Who Pays"
 nesnd_india_project.3.d_survey:0 "A survey needs outside experts, and we pay the fee. We can ask the richest government in India to send them, or a foreign government with interests in India."
 nesnd_india_project.3.d:0 "The [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] in [ROOT.GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName] needs money. We can pay for it ourselves, or ask the richest government in India or a foreign government with interests in India. Any outside money comes at a price: we would owe a debt, and part of any workshop or railway would belong to them."
 nesnd_india_project.3.f:0 "'The court is asked to direct how the funds shall be raised.'\n— Report to the prince's court"
 nesnd_india_project.3.a:0 "Pay for It Ourselves"
 nesnd_india_project_own_tt:0 "Our government builds one level through its own construction queue. If it is not finished within three years, the project is dropped."
 nesnd_india_project.3.b:0 "[SCOPE.sCountry('india_project_neighbour').GetName]"
 nesnd_india_project.3.c:0 "[SCOPE.sCountry('india_project_foreign').GetName]"
 nesnd_india_project.4.t:0 "Funding Agreed"
 nesnd_india_project.4.d_survey:0 "[SCOPE.sCountry('india_partner').GetName] has agreed to send engineers to survey our land, and the fee has been paid."
 nesnd_india_project.4.d_grant:0 "[SCOPE.sCountry('india_partner').GetName] has sent the money, and work on the university in [SCOPE.sState('india_project_site').GetName] can begin."
 nesnd_india_project_term_tt:0 "For five years, [SCOPE.sState('india_project_site').GetName] takes no other funding agreement."
 nesnd_india_project.4.d_stake:0 "[SCOPE.sCountry('india_partner').GetName] has paid for one level of [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] in [SCOPE.sState('india_project_site').GetName], and that level belongs to [SCOPE.sCountry('india_partner').GetName]."
 nesnd_india_project.4.f:0 "'Our government agrees to provide the funds your state requested. The terms are set out in the annex.'\n— The reply"
 nesnd_india_project_agreed_tt:0 "The agreement takes effect."
 nesnd_india_project.5.t:0 "Project Dropped"
 nesnd_india_project.5.d_forbid:0 "[SCOPE.sCountry('india_consent_lord').GetName] has forbidden us to make this agreement with [SCOPE.sCountry('india_partner').GetName], and the [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] has been dropped."
 nesnd_india_project.5.d_decline:0 "[SCOPE.sCountry('india_partner').GetName] has refused to pay, and the [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] has been dropped."
 nesnd_india_project.5.d_silent:0 "No answer came in time, and the [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] has been dropped."
 nesnd_india_project.5.d_void:0 "The conditions for the project no longer hold: one side has gone to war, or the chosen state can no longer be built in. The [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] has been dropped."
 nesnd_india_project.5.d_expired:0 "The works in [SCOPE.sState('india_project_site').GetName] have not been finished in three years, and the [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] has been dropped."
 nesnd_india_project.5.f:0 "'The enterprise is postponed.'\n— Resolution of the prince's court"
 nesnd_india_project_failed_tt:0 "The project is dropped, and a new one may be started."
 nesnd_india_project_expired_tt:0 "The project is dropped, and a new one may be started."
 nesnd_india_project.6.t:0 "Works Completed"
 nesnd_india_project.6.d:0 "The [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] in [SCOPE.sState('india_project_site').GetName] has been completed."
 nesnd_india_project.6.f:0 "'The works are complete, and are hereby reported.'\n— Report of the superintendent of works"
 nesnd_india_project_done_tt:0 "One more local project completed."
 nesnd_india_project.7.t:0 "Funding Agreement Expires"
 nesnd_india_project.7.d:0 "The funding agreement of [SCOPE.sCountry('india_partner').GetName] in [SCOPE.sState('india_project_site').GetName] has run its five years."
 nesnd_india_project.7.f:0 "'The agreement has expired, and neither party has any claim outstanding.'\n— Note to the agreement"
 nesnd_india_project_term_over_tt:0 "[SCOPE.sState('india_project_site').GetName] may take a new funding agreement."
 nesnd_india_union.1.t:0 "A State Joins the Empire"
 nesnd_india_union.1.d_former_merge:0 "[SCOPE.sCountry('india_union_prince').GetName] has left us and merged into [SCOPE.sCountry('india_union_empire').GetName]. [SCOPE.sCountry('india_union_empire').GetName] has paid us the agreed compensation."
 nesnd_india_union.1.d_former_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName] has left us and become a dominion of [SCOPE.sCountry('india_union_empire').GetName]. [SCOPE.sCountry('india_union_empire').GetName] has paid us the agreed compensation."
 nesnd_india_union_host_paid_tt:0 "We pay #v [SCOPE.GetValue('india_union_price')|D]#! and bear [GetStaticModifier('nesnd_india_princely_pensions').GetName] for ten years."
 nesnd_india_union_prince_paid_tt:0 "Our state receives #v [SCOPE.GetValue('india_union_price')|D]#!."
 nesnd_india_union.1.d_host_merge:0 "[SCOPE.sCountry('india_union_prince').GetName] has merged into [ROOT.GetCountry.GetName]. Its royal family will be provided for by us from now on."
 nesnd_india_union.1.d_host_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName] has become a dominion of [ROOT.GetCountry.GetName]. The prince keeps the state's court, treasury and army, and defers to us in foreign affairs."
 nesnd_india_union.1.d_prince_dominion:0 "[ROOT.GetCountry.GetName] has become a dominion of [SCOPE.sCountry('india_union_empire').GetName]. The prince keeps the state's court, treasury and army, and defers to the empire in foreign affairs."
 nesnd_india_union.1.f:0 "'From this day our state shares the fortunes of the empire.'\n— Instrument of accession"
 nesnd_india_union_merged_tt:0 "[SCOPE.sCountry('india_union_prince').GetName] merges into [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union_dominion_tt:0 "[SCOPE.sCountry('india_union_prince').GetName] becomes a [concept_dominion] of [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union_compensated_tt:0 "We receive #v [SCOPE.GetValue('india_union_price')|D]#! in compensation."
 nesnd_india_union_paid_former_tt:0 "We pay [SCOPE.sCountry('india_union_former').GetName] #v [SCOPE.GetValue('india_union_price')|D]#! in compensation."
 nesnd_india_union.2.t:0 "No Accession"
 nesnd_india_union.2.d_we_decline_invite:0 "We have refused the invitation of [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_union.2.d_we_decline_request:0 "We have refused the request of [SCOPE.sCountry('india_sender').GetName] to join us."
 nesnd_india_union.2.d_invite_declined:0 "[SCOPE.sCountry('india_union_decliner').GetName] has refused our invitation."
 nesnd_india_union.2.d_request_declined:0 "[SCOPE.sCountry('india_union_decliner').GetName] has refused our request to join."
 nesnd_india_union.2.f:0 "'We are unable to accept your kind offer.'\n— The reply"
 nesnd_india_union_unchanged_tt:0 "Relations between the two countries are unchanged."
 nesnd_india_union.3.t:0 "The Overlord Refuses"
 nesnd_india_union.3.d_invite_forbid:0 "[SCOPE.sCountry('india_consent_lord').GetName] has forbidden [SCOPE.sCountry('india_partner').GetName] to accept our invitation."
 nesnd_india_union.3.d_invite_silent:0 "[SCOPE.sCountry('india_consent_lord').GetName] gave no answer in time, and our invitation to [SCOPE.sCountry('india_partner').GetName] has lapsed."
 nesnd_india_union.3.d_invite_void:0 "Our invitation could not reach [SCOPE.sCountry('india_partner').GetName]: one side has become involved in a war or a diplomatic play, or [SCOPE.sCountry('india_partner').GetName] no longer exists."
 nesnd_india_union.3.d_ask_forbid:0 "[SCOPE.sCountry('india_consent_lord').GetName] has forbidden us to join the empire of [SCOPE.sCountry('india_partner').GetName]."
 nesnd_india_union.3.d_ask_silent:0 "[SCOPE.sCountry('india_consent_lord').GetName] gave no answer in time, and our request to join [SCOPE.sCountry('india_partner').GetName] has lapsed."
 nesnd_india_union.3.d_ask_void:0 "Our request could not reach [SCOPE.sCountry('india_partner').GetName]: one side has become involved in a war or a diplomatic play, or the other side no longer exists."
 nesnd_india_union.3.f:0 "'Our government cannot agree to this.'\n— The overlord's reply"
 nesnd_india_union_no_consent_tt:0 "The request lapses."
 nesnd_india_union_wait_tt:0 "No new request can be made for six months."
 nesnd_india_union.4.t:0 "Joining the Empire"
 nesnd_india_union.4.d:0 "[SCOPE.sCountry('india_union_host').GetName] is the richest empire in India. The prince may ask for the state to be merged into the empire, which would provide for the royal family, or ask to become a dominion, keeping the state's own court, treasury and army and deferring to the empire only in foreign affairs."
 nesnd_india_union.4.f:0 "'Our state wishes to join the empire, and submits its terms for your decision.'\n— Letter from a prince to the empire"
 nesnd_india_union.4.merge:0 "Ask to Merge"
 nesnd_india_union_ask_merge_tt:0 "Ask [SCOPE.sCountry('india_union_host').GetName] to annex our state. If granted, our state ceases to exist and [SCOPE.sCountry('india_union_host').GetName] bears [GetStaticModifier('nesnd_india_princely_pensions').GetName] for ten years."
 nesnd_india_union_ask_consent_tt:0 "Our overlord must consent first."
 nesnd_india_union_ask_wait_tt:0 "Once sent, the request is answered within 45 days."
 nesnd_india_union.4.dominion:0 "Ask to Become a Dominion"
 nesnd_india_union_ask_not_own_subject_tt:0 "We are not a subject of [SCOPE.sCountry('india_union_host').GetName] (a subject may only ask to merge)"
 nesnd_india_union_ask_dominion_tt:0 "Ask to become a [concept_dominion] of [SCOPE.sCountry('india_union_host').GetName]. If granted, our state keeps its government, laws, treasury and army, receives #v [SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|D]#!, and gains [GetStaticModifier('nesnd_india_prince_privileges').GetName]."
 nesnd_india_union.4.later:0 "Not Yet"
 nesnd_india_union_ask_later_tt:0 "No request is made."
 nesnd_india_revolt.1.t:0 "Independence Declared"
 nesnd_india_revolt.1.d:0 "The insurgents in [SCOPE.sState('india_case_state').GetName] have declared independence from [SCOPE.sCountry('india_case_owner').GetName] and set up a republic, governed by an assembly of local men of property and funded by [SCOPE.sCountry('india_sponsor').GetName]. [SCOPE.sCountry('india_case_owner').GetName] will not stand by, and an army to take the state back will soon be on the march."
 nesnd_india_revolt.1.f:0 "'From this day the affairs of this land shall be decided by its own people.'\n— Declaration of independence"
 nesnd_india_revolt_ack:0 "To Arms"
 nesnd_india_revolt_ack_tt:0 "Our former ruler will start a diplomatic play to take our country back."

 # Independence
 nesnd_india_indep_autonomy_desc:0 "Formally ask our overlord for greater [concept_autonomy]."
 nesnd_india_indep_play:0 "Press for Independence"
 nesnd_india_indep_play_desc:0 "Start a [concept_diplomatic_play] for independence against our overlord."
 nesnd_india_indep_play_tt:0 "Start a diplomatic play for independence. No other can be started for six months."
 nesnd_india_indep_play_cooldown_tt:0 "We have not started a play for independence in the last six months"
 nesnd_india_indep_no_pending_tt:0 "We have no request awaiting an answer"
 nesnd_india_indep_protectorate_tt:0 "We may now start a diplomatic play for independence ourselves."
 nesnd_india_diplomacy.10.t:0 "From Puppet to Protectorate"
 nesnd_india_diplomacy.10.d:0 "[SCOPE.sCountry('india_indep_overlord').GetName] has made [ROOT.GetCountry.GetName] a protectorate instead of a puppet. We remain a subject, but we may now handle more of our own affairs."
 nesnd_india_diplomacy.10.f:0 "'A protectorate shall manage its own internal affairs.'\n— Revision of the subject treaty"
 nesnd_india_diplomacy.10.a:0 "A Step Forward"
 nesnd_india_indep_cases_none:0 "\nNone"
 nesnd_india_indep_case_empty:0 ""
 nesnd_india_indep_case_actor_gone:0 "A country that no longer exists"
 nesnd_india_indep_case_arms:0 "stockpiling arms"
 nesnd_india_indep_case_movement_unknown:0 "funding a political movement"
