 nesnd_india_uprising_status:0 "Local resistance awaits its opportunity."
 nesnd_india_revolt_war:0 "Defending Local Independence"
 nesnd_india_revolt_war_reason:0 "Our former ruler demands the return of the land taken in the rising, and our new government demands recognition of its independence. We accepted foreign funding, but that assistance gave the sponsoring country no right to govern this land."
 nesnd_india_revolt_resolved_tt:0 "The dispute has ended, and we retain the territory of the rising as an independent state."
 nesnd_india_revolt_survived:0 "Independence Preserved"
 nesnd_india_mission_button_desc:0 "Ask this country to send advisers and provide a grant."
 nesnd_india_choose_mission_tt:0 "Choose teachers, engineers or military instructors."
 nesnd_india_diplomatic_desc:0 "Submit a formal request and let them answer."
 nesnd_india_request_tt:0 "The request goes to the other government, which will reply within #v 45#! days; if it accepts, the terms take effect. We may not open another negotiation for six months. If a request for greater autonomy is refused, our [concept_liberty_desire] rises by #v 10#!."
 nesnd_india_union_request_tt:0 "Choose a princely state and invite it to join us. It may merge into our country, become our [concept_dominion], or decline. If it is another country's [concept_subject], the invitation first goes to its [concept_overlord] for consent. If it accepts, we pay a settlement allowance and take on one more princely pension. Each state taken in adds one pension and restarts the ten years. If it leaves a former overlord to join us, we pay that overlord compensation equal to the allowance."
 nesnd_india_project_start_desc:0 "Build one of [GetBuildingType('building_university').GetName], [GetBuildingType('building_tooling_workshop').GetName] or [GetBuildingType('building_railway').GetName] in one [concept_state] of ours, or first invite another country’s engineers to make a survey."
 nesnd_india_project_start_tt:0 "Choose the project and the place, then decide whether we pay ourselves or ask the government of another princely state, of Hindustan (or of India, Dravida Nadu or a like empire), or of a foreign country. Nothing is spent until the choice is made."
 nesnd_india_project_withdraw_button_desc:0 "Stop waiting for an answer."
 nesnd_india_project_waiting_tt:0 "Our request for the project is awaiting an answer"
 nesnd_india_project_withdraw_tt:0 "The request is void and needs no answer. We still may not open another negotiation until six months after the request was made."
 nesnd_india_union_ask_button_desc:0 "Ask [SCOPE.sCountry('nesnd_label_india_empire').GetName] to take us in. We choose how we would join: by merging, or as its [concept_dominion]."
 nesnd_india_union_ask_button_tt:0 "Choose how we would join."
 nesnd_india_contact_desc:0 "Local preparations for the uprising depend on financial support from our government."
 nesnd_india_contact_tt:0 "Opening contact costs @money!5,000 and increases [concept_government_wage] expenses by #r [GetStaticModifier('nesnd_india_contact_cost').GetValueFor('country_government_wages_mult')|0%]#!. Preparations can advance if local [concept_turmoil] reaches #v 15%#! or [concept_sol] falls below #v 10#!. Progress depends on [concept_market_access], [concept_turmoil] and the presence of [GetStaticModifier('nesnd_india_french_officers').GetName]. Pausing contact ends the upkeep and reduces progress by #r 2#! each month."
 nesnd_india_pause_tt:0 "Suspend contact and stop paying its upkeep. Local preparation falls by #r 2#! each month."
 nesnd_india_contact_cost:0 "Southern Organisation Fund"
 nesnd_india_resume_tt:0 "Resume contact and maintenance without paying the initial fee again."
 nesnd_india_launch_tt:0 "Pay @money!20,000 to support the rising; the money goes to the insurgents. A local state is formed and raises #v 2#! to #v 8#! battalions of irregular infantry according to its population. Its former ruler starts a [concept_diplomatic_play] to recover this [concept_state], and the insurgents demand its humiliation. If we are not a subject, we join the insurgents' side. Sponsorship does not bring their land under our rule."
 nesnd_india_suppression_desc:0 "Devote additional policing resources to disrupting local organisations."
 nesnd_india_suppression_tt:0 "Pay @money!10,000 to reduce local preparation by #g 25#!. A fully prepared organisation falls back to a suspended state. This action cannot be repeated for six months."
 nesnd_india_french_teachers:0 "Visiting Teachers"
 nesnd_india_teaching_mission:0 "Teaching Mission Abroad"
 nesnd_india_french_engineers:0 "Visiting Engineers"
 nesnd_india_princely_pensions:0 "Princely Pensions"
 nesnd_india_survey:0 "Engineering Survey and Training"
 nesnd_india_project_ask_survey_tt:0 "If they agree, we pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_survey_fee')|0]."
 nesnd_india_project_ask_grant_tt:0 "We ask their government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0] towards the foundation. They take no ownership. If they agree, the work joins our government’s construction queue, we owe them an [concept_obligation], and [concept_relations] between us improve by #g 25#!."
 nesnd_india_project_ask_stake_tt:0 "We ask their government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0]. If they agree, one level is built at once and belongs to their government. We receive the grant, owe them an [concept_obligation], and [concept_relations] between us improve by #g 25#!."
 nesnd_india_project_consent_tt:0 "We are a subject of [SCOPE.sCountry('india_project_overlord').GetName], whose consent must come first. Only then is the request passed to the other government."
 nesnd_india_project_wait_tt:0 "Each government has thirty days to answer. We may open another negotiation in six months."
