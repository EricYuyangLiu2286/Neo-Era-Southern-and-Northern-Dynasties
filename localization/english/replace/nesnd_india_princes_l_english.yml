 IR3:0 "$STATE_MADRAS$"
 IR3_ADJ:0 "$STATE_MADRAS$"
 dp_nesnd_india_madras:0 "The $STATE_MADRAS$ Rising"
 dp_nesnd_india_madras_desc:0 "$STATE_MADRAS$ has declared independence, and its former ruler moves to take it back."
 IR4:0 "$STATE_MYSORE$"
 IR4_ADJ:0 "$STATE_MYSORE$"
 dp_nesnd_india_mysore:0 "The $STATE_MYSORE$ Rising"
 dp_nesnd_india_mysore_desc:0 "$STATE_MYSORE$ has declared independence, and its former ruler moves to take it back."
