 nesnd_india_indep_case_1_actor_name_live:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_case_1_actor').GetCountry.GetName]"
 nesnd_india_indep_case_1_actor_name_former:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_case_1_definition').GetCountryDefinition.GetName]"
 nesnd_india_indep_case_1_movement_live:0 "funding [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_case_1_movement').GetPoliticalMovement.GetName]"
 nesnd_india_indep_case_1_movement_gone:0 "funding a movement since dissolved"
 nesnd_india_indep_cases_order_1:0 "[ROOT.GetCountry.GetCustom('nesnd_india_indep_case_1')][ROOT.GetCountry.GetCustom('nesnd_india_indep_case_3')][ROOT.GetCountry.GetCustom('nesnd_india_indep_case_2')]"
