l_english:
 nesnd_india_seek_aid_button:0 "Send Mission for Aid"
 nesnd_india_seek_aid_button_desc:0 "Send a mission to another government or our [concept_overlord] to ask for advisers and a grant."
 nesnd_india_seek_aid_button_tt:0 "First choose whom to approach, then decide whether to ask for teachers, engineers or military instructors. Nothing is sent until you choose."
 nesnd_india_seek_aid_target_tt:0 "There is an eligible government we can ask for aid"
 nesnd_india_partner_not_busy_tt:0 "The other government is not answering another request at present"
 nesnd_india_defence_button:0 "Seek Mutual Defence"
 nesnd_india_defence_button_desc:0 "Propose a [concept_defensive_pact] to a power in the region."
 nesnd_india_defence_button_tt:0 "First choose a government that can sign a [concept_defensive_pact] with us now, then make the formal request."
 nesnd_india_defence_target_exists_tt:0 "At least one power in the region can sign a [concept_defensive_pact] with us now"
 nesnd_india_foreign_status:0 "Choose where to send the mission."
 nesnd_india_uprising_status:0 "Local resistance awaits its opportunity."
 nesnd_india_revolt_war:0 "Defending Local Independence"
 nesnd_india_revolt_war_reason:0 "Our former ruler demands the return of the land taken in the rising, and our new government demands recognition of its independence. We accepted foreign funding, but that assistance gave the sponsoring country no right to govern this land."
 nesnd_india_revolt_resolved_tt:0 "The dispute has ended, and we retain the territory of the rising as an independent state."
 nesnd_india_revolt_survived:0 "Independence Preserved"
 nesnd_india_choose_mission_tt:0 "Choose teachers, engineers or military instructors."
 nesnd_india_diplomatic_desc:0 "Submit a formal request and let them answer."
 nesnd_india_request_tt:0 "The request goes to the other government, which will reply within #v 45#! days. If it accepts, the terms take effect. We may not open another negotiation for six months."
 nesnd_india_request_liberty_tt:0 "If the request is refused, our [concept_liberty_desire] rises by #v 10#! and [concept_relations] between us worsen by #r 30#!."
 nesnd_india_defence_upkeep_tt:0 "If they agree, a [concept_defensive_pact] is concluded. While it stands, each side bears a base [concept_influence] upkeep of @inf!#v [GetArticleType('defensive_pact').GetCost|0]#!."
 nesnd_india_union_request_tt:0 "Choose a [concept_princely_state] and invite it to join us. It may merge into our country, become our [concept_dominion], or decline. If it is another country's [concept_subject], the invitation first goes to its [concept_overlord] for consent. If it accepts, we pay a settlement allowance and take on one more princely pension. Each state taken in adds one pension and restarts the ten years. The pensions stop at #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_pension_cap')|0]#! shares. If it leaves a former overlord to join us, we pay that overlord compensation equal to the allowance."
 nesnd_india_pension_full_tt:0 "The princely pensions already stand at the maximum of #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_pension_cap')|0]#! shares. Taking in another state adds no share and only restarts the ten years."
 nesnd_india_project_start_desc:0 "Build one of [GetBuildingType('building_university').GetName], [GetBuildingType('building_tooling_workshop').GetName] or [GetBuildingType('building_railway').GetName] in one [concept_state] of ours, or first invite another country’s engineers to make a survey."
 nesnd_india_project_start_tt:0 "Choose the project and the place, then decide whether we pay ourselves or ask the government of another [concept_princely_state], of Hindustan (or of India, Dravida Nadu or a like empire), or of a foreign country. Nothing is spent until the choice is made."
 nesnd_india_project_withdraw_button_desc:0 "Stop waiting for an answer."
 nesnd_india_project_waiting_tt:0 "Our request for the project is awaiting an answer"
 nesnd_india_project_withdraw_tt:0 "The request is void and needs no answer. We still may not open another negotiation until six months after the request was made."
 nesnd_india_union_ask_button_desc:0 "Ask [SCOPE.sCountry('nesnd_label_india_empire').GetName] to take us in. We choose how we would join: by merging, or as its [concept_dominion]."
 nesnd_india_union_ask_button_tt:0 "Choose how we would join."
 nesnd_india_contact_desc:0 "Local preparations for the uprising depend on financial support from our government."
 nesnd_india_contact_button:0 "Contact a Local Organisation"
 nesnd_india_resume_button:0 "Resume Contact"
 nesnd_india_launch_button:0 "Support the Rising"
 nesnd_india_abandon_button:0 "Abandon Contact"
 nesnd_india_suppress_button:0 "Hunt Down Secret Organisations"
 nesnd_india_contact_any_target_tt:0 "At least one region has a local organisation we can contact"
 nesnd_india_suppress_target_tt:0 "The search is aimed at [SCOPE.sState('india_suppress_state').GetName], where the organisation is furthest along."
 nesnd_india_uprising_failed_tt:0 "A rising we paid for has just failed"
 nesnd_india_revolt.3.t:0 "Finding Our Contacts"
 nesnd_india_revolt.3.d:0 "Our envoys have returned with news: in several regions under colonial rule, local organisations are willing to take money from [ROOT.GetCountry.GetName] in secret. Our people and our funds are limited, and we must choose one place to begin."
 nesnd_india_revolt.3.f:0 "'The people there know our couriers, and they know the colonial police spies too.'\n— An envoy's report"
 nesnd_india_revolt.3.circars:0 "Contact Circars"
 nesnd_india_revolt.3.kurnool:0 "Contact Kurnool"
 nesnd_india_revolt.3.madras:0 "Contact Madras"
 nesnd_india_revolt.3.mysore:0 "Contact Mysore"
 nesnd_india_revolt.3.travancore:0 "Contact Travancore"
 nesnd_india_revolt.3.gujarat:0 "Contact Gujarat"
 nesnd_india_revolt.3.e:0 "Not yet."
 nesnd_india_contact_tt:0 "Opening contact costs a month of our income and increases [concept_government_wage] expenses by #r [GetStaticModifier('nesnd_india_contact_cost').GetValueFor('country_government_wages_mult')|0%]#!. Preparations can advance if local [concept_turmoil] reaches #v 15%#! or [concept_sol] falls below #v 10#!. Progress depends on [concept_market_access], [concept_turmoil] and the presence of [GetStaticModifier('nesnd_india_french_officers').GetName]. Pausing contact ends the upkeep and reduces progress by #r 2#! each month."
 nesnd_india_contact_cost:0 "Local Organisation Fund"
 nesnd_india_resume_tt:0 "Contact resumes, and so does its monthly upkeep. The opening fee is not paid again."
 nesnd_india_launch_tt:0 "Pay a quarter of our income to support the rising. The money goes to the insurgents. A local state is formed and raises #v 2#! to #v 8#! battalions of irregular infantry according to its population. Its former ruler starts a [concept_diplomatic_play] to recover this [concept_state], and the insurgents demand its humiliation. If we are not a [concept_subject] and are not at war, we join the insurgents' side. Sponsorship does not bring their land under our rule."
 nesnd_india_case_popular_ready_tt:0 "Local [concept_turmoil] is at least #v 25%#!, or an Indian culture in this state has an active cultural minority [concept_political_movement] in its ruling country"
 nesnd_india_suppression_desc:0 "Devote additional policing resources to disrupting local organisations."
 nesnd_india_suppression_tt:0 "Pay a month of our income, at most @money!50,000, to reduce local preparation by #g 25#!. An organisation that had finished preparing stalls again, and its sponsor must resume contact. This action cannot be repeated for six months."
 nesnd_india_abandon_tt:0 "Abandon contact in this region. Local preparation is lost and the contact upkeep stops. We cannot contact this region again for #v 36#! months, but we may contact another."
 nesnd_india_case_watch:0 "Policing Local Organisations"
 nesnd_india_case_watch_reason:0 "Hindustan or an empire that succeeds it is paying local organisations in the [Concept('concept_state', '$concept_states|q$')] of [ROOT.GetCountry.GetName] in $region_north_india$ and $region_south_india$ to prepare a rising. Once their preparations are complete, that empire may fund the rising at any time: a local state is then formed, and we must recover it through a [concept_diplomatic_play]. Additional policing can slow their preparations."
 nesnd_india_case_watch_open_tt:0 "Local organisations in our states are preparing a rising"
 nesnd_india_case_watch_closure_tt:0 "We are no longer $USM$, nor its [concept_subject] $TZ1$"
 nesnd_india_case_watch_conclusion:0 "Our standing in these regions has changed, and the policing ends."
 nesnd_india_french_teachers:0 "Visiting Teachers"
 nesnd_india_teaching_mission:0 "Teaching Mission Abroad"
 nesnd_india_french_engineers:0 "Visiting Engineers"
 nesnd_india_princely_pensions:0 "Princely Pensions"
 nesnd_india_survey:0 "Engineering Survey and Training"
 nesnd_india_project_ask_survey_tt:0 "If they agree, we pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_survey_fee')|K]."
 nesnd_india_project_ask_grant_tt:0 "We ask their government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|K] towards the foundation. They take no ownership. If they agree, the work joins our government’s construction queue, we owe them an [concept_obligation], and [concept_relations] between us improve by #g 25#!. If it is not finished within three years, it is no longer followed as a local project."
 nesnd_india_project_ask_stake_tt:0 "We ask their government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|K]. If they agree, one level is built at once and belongs to their government. We receive the grant, owe them an [concept_obligation], and [concept_relations] between us improve by #g 25#!."
 nesnd_india_project_consent_tt:0 "We are a [concept_subject] of [SCOPE.sCountry('india_project_overlord').GetName], whose consent must come first. Only then is the request passed to the other government."
 nesnd_india_project_wait_tt:0 "Each government has thirty days to answer. We may open another negotiation in six months."
