 # ==== India batch 12: outcomes on the princes' and subjects' side ====
 nesnd_india_prince_strong:0 "A Self-Reliant State"
 nesnd_india_prince_privileges:0 "Princely Privileges"
 nesnd_india_south_settled:0 "The South Settled"
 nesnd_india_uprising_spent:0 "The Fires Gone Out"
 nesnd_india_south_calm:0 "Quiet in the South"
 nesnd_india_indep_self_reliant:0 "Standing Alone"
 nesnd_india_lord_calm:0 "Subjects at Peace"
 nesnd_india_prince_strong_conclusion:0 "[ROOT.GetCountry.GetName] answers to no overlord and has completed three local projects."
 nesnd_india_prince_projects_tt:0 "Local projects completed: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_projects_done_value')|0] / 3"
 nesnd_india_prince_joined_conclusion:0 "[ROOT.GetCountry.GetName] has joined [ROOT.GetCountry.GetOverlord.GetName] as a [concept_dominion]."
 nesnd_india_prince_joined_tt:0 "We have joined an Indian empire as a [concept_dominion]"
 nesnd_india_prince_joined_effect_tt:0 "We keep our own government, laws, treasury and army."
 nesnd_india_south_settled_conclusion:0 "All six regions of the rising are now held by countries whose capital lies in India."
 nesnd_india_south_settled_tt:0 "Every [concept_state] in $STATE_CIRCARS$, $STATE_KURNOOL$, $STATE_MADRAS$, $STATE_MYSORE$, $STATE_TRAVANCORE$ and $STATE_GUJARAT$ is held by a country whose capital lies in India"
 nesnd_india_uprising_spent_conclusion:0 "A rising we paid for has failed."
 nesnd_india_uprising_spent_goal_tt:0 "The ruler this rising was aimed at now regards us as an enemy."
 nesnd_india_uprising_quiet_tt:0 "For five years we pay for no rising, and '$nesnd_india_uprising$' does not appear."
 nesnd_india_uprising_quiet_cond_tt:0 "We are not within the five years in which we pay for no rising"
 nesnd_india_revolt_former_claim_tt:0 "Our former ruler lays a [concept_claim] to this region."
 nesnd_india_revolt_former_goal_tt:0 "Our former ruler now regards the empire that paid for the rising as an enemy."
 nesnd_india_revolt_failed_effect_tt:0 "Once our former ruler took the region back, radicals among the people of our primary cultures there rose by #r 20%#!."
 nesnd_india_revolt.2_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n• Join the empire that paid for the rising as its [concept_dominion], keeping our own government, laws, treasury and army, and gain '$nesnd_india_prince_privileges$'.\n• Stand alone: #g +10#! [concept_fervor] target for our primary cultures for fifty years.#!"
 nesnd_india_revolt.2.t:0 "After the Rising"
 nesnd_india_revolt.2.d:0 "[ROOT.GetCountry.GetName] has held the land taken in the rising, and its former ruler can no longer take it back. The rising was paid for by an Indian empire, and that empire wants us to join it. Many of the insurgents hold that, having just thrown off foreign rule, they should not bow to another country."
 nesnd_india_revolt.2.f:0 "'The taxes of this state are raised by this state, and its army is commanded by this state.'\n— A resolution of the local assembly"
 nesnd_india_revolt.2.a:0 "Join [SCOPE.sCountry('india_revolt_sponsor').GetName] as a dominion."
 nesnd_india_revolt.2.a_tt:0 "We keep our own government, laws, treasury and army."
 nesnd_india_revolt.2.b:0 "Bow to no one."
 nesnd_india_indep_fervor_tt:0 "#g +10#! [concept_fervor] target for fifty years for each of our primary cultures."
 nesnd_india_south_calm_conclusion:0 "For ten years no local organisation under our rule has prepared a rising against us."
 nesnd_india_south_calm_tt:0 "Ten years have passed without a local organisation preparing a rising against us"
 nesnd_india_south_calm_cooldown_tt:0 "This reward is not given again for ten years."
 nesnd_india_indep.12_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n• Befriend the Indian empire we are on the best terms with: #g +30#! relations with it.\n• Stand alone: #g +5#! [concept_legitimacy] permanently, and #g +10#! [concept_fervor] target for our primary cultures for fifty years.\n• Turn to a rival of our former overlord (the great or major power on the worst terms with it): #g +30#! relations with it, and its [concept_involvement] in the [concept_strategic_region] of our capital rises by #g 1000#! for a time.#!"
 nesnd_india_indep.12.t:0 "After Independence"
 nesnd_india_indep.12.d:0 "[ROOT.GetCountry.GetName] has thrown off its overlord's control. The former overlord will not easily give up this land, and the new government must decide on whom it will rely to keep its independence. Some urge friendship with an Indian empire, some trust only our own army and treasury, and others would turn to the former overlord's rivals."
 nesnd_india_indep.12.f:0 "'From this day our country conducts its own affairs at home and abroad, under the control of no foreign power.'\n— The declaration of independence"
 nesnd_india_indep.12.a:0 "Seek the friendship of [SCOPE.sCountry('india_free_empire').GetName]."
 nesnd_india_indep.12.b:0 "Rely on our own army and treasury."
 nesnd_india_indep.12.c:0 "Turn to [SCOPE.sCountry('india_free_rival').GetName]."
 nesnd_india_indep_rival_involvement_tt:0 "The [concept_involvement] of [SCOPE.sCountry('india_free_rival').GetName] in the [concept_strategic_region] of our capital rises by #g 1000#! for a time."
 nesnd_india_indep.13.t:0 "Independence Thwarted"
 nesnd_india_indep.13.d:0 "The [concept_diplomatic_play] by which [ROOT.GetCountry.GetName] sought independence has failed, and we remain our overlord's [concept_subject]. Most of the money and stores gathered for it are spent, and the supporters of independence in the capital are bitterly disappointed with the government."
 nesnd_india_indep.13.f:0 "'Our demands have been refused, but they have not been forgotten.'\n— A clandestine leaflet"
 nesnd_india_indep.13.a:0 "Gather our strength again."
 nesnd_india_indep.13.a_tt:0 "Both bars of '$nesnd_india_indep$' lose half their progress. The journal continues, and we may gather strength again."
 nesnd_india_lord_calm_conclusion:0 "For ten years no subject has come to the brink of independence."
 nesnd_india_lord_calm_tt:0 "Ten years have passed without a subject's [concept_liberty_desire] reaching #v 75#!"
 nesnd_india_lord_calm_cooldown_tt:0 "This reward is not given again for ten years."
 nesnd_india_indep_lord_can_pay_tt:0 "The overlord's [concept_gold_reserves] cover a quarter of this subject's income"

 # Refusal consequences and Princely League (batch 14)
 nesnd_india_union_reply_decline_capital_claim_tt:0 "[SCOPE.sCountry('india_sender').GetName] gains a [concept_claim] on our capital [concept_state]. A second refusal within ten years gives it claims on all our remaining Indian states."
 nesnd_india_union_reply_decline_all_claim_tt:0 "On this second refusal within ten years, [SCOPE.sCountry('india_sender').GetName] gains a [concept_claim] on all our remaining Indian [Concept('concept_state','$concept_states|q$')]."
 nesnd_india_union_reply_decline_pact_tt:0 "The other members of the Princely League lose #r 10#! [concept_relations] with [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_union_declined_we_capital_claim_tt:0 "[SCOPE.sCountry('india_sender').GetName] has gained a [concept_claim] on our capital [concept_state]."
 nesnd_india_union_declined_we_all_claim_tt:0 "[SCOPE.sCountry('india_sender').GetName] has gained a [concept_claim] on all our remaining Indian [Concept('concept_state','$concept_states|q$')]."
 nesnd_india_union_declined_empire_capital_claim_tt:0 "We have gained a [concept_claim] on the capital [concept_state] of [SCOPE.sCountry('india_union_decliner').GetName]. We may not open another negotiation for six months from the invitation."
 nesnd_india_union_declined_empire_all_claim_tt:0 "We have gained a [concept_claim] on all remaining Indian [Concept('concept_state','$concept_states|q$')] of [SCOPE.sCountry('india_union_decliner').GetName]. We may not open another negotiation for six months from the invitation."
 nesnd_india_union_declined_pact_tt:0 "The other members of the Princely League have lost #r 10#! [concept_relations] with [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_project_declined_rift_tt:0 "The request ends here. We gain a negative [concept_diplomatic_catalyst] towards [SCOPE.sCountry('india_partner').GetName], and [concept_relations] between us fall by #r 15#!."
 nesnd_india_project_forbid_rift_tt:0 "The request ends here. We gain a negative [concept_diplomatic_catalyst] towards [SCOPE.sCountry('india_consent_lord').GetName], and [concept_relations] between us fall by #r 15#!."
 nesnd_india_union:0 "The Princely League"
 nesnd_india_union_reason:0 "Facing the pressure of imperial annexation, [ROOT.GetCountry.GetName] and other independent [Concept('concept_princely_state','$concept_princely_states|q$')] may bind themselves by defensive [Concept('concept_treaty','$concept_treaties|q$')] for mutual protection. The league pact is established once at least three independent princely states stand among its members."
 nesnd_india_union_status_open:0 "We have not yet joined the Princely League. Independent princely members in the league: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_union_member_count')|0]#! / 3."
 nesnd_india_union_status_member:0 "We stand among the members of the Princely League. Independent princely members in the league: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_union_member_count')|0]#! / 3."
 nesnd_india_union_invite_button:0 "Invite to a Mutual-Defence Pact"
 nesnd_india_union_invite_button_desc:0 "Send an invitation for mutual defence to the [concept_princely_state] on the best terms with us that has no defensive [concept_treaty] with us yet."
 nesnd_india_union_invite_cooldown_tt:0 "Twelve months have passed since our last mutual-defence invitation"
 nesnd_india_union_invite_target_tt:0 "Another [concept_princely_state] is at peace and has no defensive [concept_treaty] with us yet"
 nesnd_india_union_invite_effect_tt:0 "Spend a month of our income (at least @money!2,000, at most @money!20,000) to invite the [concept_princely_state] with the highest [concept_relations] with us that is not yet bound by a defensive treaty (preferring independent states). Cannot be repeated for twelve months. Acceptance signs a defensive [concept_treaty], adds independent parties to the league and improves relations by #g 20#!. Refusal lowers relations by #r 10#!."
 nesnd_india_union_pact:0 "The Princely Pact"
 nesnd_india_union_broken:0 "A Broken League"
 nesnd_india_union_pact_conclusion:0 "At least three independent [Concept('concept_princely_state','$concept_princely_states|q$')] stand together in mutual defence, and the league pact is now in force."
 nesnd_india_union_pact_trigger_tt:0 "We belong to the Princely League and at least 3 independent princely states stand in it (currently [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_union_member_count')|0] / 3)"
 nesnd_india_union_pact_protect_tt:0 "The members of the league adopt a protective stance towards one another."
 nesnd_india_union_pact_resist_tt:0 "When an empire later invites any league member to join it, that member is far less willing to accept."
 nesnd_india_union_broken_conclusion:0 "Fewer than two independent members remain in the Princely League, and the pact has collapsed."
 nesnd_india_union_broken_trigger_tt:0 "The Princely League once held at least 2 members and now has fewer than 2 living independent members"
 nesnd_india_union_broken_effect_tt:0 "If the departed member still exists, our [concept_relations] with it fall by #r 30#!. If we remain independent, '$nesnd_india_union$' may reopen in ten years."
 nesnd_india_union.5.t:0 "An Invitation to Mutual Defence"
 nesnd_india_union.5.d:0 "[SCOPE.sCountry('india_league_inviter').GetName] has sent envoys to [ROOT.GetCountry.GetName] proposing a defensive [concept_treaty] and entry into a Princely League. Their letter argues that only by standing together can the states resist imperial absorption."
 nesnd_india_union.5.f:0 "“Our states stand or fall together, and without a pact of mutual defence we shall be absorbed one by one.”\n— Diplomatic letter from [SCOPE.sCountry('india_league_inviter').GetName] to [ROOT.GetCountry.GetName]"
 nesnd_india_union.5.a:0 "Agree to the pact of mutual defence."
 nesnd_india_union.5.a_tt:0 "[concept_relations] between us improve by #g 20#!, a five-year defensive [concept_treaty] is signed (attempting a [concept_defensive_pact], an alliance or a guarantee of independence in order), and both independent parties join the Princely League."
 nesnd_india_union.5.b:0 "Decline this invitation."
 nesnd_india_union.5.b_tt:0 "We decline the invitation, and [concept_relations] with [SCOPE.sCountry('india_league_inviter').GetName] fall by #r 10#!."
 nesnd_india_union.6.t:0 "Reply to Our Mutual-Defence Invitation"
 nesnd_india_union.6.d_accept:0 "The government of [SCOPE.sCountry('india_league_target').GetName] has accepted the invitation of [ROOT.GetCountry.GetName], and envoys from both states have signed a defensive [concept_treaty]."
 nesnd_india_union.6.d_decline:0 "The government of [SCOPE.sCountry('india_league_target').GetName] has declined the mutual-defence invitation of [ROOT.GetCountry.GetName], and no agreement was reached."
 nesnd_india_union.6.f:0 "“This Government has considered your proposal of mutual defence and hereby conveys its answer.”\n— Note of reply from the Government of [SCOPE.sCountry('india_league_target').GetName]"
 nesnd_india_union.6.accept_tt:0 "[concept_relations] between us improve by #g 20#!, the defensive [concept_treaty] takes effect, and both independent parties are entered in the Princely League."
 nesnd_india_union.6.decline_tt:0 "[concept_relations] between us fall by #r 10#!, and the invitation goes no further."
 nesnd_india_union.7_outcome_tt:0 "Opens the event '$nesnd_india_union.7.t$': each member permanently gains '$nesnd_india_union_pact$' (#g +10%#! unit [concept_defense]), members adopt a protective stance towards one another, and they become far less willing to accept imperial annexation."
 nesnd_india_union.7.t:0 "The Princely Pact Concluded"
 nesnd_india_union.7.d:0 "With further independent states entering the league, the mutual-defence network linking [ROOT.GetCountry.GetName] and its partners has taken shape. The allied governments have exchanged formal notes reaffirming their common defence against imperial pressure."
 nesnd_india_union.7.f:0 "“Every state bound to this League shall aid its fellows against outside attack and stand firm against coercion.”\n— Proclamation of the Princely League"
 nesnd_india_union.7.a:0 "We stand together by this pact."
 nesnd_india_union.7.a_tt:0 "We have permanently gained '$nesnd_india_union_pact$', and league members adopt a protective stance towards one another. Members are now far less willing to accept imperial invitations to join."
 nesnd_india_union.8_outcome_tt:0 "Opens the event '$nesnd_india_union.8.t$': if the departed member still exists, our [concept_relations] with it fall by #r 30#!, and we receive '$nesnd_india_union_broken$' (#r -5#! [concept_legitimacy]) for ten years. The journal may reopen after ten years."
 nesnd_india_union.8.t:0 "The Princely League Breaks"
 nesnd_india_union.8.d_departed:0 "[SCOPE.sCountry('india_league_departed').GetName] no longer stands as an independent member of the league, leaving fewer than two independent princely states bound to it. The government of [ROOT.GetCountry.GetName] must now face the collapse of the pact."
 nesnd_india_union.8.d_gone:0 "Our fellow members have lost their independence or fallen, leaving fewer than two independent princely states in the league. The government of [ROOT.GetCountry.GetName] must now face the collapse of the pact."
 nesnd_india_union.8.f:0 "“With our partners gone, the common defence agreed among the states can no longer be maintained.”\n— Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_union.8.a:0 "Rebuild our defences and bide our time."
 nesnd_india_union.8.a_departed_tt:0 "Our [concept_relations] with [SCOPE.sCountry('india_league_departed').GetName] have fallen by #r 30#!, and we receive '$nesnd_india_union_broken$' for ten years. '$nesnd_india_union$' may reopen in ten years."
 nesnd_india_union.8.a_gone_tt:0 "We receive '$nesnd_india_union_broken$' for ten years. '$nesnd_india_union$' may reopen in ten years."
 # ==== India batch 16: response to Persia's eastern claims ====
 nesnd_india_north:0 "Claims of $nesnd_lobby_name_per$"
 nesnd_india_north_reason:0 "$nesnd_lobby_name_per$ has laid [concept_claim]s to territory held by [ROOT.GetCountry.GetName] in India. Our government must fund frontier defences and seek diplomatic backing from $nesnd_lobby_name_qe1$ or our overlord before those claims are pressed by arms."
 nesnd_india_north_bar:0 "Frontier Defences"
 nesnd_india_north_bar_readout:0 "Frontier Defences: [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|0] / 100"
 nesnd_india_north_bar_monthly_desc:0 "At peace with $nesnd_lobby_name_per$ while holding all claimed states"
 nesnd_india_north_status_watch:0 "$nesnd_lobby_name_per$ holds [concept_claim]s on #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_north_tracked_count')|0]#! of our Indian state regions."
 nesnd_india_north_status_war:0 "We are at war with $nesnd_lobby_name_per$, and the #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_north_tracked_count')|0]#! claimed state regions are in danger of falling."
 nesnd_india_north_garrison:0 "Frontier Garrison"
 nesnd_india_north_held:0 "Eastward Push Held"
 nesnd_india_north_lost:0 "Frontier Lost"
 nesnd_india_north_garrison_button:0 "Strengthen Frontier Defences"
 nesnd_india_north_garrison_button_desc:0 "Spend four weeks of income (minimum @money!2,000, maximum @money!20,000) to reinforce conscription and defences in our most populous claimed state."
 nesnd_india_north_envoy_button:0 "Send Envoys to $nesnd_lobby_name_qe1$"
 nesnd_india_north_envoy_button_desc:0 "Despatch envoys to $nesnd_lobby_name_qe1$ to report the unilateral eastward claims of $nesnd_lobby_name_per$ and seek restraint from its overlord."
 nesnd_india_north_overlord_button:0 "Appeal to Our Overlord"
 nesnd_india_north_overlord_button_desc:0 "Place the [concept_claim]s of $nesnd_lobby_name_per$ before our [concept_overlord] and request diplomatic intervention."
 nesnd_india_north_pay_tt:0 "Our treasury holds four weeks of income (@money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_north_price')|0]), without default or bankruptcy"
 nesnd_india_north_garrison_wait_tt:0 "At least twelve months have passed since we last strengthened frontier defences"
 nesnd_india_north_has_held_state_tt:0 "We still hold at least one state claimed by $nesnd_lobby_name_per$"
 nesnd_india_north_qe1_alive_tt:0 "$nesnd_lobby_name_qe1$ exists"
 nesnd_india_north_envoy_wait_tt:0 "At least twelve months have passed since we last sent envoys to $nesnd_lobby_name_qe1$"
 nesnd_india_north_overlord_ready_tt:0 "We have an [concept_overlord] other than $nesnd_lobby_name_per$"
 nesnd_india_north_overlord_wait_tt:0 "At least twenty-four months have passed since we last appealed to our [concept_overlord]"
 nesnd_india_north_garrison_effect_tt:0 "'$nesnd_india_north_bar$' progress #g +10#!. Our most populous claimed state gains '$nesnd_india_north_garrison$' for five years. Unavailable for twelve months."
 nesnd_india_north_envoy_effect_tt:0 "Our [concept_relations] with $nesnd_lobby_name_qe1$ improve by #g 15#!, and '$nesnd_india_north_bar$' progress #g +10#!. Unavailable for twelve months."
 nesnd_india_north_overlord_effect_tt:0 "Our [concept_overlord]'s [concept_relations] with $nesnd_lobby_name_per$ fall by #r 10#! and it gains a negative [concept_diplomatic_catalyst] against $nesnd_lobby_name_per$. '$nesnd_india_north_bar$' progress #g +10#!. Unavailable for twenty-four months."
 nesnd_india_north_bar_plus_10_other_tt:0 "'$nesnd_india_north_bar$' progress of [SCOPE.sCountry('india_north_defender').GetName] increases by #g 10#!."
 nesnd_india_north_held_trigger_tt:0 "'$nesnd_india_north_bar$' progress reaches #v 100#!"
 nesnd_india_north_held_effect_tt:0 "Each claimed state we hold gains '$nesnd_india_north_garrison$' for ten years and #g 5%#! of our primary-culture population there become [concept_loyalist]s. [concept_relations] with $nesnd_lobby_name_per$ fall by #r 10#!. The journal will not reopen for ten years."
 nesnd_india_north_held_conclusion:0 "Our frontier preparations are complete, and the eastward push of $nesnd_lobby_name_per$ has been checked."
 nesnd_india_north_lost_trigger_tt:0 "At least one claimed state region has fallen to $nesnd_lobby_name_per$, its overlord or its subjects"
 nesnd_india_north_lost_effect_tt:0 "Each lost state becomes a [concept_homeland] of the primary culture of $nesnd_lobby_name_per$, and we gain [concept_claim]s on those states. #r 10%#! of the population in our capital state become [concept_radical]s. The journal may reopen after ten years."
 nesnd_india_north_lost_conclusion:0 "Claimed frontier territory has fallen, and the eastward campaign of $nesnd_lobby_name_per$ has succeeded."
 nesnd_india_north.1.t:0 "[SCOPE.sCountry('india_north_defender').GetName] Fortifies the Frontier"
 nesnd_india_north.1.d:0 "Despatches from the eastern border report that [SCOPE.sCountry('india_north_defender').GetName] is raising garrisons and sending envoys in response to the [concept_claim]s of [ROOT.GetCountry.GetName]. Once its frontier preparations are complete, any eastward advance will meet firmer resistance."
 nesnd_india_north.1.f:0 "“Month by month their garrisons grow and their envoys travel further. The frontier is no longer unguarded.”\n— Frontier military despatch"
 nesnd_india_north.1.a:0 "Press our designs."
 nesnd_india_north.1.b:0 "Hold back the eastward push."
 nesnd_india_north.2_outcome_tt:0 "Opens the event '$nesnd_india_north.2.t$': we permanently gain '$nesnd_india_north_held$' (#g +5%#! unit [concept_defense], #g +5%#! [concept_prestige]), each claimed state gains '$nesnd_india_north_garrison$' for ten years and primary-culture [concept_loyalist]s, and [concept_relations] with $nesnd_lobby_name_per$ fall by #r 10#!."
 nesnd_india_north.2.t:0 "The Eastward Push Held"
 nesnd_india_north.2.d:0 "After steady preparation and diplomacy, [ROOT.GetCountry.GetName] has secured the states claimed by $nesnd_lobby_name_per$. Local garrisons and foreign contacts are now in place, leaving no easy opening for an eastward campaign."
 nesnd_india_north.2.f:0 "“The frontier garrisons stand ready, and not a district has been yielded.”\n— Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_north.2.a:0 "Hold the frontier."
 nesnd_india_north.2.a_tt:0 "We have permanently gained '$nesnd_india_north_held$', each claimed state gains '$nesnd_india_north_garrison$' for ten years and #g 5%#! primary-culture [concept_loyalist]s, and [concept_relations] with $nesnd_lobby_name_per$ fall by #r 10#!."
 nesnd_india_north.3.t:0 "[SCOPE.sCountry('india_north_defender').GetName] Holds the Frontier"
 nesnd_india_north.3.d:0 "[SCOPE.sCountry('india_north_defender').GetName] has completed its frontier preparations across the states claimed by [ROOT.GetCountry.GetName]. Earlier [concept_claim]s have failed to force concessions, and bilateral relations have cooled further."
 nesnd_india_north.3.f:0 "“The eastern approaches are now garrisoned, and paper claims alone will not move them.”\n— Report from the eastern command"
 nesnd_india_north.3.a:0 "Note it and wait for another opening."
 nesnd_india_north.3.a_tt:0 "[concept_relations] between us and [SCOPE.sCountry('india_north_defender').GetName] fall by #r 10#!."
 nesnd_india_north.4_outcome_tt:0 "Opens the event '$nesnd_india_north.4.t$': each lost state becomes a [concept_homeland] of the primary culture of $nesnd_lobby_name_per$, we gain [concept_claim]s on those states and '$nesnd_india_north_lost$' (#r -5#! [concept_legitimacy]) for ten years, and #r 10%#! of our capital state become [concept_radical]s."
 nesnd_india_north.4.t:0 "The Eastward Push Succeeds"
 nesnd_india_north.4.d:0 "Territory in India claimed by $nesnd_lobby_name_per$ has fallen into its hands. [ROOT.GetCountry.GetName] has failed to hold the frontier, unrest has spread in the capital, and the government retains its [concept_claim]s in preparation for future recovery."
 nesnd_india_north.4.f:0 "“The frontier province is lost and the capital is restless. Only our written claim remains for a later day.”\n— Proclamation of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_north.4.a:0 "Keep our claims for a later reckoning."
 nesnd_india_north.4.a_tt:0 "Lost states have become a [concept_homeland] of the primary culture of $nesnd_lobby_name_per$, we gain [concept_claim]s on them and '$nesnd_india_north_lost$' for ten years, and #r 10%#! of our capital state become [concept_radical]s."
 nesnd_india_north.5.t:0 "A Foothold in India"
 nesnd_india_north.5.d:0 "Claimed territory formerly held by [SCOPE.sCountry('india_north_defender').GetName] has passed under the control of [ROOT.GetCountry.GetName] and its camp. Settlement and administration have begun in the newly won states, while the former holder maintains its [concept_claim]s."
 nesnd_india_north.5.f:0 "“The passes are now ours. Civil administration must follow the garrisons at once.”\n— Despatch from the eastern frontier"
 nesnd_india_north.5.a:0 "Consolidate the new provinces."
 nesnd_india_north.5.a_tt:0 "The newly won states become a [concept_homeland] of our primary culture, and [SCOPE.sCountry('india_north_defender').GetName] gains [concept_claim]s on the lost states."
