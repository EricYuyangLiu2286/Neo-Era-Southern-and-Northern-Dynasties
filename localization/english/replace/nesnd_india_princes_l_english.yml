 nesnd_india_project_name_4:0 "Engineering Survey and Training"
 nesnd_india_project_name_0:0 "local project"
 nesnd_india_diplomacy.1.t:0 "A Diplomatic Mission"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName] asks [SCOPE.sCountry('india_partner').GetName] to send teachers and to fund its schools."
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName] wants to establish [GetBuildingType('building_tooling_workshop').GetName] and asks [SCOPE.sCountry('india_partner').GetName] for engineers and a grant."
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName] asks [SCOPE.sCountry('india_partner').GetName] for military instructors and the money to train its army."
 nesnd_india_diplomacy.1.d4:0 "The envoys of [SCOPE.sCountry('india_sender').GetName] request greater autonomy, so that their government can manage more of its own domestic affairs."
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName] proposes a defensive pact. It seeks our aid if attacked and offers to undertake the same obligation in our defence."
 nesnd_india_diplomacy.1.d6_own:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to merge into it, and offers to take on a princely pension for our prince. We are already a [concept_subject] of [SCOPE.sCountry('india_sender').GetName]. Once merged, our lands and people come directly under its government. If we decline, things stay as they are."
 nesnd_india_diplomacy.1.d6_former:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to join it, and offers to take on a princely pension for our prince. [SCOPE.sCountry('india_partner').GetOverlord.GetName] has given its consent as our [concept_overlord]. If we accept, we leave [SCOPE.sCountry('india_partner').GetOverlord.GetName]. If we decline, we remain a [concept_subject] of [SCOPE.sCountry('india_partner').GetOverlord.GetName]."
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName] invites [ROOT.GetCountry.GetName] to join it, offering a settlement allowance and one princely pension for our prince. We may merge into [SCOPE.sCountry('india_sender').GetName], placing our lands and people under its government. Or we may become its [concept_dominion] and keep our own government, laws, [concept_treasury] and army. If we decline, nothing already agreed between our two countries is affected."
 nesnd_india_diplomacy.1.d8_dominion:0 "[SCOPE.sCountry('india_sender').GetName] asks to become a [concept_dominion] of [ROOT.GetCountry.GetName], keeping its own government, laws, [concept_treasury] and army. We would take on a princely pension for its prince."
 nesnd_india_diplomacy.1.d8_merge:0 "[SCOPE.sCountry('india_sender').GetName] asks to be merged into [ROOT.GetCountry.GetName]. Its lands and people would come under our government, and we would take on a princely pension for its prince."
 nesnd_india_diplomacy.1.d7:0 "The envoy of [SCOPE.sCountry('india_sender').GetName] asks to end the subject relationship between our two countries and to exercise its sovereignty in full."
 nesnd_india_diplomacy.1.d:0 "The delegation from [SCOPE.sCountry('india_sender').GetName] has submitted its request and awaits our reply."
 nesnd_india_diplomacy.1.f:0 "“We ask that you convey your reply through our representative.”\n—Diplomatic note from [SCOPE.sCountry('india_sender').GetName]"
 nesnd_india_diplomacy.1.a:0 "Accept these terms."
 nesnd_india_reply_aid_tt:0 "[SCOPE.sCountry('india_sender').GetName] will owe us an [concept_obligation]."
 nesnd_india_reply_teacher_tt:0 "We gain #g [GetStaticModifier('nesnd_india_teaching_mission').GetValueFor('country_influence_add')|0]#! [concept_influence] for four years."
 nesnd_india_reply_engineer_tt:0 "At least #v [SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_workshop_levels')|0]#! levels of [GetBuildingType('building_tooling_workshop').GetName] in [SCOPE.sCountry('india_sender').GetName] will be [Concept('concept_nationally_owned', '$nesnd_india_owned_by_our_government$')]."
 nesnd_india_reply_officer_tt:0 "[SCOPE.sCountry('india_sender').GetName] grants us [concept_military_access]. The [concept_treaty] has a five-year [concept_binding_period]."
 nesnd_india_reply_relations_tt:0 "Our [concept_relations] with [SCOPE.sCountry('india_sender').GetName] improve by #g 25#!."
 nesnd_india_reply_autonomy_tt:0 "Increase the recipient’s autonomy by one level and reduce its [concept_liberty_desire] by #v 20#!. Our [concept_relations] improve by #g 25#!."
 nesnd_india_reply_defence_tt:0 "Conclude a [concept_defensive_pact] with a three-year [concept_binding_period]. Our [concept_relations] improve by #g 25#!."
 nesnd_india_union_reply_take_dominion_tt:0 "[SCOPE.sCountry('india_sender').GetName] becomes our [concept_dominion], keeping its own states, government, laws, [concept_treasury] and army."
 nesnd_india_union_reply_take_merge_tt:0 "[SCOPE.sCountry('india_sender').GetName] merges into our country, and its states, people and army pass to us."
 nesnd_india_union_reply_take_pay_tt:0 "We pay a settlement allowance of @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and record one princely pension for the prince of [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_union_reply_take_compensation_tt:0 "[SCOPE.sCountry('india_sender').GetName] first leaves [SCOPE.sCountry('india_sender').GetOverlord.GetName], and we also pay [SCOPE.sCountry('india_sender').GetOverlord.GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] in compensation."
 nesnd_india_reply_independence_tt:0 "Recognise its independence and establish a five-year truce. Our [concept_relations] improve by #g 25#!."
 nesnd_india_diplomacy.1.merge:0 "Merge into [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_union_reply_merge_tt:0 "We merge into [SCOPE.sCountry('india_sender').GetName], and our states, people and army pass to it. [SCOPE.sCountry('india_sender').GetName] pays a settlement allowance of @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and records one princely pension for our prince."
 nesnd_india_union_reply_former_tt:0 "We first leave [SCOPE.sCountry('india_partner').GetOverlord.GetName]. [SCOPE.sCountry('india_sender').GetName] also pays [SCOPE.sCountry('india_partner').GetOverlord.GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] in compensation."
 nesnd_india_diplomacy.1.dominion:0 "Become a dominion of [SCOPE.sCountry('india_sender').GetName]."
 nesnd_india_union_reply_dominion_tt:0 "We become a [concept_dominion] of [SCOPE.sCountry('india_sender').GetName], keeping our own states, government, laws, [concept_treasury] and army. [SCOPE.sCountry('india_sender').GetName] pays us @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] and records one princely pension for our prince."
 nesnd_india_diplomacy.1.b:0 "We cannot agree."
 nesnd_india_union_reply_decline_tt:0 "The matter ends here. Treaties, funded projects and other cooperation between the two countries stay as they are, and both sides are informed."
 nesnd_india_refusal_tt:0 "Inform the mission that we decline its request. If it asked for greater autonomy or independence, its [concept_liberty_desire] rises by #v 10#!."
 nesnd_india_diplomacy.2.t:0 "The Envoy Returns"
 nesnd_india_diplomacy.2.d:0 "[SCOPE.sCountry('india_partner').GetName] has accepted the terms we proposed."
 nesnd_india_diplomacy.2.f:0 "“The terms put forward by our mission have been accepted by the other government.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_diplomacy_accepted_tt:0 "They have acted on our request, and [concept_relations] between us improve by #g 25#!."
 nesnd_india_diplomacy_ack:0 "Understood."
 nesnd_india_diplomacy.3.t:0 "The Request Declined"
 nesnd_india_diplomacy.3.d:0 "[SCOPE.sCountry('india_partner').GetName] has rejected the terms put forward by our delegation."
 nesnd_india_diplomacy.3.f:0 "“The terms put forward by our mission have not been accepted by the other government.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_diplomacy_refused_tt:0 "The request goes no further. We may not open another negotiation until six months after it was made."
 nesnd_india_diplomacy.5.t:0 "Which State to Invite"
 nesnd_india_diplomacy.5.d:0 "[ROOT.GetCountry.GetName] is preparing to invite a princely state to join it, and the settlement allowance has been set aside. The states we can invite are those at peace and on good terms with us, the most populous first."
 nesnd_india_diplomacy.5.f:0 "“The prince shall receive a pension. His lands and people shall either be merged into [ROOT.GetCountry.GetName], or govern themselves as a dominion of [ROOT.GetCountry.GetName].”\n—Terms of accession carried by the mission"
 nesnd_india_diplomacy.5.1:0 "Invite [SCOPE.sCountry('india_union_candidate_1').GetName]"
 nesnd_india_union_invite_tt:0 "Invite this state to join us, with a settlement allowance of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0]. If it is another country's [concept_subject], its [concept_overlord] is asked for consent first. Once the invitation goes out, or consent is refused, we may not open another negotiation for six months."
 nesnd_india_diplomacy.5.2:0 "Invite [SCOPE.sCountry('india_union_candidate_2').GetName]"
 nesnd_india_diplomacy.5.3:0 "Invite [SCOPE.sCountry('india_union_candidate_3').GetName]"
 nesnd_india_diplomacy.5.4:0 "Invite [SCOPE.sCountry('india_union_candidate_4').GetName]"
 nesnd_india_diplomacy.5.e:0 "Send no invitation for now."
 nesnd_india_union_no_invite_tt:0 "We send no invitation now, and no negotiation is used up."
 nesnd_india_diplomacy.4.t:0 "Engaging Foreign Advisers"
 nesnd_india_diplomacy.4.d:0 "Our delegation is preparing to travel to [SCOPE.sCountry('india_partner').GetName] to ask for advisers and a grant. Whom should we invite?"
 nesnd_india_diplomacy.4.f:0 "“We shall meet the advisers’ expenses for the duration of their service in our country.”\n—Terms of engagement drafted by the mission"
 nesnd_india_diplomacy.4.1:0 "[GetStaticModifier('nesnd_india_french_teachers').GetName]"
 nesnd_india_mission_request_tt:0 "Ask [SCOPE.sCountry('india_partner').GetName] for a grant of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0]. Another mission may leave in six months. If aid is granted, we must wait four years before asking again."
 nesnd_india_diplomacy.4.2:0 "[GetStaticModifier('nesnd_india_french_engineers').GetName]"
 nesnd_india_workshop_rate_tt:0 "Each @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_workshop_pounds_per_level')|0] of the grant entitles the contributing government to one level of [GetBuildingType('building_tooling_workshop').GetName], up to five. Levels already owned by [SCOPE.sCountry('india_partner').GetName]’s government count towards the total."
 nesnd_india_diplomacy.4.3:0 "[GetStaticModifier('nesnd_india_french_officers').GetName]"
 nesnd_india_project.1.t:0 "A Local Project"
 nesnd_india_project.1.d:0 "The government of [ROOT.GetCountry.GetName] means to undertake a public work at home. What to build, and where, is ours to decide. The money may come from our own [concept_treasury], or we may turn to another government, which may want a share of ownership in return. If we are a subject, such an arrangement must first have the consent of our [concept_overlord]."
 nesnd_india_project.1.f:0 "“Craftsmen and firms willing to undertake the Government’s new public work may apply to the Government, stating the work they can perform.”\n—Notice of the Government of [ROOT.GetCountry.GetName] for workers and contractors"
 nesnd_india_project.1.a:0 "Build: [GetBuildingType('building_university').GetName]"
 nesnd_india_project_next_tt:0 "Next we choose the place and who pays. Nothing is spent yet."
 nesnd_india_project.1.b:0 "Build: [GetBuildingType('building_tooling_workshop').GetName]"
 nesnd_india_project.1.c:0 "Build: [GetBuildingType('building_railway').GetName]"
 nesnd_india_project.1.e:0 "Commission a Survey First"
 nesnd_india_project_next_survey_tt:0 "Next we choose which government to ask. The fee is @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_survey_fee')|0], paid once they agree."
 nesnd_india_project.none:0 "Not for now."
 nesnd_india_project_none_tt:0 "No project is begun, and this choice does not start the six months before another negotiation."
 nesnd_india_project.2.t:0 "Where to Build"
 nesnd_india_project.2.d:0 "More than one [concept_state] of ours could take the project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]). We must settle on the place."
 nesnd_india_project.2.f:0 "“We humbly pray that the Government will place the new work in our district.”\n—A local petition to the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project.2.1:0 "In [SCOPE.sState('india_project_site_1').GetName]"
 nesnd_india_project_next_funding_tt:0 "Next we choose who pays. Nothing is spent yet."
 nesnd_india_project.2.2:0 "In [SCOPE.sState('india_project_site_2').GetName]"
 nesnd_india_project.2.3:0 "In [SCOPE.sState('india_project_site_3').GetName]"
 nesnd_india_project.3.t:0 "Who Pays"
 nesnd_india_project.3.d_survey:0 "We intend to engage another country’s engineers to survey our land and train local craftsmen, at our own expense."
 nesnd_india_project.3.d:0 "We intend to build the project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. We may find the money ourselves or ask another government to provide it."
 nesnd_india_project.3.f:0 "“This Government proposes to undertake a public work and would be most grateful for the assistance of your Government.”\n—Draft note of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project.3.a:0 "We Shall Pay for It"
 nesnd_india_project_own_tt:0 "One level is ordered in the chosen [concept_state]. The work joins our government’s construction queue at our own expense."
 nesnd_india_project.3.b:0 "Ask [SCOPE.sCountry('india_project_neighbour').GetName]"
 nesnd_india_project.3.c:0 "Ask [SCOPE.sCountry('india_project_foreign').GetName]"
 nesnd_india_project.4.t:0 "The Project Agreed"
 nesnd_india_project.4.d_survey:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to send engineers to survey our land and train local craftsmen. The fee has been paid."
 nesnd_india_project.4.d_grant:0 "The government of [SCOPE.sCountry('india_matter_to').GetName] has paid the grant as agreed and takes no ownership. The work ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [SCOPE.sState('india_project_site').GetName] has joined our government’s construction queue."
 nesnd_india_project_term_tt:0 "For five years we make no other funding agreement there."
 nesnd_india_project.4.d_stake:0 "The government of [SCOPE.sCountry('india_matter_to').GetName] has paid the grant as agreed. The building ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [SCOPE.sState('india_project_site').GetName] stands, and it belongs to the government of [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_project.4.f:0 "“This agreement takes effect on the day both parties sign.”\n—Agreement between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_india_project_agreed_tt:0 "The agreement is in effect."
 nesnd_india_project.5.t:0 "No Agreement"
 nesnd_india_project.5.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has withheld its consent, and our request never reached the government of [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_project.5.d_decline:0 "The government of [SCOPE.sCountry('india_matter_to').GetName] has declined our request."
 nesnd_india_project.5.d_silent:0 "Our request went unanswered within the time allowed and has lapsed."
 nesnd_india_project.5.d_void:0 "Circumstances have changed and our request no longer stands."
 nesnd_india_project.5.f:0 "“The work could not be carried out. The Government will find other means.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project_failed_tt:0 "The request ends here."
 nesnd_india_project.6.t:0 "The Work Completed"
 nesnd_india_project.6.d:0 "The work ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [SCOPE.sState('india_project_site').GetName] is finished."
 nesnd_india_project.6.f:0 "“The work is complete and opens today.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project_done_tt:0 "We may plan another local project."
 nesnd_india_project.7.t:0 "The Agreement Expires"
 nesnd_india_project.7.d:0 "Our funding agreement with [SCOPE.sCountry('india_matter_to').GetName] for [SCOPE.sState('india_project_site').GetName] has run its five years. Ownership already acquired is unchanged. We may make a new agreement there."
 nesnd_india_project.7.f:0 "“This agreement runs for five years. Ownership acquired under it remains valid thereafter.”\n—Agreement between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_india_project_term_over_tt:0 "A new funding agreement may be made there."
 nesnd_india_union.1.t:0 "The New Standing of [SCOPE.sCountry('india_union_prince').GetName]"
 nesnd_india_union.1.d_former_merge:0 "With our consent, [SCOPE.sCountry('india_union_prince').GetName] has left us and merged into [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union.1.d_former_dominion:0 "With our consent, [SCOPE.sCountry('india_union_prince').GetName] has left us and become a [concept_dominion] of [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union_host_paid_tt:0 "We have paid @money![SCOPE.GetValue('india_union_price')|0] and taken on a princely pension for the prince of [SCOPE.sCountry('india_union_prince').GetName]."
 nesnd_india_union_prince_paid_tt:0 "[SCOPE.sCountry('india_union_empire').GetName] has paid us @money![SCOPE.GetValue('india_union_price')|0] and taken on a princely pension for our prince."
 nesnd_india_union.1.d_host_merge:0 "[SCOPE.sCountry('india_union_prince').GetName] has merged into our country, and its lands and people are now under our government."
 nesnd_india_union.1.d_host_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName] has become our [concept_dominion], keeping its own government, laws, [concept_treasury] and army."
 nesnd_india_union.1.d_prince_dominion:0 "[SCOPE.sCountry('india_union_empire').GetName] has agreed to our request, and we are now a [concept_dominion] of [SCOPE.sCountry('india_union_empire').GetName], keeping our own government, laws, [concept_treasury] and army."
 nesnd_india_union.1.f:0 "“The princely pension shall be paid from the treasury of [SCOPE.sCountry('india_union_empire').GetName] for ten years.”\n—Instrument of accession between [SCOPE.sCountry('india_union_empire').GetName] and [SCOPE.sCountry('india_union_prince').GetName]"
 nesnd_india_union_merged_tt:0 "The states, people and army of [SCOPE.sCountry('india_union_prince').GetName] now belong to [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union_dominion_tt:0 "[SCOPE.sCountry('india_union_prince').GetName] is a [concept_dominion] of [SCOPE.sCountry('india_union_empire').GetName]."
 nesnd_india_union_compensated_tt:0 "We receive @money![SCOPE.GetValue('india_union_price')|0] in compensation."
 nesnd_india_union_paid_former_tt:0 "We have also paid [SCOPE.sCountry('india_union_former').GetName] @money![SCOPE.GetValue('india_union_price')|0] in compensation."
 nesnd_india_union.2.t:0 "Declined"
 nesnd_india_union.2.d_we_decline_invite:0 "We have declined the invitation of [SCOPE.sCountry('india_sender').GetName], and things stay as they are. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.d_we_decline_request:0 "We have declined the request of [SCOPE.sCountry('india_sender').GetName] to join us. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.d_invite_declined:0 "[SCOPE.sCountry('india_union_decliner').GetName] has declined our invitation. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.d_request_declined:0 "[SCOPE.sCountry('india_union_decliner').GetName] has declined our request to join it. Nothing already agreed between our two countries changes."
 nesnd_india_union.2.f:0 "“The Government thanks you for your goodwill, but cannot accept this arrangement.”\n—Note of reply from the Government of [SCOPE.sCountry('india_union_decliner').GetName]"
 nesnd_india_union_unchanged_tt:0 "Treaties, funded projects and other cooperation between the two countries stay as they are."
 nesnd_india_union.3.t:0 "Consent Withheld"
 nesnd_india_union.3.d_invite_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has refused, as [concept_overlord], to let [SCOPE.sCountry('india_matter_to').GetName] accept our invitation. The invitation never reached [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_union.3.d_invite_silent:0 "[SCOPE.sCountry('india_matter_permit').GetName] did not answer within the time allowed, and the invitation never reached [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_union.3.d_invite_void:0 "Circumstances have changed, and this invitation to [SCOPE.sCountry('india_matter_to').GetName] no longer stands. Should we still wish to invite it, we must do so afresh."
 nesnd_india_union.3.d_ask_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has refused, as our [concept_overlord], to let us join [SCOPE.sCountry('india_matter_to').GetName]. The request never reached [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_union.3.d_ask_silent:0 "[SCOPE.sCountry('india_matter_permit').GetName] did not answer within the time allowed, and our request to join [SCOPE.sCountry('india_matter_to').GetName] was never sent."
 nesnd_india_union.3.d_ask_void:0 "Circumstances have changed, and our request to join [SCOPE.sCountry('india_matter_to').GetName] no longer stands."
 nesnd_india_union.3.f:0 "“A subject may not leave its overlord without the overlord's consent.”\n—Memorandum of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_union_no_consent_tt:0 "No money has been paid, and no subject relation has changed."
 nesnd_india_union_wait_tt:0 "We may not open another negotiation for six months."
 nesnd_india_union.4.t:0 "Asking to Join"
 nesnd_india_union.4.d:0 "[ROOT.GetCountry.GetName] may ask to join [SCOPE.sCountry('india_union_host').GetName]. Merged into it, our lands and people would come under the government of [SCOPE.sCountry('india_union_host').GetName]. As a [concept_dominion] of [SCOPE.sCountry('india_union_host').GetName], we would keep our own government, laws, [concept_treasury] and army."
 nesnd_india_union.4.f:0 "“Our state wishes to join yours, and asks your Government to set out its terms.”\n—Letter of [ROOT.GetCountry.GetName] to [SCOPE.sCountry('india_union_host').GetName]"
 nesnd_india_union.4.merge:0 "Ask to merge into [SCOPE.sCountry('india_union_host').GetName]."
 nesnd_india_union_ask_merge_tt:0 "We ask [SCOPE.sCountry('india_union_host').GetName] to merge us into it. If [SCOPE.sCountry('india_union_host').GetName] agrees, it pays a settlement allowance of @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] and records one princely pension for our prince, and our states, people and army pass to [SCOPE.sCountry('india_union_host').GetName]."
 nesnd_india_union_ask_consent_tt:0 "We are a [concept_subject] of [ROOT.GetCountry.GetOverlord.GetName], whose consent must come first; only then is the request passed to [SCOPE.sCountry('india_union_host').GetName]. If [SCOPE.sCountry('india_union_host').GetName] agrees, it also pays [ROOT.GetCountry.GetOverlord.GetName] @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] in compensation."
 nesnd_india_union_ask_wait_tt:0 "Until an answer comes we cannot open another negotiation, nor for six months after the request is sent."
 nesnd_india_union.4.dominion:0 "Ask to become a dominion of [SCOPE.sCountry('india_union_host').GetName]."
 nesnd_india_union_ask_not_own_subject_tt:0 "We are not already a [concept_subject] of [SCOPE.sCountry('india_union_host').GetName]"
 nesnd_india_union_ask_dominion_tt:0 "We ask [SCOPE.sCountry('india_union_host').GetName] to take us in as its [concept_dominion]. If [SCOPE.sCountry('india_union_host').GetName] agrees, it pays us @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] and records one princely pension for our prince, and we keep our own states, government, laws, [concept_treasury] and army."
 nesnd_india_union.4.later:0 "Not now."
 nesnd_india_union_ask_later_tt:0 "We make no request now, and no negotiation is used up."
 nesnd_india_revolt.1.t:0 "A Rising in the South"
 nesnd_india_revolt.1.d:0 "The insurgents in [SCOPE.sState('india_case_state').GetName] have seized the local government offices and declared independence. Their former ruler still demands the return of the land."
 nesnd_india_revolt.1.f:0 "“From this day this state is independent.”\n—Notice posted by the insurgents at the government offices"
 nesnd_india_revolt_ack:0 "We declare our independence."
 nesnd_india_revolt_ack_tt:0 "The journal '$nesnd_india_revolt_war$' follows the course of this war."
