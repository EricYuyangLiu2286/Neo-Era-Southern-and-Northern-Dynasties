 nesnd_india_diplomacy.10.d:0 "[SCOPE.sCountry('india_indep_overlord').GetName] has recognised our status as a [concept_protectorate]. [ROOT.GetCountry.GetName] now has the right to initiate [Concept('concept_diplomatic_play','$concept_diplomatic_plays|q$')]."
