l_english:
 nesnd_india_seek_aid_button:0 "Request Foreign Aid"
 nesnd_india_seek_aid_button_desc:0 "A subject may ask only its overlord. An independent country may ask any [concept_great_power] at peace that has an [concept_interest] in North or South India."
 nesnd_india_seek_aid_button_tt:0 "Choose which country to ask."
 nesnd_india_seek_aid_target_tt:0 "There is a country we can ask for aid"
 nesnd_india_partner_not_busy_tt:0 "The other government is not handling another request"
 nesnd_india_defence_button:0 "Seek a Defensive Pact"
 nesnd_india_defence_button_desc:0 "Propose a [concept_defensive_pact] for three years to $nesnd_lobby_name_fra$, the Indian empire or $nesnd_lobby_name_usm$."
 nesnd_india_defence_button_tt:0 "Choose which country to approach."
 nesnd_india_defence_target_exists_tt:0 "There is a country with which we can sign a defensive treaty"
 nesnd_india_foreign_status:0 ""
 nesnd_india_uprising_status:0 ""
 nesnd_india_revolt_war:0 "War of Independence"
 nesnd_india_revolt_war_reason:0 "[ROOT.GetCountry.GetName] has declared itself free of the rule of [JournalEntry.GetCountry.MakeScope.Var('nesnd_india_revolt_former').GetCountry.GetName]. The funds of the rising were supplied by [JournalEntry.GetCountry.MakeScope.Var('nesnd_india_revolt_sponsor').GetCountry.GetName], and the forces at our disposal are newly raised irregular infantry. [JournalEntry.GetCountry.MakeScope.Var('nesnd_india_revolt_former').GetCountry.GetName] regards the territory we occupy as its own possession and does not recognise our independence."
 nesnd_india_revolt_resolved_tt:0 "The diplomatic play or war is over, and we remain independent and still rule a state of the rising region"
 nesnd_india_revolt_survived:0 "Independence Upheld"
 nesnd_india_choose_mission_tt:0 "Next, choose whether to ask for teachers, engineers or officers."
 nesnd_india_diplomatic_desc:0 "Invite a prince to join the empire: to merge into it, or to become a [concept_dominion] keeping the state's own government, laws, treasury and army. The empire pays a sum and bears [GetStaticModifier('nesnd_india_princely_pensions').GetName] for ten years."
 nesnd_india_request_tt:0 "Once sent, the request is answered within 45 days. Where an overlord must consent, it goes to the overlord first."
 nesnd_india_request_liberty_tt:0 "If granted, our [concept_autonomy] rises by one level and [concept_liberty_desire] #v -20#!. If refused, [concept_liberty_desire] #v +10#! and [concept_relations] with our overlord #r -30#!."
 nesnd_india_defence_upkeep_tt:0 "Once the treaty is in force, maintaining the [concept_defensive_pact] takes up [concept_influence]."
 nesnd_india_union_request_tt:0 "Choose which prince to invite."
 nesnd_india_pension_full_tt:0 "[GetStaticModifier('nesnd_india_princely_pensions').GetName] are at their limit: taking in another state only restarts the ten years."
 nesnd_india_project_start_desc:0 "Build one level of a $building_university$, a $building_tooling_workshop$ or a $building_railway$ in one of our states, or engage outside staff to carry out an engineering survey. The cost may be met from our own resources, or provided by the Indian states or by a foreign government."
 nesnd_india_project_start_tt:0 "Choose what to build."
 nesnd_india_project_withdraw_button_desc:0 "Withdraw a funding request that has not yet been answered, and drop the project."
 nesnd_india_project_waiting_tt:0 "A project request is awaiting an answer"
 nesnd_india_project_withdraw_tt:0 "The request lapses and the project is dropped."
 nesnd_india_union_ask_button_desc:0 "Ask [SCOPE.sCountry('nesnd_label_india_empire').GetName] to take in our state: to merge into the empire, or to become its [concept_dominion]."
 nesnd_india_union_ask_button_tt:0 "Choose how to join."
 nesnd_india_contact_desc:0 "Local preparations for the uprising depend on financial support from our government."
 nesnd_india_contact_button:0 "Contact Local Organisers"
 nesnd_india_resume_button:0 "Resume Contact"
 nesnd_india_launch_button:0 "Launch the Rising"
 nesnd_india_abandon_button:0 "Abandon the Contact"
 nesnd_india_suppress_button:0 "Hunt the Conspirators"
 nesnd_india_suppress_target_tt:0 "Target: the state in the region where an organisation is furthest advanced."
 nesnd_india_uprising_failed_tt:0 "A rising we paid for has failed"
 nesnd_india_revolt.3.t:0 "Which Region to Contact"
 nesnd_india_revolt.3.d:0 "In several states among the Indian possessions of $nesnd_lobby_name_fra$ and $nesnd_lobby_name_usm$ the inhabitants have formed secret societies with the object of overthrowing their rule. It is proposed to select one region, to send agents to open communication with the societies there, and to support their preparations with our funds."
 nesnd_india_revolt.3.f:0 "'A society already exists here. On receipt of the funds of your Government the preparations will be put in hand.'\n— Secret letter from a local society"
 nesnd_india_revolt.3.circars:0 "$STATE_CIRCARS$"
 nesnd_india_revolt.3.kurnool:0 "$STATE_KURNOOL$"
 nesnd_india_revolt.3.madras:0 "$STATE_MADRAS$"
 nesnd_india_revolt.3.mysore:0 "$STATE_MYSORE$"
 nesnd_india_revolt.3.travancore:0 "$STATE_TRAVANCORE$"
 nesnd_india_revolt.3.gujarat:0 "$STATE_GUJARAT$"
 nesnd_india_revolt.3.e:0 "Not Now"
 nesnd_india_contact_tt:0 "Make contact with the local organisation in the region and begin preparing a rising. While the preparations last, we bear [GetStaticModifier('nesnd_india_contact_cost').GetName]."
 nesnd_india_contact_cost:0 "Funds for the Uprising"
 nesnd_india_resume_tt:0 "The local organisation resumes its preparations, and we bear [GetStaticModifier('nesnd_india_contact_cost').GetName] again."
 nesnd_india_launch_tt:0 "The state declares its independence and forms a new country, to whose government the funds we provide are paid over. The former ruler will open a diplomatic play in an attempt to recover the state. If we are independent and not at war, we join the side of the insurgents."
 nesnd_india_case_popular_ready_tt:0 "The state's [concept_turmoil] is at least 25%, or an Indian culture there has a [concept_cultural_movement] in the ruling country"
 nesnd_india_suppression_desc:0 "Employ troops and police to hunt down the seditious societies plotting insurrection in our states, and repress the national feeling of the local culture."
 nesnd_india_suppression_tt:0 "In the region where an organisation is furthest advanced, its preparations #r -25#!, and an organisation that was ready falls back to a standstill. No further crackdown for six months."
 nesnd_india_abandon_tt:0 "Contact with the organisation in the region ends. No preparations can begin in the region again for three years."
 nesnd_india_case_watch:0 "Hunting the Conspirators"
 nesnd_india_case_watch_reason:0 "In the Indian states under the rule of [ROOT.GetCountry.GetName] seditious societies are plotting insurrection. It has been ascertained that their funds are supplied by the Indian empire, whose agents are in communication with the local societies and incite the natives to throw off our rule."
 nesnd_india_case_watch_open_tt:0 "A seditious society is plotting insurrection in one of our Indian states"
 nesnd_india_case_watch_closure_tt:0 "We no longer rule Indian states as a colonial power"
 nesnd_india_case_watch_conclusion:0 "We no longer rule Indian states as a colonial power, and the hunt is over."
 nesnd_india_french_teachers:0 "Foreign Teachers"
 nesnd_india_teaching_mission:0 "Teaching Mission Abroad"
 nesnd_india_french_engineers:0 "Foreign Engineers"
 nesnd_india_princely_pensions:0 "Princely Pensions"
 nesnd_india_survey:0 "Engineering Survey"
 nesnd_india_project_ask_survey_tt:0 "The other government sends engineers to survey our land, and we pay a fee of #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_survey_fee')|D]#!."
 nesnd_india_project_ask_grant_tt:0 "The other government grants #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|D]#! for us to build a $building_university$ ourselves. We owe it an [concept_obligation], [concept_relations] between us #g +25#!, and the state takes no other funding agreement for five years."
 nesnd_india_project_ask_stake_tt:0 "The other government pays #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|D]#! to build one level of [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] in the state at once, and owns that level. We owe it an [concept_obligation], [concept_relations] between us #g +25#!, and the state takes no other funding agreement for five years."
 nesnd_india_project_consent_tt:0 "Our overlord must consent first."
 nesnd_india_project_wait_tt:0 "Once sent, the request is answered within 45 days."
