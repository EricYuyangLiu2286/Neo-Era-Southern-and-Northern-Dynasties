 # ==== India batch 12: outcomes on the princes' and subjects' side ====
 nesnd_india_prince_strong:0 "A Self-Reliant State"
 nesnd_india_prince_privileges:0 "Princely Privileges"
 nesnd_india_south_settled:0 "The End of Foreign Rule"
 nesnd_india_uprising_spent:0 "A Failed Rising"
 nesnd_india_south_calm:0 "A Quiet Decade"
 nesnd_india_indep_self_reliant:0 "Standing Alone"
 nesnd_india_lord_calm:0 "Loyal Subjects"
 nesnd_india_prince_strong_conclusion:0 "[ROOT.GetCountry.GetName] has remained independent and has completed three local projects."
 nesnd_india_prince_projects_tt:0 "#v 3#! local projects completed (currently #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_projects_done_value')|0]#!)"
 nesnd_india_prince_joined_conclusion:0 "[ROOT.GetCountry.GetName] has joined the empire as a [concept_dominion], keeping its own government, laws, treasury and army."
 nesnd_india_prince_joined_tt:0 "We have joined an Indian empire as a [concept_dominion]"
 nesnd_india_prince_joined_effect_tt:0 "We will not have this [concept_journal_entry] again until we leave the empire."
 nesnd_india_south_settled_conclusion:0 "Every state of the six regions is now ruled by a country whose capital is in India."
 nesnd_india_south_settled_tt:0 "Every state of the six rising regions is ruled by a country whose capital is in India"
 nesnd_india_uprising_spent_conclusion:0 "The rising subsidised by us has failed."
 nesnd_india_uprising_spent_goal_tt:0 "The country the rising was aimed at will treat us as an enemy."
 nesnd_india_uprising_quiet_tt:0 "No rising can be prepared for five years."
 nesnd_india_uprising_quiet_cond_tt:0 "No rising we paid for has failed in the last five years"
 nesnd_india_revolt_former_claim_tt:0 "Our former ruler gains a [concept_claim] on our state in the rising region."
 nesnd_india_revolt_former_goal_tt:0 "Our former ruler treats the empire that paid for the rising as an enemy."
 nesnd_india_revolt_failed_effect_tt:0 "In the states of the rising region still held by the former ruler, #r 20%#! of the people of the cultures that rose become [concept_radical]s."
 nesnd_india_revolt.2_outcome_tt:0 "We will decide whether to join the empire that paid for us or to stand on our own."
 nesnd_india_revolt.2.t:0 "After Independence"
 nesnd_india_revolt.2.d:0 "The independence of [ROOT.GetCountry.GetName] has been secured. Some in the government advocate adhesion to [SCOPE.sCountry('india_revolt_sponsor').GetName], which subsidised us, as a dominion retaining our own government and army. Others hold that we should not again be subordinate to any country."
 nesnd_india_revolt.2.f:0 "'This country, being now independent, ought not again to be subordinate to any other.'\n— Proposal made within the government"
 nesnd_india_revolt.2.a:0 "Join the Empire"
 nesnd_india_revolt.2.a_tt:0 "Become a [concept_dominion] of [SCOPE.sCountry('india_revolt_sponsor').GetName] and gain [GetStaticModifier('nesnd_india_prince_privileges').GetName]."
 nesnd_india_revolt.2.b:0 "Stand on Our Own"
 nesnd_india_indep_fervor_tt:0 "The target [concept_fervor] of our [Concept('concept_primary_cultures','$concept_primary_culture$')] rises for a long time."
 nesnd_india_south_calm_conclusion:0 "For ten years no new seditious society has been discovered in our Indian states."
 nesnd_india_south_calm_tt:0 "For ten years no seditious society has plotted insurrection in our states"
 nesnd_india_south_calm_cooldown_tt:0 "This reward cannot be gained again for ten years."
 nesnd_india_indep.12_outcome_tt:0 "We shall decide the course of our foreign policy after independence."
 nesnd_india_indep.12.t:0 "A New Independent Country"
 nesnd_india_indep.12.d:0 "[ROOT.GetCountry.GetName] has thrown off the overlordship of [SCOPE.sCountry('india_free_lord').GetName] and become an independent country. The course of its foreign policy has not yet been settled within the government."
 nesnd_india_indep.12.f:0 "'From this day our country is subject to the overlordship of no foreign power.'\n— Declaration of independence"
 nesnd_india_indep.12.a:0 "Draw Close to [SCOPE.sCountry('india_free_empire').GetName]"
 nesnd_india_indep.12.b:0 "Stand on Our Own"
 nesnd_india_indep.12.c:0 "Befriend [SCOPE.sCountry('india_free_rival').GetName]"
 nesnd_india_indep_rival_involvement_tt:0 "[SCOPE.sCountry('india_free_rival').GetName] turns its attention to our strategic region."
 nesnd_india_indep.13.t:0 "Independence Thwarted"
 nesnd_india_indep.13.d:0 "Our diplomatic play for independence has not succeeded, and [ROOT.GetCountry.GetName] remains a subject of [ROOT.GetCountry.GetOverlord.GetName]. Half of our economic and half of our military preparation for independence has been lost, and the number of radicals in the state of the capital has increased."
 nesnd_india_indep.13.f:0 "'The government cannot escape blame for this setback.'\n— A handbill in the capital"
 nesnd_india_indep.13.a:0 "Begin Again"
 nesnd_india_indep.13.a_tt:0 "$nesnd_india_indep_economy_bar$ and $nesnd_india_indep_military_bar$ are each halved, and #r 10%#! of the people in the state of our capital become [concept_radical]s."
 nesnd_india_lord_calm_conclusion:0 "For ten years the tendency to separation among our subjects has not reached a point endangering their subordination."
 nesnd_india_lord_calm_tt:0 "For ten years, no subject has reached 75 [concept_liberty_desire]"
 nesnd_india_lord_calm_cooldown_tt:0 "This reward cannot be gained again for ten years."
 nesnd_india_indep_lord_can_pay_tt:0 "Our [concept_gold_reserves] suffice to meet this payment"

 # Refusal consequences and Princely League (batch 14)
 nesnd_india_union_reply_decline_capital_claim_tt:0 "[SCOPE.sCountry('india_sender').GetName] gains a [concept_claim] on the state of our capital. A second refusal within ten years would give it claims on all our Indian states."
 nesnd_india_union_reply_decline_all_claim_tt:0 "This is our second refusal within ten years: [SCOPE.sCountry('india_sender').GetName] gains [concept_claim]s on all our Indian states."
 nesnd_india_union_reply_decline_pact_tt:0 "[concept_relations] of the other independent members of the $nesnd_india_union$ with [SCOPE.sCountry('india_sender').GetName] #r -10#!"
 nesnd_india_union_declined_we_capital_claim_tt:0 "[SCOPE.sCountry('india_sender').GetName] gains a [concept_claim] on the state of our capital."
 nesnd_india_union_declined_we_all_claim_tt:0 "[SCOPE.sCountry('india_sender').GetName] gains [concept_claim]s on all our Indian states."
 nesnd_india_union_declined_empire_capital_claim_tt:0 "We gain a [concept_claim] on the capital state of [SCOPE.sCountry('india_union_decliner').GetName]."
 nesnd_india_union_declined_empire_all_claim_tt:0 "We gain [concept_claim]s on all Indian states of [SCOPE.sCountry('india_union_decliner').GetName]."
 nesnd_india_union_declined_pact_tt:0 "[concept_relations] of the other independent members of the $nesnd_india_union$ with [SCOPE.sCountry('india_sender').GetName] #r -10#!"
 nesnd_india_project_declined_rift_tt:0 "[concept_relations] with [SCOPE.sCountry('india_partner').GetName] #r -15#!"
 nesnd_india_project_forbid_rift_tt:0 "[concept_relations] with [SCOPE.sCountry('india_consent_lord').GetName] #r -15#!"
 nesnd_india_union:0 "The Princely League"
 nesnd_india_union_reason:0 "[ROOT.GetCountry.GetName] is one of the princely states of India that remain independent. The Indian empire invites the states to adhere to it, and where an invitation is refused it lays claim to the territory of the state refusing. There is at present no common engagement among the independent states. Some at our court advocate a treaty of mutual guarantee with other states, under which, if one is attacked, the others shall come to its aid."
 nesnd_india_union_status_open:0 ""
 nesnd_india_union_status_member:0 "Independent states in the league: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_india_union_member_count')|0]#!"
 nesnd_india_union_invite_button:0 "Approach a Prince"
 nesnd_india_union_invite_button_desc:0 "Send an envoy to the princely state with which we are on the best terms and propose mutual guarantees. If it agrees, the two states sign a [concept_defensive_pact], an alliance or a guarantee of independence, and both join the $nesnd_india_union$."
 nesnd_india_union_invite_cooldown_tt:0 "No envoy has been sent in the last twelve months"
 nesnd_india_union_invite_target_tt:0 "There is a princely state to approach"
 nesnd_india_union_invite_effect_tt:0 "The envoy sets out, and the other state will answer. No other envoy can be sent for twelve months."
 nesnd_india_union_pact:0 "The Princely League"
 nesnd_india_union_broken:0 "The League Broken"
 nesnd_india_union_pact_conclusion:0 "Three or more independent states have formed a league and pledged guarantees to one another."
 nesnd_india_union_pact_trigger_tt:0 "At least #v 3#! independent states in the $nesnd_india_union$"
 nesnd_india_union_pact_protect_tt:0 "Each member of the league takes the protection of the others as its diplomatic goal."
 nesnd_india_union_pact_resist_tt:0 "When a member refuses an invitation from the empire, the other members' [concept_relations] with the empire #r -10#!."
 nesnd_india_union_broken_conclusion:0 "Fewer than two independent states remain in the league, which has ceased to exist."
 nesnd_india_union_broken_trigger_tt:0 "The $nesnd_india_union$ once had two or more independent states, and now only ours remains"
 nesnd_india_union_broken_effect_tt:0 "[concept_relations] with the last ally to leave #r -30#!. No league can be formed again for ten years."
 nesnd_india_union.5.t:0 "An Envoy from a Prince"
 nesnd_india_union.5.d:0 "[SCOPE.sCountry('india_league_inviter').GetName] has sent an envoy to propose a mutual guarantee between the two states, under which, if one is attacked, the other shall come to its aid. That state further intends to approach other princely states with a view to forming a league."
 nesnd_india_union.5.f:0 "'We desire to conclude with your State a treaty of mutual guarantee, by which, if either is attacked, the other shall come to its aid.'\n— Letter from the prince"
 nesnd_india_union.5.a:0 "Sign the Pact"
 nesnd_india_union.5.a_tt:0 "[concept_relations] with [SCOPE.sCountry('india_league_inviter').GetName] #g +20#!. The two states sign whichever of a [concept_defensive_pact], an alliance or a guarantee of independence can be signed, and we join the $nesnd_india_union$."
 nesnd_india_union.5.b:0 "Decline Politely"
 nesnd_india_union.5.b_tt:0 "[concept_relations] with [SCOPE.sCountry('india_league_inviter').GetName] #r -10#!"
 nesnd_india_union.6.t:0 "The Envoy Returns"
 nesnd_india_union.6.d_accept:0 "[SCOPE.sCountry('india_league_target').GetName] has accepted our proposal, and the two states have signed a pact."
 nesnd_india_union.6.d_decline:0 "[SCOPE.sCountry('india_league_target').GetName] has declined our proposal."
 nesnd_india_union.6.f:0 "'The envoy has returned, and the reply of the other court is submitted herewith.'\n— The envoy's report"
 nesnd_india_union.6.accept_tt:0 "[SCOPE.sCountry('india_league_target').GetName] joins the $nesnd_india_union$."
 nesnd_india_union.6.decline_tt:0 "[concept_relations] with [SCOPE.sCountry('india_league_target').GetName] #r -10#!"
 nesnd_india_union.7_outcome_tt:0 "The states of the league take the protection of one another as a diplomatic goal."
 nesnd_india_union.7.t:0 "The Princely League"
 nesnd_india_union.7.d:0 "Three or more independent states have concluded a limited pact of mutual protection. Each keeps command of its own army, but they will stand together against outside aggression."
 nesnd_india_union.7.f:0 "'Should any state party to this pact be invaded, all the states shall resist together.'\n— Pact of the Princely League"
 nesnd_india_union.7.a:0 "One Purpose Among the States"
 nesnd_india_union.7.a_tt:0 "Each member of the league takes the protection of the others as its diplomatic goal."
 nesnd_india_union.8_outcome_tt:0 "Only our state remains in the league."
 nesnd_india_union.8.t:0 "The League Broken"
 nesnd_india_union.8.d_departed:0 "[SCOPE.sCountry('india_league_departed').GetName] has left the league, in which fewer than two independent states now remain. The $nesnd_india_union$ has ceased to exist."
 nesnd_india_union.8.d_gone:0 "The other states have been annexed or have become subjects of other countries, and fewer than two independent states remain in the league. The $nesnd_india_union$ has ceased to exist."
 nesnd_india_union.8.f:0 "'Fewer than two States now remain in the league, and the treaty ceases to have effect from this day.'\n— Resolution of the state government"
 nesnd_india_union.8.a:0 "Each on Our Own"
 nesnd_india_union.8.a_departed_tt:0 "[concept_relations] with [SCOPE.sCountry('india_league_departed').GetName] #r -30#!. No league can be formed again for ten years."
 nesnd_india_union.8.a_gone_tt:0 "No league can be formed again for ten years."
 # ==== India batch 16: response to Persia's eastern claims ====
 nesnd_india_north:0 "The North-West Frontier"
 nesnd_india_north_reason:0 "$nesnd_lobby_name_per$ is bent on advancing eastwards and has laid claim to several states of [ROOT.GetCountry.GetName]. The states so claimed remain at present under our rule."
 nesnd_india_north_bar:0 "Frontier Defences"
 nesnd_india_north_bar_readout:0 "$nesnd_india_north_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_india_north_bar_monthly_desc:0 "Not at war with $nesnd_lobby_name_per$, and every state claimed remains under our rule"
 nesnd_india_north_status_watch:0 ""
 nesnd_india_north_status_war:0 "We are at war with $nesnd_lobby_name_per$."
 nesnd_india_north_garrison:0 "Frontier Garrison"
 nesnd_india_north_held:0 "The North-West Held"
 nesnd_india_north_lost:0 "The North-West Lost"
 nesnd_india_north_garrison_button:0 "Strengthen the Garrisons"
 nesnd_india_north_garrison_button_desc:0 "Make a grant for the border defences, and raise the rate of conscription in the most populous of the states claimed."
 nesnd_india_north_envoy_button:0 "Send Envoys to $nesnd_lobby_name_qe1$"
 nesnd_india_north_envoy_button_desc:0 "Send an envoy to $nesnd_lobby_name_qe1$. The territory of $nesnd_lobby_name_qe1$ marches with that of $nesnd_lobby_name_per$ on the east and north, and $nesnd_lobby_name_per$ cannot advance eastwards without regard to the attitude of that country."
 nesnd_india_north_overlord_button:0 "Ask Our Overlord to Intervene"
 nesnd_india_north_overlord_button_desc:0 "Ask our overlord to make representations to $nesnd_lobby_name_per$."
 nesnd_india_north_pay_tt:0 "Our [concept_gold_reserves] suffice to meet this payment, and we are not in [concept_default] or [concept_bankruptcy]"
 nesnd_india_north_garrison_wait_tt:0 "We have not strengthened the garrisons in the last year"
 nesnd_india_north_has_held_state_tt:0 "We still hold a claimed state"
 nesnd_india_north_qe1_alive_tt:0 "$nesnd_lobby_name_qe1$ still exists and is not at war with us"
 nesnd_india_north_envoy_wait_tt:0 "We have not sent envoys in the last year"
 nesnd_india_north_overlord_ready_tt:0 "We are a subject, and our overlord is not $nesnd_lobby_name_per$"
 nesnd_india_north_overlord_wait_tt:0 "We have not asked our overlord to intervene in the last two years"
 nesnd_india_north_garrison_effect_tt:0 "$nesnd_india_north_bar$ #g +10#!, and the most populous claimed state gains [GetStaticModifier('nesnd_india_north_garrison').GetName] for five years. Not again for a year."
 nesnd_india_north_envoy_effect_tt:0 "$nesnd_india_north_bar$ #g +10#!, and [concept_relations] with $nesnd_lobby_name_qe1$ #g +15#!. No further envoys for a year."
 nesnd_india_north_overlord_effect_tt:0 "$nesnd_india_north_bar$ #g +10#!, and our overlord's [concept_relations] with $nesnd_lobby_name_per$ #r -10#!. Not again for two years."
 nesnd_india_north_bar_plus_10_other_tt:0 "$nesnd_india_north_bar$ of [SCOPE.sCountry('india_north_defender').GetName] #g +10#!"
 nesnd_india_north_held_trigger_tt:0 "$nesnd_india_north_bar$ reaches #v 100#!"
 nesnd_india_north_held_effect_tt:0 "Each claimed state gains [GetStaticModifier('nesnd_india_north_garrison').GetName], and #g 5%#! of the people of our primary cultures there become loyalists. [concept_relations] with $nesnd_lobby_name_per$ #r -10#!. This journal will not open again for ten years."
 nesnd_india_north_held_conclusion:0 "The states claimed by $nesnd_lobby_name_per$ remain under our rule, and the border defences have been completed."
 nesnd_india_north_lost_trigger_tt:0 "A region claimed is held by $nesnd_lobby_name_per$, its overlord or one of its subjects"
 nesnd_india_north_lost_effect_tt:0 "We lay a [concept_claim] on the lost region, and #r 10%#! of the people in the state of our capital become [concept_radical]s. This journal will not open again for ten years."
 nesnd_india_north_lost_conclusion:0 "A region claimed by $nesnd_lobby_name_per$ has passed into the hands of $nesnd_lobby_name_per$ or of those connected with it."
 nesnd_india_north.1.t:0 "Defences in the East"
 nesnd_india_north.1.d:0 "It is reported that [SCOPE.sCountry('india_north_defender').GetName] is putting in order the defences of the states to which we lay claim. That country is evidently aware of our intentions."
 nesnd_india_north.1.f:0 "'[SCOPE.sCountry('india_north_defender').GetName] has of late been putting its border defences in order, with the object of barring our advance eastwards. Orders are requested as to the course to be taken.'\n— Report of a frontier officer"
 nesnd_india_north.1.a:0 "Apply Pressure"
 nesnd_india_north.1.b:0 "Hold Back for Now"
 nesnd_india_north.2_outcome_tt:0 "The border defences are completed, and the states claimed are preserved."
 nesnd_india_north.2.t:0 "The North-West Secure"
 nesnd_india_north.2.d:0 "We have completed our border defences in the states claimed by $nesnd_lobby_name_per$, and those states remain under our rule. $nesnd_lobby_name_per$ has not withdrawn its claims, and relations between the two countries have grown colder."
 nesnd_india_north.2.f:0 "'The border defences of the states claimed have been completed, and all of those states are in our possession.'\n— Report of a frontier officer"
 nesnd_india_north.2.a:0 "Reward the Defenders"
 nesnd_india_north.2.a_tt:0 "The frontier garrisons remain for ten years, and #g 5%#! of the people of our primary cultures in those states become loyalists."
 nesnd_india_north.3.t:0 "The Push East Halted"
 nesnd_india_north.3.d:0 "[SCOPE.sCountry('india_north_defender').GetName] has completed the defences of the states to which we lay claim. Our claims stand, and the advance eastwards is deferred."
 nesnd_india_north.3.f:0 "'The defences of that country are now complete, and an advance at this time would be of doubtful issue.'\n— Report of a frontier officer"
 nesnd_india_north.3.a:0 "There Will Be Other Days"
 nesnd_india_north.3.a_tt:0 "[concept_relations] with [SCOPE.sCountry('india_north_defender').GetName] #r -10#!."
 nesnd_india_north.4_outcome_tt:0 "A region claimed passes into the hands of $nesnd_lobby_name_per$ or of those connected with it."
 nesnd_india_north.4.t:0 "The North-West Lost"
 nesnd_india_north.4.d:0 "A region claimed by $nesnd_lobby_name_per$ is no longer under our rule, and is now held by $nesnd_lobby_name_per$, by its overlord or by one of its subjects. We have laid claim to the region. The number of radicals in the state of the capital has increased."
 nesnd_india_north.4.f:0 "'So long as the lost lands are not recovered, this country shall know no peace.'\n— Banner at a rally in the capital"
 nesnd_india_north.4.a:0 "Vow to Recover Them"
 nesnd_india_north.4.a_tt:0 "We lay a [concept_claim] on the lost region, and #r 10%#! of the people in the state of our capital become [concept_radical]s."
 nesnd_india_north.5.t:0 "The Push East Succeeds"
 nesnd_india_north.5.d:0 "Of the territory of [SCOPE.sCountry('india_north_defender').GetName] to which we lay claim, one region has passed into the hands of our side. It is henceforth regarded as a homeland of our primary peoples."
 nesnd_india_north.5.f:0 "'The territory claimed has now passed under our administration, which is reported for information.'\n— Report of a frontier officer"
 nesnd_india_north.5.a:0 "Secure the New Lands"
 nesnd_india_north.5.a_tt:0 "Our [Concept('concept_primary_cultures','$concept_primary_culture$')] regard the conquered region as their homeland."
