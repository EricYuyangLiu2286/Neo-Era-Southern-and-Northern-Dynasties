 nesnd_india_indep_case_2_row:0 "\n[TimeKeeper.GetCurrentDateWithDiff(Subtract_int32(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_indep_case_2_clock'), '(int32)100000'))]　[ROOT.GetCountry.GetCustom('nesnd_india_indep_case_2_actor_name')]　[ROOT.GetCountry.GetCustom('nesnd_india_indep_case_2_activity')]"
