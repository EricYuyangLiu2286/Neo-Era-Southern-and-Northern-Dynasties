l_english:
 nesnd_ming_host_huguang:0 "Court refuge: Huguang"
 nesnd_ming_host_huguang_desc:0 "Prefer Huguang if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_sichuan:0 "Court refuge: Sichuan"
 nesnd_ming_host_sichuan_desc:0 "Prefer Sichuan if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_effect_tt:0 "Prefer this country as the provisional court when the provinces break with the centre; check the other core if it becomes unavailable."
 nesnd_ming_renew_convocation:0 "Reopen the Deliberations"
 nesnd_ming_renew_convocation_desc:0 "Convene the provinces to reconsider the positions of the court and the King of Wu."
 nesnd_ming_court.3.t:0 "The Provisional Court"
 nesnd_ming_court.3.d:0 "The seals and archives have reached the provisional court. Provincial offices have yielded their halls, military officials continue to collect revenues and command their forces, and the accompanying ministers receive memorials from the provinces. Deliberations at the capital have become a diplomatic confrontation. Envoys still cross between the sides as their camps muster troops and provisions."
 nesnd_ming_court.3.a:0 "Put the court in order."
 nesnd_ming_court.9.t:0 "Remain in Nanjing"
 nesnd_ming_court.9.d:0 "The provincial replies offer no suitable refuge for the court. The carriages remain at the palace gates; the seals, treasury and cabinet papers are still in Nanjing. The court must renegotiate its arrangement with Wu or recognize the new position claimed by the Zheng house."
 nesnd_ming_court.9.a:0 "Negotiate in the capital and defer succession."
 nesnd_ming_court.9.b:0 "Recognize the Zheng claim."
 nesnd_ming_court.10.t:0 "Replies from the Provinces"
 nesnd_ming_court.10.d:0 "The provinces have not formed an armed coalition against the new court. Their replies still demand answers on revenues, military costs, appointments and overseas trade. Each arrangement must be addressed before abdication becomes a workable order."
 nesnd_ming_court.10.a:0 "Continue negotiations with the provinces."
 nesnd_ming_court_country:0 "Ming Court in Exile"
 nesnd_ming_interregnum_country:0 "Ming Provisional Government"
 nesnd_ming_court_adj:0 "Ming"
 nesnd_south_succession_board_reason:0 "The Zhu emperor retains the dynastic title. The Zheng house commands the central forces, revenues and principal overseas colonial network. The coastal provinces sustain its military and commercial power, while the regional governments maintain their own forces and industries within the common market. A change of dynasty will reopen questions of appointments, tribute, military obligations and overseas trade."
 nesnd_ming_court_transfer_effect_tt:0 "You now govern [ROOT.GetCountry.GetName]. Its forces, treasury, land and taxation systems continue to operate. If a legitimate monarch accompanies the court, monarchy is adopted and that same character takes the throne."
 nesnd_ming_court.12.t:0 "The Route Is Uncertain"
 nesnd_ming_court.12.d:0 "The provinces have broken with the centre, but the government expected to receive the court has changed. The escort cannot follow its planned route. Officials remaining in the capital can still exchange messages while confronting the orders of the new dynasty."
 nesnd_ming_court.12.a:0 "Remain in the capital and seek another opening."
 nesnd_ming_court.12.b:0 "Serve the new dynasty and abandon the evacuation."
 nesnd_ming_seek_refuge:0 "Send Another Envoy"
 nesnd_ming_seek_refuge_desc:0 "Check Huguang and Sichuan for a viable refuge. The existing confrontation and provincial independence remain in force."
 nesnd_ming_after_truce:0 "A Court Without Its Capital"
 nesnd_ming_after_truce_reason:0 "After the truce, the court remains in the provinces. New seals govern the old capital; the Ming supporters retain their own revenues, forces and offices. The provisional court may rebuild its finances, seek allies and prepare to recover the capital."
 nesnd_ming_after_truce_status:0 "Control Nanjing and the Wu capital in a new war and satisfy the actual victory conditions to negotiate restoration."
 nesnd_ming_refuge_available_tt:0 "The corresponding confrontation or war is ongoing, and Huguang or Sichuan offers an independent Ming-aligned host that controls its capital and is not controlled by another player."
