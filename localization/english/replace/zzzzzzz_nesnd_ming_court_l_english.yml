l_english:
 nesnd_ming_host_huguang:0 "Court refuge: Huguang"
 nesnd_ming_host_huguang_desc:0 "Prefer Huguang if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_sichuan:0 "Court refuge: Sichuan"
 nesnd_ming_host_sichuan_desc:0 "Prefer Sichuan if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_effect_tt:0 "When the provinces break with the centre, establish the court in refuge here if possible; otherwise consider the other available host."
 nesnd_ming_renew_convocation:0 "Reopen the Deliberations"
 nesnd_ming_renew_convocation_desc:0 "Summon representatives of the provinces and states to reconsider the positions of the Ming court and the King of Wu."
 nesnd_ming_court.3.t:0 "The Provisional Court"
 nesnd_ming_court.3.d:0 "The accompanying ministers have reached the court’s refuge, and the local government is making room for them. Its army must still raise supplies and its administrative commissions govern the province; now it must also maintain the travelling court. Ming loyalism has acquired a centre to serve, and the host must bear the first costs of breaking with Hangzhou.\n\nEnvoys continue to arrive from the provinces and overseas states. Claims once debated in the Assembly of Rites and cabinet must now be sustained by military strength."
 nesnd_ming_court.3.a:0 "Put the court in order."
 nesnd_ming_court.9.t:0 "Remain in Nanjing"
 nesnd_ming_court.9.d:0 "Neither Huguang nor Sichuan can presently receive the court, which must remain in Nanjing. Ming loyalists must continue seeking provincial support while negotiating with Hangzhou, which controls the troops and revenues. The Zheng claim to the throne is already before us; deliberations in the capital will determine how much room remains to act."
 nesnd_ming_court.9.a:0 "Negotiate in the capital and defer succession."
 nesnd_ming_court.9.b:0 "Recognize the Zheng claim."
 nesnd_ming_court.10.t:0 "The Provinces Reconsider"
 nesnd_ming_court.10.d:0 "Opponents of the new dynasty have not formed a coalition capable of taking up arms. Appointments, taxation, military obligations and overseas status remain disputed. Hangzhou must keep answering those demands if Zheng rule is to win acceptance, while Ming loyalists continue seeking allies."
 nesnd_ming_court.10.a:0 "Continue negotiations over provincial demands."
 nesnd_ming_court_country:0 "Ming Court in Exile"
 nesnd_ming_interregnum_country:0 "Ming Provisional Government"
 nesnd_ming_court_adj:0 "Ming"
 nesnd_south_succession_board_reason:0 "Whose realm is Southern Ming: the Zhu emperor’s, or the Zheng family’s creation? Nanjing retains the imperial succession, while the Southern Administration in Hangzhou commands the troops and revenues that sustain reform. The Western provinces and Hangzhou could postpone their dispute over sovereign and minister while resisting the North. With reform reaching deep into provincial life, they can no longer avoid the question of who will govern.\n\nHuguang’s academies and Xiangfan’s troops uphold the Zhu succession, while Sichuan’s republicans continue to debate the Southern Administration’s reforms. Governors in the Southern Seas and lords in Japan weigh the land, money and soldiers a new dynasty might demand. Representatives in the Assembly of Rites, ministers in the cabinet and provincial commanders will eventually have to answer for their choices."
 nesnd_ming_court_transfer_effect_tt:0 "Take control of [ROOT.GetCountry.GetName], with its existing forces, treasury, lands and tax system. If the legitimate Ming monarch accompanies the court, establish a monarchy under that ruler."
 nesnd_ming_court.12.t:0 "The Route Is Uncertain"
 nesnd_ming_court.12.d:0 "The provinces have broken with the centre, but circumstances have changed in the government chosen to receive the court. Unable to leave the capital, Ming loyalists must seek another host in Huguang or Sichuan capable of protecting the sovereign and maintaining the court. Every further day in Nanjing makes it harder to escape Hangzhou’s arrangements."
 nesnd_ming_court.12.a:0 "Remain in the capital and seek another opening."
 nesnd_ming_court.12.b:0 "Serve the new dynasty and abandon the evacuation."
 nesnd_ming_seek_refuge:0 "Send Another Envoy"
 nesnd_ming_seek_refuge_desc:0 "Send envoys again to Huguang and Sichuan to find a government able to receive the court and uphold the Ming succession."
 nesnd_ming_after_truce:0 "A Court Without Its Capital"
 nesnd_ming_after_truce_reason:0 "The truce has not returned the court to Nanjing. Ming loyalist provinces retain their armies and revenues, while Hangzhou has not abandoned its imperial claim. The court must rebuild its finances and seek allies before it can recover the old capital and settle the succession."
 nesnd_ming_after_truce_status:0 "In a new war, take Nanjing and the Wu capital and meet the terms for a restoration settlement."
 nesnd_ming_refuge_available_tt:0 "The succession confrontation or war is still underway. A Ming supporter in Huguang or Sichuan must be independent, hold its capital and be free of another player's control."
