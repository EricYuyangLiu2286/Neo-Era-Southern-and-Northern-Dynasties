l_english:
 nesnd_india_rivalry:0 "Franco-Ming Rivalry in India"
 nesnd_india_rivalry_reason:0 "Both $nesnd_lobby_name_fra$ and $nesnd_lobby_name_usm$ hold territory and client states across India, making a contest for primacy on the subcontinent unavoidable. Direct holdings, Indian subjects and the alignment of independent princes continuously pull the balance between the two powers. The rivalry will conclude either when one side gains a decisive upper hand or when both agree to fix their spheres by treaty."
 nesnd_india_rivalry_bar:0 "Contest for India"
 nesnd_india_rivalry_bar_usm_desc:0 "$nesnd_lobby_name_usm$"
 nesnd_india_rivalry_bar_fra_desc:0 "$nesnd_lobby_name_fra$"
 nesnd_india_rivalry_prog_fra_subjects:0 "Indian subjects of $nesnd_lobby_name_fra$ hold more Indian states than those of $nesnd_lobby_name_usm$"
 nesnd_india_rivalry_prog_usm_subjects:0 "Indian subjects of $nesnd_lobby_name_usm$ hold more Indian states than those of $nesnd_lobby_name_fra$"
 nesnd_india_rivalry_prog_fra_states:0 "$nesnd_lobby_name_fra$ holds more Indian states than $nesnd_lobby_name_usm$"
 nesnd_india_rivalry_prog_usm_states:0 "$nesnd_lobby_name_usm$ holds more Indian states than $nesnd_lobby_name_fra$"
 nesnd_india_rivalry_can_pay_tt:0 "Our [concept_gold_reserves] are at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_rivalry_court_price')|K] and we are not in [concept_default]"
 nesnd_india_rivalry_court_wait_tt:0 "At least twelve months have passed since a princely state was last courted"
 nesnd_india_rivalry_has_prince_tt:0 "There is an independent princely state in India"
 nesnd_india_rivalry_court_button:0 "Court a Princely State"
 nesnd_india_rivalry_court_button_desc:0 "Spend diplomatic funds on the independent Indian princely state with our highest relations to tip the contest in our favour."
 nesnd_india_rivalry_court_effect_tt:0 "[concept_relations] with the independent Indian princely state closest to us improve by #g 15#!, and the Contest for India shifts by #g 10#! in our favour. We cannot use this action again for twelve months."
 nesnd_india_rivalry_border_button:0 "Propose Border Delimitation"
 nesnd_india_rivalry_border_button_desc:0 "While the contest remains balanced and both powers are at peace, propose a delimitation compact to settle spheres of influence in India."
 nesnd_india_rivalry_border_range_tt:0 "The Contest for India bar lies between #v -30#! and #v 30#!"
 nesnd_india_rivalry_not_at_war_tt:0 "$nesnd_lobby_name_fra$ and $nesnd_lobby_name_usm$ are not at war with each other"
 nesnd_india_rivalry_border_wait_tt:0 "At least twenty-four months have passed since border delimitation was last proposed"
 nesnd_india_rivalry_border_propose_tt:0 "Send a draft delimitation treaty to our rival. If accepted, both powers conclude a ten-year passage and truce settlement, [concept_relations] improve by #g 30#!, and the rivalry ends. If refused, we gain a negative [concept_diplomatic_catalyst], [concept_relations] fall by #r 10#!, and the bar shifts by #g 10#! in our favour. We cannot propose delimitation again for twenty-four months."
 nesnd_india_rivalry_fra_win_header:0 "#title $nesnd_lobby_name_fra$ Gains the Upper Hand#!\n"
 nesnd_india_rivalry_fra_win_effect_header:0 "#title If $nesnd_lobby_name_fra$ Gains the Upper Hand:#!\n$EFFECT$"
 nesnd_india_rivalry_fra_win_tt:0 "The Contest for India has reached #v 100#! (in favour of $nesnd_lobby_name_fra$)"
 nesnd_india_rivalry_fra_win_effect_tt:0 "$nesnd_lobby_name_fra$ gains [concept_claim] on up to three Indian states held by $nesnd_lobby_name_usm$ bordering $nesnd_lobby_name_fra$ or its subjects, plus a ten-year [concept_prestige] bonus. $nesnd_lobby_name_usm$ suffers a ten-year [concept_legitimacy] penalty. The journal ends for both powers and may reopen after ten years."
 nesnd_india_rivalry_fra_win_conclusion:0 "$nesnd_lobby_name_fra$ has gained the upper hand in the Indian contest, opening a sharper phase of rivalry on the subcontinent."
 nesnd_india_rivalry_fra_win_outcome_tt:0 "Both powers receive their respective outcome events marking the ascendancy of $nesnd_lobby_name_fra$ in India."
 nesnd_india_rivalry_usm_win_header:0 "#title $nesnd_lobby_name_usm$ Gains the Upper Hand#!\n"
 nesnd_india_rivalry_usm_win_effect_header:0 "#title If $nesnd_lobby_name_usm$ Gains the Upper Hand:#!\n$EFFECT$"
 nesnd_india_rivalry_usm_win_tt:0 "The Contest for India has reached #v -100#! (in favour of $nesnd_lobby_name_usm$)"
 nesnd_india_rivalry_usm_win_effect_tt:0 "$nesnd_lobby_name_usm$ gains [concept_claim] on up to three Indian states held by $nesnd_lobby_name_fra$ bordering $nesnd_lobby_name_usm$ or its subjects, plus a ten-year [concept_prestige] bonus. $nesnd_lobby_name_fra$ suffers a ten-year [concept_legitimacy] penalty. The journal ends for both powers and may reopen after ten years."
 nesnd_india_rivalry_usm_win_conclusion:0 "$nesnd_lobby_name_usm$ has gained the upper hand in the Indian contest, opening a sharper phase of rivalry on the subcontinent."
 nesnd_india_rivalry_usm_win_outcome_tt:0 "Both powers receive their respective outcome events marking the ascendancy of $nesnd_lobby_name_usm$ in India."
 nesnd_india_rivalry_border_header:0 "#title Border Delimitation#!\n"
 nesnd_india_rivalry_border_effect_header:0 "#title If Delimitation Is Agreed:#!\n$EFFECT$"
 nesnd_india_rivalry_border_trigger_tt:0 "Both powers have agreed to delimit their spheres in India"
 nesnd_india_rivalry_border_outcome_effect_tt:0 "Both powers conclude a ten-year delimitation [concept_treaty] and mutual [concept_truce], [concept_relations] improve by #g 30#!, and each receives a ten-year [concept_influence] bonus. The journal ends for both powers and cannot reopen for twenty years."
 nesnd_india_rivalry_border_conclusion:0 "$nesnd_lobby_name_fra$ and $nesnd_lobby_name_usm$ have signed a formal delimitation treaty, halting their rivalry in India."
 nesnd_india_rivalry.4_outcome_tt:0 "Both governments receive the event '$nesnd_india_rivalry.4.t$', confirming the delimitation settlement and a twenty-year pause in the rivalry."
 nesnd_india_rivalry_upper:0 "Ascendancy in India"
 nesnd_india_rivalry_lower:0 "Setback in India"
 nesnd_india_rivalry_border:0 "Indian Delimitation Accord"
 nesnd_india_rivalry.1.t:0 "Draft Treaty of Bombay"
 nesnd_india_rivalry.1.d:0 "Envoys from [SCOPE.sCountry('india_rivalry_proposer').GetName] have presented a draft agreement to delimit spheres of influence across India, recognising current holdings and client states on both sides under a lasting pledge of peace."
 nesnd_india_rivalry.1.f:0 "“To avert needless war across the subcontinent, we submit this draft ten-year delimitation compact for your government's consideration.”\n— Note of the Plenipotentiaries"
 nesnd_india_rivalry.1.a:0 "Accept delimitation and sign the treaty"
 nesnd_india_rivalry.1.a_tt:0 "Both powers sign a ten-year mutual military access [concept_treaty] if eligible, establish a ten-year mutual [concept_truce], improve [concept_relations] by #g 30#!, and each gain a ten-year [concept_influence] bonus. '$nesnd_india_rivalry$' concludes and cannot reopen for twenty years."
 nesnd_india_rivalry.1.b:0 "Reject the draft"
 nesnd_india_rivalry.1.b_tt:0 "[SCOPE.sCountry('india_rivalry_proposer').GetName] gains a negative [concept_diplomatic_catalyst] towards us, and the Contest for India shifts by #r 10#! in their favour."
 nesnd_india_rivalry.2.t:0 "Upper Hand in India"
 nesnd_india_rivalry.2.d:0 "Years of steady pressure across territories, client states and princely diplomacy have carried [ROOT.GetCountry.GetName] ahead of [SCOPE.sCountry('india_rivalry_loser').GetName] in India. Local courts have begun to lean our way, and [ROOT.GetCountry.GetName] has registered formal claims on neighbouring Indian holdings of our rival. Whether to press that advantage by force remains a question of statecraft."
 nesnd_india_rivalry.2.f:0 "“The balance on the subcontinent has shifted in our favour, and frontier claims have been formally notified.”\n— Colonial Office Bulletin"
 nesnd_india_rivalry.2.a:0 "Consolidate our gains"
 nesnd_india_rivalry.2.a_tt:0 "We gain [concept_claim] on up to three neighbouring Indian states and a ten-year [concept_prestige] bonus. The rivalry may resume after ten years if both powers remain in India."
 nesnd_india_rivalry.3.t:0 "Outmanoeuvred in India"
 nesnd_india_rivalry.3.d:0 "[ROOT.GetCountry.GetName] has failed to check the advance of [SCOPE.sCountry('india_rivalry_winner').GetName] among the states and courts of India. Emboldened by its advantage, our rival has lodged formal claims against neighbouring territories under our rule, sparking sharp criticism at home. Our government must shore up its defences and diplomacy against further encroachment."
 nesnd_india_rivalry.3.f:0 "“Formal territorial claims have been lodged against our frontier provinces in India. Urgent instructions are requested.”\n— Despatch from the Indian Command"
 nesnd_india_rivalry.3.a:0 "Reinforce our defences"
 nesnd_india_rivalry.3.a_tt:0 "We suffer a ten-year [concept_legitimacy] penalty, whilst our rival holds [concept_claim] on neighbouring Indian states."
 nesnd_india_rivalry.4.t:0 "The Treaty of Bombay"
 nesnd_india_rivalry.4.d:0 "Plenipotentiaries of [ROOT.GetCountry.GetName] and [SCOPE.sCountry('india_rivalry_partner').GetName] have exchanged ratifications, bringing the Treaty of Bombay into force. Both powers recognise each other's existing territories and client borders across India under a truce and passage arrangement, quieting a long-contested frontier."
 nesnd_india_rivalry.4.f:0 "“Ratifications having been exchanged at Bombay, both governments pledge to respect existing boundaries across the subcontinent for ten years.”\n— Preamble of the Treaty of Bombay"
 nesnd_india_rivalry.4.a:0 "Ratify the settlement"
 nesnd_india_rivalry.4.a_tt:0 "The delimitation and truce enter into force, both powers gain a ten-year [concept_influence] bonus, and '$nesnd_india_rivalry$' cannot reopen for twenty years."
 nesnd_india_rivalry.5.t:0 "Delimitation Proposal Refused"
 nesnd_india_rivalry.5.d:0 "[SCOPE.sCountry('india_rivalry_refuser').GetName] has formally rejected the Indian delimitation draft submitted by [ROOT.GetCountry.GetName], refusing to fix the boundary between our spheres. The rebuff cools bilateral relations further, whilst turning diplomatic opinion among the Indian courts towards our side."
 nesnd_india_rivalry.5.f:0 "“This government cannot accept the boundary proposals submitted by your envoys.”\n— Formal Diplomatic Reply"
 nesnd_india_rivalry.5.a:0 "Press on with the contest"
 nesnd_india_rivalry.5.a_tt:0 "We gain a negative [concept_diplomatic_catalyst] towards [SCOPE.sCountry('india_rivalry_refuser').GetName], [concept_relations] fall by #r 10#!, and the Contest for India shifts by #g 10#! in our favour."
