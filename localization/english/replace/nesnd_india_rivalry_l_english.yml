l_english:
 nesnd_india_rivalry:0 "Franco-Ming Rivalry in India"
 nesnd_india_rivalry_reason:0 "$nesnd_lobby_name_fra$ and $nesnd_lobby_name_usm$ both hold states and subject realms in India, and their garrisons face each other across the border. The independent princes manoeuvre between the two, careful to offend neither side. Diplomats on both sides have already proposed that, rather than come to war, the two countries should settle their spheres by negotiation."
 nesnd_india_rivalry_bar:0 "Ascendancy in India"
 nesnd_india_rivalry_bar_usm_desc:0 "$nesnd_lobby_name_usm$"
 nesnd_india_rivalry_bar_fra_desc:0 "$nesnd_lobby_name_fra$"
 nesnd_india_rivalry_prog_fra_subjects:0 "The Indian subjects of $nesnd_lobby_name_fra$ hold more states"
 nesnd_india_rivalry_prog_usm_subjects:0 "The Indian subjects of $nesnd_lobby_name_usm$ hold more states"
 nesnd_india_rivalry_prog_fra_states:0 "$nesnd_lobby_name_fra$ holds more Indian states directly"
 nesnd_india_rivalry_prog_usm_states:0 "$nesnd_lobby_name_usm$ holds more Indian states directly"
 nesnd_india_rivalry_can_pay_tt:0 "We can afford the cost and are not in [concept_default] or [concept_bankruptcy]"
 nesnd_india_rivalry_court_wait_tt:0 "We have not courted a prince in the last year"
 nesnd_india_rivalry_has_prince_tt:0 "India still has an independent princely state"
 nesnd_india_rivalry_court_button:0 "Court a Prince"
 nesnd_india_rivalry_court_button_desc:0 "Pay to court the independent prince on the best terms with us."
 nesnd_india_rivalry_court_effect_tt:0 "[concept_relations] with that prince #g +15#!, and $nesnd_india_rivalry_bar$ moves #g 10#! our way. Not again for a year."
 nesnd_india_rivalry_border_button:0 "Propose a Boundary"
 nesnd_india_rivalry_border_button_desc:0 "Propose to the other side that the two countries mark out their spheres in India: mutual military access for ten years, and no war between them for ten years."
 nesnd_india_rivalry_border_range_tt:0 "$nesnd_india_rivalry_bar$ is between #v -30#! and #v 30#!"
 nesnd_india_rivalry_not_at_war_tt:0 "The two countries are not at war"
 nesnd_india_rivalry_border_wait_tt:0 "We have not proposed a boundary in the last two years"
 nesnd_india_rivalry_border_propose_tt:0 "The other side will answer. No further proposal for two years."
 nesnd_india_rivalry_fra_win_header:0 "#title $nesnd_lobby_name_fra$ gains the upper hand if:\n#!"
 nesnd_india_rivalry_fra_win_effect_header:0 "#title If $nesnd_lobby_name_fra$ gains the upper hand:#!\n$EFFECT$"
 nesnd_india_rivalry_fra_win_tt:0 "$nesnd_india_rivalry_bar$ reaches the end of $nesnd_lobby_name_fra$"
 nesnd_india_rivalry_fra_win_effect_tt:0 "$nesnd_lobby_name_fra$ lays [concept_claim]s on up to three Indian states of $nesnd_lobby_name_usm$ bordering its own, and gains [GetStaticModifier('nesnd_india_rivalry_upper').GetName]. $nesnd_lobby_name_usm$ gains [GetStaticModifier('nesnd_india_rivalry_lower').GetName]. No new quarrel between the two for ten years."
 nesnd_india_rivalry_fra_win_conclusion:0 "$nesnd_lobby_name_fra$ has gained the upper hand in India."
 nesnd_india_rivalry_fra_win_outcome_tt:0 "Both countries will learn the result."
 nesnd_india_rivalry_usm_win_header:0 "#title $nesnd_lobby_name_usm$ gains the upper hand if:\n#!"
 nesnd_india_rivalry_usm_win_effect_header:0 "#title If $nesnd_lobby_name_usm$ gains the upper hand:#!\n$EFFECT$"
 nesnd_india_rivalry_usm_win_tt:0 "$nesnd_india_rivalry_bar$ reaches the end of $nesnd_lobby_name_usm$"
 nesnd_india_rivalry_usm_win_effect_tt:0 "$nesnd_lobby_name_usm$ lays [concept_claim]s on up to three Indian states of $nesnd_lobby_name_fra$ bordering its own, and gains [GetStaticModifier('nesnd_india_rivalry_upper').GetName]. $nesnd_lobby_name_fra$ gains [GetStaticModifier('nesnd_india_rivalry_lower').GetName]. No new quarrel between the two for ten years."
 nesnd_india_rivalry_usm_win_conclusion:0 "$nesnd_lobby_name_usm$ has gained the upper hand in India."
 nesnd_india_rivalry_usm_win_outcome_tt:0 "Both countries will learn the result."
 nesnd_india_rivalry_border_header:0 "#title A boundary is agreed if:\n#!"
 nesnd_india_rivalry_border_effect_header:0 "#title If a boundary is agreed:#!\n$EFFECT$"
 nesnd_india_rivalry_border_trigger_tt:0 "The two countries have signed a boundary treaty"
 nesnd_india_rivalry_border_outcome_effect_tt:0 "The two countries grant each other military access and keep a truce for ten years. No new quarrel between the two for twenty years."
 nesnd_india_rivalry_border_conclusion:0 "The two countries have marked out their spheres in India."
 nesnd_india_rivalry.4_outcome_tt:0 "The two countries sign a boundary treaty."
 nesnd_india_rivalry_upper:0 "The Upper Hand in India"
 nesnd_india_rivalry_lower:0 "Losing Ground in India"
 nesnd_india_rivalry_border:0 "The Boundary Treaty"
 nesnd_india_rivalry.1.t:0 "A Proposed Boundary"
 nesnd_india_rivalry.1.d:0 "The envoy of [SCOPE.sCountry('india_rivalry_proposer').GetName] proposes that our two countries mark out their spheres in India: mutual military access for ten years, and no war between us for ten years."
 nesnd_india_rivalry.1.f:0 "'The boundaries and spheres of the two countries in India, having been discussed by both parties, are fixed as follows.'\n— Draft boundary treaty"
 nesnd_india_rivalry.1.a:0 "Agree to the Boundary"
 nesnd_india_rivalry.1.a_tt:0 "The two countries sign a ten-year treaty of mutual [concept_military_access] and keep a truce for ten years. [concept_relations] with [SCOPE.sCountry('india_rivalry_proposer').GetName] #g +30#!, and both gain [GetStaticModifier('nesnd_india_rivalry_border').GetName]."
 nesnd_india_rivalry.1.b:0 "Refuse"
 nesnd_india_rivalry.1.b_tt:0 "[concept_relations] with [SCOPE.sCountry('india_rivalry_proposer').GetName] #r -10#!"
 nesnd_india_rivalry.2.t:0 "The Upper Hand in India"
 nesnd_india_rivalry.2.d:0 "We have prevailed over [SCOPE.sCountry('india_rivalry_loser').GetName] in the contest for India. The princes have seen which way the wind blows, and the standing of [SCOPE.sCountry('india_rivalry_loser').GetName] on the subcontinent has collapsed."
 nesnd_india_rivalry.2.f:0 "'Our position in India has never been as secure as it is today.'\n— Report of the colonial minister"
 nesnd_india_rivalry.2.a:0 "Press the Advantage"
 nesnd_india_rivalry.2.a_tt:0 "We lay [concept_claim]s on up to three Indian states of [SCOPE.sCountry('india_rivalry_loser').GetName] bordering our own, and gain [GetStaticModifier('nesnd_india_rivalry_upper').GetName]."
 nesnd_india_rivalry.3.t:0 "Losing Ground in India"
 nesnd_india_rivalry.3.d:0 "[SCOPE.sCountry('india_rivalry_winner').GetName] has prevailed over us in the contest for India. The princes are turning to them one after another, and our standing on the subcontinent is in danger."
 nesnd_india_rivalry.3.f:0 "'Our position in India has reached a point that must be faced squarely.'\n— Report of the colonial minister"
 nesnd_india_rivalry.3.a:0 "Bide Our Time"
 nesnd_india_rivalry.3.a_tt:0 "[SCOPE.sCountry('india_rivalry_winner').GetName] lays [concept_claim]s on up to three of our Indian states, and we gain [GetStaticModifier('nesnd_india_rivalry_lower').GetName]."
 nesnd_india_rivalry.4.t:0 "The Boundary Treaty"
 nesnd_india_rivalry.4.d:0 "We have signed a boundary treaty with [SCOPE.sCountry('india_rivalry_partner').GetName], marking out the spheres of our two countries in India. For ten years each army may pass through the other's territory, and the two will not fight each other in India."
 nesnd_india_rivalry.4.f:0 "'The boundaries and spheres of the two countries in India, having been discussed by both parties, are fixed as follows.'\n— The boundary treaty"
 nesnd_india_rivalry.4.a:0 "Sign"
 nesnd_india_rivalry.4.a_tt:0 "No new quarrel between the two countries for twenty years."
 nesnd_india_rivalry.5.t:0 "The Boundary Refused"
 nesnd_india_rivalry.5.d:0 "[SCOPE.sCountry('india_rivalry_refuser').GetName] has refused our proposal for a boundary, and the contest for India goes on."
 nesnd_india_rivalry.5.f:0 "'Our government has no wish to confer with yours on the boundaries in India.'\n— The reply"
 nesnd_india_rivalry.5.a:0 "Noted"
 nesnd_india_rivalry.5.a_tt:0 "[concept_relations] with [SCOPE.sCountry('india_rivalry_refuser').GetName] #r -10#!"
