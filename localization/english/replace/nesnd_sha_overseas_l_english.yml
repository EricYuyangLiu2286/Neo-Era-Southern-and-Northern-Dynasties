l_english:
 nesnd_sha_foothold:0 "A Foothold Overseas"
 nesnd_sha_foothold_reason:0 "Denglai merchants have run farm colonies in Dongzhou for generations. Now the assembly is looking to Africa, where it wants land under the republic's own administration to give its ocean fleet docks, granaries and a basis for taxation.\n\nThe harbours of Somaliland and northern Madagascar each have an owner; we may lay claim to them or offer to lease them. The Kenyan coast has only native tribes, and we may settle it under our colonial laws. Ming's harbour in Mozambique can only be leased."
 nesnd_sha_foothold_status:0 "Hold land or a treaty port in Africa. Press a claim or negotiate a lease in Somaliland or northern Madagascar, establish a colony on the Kenyan coast under the colonial laws, or seek a lease from Ming in Mozambique."
 nesnd_sha_settlement:0 "The Overseas Settlements"
 nesnd_sha_settlement_reason:0 "With a territory in hand, the next step is to ship people there. The assembly subsidises the sailings to send the poor, the educated and the clergy of our country to settle in Africa, clear land and build towns, so that grain and taxes may one day be drawn from them.\n\nThe native tribes on the coast have farmed and grazed this land for generations. In the eyes of Denglai officials, people who understand no title deeds and pay no national taxes need not be asked before their land is assigned to settlers."
 nesnd_sha_ocean_company:0 "Denglai Ocean Company"
 nesnd_sha_choose_landing:0 "Choose a Landing Site"
 nesnd_sha_choose_landing_desc:0 "Authorise a survey of one of the proposed sites. Filing a claim costs the treasury money. The government retains the decision whether to start a diplomatic play."
 nesnd_sha_change_destination:0 "Change Destination"
 nesnd_sha_change_destination_desc:0 "Send the next group of settlers to another populated Denglai territory in Africa. The sailing schedule starts over."
 nesnd_sha_change_people:0 "Change Recruitment"
 nesnd_sha_change_people_desc:0 "Reschedule the sailing and recruit from the next group for which the assembly has authorised passage."
 nesnd_sha_extra_sailings:0 "Schedule Extra Sailings"
 nesnd_sha_extra_sailings_desc:0 "Cycle between the ordinary schedule and two levels of extra sailings. The treasury pays for the additional voyages each week."
 nesnd_sha_expand_transport:0 "Increase Passenger Capacity"
 nesnd_sha_expand_transport_desc:0 "Increase the number who can travel on a single sailing. A capacity of ten thousand requires a level-two port in the capital. Twenty thousand requires level three."
 nesnd_sha_expand_recruitment:0 "Broaden Recruitment"
 nesnd_sha_expand_recruitment_desc:0 "After three successful voyages and a level-two capital port, recruit Liaodong and Jurchen people in the northeast. Five voyages and a level-three port open recruitment to Koreans and compatriots in the Russian far north if Korea has signed the compact or ceased to exist."
 nesnd_sha_intensive_settlement:0 "Concentrate on Settlement"
 nesnd_sha_intensive_settlement_desc:0 "Give the colonial administration first call on government staff for a year."
 nesnd_sha_settlement_office:0 "Overseas Settlement Office"
 nesnd_sha_extra_colonists:0 "Reinforced Colonial Administration"
 nesnd_sha_ocean_republic:0 "A Republic Beyond the Oceans"
 nesnd_sha_lease_port:0 "Negotiate a Port Lease"
 nesnd_sha_lease_port_desc:0 "Pay the government controlling an African harbour in exchange for jurisdiction over a treaty port."
 nesnd_sha_lease_terms:0 "On agreement, Denglai pays #v 3%#! of its GDP, at least @money!#v 7,500#!. After a refusal, we must wait #v 36#! months before asking again."
 nesnd_sha_lease_unrecognized:0 "The other government is unrecognised"
 nesnd_sha_sailings:0 "Settlement Sailings"
 nesnd_sha_sailings_desc:0 "Settlement sailing #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_sha_change_destination_tt:0 "Switch to the next available destination and start the sailing schedule again."
 nesnd_sha_change_people_tt:0 "Switch to the next eligible group and start the sailing schedule again."
 nesnd_sha_extra_sailings_tt:0 "The first level adds #g 1#! weekly progress for #v 0.025%#! of GDP per week. The second adds #g 2#! for #v 0.05%#!. Select it again to resume the ordinary schedule."
 nesnd_sha_expand_recruitment_tt:0 "Authorise shipowners to recruit from the next group."
 nesnd_sha_manifest_north:0 "North Chinese intellectuals and poor households"
 nesnd_sha_manifest_northeast:0 "Liaodong and Jurchen people in the northeast"
 nesnd_sha_manifest_frontier:0 "Koreans and compatriots in the Russian far north"
 nesnd_sha_manifest_harbor:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_sha_destination').GetState.GetName]"
 nesnd_sha_manifest_no_harbor:0 "No receiving settlement"
 nesnd_sha_sailings_base:0 "Ordinary sailings"
 nesnd_sha_sailings_extra:0 "Additional sailings"
 nesnd_sha_ocean_company_desc:0 "An African foothold gives Denglai a base for plantations and ocean shipping. Firms with adequate docks in the capital and a colonial administration overseas may seek a charter from the republic."
 nesnd_sha_ocean_company_tt:0 "With an African possession, a colonial law and a level #v 3#! port in the capital, the $nesnd_sha_ocean_company$ can be established through the company interface."
 nesnd_sha_seven_states_tt:0 "Denglai holds land directly in Africa and controls at least #v 7#! African states under the native colonial count, including those of its African subjects."
 nesnd_sha_overseas.1.t:0 "A Destination for the Ocean Fleet"
 nesnd_sha_overseas.1.d:0 "The shipowners ask the assembly to choose a landing place first. The harbours of Somaliland and northern Madagascar each have an owner, and whether we claim or lease, we must deal with that owner first. The Kenyan coast has only native tribes, and we may settle it under our colonial laws. Ming's harbour in Mozambique can only be leased and is not among the choices here."
 nesnd_sha_overseas.1.f:0 "“I will take the ship into harbour. If anyone ashore tries to stop us, give me a paper that allows me to open fire.”— An ocean shipowner"
 nesnd_sha_overseas.1.a:0 "File a claim to $STATE_SOMALILAND$."
 nesnd_sha_overseas.1.b:0 "File a claim to $STATE_NORTH_MADAGASCAR$."
 nesnd_sha_overseas.1.c:0 "File a claim on the coast of $STATE_KENYA$."
 nesnd_sha_overseas.1.wait:0 "Withhold the commission for now."
 nesnd_sha_overseas.2.t:0 "The First Settlers Land"
 nesnd_sha_overseas.2.d:0 "The first settlers from [SCOPE.sState('nesnd_sha_embarkation').GetName] have landed at [SCOPE.sState('nesnd_sha_harbor').GetName]: #v [SCOPE.GetValue('nesnd_sha_landed')|0]#! people in all. The harbour office is allotting lodging, rations and tools by that number."
 nesnd_sha_overseas.2.f:0 "“The rations issued on board last until we land. Until the first harvest comes in, we ask the office to issue grain by head.”— Petition of the settlers"
 nesnd_sha_overseas.2.a:0 "Issue provisions against the count ashore."
 nesnd_sha_overseas.3.t:0 "Water and the Road"
 nesnd_sha_overseas.3.d:0 "After the third group of settlers landed at [SCOPE.sState('nesnd_sha_harbor').GetName], the office drew a stretch of the road to the water source into the farmland. The natives have used that road for generations to fetch water and drive their herds. Now shut out, they have gathered several times to cause trouble.\n\nBuilding another road will cost the treasury. Keeping the boundary as drawn means sending troops to drive the natives off."
 nesnd_sha_overseas.3.f:0 "“The deed says this is Denglai land. Those who will not recognise the deed can recognise the rifle.”— A colonial officer"
 nesnd_sha_overseas.3.a:0 "Fund a new road."
 nesnd_sha_overseas.3.b:0 "Keep the boundary as drawn and send troops to disperse the natives."
 nesnd_sha_overseas.4.t:0 "A Wasted Sailing"
 nesnd_sha_overseas.4.d:0 "Not one settler from this group has settled at the intended destination. A sailing is wasted when the port of departure cannot find people, when war cuts the route, or when the destination no longer belongs to Denglai. After three wasted sailings in a row, the sailings are suspended."
 nesnd_sha_overseas.4.f:0 "“The ship sailed and the people never arrived. I still expect to be paid for the voyage.”— A contracted shipowner"
 nesnd_sha_overseas.4.a:0 "Record no arrivals for this group."
 nesnd_sha_overseas.5.t:0 "A Republic Beyond the Oceans"
 nesnd_sha_overseas.5.d:0 "In the past, ships from the far north sold captives to Dongzhou and put the money into farm colonies and the arms trade. Now the republic has its own territory in Africa, and plantations, shipyards and harbour dues have all become matters for the National Assembly. The shipowners believe the assembly finally has the power to protect their business."
 nesnd_sha_overseas.5.f:0 "“The land in Dongzhou belongs to others. The land in Africa is our own.”— A Denglai shipowner"
 nesnd_sha_overseas.5.a:0 "Put overseas affairs before the assembly."
 nesnd_sha_settlement_status:0 "Destination: [ROOT.GetCountry.GetCustom('nesnd_sha_current_harbor')]. Recruiting: [ROOT.GetCountry.GetCustom('nesnd_sha_current_people')]. Capacity: [ROOT.GetCountry.MakeScope.Var('nesnd_sha_capacity').GetValue|0]. Extra sailing level: [ROOT.GetCountry.MakeScope.Var('nesnd_sha_sailing_level').GetValue|0]. Successful arrivals: [ROOT.GetCountry.MakeScope.Var('nesnd_sha_voyages').GetValue|0]."
 nesnd_sha_settlement_paused:0 "Three successive sailings brought no settlers ashore. Choose a destination or recruiting group to resume.\nDestination: [ROOT.GetCountry.GetCustom('nesnd_sha_current_harbor')]. Recruiting: [ROOT.GetCountry.GetCustom('nesnd_sha_current_people')]. Capacity: [ROOT.GetCountry.MakeScope.Var('nesnd_sha_capacity').GetValue|0]. Extra sailing level: [ROOT.GetCountry.MakeScope.Var('nesnd_sha_sailing_level').GetValue|0]. Successful arrivals: [ROOT.GetCountry.MakeScope.Var('nesnd_sha_voyages').GetValue|0]."
