 nesnd_qe1_forecast_none:0 "\nAffected provinces next month: none"
 nesnd_qe1_unity_journal:0 "Holding the Empire Together"
 nesnd_qe1_unity_journal_reason:0 "Trade routes, villages and military colonies drew people of many origins under the rule of the Chen emperors of Qin. The Western Regions Han-Qiang are a product of the empire's expansion, and the empire's soldiers and revenue come from them. In good years, people are glad to share a common identity; when conscription grows heavy and times turn hard, the old clan names, faiths and home villages are dug up again."
 nesnd_qe1_uprising_journal:0 "The Frontier Uprising"
 nesnd_qe1_uprising_journal_reason:0 "Petitions no longer satisfy the associations of the frontier. They are gathering provisions, approaching old noble families and religious leaders, and challenging imperial tax collectors and recruiting officers in the name of local peoples. Ili still has time to win back their loyalty; wait any longer, and the scattered revolts will join into one."
 nesnd_qe1_conversion_cohort:0 "Western Regions Han-Qiang"
 nesnd_qe1_identity.1.a:0 "The provinces have lost faith in our promises."
 nesnd_qe1_identity.1.t:0 "An Identity Unravels"
 nesnd_qe1_identity.1.d:0 "The villages and military colonies of [SCOPE.sStateRegion('nesnd_qe1_declining_region').GetName] are rediscovering their past. Old ethnic names, sacred texts and local ties are once again the foundations of trust. About half of the province's Western Regions Han-Qiang now identify as [SCOPE.sCulture('nesnd_qe1_return_culture').GetName] and follow the [SCOPE.sReligion('nesnd_qe1_return_religion').GetName] faith."
