 nesnd_qe1_unity_food_desc:0 "Famine"
 nesnd_qe1_subsidy_material_tt:0 "Under present conditions, unity gains #g +[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_subsidy_material_rate')|2]#! each month. The figure is halved while the country is borrowing and is nil in default or bankruptcy. It also varies with [concept_sol], with current unity and with the number of consecutive terms, and is nil once unity reaches #v 70#!."
