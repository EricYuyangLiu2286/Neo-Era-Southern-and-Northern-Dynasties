 nesnd_qe1_unity_bar_desc:0 "$nesnd_qe1_unity$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_qe1_unity_hope:0 "Farmers, townspeople and soldiers still see their future in the Empire."
 nesnd_qe1_unity_doubt:0 "Older local identities are reviving, and imperial orders carry less weight in the provinces."
 nesnd_qe1_unity_crisis:0 "Old ethnic names have become rallying cries for armed resistance."
 nesnd_qe1_forecast_state:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_next_size')|D]#! [GetCulture('ce_xiyu').GetName] in [ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_state').GetState.GetName] return to [ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_culture').GetCulture.GetName] culture and the [ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_religion').GetReligion.GetName] faith, provided cohesion is still below #v 50#!."
 nesnd_qe1_forecast_all:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_next_size')|D]#! residents from outside the Chinese cultural sphere across the country adopt [GetCulture('ce_xiyu').GetName] culture, provided cohesion is still above #v 75#!."
 nesnd_qe1_forecast_none:0 "\nNext monthly update: no conversion."
 nesnd_qe1_forecast_state_undrawn:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_next_size')|D]#! [GetCulture('ce_xiyu').GetName] in [ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_state').GetState.GetName] return to an older local culture and faith, drawn at that time from the province's original population, provided cohesion is still below #v 50#!."
 nesnd_qe1_forecast_missed:0 "\nNext monthly update: no conversion. No [concept_state] was drawn this month. Below #v 50#! cohesion, the chance is #v 20%#! each month."
 nesnd_qe1_forecast_no_state:0 "\nNext monthly update: no conversion. No [concept_state] or community qualifies."
 nesnd_qe1_forecast_mid:0 "\nNext monthly update: no conversion. Cohesion is between #v 50#! and #v 75#!."
 nesnd_qe1_unity_journal:0 "Holding the Empire Together"
 nesnd_qe1_unity_journal_reason:0 "Trade routes, village communities and military colonies brought peoples of many origins under the Chen emperors of Qin. [GetCulture('ce_xiyu').GetName] took shape in that expansion and now supply much of the country's manpower and revenue. In good years people are content to share a single name. When conscription weighs heavily and times are hard, they remember the older names of their kin, their faith and their home villages."
 nesnd_qe1_conversion_cohort:0 "Western Regions Han-Qiang"
 nesnd_qe1_identity.1.a:0 "The provinces have lost faith in our promises."
 nesnd_qe1_identity.1.t:0 "An Identity Unravels"
 nesnd_qe1_identity.1.d:0 "The villages and military colonies of [SCOPE.sStateRegion('nesnd_qe1_declining_region').GetName] are rediscovering their past. Old ethnic names, sacred texts and local ties are once again the foundations of trust. About half of the province's [GetCulture('ce_xiyu').GetName] now identify as [SCOPE.sCulture('nesnd_qe1_return_culture').GetName] and follow the [SCOPE.sReligion('nesnd_qe1_return_religion').GetName] faith."
 nesnd_qe1_identity.1.f:0 "“Our forefathers came from Hexi. Their forefathers came from farther west.”\n- Lineage recited in a village of the Western Regions"
