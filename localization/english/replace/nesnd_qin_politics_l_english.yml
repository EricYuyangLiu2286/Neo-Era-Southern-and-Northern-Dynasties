 nesnd_qe1_balance_bar_desc:0 "$nesnd_qe1_balance$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]#!  (Civil −50 / Military +50)"
 nesnd_qe1_agenda_status_econ:0 "The reformers are gaining ground at court."
 nesnd_qe1_agenda_status_army:0 "The military faction is courting imperial favor."
 nesnd_qe1_agenda_status_neutral:0 "The court remains divided over the Empire's future."
 nesnd_qe1_agenda_journal:0 "Reviving the Western Empire"
 nesnd_qe1_agenda_journal_reason:0 "Since the Qin armies withdrew to Ili, the Chen imperial house has continued to look east toward the Jade Gate. Its soldiers and military nobility are less eager to march again. The Empire must restore production and tax revenue. The army needs recruits and pay. The reformers would begin with the laws that govern farmers, artisans and merchants. The military faction insists that imperial decrees will carry little weight in the provinces without an army to enforce them."
 nesnd_qe1_economy_journal:0 "The Reform Agenda"
 nesnd_qe1_economy_journal_reason:0 "The reformers seek a free market in land, freedom for merchants to conduct their business, and a voice at court for men of property. Only by restoring its people's prosperity, they argue, can the Western Empire afford to challenge its eastern rivals again."
 nesnd_qe1_army_journal:0 "The Military Agenda"
 nesnd_qe1_army_journal_reason:0 "The army has no wish to squander its strength on another hasty eastern expedition. Its leaders demand new regiments, a secure hold over Persia, and fresh lands and revenues on the Indian and Russian frontiers. Only then will they consider the country beyond the Jade Gate."
 nesnd_qe1_quiet_status:0 ""
 nesnd_qe1_econ_ready_status:0 "The reformers' three laws are in force, and new workshops and railways strengthen their position."
 nesnd_qe1_army_ready_status:0 "The army has expanded, and victories on the western frontier have raised its standing."
 nesnd_qe1_agenda_gate_tt:0 "This proposal cannot be submitted again for six months."
 nesnd_qe1_law_push_button:0 "Press for Legislation"
 nesnd_qe1_law_push_button_desc:0 "Order officials to advance the legislation. Opposition from the military and landowners must no longer keep it from the court."
 nesnd_qe1_economy_push_button:0 "Retrench and Rebuild"
 nesnd_qe1_economy_push_button_desc:0 "Press the reform agenda at court, demanding concessions from the military and rural associations so that economic recovery and legal reform take priority."
 nesnd_qe1_army_petition_button:0 "Present the Frontier Victories"
 nesnd_qe1_army_petition_button_desc:0 "Send the new regimental rolls and reports of frontier victories to Ili, and demand recognition for the military faction's achievements."
 nesnd_qe1_economy_petition_button:0 "Present the Fruits of Reform"
 nesnd_qe1_economy_petition_button_desc:0 "The workshops, railways and new laws are bearing fruit. Petition the court to carry the reforms forward."
 nesnd_qe1_law_push:0 "Legislative Pressure"
 nesnd_qe1_economy_push:0 "Retrenchment and Reconstruction"
 nesnd_qe1_angovernment:0 "Reform Government"
 nesnd_qe1_military_government:0 "Military Government"
 nesnd_qe1_stalled:0 "A Divided Court"
 nesnd_qe1_angovernment_desc:0 "The new commercial and industrial order strengthens the loyalty earned by rising living standards."
 nesnd_qe1_stalled_desc:0 "Years of indecision have made falling living standards a greater source of radicalism."
 nesnd_qe1.1.a:0 "Our people's prosperity must come first."
 nesnd_qe1.1.t:0 "The Reformers Prevail"
 nesnd_qe1.1.d:0 "The reformers have set the government’s course. Scholars and industrialists who supported reform have gained political influence, while the army and its supporters among the urban middle classes have lost ground. The new government looks to economic recovery and legal reform to win public support."
 nesnd_qe1.2.a:0 "Bring order to the army and the state."
 nesnd_qe1.2.t:0 "The Military Ascendant"
 nesnd_qe1.2.d:0 "The military faction has won the government’s support and will take a greater part in recruitment, supply and appointments. Officials who argued for economic recovery and legal reform have failed to set its course. Ili has made expansion of the army a priority."
 nesnd_qe1.3.a:0 "Ten years, wasted just like that."
 nesnd_qe1.3.t:0 "Ten Years of Empty Debate"
 nesnd_qe1.3.d:0 "For ten years the court has argued over land, military pay and appointments without reaching a settlement. The provinces have heard promise after promise of imperial renewal. Fewer now believe that another decree will improve their lot."
