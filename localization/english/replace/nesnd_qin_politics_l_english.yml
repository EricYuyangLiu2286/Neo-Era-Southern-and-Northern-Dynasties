 nesnd_qe1_unity_hope:0 "Farmers, townspeople and soldiers still see their future in the Empire."
 nesnd_qe1_unity_doubt:0 "Older local identities are reviving, and imperial authority is weakening in the provinces."
 nesnd_qe1_unity_crisis:0 "Old ethnic names have become rallying cries for armed resistance."
