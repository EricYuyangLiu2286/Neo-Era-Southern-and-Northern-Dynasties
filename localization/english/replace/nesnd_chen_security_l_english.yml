l_english:
 nesnd_protect_chen_button:0 "The Chief Minister’s Protection"
 nesnd_protect_chen_button_desc:0 "Chen Dongyang’s reforms threaten the estates and titles of gentry, former feudal lords and military officers. Master Dongguan may be fearless, but the court cannot disregard their hostility. Assign dedicated guards and consider keeping him at his residence or investigating insiders, preserving the leader needed to sustain reform.\n\nProtection lasts #v six months#!. Without dedicated guards, the case has death, injury and escape chances of #v 40/25/35#!. Funding and renewal terms appear in the protection proposal."
 nesnd_protect_chen_button_requirements:0 "Chen Dongyang remains in this country, the succession crisis is unresolved, and this plot has not occurred."
 nesnd_protect_chen_button_outcome_tt:0 "An assassination attempt against Chen Dongyang will include a possible rescue by his guards."
 nesnd_chen_inner_guard:0 "Cabinet Guard Detail"
 nesnd_chen_residence_guard:0 "Guarded Residence"
 nesnd_chen_intelligence:0 "Investigation of the Escort"
 nesnd_chen.1.t:0 "The Chief Minister’s Guard"
 nesnd_chen.1.d:0 "Chen Dongyang came to Southern Ming as an exile from Western Qin and joined King Zheng Qin of Wu in reforming the state. Guoren republicans thereby entered the heart of Southern government. Reform now threatens the estates and titles of gentry, former feudal lords and officers; hostile verses and threatening letters continue to arrive. Master Dongguan remains absorbed in public affairs, but the cabinet cannot entrust his safety entirely to old alliances.\n\nThe court may fund a personal guard, keep him at his residence, or investigate his attendants and contacts. Protecting the leader of reform will cost money and place more power in the hands of the cabinet directing his guards.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.active:0 "The cabinet has assigned dedicated guards to Chen Dongyang’s residence and journeys, with their wages paid weekly.\n\n#bold Guard expires#!: #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!. Renew after the fifth month for another six months.\n#bold Cabinet guard#!: @money!#v 500#! weekly, #v 40#! [concept_authority]. Death/wounding/escape #v 15/25/60#!.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.f:0 "Sustain the living, establish the people, and order their livelihoods.\n— Chen Dongyang, On the Great Nation"
 nesnd_chen.1.a:0 "Place the guard under the Cabinet and pay it from the treasury."
 nesnd_chen.1.b:0 "Remain in the guarded offices and postpone the eastern journey."
 nesnd_chen.1.c:0 "Investigate the accomplices and those who recommended them."
 nesnd_chen.1.e:0 "Withdraw the special guard and restore the usual arrangements."
 nesnd_chen.1.z:0 "Keep the existing arrangements."
 nesnd_chen.guard_tt:0 "Pay @money!#v 12,000#!, then @money!#v 500#! per week and #v 40#! [concept_authority] for six months. Death/wounding/escape chances for this plot: #v 15/25/60#!."
 nesnd_chen.residence_tt:0 "Pay @money!#v 24,000#!, then @money!#v 1,000#! per week and #v 80#! [concept_authority] for six months. Death/wounding/escape chances: #v 10/20/70#!."
 nesnd_chen.intel_tt:0 "Pay @money!#v 18,000#!. Armed Forces [concept_approval]: #n −2#! for six months. With an active guard and investigation, death/wounding/escape chances are #v 8/22/70#!.\n\nThe investigation lasts at most six months. Withdrawing the guard, Chen's death, or resolution of this plot ends it as well. The investigation’s protection ends when the guard expires, Chen leaves the country or the Ming-Wu crisis ends. Renewing the guard does not extend the investigation."
 nesnd_chen.3.t:0 "Minister Chen Wounded"
 nesnd_chen.3.d:0 "Chen Dongyang was attacked aboard the vessel carrying him east to lecture. A shot passed through his shoulder and arm. His attendants took him below and summoned a physician. Only after nightfall did his waiting students hear that he was still alive.\n\nThe veteran of the Western Qin revolution and the southern reforms now lay wounded. His followers published accounts of the attack and demanded an inquiry into the escort. Provincial correspondence questioned the Southern Command’s shipping arrangements, adding the bloodshed to the struggle over reform and political authority."
 nesnd_chen.3.f:0 "Take the boundless world as the outer wall, and the right path as the inner city.\n— Chen Dongyang, On the Great Nation"
 nesnd_chen.3.a:0 "Attend to his wounds and continue the affairs of state."
 nesnd_chen.wounded_tt:0 "Chen Dongyang is wounded. Armed confrontation rises by #n 10#!. This plot is concluded and the special guard costs end."
 nesnd_chen.4.t:0 "The Assassins Discovered"
 nesnd_chen.4.d:0 "Before Chen’s vessel departed, a boatman noticed that a food box had been resealed. The attendant who handled it named his contact. Letters recovered from the contact’s rooms implicated officials who had arranged the journey. The landing was closed and Chen returned to his offices with his students.\n\nParty conflict had eroded the old alliance between the Western Qin exiles and the Zheng command. The attempted murder made Chen’s movements a matter of public debate across [ROOT.GetCountry.GetName]. Republicans continued publishing in his name, while the Cabinet investigated the prisoners and the appointment of the escort."
 nesnd_chen.4.f:0 "Even one city, one enclosure, one small corner may still be a great nation.\n— Chen Dongyang, On the Great Nation"
 nesnd_chen.4.a:0 "Resume the sitting and appoint an inquiry."
 nesnd_chen.escape_tt:0 "Chen Dongyang survives this plot. Armed confrontation rises by #n 3#!. This plot is concluded and the special guard costs end."
 nesnd_chen.3.residence:0 "A shot rang through the guarded offices. Chen fell beside his desk and lost much blood before the physician removed the bullet. The watch sealed the gates. His students waited outside until dawn for word that he had regained consciousness.\n\nHis followers published accounts of the attack and demanded to know how the assailant had entered the residence. The Cabinet had assumed responsibility for its security. The appointments, recommendations and handovers inside the compound would now be examined by the court."
 nesnd_chen.4.residence:0 "The watch found a replaced seal on the evening food box and detained the attendant who carried it. His recommendation identified an address where investigators recovered letters and a packet of medicine. Chen remained indoors until dawn, when he learned what had happened.\n\nParty conflict had eroded the old alliance between the Western Qin exiles and the Zheng command. The attempted murder made Chen’s movements a matter of public debate across [ROOT.GetCountry.GetName]. Republicans continued publishing in his name, while the Cabinet examined the appointments and recommendations within the residence."
 nesnd_chen.death_residence_desc:0 "Chen postponed his journey and continued working in the guarded offices. Two signatures accompanied the medicine brought from the kitchen, but its seal had been replaced. By the time the physician arrived, Chen could no longer speak.\n\nAt dawn the Cabinet sealed the bowl and the duty register. The southern reformers had lost their leader. Provincial delegates gathered outside, waiting for the appointment of a successor."
 nesnd_chen.1.residence:0 "The cabinet has assigned dedicated guards to Chen Dongyang’s residence and journeys, with their wages paid weekly.\n\n#bold Guard expires#!: #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!. Renew after the fifth month for another six months.\n#bold Guarded residence#!: @money!#v 1,000#! weekly, #v 80#! [concept_authority]. Death/wounding/escape #v 10/20/70#!.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.intel:0 "The cabinet has assigned dedicated guards to Chen Dongyang’s residence and journeys, with their wages paid weekly.\n\n#bold Guard expires#!: #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!. Renew after the fifth month for another six months.\n#bold Investigation#! expires #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_intel_ready'))]#!. With both measures active, death/wounding/escape #v 8/22/70#!. Existing guard payments continue.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.finance_rules:0 "#bold Funding conditions#!\nPurchase or renewal requires sufficient [concept_gold_reserves], no [concept_default], and no continuing post-[concept_bankruptcy] penalty. Guards can be renewed after five months. An active guard also permits a separately funded investigation."
 nesnd_chen.withdraw_tt:0 "Withdraw the guard, end its weekly expenses and release its authority cost. The current investigation and its Armed Forces approval modifier also end."
 nesnd_chen_case_concluded_tt:0 "The attempt on Chen has been resolved, or he has left this country. If he has been fatally injured, his death must be confirmed before the succession can proceed."
