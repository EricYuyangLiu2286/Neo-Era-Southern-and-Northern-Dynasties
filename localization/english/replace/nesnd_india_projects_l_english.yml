l_english:
 nesnd_india_project_name_0:0 "local project"
 nesnd_india_project_name_1:0 "[GetBuildingType('building_university').GetName]"
 nesnd_india_project_name_2:0 "[GetBuildingType('building_tooling_workshop').GetName]"
 nesnd_india_project_name_3:0 "[GetBuildingType('building_railway').GetName]"
 nesnd_india_project_name_4:0 "Engineering Survey and Training"
 nesnd_india_survey:0 "Engineering Survey and Training"
 nesnd_india_project_start:0 "Plan a Local Project"
 nesnd_india_project_start_desc:0 "Build one of [GetBuildingType('building_university').GetName], [GetBuildingType('building_tooling_workshop').GetName] or [GetBuildingType('building_railway').GetName] in one [concept_state] of ours, or first invite another country’s engineers to make a survey."
 nesnd_india_project_start_tt:0 "Choose the project and the place, then decide whether we pay ourselves or ask the government of another Indian state or of a foreign country. Nothing is spent until the choice is made."
 nesnd_india_project_idle_tt:0 "We have no local project being planned or built"
 nesnd_india_project_withdraw_button:0 "Withdraw the Request"
 nesnd_india_project_withdraw_button_desc:0 "Stop waiting for an answer."
 nesnd_india_project_withdraw_tt:0 "The request is void and needs no answer. We still may not open another negotiation until six months after the request was made."
 nesnd_india_project_waiting_tt:0 "Our request for the project is awaiting an answer"
 nesnd_india_project_status_consent:0 "The planned project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) needs the consent of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_await').GetCountry.GetName]. We are awaiting an answer."
 nesnd_india_project_status_funder:0 "We have put our request for the project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) to the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] and are awaiting an answer."
 nesnd_india_project_status_building:0 "The project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName] is under construction."
 nesnd_india_project.1.t:0 "A Local Project"
 nesnd_india_project.1.d:0 "[ROOT.GetCountry.GetName] intends to undertake a local work. We decide first what to build, then where and at whose expense. If we pay, the work joins the government’s construction queue. If we ask another government to pay, it may require ownership in return, and if we are a subject, our overlord may have its say."
 nesnd_india_project.1.f:0 "“The Government of [ROOT.GetCountry.GetName] proposes to undertake a public work. The necessary funds will be provided for separately.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project.1.a:0 "Build: [GetBuildingType('building_university').GetName]"
 nesnd_india_project.1.b:0 "Build: [GetBuildingType('building_tooling_workshop').GetName]"
 nesnd_india_project.1.c:0 "Build: [GetBuildingType('building_railway').GetName]"
 nesnd_india_project.1.e:0 "Commission a Survey First"
 nesnd_india_project.none:0 "Not for now."
 nesnd_india_project_next_tt:0 "Next we choose the place and who pays. Nothing is spent yet."
 nesnd_india_project_next_survey_tt:0 "Next we choose which government to ask. The fee is @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_survey_fee')|0], paid once they agree."
 nesnd_india_project_next_funding_tt:0 "Next we choose who pays. Nothing is spent yet."
 nesnd_india_project_none_tt:0 "No project is begun, and nothing stops us from opening another negotiation."
 nesnd_india_project_site_exists_tt:0 "At least one [concept_state] of ours can take a building of this kind"
 nesnd_india_project.2.t:0 "Where to Build"
 nesnd_india_project.2.d:0 "More than one [concept_state] of ours could take the project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]). We must settle on the place."
 nesnd_india_project.2.f:0 "“The site of the work will be appointed by the Government of [ROOT.GetCountry.GetName].”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project.2.1:0 "In [SCOPE.sState('india_project_site_1').GetName]"
 nesnd_india_project.2.2:0 "In [SCOPE.sState('india_project_site_2').GetName]"
 nesnd_india_project.2.3:0 "In [SCOPE.sState('india_project_site_3').GetName]"
 nesnd_india_project.3.t:0 "Who Pays"
 nesnd_india_project.3.d:0 "We intend to build the project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. We may find the money ourselves or ask another government to provide it."
 nesnd_india_project.3.d_survey:0 "We intend to engage another country’s engineers to survey our land and train local craftsmen. The fee of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_survey_fee')|0] is ours to pay."
 nesnd_india_project.3.f:0 "“The manner of carrying out this work will be settled between the Government of [ROOT.GetCountry.GetName] and the governments concerned.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project.3.a:0 "We Shall Pay for It"
 nesnd_india_project.3.b:0 "Ask [SCOPE.sCountry('india_project_neighbour').GetName]"
 nesnd_india_project.3.c:0 "Ask [SCOPE.sCountry('india_project_foreign').GetName]"
 nesnd_india_project_own_tt:0 "One level is ordered in the chosen [concept_state]. The work joins our government’s construction queue at our own expense."
 nesnd_india_project_ask_stake_tt:0 "We ask their government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0]. If they agree, one level is built at once and belongs to their government. We receive the grant and owe them an [concept_obligation]."
 nesnd_india_project_ask_grant_tt:0 "We ask their government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0] towards the foundation. They take no ownership. If they agree, the work joins our government’s construction queue and we owe them an [concept_obligation]."
 nesnd_india_project_ask_survey_tt:0 "If they agree, we pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_survey_fee')|0]."
 nesnd_india_project_consent_tt:0 "We are a subject of [SCOPE.sCountry('india_project_overlord').GetName], whose consent must come first. Only then is the request passed to the other government."
 nesnd_india_project_wait_tt:0 "Each government has thirty days to answer. We may open another negotiation in six months."
 nesnd_india_project_no_deal_tt:0 "No funding agreement is still running there"
 nesnd_india_project_fresh_tt:0 "There is no such building there yet. One that already stands can only be enlarged at our own expense"
 nesnd_india_project.4.t:0 "The Project Agreed"
 nesnd_india_project.4.d_stake:0 "The government of [SCOPE.sCountry('india_matter_to').GetName] has paid the grant as agreed. The building ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [SCOPE.sState('india_project_site').GetName] stands, and it belongs to the government of [SCOPE.sCountry('india_matter_to').GetName]. For five years we make no other funding agreement there."
 nesnd_india_project.4.d_grant:0 "The government of [SCOPE.sCountry('india_matter_to').GetName] has paid the grant as agreed and takes no ownership. The work ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [SCOPE.sState('india_project_site').GetName] has joined our government’s construction queue. For five years we make no other funding agreement there."
 nesnd_india_project.4.d_survey:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to send engineers to survey our land and train local craftsmen. The fee has been paid."
 nesnd_india_project.4.f:0 "“This agreement takes effect on the day both parties sign.”\n—Agreement between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_india_project_agreed_tt:0 "The agreement is in effect."
 nesnd_india_project.5.t:0 "No Agreement"
 nesnd_india_project.5.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has withheld its consent, and our request never reached the government of [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_project.5.d_decline:0 "The government of [SCOPE.sCountry('india_matter_to').GetName] has declined our request."
 nesnd_india_project.5.d_silent:0 "Our request went unanswered within the time allowed and has lapsed."
 nesnd_india_project.5.d_void:0 "Circumstances have changed and our request no longer stands."
 nesnd_india_project.5.f:0 "“This work is postponed.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project_failed_tt:0 "The request ends here."
 nesnd_india_project.6.t:0 "The Work Completed"
 nesnd_india_project.6.d:0 "The work ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) in [SCOPE.sState('india_project_site').GetName] is finished."
 nesnd_india_project.6.f:0 "“The work is complete and opens today.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_project_done_tt:0 "We may plan another local project."
 nesnd_india_project.7.t:0 "The Agreement Expires"
 nesnd_india_project.7.d:0 "Our funding agreement with [SCOPE.sCountry('india_matter_to').GetName] for [SCOPE.sState('india_project_site').GetName] has run its five years. Ownership already acquired is unchanged. We may make a new agreement there."
 nesnd_india_project.7.f:0 "“This agreement runs for five years. Ownership acquired under it remains valid thereafter.”\n—Agreement between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_india_project_term_over_tt:0 "A new funding agreement may be made there."
 nesnd_india_foreign_affairs:0 "Indian Affairs"
 nesnd_india_foreign_affairs_reason:0 "The governments of the Indian and Himalayan states often put matters to other governments for an answer: money to build [GetBuildingType('building_university').GetName], [GetBuildingType('building_tooling_workshop').GetName] or [GetBuildingType('building_railway').GetName], for which the government that pays may take ownership, or a [concept_treaty] granting [concept_trade_privilege] or [concept_military_access]. A subject needs the consent of its [concept_overlord] before another government may take ownership in it or march through it. One such matter now awaits the answer of [ROOT.GetCountry.GetName]."
 nesnd_india_matter_status_consent_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent: the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] for the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName] and own it. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] is our subject, and the matter needs our consent."
 nesnd_india_matter_status_consent_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent: the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] towards the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName], taking no ownership."
 nesnd_india_matter_status_consent_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our consent to engage engineers from [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for a survey and the training of craftsmen, for which [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]."
 nesnd_india_matter_status_fund_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] to build the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. One level would be built at once and belong to our government."
 nesnd_india_matter_status_fund_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks our government for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] towards the project ([ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]) in [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]. We would take no ownership."
 nesnd_india_matter_status_fund_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] offers @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] to engage our engineers for a survey and the training of local craftsmen."
 nesnd_india_matter_status_done:0 "The matter has been answered."
 nesnd_india_matter_permit_button:0 "Give Consent"
 nesnd_india_matter_forbid_button:0 "Withhold Consent"
 nesnd_india_matter_consent_desc:0 "Answer the matter as [concept_overlord]."
 nesnd_india_matter_accept_button:0 "Agree"
 nesnd_india_matter_decline_button:0 "Decline"
 nesnd_india_matter_answer_desc:0 "Answer the terms put to us."
 nesnd_india_matter_unanswered_tt:0 "We have not yet answered the matter"
 nesnd_india_matter_permit_tt:0 "We give our consent. The request then goes to the other government, which decides for itself."
 nesnd_india_matter_forbid_tt:0 "We withhold our consent. The request ends here."
 nesnd_india_matter_fund_stake_tt:0 "One level is built at once and belongs to our government."
 nesnd_india_matter_fund_grant_tt:0 "We pay the grant towards the foundation and take no ownership."
 nesnd_india_matter_fund_terms_tt:0 "They owe us an [concept_obligation], and [concept_relations] between us improve by #g 25#!."
 nesnd_india_matter_fund_survey_tt:0 "We send engineers to make the survey and train local craftsmen for #v 24#! months."
 nesnd_india_matter_decline_tt:0 "We decline. The request ends here."
 nesnd_india_matter_funds_tt:0 "Our [concept_gold_reserves] cover the grant, and we are in neither [concept_default] nor [concept_bankruptcy]"
 nesnd_india_matter_site_tt:0 "The place they chose can still take the building"
 nesnd_india_matter_answered_header:0 "Give an Answer"
 nesnd_india_matter_answered_effect_header:0 "Once Answered"
 nesnd_india_matter_answered_tt:0 "We have answered the matter"
 nesnd_india_matter_closed_tt:0 "The matter is no longer listed here."
 nesnd_india_matter_answered_conclusion:0 "We have given our answer."
 nesnd_india_matter_timeout_conclusion:0 "No answer was given within thirty days."
 nesnd_india_matter_timeout_tt:0 "We are taken to have given no answer, and their request lapses."
 nesnd_india_matter_void_conclusion:0 "Their request was withdrawn or no longer stands."
