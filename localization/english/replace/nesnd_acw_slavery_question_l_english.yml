 nesnd_acw.1.t:0 "An Abolitionist in Power"
 nesnd_acw.1.d:0 "[SCOPE.sCharacter('nesnd_acw_new_ruler').GetFullName] now leads [ROOT.GetCountry.GetName]. Known for opposing slavery, the new leader has yet to sign a single order, and southern newspapers are already discussing the formalities of leaving the Union.\n\nTo the planters it hardly matters what the new leader means to do. What matters is that the ballot box has, for the first time, raised to the top someone they cannot buy."
 nesnd_acw.1.f:0 "\"A house divided against itself cannot stand.\"\n— a speech in Illinois, 1858"
 nesnd_acw.1.a:0 "The Union will hold."
 nesnd_acw.1.a.tt:0 "Crisis #r +8#!\nWhile this leader holds power, crisis #r +0.25#! a month"
 nesnd_acw.10.t:0 "The Secession Crisis"
 nesnd_acw.10.d_south:0 "One after another, the southern legislatures convene. The question is no longer whether to leave the Union but when, and who takes over the local arsenals. Northern papers call it rebellion; southern papers call it independence.\n\nIn Washington the compromisers are still drafting new plans. Nobody is sitting down to hear them."
 nesnd_acw.10.d_north:0 "Since the slaveholders took power they have won every vote in Congress. The northern states will no longer hunt runaways for southern masters or bleed for their new territories. Free-state legislatures have begun to debate what only southerners used to talk about: leaving the Union."
 nesnd_acw.10.f:0 "\"We are not enemies, but friends. We must not be enemies.\"\n— an inaugural address, 1861"
 nesnd_acw.10.a:0 "Then let the cannon speak."
 nesnd_acw.10.a.tt:0 "Radicals rise among the seceding side's supporters, and the civil war advances every week until it breaks out\nThis journal stays open until then"
 nesnd_acw_wilmot_a_tt:0 "Crisis #r +0.08#! a month for 60 months"
 nesnd_acw_wilmot_b_tt:0 "Crisis #r +0.06#! a month for 60 months"
 nesnd_acw_wilmot_c_tt:0 "Crisis #r +0.10#! a month for 60 months"
 nesnd_hus_west_lever:0 "The Western Counterweight"
 nesnd_hus_west_lever_reason:0 "The fiercer the quarrel between the Union's North and South, the safer our border and the richer the opportunity. Every group that crosses it, slaves fleeing Missouri, natives driven from their land, opens the Union's wound a little wider. Some in our assembly would shelter them; others would close the door. The business interests are already asking whether, should the Union split, the lands to the east would still answer to Washington.\n\nThe Americas need only one protector. If Washington can no longer look after itself, who will take its place?"
 nesnd_hus_west_status_open:0 "The western border is open; escapees cross in groups every six months. About #v [ROOT.GetCountry.MakeScope.Var('nesnd_hus_west_arrivals').GetValue|0]#! sheltered so far."
