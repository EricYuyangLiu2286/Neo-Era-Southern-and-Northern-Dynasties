 nesnd_hus_west_src_border_open:0 "At peace with $nesnd_lobby_name_usa$ with the western border open"
 nesnd_hus_west_open:0 "Open the Western Border"
 nesnd_hus_west_open_desc:0 "Permit fugitives from $nesnd_lobby_name_usa$ to cross the border and settle in our country."
 nesnd_hus_west_open_tt:0 "While at peace with $nesnd_lobby_name_usa$, we can receive a group of [GetPopType('slaves').GetName] or indigenous people from its border states every six months. Eligible people must be present, and their destination must be an adjacent state held entirely by us.\nArriving [GetPopType('slaves').GetName] become [GetPopType('laborers').GetName]. Each group reduces relations by #r 5#! and aggravates the crisis while the slavery question remains open."
 nesnd_hus_west_close:0 "Close the Western Border"
 nesnd_hus_west_close_desc:0 "Suspend the admission of fugitives from $nesnd_lobby_name_usa$."
 nesnd_hus_west_close_tt:0 "Stop sheltering escapees from $nesnd_lobby_name_usa$"
 nesnd_hus_west_border_policy_tt:0 "Border policy has never been changed, or #v 24#! months have passed since the last change"
 nesnd_hus_west_fund:0 "Fund Free-State Settlers"
 nesnd_hus_west_fund_desc:0 "Provide funding for free-state settlers in $nesnd_lobby_name_usa$."
 nesnd_hus_west_fund_tt:0 "Funding lasts #v 12#! months and adds #g +1#! to $nesnd_hus_west_claim_bar_name$ each month.\nDuring that period, the crisis in $nesnd_lobby_name_usa$ rises by #r 0.15#! a month while it has not enacted [GetLawType('law_slavery_banned').GetName] and no secession crisis is under way."
 nesnd_hus_west_fund_active_tt:0 "No settler funding is currently active"
 nesnd_hus_west_claim:0 "Press a Border Claim"
 nesnd_hus_west_claim_desc:0 "Present a territorial claim to the country holding the land on our border."
 nesnd_hus_west_claim_tt:0 "Claim the most populous eligible border state. $nesnd_hus_west_claim_bar_name$ falls by #r 50#! and relations with the country holding it fall by #r 10#!."
 nesnd_hus_west_claim_cooldown_tt:0 "No border claim has been made yet, or #v 6#! months have passed since the last one"
 nesnd_hus_west_claim_candidate_tt:0 "$nesnd_lobby_name_usa$ or one of its secessionist governments holds a populated state in the Americas that borders us and is not already claimed by us"
 nesnd_hus_west_press:0 "Push East"
 nesnd_hus_west_press_desc:0 "Demand the claimed border territory from the country holding it. A refusal to back down may lead to war."
 nesnd_hus_west_press_tt:0 "Launch a [concept_diplomatic_play] to reclaim the most populous eligible border state from the country holding it. $nesnd_hus_west_claim_bar_name$ falls to #v 0#!."
