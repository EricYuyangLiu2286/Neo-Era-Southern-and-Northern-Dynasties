 nesnd_hus_west_press_target_tt:0 "A state claimed through this journal borders us, is held by $nesnd_lobby_name_usa$ or one of its secessionist governments, and is not a treaty port.\nWe have no truce with its owner and are not its subject. Relations with the owner must be below $relations_cordial$. If it is a subject, relations with its overlord and top overlord must also be below $relations_cordial$."
 nesnd_hus_west_press_cooldown_tt:0 "No eastern campaign has been launched yet, or #v 24#! months have passed since the last one"
 nesnd_hus_west_success_tt:0 "In all #v ten state regions#! claimed through this journal, we have secured and still hold all land that belonged to $nesnd_lobby_name_usa$ or its secessionist governments when the claims were made, through demands for return or conquest. The relevant wars have ended and those countries hold no remaining territory in these regions."
