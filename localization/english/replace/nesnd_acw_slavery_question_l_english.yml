 nesnd_acw_compromise_desc:0 "A compromise is when nobody leaves happy."
 nesnd_acw_compromise_uses_tt:0 "At most twice per game"
 nesnd_acw_compromise_cooldown_tt:0 "60 months since the last compromise"
 nesnd_acw_compromise_deadline_tt:0 "Before 1866"
 nesnd_acw_coalition_tt:0 "The government includes both pro-slavery and anti-slavery interest groups"
 nesnd_acw_compromise_effect_tt:0 "Crisis #g −8#!, then #g −0.12#! a month for 24 months, with the tide of the times paused\nA few radicals among both sides' interest groups"
 nesnd_acw_hunt:0 "Pursue the Fugitives"
 nesnd_acw_hunt_desc:0 "Property is property, wherever it runs."
 nesnd_acw_hunt_active_tt:0 "The pursuit order is still in force"
 nesnd_acw_hunt_effect_tt:0 "For 5 years, half as many people escape to $HUS$\nCrisis #r +0.05#! a month meanwhile"
 nesnd_acw_buyout:0 "Buy Out the Slaveholders"
 nesnd_acw_buyout_desc:0 "Buy the planters' silence from the treasury."
 nesnd_acw_buyout_cost_tt:0 "Costs one year of income\n#g 15%#! loyalists among [GetPopType('aristocrats').GetName] in the old slave states\nOnly once per game"
 nesnd_acw_compromise_cost:0 "An Unpopular Compromise"
 nesnd_acw_compromise_cost_desc:0 "Both sides feel sold out."
 nesnd_acw_buyout_landowners:0 "Compensation Money"
 nesnd_acw_buyout_landowners_desc:0 "The money is paid. The grievance is swallowed, for now."
 nesnd_hus_west_triumph:0 "Triumph in the East"
 nesnd_hus_west_triumph_desc:0 "The lands secured in the east now belong to [GetGlobalVariable('nesnd_lobby_hus').GetCountry.GetName]. Our prestige in the Americas has grown, and we continue to encourage assimilation and settlement in the acquired territories."
 nesnd_acw.1.t:0 "An Abolitionist in Power"
 nesnd_acw.1.d:0 "[SCOPE.sCharacter('nesnd_acw_new_ruler').GetFullName] now leads [ROOT.GetCountry.GetName]. Known for opposing slavery, the new leader has yet to sign a single order, and southern newspapers are already discussing the formalities of leaving the Union.\n\nTo the planters it hardly matters what the new leader means to do. What matters is that the ballot box has, for the first time, raised to the top someone they cannot buy."
 nesnd_acw.1.f:0 "\"A house divided against itself cannot stand.\"\n— a speech in Illinois, 1858"
 nesnd_acw.1.a:0 "The Union will hold."
 nesnd_acw.1.a.tt:0 "Crisis #r +8#!\nWhile this leader holds power, crisis #r +0.25#! a month"
 nesnd_acw.10.t:0 "The Secession Crisis"
 nesnd_acw.10.d_south:0 "One after another, the southern legislatures convene. The question is no longer whether to leave the Union but when, and who takes over the local arsenals. Northern papers call it rebellion; southern papers call it independence.\n\nIn Washington the compromisers are still drafting new plans. Nobody is sitting down to hear them."
 nesnd_acw.10.d_north:0 "Since the slaveholders took power they have won every vote in Congress. The northern states will no longer hunt runaways for southern masters or bleed for their new territories. Free-state legislatures have begun to debate what only southerners used to talk about: leaving the Union."
 nesnd_acw.10.f:0 "\"We are not enemies, but friends. We must not be enemies.\"\n— an inaugural address, 1861"
 nesnd_acw.10.a:0 "Then let the cannon speak."
 nesnd_acw.10.a.tt:0 "Radicals rise among the seceding side's supporters, and the civil war advances every week until it breaks out\nThis journal stays open until then"
 nesnd_acw_wilmot_a_tt:0 "Crisis #r +0.08#! a month for 60 months"
 nesnd_acw_wilmot_b_tt:0 "Crisis #r +0.06#! a month for 60 months"
 nesnd_acw_wilmot_c_tt:0 "Crisis #r +0.10#! a month for 60 months"
 nesnd_hus_west_lever:0 "The Western Counterweight"
 nesnd_hus_west_lever_reason:0 "The slavery question in $nesnd_lobby_name_usa$ has given [ROOT.GetCountry.GetName] an opportunity to intervene in its neighbour's affairs. Sheltering fugitives can weaken slaveholders' control over their labour force. Funding free-state settlers can deepen our neighbour's internal divisions. These border policies serve our territorial interests and affect the balance of power in the Americas.\n\nOur border claims will outlast the slavery question. Civil war may change who holds the land, and secessionist governments may gain independence. We must address our demands to the government holding the territory and prepare to compel its cession through war."
 nesnd_hus_west_status_open:0 "The border is open. About #v [ROOT.GetCountry.MakeScope.Var('nesnd_hus_west_arrivals').GetValue|0]#! fugitives have been sheltered.\n$nesnd_hus_west_ten_status$"
 nesnd_hus_west_status_closed:0 "The border is closed. We are not currently admitting fugitives.\n$nesnd_hus_west_ten_status$"
 nesnd_hus_west_status_war:0 "The civil war in $nesnd_lobby_name_usa$ is still under way.\n$nesnd_hus_west_ten_status$"
