 nesnd_qe1_court_purge:0 "Purge of the Court"
 nesnd_qe1_intrigue.1.t:0 "Three Voices Before the Throne"
 nesnd_qe1_intrigue.1.d:0 "A senior post has fallen vacant. The crown's servants and the provincial literati each press their own candidate and are deadlocked before the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], while the army's commanders look on."
 nesnd_qe1_intrigue.1.f:0 "Appoint one person and offend a crowd."
 nesnd_qe1_intrigue.1.a:0 "Appoint the crown's candidate"
 nesnd_qe1_intrigue.1.b:0 "Appoint the literati's candidate"
 nesnd_qe1_intrigue.1.c:0 "Leave the post vacant"
 nesnd_qe1_intrigue.2.t:0 "The Generals Ask for Pay"
 nesnd_qe1_intrigue.2.d:0 "Frontier commanders of [ROOT.GetCountry.GetNameNoFlag] have jointly petitioned for pay, saying wages are long overdue and the soldiers are grumbling."
 nesnd_qe1_intrigue.2.f:0 "Every month the pay is late, the army's loyalty frays a little more."
 nesnd_qe1_intrigue.2.a:0 "Pay them"
 nesnd_qe1_intrigue.2.b:0 "Refuse"
 nesnd_qe1_intrigue.3.t:0 "The Literati Petition"
 nesnd_qe1_intrigue.3.d:0 "The provincial literati have petitioned the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] jointly for more schools and a greater voice for the provinces in court deliberations."
 nesnd_qe1_intrigue.3.f:0 "They ask for ink and paper, and for power."
 nesnd_qe1_intrigue.3.a:0 "Accept"
 nesnd_qe1_intrigue.3.b:0 "Reject"
 nesnd_qe1_intrigue.4.t:0 "One Faction Ascendant"
 nesnd_qe1_intrigue.4.d_crown:0 "The crown now holds over three fifths of the court, and both the literati and the army complain they have no say."
 nesnd_qe1_intrigue.4.d_literati:0 "The provincial literati now hold over three fifths of the court, and both the crown and the army fear being sidelined."
 nesnd_qe1_intrigue.4.d_army:0 "The army now holds over three fifths of the court, and both the officials and the crown must defer to the generals."
 nesnd_qe1_intrigue.4.f:0 "When only one voice is heard at court, the others find somewhere else to speak."
 nesnd_qe1_intrigue.4.a:0 "Rein them in"
 nesnd_qe1_intrigue.4.b:0 "Let it be"
