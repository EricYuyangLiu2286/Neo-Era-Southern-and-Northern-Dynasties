 nesnd_usm_court.1.t:0 "The Succession Debate in the Assembly of Rites"
 nesnd_usm_court.1.d:0 "The Assembly of Rites of [ROOT.GetCountry.GetNameNoFlag] has reopened the dispute over whether the dynastic line belongs to the Zhu or the Zheng. The cabinet can shelve the question or let the delegates debate it in the open."
 nesnd_usm_court.1.f:0 "“Whether the imperial line belongs to the house of Zhu or to the Zheng, we move that the question be put to open debate in the Assembly of Rites.”\n- A delegate's motion"
 nesnd_usm_court.1.a:0 "Have the cabinet shelve it"
 nesnd_usm_court.1.b:0 "Allow open debate"
 nesnd_usm_court.2.t:0 "Recommendations from the Zheng"
 nesnd_usm_court.2.d:0 "The Zheng faction has submitted letters of recommendation asking that its own officials fill key posts in the Six Ministries."
 nesnd_usm_court.2.f:0 "“We respectfully recommend the following persons for senior posts in the Six Ministries.”\n- Letter of recommendation from the Zheng"
 nesnd_usm_court.2.a:0 "Appoint them"
 nesnd_usm_court.2.b:0 "Refer it back to the cabinet"
 nesnd_usm_court.3.t:0 "Memorials from the Provinces"
 nesnd_usm_court.3.d:0 "Provincial gentry keep sending memorials setting out their views on the succession dispute. The cabinet may forward them to the Assembly of Rites or hold them back."
 nesnd_usm_court.3.f:0 "“The gentry of this province respectfully set out their views on the imperial succession and ask that they be forwarded to the Assembly of Rites.”\n- Memorial from the gentry of a province"
 nesnd_usm_court.3.a:0 "Forward them to the Assembly"
 nesnd_usm_court.3.b:0 "Hold them back"
 nesnd_fra_court.1.t:0 "The Emperor's Confidants"
 nesnd_fra_court.1.d:0 "A few confidants of [SCOPE.sCharacter('nesnd_fra_court_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_fra_court_ruler').GetFullName] enjoy such trust that ministry papers often pass through their hands first. The ministers complain they cannot get past that door."
 nesnd_fra_court.1.f:0 "“Every paper from the ministries must pass through the hands of the Emperor's intimates before it reaches him. My ministry has no direct access.”\n- Complaint of a minister"
 nesnd_fra_court.1.a:0 "Rely on the confidants"
 nesnd_fra_court.1.b:0 "Keep them at a distance"
 nesnd_fra_court.2.t:0 "Court against Cabinet"
 nesnd_fra_court.2.d:0 "The imperial household and the cabinet are deadlocked over who controls a line of spending, and both want the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to rule on it."
 nesnd_fra_court.2.f:0 "“The Imperial Household and the cabinet cannot agree on this expenditure, and we respectfully ask Your Majesty to decide.”\n- Submission to His Majesty"
 nesnd_fra_court.2.a:0 "Back the household"
 nesnd_fra_court.2.b:0 "Back the cabinet"
 nesnd_fra_court.3.t:0 "The Civil List"
 nesnd_fra_court.3.d:0 "The imperial household of [ROOT.GetCountry.GetNameNoFlag] has overspent its allowance year after year. The council of state wants cuts, and the household wants more."
 nesnd_fra_court.3.f:0 "“The expenditure of the Imperial Household has exceeded its allowance year after year. This council requests that it be reduced.”\n- Resolution of the Council of State"
 nesnd_fra_court.3.a:0 "Increase the allowance"
 nesnd_fra_court.3.b:0 "Cut spending"
