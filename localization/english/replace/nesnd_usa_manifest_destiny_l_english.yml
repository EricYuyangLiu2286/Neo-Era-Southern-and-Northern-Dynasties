l_english:
 je_manifest_destiny_mexico:0 "Manifest Destiny: The Road to the Pacific"
 je_manifest_destiny_mexico_reason:0 "Dongzhou has long been established along the Pacific coast, and its support helped establish the Mexican republic. American expansionists still draw the western harbours, pastures and trade routes into the Union's future. If the republic is to stretch from the Atlantic to the Pacific, these lands must belong to the Union, however many talks and however many wars it takes with the western states."
 je_manifest_destiny_frontier_wars:0 "Manifest Destiny: The Struggle for the Plains"
 je_manifest_destiny_frontier_wars_reason:0 "Indigenous peoples and Mongol pastoralists travel the routes across the Great Plains, while Dongzhou's soldiers and merchants press farther inland. American settlers, land speculators and frontier officers all want these lands drawn into the Union."
