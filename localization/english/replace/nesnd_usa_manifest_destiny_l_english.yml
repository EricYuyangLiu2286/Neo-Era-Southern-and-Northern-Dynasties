l_english:
 je_manifest_destiny_mexico:0 "Manifest Destiny: The Road to the Pacific"
 je_manifest_destiny_mexico_reason:0 "Dongzhou has long been established along the Pacific coast, and its support helped establish the Mexican republic. American expansionists envision the western ports, pastures and trade routes as part of the Union. Extending the republic from the Atlantic to the Pacific will require the federal government to secure these territories and bear the cost of confronting the western states."
 je_manifest_destiny_frontier_wars:0 "Manifest Destiny: The Struggle for the Plains"
 je_manifest_destiny_frontier_wars_reason:0 "Indigenous peoples and Mongol pastoralists travel the routes across the Great Plains, while Dongzhou's soldiers and merchants press farther inland. American settlers, land speculators and frontier officers want these territories brought into the Union. Community lands, pastoral routes and national borders are at the centre of another struggle for the continent."
