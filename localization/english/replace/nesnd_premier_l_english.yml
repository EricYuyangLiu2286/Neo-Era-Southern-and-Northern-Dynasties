 nesnd_premier.1.t:0 "A Cabinet Reshuffle"
 nesnd_premier.1.d:0 "The [SCOPE.sInterestGroup('nesnd_premier_old_ig_scope').GetName] is no longer in government, and the Prime Minister has left office with it. [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName], leader of the [SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName], the strongest group in government, becomes Prime Minister. The members and programme of the new cabinet must now be settled."
 nesnd_premier.1.d_generic:0 "The Prime Minister has left office. [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName], leader of the [SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName], becomes Prime Minister. The members and programme of the new cabinet must now be settled."
 nesnd_premier.1.f:0 "“The new Prime Minister was today invited to form a government.”\n- Government gazette"
 nesnd_premier.1.a:0 "The new cabinet takes office"
 nesnd_premier.1.tt:0 "The reshuffle has raised political turmoil by #r 15#!"

 nesnd_premier.11.t:0 "Questions in the House"
 nesnd_premier.11.d_rival:0 "[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName], leader of the [SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName], has questioned Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] in the legislature, accusing the cabinet of misgovernment and demanding an answer on the spot."
 nesnd_premier.11.d_all:0 "Deputies of every faction have taken turns to question Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] in the legislature, accusing the cabinet of misgovernment and demanding an answer on the spot."
 nesnd_premier.11.f:0 "“Will the Prime Minister answer to this House for the recent conduct of the cabinet?”\n- Record of questions in the legislature"
 nesnd_premier.11.a:0 "Rebut them on the spot"
 nesnd_premier.11.b:0 "Promise an inquiry"

 nesnd_premier.12.t:0 "The Ruler and the Prime Minister"
 nesnd_premier.12.d:0 "[SCOPE.sCharacter('nesnd_premier_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_premier_ruler_scope').GetFullName] has summoned Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName], expressed displeasure with several of the cabinet's measures and asked that they be withdrawn."
 nesnd_premier.12.f:0 "“The Prime Minister attended today by summons and reported in person on the cabinet's measures.”\n- Government gazette"
 nesnd_premier.12.a:0 "The Prime Minister gives way"
 nesnd_premier.12.b:0 "Stand by the cabinet's measures"

 nesnd_premier.13.t:0 "A Minister in Disgrace"
 nesnd_premier.13.d:0 "The press has revealed that a minister from the [SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName] abused the office to steer contracts and concessions to friends and relatives. Critics demand that Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] take a position."
 nesnd_premier.13.f:0 "“Documents obtained by this newspaper show that most of the ministry's contracts went to a single firm.”\n- Newspaper editorial"
 nesnd_premier.13.a:0 "Demand the minister's resignation"
 nesnd_premier.13.b:0 "The Prime Minister vouches for the minister"

 nesnd_premier.14.t:0 "The Verdict of the Press"
 nesnd_premier.14.d:0 "For days the leading newspapers of the capital have weighed up Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]'s record, with praise and criticism in equal measure. The cabinet may subsidise friendly papers or ignore them all."
 nesnd_premier.14.f:0 "“Whether the Prime Minister is fit for office, our readers will judge for themselves.”\n- Newspaper editorial"
 nesnd_premier.14.a:0 "Subsidise friendly papers"
 nesnd_premier.14.b:0 "Ignore them"

 nesnd_premier.15.t:0 "A Quarrel over Portfolios"
 nesnd_premier.15.d:0 "The other interest groups in government say the [SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName] holds too many ministries and demand that the portfolios be redistributed."
 nesnd_premier.15.f:0 "“Our share of the cabinet does not reflect our strength in the legislature.”\n- Letter from a governing group to the Prime Minister"
 nesnd_premier.15.a:0 "Give up some portfolios"
 nesnd_premier.15.b:0 "Keep things as they are"

 nesnd_premier.16.t:0 "The Budget"
 nesnd_premier.16.d:0 "The treasury is spending more than it takes in, and Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] must lay a new budget before the legislature. Cutting spending will weigh on the lower strata, while finding funds elsewhere will expose the Prime Minister to criticism."
 nesnd_premier.16.f:0 "“The budget for the current year is laid before the House for consideration.”\n- Order paper of the legislature"
 nesnd_premier.16.a:0 "Cut spending"
 nesnd_premier.16.b:0 "Find funds elsewhere"

 nesnd_premier.17.t:0 "The Prime Minister Offers to Resign"
 nesnd_premier.17.d:0 "Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName], who has led the cabinet for more than five years, has submitted a letter of resignation and asked to retire from public life."
 nesnd_premier.17.f:0 "“Having served for so long, I respectfully ask to be released from office.”\n- The Prime Minister's letter of resignation"
 nesnd_premier.17.a:0 "Persuade them to stay"
 nesnd_premier.17.b:0 "Accept the resignation"
 nesnd_premier.17.b.tt:0 "[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] retires from public life. The new leader of the [SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName] becomes Prime Minister, or, if that group is not in government, the leader of the strongest group in government. Political turmoil #r +5#!"

 nesnd_premier.18.t:0 "A By-election"
 nesnd_premier.18.d:0 "A seat in the legislature has fallen vacant and a by-election must be held. The [SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName] and its opponents alike treat the contest as a vote of confidence in Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]."
 nesnd_premier.18.f:0 "“The by-election for this constituency will be held next month.”\n- Election notice"
 nesnd_premier.18.a:0 "Throw everything into the campaign"
 nesnd_premier.18.b:0 "Let the voters decide"

 nesnd_premier.19.t:0 "A Backbench Revolt"
 nesnd_premier.19.d:0 "The [SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName] is unhappy with the cabinet, and a number of its own deputies have voted with the other side, damaging Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]'s authority."
 nesnd_premier.19.f:0 "“We answer for our votes to our constituents alone.”\n- Joint statement of the rebel deputies"
 nesnd_premier.19.a:0 "Make concessions to our own group"
 nesnd_premier.19.b:0 "Expel the rebels"

 nesnd_premier.20.t:0 "The Civil List"
 nesnd_premier.20.d:0 "The legislature is debating the civil list. Critics propose cutting the allowance and household expenses of [SCOPE.sCharacter('nesnd_premier_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_premier_ruler_scope').GetFullName], and Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] must take a position."
 nesnd_premier.20.f:0 "“The civil list is laid before the House for consideration.”\n- Order paper of the legislature"
 nesnd_premier.20.a:0 "Grant the usual sum"
 nesnd_premier.20.b:0 "Support the cuts"

 nesnd_premier.21.t:0 "A Motion of No Confidence"
 nesnd_premier.21.d_rival:0 "[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName], leader of the [SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName], has moved a motion of no confidence in Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName], and faction after faction has declared its support. The cabinet can hardly carry on."
 nesnd_premier.21.d_all:0 "The factions in the legislature have jointly moved a motion of no confidence in Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]. The cabinet can hardly carry on."
 nesnd_premier.21.f:0 "“This House no longer has confidence in the Prime Minister.”\n- Text of the motion"
 nesnd_premier.21.a:0 "The Prime Minister resigns"
 nesnd_premier.21.b:0 "Request a dissolution"
 nesnd_premier.21.c:0 "Refuse to resign"

 nesnd_premier.22.t:0 "An Overmighty Prime Minister"
 nesnd_premier.22.d:0 "No one in the legislature can check Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] any longer, and the cabinet's bills often pass without debate. [SCOPE.sCharacter('nesnd_premier_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_premier_ruler_scope').GetFullName] has summoned the Prime Minister and is considering what to do."
 nesnd_premier.22.f:0 "“All bills put to the vote in this House today were passed without opposition.”\n- Record of proceedings in the legislature"
 nesnd_premier.22.a:0 "Dismiss the Prime Minister"
 nesnd_premier.22.b:0 "Let it be"
 nesnd_premier.22.c:0 "Warn the Prime Minister"

 nesnd_premier.23.t:0 "An Attempt on the Prime Minister"
 nesnd_premier.23.d_dead:0 "Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] has been assassinated in public."
 nesnd_premier.23.d_wounded:0 "Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] was attacked in public and badly wounded, but survived."
 nesnd_premier.23.d_escaped:0 "An assassin attacked Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName] in public but failed and was arrested."
 nesnd_premier.23.f:0 "“The police have sealed off the scene and are searching for accomplices.”\n- Police notice"
 nesnd_premier.23.a:0 "Investigate to the end"
 nesnd_premier.23.b:0 "Reassure the public"

 nesnd_premier.24.t:0 "The Opposition Leader in Danger"
 nesnd_premier.24.d_dead:0 "[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName], leader of the [SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName], has been killed in an attack. The killers have not been found."
 nesnd_premier.24.d_exiled:0 "[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName], leader of the [SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName], has been charged with conspiracy, arrested and expelled from the country."
 nesnd_premier.24.d_escaped:0 "[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName], leader of the [SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName], narrowly escaped an attack and has publicly blamed the Prime Minister's side."
 nesnd_premier.24.f:0 "“The attack on our leader must be fully investigated.”\n- Statement of an opposition group"
 nesnd_premier.24.a:0 "Investigate the matter"
 nesnd_premier.24.b:0 "Let it rest"

 nesnd_premier.26.t:0 "Investigating the Opposition Leader"
 nesnd_premier.26.d_success:0 "The prosecutors have found evidence of wrongdoing by [SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName], who has been convicted and expelled from the country."
 nesnd_premier.26.d_fail:0 "The investigation found nothing that would secure a conviction, and [SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName] is unharmed. The [SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName] accuses the cabinet of abusing its power."
 nesnd_premier.26.f:0 "“The investigation is closed. The prosecutors will announce their findings separately.”\n- Notice of the Ministry of Justice"
 nesnd_premier.26.a:0 "So be it"

 nesnd_premier.31.t:0 "A Petition Movement"
 nesnd_premier.31.d:0 "People across the country have signed petitions asking the cabinet to ease their burdens and improve their livelihoods, and the petitioners have gathered outside the legislature."
 nesnd_premier.31.f:0 "“We ask the legislature to hear our voice.”\n- Petition"
 nesnd_premier.31.a:0 "Receive their delegates"
 nesnd_premier.31.b:0 "Disperse the crowd"

 nesnd_premier.32.t:0 "The Army and the Cabinet"
 nesnd_premier.32.d:0 "The [SCOPE.sInterestGroup('nesnd_premier_army_scope').GetName] demand more money for the army and accuse Prime Minister [SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]'s cabinet of weakening the country's defences."
 nesnd_premier.32.f:0 "“The needs of the army cannot wait for the next budget year.”\n- Memorandum from the General Staff to the cabinet"
 nesnd_premier.32.a:0 "Raise military spending"
 nesnd_premier.32.b:0 "Refuse their demands"
