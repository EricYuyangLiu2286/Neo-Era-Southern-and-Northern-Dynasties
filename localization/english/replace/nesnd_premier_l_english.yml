l_english:
 # The Ruler and the Cabinet. Progress-bar breakdown lines are in nesnd_premier_bars_l_english.yml (generated).
 nesnd_premier_journal:0 "The Ruler and the Cabinet"
 nesnd_premier_journal_reason:0 "The day-to-day business of government in [ROOT.GetCountry.GetName] is conducted by the cabinet. The Prime Minister must lead one of the [concept_interest_group]s in government, and the Prime Minister's standing with the public decides how quickly the cabinet can pass laws and affects the government's legitimacy. Of the groups outside the government, the one with the most clout is the Prime Minister's chief opponent in the legislature. When every group has joined the government, the Prime Minister must contend with all the others instead. If a reshuffle leaves the Prime Minister's own group outside the government, the Prime Minister falls with it and the leader of the strongest group in government takes office."
 nesnd_premier_status_vacant:0 "No leader of a group in government is currently able to serve as Prime Minister. While the post is vacant, the cabinet's modifiers are suspended.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_premier_end_rules Conditions for suspension#!#!"
 nesnd_premier_status_rival:0 "Prime Minister [ROOT.GetCountry.GetCustom('nesnd_premier_pm_name')] comes from the [ROOT.GetCountry.GetCustom('nesnd_premier_pm_ig_name')]. The largest group in opposition is the [ROOT.GetCountry.GetCustom('nesnd_premier_rival_ig_name')], led by [ROOT.GetCountry.GetCustom('nesnd_premier_rival_name')]. The balance shows which side is gaining ground. Above #v 90#! or below #v 10#!, a full bar of political turmoil may turn into an extreme event.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_premier_end_rules Conditions for suspension#!#!"
 nesnd_premier_status_all:0 "Every [concept_interest_group] is in government. The balance shows how Prime Minister [ROOT.GetCountry.GetCustom('nesnd_premier_pm_name')]'s [ROOT.GetCountry.GetCustom('nesnd_premier_pm_ig_name')] fares against all the others. Above #v 90#! or below #v 10#!, a full bar of political turmoil may turn into an extreme event.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_premier_end_rules Conditions for suspension#!#!"
 nesnd_premier_end_rules:0 "This journal entry is suspended, and its modifiers removed, if any of the following occurs:\n- The country is no longer an empire or hegemony\n- The country becomes a republic, and Head of State and Factions takes over\n- The country can appoint favourites, and Court Power takes over\n- The Ming civil war, Preserve the Napoleonic Dynasty, Court and Provinces or Council at Ili journal entry begins\nThe journal entry resumes automatically once the conditions are met again. If another of these journal entries was active in the meantime, the balance returns to the centre and political turmoil is reset to zero."

 nesnd_premier_cond_no_favorites:0 "Cannot appoint favourites: the distribution of power is not autocracy, oligarchy, landed voting or technocracy, or the country is in a personal union"
 nesnd_premier_cond_has_pm:0 "There is a Prime Minister"
 nesnd_premier_cond_pm_backs_law:0 "The Prime Minister supports the law being enacted"
 nesnd_premier_cond_intrigue_30:0 "Political turmoil is at least #v 30#!"
 nesnd_premier_cond_mode_rival:0 "At least one [concept_interest_group] is outside the government"
 nesnd_premier_cond_balance_le_20:0 "The balance between the Prime Minister and the factions is no higher than #v 20#!, with the opposition ahead"
 nesnd_premier_cond_balance_extreme:0 "The balance between the Prime Minister and the factions is no higher than #v 20#! or no lower than #v 80#!"
 nesnd_premier_cond_rival_removable:0 "The opposition leader is not the ruler, is not immortal and is not protected by a story"
 nesnd_premier_cond_franchise:0 "The country holds elections"
 nesnd_premier_cond_no_campaign:0 "No election campaign is under way"
 nesnd_premier_cond_ig_in_gov:0 "Their [concept_interest_group] is in government"
 nesnd_premier_cond_other_candidate:0 "Another group in government has a leader who can serve as Prime Minister"
 nesnd_premier_cond_not_exiled:0 "Not in exile"

 nesnd_premier_btn_law:0 "Steer the Bill"
 nesnd_premier_btn_law_desc:0 "[ROOT.GetCountry.GetCustom('nesnd_premier_pm_name')] personally canvasses the legislature for votes on the law being enacted."
 nesnd_premier_btn_reward:0 "Place Our Own"
 nesnd_premier_btn_reward_desc:0 "Hand government posts to members of the [ROOT.GetCountry.GetCustom('nesnd_premier_pm_ig_name')]."
 nesnd_premier_btn_placate:0 "Reach Out to the Factions"
 nesnd_premier_btn_placate_desc:0 "With a group in opposition, negotiate with the [ROOT.GetCountry.GetCustom('nesnd_premier_rival_ig_name')]. With every group in government, give up some posts to the other factions."
 nesnd_premier_btn_speech:0 "Speaking Tour"
 nesnd_premier_btn_speech_desc:0 "[ROOT.GetCountry.GetCustom('nesnd_premier_pm_name')] tours the country giving speeches to win public support."
 nesnd_premier_btn_restrain:0 "Rein in the Party"
 nesnd_premier_btn_restrain_desc:0 "The ruler requires the cabinet to restrain the deputies of the [ROOT.GetCountry.GetCustom('nesnd_premier_pm_ig_name')]. The more popular the ruler, the further the balance returns towards the centre."
 nesnd_premier_btn_calm:0 "Calm the Turmoil"
 nesnd_premier_btn_calm_desc:0 "The cabinet negotiates privately with the factions to halt the mutual attacks in the legislature."
 nesnd_premier_btn_investigate:0 "Investigate the Opposition Leader"
 nesnd_premier_btn_investigate_desc:0 "Instruct the prosecutors to investigate [ROOT.GetCountry.GetCustom('nesnd_premier_rival_name')]."
 nesnd_premier_btn_investigate_tt:0 "An event decides the outcome. On success [ROOT.GetCountry.GetCustom('nesnd_premier_rival_name')] is expelled from the country. On failure the balance shifts #v 10#! towards the opposition. Either way, radicals in the [ROOT.GetCountry.GetCustom('nesnd_premier_rival_ig_name')] increase. The chance of success depends on the Prime Minister's popularity and is currently #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_premier_arrest_chance')|0]%#!."
 nesnd_premier_btn_dissolve:0 "Request a Dissolution"
 nesnd_premier_btn_dissolve_desc:0 "The Prime Minister asks the ruler to dissolve the legislature and call an early election."
 nesnd_premier_card_tt:0 "#header [ScriptedButton.GetName]#!\nThis will affect the Prime Minister's standing.\n$je_tp_ukaz_repeatable$\n$TOOLTIP_DELIMITER$\n[AddLocalizationIf(Not(StringIsEmpty(ScriptedButton.GetPossibleDesc)), 'je_tp_ukaz_requirements')]#title Effects:#!#indent_newline:3 \n[ScriptedButton.GetEffectDesc]#![AddLocalizationIf(Not(StringIsEmpty(ScriptedButton.GetDesc)), 'je_tp_ukaz_flavour')]"

