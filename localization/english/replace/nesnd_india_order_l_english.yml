 nesnd_india_order_tax_desc:0 "Decide how much of their income our [Concept('concept_subject', '$concept_subjects|q$')] pay to us."
 nesnd_india_order_army_desc:0 "Decide whether our [Concept('concept_subject', '$concept_subjects|q$')] follow us into [Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')] and wars."
 nesnd_india_order_school_desc:0 "Decide who sets the standards for schools and offices."
 nesnd_india_order_tax_central_tt:0 "The [concept_tax_capacity] of our own states +5%. We sign $raise_payments$ with each [concept_subject]: it pays us more of its income, its weekly [concept_liberty_desire] goes up, and each treaty takes 25 of our [concept_influence]. A [concept_protectorate], or a subject in [concept_default] or with [concept_liberty_desire] of 75 or more, cannot sign it and gets nothing."
 nesnd_india_order_tax_local_tt:0 "We sign $decrease_payments$ with each [concept_subject]: it pays us less of its income, and its weekly [concept_liberty_desire] goes down. A [concept_protectorate] cannot sign it and gets nothing. Our own country gains no modifier."
 nesnd_india_order_army_central_tt:0 "Our [concept_authority] +10 for each [concept_subject]. The weekly [concept_liberty_desire] of each [concept_subject] goes up. No subject changes its type."
 nesnd_india_order_army_local_tt:0 "We sign $exempt_from_service$ with each [concept_subject]: it need not follow us into [Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')] and wars, and its weekly [concept_liberty_desire] goes down. A [concept_tributary] or a [concept_protectorate] never joins its overlord's wars, cannot sign it and gets nothing. Our own country gains no modifier."
 nesnd_india_order_school_central_tt:0 "The [concept_pop_qualifications] of our own states +5%. We sign $da_knowledge_sharing$ with each [concept_subject]: our [concept_technology_spread] slows and theirs quickens, their weekly [concept_liberty_desire] goes down, and each treaty takes 50 of our [concept_influence]. Where we have not researched more technologies than they have, it cannot be signed and they get nothing."
 nesnd_india_order_school_local_tt:0 "The [concept_pop_qualifications] of each [concept_subject] +5%, and its weekly [concept_liberty_desire] goes down. Our own country gains no modifier."
 nesnd_india_order_switch_tt:0 "Whatever this journal set up for the other way in this matter is removed first. The choice cannot be changed again for 60 months. Subjects that join later receive it at the next monthly update."
 nesnd_india_order_has_subject_tt:0 "At least one [concept_subject] of ours holds populated states in $region_north_india$ or $region_south_india$"
 nesnd_india_order_already_tt:0 "This matter is not already settled this way"
 nesnd_india_order_tax_wait_tt:0 "This matter cannot be changed before [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_order_tax_wait'))]"
 nesnd_india_order_army_wait_tt:0 "This matter cannot be changed before [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_order_army_wait'))]"
 nesnd_india_order_school_wait_tt:0 "This matter cannot be changed before [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_order_school_wait'))]"
 nesnd_india_mughal_court_tt:0 "Our government carries on from the Mughal state"
 nesnd_india_order_tax_central:0 "Central Taxation"
 nesnd_india_order_tax_central_desc:0 "Taxation is with the centre in The Centre and the States."
 nesnd_india_order_army_central:0 "Central Command"
 nesnd_india_order_army_central_desc:0 "The army and foreign affairs are with the centre in The Centre and the States."
 nesnd_india_order_school_central:0 "Central Schooling"
 nesnd_india_order_school_central_desc:0 "Schools and offices are with the centre in The Centre and the States."
 nesnd_india_order_army_subject:0 "Command by the Overlord"
 nesnd_india_order_army_subject_desc:0 "Our overlord has taken the army and foreign affairs to the centre in The Centre and the States."
 nesnd_india_order_school_subject:0 "Schooling Kept at Home"
 nesnd_india_order_school_subject_desc:0 "Our overlord has left schools and offices to the states in The Centre and the States."
