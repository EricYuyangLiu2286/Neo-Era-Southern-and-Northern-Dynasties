l_english:
 nesnd_india_order:0 "The Centre and the States"
 nesnd_india_order_reason:0 "Now that [ROOT.GetCountry.GetName] has [Concept('concept_subject', '$concept_subjects|q$')], a common government must settle three matters: who collects the taxes, who commands the armies and conducts foreign affairs, and who runs the schools and appoints the officials. Each may be taken by the centre or left to the states."
 nesnd_india_order_void_conclusion:0 "We no longer have [Concept('concept_subject', '$concept_subjects|q$')], and these arrangements lapse."
 nesnd_india_order_reason_0_0_0:0 "Now that [ROOT.GetCountry.GetName] has [Concept('concept_subject', '$concept_subjects|q$')], a common government must settle three matters: who collects the taxes, who commands the armies and conducts foreign affairs, and who runs the schools and appoints the officials. Each may be taken by the centre or left to the states.\n\nTaxation: not yet settled.\nArmy and foreign affairs: not yet settled.\nSchools and offices: not yet settled."
 nesnd_india_order_reason_0_0_c:0 "Now that [ROOT.GetCountry.GetName] has [Concept('concept_subject', '$concept_subjects|q$')], a common government must settle three matters: who collects the taxes, who commands the armies and conducts foreign affairs, and who runs the schools and appoints the officials. Each may be taken by the centre or left to the states.\n\nTaxation: not yet settled.\nArmy and foreign affairs: not yet settled.\nSchools and offices: with the centre. The [concept_pop_qualifications] of our own states rises by 5%. We have $da_knowledge_sharing$ with #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_in')|0]#! of our [Concept('concept_subject', '$concept_subjects|q$')]; #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_unable')|0]#! could not take it (we must have researched more technologies than they have, or it cannot be signed), and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_dropped')|0]#! have since dropped it. It cannot be changed before [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_order_school_wait'))]."
