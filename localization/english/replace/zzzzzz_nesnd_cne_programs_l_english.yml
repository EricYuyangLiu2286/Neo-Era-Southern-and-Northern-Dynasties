 nesnd_cne_land_journal:0 "Commercialising Land"
 nesnd_cne_land_journal_reason:0 "Military nobles and local lineages hold estates that bind farming families to old patrons. Marketable land opens agriculture to new investment, but a sale does not provide a livelihood for those displaced. Employment and migration must follow the change in ownership."
 nesnd_cne_land_start_button:0 "Begin commercialising land"
 nesnd_cne_land_start_button_desc:0 "Put this programme into effect, with its fiscal and political consequences."
 nesnd_cne_land_stop_button:0 "Pause commercialising land"
 nesnd_cne_land_stop_button_desc:0 "Suspend this programme and withdraw its temporary benefits and political costs."
 nesnd_cne_urban_journal:0 "Building an Urban Nation"
 nesnd_cne_urban_journal_reason:0 "People leaving the estates need work in workshops, mines and towns. Iron and coal must support steel, tools and engines, while welfare helps workers endure unemployment, sickness and old age. This urban society challenges the authority of the old rural schools and scholars."
 nesnd_cne_urban_start_button:0 "Begin building an urban nation"
 nesnd_cne_urban_start_button_desc:0 "Put this programme into effect, with its fiscal and political consequences."
 nesnd_cne_urban_stop_button:0 "Pause building an urban nation"
 nesnd_cne_urban_stop_button_desc:0 "Suspend this programme and withdraw its temporary benefits and political costs."
 nesnd_cne_camps_journal:0 "Ending Military Estates"
 nesnd_cne_camps_journal_reason:0 "Since 1444, the Qin military colonies developed into an estate system across the north. Land funded the army, while the army supported taxation and conquest. Bringing these estates into civilian production challenges entrenched military interests. Provinces may proceed separately, or pause when disputes become too severe."
 nesnd_cne_land_status:0 "Agricultural development supports the transfer of land.\n$nesnd_cne_land_requirements$\nFinal consolidation also requires Peasant Proprietorship, Commercialized Agriculture or Collectivized Agriculture. While active: #p +0.25#! monthly reform progress. Lost agricultural prerequisites or a pause end these benefits."
 nesnd_cne_urban_status:0 "Towns require industry and welfare to absorb population.\n$nesnd_cne_urban_requirements$\nWhile active: #p +0.35#! monthly reform progress. Losing industrial or welfare prerequisites pauses the programme.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_cne_consolidation_rules Employment, education and welfare consolidation#!#!\nFunding proposals identify the state before payment."
 nesnd_cne_camps_status:0 "Active estate programmes: #v [ROOT.GetCountry.MakeScope.Var('nesnd_cne_camps_active').GetValue|0]#!. Each adds #p 0.05#! reform progress monthly and its own military opposition.\nEach state can be started or paused separately. All temporary effects end with the parent reform."
 nesnd_cne_start_requirements:0 "The reform is active; bureaucracy is non-negative, the country is not bankrupt, disorder is below 65, and the state is still owned."
 nesnd_cne_land_requirements:0 "Research Intensive Agriculture; developed agricultural land must occupy at least #v 6%#! of arable capacity in the reform regions; non-negative bureaucracy, no bankruptcy, disorder below #v 65#!."
 nesnd_cne_urban_requirements:0 "At least #v 5#! states with level-#v 5#! urban centres; iron mines #v 25#!, coal mines #v 40#!, steel mills #v 10#!, tooling workshops #v 30#!, motor industries #v 6#!, logging camps #v 60#!, shipyards #v 12#! levels.\nUnlock welfare technology, enact Poor Laws, Wage Subsidies or Old Age Pension, and fund Social Security to level #v 1#!; non-negative bureaucracy, no bankruptcy, disorder below #v 65#!."
 nesnd_cne_land_start_tt:0 "Monthly reform progress #p +0.25#!. Landowners approval #n −2#!, Rural Folk approval #n −1#!; Landowners attraction #n −15%#!, Industrialists attraction #p +15%#! without approval gain. Enactment success #p +5 percentage points#! and minimum wage #p +5%#!."
 nesnd_cne_urban_start_tt:0 "Monthly reform progress #p +0.35#!. Devout approval #n −2#!, Industrialists approval #n −1#!; Petite Bourgeoisie attraction #p +15%#!. Enactment success #p +5 percentage points#! and minimum wage #p +5%#!."
 nesnd_cne_land_stop_tt:0 "Stop this programme’s monthly progress and remove all of its temporary benefits and interest-group effects."
 nesnd_cne_urban_stop_tt:0 "Stop this programme’s monthly progress and remove all of its temporary benefits and interest-group effects."
 nesnd_cne_camp_start_tt:0 "This state adds #p 0.05#! reform progress monthly. Agriculture and mining throughput, taxation capacity and construction speed each #p +10%#!. This state separately applies Armed Forces approval #n −1#! and loyalty #n −1#! to serving generals and admirals; concurrent states stack."
 nesnd_cne_camp_stop_tt:0 "Stop this state’s monthly progress and remove its production, taxation and construction benefits and its associated military approval and officer loyalty penalties."
 nesnd_cne_land_commercialization:0 "Commercialising Land"
 nesnd_cne_national_urbanization:0 "National Urbanisation"
 nesnd_cne_camp_transition:0 "Military Estates in Civilian Use"
 nesnd_cne_camp_agriculture:0 "Estate Reform: Agriculture"
 nesnd_cne_camp_mining:0 "Estate Reform: Mining"
 nesnd_cne_camp_administration:0 "Estate Reform: Taxation and Construction"
 nesnd_cne_funding_requirements:0 "The reform is active, funds are available, the annual cooldown has ended, and no other funding proposal awaits a response."
 nesnd_land_survey_outcome_tt:0 "Open a proposal for the eligible state with the highest unemployment. The event identifies the state and shows treasury cost and construction, qualification and education effects before any payment."
 nesnd_land_military_outcome_tt:0 "Open a relief proposal for the eligible starving state with the highest unemployment. The event identifies the state, cost, welfare effect and duration before any payment."
 nesnd_cne_funding.1.t:0 "Industrial Funding for [SCOPE.sState('nesnd_cne_funding_state').GetName]"
 nesnd_cne_funding.1.d:0 "[SCOPE.sState('nesnd_cne_funding_state').GetName] faces the pressures of economic transition. Funding workshops and technical education will improve construction, qualifications and education for one year. Actual hiring still depends on viable enterprises and workers finding suitable jobs."
 nesnd_cne_funding.2.t:0 "Transitional Relief in [SCOPE.sState('nesnd_cne_funding_state').GetName]"
 nesnd_cne_funding.2.d:0 "Relief offices in [SCOPE.sState('nesnd_cne_funding_state').GetName] request additional funds. Families without income are cutting their meals while they search for work. One year of additional welfare can ease this transition; lasting livelihoods still require productive employment and wages."
 nesnd_cne_funding.accept:0 "Approve the funding."
 nesnd_cne_funding.cancel:0 "Defer the proposal."
 nesnd_land_rules_link:0 "Construction and political effects are listed in the three sub-journals.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules Current living conditions#!#!"
 nesnd_land_rules:0 "Unemployed workforce: #v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!\nFood-insecure workforce: #v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!\nWorkforce household living standards: #v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!\nMarket access: #v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!\n\nActive programmes add reform progress; pausing preserves progress already earned."
 nesnd_reform_completion_tt:0 "Reach #v 100#! reform progress, sustain the institutional and living-condition requirements for #v 12#! months, keep disorder below #v 50#!, and avoid a successful coup."
 nesnd_reform_failure_tt:0 "A coup succeeds during the reform, or prolonged severe disorder and deprivation cause a crisis."
 ce_cne_land_reform_goal:0 "Pursue the reform programmes, improve institutions and living conditions, and sustain the gains for twelve months."
 nesnd_reform_status_healthy:0 "#p Reform gains are consolidating#!: #v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_good_months').GetValue|0]#! consecutive qualifying months.\n$nesnd_land_rules_link$"
 nesnd_cne_consolidation_rules:0 "#bold Consolidation#!\nSchools level #v 2#!, literacy #v 48%#!, unemployment at most #v 6%#!, food insecurity at most #v 8%#!, living standards at least #v 11#! and market access at least #v 85%#!. Social Security level #v 2#! and living standards #v 12#! allow up to #v 12%#! unemployment. Non-negative bureaucracy, peace and no bankruptcy penalty are required.\n\n#bold Local deprivation#!\nStates with at least #v 500,000#! inhabitants interrupt consolidation after six months above #v 20%#! unemployment, #v 25%#! food insecurity or #v 10%#! severe starvation. National and local rates use workforce; subsistence workers are employed.\n\nComplete at #v 100#! progress, #v 12#! consecutive qualifying months and disorder below #v 50#!. The existing rapid-reform reward still requires completion within 48 months, at least 24 consecutive qualifying months and disorder below 30."
