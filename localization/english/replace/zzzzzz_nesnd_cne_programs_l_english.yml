 nesnd_cne_land_journal:0 "Commercialising Land"
 nesnd_cne_land_journal_reason:0 "Military nobles and local lineages hold estates that bind farming families to old patrons. Marketable land opens agriculture to new investment, but a sale does not provide a livelihood for those displaced. Employment and migration must follow the change in ownership."
 nesnd_cne_land_start_button:0 "Begin commercialising land"
 nesnd_cne_land_start_button_desc:0 "Survey fields and open land transfers, freeing land and peasants from clan control."
 nesnd_cne_land_stop_button:0 "Pause commercialising land"
 nesnd_cne_land_stop_button_desc:0 "Suspend land surveys and transfers and recall the officials responsible."
 nesnd_cne_urban_journal:0 "Building an Urban Nation"
 nesnd_cne_urban_journal_reason:0 "People leaving the estates need work in workshops, mines and towns. Coal and iron must sustain the production of steel, tools and engines, while relief helps workers endure illness, unemployment and old age. The industrial, educational and welfare measures discussed by the Six Ministries depend on governors to organise and carry them out. The occupations and learning that grow with the cities will also weaken the authority of the old rural schools and scholars."
 nesnd_cne_urban_start_button:0 "Begin building an urban nation"
 nesnd_cne_urban_start_button_desc:0 "Expand workshops, mines and towns, with relief for the workers arriving there."
 nesnd_cne_urban_stop_button:0 "Pause building an urban nation"
 nesnd_cne_urban_stop_button_desc:0 "Suspend the state-sponsored resettlement and urban expansion programme."
 nesnd_cne_camps_journal:0 "Ending Military Estates"
 nesnd_cne_camps_journal_reason:0 "Since 1444, the Qin military colonies of Northern Ming have developed into an estate system across the north. Land supplied the army's food and pay, while the army sustained taxation and conquest. Military and agricultural interests grew together. Bringing these lands and mines into civilian use now threatens entrenched military privileges.\n\nThe Ministry of Revenue wants the estates brought under ordinary taxation and management. The Ministry of War must answer officers who invoke unpaid wages and past service. Governors charged with enforcing the law may lack the force to compel their garrisons, while the founding commanders in the Senate are reluctant to surrender their own property. The provinces can proceed separately and suspend reform where disputes become unmanageable. New revenue and production must eventually replace the army's landed income."
 nesnd_cne_land_status:0 "$nesnd_cne_land_requirements$\nEstablish peasant proprietorship, commercialised agriculture or collectivised agriculture."
 nesnd_cne_urban_status:0 "$nesnd_cne_urban_requirements$\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_cne_consolidation_rules Employment, education and welfare#!#!"
 nesnd_cne_camps_status:0 "States reorganising military estates: #v [ROOT.GetCountry.MakeScope.Var('nesnd_cne_camps_active').GetValue|0]#!."
 nesnd_cne_start_requirements:0 "Land reform remains active; nonnegative bureaucracy, no bankruptcy penalty, disorder below 65, and ownership of the state."
 nesnd_cne_land_requirements:0 "Research Intensive Agriculture; developed agricultural land must occupy at least #v 6%#! of arable capacity in the reform regions; non-negative bureaucracy, no bankruptcy, disorder below #v 65#!."
 nesnd_cne_urban_requirements:0 "At least #v 5#! states with level-#v 5#! urban centres; iron mines #v 25#!, coal mines #v 40#!, steel mills #v 10#!, tooling workshops #v 30#!, motor industries #v 6#!, logging camps #v 60#!, shipyards #v 12#! levels.\nUnlock welfare technology, enact Poor Laws, Wage Subsidies or Old Age Pension, and fund Social Security to level #v 1#!; non-negative bureaucracy, no bankruptcy, disorder below #v 65#!."
 nesnd_cne_land_start_tt:0 "Monthly reform progress #p +0.25#!. Landowners approval #n −2#!, Rural Folk approval #n −1#!; Landowners attraction #n −15%#! and Industrialists attraction #p +15%#!. Enactment success #p +5 percentage points#! and minimum wage #p +5%#!. Costs #n 5#! public confidence per year."
 nesnd_cne_urban_start_tt:0 "Monthly reform progress #p +0.35#!. Devout approval #n −2#!, Industrialists approval #n −1#!; Petite Bourgeoisie attraction #p +15%#!. Enactment success #p +5 percentage points#! and minimum wage #p +5%#!. Costs #n 5#! public confidence per year."
 nesnd_cne_land_stop_tt:0 "End the progress, confidence cost and temporary modifiers of land commercialisation."
 nesnd_cne_urban_stop_tt:0 "End the progress, confidence cost and temporary modifiers of urbanisation."
 nesnd_cne_camp_start_tt:0 "This state adds #p 0.05#! reform progress monthly. Agriculture and mining throughput, taxation capacity and construction speed each #p +10%#!. This state separately applies Armed Forces approval #n −1#! and loyalty #n −1#! to serving generals and admirals; concurrent states stack. Costs #n 5#! public confidence per year."
 nesnd_cne_camp_stop_tt:0 "Stop this state’s monthly progress and remove its production, taxation and construction benefits and its associated military approval and officer loyalty penalties."
 nesnd_cne_land_commercialization:0 "Commercialising Land"
 nesnd_cne_national_urbanization:0 "National Urbanisation"
 nesnd_cne_camp_transition:0 "Military Estates in Civilian Use"
 nesnd_cne_camp_agriculture:0 "Estate Reform: Agriculture"
 nesnd_cne_camp_mining:0 "Estate Reform: Mining"
 nesnd_cne_camp_administration:0 "Estate Reform: Taxation and Construction"
 nesnd_cne_funding_requirements:0 "Land reform remains active, the treasury can meet the cost, a year has passed since the previous grant, and no proposal awaits a reply."
 nesnd_land_survey_outcome_tt:0 "Propose industrial funding for the eligible state with the highest unemployment."
 nesnd_land_military_outcome_tt:0 "Propose relief for the eligible state with the highest unemployment among those facing starvation."
 nesnd_cne_funding.1.t:0 "Industrial Funding for [SCOPE.sState('nesnd_cne_funding_state').GetName]"
 nesnd_cne_funding.1.d:0 "The governor of [SCOPE.sState('nesnd_cne_funding_state').GetName] reports that many people leaving the estates lack the skills needed by workshops and struggle to find a living in town. The Ministry of Revenue proposes a grant for practical schools and workshop expansion. Learning a new trade would give these families the means to use the freedom promised by land reform."
 nesnd_cne_funding.2.t:0 "Transitional Relief in [SCOPE.sState('nesnd_cne_funding_state').GetName]"
 nesnd_cne_funding.2.d:0 "The governor of [SCOPE.sState('nesnd_cne_funding_state').GetName] requests additional relief. Families without an income are cutting their meals, and the towns offer too few jobs to support them. The Ministry of Revenue proposes a year of additional payments through the existing relief institutions and has submitted the grant for approval."
 nesnd_cne_funding.accept:0 "Approve the funding."
 nesnd_cne_funding.cancel:0 "Defer the proposal."
 nesnd_land_rules_link:0 "In Emperor Mu’s grand design, the Empire pursues three revolutionary aims: #bold $nesnd_cne_land_journal$#!, #bold $nesnd_cne_urban_journal$#! and #bold $nesnd_cne_camps_journal$#!.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules This month’s livelihoods#!#!"
 nesnd_land_rules:0 "Unemployed workforce: #v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!\nWorkforce facing starvation: #v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!\nStandard of Living in working households: #v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!\nMarket Access: #v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!"
 nesnd_reform_completion_tt:0 "Reach #v 100#! reform progress, maintain sound livelihoods and institutions for #v 12#! consecutive months, and keep local disorder below #v 50#!. The monarchy must remain, confidence must endure, and no coup or revolutionary civil war may have occurred."
 nesnd_reform_failure_tt:0 "The reform fails if confidence runs out, monarchy ends, a revolution or secession war breaks out, or a coup succeeds. Extreme crisis also causes failure: at least fifteen months of reports, twelve consecutive distressed months, disorder of 90, national turmoil above 40%, legitimacy below 25, and war or a bankruptcy penalty."
 ce_cne_land_reform_goal:0 "Advance land commercialisation, urbanisation and military-estate reform, and consolidate the land revolution."
 nesnd_reform_status_healthy:0 "#p Reform gains are consolidating#!: conditions have held for #v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_good_months').GetValue|0]#! consecutive months.\n$nesnd_land_rules_link$"
 nesnd_cne_consolidation_rules:0 "#bold Consolidation#!\nSchools level #v 2#!, literacy #v 48%#!, unemployment at most #v 6%#!, food insecurity at most #v 8%#!, living standards at least #v 11#! and market access at least #v 85%#!. Social Security level #v 2#! and living standards #v 12#! allow up to #v 12%#! unemployment. Non-negative bureaucracy, peace and no bankruptcy penalty are required.\n\n#bold Local disorder#!\nStates with at least #v 500,000#! inhabitants interrupt consolidation after six months above #v 20%#! unemployment, #v 25%#! food insecurity or #v 10%#! severe starvation. National and local rates use workforce; subsistence workers are employed.\n\nComplete at #v 100#! progress, #v 12#! consecutive qualifying months and disorder below #v 50#!. The rapid-reform reward requires completion within 48 months, at least 24 consecutive qualifying months and disorder below 30."
