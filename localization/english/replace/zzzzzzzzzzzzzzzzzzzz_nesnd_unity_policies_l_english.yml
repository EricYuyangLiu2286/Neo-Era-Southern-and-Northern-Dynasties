 nesnd_ottoman_recovery: "Restoring the Eastern Order"
 nesnd_ottoman_recovery_reason: "The outcome of the Tanzimat concerns both the survival of the Ottoman state and the Sultan’s ability to project power eastward. Officers seek better training and supply, while the court seeks to turn military strength into territorial demands in Asia. The order established by Qin and its neighboring states is at stake.\n\nThe strength gained through reform must be sustained by armaments and political support. Each new territorial demand draws upon the enthusiasm for expansion accumulated at home."
 nesnd_ottoman_recovery_success_status: "The Tanzimat has succeeded. The reformed army and court can pursue eastern expansion with greater strength."
 nesnd_ottoman_recovery_failed_status: "The Tanzimat has failed. The court can still pursue expansion, though military reform and mobilization yield weaker results."
 nesnd_ottoman_recovery_ongoing_status: "The Tanzimat is still underway, while competition in the east has already begun."
