 nesnd_ottoman_reform_army: "Adopt Qin Military Methods"
 nesnd_ottoman_reform_army_desc: "Draw on Qin’s experience in organizing and supplying armies, giving officers a larger role in national affairs. During the reform, the court must devote some of its expansionist energy to the army itself. The reform applies to all battalions, including marines."
