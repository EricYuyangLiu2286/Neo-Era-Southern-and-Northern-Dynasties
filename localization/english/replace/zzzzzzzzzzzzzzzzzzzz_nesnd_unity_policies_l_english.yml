 nesnd_ottoman_unity: "Peoples of the Empire"
 nesnd_ottoman_unity_reason: "Conquest places more land under the Sultan’s authority, bringing peoples of different faiths, languages and histories before the same court. Officials in Anatolia, provincial interests in the Balkans and newly incorporated communities all expect the state to protect their interests.\n\nSchools, effective administration and a secure livelihood can strengthen a sense of belonging. Prolonged war and exclusionary institutions pull provincial society apart. The empire must give its subjects reasons to remain together."
 nesnd_ottoman_unity_bar: "National Cohesion"
 nesnd_ottoman_unity_bar_desc: "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]#!/100"
 nesnd_ottoman_unity_fractured: "Confidence in the court is faltering, and provincial turmoil is placing a heavier burden on government."
 nesnd_ottoman_unity_confident: "A shared sense of belonging is strengthening, encouraging communities to participate in the empire’s social life."
 nesnd_ottoman_unity_calm: "The court and the provinces continue to cooperate, though their shared allegiance still needs strengthening."
