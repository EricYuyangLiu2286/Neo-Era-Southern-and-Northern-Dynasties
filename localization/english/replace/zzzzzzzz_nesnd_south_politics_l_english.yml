l_english:
 nesnd_board_ming_bar_name:0 "Ming Continuity"
 nesnd_board_wu_bar_name:0 "Zheng Statecraft"
 nesnd_board_ming_bar_desc:0 "Support for continuity: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_wu_bar_desc:0 "Foundations of the new order: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_compact_bar_name:0 "Support for the Settlement"
 nesnd_board_compact_bar_desc:0 "Commitments: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_south_politics_summary:0 "#bold The Ming Court and Hangzhou#!\nFinances and administration #v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!　Cooperation in government #v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!\nZhu succession #v 20#!　Wu military strength #v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!\n#bold Commitments#!　Ming #v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!　Wu #v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!\nContinuous fulfilment #v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#! months.\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_offer_accord:0 "Seek Consent for Constitutional Reform"
 nesnd_south_offer_accord_desc:0 "Appointments, taxation and military funding require a constitution that the Southern realm can uphold. Send our proposed settlement to the provinces and overseas states to seek their support."
 nesnd_south_offer_available_tt:0 "The court supports Ming or Wu, the crisis has not reached open conflict, and the country is neither at war nor in [concept_default]. Six months have passed since the last mission, and an eligible state can respond."
 nesnd_south_accord_offer_tt:0 "Send the proposed settlement to eligible provinces and states for their acceptance or refusal. Another mission may be sent after #v 6 months#!. Negotiations increase government wages by #n 3%#! and use #n 25#! [concept_authority]."
 nesnd_south_accord_accept_tt:0 "Support the proposed settlement for #v 36 months#!, with alignment fixed for #v 6 months#!. Changing alignment, fighting the Southern central government, joining another overlord or expiry ends the commitment. Wu integration terms cede our Chinese territories; Japanese terms cede our holdings in Shikoku and Kyushu while retaining other lands. Relations with the centre improve by #p 15#!."
 nesnd_south_leave_accord:0 "Withdraw Our Commitment"
 nesnd_south_leave_accord_desc:0 "Withdraw our consent to the settlement and reconsider our relationship with the Southern central government."
 nesnd_south_accord_leave_tt:0 "Withdraw the commitment and any unfulfilled consent to integration or cession. Relations with the centre fall by #n 15#!; alignment cannot change for #v 6 months#!."
 nesnd_board_stance_effect_tt:0 "Declare our alignment, fixed for #v 6 months#!. Withdrawing an existing commitment also cancels unfulfilled consent to integration or cession and reduces relations with the centre by #n 15#!."
 nesnd_south_retry_confrontation:0 "Renew Negotiations with the Provinces"
 nesnd_south_retry_confrontation_desc:0 "The previous negotiations failed, and opponents of the new dynasty still command their own territory and troops. Reopen the confrontation and demand an answer concerning the central government’s authority."
 nesnd_south_accords.1.t:0 "The Southern Constitutional Settlement"
 nesnd_south_accords.1.ming:0 "The cabinet’s envoy has arrived in [ROOT.GetCountry.GetName] to seek our support for a settlement preserving the Ming dynasty. A constitution will define the powers of the centre and provinces. The Zhu sovereign will remain at the head of government, the cabinet and Six Ministries will administer under law, and provincial delegates will participate through the Assembly of Rites.\n\nAcceptance commits our government to the Zhu succession and this settlement. We retain our government, territory and existing laws. The status and commerce of overseas states will continue to be governed by their separate treaties."
 nesnd_south_accords.1.integration:0 "The Southern Administration’s envoy offers clear terms: recognise Zheng accession and place our Chinese territories under direct central administration as provinces. Their separate military and political authority will end; appointments, taxation and military funding will fall under the new dynasty’s constitution and the cabinet and Six Ministries.\n\nThis would complete the centralising reforms long pursued by Hangzhou. Accepting means deciding who will govern and tax these lands. If our country also holds territory overseas, its government and boundaries there will be retained."
 nesnd_south_accords.1.japan:0 "The Southern Administration asks us to recognise the Zheng succession and surrender any territory we hold in Shikoku and Kyushu to direct Wu rule. Our government would retain its remaining lands.\n\nThe proposal ties a Southern dynastic succession to Japan’s borders. Acceptance would secure our place in the new order, at the cost of those territories. The court and the great houses must weigh that price before answering Hangzhou."
 nesnd_south_accords.1.overseas:0 "The Southern Administration asks [ROOT.GetCountry.GetName] to recognise the Zheng succession while retaining our government, territory and existing status. The Assembly of Rites and cabinet will settle the Southern constitution’s distribution of sovereign and provincial powers. Our commerce, ports and military obligations will remain matters for separate treaties.\n\nThe Zheng family needs recognition at home and overseas. Before answering, we must consider the place this succession would leave for our country."
 nesnd_south_accords.1.a:0 "Support the settlement and recognise the succession."
 nesnd_south_accords.1.b:0 "Accept provincial integration under the central government."
 nesnd_south_accords.1.c:0 "Recognise the succession and accept the territorial cession."
 nesnd_south_accords.1.d:0 "Withhold our consent."
 nesnd_south_accords.20.t:0 "Revising the Constitution"
 nesnd_south_accords.20.d:0 "For a year, the provinces and states supporting Ming have upheld their commitment to reform. The provisions debated by provincial delegates in the Assembly of Rites on appointments, land taxes and military funding now have a basis for enactment. The cabinet asks [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] to proclaim a constitution defining the powers of the centre and provinces.\n\nSince Chen Dongyang restored provincial administrative commissions, the Southern government has coordinated civil and military affairs, but the titles of former feudal lords still sustain local influence. Disputes set aside during resistance to the North can at last be settled in the assembly. The Zhu succession will endure, with sovereign, cabinet and provinces each exercising authority under the constitution."
 nesnd_south_accords.20.a:0 "Proclaim the constitution."
 nesnd_south_accords.21.t:0 "A Constitution for the Succession"
 nesnd_south_accords.21.d:0 "The parties supporting Zheng have sustained their commitment to reform for a year. States due for provincial integration have accepted the transfer of their Chinese territories, and the Japanese governments have accepted the terms concerning Shikoku and Kyushu. Hangzhou’s military and fiscal power now has a basis for establishing the new order.\n\nThe Assembly of Rites and cabinet will incorporate appointments, taxation, military funding and provincial government into a new constitution defining the powers of monarch and assembly. If the Zheng family accepts the throne, it must also accept these obligations. The Southern Administration, long governing in Ming’s name, will face the world under its own dynasty."
 nesnd_south_accords.21.a:0 "Accept the throne and govern under the constitution."
 nesnd_south_accords.reconsider:0 "Defer the settlement and reopen deliberations."
 nesnd_south_ming_peace_result_tt:0 "Preserve the Zhu sovereign and Ming state. Members retain their territories, governments and economic laws. The centre accepts constitutional obligations for #v 10 years#!. States honouring their commitments receive temporary prestige benefits, with an additional reward for sufficient preparations."
 nesnd_south_wu_peace_result_tt:0 "Establish Wu and integrate only eligible Chinese territories with explicit consent and local control. Overseas countries and overseas lands remain separate. Japan cedes only its own Shikoku and Kyushu territories. A player who explicitly accepted whole-country integration takes control of Wu only if no other human controls it. New provinces face #v 12 months#! of transition costs."
 nesnd_south_accords.22.t:0 "The Constitution Established"
 nesnd_south_accords.22.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has proclaimed the revised constitution. Provincial delegates participate in the Assembly of Rites; the cabinet and Six Ministries conduct central government; provincial administrative commissions administer local affairs under the settlement. The Zhu house has gained room to govern beyond Hangzhou’s domination, while accepting constitutional limits on the sovereign.\n\nThe settlement preserves Southern Ming’s Confucian form of constitutional democracy and federation. Its provinces and overseas states retain their governments and territories, and the centre assumes the expense of maintaining the new institutions. Powers once contested by the Southern and Western Administrations through military strength now have an agreed constitutional basis."
 nesnd_south_accords.23.t:0 "The Wu Dynasty Established"
 nesnd_south_accords.23.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has taken the throne and proclaimed the Wu constitution. The centre has assumed administration of the Chinese territories that accepted integration, together with the lands ceded in Shikoku and Kyushu. Overseas states retaining their territories continue to govern themselves and deal with the new dynasty under their existing treaties.\n\nThe constitution recognises both the deliberative powers of the Assembly of Rites and the sovereign authority of the Zheng monarch, with the cabinet and Six Ministries conducting government accordingly. Generations of military power, commerce and overseas expansion since Zheng Zhao have at last become an empire ruled in the Zheng family’s own name."
 nesnd_south_accords.done:0 "Govern according to the constitution."
 nesnd_south_negotiation_cost:0 "Constitutional Negotiations"
 nesnd_south_accord_respected:0 "Settlement Honoured"
 nesnd_south_prepared_member:0 "Prepared Administration"
 nesnd_south_prepared_mobilization:0 "Prepared Mobilization"
 nesnd_south_hasty_mobilization:0 "Hasty Mobilization"
 nesnd_south_peace_administration:0 "Peaceful Reorganization"
 nesnd_south_new_province:0 "Provincial Transition"
 nesnd_south_ready_unknown:0 "National preparedness has not yet been assessed."
 nesnd_south_ready_known:0 "Preparations #v [Country.MakeScope.Var('nesnd_ready_total').GetValue|1]/100#! (finances [Country.MakeScope.Var('nesnd_ready_finance').GetValue|1]/20, military [Country.MakeScope.Var('nesnd_ready_military').GetValue|1]/35, inputs [Country.MakeScope.Var('nesnd_ready_supply').GetValue|0]/25, government [Country.MakeScope.Var('nesnd_ready_domestic').GetValue|1]/20)\nCrew #v [Country.MakeScope.Var('nesnd_ready_actual_crew').GetValue|D]#!; crew-ready ships #v [Country.MakeScope.Var('nesnd_ready_ships_ready').GetValue|0]/[Country.MakeScope.Var('nesnd_ready_ships').GetValue|0]#!; naval projection #v [Country.MakeScope.Var('nesnd_ready_naval_projection').GetValue|1]#!."
 nesnd_south_compact_detail_tt:0 "#bold Support for the settlement#!\nMainland, overseas and Japanese governments account for #v 50%, 30% and 20%#! respectively. Commitments last #v 36 months#! and cease to count after a change of alignment or overlord, war against the centre, or withdrawal.\n\n#bold A peaceful constitutional settlement#!\nThe chosen side needs political support of #v 85#! and a lead of #v 20#!, sustained for #v 12 months#!. Ming needs #v 75%#! commitment support and at least two mainland core governments. Wu needs #v 80%#!, consent from every government due for integration and the Japanese territorial parties, and a sufficiently prepared fleet. A completed settlement ends the dispute."
 nesnd_board_country_metrics:0 "Regular #v [Country.GetRegularBattalions|0]#! / Conscriptable #v [Country.CalcConscriptableBattalions|0]#!　Ships #v [Country.GetNumShips|0]#!\nFixed balance @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　Army projection #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\nSupply preparations: [Country.GetCustom('nesnd_board_supply_loc')]\n[Country.GetCustom('nesnd_south_ready_loc')]"
 nesnd_south_failed_alignment:0 "A Defeated Political Cause"
