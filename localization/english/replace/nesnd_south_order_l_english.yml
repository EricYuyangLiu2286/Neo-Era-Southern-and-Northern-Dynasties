l_english:
 lawgroup_nesnd_wu_fence:0 "The Southeastern Fence"
 lawgroup_nesnd_wu_fence_desc:0 "The treatment of Wu's inhabitants according to where their people come from."
 lawgroup_nesnd_ming_gate:0 "The High Gates of Ming"
 lawgroup_nesnd_ming_gate_desc:0 "The treatment of Ming's inhabitants according to their calling."
 nesnd_wu_fence_hierarchy:0 "The Southeastern Ranks"
 nesnd_wu_fence_hierarchy_desc:0 "The people of Wu come first. The rest follow in order of where they come from."
 nesnd_ming_gate_hierarchy:0 "The Ranks of the High Gates"
 nesnd_ming_gate_hierarchy_desc:0 "Nobles, officers and scholars come first. The other callings follow in order."
 law_nesnd_wu_southeast_fence:0 "The Southeastern Fence"
 law_nesnd_wu_southeast_fence_desc:0 "The clans and villagers who do not come from the southeastern domains cannot be trusted by the people of Wu, because Wu's prosperity requires them to give up their land, their spending and their labour. Openly and in secret we plan and control the economy and politics of those regions, and keep them out of the upper reaches of the empire. Perhaps they will never become subjects of the Wu court in Nanjing."
 law_nesnd_wu_registered_peoples:0 "Registration of the Peoples"
 law_nesnd_wu_registered_peoples_desc:0 "The Jurchen and the Japanese are entered in the registers, behind the other peoples of the Central Lands and ahead of the southwestern provinces."
 law_nesnd_wu_southerners_one:0 "The Southerners as One"
 law_nesnd_wu_southerners_one_desc:0 "The people of Sichuan, Chu and the Southwest are treated as the people of Wu are."
 law_nesnd_wu_no_faction_prejudice:0 "Prohibition of Factional Prejudice"
 law_nesnd_wu_no_faction_prejudice_desc:0 "The authorities no longer treat inhabitants differently by where they come from. The Southeastern Ranks are abolished."
 law_nesnd_ming_high_gate:0 "The High Gates of Ming"
 law_nesnd_ming_high_gate_desc:0 "The court formed by the progressive officers of the western command and the noble houses of the southwestern provinces is divided in politics and in economics, but wholly united in keeping the fruits of its victory. They have had enough of dying uselessly at the order of some prince or lord, and they believe with all their hearts that serving them is the best choice the common people have, because the future they believe in is the most prosperous future for the Great Ming and for every people of the Central Continent."
 law_nesnd_ming_from_the_ranks:0 "Risen from the Ranks"
 law_nesnd_ming_from_the_ranks_desc:0 "Soldiers stand at the high gates beside their officers."
 law_nesnd_ming_enterprise_office:0 "Office through Enterprise"
 law_nesnd_ming_enterprise_office_desc:0 "Owners of enterprises are admitted to the high gates, and engineers and shopkeepers rise with them."
 law_nesnd_ming_no_faction_prejudice:0 "Prohibition of Factional Prejudice"
 law_nesnd_ming_no_faction_prejudice_desc:0 "The authorities no longer treat inhabitants differently by their calling. The Ranks of the High Gates are abolished."
