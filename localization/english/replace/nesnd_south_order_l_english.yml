 nesnd_south_defied_ultimatum:0 "Defiance of the Court"
 nesnd_c2_usm_agenda_zheng:0 "$nesnd_c2_usm_agenda$"
 nesnd_c2_usm_agenda_zheng_reason:0 "$nesnd_c2_usm_agenda_reason$"
 nesnd_c2_usm_agenda_ming:0 "$nesnd_c2_usm_agenda$"
 nesnd_c2_usm_agenda_ming_reason:0 "$nesnd_c2_usm_agenda_reason$"
 nesnd_usm_outcome_zheng:0 "#title The Zheng's Demand#!\n"
 nesnd_usm_outcome_ming:0 "#title The Ming's Demand#!\n"
 nesnd_usm_agenda_zheng_conclusion:0 "The Six Ministries have secured authority over provincial administration. The provinces that remain have been told to hand over their seals and merge."
 nesnd_usm_agenda_ming_conclusion:0 "Provincial administrations have secured the right to manage their own affairs. The provinces that remain have been told to hand over their seals and merge."
 nesnd_usm_agenda_zheng_result_tt:0 "Gain [GetStaticModifier('nesnd_south_zheng_settlement').GetName|v] for #v 20 years#!.\nAn ultimatum goes to each of Shu, Chu and Huai that is still our subject, demanding a peaceful merger. Any that refuses gains [GetStaticModifier('nesnd_south_defied_ultimatum').GetName|v] for #v 10 years#! and is at war with us at once, with no negotiated peace."
 nesnd_usm_agenda_ming_result_tt:0 "Gain [GetStaticModifier('nesnd_south_ming_settlement').GetName|v] for #v 20 years#!.\nGain claims on Henan, Shandong, Hanzhong, Anhui, Hebei, Liaodong, Jilin and Heilongjiang.\nAn ultimatum goes to each of Shu, Chu and Huai that is still our subject, demanding a peaceful merger. Any that refuses gains [GetStaticModifier('nesnd_south_defied_ultimatum').GetName|v] for #v 10 years#! and is at war with us at once, with no negotiated peace."
 nesnd_south_order.1.t:0 "Hand Over the Seals"
 nesnd_south_order.1.d:0 "A dispatch from [SCOPE.sCountry('nesnd_order_sender').GetName] has reached [ROOT.GetCountry.GetName]. The question of the southern realm has been settled without a war, and the court now demands that the provinces hand over their seals, registers and commands and merge into [SCOPE.sCountry('nesnd_order_sender').GetName]. The dispatch states that refusal is rebellion and that the court's army will accept no plea for peace.\n\nThe army of [ROOT.GetCountry.GetName] has had no pay or arms from the court for years. If it fights in haste, it has little chance."
 nesnd_south_order.1.f:0 "‘The seals are to be handed over, the registers surrendered and the troops withdrawn within one month of receipt. After that date it is rebellion.’\n— Dispatch from [SCOPE.sCountry('nesnd_order_sender').GetName] to [ROOT.GetCountry.GetName]"
 nesnd_south_order.1.a:0 "Hand over the seals and merge."
 nesnd_south_order.1.b:0 "This province does not obey."
 nesnd_south_order.1.b_tt:0 "We break with [SCOPE.sCountry('nesnd_order_sender').GetName], gain [GetStaticModifier('nesnd_south_defied_ultimatum').GetName|v] for #v 10 years#!, and are at war with [SCOPE.sCountry('nesnd_order_sender').GetName] at once. This war cannot end in a negotiated peace."
 nesnd_south_order.2.t:0 "The Answer of [SCOPE.sCountry('nesnd_order_target').GetName]"
 nesnd_south_order.2.d_accepted:0 "[SCOPE.sCountry('nesnd_order_target').GetName] has handed over its seals and registers as the ultimatum required, and its army awaits reorganisation where it stands. The province has merged into our country."
 nesnd_south_order.2.d_refused:0 "[SCOPE.sCountry('nesnd_order_target').GetName] has returned the dispatch and declared that it no longer takes orders from the court. Our army has been ordered to put it down, and this war will not end in a negotiated peace."
 nesnd_south_order.2.f:0 "‘… the seals and registers of the province were handed over in full within the time allowed.’\n— Report of the receiving commissioner, or else a dispatch returned unopened"
 nesnd_south_order.2.a:0 "Noted."
 dp_nesnd_order_unification:0 "Suppression and Merger"
 dp_nesnd_order_unification_desc:0 "The court moves against a province that refused to merge and demands its annexation. This war cannot end in a negotiated peace."
