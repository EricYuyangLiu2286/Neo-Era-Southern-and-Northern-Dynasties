 nesnd_south_order.1.d_war:0 "A dispatch from [SCOPE.sCountry('nesnd_order_sender').GetName] has reached [ROOT.GetCountry.GetName]. The civil war in the south is over, and the court now demands that the provinces hand over their seals, registers and commands and merge into [SCOPE.sCountry('nesnd_order_sender').GetName]. The dispatch states that refusal is rebellion and that the court's army will accept no plea for peace."
