l_english:
 nesnd_feedback_patron_crown_tt:0 "Weaken the provincial literati and military in favour of the Crown. Only one faction may receive patronage. It ends if the Crown falls below #v 40%#! or we withdraw it."
 nesnd_feedback_patron_literati_tt:0 "Weaken the Crown and military in favour of the provincial literati. Only one faction may receive patronage. It ends if the literati fall below #v 40%#! or we withdraw it."
 nesnd_feedback_patron_army_tt:0 "Weaken the Crown and provincial literati in favour of the military. Only one faction may receive patronage. It ends if the military falls below #v 40%#! or we withdraw it."
 nesnd_feedback_patron_cancel_tt:0 "Withdraw the current patronage and its modifiers, restoring the weight it had taken from the other two factions."
 nesnd_feedback_coup_tt:0 "End the current faction patronage. Another such change of government cannot be attempted for #v five years#!."
 nesnd_feedback_law_push_tt:0 "This proposal can be pressed again after #v six months#!."
 nesnd_feedback_economy_push_tt:0 "Move the balance of power #v 25#! points towards the Economic Faction. This proposal can be made again after #v six months#!."
 nesnd_feedback_army_petition_tt:0 "Move the balance of power #v 10#! points towards the Military Faction. Frontier victories may be presented again after #v twelve months#!."
 nesnd_feedback_economy_petition_tt:0 "Move the balance of power #v 10#! points towards the Economic Faction. Reform achievements may be presented again after #v twelve months#!."
 nesnd_feedback_military_budget_tt:0 "Move the balance of power #v 10#! points towards the Military Faction. Further funding may be provided after #v six months#!."
 nesnd_feedback_per_aid_tt:0 "Commit to seeking Qin aid. Progress towards the Near-Western Empire’s future increases by #p 2#! each month. This choice is final. Once settled, Ethnic Tension in The Persian Question changes by #r +0.04#! per month, and by a further #r +0.20#! per month while at war with an Islamic state."
 nesnd_feedback_per_covert_tt:0 "Commit to covert support for Qin’s provincial opponents. Progress increases by #p 2#! each month; while preparations continue, Western Qin loses #n 1#! Cultural Unity per month. This choice is final. Once settled, Ethnic Tension in The Persian Question changes by #g −0.04#! per month, and by a further #g −0.15#! per month while at war with Western Qin."
 nesnd_poland_ultimatum_outcome_tt:0 "No further territorial demand can be sent while awaiting a reply, for up to #v 4#! months. Refusal opens a Return State [concept_diplomatic_play], with our annexation as the other side’s war goal."
 nesnd_external_cancel_cooldown_tt:0 "Another envoy can be sent only #v 6#! months after the previous request was dispatched."
 nesnd_supply_dismiss_progress_tt:0 "Accumulated consecutive weeks of stability are lost. After reopening the mission, stability must be maintained for another #v 12#! weeks."
 nesnd_french_suppress_cost_tt:0 "Republican Cry falls by #v 20#! points."
 nesnd_great_han_name:0 "Great Han"
 nesnd_great_han_adj:0 "Han"
 nesnd_postwar_sih_title:0 "The Army of Shu Enters Nanjing"
 nesnd_postwar_sih_desc:0 "Nanjing is in our hands, and the Zheng court can no longer hold the south together. Shu rose against Wu; victory has now placed the succession before its ruler. Some urge the return of the Ming sovereign. Others would have the Prince of Shu establish a Han dynasty of his own."
 nesnd_postwar_hna_title:0 "The Debate in Nanjing"
 nesnd_postwar_hna_desc:0 "The army of Xiangyang marched south under the banner of restoring Ming. The Assembly of Rites and the provinces now await a decision on the government. Restoring the Zhu would renew the dynasty’s authority, but republicans refuse to entrust the country to another ruling house. The gentry’s distrust of a republic has survived the fall of Zheng power."
 nesnd_postwar_gng_title:0 "The Zhu Restore Ming Rule"
 nesnd_postwar_gng_desc:0 "The ruling house of Huai bears the Zhu imperial lineage. With Nanjing secured, the court petitions its prince to take the imperial title and restore Ming authority. The divisions left by war remain, and the Assembly of Rites and the provinces will judge the restored court by what follows."
 nesnd_postwar_restore_ming_option:0 "Recall the Zhu and restore the Ming court."
 nesnd_postwar_restore_ming_tt:0 "Recall the deposed Ming emperor or his lawful heir first. If no eligible living royal can be found, establish a new dynast from the documented family line and restore the Ming name. Foreign sovereigns and heirs are not seized."
 nesnd_postwar_great_han_option:0 "Enthrone the house of Liu as Great Han."
 nesnd_postwar_great_han_tt:0 "Adopt the name Great Han. Xiao Huli's party enthrones Liu Zhongming as emperor, or a kinsman of the Liu house if Liu Zhongming is no longer at court."
 nesnd_postwar_hna_republic_option:0 "The country belongs to no ruling house."
 nesnd_postwar_hna_republic_tt:0 "Establish a republic. Sections of the gentry will resist its authority, while republican influence among the intelligentsia and urban middle classes grows."
 nesnd_postwar_gng_option:0 "Raise the Prince of Huai to the Ming throne."
 nesnd_postwar_gng_tt:0 "Restore Ming under Huai’s own Zhu line. If no eligible dynast of that branch survives, establish a new member following its documented generation names."
 nesnd_postwar_wait_option:0 "The succession must be considered again."
 nesnd_postwar_wait_tt:0 "No eligible living successor is available. Leave the constitution and ruler unchanged for now."
 nesnd_hna_republic_gentry_opposition:0 "Gentry Resistance to the Republic"
