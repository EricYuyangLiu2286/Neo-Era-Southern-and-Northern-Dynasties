 nesnd_land_rapid:0 "Swift Recognition of Land Rights"
 nesnd_secession_disorder:0 "Military and Civil Reorganisation"
 nesnd_hna_academy:0 "Huguang United Academies"
 nesnd_hna_supply:0 "Arms and Grain Agreement"
 nesnd_hna_veterans:0 "Veterans’ Assemblies"
