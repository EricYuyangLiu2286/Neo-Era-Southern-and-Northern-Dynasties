 nesnd_land_disorder_bar:0 "地方失序"
 nesnd_land_disorder_bar_desc:0 "Local disorder：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_huguang_preparations_status:0 "Complete the academy, grain supply and veterans’ assembly preparations, worth #v 30#! each. Reaching #v 90#! grants local defence benefits for #v 10 years#!."
 nesnd_south_status_qin:0 "The King of Wu still restrains calls for accession among his followers, but the dispute with the Ming court grows sharper.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The court dispute#!#!"
 nesnd_south_status_succession:0 "The Southern Administration presses for a new dynasty, while the Ming court and provinces defend their positions.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The court dispute#!#!"
 nesnd_south_rules:0 "#bold 易代压力#!每月#n +1#!；邦国契约修正生效时每月#n +0.4#!。压力达到#v 100#!且郑钦已去世后进入易代事件。\n#bold 邦国契约#!每次议定增加#p 20#!点，并降低易代压力#p 8#!点，冷却#v 18个月#!。契约达到#v 100#!后保全明朝。"
