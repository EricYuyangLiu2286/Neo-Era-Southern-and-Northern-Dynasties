 nesnd_south_status_qin:0 "The Prince of Wu still restrains his advisers, but the dispute between Nanjing and Hangzhou grows sharper.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The succession dispute#!#!"
 nesnd_south_status_succession:0 "The dispute can no longer be deferred. Once Chen’s case is resolved and pressure reaches #v 100#!, the accession edict will be sent to the provinces.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The succession dispute#!#!"
 nesnd_south_rules:0 "#bold 易代压力#!每月#n +1#!；邦国契约修正生效时每月#n +0.4#!。压力达到#v 100#!且郑钦已去世后进入易代事件。\n#bold 邦国契约#!每次议定增加#p 20#!点，并降低易代压力#p 8#!点，冷却#v 18个月#!。契约达到#v 100#!后保全明朝。"
