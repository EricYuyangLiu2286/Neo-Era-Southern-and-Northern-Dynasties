l_english:
 ce_cne_land_reform:0 "Land Rights Revolution"
 ce_cne_land_reform_reason:0 "This movement began with the Western Qin Great Revolution of 1810. People of the age understood it as a modern economic transformation arising among the agrarian states of the East, where powerful lineages had long dominated rural life. Through purchase or compulsory confiscation, land accumulated beyond all measure by its old owners was redistributed among a portion of the peasantry. The aim was to break the lineages’ hold over the rural population. The ruling group of the Empire of China suspended the movement during its rise to power. Around Mu Zhongtang’s southern campaign of 1820, however, he and his confidants revived it to restore the economy, free productive activity and mobilise peasants and soldiers."
 ce_cne_land_draft_failing:0 "田籍与军籍之间"
 ce_cne_land_draft_failing_reason:0 "地方失序已并入“地权革命”日志。"
 nesnd_land_survey:0 "重勘田界"
 nesnd_land_survey_desc:0 "Provide Revenue Ministry funding for workshops and practical schools, helping people leaving the estates learn new trades and take part in industrial growth."
 nesnd_land_review:0 "复核申诉"
 nesnd_land_review_desc:0 "Have the Ministries of Justice and Revenue review land disputes and instruct provincial governors to investigate the conduct of reform officials. Farming families should be able to defend the property the new law has granted them."
 nesnd_land_military:0 "清理军籍田产"
 nesnd_land_military_desc:0 "Have the Ministry of Revenue supplement existing relief funds for farming families who have left the estates and have yet to find a livelihood."
 nesnd_land_suspend:0 "Consider Ending the Land Revolution"
 nesnd_land_suspend_desc:0 "Submit the provinces’ requests to end reform to the Senate and seek a decree closing the campaign."
 nesnd_crisis.30.a:0 "Review the deeds and suspend the disputed cases."
 nesnd_crisis.30.b:0 "Have the governor reach a settlement on local terms."
 nesnd_crisis.30.c:0 "Order the garrisons to surrender their records and punish those who defy the law."
 nesnd_crisis.30.t:0 "The Survey Dispute"
 nesnd_crisis.30.d:0 "A provincial land dispute has reached the court. Land commissioners have surveyed the countryside under the new law, yet several local military estates still collect rent under the old rules. Farmers who have paid the redemption price are told by their old masters that their fields remain military property and that the dues must be paid. Teachers who helped draft their petitions have been arrested for concealing property.\n\nThe deeds submitted by the affected counties contradict the garrison registers. The provincial governor seeks authority to review the cases, while the commissioners ask the court to send troops to recover the withheld records. As the dispute drags on, farmers gather in the county towns, awaiting an answer from the government that promised to free them."
 nesnd_crisis.33.a:0 "Dismiss the officials, provide compensation and reopen the case."
 nesnd_crisis.33.b:0 "Punish these unlawful assemblies!"
 nesnd_crisis.33.t:0 "Old Banners in the Hills"
 nesnd_crisis.33.d:0 "Veterans, local scholars and dispossessed farmers in Shanxi have gathered over the hardship and arrests that followed the land surveys. Republican organisers use village schools and old military connections to circulate petitions, calling on each county to choose delegates and hold officers accountable for the seizure of farmland.\n\nSeveral garrisons refuse to surrender the accused officers and have turned away the governor's investigators. The county delegates demand the removal of the chief commissioner, a fresh review of titles and compensation for the injured farmers. Republican organisers are seeking allies among the troops and preparing to rise if their petitions fail. The Ministry of Justice has referred the case to the court: dismiss the officials and reopen the inquiry, or prosecute the assemblies for defying the law."
 nesnd_crisis.31.a:0 "Settle provincial powers and preserve their allegiance."
 nesnd_crisis.31.b:0 "The armies now answer to their own masters."
 nesnd_crisis.31.t:0 "Military Power Slips Away"
 nesnd_crisis.31.d:0 "Field commands across the Empire are withholding taxes owed to the Ministry of Revenue. Officers seize customs posts, granaries and provincial offices in the name of paying their troops. Governors either yield to the garrisons or use their own loyal units to contest the revenue. Land commissioners can work only where the troops permit them, while unpaid soldiers demand estates from their commanders. The military blocs have acquired powers far beyond their former holdings.\n\nRedeployment orders issued by the Ministry of War in the name of [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] are repeatedly returned. Senior members of the Senate demand recognition of the military and fiscal powers already seized by governors and commands in exchange for their continued allegiance. The court can no longer hear the provincial petitions forwarded by the Consultative Council. Without a settlement, commands beyond its control may establish governments of their own."
 nesnd_crisis.32.a:0 "Issue the decree and bring the land revolution to a close."
 nesnd_crisis.32.b:0 "The reform must continue."
 nesnd_crisis.32.t:0 "The Old Disaster of Anshi"
 nesnd_crisis.32.d:0 "Memorials requesting an end to land reform have reached the court. The senior commanders and ministers of the Senate propose a compromise and ask [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] to close the campaign by decree. Under their draft, land recognised by the new deeds would remain with military households, who must promise lower rents and allow tenants to leave for work. Unsettled estates, military land and lineage property would pass under the governors' supervision as state lands let to tenants.\n\nThe proposal humiliates the ministers who championed reform. It would also restore a place in taxation and village government to the local powers sustained by the old land system. The Ministries of Revenue and War hope to settle the provincial disputes and return scarce funds and officials to ordinary administration. Approval would bring the land revolution to an end on these terms, leaving its remaining ambitions to another generation."
