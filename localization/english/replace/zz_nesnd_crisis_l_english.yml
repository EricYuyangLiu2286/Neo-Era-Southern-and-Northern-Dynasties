l_english:
 ce_cne_land_reform:0 "地权革命"
 ce_cne_land_reform_reason:0 "这一运动发源自1810年的西秦大革命。被本时代人视为农业发达而宗族根深蒂固的东方诸国内萌发的一种近代经济上的变革运动。其特点大致可以是用赎买或强制剥夺的手段，将超额聚敛的土地从其旧时代的所有者手中剥夺，平均到部分农民手中。以此打破古代宗族对农村人口的束缚和垄断。中华帝国统治集团在掌权过程中一度中止这一变革。但在1820年的牧仲棠南征前后，为了经济振兴、解放生产和发动底层农民、士兵，牧仲棠及其亲信重新开启了这一运动。"
 ce_cne_land_draft_failing:0 "田籍与军籍之间"
 ce_cne_land_draft_failing_reason:0 "地方失序已并入“地权革命”日志。"
 nesnd_land_survey:0 "重勘田界"
 nesnd_land_survey_desc:0 "地权革命必须越过宗祠与军营的围墙。各省另派清丈官，将庄田的四至、佃户的契约与历年的赋额一并查明，使隐匿的产业重新进入国家的簿籍。"
 nesnd_land_review:0 "复核申诉"
 nesnd_land_review_desc:0 "改革所要解放的农民，应当能够向新政府申明自己的权利。受理地方申诉，复核争议田契，并追究借清丈夺产的官吏。"
 nesnd_land_military:0 "清理军籍田产"
 nesnd_land_military_desc:0 "开国将士曾随牧仲棠打破旧日的宗族与藩镇，如今他们的军籍又庇护着新的庄园。朝廷须将军功、俸饷与土地所有权分别核定。"
 nesnd_land_suspend:0 "暂停清丈"
 nesnd_land_suspend_desc:0 "命各省停办未结案件，承认已经完成的登记，将余下争议留待中央与地方重新议处。"
 nesnd_crisis.30.a:0 "复核田契，先停争议之案。"
 nesnd_crisis.30.b:0 "责成地方议局办理。"
 nesnd_crisis.30.c:0 "令各营交册，依新法处置。"
 nesnd_crisis.30.t:0 "清丈风潮"
 nesnd_crisis.30.d:0 "[ROOT.GetCountry.GetName]的清丈官带着新法进入乡间时，军功庄园仍在按旧例征租。已经缴清赎价的农户，被告知所耕之田属于军籍；一些替农民代写申诉的塾师，也因包庇隐产而遭拘押。\n\n各县呈来的契约与军营的册籍彼此抵牾。地方议局要求接手复核，清丈官则请朝廷派兵收缴隐匿的文书。原本期待分田的农民聚集到县城，等待这个许诺解放他们的新政府作出答复。"
 nesnd_crisis.33.a:0 "撤官赔补，重审此案。"
 nesnd_crisis.33.b:0 "抗命聚众，当依国法惩办！"
 nesnd_crisis.33.t:0 "旧旗出山"
 nesnd_crisis.33.d:0 "清丈引起的搜捕，将山西的退伍军人、地方士人与失地农户聚到了一处。共和派借乡校与旧日军中关系传递文书，要求各县推举代表，审问侵夺田产的官员。\n\n几处驻军已经拒绝交出被捕者。朝廷授予的官印仍盖在营中公文上，公文所奉行的却是地方代表议定的章程。如今，他们要求撤换清丈主官，重新审查田产，并赔补遭到侵夺的农户。"
 nesnd_crisis.31.a:0 "议定地方章程，暂保各省归顺。"
 nesnd_crisis.31.b:0 "诸军已各奉其主。"
 nesnd_crisis.31.t:0 "兵权下移"
 nesnd_crisis.31.d:0 "各地行营开始截留本应解往中央的税款。军官以供饷为名接管关卡、仓廪与地方官署，清丈官只能在驻军准许的地方办案。欠饷的营伍纷纷向主将索要田产，原有的军功集团由此取得了更广的地方权力。\n\n[ROOT.GetCountry.GetName]发出的调防命令接连退回。朝廷须重新承认各营与地方议局的既得权力，才能维持各省对中央的归顺；继续失去军饷与官员的控制，各地便将自行建立政府。"
 nesnd_crisis.32.a:0 "依此颁诏，暂缓余案。"
 nesnd_crisis.32.b:0 "改革仍须继续。"
 nesnd_crisis.32.t:0 "暂缓之诏"
 nesnd_crisis.32.d:0 "各省请求暂缓地权改革的文书，已经汇集到朝廷。新契所确认的土地将照旧归属农户，尚未处置的庄田、军田与宗族产业，则交由地方官署继续保管。\n\n这样一份诏书，可以使各省从清丈与申诉中暂时脱身。依靠旧有地权组织起来的地方势力，也将重新参与税赋的征解和乡里的治理。"
 NSX:0 "汾晋共和邦"
 NSX_ADJ:0 "汾晋"
 NHB:0 "河北靖安军"
 NHB_ADJ:0 "河北"
 NSD:0 "山东行营"
 NSD_ADJ:0 "山东"
 nesnd_land_survey_cost:0 "独立清丈经费"
 nesnd_land_appeals:0 "田籍复核局"
 nesnd_army_audit:0 "军籍田产审查"
 nesnd_land_compromise:0 "暂缓田籍清理"
 nesnd_land_rapid:0 "及时确权"
 nesnd_secession_disorder:0 "军政重组"
 nesnd_hna_academy:0 "湖广联合书院"
 nesnd_hna_supply:0 "军工粮运协定"
 nesnd_hna_veterans:0 "退伍安置章程"
 nesnd_hna_prepared:0 "地方防卫准备"
 nesnd_federal_compact:0 "重订联邦契约"
 nesnd_court_protection:0 "首辅护卫与公开审议"
 nesnd_wu_administration:0 "新朝财赋整理"
 nesnd_wu_clemency:0 "分案审理与招抚"
 nesnd_wu_repression:0 "军政清洗"
 nesnd_foreign_commitment:0 "南方事务支出"
 nesnd_foreign_supplies:0 "境外物资援助"
 nesnd_refugee_reception:0 "安置南来流亡者"
 nesnd_maritime_security:0 "护航与通商交涉"
 nesnd_japan_reorganization:0 "日本军政整顿"
 nesnd_huguang_preparations:0 "襄阳之后"
 nesnd_huguang_preparations_reason:0 "朱班博整顿湖广时，曾修复襄阳工事，召集青年军官任教，又用军工铁件向川蜀换取粮食。伤兵与退伍军人分入后勤、屯垦卫所，留在襄阳的共和派协助总督府重建书院。\n\n二十年间，总督府的军队、田赋与学籍渐成一体。如今杭州催交兵饷，各府的调令也愈加频繁。湖广须重新核定屯田与兵员，充实书院，接续上游的粮运，以备南朝再起战事。"
 nesnd_hna_academy_button:0 "整顿联合书院"
 nesnd_hna_academy_button_desc:0 "襄阳书院曾为湖广造就军官、教员与办事之吏。恢复各县选送生员的办法，使总督府的政令有人施行，地方的粮饷有人核算。"
 nesnd_hna_supply_button:0 "订立军工粮运协定"
 nesnd_hna_supply_button_desc:0 "湖广的工坊与川蜀的粮船，曾共同供养襄阳军民。重新组织军工与粮运，接济沿江驻军，储备战时所需。"
 nesnd_hna_veterans_button:0 "安置退伍军人"
 nesnd_hna_veterans_button_desc:0 "退伍之兵熟悉营伍，也熟悉乡里。将他们编入屯垦与地方后勤，使伤病者有所养，使壮健者仍可守卫故土。"
 nesnd_federal_compact_button:0 "重订邦国契约"
 nesnd_federal_compact_button_desc:0 "南京的帝统、杭州的兵财与各府的地方权力，须有共同遵守的章程。重新议定任官、赋额与军费，使朱姓天子仍能主持南朝的国政。"
 nesnd_protect_chen_button:0 "保护首辅与审议程序"
 nesnd_protect_chen_button_desc:0 "陈东阳主持的改制已触及各府的官位和田产。加强首辅护卫，核验随行人员与往来命令，保障内阁继续审议新章。"
 nesnd_crisis.10.a:0 "将此约颁行海内外。"
 nesnd_crisis.10.t:0 "共守此约"
 nesnd_crisis.10.d:0 "南京终于收到各府签押的新约。任官、田赋与军费的争议，被列入朝廷与各府共同遵守的章程。朱姓王室保有帝统，吴府仍经营其广阔的海陆产业，地方总督也得以凭明文约定参与国政。\n\n这些约定经历了反复交涉。每一笔赋额、每一个官缺，都牵动着一支军队或一群士人的生计。如今，[ROOT.GetCountry.GetName]得以沿用旧有的名号，开始组织一套新的政治生活。"
 nesnd_crisis.11.a:0 "公布案情，继续查办。"
 nesnd_crisis.11.b:0 "密审此案，严护首辅。"
 nesnd_crisis.11.t:0 "首辅门外"
 nesnd_crisis.11.d:0 "首辅护卫在核验随行人员时，查获了一封私换护卫的密信。接应地点随即被封锁，涉案者分别收押，陈东阳得以返回住处。\n\n清查很快触及承办军需与海运的人家。他们同吴府和各地营伍往来密切，掌握着朝廷正在查核的旧账。公开案情，可以使内阁继续追究这些关系；秘密审办，则须依靠护卫与亲信维持首辅的安全。"
 nesnd_crisis.20.a:0 "先整顿国内。"
 nesnd_crisis.20.b:0 "接济湖广军需。"
 nesnd_crisis.20.c:0 "联络诸府，准备南下。"
 nesnd_crisis.20.t:0 "隔江之事"
 nesnd_crisis.20.d:0 "南朝易代的消息传来，北方军中又有人提起牧仲棠当年的南征。如今郑氏与各府决裂，长江以南的驻军和粮运都将卷入争夺，统一的主张重新进入朝廷的议论。\n\n边将请拨军饷，派员联络湖广。国内正在推进的地权改革同样需要官员、经费与可靠的驻军。[ROOT.GetCountry.GetName]必须决定，将这些力量用于国内的治理，还是重新投入南方战争。"
 nesnd_crisis.21.a:0 "保障通商，维持往来。"
 nesnd_crisis.21.b:0 "接纳南来之人。"
 nesnd_crisis.21.c:0 "向反吴诸府提供军需。"
 nesnd_crisis.21.t:0 "南方的来客"
 nesnd_crisis.21.d:0 "郑氏的舰队、商馆与属地，将南朝战争的消息带到了远方。各港商人担心货物遭到扣押，交战各方的使者则要求承认自己的政府，并为军需和借款寻求援助。\n\n[ROOT.GetCountry.GetName]在这些往来中有自己的利益。维持通商，需要与实际控制港口和航线的势力交涉；收容流亡者、接济反吴军队，也将使南朝的新旧政治力量同我国发生更深的联系。"
 nesnd_crisis.40.a:0 "分案审理，留用地方人才。"
 nesnd_crisis.40.b:0 "清查旧党，重定军政。"
 nesnd_crisis.40.t:0 "经始新朝"
 nesnd_crisis.40.d:0 "战事平定以后，地方的田赋、官缺与营伍陆续归入[ROOT.GetCountry.GetName]的统辖。吴府经营已久的中央机关开始接收各省文书，商人催问战时借款，各营则呈报军功与封赏。\n\n新朝拥有熟悉财赋和海贸的官员，也拥有足以执行命令的军队。如何任用旧官、处置抵抗者，并使地方重新生产和纳税，将决定这些力量能够建立怎样的统治。"
 nesnd_crisis.41.a:0 "整顿军政，颁行新章。"
 nesnd_crisis.41.b:0 "依旧例酬赏诸军。"
 nesnd_crisis.41.t:0 "回到海峡这一边"
 nesnd_crisis.41.d:0 "参战军队陆续归国，军饷、伤亡与功次的册籍随船送回。地方领主要求兑现出兵时的许诺，港口商人催促恢复航运，中央则准备重新安排驻军和征收。\n\n大陆战争使[ROOT.GetCountry.GetName]有了整理军政的机会。统一地方征收与官员训练，可以扩大中央的办事能力；先行酬赏军功，则能稳住此次出征所倚重的将领与领主。"
 flavorCNE.6.d:0 "清丈局拘押了代写申诉的塾师与数户农民。送交省府的案卷只有姓名，缺少田亩、税额及拘捕依据。"
 flavorCNE.7.d:0 "地方商人提出承办丈量、运粮和工厂招工，并请求取得部分新清土地的优先购买权。合同已送交省府核定。"
 flavorCNE.8.d:0 "土地清理后，进城谋生的农户增加。当地工坊正在招工，官署须安排户籍、居所与沿途救济。"
 flavorCNE.3.d:0 "我们完善的土地法案、雇工法案、民法家庭相关条文已被推行至帝国的每一个角落，建起来一个崭新的经济秩序。在这一秩序中，我们解放了被血亲家族束缚了数千年的人们。高高的田垄回归了它自然资源的本来面目。\n\n随着旧宗族和土地不再能锁住农民，无数稚嫩、满是灰土却充满朝气的脸孔源源不断地从郊野涌入城市。他们憧憬新的生活。一种用人类的智慧和科学力量构建的生活。许多血缘的余孽用各种各样的地方团体伪装自己，试图重新夺回对这些人的控制。但巡捕的警棍和判官的惊堂木终会粉碎他们的野心。\n\n我们又一次将开国帝牧仲棠的理想照进现实。我们证明了这个帝国是为了华夏民族之利益而构建。为此，它将保护哪怕最细小无助者自由选择自己命运的权力——他们如今在城市中追求幸福，给帝国带来新的繁荣。"
 nesnd_early_accession:0 "提前推动易代"
 nesnd_early_accession_desc:0 "吴府已经总揽南朝兵财。召集拥戴郑氏的臣僚，向南京提出禅位之请，将海内外的属邦一并列入新朝的版籍。"
 ce_usm_conflicts_within_reason:0 "明朝朱姓，还是吴国郑氏？这对于中国南朝有能力参预政治的国人来说，是一个每分每秒都要自问的难题。从川边乡校的讲习台到南京礼部的议会殿。争论、札子、散文、报道，各式各样体裁的文字都在对人们呼喊。却是问多于答，争大于论。"
 flavorUSM.4.1:0 "尧舜禅让，汤武革命。中国天命所衷不在一家一姓，上下分隔，而在于民有德，于人有功。"
 flavorUSM.4.t:0 "吴明易代，郑昭宋聋"
 flavorUSM.4.d:0 "西元1678年春，时为北明吴国公的大明南京留守使、南京礼部尚书的（吴武宗）郑昭在他在海内外的一系列军事胜利后，单方面向朝廷上书，准备进京觐见大明天子。当是时，在三十年前的大宪战争中大获全胜的天津燕主及其国势还如烈火烹油。堪称北明战国末期的天下之雄。但郑氏的执拗战胜了朝臣的规劝和敌人的威胁。终于在同年六月成行。\n\n这次觐见是一场北明从藩镇时期到诸侯时期近三百年来都未有人见过的盛大巡游。虽然吴国主在燕、秦、齐等势力的胁迫下，最终只带了5000卫士和一些官员随行。但在这队伍中包罗了吴国海陆军事力量在那个时代的全部精锐，南洋的海兵、倭国的刀牌手、女真掷弹兵的早期营队，甚至还包括一个由“极东殷人”流亡贵族组成的，向中国皇帝伸冤借兵的队伍。并携带着吴人在这个地球上纵横百年来所获得无数珍宝，以及又用了近万名民夫运送的安南、高棉贡米。与之相对的，则是在藩镇节度使制度下被小规模械斗和转运使卡要下，四时常乱，在饥荒边缘长久徘徊的中原。\n\n在郑昭的觐见使团归来后。他当即改其称号为”至尊“，吴国随即见证了一个南北流民向自己及殖民地不断涌入的快速发展时期。而在那之后，郑昭及其继承者也开始以更加严苛的力度推进集权主义的“专权变法”及土地商品化改革。并最终稳固了我们作为南朝尊主，总领万国的基业。吴人前进的脚步从未停下，直至今天......"
 flavorUSM.6.t:0 "首辅去位之后"
 flavorUSM.6.d:0 "陈东阳离开了首辅之位。吴府接管了尚未议定的任官与军费案，各省派驻南京的官员正在等候新的召见。"
 usm_civilwar.1.d:0 "南京颁下禅位诏书，命各府奉郑氏正朔。吴府所辖的中央军、财赋机关与海外商馆已开始改用新朝名号，地方总督也须上表，承认郑氏统辖海内外的权力。\n\n[ROOT.GetCountry.GetName]的军队、官员与地方议局，长期依照同明朝订立的旧约行事。承认易代，便须同吴朝重新确定这些权利；举兵奉明，则须联络各府，准备迎击南府的中央军。亦有人主张退出旧有的隶属，自行主持地方国政。"
 usm_civilwar.1.1:0 "奉明正朔，联络诸府！"
 usm_civilwar.1.2:0 "本府自理国政。"
 usm_civilwar.1.3:0 "上表劝进，奉吴正朔。"
 usm_civilwar.2.1:0 "筹饷、调兵，以实力兑现新朝的命令。"
 usm_civilwar.2.2:0 "奉明正朔，联合反吴。"
 usm_civilwar.2.3:0 "联合反吴，但胜利之后要由国人议政。"
 usm_civilwar.2.4:0 "依此前承诺，处理大陆战局。"
 usm_civilwar.2.5:0 "观察战局，履行已经作出的承诺。"
 usm_civilwar.2.t:0 "第二次靖难战争"
 usm_civilwar.2.d:0 "各府举兵的檄文已经传开。吴朝调集中央军，要求各省恢复解饷、撤回抗命的文书；奉明诸府则联络营伍，筹措共同作战的粮饷。\n\n南朝经营百余年的江海交通，如今成为运兵与争夺的通道。殖民地、邻国和远方商人，都将在这场战争中重新判断自己的利益。胜利者将接手一个幅员广阔的帝国，以及参与战争者提出的种种要求。"
 usm_civilwar.3.1:0 "开始治理这个新朝。"
 usm_civilwar.3.t:0 "诸府的表章"
 usm_civilwar.3.d:0 "各府的表章陆续抵达杭州，承认郑氏的新朝。退出旧有隶属的地方也未能组成共同举兵的联盟，中央军与海陆财赋机关因此得以继续运转。\n\n吴府经营多年的权力已有了帝国的名分。接下来，各省官员将按新朝的章程任用，军饷和税赋亦须重新核定。海内外的臣民将从这些政令中认识[ROOT.GetCountry.GetName]。"
 usm_civilwar.10.1:0 "奉还政权，恢复朱姓王室。"
 usm_civilwar.10.2:0 "保留明号，由我们的政府主持国政。"
 usm_civilwar.10.3:0 "由国人议政，不再另立天子。"
 usm_civilwar.10.t:0 "胜利之后的名分"
 usm_civilwar.10.d:0 "联军已击败吴朝的中央军。奉明的旗号曾将各府聚到一处，如今南京的帝位、中央的官缺与各省的兵权，都等待胜利者处置。\n\n朱姓王室可以重掌朝政，也可以由获胜的地方政府主持其国政。军中与地方议局的共和派则要求召集国人代表，把战争中形成的联合带入新的政府。此次决定，将为南朝的战后秩序定下名分。"
 usm_civilwar.12.t:0 "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting]坚持独立"
 usm_civilwar.12.d:0 "[SCOPE.sCountry('usm_mister_rebel').GetName]的代表递交了独立声明，要求以本国政府的名义处理战后的军队、财政与外交。他们曾同联军一道作战，如今准备保有自己的国政。"
 usm_civilwar.13.t:0 "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting]宣誓效忠"
 usm_civilwar.13.d:0 "[SCOPE.sCountry('usm_mister_rebel').GetName]已遣使宣誓效忠，承认新中央的统辖。使者同时递交了本地官员、驻军与赋额的册籍，等待朝廷确定战后的安排。"
 usm_civilwar.23.1:0 "支持吴朝，要求战后归还其所持九州。"
 usm_civilwar.23.2:0 "联合反吴各府，以战果争取九州。"
 usm_civilwar.23.3:0 "维持中立，不作军事承诺。"
 usm_civilwar.23.t:0 "海峡两岸的盟约"
 usm_civilwar.23.d:0 "南朝内战使九州重新成为日本朝野关注的焦点。郑氏在当地经营的港口、商路与驻军，关系着吴朝的海上力量，也牵动着日本领主和商人的利益。\n\n吴朝与反吴诸府都在争取日本出兵，并以战后交还郑氏所持九州为条件。支援哪一方，将决定日本军队渡海后的敌友，以及战后向谁索取出兵的报偿。"
 ce_usm_cw_japanese_interest_reason:0 "郑氏在九州的据点，是吴国海上事业的一部分，也长期牵动日本诸家的利害。如今南朝内战，各方使者相继渡海，请日本提供兵船与军需。朝廷有机会借此次战争收回九州的吴国领地，并重新安排海峡两岸的关系。"
 nesnd_land_status_admin:0 "#n 行政不足#!：[concept_bureaucracy]为负，清丈基础进度停止，每月额外增加失序。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 清丈规则与结算#!#!"
