 nesnd_land_status_petition:0 "#bold 地方请愿已出现#!：继续清丈，或通过复核申诉降低失序。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 清丈规则与结算#!#!"
 nesnd_land_status_normal:0 "#bold 各省清丈进行中#!：本轮改革已持续#v [ROOT.GetCountry.MakeScope.Var('nesnd_land_months').GetValue|0]#!个月。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 清丈规则与结算#!#!"
