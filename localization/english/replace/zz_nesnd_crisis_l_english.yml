 nesnd_japan_reorganization:0 "Japanese Administrative Reorganisation"
 nesnd_huguang_preparations:0 "After Xiangyang"
 nesnd_huguang_preparations_reason:0 "When Zhu Banbo reorganised Huguang, he repaired the fortifications of Xiangyang, brought young officers into teaching, and exchanged military ironware for grain from Sichuan. Wounded and retired soldiers entered supply services and farming garrisons. Republicans who remained in Xiangyang helped the governor-general reform Yuelu Academy. Over twenty years, the army, land revenues and academies became closely bound to his government, with Chen Dongyang supporting it at court. Xiangyang’s troops came to be regarded as the leaders of the New Western Administration, an indispensable pillar of the Southern Ming federation.\n\nThe Zheng family once supported Zhu Banbo vigorously. Now it repeatedly accuses Xiangyang of withholding taxes and concealing households. Southern officers friendly to Huguang, including Shi Yuanfu and Lin Hanhan, have been posted away, while our republican allies at court face exclusion. We must prepare for the worst: reassess the soldiers and farming households of the garrisons, restore grain shipments from upriver, and win over the academy students who will soon enter political life."
 nesnd_hna_academy_button:0 "Reorganise the United Academies"
 nesnd_hna_academy_button_desc:0 "Yuelu Academy in Xiangyang is the intellectual centre of Huguang’s officials and aspiring politicians. Its students study and debate public affairs before taking the examinations of the Assembly of Rites to enter Southern political life. Loyalty to the Southern realm has guided their education since the academy’s foundation. With the Southern Administration pressing us at every turn, its teachers must distinguish the Zheng rulers who dominate the government from the Zhu imperial house. Students won over in the lecture hall today may stand with us as provincial delegates tomorrow."
 nesnd_hna_supply_button:0 "The Secret Jing–Shu Agreement"
 nesnd_hna_supply_button_desc:0 "Huguang’s workshops and Sichuan’s grain boats sustained Xiangyang when we fought the Mu forces. As the divide between the Southern and Western Administrations deepens, we should renew our contacts in Sichuan, coordinate arms and grain supplies between the two provinces, and reopen the wartime depots along the river. If the ministers who threaten us make their move, Xiangyang must have food and weapons."
 nesnd_hna_veterans_button:0 "Call the Veterans’ Assemblies to Readiness"
 nesnd_hna_veterans_button_desc:0 "Under Zhu Banbo, Chu soldiers enjoyed better conditions than their Southern allies. He also borrowed northern practices of fixed service terms and veterans’ assemblies, sending trained former soldiers to lead farming settlers and rebuild communities exhausted by war. These assemblies are now well established. Their veterans know both the army and the countryside; calling them together to organise food, relief and supplies will give wartime mobilisation a firm local foundation."
 nesnd_federal_compact_button:0 "Revise the Constitution"
 nesnd_federal_compact_button_desc:0 "Reform has carried the Southern realm beyond the old order of military fiefs. Hangzhou can no longer decide its government alone. Provincial delegates will debate appointments, taxation, military funding and provincial powers in the Assembly of Rites, while the cabinet and Six Ministries must govern under the revised constitution. We should first seek support from the Western provinces and overseas states, allowing the Zhu sovereign to govern constitutionally, free of the Southern Administration’s domination."
 #nesnd_federal_compact_button_alt_desc:0 "在新政完全实现已不可阻挡的今天，南明政局已在杭州南府最高掌控之下——这是好的！以我们的权势为基础，易代改姓时机已然成熟。就像过去的“大礼议”改变了北明中期的国家格局，我们应当从速召集额外的大礼议会（南明国家议会）和内阁会议。重新议定任官、赋额、军费、省制，以及朱明所谓皇室的“地位”。以法变国，为我郑吴至尊的新目标铺平道路。"
 nesnd_protect_chen_button:0 "The Chief Minister’s Protection"
 nesnd_protect_chen_button_desc:0 "Chen Dongyang’s reforms threaten the estates and titles of gentry, former feudal lords and military officers. Master Dongguan may be fearless, but the court cannot disregard their hostility. Assign dedicated guards and consider keeping him at his residence or investigating insiders, preserving the leader needed to sustain reform.\n\nProtection lasts #v six months#!. Without dedicated guards, the case has death, injury and escape chances of #v 40/25/35#!. Funding and renewal terms appear in the protection proposal."
 nesnd_crisis.10.a:0 "With law as its foundation, the state can stand!"
 nesnd_crisis.10.t:0 "The Memorial on Constitutional Administration in the Provinces and Garrisons Is Adopted"
 nesnd_crisis.10.d:0 "Provincial delegates in the Assembly of Rites have supported the new provisions on appointments, land taxation and military funding, incorporating them into Southern Ming’s constitution. The Zhu succession endures, and the powers of the centre and provinces now rest on an accepted legal foundation.\n\nChen Dongyang’s restoration of provincial administrative commissions enabled common civil and military administration without fully resolving the status of former feudal lords and their local powers. Facing the northern advance, the Southern and Western Administrations had joined their armies to suppress resistance. Disputes then postponed by war have at last received a constitutional settlement."
 nesnd_crisis.11.a:0 "Publish the findings and pursue the investigation."
 nesnd_crisis.11.b:0 "Investigate in secret, and spare no one!"
 nesnd_crisis.11.t:0 "Outside the Chief Minister’s Residence"
 nesnd_crisis.11.d:0 "The chief minister’s guards have intercepted a forged order changing the watch. The Embroidered Uniform Guard and Court of Judicial Review arrested its bearer and accomplices. Chen Dongyang was taken to safety and returned only after the suspects had been secured.\n\nThe investigation then implicated officials handling military procurement and shipping, together with their contacts among provincial gentry and former feudal lords. The Court of Judicial Review favours disclosure to expose their official connections; the Embroidered Uniform Guard insists on secrecy to avoid alerting suspects still at large. The cabinet must decide how to proceed and bear the political consequences."
 nesnd_crisis.20.a:0 "Put our own country in order first."
 nesnd_crisis.20.b:0 "Provide supplies to Huguang."
 nesnd_crisis.20.c:0 "Contact the Xiangfan garrison and prepare to march south."
 nesnd_crisis.20.t:0 "A Pretender Takes the Southern Throne"
 nesnd_crisis.20.d:0 "News that the despised Wu have cast off Ming and claimed the throne has brought celebration among ministers north of the river. Some recall the Mu sovereign’s great southern expedition. If the pretenders are consumed by fighting the Western provinces, a new campaign might reunify the realm in a single stroke.\n\nFrontier commanders have requested funds and contacted “men of understanding” in Huguang. Yet our own realm is far from settled. Domestic government still requires troops and money; unfinished land reform would make a southern expedition more burdensome still. What could the empire gain by entering this struggle now?"
 nesnd_crisis.21.a:0 "Protect commerce and maintain relations."
 nesnd_crisis.21.b:0 "Receive those fleeing the South."
 nesnd_crisis.21.c:0 "Supply the provinces opposing Wu."
 nesnd_crisis.21.t:0 "Visitors from the South"
 nesnd_crisis.21.d:0 "Zheng fleets, trading houses and dependencies have carried news of the Southern war abroad. Merchants fear the seizure of their cargoes, while envoys from the rival sides seek recognition, military supplies and loans.\n\n[ROOT.GetCountry.GetName] has interests of its own in these exchanges. Keeping trade open requires dealings with those who control the ports and sea routes. Receiving exiles or supplying the anti-Wu forces would draw us more deeply into the Southern political struggle."
 nesnd_crisis.40.a:0 "Judge cases individually and retain local talent."
 nesnd_crisis.40.b:0 "Purge the old parties and rebuild military rule."
 nesnd_crisis.40.t:0 "Foundations of the New Dynasty"
 nesnd_crisis.40.d:0 "With the fighting ended, local civil and military authority is passing under Wu rule. The new dynasty must now govern: production and trade disrupted by war must recover, people need their livelihoods, and officials and scholars who opposed Zheng will not disappear with defeat.\n\nHangzhou’s accumulated military and fiscal strength can sustain reconstruction. We may judge opponents individually and retain experienced local officials, or use victory to purge the old parties and make the army the foundation of the new order. These decisions will show the realm what government in the Zheng family’s own name means."
 nesnd_crisis.41.a:0 "Reorganise government and the armed forces."
 nesnd_crisis.41.b:0 "Reward the armies according to custom."
 nesnd_crisis.41.t:0 "Back Across the Strait"
 nesnd_crisis.41.d:0 "The troops are returning from abroad. Local lords demand the rewards promised when they joined the campaign, merchants want shipping restored, and the government must arrange its garrisons and revenues.\n\nThe mainland war has given [ROOT.GetCountry.GetName] an opportunity to reorganise. More consistent taxation and official training would strengthen central administration; honouring military claims first would secure the commanders and lords on whom the expedition relied."
 flavorCNE.6.d:0 "Land commissioners in [SCOPE.sState('cne_land_reform_mess_imprisonment_state').GetName] have arrested villagers who drafted petitions over disputed titles and placed them in military custody for concealing property. Officers widened the arrests to local gentry, teachers and clerks who kept the old deeds.\n\nThe new law empowers officials to settle land ownership, but also permits farmers to defend their property. The prisoners' families have taken their deeds to the provincial capital, and the governor has referred the case to the Ministry of Justice. The commissioners warn of collusion and unrest and ask the Ministry of War to protect the officers involved. Transferring a few officials would allow the affair to pass quietly. A prosecution would make the reform's own agents answer for crimes committed in its name."
 flavorCNE.7.d:0 "Manufacturers and merchants in [SCOPE.sState('cne_land_reform_industrialists_support_state').GetName] have jointly offered to finance land reform. Workshops are expanding and more carts travel the commercial roads. They want the new law to allow farming families to move freely and bring more workers into the towns.\n\nTheir representatives also seek to submit proposals on land, roads and employment contracts through the Consultative Council. The governor is willing to accept the funding. Officials in the Ministry of Revenue argue that these wealthy men understand industry and could take a greater part in government. The rising manufacturers hope to gain a position in imperial affairs commensurate with their wealth."
 flavorCNE.8.d:0 "The streets of [SCOPE.sState('cne_land_reform_peasants_in_city_state').GetName] are filling with newcomers from the countryside. Farming families have sold their land and come in search of wages. Employment brokers send them to factories and building sites, deducting recruitment and lodging charges from their pay.\n\nWorkers have accused the brokers of withholding contracts and enforcing old debts. Manufacturers fear that an inquiry will disrupt recruitment, while local gentry defend brokers linked to their own associations. The governor must decide whether to prosecute the organisations that bind workers to them or leave the disputes to ordinary civil proceedings. In these growing towns, the promise that peasants could leave their old estates and freely earn a living faces its first practical tests."
 flavorCNE.3.d:0 "Our revised laws on land, employment and family relations have reached every corner of the Empire and established a new economic order. We have freed people from the bonds of kinship that held them for thousands of years. The fields have returned to their proper place as a natural resource.\n\nAs the old lineages and their land can no longer bind the peasantry, young faces, dusty yet full of life, stream from the countryside into the cities. They dream of a new life built through human intelligence and science. The remnants of hereditary power disguise themselves as local associations and try to regain control over them. Police batons and the magistrate’s gavel will break their ambitions.\n\nOnce more we have brought the founding emperor Mu Zhongtang’s ideals into reality. We have shown that this Empire was built for the interests of the Huaxia nation. It will protect even the weakest person’s freedom to choose a future. Those now seeking happiness in the cities are bringing new prosperity to the Empire."
 nesnd_early_accession:0 "Press for Early Accession"
 nesnd_early_accession_desc:0 "The Southern Administration commands the realm’s troops and revenues. Rally ministers supporting Zheng, petition the Ming court for abdication, and demand a response from the provinces and overseas states."
 ce_usm_conflicts_within_reason:0 "Ming’s Zhu dynasty, or Wu’s Zheng house? For those able to take part in Southern Chinese politics, the question demands an answer at every moment. From village lecture halls on Sichuan’s frontier to the chamber of the Ministry of Rites in Nanjing, arguments, memorials, essays and reports call out to the public. There are more questions than answers, more quarrels than considered debate."
 flavorUSM.4.1:0 "Yao and Shun yielded the throne; Tang and Wu won it by revolution. Heaven’s favour rests with virtue among the people and service to humanity, not one family or an unbridgeable division between ruler and ruled."
 flavorUSM.4.t:0 "The Ming–Wu Succession: Zheng Zhao’s Audience"
 flavorUSM.4.d:0 "In the spring of 1678, Zheng Zhao—later Emperor Wuzong of Wu, then Duke of Wu, Ming’s Nanjing Protector and Minister of Rites—announced that he would visit the emperor after a succession of victories at home and overseas. The ruler of Yan at Tianjin, victorious in the Great Constitutional War thirty years earlier, still stood at the height of his power. Yet Zheng’s determination overcame his ministers’ warnings and his enemies’ threats. He set out in June.\n\nNothing comparable to this procession had been seen in the nearly three centuries of Northern Ming’s military governors and princely states. Pressure from Yan, Qin and Qi limited Zheng to five thousand guards and a handful of officials, but the entourage included the finest of Wu’s forces: marines from the Southern Seas, Japanese swordsmen, early Jurchen grenadiers, and even exiled nobles of the Far Eastern Yin seeking imperial redress and military aid. They carried treasures gathered during a century of Wu expansion across the world, while nearly ten thousand labourers hauled tribute rice from Annam and Cambodia. Beyond the procession lay a Central Plain kept close to famine by local fighting and the exactions of military governors and transport officials.\n\nAfter returning, Zheng Zhao adopted the title of Supreme Lord. Wu and its colonies entered a period of rapid growth as refugees arrived from both north and south. Zheng and his successors pressed their centralising reforms and the commercialisation of land ever harder, securing the foundations of our authority over the Southern realm and its many states. Wu’s advance has continued to this day..."
 flavorUSM.6.t:0 "After the Chief Minister’s Death"
 flavorUSM.6.d:0 "Chen Dongyang is dead. Southern republicans have lost the leader of their reforms, while the cabinet and Six Ministries must redistribute his responsibilities. Provincial delegates still debate reform’s future in the Assembly of Rites, but Hangzhou is already courting the officials left without their leader."
 usm_civilwar.1.d:0 "The Zheng family has demanded a new dynasty and recognition from the provinces and overseas states. Hangzhou’s military and fiscal power gives force to its claim, but the centuries-old Zhu succession still commands loyalty. The dispute unresolved in the Assembly of Rites and cabinet has now reached the provinces.\n\n[ROOT.GetCountry.GetName] must answer. Recognition accepts Zheng government under the new constitution; taking up arms for Ming requires allies and preparations against Hangzhou’s forces. Others would use the crisis to leave the existing hierarchy and govern independently."
 usm_civilwar.1.1:0 "Uphold Ming and rally the provinces!"
 usm_civilwar.1.2:0 "Let our government rule independently."
 usm_civilwar.1.3:0 "Petition for accession and recognise Wu."
 usm_civilwar.2.1:0 "Raise funds and troops to uphold the new dynasty."
 usm_civilwar.2.2:0 "Uphold Ming and unite against Wu."
 usm_civilwar.2.3:0 "Unite against Wu, then establish government by the people."
 usm_civilwar.2.4:0 "Honour our commitments in the mainland struggle."
 usm_civilwar.2.5:0 "Watch the fighting and honour our commitments."
 usm_civilwar.2.t:0 "The Second Jingnan War"
 usm_civilwar.2.d:0 "Proclamations against the succession have spread. Wu is assembling the central army to enforce recognition of Zheng rule; Ming loyalist provinces are gathering troops and supplies for common resistance. The Southern and Western Administrations, once united against the North, now face one another in arms.\n\nMaritime and river trade routes will carry armies and suffer the disruption of war. Overseas dependencies, neighbouring states and distant merchants must choose their course anew. Whoever wins will inherit the demands of those who shed blood for victory."
 usm_civilwar.3.1:0 "Begin governing the new dynasty."
 usm_civilwar.3.t:0 "Accession Without a General War"
 usm_civilwar.3.d:0 "Local opposition has failed to form a coalition for common war. Provinces and overseas states that remain loyal recognise Zheng rule, while others have left the previous hierarchy. Hangzhou can continue governing the centre, but cannot treat every silence as consent.\n\nThe new dynasty must appoint officials and govern under its constitution, while sustaining authority with the troops and revenues it possesses. Unresolved relations with the provinces and states will be shaped by future development, negotiation and conflict."
 usm_civilwar.10.1:0 "Restore the Zhu house to government."
 usm_civilwar.10.2:0 "Retain Ming’s name under our government."
 usm_civilwar.10.3:0 "Let the people govern without another emperor."
 usm_civilwar.10.t:0 "Authority After Victory"
 usm_civilwar.10.d:0 "The coalition has defeated Wu’s central army. The Ming cause brought the Western provinces and their allies together; victory now raises another question: who will govern from Nanjing?\n\nThe Zhu house still claims the throne, while victorious provincial leaders are reluctant to surrender their military and political authority. Republicans want the citizens who fought together to share in a new deliberative government. Whether the wartime coalition can accommodate these demands will determine the Southern realm’s future constitution."
 usm_civilwar.12.t:0 "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting] Insists on Independence"
 usm_civilwar.12.d:0 "Representatives of [SCOPE.sCountry('usm_mister_rebel').GetName] have declared their intention to conduct military, fiscal and diplomatic affairs in their own government’s name. They fought beside the coalition, but now intend to retain their own rule."
 usm_civilwar.13.t:0 "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting] Swears Allegiance"
 usm_civilwar.13.d:0 "[SCOPE.sCountry('usm_mister_rebel').GetName] has sent an envoy to swear allegiance and recognise the new centre. The wartime partnership has become a relationship of allegiance, under which local civil and military affairs will now be conducted."
 usm_civilwar.23.1:0 "Support Wu in exchange for its Kyushu holdings after the war."
 usm_civilwar.23.2:0 "Join Wu’s opponents and seek Kyushu through victory."
 usm_civilwar.23.3:0 "Remain neutral and make no military commitment."
 usm_civilwar.23.t:0 "An Agreement Across the Strait"
 usm_civilwar.23.d:0 "The Southern civil war has brought Kyushu back to the centre of Japanese politics. Zheng ports, trade routes and garrisons on the island support Wu’s maritime power and affect the interests of Japanese lords and merchants.\n\nBoth Wu and its opponents seek Japanese intervention, offering to return the Zheng-held parts of Kyushu after victory. The side we support will determine our allies across the sea and the government from which we must claim our reward."
 ce_usm_cw_japanese_interest_reason:0 "The Zheng foothold in Kyushu forms part of Wu’s maritime power and has long affected the interests of Japan’s great houses. With civil war threatening the Southern realm, rival envoys cross the sea seeking ships and supplies. The government has an opportunity to recover the Wu-held lands of Kyushu and reshape relations across the strait."
 nesnd_land_status_admin:0 "#n 行政不足#!：[concept_bureaucracy]为负，清丈基础进度停止，每月额外增加失序。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 清丈规则与结算#!#!"
