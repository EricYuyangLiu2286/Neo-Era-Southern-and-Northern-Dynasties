 flavorUSM.4.f:0 "I had heard that the Zhu Son of Heaven held Heaven’s mandate, a divine dragon descended among men. The founding emperor rose from beggary, destroyed foreign rule and restored the Chinese heartland. His achievements would outlast the inscriptions of history. Though virtue might decline, the mandate seemed unchanged. Yet today I have seen him: the Zhu boy is mortal too.\n—Zheng Zhao"
 nesnd_crisis.11.f:0 "“Hold the prisoners separately and secure all correspondence. Tomorrow, the cabinet will return to the case.”"
 nesnd_crisis.30.f:0 "“The garrison says the land belongs to the army. The county says it belongs to the state. We ask only this: what did our payment last year redeem?”"
 nesnd_crisis.33.f:0 "“When we marched, they said we were fighting for land to farm and a hearing for every grievance. Back in our own villages, we have to ask for it all again.”"
 nesnd_crisis.31.f:0 "“This province pays the troops and this province feeds them. If the ministers cannot send our wages, they must let us raise the money ourselves.”"
 nesnd_crisis.32.f:0 "“Lower the rents, let the tenants travel, and preserve the old holdings. Perhaps the garrisons will then end their resistance.”"
 nesnd_crisis.10.f:0 "“Let every province and garrison act according to the constitution.”"
 nesnd_crisis.20.f:0 "“Some men who crossed the river in the former campaign remain in service. If Your Majesty considers another march south, let us first assess the grain and pay.”"
 nesnd_crisis.21.f:0 "“The cargo is loaded. We await only your answer: will the old trading papers still be honoured?”"
 nesnd_crisis.40.f:0 "“The provinces need work and commerce restored, so that soldiers and civilians can support themselves.”"
 nesnd_crisis.41.f:0 "“Every house still holds its promises from the expedition. Now that we have returned, we must settle them together.”"
 flavorCNE.3.f:0 "From each according to ability, by free will. The state voices the people’s aspirations; together they build the Empire. \n—Cha Wanfang, Memorial on the People’s Grant of the Imperial Mandate"
