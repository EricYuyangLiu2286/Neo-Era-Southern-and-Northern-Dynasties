l_english:
  je_confederation_of_the_rhine_reason: "From 1806 to 1828, under the design of Napoleon Bonaparte, many German states were unified under a single government - #bold Confederation of the Rhine#!. Under this system, Napoleon consolidated his control over the German states through proxies, suppressing the power of #bold Prussia#! and #bold Austria#!. However, with the Confederation's own economic problems, Napoleon's deteriorating health, and the soft reign of his son to other great powers, the Confederation's unity was lost. Many German states were granted independence, leaving opportunities for Prussia's customs union plans. \n\nBut the era of the King of Rome has long past! [SCOPE.sCountry('rhine_overlord').GetName] must reorganize the affairs of the Confederation to ensure that the German people do not grow into a threat to our continental hegemony."
  
  je_confederation_of_the_rhine_confederate_button: "Restore the Confederation"
  je_confederation_of_the_rhine_confederate_button_desc: "With the collapse of the Prussian Alliance, we shall restore the united #bold Rhine Confederation#!, constraining the ambitions of German powers in the region."
  
  formation.20.d: "Opposing both Austrian and Prussian designs on their land, a confederation of German states has unified into a restored [ROOT.GetCountry.GetName]. The Confederation stands united to assert its sovereignty in the face of its enemies."
  formation.20.f: "Years after Napoleon's death, his influence might still be felt across Europe. This confederacy is but one of many projects from his plan for Europe. Perhaps it can be turned to a nobler purpose."
  formation.20.a: "To the German Rhine!"

