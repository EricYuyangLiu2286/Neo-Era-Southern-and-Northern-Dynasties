l_english:
 nesnd_tenasserim_recovery:0 "Making a Living in Tenasserim"
 nesnd_tenasserim_recovery_reason:0 "Dye shipments connect the southern plantations to the imperial market. Rent, advances and debt bind many village households to that trade. New paid work and viable smallholdings will determine whether the interior can have customers and savings of its own."
 nesnd_ten_status_sampling:0 "Local officials are reporting on employment and living conditions over the first three months. Logging commissions and legislation may proceed in the meantime.\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_war:0 "War has interrupted the recovery. Ports, shipping and access to markets must be restored.\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_bankruptcy:0 "An active [concept_bankruptcy] penalty interrupts consolidation.\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_access:0 "Local market access is below 85%.\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_working_hungry:0 "Many hungry workers already have jobs. Review household income, rent, taxation and food prices.\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_jobs:0 "Unemployed workforce exceeds 12%. Check existing vacancies, wages and qualifications.\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_income:0 "Employment has improved, but household living costs are still above the target.\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_review:0 "All four requirements are met.\n$nesnd_ten_status_details_link$"
 nesnd_ten_conditions_bar:0 "Local living conditions"
 nesnd_ten_conditions_bar_desc:0 "$nesnd_ten_conditions_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_ten_conditions_bar_detail:0 "Unemployed workforce: #v [Country.MakeScope.Var('nesnd_ten_unemployment').GetValue|%1]#! (at most #v 12%#!)\nStarving workforce: #v [Country.MakeScope.Var('nesnd_ten_starving').GetValue|%1]#! (at most #v 25%#!)\nEmployed and starving: #v [Country.MakeScope.Var('nesnd_ten_working_hungry').GetValue|%1]#!\nWorkforce household [concept_sol]: #v [Country.MakeScope.Var('nesnd_ten_sol').GetValue|1]#! (at least #v 6.5#!)\n[concept_market_access]: #v [Country.MakeScope.Var('nesnd_ten_access').GetValue|%1]#! (at least #v 85%#!)\n\nThe country must also be at peace and free of [concept_bankruptcy] penalties. All three workforce shares use the total workforce in our part of Tenasserim. Subsistence farmers count as employed. Updated monthly."
 nesnd_ten_continuity_bar:0 "Consolidation"
 nesnd_ten_continuity_bar_desc:0 "$nesnd_ten_continuity_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 6#!"
 nesnd_ten_continuity_bar_detail:0 "After three months of local reports, all four living-standard requirements must be met. At least one logging camp, fishery, iron mine, tooling workshop, textile mill or food industry must also be #v 75%#! staffed, with no input shortages.\n\nEach qualifying month adds #p 1 month#!. Keep these conditions for #v 6 consecutive months#! to complete the programme. Any unmet condition resets the count. Completion increases qualifications gain and local construction efficiency in Tenasserim by #p 10%#! each for #v 36 months#!."
 nesnd_ten_build_button:0 "Commission a logging camp"
 nesnd_ten_build_button_desc:0 "Commission a logging camp to provide paid work without taking arable land.\n\nEach commission queues #v 1 level#! of government construction, up to #v 2 commissions#! at least #v 6 months#! apart. Any existing logging camp must be #v 75%#! staffed without input shortages. Wood must sell for at least #v 50%#! of its base price, the treasury must hold #v £5,000#!, and local capacity must permit construction. Normal construction and treasury costs apply. Simple forestry can be used where tools or trained machinists are scarce."
 nesnd_ten_build_result_tt:0 "Queue one logging-camp level in Tenasserim. Normal construction costs apply. Completion and hiring occur through the economy."
 nesnd_ten_train_button:0 "Fund practical instruction"
 nesnd_ten_train_button_desc:0 "Pay 2.5% of weekly total income, minimum £1,000 (estimated £[Country.MakeScope.Var('nesnd_ten_training_quote').GetValue|0]). Local qualifications +10% for 12 months. 12-month cooldown. Requires an existing nonfarm vacancy. Laws and household conditions still govern qualification eligibility."
 nesnd_ten_tenant_button:0 "Propose tenant contracts"
 nesnd_ten_tenant_button_desc:0 "Replace serfs’ personal dependence with tenancy, leaving farmers free to run their own affairs once the rent is paid.\n\nBegin enacting Tenant Farmers. The law must be enactable and supported by an [concept_interest_group] in government or a [concept_political_movement] with at least #v 10%#! support. Enactment chance must be at least #v 15%#! and [concept_legitimacy] at least #v 25#!, with no other law being enacted, war or revolution."
 nesnd_ten_abolish_button:0 "Propose emancipation"
 nesnd_ten_abolish_button_desc:0 "Abolish slavery so that workers can no longer be held as another person’s property.\n\nOnce serfdom has ended, local unemployment must be at most #v 15%#! and three months of local reports must be available. The support, enactment-chance and [concept_legitimacy] requirements are the same as for Tenant Farmers. Emancipation takes effect when the law passes."
 nesnd_ten_compromise_button:0 "Negotiate landowner compensation"
 nesnd_ten_compromise_button_desc:0 "During tenant or abolition enactment, pay 25% of weekly income, minimum £5,000 (estimated £[Country.MakeScope.Var('nesnd_ten_compromise_quote').GetValue|0]). Requires landowner clout of 20%. Landowner approval +3 for 24 months. 24-month cooldown. No change to law stance or enactment chance."
 nesnd_ten_dismiss_button:0 "End the special programme"
 nesnd_ten_dismiss_button_desc:0 "Return the programme’s duties to the existing administration and merchants, ending its special instruction. The programme can reopen after one year."
 nesnd_ten_dismiss_tt:0 "End the programme and withdraw its practical instruction. It may reopen after one year. Queued construction, ongoing legislation and compensation already paid remain in effect. Previous commissions and rewards still count."
 nesnd_ten_continue_tt:0 "Continue the Tenasserim programme with its existing construction, legislation and funding."
 nesnd_ten_reopen:0 "Reopen the Tenasserim programme"
 nesnd_ten_reopen_desc:0 "Resume efforts to improve employment and rural living in Tenasserim. Previous commissions still count towards the limit, and the period of recovery begins again."
 nesnd_ten_training:0 "Practical Instruction"
 nesnd_ten_recovery_skills:0 "Local Craft Instruction"
 nesnd_ten_recovery_skills_desc:0 "Skilled workers in Tenasserim can train apprentices and speed up local construction."
 nesnd_ten_landowners_compromise:0 "Landowner Compensation"
 nesnd_tenasserim.1.t:0 "Rent and Interest"
 nesnd_tenasserim.1.d:0 "The Tenasserim programme has run into difficulty. Logging camps and workshops need employers able to pay wages. Villagers need tenancy and credit terms that leave them enough to live on. The practical instruction provided by the authorities also needs steady funding.\n\nThe government must decide whether to keep committing resources or return these responsibilities to the existing administration and merchants."
 nesnd_tenasserim.1.f:0 "“Big rat, big rat, do not eat our millet! Three years we have served you, and you will not care for us.”\n- Book of Songs, Airs of Wei, Big Rat"
 nesnd_tenasserim.1.a:0 "Continue the review."
 nesnd_tenasserim.1.b:0 "Return it to local management."
 nesnd_tenasserim.2.t:0 "Villages and Markets"
 nesnd_tenasserim.2.d:0 "Paid work is bringing money back to the villages of Tenasserim. Household purchases support the local market, and fewer residents are out of work. Provincial authorities will continue practical instruction for three years as these new trades take root."
 nesnd_tenasserim.2.f:0 "“Therefore an enlightened ruler orders what the people possess, so that they have enough to serve their parents above and to support their wives and children below.”\n- Mencius, King Hui of Liang I"
 nesnd_tenasserim.2.a:0 "Let this work take root."
 nesnd_ten_status_details_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_ten_conditions_bar_detail Local reports#!#! · #tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_ten_continuity_bar_detail Consolidation requirements#!#!"
