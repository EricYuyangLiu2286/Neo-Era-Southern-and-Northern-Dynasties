l_english:
 gov_ce_xuanweisi_colony_state: "Overseas Pacification Commission"
 gov_ce_xuanweisi_colony_state_desc:1 "Under this form of [concept_government], the state represents the interests of its colonial overlord, though in most cases its head is chosen from local oligarchic families."
 RULER_TITLE_CE_XUANWEISHI: "Pacification Commissioner"
 RULER_TITLE_CE_HUANGDI: "Son of Heaven"
 gov_ce_taishi_celestial_empire: "Celestial Empire"
 gov_ce_taishi_celestial_empire_desc:1 "Under this form of [concept_government], the state and its monarch regard themselves as the world's central empire and defend the interests of allied states and ruling blocs with absolute honor-bound resolve."
 gov_ce_celestial_empire: "Celestial Empire"
 gov_ce_celestial_empire_desc:1 "Under this form of [concept_government], the state and its monarch regard themselves as the world's central empire and defend the interests of allied states and ruling blocs with absolute honor-bound resolve."
 ce_gov_fanwang_guo_state: "Feudatory Kingdom"
 ce_gov_fanwang_guo_state_desc:1 "Under this form of [concept_government], the state represents the interests of its endowed monarch and noble family, but often also contains representative institutions made up of local gentry, scholars, and examination electors (commoners who gained suffrage through the examinations)."
 gov_ce_chinese_fed_republic: "Republic of the People"
 gov_ce_chinese_fed_republic_desc:1 "Under this form of [concept_government], the state is a representative republic jointly constituted by all peoples of the country, representing the shared interests of enfranchised voters and all national communities. It stands as the political voice of universalist and civic republican thought among humankind."
 RULER_TITLE_CE_ZHOUGONG: "Duke of Zhou"
 ce_gov_chinese_subject_republic: "Republican Administrative Command"
 ce_gov_chinese_subject_republic_desc:1 "Under this form of [concept_government], the state generally represents the will and interests of its suzerain and local collaborators, and is governed by a locally elected leader."
