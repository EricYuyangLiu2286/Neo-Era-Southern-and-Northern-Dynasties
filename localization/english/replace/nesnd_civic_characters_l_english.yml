 nesnd_usm_duan_first: "Jingchuan"
 nesnd_usm_duan_last: "Duan"
 nesnd_civic_characters.14.t: "Places at the Sichuan Academy"
 nesnd_civic_characters.14.d: "[SCOPE.sCharacter('c2_duan').GetFullName] has petitioned the academy in [SCOPE.sState('c2_duan_school').GetName] to admit more pupils. The academy can spare a lecture room. The fees are another matter. A family with land can easily send a son to hear the new course. A family living on wages wants to know whether it can afford to send him back the following month."
 nesnd_civic_characters.14.f: "“The master is willing to teach and my boy is willing to learn. I only came to ask when they start charging for paper and ink.”"
 nesnd_civic_characters.14.a: "Pay the fees from the treasury and reserve places for pupils of small means."
 nesnd_civic_characters.14.b: "Give the teacher the lectern and let the province hear him."
 nesnd_civic_characters.200.t: "A Seat in the Assembly of Rites"
 nesnd_civic_characters.200.d: "Under the new rules of the Assembly of Rites, [SCOPE.sCharacter('c2_duan').GetFullName], a teacher in [SCOPE.sState('c2_duan_school').GetName], may seek a seat as a provincial delegate. Give him that seat and his province will have a voice when places are apportioned. Keep him at the academy and his pupils will still have their teacher. Someone else will decide whose names go on the next roll."
 nesnd_civic_characters.200.f: "“Every year the capital asks how many pupils we have. If you go this year, sir, would you ask how many places they mean to give us?”"
 nesnd_civic_characters.200.a: "Seat him in the Assembly as a provincial delegate."
 nesnd_civic_characters.200.b: "Keep him at the academy and admit more local pupils."
 nesnd_civic_public_tuition: "Publicly Funded Places"
 nesnd_civic_local_tuition: "Local Tuition Fund"
 nesnd_civic_academy_exchange: "Exchange of Academy Teachers"
 nesnd_duan_lecturer: "Lectures at the Academy"
 nesnd_duan_delegate: "New Provincial Delegate"
