l_english:
 nesnd_ita_valdieri_first: "Giovanni"
 nesnd_ita_valdieri_last: "Valdieri"
 nesnd_civic_characters.1.t: "Terms of Credit"
 nesnd_civic_characters.1.d: "Valdieri offers to arrange workshop credit, but asks how military orders and repayments will be secured. His merchant associates expect French connections to sustain trade; local taxpayers fear becoming the final guarantors."
 nesnd_civic_characters.1.a: "Endorse his case for industrial credit."
 nesnd_civic_characters.1.b: "Leave the terms of credit to public debate."
 nesnd_civic_characters.101.t: "Guarantees and Repayment"
 nesnd_civic_characters.101.d: "Valdieri continues to press for clear repayment terms on military orders. Manufacturers’ willingness to advance money depends on the guarantees the government will bear. Opportunities opened by French relations must still satisfy the merchants’ accounts."
 nesnd_civic_characters.101.organisation: "Valdieri is no longer active in public life here. Manufacturers still seek guarantees and repayment terms, leaving merchants to judge the treasury’s credit and the government to face the cost of borrowing."
 nesnd_civic_characters.101.a: "Credit needs a basis for repayment."
 nesnd_ita_bellandi_first: "Teresa"
 nesnd_ita_bellandi_last: "Bellandi"
 nesnd_civic_characters.2.t: "A School Beside the Press"
 nesnd_civic_characters.2.d: "Bellandi moves between a newspaper office and a school for girls, connecting literacy with civic standing. Her republican convictions lead her to question restrictions on education for women and the poor."
 nesnd_civic_characters.2.a: "Endorse her case for access to learning."
 nesnd_civic_characters.2.b: "Leave access to education to public debate."
 nesnd_civic_characters.102.t: "Schools and Citizenship"
 nesnd_civic_characters.102.d: "Bellandi brings the needs of girls’ schools into the press, giving republican debate a concrete question of access to learning. She asks whether those who praise independent citizens will also make room for women and the poor to study."
 nesnd_civic_characters.102.organisation: "Bellandi is absent from the country’s press and public platforms. Access to education for women and the poor remains disputed; funding and admission to girls’ schools still need advocates."
 nesnd_civic_characters.102.a: "The schools’ needs deserve attention."
 nesnd_ita_rusciani_first: "Matteo"
 nesnd_ita_rusciani_last: "Rusciani"
 nesnd_civic_characters.3.t: "Revenue Retained in the South"
 nesnd_civic_characters.3.d: "Rusciani brings local proposals that leave room for cooperation. He asks governments to settle mining revenues, roads and school obligations before sending more taxes to a common political centre."
 nesnd_civic_characters.3.a: "Endorse the southern case for local revenue."
 nesnd_civic_characters.3.b: "Let local interests make their own case."
 nesnd_civic_characters.103.t: "The South in a Common Budget"
 nesnd_civic_characters.103.d: "Rusciani continues to connect southern roads and schools with mining revenue. Local traders seek the markets cooperation might open, but want a common budget to explain which local burdens it will help meet."
 nesnd_civic_characters.103.organisation: "Rusciani is no longer active in public life here. How much southern revenue should remain locally, and who should pay for public services, still shape traders’ judgements of cooperation."
 nesnd_civic_characters.103.a: "Make the local share of common costs clear."
 nesnd_ita_sereni_first: "Luca"
 nesnd_ita_sereni_last: "Sereni"
 nesnd_civic_characters.4.t: "Military Pay and Engineering Schools"
 nesnd_civic_characters.4.d: "Sereni connects unified military command with pay and veterans’ livelihoods. Republican convictions may rally volunteers, but cannot settle their arrears."
 nesnd_civic_characters.4.a: "Endorse his case for military pay and veterans."
 nesnd_civic_characters.4.b: "Let the military case be heard without endorsement."
 nesnd_civic_characters.104.t: "After the Volunteers Return"
 nesnd_civic_characters.104.d: "Sereni continues to raise pay and veterans’ livelihoods in discussions of the common military cause. Republican conviction may bring volunteers to the colours; sustained service also requires an answer about military finance and life after discharge."
 nesnd_civic_characters.104.organisation: "Sereni is no longer active in the country’s military politics. Questions of pay and veterans’ livelihoods remain with the forces, and military families still look for a place in public expenditure."
 nesnd_civic_characters.104.a: "Soldiers’ livelihoods belong in the accounts."
 nesnd_ita_vitali_first: "Paolo"
 nesnd_ita_vitali_last: "Vitali"
 nesnd_civic_characters.5.t: "Who Maintains the Schools?"
 nesnd_civic_characters.5.d: "Vitali accepts the need for reliable public school funding and asks local religious institutions to meet their educational responsibilities. Residents want teachers and affordable lessons, rather than another contest over who owns the school’s name."
 nesnd_civic_characters.5.a: "Endorse the Church’s responsibility for education."
 nesnd_civic_characters.5.b: "Leave responsibility for schools to local debate."
 nesnd_civic_characters.105.t: "The Church and School Fees"
 nesnd_civic_characters.105.d: "Vitali continues to argue that the Church should bear responsibility for local education. Teachers’ pay and pupils’ fees bring public funding and religious obligations into the same accounts. Families want to know whether they can afford to send a child to school."
 nesnd_civic_characters.105.organisation: "Vitali no longer participates in public life here. Local churches, teachers and pupils’ families still press their claims over fees and funding, keeping responsibility for education in dispute."
 nesnd_civic_characters.105.a: "Keep pupils’ families in view."
 nesnd_ita_martelli_first: "Rosa"
 nesnd_ita_martelli_last: "Martelli"
 nesnd_civic_characters.6.t: "The Miners’ Injuries"
 nesnd_civic_characters.6.d: "Martelli brings miners’ injuries and household incomes into public debate. Local industry draws wealth from the pits; workers’ associations demand provision for safety, education and those who can no longer work underground."
 nesnd_civic_characters.6.a: "Endorse the miners’ case for safety and education."
 nesnd_civic_characters.6.b: "Let workers make their own demands heard."
 nesnd_civic_characters.106.t: "After the Pit"
 nesnd_civic_characters.106.d: "Martelli continues to speak for injured miners. Mine revenue can become commercial profit while families of men unable to work struggle for daily subsistence. Workers’ organisations press for safety and education to receive a share of local spending."
 nesnd_civic_characters.106.organisation: "Martelli is no longer active in public life here. Injured miners’ families still depend on their own resources and mutual aid, and the demand that mining wealth help fund safety and education remains."
 nesnd_civic_characters.106.a: "Workers have lives beyond the pit."
 nesnd_hus_tong_first: "Shiheng"
 nesnd_hus_tong_last: "Tong"
 nesnd_civic_characters.7.t: "The Contractor’s Accounts"
 nesnd_civic_characters.7.d: "Tong Shiheng proposes long contracts connecting ports, timber and inland routes. Merchants offer advances in return for dependable revenue. The government must decide what safeguards prevent a concession from becoming another toll on local life."
 nesnd_civic_characters.7.a: "Endorse his case for merchant-financed works."
 nesnd_civic_characters.7.b: "Let the case for concessions face local debate."
 nesnd_civic_characters.107.t: "The Reach of a Concession"
 nesnd_civic_characters.107.d: "Tong Shiheng continues to advocate long contracts linking seaports with the interior. Reliance on private advances makes expected returns a force in the choice of routes, giving local traders reason to scrutinise the concessions."
 nesnd_civic_characters.107.organisation: "Tong Shiheng is no longer active in public life here. Transport between the ports and the interior still ties contractors, local traders and the treasury together; concession terms continue to shape who profits from the roads."
 nesnd_civic_characters.107.a: "The route must serve local livelihoods too."
 nesnd_hus_shen_first: "Jichuan"
 nesnd_hus_shen_last: "Shen"
 nesnd_civic_characters.8.t: "Debt Bonds and Learning"
 nesnd_civic_characters.8.d: "Shen Jichuan collects testimony from bonded families and seeks literacy and association for those already free. Law can end a bond’s force, while the poverty and inherited barriers it leaves behind endure."
 nesnd_civic_characters.8.a: "Endorse his case for education for bonded families."
 nesnd_civic_characters.8.b: "Let the testimony enter public debate."
 nesnd_civic_characters.108.t: "The Prospects of Bonded Families"
 nesnd_civic_characters.108.d: "Shen Jichuan continues to gather the testimony of families bound by debt. Existing law determines the force of their contracts; learning, employment and association shape their prospects. He brings these claims into our country’s dispute over standing and freedom."
 nesnd_civic_characters.108.organisation: "Shen Jichuan is no longer active in public life here. Families bound by debt still face their contracts and the obstacles to education and work; the advocate’s departure has not answered their claims."
 nesnd_civic_characters.108.a: "Hear the families’ claims."
 nesnd_hus_bayant_first: "Bayantu"
 nesnd_hus_bayant_last: ""
 nesnd_civic_characters.9.t: "Markers Across the Pasture Route"
 nesnd_civic_characters.9.d: "Bayantu brings pastoral families affected by construction into local negotiations. He seeks passage for livestock and seasonal migration, or compensation for lost pasture. The contractors’ boundaries now reach into the routes by which these families live."
 nesnd_civic_characters.9.a: "Endorse the case for pastoral passage."
 nesnd_civic_characters.9.b: "Leave pasture routes to local negotiation."
 nesnd_civic_characters.109.t: "Passage Across the Pasture"
 nesnd_civic_characters.109.d: "Bayantu continues to seek passage for seasonal migration. Land a contractor sees as replaceable may connect a pastoral community’s access to water and grazing. Local negotiations must reckon with that route."
 nesnd_civic_characters.109.organisation: "Bayantu no longer participates in public life here. Migrating herds still need passage near the works, and affected families continue to seek protected routes or compensation."
 nesnd_civic_characters.109.a: "Account for the passage of herds and people."
 nesnd_hus_lin_first: "Sulan"
 nesnd_hus_lin_last: "Lin"
 nesnd_civic_characters.10.t: "Lessons After the Shift"
 nesnd_civic_characters.10.d: "Lin Sulan organises evening lessons through immigrant workers’ mutual aid. Literacy helps people read wages, bonds and laws; some employers fear that it also teaches workers to speak for themselves."
 nesnd_civic_characters.10.a: "Endorse workers’ efforts to learn."
 nesnd_civic_characters.10.b: "Let the mutual-aid groups speak for themselves."
 nesnd_civic_characters.110.t: "Lessons and Wages"
 nesnd_civic_characters.110.d: "Lin Sulan continues to promote literacy through workers’ mutual aid. Reading a wage account or debt bond gives workers grounds to challenge an employer’s interpretation, making evening lessons a place for discussion as well as learning."
 nesnd_civic_characters.110.organisation: "Lin Sulan is no longer active in public life here. Workers still seek literacy through mutual aid: wage accounts, debt bonds and laws must be understood, and access to learning still has to be won."
 nesnd_civic_characters.110.a: "Understanding gives workers a voice."
 nesnd_hus_lu_first: "Jingduo"
 nesnd_hus_lu_last: "Lu"
 nesnd_civic_characters.11.t: "Accounts of Public Works"
 nesnd_civic_characters.11.d: "Lu Jingduo places the accounts before contractors and local representatives. As an engineer, he asks that payments follow actual work and employment, rather than treating professional standing as a claim to concessions or shares."
 nesnd_civic_characters.11.a: "Endorse public scrutiny of works accounts."
 nesnd_civic_characters.11.b: "Leave the accounts open to public debate."
 nesnd_civic_characters.111.t: "What Public Money Pays For"
 nesnd_civic_characters.111.d: "Lu Jingduo continues to connect payments with work completed and employment. Professional reputation may win a contractor trust, but local interests still want an account of what public expenditure delivers."
 nesnd_civic_characters.111.organisation: "Lu Jingduo no longer participates in public life here. Public works accounts remain before contractors and local interests, who still dispute how payments are made and what the locality receives."
 nesnd_civic_characters.111.a: "Account for the spending and its return."
 nesnd_hus_guan_first: "Tingxian"
 nesnd_hus_guan_last: "Guan"
 nesnd_civic_characters.12.t: "Where the Oil Revenue Goes"
 nesnd_civic_characters.12.d: "Guan Tingxian asks where the wells’ revenues will go. Concession holders seek expansion; local businesses and residents seek roads, schools and dependable fiscal shares."
 nesnd_civic_characters.12.a: "Endorse the local claim on oil revenue."
 nesnd_civic_characters.12.b: "Let the debate over oil revenue continue."
 nesnd_civic_characters.112.t: "Claims from the Oil Districts"
 nesnd_civic_characters.112.d: "Guan Tingxian continues to ask how much oil revenue should stay where it is produced. Expansion attracts company capital, while roads and schools require local provision. Traders want a voice in the distribution of the proceeds."
 nesnd_civic_characters.112.organisation: "Guan Tingxian is no longer active in public life here. The producing districts still press their claims on revenue and public spending, with oil companies and local traders proposing different uses for the proceeds."
 nesnd_civic_characters.112.a: "The producing districts need a share."
 nesnd_usm_ji_first: "Wenheng"
 nesnd_usm_ji_last: "Ji"
 nesnd_civic_characters.13.t: "Can Commerce Enter Public Life?"
 nesnd_civic_characters.13.d: "Ji Wenheng brings commercial experience into the constitutional debate over examinations. He asks the Assembly of Rites to recognise practical learning and property expertise, while facing the question of whether wealth will become another barrier to ordinary people."
 nesnd_civic_characters.13.a: "Endorse practical learning as a route to public office."
 nesnd_civic_characters.13.b: "Let the qualifications debate continue."
 nesnd_civic_characters.113.t: "Practical Learning and Rank"
 nesnd_civic_characters.113.d: "Ji Wenheng continues to press the Assembly of Rites to recognise commercial and industrial experience. Those versed in industry and accounts seek a route into public office; established gentry defend the standing of existing qualifications. Examinations must somehow weigh the claims of old and new learning."
 nesnd_civic_characters.113.organisation: "Ji Wenheng is no longer active in public life here. Claims for commercial qualifications still reach the Assembly of Rites, where the weight of practical learning, property and classical study continues to concern new candidates and the established gentry."
 nesnd_civic_characters.113.a: "The Constitution must answer new candidates."
 nesnd_usm_duan_first: "Jingchuan"
 nesnd_usm_duan_last: "Duan"
 nesnd_civic_characters.14.t: "Teaching and Provincial Places"
 nesnd_civic_characters.14.d: "Duan Jingchuan, a Sichuan teacher, proposes changes to academy courses and educational places. Teachers seek to impart practical learning, while students hope to proceed from study into public life. Recognition of the curriculum is therefore tied to constitutional qualifications and examinations."
 nesnd_civic_characters.14.a: "Endorse his case for teaching and educational places."
 nesnd_civic_characters.14.b: "Let teachers debate the curriculum."
 nesnd_civic_characters.114.t: "The Sichuan Teacher’s Curriculum"
 nesnd_civic_characters.114.d: "Duan Jingchuan continues to take an interest in Sichuan’s curriculum and educational places. Students’ needs give practical learning a constituency; access to national political life still rests on the relevant constitutional and examination procedures."
 nesnd_civic_characters.114.organisation: "Duan Jingchuan is no longer active in public life here. Sichuan’s teachers and students still seek courses and places, leaving the relationship between local education and political qualifications to the relevant institutions."
 nesnd_civic_characters.114.a: "Teach what the students need."
 nesnd_usm_xu_first: "Tingzhang"
 nesnd_usm_xu_last: "Xu"
 nesnd_civic_characters.15.t: "Established Qualifications and Arbitrary Levies"
 nesnd_civic_characters.15.d: "Xu Tingzhang opposes a hurried expansion of public qualifications and arbitrary post-war levies alike. Established elites wish to preserve order, yet cannot ignore how schools, military costs and taxation have changed."
 nesnd_civic_characters.15.a: "Endorse established qualifications and local property."
 nesnd_civic_characters.15.b: "Let the gentry state their own case."
 nesnd_civic_characters.115.t: "The Gentry and Local Spending"
 nesnd_civic_characters.115.d: "Xu Tingzhang still defends established qualifications and opposes arbitrary levies on local wealth. His case appeals to the gentry, but schools, forces and industry still require funds. Defending local interests brings its own obligations towards the public budget."
 nesnd_civic_characters.115.organisation: "Xu Tingzhang is no longer active in public life here. Gentry support for established qualifications and resistance to arbitrary levies remains, alongside the question of how local wealth should support schools and military expenditure."
 nesnd_civic_characters.115.a: "Local interests carry public obligations."
 nesnd_usm_luo_first: "Yingtang"
 nesnd_usm_luo_last: "Luo"
 nesnd_civic_characters.16.t: "Accounts and Women Workers’ Literacy"
 nesnd_civic_characters.16.d: "Luo Yingtang approaches literacy through workshop accounts and women workers’ mutual aid. Workers who can read an account can question wages and debts. Their demand for learning reaches from the work sheds towards the academies, bringing educational qualifications into public debate."
 nesnd_civic_characters.16.a: "Endorse women workers’ access to literacy."
 nesnd_civic_characters.16.b: "Let the case for mutual aid and education spread."
 nesnd_civic_characters.116.t: "Qualifications After Literacy"
 nesnd_civic_characters.116.d: "Luo Yingtang continues to approach education through accounts and women workers’ mutual aid. Reading wage accounts and invoices gives workers grounds to speak for themselves. Whether that learning can win public recognition becomes a question of their own."
 nesnd_civic_characters.116.organisation: "Luo Yingtang is no longer active in public life here. Women workers still seek literacy through mutual aid, bringing the prospects opened by that learning before schools and the existing system of qualifications."
 nesnd_civic_characters.116.a: "Let the learners state their needs."
 nesnd_usm_han_first: "Shiduo"
 nesnd_usm_han_last: "Han"
 nesnd_civic_characters.17.t: "The Craftsmen’s School"
 nesnd_civic_characters.17.d: "Han Shiduo calls for technical education for craftsmen, connecting schools with disputes over wages, injuries and hiring. Manufacturers need skilled hands and workers rely on their skills for a living. Who should pay for training concerns them both."
 nesnd_civic_characters.17.a: "Endorse the craftsmen’s case for skills and livelihoods."
 nesnd_civic_characters.17.b: "Let craftsmen state their own demands."
 nesnd_civic_characters.117.t: "Skill and Livelihood"
 nesnd_civic_characters.117.d: "Han Shiduo continues to connect craftsmen’s schools with wages and injuries. Workshops need skilled hands; craftsmen want to know whether training will improve their livelihoods. Technical education has entered the dispute between labour and employers."
 nesnd_civic_characters.117.organisation: "Han Shiduo no longer participates in public life here. Craftsmen’s demands for learning and livelihoods still circulate among workshops: what is taught, who pays for it and what wages trained hands can command remain local questions."
 nesnd_civic_characters.117.a: "Let training lead towards a livelihood."
 nesnd_usm_jiang_first: "Shaoheng"
 nesnd_usm_jiang_last: "Jiang"
 nesnd_civic_characters.18.t: "Accounts Across the Provinces"
 nesnd_civic_characters.18.d: "Jiang Shaoheng seeks public budget scrutiny of cross-province works and concentrated capital. Coastal profits, inland taxes and provincial educational places fall on different people; an aggregate total cannot settle their disputes."
 nesnd_civic_characters.18.a: "Endorse public scrutiny of cross-province investment."
 nesnd_civic_characters.18.b: "Let the provinces debate the distribution."
 nesnd_civic_characters.118.t: "What the Provinces Give and Receive"
 nesnd_civic_characters.118.d: "Jiang Shaoheng continues to seek scrutiny of cross-province investment in the budget. Coastal profits and inland taxes do not become ownerless when added together. Provincial delegates in the Assembly of Rites must still explain what their own provinces give and receive."
 nesnd_civic_characters.118.organisation: "Jiang Shaoheng is no longer active in public life here. Cross-province works still connect investors and taxpayers, and provincial delegates still face demands to explain the local return in the Assembly’s budget debates."
 nesnd_civic_characters.118.a: "Make each province’s burden clear."
 nesnd_c2_person_ita_valdieri_support: "Guarantees and Repayment: Endorsement"
