l_english:
 nesnd_ita_valdieri_first: "Giovanni"
 nesnd_ita_valdieri_last: "Valdieri"
 nesnd_civic_characters.1.t: "Terms of Credit"
 nesnd_civic_characters.1.d: "Army orders can sustain a workshop, or ruin it. Materials, machinery and wages must be paid for in advance, while the treasury may take longer to settle its bills than a merchant can afford. Valdieri is willing to arrange credit, provided the government explains who will guarantee each order and how it will be repaid.\n\nHis merchant friends see promising business in trade with France. Local taxpayers have another concern: if the venture fails, who will ultimately pay for the government’s guarantees?"
 nesnd_civic_characters.1.a: "Support him. Workshops need dependable credit."
 nesnd_civic_characters.1.b: "Merchants will set their own terms for lending."
 nesnd_civic_characters.101.t: "Guarantees and Repayment"
 nesnd_civic_characters.101.d: "Valdieri has found no shortage of manufacturers eager to supply the army. What they lack is the assurance that they can advance the cost of another consignment of materials. The more they rely on government credit, the more definite its repayment arrangements must be. Otherwise, prosperity amounts to little more than turning the treasury’s arrears into the workshops’ debts.\n\nHe continues to argue his case. Trade with France may be tempting, but merchants must still judge how much to lend by their own government’s promise to pay."
 nesnd_civic_characters.101.organisation: "Army contractors have come to the government again over the difficulty of advancing their costs. Workshops need to begin production, suppliers want cash, and the treasury always promises payment at a later date. The guarantees Valdieri once negotiated now concern borrowers and lenders alike. Neither wishes to bear the other’s losses first."
 nesnd_civic_characters.101.a: "Credit must ultimately rest on repayment."
 nesnd_ita_bellandi_first: "Teresa"
 nesnd_ita_bellandi_last: "Bellandi"
 nesnd_civic_characters.2.t: "The Girls’ School Beside the Press"
 nesnd_civic_characters.2.d: "At the girls’ school beside the newspaper office, Bellandi teaches her pupils to read articles on civic rights. She soon discovers that many of their arguments can be put to the very people who run the school. If someone has no opportunity to learn to read as a child, how can they judge the affairs of state decided in their name as an adult?\n\nThe republican teacher therefore demands wider access to education for women and the poor. Her readers include plenty of respectable admirers of liberty. Their enthusiasm is less certain when asked to pay for a girls’ school or recognise the qualifications of its graduates."
 nesnd_civic_characters.2.a: "Support her. Citizens should have the chance to learn."
 nesnd_civic_characters.2.b: "Publish the articles. The government will reserve its opinion."
 nesnd_civic_characters.102.t: "Girls’ Schools and Citizenship"
 nesnd_civic_characters.102.d: "Bellandi writes in the newspapers about the girls' school's finances, her pupils' families, and those whom poverty excludes from civic life. Under her questioning, the liberty and independence celebrated by republicans become matters of who pays the fees and who is allowed through the school doors.\n\nHer sympathetic readers cheer as one in print. But before women and the poor can truly walk into a classroom, someone has to pay for the school, and someone has to be willing to let them have the power that learning brings."
 nesnd_civic_characters.102.organisation: "Bellandi’s appeal still finds an audience in the girls’ schools and newspaper offices. People read the articles on civic education, and many approve. Yet teachers’ salaries and poor pupils’ fees must come from those same admirers’ pockets. Those who once praised the lady are now being asked how much they are prepared to contribute."
 nesnd_civic_characters.102.a: "A citizen’s education begins with learning to read."
 nesnd_ita_rusciani_first: "Matteo"
 nesnd_ita_rusciani_last: "Rusciani"
 nesnd_civic_characters.3.t: "Revenue Retained in the South"
 nesnd_civic_characters.3.d: "Someone must maintain the common political centre, just as someone must maintain the South’s roads and schools. Rusciani brings local demands that these two expenses be considered together. Traders hope cooperation will open new routes for commerce. They are less willing to send away local taxes and then pay for roads and schools themselves.\n\nHow much will mining rights yield, and how much of that revenue should remain locally? Rusciani wants these questions settled first. Southerners expect some of the benefits of cooperation to stay in the South."
 nesnd_civic_characters.3.a: "Support the South’s claim to its rightful revenues."
 nesnd_civic_characters.3.b: "Let the localities argue for their own share."
 nesnd_civic_characters.103.t: "The South in a Common Budget"
 nesnd_civic_characters.103.d: "Rusciani cannot discuss a common treasury for three sentences without coming back to the South's roads and schools. The political centre wants a dependable tax base; local traders want dependable trade routes. Everyone is for cooperation. The fight is over who pays first, and who carries the costs that keep piling up afterwards.\n\nMining revenue has become the fiercest point of all. Hand over your income first, then wait for others to decide whether to grant you any of it back? The South's taxpayers will not buy that."
 nesnd_civic_characters.103.organisation: "Southern traders demand a definite local share of the common budget. Taxes are easily sent away, but getting them back for roads and schools means petitioning at every turn. Rusciani’s earlier concerns consequently still find many supporters. Both the centre and the localities count on mining revenues. Each seems to believe the other’s needs can wait."
 nesnd_civic_characters.103.a: "Southern taxes should also provide for the South."
 nesnd_ita_sereni_first: "Luca"
 nesnd_ita_sereni_last: "Sereni"
 nesnd_civic_characters.4.t: "Military Pay and Engineering Schools"
 nesnd_civic_characters.4.d: "Republican convictions can rally volunteers to a banner, but they cannot feed a soldier’s family. Sereni favours a unified military command and insists that discussions of military spending include pay, engineering schools and livelihoods after discharge. A state that wants trained and obedient troops cannot remember them only when it needs soldiers.\n\nThese demands have won him a hearing among veterans. Unpaid wages and mistreatment are no easier to endure beneath a republican flag. And when they leave the barracks, how are they to live?"
 nesnd_civic_characters.4.a: "He has our support!"
 nesnd_civic_characters.4.b: "Are they threatening mutiny?"
 nesnd_civic_characters.104.t: "The Volunteers’ Future"
 nesnd_civic_characters.104.d: "Sereni remains busy campaigning for his fellow veterans’ pay, welfare after discharge and working conditions. Military budgets tend to concern themselves with keeping an army fit to fight. Veterans must also consider life when they can no longer fight. The skills an engineering school can teach matter to that future.\n\nIt is easy enough to ask volunteers to serve a common cause. Asking them to sacrifice their families’ livelihoods as well is another matter."
 nesnd_civic_characters.104.organisation: "Serving soldiers need their pay, and discharged soldiers need a living. Sereni brought these demands into discussions of military expenditure, and the veterans remember the words spoken in his support. When the army needed them, the republican cause was everyone’s cause. What answer will the treasury give when they need its help?"
 nesnd_civic_characters.104.a: "Those who serve must have a life after service."
 nesnd_ita_vitali_first: "Paolo"
 nesnd_ita_vitali_last: "Vitali"
 nesnd_civic_characters.5.t: "Who Maintains the Schools?"
 nesnd_civic_characters.5.d: "In the former papal lands, the dispute over education has spread from who may teach children to who will pay their fees. Vitali favours public contributions to school expenses and insists that local churches fulfil their educational responsibilities. This has made him unpopular even among some defenders of the Church's authority.\n\nThe Church wants to keep its schools, the government wants to raise citizens, and ordinary families just want their children to learn something useful. None of these wishes need clash; but the moment it comes to teachers' wages and poor pupils' fees, no one will part with a single coin more."
 nesnd_civic_characters.5.a: "Support the Church in meeting its duty to educate."
 nesnd_civic_characters.5.b: "Those who want schools should first find a way to fund them."
 nesnd_civic_characters.105.t: "The Church and School Fees"
 nesnd_civic_characters.105.d: "Vitali has brought the argument over Church education down to teachers’ wages and pupils’ fees. If the Church is to retain its place as an educator of the people, he argues, ordinary families must be able to send their children to school. Opposition to government interference alone will not pay the bills.\n\nLocal churches need public grants but are unwilling to surrender control of their schools. The government is willing to contribute, and wants a say in what is taught. Vitali is trying to persuade both to share the burden. Both now ask whose side he is on."
 nesnd_civic_characters.105.organisation: "School expenses have brought local churches and residents into dispute again. Vitali’s proposal to share the cost received plenty of verbal support. When it comes to paying, everyone has their own difficulties. The churches want to preserve their educational standing, families want their children taught, and the teachers simply want their wages."
 nesnd_civic_characters.105.a: "First, make schooling affordable for the children."
 nesnd_ita_martelli_first: "Rosa"
 nesnd_ita_martelli_last: "Martelli"
 nesnd_civic_characters.6.t: "The Miners’ Injuries"
 nesnd_civic_characters.6.d: "When an injured miner leaves the pit, his family often loses its livelihood with him. Mine owners and local government both draw income from the industry, yet the people whose labour sustains it may be unable even to pay their children’s school fees.\n\nMartelli and the workers’ organisations demand that part of mining revenues go towards workplace safety, education and compensation for sickness and injury. Mine owners cite their many operating costs, and local authorities point to other demands on their funds. Having heard these arguments, the workers are all the more eager to know what place they have in the enterprise."
 nesnd_civic_characters.6.a: "Support the miners. They have a right to protection."
 nesnd_civic_characters.6.b: "Let the workers take their demands to the mine owners."
 nesnd_civic_characters.106.t: "After the Pit"
 nesnd_civic_characters.106.d: "Martelli continues to speak for sick and injured miners. Mining income sustains the owners’ businesses and contributes to local revenues, while families whose breadwinners can no longer go underground may struggle for their next meal. Workers’ organisations demand local spending on safety and education, so that those who created the wealth can share in it.\n\nThe argument over these expenses is turning separate family misfortunes into a common demand. The pits acknowledge workers’ worth when they need their labour. Who is responsible when that labour leaves them injured?"
 nesnd_civic_characters.106.organisation: "The number of people injured in the pits keeps rising, and mutual-aid societies can no longer support all their families. Martelli once demanded relief from mining revenues. The miners now put the same case to the local authorities: since their labour produced this wealth, surely those who can no longer work should have some share of it."
 nesnd_civic_characters.106.a: "Must a man be fit for the pit to deserve a living?"
 nesnd_hus_tong_first: "Shiheng"
 nesnd_hus_tong_last: "Tong"
 nesnd_civic_characters.7.t: "The Contractor’s Accounts"
 nesnd_civic_characters.7.d: "Tong Shiheng sees business waiting to be opened between the ports and the interior. If timber can travel out and goods travel in, roads will yield an income, and merchants will be willing to advance the government’s construction costs. He therefore proposes long concessions in return for private capital.\n\nMerchants will hardly build roads for nothing. The terms on which they seek a steady return will also govern how local people use those roads. A concession can spare the treasury an immediate expense while placing the production and trade along its route in a contractor’s hands for years to come."
 nesnd_civic_characters.7.a: "Support him. Let merchant capital build the roads."
 nesnd_civic_characters.7.b: "The localities must still discuss the terms."
 nesnd_civic_characters.107.t: "The Limits of a Concession"
 nesnd_civic_characters.107.d: "Tong Shiheng's proposal ties the works to the merchants' interests. The ports want more goods from the interior, the merchants want a steady return on what they put in, and the towns want the road to reach their own doors. The three hopes sometimes run together and sometimes do not.\n\nSo the merchants' willingness to advance the money does not settle the argument. How long the concession runs and how its returns are shared will decide which works they are willing to start, and how much the towns will pay to move their goods for years afterwards."
 nesnd_civic_characters.107.organisation: "Port merchants and inland contractors are still seeking long concessions. Tong Shiheng's proposal for private advances would spare the government some ready cash, but traders along the routes fear they will pay far more in freight later."
 nesnd_civic_characters.107.a: "Where the roads go, prosperity follows."
 nesnd_hus_shen_first: "Jichuan"
 nesnd_hus_shen_last: "Shen"
 nesnd_civic_characters.8.t: "Debt Bonds and Learning"
 nesnd_civic_characters.8.d: "A debt bond can state how much a person owes, and can bind a family to its creditor for years. Shen Jichuan collects these families’ testimony, campaigns to end debt bondage, and seeks opportunities for literacy and association for those already freed.\n\nFreedom does not dispel the poverty left by dependence. Someone unable to read will still struggle with the next contract. Someone without companions will still struggle alone against a powerful creditor. Shen therefore discusses education alongside personal liberty: once people have won their freedom, they should have some means of keeping it."
 nesnd_civic_characters.8.a: "Support their education and their freedom from dependence."
 nesnd_civic_characters.8.b: "First, let these families’ testimony be heard."
 nesnd_civic_characters.108.t: "The Prospects of Bonded Families"
 nesnd_civic_characters.108.d: "The testimony Shen Jichuan brings returns again and again to the future livelihoods of families bound by debt. The force of a bond depends on the law. Finding other work and understanding a new contract also depend on the knowledge and opportunities available to them.\n\nHe therefore insists that literacy and association belong to the families themselves. Creditors once decided where they would go. If they now have no room to learn or help one another, poverty will drive them back into dependence."
 nesnd_civic_characters.108.organisation: "The testimony Shen Jichuan collected from bonded families still circulates among advocates of education and abolition. Debtors’ children must work too, leaving no time to learn to read. When grown, they can only listen as creditors explain how much they owe. Those demanding a change in the law seek to break this dependence from one generation to the next."
 nesnd_civic_characters.108.a: "Freedom must bring the means to earn a free living."
 nesnd_hus_bayant_first: "Bayantu"
 nesnd_hus_bayant_last: ""
 nesnd_civic_characters.9.t: "Markers Across the Pasture Route"
 nesnd_civic_characters.9.d: "On a plan, the boundary of a construction site is only a line. In a pastoral family’s life, it may sever an entire season’s migration. Herds must follow old routes to water and grazing, while contractors mark out land to suit their enterprises. Bayantu brings the affected herders into local negotiations, seeking protected passages or compensation for families deprived of pasture.\n\nTo people who live in one place, going around a construction site may seem a small matter. A herd’s route depends on water, pasture and the seasons. The value of the ground beside a boundary marker cannot account for all of that."
 nesnd_civic_characters.9.a: "Support the herders in preserving their migration routes."
 nesnd_civic_characters.9.b: "Let the local authorities and contractors continue talks."
 nesnd_civic_characters.109.t: "Passage Across the Pasture"
 nesnd_civic_characters.109.d: "Bayantu insists that local negotiations follow the routes of migrating herds. Contractors can put a price on occupied land. Herders must work out where their animals can go once a passage is lost. If an alternative route lacks water and grass, a payment may do little to restore their livelihood.\n\nThese families ask that when the district does its sums, their lives be counted too."
 nesnd_civic_characters.109.organisation: "Herders need to know their routes before the season turns, but the boundaries of the works have already been drawn. Bayantu once pressed for passage and compensation on their behalf. Now the families must again explain to local authorities that losing the route to water and grazing costs far more than the plot of land occupied."
 nesnd_civic_characters.109.a: "The herds must have a path to follow."
 nesnd_hus_lin_first: "Sulan"
 nesnd_hus_lin_last: "Lin"
 nesnd_civic_characters.10.t: "Lessons After the Shift"
 nesnd_civic_characters.10.d: "Immigrant workers help one another in their lodgings, and Lin Sulan has begun organising evening lessons through these exchanges. Wages, debt bonds and laws are all set down in writing, yet many workers must leave their meaning to someone who can read. They have little way to check what an employer says has been deducted, or what a creditor says is still owed.\n\nLiteracy has acquired an immediate purpose, much to some employers’ unease. Once workers can read their contracts, they may gather to ask why only other people can set the terms."
 nesnd_civic_characters.10.a: "Support the evening classes. Let workers read their own contracts."
 nesnd_civic_characters.10.b: "Let them organise their own mutual aid and lessons."
 nesnd_civic_characters.110.t: "Lessons and Wages"
 nesnd_civic_characters.110.d: "The evening classes Lin Sulan advocates connect literacy to workers’ daily disputes. Those who can read wage accounts and debt bonds can calculate their earnings and explain the terms to their companions. Such learning may not immediately change the terms of employment, but it gives workers firmer grounds on which to argue.\n\nLearning also sustains mutual aid. Troubles once borne alone can now be discussed together. Employers fear precisely this discovery: that a worker’s misfortune is seldom theirs alone."
 nesnd_civic_characters.110.organisation: "People still come seeking lessons in the workers’ lodgings. Some bring wage accounts, others debt bonds, hoping a literate companion will explain them. The mutual aid Lin Sulan encouraged lives on in these small exchanges. As people gather, they begin to discover how much their troubles have in common."
 nesnd_civic_characters.110.a: "Read the terms, and make the case."
 nesnd_hus_lu_first: "Jingduo"
 nesnd_hus_lu_last: "Lu"
 nesnd_civic_characters.11.t: "Accounts of Public Works"
 nesnd_civic_characters.11.d: "An engineer’s reputation can attract capital to a project and win trust for a concession. Lu Jingduo refuses to let professional standing end there. He calls for public accounts and payments based on actual construction and employment, requiring contractors to show what public expenditure has bought.\n\nLocal representatives may know little engineering, but investors and taxpayers have reason to know where their money goes. If expertise serves only to prove a contractor wiser than everyone else, concessions and shares may pass to the most eminent names while nobody examines the works themselves."
 nesnd_civic_characters.11.a: "Support open accounts and payment for work actually done."
 nesnd_civic_characters.11.b: "Let them first debate these accounts fully."
 nesnd_civic_characters.111.t: "What Public Money Pays For"
 nesnd_civic_characters.111.d: "Lu Jingduo argues that progress on a project, the number of people employed and the money spent should bear scrutiny together. Contractors may earn trust through their expertise. They cannot expect that trust to cover every expense thereafter.\n\nFor him, public accounts concern the standing of engineers themselves. If professional knowledge speaks only for concession holders, local people will eventually see no distinction between engineer and contractor."
 nesnd_civic_characters.111.organisation: "Local representatives are again asking where the construction funds have gone. Contractors want them to trust professional judgement. Taxpayers want to see what their money has achieved. Lu Jingduo’s call for open accounts has therefore found support among people who may understand little engineering. They may not know the technicalities, but they know how they earned their money."
 nesnd_civic_characters.111.a: "Public money must yield something we can account for."
 nesnd_hus_guan_first: "Tingxian"
 nesnd_hus_guan_last: "Guan"
 nesnd_civic_characters.12.t: "Where the Oil Revenue Goes"
 nesnd_civic_characters.12.d: "Guan Tingxian demands a fixed share of oil taxes for the producing districts. Companies put their profits into new wells, and the central government counts the additional revenue towards national expenses. Local residents still have to petition for roads and schools. Oil beneath the ground should at least bring some early benefit to the people above it.\n\nLocal traders support this demand, which also unsettles the concession companies’ plans. The companies want to expand. Guan argues that if every receipt must first serve the next investment, local people will be left waiting forever."
 nesnd_civic_characters.12.a: "Support the producing districts’ claim to their revenues."
 nesnd_civic_characters.12.b: "The division of oil taxes can be discussed further."
 nesnd_civic_characters.112.t: "Claims from the Oil Districts"
 nesnd_civic_characters.112.d: "Guan Tingxian has brought the producing districts' demands into the budget debate. Oil companies want to use their returns to expand, while local traders need roads and schools for their businesses and families. If each distribution must wait until the companies have arranged their next investments, the districts will always receive what is left over.\n\nWhat he wants is not just a sum of money, but a voice for the districts when the money is shared out."
 nesnd_civic_characters.112.organisation: "Oil revenues let companies sink more wells, yet schools and roads in the producing districts may receive no funds. Guan Tingxian’s demand for a fixed local share speaks directly to traders’ and residents’ discontent. The oil comes from here, after all. Must the people here always be last in line when the proceeds are divided?"
 nesnd_civic_characters.112.a: "The oil districts deserve more than a wait for grants."
 nesnd_usm_ji_first: "Wenheng"
 nesnd_usm_ji_last: "Ji"
 nesnd_civic_characters.13.t: "Can Commerce Enter Public Life?"
 nesnd_civic_characters.13.d: "People engaged in commerce and industry play a growing part in local economies, yet the qualifications for public life may give little credit to what they know. Ji Wenheng asks the Assembly of Rites to give practical learning greater weight in examinations and admission to office, opening public affairs to those versed in industry, accounts and property rights.\n\nThis would disturb the standing the established gentry derives from learning and qualifications, and bring prestige to newcomers from trade and industry. But must recognition of business ability also make property a qualification? If wealth replaces pedigree, how much will the educated but propertyless gain?"
 nesnd_civic_characters.13.a: "Support practical learning and a wider path to office."
 nesnd_civic_characters.13.b: "Let the scholars continue their debate over qualifications."
 nesnd_civic_characters.113.t: "Practical Learning and Pedigree"
 nesnd_civic_characters.113.d: "Ji Wenheng’s proposal has prompted both commercial men and established scholars to ask what examinations should test. Those familiar with industry want their experience recognised. Those who have spent years studying the classics fear that changed qualifications will unsettle the standing they have accumulated.\n\nThe Assembly of Rites thus faces more than a revision of courses. Deciding what knowledge qualifies a person for affairs of state also decides who may enter political life."
 nesnd_civic_characters.113.organisation: "Men of commerce and the established gentry still disagree over how the Assembly of Rites should examine practical learning. Ji Wenheng once sought access to office for the former. The latter insist that making a fortune in trade must not become a shortcut into politics. Both claim the state needs people of real learning. By a happy coincidence, each finds those people on its own side."
 nesnd_civic_characters.113.a: "If they are to conduct our industries, let them discuss our government."
 nesnd_usm_duan_first: "Jingchuan"
 nesnd_usm_duan_last: "Duan"
 nesnd_civic_characters.14.t: "Teachers and Student Places"
 nesnd_civic_characters.14.d: "Duan Jingchuan, a Sichuan teacher, proposes changes to academy courses and student places to give practical learning more room in local education. Students study to earn a living and to participate in affairs of state. If examinations and qualifications do not recognise what they learn, even the best teaching can scarcely persuade them that this path leads anywhere.\n\nDuan therefore raises courses and places together. Adding subjects concerns the classroom. Recognising the qualifications of those who master them concerns whom political life is willing to admit."
 nesnd_civic_characters.14.a: "Support the teachers. Give practical learning a path forward."
 nesnd_civic_characters.14.b: "First, hear what the Sichuan teachers have to say."
 nesnd_civic_characters.114.t: "The Sichuan Teacher’s Curriculum"
 nesnd_civic_characters.114.d: "Duan Jingchuan's concerns about the curriculum always return to his students' prospects. Academies can teach practical subjects, and local communities need these skills. Students also hope their knowledge will help qualify them to participate in affairs of state.\n\nThe classroom and the examination hall each weigh things differently, and the teachers are caught in the middle. The students' futures hang on qualifications; Duan fights for places and recognition so that what is taught in the classroom will count in the examination hall."
 nesnd_civic_characters.114.organisation: "Sichuan’s teachers are still pressing for practical courses and student places. Duan Jingchuan’s original question remains before them: what qualifications can students actually gain from these skills? If the subjects taught in class cannot enter the examinations, many would rather return to the old books they already know."
 nesnd_civic_characters.114.a: "Learning should lead to a future."
 nesnd_usm_xu_first: "Tingzhang"
 nesnd_usm_xu_last: "Xu"
 nesnd_civic_characters.15.t: "Established Qualifications and Arbitrary Levies"
 nesnd_civic_characters.15.d: "Xu Tingzhang is wary of proposals to broaden admission to office. The established gentry’s standing, earned through years of study, should not be lightly surrendered to newcomers for an immediate convenience. Nor should wealth accumulated locally become a fund for arbitrary post-war levies. He is far from alone among his peers in thinking so.\n\nYet the demands of schools, military spending and taxation have changed. If Xu wishes to preserve local property and established qualifications, he must still explain where the money for mounting public expenses should come from."
 nesnd_civic_characters.15.a: "Support the gentry’s defence of qualifications and local property."
 nesnd_civic_characters.15.b: "Let them finish their case for the old ways."
 nesnd_civic_characters.115.t: "The Gentry and Local Spending"
 nesnd_civic_characters.115.d: "Xu Tingzhang's opposition to arbitrary levies has found an echo among the local gentry. They will not willingly see their property consumed by post-war finances, or their qualifications diminished in the name of practical learning.\n\nYet local schools must still be run, and the army must still be paid. If the defenders of the old order want to go on running local affairs, they cannot simply list which funds may not be touched and which people may not be let in."
 nesnd_civic_characters.115.organisation: "Local gentry are resisting new levies on the grounds Xu Tingzhang once advanced. They argue that existing property and qualifications for office must be protected from the demands of post-war finance. But schools and troops are still waiting for funds. If this wealth cannot be touched, who else is to pay?"
 nesnd_civic_characters.115.a: "Those who govern a locality must help sustain it."
 nesnd_usm_luo_first: "Yingtang"
 nesnd_usm_luo_last: "Luo"
 nesnd_civic_characters.16.t: "Accounts and Women Workers’ Literacy"
 nesnd_civic_characters.16.d: "Luo Yingtang has seen the uses of literacy in workshop accounts and women workers’ mutual aid. How wages are reckoned, why debts have grown, and how many goods must be delivered were once matters explained by whoever could read. Women able to read the figures themselves have firmer grounds for questioning them.\n\nShe has therefore begun organising literacy lessons, bringing the needs of the workshop before the schools. What use could women have for such learning? To those who support their families by their labour, the answer is much closer at hand than the people debating educational qualifications suppose."
 nesnd_civic_characters.16.a: "Agreed. Why should learning distinguish between men and women?"
 nesnd_civic_characters.16.b: "Let the mutual-aid groups continue their local appeal."
 nesnd_civic_characters.116.t: "Qualifications After Literacy"
 nesnd_civic_characters.116.d: "Luo Yingtang begins her case for education with the accounts women workers know well. Being able to read wage slips and invoices gives them a voice in the workshop, and shows them they could take on other work. And so the demand for learning runs into the question of qualifications: once they have learned, what are they allowed to do?\n\nLiteracy teaching has spread from the workshops to the schools, but the old lines of status and qualification may not loosen with it."
 nesnd_civic_characters.116.organisation: "Women workers began their studies by reading invoices and calculating wages. Some now hope these skills will win them new positions. The literacy education Luo Yingtang advocated has brought them to another barrier. They were once refused work because they lacked learning. Now that they have learned, what reason will be offered to keep them out?"
 nesnd_civic_characters.116.a: "Let those who have learned a skill put it to use."
 nesnd_usm_han_first: "Shiduo"
 nesnd_usm_han_last: "Han"
 nesnd_civic_characters.17.t: "The Craftsmen’s School"
 nesnd_civic_characters.17.d: "Manufacturers need skilled hands, and craftsmen earn their living by their skills. Technical education would seem to please both. Yet when Han Shiduo proposes schools for craftsmen, he also raises wages, injuries and disputes over hiring. Employers alone should not decide what a trained worker receives.\n\nWho pays the fees, and who supports a worker unable to work, will determine whether craftsmen can afford to study. If factories want skilled labour, they must face the demands of the people who provide it."
 nesnd_civic_characters.17.a: "Reward their labour. Support the craftsmen’s claim to their due."
 nesnd_civic_characters.17.b: "Let the craftsmen discuss their demands with the employers."
 nesnd_civic_characters.117.t: "Skill and Livelihood"
 nesnd_civic_characters.117.d: "Han Shiduo insists that discussion of craftsmen’s schools include fees, wages and protection against sickness and injury. Employers praise the benefits of developing skills but will not promise higher wages to those who qualify. If learning offers no better livelihood, why should workers pay for it from their meagre earnings?\n\nThe schools have yet to train skilled hands for either side. The argument over their costs and rewards has already exposed the divisions between labour and employers."
 nesnd_civic_characters.117.organisation: "Employers want more skilled workers; workers want more pay once they are trained; and so the cost of the school is pushed back and forth between them. Han Shiduo once talked about education and wages in the same breath, and now the two quarrels have stayed in the workshops together."
 nesnd_civic_characters.117.a: "Better skills should bring a better living."
 nesnd_usm_jiang_first: "Shaoheng"
 nesnd_usm_jiang_last: "Jiang"
 nesnd_civic_characters.18.t: "The Accounts of Interprovincial Investment"
 nesnd_civic_characters.18.d: "Works spanning several provinces and the concentration of capital make local interests increasingly difficult to disentangle. Coastal profits, inland tax burdens and the student places each province needs do not always fall to the same people. A rise in total revenue cannot establish that every province has benefited.\n\nJiang Shaoheng demands that these differences be considered openly in the budget debate. Provincial delegates in the Assembly of Rites must consider common undertakings while explaining to their own provinces why they should pay, and what they will receive."
 nesnd_civic_characters.18.a: "Support an open budget. Let each province state its gains and burdens."
 nesnd_civic_characters.18.b: "The provinces will argue for their own shares."
 nesnd_civic_characters.118.t: "What the Provinces Give and Receive"
 nesnd_civic_characters.118.d: "Jiang Shaoheng demands that budget discussions show who gains and who loses from investment across provincial boundaries. Higher coastal profits will not pay an inland taxpayer’s bill. More student places in one province will not meet another’s needs. Adding these together can make a common undertaking look as though everyone shares in it, while its burdens remain uneven.\n\nProvincial delegates in the Assembly of Rites must therefore explain to their provinces where local revenues go, and why the expense is justified."
 nesnd_civic_characters.118.organisation: "The income and expenses of interprovincial works have again set provincial delegates arguing. Coastal merchants praise the prosperity investment brings. Inland representatives demand to know how much their provinces paid in taxes and how much they gained. Jiang Shaoheng’s call for an open budget gives them grounds to keep asking. However impressive the national total, it cannot answer a province’s taxpayers for them."
 nesnd_civic_characters.118.a: "A common undertaking must account for each province’s share."
