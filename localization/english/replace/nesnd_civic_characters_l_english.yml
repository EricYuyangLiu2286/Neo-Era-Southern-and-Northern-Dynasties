 nesnd_civic_characters.200.t: "From Teacher to Provincial Delegate"
 nesnd_civic_characters.200.d: "Duan Jingchuan has passed the Assembly of Rites’ examination and qualified as a provincial delegate. The Sichuan teacher who once campaigned for practical courses and local student places can at last take a seat, participating directly in the affairs of state that shape his pupils’ futures.\n\nLocal teachers and students have high hopes for him. Delegates from other provinces have demands of their own. Once, he had only to explain what Sichuan lacked. Now he must answer who should meet those needs."
 nesnd_civic_characters.200.a: "Take your seat, and bear responsibility for the province."
