 nesnd_per_tension.1.t:0 "Ashura"
 nesnd_per_tension.1.d:0 "On the tenth day of Muharram the streets of [SCOPE.sState('nesnd_per_tension_state').GetName] are packed with mourners beating their chests for Husayn, who died at Karbala more than a thousand years ago. As the procession passes the garrison gate, something else mixes into the sound of the flails: someone is calling out the name of the old kings.\n\nThe Tang captain at the gate asks for orders. Should this year's procession be allowed to finish, or cleared away before nightfall?"
 nesnd_per_tension.1.f:0 "'Every day is Ashura, every land is Karbala.' - Shia saying"
 nesnd_per_tension.1.a:0 "Let them finish their weeping."
 nesnd_per_tension.1.b:0 "After sunset, not one man is to be left on the streets."
 nesnd_per_tension.2.t:0 "The Pilgrim Tax"
 nesnd_per_tension.2.d:0 "Every spring, thousands of pilgrims walk the post roads to Mashhad to pray at the tomb of Imam Reza. The Tang clerks of the revenue office have done their sums: a coin a head is no small income. The ulama have done theirs too: a coin a head is 'foreigners charging rent on the shrine'."
 nesnd_per_tension.2.f:0 "'A pilgrim's soles travel further than any manifesto.' - a post-rider on the Mashhad road"
 nesnd_per_tension.2.a:0 "Waive it. The treasury will not miss this much."
 nesnd_per_tension.2.b:0 "The shrine is the shrine, and the treasury is the treasury."
 nesnd_per_tension.3.t:0 "The Extortionate Prefect"
 nesnd_per_tension.3.d:0 "At harvest the Tang prefect of [SCOPE.sState('nesnd_per_tension_state').GetName] levied an extra third as 'garrison grain'. The village heads petitioned together, and the petition has climbed all the way to court. The prefect's father-in-law is a man of standing among the martial clans."
 nesnd_per_tension.3.f:0 "'Tang scales never come up short on Persian wheat.' - a grain dealer in the Isfahan bazaar"
 nesnd_per_tension.3.a:0 "Dismiss him and return the grain."
 nesnd_per_tension.3.b:0 "A misunderstanding. A reprimand will do."
 nesnd_per_tension.4.t:0 "The Book of Kings"
 nesnd_per_tension.4.d:0 "For several nights running, a poetry circle in Shiraz has recited Ferdowsi's Shahnameh. What the listeners love best is not Rostam's feats but a few lines of verse: the crown of Iran belongs on an Iranian head alone. The night watch has copied down the circle's members and sent the list to the prefecture."
 nesnd_per_tension.4.f:0 "'I have revived Iran with this Persian tongue.' - Ferdowsi"
 nesnd_per_tension.4.a:0 "Let the court fund them too, and ask them to read a few Tang poems."
 nesnd_per_tension.4.b:0 "Close the circle and burn the copies."
 nesnd_per_tension.5.t:0 "Grievance in the Barracks"
 nesnd_per_tension.5.d:0 "Most of the garrison's soldiers are Persian, yet nearly every captain is a Tang. A much-decorated Persian centurion has been passed over for the third time, and his men have sat in silence before the barracks gate for a whole day."
 nesnd_per_tension.5.f:0 "'Persians sharpen the blades, Tang collect the glory.' - carved into a barracks wall"
 nesnd_per_tension.5.a:0 "Promote him and let the clans complain."
 nesnd_per_tension.5.b:0 "Orders are orders. Deal with the sitters by regulation."
 nesnd_per_tension.6.t:0 "A Question of Marriage"
 nesnd_per_tension.6.d:0 "The heir of a Tang martial clan wishes to marry the daughter of a Shiraz merchant. Her dowry is half a street of shops; his elders say Tang blood will not be mixed into Persian ledgers. The marriage contract now waits at court for a single word of consent."
 nesnd_per_tension.6.f:0 "'A marriage can buy you shops, but not a pedigree.' - precept of a clan elder"
 nesnd_per_tension.6.a:0 "Granted. The ledger and the pedigree will become one book sooner or later."
 nesnd_per_tension.6.b:0 "Lineage comes first. Let the matter drop."
 nesnd_per_tension_src_once_claim:0 "Territorial claims"
