 nesnd_per_tension_journal:0 "The Persian Question"
 nesnd_per_tension_journal_reason:0 "More than two centuries ago the military commands of the Chen Qin raised the banner of the Li house in Khorasan, and the Tang became masters of the Iranian plateau. The Wise King Azdan bought decades of peace with trade routes and craftsmen, but once the Treaty of Baghdad was sealed, the drums of Qin's westward march fell suddenly silent. All that was left to the Tang-Persian Empire were its own soldiers, its own officials, and a Persia several times its size.\n\nIn the bazaars the storytellers still recite the Shahnameh, and from the Friday pulpit the ulama remind the faithful, again and again, who the old masters of this land were. Tang pedigree, Persian numbers, the clerics' pulpits, the garrison's swords: the people's cries rise like birds in the Zagros, flying into the clouds, toward some distance ancient, desolate, and unknowable..."
 nesnd_per_tension_status_frozen:0 "With fewer than three states left, the old accounts between Tang and Persian are set aside for now."
 nesnd_per_tension_status_uprising:0 "Resentment has reached its peak. The Iranian rising awaits only a spark."
 nesnd_per_tension_status_restless:0 "Persian unrest is spreading, and ruling grows harder."
 nesnd_per_tension_status_uneasy:0 "The markets go on as usual, but the sermons grow heavier by the day."
 nesnd_per_tension_status_calm:0 "Tang order still holds."
 nesnd_per_tension_invalid_tt:0 "The Tang no longer rule, or the wider Iranian peoples are less than #v 25%#! of the population"
 nesnd_per_tension_invalid_conclusion:0 "The old accounts between the Tang and the Persians are no longer this court's to settle."
