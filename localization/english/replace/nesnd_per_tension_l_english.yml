l_english:
 lawgroup_nesnd_per_tang_order:0 "Tang Ranks"
 lawgroup_nesnd_per_tang_order_desc:0 "Sets the standing of each people under the Tang-Persian Empire by descent."
 nesnd_per_tang_hierarchy:0 "Tang Ranks"
 nesnd_per_tang_hierarchy_desc:0 "The Tang stand in the first rank, the wider Iranian peoples in the second, and everyone else in the third; each rank is divided again into upper, middle and lower."
 law_nesnd_per_tang_strict:0 "Strict Tang Ranks"
 law_nesnd_per_tang_strict_desc:0 "The Tang above, every other people in its place. Lineage is written into the household register, and no fortune or learning can carry a man across that line."
 law_nesnd_per_tang_codified:0 "Codified Tang Ranks"
 law_nesnd_per_tang_codified_desc:0 "Once rank is written into law, the law also sets out a few ladders. Study, soldiering and the purchase of rank can all lift a Persian upward, but every ladder ends one rung below the Tang."
 law_nesnd_per_tang_lenient:0 "Lenient Tang Ranks"
 law_nesnd_per_tang_lenient_desc:0 "The statutes still set the Tang first, but they are enforced with a far lighter hand. A Persian who keeps the law and pays his taxes need no longer bow at every turn."
