 nesnd_poland_rw_speech: "Freedom of the press or assembly"
 nesnd_poland_rw_isolation: "Paris is reluctant to intervene"
 nesnd_poland_rw_poverty: "Standard of living below 10"
 nesnd_poland_rw_radicals: "At least a tenth of the population is radical"
 nesnd_poland_rw_warsaw: "The capital is in Warsaw"
 nesnd_poland_rw_abroad: "At least a fifth of [GetCulture('polish').GetName] people are radical in a partitioned homeland"
 nesnd_poland_university_name: "Endow the University of Warsaw"
 nesnd_poland_university_desc: "Raise the [GetBuildingType('building_university').GetName] in Warsaw to level three at a cost of four weeks’ fixed income."
 nesnd_poland_diet_name: "Convene the Diet"
 nesnd_poland_diet_desc: "Ask the Diet to appoint a diplomatic delegation or endorse petitions from across the border."
 nesnd_poland_paris_name: "Appeal to Paris"
 nesnd_poland_paris_desc: "Ask Paris to negotiate. French resolve rises by 10 for two years and the Whites gain support."
 nesnd_poland_agitators_name: "Send agitators"
 nesnd_poland_agitators_desc: "Send agitators to a [GetCulture('polish').GetName] homeland under a partitioning power."
 nesnd_poland_rising_name: "Proclaim an uprising"
 nesnd_poland_rising_desc: "Choose a partitioning power and demand a restoration state. An unsuccessful rising brings ten years of repression."
 dp_nesnd_poland_rising: "Polish Uprising"
 dp_nesnd_poland_rising_tooltip: "Rise to reclaim a homeland state."
 nesnd_poland_repression: "Repression after the Uprising"
 nesnd_polish_diet.1.t: "A Frontier in Print"
 nesnd_polish_diet.1.d: "A newspaper has printed the frontiers of 1829 beside a map of the provinces today. The Whites want copies for the legations. The Reds want another edition for the border fairs. The printer wants payment for the paper."
 nesnd_polish_diet.1.a: "Send copies to the legations."
 nesnd_polish_diet.1.b: "Pay for another edition."
 nesnd_polish_diet.2.t: "Leases across the Border"
 nesnd_polish_diet.2.d: "Land on either side of the frontier can be held on a single lease, yet tenants need a pass to bring in the harvest. Landowners want the government to negotiate rights of passage. A deputation of tenants asks for the passes to be abolished."
 nesnd_polish_diet.2.a: "Let the landowners appoint delegates."
 nesnd_polish_diet.2.b: "Lay the tenants’ petition before the Diet."
 nesnd_polish_diet.3.t: "Pensions for the Insurgents"
 nesnd_polish_diet.3.d: "Women applying for pensions must name the regiment in which a relative died. Some of the units they have named never appeared on the government rolls. Granting those pensions would recognise men who took up arms on their own authority."
 nesnd_polish_diet.3.a: "Keep to the army rolls."
 nesnd_polish_diet.3.b: "Accept testimony from comrades and fund the pensions."
 nesnd_polish_diet.4.t: "Letters from Warsaw"
 nesnd_polish_diet.4.d: "Teachers have asked for maps of the lands beyond the frontier. The Reds will pay the printers if they can choose the maps. White deputies have submitted a set showing the boundaries recognised by the settlement."
 nesnd_polish_diet.4.a: "Use the treaty maps."
 nesnd_polish_diet.4.b: "Leave the choice to the teachers."
 nesnd_polish_diet.5.t: "A Merchants’ Deputation"
 nesnd_polish_diet.5.d: "Merchants trading overland want state guarantees for their warehouses against the next frontier dispute. White deputies would make the guarantees conditional on financing a mission abroad. The Reds demand that the government first publish its territorial claims."
 nesnd_polish_diet.5.a: "Guarantee the warehouses and send the deputation."
 nesnd_polish_diet.5.b: "Debate the claims in the Diet first."
 nesnd_polish_diet.6.t: "The Petitioners’ Names"
 nesnd_polish_diet.6.d: "A petition for the recovery of the lost provinces has reached the Diet. Publishing the signatures might expose petitioners returning across the frontier to questioning. Several have asked for the sheets they signed to be handed back."
 nesnd_polish_diet.6.a: "Seal the signatures and entrust the petition to the deputies."
 nesnd_polish_diet.6.b: "Publish the names of those who consent."
 nesnd_polish_diet.7.t: "The Opening of the Diet"
 nesnd_polish_diet.7.d: "The Diet has voted funds for a delegation abroad. The Whites have put forward members known at the legations. The Reds move that the delegates first hear petitions from Poles beyond the frontier."
 nesnd_polish_diet.7.a: "Authorise talks with the guarantors."
 nesnd_polish_diet.7.b: "Hear the deputations from abroad."
 nesnd_polish_diet.8.t: "A Rising for the Lost Provinces"
 nesnd_polish_diet.8.d: "The Reds have called on the government to back a rising across the frontier. The Diet must decide which partitioning power shall receive its demand. Once it has been delivered, the fate of the insurgents will turn on the diplomatic play."
 nesnd_polish_diet.8.pru: "Demand the return of [SCOPE.sState('rising_pru').GetName]."
 nesnd_polish_diet.8.aus: "Demand the return of [SCOPE.sState('rising_aus').GetName]."
 nesnd_polish_diet.8.rus: "Demand the return of [SCOPE.sState('rising_rus').GetName]."
 nesnd_polish_diet.8.wait: "Postpone the rising."
 nesnd_polish_diet.9.t: "The Insurgents Come Home"
 nesnd_polish_diet.9.d: "The province claimed by the rising is now under our administration. The Reds’ delegates at the frontier must hand the collection of taxes and the raising of troops over to the government."
 nesnd_polish_diet.9.a: "Send administrators."
 nesnd_polish_diet.10.t: "Defeat of the Rising"
 nesnd_polish_diet.10.d: "The rising has failed to recover the disputed land. The Whites demand that the Reds surrender their authority on the frontier committees and that families fleeing across the border be admitted."
 nesnd_polish_diet.10.a: "Admit the families."
 nesnd_poland_rw_pressure: "Red demands for a revision of the frontier"
 nesnd_poland_fund_15: "Gain 15 points towards territorial claims."
 nesnd_poland_claim_fund_tt: "At least 20 points are available for territorial claims."
 nesnd_poland_negotiation_terms: "After a reply, five years must pass before a further demand can be made on this country. Within the same power bloc a refusal ends negotiations. Outside the bloc it opens a diplomatic play in which the defender demands the annexation of $nesnd_lobby_name_kra$."
 nesnd_poland_rw_status_white: "The Whites have pledged to uphold the settlement of 1829. The Diet will withdraw the pledge if the Reds cross the midpoint. Funds for territorial claims stand at [ROOT.GetCountry.MakeScope.Var('nesnd_poland_claim_fund').GetValue|0]/100.\n$nesnd_poland_rw_rules_link$"
 nesnd_poland_rw_status: "Funds for territorial claims stand at [ROOT.GetCountry.MakeScope.Var('nesnd_poland_claim_fund').GetValue|0]/100. Each claim costs 20.\n$nesnd_poland_rw_rules_link$"
 nesnd_poland_rw_rules_link: "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_poland_rw_rules $nesnd_poland_red_white_name$#!#!"
 nesnd_poland_rw_rules: "#bold Whites at 100%#! At the monthly review, the Diet pledges to uphold the [Glossary('glossary_nesnd_settlement_of_1829','settlement of 1829')]. While the pledge holds, the powers are more likely to back Polish proposals. If French resolve reaches 60, a successful post-war territorial proposal can return up to two states within the former Duchy of Warsaw. The Diet withdraws its pledge at the monthly review if the Reds hold more than 50%.\n\n#bold Reds at 75% or more#! The Diet can organise secret societies in the partitioning powers. A government that uncovers a society can ask the Continental Congress to sanction Poland.\n\n#bold Reds at 100%#! The Diet can launch an uprising to claim one state from a partitioning power, or wait. If the Continental Congress rejects a Polish proposal, the Diet can also use that decision to authorise one uprising within five years. A failed uprising brings ten years of repression and returns the Whites to 75%."
