 nesnd_per_governance:0 "Governing the Near Western Empire"
 nesnd_per_governance_reason:0 "The army needs pay, towns need roads, and schools and new laws compete for the court's support. Prestige won in the Near Western War cannot provide all of them. Relations with Ili may bring assistance, but lasting authority must also rest on our own schools, industry and public order."
