 nesnd_usm_western_provinces:0 "The Western Provinces"
 nesnd_usm_western_provinces_reason:0 "Wu's armies have entered the west, but the Ming loyalists have not disappeared with their defeated commanders. Chengdu, Xiangyang and Northern Guangxi still harbour attachments to the old dynasty. Local scholars are reluctant to recognise the new court in Hangzhou. Military conquest must now be followed by provincial administration and the authority of the Assembly of Rites.\n\nThe three regions must be [Concept('concept_incorporated_state','incorporated')] before #v 1850#!. Further delay will spread discontent among the Jingchu, Southwestern, Hakka and Yue populations."
 nesnd_usm_western_provinces_status:0 "Ming loyalists remain active. Falling living standards will deepen popular resentment."
 nesnd_usm_ming_resistance:0 "Ming Restoration Movement"
 nesnd_usm_western_before_1850:0 "The year is before #v 1850#!."
 nesnd_usm_western_deadline:0 "The #v 1850#! deadline has arrived without timely incorporation."
 nesnd_usm_western_failure_tt:0 "#n 25%#! of each of our #v Jingchu, Southwestern, Hakka and Yue#! populations become more radical."
 nesnd_western_provinces.1.t:0 "Resentment in the West"
 nesnd_western_provinces.1.d:0 "The deadline for incorporating the western provinces has passed without the promised result. Exiled ministers present the delay as proof that Wu cannot secure the country's allegiance. Disaffected scholars echo their accusations. Resentment among Jingchu, Southwestern, Hakka and Yue communities has given the restoration cause a wider following."
 nesnd_western_provinces.1.a:0 "The struggle is not over."
