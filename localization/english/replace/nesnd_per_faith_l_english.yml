 nesnd_per_unity.1.t:0 "Empty Clan Halls"
 nesnd_per_unity.1.d:0 "The Tang of [SCOPE.sState('nesnd_per_unity_state').GetName] have not returned to their clan hall in three generations. The young speak Persian and work in Persian workshops, and the names in their ledgers have become Persian names. The clan elders have written to court asking for money to repair the hall and open a school, to pull the children back."
 nesnd_per_unity.1.f:0 "“For three generations our young people have not entered the ancestral hall. Their speech and their names are Persian. We beg the court to grant funds to repair the hall and found a school, so that our descendants may know where they come from.”\n- Petition of the Tang clan elders of [SCOPE.sState('nesnd_per_unity_state').GetName]"
 nesnd_per_unity.1.a:0 "Let them go their way."
 nesnd_per_unity.1.a.tt:0 "#r 25%#! of the state's Western Regions Han-Qiang take up a local Iranian culture"
 nesnd_per_unity.1.b:0 "Fund the hall and the school."
 nesnd_per_unity.1.b.tt:0 "The state's Western Regions Han-Qiang are unaffected"
 nesnd_per_unity.2.t:0 "The Old Tang"
 nesnd_per_unity.2.d:0 "Some households in [SCOPE.sState('nesnd_per_unity_state').GetName] have dug out the genealogies at the bottom of their chests. The more the new court suspects the Tang, the more willing they are to own their Tang descent; some have even taken back Tang names. Local officials ask how to intervene."
 nesnd_per_unity.2.f:0 "“Several households in this district have brought out their genealogies and declare themselves descendants of the Tang. Some have taken back Tang names. I request instructions on whether to intervene.”\n- Request for instructions from the local official"
 nesnd_per_unity.2.a:0 "Let them be."
 nesnd_per_unity.2.a.tt:0 "#r 25%#! of the state's wider Iranians become Western Regions Han-Qiang"
 nesnd_per_unity.2.b:0 "Perhaps some gold would help..."
 nesnd_per_unity.2.b.tt:0 "The state's population is unaffected"

 # 天命说（开局可替换佛门）
 nesnd_per_faith_mandate_journal:0 "Rise and Fall of the Faiths"
 nesnd_per_faith_mandate_journal_reason:0 "At the court of the Tang-Persian Empire three voices rise and fall. Among temple gates and towers built in the Buddhist style of the Middle Land, the Li sovereigns took the throne by Sunni rite, while the Persians' mosques recite Shia scripture. The Western Qin court at Ili, meanwhile, holds the writings of the Doctrine of the Mandate of Heaven as its state creed: a teaching that Heaven's mandate is the way of nature, that the Han peoples receive its law, that righteousness and truth are its heart and bones, and that it has no need of gods. The Tang court is inclined to follow its example.\n\nYet the Doctrine is a new scripture of recent times. It was born in the distant heart of the Middle Land and grew up in the last years of the [Glossary('glossary_nesnd_beiming','Northern Ming')] among scholars of the old learning in Han letters. In this land it has not a single lecture hall or disciple. If we truly mean to stress the unity of Han [concept_culture] in our realm, should we not stay loyal to the ancient faith the Buddha taught?"
 nesnd_per_faith_status_mandate_leads:0 "$nesnd_per_faith_current_faith$ The Doctrine of the Mandate leads in influence.\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_src_preach_cut:0 "Ties with Ili broken"
 nesnd_per_faith_src_preach_unity:0 "Tang drifting apart"
 nesnd_per_faith_src_preach_war:0 "At war with Western Qin"
 nesnd_per_faith.1.d_mandate:0 "In [SCOPE.sState('nesnd_per_faith_conv_state').GetName] another group of households has taken up the Doctrine of the Mandate. The halls teach of ruler and subject, father and son, and of Heaven's mandate given and withdrawn; those who listen long enough begin to live by it."
 nesnd_per_faith.1.d_preach:0 "A master from Western Qin has taught a season in [SCOPE.sState('nesnd_per_faith_conv_state').GetName]. The Tang who came to listen went home, cleared away their old altars and hung up tablets to Heaven, Earth, sovereign, kin and teacher. Many of their neighbours came to listen too, and never went back to the mosque."
 nesnd_per_faith.2.t:0 "A Doctrine from the West"
 nesnd_per_faith.2.d:0 "An envoy from Ili has brought the Western Qin court's greetings, and several chests of books. Western Qin holds the Doctrine of the Mandate of Heaven as its state faith: Heaven's mandate rests with a virtuous ruler and leaves one who loses his virtue. The envoy says the Tang and the Qin share one origin, so why not raise the Doctrine in the west as well?\n\nSome at court say the Tang have kept to the Buddha for two centuries and need not look so far afield. Others say the Buddha speaks only of the next life, while the Doctrine can explain why the Tang should govern this land at all."
 nesnd_per_faith.2.f:0 "'Heaven has no favourites; it aids only the virtuous.' - Book of Documents"
 nesnd_per_faith.2.a:0 "The Tang have their own Buddha."
 nesnd_per_faith.2.a.tt:0 "The third faith in 'Rise and Fall of the Faiths' is #v Buddhism#!"
 nesnd_per_faith.2.b:0 "Invite the masters of Western Qin to teach."
 nesnd_per_faith.2.b.tt:0 "The third faith in 'Rise and Fall of the Faiths' becomes #v the Doctrine of the Mandate of Heaven#!: it starts with no followers, grows first through ties with Ili and lecture halls, then draws in the Tang by preaching. This cannot be changed back to Buddhism."
 nesnd_per_faith_mandate_bar_name:0 "Mandate Influence"
 nesnd_per_faith_mandate_bar_desc:0 "$nesnd_per_faith_mandate_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]%#! (#v [JournalEntry.GetCountry.MakeScope.Var('nesnd_per_inf_mandate_v').GetValue|1]#!)"
 nesnd_per_faith_preach_bar_name:0 "Preaching"
 nesnd_per_faith_preach_bar_desc:0 "$nesnd_per_faith_preach_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_per_faith_src_preach_base:0 "Masters from Western Qin"
 nesnd_per_faith_src_preach_aid:0 "Tribute to Ili"
 nesnd_per_faith_src_preach_halls:0 "Lecture halls"
 nesnd_per_faith_src_preach_state:0 "State faith"
 nesnd_per_faith_rep_label_mandate:0 "Mandate of Heaven"
 nesnd_per_faith_adopt_mandate:0 "Adopt the Doctrine of the Mandate"
 nesnd_per_faith_adopt_mandate_desc:0 "Heaven's mandate rests with truth, and righteousness with the Han peoples. Write those words into our Code of the Great Gao Tang, and the Tang need no longer borrow another people's rite to govern this land."
 nesnd_per_faith_adopt_mandate_tt:0 "The Persians see the Doctrine as the Qin's faith: the state faith weighs more heavily in '$nesnd_per_tension_journal$'. Preaching speeds up greatly, and non-Tang Shia and Sunni followers can be won over too."
 nesnd_per_faith_lecture_hall:0 "Found a Lecture Hall"
 nesnd_per_faith_lecture_hall_desc:0 "Build a lecture hall and invite a master from Ili to teach there."
 nesnd_per_faith_hall_effect_tt:0 "One more lecture hall: the Doctrine gains influence and preaching speeds up. While ties with Ili are broken, one hall falls into disuse each year."
 nesnd_per_faith_hall_cooldown_tt:0 "#v 2#! years have passed since the last lecture hall was founded"
 nesnd_per_faith_hall_max_tt:0 "Fewer than #v 6#! lecture halls"
 nesnd_per_faith_hall_ties_tt:0 "Still in contact with Ili, and not at war with Western Qin"
 nesnd_per_faith_hall_money_tt:0 "Treasury holds at least the cost of building (#v 1.5%#! of GDP)"
 nesnd_per_n_han:0 "Han"
 nesnd_per_n_shouzheng:0 "Liben"
 nesnd_per_n_zhao:0 "Zhao"
 nesnd_per_n_jingzhi:0 "Yungong"
 nesnd_per_n_wang:0 "Wang"
 nesnd_per_n_mingde:0 "Zhaogang"
 ig_nesnd_per_clergy:0 "Masters of the Faiths"
 ig_nesnd_per_clergy_desc:0 "Shia mujtahids, Sunni muftis, and the abbots of the Tang temples or the masters come from Western Qin stand in one rank. They compete with one another for the faithful, yet each cares just as much which pulpit the court stands beneath."
 nesnd_per_faith_conversion_rule:0 "#bold $nesnd_per_faith_conversion_bar_name$#! (resets at 100)\nShia, Sunni, Buddhist and Mandate followers can be converted.\nOf the states with such followers, the most populous is chosen.\n5% of the followers of the other faiths there convert to the most influential faith."
 nesnd_per_faith_preach_rule:0 "#bold $nesnd_per_faith_preach_bar_name$#! (resets at 100)\nPreaching reaches Tang Buddhist, Shia and Sunni followers.\nOne state is chosen in which at least one such Pop has 5,000 people.\n25% of those followers there convert to the Doctrine of the Mandate.\nIf it is the state faith, 30% of non-Tang Shia and Sunni followers in that state also convert."
 nesnd_per_faith_influence_rule:0 "#bold Religious influence#! (calculated monthly)\nEvery 100,000 followers give Shia 0.8, Sunni 0.7 and the third faith 0.6 points.\nEvery 100,000 Tang followers add 4 more points. The state faith gains 6 points.\nEach shrine restoration adds 2 points to Shia, up to 10."
 nesnd_per_faith_rules:0 "$nesnd_per_faith_conversion_rule$\n\n$nesnd_per_faith_influence_rule$\nA serving representative adds 10% to their faith's total.\nThe percentage on each bar is that faith's share of the combined score."
 nesnd_per_faith_mandate_rules:0 "$nesnd_per_faith_conversion_rule$\n\n$nesnd_per_faith_preach_rule$\n\n$nesnd_per_faith_influence_rule$\nThe Doctrine gains 0.6 points per lecture hall.\nTies with Western Qin add 3 points, or 4 while paying tribute to Ili.\nA serving representative adds 10% to their faith's total.\nThe Doctrine receives this bonus only while it also has ties with Western Qin.\nThe percentage on each bar is that faith's share of the combined score."
 nesnd_per_faith_current_faith:0 "The state faith is #v [ROOT.GetCountry.GetStateReligion.GetNameNoFormatting]#!."
 nesnd_per_faith_choose_faith:0 "To keep the current faith, do nothing. To change it, click the state faith button below the portraits.\nAfter a change, it can be changed again only after 20 years."
 nesnd_per_faith_different_state_faith_tt:0 "The chosen faith differs from the current state faith"
 nesnd_per_faith_status_cooldown:0 "$nesnd_per_faith_current_faith$\nFewer than 20 years have passed since the last change, so it cannot be changed yet."
 nesnd_per_faith_status_frozen:0 "$nesnd_per_faith_current_faith$\nAt least three states are required to change it."
