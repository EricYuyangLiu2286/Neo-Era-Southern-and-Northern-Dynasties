 nesnd_per_unity_journal:0 "One Tang Heart"
 nesnd_per_unity_journal_reason:0 "The Tang who came west have lived on the Iranian plateau for more than two centuries. Their ancestors spoke the court tongue of Qin and kept the clan halls; their descendants earn their living in Persian bazaars and have learned Persian, Pashto or some other tongue. Some have turned to the Most Great; some have married daughters of the mountain peoples.\n\nThe pedigrees and the genealogies remain. But in whose tales of heroes will their hearts find rest?"
 nesnd_per_unity_status_high:0 "Other peoples gradually take up Tang speech and lineage, and the Western Regions Han-Qiang grow ever closer to the Old Qin."
 nesnd_per_unity_status_mid:0 "Each household keeps to itself."
 nesnd_per_unity_status_low:0 "The Tang clans are scattering; the clan halls grow emptier every year."
 nesnd_per_unity_status_persian_rule:0 "Iranians rule, and the new court will decide what becomes of the Tang."
 nesnd_per_unity_next_decay:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_next_size')|D]#! [GetCulture('ce_xiyu').GetName] in [ROOT.GetCountry.MakeScope.Var('nesnd_per_next_state').GetState.GetName] adopt [ROOT.GetCountry.MakeScope.Var('nesnd_per_next_culture').GetCulture.GetName] culture, unless we pay to prevent it in the event. Cohesion must still be below #v 40#!."
 nesnd_per_unity_next_decay_any:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_next_size')|D]#! [GetCulture('ce_xiyu').GetName] in [ROOT.GetCountry.MakeScope.Var('nesnd_per_next_state').GetState.GetName] adopt a local Iranian culture, unless we pay to prevent it in the event. Cohesion must still be below #v 40#!."
 nesnd_per_unity_next_revival:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_next_size')|D]#! Iranian residents of [ROOT.GetCountry.MakeScope.Var('nesnd_per_next_state').GetState.GetName] adopt [GetCulture('ce_xiyu').GetName] culture, unless we pay to prevent it in the event. Cohesion must still be below #v 40#!."
 nesnd_per_unity_next_gain:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_gain_size')|D]#! residents of other peoples adopt [GetCulture('ce_xiyu').GetName] culture, and about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_laoqin_size')|D]#! [GetCulture('ce_xiyu').GetName] adopt [GetCulture('ce_laoqin').GetName] culture. Cohesion must still be above #v 75#!."
 nesnd_per_unity_next_loss:0 "\nNext monthly update: about #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_loss_size')|D]#! [GetCulture('ce_xiyu').GetName] adopt the Iranian cultures of their [concept_state]. Cohesion must still be above #v 75#!."
 nesnd_per_unity_next_missed:0 "\nNext monthly update: no conversion. No [concept_state] was drawn this month. Below #v 40#! cohesion, the chance is #v 15%#! each month."
 nesnd_per_unity_next_no_state:0 "\nNext monthly update: no conversion. No [concept_state] qualifies."
 nesnd_per_unity_next_mid:0 "\nNext monthly update: no conversion. Cohesion is between #v 40#! and #v 75#!."
 nesnd_per_unity_next_none:0 "\nNext monthly update: no conversion."
 nesnd_per_unity_invalid_tt:0 "No Western Regions Han-Qiang remain in the country"
 nesnd_per_unity_invalid_conclusion:0 "The Western Regions Han-Qiang are no longer our subjects."
