l_english:
 nesnd_per_faith_journal:0 "Rise and Fall of the Faiths"
 nesnd_per_faith_journal_reason:0 "At the court of the Tang-Persian Empire three kinds of prayer rise and fall. The Li sovereigns took the throne by Sunni rite; the Persians' mosques recite Shia scripture; and of the Tang who came west with the Chen Qin garrisons, some long ago followed their neighbours to the mosque, while others still keep a Buddha in the house.\n\nThe state faith is written into the statutes, but hearts follow the pulpit."
 nesnd_per_faith_status_state_leads:0 "$nesnd_per_faith_current_faith$ The state faith leads in influence.\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_shia_leads:0 "$nesnd_per_faith_current_faith$ The Shia faith leads in influence.\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_sunni_leads:0 "$nesnd_per_faith_current_faith$ The Sunni faith leads in influence.\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_buddhist_leads:0 "$nesnd_per_faith_current_faith$ Buddhism leads in influence.\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_none:0 "$nesnd_per_faith_current_faith$\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith.1.t:0 "Conversions"
 nesnd_per_faith.1.d_shia:0 "In [SCOPE.sState('nesnd_per_faith_conv_state').GetName] another group of households has walked into the Shia mosques. Some followed their neighbours, some hoped for a post from the men in the pulpit, and some simply felt that the scripture there had 'a warmer sound'."
 nesnd_per_faith.1.d_sunni:0 "In [SCOPE.sState('nesnd_per_faith_conv_state').GetName] another group of households has taken up the Sunni rite. Wherever the court's rite is written, those seeking office follow."
 nesnd_per_faith.1.d_buddhist:0 "In [SCOPE.sState('nesnd_per_faith_conv_state').GetName] another group of households has set a Buddha in the hall. The Tang temples hand out gruel and medicine, and preach charity and relief for all. The more people they help, the more people believe."
 nesnd_per_faith.1.f:0 "“Another group of households in [SCOPE.sState('nesnd_per_faith_conv_state').GetName] has changed faith this season. Their number has been entered in the register.”\n- Quarterly report of the local governor"
 nesnd_per_faith.1.a:0 "Every heart finds its own home."
 nesnd_per_faith_invalid_tt:0 "The Tang no longer rule"
 nesnd_per_faith_invalid_conclusion:0 "The rise and fall of the faiths is no longer for a Tang court to weigh."
