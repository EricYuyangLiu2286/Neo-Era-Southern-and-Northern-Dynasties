 nesnd_per_faith_adopt_shia_desc:0 "Put the mosque pulpit on the court's side, and the Persians lose one reason to hate the Tang."
 nesnd_per_faith_adopt_sunni:0 "Adopt Sunni Islam"
 nesnd_per_faith_adopt_sunni_desc:0 "The Li sovereigns took the throne by Sunni rite, and the court's [concept_legitimacy] is written in that rite."
 nesnd_per_faith_adopt_buddhist:0 "Adopt Buddhism"
 nesnd_per_faith_adopt_buddhist_desc:0 "The Tang brought their Buddhas west. Two centuries later there are more of them in homes than in temples."
