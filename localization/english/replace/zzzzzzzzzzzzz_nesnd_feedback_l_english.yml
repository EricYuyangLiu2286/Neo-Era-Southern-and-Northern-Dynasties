 nesnd_great_han_name:0 "Great Han"
 nesnd_great_han_adj:0 "Han"
 nesnd_postwar_sih_title:0 "The Army of Shu Enters Nanjing"
 nesnd_postwar_sih_desc:0 "Nanjing is in our hands, and the Zheng court can no longer hold the south together. Shu rose against Wu; victory has now placed the succession before its ruler. Some urge the return of the Ming sovereign. Others would have the Prince of Shu establish a Han dynasty of his own."
 nesnd_postwar_hna_title:0 "The Debate in Nanjing"
 nesnd_postwar_hna_desc:0 "The army of Xiangyang marched south under the banner of restoring Ming. The Assembly of Rites and the provinces now await a decision on the government. Restoring the Zhu would renew the dynasty’s authority, but republicans refuse to entrust the country to another ruling house. The gentry’s distrust of a republic has survived the fall of Zheng power."
 nesnd_postwar_gng_title:0 "The Zhu Restore Ming Rule"
 nesnd_postwar_gng_desc:0 "The ruling house of Huai bears the Zhu imperial lineage. With Nanjing secured, the court petitions its prince to take the imperial title and restore Ming authority. The divisions left by war remain, and the Assembly of Rites and the provinces will judge the restored court by what follows."
 nesnd_postwar_restore_ming_option:0 "Recall the Zhu and restore the Ming court."
 nesnd_postwar_restore_ming_tt:0 "Recall the deposed Ming emperor or his lawful heir first. If no eligible living royal can be found, establish a new dynast from the documented family line and restore the Ming name. Foreign sovereigns and heirs are not seized."
 nesnd_postwar_great_han_option:0 "Let the house of Han rise again."
 nesnd_postwar_great_han_tt:0 "Adopt the name Great Han, retaining our current sovereign."
 nesnd_postwar_hna_republic_option:0 "The country belongs to no ruling house."
 nesnd_postwar_hna_republic_tt:0 "Establish a republic. Sections of the gentry will resist its authority, while republican influence among the intelligentsia and urban middle classes grows."
 nesnd_postwar_gng_option:0 "Raise the Prince of Huai to the Ming throne."
 nesnd_postwar_gng_tt:0 "Restore Ming under Huai’s own Zhu line. If no eligible dynast of that branch survives, establish a new member following its documented generation names."
 nesnd_postwar_wait_option:0 "The succession must be considered again."
 nesnd_postwar_wait_tt:0 "No eligible living successor is available. Leave the constitution and ruler unchanged for now."
 nesnd_hna_republic_gentry_opposition:0 "Gentry Resistance to the Republic"
