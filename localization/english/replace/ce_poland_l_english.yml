 ce_poland_events.1.t: "Poland Claims Our Territory"
 ce_poland_events.1.d: "The Polish delegation in Krakow has submitted a memorandum to us. On the surface, they respect the 1829 accord regarding the Polish 'provisional autonomous territory,' but between the lines, their deep resentment is evident. They claim their Polish territories are being oppressed, hinting that the 1829 settlement was merely the great powers' expedient masquerade. This challenges not only our territorial holdings but the legitimacy of the entire compromise framework. We must weigh our relationship with the Krakow regime against the attitudes of other great powers."
 ce_poland_events.1.f: "Damn the Poles! Isn't the accord of 1829 good enough for them? If they want true independence, let the Russians and Austrians deal with them. Or perhaps... we could show them what true independence actually entails."
 ce_poland_events.1.a: "Make concessions. Maintain order and preserve compromise with the great powers."
 ce_poland_events.1.b: "Take a firm stand. Demonstrate our support for Polish self-determination, regardless of what the great powers think."

 ce_poland_events.2.t: "Poland's Final Ultimatum"
 ce_poland_events.2.d: "Intelligence from Warsaw brings shocking news. The Polish leadership has finally abandoned the pretense of the 1829 settlement and issued an ultimatum to the great powers: either recognize Poland as a sovereign nation or face armed conflict. This is not merely a provincial's challenge to empires—it questions the entire 1829 framework. The conservative great powers will inevitably respond. We face a stark historical choice: whether to support Poland's self-determination, knowing it means standing against most of Europe."
 ce_poland_events.2.f: "'The Poles have lost their minds,' our foreign minister reports. 'They thought the chaos in the East gave them an opportunity. Perhaps they were right. But at what cost does European need to pay for a Polish justice?'"
 ce_poland_events.2.a: "Retreat. Preserve order and suggest Poland abandon its independence ambitions."
 ce_poland_events.2.b: "Support Poland! Even in opposition to most of Europe, an independent Poland is worth this price!"
 ce_poland_betray_your_commitment: "Betray Your Commitment"
 ce_peaceful_vote_for_polish: "Rushed Annexation"
 ce_loss_of_international_status: "Concede on the Territorial Question"

 ce_poland_events.3.t: "Poland Restored"
 ce_poland_events.3.d: "Poland's independence breakthrough transformed the 1829 settlement beyond recognition. This nation, long suppressed by the great powers, has finally achieved sovereignty through blood and resistance. Krakow is now a true capital, not a provincial administrative seat. This breakthrough does not merely change Poland's future—it sends a clear message to all of Europe: the force of national self-determination has become unstoppable. The age of complete suppression by concert and compromise is ending. A new Europe is taking shape, with Poland as the vanguard of this transformation. This decision will inevitably provoke the wrath of the conservative powers, but Poland's revival is now irreversible."
 ce_poland_events.3.f: "Poland lives! Her children have awakened from the grave of great power dominance, and her flag flies over Warsaw in freedom—on this day, all of Europe heard the voice of a newly liberated nation."
 ce_poland_events.3.a: "Poland is free. The old era has ended, and a new one begins."

 ce_poland_events.4.t: "Enemy's Counterattack"
 ce_poland_events.4.d: "Our security apparatus has uncovered a hidden conspiracy. Agents from #bold [SCOPE.sCountry('ce_from_country').GetName] #! have been secretly funding radical factions and dissidents in our country under the guise of 'maintaining order,' attempting to destabilize us from within. Those hostile to Polish independence cannot tolerate us supporting their ambitions. Other great powers are coordinating with them—together they are applying coordinated military and economic pressure against our supporters. This is not merely targeting Poland; it serves as a warning to all states that dare break the 1829 framework."
 ce_poland_events.4.a: "Strengthen internal security and expose these activities. This is an attack on our independence."
 lost_progress_ce_poland_war: "[SCOPE.sCountry('ce_to_country').GetName]: Reclaim and war related [concept_journal_entry] progress #R lost significantly#!" 

 ce_poland_events.5.t: "The Cost of Supporting Poland"
 ce_poland_events.5.d: "We attempted to exploit the Eastern chaos to pressure those opposed to Polish independence, hinting that we would coordinate with Oriental powers if they did not respect Polish sovereignty. But we miscalculated. The great powers opposed to Polish independence have formed a unified alliance. The Polish forces we armed collapsed under coordinated pressure from multiple empires. The cost of backing Polish independence may be far heavier than we initially calculated."
 ce_poland_events.5.a: "This gamble failed. We underestimated the determination of the great powers to maintain order."
 ce_poland_events.5.f: "“Have you seen that Polish shopkeeper lately? I got trouble with my drinks you know.”\n\n“I saw him last Tuesday, he was walking down to an alleyway...”"

 ce_poland_events.6.t: "The European Military Competition"
 ce_poland_events.6.d: "The Polish Question has become the justification for every great power's military expansion. Our army leadership unanimously calls for increased defense spending. Whether constructing steelworks, establishing arms factories, or building explosives plants—all these industrial facilities are now viewed as essential for confronting the future wars unleashed by Poland's independence. Each choice represents a strategic judgment on coming conflicts. And our decision will shape the entire European arms race trajectory."
 ce_poland_events.6.f: "'Poland has opened Pandora's Box,' our military advisor warns. 'Russia is increasing its standing army, Austria is upgrading artillery, Britain is strengthening its navy. If we don't proceed with military modernization immediately, we will be hopelessly outmatched when the moment arrives.'"
 ce_poland_events.6.a: "Construct a Steel Mill—strengthen our industrial base for future warfare."
 ce_poland_events.6.b: "Construct an Arms Factory—ensure our military equipment quality."
 ce_poland_events.6.c: "Construct an Explosives Plant—enhance our artillery advantage."

 ce_poland_events.7.t: "[SCOPE.sCountry('ce_from_country').GetCapital.GetName] Breaks the Stalemate"
 ce_poland_events.7.d: "[SCOPE.sCountry('ce_claim_state_target').GetCapital.GetName] has long occupied part of what the Poles call Polish territory. We have tried to undermine its rule there to serve our strategic aims in Eastern Europe. But when war is truly at the doorstep, are we genuinely prepared for prolonged confrontation with [SCOPE.sCountry('ce_claim_state_target').GetCapital.GetName]?"
 ce_poland_events.7.f: "'...The purpose of this conference is to establish a treaty framework that does not begin from a state of war, not to proclaim a Pax et treuga Dei...' - French Regent Joseph Charles Bonaparte, Krakow, 1829"
 ce_poland_events.7.a: "We will not pull chestnuts from the fire for [SCOPE.sCountry('ce_from_country').GetCapital.GetName]."
 ce_poland_events.7.b: "Notify the military to prepare. Europe is heading for war."

