 ce_poland_events.12.t: "The Polish Problem Invalidated"
 ce_poland_events.12.d: "The Polish Question is now defunct. Whether due to new developments in the East, shifts in the balance of power among European great powers, or the final collapse of the 1829 framework, Poland ceased to be the pivotal issue of European politics. All those who fought for Polish independence, all those who opposed it, discovered their efforts have become obsolete. Europe has entered a new era, and Poland has become merely a footnote in the margin of this age. The great powers have redirected their gaze elsewhere, and the Polish Question is no longer worth historical attention."
 ce_poland_events.12.a: "An era has ended. History moves on without sentiment."

 ce_poland_events.13.t: "Support From the Friends"
 ce_poland_events.13.d: "Recently, diplomats and overseas military personnel from [SCOPE.sCountry('ce_strong_power').GetName] made secret contact with representatives of Poles abroad, providing a concentrated wave of funding and intelligence support to the Polish national movement."
 ce_poland_events.13.f: "“Take this, and this as well. These are all for your personal protection, so you must not use them for any dangerous activities! Especially not against... certain people. It would be most unfortunate to cause an international incident,” said the mysterious man in a suit, speaking with a [SCOPE.sCountry('ce_strong_power').GetName] accent, to a Polish radical."
 ce_poland_events.13.a: "An era has ended. History marches forward without mercy."
 ce_poland_events.13.b: "Story of the past"
 ce_this_is_a_bug: "This is a bug"

 ce_poland_events.97.t: "Shadows in the Europe"
 ce_poland_events.97.d: "In 1828, as Napoleon the Great fell ill and could no longer govern, his eldest son François was appointed regent by the Senate, later became the Emperor François I after his father's death. Thus the age called the 'Napoleonic' came to an end. The empire without its emperor teetered on the edge of collapse. But unexpectedly, the Roman King proved diplomatically capable, and with his councilors' assistance, stabilized the realm. For a time, the tension across Europe eased by a series of conferences in autumn 1829. What emerged from these conferences was a system known as the 'Polish Consensus.' Its purpose was to finally resolve the deeply disputed Eastern European-Polish question (by establishing a Polish state centered on Krakow rather than Warsaw), while uniting European powers against the world empire of the East. However, as Kaifeng and Nanjing fell into successive crises and François I died in his prime, European powers' pressure suddenly lessened, and their hidden divisions resurfaced. Around this Eastern European Polish state, new clouds of war began to gather slowly."
 ce_poland_events.97.a: "Polish rise benefits Eastern European balance of power."
 ce_poland_events.97.b: "There is no Polish problem."
 ce_poland_events.97.c: "Long live our nation state!"
 ce_poland_events.97.f: "'Hereafter, the fate of the European shall no longer rest upon the will of European nations, but rather upon Nanjing and Paris......' - Prince Metternich, Moscow, 1829"
 ce_poland_events.97.a.tt: "Remove all polish related [concept_claim] in your states"

