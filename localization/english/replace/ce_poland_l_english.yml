 ce_poland_events.10.t: "The Polish Victory"
 ce_poland_events.10.d: "Poland's breakthrough from the constraints of the 1829 settlement represents a rupture in the post-Napoleonic European order. A nation long suppressed by the great powers has finally achieved sovereignty through armed struggle. Krakow is no longer a provincial seat but a true capital of a sovereign state. This breakthrough signals not only Poland's transformed future but proclaims to all Europe: when the great powers' united front to maintain order shows cracks, the force of national self-determination becomes unstoppable. An old era has ended, and a new Europe is forming, with Poland as a harbinger of this coming age."
 ce_poland_events.10.a: "Poland has achieved independence. An old era has ended; a new one begins."

 ce_poland_events.11.t: "The Polish Failure"
 ce_poland_events.11.d: "Poland's independence dream was crushed under the united pressure of the great powers. Though the 1829 settlement was controversial, time proved its viability—whenever Europe's power brokers unite to maintain order, no force of national self-determination can overcome their united opposition. The Poles awoke from their brief independence fever only to discover themselves once again in the shadow of empires. This second defeat did not merely shatter the Polish restoration movement; it demonstrated that in an era when the great powers close ranks, the path to independence has been sealed shut. Poland's fate is again decided by the concert of great powers."
 ce_poland_events.11.a: "The dream was crushed by the united pressure of empires. History once again chose order over freedom."
