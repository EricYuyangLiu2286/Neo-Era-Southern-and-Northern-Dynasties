l_english:
 amendment_nesnd_cne_estate_ownership:0 "Military Estates Ownership Act"
 amendment_nesnd_cne_estate_ownership_desc:0 "Battalions and divisions may hold land in their own right, either where they are stationed or in their officers’ home districts. All proceeds from these estates, in town and countryside alike, belong to the unit."
 amendment_nesnd_cne_chartered_districts:0 "Chartered Military Districts"
 amendment_nesnd_cne_chartered_districts_desc:0 "In recognition of the army’s reliance on strategic districts and recruiting grounds, the government grants their garrisons the right to retain local tax receipts and appoint the officials who administer these districts."
 lawgroup_nesnd_cne_estate_rights:0 "Military Estate Rights"
 lawgroup_nesnd_cne_estate_rights_desc:0 "$law_nesnd_cne_estate_rights_desc$"
 law_nesnd_cne_estate_rights:0 "Military Estate Privileges"
 law_nesnd_cne_estate_rights_desc:0 "Military units hold chartered rights to estate revenues, local tax receipts and appointments to district offices."
 ideology_nesnd_cne_estate_rights:0 "Military Estate Interests"
 ideology_nesnd_cne_estate_rights_desc:0 "This group supports military ownership of estates and the right of chartered garrisons to retain local taxes and appoint district officials."
 nesnd_cne_estate_settlement:0 "Twenty-Year Military Estates Settlement"
 nesnd_cne_estate_settlement_desc:0 "For the duration of the settlement the government may neither change its land reform or army model laws nor repeal the two military estate amendments."
 nesnd_cne_estate_settled_tt:0 "The government has concluded the #bold $nesnd_cne_estate_settlement$#! with the army"
 nesnd_cne_estate_lock_tt:0 "The #v 20#!-year military estates settlement must expire before either law can be changed or either amendment repealed."
 nesnd_cne_estate_settlement_tt:0 "[GetLawType('law_tenant_farmers').GetName] carries the [GetAmendmentType('amendment_nesnd_cne_estate_ownership').GetName], and [GetLawType('law_professional_army').GetName] carries [GetAmendmentType('amendment_nesnd_cne_chartered_districts').GetName]. Both amendments have the support of the $ig_armed_forces$ and the $ig_landowners$. Neither law can be changed and neither amendment can be repealed for #v 20#! years."
