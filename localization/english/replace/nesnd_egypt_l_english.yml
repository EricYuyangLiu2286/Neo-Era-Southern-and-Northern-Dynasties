l_english:
 nesnd_egypt_independence:0 "The Price of Independence"
 nesnd_egypt_independence_reason:0 "The agreement of 1825 recognised Egypt's independence from Ottoman rule, and six powers guaranteed it in return for the right to invest along the Nile. The court won a breathing space, but its workshops, schools and army came to lean on foreign money and expertise.\n\nAn investment partner brings machines, teachers and new industries. Yet the more the foreigners own, the less Egypt can decide for itself. This is how it must live for thirty years."
 nesnd_egypt_with_investor_status:0 "Selected partner: [ROOT.GetCountry.MakeScope.Var('nesnd_egypt_investor').GetCountry.GetName]. Foreign share of the economy: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]."
 nesnd_egypt_without_investor_status:0 "No single power holds Egypt’s investment commitment. Foreign share of the economy: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]."
 nesnd_egypt_with_investor_cooldown_status:0 "$nesnd_egypt_with_investor_status$\nYou can choose an investment partner again twelve months after your last choice."
 nesnd_egypt_without_investor_cooldown_status:0 "There is currently no investment partner. Foreign share of the economy: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1].\nYou can choose an investment partner again twelve months after your last choice."
 nesnd_egypt_investment_accounts:0 "Schools and Workshops on the Nile"
 nesnd_egypt_investment_accounts_reason:0 "Egypt needs people who can build, repair and operate machinery. Graduates need workshops in which to practise their skills, and toolmakers need workers able to use their products. The government hopes foreign investment will establish industries that can eventually train and employ their own specialists."
