 nesnd_egypt_protectorate_desc:0 "Egypt retains its government and external diplomacy under the obligations of a protectorate settlement."
 nesnd_egypt_protectorate_pact_desc:0 "Egypt accepts the protection of its investment partner."
 nesnd_egypt.1.t:0 "A Generation of Independence"
 nesnd_egypt.1.d:0 "Thirty years have passed, and Egypt has kept its own government and its own foreign policy. Foreign merchants still trade along the Nile, and the powers have not given up their schemes here, but Egypt's affairs have never been theirs to decide."
 nesnd_egypt.1.a:0 "Let the next generation inherit it."
 nesnd_egypt.2.t:0 "The Protectorate Settlement"
 nesnd_egypt.2.d:0 "Egypt has accepted its investment partner's protection. The foreign power that supported our workshops, army and schools now has a say in the country's affairs. Our government will continue to administer Egypt, but its foreign policy must respect the protectorate agreement."
 nesnd_egypt.2.a:0 "Recognize the settlement."
 nesnd_egypt.3.t:0 "The Guarantee Fails"
 nesnd_egypt.3.d:0 "The government can no longer sustain the independence settlement, yet no investment partner can provide protection. Foreign industries and assets remain, but the guarantees have failed. Those in power must now face discontent at home and pressure from abroad without that support."
 nesnd_egypt.3.a:0 "This burden is ours alone to bear."
 nesnd_egypt.4.t:0 "Egypt's Engineers and Workers"
 nesnd_egypt.4.d:0 "Graduates of the university are entering the workshops, and the toolmakers and new industries now have a steady workforce. In the building still to come, more and more of the engineers and workers will be Egyptians."
 nesnd_egypt.4.a:0 "Keep training our own specialists."
 subject_type_nesnd_egypt_protectorate_desc:0 "Egypt retains its government while accepting obligations to its protector under the settlement."
 nesnd_egypt_protectorate_action_name:0 "Protectorate"
 nesnd_egypt_protectorate_action_propose_name:0 "Establish a Protectorate"
 nesnd_egypt_protectorate_action_notification_name:0 "$protectorate_action_notification_name$"
 nesnd_egypt_protectorate_action_notification_desc:0 "$protectorate_action_notification_desc$"
 nesnd_egypt_protectorate_action_break_name:0 "End the Protectorate"
 nesnd_egypt_protectorate_action_notification_break_name:0 "Protectorate Ended"
 nesnd_egypt_protectorate_action_notification_break_desc:0 "The protectorate agreement has ended. Both countries are released from the obligations of that relationship."
 nesnd_egypt.3.unworkable:0 "Our investment partner remains, but the protectorate agreement could not be established. The government sought support at home on the strength of that guarantee. It must now face Egypt's difficulties without it."
 nesnd_egypt.6.t:0 "Independence Ends Elsewhere"
 nesnd_egypt.6.d:0 "Egypt now answers to another overlord, bringing the former investment arrangement to an end. The new subject relationship will shape the government's authority at home and abroad."
 nesnd_egypt.6.a:0 "Face the new circumstances."
