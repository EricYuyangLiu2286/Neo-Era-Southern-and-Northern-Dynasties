l_english:
 nesnd_crisis.30.local:0 "Land commissioners in [SCOPE.sState('nesnd_land_petition_state').GetName] have surveyed the countryside under the new law, yet several local military estates still collect rent under the old rules. Farmers who have paid the redemption price are told by their old masters that their fields remain military property and that the dues must be paid. Teachers who helped draft their petitions have been arrested for concealing property.\n\nThe deeds submitted by the affected counties contradict the garrison registers. The provincial governor seeks authority to review the cases, while the commissioners ask the court to send troops to recover the withheld records. As the dispute drags on, farmers gather in the county towns, awaiting an answer from the government that promised to free them."
 nesnd_federal_compact_button_alt_desc:0 "Reform has carried the Southern realm beyond the old order of military fiefs, while Hangzhou still commands the troops and revenues needed to sustain it. The time has come for a new dynasty. We should first seek the consent of the provinces and overseas states, then bring appointments, taxation, military funding, provincial powers and the position of the Zhu house before the Assembly of Rites and cabinet. A constitution defining the powers of sovereign and assembly will lay the foundations of Zheng rule."
 nesnd_south_reconsider_tt:0 "Restart the #v 12-month#! period of continuous fulfilment."
 nesnd_per.4.d_unavailable:0 "The government has chosen expansion to the west, but the proposed tributary arrangement with Ili has not taken effect. Commanders and merchants can still pursue a western policy, drawing on the troops, revenues and support presently available."
