l_english:
 nesnd_it_offer_effect_tt:0 "Send a proposal for joint funding. The other state may accept, propose schools instead, or decline. Funding begins only by mutual agreement. The offer expires after #v 90 days#!."
 nesnd_it_end_mutual_tt:0 "End both states’ obligations without credit for fulfilment. Existing payments run to the end of their term. Both states must wait #v 12 months#! before negotiating again."
 nesnd_it_end_local_tt:0 "Close our remaining obligations. Existing payments run to the end of their term. We must wait #v 12 months#! before negotiating again."
 nesnd_it_project_site_missing_tt:0 "Funding requires an inhabited project site in our Italian territory."
 nesnd_it_counteroffer_tt:0 "Ask the proposing state to meet the accord through schools instead. It may accept or decline before either side commits funds."
 nesnd_it_refuse_tt:0 "End these talks. Both countries must wait #v 12 months#! before negotiating again."
 nesnd_it_compact_active:0 "Our accord with [ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName] is in force. Our services have met its terms for #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_compact_months')|0] / 3#! consecutive months. The accord is complete when both states reach three months."
 nesnd_it_compact_broken:0 "Our partner is no longer bound by the accord. The government may close its remaining obligations."
 nesnd_it_compact_sent:0 "Terms have been sent to [ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName]. Agreement is still pending."
 nesnd_it_compact_received:0 "The government is considering terms proposed by [ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_incoming').GetCountry.GetName]."
 nesnd_it_foundations_active:0 "Funding for $nesnd_c2_italy_foundations$ is under way. The selected project must meet its operating terms for three consecutive months."
 nesnd_it_budget_active:0 "Funding for the common budget is under way. The selected project must meet its operating terms for three consecutive months."
 nesnd_it_compact_ready:0 "The first programme is complete. The government can seek a funding accord with another Italian state."
 nesnd_it_foundations_choose:0 "Choose a first programme: military works, commercial credit or locally financed schools."
 nesnd_it_compact_unavailable:0 "The government cannot open talks on a new accord at present."
