l_english:
 nesnd_it_offer_effect_tt:0 "Send a proposal for joint funding. The other state may accept, propose schools instead, or decline. Funding begins only by mutual agreement. The offer expires after #v 90 days#!."
 nesnd_it_end_mutual_tt:0 "End both states’ obligations without credit for fulfilment. Existing payments run to the end of their term. Both states must wait #v 12 months#! before negotiating again."
 nesnd_it_end_local_tt:0 "Close our remaining obligations. Existing payments run to the end of their term. We must wait #v 12 months#! before negotiating again."
 nesnd_it_project_site_missing_tt:0 "Funding requires an inhabited project site in our Italian territory."
 nesnd_it_counteroffer_tt:0 "Ask the proposing state to meet the accord through schools instead. It may accept or decline before either side commits funds.\n$nesnd_it_terms_school$"
 nesnd_it_refuse_tt:0 "End these talks. Both countries must wait #v 12 months#! before negotiating again."
 nesnd_it_compact_active:0 "Accord with [ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName].\nOur service state: [ROOT.GetCountry.GetCustom('nesnd_it_home_site')]. Their service state: [ROOT.GetCountry.GetCustom('nesnd_it_peer_site')].\n[ROOT.GetCountry.GetCustom('nesnd_it_service_buildings')]\nOur consecutive months: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_compact_months')|0] / 3#!. Theirs: #v [ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.MakeScope.ScriptValue('nesnd_c2_compact_months')|0] / 3#!. The accord is fulfilled when both reach three. [ROOT.GetCountry.GetCustom('nesnd_it_monthly_link')]"
 nesnd_it_compact_broken:0 "Our partner is no longer bound by the accord. The government may close its remaining obligations."
 nesnd_it_compact_sent:0 "Terms have been sent to [ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName]. Agreement is still pending."
 nesnd_it_compact_received:0 "The government is considering terms proposed by [ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_incoming').GetCountry.GetName]."
 nesnd_it_foundations_active:0 "$nesnd_project_italy_foundations_summary$See $nesnd_c2_italy_foundations$ for each [concept_nesnd_operating_requirements] check."
 nesnd_it_budget_active:0 "$nesnd_project_italy_common_budget_summary$See $nesnd_c2_italy_common_budget$ for each [concept_nesnd_operating_requirements] check."
 nesnd_it_compact_ready:0 "The first programme is complete. The government can seek a funding accord with another Italian state."
 nesnd_it_foundations_choose:0 "Choose a first programme: military works, commercial credit or locally financed schools. Choose the plan and its project state under $nesnd_c2_italy_agenda$."
 nesnd_it_compact_unavailable:0 "No new accord is available. Both parties must be eligible Italian countries at peace with one another, with no outstanding request, current accord or negotiating cooldown. A completed partnership cannot be counted twice."
