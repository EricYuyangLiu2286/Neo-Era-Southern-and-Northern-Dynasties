 nesnd_west_trade_order_status_1:0 "\n[GetGlobalVariable('nesnd_west_trade_seller_1').GetCountry.GetName] will sell about #v [GetGlobalVariable('nesnd_west_trade_amount_1').GetValue|0]#! [GetGlobalVariable('nesnd_west_trade_culture_1').GetCulture.GetName] people from [GetGlobalVariable('nesnd_west_trade_source_1').GetState.GetName], to be shipped to [GetGlobalVariable('nesnd_west_trade_dest_1').GetState.GetName] in [GetGlobalVariable('nesnd_west_trade_buyer_1').GetCountry.GetName]."
