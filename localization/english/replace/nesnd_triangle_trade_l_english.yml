l_english:
 geographic_region_nesnd_north_triangle:0 "the Northern Seas"
 geographic_region_nesnd_west_triangle:0 "the Western Seas"

 nesnd_north_triangle_trade:0 "The Northern Seas Triangle Trade"
 nesnd_north_triangle_trade_reason:0 "The farm colonies of Dongzhou and the mines of Yuannan are always short of hands. From the Sea of Okhotsk to the Southern Seas, ship owners buy indebted tenants, bonded labourers and frontier tribespeople from local officials in every port. The selling government's treasury is paid per consignment. Once the cargo is landed, these people are slaves.\n\nThe laws and customs of every state protect the peoples of the Sinosphere from this trade, with the exception of the Jurchens. No country sells or buys people of its own primary cultures. Japan may trade in Japanese and Koreans, Denglai may trade in Liaodong people, and countries that only sell may sell Japanese. Russia does not trade in Slavs.\n\nA participant must have a port, or a neighbour whose port it can use, and must not have banned slavery. When every country of the region has banned slavery, researched Human Rights or lost its ports, the route closes for good."

 nesnd_west_triangle_trade:0 "The Western Seas Triangle Trade"
 nesnd_west_triangle_trade_reason:0 "European ships exchange cloth, firearms and spirits on the coasts of Guinea and Angola for captives taken by the kingdoms there, and carry them to the plantations of the Caribbean, Brazil and the American South. Corsairs of the Barbary coast seize European sailors and sell them to remote farms in the New World that will pay for them. European countries also send their own poor of discriminated groups to the colonies as indentured labourers. The selling government's treasury is paid per consignment.\n\nCountries in Europe and North Africa may buy or sell. Countries in the Americas only buy. Countries south of the Sahara only sell. No country sells or buys people of its own [concept_primary_cultures], and a seller may only sell people of a [concept_culture] discriminated against in its own country.\n\nA participant must have a port, or a neighbour whose port it can use, and must not have banned slavery. When every country of the region has banned slavery, researched Human Rights or lost its ports, the route closes for good."

 nesnd_north_trade_bar:0 "Next Consignment"
 nesnd_north_trade_bar_desc:0 "$nesnd_north_trade_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_west_trade_bar:0 "Next Consignment"
 nesnd_west_trade_bar_desc:0 "$nesnd_west_trade_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"

 nesnd_north_trade_order_status:0 "Next sale: [GetGlobalVariable('nesnd_north_trade_source').GetState.GetOwner.GetName] will sell about #v [GetGlobalVariable('nesnd_north_trade_amount').GetValue|0]#! [GetGlobalVariable('nesnd_north_trade_pop').GetPop.GetCulture.GetName] people from [GetGlobalVariable('nesnd_north_trade_source').GetState.GetName], to be shipped to [GetGlobalVariable('nesnd_north_trade_dest').GetState.GetName] in [GetGlobalVariable('nesnd_north_trade_dest').GetState.GetOwner.GetName]."
 nesnd_west_trade_order_status:0 "Next sale: [GetGlobalVariable('nesnd_west_trade_source').GetState.GetOwner.GetName] will sell about #v [GetGlobalVariable('nesnd_west_trade_amount').GetValue|0]#! [GetGlobalVariable('nesnd_west_trade_pop').GetPop.GetCulture.GetName] people from [GetGlobalVariable('nesnd_west_trade_source').GetState.GetName], to be shipped to [GetGlobalVariable('nesnd_west_trade_dest').GetState.GetName] in [GetGlobalVariable('nesnd_west_trade_dest').GetState.GetOwner.GetName]."
 nesnd_triangle_trade_no_order_status:0 "Next sale: no deal can currently be arranged. If there is still none when the bar fills, the sale fails."

 nesnd_north_trade_last_done:0 "\nLast sale completed: #v [GetGlobalVariable('nesnd_north_trade_last_moved').GetValue|0]#! people reached their destination as slaves; #v [GetGlobalVariable('nesnd_north_trade_last_dead').GetValue|0]#! died on the way."
 nesnd_west_trade_last_done:0 "\nLast sale completed: #v [GetGlobalVariable('nesnd_west_trade_last_moved').GetValue|0]#! people reached their destination as slaves; #v [GetGlobalVariable('nesnd_west_trade_last_dead').GetValue|0]#! died on the way."
 nesnd_triangle_trade_last_no_order:0 "\nLast sale #r failed#!: no deal was available."
 nesnd_north_trade_last_no_slavery:0 "\nLast sale #r failed#!: slavery is not permitted in [GetGlobalVariable('nesnd_north_trade_failed_dest').GetState.GetName], [GetGlobalVariable('nesnd_north_trade_failed_dest').GetState.GetOwner.GetName]."
 nesnd_west_trade_last_no_slavery:0 "\nLast sale #r failed#!: slavery is not permitted in [GetGlobalVariable('nesnd_west_trade_failed_dest').GetState.GetName], [GetGlobalVariable('nesnd_west_trade_failed_dest').GetState.GetOwner.GetName]."

 nesnd_triangle_trade_base_row:0 "Ship owners buying people in every port"
 nesnd_triangle_trade_law_row:0 "Participants with [GetLawType('law_slave_trade').GetName] or [GetLawType('law_colonial_slavery').GetName]"
 nesnd_triangle_trade_navy_row:0 "Participants with [GetLawType('law_merchant_navy').GetName]"

 nesnd_north_trade_end_tt:0 "Every country in the Northern Seas with people to sell has banned slavery, researched Human Rights or has no port"
 nesnd_west_trade_end_tt:0 "Every country in the Western Seas with people to sell has banned slavery, researched Human Rights or has no port"
 nesnd_north_trade_end_conclusion:0 "No more slave ships sail the Northern Seas."
 nesnd_west_trade_end_conclusion:0 "No more slave ships sail the Western Seas."
 nesnd_triangle_trade_end_effect_tt:0 "This trade ends #bold permanently#!. It will not resume even if countries restore slavery."

 nesnd_triangle_buy:0 "Buy Slaves"
 nesnd_triangle_buy_desc:0 "We order people from the sellers on this route and assign them to our states where slavery is lawful. For each consignment the seller collects a price equal to three weeks of our fixed income. Our tax income is reduced by #r 2.5%#! for two and a half years, with the term restarting on every new consignment.\n\nWhile we are buying, we cannot also sell people."
 nesnd_triangle_sell:0 "Sell Slaves"
 nesnd_triangle_sell_desc:0 "We sell poor, illiterate people from our states to the buyers on this route. For each consignment the treasury collects a price equal to three weeks of the buyer's fixed income.\n\nWhile we are selling, we cannot also buy people."
 nesnd_triangle_none:0 "Suspend Trade"
 nesnd_triangle_none_desc:0 "The government stops buying and selling people on this route for now, and may resume at any time. The consignment already arranged through us will not be delivered when it falls due."
 nesnd_triangle_import:0 "$nesnd_triangle_buy$"
 nesnd_triangle_import_desc:0 "We order people from the sellers on this route and assign them to our states where slavery is lawful. For each consignment the seller collects a price equal to three weeks of our fixed income. Our tax income is reduced by #r 2.5%#! for two and a half years, with the term restarting on every new consignment."
 nesnd_triangle_export:0 "$nesnd_triangle_sell$"
 nesnd_triangle_export_desc:0 "We sell poor, illiterate people from our states to the buyers on this route. For each consignment the treasury collects a price equal to three weeks of the buyer's fixed income."
 nesnd_triangle_refuse:0 "$nesnd_triangle_none$"
 nesnd_triangle_refuse_desc:0 "$nesnd_triangle_none_desc$"
 nesnd_triangle_not_buying_tt:0 "We have not yet ordered people on this route"
 nesnd_triangle_not_selling_tt:0 "We are not yet selling people on this route"
 nesnd_triangle_trading_tt:0 "We are buying or selling people on this route"
 nesnd_triangle_to_buying_tt:0 "The government begins #bold ordering people#! on this route. Those shipped here will be slaves in our states where slavery is lawful."
 nesnd_triangle_to_selling_tt:0 "The government begins #bold selling#! its poor to the buyers on this route."
 nesnd_triangle_to_none_tt:0 "The government #bold suspends#! the trade in people on this route."

 nesnd_triangle_trade_credit:0 "Slave Purchases"
 nesnd_triangle_trade_credit_desc:0 "We have recently bought slaves through the triangle trade."

 nesnd_triangle_trade.1.t:0 "A Consignment Leaves Port"
 nesnd_triangle_trade.1.d:0 "A consignment of [SCOPE.sCulture('nesnd_tt_culture').GetName] people has been marched aboard in [SCOPE.sState('nesnd_tt_source').GetName], bound for [SCOPE.sState('nesnd_tt_dest').GetName] in [SCOPE.sCountry('nesnd_tt_buyer').GetName]. #v [SCOPE.GetValue('nesnd_tt_dead')|0]#! died on the way, and the #v [SCOPE.GetValue('nesnd_tt_moved')|0]#! who arrived are now slaves there. The local office counted them out by head, and the price of @money!#v [SCOPE.GetValue('nesnd_tt_price')|0]#! has been paid into the treasury."
 nesnd_triangle_trade.1.a:0 "Enter it in the accounts."
 nesnd_triangle_trade.2.t:0 "A Consignment Arrives"
 nesnd_triangle_trade.2.d:0 "A consignment from [SCOPE.sState('nesnd_tt_source').GetName] in [SCOPE.sCountry('nesnd_tt_seller').GetName] has been landed at [SCOPE.sState('nesnd_tt_dest').GetName]. #v [SCOPE.GetValue('nesnd_tt_moved')|0]#! [SCOPE.sCulture('nesnd_tt_culture').GetName] people have been handed over to local owners as slaves; another #v [SCOPE.GetValue('nesnd_tt_dead')|0]#! died on the way. Our tax income is reduced by #r 2.5%#! for the next two and a half years."
 nesnd_triangle_trade.2.a:0 "Take the consignment ashore."

 nesnd_triangle_trade.10.t:0 "The End of the Northern Seas Trade"
 nesnd_triangle_trade.10.d:0 "No port along the Northern Seas will take the cargo any longer, and no government will let the ships sail. Ship owners have pulled the iron rings from their holds to carry coal and tea, and the brokers of the trade have scattered along the docks in search of other work.\n\nThe people sold abroad have not come home. They still labour in the farm colonies of Dongzhou, the mines of Yuannan and the plantations of the Southern Seas. When they will be free is for the laws of the countries they live in to decide."
 nesnd_triangle_trade.10.a:0 "The route is closed."
 nesnd_triangle_trade.11.t:0 "The End of the Western Seas Trade"
 nesnd_triangle_trade.11.d:0 "The trading posts of the Guinea coast no longer hold captives for shipment, and the Barbary corsairs no longer bring sailors into port in chains. The ships that ply between Europe, Africa and the Americas now carry sugar, cotton and machinery, and nobody on this route buys or sells people any more.\n\nThose carried across the ocean have not come home. They and their children still labour on the plantations. When they will be free is for the laws of the countries they live in to decide."
 nesnd_triangle_trade.11.a:0 "The route is closed."
