 nesnd_qe1_army_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100"
 nesnd_qe1_court_status:0 "The imperial house, provincial literati and army are competing for control of the government."
 nesnd_qe1_court_journal:0 "The Court at Ili"
 nesnd_qe1_court_journal_reason:0 "The imperial house draws on the prestige of past conquests and the loyalty of officials who owe it their position. Provincial literati work through schools, trading houses and public offices; the army commands the force on which imperial expansion depends. Each faction needs the others to govern, yet each seeks authority over appointments, revenue and military command."
 nesnd_qe1_patron_crown_button:0 "Favor the Crown's Servants"
 nesnd_qe1_patron_crown_button_desc:0 "Give more offices to soldiers and administrators loyal to the imperial house."
 nesnd_qe1_patron_literati_button:0 "Favor the Provincial Literati"
 nesnd_qe1_patron_literati_button_desc:0 "Give schools, trading houses and civil officials a greater voice at court."
 nesnd_qe1_patron_army_button:0 "Favor the Military"
 nesnd_qe1_patron_army_button_desc:0 "Raise the political standing of the army and its supporters in the towns."
 nesnd_qe1_patron_cancel_button:0 "Withdraw Patronage"
 nesnd_qe1_patron_cancel_button_desc:0 "End the court's special support for this faction."
 nesnd_qe1_coup_army_button:0 "Install a Military Government"
 nesnd_qe1_coup_army_button_desc:0 "Reorganize the state around the army and occupational corporations, placing autocratic authority in corporate institutions."
 nesnd_qe1_coup_literati_button:0 "Proclaim a Republic"
 nesnd_qe1_coup_literati_button_desc:0 "Establish a presidential republic with an elected president and a parliament chosen by proportional representation."
 nesnd_qe1_coup_crown_button:0 "Restore Imperial Authority"
 nesnd_qe1_coup_crown_button_desc:0 "Reorganize the government as a monarchy administered by trained technocrats, restoring the imperial house to power."
 nesnd_qe1_patronage_crown:0 "Imperial Patronage"
 nesnd_qe1_patronage_literati:0 "Patronage of the Literati"
 nesnd_qe1_patronage_army:0 "Military Patronage"
 law_nesnd_qe1_proportional_representation:0 "Proportional Representation"
 law_nesnd_qe1_proportional_representation_desc:0 "Property determines eligibility to vote, while literacy increases a voter’s political influence. Political groups form parliament and government according to their support."
 nesnd_qe1_recovery_journal:0 "Reclaim the Homeland"
 nesnd_qe1_recovery_journal_reason:0 "The Chen imperial house has not forgotten the passes of Hexi or the fields of Guanzhong. By recovering the roads to the east and rebuilding its army and administration, the Empire could make these ancestral lands the foundation of a renewed struggle for China."
 nesnd_qe1_recovered_military:0 "The Qin Army Rebuilt"
 nesnd_qe1_recovered_civil:0 "Reform in the Homeland"
 nesnd_qe1_recovery.1.a:0 "Rebuild our armies on the ancestral lands."
 nesnd_qe1_recovery.1.b:0 "Carry the reforms into the provinces first."
 nesnd_qe1_recovery.1.t:0 "Return to the Homeland"
 nesnd_qe1_recovery.1.d:0 "Qin forces once again control the roads through Hexi and Guanzhong. The court must decide how to use its victory: prepare fresh armies for the march east, or first establish new institutions, industries and a common identity throughout the recovered provinces."
 QRC:0 "Qin Loyalist Army"
 QRC_ADJ:0 "Loyalist"
 QFR:0 "Federation of the Western Provinces"
 QFR_ADJ:0 "Western Federal"
 nesnd_qe1_rebel_army:0 "Loyalist Army"
 nesnd_qe1_frontier_army:0 "New Frontier Army"
 nesnd_qe1_commander_first:0 "Zhaoyi"
 nesnd_qe1_commander_last:0 "Liang"
 dp_nesnd_qe1_civil:0 "Struggle for Qin"
 dp_nesnd_qe1_frontier:0 "War against Qin"
 nesnd_qe1_fracture.1.a:0 "Let all troops loyal to the court stand ready."
 nesnd_qe1_fracture.2.a:0 "Only the last of our lands remain."
 nesnd_qe1_fracture.1.t:0 "Beyond the Imperial Councils"
 nesnd_qe1_fracture.1.d:0 "Officials and officers excluded from the imperial councils have gathered an army. Calling themselves loyalists, they denounce the faction that holds Ili and demand a new settlement by force. The struggle at court has become an armed rebellion."
 nesnd_qe1_fracture.2.t:0 "The Western Empire Breaks Apart"
 nesnd_qe1_fracture.2.d:0 "Provincial governments have raised new flags. The old names of Bukhara, Khwarezm and the steppe appear once more in military orders and tax rolls. Local rulers no longer acknowledge Ili's authority over their people, land or revenue. Beyond the few provinces still held by the court, the Empire is giving way to rival states."
 nesnd_per_future_progress:0 "The Near-Western Empire's Future"
 nesnd_per_future_delta_desc:0 "The Court's Preparations"
 nesnd_per_future_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100"
 nesnd_per_future_status_choice:0 "The court has yet to settle its relations with Ili."
 nesnd_per_future_status_aid:0 "The government has chosen to seek support from Ili for expansion to the west."
 nesnd_per_future_status_covert:0 "Our envoys are approaching Central Asian leaders opposed to Ili."
 nesnd_per_future_journal:0 "The Future of the Near-Western Empire"
 nesnd_per_future_journal_reason:0 "The Tang-Persian court knows both the military government of Qin and the merchants and great families of Persia. The Near-Western War brought land and prestige, but left the Empire's future course unsettled. The court may seek Ili's help for expansion to the west, or exploit unrest in Western Qin to pursue conquests of its own."
 nesnd_per_civil_journal:0 "Beneath the Tang Robes"
 nesnd_per_civil_journal_reason:0 "The offices introduced by the military government stand alongside local academies, religious schools and family networks. To make officials of these different backgrounds work together, the court needs reliable appointments and schools capable of training their successors."
 nesnd_per_economy_journal:0 "The Towns of Persia"
 nesnd_per_economy_journal_reason:0 "Cotton fields, weavers and travelling merchants sustain Persia's prosperity. By linking the countryside to its towns with railways, the court hopes to make the lands won in the Near-Western War support new workshops as well as the army."
 nesnd_per_west_journal:0 "Renew the Far-Western War"
 nesnd_per_west_journal_reason:0 "The court has turned its attention beyond Mesopotamia. Qin military traditions and Persian wealth will sustain a new campaign of expansion. The Ottomans, Egypt and the states of Arabia may seek powerful allies of their own."
 nesnd_per_east_journal:0 "Renew the Near-Western War"
 nesnd_per_east_journal_reason:0 "Ili's authority is under challenge. The court intends to pursue its own interests along the routes through Central Asia and India. The frontiers of its former overlord now attract the attention of Persian commanders."
 nesnd_per_seek_aid_button:0 "Send Envoys to Ili"
 nesnd_per_seek_aid_button_desc:0 "Request Qin assistance in reforming our administration and army, in preparation for expansion to the west."
 nesnd_per_subvert_button:0 "Approach the Peoples of Western Qin"
 nesnd_per_subvert_button_desc:0 "Cultivate local leaders opposed to Ili and prepare to cast off our overlord's rule and expand eastward."
 nesnd_per_civil_commit_button:0 "Reform the Administration"
 nesnd_per_civil_commit_button_desc:0 "Appoint trained officials and bring the academies into closer cooperation with the administration."
 nesnd_per_economy_commit_button:0 "Encourage Commerce and Industry"
 nesnd_per_economy_commit_button_desc:0 "Support our cotton fields, textile mills and railways, joining trade routes to industrial production."
 nesnd_per_claim_levant_button:0 "Assert Our Claims in the Levant"
 nesnd_per_claim_levant_button_desc:0 "Present our territorial claims by diplomatic note. Powers with interests in the region may oppose them."
 nesnd_per_claim_egypt_button:0 "Assert Our Claims on the Nile"
 nesnd_per_claim_egypt_button_desc:0 "Present our territorial claims by diplomatic note. Powers with interests in the region may oppose them."
 nesnd_per_claim_arabia_button:0 "Assert Our Claims in Arabia"
 nesnd_per_claim_arabia_button_desc:0 "Present our territorial claims by diplomatic note. Powers with interests in the region may oppose them."
 nesnd_per_claim_central_asia_button:0 "Assert Our Claims in Central Asia"
 nesnd_per_claim_central_asia_button_desc:0 "Present our territorial claims by diplomatic note. Powers with interests in the region may oppose them."
 nesnd_per_claim_india_button:0 "Assert Claims in Northwestern India"
 nesnd_per_claim_india_button_desc:0 "Present our territorial claims by diplomatic note. Powers with interests in the region may oppose them."
