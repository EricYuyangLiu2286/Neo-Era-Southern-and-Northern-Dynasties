 nesnd_qe1_uprising_war_desc:0 "Continuing Warfare"
 nesnd_qe1_uprising_deprivation_desc:0 "Bankruptcy and Radicalism"
 nesnd_qe1_uprising_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100"
 nesnd_qe1_unity_hope:0 "Farmers, townspeople and soldiers still see their future in the Empire."
 nesnd_qe1_unity_doubt:0 "Older local identities are reviving, and imperial authority is weakening in the provinces."
 nesnd_qe1_unity_crisis:0 "Old ethnic names have become rallying cries for armed resistance."
 nesnd_qe1_unity_journal:0 "Holding the Empire Together"
 nesnd_qe1_unity_journal_reason:0 "Trade routes, village communities and military colonies brought peoples of many origins under the Chen emperors of Qin. The Western Regions Han-Qiang emerged from that expansion and now provide much of the country’s manpower and revenue. Prosperity encourages a common identity. Conscription and hardship can lead people back to older loyalties of kinship, faith and homeland."
 nesnd_qe1_uprising_journal:0 "The Frontier Uprising"
 nesnd_qe1_uprising_journal_reason:0 "Petitions no longer satisfy the associations of the frontier. They are gathering provisions, approaching old noble families and religious leaders, and challenging imperial tax collectors and recruiting officers in the name of local peoples. Ili may yet recover their allegiance. Delay will allow scattered resistance to grow into a common revolt."
 nesnd_qe1_conversion_cohort:0 "Western Regions Han-Qiang"
 nesnd_qe1_identity.1.a:0 "The provinces have lost faith in our promises."
 nesnd_qe1_identity.1.t:0 "An Identity Unravels"
 nesnd_qe1_identity.1.d:0 "The villages and military colonies of [SCOPE.sStateRegion('nesnd_qe1_declining_region').GetName] are rediscovering their past. Old ethnic names, sacred texts and local ties are once again the foundations of trust. About half of the province's Western Regions Han-Qiang now identify as [SCOPE.sCulture('nesnd_qe1_return_culture').GetName] and follow the [SCOPE.sReligion('nesnd_qe1_return_religion').GetName] faith."
 nesnd_qe1_power_crown:0 "The Crown"
