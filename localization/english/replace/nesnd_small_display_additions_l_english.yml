l_english:
 nesnd_small_review_dispute:0 "Respond to Local Demands"
 nesnd_small_review_available_tt:0 "The local demands still await a response, and the deadline has not passed."
 nesnd_small_dispute_law_promised_tt:0 "The government has promised legislation to address the local demands."
 nesnd_small_review_dispute_desc:0 "Consider the local organisations' demands and decide how the government should respond."
 nesnd_small_review_dispute_tt:0 "Review the available responses and their costs before deciding. This does not extend the deadline for a response."
 nesnd_small_dispute_unanswered:0 "Local organisations are awaiting the government's response."
 nesnd_small_dispute_organised:0 "The government has permitted local organisations to operate, giving their movements more room to win support."
 nesnd_small_dispute_suppressed:0 "The police are suppressing local organisations and restricting their movements' public activities."
 nesnd_small_dispute_promised_1:0 "The government has promised land reform. Enact $law_peasant_proprietorship$, $law_commercialized_agriculture$ or $law_collectivized_agriculture$ before the deadline."
 nesnd_small_dispute_promised_2:0 "The government has promised to end debt bondage. Enact $law_slavery_banned$ before the deadline."
 nesnd_small_dispute_promised_3:0 "The government has promised safeguards for workers. Enact $law_regulatory_bodies$ or $law_worker_protections$ before the deadline."
 nesnd_small_dispute_promised_4:0 "The government has promised to lift caste restrictions. Enact $law_hindu_caste_not_enforced$ or $law_affirmative_action$ before the deadline."
 nesnd_small_dispute_promised_5:0 "The government has promised wider political participation. Enact $law_wealth_voting$, $law_census_voting$ or $law_universal_suffrage$ before the deadline."
 nesnd_small_dispute_time:0 "Time Allowed"
 nesnd_small_dispute_time_desc:0 "Months elapsed: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_small_dispute_elapsed_months')|0] / [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_small_dispute_term_months')|0]#!"
 nesnd_small_dispute_fulfilled_conclusion:0 "The government has fulfilled its legislative promise on time, answering the demands raised locally."
 nesnd_small_dispute_expired_conclusion:0 "The promised deadline has passed without the promised reform being enacted. Those whose demands remain unanswered have grown more disillusioned with the government."
 nesnd_small_dispute_finished_conclusion:0 "This round of dealings over local demands has come to an end."
 nesnd_small_dispute_ended_conclusion:0 "Changes in the political situation or the country's circumstances have ended the previous arrangements."
 nesnd_small_dispute_expired_tt:0 "The reform deadline has passed without the promise being fulfilled, and the original grievance remains."
 nesnd_small_dispute_finished_tt:0 "The response or policy period has ended, or the original dispute is no longer continuing."
 nesnd_small_dispute_ended_tt:0 "A revolution or changes in government or territory have interrupted the handling of this dispute."
 nesnd_journal_closures_italy_agenda_tt:0 "The country no longer has an Italian primary culture, or no longer rules populated territory in Italy."
 nesnd_journal_closures_italy_agenda_conclusion:0 "The former arrangements for public works and political cooperation in Italy have ended."
 nesnd_journal_closures_hus_agenda_tt:0 "The original Dongzhou state has been replaced, or its former registration system has ended."
 nesnd_journal_closures_hus_agenda_conclusion:0 "The former Dongzhou government's arrangements for local works and civic affairs have ended."
 nesnd_journal_closures_usm_agenda_tt:0 "The country is no longer part of the Ming or Wu states, has no populated territory, or the Ming–Wu dispute has not reached a settlement or truce."
 nesnd_journal_closures_usm_agenda_conclusion:0 "The Southern Dynasty's previous deliberations on constitutional law, education and industry have ended."
 nesnd_journal_closures_small_livelihood_tt:0 "This country no longer belongs to the local or southern states, or has lost the inhabited territory it can develop in India, Southeast Asia and Australasia."
 nesnd_journal_closures_small_livelihood_conclusion:0 "Changes in the country's status or territory have ended its former programme of local economic and public development."
