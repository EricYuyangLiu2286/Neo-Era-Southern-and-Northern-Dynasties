 # Independence
 nesnd_india_indep:0 "Seeking Independence"
 nesnd_india_indep_reason:0 "We seek control of the finances and armed forces of [ROOT.GetCountry.GetName] and the right to conclude treaties in our own name. In pursuit of independence, we could secretly fund a [concept_political_movement] in [ROOT.GetCountry.GetOverlord.GetName] or stockpile arms from our factories. If our overlord traces a payment to us or discovers the weapons, it may hold us to account."
 nesnd_india_indep_conclusion:0 "[ROOT.GetCountry.GetName] has gained independence."
 nesnd_india_indep_overlord:0 "Affairs of the Subject States"
 nesnd_india_indep_overlord_reason:0 "The Indian subjects of [ROOT.GetCountry.GetName] retain control over part of their revenue and armed forces. A subject may secretly divert public funds or supplies from its factories to a [concept_political_movement] in our country. Once we know where the money or supplies came from, pursuing the matter means taking it up with the subject government concerned."
 nesnd_india_indep_market_threshold:0 "At 25 [concept_liberty_desire], a subject may request its own market from a direct overlord that controls its market.\n"
 nesnd_india_indep_thresholds:0 "[concept_liberty_desire] is #tooltippable;tooltip:[ROOT.GetCountry.GetTooltipTag],liberty_desire_factors_tt #v [ROOT.GetCountry.GetLibertyDesireRaw|0]#! (#blue [ROOT.GetCountry.GetWeeklyLibertyDesireChange|2]#! weekly)#!\n[ROOT.GetCountry.GetCustom('nesnd_india_indep_market_line')]At 75 [concept_liberty_desire], a subject may request greater autonomy.\nAt 90, we can start a diplomatic play for independence.\n[concept_economic_dependence] on the overlord: [ROOT.GetCountry.GetEconomicDependenceOn(ROOT.GetCountry.GetOverlord.Self)].\n$lobby_pro_overlord$: [ROOT.GetCountry.GetCustom('nesnd_india_indep_pro_presence')]. $lobby_anti_overlord$: [ROOT.GetCountry.GetCustom('nesnd_india_indep_anti_presence')].\nArms in storage: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_stores')|0] batches."
 nesnd_india_indep_goal_protectorate:0 "Our present aim is to become a protectorate.\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_goal_autonomy:0 "Our present aim is the right to initiate diplomatic plays.\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_goal_independence:0 "Our present aim is independence.\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_lord_counts:0 "Subjects at or above 75 [concept_liberty_desire]: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_above_75')|0]. Of these, [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_above_90')|0] have reached 90.\nPolitical movements receiving foreign support in our country: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_funded_count')|0]."
 nesnd_india_indep_lord_status:0 "$nesnd_india_indep_lord_counts$\nThe subject with the highest liberty desire is [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetName].\n[concept_liberty_desire] is #tooltippable;tooltip:[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetTooltipTag],liberty_desire_factors_tt #v [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetLibertyDesireRaw|0]#! (#blue [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetWeeklyLibertyDesireChange|2]#! weekly)#!\n[concept_economic_dependence] on the overlord: [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetEconomicDependenceOn(ROOT.GetCountry.Self)].\n$lobby_pro_overlord$: [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetCustom('nesnd_india_indep_pro_presence')]. $lobby_anti_overlord$: [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetCustom('nesnd_india_indep_anti_presence')].\nRecent cases[ROOT.GetCountry.GetCustom('nesnd_india_indep_cases')]"
