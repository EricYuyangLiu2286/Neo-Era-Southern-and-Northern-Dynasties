 nesnd_india_usm:0 "The Tianzhu Territories"
 nesnd_india_usm_reason:0 "The Southern Court’s possessions in India lie across the sea, and merchants, garrisons and local princes each have their own interests there. Nanjing may send officials to govern them directly, or hand them to a separate Pacification Commission. All for the glory and the taxes of the Celestial Court!"
 nesnd_tianzhu_regions_bar:0 "Tianzhu Regions"
 nesnd_tianzhu_founded_tt:0 "The $nesnd_tianzhu_commission_name$ has been founded"
 nesnd_tianzhu.1.t:0 "The Tianzhu Commission Inaugurated"
 nesnd_tianzhu.1.d:0 "[SCOPE.sCountry('nesnd_tianzhu_scope').GetName] has opened its offices in India. Nanjing has handed its directly held Indian states over to the commission; the Pacification Commissioner governs the military and civil affairs there on the spot, and the court asks only for tribute and troops."
 nesnd_tianzhu.1.f:0 "'A Pacification Commission of Tianzhu and other places is hereby established to govern the military and civil affairs of Tianzhu, under the direction of the court.'\n— Decree from Nanjing"
 nesnd_tianzhu.1.a:0 "Grant the Seal of Office"
 nesnd_india_usm_ready_status:0 "The conditions are met, and the $nesnd_tianzhu_commission_name$ can be founded."
 nesnd_india_usm_status:0 ""
 nesnd_india_unified:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_india_unified_name')]"
 nesnd_india_unified_reason:0 "[ROOT.GetCountry.GetName] has taken up the cause of uniting $region_north_india$ and $region_south_india$. As we wipe the old borders between the states off the diplomatic map, the new national government must bring the whole country under one body of law. That means standardising and unifying the administrations of the former 'states', and building the railways and roads that link the provinces, carrying our rule out from the clamour of the cities across the plains, plateaus and jungles of this great land, to the Himalayas and the breaking waves of the ocean."
 nesnd_india_unified_lobby:0 "The unification of $region_north_india$ and $region_south_india$ is not yet complete. The old borders have lost their diplomatic meaning, yet they still carry 'political meaning'. If we are to become a true 'national government', we must extend our state machinery and infrastructure to the far ends of this land, until the height of the Himalayan sky and the reach of the open sea are the only limits on central power. We will surpass every Indian state that came before us!"
 nesnd_india_unified_status:0 "Share of the states held by countries with capitals in India that we and our subjects hold: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!"
 nesnd_india_unified_share_tt:0 "We and our subjects hold at least #v 75%#! of the populated states held by countries with capitals in India, not counting foreign countries and their subjects (currently #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!)"
 nesnd_india_unified_reward:0 "A United India"
