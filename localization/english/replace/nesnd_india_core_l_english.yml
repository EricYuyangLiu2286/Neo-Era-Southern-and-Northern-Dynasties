 nesnd_india_settlement_desc:0 "Lay down the fundamental law of the state, with an assembly elected by property-holders taking part in government."
 nesnd_india_national_settlement:0 "The National Settlement"
 nesnd_india_keep_power_law_tt:0 "The current distribution of power law is already at least as progressive as $law_census_voting$ and stays in place."
 nesnd_india_keep_governance_tt:0 "The current form of government is not a monarchy, chiefdom, theocracy or colonial administration, and stays in place."
 nesnd_india_community_ready_tt:0 "$nesnd_india_community_bar$ is at least #v 75#!"
 nesnd_tianzhu_governance:0 "Governing Tianzhu"
 nesnd_tianzhu_governance_reason:0 "Tianzhu is as vast and rich as the Central Plains, yet since ancient times it has been divided among rival sects and peoples, and this has created many problems of government. It is no different under the Celestial Court. The state set up [ROOT.GetCountry.GetName] in Tianzhu precisely to draw more profit from this distant but wealthy land. To do that job well, we must gradually dismantle and rebuild the nobility and village councils through which the natives govern themselves, and even help them build modern institutions of law. We trust that the administration and the new Indian elite we help to raise will serve us better than princes who bow to us in public and defy us behind our backs..."
 nesnd_yuanshan_commission:0 "Founding the Yuanshan Commission"
 nesnd_yuanshan_commission_reason:0 "Yuanshan lies at the southernmost point of Kunlunzhou. Scholars regard it as the meeting place of the Eastern and Western worlds, and in fact it is a vital supply station for ocean crossings. Its position and farmland also make it a colonial foothold from which [ROOT.GetCountry.GetName] can enter the African interior. To govern and build up this important colony so far from Nanjing, the court should set up a Pacification Commission to direct its military and civil affairs on the spot."
 nesnd_yuanshan_governance:0 "Governing Yuanshan"
 nesnd_yuanshan_governance_reason:0 "Running a colony ten thousand li from home is no simple matter, all the more so when the court in Nanjing expects so much of us. We must build depots for the navy's ocean crossings, keep the settlers and soldiers pushing inland supplied, and open military farms, plantations and workshops to make the colony pay. After all, the court's taxes and the investors' dividends cannot fall short. None of this can be done with merchant-house managers who only know how to grease palms and new landlords who bow to us in public and defy us behind our backs. A complete administration that runs on its own, and the infrastructure to go with it, are indispensable."
 nesnd_india_foreign:0 "Foreign Aid"
 nesnd_india_foreign_reason:0 "If [ROOT.GetCountry.GetName] is to survive in this new age, we must carry out resolute reform and construction. Yet in industry and commerce, our own investors are plainly too cautious and lack any experience of running modern enterprises. And in other affairs of state, such as setting standards for the army and for education, we lack even the most basic understanding. Of course, an independent people is not afraid to start from nothing, but with the help of some 'well-wishers', we might achieve twice as much with half the effort..."
 nesnd_india_uprising:0 "Independence Movements of the States"
 nesnd_india_uprising_reason:0 "The 'Ming' from China and the 'Franks' from Europe are seizing land across India. These foreigners, who began as mere trading companies, have grown into a threat to every Indian state. Of course, to many princes they are no different from the Persians, Rajputs and Ghaznavids they have seen before, or the Mughals who still hold great tracts of land today. But to [ROOT.GetCountry.GetName], which aims at a greater dominion, these empires from ten thousand li away are plainly rivals that cannot be suffered to stand, and they must all be driven from this subcontinent!"
 nesnd_india_contact_bar:0 "Preparations for the Rising"
