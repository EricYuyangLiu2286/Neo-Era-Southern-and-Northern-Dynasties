 nesnd_india_indep_selected_target_tt:0 "The subject still qualifies"
 nesnd_india_indep_conciliate_methods_tt:0 "Choose the means of conciliation."
 nesnd_india_indep_conciliate_available_tt:0 "There is a subject we can conciliate"
 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName] is a subject of [ROOT.GetCountry.GetOverlord.GetName], and between the two countries stands an old agreement. Under it, enterprises owned by the imperial government may be sold to the overlord's government at a price, and bought back by the empire later, though at a price six-tenths higher than the sale. The imperial ministers regard the sale of enterprises as a means of raising money in an emergency. Those who favour independence object that once these holdings belong to the overlord, the empire's economy falls further under the overlord's control."
 nesnd_india_mug_schools_lasting:0 "$nesnd_india_school_service$"
 nesnd_india_mug_arms_lasting:0 "$nesnd_mug_arms_and_rail$"
 nesnd_india_industry_tech_known_tt:0 "$bessemer_process$ and $mechanized_workshops$ are already researched, so no [concept_technology] progress is gained."
 nesnd_india_reform_lapse_tt:0 "The reform has not been halted by [concept_default] or [concept_bankruptcy] in the last ten years"
 nesnd_india_reform_lapse_conclusion:0 "[ROOT.GetCountry.GetName] could not pay its debts, and both reform programmes have been halted."
 nesnd_india_reform_lapse_effect_tt:0 "The reform cannot begin again for ten years."
 nesnd_india_reform_central:0 "Centrally Directed Reform"
 nesnd_india_landowners_slighted:0 "Landowners Slighted"
 nesnd_india_landowners_pleased:0 "Landowners Content"
 nesnd_india_reform_lapsed:0 "Reform Abandoned"
 nesnd_india_intelligentsia_dismayed:0 "Reformers Disappointed"
 nesnd_india_back_empire_lobby_tt:0 "Its $lobby_pro_overlord$ backing [ROOT.GetCountry.GetName] gains #g +4#! [concept_political_lobby_appeasement]. If it has no such [concept_political_lobby], an [concept_interest_group] not yet in any lobby forms one."
 nesnd_india_core.1_outcome_tt:0 "Both reform programmes are complete. The government will decide whether the reform is carried out by the centre or left to each state."
 nesnd_india_core.1.t:0 "Whose Reform?"
 nesnd_india_core.1.d:0 "The schools and the arsenals are now running. [ROOT.GetCountry.GetName]'s ministers wish to seize the moment and bring taxation, the army and the schools under the centre, with one treasury and one examination for the whole empire. The landowners and the princes who are subjects of the empire ask instead that each state manage its own affairs, and that imperial officials keep out of them."
 nesnd_india_core.1.f:0 "'We ask that the funds and appointments of the new schools and arsenals be placed under the centre, with one examination and one treasury for the whole empire.'\n— A submission to the emperor"
 nesnd_india_core.1.a:0 "Direct It from the Centre"
 nesnd_india_core.1.a_tt:0 "When '$nesnd_india_order$' opens, tax, the army and foreign affairs, and schools and offices all start under the central arrangement."
 nesnd_india_core.1.b:0 "Leave It to the States"
 nesnd_india_core.1.b_tt:0 "When '$nesnd_india_order$' opens, tax, the army and foreign affairs, and schools and offices all start under the arrangement of state autonomy."
 nesnd_india_society_ended_tt:0 "'$nesnd_india_society$' has not yet concluded"
 nesnd_india_community_full_tt:0 "$nesnd_india_community_bar$ reaches #v 100#!"
 nesnd_india_community_empty_tt:0 "$nesnd_india_community_bar$ falls to #v 0#!"
 nesnd_india_society_formed_conclusion:0 "The peoples of India within [ROOT.GetCountry.GetName] now regard this country as their own."
 nesnd_india_society_broken_conclusion:0 "The peoples of India within [ROOT.GetCountry.GetName] no longer believe that this country belongs to them."
 nesnd_india_community_broken:0 "A Broken Nation"
 nesnd_india_community_broken_radicals_tt:0 "In every state of ours, #r 10%#! of the people of Indian cultures that are not a [Concept('concept_primary_cultures','$concept_primary_culture$')] become [concept_radical]s."
 nesnd_india_core.2_outcome_tt:0 "The government will confirm the standing of its citizens by a dynastic charter or by the laws of the assembly."
 nesnd_india_core.2.t:0 "A Nation of Citizens"
 nesnd_india_core.2.d:0 "Most of the peoples of India within [ROOT.GetCountry.GetName] now regard this country as their own. More of them can read every year, and they have begun to call themselves citizens rather than merely the subjects of this prince or that. What remains is to decide what will confirm it: a charter granted by the monarch to the nation, or laws made by the nation's own representatives."
 nesnd_india_core.2.f:0 "'Every Indian born in this country, whatever his language or faith, is a citizen.'\n— Article One of the draft charter"
 nesnd_india_core.2.a:0 "Proclaim a Dynastic Charter"
 nesnd_india_core.2.b:0 "Leave It to the Assembly"
 nesnd_india_dynastic_charter:0 "Dynastic Charter"
 nesnd_india_intelligentsia_pleased:0 "Intelligentsia Satisfied"
 nesnd_india_republican_enactment:0 "A Legislating Assembly"
 nesnd_india_caste_law_lost_tt:0 "$law_freedom_of_conscience$ or $law_total_separation$, once in force, has been repealed"
 nesnd_india_caste_reaction_conclusion:0 "The religious establishment in the government has overturned the reform, and offices are still granted by birth."
 nesnd_india_dynasty_crisis:0 "Dynastic Crisis"
 nesnd_india_core.3.t:0 "The Dynasty in Crisis"
 nesnd_india_core.3.d:0 "The national community has broken. The peoples of India within our borders no longer believe this country belongs to them, and radicals are holding rallies across the states with the dynasty as their target: by what right does a country that belongs only to the emperor and the nobility demand their loyalty? The court must decide whether to give up power and allow the radicals in the assembly to press for a so-called 'republic', or to crush the agitation."
 nesnd_india_core.3.f:0 "'The country belongs to its citizens, not to the throne!'\n— A banner at a state rally"
 nesnd_india_core.3.a:0 "Yield to the Republic"
 nesnd_india_core.3.a_tt:0 "We already have a $law_presidential_republic$."
 nesnd_india_core.3.b:0 "Crush the Agitation"
 nesnd_india_unified_claims_tt:0 "We lay a [concept_claim] on every Indian state held by a country whose capital is outside India."
 nesnd_india_unified_fervor_tt:0 "The target [concept_fervor] of our South Asian [Concept('concept_primary_cultures','$concept_primary_culture$')] rises for a long time."
 nesnd_india_unified_fallen:0 "The New Order Fallen"
 nesnd_india_core.6.t:0 "The New Order Falls"
 nesnd_india_core.6.d_subject:0 "[ROOT.GetCountry.GetName] has become another country's subject. The national government's decrees cannot even leave the capital, and the claims laid on the Indian states under foreign rule have become a dead letter."
 nesnd_india_core.6.d_seat:0 "[ROOT.GetCountry.GetName] has lost the region of the capital where the new order was founded. The government has fallen into disarray, and the claims laid on the Indian states under foreign rule have become a dead letter."
 nesnd_india_core.6.f:0 "'The claims of this government to the Indian states under foreign rule are withdrawn with immediate effect.'\n— Notice of the foreign ministry"
 nesnd_india_core.6.a:0 "Pick Up the Pieces"
 nesnd_india_core.6.a_tt:0 "All claims laid when the new order was founded are withdrawn."
 nesnd_india_core.4_outcome_tt:0 "The empire will decide the future of each subject state in turn."
 nesnd_india_core.4.t:0 "The Fate of a Subject State"
 nesnd_india_core.4.d:0 "Taxation, the army and the schools are all in the hands of the centre, and the prince of [SCOPE.sCountry('india_annex_candidate').GetName] retains nothing but a title. The empire can annex the state formally, or let it keep its standing as a subject."
 nesnd_india_core.4.f:0 "'All the affairs of this state shall henceforth belong to the empire.'\n— Draft decree of annexation"
 nesnd_india_core.4.a:0 "Annex It"
 nesnd_india_core.4.b:0 "Leave It as It Is"
 nesnd_india_core.4.b_tt:0 "[SCOPE.sCountry('india_annex_candidate').GetName] remains a subject of the empire."
