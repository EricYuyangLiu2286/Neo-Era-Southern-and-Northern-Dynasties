l_english:
 nesnd_india_schools:0 "Standardised Education"
 nesnd_india_schools_reason:0 "In [ROOT.GetCountry.GetName], having been to school does not mean you can do educated work. Mosque schools, temple schools and village teachers each teach from their own curriculum and texts. In the past this was no problem. But if [ROOT.GetCountry.GetName] wants to become an independent, modern state, it cannot make do with officials who can read scripture and nobles who brandish swords. We need double-entry bookkeeping, financiers, engineering managers... every kind of talent it takes to run and build an industrial society, and for now these skills can only be learned in the great powers beyond India. Otherwise, even if we drive out the colonisers in front of us, we will still be a country run by 'foreigners'."
 nesnd_india_school_service:0 "School-Trained Officials"
 nesnd_india_industry:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_india_industry_name')]"
 nesnd_india_industry_reason:0 "The rifles, cannon and ammunition of [ROOT.GetCountry.GetName]'s army are mostly bought abroad, and the sellers set the price and the terms of delivery. Should the sellers stop supplying, [ROOT.GetCountry.GetName]'s army would have no way to replenish its stores."
 nesnd_india_industrial_service:0 "National Arms Industry"
 nesnd_india_request_4:0 "Request Greater Autonomy"
 nesnd_india_society:0 "Who Speaks for the Nation"
 nesnd_india_society_reason:0 "Nationalism has reached India, and the subjects of [ROOT.GetCountry.GetName] have begun to ask to whom this country belongs. In the tradition of the old empire it belongs to the dynasty, with princes and subjects each in their place. The generation raised in the new schools holds that it belongs to the whole nation and should speak through representatives the nation elects, and the radicals among them regard the crown itself as the obstacle. The many peoples of India within our borders, speaking many languages, follow this dispute closely, for its outcome bears on whether they will be recognised as citizens of this country."
 nesnd_india_community_bar:0 "National Community"
 nesnd_india_dynastic_constitution:0 "Dynastic Constitution"
 nesnd_india_republican_settlement:0 "Republican Settlement"
 nesnd_india_union_status_invite_consent:0 "Invitation to [JournalEntry.GetCountry.MakeScope.Var('nesnd_india_request_partner').GetCountry.GetName]: awaiting consent from [JournalEntry.GetCountry.MakeScope.Var('nesnd_india_request_await').GetCountry.GetName]"
 nesnd_india_union_status_invite_sent:0 "Invitation to [JournalEntry.GetCountry.MakeScope.Var('nesnd_india_request_partner').GetCountry.GetName]: awaiting an answer"
 nesnd_india_society_status:0 ""
 nesnd_india_request_6:0 "Invite a Princely State"
 nesnd_india_caste:0 "Reform of the Services"
 nesnd_india_caste_reason:0 "In [ROOT.GetCountry.GetName], the office a man may hold and the trade he may follow are mostly settled at his birth. The sons of a few high castes have held the posts of government for generations. $shudras$ and $dalit$ who have been educated are still seldom appointed, to say nothing of those bound to the land by debt. Since the doctrine of human rights reached India, the reformers have demanded that offices be open to every citizen and granted by learning rather than by birth. The religious establishment holds caste to be an order ordained by the gods, and as long as its leaders sit in the government, any reform may yet be undone."
 nesnd_india_equal_service:0 "Offices Open to Merit"
 nesnd_india_princes:0 "Among the Princes"
 nesnd_india_princes_reason:0 "[ROOT.GetCountry.GetName] is one of the many princely states of India. The Mughal emperor still claims to be sovereign of all India, the French and the Ming rule many states along the coasts and in the south directly, and a good number of princely states have become their subjects. Some at court would submit to the empire, either merging into it with the royal house kept by the empire, or keeping the state's own taxes and army as a dominion. Others would draw on the money of neighbouring states or foreign powers to found modern enterprises, until the state can stand on its own."
 nesnd_india_project_status_consent:0 "[JournalEntry.GetCountry.GetCustom('nesnd_india_project_name')]: awaiting consent from [JournalEntry.GetCountry.MakeScope.Var('nesnd_india_request_await').GetCountry.GetName]"
