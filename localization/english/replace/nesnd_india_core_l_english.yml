 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName] is a [ROOT.GetCountry.GetSubjectType.GetName] of [ROOT.GetCountry.GetOverlord.GetName] and hands part of its revenue to it. The government and merchants of [ROOT.GetCountry.GetOverlord.GetName] own a great deal of property in our country. When the court is short of money, it can sell property to the government of [ROOT.GetCountry.GetOverlord.GetName]. When our [concept_gold_reserves] allow, it can buy that property back."
 nesnd_india_mug_schools_lasting:0 "$nesnd_india_school_service$"
 nesnd_india_mug_arms_lasting:0 "$nesnd_mug_arms_and_rail$"
 nesnd_india_industry_tech_known_tt:0 "We already know [GetTechnology('bessemer_process').GetName] and [GetTechnology('mechanized_workshops').GetName], so no further [concept_technology] progress is given."
 nesnd_india_reform_lapse_tt:0 "Ten years have passed since the reform was last abandoned"
 nesnd_india_reform_lapse_conclusion:0 "The treasury could no longer pay for it, and the reform was abandoned half-way."
 nesnd_india_reform_lapse_effect_tt:0 "'$nesnd_india_schools$' and '$nesnd_india_industry_name_empire$' cannot begin again for ten years. A programme already completed still counts."
 nesnd_india_reform_central:0 "Centralised Administration"
 nesnd_india_landowners_slighted:0 "Local Privileges Curbed"
 nesnd_india_landowners_pleased:0 "Local Privileges Kept"
 nesnd_india_reform_lapsed:0 "Reform Abandoned"
 nesnd_india_intelligentsia_dismayed:0 "Reform Abandoned"
 nesnd_india_back_empire_lobby_tt:0 "If the country already has a [concept_political_lobby] friendly to us, that lobby is appeased. Otherwise its strongest [concept_interest_group] outside any lobby founds one."
 nesnd_india_core.1_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n• Centralise: permanently gains '$nesnd_india_reform_central$', and the [ROOT.GetCountry.GetInterestGroupOfType('ig_landowners').GetName] are displeased for five years. When '$nesnd_india_order$' begins, all three matters start under the centre.\n• Devolve: the [ROOT.GetCountry.GetInterestGroupOfType('ig_landowners').GetName] are pleased for five years. Each of our [concept_subject]s gains +20 [concept_relations] with us, and a [concept_political_lobby] friendly to us is backed in each. When '$nesnd_india_order$' begins, all three matters start under the states.#!"
 nesnd_india_core.1.t:0 "The Reform Accomplished"
 nesnd_india_core.1.d:0 "The provincial schools are open, and the workshops of [ROOT.GetCountry.GetName] now make our own guns. The new graduates and the new army wait for the government to give them their places. One party of ministers would bring taxation, the army and the schools under the centre, with officials sent out by the court to govern the provinces. The landowners and the princes ask to keep their old local rights, paying for local affairs themselves and answering to the court only for the results."
 nesnd_india_core.1.f:0 "'Who shall decide the affairs of the provinces from now on?'\n— A petition to the court"
 nesnd_india_core.1.a:0 "Government flows from the centre."
 nesnd_india_core.1.a_tt:0 "When '$nesnd_india_order$' begins, taxation, the army and foreign affairs, and schools and offices all start under the centre."
 nesnd_india_core.1.b:0 "The states manage their own affairs."
 nesnd_india_core.1.b_tt:0 "When '$nesnd_india_order$' begins, taxation, the army and foreign affairs, and schools and offices all start under the states."
 nesnd_india_society_ended_tt:0 "The national community has neither formed nor broken"
 nesnd_india_community_full_tt:0 "The national community reaches #v 100#!"
 nesnd_india_community_empty_tt:0 "The national community falls to #v 0#!"
 nesnd_india_society_formed_conclusion:0 "The educated of every province now accept that they belong to one nation."
 nesnd_india_society_broken_conclusion:0 "The people of the provinces no longer accept that they belong to one nation."
 nesnd_india_community_broken:0 "A Broken Community"
 nesnd_india_community_broken_radicals_tt:0 "In each of our states, #r 10%#! of the population of South Asian cultures outside our primary cultures become [concept_radical]s."
 nesnd_india_core.2_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n• A dynastic charter (monarchies only): #g +5#! [concept_legitimacy] permanently.\n• A republican settlement: the [ROOT.GetCountry.GetInterestGroupOfType('ig_intelligentsia').GetName] are pleased for five years, and [concept_enactment_success] chances rise for ten years.#!"
 nesnd_india_core.2.t:0 "Who Speaks for the Nation"
 nesnd_india_core.2.d:0 "After years of argument in the newspapers, learned societies and assemblies of the provinces, the educated of [ROOT.GetCountry.GetName] accept that they belong to one nation. The next question is who speaks for it. Supporters of the dynasty want a charter issued by the crown, with the rights of the provinces written into it. The intelligentsia and the new men of the cities want a republican government, with laws made by elected representatives."
 nesnd_india_core.2.f:0 "'We are one nation. Who speaks for it must now be settled.'\n— A declaration of a learned society"
 nesnd_india_core.2.a:0 "The crown issues a charter."
 nesnd_india_core.2.b:0 "Settle the government on republican lines."
 nesnd_india_dynastic_charter:0 "Dynastic Charter"
 nesnd_india_intelligentsia_pleased:0 "Republican Settlement"
 nesnd_india_republican_enactment:0 "Republican Settlement"
 nesnd_india_caste_law_lost_tt:0 "[GetLawType('law_freedom_of_conscience').GetName] or [GetLawType('law_total_separation').GetName], once in force, has been repealed"
 nesnd_india_caste_reaction_conclusion:0 "The devout are back in government and have repealed religious freedom or restored caste enforcement. The old rules of appointment have returned."
 nesnd_india_dynasty_crisis:0 "Dynastic Crisis"
 nesnd_india_core.3.t:0 "Dynastic Crisis"
 nesnd_india_core.3.d:0 "The provinces no longer accept the authority of the crown. The newspapers demand the monarch's abdication, and the provincial assemblies refuse to raise taxes in the emperor's name. Some at court would bow to opinion, with the monarch giving up power for a republic. Others hold that while the army and the landowners stand by the crown, the agitation can be put down."
 nesnd_india_core.3.f:0 "'The crown can no longer speak for this nation.'\n— A resolution of a provincial assembly"
 nesnd_india_core.3.a:0 "The monarch abdicates for a republic."
 nesnd_india_core.3.a_tt:0 "We are already a [GetLawType('law_presidential_republic').GetName]."
 nesnd_india_core.3.b:0 "Call out the army and put the agitation down."
 nesnd_india_unified_claims_tt:0 "We [concept_claim] every Indian state held by a country whose capital lies outside $region_north_india$ and $region_south_india$."
 nesnd_india_unified_fervor_tt:0 "#g +10#! [concept_fervor] target for fifty years for each South Asian culture among our primary cultures."
 nesnd_india_unified_fallen:0 "The New Order Fallen"
 nesnd_india_core.6.t:0 "The New Order Falls"
 nesnd_india_core.6.d_subject:0 "The new order that [ROOT.GetCountry.GetName] set up when it united the provinces can no longer be held. Our government now answers to a foreign government, and the treaties it signs are no longer ours to make. We are no longer able to press our rights to the Indian states held by foreign powers."
 nesnd_india_core.6.d_seat:0 "The new order that [ROOT.GetCountry.GetName] set up when it united the provinces can no longer be held. The region around our capital has passed into other hands, and the government that proclaimed the union no longer governs its own seat. We are no longer able to press our rights to the Indian states held by foreign powers."
 nesnd_india_core.6.f:0 "'The promise of unity can no longer be kept.'\n— A government notice"
 nesnd_india_core.6.a:0 "Withdraw our claims."
 nesnd_india_core.6.a_tt:0 "Every [concept_claim] we made on completing '$nesnd_india_unified$' is withdrawn."
 nesnd_india_core.4_outcome_tt:0 "Each of our member states is decided once:#indent_newline:3 \n• Annex: the country is annexed by us.\n• Keep: the country remains our [concept_subject].#!"
 nesnd_india_core.4.t:0 "Annex or Keep"
 nesnd_india_core.4.d:0 "For ten years the taxes, army and schools of [SCOPE.sCountry('india_annex_candidate').GetName] have been run by us, and its ruler keeps only the title. Some at court propose to annex it outright to [ROOT.GetCountry.GetName], with officials sent by the court to govern it. Others hold that keeping the ruler is simpler, since the ruling family is still respected there."
 nesnd_india_core.4.f:0 "'How much longer shall a state in name only be kept?'\n— A memorial to the court"
 nesnd_india_core.4.a:0 "Annex [SCOPE.sCountry('india_annex_candidate').GetName]."
 nesnd_india_core.4.b:0 "Keep its prince."
 nesnd_india_core.4.b_tt:0 "[SCOPE.sCountry('india_annex_candidate').GetName] remains our [concept_subject]."
