 # Independence
 nesnd_india_indep:0 "Throwing Off the Overlord"
 nesnd_india_indep_reason:0 "[ROOT.GetCountry.GetName] is a subject of [ROOT.GetCountry.GetOverlord.GetName], and our foreign affairs answer to the overlord. A party in our government demands full sovereignty, with our foreign affairs in our own hands. The overlord regards its Indian subjects as part of its own sphere and is wary of anything that would weaken the tie. Once it finds a subject secretly funding political movements in its country or hiding arms, it will call that subject to account."
 nesnd_india_indep_conclusion:0 "[ROOT.GetCountry.GetName] has thrown off its overlord and become an independent country."
 nesnd_india_indep_overlord:0 "Restless Subjects"
 nesnd_india_indep_overlord_reason:0 "Some of [ROOT.GetCountry.GetName]'s subjects in India are scheming to break away from us. Our agents report that these subjects secretly fund political movements in our country and hide arms in their warehouses. What has been uncovered is only part of it, and how much remains hidden cannot be known."
 nesnd_india_indep_market_threshold:0 "\nWe are still within another country's [concept_market]"
 nesnd_india_indep_thresholds:0 ""
 nesnd_india_indep_goal_protectorate:0 "Next step: become a protectorate instead of a puppet, which allows us to start a play for independence ourselves.\n$lobby_anti_overlord$: [JournalEntry.GetCountry.GetCustom('nesnd_india_indep_anti_presence')][JournalEntry.GetCountry.GetCustom('nesnd_india_indep_market_line')]"
 nesnd_india_indep_goal_autonomy:0 "Next step: ask our overlord for greater [concept_autonomy].\n$lobby_anti_overlord$: [JournalEntry.GetCountry.GetCustom('nesnd_india_indep_anti_presence')][JournalEntry.GetCountry.GetCustom('nesnd_india_indep_market_line')]"
 nesnd_india_indep_goal_independence:0 "Next step: start a diplomatic play for independence against our overlord.\n$lobby_anti_overlord$: [JournalEntry.GetCountry.GetCustom('nesnd_india_indep_anti_presence')][JournalEntry.GetCountry.GetCustom('nesnd_india_indep_market_line')]"
