 nesnd_india_owned_by_our_government:0 "Owned by our government"
 nesnd_mug_council_intro:0 "The Mughal emperor was once overlord of all India; today each prince has his own court and his own army, and the emperor's decrees go no further than the empire's borders. Since the reform, [ROOT.GetCountry.GetName] has the strength to call the states together again. Those who come are mostly princes on good terms with the empire. They come for railways, famine relief and defence, the tangible benefits of attending, and the longer they sit at the council, the more used they grow to seeing the empire at the head of the table."
