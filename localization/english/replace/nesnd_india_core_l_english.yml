 dp_nesnd_india_travancore_tooltip:0 "A play to recover this state, allowing a negotiated peace."
 dp_nesnd_india_gujarat_tooltip:0 "A play to recover this state, allowing a negotiated peace."
 nesnd_tianzhu_regions_required_tt:0 "Our populated states lie in at least #v 8#! mainland Indian [Concept('concept_state_region', '$concept_state_regions|q$')]."
 nesnd_yuanshan_regions_required_tt:0 "Our populated states lie in at least #v 4#! South African [Concept('concept_state_region', '$concept_state_regions|q$')] ($STATE_CAPE_COLONY$, $STATE_EASTERN_CAPE$, $STATE_NORTHERN_CAPE$, $STATE_ZULULAND$, $STATE_VRYSTAAT$, $STATE_TRANSVAAL$)."
 nesnd_commission_cooldown_tt:0 "This is our first attempt, or at least one year has passed since the last."
 nesnd_tianzhu_transfer:0 "Hand New Indian Lands to the Commission"
 nesnd_tianzhu_transfer_desc:0 "Since the commission was founded, the states we have newly acquired in Tianzhu are still governed from home. Handing them to the commission places their garrisons, customs and lawsuits under the commissioner on the spot."
 nesnd_tianzhu_transfer_tt:0 "Transfer all our directly held states in $region_north_india$, $region_south_india$ and $STATE_INDIAN_OCEAN_TERRITORY$ to the Tianzhu Commission."
 nesnd_yuanshan_transfer:0 "Hand New Yuanshan Lands to the Commission"
 nesnd_yuanshan_transfer_desc:0 "Since the commission was founded, the states we have newly acquired in Yuanshan are still governed from home. Handing them to the commission places them under the commissioner on the spot."
 nesnd_yuanshan_transfer_tt:0 "Transfer all our directly held states in South Africa to the Yuanshan Commission."
 nesnd_yuanshan_regions_bar:0 "Directly Ruled Regions in Yuanshan"
 nesnd_yuanshan_regions_bar_readout:0 "$nesnd_yuanshan_regions_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_yuanshan_regions_bar_change:0 "Change in directly ruled regions"
 nesnd_yuanshan_founded_tt:0 "The Yuanshan Commission has been established."
 nesnd_yuanshan_short_status:0 "Our directly ruled lands in Yuanshan are not yet enough for a separate commission."
 nesnd_yuanshan_waiting_status:0 "We rule enough of Yuanshan directly, but other conditions for the commission are not yet met."
 nesnd_yuanshan_ready_status:0 "The Yuanshan Commission can now be established."
 nesnd_tianzhu_founding_reward:0 "Commission Inaugurated"
 nesnd_india_owned_by_our_government:0 "owned by our government"
 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName] is a [ROOT.GetCountry.GetSubjectType.GetName] of [ROOT.GetCountry.GetOverlord.GetName], and part of our income goes to [ROOT.GetCountry.GetOverlord.GetName]. The government and investors of [ROOT.GetCountry.GetOverlord.GetName] own #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_overlord_levels')|0]#! building levels within our borders. When the court is short of money it can borrow from [ROOT.GetCountry.GetOverlord.GetName], and once it has savings it can pay to redeem our subject status. Redemption ends only the subject relationship. Foreign ownership of buildings in our country is not part of it."
 nesnd_mug_france_terms:0 "A loan is limited to @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|K], repaid as @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|K] over five years. The guarantee: if we fall into [concept_default] or declare [concept_bankruptcy] while repaying, we are in breach. The guarantee calls for a ten-year [concept_trade_privilege] for the lender. $nesnd_india_own_markets_tt$. If we cannot sign the treaty, our [concept_relations] with the lender suffer. The price of redeeming our subject status is @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|K]."
 nesnd_mug_council_intro:0 "With the reform of [ROOT.GetCountry.GetName] complete, our government can summon the princes of the princely states to one council and settle a common agreement on one matter: railways, famine relief or common defence. The princes come or stay away as they please. Those who attend share the benefits of the agreement with us, and those who stay away are not bound by it."
 nesnd_india_overseas_button_trade_tt:0 "Next we choose whom to approach among the local governments in this direction, listed by their [concept_relations] with us, at most four. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|K] once on signing."
 nesnd_india_overseas_button_port_tt:0 "Next we choose whom to approach among the local governments in this direction, listed by their [concept_relations] with us, at most four. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|K] once on signing. The treaty has no expiry date."
 nesnd_india_overseas_no_such_treaty_trade_tt:0 "We do not already hold [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] from it by treaty"
 nesnd_india_overseas_no_such_treaty_port_tt:0 "We do not already hold a [concept_treaty_port] from it by treaty"
 nesnd_india_overseas_record_free_trade_tt:0 "It has not granted [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] to another country through '$nesnd_india_overseas$'"
 nesnd_india_overseas_record_free_port_tt:0 "It has not ceded a [concept_treaty_port] to another country through '$nesnd_india_overseas$'"
 nesnd_india_overseas_port_named_1_tt:0 "It would cede [SCOPE.sState('india_overseas_port_1').GetName] to us as a [concept_treaty_port], the most populous of its states in this direction that it could cede."
 nesnd_india_overseas_port_claimed_1_tt:0 "Another country has a [concept_claim] on [SCOPE.sState('india_overseas_port_1').GetName], or it is among the aims of '$nesnd_per_west_journal$'. This does not stop us from asking."
