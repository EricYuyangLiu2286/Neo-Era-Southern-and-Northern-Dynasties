l_english:
 nesnd_india_schools:0 "Schools and Administration"
 nesnd_india_schools_reason:0 "The colleges of the capital can train a body of officials, but schooling in the provinces must be carried by the provinces themselves. Local offices need clerks who can keep accounts, and provincial schools must hire teachers. Buildings, paper and salaries all depend on regular local funds."
 nesnd_india_twelve_months_tt:0 "These conditions have been met for a total of twelve months."
 nesnd_india_mughal_court_tt:0 "Our government carries on from the Mughal state"
 nesnd_india_school_service:0 "Provincial Education"
 nesnd_india_schools_working:0 "Work on schools and administration is under way."
 nesnd_india_schools_paused:0 "Work on schools is suspended."
 nesnd_india_industry:0 "Workshops and Armies"
 nesnd_india_industry_reason:0 "Bengal's textiles are sold abroad, while the imperial army still carries outdated arms. Mines, toolworks and railways can link provincial resources and production, arming the army and giving workers new employment."
 nesnd_india_industrial_service:0 "Imperial Workshops"
 nesnd_india_industry_working:0 "Industrial and military preparations are under way."
 nesnd_india_industry_paused:0 "Industrial and military preparations are suspended."
 nesnd_india_reform:0 "Education and Industry"
 nesnd_india_reform_reason:0 "The old Mughal empire relied on the prestige of its sovereigns to bind the provinces together. French merchants and officers brought capital and new weapons, and French creditors gained influence in the provinces along with them. [ROOT.GetCountry.GetName] means to found its own schools and workshops with provincial revenues, and in time to train its own teachers and armourers."
 nesnd_india_choose_schools:0 "Prioritise Education"
 nesnd_india_choose_industry:0 "Prioritise Industry"
 nesnd_india_schools_completed_tt:0 "Complete Schools and Administration."
 nesnd_india_industry_completed_tt:0 "Complete Workshops and Armies."
 nesnd_india_reform_schools_status:0 "We are giving priority to schools and administration."
 nesnd_india_reform_industry_status:0 "We are giving priority to workshops and the army."
 nesnd_india_reform_schools_done_status:0 "Schools and administration are complete. We can now turn to workshops and the army."
 nesnd_india_reform_industry_done_status:0 "Workshops and the army are complete. We can now turn to schools and administration."
 nesnd_india_reform_waiting_status:0 "Schools, offices and workshops all need funding. We must decide where to begin."
 nesnd_india_request_4:0 "Negotiate Autonomy"
 nesnd_india_request_7:0 "Request Independence"
 nesnd_india_society:0 "Who Speaks for the Nation"
 nesnd_india_society_reason:0 "The provinces of [ROOT.GetCountry.GetName] have their own languages, faiths and former princes, and living under one government has not made their people compatriots. As schools and cities grow, educated people have begun to argue over who may speak for the country: the dynasty, local leaders or the new national movement."
 nesnd_india_community_bar:0 "A Common Nation"
 nesnd_india_dynastic_constitution:0 "Under One Crown"
 nesnd_india_republican_settlement:0 "The Nation Belongs to Its People"
 nesnd_india_union_status_invite_consent:0 "We have invited [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to join us, and await the consent of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_await').GetCountry.GetName] as its [concept_overlord]."
 nesnd_india_union_status_invite_sent:0 "We have invited [ROOT.GetCountry.MakeScope.Var('nesnd_india_request_partner').GetCountry.GetName] to join us, and await its answer."
 nesnd_india_society_status:0 "The provinces are seeking a common political home."
 nesnd_india_request_6:0 "Invite a Princely State"
 nesnd_india_caste:0 "Birth and Public Office"
 nesnd_india_caste_reason:0 "Schools have opened their doors, but inherited status still determines how far their pupils may rise. Appointing officers and officials by ability requires both new laws and education for families once excluded from it."
 nesnd_india_equal_service:0 "Open Public Service"
 nesnd_india_princes:0 "Among the Princes"
 nesnd_india_princes_reason:0 "Hindustan and the empires that succeed it, France and the United Federation of Ming have each offered terms to the princely states. The rulers of [ROOT.GetCountry.GetName] will accept outside help, but they mean to keep their hereditary lands and their right to levy taxes."
 nesnd_india_project_status_consent:0 "The planned project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) needs the consent of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_await').GetCountry.GetName]. We are awaiting an answer."
 nesnd_india_project_status_funder:0 "We have put our request for the project ([ROOT.GetCountry.GetCustom('nesnd_india_project_name')]) to the government of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] and are awaiting an answer."
 nesnd_india_project_status_building:0 "The [ROOT.GetCountry.GetCustom('nesnd_india_project_name')] in [ROOT.GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName] is under construction and must be finished by #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_project_build_clock'))]#!, or it will no longer be followed as a local project."
 nesnd_india_union_status_ask_consent:0 "We have asked to join [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName], and await the consent of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_await').GetCountry.GetName] as our [concept_overlord]."
 nesnd_india_union_status_ask_sent:0 "We have asked to join [ROOT.GetCountry.MakeScope.Var('nesnd_india_request_partner').GetCountry.GetName], and await its answer."
 nesnd_india_princes_status:0 "We are weighing the terms offered to us."
 nesnd_india_project_start:0 "Plan a Local Project"
 nesnd_india_project_withdraw_button:0 "Withdraw the Request"
 nesnd_india_defence_fra:0 "Seek a Defensive Pact with [SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_india_defence_mug:0 "Seek a Defensive Pact with [SCOPE.sCountry('nesnd_label_india_empire').GetName]"
 nesnd_india_defence_usm:0 "Seek a Defensive Pact with [SCOPE.sCountry('nesnd_label_usm').GetName]"
 nesnd_india_union_ask_button:0 "Ask to Join [SCOPE.sCountry('nesnd_label_india_empire').GetName]"
 nesnd_india_usm:0 "The Lands of Tianzhu"
 nesnd_india_usm_reason:0 "The Southern Court’s possessions in India lie across the sea, and merchants, garrisons and local princes each have their own interests there. Nanjing may send officials to govern them directly, or hand them to a separate Pacification Commission. All for the glory and the taxes of the Celestial Court!"
 nesnd_tianzhu_regions_bar:0 "Directly Ruled Regions in Tianzhu"
 nesnd_tianzhu_founded_tt:0 "The Tianzhu Commission has been established."
 nesnd_tianzhu.1.t:0 "The Commission Opens Its Office"
 nesnd_tianzhu.1.d:0 "The Tianzhu Pacification Commission has opened its office. All our directly held states in Tianzhu now belong to the commission, and from now on its commissioner decides garrison, customs and court matters on the spot. Nanjing keeps only the right to appoint and dismiss the commissioner, and collects the revenue on time.\n\nSo long as the revenue arrives on time, Nanjing need no longer concern itself with how the princes, merchant houses and villages of Tianzhu deal with the commission."
 nesnd_tianzhu.1.f:0 "“The garrisons, customs and lawsuits of Tianzhu are to be decided on the spot by the Pacification Commission. The Commissioner is appointed and removed by Nanjing, and the annual revenue is to be remitted on time.”\n- Edict establishing the Commission"
 nesnd_tianzhu.1.a:0 "The commissioner shall dispense the court's grace in its name."
 nesnd_india_usm_ready_status:0 "Our directly ruled lands in Tianzhu now meet the territorial requirement for a separate commission."
 nesnd_india_usm_status:0 "Our directly ruled lands in Tianzhu are not yet enough for a separate commission."
 nesnd_india_circars_suppress:0 "Disrupt Organisations in Circars"
 nesnd_india_kurnool_suppress:0 "Disrupt Organisations in Kurnool"
 nesnd_india_madras_suppress:0 "Disrupt Organisations in Madras"
 nesnd_india_mysore_suppress:0 "Disrupt Organisations in Mysore"
 nesnd_india_travancore_suppress:0 "Disrupt Organisations in Travancore"
 nesnd_india_gujarat_suppress:0 "Disrupt Organisations in Gujarat"
 nesnd_india_unified:0 "Unity and a New Order"
 nesnd_india_unified_reason:0 "[ROOT.GetCountry.GetName] has taken up the cause of uniting $region_north_india$ and $region_south_india$. The old borders between the states are losing their political meaning, but the provinces still follow different customs of taxation and schooling. For common laws to take effect across the country, we must give our local offices the means to collect taxes and maintain schools and public offices."
 nesnd_india_unified_lobby:0 "The unification of $region_north_india$ and $region_south_india$ is not yet complete. The old borders between the states are losing their political meaning, but each province keeps its own customs of taxation and schooling. For common laws to take effect across the country, the new government must give its local offices the means to collect taxes and maintain schools and public offices."
 nesnd_india_unified_status:0 "In $region_north_india$ and $region_south_india$, we and our [Concept('concept_subject', '$concept_subjects|q$')] hold #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#! of the populated [Concept('concept_state', '$concept_states|q$')] held by countries whose capitals lie there. States held by countries with capitals elsewhere, or by their subjects, are not counted. Our own states always count."
 nesnd_india_unified_share_tt:0 "In $region_north_india$ and $region_south_india$, we and our [Concept('concept_subject', '$concept_subjects|q$')] hold at least #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_unified_share_needed')|0]%#! of the populated [Concept('concept_state', '$concept_states|q$')] held by countries whose capitals lie there (now #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!). States held by foreign countries and their subjects are not counted"
 nesnd_india_unified_reward:0 "A Common State"
 nesnd_india_dynasty_journal:0 "The Dynasty’s Standing"
 nesnd_india_dynasty_journal_reason:0 "The dynasty’s old prestige still carries weight, but its subjects also judge their sovereign by the conduct of government. Respect for the provinces’ faiths and the court’s ability to make its own decisions will decide their loyalty."
 nesnd_india_dynasty_bar:0 "Support for the Dynasty"
 YU1:0 "Yuanshan"
 TZ1:0 "Tianzhu"
 nesnd_india_french_advisers:0 "Foreign Advisory Mission"
 nesnd_india_dynasty_legitimacy:0 "Government [concept_legitimacy]"
 nesnd_india_dynasty_dependence:0 "Reliance on the [GetStaticModifier('nesnd_india_french_advisers').GetName]"
 nesnd_india_community_education:0 "Schools and [concept_literacy]"
 nesnd_india_community_unrest:0 "Social [concept_turmoil]"
 nesnd_india_case_organisation:0 "Local organisation"
 nesnd_india_case_unrest_growth:0 "Local [concept_turmoil]"
 nesnd_india_case_transport:0 "Transport and market links"
 nesnd_india_case_foreign_training:0 "Officers and training"
 nesnd_india_french_officers:0 "Foreign Military Instructors"
 nesnd_india_case_decay:0 "Suspended contact"
 nesnd_india_priority_desc:0 "Education and industry both need funding from the treasury, and we must decide which comes first."
 nesnd_india_priority_cooldown_tt:0 "At least a year has passed since the last change of reform priority."
 nesnd_india_priority_tt:0 "Make this our reform priority. The other programme pauses without losing its gains."
 nesnd_india_settlement_desc:0 "The provinces demand to elect representatives and take part in national legislation."
 nesnd_india_national_settlement:0 "A National Settlement"
 nesnd_india_keep_power_law_tt:0 "Our current $lawgroup_distribution_of_power$ law is kept and does not change to [GetLawType('law_census_voting').GetName]."
 nesnd_india_keep_governance_tt:0 "Our current $lawgroup_governance_principles$ are kept and do not change to [GetLawType('law_presidential_republic').GetName]."
 nesnd_india_community_ready_tt:0 "$nesnd_india_community_bar$ has reached #v 75#!."
 nesnd_india_dynasty_ready_tt:0 "$nesnd_india_dynasty_bar$ has reached #v 60#!."
 nesnd_tianzhu_governance:0 "Governing Tianzhu"
 nesnd_tianzhu_governance_reason:0 "Tianzhu’s merchants know the sea trade, while land tax and local affairs inland mostly pass through the hands of princes and village communities. The commissioner is charged with governing the ports and supplying the garrisons, but to carry schooling and taxation into the villages he must also win local cooperation."
 nesnd_yuanshan_commission:0 "A Commission for Yuanshan"
 nesnd_yuanshan_commission_reason:0 "Yuanshan’s ports face two oceans and offer our fleets a foothold in southern Africa. A commission can be established only after we have secured and developed possessions there."
 nesnd_yuanshan_governance:0 "Governing Yuanshan"
 nesnd_yuanshan_governance_reason:0 "Yuanshan's ports have become stations on the routes between two oceans, and the government of the interior has only just begun. Roads, tax offices and schools must be built alongside the garrisons if the commission's authority is to reach inland from the coast."
 nesnd_india_foreign:0 "Missions Abroad"
 nesnd_india_foreign_reason:0 "[ROOT.GetCountry.GetName] wants schools, workshops and a modern army, but lacks the teachers, engineers and instructors to build them, and the money besides. Our overlord or a foreign government can send advisers and provide a grant. The advisers serve here for four years at our expense, and we will owe the funding country an [concept_obligation]."
 nesnd_india_uprising:0 "The Fires of the Rising"
 nesnd_india_uprising_reason:0 "The United Federation of Ming and its Tianzhu Commission hold their rule through ports, garrisons and local allies. The local organisations that oppose them need money and support from outside before they can rise openly. [ROOT.GetCountry.GetName] can fund their struggle for independence, but the insurgents will decide the fate of the land they take, and our support confers no right to govern it."
 nesnd_india_contact_bar:0 "Local Preparation"
 nesnd_india_frontier_ask_access_bhu_tt:0 "We ask [SCOPE.sCountry('india_frontier_bhu').GetName] for [concept_military_access]. If [SCOPE.sCountry('india_frontier_bhu').GetName] agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of five years, and we pay [SCOPE.sCountry('india_frontier_bhu').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|K] on signing."
 nesnd_india_frontier_consent_their_bhu_tt:0 "[SCOPE.sCountry('india_frontier_bhu').GetName] is a subject of [SCOPE.sCountry('india_frontier_bhu').GetOverlord.GetName], whose consent must come first. Only then is the request passed to [SCOPE.sCountry('india_frontier_bhu').GetName]."
 nesnd_india_frontier_ask_access_nep_tt:0 "We ask [SCOPE.sCountry('india_frontier_nep').GetName] for [concept_military_access]. If [SCOPE.sCountry('india_frontier_nep').GetName] agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of five years, and we pay [SCOPE.sCountry('india_frontier_nep').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_frontier_payment')|K] on signing."
 nesnd_india_frontier_consent_their_nep_tt:0 "[SCOPE.sCountry('india_frontier_nep').GetName] is a subject of [SCOPE.sCountry('india_frontier_nep').GetOverlord.GetName], whose consent must come first. Only then is the request passed to [SCOPE.sCountry('india_frontier_nep').GetName]."
 nesnd_india_imperial_army:0 "Army of Hindustan"
 nesnd_tianzhu_commission_name:0 "Tianzhu Pacification Commission"
 nesnd_establish_tianzhu:0 "Establish the Tianzhu Commission"
 nesnd_establish_tianzhu_desc:0 "Tianzhu lies ten thousand li from Nanjing. The court proposes a Pacification Commission whose commissioner will direct its military and civil affairs on the spot."
 nesnd_establish_tianzhu_tt:0 "Transfer all our directly held states in $region_north_india$, $region_south_india$ and $STATE_INDIAN_OCEAN_TERRITORY$ to the Tianzhu Commission as a [concept_dominion]. $STATE_MADRAS$ becomes its seat if we still hold it. Otherwise our most populous [concept_state] there does. Our subjects are unaffected."
 nesnd_yuanshan_commission_name:0 "Yuanshan Pacification Commission"
 nesnd_establish_yuanshan:0 "Establish the Yuanshan Commission"
 nesnd_establish_yuanshan_desc:0 "Place our Yuanshan possessions under a commissioner appointed by the central government."
 nesnd_establish_yuanshan_tt:0 "Transfer all our directly held states in South Africa to the Yuanshan Commission as a [concept_dominion]. $STATE_ZULULAND$ becomes its seat if we still hold it. Otherwise our most populous state there does. Our subjects keep their lands."
 nesnd_commission_governance_reward:0 "An Established Administration"
 dp_nesnd_india_circars_tooltip:0 "A play to recover this state, allowing a negotiated peace."
 dp_nesnd_india_kurnool_tooltip:0 "A play to recover this state, allowing a negotiated peace."
 dp_nesnd_india_madras_tooltip:0 "A play to recover this state, allowing a negotiated peace."
