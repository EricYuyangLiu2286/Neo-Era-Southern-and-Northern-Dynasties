l_english:
 je_group_nesnd_succession:0 "The Southern Polities"
 nesnd_south_succession_board:0 "The Southern Polities"
 nesnd_south_succession_board_reason:0 "Whose realm is Southern Ming: the Zhu emperor’s, or the Zheng family’s creation? Nanjing retains the imperial succession, while the Southern Administration in Hangzhou commands the troops and revenues that sustain reform. The Western provinces and Hangzhou could postpone their dispute over sovereign and minister while resisting the North. With reform reaching deep into provincial life, they can no longer avoid the question of who will govern.\n\nHuguang’s academies and Xiangfan’s troops uphold the Zhu succession, while Sichuan’s republicans continue to debate the Southern Administration’s reforms. Governors in the Southern Seas and lords in Japan weigh the land, money and soldiers a new dynasty might demand. Representatives in the Assembly of Rites, ministers in the cabinet and provincial commanders will eventually have to answer for their choices."
 nesnd_south_succession_board_status:0 "The provinces and overseas states are declaring their positions and preparing their governments and forces. The dispute over Southern government now reaches across the seas."
 nesnd_board_table_heading:0 "The Southern Countries"
 nesnd_board_country_metrics:0 "Regular #v [Country.GetRegularBattalions|0]#! / Conscriptable #v [Country.CalcConscriptableBattalions|0]#!　Ships #v [Country.GetNumShips|0]#!\nFixed balance @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　Army projection #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\nSupply preparations: [Country.GetCustom('nesnd_board_supply_loc')]"
 nesnd_board_supply_known:0 "#v [Country.MakeScope.Var('nesnd_board_supply_score').GetValue|0] / 4#! conditions"
 nesnd_board_supply_unknown:0 "Not assessed"
 nesnd_board_stance_unstated:0 "Undeclared"
 nesnd_board_stance_ming:0 "Ming"
 nesnd_board_stance_wu:0 "Wu"
 nesnd_board_stance_neutral:0 "Neutral"
 nesnd_board_stance_autonomy:0 "Autonomy"
 nesnd_board_stance_available_tt:0 "The civil war has not begun, and six months have passed since our last change of allegiance. Xiangfan remains committed to Ming; the central court cannot choose neutrality or autonomy."
 nesnd_board_stance_effect_tt:0 "Declare our alignment, fixed for #v 6 months#!. Withdrawing an existing commitment also cancels unfulfilled consent to integration or cession and reduces relations with the centre by #n 15#!."
 nesnd_board_choose_ming:0 "Support the Ming Court"
 nesnd_board_choose_ming_desc:0 "The Zhu succession remains the recognised authority of the Southern provinces and overseas states. Support Ming government under the constitution and limits on Hangzhou’s dominance."
 nesnd_board_choose_wu:0 "Support the Zheng House"
 nesnd_board_choose_wu_desc:0 "The Zheng family has long commanded the Southern realm’s military and fiscal power. Support the King of Wu in founding a dynasty whose constitution defines the powers of monarch and assembly."
 nesnd_board_choose_neutral:0 "Remain Neutral"
 nesnd_board_choose_neutral_desc:0 "The Ming court and Hangzhou press rival claims. Remain outside the succession dispute for now and attend to our own trade and defence."
 nesnd_board_choose_autonomy:0 "Seek Autonomy"
 nesnd_board_choose_autonomy_desc:0 "As the court disputes the succession, seek control of our own taxation, appointments and defence. Make our position clear to both Ming and Wu."
 nesnd_board_ming_bar_name:0 "Ming Declarations"
 nesnd_board_wu_bar_name:0 "Wu Declarations"
 nesnd_board_ming_bar_desc:0 "Ming supporters among registered countries: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
 nesnd_board_wu_bar_desc:0 "Wu supporters among registered countries: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
 nesnd_board_compact_bar_name:0 "Support for the Settlement"
 nesnd_board_pressure_bar_name:0 "Gathering Conflict"
 nesnd_board_compact_bar_desc:0 "Commitments: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_pressure_bar_desc:0 "Succession pressure: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_federal_compact_button_outcome_tt:0 "Central negotiation progress #p +20#!; succession pressure #p −8#!. Renewal is available after #v 18 months#!."
 nesnd_south_compact_detail_tt:0 "#bold Support for the settlement#!\nMainland, overseas and Japanese governments account for #v 50%, 30% and 20%#! respectively. Commitments last #v 36 months#! and cease to count after a change of alignment or overlord, war against the centre, or withdrawal.\n\n#bold A peaceful constitutional settlement#!\nThe chosen side needs political support of #v 85#! and a lead of #v 20#!, sustained for #v 12 months#!. Ming needs #v 75%#! commitment support and at least two mainland core governments. Wu needs #v 80%#!, consent from every government due for integration and the Japanese territorial parties, and a sufficiently prepared fleet. A completed settlement ends the dispute."

 nesnd_board_not_ming_tt:0 "This country has not declared support for the Ming court."
 nesnd_board_not_wu_tt:0 "This country has not declared support for the Zheng regime."
 nesnd_board_not_neutral_tt:0 "This country has not declared neutrality."
 nesnd_board_not_autonomy_tt:0 "This country has not declared its intention to seek autonomy."
