l_english:
 je_group_nesnd_succession:0 "The Southern Polities"
 nesnd_south_succession_board:0 "The Southern Polities"
 nesnd_south_succession_board_reason:0 "Hangzhou commands the central forces, revenues and ocean routes; Nanjing retains the seals of the Zhu emperor. Provincial tributes enter a common treasury while ships serve distant shores. The generals of Huguang and Sichuan, the governors of Nanyang and the rulers of Japan will answer the court in their own names."
 nesnd_south_succession_board_status:0 "Positions and national conditions update weekly. A declaration records public alignment; entry into war, independence and territorial transfers follow their diplomatic and event procedures."
 nesnd_board_table_heading:0 "Positions and national conditions"
 nesnd_board_country_metrics:0 "Regular #v [Country.GetRegularBattalions|0]#! / Conscriptable #v [Country.CalcConscriptableBattalions|0]#!　Ships #v [Country.GetNumShips|0]#!\nFixed balance @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　Army projection #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\nSupply preparations: [Country.GetCustom('nesnd_board_supply_loc')]"
