l_english:
 glossary_nesnd_beiming: "Northern Ming"
 glossary_nesnd_beiming_desc: "#b;italic Northern Ming#! is the Ming dynasty from the Yongle Emperor's sudden death on a hunt in 1408 until Qin and Yan overthrew it in 1707. The two centuries after the Xuande Emperor's death in 1433 are known as the [Glossary('glossary_nesnd_beiming_zhanguoshi','Northern Ming Warring States')].\n\nAfter the [Glossary('glossary_nesnd_saiwang_rebellion','Rebellion of the Frontier Princes')], the Xuande Emperor's garrisons hardened into [Glossary('glossary_nesnd_fanzhen','military fiefs')], and the realm came to resemble the late Tang and the Five Dynasties. The fiefs became self-governing states, and Wu, Qin, Yue and Min colonised the Southern Seas, Central Asia and the New World. The [Glossary('glossary_nesnd_central_plains_wars','Central Plains Wars')] produced the [Glossary('glossary_nesnd_coalition_order','Coalition Order')] of a Southern and a Northern Army. Qin and Yan allied in 1705 and took Yanjing in the [Glossary('glossary_nesnd_overthrow_of_ming','Overthrow of the Ming')]. Their rulers proclaimed themselves emperors, while the southern princes founded the Southern Ming."

 glossary_nesnd_beiming_zhanguoshi: "Northern Ming Warring States"
 glossary_nesnd_beiming_zhanguoshi_desc: "#b;italic Chronicles of the Northern Ming Warring States#! is a novel by Mu Muzi, youngest sister of Mu Zhongtang, founder of the Empire of China. Written over thirty-five years of her middle and later life in five major and ten minor volumes, it runs from the Yongle Emperor's death in 1408 to the [Glossary('glossary_nesnd_treaty_of_yangzhou','Treaty of Yangzhou')] of 1835. Much of the fifth volume, on the years of the Great Revolution, came from Mu Zhongtang's own recollections.\n\nMu Muzi divided the age from the Xuande Emperor's death in 1433 to the fall of the Ming into three stages: the Yanjing Order, the Order of the Military Fiefs and the [Glossary('glossary_nesnd_coalition_order','Coalition Order')]. Later writers named the age after her book."

 glossary_nesnd_saiwang_rebellion: "Rebellion of the Frontier Princes"
 glossary_nesnd_saiwang_rebellion_desc: "The #b;italic Rebellion of the Frontier Princes#! opened the Northern Ming. When the Yongle Emperor died suddenly after his usurpation, the Princes of Ning, Jin and Qi and other sons of the Hongwu Emperor rose against the Hongxi Emperor in Yanjing. The two princes in Guanzhong stayed neutral, and the Prince of Zhou fled to Guangdong rather than join the rebels. After more than three years both sides made peace.\n\nThe Xuande Emperor later destroyed Jin and subdued Ning. In 1433 he died at Luoyang while marching against the Prince of Shu, who had seized Guanzhong. The Zhu princes never recovered, and lords of other surnames took their place."

 glossary_nesnd_fanzhen: "Military Fiefs"
 glossary_nesnd_fanzhen_desc: "#b;italic Military fiefs#! is the common name for the regional powers of the Northern Ming. From 1425 the Xuande Emperor, wary of the Nanjing Protector Zheng He, sent him back to the Western Seas and stationed the frontier troops of Hebei across the realm as 'Grand Garrisons' under the Ministry of War.\n\nAfter his death, military nobles dominated the court, and garrison commanders seized their cities and opened their own administrations. They still held Ming titles, as the warlords of the late Tang and Five Dynasties remained military governors in name. The emperors kept their court but could never restore the unity of the Yongle and Xuande reigns, much like the Tang emperors after the mid-Tang."

 glossary_nesnd_central_plains_wars: "Central Plains Wars"
 glossary_nesnd_central_plains_wars_desc: "The #b;italic Central Plains Wars#! were six great wars in which the Northern Ming [Glossary('glossary_nesnd_fanzhen','military fiefs')] fought for the Central Plains. After the first (1500–1503), the princes swore the Fengyang Covenant, which kept the Central Plains at peace for nearly a century. After the second (1549–1553), Yanjing could no longer restrain the princes. The third (1611–1619) broke the covenant's order, and in the fourth (1706–1713) Qin and Yan destroyed the Northern Ming.\n\nAfter the fifth (1788–1792), Qin and Yan opened the sixth in 1800. The three courts of Qin, Yan and Ming drained their realms for their ambitions of unification and suppressed gentry, merchants, workers and peasants alike. Trade and harvests declined and revolts broke out from Dongning to Qiangcheng. In 1810, in the middle of the war, revolution broke out in Qin."

 glossary_nesnd_coalition_order: "Coalition Order"
 glossary_nesnd_coalition_order_desc: "The #b;italic Coalition Order#! defined the last Northern Ming century (1611–1707). Zheng He had held Jiangnan as Nanjing Protector, and his house inherited the title Duke of Wu. In 1443 Xu Qiye, Marquis of Tianjin, seized the emperor in the Gate Coup, became Duke of Yan and commanded part of the capital army as Grand Preceptor.\n\nAfter the third [Glossary('glossary_nesnd_central_plains_wars','Central Plains War')], the realm split into two armies. The Southern Army, led by the Duke of Wu as Nanjing Protector and head of the Five Armies Command, marched against the Duke of Yan, Regent and Grand Preceptor of the Five Armies at Tianjin, in the name of purging the emperor's side and saving the emperor and his people, and was as often attacked in return. The Northern Army was Yan with Chen Qin joining at times. The Southern Army was the looser of the two. Both sides bargained with Chu, Shu, Qi and other surviving states. Yue lost its colonial fleet in the Wu–Yue War (1669–1675) and surrendered to Nanjing, and Min survived by ceding interests to Wu."

 glossary_nesnd_overthrow_of_ming: "Overthrow of the Ming"
 glossary_nesnd_overthrow_of_ming_desc: "The #b;italic Overthrow of the Ming#! was the campaign of the fourth [Glossary('glossary_nesnd_central_plains_wars','Central Plains War')] in which Qin and Yan destroyed the Ming court at Yanjing (1706–1707). After their alliance of 1705, Yan's metropolitan armies and Qin's Anbei dragoons besieged Beijing, while Qi, Wu, Chu, Shu, Huai and Ning declared war on them. The [Glossary('glossary_nesnd_coalition_order','Coalition Order')] ended with it.\n\nThe rulers of Yan and Qin then took the imperial title. At Nanjing the southern princes, led by the Duke of Chu and the Prince of Huai, signed the Edict of Federation against the Usurpers and elected a Zhu prince emperor of the Southern Ming, or Great Ming Federation. Its members preferred security to reconquest and kept the peace with Yan and Qin for decades."

 glossary_nesnd_chinese_revolution: "Chinese Great Revolution"
 glossary_nesnd_chinese_revolution_desc: "The #b;italic Chinese Great Revolution#! overthrew the northern dynasties of Qin and Yan in the early nineteenth century. In the later years of the fifth and sixth [Glossary('glossary_nesnd_central_plains_wars','Central Plains Wars')], the three courts drained their realms for their ambitions of unification, suppressed gentry, merchants, workers and peasants, and left the economy in decline and revolt everywhere. In 1810, after the [Glossary('glossary_nesnd_lantian_mutiny','Lantian Mutiny')], Qin soldiers marched on Chang’an and joined the city's republicans in the [Glossary('glossary_nesnd_changan_uprising','Chang’an Uprising')], which began the [Glossary('glossary_nesnd_western_qin_revolution','Western Qin Great Revolution')].\n\nIn 1815 Mu Zhongtang turned back from the [Glossary('glossary_nesnd_eastern_campaigns','Eastern Campaigns')], overthrew the Young Faction government through the [Glossary('glossary_nesnd_gulou_society','Drum Tower Society')] and had Wu Sheng killed. Chen Dongyang and other republicans fled south to the protection of Zheng Qin of Wu. In 1819 Mu destroyed Yan, abolished the republic at Kaifeng and crowned himself emperor. His [Glossary('glossary_nesnd_southern_campaign','Southern Campaign')] stalled at Xiangyang and failed in 1822. In 1835 the [Glossary('glossary_nesnd_treaty_of_yangzhou','Treaty of Yangzhou')] divided north and south along the Yangtze."

 glossary_nesnd_lantian_mutiny: "Lantian Mutiny"
 glossary_nesnd_lantian_mutiny_desc: "The #b;italic Lantian Mutiny#! set off the Western Qin Great Revolution. During the sixth [Glossary('glossary_nesnd_central_plains_wars','Central Plains War')], the Qin army was hit by one case after another of embezzled and unpaid army funds. The cases centerd on engineer units and works procurement, and so many frontline officers were arrested that the deployment of Qin's technical troops seized up. The high command still ordered assaults on the Ming mountain line at Jiange.\n\nIn the spring of 1810 a group of young frontline officers formed a brotherhood in the old Qin manner, the Society for the Heart of Heaven and Earth. Led by He Bochen, Mu Zhongtang and Su Ahong (Su Hong), they slipped into the Lantian camp south of Chang’an, where the wounded and reserves were quartered. Stirred by Mu, the camp was in their hands the next day. They chose the older and higher-ranking republican officer He Bochen as leader, arrested the senior officers and marched on Chang’an under the cry 'Pay for the soldiers, justice for the wronged, a plea to our sovereign father'."

 glossary_nesnd_changan_uprising: "Chang’an Uprising"
 glossary_nesnd_changan_uprising_desc: "The #b;italic Chang’an Uprising#! began the Western Qin Great Revolution. During the war Wu Sheng, a republican leader wanted by every court, had returned to Chang’an in secret. Under cover of the Lingbei Huiyong Company, a republican firm that procured supplies for the Qin army, he handed out goods and books in the slums, opened schools and armed a guard of labourers with weapons leaked from the army.\n\nIn 1810 the troops of the [Glossary('glossary_nesnd_lantian_mutiny','Lantian Mutiny')] were surrounded by the Imperial Guard outside the capital. Mu Zhongtang and others set fires at night and slipped into the city in plain clothes. The next day some officers who still trusted the emperor demanded an audience against Mu's objections, and Emperor Chen Jiong ordered them cut down. In the chaos Wu Sheng roused the townspeople and, with Chen Dongyang and Deng Mingyu, seized the gate batteries and shelled the Guard outside. Su Ahong took the arsenal and opened the gates to the Lantian soldiers. The revolutionaries then shelled the palace in Chang’an and hanged Chen Jiong."

 glossary_nesnd_western_qin_revolution: "Western Qin Great Revolution"
 glossary_nesnd_western_qin_revolution_desc: "The #b;italic Western Qin Great Revolution#! was the republican revolution that broke out in Qin in 1810. After the [Glossary('glossary_nesnd_changan_uprising','Chang’an Uprising')], elders of the old secret Citizens' Faction headed the republican government. The Eastern Republic was proclaimed in 1812 and, after several changes of name, became the Great Han Commonwealth. The elders could not cope with the crises at home and abroad, and turned on the soldiers who had stormed the palace, nearly putting them on trial.\n\nIn 1814 Chen Dongyang published 'On the Eastern Revolution' and the 'Republican Constitution', setting out the ideal of a commonwealth of all peoples. In March 1815 the Young Faction of the 'Four Republicans', Mu Zhongtang, Wu Sheng, Chen Dongyang and Deng Mingyu, seized the leadership of the revolution. Chen became head of state as Duke of Zhou, and Wu Sheng became Duke of Shao."

 glossary_nesnd_gulou_society: "Drum Tower Society"
 glossary_nesnd_gulou_society_desc: "The #b;italic Drum Tower Society#! overthrew the Young Faction government of the [Glossary('glossary_nesnd_western_qin_revolution','Western Qin Great Revolution')] in July 1815. As the Young Faction's land reform slipped out of control, Mu Zhongtang returned suddenly from the front. Backed by the army and the citizens, he and Deng Mingyu formed a secret society and staged a coup. Accusing Wu Sheng, their schoolmate and fellow leader, of wrecking the revolution through tyranny, they seized and killed him. Chen Dongyang could not stop them and fled to the Southern Ming.\n\nThe next year the Commonwealth became the Chinese Federation, and 'Unite the world, revive the nation' replaced 'A commonwealth of all peoples' as its aim. Deng Mingyu then fled south with his family."

 glossary_nesnd_eastern_campaigns: "Eastern Campaigns of Mu Zhongtang"
 glossary_nesnd_eastern_campaigns_desc: "The #b;italic Eastern Campaigns of Mu Zhongtang#! were his wars for the Commonwealth against Yan and the Southern Ming (1815–1819). In 1815 he beat the Ming–Yan allies at Dongting Lake and Xuzhou, where Zhu Banbo, of a cadet branch of the Ming house, made his name by saving his army. In the second campaign of 1818 the Ming Prince of Huai fell to a stray bullet and the old Western Administration army was nearly wiped out.\n\nIn early 1819 Mu routed the Yan army at Dezhou and Shulu, beheaded the Yan emperor Xu Jian and entered Beijing, ending 379 years of Xu rule. Xu Dingyuan, Governor-General of Liaodong, escaped to Liaoyang, proclaimed himself regent and founded Eastern Yan."

 glossary_nesnd_southern_campaign: "Southern Campaign"
 glossary_nesnd_southern_campaign_desc: "The #b;italic Southern Campaign#! was Mu Zhongtang's attempt to unite north and south after the [Glossary('glossary_nesnd_eastern_campaigns','Eastern Campaigns')] (1820–1822). Following the 'Notes on the Southern Campaign', he split his army in three: one force held Hanzhong against Sichuan, a raiding force struck from Xuzhou into the Huai region, and the emperor besieged Xiangyang. Zhu Banbo held Xiangyang, and Xiao Huli stopped Fei Xiyi at Jiange.\n\nAt Xuzhou the Southern Administration army under Zheng (Tokugawa) Jiaqi let the Western Administration army perish. Su Hong crossed the Yangtze but was routed beneath Nanjing by Zheng Qin. In the autumn of 1821 the Qin court in refuge at Shanzhou marched east. Mu broke it at Lanzhou, and its remnants withdrew to Ili as Western Qin. The campaign ended in failure."

 glossary_nesnd_zhang_baili_expedition: "Zhang Baili's Northern Expedition"
 glossary_nesnd_zhang_baili_expedition_desc: "#b;italic Zhang Baili's Northern Expedition#! was the campaign in which the imperial generals Zhang Baili and Hua Yiguan destroyed Eastern Yan (1823–1824). After the failed [Glossary('glossary_nesnd_southern_campaign','Southern Campaign')], Mu Zhongtang pressed on with unification in other directions. In 1823 the Yan regent Xu Dingyuan died of illness and his eight sons fought over the succession, and Mu sent Zhang Baili and Hua Yiguan north against Yan. In six months deep in the northeast, the army took Fengtian in 1824 and destroyed the Yan ancestral temples and state there, then pressed north and swept the northeast as far as the source of the Heilongjiang. Along the way it dealt harshly with the Jurchen and Han warlords who had served the Yan court. Zhang Baili was made Duke of the North for his service. Most of the Yan military families who submitted were taken into imperial service and still hold commissions today.\n\nThe remnants of the Yan forces either crossed the sea to the Southern Ming or fled into the Greater Khingan, and later became the first settlers of the empire's northeast. The forests there are vast and the empire had few troops to spare, so the purge barely grazed the surface. Old Yan officers and Jurchen chiefs still keep to their stockades in the hills and forests."

 glossary_nesnd_treaty_of_yangzhou: "Treaty of Yangzhou"
 glossary_nesnd_treaty_of_yangzhou_desc: "The #b;italic Treaty of Yangzhou#! was concluded between the Empire of China and the Southern Ming in 1835. Following the failed [Glossary('glossary_nesnd_southern_campaign','Southern Campaign')], it ended hostilities and divided the land between the two courts along the Yangtze."

 glossary_nesnd_eight_provinces: "Eight Provinces"
 glossary_nesnd_eight_provinces_desc: "In Northern Ming usage, the #b;italic Eight Provinces#! comprised [GetStateRegion('STATE_SHENGJING').GetName], [GetStateRegion('STATE_SOUTHERN_MANCHURIA').GetName], [GetStateRegion('STATE_SONGJIANG').GetName], [GetStateRegion('STATE_NORTHERN_MANCHURIA').GetName], [GetStateRegion('STATE_OKHOTSK').GetName], the area around [GetStateRegion('STATE_OUTER_MANCHURIA').GetName], [GetStateRegion('STATE_SAKHALIN').GetName] and [GetStateRegion('STATE_KAMCHATKA').GetName]. As the Northern Ming expanded eastwards and extended its rule through the Nurgan Regional Military Commission, the Liaodong garrisons retained some of the place names used by the local Wild Jurchens. The lands gradually came to be known collectively as the Eight Provinces. After the Great Yan took control of the northeast, it established a transport commission in each province, fixing these names in official usage."
