 nesnd_palace_journal:0 "Power at Court"
 nesnd_palace_journal_reason:0 "Those close to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] never lack petitioners. A favourite runs the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s errands and also finds offices and income for their own associates. The largest interest group in [ROOT.GetCountry.GetName] either contends with the favourite or is led by the favourite outright. The greater the favourite's power, the faster the government's business moves, and the more graft and resentment it breeds."
 nesnd_palace_status_a:0 "The favourite [ROOT.GetCountry.GetCustom('nesnd_power_holder_name')] does not lead [ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')], which is led by [ROOT.GetCountry.GetCustom('nesnd_power_leader_name')]. The Balance of Power shows [ROOT.GetCountry.GetCustom('nesnd_power_holder_name')]'s side against [ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]. [ROOT.GetCountry.GetCustom('nesnd_power_relation_text')] Above #v 90#! or below #v 10#!, a full Court Intrigue bar may produce an extreme event.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_palace_end_rules When this journal lapses#!#!"
 nesnd_palace_status_b:0 "The favourite [ROOT.GetCountry.GetCustom('nesnd_power_holder_name')] also leads [ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]. The Balance of Power shows this overmighty minister against all other factions. Above #v 90#! or below #v 10#!, a full Court Intrigue bar may produce an extreme event.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_palace_end_rules When this journal lapses#!#!"
 nesnd_palace_status_vacant:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has not appointed a favourite. The Favourite's Power drains each month until a new favourite is appointed, who inherits half of it.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_palace_end_rules When this journal lapses#!#!"
 nesnd_cabinet_journal:0 "Head of State and Factions"
 nesnd_cabinet_journal_reason:0 "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of [ROOT.GetCountry.GetName] holds power through votes and the backing of interest groups. The largest faction in society is not necessarily out of government. It is often a colleague in the ruling coalition. If the two think alike they cooperate easily, but the larger faction may gradually take over. If they are at odds, it obstructs at every turn. The more power the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] holds, the more smoothly the government works, and the more chances there are to reward loyalists."
 nesnd_cabinet_status_a:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] does not lead the largest [concept_interest_group]. The Balance of Factions shows [ROOT.GetCountry.GetRuler.GetFullName]'s side against [ROOT.GetCountry.GetCustom('nesnd_power_leader_name')] of [ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]. [ROOT.GetCountry.GetCustom('nesnd_power_relation_text')] Above #v 90#! or below #v 10#!, a full Political Storm bar may produce an extreme event.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_cabinet_end_rules When this journal lapses#!#!"
 nesnd_cabinet_status_b:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] also leads [ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]. The Balance of Factions shows [ROOT.GetCountry.GetRuler.GetFullName] against all other factions. Above #v 90#! or below #v 10#!, a full Political Storm bar may produce an extreme event.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_cabinet_end_rules When this journal lapses#!#!"
