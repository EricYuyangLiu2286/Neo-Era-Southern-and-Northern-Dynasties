 nesnd_palace.11.t:0 "A Quarrel before the Ruler"
 nesnd_palace.11.d_a:0 "The favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], leader of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], fell to arguing in front of [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]. Each demands that the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] take a side on the spot, and none of the ministers present will speak first."
 nesnd_palace.11.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], favourite and leader of the [SCOPE.sCharacter('nesnd_power_holder_scope').GetInterestGroup.GetName], berated the representatives of the other groups before [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] and demanded they withdraw their charges against the favourite's associates. The accused groups wait for the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] to see justice done."
 nesnd_palace.11.f:0 "“At today's audience a quarrel broke out before the sovereign. None of the ministers dared to speak.”\n- Court journal"
 nesnd_palace.11.a:0 "Back [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]"
 nesnd_palace.11.b:0 "Mediate"
 nesnd_palace.11.c:0 "Side with the accusers"
 nesnd_palace.12.t:0 "The Associates' Toll Gates"
 nesnd_palace.12.d_a:0 "Associates of [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] have taken over collection at several customs posts in [ROOT.GetCountry.GetNameNoFlag] and pocket the surplus. People from the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] have already put the accounts in the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]'s hands."
 nesnd_palace.12.d_b:0 "Associates of [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] have taken over collection at several customs posts in [ROOT.GetCountry.GetNameNoFlag] and pocket the surplus. The other groups dare not protest openly and have quietly passed the accounts to the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]."
 nesnd_palace.12.f:0 "“The sums actually collected at the customs posts do not match the sums paid into the treasury. The differences are listed below.”\n- Customs accounts submitted to the sovereign"
 nesnd_palace.12.a:0 "Let it be"
 nesnd_palace.12.b:0 "Send auditors"
 nesnd_palace.13.t:0 "A Proposed Marriage"
 nesnd_palace.13.d_a:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has proposed a marriage between their family and that of [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], and asked [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] to bless the match. It would ease the rivalry between the two factions, though together the two houses would leave little room for anyone else."
 nesnd_palace.13.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] is courting leading figures of the other groups through marriage, and several families have agreed to talks."
 nesnd_palace.13.f:0 "“Our two houses have agreed upon a marriage, and we humbly ask the sovereign to preside over it.”\n- Request concerning a marriage alliance"
 nesnd_palace.13.a:0 "Bless the match"
 nesnd_palace.13.b:0 "Quietly obstruct it"
 nesnd_palace.14.t:0 "Talk in the Streets"
 nesnd_palace.14.d_a:0 "In the streets and newspapers of [ROOT.GetCountry.GetNameNoFlag], people say [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] are at each other's throats and that even the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] cannot settle it. The stories grow wilder by the day."
 nesnd_palace.14.d_b:0 "Word in the streets of [ROOT.GetCountry.GetNameNoFlag] is that [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] now runs the government and that [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] merely signs the decrees."
 nesnd_palace.14.d_none:0 "[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] has not yet chosen a favourite. The streets of [ROOT.GetCountry.GetNameNoFlag] guess who will be next, and callers gather at every likely door."
 nesnd_palace.14.f:0 "“Many rumours have been circulating in recent days, most of them without foundation.”\n- Police report"
 nesnd_palace.14.a:0 "Suppress the talk"
 nesnd_palace.14.b:0 "Answer publicly"
 nesnd_palace.15.t:0 "Associates for Office"
 nesnd_palace.15.d_a:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has handed [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] a list of associates to fill vacancies in the ministries. [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] has already objected."
 nesnd_palace.15.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has handed [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] a list of associates to fill vacancies in the ministries. None of the other groups' candidates appear on it."
 nesnd_palace.15.f:0 "“The following persons are recommended to fill the vacancies in the ministries.”\n- List submitted by the favourite"
 nesnd_palace.15.a:0 "Appoint them"
 nesnd_palace.15.b:0 "Reject the list"
 nesnd_palace.15.c:0 "Post them to the provinces"
 nesnd_palace.16.t:0 "The Favourite's Remedy"
 nesnd_palace.16.d_a:0 "The treasury of [ROOT.GetCountry.GetNameNoFlag] cannot cover its costs. [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] advises the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] to impose a temporary levy and warns that [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]'s faction will try to block it."
 nesnd_palace.16.d_b:0 "The treasury of [ROOT.GetCountry.GetNameNoFlag] cannot cover its costs. [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] advises the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] to impose a temporary levy, to be collected by the favourite's own associates."
 nesnd_palace.16.f:0 "“The treasury is insufficient. It is proposed to levy a temporary tax.”\n- Proposal of the favourite"
 nesnd_palace.16.a:0 "Adopt the levy"
 nesnd_palace.16.b:0 "Reject it"
 nesnd_palace.17.t:0 "A Request to Retire"
 nesnd_palace.17.d_a:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] pleads illness and asks [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] to be released from service. [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]'s faction is already asking who might succeed them."
 nesnd_palace.17.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] pleads illness and asks [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] to be released from service. Every faction wonders whether the illness is real or a manoeuvre."
 nesnd_palace.17.f:0 "“Being gravely ill, I am unable to discharge my duties, and I humbly beg leave to resign and return home to recover.”\n- Letter of resignation of the favourite"
 nesnd_palace.17.a:0 "Ask them to stay"
 nesnd_palace.17.b:0 "Accept the resignation"
 nesnd_palace.21.t:0 "The Favourite in Danger"
 nesnd_palace.21.d_a_dead:0 "Men from the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] moved against the favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], and [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] did not survive. The whole court waits to see how [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] will respond."
 nesnd_palace.21.d_a_ousted:0 "The [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] rallied the court against the favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], drove [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] from the palace and then forced [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] out of [ROOT.GetCountry.GetNameNoFlag]."
 nesnd_palace.21.d_a_escaped:0 "Men from the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] plotted against the favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], but word leaked and [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] escaped in time."
 nesnd_palace.21.d_b_dead:0 "The other groups conspired to remove [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], who held both the court and the largest group, and [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] did not survive. The whole court waits to see how [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] will respond."
 nesnd_palace.21.d_b_ousted:0 "The other groups joined forces to strip [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] of power and then expelled [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] from [ROOT.GetCountry.GetNameNoFlag]."
 nesnd_palace.21.d_b_escaped:0 "The other groups conspired to remove [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], but word leaked and [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] escaped in time."
 nesnd_palace.21.f:0 "“The attempt on the favourite has been reported to the sovereign for decision.”\n- Court journal"
 nesnd_palace.21.a:0 "Hunt down those responsible"
 nesnd_palace.21.b:0 "Let the matter rest"
 nesnd_palace.22.t:0 "The Minister's Demands"
 nesnd_palace.22.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], who already leads the largest interest group, now demands that [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] hand over more of the government's business, and hints that the minister's followers are growing impatient."
 nesnd_palace.22.f:0 "“I humbly ask the sovereign to entrust the following affairs to my decision, so that they suffer no delay.”\n- Request of the powerful minister"
 nesnd_palace.22.a:0 "Give way"
 nesnd_palace.22.b:0 "Refuse"
 nesnd_palace.22.c:0 "Strike first"
 nesnd_palace.23.t:0 "Calls to Dismiss the Favourite"
 nesnd_palace.23.d:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], leader of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], has joined with other factions in demanding that [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] dismiss the favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], claiming to speak for all of [ROOT.GetCountry.GetNameNoFlag]."
 nesnd_palace.23.f:0 "“We the undersigned humbly ask the sovereign to dismiss the favourite. This is the common will of the whole country.”\n- Joint petition"
 nesnd_palace.23.a:0 "Dismiss the favourite"
 nesnd_palace.23.b:0 "Refuse"
 nesnd_palace.24.t:0 "A Knife in the Dark"
 nesnd_palace.24.d_dead:0 "People working for the favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] struck at [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], leader of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] died on the spot. Everyone at court knows whose people did it, and no one dares say so."
 nesnd_palace.24.d_ousted:0 "People working for the favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] fabricated charges, and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], leader of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], was arrested and then expelled from [ROOT.GetCountry.GetNameNoFlag]."
 nesnd_palace.24.d_escaped:0 "People working for the favourite [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] plotted against [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], leader of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], who noticed in time and left the capital."
 nesnd_palace.24.f:0 "“Reports on the matter of the opposition leader have come in from several quarters, and they do not agree.”\n- Court journal"
 nesnd_palace.24.a:0 "Shield the favourite"
 nesnd_palace.24.b:0 "Punish the favourite"
 nesnd_palace.25.t:0 "Removing the Minister"
 nesnd_palace.25.d_success:0 "[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] ordered the arrest of [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]. [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] could not escape and, stripped of every office, was expelled from [ROOT.GetCountry.GetNameNoFlag]."
 nesnd_palace.25.d_fail:0 "[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] ordered the arrest of [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], but word leaked. [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] took refuge among loyal followers, and the [SCOPE.sCharacter('nesnd_power_holder_scope').GetInterestGroup.GetName] is in uproar."
 nesnd_palace.25.f:0 "“The favourite is to be arrested forthwith and relieved of all his offices.”\n- The sovereign's warrant of arrest"
 nesnd_palace.25.a:0 "So be it"
 nesnd_palace.26.t:0 "Investigating the Rival Leader"
 nesnd_palace.26.d_success:0 "Investigators found something on [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], who was convicted and expelled from [ROOT.GetCountry.GetNameNoFlag]. The [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] has lost its leader."
 nesnd_palace.26.d_fail:0 "The investigation into [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] produced no hard evidence. [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] is untouched, and the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] knows exactly what the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] intended."
 nesnd_palace.26.f:0 "“The investigating officers have concluded the case against the opposition leader and submit their report.”\n- Report of the investigating officers"
 nesnd_palace.26.a:0 "So be it"
 nesnd_cabinet.11.t:0 "A Clash over the Programme"
 nesnd_cabinet.11.d_a:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName], leader of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], clashed in the legislature over the government's programme, each demanding that the other give way."
 nesnd_cabinet.11.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], who also leads the largest interest group, is forcing the government's programme through the legislature, and the other groups have united against it."
 nesnd_cabinet.11.f:0 "“The House today debated the government's programme. The parties remained at deadlock.”\n- Record of proceedings in the legislature"
 nesnd_cabinet.11.a:0 "Hold firm"
 nesnd_cabinet.11.b:0 "Broker a compromise"
 nesnd_cabinet.11.c:0 "Concede"
 nesnd_cabinet.12.t:0 "Campaign Money"
 nesnd_cabinet.12.d_a:0 "The press reports that the ruling party took money from businessmen in exchange for contracts and concessions. [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] demands a full investigation."
 nesnd_cabinet.12.d_b:0 "The press reports that the ruling party took money from businessmen in exchange for contracts and concessions. The other groups demand a full investigation."
 nesnd_cabinet.12.f:0 "“According to accounts in this newspaper's possession, the governing party received donations from businessmen, and several contracts and concessions afterwards went to the donors.”\n- Newspaper exposé"
 nesnd_cabinet.12.a:0 "Bury the story"
 nesnd_cabinet.12.b:0 "Order an inquiry"
 nesnd_cabinet.13.t:0 "A Coalition Proposal"
 nesnd_cabinet.13.d_a:0 "It has been proposed that [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] redistribute the ministries, giving the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] a bigger share of the government."
 nesnd_cabinet.13.d_b:0 "The other groups have named their price for joining the government: [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] must give up several ministries in exchange for their votes."
 nesnd_cabinet.13.f:0 "“It is proposed that ministerial posts be redistributed in return for the support of a majority in the legislature.”\n- Draft terms of the coalition talks"
 nesnd_cabinet.13.a:0 "Accept the coalition"
 nesnd_cabinet.13.b:0 "Refuse"
 nesnd_cabinet.14.t:0 "The Press Turns"
 nesnd_cabinet.14.d_a:0 "Several leading papers have run pieces claiming that [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has been driven into a corner by [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]."
 nesnd_cabinet.14.d_b:0 "Several leading papers have run pieces accusing [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] of seizing all power and reducing the legislature to a formality."
 nesnd_cabinet.14.f:0 "“With the government and the legislature at deadlock, this newspaper can no longer keep silent.”\n- Newspaper editorial"
 nesnd_cabinet.14.a:0 "Prosecute the papers"
 nesnd_cabinet.14.b:0 "Reply publicly"
 nesnd_cabinet.15.t:0 "Friends for Office"
 nesnd_cabinet.15.d_a:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] wants to place party loyalists throughout the ministries. [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] calls it a spoils system."
 nesnd_cabinet.15.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] wants to place party loyalists throughout the ministries, and the other groups cannot stop it."
 nesnd_cabinet.15.f:0 "“The following persons, all members of the party, are proposed to fill the vacancies in the ministries.”\n- List of appointments submitted by the government"
 nesnd_cabinet.15.a:0 "Appoint them"
 nesnd_cabinet.15.b:0 "Leave it to the civil service examinations"
 nesnd_cabinet.15.c:0 "Post them to the provinces"
 nesnd_cabinet.16.t:0 "The Budget Fight"
 nesnd_cabinet.16.d_a:0 "The treasury cannot cover its costs. [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has proposed a budget with new taxes, and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] vows to defeat it."
 nesnd_cabinet.16.d_b:0 "The treasury cannot cover its costs. [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has proposed a budget with new taxes, and the other groups threaten to walk out."
 nesnd_cabinet.16.f:0 "“The treasury's revenue this year falls short of its expenditure, and it is proposed to raise taxes to make up the difference.”\n- Budget bill presented by the government"
 nesnd_cabinet.16.a:0 "Pass the tax budget"
 nesnd_cabinet.16.b:0 "Withdraw it"
 nesnd_cabinet.17.t:0 "Rumours of Ill Health"
 nesnd_cabinet.17.d_a:0 "Rumours say [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] is gravely ill, and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] is already looking for a successor."
 nesnd_cabinet.17.d_b:0 "Rumours say [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] is gravely ill, and some in the ruling party are already manoeuvring."
 nesnd_cabinet.17.f:0 "“This newspaper has been unable to confirm the reports that the head of government is seriously ill.”\n- Newspaper report"
 nesnd_cabinet.17.a:0 "Appear in public"
 nesnd_cabinet.17.b:0 "Delegate to deputies"
 nesnd_cabinet.21.t:0 "An Attempt on the Head of State"
 nesnd_cabinet.21.d_dead:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] was assassinated in public. Accounts of who the assassin was differ widely."
 nesnd_cabinet.21.d_wounded:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] was shot in public and badly wounded, but survived."
 nesnd_cabinet.21.d_escaped:0 "An assassin made an attempt on [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] in public, missed, and was captured."
 nesnd_cabinet.21.f:0 "“The head of government was attacked in public today. The identity of the assailant is under investigation.”\n- Special edition of a newspaper"
 nesnd_cabinet.21.a:0 "Declare martial law and investigate"
 nesnd_cabinet.21.b:0 "Carry on as usual"
 nesnd_cabinet.22.t:0 "A Wave of No Confidence"
 nesnd_cabinet.22.d:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] is rallying a no-confidence motion inside and outside the legislature, demanding that [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] call early elections."
 nesnd_cabinet.22.f:0 "“This House has no confidence in the present government and calls for early elections.”\n- Text of the motion of no confidence"
 nesnd_cabinet.22.a:0 "Call early elections"
 nesnd_cabinet.22.b:0 "Serve out the term"
 nesnd_cabinet.23.t:0 "The Strongman's Way"
 nesnd_cabinet.23.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName], who also leads the largest interest group, intends to bypass the legislature and govern by executive order."
 nesnd_cabinet.23.f:0 "“The following measures are enacted by executive order and will not be submitted to the legislature.”\n- Executive order of the government"
 nesnd_cabinet.23.a:0 "Bypass the legislature"
 nesnd_cabinet.23.b:0 "Return to the legislature"
 nesnd_cabinet.24.t:0 "Misfortune for a Faction Leader"
 nesnd_cabinet.24.d_dead:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] has been assassinated. Members of the ruling party are accused of ordering it, which [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] flatly denies."
 nesnd_cabinet.24.d_ousted:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] was charged with treason, arrested and expelled from the country."
 nesnd_cabinet.24.d_escaped:0 "Someone plotted against [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], who noticed in time and left the capital unharmed."
 nesnd_cabinet.24.f:0 "“Accounts of what has befallen the opposition leader differ. This newspaper will report further.”\n- Newspaper report"
 nesnd_cabinet.24.a:0 "Investigate thoroughly"
 nesnd_cabinet.24.b:0 "Go through the motions"
 nesnd_cabinet.26.t:0 "Investigating the Faction Leader"
 nesnd_cabinet.26.d_success:0 "The investigation found something on [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], who was convicted and expelled from the country."
 nesnd_cabinet.26.d_fail:0 "The investigation produced no hard evidence and [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] is untouched. The [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] accuses the government of a frame-up."
 nesnd_cabinet.26.f:0 "“The investigation into the opposition leader has concluded. Its findings will be published shortly.”\n- Government gazette"
 nesnd_cabinet.26.a:0 "So be it"
 nesnd_palace_end_rules:0 "This journal pauses, and its modifiers are removed, if any of the following happens. The three values are kept.\n- The country is no longer an Empire or Hegemony\n- The country becomes a republic (Head of State and Factions takes over with 30% of the power)\n- The distribution of power no longer allows a favourite, such as under wealth voting or universal suffrage\n- A Ming civil war, Napoleonic dynasty, Court and Provinces or Court at Ili journal begins\nThe journal resumes on its own once the conditions are met again."
 nesnd_cabinet_end_rules:0 "This journal pauses, and its modifiers are removed, if any of the following happens. The three values are kept.\n- The country is no longer an Empire or Hegemony\n- The country is no longer a republic (Power at Court takes over with 30% of the power if a favourite can be appointed)\n- A Ming civil war, Napoleonic dynasty, Court and Provinces or Court at Ili journal begins\nThe journal resumes on its own once the conditions are met again."
 nesnd_palace.31.t:0 "The Favourite's Birthday"
 nesnd_palace.31.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] is holding a birthday celebration, and gifts from ministry officials and provincial governors fill the residence. The favourite's associates are waiting to see whether [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] will attend."
 nesnd_palace.31.f:0 "“The gifts sent by the officials of the ministries and the provincial governors are listed below.”\n- Register of gifts at the favourite's residence"
 nesnd_palace.31.a:0 "Attend in person"
 nesnd_palace.31.b:0 "Send congratulations"
 nesnd_palace.31.c:0 "Find a reason not to go"
 nesnd_palace.32.t:0 "The Envoy's Back Door"
 nesnd_palace.32.d:0 "A foreign envoy has bypassed the foreign office of [ROOT.GetCountry.GetNameNoFlag] and asked [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] to carry their government's requests to [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName], along with a generous gift."
 nesnd_palace.32.f:0 "“My government has a request to make, and I would be most grateful if you would convey it to the sovereign. A small gift is enclosed.”\n- Letter of a foreign envoy to the favourite"
 nesnd_palace.32.a:0 "Let the favourite carry the message"
 nesnd_palace.32.b:0 "Send it through proper channels"
 nesnd_palace.33.t:0 "The Favourite and the Army"
 nesnd_palace.33.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has recommended several associates to [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] for key commands, and the generals have jointly objected."
 nesnd_palace.33.f:0 "“Military appointments have always been settled within the army. We cannot accept the men the court has put forward.”\n- Joint protest of the generals"
 nesnd_palace.33.a:0 "Approve the appointments"
 nesnd_palace.33.b:0 "Let the army choose its own"
 nesnd_palace.34.t:0 "A Governor's Secret Report"
 nesnd_palace.34.d:0 "A provincial governor has sent [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] a secret report listing the abuses of [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]'s associates in the provinces."
 nesnd_palace.34.f:0 "“The favourite's men in this province have committed numerous abuses, which are set out below.”\n- Confidential report of a provincial governor"
 nesnd_palace.34.a:0 "Keep it private"
 nesnd_palace.34.b:0 "Make the favourite answer it"
 nesnd_palace.34.c:0 "Refer it for investigation"
 nesnd_palace.35.t:0 "Who Runs the Relief"
 nesnd_palace.35.d:0 "Unrest has broken out in parts of [ROOT.GetCountry.GetNameNoFlag] and the government must fund relief. [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] asks the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] to let the favourite's own associates administer it."
 nesnd_palace.35.f:0 "“There is unrest in the provinces and the distressed await relief. I ask that the relief funds be handled by men I recommend.”\n- Request of the favourite"
 nesnd_palace.35.a:0 "Let the favourite's associates run it"
 nesnd_palace.35.b:0 "Let the responsible office run it"
 nesnd_palace.41.t:0 "A Private Guard"
 nesnd_palace.41.d:0 "Citing the danger of assassins, [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has gathered an armed guard around the residence, now no smaller than the [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]'s own palace guard."
 nesnd_palace.41.f:0 "“The guard posted around the favourite's residence is now no smaller than the palace guard.”\n- Report of the captain of the palace guard"
 nesnd_palace.41.a:0 "Allow it"
 nesnd_palace.41.b:0 "Order it disbanded"
 nesnd_palace.41.c:0 "Absorb it into the palace guard"
 nesnd_palace.42.t:0 "The Ministers Stay Away"
 nesnd_palace.42.d:0 "Many ministers have stopped attending council on grounds of illness and have told [SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName] they will not return while [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] remains."
 nesnd_palace.42.f:0 "“So long as the favourite remains, we shall not return.”\n- Joint memorial of the ministers"
 nesnd_palace.42.a:0 "Dismiss the favourite"
 nesnd_palace.42.b:0 "Order them back"
 nesnd_palace.42.c:0 "Have the favourite withdraw from affairs"
 nesnd_cabinet.31.t:0 "Deputies Cross the Floor"
 nesnd_cabinet.31.d:0 "Several ruling-party deputies have gone over to [SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName], and the government's majority is in danger."
 nesnd_cabinet.31.f:0 "“Several more members of the governing party announced yesterday that they were leaving it for [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]. The government's majority in the legislature now hangs by a thread.”\n- Parliamentary report in a newspaper"
 nesnd_cabinet.31.a:0 "Offer posts to keep them"
 nesnd_cabinet.31.b:0 "Expel them"
 nesnd_cabinet.32.t:0 "Local Elections Lost"
 nesnd_cabinet.32.d:0 "In local elections across several major states, the side of [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] has lost one race after another."
 nesnd_cabinet.32.f:0 "“The results of the local elections in several large provinces are in. The governing side has lost in many of them.”\n- Election report in a newspaper"
 nesnd_cabinet.32.a:0 "Accept the results"
 nesnd_cabinet.32.b:0 "Allege fraud"
 nesnd_cabinet.33.t:0 "Questions on Foreign Policy"
 nesnd_cabinet.33.d:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName] of the [SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName] has put questions on the government's foreign policy to the legislature and demands that [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] answer in person."
 nesnd_cabinet.33.f:0 "“This House questions the government's foreign policy and asks the head of government to answer in person.”\n- Interpellation in the legislature"
 nesnd_cabinet.33.a:0 "Answer in closed session"
 nesnd_cabinet.33.b:0 "Answer in public"
 nesnd_cabinet.34.t:0 "Strikes"
 nesnd_cabinet.34.d:0 "Workers in several industrial cities are on strike for higher wages and shorter hours. Factory owners want the government to restore order."
 nesnd_cabinet.34.f:0 "“We demand higher wages and shorter hours. The factories will not reopen until we have an answer.”\n- Statement of the strikers"
 nesnd_cabinet.34.a:0 "Send in the police"
 nesnd_cabinet.34.b:0 "Mediate"
 nesnd_cabinet.35.t:0 "A Challenge for the Party Leadership"
 nesnd_cabinet.35.d:0 "Members of the [SCOPE.sCharacter('nesnd_power_holder_scope').GetInterestGroup.GetName] are openly challenging the leadership of [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]."
 nesnd_cabinet.35.f:0 "“The question of the party's leadership should be put to a vote of the party congress.”\n- Open letter of the opposition within the party"
 nesnd_cabinet.35.a:0 "Crush the challenge"
 nesnd_cabinet.35.b:0 "Allow an open contest"
 nesnd_cabinet.41.t:0 "The Army Steps In"
 nesnd_cabinet.41.d:0 "With the political deadlock unbroken, several generals have issued a joint telegram urging the factions to put the nation first, and hinting that the army will not stand by."
 nesnd_cabinet.41.f:0 "“Politics is at a standstill and the country is in danger. We urge every party to put the nation first and find a settlement without delay. Soldiers are charged with defending the country and cannot stand idly by.”\n- Joint telegram of the generals"
 nesnd_cabinet.41.a:0 "Placate the army"
 nesnd_cabinet.41.b:0 "Replace the generals"
 nesnd_cabinet.42.t:0 "Standoff in the Streets"
 nesnd_cabinet.42.d:0 "Crowds opposed to [SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName] have occupied the capital's main square, and supporters of the ruling party have gathered opposite them."
 nesnd_cabinet.42.f:0 "Both sides in the square are waving the national flag."
 nesnd_cabinet.42.a:0 "Declare martial law and disperse them"
 nesnd_cabinet.42.b:0 "Give ground"
 nesnd_cabinet.42.c:0 "Wait and see"
 nesnd_power_n_holder:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_holder').GetCharacter.GetFullName]"
 nesnd_power_n_leader:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_leader').GetCharacter.GetFullName]"
 nesnd_power_n_leader_generic:0 "the leader of the largest [concept_interest_group]"
 nesnd_power_n_holder_ig:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_holder_ig').GetInterestGroup.GetName]"
 nesnd_power_n_holder_ig_generic:0 "the holder's interest group"
 nesnd_power_n_top_ig:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_top_ig').GetInterestGroup.GetName]"
 nesnd_power_n_top_ig_generic:0 "the largest interest group"
 nesnd_power_n_holder_side:0 "the side of [ROOT.GetCountry.MakeScope.Var('nesnd_power_holder').GetCharacter.GetFullName]"
 nesnd_power_relation_aligned:0 "The two sides think alike and cooperate easily, but the largest faction is slowly drawing away the holder's supporters."
 nesnd_power_relation_opposed:0 "The two sides are at odds, and the largest faction obstructs at every turn."
 nesnd_power_relation_mixed:0 "The two sides agree on some things and not on others."
