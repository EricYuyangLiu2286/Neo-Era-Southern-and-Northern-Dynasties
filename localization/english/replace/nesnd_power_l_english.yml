 nesnd_palace_btn_press_rival_tt:0 "Investigate [ROOT.GetCountry.GetCustom('nesnd_power_leader_name')]. The chance of success is #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_power_arrest_chance')|0]%#!, depending on the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s popularity (45% base, up to 60% if popular, down to 25% if unpopular). If it succeeds they are convicted and expelled. Otherwise [ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')] gains [Concept('concept_radical','$concept_radicals$')] and [ROOT.GetCountry.GetCustom('nesnd_power_balance_name')] shifts #v 10#! towards the rivals."
