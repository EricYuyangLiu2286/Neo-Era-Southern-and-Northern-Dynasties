l_english:
 nesnd_prussian_coalition:0 "A Common Defence for Germany"
 nesnd_prussian_coalition_reason:0 "France and the Confederation of the Rhine keep up the division of the German states. To challenge their influence, Prussia must convince other governments that Berlin will commit its army to their common interests.\n\nAlliances and defensive pacts can bring the states together, but troops and armaments must back those promises. Governments still bound to France or a Rhenish overlord need freedom in foreign affairs before they can join."
 nesnd_prussian_coalition_status:0 "Secure alliances or defensive pacts with three distinct German states and establish the necessary army and armaments capacity."
 nesnd_prussian_coalition_partners_tt:0 "At least three independent German states have an alliance or defensive pact with us (excluding the Rhenish Confederation, Austria and allies of France)"
 nesnd_rhine_no_prussian_bloc_tt:0 "Neither Prussia nor any state formed from Prussia leads a [concept_power_bloc]"
 nesnd_prussian_subordinate_status:0 "Our subject relationship restricts independent diplomacy."
 nesnd_prussian_joint_staff:0 "German Joint Staff Cooperation"
 nesnd_prussian_rhine_settlement:0 "A New German Standing"
 nesnd_austrian_italy:0 "The Italian Balance"
 nesnd_austrian_italy_reason:0 "Republicans supported by France, the ruling dynasties and the Pope all want a hand in deciding Italy's future. Austria can support independent states through defensive pacts or intervene to prevent their annexation.\n\nIntervention requires money and allies. Accepting the advance of a unifying power would mean accepting a diminished Austrian influence in Italy."
 nesnd_austrian_waiting_status:0 "No Italian territorial dispute is currently available for Austrian intervention."
 nesnd_austrian_dispute_status:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_austrian_enemy').GetCountry.GetName] is pressing [ROOT.GetCountry.MakeScope.Var('nesnd_austrian_target').GetCountry.GetName]."
 nesnd_austrian_committed_status:0 "Austria has joined the defending side. The dispute is not yet settled."
 nesnd_austrian_cooldown_tt:0 "Twenty-four months have passed since the previous intervention decision"
 nesnd_austrian_current_dispute_tt:0 "An Italian territorial dispute is in the diplomatic negotiation phase"
 nesnd_austrian_italian_commitment:0 "The Cost of Italian Intervention"
 nesnd_austrian_concession:0 "Conceding the Italian Balance"
 nesnd_austrian_italian_defeat:0 "Italian Intervention Repulsed"
 nesnd_austrian_italian_influence:0 "Prestige from Defending Italy"
 nesnd_usa_continental:0 "Ambitions of a Continental Protector"
 nesnd_usa_continental_reason:0 "Federal expansionists call themselves the protectors of white America and demand the western territories of $HUS$. Settlers seek land, while business interests look to European capital to finance railways and armaments. Their allies in Congress are seeking the funds to force concessions from $HUS$."
 nesnd_usa_border_selected_status:0 "Selected disputed state: [ROOT.GetCountry.MakeScope.Var('nesnd_usa_border_state').GetState.GetName]."
 nesnd_usa_no_border_status:0 "No eligible $HUS$ territory currently borders the federation."
 nesnd_usa_civil_war_status:0 "Civil war has suspended new frontier offensives. Economic development and existing diplomatic promises continue."
 nesnd_usa_war_status:0 "The Union is pressing its demand for the disputed frontier territory."
 nesnd_usa_european_treaty_tt:0 "An effective European investment agreement is in force"
 nesnd_usa_claim_cooldown_tt:0 "Six months have passed since the last frontier claim, or $HUS$ is sheltering fugitives"
 nesnd_usa_border_cooldown_tt:0 "Twenty-four months have passed since the last frontier dispute ended"
 nesnd_usa_civil_war_pause_tt:0 "The federation is not fighting a civil war"
 nesnd_usa_no_pending_war_tt:0 "No frontier demand or war is still pending"
 nesnd_usa_next_border:0 "Consider Another Frontier State"
 nesnd_usa_next_border_desc:0 "Select a $HUS$-held frontier state for consideration."
 nesnd_usa_next_border_tt:0 "Select an eligible neighbouring state without changing ownership of any territory."
 nesnd_usa_claim_border:0 "Assert the Selected Claim"
 nesnd_usa_claim_border_desc:0 "Direct the federation’s frontier policy towards the selected land."
 nesnd_usa_claim_border_tt:0 "Gain a claim on the selected state and lose 10 relations with $HUS$. Another claim cannot be asserted for six months."
 nesnd_usa_press_west:0 "Demand the Disputed State"
 nesnd_usa_press_west_desc:0 "Present a formal demand backed by the claim, and let them choose to concede or resist."
 nesnd_usa_press_west_tt:0 "Start a Return State [concept_diplomatic_play] against $HUS$ for the selected state. Truces and existing agreements still apply. The first successful acquisition of the requested land grants a five-year military benefit."
 nesnd_usa_hus_confrontation:0 "American Frontier Dispute"
 nesnd_usa_european_capital:0 "European Capital Cooperation"
 nesnd_usa_continental_army:0 "Gains of the Continental Campaign"
 nesnd_usa_frontier_claim:0 "Frontier Diplomatic Mission"
 nesnd_europe_america.1.t:0 "A German Pledge"
 nesnd_europe_america.1.d:0 "Three German states have concluded pacts with us, and our troops and armaments are enough for their common defence. Their staffs can now coordinate military preparations against France and its allies."
 nesnd_europe_america.1.f:0 "“An attack on any one of the contracting states shall be regarded as an attack on all.”\n- Article One of the pact"
 nesnd_europe_america.1.a:0 "Let the staffs begin their work."
 nesnd_europe_america.3.t:0 "Austria Commits"
 nesnd_europe_america.3.d:0 "Austria has joined the defending side in the Italian dispute. Diplomatic assurances are now backed by troops and money, and Vienna’s prestige will share in the outcome."
 nesnd_europe_america.3.f:0 "“The Imperial Government has resolved to honour its promise of protection to that state and will send troops to assist in its defence.”\n- Note from Vienna to the governments of Europe"
 nesnd_europe_america.3.a:0 "Honour the pledge of defence."
 nesnd_europe_america.4.t:0 "The Defence of Italy Succeeds"
 nesnd_europe_america.4.d:0 "Our opponent has accepted the war demands, and the Italian state under our protection has preserved its position. Austria has kept its pledge to defend it, strengthening Vienna's standing among the states."
 nesnd_europe_america.4.f:0 "“The enemy has accepted our terms. The protected state retains its position. The Imperial army has fulfilled its promise.”\n- Austrian army bulletin"
 nesnd_europe_america.4.a:0 "Let the states remember our pledge."
 nesnd_europe_america.5.t:0 "Intervention Fails to Preserve the Balance"
 nesnd_europe_america.5.d:0 "Austria’s intervention has failed to preserve the position it sought to defend. Territorial demands, subordination or the disappearance of the protected state have made the original pledge worthless. Vienna must face the consequences in Italy."
 nesnd_europe_america.5.f:0 "“The Imperial army was unable to preserve the position of that state and has been ordered to withdraw.”\n- Bulletin of the Austrian War Ministry"
 nesnd_europe_america.5.a:0 "Acknowledge the setback."
 nesnd_europe_america.6.t:0 "A Dispute without Victory"
 nesnd_europe_america.6.d:0 "The dispute has ended without a result Austria can claim as a victory. The protected state survives, but the disagreement has not been decisively settled. Both sides must consider their next course."
 nesnd_europe_america.6.f:0 "“The dispute is over. Neither side has achieved a decisive result, and the protected state still stands.”\n- Commentary in a Vienna newspaper"
 nesnd_europe_america.6.a:0 "Let the troops return for now."
 nesnd_europe_america.7.t:0 "The Frontier Demand Is Met"
 nesnd_europe_america.7.d:0 "The federation has acquired the $HUS$ territory demanded in this dispute. Its frontier claim has changed the actual border, bringing new prestige to the army and the commercial interests supporting expansion."
 nesnd_europe_america.7.f:0 "“The said territory is now under the jurisdiction of the Union, and the laws of the Union shall be in force therein from this day.”\n- Act of Congress on the new territory"
 nesnd_europe_america.7.a:0 "Govern the land we have acquired."
 nesnd_europe_america.8.t:0 "The Frontier Dispute Closes"
 nesnd_europe_america.8.d:0 "The Union has failed to obtain all the territory it demanded. The dispute is over, and we have suspended further advances for now. Supporters of expansion are already looking for another opportunity."
 nesnd_europe_america.8.f:0 "“The federal government has suspended further advances. The territory not obtained will be taken up again at a later date.”\n- Proclamation of the federal government"
 nesnd_europe_america.8.a:0 "Address the result before us."
 nesnd_europe_america.10.t:0 "A Federal Territorial Demand"
 nesnd_europe_america.10.d:0 "The United States has demanded [SCOPE.sState('nesnd_usa_disputed_state').GetName]. Federal envoys call it the restoration of a rightful border; residents, landowners and the garrison face an immediate contest over sovereignty. Our government must decide its response through the diplomatic play now before it."
 nesnd_europe_america.10.f:0 "“…checking the fulfilment of our manifest destiny to overspread the continent…”\n- John L. O'Sullivan, “Annexation”, The United States Magazine and Democratic Review (July–August 1845)"
 nesnd_europe_america.10.a:0 "The frontier is not unclaimed land."
 nesnd_prussian_staff_term_tt:0 "Joint staff cooperation lasts for at most ten years. It requires continuing alliances or defensive pacts with three distinct German partners and the stated military capacity. Benefits pause if those conditions lapse."

 nesnd_ui_usa_border_available_tt:0 "$HUS$ owns an inhabited state on our border in North or Central America."
