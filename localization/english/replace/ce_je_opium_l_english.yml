 je_nesnd_opium_recovery: "Overcoming Opium Addiction"
 je_nesnd_opium_recovery_reason: "It is not over yet. Every physician in the world knows that a disease one failed to prevent may yet be cured! But now that addiction has taken hold of our people, to treat it is, in some measure, to make war on our own flesh and blood. First there is the question of medicine. Some have given everything they owned, even their lives, for opium paste. Yet apothecaries and hospitals depend on the same drug as an anaesthetic. To trace the paste sold over the counter, inspectors must establish how much raw opium each apothecary received, how much was dispensed on prescription, and how much went to stock the so-called “Halls of Bliss”. Then there are the townspeople who frequent the opium dens and the small shopkeepers who sell paste on the side. Both oppose the crackdown. Meanwhile, some landowners grow [GetGoods('tobacco').GetName] and lease fields to tenants who produce [GetGoods('opium').GetName]. They fear for their rents. Finally, the industrialists who have invested in drug manufacture and the wholesale trade fear the new ban will ruin even their “legitimate” trade in medicines."
 je_nesnd_opium_recovery_no_capacity: "Either [GetInstitutionType('institution_health_system').GetName] or [GetInstitutionType('institution_police').GetName] must reach level #v 2#! to carry out inspections. A ban on [GetGoods('opium').GetName] still advances recovery independently."
 je_nesnd_opium_recovery_awaiting_order: "Local authorities have the means to act and await the government's order."
 je_nesnd_opium_recovery_underway: "Local authorities are inspecting opium dens and dispensaries. When opium addiction prevalence falls to #v 40%#! or less, the $ce_war_to_opium_fail_modifier$ ends."
 je_nesnd_opium_recovery_goal: "Reduce opium addiction prevalence to #v 40%#! or less"
 je_nesnd_opium_recovery_conclusion: "Local dispensaries account for medicinal opium against their prescriptions. Opium dens have lost their open trade, and the epidemic has subsided."
 nesnd_opium_register_dispensaries: "Issue Systematic Regulation"
 nesnd_opium_register_dispensaries_desc: "Close the retail trade in opium dens and audit the [GetGoods('opium').GetName] purchases and prescription books of each dispensary. The regulations run for #v 5#! years and may be repealed after #v 3#! months. While they are in force, [concept_approval] falls by #v 3#! among the Petite Bourgeoisie, Landowners and Industrialists."
 nesnd_opium_regulations: "Opium Control Regulations"
 nesnd_opium_repeal_regulations: "Repeal the Opium Regulations"
 nesnd_opium_repeal_regulations_desc: "End inspections under the regulations. The regulations cease to curb the spread of opium addiction, and the [concept_approval] penalties for all three groups end. Prevalence stays at its current level upon repeal."
 nesnd_opium_repeal_unlocked: "The regulations have been in force for at least #v 3#! months"
 ce_opium_events.4.recovery_tt: "Complete $je_nesnd_opium_recovery$ to end the $ce_war_to_opium_fail_modifier$ and remove the [GetGoods('opium').GetName] [concept_obsession] from our primary cultures."
 nesnd_opium_recovery_bar: "Opium Addiction Prevalence"
 nesnd_opium_recovery_bar_desc: "$nesnd_opium_recovery_bar$ #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
