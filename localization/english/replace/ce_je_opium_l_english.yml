l_english:
 je_ce_war_to_opium: "War to Opium"
 je_ce_war_to_opium_reason: "An excessive influx of opium is poisoning our people, and we must stop this."
 possible_je_ce_war_to_opium: "This journal was triggered against us by a hostile power while there is a massive amount of @opium! opium in the [concept_market] which we are the [concept_market_owner]..."

 opium_je_event_1_state: "Infested Region"
 opium_je_event_2_state: "Affected Industrial Zone"
 opium_je_event_3_ig: "Involved Political Groups"
 opium_je_event_4_state: "Underground Industry Area"

 ce_opium_events.1.b.tt: "[SCOPE.sCountry('opium_addict_country').GetName] will receive the #b War to Opium#! Journal Entry. Its #b Progress Bar#! changes monthly based on opium market scale, bans, standard of living, turmoil, laws, and national strength. While active, the country suffers #n administrative and political strain#! and periodic social incidents; success grants long-term national bonuses, while failure causes severe penalties and their [concept_primary_cultures] gains [concept_obsession] on @opium! Opium ."

 ce_opium_events.2.t: "War to Opium"
 ce_opium_events.2.d: "With previous officials' ignorant, the poison of opium has penetrated into the bone marrow of our country. It not only is destroying the health of our citizens but also our wealth. In order to save the future of our nation and our people, we must take drastic measures to win this war without gunpowder!"
 ce_opium_events.2.f: "I shall dedicate my life to the country; I will not evade doing so just to avoid misfortune!"
 ce_opium_events.2.a: "We must overcome this major society crisis."

 ce_opium_events.3.t: "Reject Opium"
 ce_opium_events.3.d: "Our nationwide crackdown and blockade on opium has achieved unprecedented victory. The people have finally awakened from the haze of drugs, and the state's administration and construction have also ushered in a new lease of life."
 ce_opium_events.3.f: "A country without drugs is a truly great country."
 ce_opium_events.3.a: "Victory is ours!"
 ce_war_to_opium_success_modifier: "Reject Opium"
 ce_war_to_opium_ig_success_modifier: "Successful Anti-Drug Campaign"

 ce_opium_events.4.t: "Opium Out of Control"
 ce_opium_events.4.d: "Our efforts have failed completely. Opium has spread across the country like a plague. The army has lost its combat effectiveness, the workers and peasants are languishing, and the social order is on the verge of collapse."
 ce_opium_events.4.f: "We have lost this war, and the future of the nation."
 ce_opium_events.4.a: "An irreversible defeat."
 ce_war_to_opium_fail_modifier: "Opium Epidemic"

 ce_opium_events.5.t: "Legacy of the Opium Trade"
 ce_opium_events.5.d: "Since we no longer control the relevant markets, the systematic crackdown on opium proliferation has been temporarily suspended. However, the social impact left by this anti-drug campaign still echoes long in this land."
 ce_opium_events.5.f: "This unfinished war has changed many."
 ce_opium_events.5.a: "So be it."
 ce_war_to_opium_legacy_modifier: "Legacy of the Drug Trade"

 ce_opium_events.6.t: "Black Dens"
 ce_opium_events.6.d: "Inside the opium dens, smoke is lingering, and countless addicted citizens are withered and confused about day and night. These lawless gray areas are devouring the foundation of our society."
 ce_opium_events.6.f: "Chaos and depravity intertwine here."
 ce_opium_events.6.a: "Implement temporary legislative controls."
 ce_opium_events.6.b: "As long as they don't cause trouble, let them be."
 ce_war_to_opium_event_1_mod_1: "Strict Drug Control"
 ce_war_to_opium_event_1_mod_2: "Opium Economy"

 ce_opium_events.7.t: "Skeletons in the Factory"
 ce_opium_events.7.d: "Some factory owners have secretly lured workers to smoke opium to numb their dissatisfaction with the harsh working conditions and excessive hours. The workers waste away in the toxic smog, like walking corpses."
 ce_opium_events.7.f: "As long as you give them a puff, they can keep working."
 ce_opium_events.7.a: "Pressure law enforcement to investigate this!"

 ce_opium_events.8.t: "Influence of the Opium Chamber of Commerce"
 ce_opium_events.8.d: "The massive opium trade has spawned a group of wealthy merchants and gang bosses, who have even begun to use money to intervene in our country's political process, trying to bribe key figures in the ruling group."
 ce_opium_events.8.f: "Drug money is corrupting the foundation of power."
 ce_opium_events.8.a: "Mark these corrupt elements as untrustworthy!"
 ce_opium_events.8.b: "Demand 'political donations' from them."
 ce_war_to_opium_event_3_mod_1: "Dirty Political Donations"
 ce_war_to_opium_event_3_mod_2: "Involved in Corruption Scandal"

 ce_opium_events.9.t: "New Gray Industry"
 ce_opium_events.9.d: "Tempted by the high profits of opium, more and more emerging gangs are taking drug trafficking as their main business. They have built a tight underground network, not only evading taxes but also triggering continuous violent conflicts."
 ce_opium_events.9.f: "Wealth circulates in the dark corners."
 ce_opium_events.9.a: "Implement a severe crackdown locally, at all costs!"
 ce_opium_events.9.b: "We are truly powerless..."
 ce_war_to_opium_event_4_mod_1: "Massive Crackdown Operation"

 ce_war_to_opium_active_modifier: "Opium Crisis"
 
