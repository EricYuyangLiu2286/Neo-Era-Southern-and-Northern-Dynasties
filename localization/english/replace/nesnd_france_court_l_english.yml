l_english:
 je_nesnd_france_court: "[ROOT.GetCountry.GetCustom('nesnd_court_government_title')]"
 je_nesnd_france_court_reason: "[ROOT.GetCountry.GetCustom('nesnd_court_government_reason')]"
 je_nesnd_france_court_concluded: "Public Works in Paris and the Provinces"
 nesnd_court_royal_title: "The Court and the Provinces"
 nesnd_court_republic_title: "Public Works of the Republic"
 nesnd_court_royal_reason: "The Paris delegation has brought plans for a new quay. A provincial manufacturer waits three days in the corridor before a minister asks about freight. He lays two invoices on the desk. One gives the cost of landing a boatload of coal in Paris, the other the cost of getting it to his factory gate. The court must decide which project has the stronger claim on public funds."
 nesnd_court_republic_reason: "A clerk at the Ministry of Public Works replaces the covers that bear the royal arms. The contractors bring back the drawings approved under the old government, with the date of inspection still written on the last sheet. Paris and the provincial chambers of commerce now address their letters to the Republic."
 nesnd_court_activation: "The imperial succession is settled. Either the reigning monarch or, during a regency, the heir belongs to the House of Bourbon or the House of Orléans."
 nesnd_court_no_paris: "France no longer holds Île-de-France. The works policy is suspended. The five-year review date still stands."
 nesnd_court_no_towns: "There are no urban centers in metropolitan France from which to calculate a Paris share."
 nesnd_court_counts: "Urban center levels in Île-de-France: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_court_paris_levels')|0]#!. French metropolitan total, including Corsica: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_court_total_levels')|0]#!."
 nesnd_court_opened: "Paris held #v [ROOT.GetCountry.MakeScope.Var('nesnd_court_opening_share').GetValue|1]%#! of metropolitan urban center levels when the current policy was chosen."
 nesnd_court_status_choose: "Choose where to concentrate public works. $nesnd_court_counts$\n$nesnd_court_review_rules$"
 nesnd_court_status_paris: "Works are concentrated in Paris. $nesnd_court_counts$\n$nesnd_court_opened$\n$nesnd_court_review_rules$"
 nesnd_court_status_provinces: "Works are concentrated in the provinces. $nesnd_court_counts$\n$nesnd_court_opened$\n$nesnd_court_review_rules$"
 nesnd_court_review_rules: "After five years, the review compares metropolitan states held within the same borders under the current policy. A net gain of #v 1#! urban center level in the favored area earns #g 5#! Prestige. If its share also rises by at least #v 1#! percentage point, the award is #g 10#! Prestige. Either award lasts #v 24#! months."
 nesnd_court_wait: "At least twelve months have passed since the last works policy was chosen"
 nesnd_court_requires_paris: "France holds land in Île-de-France"
 nesnd_court_requires_towns: "Metropolitan France has at least one urban center level"
 nesnd_court_requires_provinces: "France holds a metropolitan state outside Île-de-France"
 nesnd_court_paris_available: "Paris is available as a new focus"
 nesnd_court_provinces_available: "The provinces are available as a new focus"
 nesnd_court_share_name: "Paris Share of Urban Centers"
 nesnd_court_share_desc: "Paris #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
 nesnd_court_choose_paris: "Develop Paris"
 nesnd_court_choose_paris_desc: "How many carts along the Seine are still waiting for a place to unload?"
 nesnd_court_choose_provinces: "Develop the Provinces"
 nesnd_court_choose_provinces_desc: "Give a manufacturer a road for his coal and he can hire in his own town."
 nesnd_court_change_tt: "The review will measure the new policy from today’s urban center levels. The focus can change again in #v 12#! months. The review date stays fixed."
 nesnd_court_paris_policy_tt: "Infrastructure from population in Île-de-France: #g +20%#!. $nesnd_court_change_tt$"
 nesnd_court_provinces_policy_tt: "Migration attraction in Île-de-France: #r −15%#!. Other French metropolitan states gain #g +15%#! migration attraction and #g +10%#! construction efficiency. $nesnd_court_change_tt$"
 nesnd_court_closed: "The public works mandate has ended."
 nesnd_court_review_header: "Five-Year Public Works Review"
 nesnd_court_review_effect: "Assess urban growth and close the works accounts"
 nesnd_court_paris_works: "Works on the Seine"
 nesnd_court_paris_outflow: "Recruitment for the Provinces"
 nesnd_court_provincial_works: "Provincial Public Works"
 nesnd_court_reported_growth: "Public Works Delivered"
 nesnd_court_marked_growth: "Distinction in Public Works"
 nesnd_france_court.1.t: "The Five-Year Accounts"
 nesnd_france_court.1.marked: "The auditor adds up both columns twice. The towns that received funding have grown. Across metropolitan states whose borders have remained unchanged since the allocation, the funded towns now account for a larger share of urban development. When the minister gives the table to the press, he asks the compositor to print the totals exactly as they stand.\n\nFrance gains #g 10#! Prestige for #v 24#! months."
 nesnd_france_court.1.growth: "The returns have been bound into a single volume. The auditor underlines the total. The towns that received the works can now show additional urban districts. That gives the minister grounds to read his predecessor’s promise aloud in the chamber.\n\nFrance gains #g 5#! Prestige for #v 24#! months."
 nesnd_france_court.1.flat: "The clerk sets the old appropriations book beside the new returns. The towns singled out for investment have yet to exceed their old total. A delegate from a chamber of commerce rises to ask whether the ministry has at least kept the ribbon from the opening ceremony."
 nesnd_france_court.1.missing: "The review falls due. The auditor asks for two columns covering the same towns before and after the appropriation. The papers do not yield such a table. He records the reason, signs his report and returns the files to the Ministry of Public Works."
 nesnd_france_court.1.paris: "Area assessed: Paris. $nesnd_court_figures$"
 nesnd_france_court.1.provinces: "Area assessed: the provinces. $nesnd_court_figures$"
 nesnd_court_figures: "Urban center levels went from #v [SCOPE.GetValue('nesnd_court_before')|0]#! to #v [SCOPE.GetValue('nesnd_court_after')|0]#!. The area’s share across comparable metropolitan states went from #v [SCOPE.GetValue('nesnd_court_share_before')|2]%#! to #v [SCOPE.GetValue('nesnd_court_share_after')|2]%#!."
 nesnd_france_court.1.unfiled: "No comparable accounts for this term."
 nesnd_france_court.1.a: "Send it to the printers."
