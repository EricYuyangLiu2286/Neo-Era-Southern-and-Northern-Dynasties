 nesnd_rising.1.t:0 "A Report on the Republicans"
 nesnd_rising.1.d:0 "Word has reached the Ministry of War that republican officers in the following states have agreed to rise. The ministry reckons it has ninety days to make its dispositions.\n\n[ROOT.GetCountry.GetCustom('nesnd_rep_show_shanxi')][ROOT.GetCountry.GetCustom('nesnd_rep_show_jinbei')][ROOT.GetCountry.GetCustom('nesnd_rep_show_shaanbei')][ROOT.GetCountry.GetCustom('nesnd_rep_show_hinggan')][ROOT.GetCountry.GetCustom('nesnd_rep_show_shengjing')][ROOT.GetCountry.GetCustom('nesnd_rep_show_southern_manchuria')][ROOT.GetCountry.GetCustom('nesnd_rep_show_shandong')][ROOT.GetCountry.GetCustom('nesnd_rep_show_zhili')][ROOT.GetCountry.GetCustom('nesnd_rep_show_beijing')]"
 nesnd_rising.1.f:0 "“The garrisons, magazines and roads of each province are to be reported in separate returns.” — Ministry of War circular"
 nesnd_rising.1.a:0 "Send in the provincial returns."
 nesnd_rising.2.t:0 "The Garrisons Set a Date"
 nesnd_rising.2.d:0 "Denglai and the house of Xu have signed their articles. Officers in the following northeastern garrisons have given their word. The provincial authorities put the rising ninety days hence.\n\n[ROOT.GetCountry.GetCustom('nesnd_yan_show_songjiang')][ROOT.GetCountry.GetCustom('nesnd_yan_show_outer_manchuria')][ROOT.GetCountry.GetCustom('nesnd_yan_show_northern_manchuria')][ROOT.GetCountry.GetCustom('nesnd_yan_show_amur')][ROOT.GetCountry.GetCustom('nesnd_yan_show_boli')][ROOT.GetCountry.GetCustom('nesnd_yan_show_shengjing')][ROOT.GetCountry.GetCustom('nesnd_yan_show_southern_manchuria')]"
 nesnd_rising.2.f:0 "“A list of the garrisons that have pledged themselves is appended for the ministry.” — Report from the northeast"
 nesnd_rising.2.a:0 "Bring the map of the northeast."
 nesnd_rising.3.t:0 "The Garrison Gives Its Word"
 nesnd_rising.3.d:0 "The former officers in [SCOPE.sState('nesnd_yan_contact_target').GetName] have sent their answer. When the house of Xu rises, they will honour their pledge."
 nesnd_rising.3.f:0 "“We shall raise the banner on the appointed day.” — The garrison’s reply"
 nesnd_rising.3.a:0 "Keep their reply."
 nesnd_rising.4.t:0 "No Reply from the Garrison"
 nesnd_rising.4.d:0 "The money for the mission to [SCOPE.sState('nesnd_yan_contact_target').GetName] has been spent. No reply has reached Denglai."
 nesnd_rising.4.f:0 "“We have yet to receive an answer to our last inquiry.” — Letter from the society"
 nesnd_rising.4.a:0 "We must wait for further word."
 nesnd_usm_recognise_japanese:0 "Recognise the Japanese as a Constituent People"
 nesnd_usm_recognise_japanese_desc:0 "When a domestic secessionist, republican or socialist movement is at war with our government, we may recognise Japanese as a [concept_primary_culture]. We must own and control an incorporated state in the Japanese home islands, with no Japanese secessionist movement mobilising in our country."
 nesnd_usm_native_insurrection_tt:0 "At war with a domestic secession, a revolution demanding a presidential or parliamentary republic, or a socialist revolution."
 nesnd_usm_japanese_home_state_tt:0 "Own and control an incorporated state in the Japanese home islands."
 nesnd_usm_no_japanese_secession_tt:0 "No Japanese secessionist movement is mobilising in the country."
 nesnd_yan_missing_bases:0 "The societies need a foothold in both Songjiang and Vladivostok under northern rule before they can approach the other garrisons."
