 nesnd_mug_council_no_free_prince_tt:0 "India has no independent princely state left, and none that belongs to another country"
 nesnd_mug_council_complete_conclusion:0 "All the states of India have come into the empire, and the Council of Princes has become the empire's own deliberative body."
 nesnd_mug.14.t:0 "A Standing Council"
 nesnd_mug.14.d:0 "Railways, famine relief and defence have each been agreed at the Council of Princes. The states have grown used to conferring in the imperial capital every ten years, and the council has rules of its own, no longer merely an occasional summons from the emperor."
 nesnd_mug.14.f:0 "'The council shall be convened once every ten years, and the princes of all the states may attend.'\n— Rules of the Council of Princes"
 nesnd_mug.14.a:0 "Make It Permanent"
