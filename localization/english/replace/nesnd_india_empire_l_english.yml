 # Old treaty dispute (India batch 15)
 nesnd_india_treaty_dispute:0 "Dispute Over the Old Treaty"
 nesnd_india_treaty_dispute_reason:0 "[GetGlobalVariable('nesnd_india_dispute_g_lord').GetCountry.GetName] has questioned the old treaty between us. Under it we are a subject and pay tribute on time. Since the reform our government has grown less willing to take the arrangement for granted, while the overlord's ministers fear that, unless it is reaffirmed, the treaty will lose its force. Both sides have sent envoys, and the negotiations pass back and forth between the two capitals."
 nesnd_india_treaty_dispute_overlord_reason:0 "[GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName] has grown strong in recent years, and some at its court openly question the old treaty signed long ago. We mean to have them confirm it anew. Both sides have sent envoys, and the negotiations pass back and forth between the two capitals."
 nesnd_india_treaty_dispute_bar:0 "Negotiations on the Old Treaty"
 nesnd_india_treaty_dispute_bar_void_desc:0 "Repudiation"
 nesnd_india_treaty_dispute_bar_renew_desc:0 "Renewal"
 nesnd_india_dispute_rel_good_prog:0 "Good relations between the two countries"
 nesnd_india_dispute_rel_bad_prog:0 "Poor relations between the two countries"
 nesnd_india_dispute_can_pay_tt:0 "We can afford the cost and are not in [concept_default] or [concept_bankruptcy]"
 nesnd_india_dispute_petition_button:0 "Send Envoys to Petition"
 nesnd_india_dispute_petition_button_desc:0 "Send envoys to the overlord to explain our position and ask for the differences to be settled within the old treaty."
 nesnd_india_dispute_petition_wait_tt:0 "We have not sent envoys in the last year"
 nesnd_india_dispute_petition_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ #v +10#! towards renewal. No further envoys for a year."
 nesnd_india_dispute_withhold_button:0 "Withhold Tribute"
 nesnd_india_dispute_withhold_button_desc:0 "Withhold this year's tribute owed to the overlord."
 nesnd_india_dispute_withhold_wait_tt:0 "We have not withheld tribute in the last year"
 nesnd_india_dispute_withhold_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ moves #v 15#! towards repudiation, and the target [concept_fervor] of our [Concept('concept_primary_cultures','$concept_primary_culture$')] rises for five years. Not again for a year."
 nesnd_india_dispute_reaffirm_button:0 "Reaffirm the Old Treaty"
 nesnd_india_dispute_reaffirm_button_desc:0 "Send a note that every article of the old treaty remains in force."
 nesnd_india_dispute_reaffirm_wait_tt:0 "We have not reaffirmed the treaty in the last year"
 nesnd_india_dispute_reaffirm_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ moves #v 10#! towards repudiation, and [concept_relations] with the other side #r -10#!. No further reaffirmation for a year."
 nesnd_india_dispute_concede_button:0 "Revise the Terms"
 nesnd_india_dispute_concede_button_desc:0 "Pay to give way on the articles of the old treaty the other side resents most."
 nesnd_india_dispute_concede_wait_tt:0 "We have not revised the terms in the last year"
 nesnd_india_dispute_concede_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ #v +10#! towards renewal, and [concept_relations] with the other side #g +10#!. No further revision for a year."
 nesnd_india_dispute_renew_trigger_tt:0 "$nesnd_india_treaty_dispute_bar$ reaches the end of renewal"
 nesnd_india_dispute_void_trigger_tt:0 "$nesnd_india_treaty_dispute_bar$ reaches the end of repudiation"
 nesnd_india_dispute_renew_conclusion:0 "The two countries have renewed the old treaty."
 nesnd_india_dispute_void_conclusion:0 "The old treaty has been repudiated."
 nesnd_india_dispute_renew_wait_tt:0 "The old treaty will not be renegotiated for twenty years."
 nesnd_india_dispute_renew_involvement_tt:0 "The overlord turns its attention to the strategic regions of North and South India."
 nesnd_india_dispute_void_fervor_tt:0 "The target [concept_fervor] of the [Concept('concept_primary_cultures','$concept_primary_culture$')] of [GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName] rises for ten years."
 nesnd_india_dispute_void_indep_tt:0 "$nesnd_india_indep_economy_bar$ and $nesnd_india_indep_military_bar$ in '$nesnd_india_indep$' each #g +10#!."
 nesnd_india_dispute_void_claim_tt:0 "[GetGlobalVariable('nesnd_india_dispute_g_lord').GetCountry.GetName] lays a [concept_claim] on the capital state of [GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName]."
