 nesnd_mug.30.t:0 "A Quarrel Over the Old Treaty"
 nesnd_mug.30.d:0 "[SCOPE.sCountry('mug_dispute_subject').GetName] has grown strong in recent years, and some at its court openly ask whether the old treaty signed with us long ago can still bind the empire of today. We can renegotiate the treaty with them, or let the matter rest for now."
 nesnd_mug.30.f:0 "'When the old treaty was signed, the circumstances of both parties were very different from today's.'\n— Memorandum of the foreign ministry"
 nesnd_mug.30.a:0 "Renegotiate the Treaty"
 nesnd_mug.30.a_tt:0 "'$nesnd_india_treaty_dispute$' opens."
 nesnd_mug.30.b:0 "Let It Rest"
 nesnd_mug.30.b_tt:0 "The matter will not be raised again for ten years."
 nesnd_mug.31.t:0 "The Old Treaty Renewed"
 nesnd_mug.31.d_subject:0 "We have renewed the old treaty with our overlord, and the envoys of both countries have signed the new treaty."
 nesnd_mug.31.d_overlord:0 "We have renewed the old treaty with the empire that is our subject, and it has confirmed the bond of subjecthood anew."
 nesnd_mug.31.f:0 "'Both parties declare that the articles of the old treaty remain in force.'\n— Preamble to the new treaty"
 nesnd_mug.31.a:0 "Sign"
 nesnd_mug.31.a_subject_tt:0 "The old treaty will not be renegotiated for twenty years."
 nesnd_mug.31.a_overlord_tt:0 "The old treaty will not be renegotiated for twenty years."
 nesnd_mug.31_outcome_tt:0 "The two countries renew the old treaty."
 nesnd_mug.32.t:0 "The Old Treaty Repudiated"
 nesnd_mug.32.d_subject:0 "The negotiations have broken down, and we have declared ourselves no longer bound by the old treaty. Our overlord at once laid claim to our capital."
 nesnd_mug.32.d_overlord:0 "The negotiations have broken down, and the empire that is our subject has declared itself no longer bound by the old treaty. We have laid claim to the state of its capital."
 nesnd_mug.32.f:0 "'Our government recognises none of the articles of the old treaty.'\n— Note from the empire"
 nesnd_mug.32.a:0 "Noted"
 nesnd_mug.32.a_subject_tt:0 "The old treaty will not be renegotiated for ten years."
 nesnd_mug.32.a_overlord_tt:0 "The old treaty will not be renegotiated for ten years."
 nesnd_mug.32_outcome_tt:0 "The old treaty is repudiated."
