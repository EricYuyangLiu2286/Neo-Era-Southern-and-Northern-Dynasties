 nesnd_india_order_reason:0 "Among the [Concept('concept_subject', '$concept_subjects|q$')] of [ROOT.GetCountry.GetName] are now states of $region_north_india$ and $region_south_india$. Three matters between them and us are ours to decide: who collects the taxes, who commands the armies and conducts foreign affairs, and who runs the schools and appoints the officials. Each may be taken by the centre or left to the states."
 nesnd_india_order_tax_central_button:0 "Central Taxation"
 nesnd_india_order_tax_local_button:0 "Local Taxation"
 nesnd_india_order_army_central_button:0 "Central Command"
 nesnd_india_order_army_local_button:0 "Local Command"
 nesnd_india_order_school_central_button:0 "Central Schooling"
 nesnd_india_order_school_local_button:0 "Local Schooling"
 nesnd_india_order_void_conclusion:0 "We no longer have [Concept('concept_subject', '$concept_subjects|q$')] with populated states in $region_north_india$ or $region_south_india$, or no longer meet the conditions of The Centre and the States, and these arrangements are withdrawn."
 nesnd_mug_france:0 "The Old Agreement with Our Overlord"
 nesnd_mug_france_closure_tt:0 "We are no longer a [concept_subject], or the capital of our [concept_overlord] lies in $region_north_india$ or $region_south_india$"
 nesnd_mug_council:0 "The Council of Princes"
 nesnd_mug_council_reason_sitting:0 "$nesnd_mug_council_intro$\n\nThe council awaits the answers of the invited states and will be settled thirty days after it was called."
 nesnd_mug_council_reason_rest:0 "$nesnd_mug_council_intro$\n\nNo council can be called before [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_mug_council_wait'))]."
 nesnd_mug_council_reason_ready:0 "$nesnd_mug_council_intro$"
 nesnd_mug_council_button:0 "Call a Council of Princes"
 nesnd_mug_council_void_conclusion:0 "We can no longer call a council of princes."
 nesnd_india_order_tax_desc:0 "Decide how much of their income our [Concept('concept_subject', '$concept_subjects|q$')] pay to us."
 nesnd_india_order_tax_central_tt:0 "The [concept_tax_capacity] of our own states rises by 5%. With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $raise_payments$: it pays us more of its income, its weekly [concept_liberty_desire] goes up, and each pact takes 25 of our [concept_influence]. A [concept_protectorate], a [concept_personal_union], a subject that pays us no part of its income, or a subject in [concept_default] or with [concept_liberty_desire] of 75 or more cannot sign it and gets nothing."
 nesnd_india_order_switch_tt:0 "Every [concept_diplomatic_pact] and modifier that The Centre and the States set up for the earlier choice in this matter is removed first. A pact that cannot be removed at once is removed again each month, and until it is gone no new pact is signed with that subject. The choice cannot be changed again for 60 months. [Concept('concept_subject','$concept_subjects|q$')] that join later receive it at the next monthly update."
 nesnd_india_order_tax_local_tt:0 "With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $decrease_payments$: it pays us less of its income, and its weekly [concept_liberty_desire] goes down. A [concept_protectorate], a [concept_personal_union] or a subject that pays us no part of its income cannot sign it and gets nothing. Our own country gains no modifier."
 nesnd_india_order_army_desc:0 "Decide whether our [Concept('concept_subject', '$concept_subjects|q$')] follow us into [Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')] and wars."
 nesnd_india_order_army_central_tt:0 "Our [concept_authority] +10 for each [concept_subject]. The weekly [concept_liberty_desire] of each [concept_subject] of ours in $region_north_india$ or $region_south_india$ goes up. No subject changes its type."
 nesnd_india_order_army_local_tt:0 "With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $exempt_from_service$: it need not follow us into [Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')] and wars, and its weekly [concept_liberty_desire] goes down. A [concept_tributary] or a [concept_protectorate] never joins its [concept_overlord]'s wars, cannot sign it and gets nothing. Our own country gains no modifier."
 nesnd_india_order_school_desc:0 "Decide who sets the standards for schools and offices."
 nesnd_india_order_school_central_tt:0 "The [concept_pop_qualifications] of our own states +5%. With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $da_knowledge_sharing$: our [concept_technology_spread] slows and theirs quickens, their weekly [concept_liberty_desire] goes down, and each pact takes 50 of our [concept_influence]. Where we have not researched more technologies than they have, it cannot be signed and they get nothing."
 nesnd_india_order_school_local_tt:0 "The [concept_pop_qualifications] of each [concept_subject] of ours in $region_north_india$ or $region_south_india$ +5%, and its weekly [concept_liberty_desire] goes down. Our own country gains no modifier."
 nesnd_mug_council_button_desc:0 "Invite the princes to agree on a matter of common concern."
 nesnd_mug_call_council_tt:0 "Once the topic is chosen, up to eight [Concept('concept_princely_state','$concept_princely_states|q$')] with the best [concept_relations] with us are invited. The council is settled after thirty days, and the next cannot be called for ten years."
 nesnd_india_order_tax_central:0 "Central Taxation"
 nesnd_india_order_tax_central_desc:0 "Taxation is with the centre in The Centre and the States."
 nesnd_india_order_army_central:0 "Central Command"
 nesnd_india_order_army_central_desc:0 "The army and foreign affairs are with the centre in The Centre and the States."
 nesnd_india_order_school_central:0 "Central Schooling"
 nesnd_india_order_school_central_desc:0 "Schools and offices are with the centre in The Centre and the States."
 nesnd_india_order_army_subject:0 "Command by the [concept_overlord]"
 nesnd_india_order_army_subject_desc:0 "Our [concept_overlord] has taken the army and foreign affairs to the centre in The Centre and the States."
 nesnd_india_order_school_subject:0 "Schooling Kept at Home"
 nesnd_india_order_school_subject_desc:0 "Our [concept_overlord] has left schools and offices to the states in The Centre and the States."
 nesnd_mug_accept_aid_tt:0 "We pay for relief in the stricken states of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]. For twelve months those states suffer less from [concept_harvest_condition], #g 5%#! of the Indian-culture population there become [Concept('concept_loyalist','$concept_loyalists|q$')], and our [concept_relations] improve by #g +25#!."
 nesnd_mug_council_rail:0 "Council of Princes: Railways"
 nesnd_mug_council_rail_desc:0 "The council of princes agreed to build railways together."
 nesnd_mug_council_relief:0 "Council of Princes: Famine Relief"
 nesnd_mug_council_relief_desc:0 "The council of princes agreed on common famine relief."
 nesnd_mug_famine_relief:0 "Famine Relief"
 nesnd_mug_famine_relief_desc:0 "The government has paid for relief in this state."
 nesnd_india_order_has_subject_tt:0 "At least one [concept_subject] of ours holds populated states in $region_north_india$ or $region_south_india$"
 nesnd_india_order_already_tt:0 "This matter is not already settled this way"
 nesnd_mug_can_relieve_tt:0 "Our [concept_gold_reserves] cover the @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|K] that relief costs, and we are not in [concept_default]"
 nesnd_mug_matter_free_tt:0 "No other negotiation of ours awaits an answer"
 nesnd_mug_mughal_at_peace_tt:0 "[SCOPE.sCountry('mug_famine_mughal').GetName] still exists and is not at war with us"
 nesnd_mug_overlord_at_peace_tt:0 "Our [concept_overlord] is not at war with us"
 nesnd_mug_council_rested_tt:0 "Ten years have passed since the last council of princes"
 nesnd_mug_council_not_sitting_tt:0 "No council of princes is awaiting answers"
 nesnd_mug_council_has_guests_tt:0 "At least one [concept_princely_state] not at war can be invited"
 nesnd_mug_we_can_aid_tt:0 "Our [concept_gold_reserves] are at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K], and we are not in [concept_default]"
 nesnd_mug.1.t:0 "The Answer of [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_mug.1.f:0 "“The Government agrees to the request of your Government.”\n—Note from the Government of [SCOPE.sCountry('india_matter_to').GetName] to the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug.2.t:0 "Request Not Granted"
 nesnd_mug.2.d_silent:0 "[SCOPE.sCountry('india_matter_to').GetName] has not answered within thirty days, and our request lapses."
 nesnd_mug.2.d_void:0 "Circumstances have changed, and our request can no longer be pursued."
 nesnd_mug.2.f:0 "“These negotiations are suspended.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug.11.t:0 "Calling the Council of Princes"
 nesnd_mug.11.d:0 "Our government is ready to summon the princes to a council. A council deals with one matter only: building railways, famine relief, or common defence."
 nesnd_mug.11.f:0 "“The council shall deal only with matters of common concern to the states, and not with the internal affairs of any state.”\n—Circular of the Government of [ROOT.GetCountry.GetName] to the [Concept('concept_princely_state','$concept_princely_states|q$')]"
 nesnd_mug.11.a:0 "Railways"
 nesnd_mug_council_rail_tt:0 "The topic is railways. The states that attend and we each receive “$nesnd_mug_council_rail$” for ten years: [concept_infrastructure] #g +2#!, State Construction Efficiency #g +5%#!."
 nesnd_mug_council_invite_tt:0 "The council is settled after thirty days, and dissolves if no one attends. The next cannot be called for ten years."
 nesnd_mug.11.b:0 "Famine relief"
 nesnd_mug_council_relief_tt:0 "The topic is famine relief. The states that attend and we each receive “$nesnd_mug_council_relief$” for ten years: impact of [GetHarvestConditionType('drought').GetName] and [GetHarvestConditionType('flood').GetName] #g −20%#!."
 nesnd_mug.11.c:0 "Common defence"
 nesnd_mug_council_defence_tt:0 "The topic is common defence. Only [Concept('concept_princely_state','$concept_princely_states|q$')] that could sign a [concept_defensive_pact] with us today are invited. Our own [Concept('concept_subject', '$concept_subjects|q$')] and states that the treaty's own terms rule out are not. We sign a [concept_defensive_pact] with each state that attends, with a [concept_binding_period] of five years. Each such treaty has an [concept_influence] upkeep of @inf!#v [GetArticleType('defensive_pact').GetCost|0]#! for each side, and with the states that can be invited today ours comes to at most #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_defence_influence')|0]#!. Any treaty that still cannot be concluded at the settlement is counted in the report."
 nesnd_mug_council_defence_guests_tt:0 "At least one [concept_princely_state] could sign a [concept_defensive_pact] with us today"
 nesnd_mug.11.e:0 "Not now"
 nesnd_mug_council_later_tt:0 "No council is called this time. One may be called at any time."
 nesnd_mug.12.t:0 "An Invitation to the Council of Princes"
 nesnd_mug.12.d_rail:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to a council of princes on building railways together. The states that attend share the agreement of the council with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]. Those that stay away are not bound by it."
 nesnd_mug.12.d_relief:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to a council of princes on famine relief in common. The states that attend share the agreement of the council with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]. Those that stay away are not bound by it."
 nesnd_mug.12.d_defence:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to a council of princes on common defence. The states that attend share the agreement of the council with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]. Those that stay away are not bound by it."
 nesnd_mug.12.f:0 "“The Government invites your state to send a representative to a council on matters of common concern to the states.”\n—Letter of invitation from the Government of [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] to the [Concept('concept_princely_state','$concept_princely_states|q$')]"
 nesnd_mug.12.a:0 "Attend"
 nesnd_mug_attend_rail_tt:0 "We attend. When the council is settled we receive “$nesnd_mug_council_rail$” for ten years: [concept_infrastructure] #g +2#!, State Construction Efficiency #g +5%#!."
 nesnd_mug_attend_relief_tt:0 "We attend. When the council is settled we receive “$nesnd_mug_council_relief$” for ten years: impact of [GetHarvestConditionType('drought').GetName] and [GetHarvestConditionType('flood').GetName] #g −20%#!."
 nesnd_mug_attend_defence_tt:0 "We attend. When the council is settled we sign a [concept_defensive_pact] with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName], with a [concept_binding_period] of five years. The treaty has an [concept_influence] upkeep of @inf!#v [GetArticleType('defensive_pact').GetCost|0]#! for each side. If the treaty cannot be concluded, this part falls away."
 nesnd_mug.12.b:0 "Decline"
 nesnd_mug_decline_council_tt:0 "We stay away, receive no modifier and sign no treaty."
 nesnd_mug.13.t:0 "The Outcome of the Council of Princes"
 nesnd_mug.13.d_none:0 "None of the invited states attended, and the council has dissolved."
 nesnd_mug.13.d_rail:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! [Concept('concept_princely_state','$concept_princely_states|q$')] attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. The council agreed to build railways together, and we and each state that attended receive “$nesnd_mug_council_rail$”."
 nesnd_mug.13.d_relief:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! [Concept('concept_princely_state','$concept_princely_states|q$')] attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. The council agreed on common famine relief, and we and each state that attended receive “$nesnd_mug_council_relief$”."
 nesnd_mug.13.d_defence_unsigned:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! [Concept('concept_princely_state','$concept_princely_states|q$')] attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. We signed a [concept_defensive_pact] with the states that attended, but #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_unsigned_value')|0]#! of these could not be concluded."
 nesnd_mug.13.d_defence:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! [Concept('concept_princely_state','$concept_princely_states|q$')] attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. We have signed a [concept_defensive_pact] with each state that attended."
 nesnd_mug.13.f:0 "“The council of princes is closed.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug_council_none_tt:0 "No modifier and no treaty."
 nesnd_mug_council_done_tt:0 "The agreements of the council are in force."
 nesnd_mug.21.t:0 "Stricken Fields"
 nesnd_mug.21.d:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! of our states are struck by a [concept_harvest_condition], and their farms yield less. Our government can pay for relief."
 nesnd_mug.21.f:0 "“The farms of this state yield less this year. We pray that relief be sent without delay.”\n—Reports of distress from the stricken states to the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug.21.a:0 "Pay for relief"
 nesnd_mug_relief_tt:0 "Each of the #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! stricken states receives “$nesnd_mug_famine_relief$” for twelve months: impact of [GetHarvestConditionType('drought').GetName], [GetHarvestConditionType('flood').GetName], [GetHarvestConditionType('wildfire').GetName], [GetHarvestConditionType('heatwave').GetName], [GetHarvestConditionType('extreme_winds').GetName] and [GetHarvestConditionType('disease_outbreak').GetName] #g −20%#!, Food Security #g +5%#!."
 nesnd_mug.21.b:0 "Give no relief"
 nesnd_mug_no_relief_tt:0 "Our government pays nothing, and the stricken states receive no modifier. No such report will come again for twenty-four months."
 nesnd_mug.22.t:0 "Stricken Fields"
 nesnd_mug.22.d:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! of our states are struck by a [concept_harvest_condition], and their farms yield less. We can pay for relief ourselves or ask [SCOPE.sCountry('mug_famine_mughal').GetName] for help. If we are [concept_subject] to another country, we can also ask our [concept_overlord]."
 nesnd_mug.22.d_alone:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! of our states are struck by a [concept_harvest_condition], and their farms yield less. We can pay for relief ourselves. If we are [concept_subject] to another country, we can also ask our [concept_overlord]."
 nesnd_mug.22.f:0 "“The farms of this state yield less this year. We pray that relief be sent without delay.”\n—Reports of distress from the stricken states to the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug.22.a:0 "Pay for relief ourselves"
 nesnd_mug.22.b:0 "Ask [SCOPE.sCountry('mug_famine_mughal').GetName] for help"
 nesnd_mug_ask_mughal_tt:0 "We ask [SCOPE.sCountry('mug_famine_mughal').GetName] for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|K]. If it agrees, each stricken state receives “$nesnd_mug_famine_relief$” for twelve months and our [concept_relations] improve by #g +25#!."
 nesnd_mug_aid_wait_tt:0 "The other government has thirty days to answer. If it refuses or does not answer, we can still pay for relief ourselves."
 nesnd_mug.22.c:0 "Ask our [concept_overlord] for help"
 nesnd_mug_ask_overlord_tt:0 "We ask [ROOT.GetCountry.GetOverlord.GetName] for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|K]. If it agrees, each stricken state receives “$nesnd_mug_famine_relief$” for twelve months and our [concept_relations] improve by #g +25#!."
 nesnd_mug.22.e:0 "Give no relief"
 nesnd_mug.23.t:0 "Relief Money Arrives"
 nesnd_mug.23.d_mughal:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to help and paid for relief in our stricken states. Those states suffer less, and our [concept_relations] have improved."
 nesnd_mug.23.d_overlord:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to help and paid for relief in our stricken states. Those states suffer less, and our [concept_relations] have improved."
 nesnd_mug.23.f:0 "“The relief money has been paid out.”\n—Notice of the Government of [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_mug_aid_given_tt:0 "Each stricken state receives “$nesnd_mug_famine_relief$” for twelve months, #g 5%#! of the Indian-culture population there become [Concept('concept_loyalist','$concept_loyalists|q$')], and our [concept_relations] improve by #g +25#!."
 nesnd_mug_aid_refused_radicals_tt:0 "#r 10%#! of the Indian-culture population in each stricken state have become [Concept('concept_radical','$concept_radicals|q$')]."
 nesnd_mug.24.t:0 "No Help Comes"
 nesnd_mug.24.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has withheld its consent as [concept_overlord], and our request for help was never sent. We can still pay for relief in the stricken states ourselves."
 nesnd_mug.24.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request for help. We can still pay for relief in the stricken states ourselves."
 nesnd_mug.24.d_silent:0 "[SCOPE.sCountry('india_matter_to').GetName] has not answered within thirty days. We can still pay for relief in the stricken states ourselves."
 nesnd_mug.24.d_queued:0 "[SCOPE.sCountry('india_matter_to').GetName] has been taken up with other negotiations, and our request for help never reached it, so it has lapsed. We can still pay for relief in the stricken states ourselves."
 nesnd_mug.24.d_void:0 "Circumstances have changed, and our request for help can no longer be pursued. We can still pay for relief in the states that remain stricken."
 nesnd_mug.24.f:0 "“The request for help is suspended.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug.25.t:0 "Famine Drives Emigration Abroad"
 nesnd_mug.25.d:0 "With the appeal for relief unfulfilled, distress deepens across the stricken provinces of [ROOT.GetCountry.GetName]. Driven from barren fields, large numbers of [SCOPE.sCulture('mug_famine_mig_culture').GetName] families are leaving home to join their [concept_cultural_community] in [SCOPE.sState('mug_famine_mig_state').GetName] in [SCOPE.sCountry('mug_famine_mig_host').GetName]."
 nesnd_mug.25.f:0 "“The harvests have failed and there is no livelihood left in the villages, while word comes that our countrymen have a foothold overseas.”\n— Port customs report"
 nesnd_mug.25.a_tt:0 "A [concept_mass_migration] of [SCOPE.sCulture('mug_famine_mig_culture').GetName] people begins from our country to [SCOPE.sState('mug_famine_mig_state').GetName] in [SCOPE.sCountry('mug_famine_mig_host').GetName]. No further famine emigration of this kind can occur from our country for ten years."

 # Independence
 nesnd_india_indep_fund_tt:0 "The recipient gains 10 percentage points of activism and 25% faster activism growth for 24 months. A further grant renews the term."
 nesnd_india_indep_fund_indian_tt:0 "In each state of [SCOPE.sCountry('indep_lord').GetName], #r 5%#! of the people of the movement's culture become [Concept('concept_radical','$concept_radicals|q$')]."
 nesnd_india_indep_indian_movement_tt:0 "[SCOPE.sCountry('indep_lord').GetName] has an Indian cultural minority [concept_political_movement]"
 nesnd_india_indep_fund_indian_target_tt:0 "The recipient is the strongest Indian cultural minority movement: [SCOPE.sPoliticalMovement('indep_choice_indian').GetName]."
 nesnd_india_indep_fund_indian_fallback_tt:0 "No eligible Indian cultural minority [concept_political_movement] is active at present."
 nesnd_india_indep_movement_indian:0 "Support an Indian Cultural Minority Movement in [SCOPE.sCountry('indep_lord').GetName]"
 nesnd_india_indep_conciliate_terms:0 "Once a [concept_subject] is chosen, spend a sum equal to a quarter of its income. An existing $lobby_pro_overlord$ gains 4 [concept_political_lobby_appeasement]. If there is none, the most influential eligible [concept_interest_group] founds it. We may fund another lobby in 12 months."
 nesnd_india_indep_coerce_terms:0 "Reduce each reserve by up to 50 points, confiscate all stockpiled arms and reduce [concept_relations] by 30. We may issue another such order in 12 months."
 nesnd_india_indep_defer:0 "Defer the Decision"
 nesnd_india_indep_defer_tt:0 "We take no action and incur no expense."
 nesnd_india_indep_impound_tt:0 "Confiscate one remaining batch of clandestine arms. [concept_relations] fall by 30."
 nesnd_india_indep_trace_tt:0 "[concept_relations] fall by 30. Revoke this grant if it is still in effect."
 nesnd_india_indep_file_only_tt:0 "Close the case without taking action against any grant or stockpile."
 nesnd_india_indep_movement_1:0 "[SCOPE.sPoliticalMovement('indep_choice_1').GetName]"
 nesnd_india_indep_target_1:0 "[SCOPE.sCountry('indep_subject_1').GetName]"
 nesnd_india_indep_movement_2:0 "[SCOPE.sPoliticalMovement('indep_choice_2').GetName]"
 nesnd_india_indep_target_2:0 "[SCOPE.sCountry('indep_subject_2').GetName]"
 nesnd_india_indep_movement_3:0 "[SCOPE.sPoliticalMovement('indep_choice_3').GetName]"
 nesnd_india_indep_target_3:0 "[SCOPE.sCountry('indep_subject_3').GetName]"
 nesnd_india_indep.1.t:0 "Movements in the [concept_overlord]’s Country"
 nesnd_india_indep.1.d:0 "We are preparing to assist a [concept_political_movement] in [SCOPE.sCountry('indep_lord').GetName]. For a grant we favour movements with backing among the wealthy. For military supplies we give priority to those with support in the armed forces. This assistance would allow the recipients to organise more widely, though our [concept_overlord] might trace the money or supplies back to us."
 nesnd_india_indep.1.f:0 "“Name the recipient so that payment or supplies may be delivered to its representatives.” — Draft warrant"
 nesnd_india_indep.2.t:0 "A [concept_subject]’s Activities Discovered"
 nesnd_india_indep.2.d_arms:0 "We have learned that the government of [SCOPE.sCountry('indep_actor').GetName] has been storing arms in secret. An inquiry would allow us to demand the surrender of a consignment."
 nesnd_india_indep.2.d_funding:0 "We have traced assistance received by [SCOPE.sPoliticalMovement('indep_movement').GetName] to [SCOPE.sCountry('indep_actor').GetName]. It is for us to decide whether to make formal representations."
 nesnd_india_indep.2.d_gone:0 "We have obtained a record of support from [SCOPE.sCountry('indep_actor').GetName] for a [concept_political_movement] here. The movement has since dissolved, but we can still take up the matter with the donor."
 nesnd_india_indep.2.f:0 "“Instructions are requested on whether representations are to be made to the government concerned.” — Report of inquiry"
 nesnd_india_indep.2.a:0 "Open a Formal Inquiry"
 nesnd_india_indep.2.b:0 "File the Report"
 nesnd_india_indep.3.t:0 "Representations from the [concept_overlord]"
 nesnd_india_indep.3.d:0 "[SCOPE.sCountry('indep_lord').GetName] has made formal representations over our preparations. The inquiry has damaged [concept_relations] between our countries."
 nesnd_india_indep.3.f:0 "“Our government has formally brought this matter to your attention.” — Diplomatic note"
 nesnd_india_indep.3.result:0 "The inquiry has reduced [concept_relations] by 30."
 nesnd_india_indep.4.t:0 "The [concept_overlord] Files the Report"
 nesnd_india_indep.4.d:0 "[SCOPE.sCountry('indep_lord').GetName] has learned of our activities and filed the report. We have received no demand to surrender stores or recover a grant."
 nesnd_india_indep.4.f:0 "“Our government makes no further demand arising from the inquiry.” — Diplomatic reply"
 nesnd_india_indep.4.result:0 "The inquiry is closed."
 nesnd_india_indep.5.t:0 "Terms for a [concept_subject]"
 nesnd_india_indep.5.d_conciliate:0 "Some [Concept('concept_interest_group','$concept_interest_groups|q$')] in our [concept_subject] states wish to preserve their ties with us. We can fund a local $lobby_pro_overlord$ to put their case to their government."
 nesnd_india_indep.5.d_coerce:0 "We can require a [concept_subject] to curtail its preparations and surrender its arms stocks. Such an intervention in its internal affairs will further strain our [concept_relations]."
 nesnd_india_indep.5.f:0 "“Please specify the government to which this decision is to be communicated.” — Draft diplomatic correspondence"
 nesnd_india_indep.6.t:0 "The [concept_overlord] Funds the $lobby_pro_overlord$"
 nesnd_india_indep.6.d:0 "[SCOPE.sCountry('indep_lord').GetName] has provided funds for the $lobby_pro_overlord$ in our country. Its members favour preserving our ties with the [concept_overlord]."
 nesnd_india_indep.6.f:0 "“These funds are intended to help you put the case for maintaining ties between our countries.” — Letter accompanying the grant"
 nesnd_india_indep.6.result:0 "The $lobby_pro_overlord$ in our country has received funding from our [concept_overlord]."
 nesnd_india_indep.7.t:0 "The [concept_overlord] Orders a Stand-Down"
 nesnd_india_indep.7.d:0 "[SCOPE.sCountry('indep_lord').GetName] has ordered us to curtail our fundraising and military preparations and has confiscated our clandestine arms stocks. The order has strained [concept_relations] between our countries."
 nesnd_india_indep.7.f:0 "“All arms held in clandestine storage are to be surrendered.” — Confiscation order"
 nesnd_india_indep.7.result:0 "Each reserve has fallen by up to 50 points. All stockpiled arms have been confiscated and [concept_relations] have fallen by 30."
 nesnd_india_indep_support_regime_terms:0 "Conclude a $da_support_regime$ pact with the chosen [concept_subject]. We pay @inf!50 in upkeep and lose 10 [concept_legitimacy]. The subject government gains 20 legitimacy. The minimum term is 12 months."
 nesnd_india_indep.5.d_support_regime:0 "We can lend public support to the rulers of a direct [concept_subject]. We must decide which government to approach with an agreement."
 nesnd_india_indep.10.t:0 "Our [concept_overlord] Backs the Government"
 nesnd_india_indep.10.d:0 "[SCOPE.sCountry('indep_lord').GetName] has concluded an agreement with us and pledged public support for our government."
 nesnd_india_indep.10.f:0 "“We affirm our support for your government.” — Diplomatic note"
 nesnd_india_indep.10.result:0 "The $da_support_regime$ pact is now in force."
 nesnd_india_indep.11.t:0 "Securing a [concept_subject]’s Allegiance"
 nesnd_india_indep.11.d:0 "We can offer funds to [Concept('concept_interest_group','$concept_interest_groups|q$')] in a [concept_subject] state that wish to preserve its ties with us. Where the government itself needs our support, we can offer it a formal agreement."
 nesnd_india_indep.11.f:0 "“The funds are to be paid to the local $lobby_pro_overlord$.” — Diplomatic instructions"
 nesnd_india_indep.11.a:0 "Fund the $lobby_pro_overlord$."
 nesnd_india_indep.11.b:0 "Conclude a $da_support_regime$ pact."
 nesnd_mug_france_reason:0 "$nesnd_mug_france_intro$\n\n$nesnd_mug_france_terms$"
 nesnd_mug_france_status_sell_asked:0 "Our offer to sell property awaits the reply of [ROOT.GetCountry.GetOverlord.GetName]."
 nesnd_mug_france_status_buyback_asked:0 "Our request to buy back property awaits the reply of [ROOT.GetCountry.GetOverlord.GetName]."
 nesnd_mug_sell_button:0 "Sell Property"
 nesnd_mug_sell_button_desc:0 "Sell one level of our property to the government of our [concept_overlord]."
 nesnd_mug_buyback_button:0 "Buy Back Property"
 nesnd_mug_buyback_button_desc:0 "Buy back one level of property that the government of our [concept_overlord] holds in our country."
 nesnd_mug_ask_sell_tt:0 "Offer [ROOT.GetCountry.GetOverlord.GetName] one level of our property, priced by the [concept_construction] of that level as shown below. If it agrees, one level of a building in our country that we hold entirely passes to the government of [ROOT.GetCountry.GetOverlord.GetName]. The building keeps its [Concept('concept_production_method','$concept_production_methods|q$')]."
 nesnd_mug_ask_buyback_tt:0 "Ask [ROOT.GetCountry.GetOverlord.GetName] to sell us one level of property, at a price set by the [concept_construction] of that level as shown below. If it agrees, one level of a building in our country that [ROOT.GetCountry.GetOverlord.GetName] holds entirely passes to our government. The building keeps its [Concept('concept_production_method','$concept_production_methods|q$')]."
 nesnd_mug_sale_site_tt:0 "We hold a building in our country entirely and can sell one of its levels"
 nesnd_mug_buyback_site_tt:0 "[ROOT.GetCountry.GetOverlord.GetName] holds a building in our country entirely, and one of its levels can be bought back"
 nesnd_mug_can_pay_buyback_tt:0 "Our [concept_gold_reserves] are at least the buy-back price of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_buyback_quote')|K]"
 nesnd_mug_we_can_buy_tt:0 "Our [concept_gold_reserves] are at least the price offered, @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K], and we are not in [concept_default]"
 nesnd_mug_they_can_pay_tt:0 "The [concept_gold_reserves] of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] are still at least the price offered, @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]"
 nesnd_mug_accept_sell_tt:0 "We pay [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] the price offered and take ownership of one level of a building in its country."
 nesnd_mug_accept_buyback_tt:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us the price offered, and one level of our property in its country passes to it."
 nesnd_mug.1.d_sell:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to buy. One level of property in [SCOPE.sState('mug_deal_site').GetName] now belongs to the government of [SCOPE.sCountry('india_matter_to').GetName], and the price has been paid into our [concept_treasury]."
 nesnd_mug.1.d_buyback:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to sell. One level of property in [SCOPE.sState('mug_deal_site').GetName] now belongs to our government."
 nesnd_mug.1.d_none:0 "The transaction could not be completed. Ownership of the property is unchanged."
 nesnd_mug_sold_tt:0 "One level has passed to them, and the agreed price is paid into our treasury."
 nesnd_mug_bought_tt:0 "One level has passed to us, and the agreed price is paid from our treasury."
 nesnd_mug.2.d_sell_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] does not wish to buy our property. The old agreement remains as it was."
 nesnd_mug.2.d_buyback_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] will not sell its property in our country. The old agreement remains as it was."
 nesnd_mug_unchanged_tt:0 "Ownership of property is unchanged. We may not open another negotiation until six months after the request was made."
 nesnd_india_order_central_ten_tt:0 "All three matters have been under the centre for ten years in a row"
 nesnd_india_order_local_ten_tt:0 "All three matters have been under the states for ten years in a row"
 nesnd_india_order_two_left_tt:0 "Two member states have left us for independence within ten years"
 nesnd_india_order_central_conclusion:0 "The taxes, armies and schools of the states are all under the centre, and the arrangement is now settled."
 nesnd_india_order_federal_conclusion:0 "The states have managed their own affairs for ten years, and the arrangement is now settled."
 nesnd_india_order_scattered_conclusion:0 "One member after another has left, and the arrangements between the centre and the states are withdrawn."
 nesnd_india_order_central_settled:0 "A Central Settlement"
 nesnd_india_order_federal_settled:0 "A Federal Settlement"
 nesnd_india_order_scattered:0 "A Scattered Union"
 nesnd_india_order_scattered_claims_tt:0 "We [concept_claim] every state the two departed countries hold in $region_north_india$ and $region_south_india$."
 nesnd_india_order_scattered_goal_tt:0 "The one of the two with the higher [Concept('concept_gdp', '$concept_gdp_short|q$')] becomes our rival."
 nesnd_mug_france_ended_conclusion:0 "We are no longer bound to an overseas overlord, and the old agreement is at an end."
