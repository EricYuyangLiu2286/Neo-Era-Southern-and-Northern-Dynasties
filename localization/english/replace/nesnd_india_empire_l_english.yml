#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_unable')|0]#! could not take it (we must have researched more technologies than they have, or it cannot be signed), and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_dropped')|0]#! have since dropped it. It may be changed now."
