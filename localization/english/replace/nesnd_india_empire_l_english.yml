 nesnd_india_order_reason_L_L_0:0 "Among the [Concept('concept_subject', '$concept_subjects|q$')] of [ROOT.GetCountry.GetName] are now states of $region_north_india$ and $region_south_india$. Three matters between them and us are ours to decide: who collects the taxes, who commands the armies and conducts foreign affairs, and who runs the schools and appoints the officials. Each may be taken by the centre or left to the states.\n\nTaxation: with the states. We have the [concept_diplomatic_pact] $decrease_payments$ with #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_tax_in')|0]#! of our [Concept('concept_subject', '$concept_subjects|q$')]. #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_tax_unable')|0]#! could not take it (under the pact's own terms, a [concept_protectorate], a [concept_personal_union] or a subject that pays us no part of its income cannot sign it, and none is signed while an earlier $raise_payments$ pact is still in place), and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_tax_dropped')|0]#! have since dropped it. It may be changed now.\nArmy and foreign affairs: with the states. We have the [concept_diplomatic_pact] $exempt_from_service$ with #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_army_in')|0]#! of our [Concept('concept_subject', '$concept_subjects|q$')]. #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_army_unable')|0]#! could not take it (a [concept_tributary] or a [concept_protectorate] never joins its overlord's wars, and cannot sign it), and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_army_dropped')|0]#! have since dropped it. It may be changed now.\nSchools and offices: not yet settled."
 nesnd_india_order_reason_L_L_c:0 "Among the [Concept('concept_subject', '$concept_subjects|q$')] of [ROOT.GetCountry.GetName] are now states of $region_north_india$ and $region_south_india$. Three matters between them and us are ours to decide: who collects the taxes, who commands the armies and conducts foreign affairs, and who runs the schools and appoints the officials. Each may be taken by the centre or left to the states.\n\nTaxation: with the states. We have the [concept_diplomatic_pact] $decrease_payments$ with #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_tax_in')|0]#! of our [Concept('concept_subject', '$concept_subjects|q$')]. #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_tax_unable')|0]#! could not take it (under the pact's own terms, a [concept_protectorate], a [concept_personal_union] or a subject that pays us no part of its income cannot sign it, and none is signed while an earlier $raise_payments$ pact is still in place), and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_tax_dropped')|0]#! have since dropped it. It may be changed now.\nArmy and foreign affairs: with the states. We have the [concept_diplomatic_pact] $exempt_from_service$ with #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_army_in')|0]#! of our [Concept('concept_subject', '$concept_subjects|q$')]. #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_army_unable')|0]#! could not take it (a [concept_tributary] or a [concept_protectorate] never joins its overlord's wars, and cannot sign it), and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_army_dropped')|0]#! have since dropped it. It may be changed now.\nSchools and offices: with the centre. The [concept_pop_qualifications] of our own states rises by 5%. We have the [concept_diplomatic_pact] $da_knowledge_sharing$ with #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_in')|0]#! of our [Concept('concept_subject', '$concept_subjects|q$')]. #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_unable')|0]#! could not take it (we must have researched more technologies than they have, or it cannot be signed), and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_order_school_dropped')|0]#! have since dropped it. It cannot be changed before [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_india_order_school_wait'))]."
