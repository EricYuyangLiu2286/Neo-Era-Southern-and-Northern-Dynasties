l_english:
 nesnd_india_order:0 "An Empire of States"
 nesnd_india_order_school_wait_tt:0 "Five years have passed since the schools were last changed"
 nesnd_india_order_army_wait_tt:0 "Five years have passed since the army was last changed"
 nesnd_india_order_tax_wait_tt:0 "Five years have passed since payments were last changed"
 nesnd_india_order_reason:0 "[ROOT.GetCountry.GetName] is now an empire made up of many states. The emperor's ministers would bring taxation, the army and appointments all under the centre; the princes of the subject states hold that the empire is no more than the first among the states, and that each state's affairs are its own to decide. Yet once every state has learnt to obey the same law, where will the princes stand?"
 nesnd_india_order_tax_central_button:0 "Centralise Taxation"
 nesnd_india_order_tax_local_button:0 "Taxes to the States"
 nesnd_india_order_army_central_button:0 "Centralise the Army"
 nesnd_india_order_army_local_button:0 "Armies to the States"
 nesnd_india_order_school_central_button:0 "Centralise the Schools"
 nesnd_india_order_school_local_button:0 "Schools to the States"
 nesnd_india_order_void_conclusion:0 "The empire no longer has Indian subjects."
 nesnd_mug_france:0 "The Old Agreement with Our Overlord"
 nesnd_mug_france_closure_tt:0 "We are no longer a subject of a country whose capital is outside India"
 nesnd_mug_council:0 "The Council of Princes"
 nesnd_mug_council_reason_sitting:0 "$nesnd_mug_council_intro$\n\nThe invitations have gone out, and the princes' replies are arriving."
 nesnd_mug_council_reason_rest:0 "$nesnd_mug_council_intro$\n\nThe last council has dispersed, and the next cannot be called for some years."
 nesnd_mug_council_reason_ready:0 "$nesnd_mug_council_intro$"
 nesnd_mug_council_button:0 "Convene the Council of Princes"
 nesnd_mug_council_void_conclusion:0 "The Council of Princes no longer meets."
 nesnd_india_order_tax_desc:0 "Who decides the payments the subject states make to the empire."
 nesnd_india_order_tax_central_tt:0 "Sign $raise_payments$ with each Indian subject, and the empire gains [GetStaticModifier('nesnd_india_order_tax_central').GetName]."
 nesnd_india_order_switch_tt:0 "The pacts and modifiers of the previous arrangement in this matter are withdrawn. This matter cannot be changed again for five years."
 nesnd_india_order_tax_local_tt:0 "Sign $decrease_payments$ with each Indian subject."
 nesnd_india_order_army_desc:0 "Who commands the armies and the foreign affairs of the subject states."
 nesnd_india_order_army_central_tt:0 "Each Indian subject gains [GetStaticModifier('nesnd_india_order_army_subject').GetName], and the empire gains [GetStaticModifier('nesnd_india_order_army_central').GetName]."
 nesnd_india_order_army_local_tt:0 "Sign $exempt_from_service$ with each Indian subject."
 nesnd_india_order_school_desc:0 "Who sets the courses of the subject states' schools and the qualifications of their officials."
 nesnd_india_order_school_central_tt:0 "Sign $da_knowledge_sharing$ with each Indian subject, and the empire gains [GetStaticModifier('nesnd_india_order_school_central').GetName]."
 nesnd_india_order_school_local_tt:0 "Each Indian subject gains [GetStaticModifier('nesnd_india_order_school_subject').GetName]."
 nesnd_mug_council_button_desc:0 "Invite up to eight princes on the best terms with us to agree on one of railways, famine relief or common defence. The council can be called once every ten years."
 nesnd_mug_call_council_tt:0 "Choose the subject of the council."
 nesnd_india_order_tax_central:0 "Central Taxation"
 nesnd_india_order_tax_central_desc:0 "The subject states pay according to the empire's rules."
 nesnd_india_order_army_central:0 "Unified Command"
 nesnd_india_order_army_central_desc:0 "The armies and foreign affairs of the subject states are at the empire's command."
 nesnd_india_order_school_central:0 "Unified Schools"
 nesnd_india_order_school_central_desc:0 "The schools of the subject states teach the empire's courses, and their officials are appointed by the empire's qualifications."
 nesnd_india_order_army_subject:0 "Army Under Imperial Command"
 nesnd_india_order_army_subject_desc:0 "Our army and foreign affairs are at the empire's command."
 nesnd_india_order_school_subject:0 "Schools of Our Own"
 nesnd_india_order_school_subject_desc:0 "Our state sets its own school courses and qualifications for office."
 nesnd_mug_accept_aid_tt:0 "The stricken states of [SCOPE.sCountry('india_sender').GetName] receive relief, and 5% of the people of Indian cultures there become loyalists. [concept_relations] with [SCOPE.sCountry('india_sender').GetName] #g +25#!."
 nesnd_mug_decline_aid_tt:0 "10% of the people of Indian cultures in the stricken states of [SCOPE.sCountry('india_sender').GetName] become [concept_radical]s."
 nesnd_mug_decline_deal_tt:0 "[concept_relations] of [SCOPE.sCountry('india_sender').GetName] with us #r -15#!"
 nesnd_mug_council_rail:0 "Railways in Common"
 nesnd_mug_council_rail_desc:0 "The Council of Princes has agreed that the states will build railways in common."
 nesnd_mug_council_relief:0 "Relief in Common"
 nesnd_mug_council_relief_desc:0 "The Council of Princes has agreed that the states will aid one another in droughts and floods."
 nesnd_mug_famine_relief:0 "Famine Relief"
 nesnd_mug_famine_relief_desc:0 "The government has paid for relief in the stricken districts."
 nesnd_india_order_has_subject_tt:0 "We have Indian subjects"
 nesnd_india_order_already_tt:0 "This matter is not currently arranged this way"
 nesnd_mug_can_relieve_tt:0 "We can pay for the relief and are not in [concept_default]"
 nesnd_mug_request_free_tt:0 "We have no other request awaiting an answer"
 nesnd_mug_mughal_at_peace_tt:0 "[SCOPE.sCountry('mug_famine_mughal').GetName] still exists and is not at war with us"
 nesnd_mug_overlord_at_peace_tt:0 "Our overlord is not the Mughal and is not at war with us"
 nesnd_mug_council_rested_tt:0 "Ten years have passed since the last council"
 nesnd_mug_council_not_sitting_tt:0 "No council is sitting"
 nesnd_mug_council_has_guests_tt:0 "There are princes to invite"
 nesnd_mug_we_can_aid_tt:0 "Our [concept_gold_reserves] can cover the relief, and we are not in [concept_default]"
 nesnd_mug.1.t:0 "The Overlord Agrees"
 nesnd_mug.1.f:0 "'Our government agrees to the terms proposed.'\n— The overlord's reply"
 nesnd_mug.2.t:0 "The Overlord Declines"
 nesnd_mug.2.d_silent:0 "[SCOPE.sCountry('india_partner').GetName] gave no answer in time, and the offer has lapsed."
 nesnd_mug.2.d_void:0 "The conditions for the deal no longer hold, and the offer has lapsed."
 nesnd_mug.2.f:0 "'Our government has no wish to alter the present arrangement.'\n— The overlord's reply"
 nesnd_mug.11.t:0 "The Subject of the Council"
 nesnd_mug.11.d:0 "The invitations must name the subject. Railways would link the states' goods to the empire's ports; common relief would mean that no prince stands alone in a bad year; common defence would bind each state to the empire by treaty, so that if one is attacked, the empire sends troops."
 nesnd_mug.11.f:0 "'The princes of the states are hereby summoned this year to confer on the following matters.'\n— The imperial invitation"
 nesnd_mug.11.a:0 "Railways"
 nesnd_mug_council_rail_tt:0 "The empire and each prince who attends gain [GetStaticModifier('nesnd_mug_council_rail').GetName] for ten years."
 nesnd_mug_council_invite_tt:0 "Invite up to eight princes on the best terms with us; the council meets in thirty days."
 nesnd_mug.11.b:0 "Famine Relief"
 nesnd_mug_council_relief_tt:0 "The empire and each prince who attends gain [GetStaticModifier('nesnd_mug_council_relief').GetName] for ten years."
 nesnd_mug.11.c:0 "Common Defence"
 nesnd_mug_council_defence_tt:0 "The empire signs a five-year [concept_defensive_pact] with each prince who attends. Only princes who can sign are invited."
 nesnd_mug_council_defence_guests_tt:0 "There are princes who can sign a defensive treaty with us"
 nesnd_mug.11.e:0 "Not Now"
 nesnd_mug_council_later_tt:0 "No council is called."
 nesnd_mug.12.t:0 "Summons to the Council of Princes"
 nesnd_mug.12.d_rail:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to the council to confer on railways built in common by the states."
 nesnd_mug.12.d_relief:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to the council to confer on famine relief in common among the states."
 nesnd_mug.12.d_defence:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to the council to confer on defensive treaties between the states and the empire."
 nesnd_mug.12.f:0 "'The princes of the states are hereby summoned this year to confer on the following matters.'\n— The imperial invitation"
 nesnd_mug.12.a:0 "Attend"
 nesnd_mug_attend_rail_tt:0 "Our state gains [GetStaticModifier('nesnd_mug_council_rail').GetName] for ten years."
 nesnd_mug_attend_relief_tt:0 "Our state gains [GetStaticModifier('nesnd_mug_council_relief').GetName] for ten years."
 nesnd_mug_attend_defence_tt:0 "Our state signs a five-year [concept_defensive_pact] with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] (if it can still be signed when the council meets)."
 nesnd_mug.12.b:0 "Decline Politely"
 nesnd_mug_decline_council_tt:0 "We do not attend."
 nesnd_mug.13.t:0 "The Council of Princes"
 nesnd_mug.13.d_none:0 "No prince came, and the council could not be held."
 nesnd_mug.13.d_rail:0 "#v [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_yes').GetValue|0]#! princes attended and agreed to build railways in common."
 nesnd_mug.13.d_relief:0 "#v [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_yes').GetValue|0]#! princes attended and agreed on famine relief in common."
 nesnd_mug.13.d_defence_unsigned:0 "#v [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_yes').GetValue|0]#! princes attended and each state signed a defensive treaty with the empire, though a few princes could no longer sign when the council met."
 nesnd_mug.13.d_defence:0 "#v [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_yes').GetValue|0]#! princes attended, and each state signed a defensive treaty with the empire."
 nesnd_mug.13.f:0 "'The resolutions of the council take effect from this day.'\n— Resolution of the Council of Princes"
 nesnd_mug_council_none_tt:0 "No council can be called for ten years."
 nesnd_mug_council_done_tt:0 "The council's resolutions take effect. No council can be called for ten years."
 nesnd_mug.21.t:0 "Famine"
 nesnd_mug.21.d:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! states of [ROOT.GetCountry.GetName] have been struck: the harvest has failed and the price of grain is soaring. The governors ask the court for money to open the granaries."
 nesnd_mug.21.f:0 "'The starving in the stricken districts grow in number daily. Relief funds are urgently requested.'\n— Dispatch from a governor"
 nesnd_mug.21.a:0 "Pay for Relief"
 nesnd_mug_relief_tt:0 "Each stricken state gains [GetStaticModifier('nesnd_mug_famine_relief').GetName] for twelve months."
 nesnd_mug.21.b:0 "Let It Run Its Course"
 nesnd_mug_no_relief_tt:0 "No relief is given."
 nesnd_mug.22.t:0 "Famine"
 nesnd_mug.22.d:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! states of [ROOT.GetCountry.GetName] have been struck. Our treasury may not bear the cost of relief, and the government may also ask [SCOPE.sCountry('mug_famine_mughal').GetName] for help."
 nesnd_mug.22.d_alone:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! states of [ROOT.GetCountry.GetName] have been struck: the harvest has failed and the price of grain is soaring."
 nesnd_mug.22.f:0 "'The starving in the stricken districts grow in number daily. Relief funds are urgently requested.'\n— Dispatch from a governor"
 nesnd_mug.22.a:0 "Pay for Relief Ourselves"
 nesnd_mug.22.b:0 "Ask [SCOPE.sCountry('mug_famine_mughal').GetName] for Help"
 nesnd_mug_ask_mughal_tt:0 "Ask [SCOPE.sCountry('mug_famine_mughal').GetName] for relief funds. If granted, #g 5%#! of the people of Indian cultures in the stricken states become loyalists; if refused, #r 10%#! become [concept_radical]s."
 nesnd_mug_aid_wait_tt:0 "The answer comes within 45 days."
 nesnd_mug.22.c:0 "Ask Our Overlord for Help"
 nesnd_mug_ask_overlord_tt:0 "Ask our overlord for relief funds. If granted, #g 5%#! of the people of Indian cultures in the stricken states become loyalists; if refused, #r 10%#! become [concept_radical]s."
 nesnd_mug.22.e:0 "Let It Run Its Course"
 nesnd_mug.23.t:0 "Relief Arrives"
 nesnd_mug.23.d_mughal:0 "[SCOPE.sCountry('india_partner').GetName] has sent relief funds."
 nesnd_mug.23.d_overlord:0 "Our overlord, [SCOPE.sCountry('india_partner').GetName], has sent relief funds."
 nesnd_mug.23.f:0 "'A sum is hereby granted for relief, to be used solely in the stricken districts.'\n— Grant of funds"
 nesnd_mug_aid_given_tt:0 "Each stricken state gains [GetStaticModifier('nesnd_mug_famine_relief').GetName] for twelve months, #g 5%#! of the people of Indian cultures there become loyalists, and [concept_relations] with the donor #g +25#!."
 nesnd_mug_aid_refused_radicals_tt:0 "#r 10%#! of the people of Indian cultures in the stricken states become [concept_radical]s. With three or more stricken states, the starving may leave in great numbers."
 nesnd_mug.24.t:0 "No Help Coming"
 nesnd_mug.24.d_forbid:0 "[SCOPE.sCountry('india_consent_lord').GetName] has forbidden us to ask [SCOPE.sCountry('india_partner').GetName] for help. Relief must be borne by our own treasury."
 nesnd_mug.24.d_decline:0 "[SCOPE.sCountry('india_partner').GetName] has refused our plea. Relief must be borne by our own treasury."
 nesnd_mug.24.d_silent:0 "[SCOPE.sCountry('india_partner').GetName] gave no answer in time. Relief must be borne by our own treasury."
 nesnd_mug.24.d_void:0 "Our plea could not be delivered. Relief must be borne by our own treasury."
 nesnd_mug.24.f:0 "'The treasury's reserves are limited, and relief must be paid within our means.'\n— Report of the finance minister"
 nesnd_mug.25.t:0 "The Starving Leave"
 nesnd_mug.25.d:0 "Great numbers of starving [SCOPE.sCulture('mug_famine_mig_culture').GetName] have left their homes for [SCOPE.sState('mug_famine_mig_state').GetName] in [SCOPE.sCountry('mug_famine_mig_host').GetName], where their own people have settled before them."
 nesnd_mug.25.f:0 "'The roads are crowded with people fleeing the famine, all bound for kinsmen overseas.'\n— Report of a governor"
 nesnd_mug.25.a_tt:0 "A mass migration has begun. No such exodus will happen again for ten years."

 # Independence
 nesnd_india_indep_fund_tt:0 "The movement gains [GetStaticModifier('nesnd_india_indep_funded').GetName] for two years, and the chosen measure falls by #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_price')|0]#!. The overlord may find out."
 nesnd_india_indep_fund_indian_tt:0 "In the overlord's states, #v 5%#! of the people of this culture become [concept_radical]s."
 nesnd_india_indep_indian_movement_tt:0 "There is a [concept_cultural_movement] of an Indian culture in the overlord's country"
 nesnd_india_indep_fund_indian_target_tt:0 "Fund [SCOPE.sPoliticalMovement('indep_choice_indian').GetName]."
 nesnd_india_indep_fund_indian_fallback_tt:0 "There is at present no Indian minority movement in the overlord's country."
 nesnd_india_indep_movement_indian:0 "Fund the Indian Movement"
 nesnd_india_indep_conciliate_terms:0 "Its $lobby_pro_overlord$ gains #g +4#! [concept_political_lobby_appeasement], or an interest group forms one if there is none. No further payment of this kind for a year."
 nesnd_india_indep_coerce_terms:0 "Its $nesnd_india_indep_economy_bar$ and $nesnd_india_indep_military_bar$ each #r -50#!, all its stores of arms are seized, and its [concept_relations] with us #r -30#!. No further coercion for a year."
 nesnd_india_indep_defer:0 "Not Now"
 nesnd_india_indep_defer_tt:0 "No action is taken."
 nesnd_india_indep_impound_tt:0 "Seize the store of arms, and [concept_relations] with [SCOPE.sCountry('indep_actor').GetName] #r -30#!."
 nesnd_india_indep_trace_tt:0 "Cut off the funds, and [concept_relations] with [SCOPE.sCountry('indep_actor').GetName] #r -30#!."
 nesnd_india_indep_file_only_tt:0 "The matter is only placed on file, and no action is taken."
 nesnd_india_indep_movement_1:0 "[SCOPE.sPoliticalMovement('indep_choice_1').GetName]"
 nesnd_india_indep_target_1:0 "[SCOPE.sCountry('indep_subject_1').GetName]"
 nesnd_india_indep_movement_2:0 "[SCOPE.sPoliticalMovement('indep_choice_2').GetName]"
 nesnd_india_indep_target_2:0 "[SCOPE.sCountry('indep_subject_2').GetName]"
 nesnd_india_indep_movement_3:0 "[SCOPE.sPoliticalMovement('indep_choice_3').GetName]"
 nesnd_india_indep_target_3:0 "[SCOPE.sCountry('indep_subject_3').GetName]"
 nesnd_india_indep.1.t:0 "Which Movement to Fund"
 nesnd_india_indep.1.d:0 "Several political movements in [SCOPE.sCountry('indep_lord').GetName] are pressing its government. Funding one of them would keep the overlord's government occupied with its own affairs. But money passed in secret leaves a trail, and if the overlord uncovers it, relations between us will worsen at once."
 nesnd_india_indep.1.f:0 "'The sum was handed over through a third party, and the recipient does not know its source.'\n— Report of our agent"
 nesnd_india_indep.2.t:0 "Uncovered"
 nesnd_india_indep.2.d_arms:0 "Our agents have found that [SCOPE.sCountry('indep_actor').GetName] has laid up a store of arms in its warehouses."
 nesnd_india_indep.2.d_funding:0 "Our agents have found that [SCOPE.sCountry('indep_actor').GetName] is secretly funding [SCOPE.sPoliticalMovement('indep_movement').GetName]."
 nesnd_india_indep.2.d_gone:0 "Our agents have found that [SCOPE.sCountry('indep_actor').GetName] was secretly funding a political movement in our country, one that has since dissolved."
 nesnd_india_indep.2.f:0 "'The evidence is conclusive. Instructions are requested.'\n— Report of our agent"
 nesnd_india_indep.2.a:0 "Pursue It"
 nesnd_india_indep.2.b:0 "File It Away"
 nesnd_india_indep.3.t:0 "Found Out"
 nesnd_india_indep.3.d:0 "Our overlord has uncovered our secret dealings and pursued the matter to the end."
 nesnd_india_indep.3.f:0 "'The conduct of your government is a grave breach of the subject treaty.'\n— Note from our overlord"
 nesnd_india_indep.3.result:0 "The funds are cut off or a store of arms is seized. [concept_relations] with our overlord #r -30#!."
 nesnd_india_indep.4.t:0 "No Harm Done"
 nesnd_india_indep.4.d:0 "Our overlord has noticed our secret dealings, but has only placed the matter on file."
 nesnd_india_indep.4.f:0 "'Filed for reference.'\n— Minute of our overlord's office"
 nesnd_india_indep.4.result:0 "We lose nothing this time."
 nesnd_india_indep.5.t:0 "Choosing the Subject"
 nesnd_india_indep.5.d_conciliate:0 "The loyalists in several of our subjects need money. We can only strengthen one of them first."
 nesnd_india_indep.5.d_coerce:0 "Several of our subjects are seeking independence. Which shall we put pressure on first?"
 nesnd_india_indep.5.f:0 "'Please select one of the following subjects for action.'\n— Memorandum of the imperial government"
 nesnd_india_indep.6.t:0 "The Overlord's Favour"
 nesnd_india_indep.6.d:0 "Our overlord has paid to strengthen the loyalists in our country."
 nesnd_india_indep.6.f:0 "'Loyalty will have its reward.'\n— Address of the overlord's envoy"
 nesnd_india_indep.6.result:0 "Our $lobby_pro_overlord$ has our overlord's backing."
 nesnd_india_indep.7.t:0 "The Overlord's Pressure"
 nesnd_india_indep.7.d:0 "Our overlord has put pressure on us. Our stores of arms have been seized, and our preparations for independence have come to nothing."
 nesnd_india_indep.7.f:0 "'Any further breach of the treaty will be at your own peril.'\n— Note from our overlord"
 nesnd_india_indep.7.result:0 "$nesnd_india_indep_economy_bar$ and $nesnd_india_indep_military_bar$ each -50, all stores of arms are seized, and [concept_relations] with our overlord -30."
 nesnd_india_indep_support_regime_terms:0 "We sign a $da_support_regime$ pact with it."
 nesnd_india_indep.5.d_support_regime:0 "The governments of several of our subjects are tottering. Which shall we prop up first?"
 nesnd_india_indep.10.t:0 "The Overlord's Support"
 nesnd_india_indep.10.d:0 "Our overlord has signed a $da_support_regime$ pact with our government, ready to step in should it falter."
 nesnd_india_indep.10.f:0 "'The stability of your government is a concern of ours.'\n— Note from our overlord"
 nesnd_india_indep.10.result:0 "Our overlord signs a $da_support_regime$ pact with us."
 nesnd_india_indep.11.t:0 "The Means of Conciliation"
 nesnd_india_indep.11.d:0 "A wavering subject need not be met with the sword. We can pay the loyalists there to speak for us in its councils, or make a pact with its government to hold it up when it falters."
 nesnd_india_indep.11.f:0 "'With restless subjects, it is advisable first to fund the loyalists there or to sign an agreement supporting their government, rather than to apply pressure at once.'\n— Memorandum of the imperial government"
 nesnd_india_indep.11.a:0 "Strengthen the Loyalists"
 nesnd_india_indep.11.b:0 "Prop Up Its Government"
 nesnd_mug_france_reason:0 "$nesnd_mug_france_intro$"
 nesnd_mug_france_status_sell_asked:0 "Sale of the factory in [JournalEntry.GetCountry.MakeScope.Var('nesnd_mug_deal_state').GetState.GetName]: awaiting the overlord's answer"
 nesnd_mug_france_status_buyback_asked:0 "Buyback of the factory in [JournalEntry.GetCountry.MakeScope.Var('nesnd_mug_deal_state').GetState.GetName]: awaiting the overlord's answer"
 nesnd_mug_sell_button:0 "Sell a Factory"
 nesnd_mug_sell_button_desc:0 "Sell one level of a factory wholly owned by our government to the overlord's government, at a price based on its construction cost. The smallest such factory goes first."
 nesnd_mug_buyback_button:0 "Buy Back a Factory"
 nesnd_mug_buyback_button_desc:0 "Buy back from our overlord one level of a factory its government wholly owns in our country, at a price six-tenths higher than a sale. The smallest such factory goes first."
 nesnd_mug_ask_sell_tt:0 "Offer the sale to our overlord. If it agrees, the level belongs to the overlord's government."
 nesnd_mug_ask_buyback_tt:0 "Offer to buy it back from our overlord. If it agrees, the level returns to us."
 nesnd_mug_sale_site_tt:0 "We have a factory wholly owned by our government that can be sold"
 nesnd_mug_buyback_site_tt:0 "Our overlord's government wholly owns a factory in our country"
 nesnd_mug_can_pay_buyback_tt:0 "Our [concept_gold_reserves] can cover the price of the buyback"
 nesnd_mug_we_can_buy_tt:0 "Our [concept_gold_reserves] can cover the price, and we are not in [concept_default]"
 nesnd_mug_they_can_pay_tt:0 "[SCOPE.sCountry('india_sender').GetName] can pay the price of the buyback"
 nesnd_mug_accept_sell_tt:0 "We take one level of the factory of [SCOPE.sCountry('india_sender').GetName] in [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_mug_deal_state').GetState.GetName]."
