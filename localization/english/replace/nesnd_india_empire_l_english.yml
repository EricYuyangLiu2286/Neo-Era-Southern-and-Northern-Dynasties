 nesnd_india_order_school_local_button:0 "Local Schooling"
 nesnd_india_order_void_conclusion:0 "We no longer have [Concept('concept_subject', '$concept_subjects|q$')] with populated states in $region_north_india$ or $region_south_india$, or no longer meet the conditions of The Centre and the States, and these arrangements are withdrawn."
 nesnd_india_order_closure_tt:0 "We no longer hold populated [Concept('concept_state', '$concept_states|q$')] in $region_north_india$ or $region_south_india$, or no longer have [Concept('concept_subject', '$concept_subjects|q$')] with populated states there"
 nesnd_mug_france:0 "The Old Agreement with Our Overlord"
 nesnd_mug_france_reason:0 "$nesnd_mug_france_intro$"
 nesnd_mug_france_reason_loan_script:0 "$nesnd_mug_france_intro$\n\nWe have borrowed @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0] from [ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName]. No repayment [concept_treaty] could be concluded, so we pay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_monthly')|0] directly each month, @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years, due on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_mug_loan_term'))]. The guarantee: if we fall into [concept_default] or declare [concept_bankruptcy] before then, we are in breach. The unpaid remainder is not pursued, and we grant [ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName] a [concept_trade_privilege] for ten years instead. We cannot borrow again until this loan is repaid. The price of redeeming our subject status is @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0]."
 nesnd_mug_france_reason_loan:0 "$nesnd_mug_france_intro$\n\nWe have borrowed @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0] from [ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName] and repay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_weekly')|0] each week under the repayment [concept_treaty], about @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years, due on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_mug_loan_term'))]. The guarantee: if we fall into [concept_default] or declare [concept_bankruptcy] before then, we are in breach. We leave the repayment treaty, the unpaid remainder is not pursued, and we grant [ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName] a [concept_trade_privilege] for ten years instead. We cannot borrow again until this loan is repaid. The price of redeeming our subject status is @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0]."
 nesnd_mug_france_reason_loan_due:0 "$nesnd_mug_france_intro$\n\nOur loan from [ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName] has reached its term and will shortly be settled, which lifts its guarantee."
 nesnd_mug_france_reason_none:0 "$nesnd_mug_france_intro$\n\nWe have no loan at present. $nesnd_mug_france_terms$"
 nesnd_mug_france_status_loan_asked:0 "Our request for a loan awaits the answer of [ROOT.GetCountry.GetOverlord.GetName]."
 nesnd_mug_france_status_redeem_asked:0 "Our request to redeem our subject status awaits the answer of [ROOT.GetCountry.GetOverlord.GetName]."
 nesnd_mug_loan_button:0 "Request a Loan"
 nesnd_mug_redeem_button:0 "Redeem Our Subject Status"
 nesnd_mug_france_void_conclusion:0 "We are no longer a subject, or the capital of our overlord now lies in $region_north_india$ or $region_south_india$, and the old agreement ends with it. Any loan not yet repaid is still repaid as agreed."
 nesnd_mug_france_closure_tt:0 "We are no longer a subject, or the capital of our overlord lies in $region_north_india$ or $region_south_india$"
 nesnd_mug_council:0 "The Council of Princes"
 nesnd_mug_council_reason:0 "$nesnd_mug_council_intro$"
 nesnd_mug_council_reason_sitting:0 "$nesnd_mug_council_intro$\n\nThe council awaits the answers of the invited states and will be settled thirty days after it was called."
 nesnd_mug_council_reason_rest:0 "$nesnd_mug_council_intro$\n\nNo council can be called before [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_mug_council_wait'))]."
 nesnd_mug_council_reason_ready:0 "$nesnd_mug_council_intro$"
 nesnd_mug_council_button:0 "Call a Council of Princes"
 nesnd_mug_council_void_conclusion:0 "We can no longer call a council of princes."
 nesnd_mug_council_closure_tt:0 "We can no longer call a council of princes"
 nesnd_india_order_tax_desc:0 "Decide how much of their income our [Concept('concept_subject', '$concept_subjects|q$')] pay to us."
 nesnd_india_order_tax_central_tt:0 "The [concept_tax_capacity] of our own states rises by 5%. With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $raise_payments$: it pays us more of its income, its weekly [concept_liberty_desire] goes up, and each pact takes 25 of our [concept_influence]. A [concept_protectorate], a [concept_personal_union], a subject that pays us no part of its income, or a subject in [concept_default] or with [concept_liberty_desire] of 75 or more cannot sign it and gets nothing."
 nesnd_india_order_switch_tt:0 "Every [concept_diplomatic_pact] and modifier that The Centre and the States set up for the earlier choice in this matter is removed first. A pact that cannot be removed at once is removed again each month, and until it is gone no new pact is signed with that subject. The choice cannot be changed again for 60 months. Subjects that join later receive it at the next monthly update."
 nesnd_india_order_tax_local_tt:0 "With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $decrease_payments$: it pays us less of its income, and its weekly [concept_liberty_desire] goes down. A [concept_protectorate], a [concept_personal_union] or a subject that pays us no part of its income cannot sign it and gets nothing. Our own country gains no modifier."
 nesnd_india_order_army_desc:0 "Decide whether our [Concept('concept_subject', '$concept_subjects|q$')] follow us into [Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')] and wars."
 nesnd_india_order_army_central_tt:0 "Our [concept_authority] +10 for each [concept_subject]. The weekly [concept_liberty_desire] of each [concept_subject] of ours in $region_north_india$ or $region_south_india$ goes up. No subject changes its type."
 nesnd_india_order_army_local_tt:0 "With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $exempt_from_service$: it need not follow us into [Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')] and wars, and its weekly [concept_liberty_desire] goes down. A [concept_tributary] or a [concept_protectorate] never joins its overlord's wars, cannot sign it and gets nothing. Our own country gains no modifier."
 nesnd_india_order_school_desc:0 "Decide who sets the standards for schools and offices."
 nesnd_india_order_school_central_tt:0 "The [concept_pop_qualifications] of our own states +5%. With each [concept_subject] of ours in $region_north_india$ or $region_south_india$ we sign the [concept_diplomatic_pact] $da_knowledge_sharing$: our [concept_technology_spread] slows and theirs quickens, their weekly [concept_liberty_desire] goes down, and each pact takes 50 of our [concept_influence]. Where we have not researched more technologies than they have, it cannot be signed and they get nothing."
 nesnd_india_order_school_local_tt:0 "The [concept_pop_qualifications] of each [concept_subject] of ours in $region_north_india$ or $region_south_india$ +5%, and its weekly [concept_liberty_desire] goes down. Our own country gains no modifier."
 nesnd_mug_loan_button_desc:0 "Borrow money from our [concept_overlord] and repay it with interest within five years."
 nesnd_mug_ask_loan_tt:0 "Ask [ROOT.GetCountry.GetOverlord.GetName] for a loan of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0]. If it agrees, the sum is paid to us at once and the two countries sign a repayment [concept_treaty]. We repay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_weekly')|0] each week, about @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years. The [concept_influence] upkeep of the repayment treaty, @inf!#v [GetArticleType('money_transfer').GetCost|0]#!, is borne by the lender. If the treaty cannot be concluded, we instead repay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_monthly')|0] directly each month, @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years."
 nesnd_mug_guarantee_tt:0 "Guarantee: if we fall into [concept_default] or declare [concept_bankruptcy] while repaying, we are in breach. We then leave the repayment [concept_treaty], and the unpaid remainder is not pursued. If we have a [concept_market] of our own, we grant the lender a [concept_trade_privilege] with a [concept_binding_period] of ten years, and its [concept_influence] upkeep of @inf!#v [GetArticleType('trade_privilege').GetCost|0]#! is borne by the lender. Without a market of our own this treaty cannot be signed, and our [concept_relations] with the lender will fall as a result."
 nesnd_mug_redeem_button_desc:0 "Pay a sum and ask our [concept_overlord] to end our subject relationship."
 nesnd_mug_ask_redeem_tt:0 "Ask [ROOT.GetCountry.GetOverlord.GetName] to let us redeem our subject status for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0]. If it agrees, we pay and become independent. The buildings [ROOT.GetCountry.GetOverlord.GetName] owns in our country stay its own, and any loan already taken is still repaid."
 nesnd_mug_council_button_desc:0 "Invite the princes to agree on a matter of common concern."
 nesnd_mug_call_council_tt:0 "Once the topic is chosen, up to eight princely states with the best [concept_relations] with us are invited. The council is settled after thirty days, and the next cannot be called for ten years."
 nesnd_india_order_tax_central:0 "Central Taxation"
 nesnd_india_order_tax_central_desc:0 "Taxation is with the centre in The Centre and the States."
 nesnd_india_order_army_central:0 "Central Command"
 nesnd_india_order_army_central_desc:0 "The army and foreign affairs are with the centre in The Centre and the States."
 nesnd_india_order_school_central:0 "Central Schooling"
 nesnd_india_order_school_central_desc:0 "Schools and offices are with the centre in The Centre and the States."
 nesnd_india_order_army_subject:0 "Command by the Overlord"
 nesnd_india_order_army_subject_desc:0 "Our overlord has taken the army and foreign affairs to the centre in The Centre and the States."
 nesnd_india_order_school_subject:0 "Schooling Kept at Home"
 nesnd_india_order_school_subject_desc:0 "Our overlord has left schools and offices to the states in The Centre and the States."
 nesnd_mug_accept_loan_tt:0 "We lend [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0] at once. The two countries sign a repayment [concept_treaty], and [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] repays @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_weekly')|0] each week, about @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years. The [concept_influence] upkeep of this treaty, @inf!#v [GetArticleType('money_transfer').GetCost|0]#!, is borne by us. If the treaty cannot be concluded, [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] instead repays @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_monthly')|0] directly each month. If it falls into [concept_default] or declares [concept_bankruptcy] while repaying, it leaves the repayment treaty, the unpaid remainder is not pursued, and it grants us a [concept_trade_privilege] for ten years instead, whose upkeep of @inf!#v [GetArticleType('trade_privilege').GetCost|0]#! is also borne by us."
 nesnd_mug_accept_redeem_tt:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us the sum and becomes independent at once. The buildings we own there stay ours."
 nesnd_mug_accept_aid_tt:0 "We pay for relief in the stricken states of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]. For twelve months those states suffer less from [concept_harvest_condition], and our [concept_relations] improve by #g +25#!."
 nesnd_mug_council_rail:0 "Council of Princes: Railways"
 nesnd_mug_council_rail_desc:0 "The council of princes agreed to build railways together."
 nesnd_mug_council_relief:0 "Council of Princes: Famine Relief"
 nesnd_mug_council_relief_desc:0 "The council of princes agreed on common famine relief."
 nesnd_mug_famine_relief:0 "Famine Relief"
 nesnd_mug_famine_relief_desc:0 "The government has paid for relief in this state."
 nesnd_india_order_has_subject_tt:0 "At least one [concept_subject] of ours holds populated states in $region_north_india$ or $region_south_india$"
 nesnd_india_order_already_tt:0 "This matter is not already settled this way"
 nesnd_mug_no_loan_tt:0 "We have no loan still being repaid"
 nesnd_mug_not_in_default_tt:0 "We are not in [concept_default] and have not declared [concept_bankruptcy]"
 nesnd_mug_can_pay_redeem_tt:0 "Our [concept_gold_reserves] are at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0]"
 nesnd_mug_can_relieve_tt:0 "Our [concept_gold_reserves] cover the @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|0] that relief costs, and we are not in [concept_default]"
 nesnd_mug_matter_free_tt:0 "No other negotiation of ours awaits an answer"
 nesnd_mug_mughal_at_peace_tt:0 "[SCOPE.sCountry('mug_famine_mughal').GetName] still exists and is not at war with us"
 nesnd_mug_overlord_at_peace_tt:0 "Our [concept_overlord] is not at war with us"
 nesnd_mug_council_rested_tt:0 "Ten years have passed since the last council of princes"
 nesnd_mug_council_not_sitting_tt:0 "No council of princes is awaiting answers"
 nesnd_mug_council_has_guests_tt:0 "At least one princely state not at war can be invited"
 nesnd_mug_we_can_lend_tt:0 "Our [concept_gold_reserves] are at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0], and we are not in [concept_default]"
 nesnd_mug_they_can_redeem_tt:0 "The [concept_gold_reserves] of [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] are still at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0]"
 nesnd_mug_we_can_aid_tt:0 "Our [concept_gold_reserves] are at least @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0], and we are not in [concept_default]"
 nesnd_mug.1.t:0 "The Answer of [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_mug.1.d_redeem:0 "[SCOPE.sCountry('india_matter_to').GetName] has accepted the redemption money and given up its rights as overlord of [ROOT.GetCountry.GetName]. From today we are an independent country."
 nesnd_mug.1.d_loan_script:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to the loan, and the money has been paid into our [concept_treasury]. No repayment [concept_treaty] could be concluded, so we repay by direct monthly payments instead. The guarantee of the loan is unchanged."
 nesnd_mug.1.d_loan:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to the loan, and the money has been paid into our [concept_treasury]. The two countries have signed a repayment [concept_treaty], and the guarantee of the loan now applies."
 nesnd_mug.1.f:0 "“The Government agrees to the request of your Government. The sums concerned will be paid forthwith.”\n—Note from the Government of [SCOPE.sCountry('india_matter_to').GetName] to the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug_redeemed_tt:0 "We have paid @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0] and are now independent. The buildings [SCOPE.sCountry('india_matter_to').GetName] owns in our country remain its own, and any loan not yet repaid is still repaid."
 nesnd_mug_loan_signed_tt:0 "The loan of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0] has arrived. We repay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_weekly')|0] each week, about @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years. If we fall into [concept_default] or declare [concept_bankruptcy] while repaying, we must grant [SCOPE.sCountry('india_matter_to').GetName] a [concept_trade_privilege] for ten years."
 nesnd_mug_loan_signed_script_tt:0 "The loan of @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0] has arrived. We repay @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_monthly')|0] directly each month, @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0] over five years. If we fall into [concept_default] or declare [concept_bankruptcy] while repaying, we must grant [SCOPE.sCountry('india_matter_to').GetName] a [concept_trade_privilege] for ten years."
 nesnd_mug.2.t:0 "Request Not Granted"
 nesnd_mug.2.d_redeem_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] will not let us redeem our subject status, and we remain its [ROOT.GetCountry.GetSubjectType.GetName]."
 nesnd_mug.2.d_loan_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request for a loan, and the old agreement stands as it was."
 nesnd_mug.2.d_silent:0 "[SCOPE.sCountry('india_matter_to').GetName] has not answered within thirty days, and our request lapses."
 nesnd_mug.2.d_void:0 "Circumstances have changed, and our request can no longer be pursued."
 nesnd_mug.2.f:0 "“These negotiations are suspended.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug_unchanged_tt:0 "Neither our subject relationship nor our loans have changed. We may not open another negotiation until six months after the request was made."
 nesnd_mug.3.t:0 "Default on the Loan"
 nesnd_mug.3.d_debtor_trade:0 "We have fallen into [concept_default] or declared [concept_bankruptcy] while repaying the loan, and under its guarantee we are in breach. We have left the repayment [concept_treaty], and [SCOPE.sCountry('mug_loan_creditor').GetName] will not pursue the unpaid remainder. In its place we grant [SCOPE.sCountry('mug_loan_creditor').GetName] a [concept_trade_privilege]."
 nesnd_mug.3.d_debtor_relations:0 "We have fallen into [concept_default] or declared [concept_bankruptcy] while repaying the loan, and under its guarantee we are in breach. We have left the repayment [concept_treaty], and [SCOPE.sCountry('mug_loan_creditor').GetName] will not pursue the unpaid remainder. No treaty granting it a [concept_trade_privilege] could be concluded, and its [concept_relations] with us have suffered."
 nesnd_mug.3.d_creditor_trade:0 "[SCOPE.sCountry('mug_loan_debtor').GetName] has fallen into [concept_default] or declared [concept_bankruptcy] while repaying our loan, and under its guarantee it is in breach. It has left the repayment [concept_treaty], and the unpaid remainder is not pursued. In its place [SCOPE.sCountry('mug_loan_debtor').GetName] grants us a [concept_trade_privilege]."
 nesnd_mug.3.d_creditor_relations:0 "[SCOPE.sCountry('mug_loan_debtor').GetName] has fallen into [concept_default] or declared [concept_bankruptcy] while repaying our loan, and under its guarantee it is in breach. It has left the repayment [concept_treaty], and the unpaid remainder is not pursued. No treaty granting us a [concept_trade_privilege] could be concluded, and our [concept_relations] with [SCOPE.sCountry('mug_loan_debtor').GetName] have suffered."
 nesnd_mug.3.f:0 "“Should the borrower fall into default during repayment, it shall grant the lender a trade privilege for ten years by way of compensation.”\n—Guarantee clause of the loan agreement between [SCOPE.sCountry('mug_loan_debtor').GetName] and [SCOPE.sCountry('mug_loan_creditor').GetName]"
 nesnd_mug_default_trade_tt:0 "The repayment treaty has been left. [SCOPE.sCountry('mug_loan_debtor').GetName] grants [SCOPE.sCountry('mug_loan_creditor').GetName] a [concept_trade_privilege] with a [concept_binding_period] of ten years."
 nesnd_mug_default_relations_tt:0 "The repayment treaty has been left. [concept_relations] between [SCOPE.sCountry('mug_loan_debtor').GetName] and [SCOPE.sCountry('mug_loan_creditor').GetName]: #r −50#!."
 nesnd_mug.4.t:0 "The Loan Repaid"
 nesnd_mug.4.d_debtor:0 "Five years have passed and we have repaid our loan from [SCOPE.sCountry('mug_loan_creditor').GetName]. The guarantee of the loan is lifted, and we may borrow again."
 nesnd_mug.4.d_creditor:0 "Five years have passed and [SCOPE.sCountry('mug_loan_debtor').GetName] has repaid its loan from us."
 nesnd_mug.4.f:0 "“Principal and interest have been paid in full, and the loan agreement is hereby discharged.”\n—Receipt issued by the Ministry of Finance of [SCOPE.sCountry('mug_loan_creditor').GetName]"
 nesnd_mug_repaid_tt:0 "[concept_relations] between [SCOPE.sCountry('mug_loan_debtor').GetName] and [SCOPE.sCountry('mug_loan_creditor').GetName]: #g +20#!."
 nesnd_mug.5.t:0 "The Repayment Treaty Ends"
 nesnd_mug.5.d:0 "Our repayment [concept_treaty] with [SCOPE.sCountry('mug_loan_creditor').GetName] has ended before its term. The record of the loan is cleared, and what remains of the loan lapses with the treaty, together with its guarantee."
 nesnd_mug.5.d_creditor:0 "The repayment [concept_treaty] between [SCOPE.sCountry('mug_loan_debtor').GetName] and us has ended before its term. The record of the loan is cleared, the remainder will not be repaid, and the guarantee of the loan lapses with the treaty."
 nesnd_mug.5.d_gone:0 "The country that lent us the money no longer exists. The record of the loan is cleared, the remainder will not be repaid, and the guarantee of the loan lapses with it."
 nesnd_mug.5.f:0 "“The said treaty is no longer in force.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug_lost_tt:0 "The record of the loan is cleared, and we may borrow again."
 nesnd_mug_lost_creditor_tt:0 "The remainder of the loan will not be repaid."
 nesnd_mug.11.t:0 "Calling the Council of Princes"
 nesnd_mug.11.d:0 "Our government is ready to summon the princes to a council. A council deals with one matter only: building railways, famine relief, or common defence."
 nesnd_mug.11.f:0 "“The council shall deal only with matters of common concern to the states, and not with the internal affairs of any state.”\n—Circular of the Government of [ROOT.GetCountry.GetName] to the princely states"
 nesnd_mug.11.a:0 "Railways"
 nesnd_mug_council_rail_tt:0 "The topic is railways. The states that attend and we each receive “$nesnd_mug_council_rail$” for ten years: [concept_infrastructure] #g +2#!, State Construction Efficiency #g +5%#!."
 nesnd_mug_council_invite_tt:0 "The council is settled after thirty days, and dissolves if no one attends. The next cannot be called for ten years."
 nesnd_mug.11.b:0 "Famine relief"
 nesnd_mug_council_relief_tt:0 "The topic is famine relief. The states that attend and we each receive “$nesnd_mug_council_relief$” for ten years: impact of [GetHarvestConditionType('drought').GetName] and [GetHarvestConditionType('flood').GetName] #g −20%#!."
 nesnd_mug.11.c:0 "Common defence"
 nesnd_mug_council_defence_tt:0 "The topic is common defence. Only princely states that could sign a [concept_defensive_pact] with us today are invited. Our own [Concept('concept_subject', '$concept_subjects|q$')] and states that the treaty's own terms rule out are not. We sign a [concept_defensive_pact] with each state that attends, with a [concept_binding_period] of five years. Each such treaty has an [concept_influence] upkeep of @inf!#v [GetArticleType('defensive_pact').GetCost|0]#! for each side, and with the states that can be invited today ours comes to at most #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_defence_influence')|0]#!. Any treaty that still cannot be concluded at the settlement is counted in the report."
 nesnd_mug_council_defence_guests_tt:0 "At least one princely state could sign a [concept_defensive_pact] with us today"
 nesnd_mug.11.e:0 "Not now"
 nesnd_mug_council_later_tt:0 "No council is called this time. One may be called at any time."
 nesnd_mug.12.t:0 "An Invitation to the Council of Princes"
 nesnd_mug.12.d_rail:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to a council of princes on building railways together. The states that attend share the agreement of the council with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]. Those that stay away are not bound by it."
 nesnd_mug.12.d_relief:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to a council of princes on famine relief in common. The states that attend share the agreement of the council with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]. Those that stay away are not bound by it."
 nesnd_mug.12.d_defence:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] invites us to a council of princes on common defence. The states that attend share the agreement of the council with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]. Those that stay away are not bound by it."
 nesnd_mug.12.f:0 "“The Government invites your state to send a representative to a council on matters of common concern to the states.”\n—Letter of invitation from the Government of [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName] to the princely states"
 nesnd_mug.12.a:0 "Attend"
 nesnd_mug_attend_rail_tt:0 "We attend. When the council is settled we receive “$nesnd_mug_council_rail$” for ten years: [concept_infrastructure] #g +2#!, State Construction Efficiency #g +5%#!."
 nesnd_mug_attend_relief_tt:0 "We attend. When the council is settled we receive “$nesnd_mug_council_relief$” for ten years: impact of [GetHarvestConditionType('drought').GetName] and [GetHarvestConditionType('flood').GetName] #g −20%#!."
 nesnd_mug_attend_defence_tt:0 "We attend. When the council is settled we sign a [concept_defensive_pact] with [ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName], with a [concept_binding_period] of five years. The treaty has an [concept_influence] upkeep of @inf!#v [GetArticleType('defensive_pact').GetCost|0]#! for each side. If the treaty cannot be concluded, this part falls away."
 nesnd_mug.12.b:0 "Decline"
 nesnd_mug_decline_council_tt:0 "We stay away, receive no modifier and sign no treaty."
 nesnd_mug.13.t:0 "The Outcome of the Council of Princes"
 nesnd_mug.13.d_none:0 "None of the invited states attended, and the council has dissolved."
 nesnd_mug.13.d_rail:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! princely states attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. The council agreed to build railways together, and we and each state that attended receive “$nesnd_mug_council_rail$”."
 nesnd_mug.13.d_relief:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! princely states attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. The council agreed on common famine relief, and we and each state that attended receive “$nesnd_mug_council_relief$”."
 nesnd_mug.13.d_defence_unsigned:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! princely states attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. We signed a [concept_defensive_pact] with the states that attended, but #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_unsigned_value')|0]#! of these could not be concluded."
 nesnd_mug.13.d_defence:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! princely states attended, and #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! declined or did not answer. We have signed a [concept_defensive_pact] with each state that attended."
 nesnd_mug.13.f:0 "“The council of princes is closed.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug_council_none_tt:0 "No modifier and no treaty."
 nesnd_mug_council_done_tt:0 "The agreements of the council are in force."
 nesnd_mug.21.t:0 "Stricken Fields"
 nesnd_mug.21.d:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! of our states are struck by a [concept_harvest_condition], and their farms yield less. Our government can pay for relief."
 nesnd_mug.21.f:0 "“The farms of this state yield less this year. We pray that relief be sent without delay.”\n—Reports of distress from the stricken states to the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug.21.a:0 "Pay for relief"
 nesnd_mug_relief_tt:0 "Each of the #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! stricken states receives “$nesnd_mug_famine_relief$” for twelve months: impact of [GetHarvestConditionType('drought').GetName], [GetHarvestConditionType('flood').GetName], [GetHarvestConditionType('wildfire').GetName], [GetHarvestConditionType('heatwave').GetName], [GetHarvestConditionType('extreme_winds').GetName] and [GetHarvestConditionType('disease_outbreak').GetName] #g −20%#!, Food Security #g +5%#!."
 nesnd_mug.21.b:0 "Give no relief"
 nesnd_mug_no_relief_tt:0 "Our government pays nothing, and the stricken states receive no modifier. No such report will come again for twenty-four months."
 nesnd_mug.22.t:0 "Stricken Fields"
 nesnd_mug.22.d:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! of our states are struck by a [concept_harvest_condition], and their farms yield less. We can pay for relief ourselves or ask [SCOPE.sCountry('mug_famine_mughal').GetName] for help. If we are subject to another country, we can also ask our [concept_overlord]."
 nesnd_mug.22.d_alone:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! of our states are struck by a [concept_harvest_condition], and their farms yield less. We can pay for relief ourselves. If we are subject to another country, we can also ask our [concept_overlord]."
 nesnd_mug.22.f:0 "“The farms of this state yield less this year. We pray that relief be sent without delay.”\n—Reports of distress from the stricken states to the Government of [ROOT.GetCountry.GetName]"
 nesnd_mug.22.a:0 "Pay for relief ourselves"
 nesnd_mug.22.b:0 "Ask [SCOPE.sCountry('mug_famine_mughal').GetName] for help"
 nesnd_mug_ask_mughal_tt:0 "We ask [SCOPE.sCountry('mug_famine_mughal').GetName] for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|0]. If it agrees, each stricken state receives “$nesnd_mug_famine_relief$” for twelve months and our [concept_relations] improve by #g +25#!."
 nesnd_mug_aid_wait_tt:0 "The other government has thirty days to answer. If it refuses or does not answer, we can still pay for relief ourselves."
 nesnd_mug.22.c:0 "Ask our [concept_overlord] for help"
 nesnd_mug_ask_overlord_tt:0 "We ask [ROOT.GetCountry.GetOverlord.GetName] for @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|0]. If it agrees, each stricken state receives “$nesnd_mug_famine_relief$” for twelve months and our [concept_relations] improve by #g +25#!. Our subject relationship and [concept_liberty_desire] do not change."
 nesnd_mug.22.e:0 "Give no relief"
 nesnd_mug.23.t:0 "Relief Money Arrives"
 nesnd_mug.23.d_mughal:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to help and paid for relief in our stricken states. Those states suffer less, and our [concept_relations] have improved."
 nesnd_mug.23.d_overlord:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to help and paid for relief in our stricken states. Those states suffer less, and our [concept_relations] have improved. Our subject relationship does not change."
 nesnd_mug.23.f:0 "“The relief money has been paid out.”\n—Notice of the Government of [SCOPE.sCountry('india_matter_to').GetName]"
 nesnd_mug_aid_given_tt:0 "Each stricken state receives “$nesnd_mug_famine_relief$” for twelve months, and our [concept_relations] improve by #g +25#!."
 nesnd_mug.24.t:0 "No Help Comes"
 nesnd_mug.24.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has withheld its consent as [concept_overlord], and our request for help was never sent. We can still pay for relief in the stricken states ourselves."
 nesnd_mug.24.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request for help. We can still pay for relief in the stricken states ourselves."
 nesnd_mug.24.d_silent:0 "[SCOPE.sCountry('india_matter_to').GetName] has not answered within thirty days. We can still pay for relief in the stricken states ourselves."
 nesnd_mug.24.d_queued:0 "[SCOPE.sCountry('india_matter_to').GetName] has been taken up with other negotiations, and our plea for aid never reached it, so we have let it drop. We may still relieve the struck states from our own treasury."
 nesnd_mug.24.d_void:0 "Circumstances have changed, and our request for help can no longer be pursued. We can still pay for relief in the states that remain stricken."
 nesnd_mug.24.f:0 "“The request for help is suspended.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
