 nesnd_mug_council_no_free_prince_tt:0 "India has no independent princely state left, and none that belongs to another country"
 nesnd_mug_council_complete_conclusion:0 "Every princely state now existing in India has become a subject of the empire."
 nesnd_mug.14.t:0 "A Standing Council"
 nesnd_mug.14.d:0 "Railways, famine relief and defence have each now been settled by the Council of Princes. The Council has henceforth a constitution of its own and meets once in ten years, and no longer depends on an occasional summons."
 nesnd_mug.14.f:0 "'The council shall be convened once every ten years, and the princes of all the states may attend.'\n— Rules of the Council of Princes"
 nesnd_mug.14.a:0 "Make It Permanent"
