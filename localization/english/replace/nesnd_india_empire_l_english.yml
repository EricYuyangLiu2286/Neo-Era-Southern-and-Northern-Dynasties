 # Old treaty dispute (India batch 15)
 nesnd_india_treaty_dispute:0 "Dispute Over the Old Treaty"
 nesnd_india_treaty_dispute_reason:0 "[GetGlobalVariable('nesnd_india_dispute_g_lord').GetCountry.GetName] has consented to reopen the old treaty between the two countries. Under that treaty [ROOT.GetCountry.GetName] is the subject of that country and is bound by the obligations therein laid down. There are those in our government who press for its revision, while the officers of [GetGlobalVariable('nesnd_india_dispute_g_lord').GetCountry.GetName] require of us a fresh confirmation of its articles."
 nesnd_india_treaty_dispute_overlord_reason:0 "There are those in the government of [GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName] who press for the revision of the old treaty concluded with us, and we have decided to reopen it with that country. It remains our subject, and the articles of the treaty are still in force. Our object is to obtain from it a fresh confirmation of the treaty."
 nesnd_india_treaty_dispute_bar:0 "Negotiations on the Old Treaty"
 nesnd_india_treaty_dispute_bar_void_desc:0 "Repudiation"
 nesnd_india_treaty_dispute_bar_renew_desc:0 "Renewal"
 nesnd_india_dispute_rel_good_prog:0 "Good relations between the two countries"
 nesnd_india_dispute_rel_bad_prog:0 "Poor relations between the two countries"
 nesnd_india_dispute_can_pay_tt:0 "Our [concept_gold_reserves] suffice to meet this payment, and we are not in [concept_default] or [concept_bankruptcy]"
 nesnd_india_dispute_petition_button:0 "Send Envoys to Petition"
 nesnd_india_dispute_petition_button_desc:0 "Send an envoy to lay our circumstances before the overlord, and ask that the difference be settled within the terms of the old treaty."
 nesnd_india_dispute_petition_wait_tt:0 "We have not sent envoys in the last year"
 nesnd_india_dispute_petition_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ #v +10#! towards renewal. No further envoys for a year."
 nesnd_india_dispute_withhold_button:0 "Protest the Tribute"
 nesnd_india_dispute_withhold_button_desc:0 "Send the overlord a note protesting the tribute fixed by the old treaty."
 nesnd_india_dispute_withhold_wait_tt:0 "We have not protested the tribute in the last year"
 nesnd_india_dispute_withhold_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ moves #v 15#! towards repudiation, and the target [concept_fervor] of our [Concept('concept_primary_cultures','$concept_primary_culture$')] rises for five years. No further protest for a year."
 nesnd_india_dispute_reaffirm_button:0 "Reaffirm the Old Treaty"
 nesnd_india_dispute_reaffirm_button_desc:0 "Address a note to that government declaring that every article of the old treaty remains in force."
 nesnd_india_dispute_reaffirm_wait_tt:0 "We have not reaffirmed the treaty in the last year"
 nesnd_india_dispute_reaffirm_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ moves #v 10#! towards repudiation, and [concept_relations] with the other side #r -10#!. No further reaffirmation for a year."
 nesnd_india_dispute_concede_button:0 "Revise the Terms"
 nesnd_india_dispute_concede_button_desc:0 "Make a payment, and consent to the revision of certain articles of the old treaty."
 nesnd_india_dispute_concede_wait_tt:0 "We have not revised the terms in the last year"
 nesnd_india_dispute_concede_effect_tt:0 "$nesnd_india_treaty_dispute_bar$ #v +10#! towards renewal, and [concept_relations] with the other side #g +10#!. No further revision for a year."
 nesnd_india_dispute_renew_trigger_tt:0 "$nesnd_india_treaty_dispute_bar$ reaches the end of renewal"
 nesnd_india_dispute_void_trigger_tt:0 "$nesnd_india_treaty_dispute_bar$ reaches the end of repudiation"
 nesnd_india_dispute_renew_conclusion:0 "The two countries have renewed the old treaty."
 nesnd_india_dispute_void_conclusion:0 "The old treaty has been repudiated."
 nesnd_india_dispute_renew_wait_tt:0 "The old treaty will not be renegotiated for twenty years."
 nesnd_india_dispute_renew_involvement_tt:0 "The overlord turns its attention to any Indian strategic region where it holds no territory."
 nesnd_india_dispute_void_fervor_tt:0 "The target [concept_fervor] of the [Concept('concept_primary_cultures','$concept_primary_culture$')] of [GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName] rises for ten years."
 nesnd_india_dispute_void_indep_tt:0 "$nesnd_india_indep_economy_bar$ and $nesnd_india_indep_military_bar$ in '$nesnd_india_indep$' each #g +10#!."
 nesnd_india_dispute_void_claim_tt:0 "[GetGlobalVariable('nesnd_india_dispute_g_lord').GetCountry.GetName] lays a [concept_claim] on the capital state of [GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName]."
 nesnd_india_treaty_renewed:0 "The Old Treaty Renewed"
 nesnd_india_treaty_renewed_overlord:0 "The Old Treaty Renewed"
 nesnd_india_treaty_void:0 "The Old Treaty Repudiated"
 nesnd_mug.30.t:0 "A Quarrel Over the Old Treaty"
 nesnd_mug.30.d:0 "Our Resident reports that there are those in the government of [SCOPE.sCountry('mug_dispute_subject').GetName] who openly maintain that the old treaty concluded with us is no longer applicable to present circumstances. That country remains our subject, and no article of the treaty has been abrogated. If such opinions are allowed to spread unchecked, its government will sooner or later make a formal demand for revision."
 nesnd_mug.30.f:0 "'The change of circumstances which that Government alleges does not release it from its obligations under the Treaty.'\n— Instructions of the Foreign Ministry to the Resident"
 nesnd_mug.30.a:0 "Renegotiate the Treaty"
 nesnd_mug.30.a_tt:0 "'$nesnd_india_treaty_dispute$' opens."
 nesnd_mug.30.b:0 "Let It Rest"
 nesnd_mug.30.b_tt:0 "The matter will not be raised again for ten years."
 nesnd_mug.31.t:0 "The Old Treaty Renewed"
 nesnd_mug.31.d_subject:0 "We have renewed the old treaty with our overlord, and the representatives of the two countries have signed the instrument."
 nesnd_mug.31.d_overlord:0 "We have renewed the old treaty with our subject, whose government has confirmed afresh the articles of the treaty and its subordination to us."
 nesnd_mug.31.f:0 "'Both parties declare that the articles of the old treaty remain in force.'\n— Preamble to the new treaty"
 nesnd_mug.31.a:0 "Sign"
 nesnd_mug.31.a_subject_tt:0 "The old treaty will not be renegotiated for twenty years."
 nesnd_mug.31.a_overlord_tt:0 "The old treaty will not be renegotiated for twenty years."
 nesnd_mug.31_outcome_tt:0 "The two countries renew the old treaty."
 nesnd_mug.32.t:0 "The Old Treaty Repudiated"
 nesnd_mug.32.d_subject:0 "The negotiation has broken down, and we have declared ourselves no longer bound by the old treaty. Our overlord has thereupon laid claim to the state in which our capital stands. We remain its subject."
 nesnd_mug.32.d_overlord:0 "The negotiation has broken down, and that country has declared itself no longer bound by the old treaty. We have laid claim to the state in which its capital stands. It remains our subject."
 nesnd_mug.32.f:0 "'Our government recognises none of the articles of the old treaty.'\n— Note from the empire"
 nesnd_mug.32.a:0 "Noted"
 nesnd_mug.32.a_subject_tt:0 "The old treaty will not be renegotiated for ten years."
 nesnd_mug.32.a_overlord_tt:0 "The old treaty will not be renegotiated for ten years."
 nesnd_mug.32_outcome_tt:0 "The old treaty is repudiated."
