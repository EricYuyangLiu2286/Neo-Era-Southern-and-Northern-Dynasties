 nesnd_cne_confidence_journal:0 "The Imperial People’s Confidence"
 nesnd_cne_confidence_journal_reason:0 "The fires of the Great Revolution have faded, but its promises still guide clerks, junior officers, soldiers and peasants seeking release from old obligations. They see the land revolution as the continuation of an unfinished cause.\n\nAfter Mu Zhongtang became emperor, the Six Ministries administered the state, while founding commanders and senior ministers in the Senate monopolised legislative power. The Consultative Council gathers petitions and makes proposals whose fate rests with those who govern. Republican exiles in the south and northwest call Mu a traitor. Many supporters of reform still regard him and his companions as champions of enlightenment and progress. Imperial policy depends on the surviving enthusiasm of these officials, soldiers and farmers. Each new survey, change of occupation and reorganisation of the estates asks them to endure more."
 nesnd_cne_confidence_status:0 "The provinces still trust the court to fulfil the unfinished promise of the Great Revolution."
 nesnd_cne_republic_restored_name:0 "Han Commonwealth"
 nesnd_cne_republic_army:0 "Republican Salvation Army"
 nesnd_cne_republic_war:0 "War for the Han Commonwealth"
 nesnd_cne_republic_journal:0 "Rebuild the Han Commonwealth"
 nesnd_cne_republic_journal_reason:0 "Republican promises once united scholars, soldiers and villagers beneath one banner. The restoration of an imperial throne divided those comrades into rulers, subjects and exiles. Now the republicans have risen again to complete the unfinished revolution.\n\nThis war cannot end with a line on a map. The imperial throne still holds Yanjing and the Central Plains, and the provincial allies are still watching how the war goes. How many old comrades will still answer the republican banner?"
 nesnd_cne_republic_status:0 "While at war with the Empire, directly control at least #v 80%#! of its states to win. Both sides demand annexation.\nIf the war ends while the Empire still exists, the republican cause fails."
 nesnd_cne_confidence.1.t:0 "The Old Banners"
 nesnd_cne_confidence.1.d:0 "Republicans in the north have risen. Officers and provincial organisers have proclaimed the Han Republican Army, accusing the court of betraying the Great Revolution. The people who once sustained land reform are dividing against one another."
 nesnd_cne_confidence.1.a:0 "Gather the armies still loyal to the court."
 nesnd_cne_confidence.2.t:0 "For the Republic Again"
 nesnd_cne_confidence.2.d:0 "The provincial coalition has taken up arms. Its government rejects the imperial throne and pledges to rebuild the Han Commonwealth. Some officers remember marching beside Mu Zhongtang; now their banners advance against his Empire."
 nesnd_cne_confidence.2.a:0 "Let the republican promise endure."
 nesnd_cne_confidence.3.t:0 "The Han Commonwealth"
 nesnd_cne_confidence.3.d:0 "The imperial government has fallen. The republicans have taken over its provinces and offices and established the Han Commonwealth. The new government reasserts the revolutionary claim to national unity in those parts of Hunan, Hubei and Sichuan still outside its own rule or that of its subjects."
 nesnd_cne_confidence.3.a:0 "Rebuild the Commonwealth."
 nesnd_cne_confidence.4.t:0 "The Republicans Submit"
 nesnd_cne_confidence.4.d:0 "The republican coalition can no longer sustain its war. Its provinces return to imperial rule. The fighting has ended, though the questions raised by the rebels remain."
 nesnd_cne_confidence.4.a:0 "Restore the provincial administration."
