 nesnd_land_review_crisis_detail_tt:0 "At least 15 monthly surveys have been taken, with at least 12 consecutive months of hardship. $nesnd_land_disorder_bar$ is at least 90, national [concept_turmoil] exceeds 40%, government [concept_legitimacy] is below 25, and the country is at [concept_war] or under a [concept_bankruptcy] penalty. Reviews stop when all these conditions hold."
