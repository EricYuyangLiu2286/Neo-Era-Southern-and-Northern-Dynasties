 nesnd_cne_conf_industrialists_desc:0 "Industrialists in government"
 nesnd_cne_conf_landowners_desc:0 "Landowners in government"
 nesnd_cne_conf_surplus_desc:0 "Positive weekly balance"
 nesnd_cne_conf_sol_desc:0 "Reform-region workforce [concept_sol] of at least 11"
 nesnd_cne_confidence_bar_glossary:0 "[Glossary('glossary_nesnd_cne_confidence','What moves confidence')]"
 nesnd_reform_debt_limit_tt:0 "[Concept('concept_loans','$concept_credit_debt$')] is at most #v 25%#! of the [Concept('concept_credit','$concept_credit_limit$')]."
 glossary_nesnd_cne_confidence:0 "The Imperial People’s Confidence"
 glossary_nesnd_cne_confidence_desc:0 "#b;italic The Imperial People’s Confidence#! runs to #v 1000#!. If it falls to #v 0#!, the land-rights revolution fails. Each item below is settled monthly at one-twelfth of its yearly value.\n\n#b Groups in Government#!\nIntelligentsia, Petite Bourgeoisie, Trade Unions, Industrialists: #p +10#! a year for each one in government.\nLandowners: #n -20#! a year while in government.\n\n#b Governance#!\nPositive weekly balance: #p +30#! a year.\nReform-region workforce [concept_sol] of at least #v 11#!: #p +30#! a year.\n\n#b Strain#!\nFading revolutionary fervour: #n -25#! a year.\nEach full five years the reform runs: a further #n -25#! a year.\nLand commercialisation and national urbanisation: #n -5#! a year each while under way. Each provincial military estate: #n -5#! a year.\n[concept_war]: #n -25#! a year.\n[Concept('concept_radical','$concept_radicals$')] above #v 15%#!: #n -20#! a year.\n\n#b One-off Changes#!\n[concept_bankruptcy]: #n -250#!. Pause the Reforms: #p +100#!."
 nesnd_cne_confidence_bar_desc:0 "$nesnd_cne_confidence_journal$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 1000#!"
 nesnd_cne_confidence.5.t:0 "Embers of the Revolution"
 nesnd_cne_confidence.5.republic:0 "The monarchy has ended, and with it the political settlement behind Emperor Mu’s land revolution. The new government inherits the offices and their records. The future of fields, towns and military estates now rests with a different order."
 nesnd_cne_confidence.5.war:0 "Civil war has broken out. Provincial administrations and armies now answer to rival governments. Military orders have displaced the work of land reform, and the court can no longer carry out the campaign."
 nesnd_cne_confidence.5.coup:0 "A coup has changed the balance of power at court. Reform officials have been recalled and the provinces await new orders. The movement begun in Emperor Mu’s name has lost its political foundation."
 nesnd_cne_confidence.5.exhausted:0 "The enthusiasm of the [Glossary('glossary_nesnd_chinese_revolution','Great Revolution')] has faded. Officials will no longer promise another transformation; soldiers and villagers no longer trust the assurances they once embraced. The court can still issue orders, but the movement has spent its strength."
 nesnd_cne_confidence.5.a:0 "End the reform and close its programmes."
