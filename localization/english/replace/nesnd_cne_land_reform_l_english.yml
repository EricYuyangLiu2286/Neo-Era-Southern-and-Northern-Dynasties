 nesnd_land_review_outcome_tt:0 "Pay one tenth of weekly gross income, at least #v £5,000#!. $nesnd_land_disorder_bar$ falls by #p 5#! immediately. The $nesnd_land_appeals$ hears appeals for #v 12#! months. Another review can begin when that term ends. [Concept('concept_government_wage','$concept_government_wages|q$')] rise by #n 5%#! and [concept_bureaucracy] falls by #n 5%#! during the term. From the fourth monthly survey onward, the commission reduces $nesnd_land_disorder_bar$ by #p 0.5#! each month while reform is active."
