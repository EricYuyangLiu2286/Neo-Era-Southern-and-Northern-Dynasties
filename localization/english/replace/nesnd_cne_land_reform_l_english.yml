 nesnd_cne_funding_requirements:0 "Land reform remains active, the treasury can meet the cost, a year has passed since the previous grant, and no proposal awaits a reply."
 nesnd_land_survey_outcome_tt:0 "Propose industrial funding for the eligible state with the highest unemployment."
 nesnd_land_military_outcome_tt:0 "Propose relief for the eligible state with the highest unemployment among those facing starvation."
 nesnd_cne_funding.1.t:0 "Industrial Funding for [SCOPE.sState('nesnd_cne_funding_state').GetName]"
 nesnd_cne_funding.1.d:0 "The governor of [SCOPE.sState('nesnd_cne_funding_state').GetName] reports that many people leaving the estates lack the skills needed by workshops and struggle to find a living in town. The Ministry of Revenue proposes a grant for practical schools and workshop expansion. Learning a new trade would give these families the means to use the freedom promised by land reform."
 nesnd_cne_funding.2.t:0 "Transitional Relief in [SCOPE.sState('nesnd_cne_funding_state').GetName]"
 nesnd_cne_funding.2.d:0 "The governor of [SCOPE.sState('nesnd_cne_funding_state').GetName] requests additional relief. Families without an income are cutting their meals, and the towns offer too few jobs to support them. The Ministry of Revenue proposes a year of additional payments through the existing relief institutions and has submitted the grant for approval."
 nesnd_cne_funding.accept:0 "Approve the funding."
 nesnd_cne_funding.cancel:0 "Defer the proposal."
 nesnd_land_rules_link:0 "In Emperor Mu’s grand design, the Empire pursues three revolutionary aims: #bold $nesnd_cne_land_journal$#!, #bold $nesnd_cne_urban_journal$#! and #bold $nesnd_cne_camps_journal$#!.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules This month’s livelihoods#!#!"
 nesnd_land_rules:0 "Unemployed workforce: #v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!\nWorkforce facing starvation: #v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!\nStandard of Living in working households: #v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!\nMarket Access: #v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!"
 nesnd_cne_consolidation_rules:0 "#bold Consolidation#!\nSchools level #v 2#!, literacy #v 48%#!, unemployment at most #v 6%#!, food insecurity at most #v 8%#!, living standards at least #v 11#! and market access at least #v 85%#!. Social Security level #v 2#! and living standards #v 12#! allow up to #v 12%#! unemployment. Non-negative bureaucracy, peace and no bankruptcy penalty are required.\n\n#bold Local disorder#!\nStates with at least #v 500,000#! inhabitants interrupt consolidation after six months above #v 20%#! unemployment, #v 25%#! food insecurity or #v 10%#! severe starvation. National and local rates use workforce. Subsistence workers are employed.\n\nComplete at #v 100#! progress, #v 12#! consecutive qualifying months and disorder below #v 50#!. The rapid-reform reward requires completion within 48 months, at least 24 consecutive qualifying months and disorder below 30."
 nesnd_cne_arable_share_tt:0 "In our Chinese heartland and northeastern states, developed farmland occupies at least #v 6%#! of arable land."
