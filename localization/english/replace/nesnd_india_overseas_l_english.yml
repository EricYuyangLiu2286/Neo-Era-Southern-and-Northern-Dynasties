l_english:
 nesnd_india_overseas:0 "Overseas Trade"
 nesnd_india_overseas_void_conclusion:0 "We no longer pursue these overseas negotiations."
 nesnd_india_overseas_reason_steel:0 "[ROOT.GetCountry.GetName] is now a [concept_recognized_power] and may put requests to the local governments in three directions overseas: [GetStrategicRegion('region_indonesia').GetName], the [GetStrategicRegion('region_persian_gulf').GetName] coast and [GetStrategicRegion('region_east_africa').GetName]. A local government may grant us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], or cede one of its states with a $building_port$ to us as a [concept_treaty_port]. Whether it agrees is its own decision. If it is a [concept_subject] of another country, its [concept_overlord] may have to consent first: for trade privileges only when it is a [concept_puppet], for a treaty port whenever it is a subject. Territory and protection are not part of these treaties and must be sought through a [concept_diplomatic_play].\n\n#bold Our Strength#!\nWorld rank in [concept_gdp]: [ROOT.GetCountry.GetGDPRanking]\nWorld rank in [concept_gdp_per_capita]: [ROOT.GetCountry.GetGDPPerCapitaRanking]\n[Concept('concept_incorporated_state','$concept_incorporated_states|q$')] with a $building_railway$: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_rail_states')|0] / [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_incorporated_states')|0]\n$building_steel_mill$: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_steel_levels')|0] levels, about [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_steel_staffed_percent')|0]% of their places filled\nTotal $building_port$ levels: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_levels')|0]\nWorld rank in [concept_naval_power_projection]: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_navy_rank')|0]"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName] is now a [concept_recognized_power] and may put requests to the local governments in three directions overseas: [GetStrategicRegion('region_indonesia').GetName], the [GetStrategicRegion('region_persian_gulf').GetName] coast and [GetStrategicRegion('region_east_africa').GetName]. A local government may grant us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], or cede one of its states with a $building_port$ to us as a [concept_treaty_port]. Whether it agrees is its own decision. If it is a [concept_subject] of another country, its [concept_overlord] may have to consent first: for trade privileges only when it is a [concept_puppet], for a treaty port whenever it is a subject. Territory and protection are not part of these treaties and must be sought through a [concept_diplomatic_play].\n\n#bold Our Strength#!\nWorld rank in [concept_gdp]: [ROOT.GetCountry.GetGDPRanking]\nWorld rank in [concept_gdp_per_capita]: [ROOT.GetCountry.GetGDPPerCapitaRanking]\n[Concept('concept_incorporated_state','$concept_incorporated_states|q$')] with a $building_railway$: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_rail_states')|0] / [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_incorporated_states')|0]\n$building_steel_mill$: none\nTotal $building_port$ levels: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_levels')|0]\nWorld rank in [concept_naval_power_projection]: [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_navy_rank')|0]"
