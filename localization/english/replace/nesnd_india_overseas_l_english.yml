 nesnd_india_overseas_has_port_state_tt:0 "It has a state in this direction that could become our [concept_treaty_port]: one with a $building_port$ that is not a treaty port already"
 nesnd_india_overseas_rank_fits_tt:0 "Its [concept_rank] is no higher than ours (required by the [concept_treaty_port] article)"
 nesnd_india_overseas_port_claimed_tt:0 "Another country has a [concept_claim] on this state, or the state is among the aims of '$nesnd_per_west_journal$'"
 nesnd_india_overseas.1.t:0 "Whom to Approach Overseas"
 nesnd_india_overseas.1.d_trade_1:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_indonesia').GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments on the best terms with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_port_1:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_indonesia').GetName] to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments on the best terms with us."
 nesnd_india_overseas.1.d_trade_2:0 "We mean to ask one of the local governments on the [GetStrategicRegion('region_persian_gulf').GetName] coast for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments on the best terms with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_port_2:0 "We mean to ask one of the local governments on the [GetStrategicRegion('region_persian_gulf').GetName] coast to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments on the best terms with us."
 nesnd_india_overseas.1.d_trade_3:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_east_africa').GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')], so that our traders may enjoy better terms there. Below are the governments on the best terms with [ROOT.GetCountry.GetName]."
 nesnd_india_overseas.1.d_port_3:0 "We mean to ask one of the local governments in [GetStrategicRegion('region_east_africa').GetName] to cede a port to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. Below are the governments on the best terms with us."
 nesnd_india_overseas.1.f:0 "“The envoy is to open negotiations for a treaty with that government without delay, and to grant no terms beyond those set out in these instructions.”\n—Instructions of the Government of [ROOT.GetCountry.GetName] to its envoy overseas"
 nesnd_india_overseas.1.a:0 "Approach [SCOPE.sCountry('india_overseas_pick_1').GetName]"
 nesnd_india_overseas_port_named_1_tt:0 "It would cede [SCOPE.sState('india_overseas_port_1').GetName] to us as a [concept_treaty_port], the most populous of its states in this direction that it could cede."
 nesnd_india_overseas_port_claimed_1_tt:0 "Another country has a [concept_claim] on [SCOPE.sState('india_overseas_port_1').GetName], or it is among the aims of '$nesnd_per_west_journal$'. This does not stop us from asking."
 nesnd_india_overseas.1.b:0 "Approach [SCOPE.sCountry('india_overseas_pick_2').GetName]"
 nesnd_india_overseas_port_named_2_tt:0 "It would cede [SCOPE.sState('india_overseas_port_2').GetName] to us as a [concept_treaty_port], the most populous of its states in this direction that it could cede."
 nesnd_india_overseas_port_claimed_2_tt:0 "Another country has a [concept_claim] on [SCOPE.sState('india_overseas_port_2').GetName], or it is among the aims of '$nesnd_per_west_journal$'. This does not stop us from asking."
 nesnd_india_overseas.1.c:0 "Approach [SCOPE.sCountry('india_overseas_pick_3').GetName]"
 nesnd_india_overseas_port_named_3_tt:0 "It would cede [SCOPE.sState('india_overseas_port_3').GetName] to us as a [concept_treaty_port], the most populous of its states in this direction that it could cede."
 nesnd_india_overseas_port_claimed_3_tt:0 "Another country has a [concept_claim] on [SCOPE.sState('india_overseas_port_3').GetName], or it is among the aims of '$nesnd_per_west_journal$'. This does not stop us from asking."
 nesnd_india_overseas.1.d:0 "Approach [SCOPE.sCountry('india_overseas_pick_4').GetName]"
 nesnd_india_overseas_port_named_4_tt:0 "It would cede [SCOPE.sState('india_overseas_port_4').GetName] to us as a [concept_treaty_port], the most populous of its states in this direction that it could cede."
 nesnd_india_overseas_port_claimed_4_tt:0 "Another country has a [concept_claim] on [SCOPE.sState('india_overseas_port_4').GetName], or it is among the aims of '$nesnd_per_west_journal$'. This does not stop us from asking."
 nesnd_india_overseas.1.e:0 "Not Now"
 nesnd_india_overseas_not_now_tt:0 "We make no request for now, and our chance to negotiate is not used up."
 nesnd_india_overseas_ask_trade_tt:0 "We ask it to grant us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|0] on signing."
 nesnd_india_overseas_ask_port_tt:0 "We ask it to cede one of its states with a $building_port$ to us as a [concept_treaty_port]. If it agrees, the two countries sign a [concept_treaty] with a [concept_binding_period] of ten years, and we pay it @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|0] on signing."
 nesnd_india_overseas_consent_first_tt:0 "It is a [concept_subject] of another country. The matter first needs the consent of its [concept_overlord], and goes to it only after that."
 nesnd_india_overseas_member_turn_tt:0 "This request puts its diplomatic correspondence on a six-month cooldown, during which it cannot make requests of other countries."
 nesnd_india_overseas.2.t:0 "They Agree"
 nesnd_india_overseas.2.d_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has granted our request. The two countries have signed a [concept_treaty], and our traders now enjoy [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] in [SCOPE.sCountry('india_matter_to').GetName]."
 nesnd_india_overseas.2.d_port:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to cede [SCOPE.sState('india_overseas_port_signed').GetName] to [ROOT.GetCountry.GetName] as a [concept_treaty_port]. The two countries have signed a [concept_treaty]."
 nesnd_india_overseas.2.d_renew_trade:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew. Its treaty granting us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] will stay in force once the present term ends."
 nesnd_india_overseas.2.d_renew_port:0 "[SCOPE.sCountry('india_matter_to').GetName] has agreed to renew. Its treaty ceding us a [concept_treaty_port] will stay in force once the present term ends."
 nesnd_india_overseas.2.f:0 "“The Government has reached agreement with the other government on this matter.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_overseas_signed_trade_tt:0 "The treaty has a [concept_binding_period] of ten years and expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_matter_to').MakeScope, 'nesnd_india_frontier_overseas_trade_term'))]. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|0]."
 nesnd_india_overseas_signed_port_tt:0 "The treaty has a [concept_binding_period] of ten years and expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_matter_to').MakeScope, 'nesnd_india_frontier_overseas_port_term'))]. We have paid [SCOPE.sCountry('india_matter_to').GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|0]."
 nesnd_india_overseas_renewed_trade_tt:0 "When the present term ends, it is extended by ten years with no further payment."
 nesnd_india_overseas_renewed_port_tt:0 "When the present term ends, it is extended by ten years with no further payment."
 nesnd_india_overseas.3.t:0 "No Agreement"
 nesnd_india_overseas.3.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName] has refused its consent as [concept_overlord], and our request goes no further."
 nesnd_india_overseas.3.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] has declined our request."
 nesnd_india_overseas.3.d_silent:0 "Our request received no answer in time and has been dropped."
 nesnd_india_overseas.3.d_renew_decline:0 "[SCOPE.sCountry('india_matter_to').GetName] will not renew."
 nesnd_india_overseas.3.d_renew_silent:0 "Our request to renew received no answer in time."
 nesnd_india_overseas.3.d_void:0 "Circumstances have changed, and our request no longer stands."
 nesnd_india_overseas.3.f:0 "“The negotiations between this country and that government have been broken off.”\n—Notice of the Government of [ROOT.GetCountry.GetName]"
 nesnd_india_overseas_failed_tt:0 "The request goes no further. We may not open another negotiation until six months after it was made."
 nesnd_india_overseas_lapse_tt:0 "The treaty ends in the month it expires, and neither side bears the penalties of breaking it."
 nesnd_india_frontier.3.d_overseas_trade:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] grants us [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_frontier_small').MakeScope, 'nesnd_india_frontier_overseas_trade_term'))]. It will not end by itself. We may ask [SCOPE.sCountry('india_frontier_small').GetName] to renew it, or let it lapse, in which case it ends when it expires."
 nesnd_india_frontier.3.d_overseas_port:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] ceded us a [concept_treaty_port] expires on [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(SCOPE.sCountry('india_frontier_small').MakeScope, 'nesnd_india_frontier_overseas_port_term'))]. It will not end by itself. We may ask [SCOPE.sCountry('india_frontier_small').GetName] to renew it, or let it lapse, in which case it ends when it expires."
 nesnd_india_overseas_renew_tt:0 "We ask [SCOPE.sCountry('india_frontier_small').GetName] to renew, with no further payment. If [SCOPE.sCountry('india_frontier_small').GetName] agrees, the term is extended by ten years and the treaty stays the same one. A refusal, or no answer within thirty days, counts as not renewing."
 nesnd_india_overseas_let_lapse_tt:0 "The treaty ends in the month it expires, and neither side bears the penalties of breaking it. [SCOPE.sCountry('india_frontier_small').GetName] will be informed."
 nesnd_india_overseas_renew_consent_tt:0 "[SCOPE.sCountry('india_frontier_small').GetName] is a [concept_subject] of [SCOPE.sCountry('india_frontier_small').GetOverlord.GetName], whose consent is needed first."
 nesnd_india_frontier.4.d_overseas_trade:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] granted [SCOPE.sCountry('india_frontier_empire').GetName] [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] has expired without renewal and has ended, with neither side bearing the penalties of breaking it."
 nesnd_india_frontier.4.d_overseas_port:0 "The treaty by which [SCOPE.sCountry('india_frontier_small').GetName] ceded a [concept_treaty_port] to [SCOPE.sCountry('india_frontier_empire').GetName] has expired without renewal and has ended, with neither side bearing the penalties of breaking it. Under the [concept_treaty_port] article, [SCOPE.sCountry('india_frontier_small').GetName] now holds a [concept_claim] on that state."
 nesnd_india_overseas_status_answer_10:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of ten years. We are a party to the treaty and decide for ourselves."
 nesnd_india_overseas_status_answer_11:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks us to cede one of our states with a $building_port$ to it as a [concept_treaty_port]: the most populous of those we could cede in that direction. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] would pay us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] on signing, and the [concept_treaty] would have a [concept_binding_period] of ten years. We are a party to the treaty and decide for ourselves."
 nesnd_india_overseas_status_answer_12:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the treaty by which we grant it [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]: the term would be extended by ten years with no further payment."
 nesnd_india_overseas_status_answer_13:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks to renew the treaty by which we ceded it a [concept_treaty_port]: the term would be extended by ten years with no further payment."
 nesnd_india_overseas_status_consent_10:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] for [Concept('concept_trade_privilege','$concept_trade_privileges|q$')]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_status_consent_11:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to cede one of its states with a $building_port$ as a [concept_treaty_port]. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_status_consent_12:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the treaty granting it [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] for ten more years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_status_consent_13:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] asks [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] to renew the treaty ceding it a [concept_treaty_port] for ten more years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName] is our [concept_subject], and the matter first needs our consent as its [concept_overlord]."
 nesnd_india_overseas_accept_trade_tt:0 "The two countries sign a [concept_treaty]: [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] receives [Concept('concept_trade_privilege','$concept_trade_privileges|q$')] from us, with a [concept_binding_period] of ten years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] once."
 nesnd_india_overseas_accept_port_tt:0 "The two countries sign a [concept_treaty]: we cede to [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] as a [concept_treaty_port] the most populous state with a $building_port$ that we can cede in this direction, with a [concept_binding_period] of ten years. [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] pays us @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] once."
 nesnd_india_overseas_accept_renew_tt:0 "The treaty between us stays in force, and its term is extended by ten years."
