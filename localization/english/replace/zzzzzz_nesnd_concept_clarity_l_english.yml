l_english:
 nesnd_ten_status_bankruptcy:0 "An active [concept_bankruptcy] penalty interrupts consolidation."
 nesnd_ten_conditions_bar_detail:0 "Unemployed workforce: #v [Country.MakeScope.Var('nesnd_ten_unemployment').GetValue|%1]#!\nWorkforce below the starvation threshold: #v [Country.MakeScope.Var('nesnd_ten_starving').GetValue|%1]#!\nEmployed and below the starvation threshold: #v [Country.MakeScope.Var('nesnd_ten_working_hungry').GetValue|%1]#!\nWorkforce household [concept_sol]: #v [Country.MakeScope.Var('nesnd_ten_sol').GetValue|1]#!\n[concept_market_access]: #v [Country.MakeScope.Var('nesnd_ten_access').GetValue|%1]#!\n\nRequirements: unemployment at most #v 12%#!; at most #v 25%#! below the starvation threshold and living standards of at least #v 6.5#!; market access of at least #v 85%#!; peace and no active [concept_bankruptcy] penalty. Shares are calculated from the workforce in our part of Tenasserim and updated monthly. Subsistence farmers count as employed."
