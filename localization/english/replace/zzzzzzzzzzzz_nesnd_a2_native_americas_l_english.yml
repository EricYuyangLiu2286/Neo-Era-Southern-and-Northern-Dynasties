l_english:
 nesnd_american_restoration: "Dynasties and Local Communities"
 nesnd_american_restoration_reason: "The heirs of Moctezuma and the Andean court claim different inheritances. Both confront a question the republics have left unresolved: can Indigenous communities control their land and local government? Dynastic supporters appeal to old compacts, while rural communities resist dispossession. Recognition, negotiation, and repression offer sharply different futures."
 nesnd_native_recognize: "Recognize the Dynasty and Local Compacts"
 nesnd_native_recognize_desc: "Bring the old dynasty and local communities into a new political settlement."
 nesnd_native_recognize_tt: "Restore an Indigenous monarchy. If an Inca court already exists, propose a union requiring its consent within ninety days."
 nesnd_native_negotiate: "Negotiate Councils and Land Rights"
 nesnd_native_negotiate_desc: "Seek rural cooperation through local councils and negotiations over land."
 nesnd_native_negotiate_tt: "Reduce restoration pressure by fifteen points. Local councils continue to ease pressure during the negotiations."
 nesnd_native_suppress: "Suppress the Restoration Movement"
 nesnd_native_suppress_desc: "Use the army against the restoration movement, accepting displacement and rural radicalization."
 nesnd_native_suppress_tt: "Move forty percent of each resident Indigenous community to the receiving country if it has a suitable state. Without a destination, the population remains in place and the migration ends immediately. States that actually receive migrants gain 25% Migration Attraction for 60 months. Political figures may enter exile; after migration, 15% of the Indigenous population remaining in our country becomes Radical. The army requirement uses a conservative estimate of a potential uprising."
 nesnd_native_local_councils: "Local Councils and Land Negotiations"
 nesnd_native_restored_rule: "Prestige of the Restored Dynasty"
 nesnd_native_exiles: "Indigenous Refuge Networks"
 nesnd_restoration_pressure_bar: "Restoration Pressure"
 nesnd_restoration_pressure_bar_desc: "The growing alliance between rural communities and dynastic supporters. At its peak, restorationists attempt an uprising where sufficient territory and population are available."
 nesnd_restoration_pressure_base: "Expansion of Restoration Networks"
 nesnd_restoration_pressure_radicals: "Support among Radicals"
 nesnd_restoration_pressure_poverty: "Discontent in Poverty"
 nesnd_restoration_pressure_repression: "Mediation by Local Councils"
 nesnd_restoration_existing_court_status: "The Inca court has been established. Recognizing it opens a request to unite the two countries, requiring both governments to agree. Both must remain independent and at peace. Once the restoration has ended, no new court or uprising will be established."
 nesnd_restoration_waiting_land_status: "Restorationists seek a viable core. Territory, population, or current conflicts prevent a territorial uprising."
 nesnd_restoration_politics_status: "Dynastic supporters and local communities are gathering political support."
 nesnd_native_restoration_war: "War of Dynastic Restoration"
 nesnd_native_restoration_war_reason: "The restorationists have established a government. Both sides contest the dynasty's claim and authority over land, armies, and local communities. Enforced war demands can settle reunification; a truce leaves the existing states in place."
 nesnd_restoration_war_status: "War and an actual settlement must decide the restoration's future."
 nesnd_restoration_war: "War of Dynastic Restoration"
 dp_nesnd_native_restoration: "War of Dynastic Restoration"
 dp_nesnd_native_restoration_desc: "The restored dynasty and the republic contest rule over the country. The victor will annex the defeated state."
 dp_nesnd_native_restoration_tooltip: "#header $dp_nesnd_native_restoration$#!\n$dp_nesnd_native_restoration_desc$"
 wg_nesnd_restoration_settlement: "Unify the Restoration Territories"
 wg_nesnd_restoration_settlement_desc: "Defeat the opposing government and annex its territory. Suppression first resolves Indigenous refuge and political exile."
 nesnd_american_restoration.1.t: "The Old Dynasty's Banner"
 nesnd_american_restoration.1.d: "Community militias and dynastic supporters have broken with our government and established their own. Their claims to land and old compacts now confront the armies of both states."
 nesnd_american_restoration.1.a: "Prepare for war."
 nesnd_american_restoration.2.t: "Refugees Arrive"
 nesnd_american_restoration.2.d: "Indigenous communities displaced by repression have crossed the border, bringing family ties, local organizations, and memories of lost homes. Their destinations will anchor new refuge networks, though arrival does not immediately restore their livelihoods."
 nesnd_american_restoration.2.a: "Let them settle here."
 nesnd_american_restoration.3.t: "The Restoration Movement Suppressed"
 nesnd_american_restoration.3.d: "The army has dispersed the restoration movement, but the rural conflict persists. Families with a receiving destination begin to leave; those without one remain. Political representatives enter exile, while disputes over land and local authority endure."
 nesnd_american_restoration.3.a: "We must bear the consequences."
 nesnd_american_restoration.4.t: "A Compact with the Communities"
 nesnd_american_restoration.4.d: "The old dynasty has returned to the center of political life. Local communities have offered their support in pursuit of recognition for their land and representatives. Relations among court, assembly, and countryside will now develop under the new settlement."
 nesnd_american_restoration.4.a: "Let the new settlement begin."
 nesnd_american_restoration.5.t: "The Settlement Enforced"
 nesnd_american_restoration.5.d: "The opposing government has lost its final territories and the war demand has been enforced. The united state inherits these lands together with the local conflicts and exile left by the war."
 nesnd_american_restoration.5.a: "Take responsibility for the country left by war."
 nesnd_american_restoration.6.t: "An Uneasy Partition"
 nesnd_american_restoration.6.d: "The struggle has ended without reunification under our government. Surviving governments retain their actual territories, and dynastic claims have not become accomplished facts merely because fighting has stopped."
 nesnd_american_restoration.6.a: "Accept the present situation."
 nesnd_american_restoration.10.t: "Recognition of One Inca Court"
 nesnd_american_restoration.10.d: "[SCOPE.sCountry('nesnd_restoration_applicant').GetName] proposes recognizing the existing Inca court and joining our state. Union would end the partition and bring its local communities into the political settlement we must uphold."
 nesnd_american_restoration.10.a: "Accept the union."
 nesnd_american_restoration.10.b: "Retain separate governments."
 nesnd_a2_itzcoatl_first: "Itzcoatl"
 nesnd_a2_moctezuma_last: "Moctezuma"
 nesnd_a2_amaru_first: "Yupanqui"
 nesnd_a2_amaru_last: "Amaru I"
 nesnd_a2_rumi_first: "Rumi"
 nesnd_a2_quispe_last: "Quispe"
 nesnd_a2_tatanka_first: "Tatanka"
 nesnd_a2_temur_last: "Temur"
 nesnd_khanate_emergence: "Revival of the Plains Compact"
 nesnd_khanate_emergence_reason: "With Manchu and Mongol registration settled, the memory of the old Plains uprising has returned to political life. Supporters seek an Indigenous khanate on the American Great Plains. The project requires four connected, populated states actually held by the United States."
 nesnd_khanate_waiting_status: "Awaiting four connected, populated American states on the Great Plains. The United States must retain populated territory after cession."
 nesnd_khanate_established_tt: "The Indigenous khanate has actually received four states and established its government."
 nesnd_khanate_survival: "The Khanate's Struggle for Survival"
 nesnd_khanate_survival_reason: "The new khanate draws its title from the Plains compact and its population from Indigenous communities joining it. Neighboring governments regard it as a challenge to their borders. Each intervention has its own war and outcome; defeating one government does not settle the other conflict."
 nesnd_khanate_usa_status: "The American intervention remains unresolved. The other intervention is settled separately."
 nesnd_khanate_hus_status: "The original sponsor's intervention remains unresolved. The American outcome has been recorded separately."
 nesnd_khanate_survival_status: "Both interventions have ended. Enforced humiliation, a truce, failure to launch a war, and an opponent's disappearance remain distinct outcomes."
 nesnd_khanate_legacy_status: "The earlier foundation record does not match the surviving territory. Population and military grants will not be repeated."
 nesnd_khanate_survived_tt: "The khanate survives and both independent interventions have reached an outcome."
 nesnd_suppress_native_khanate: "Intervene against the Plains Khanate"
 nesnd_suppress_native_khanate_reason: "Territorial cession and migration have changed the balance of power in North America. Our government seeks to annex the khanate, while the khanate intends to force its interveners to acknowledge its position."
 nesnd_khanate_intervention_status: "Our intervention has its own war and outcome. Failure to launch a war does not count as victory."
 nesnd_khanate_destroyed_tt: "Our demand to annex the khanate has actually been enforced."
 nesnd_khanate_suppression_failed_tt: "The intervention has ended without annexation of the khanate by our country."
 nesnd_khanate_war: "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression: "War of Intervention on the Plains"
 dp_nesnd_khanate_suppression_desc: "The intervening power demands annexation of the Great Plains Khanate; the khanate demands the humiliation of its opponent."
 dp_nesnd_khanate_suppression_tooltip: "#header $dp_nesnd_khanate_suppression$#!\n$dp_nesnd_khanate_suppression_desc$"
 NKH: "Great Plains Khanate"
 NKH_ADJ: "Great Plains"
 wg_nesnd_khanate_annex: "Annex the Khanate"
 wg_nesnd_khanate_annex_desc: "Enforce the annexation of the Plains khanate."
 wg_nesnd_khanate_humiliation: "Humiliate the Intervener"
 wg_nesnd_khanate_humiliation_desc: "Force the government responsible for this intervention to accept humiliation."
 nesnd_khanate_army: "Army of the Plains Compact"
 nesnd_native_american_republic: "Establish an Indigenous Republic"
 nesnd_native_american_republic_desc: "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and a complete ordinary legal settlement."
 nesnd_native_khanate.2.t: "A State on the Plains"
 nesnd_native_khanate.2.d: "Both interventions have reached an outcome, and the khanate retains its government. Humiliation, truce, or an intervention that never began each has a different meaning; an opponent's disappearance is no military achievement of ours. The communities of the Plains must now turn their wartime compact into lasting government."
 nesnd_native_khanate.2.a: "Preserve the state we have built."
 nesnd_native_khanate.3.t: "A Republic of Indigenous America"
 nesnd_native_khanate.3.d: "From the Great Plains to the southern continent, Indigenous government now extends across the Americas and Greenland. The former republic has ceased to exist, and [ROOT.GetCountry.GetName] assumes its name. Republican institutions replace the khanate, with Indigenous primary cultures. The existing population and armed forces must sustain the united state's everyday life."
 nesnd_native_khanate.3.a: "Let the peoples of America shape their future."
 nesnd_hus_registration.1.t: "The Plains Compact Rises Again"
 nesnd_hus_registration.1.d: "[SCOPE.sCountry('nesnd_a2_khanate').GetName] has received four connected states on the American Great Plains. Half of the Indigenous populations remaining in the two source countries have joined it after cession. The new khan inherits the memory of an earlier uprising and faces intervention against the new order."
 nesnd_hus_registration.1.a: "A new government stands on the Plains."
 nesnd_hus_registration.2.t: "Migration after Registration"
 nesnd_hus_registration.2.a: "The choice has been made."
 nesnd_a2_exodus_both_desc: "Manchu and Mongol communities have left for [SCOPE.sCountry('nesnd_a2_cne_country').GetName] or the west of [SCOPE.sCountry('nesnd_a2_usa_country').GetName]. Each community has a seventy percent chance of choosing the former and thirty percent the latter. Community sizes differ, so the actual population is not divided in an exact seventy-to-thirty ratio."
 nesnd_a2_exodus_cne_desc: "No receiving destination remains in the American west. The Manchu and Mongol communities have all moved to [SCOPE.sCountry('nesnd_a2_cne_country').GetName], and the planned division between two destinations has not taken place."
 nesnd_a2_exodus_usa_desc: "No receiving destination remains in the east. The Manchu and Mongol communities have all moved to western [SCOPE.sCountry('nesnd_a2_usa_country').GetName], and the planned division between two destinations has not taken place."
 nesnd_a2_exodus_none_desc: "Neither destination can receive the Manchu and Mongol communities. They remain where they live, and this migration has ended. The registration choice already enacted remains in force."
 nesnd_american_restoration.11.t: "The Union Offer Has Expired"
 nesnd_american_restoration.11.d: "The Inca court did not consent to union within the allotted time. Both states retain their governments and territory. Negotiations may be renewed after the waiting period."
 nesnd_american_restoration.11.a: "Retain separate governments for now."
 nesnd_american_restoration.12.t: "The Inca Court Declines Union"
 nesnd_american_restoration.12.d: "The Inca court has declined the union offer. A shared dynastic tradition has not proved sufficient to end the partition. Talks may resume after the waiting period."
 nesnd_american_restoration.12.a: "Leave room for future talks."
 nesnd_restore_native_hus: "Establish an Indigenous Republic"
 nesnd_restore_native_hus_desc: "Unite the Americas and Greenland. Once the former state has ceased to exist, establish a republic with Indigenous primary cultures and a complete ordinary legal settlement."
 nesnd_native_americas_unified_tt: "Own every region in the Americas and Greenland in full, including uncolonized land and foreign portions of split states."
 nesnd_native_hus_restored_tt: "Adopt Indigenous primary cultures, establish a republic, and enact the complete settlement of twenty-four ordinary law groups."
 nesnd_american_restoration.13.t: "Reconstituting Dynastic Government"
 nesnd_american_restoration.13.d: "Dynastic supporters have reconvened the local communities to settle relations among court, local representatives, and countryside. The existing state will continue under a renewed political compact, bearing the divisions left by the earlier war."
 nesnd_american_restoration.13.a: "Preserve the state and renew its compact."
 nesnd_native_khanate.2.both: "Both intervening governments have been forced to accept humiliation, and the khanate retains its government. Victory has lent prestige to the Plains compact. Its communities must now turn their wartime alliance into lasting government."
 nesnd_native_khanate.2.one: "One intervention has ended in the intervener's humiliation, and the other intervention has also reached an outcome. The khanate retains its government. Its communities must now turn their wartime compact into lasting government."
 nesnd_native_khanate.2.none: "Both interventions have ended and the khanate retains its government. Neither has yielded an enforced humiliation of the intervener. The communities of the Plains must now sustain the state that has survived the struggle."
 war_goal_wg_nesnd_restoration_settlement_type_name: "Unify the Restoration Territories"
 war_goal_wg_nesnd_restoration_settlement_type_desc: "Defeat the opposing government and annex its territory. Suppression first resolves Indigenous refuge and political exile."
 war_goal_wg_nesnd_restoration_settlement: "Unify the Restoration Territories: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_restoration_settlement_desc: "Defeat the opposing government and annex its territory. Suppression first resolves Indigenous refuge and political exile."
 war_goal_wg_nesnd_restoration_settlement_sway_desc: "Defeat the opposing government and annex its territory. Suppression first resolves Indigenous refuge and political exile."
 war_goal_wg_nesnd_khanate_annex_type_name: "Annex the Khanate"
 war_goal_wg_nesnd_khanate_annex_type_desc: "Enforce the annexation of the Plains khanate."
 war_goal_wg_nesnd_khanate_annex: "Annex the Khanate: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_annex_desc: "Enforce the annexation of the Plains khanate."
 war_goal_wg_nesnd_khanate_annex_sway_desc: "Enforce the annexation of the Plains khanate."
 war_goal_wg_nesnd_khanate_humiliation_type_name: "Humiliate the Intervener"
 war_goal_wg_nesnd_khanate_humiliation_type_desc: "Force the government responsible for this intervention to accept humiliation."
 war_goal_wg_nesnd_khanate_humiliation: "Humiliate the Intervener: [WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_humiliation_desc: "Force the government responsible for this intervention to accept humiliation."
 war_goal_wg_nesnd_khanate_humiliation_sway_desc: "Force the government responsible for this intervention to accept humiliation."
 nesnd_native_khanate.4.t: "Broken Treaties Before Intervention"
 nesnd_native_khanate.4.d: "[SCOPE.sCountry('nesnd_khanate_opponent').GetName] has withdrawn from treaties with the khanate containing an alliance or defensive pact, clearing the way for intervention. Any trade or other provisions in the same treaties end with them. The withdrawing country bears the diplomatic cost of breaking its word. Neither country's treaties with third powers are included."
 nesnd_native_khanate.4.a: "The war begins with a broken promise."

 nesnd_final_native_restored_existing_tt:0 "Restored rule: Prestige +30, Rural Folk Approval +3, Construction Efficiency +10%; lasts 120 months."
