l_english:
 FRA_FLAVOR_TEXT: "Three cheers to His Majesty Louis I, First Citizen, guardian of European progress and civilization! By him, fields and hills revive; by him, the French have regained both their newspapers and their conscience; by him, a steel-forged future stretches forward under the pulse of steam. And yet this enlightened emperor still has not ushered in the republican age Napoleon once opened in Europe. Like his uncle and adoptive father, he has set an untouchable imperial crown atop popular sovereignty. What awaits such a contradictory nation?"
 
 GBR_FLAVOR_TEXT: "Amid enemies on every side, Great Britain limps into the French century. From New World independence, to revolutionary terror, to Napoleon's rise, and finally the global blockade of the Franco-Ming alliance: Heaven has not favored Britannia. Let fate and sickness depart with old King William. Britain no longer needs imperial mirages; we shall bow our heads, till our fields, and wait for our chance..."
 
 USM_FLAVOR_TEXT: "The age of the Southern and Northern Courts, where Qin, Yan, and Ming contended as three empires, is now yesterday's flower. The Xiangyang campaign that once cut the current of history grows distant. Reforged by reformers Zheng Qin and Chen Dongyang, the Southern Ming polity has entered a new chapter. Industrial trains thunder through the three southeastern provinces, and with them comes ever louder and wilder argument. Where will this nation go? Perhaps the answer to that question will be found at last in the quiet villas of Hangzhou."
 
 CNE_FLAVOR_TEXT: "'I would rather die for the broad Zhongxia than serve a lord of partitioned lands.' The revolutionary cries of Chang'an's youth were eventually scattered to ash beneath the cannon thunder of the age. Across the vast North China plain, only one victor still stood: Mu Zhongtang and his overbearing progressive military bloc. Those who betrayed the revolutionary ideal survived only within their own regional customs. Northern republicans and southern gentry-financier interests strangled their dream of unification. Ideals abandoned, people no longer offer themselves - only a crippled land reform remains, and the empire's future grows ever more uncertain..."
 
 QE1_FLAVOR_TEXT: "Even as songs of 'Valiant old Qin, together in national peril' still echo among imperial elites, the people of Western Qin cannot escape the fact that history has cast them aside. More than four centuries after Chen De built his forces in the northwest, this mighty continental empire once came closest to China's mandate - only to shatter against a louder and greater revolutionary juggernaut. Its last hope was ground to dust beneath the hooves of Zhang Baili at the Battle of Dunhuang in 1822. If the surviving western empire wishes to recover in the post-Southern-Northern age, it must face reality and reform with resolve."
 
 HUS_FLAVOR_TEXT: "The miracle of capital belongs not only to the great powers, but also to free peoples who truly pursue ideals and justice. The courageous uprising of 1644 forged Huaxia East Continent. Over the next two decades, descendants of Sun Chengzong, Li Chengliang, and Nurhaci liberated the entire western coast of the Eastern Continent from a narrow foothold. As the domestic uprisings of Luoyang and Xi'an failed, Eastern civic republicans leaned ever more heavily on this regime, once dismissed as a barbarian Jurchen state. If it can truly establish continental hegemony, its future will be boundless."
 
 SIH_FLAVOR_TEXT: "Liu Zhongming, lord of Shu, was once merely a commoner. He rose only because Zheng Qin of the Southern Ming court needed a talent capable of checking the western-command Sichuan army. As a result his rule has been cautious and constrained, and this land - once uniquely able to preserve itself through Northern Ming chaos and revolutionary war - missed opportunities for deeper growth in an age of upheaval. Yet the struggles of the realm have only paused, not ended. If the heroes of Sichuan dare to act, they will have their place in the next wave of opportunity."
 
 HNA_FLAVOR_TEXT: "Zhu Banbo has died in battle. Zheng Diaojin has been exiled. Ye Yincao has retired. Li Hanhan has gone east. Lin Zexu has been reassigned. Chu, once seen as the core of new governance, civic republicanism, and the new Western Command progressives, is rapidly declining and unraveling under the Zheng offensive from the Southern Court. Zhu Jiangchen - bearing prestige, loyalty, and courage - stands isolated and cannot halt the tide. Yet he has not wholly lost. A daring leap in politics, or some other method, may still recover a place for republicanism and the people within Ming."
 
 JAP_FLAVOR_TEXT: "There was once a brilliant age when the Toyotomi shogunate pacified the Sengoku realm in the east, broke Korea in the north, aided the great powers in the west, and reached the island world in the south. Yet as the Zheng house of Wu rose from equal ally to overlord in the Tang-Ming order, Japan's position became perilous. Over the past century, our land and wealth have been steadily consumed, and we have even lost all of Kyushu. In this era of ever-clearer ambitions from the eastern suzerain, can the famed Taiko shogunate still hold Japan's course in history's storm?"
 
 GNG_FLAVOR_TEXT: "Clan bonds, loyalty, and sage teachings: over centuries in the remote southwest, these principles allowed Zhu's Huai realm to carve prosperity and strength from poor and wild mountain country. Yet regional warlord autonomy may suffice in old times, not in the new age after Northern Ming's end. Huai's western branch never lacked heroes, but to move farther in an age of industry and revolution, we need a spirit greater and more fundamental than heroism itself."
 
 PHI_FLAVOR_TEXT: "Lin Zexu and Luzon were once models of Southern Ming: one a reform vanguard and student of Xiangyang hero Zhu Banbo, once governing a famed commandery as Governor-General of Huguang; the other a foundational base that sustained Wu's rise and pioneered the examination-representative system. Now that former rising star is suppressed and exiled by Zheng's Southern Court, while old foundations slowly rot in time. What future awaits them?"
 
 YN1_FLAVOR_TEXT: "Far South is Ming's remotest administrative command, with only Kunlunzhou (South Africa) perhaps farther. Yet Far South was also among the first overseas fairylands prized by Chinese settlers. Its vast land yielded strange flora and fauna treasured by physicians and scholars, and over the past two centuries it has become an important lead-and-iron zone for Southern Ming. Though the hot inland deserts slowed settlement and reclamation, technological advance and turmoil in the heartland will keep raising Far South's value as an overseas haven."
 
 SHA_FLAVOR_TEXT: "Amid ice and snow, the only republican state on Chinese soil stands apart from the world. It was founded by exiles who destroyed the remnants of Qi nobility in their homeland, and has existed for barely two decades. At this edge of a world nearly forgotten by humankind, can they make the republican proclamation pierce storm and blizzard to reach the shore of hope? Or is all this only another glass-like mirage repeating the Great Revolution of Western Qin in Chang'an?"
 
 PER_FLAVOR_TEXT: "The legend of the Gaochang Li house is known across the continent. Descended from Yuan-era Han military magnates, they served Mongol and Han conquerors as warlords between Kokand and Khiva. Through marriages with old Ilkhan lineages and Muslim nobility, they gained favor with Qin's Anxi command and came to dominate all Iran with Qin troops and allied Muslim warlords. Persian society has long grown used to conquest by many peoples, but the Li house cannot think only of surviving the present. As true heirs of Western Qin and loyal followers of the Prophet, they ought to hold a far grander and more just vision for their dynasty and rule."
 
 MUG_FLAVOR_TEXT: "The Mughal dynasty was once a stout Islamic bastion against the Confucian and Buddhist powers of the East, and even joined all four 'just jihads' against Western Qin. But great empires do not survive on historical glory alone; often they are crushed by the sheer weight of that history. Today's Mughal realm is such a country, with more past than future. Corruption, alcohol, opium, foreign interference, and Southern Ming colonies have pushed its Turco-Mongol ruling bloc toward defeat at an unprecedented speed. Perhaps it should lean further on French aid against the swelling eastern Celestial power - or do the opposite and stand on its own. History, however, will not grant much time for deliberation..."
