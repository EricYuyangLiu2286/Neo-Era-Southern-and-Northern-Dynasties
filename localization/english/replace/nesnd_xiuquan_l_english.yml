 nesnd_xiuquan.1.t:0 "A Saint Proclaimed"
 nesnd_xiuquan.1.d:0 "Hong Xiuquan died on the road, surrounded as usual by the sick and the wounded. His followers buried him where he fell and set a wooden cross over the grave. Within a few years the cross was stone; a few years more and a small house stood beside it, never empty of people come to be healed.\n\nHe wrote no books and built no churches. The investigators sent from Rome had to go county by county, asking questions. They took down hundreds of testimonies. A Wu veteran said he had lain three days in a ravine until Xiuquan found him, following a 'voice'. A Ming army cook said that Xiuquan had sewn his belly shut, and that afterwards even the army's Western surgeon could not believe it. A village woman said her son's fever broke after Xiuquan prayed over him. The investigators carried it all back to Rome.\n\nIn the end the Holy See declared Hong Xiuquan a saint of the Catholic Church.\n\nWhen the news came back, every congregation had its own version. In Gaoliang they say he was a Catholic missionary; along the river they say he was heir to the Nestorians; others insist the foreign Protestants sent him. In the little houses where he is venerated, the crosses on the walls are all of different shapes. Which one is right? The people he saved probably do not care."
 nesnd_xiuquan.1.f:0 "'I asked him how he knew someone was still in that ravine. He said someone had told him. There was nobody in that ravine but me and the dead.'\n- Testimony of a Wu veteran to the canonization inquiry"
 nesnd_xiuquan.1.a:0 "Those he saved will remember him."
