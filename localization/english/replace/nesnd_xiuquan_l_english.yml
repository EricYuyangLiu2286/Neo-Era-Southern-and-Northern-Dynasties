l_english:
 nesnd_xiuquan_journey:0 "The Journey of Brother Xiuquan"
 nesnd_xiuquan_journey_concluded:0 "The Journey of Brother Xiuquan"
 nesnd_xiuquan_journey_reason:0 "Hong Xiuquan is a Hakka and a Catholic missionary, though he preaches only in the village tongue. Behind him walks a crowd no one can quite account for: tenants he cured, soldiers who lost their units, a widow who carries his medicine chest.\n\nThe villages say he hears a voice. It tells him which ravine still holds a living man, which tree in the forest still shelters someone breathing. He carries them out, sets their bones, sews up their bellies, and breaks their fevers. Physicians who examine his patients say such wounds should not have healed.\n\nMost people in this land know of Christ from the tales of the Nestorian Church revived in Western Qin. So some say he preaches the Nestorian faith, some say he brings the foreigners' Protestantism, and some simply call him a monk. He rarely argues. He only asks where the wounded are. When will the people following him work out who he is?"
 nesnd_xiuquan_journey_ended:0 "Hong Xiuquan has died."

 nesnd_xq_status_location:0 "Hong Xiuquan and his followers are in #v [GetGlobalVariable('nesnd_xq_state').GetState.GetName]#! ([GetGlobalVariable('nesnd_xq_state').GetState.GetOwner.GetName]). When the ministry reaches 100, #v 0.1%#! of the local population converts to a Christian faith and ministry progress resets. "
 nesnd_xq_status_expelled:0 "$nesnd_xq_status_location$He was driven out of his last country this month."
 nesnd_xq_status_stayed:0 "$nesnd_xq_status_location$This month's expulsion failed, and radicalism rose in the area."
 nesnd_xq_status_catholic:0 "$nesnd_xq_status_location$The converts he left in #v [GetGlobalVariable('nesnd_xq_convert_state').GetState.GetName]#! joined the Catholic Church."
 nesnd_xq_status_protestant:0 "$nesnd_xq_status_location$The converts he left in #v [GetGlobalVariable('nesnd_xq_convert_state').GetState.GetName]#! took him for a Protestant."
 nesnd_xq_status_orthodox:0 "$nesnd_xq_status_location$The converts he left in #v [GetGlobalVariable('nesnd_xq_convert_state').GetState.GetName]#! took him for an Orthodox monk."
 nesnd_xq_status_nestorian:0 "$nesnd_xq_status_location$The converts he left in #v [GetGlobalVariable('nesnd_xq_convert_state').GetState.GetName]#! took him for a Nestorian."

