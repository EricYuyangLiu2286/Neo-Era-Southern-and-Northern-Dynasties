 nesnd_company.1.t:0 "The Works of Heaven"
 nesnd_company.1.d:0 "The [GetBuildingType('building_tooling_workshop').GetName] of [GetStateRegion('STATE_NANJING').GetName] now make lathes and boiler fittings for mills across the south-east. Several owners have jointly petitioned the government of [ROOT.GetCountry.GetName] for a charter. They propose to pool their capital in a single machine house named after Song Yingxing's book, and ask the treasury to subsidise its first two years. Once chartered, the craftsmen, drawings and orders of every workshop would pass to the one house."
 nesnd_company.1.f:0 "'This house makes lathes, steam engines and every machine for making machines. Shares are taken up by the workshop owners. Public money covers the start-up costs only.'\n- Prospectus of the Tiangong Kaiwu Hong"
 nesnd_company.1.a:0 "Grant the charter and subsidise two years."
 nesnd_company.1.b:0 "There is no hurry. No charter for now."

 nesnd_company.2.t:0 "The Office of Works"
 nesnd_company.2.d:0 "[GetStateRegion('STATE_XIAN').GetName] already has several [GetBuildingType('building_arms_industry').GetName]. The generals of the [SCOPE.gsInterestGroup('nesnd_co_army_ig').GetName] demand that the government of [ROOT.GetCountry.GetName] merge these plants into one company, make every firearm to the pattern of [GetTechnology('rifling').GetName], place it under army supervision and have the treasury subsidise its first two years. Han Chang'an had an Office of Works charged with making weapons. The generals mean to restore that very institution."
 nesnd_company.2.f:0 "'Heaven has its seasons, earth its energies, materials their excellence and craftsmen their skill. Only when these four come together can good work be made.'\n- Rites of Zhou, Record of Trades"
 nesnd_company.2.a:0 "Place it under the army."
 nesnd_company.2.b:0 "The arsenals will not be merged for now."

 nesnd_company.3.t:0 "Tempered a Hundred Times"
 nesnd_company.3.d:0 "The [GetBuildingType('building_iron_mine').GetName] of [GetStateRegion('STATE_CHELYABINSK').GetName] keep growing. The local ironmasters ask the government of [ROOT.GetCountry.GetName] for leave to run mining and smelting as a single concern under the name Hundredfold Steel, and for the treasury to subsidise its first two years."
 nesnd_company.3.f:0 "'Every subscriber may pay for his shares in ore, furnaces or silver. Profits are divided by shares at the end of each year.'\n- Prospectus of Hundredfold Steel"
 nesnd_company.3.a:0 "Approve the merger and subsidise two years."
 nesnd_company.3.b:0 "The merger is not approved for now."

 nesnd_company.4.t:0 "The Royal Road"
 nesnd_company.4.d:0 "The railway from [GetStateRegion('STATE_LIMA').GetName] towards [GetStateRegion('STATE_ICA').GetName], where the old capital of Cuzco stands, has reached the mountains. The surveyors mostly follow the stone-paved royal roads of the Inca, which local people still call the Qhapaq Ñan. Contractors along the line ask the government of [ROOT.GetCountry.GetName] for a charter to form a railway company in the road's name, carry the track to the towns of the highlands, and have the treasury subsidise its first two years."
 nesnd_company.4.f:0 "'From Lima to Cuzco, wherever the old bed of the royal road can be used, this company shall lay its track upon it.'\n- Charter of the Qhapaq Ñan Company"
 nesnd_company.4.a:0 "Grant the charter and subsidise two years."
 nesnd_company.4.b:0 "The charter is withheld for now."

 nesnd_co_transcontinental:0 "Cross the Continent"
 nesnd_co_transcontinental_reason:0 "The territory of [ROOT.GetCountry.GetName] runs from [GetStateRegion('STATE_CALIFORNIA').GetName] on the Pacific shore to [GetStateRegion('STATE_NEBRASKA').GetName] on the Great Plains. Between them lie the deserts of [GetStateRegion('STATE_NEVADA').GetName] and the salt lake of [GetStateRegion('STATE_UTAH').GetName], and goods and settlers still cross the mountains by wagon. Once a railway joins east and west, the western ports and the prairie farms will share one market. Once the line is complete, the contractors of each section can combine into one association to run it."
 nesnd_co_transcontinental_conclusion:0 "The railway now runs from [GetStateRegion('STATE_CALIFORNIA').GetName] to [GetStateRegion('STATE_NEBRASKA').GetName]. The contractors can now found the $company_nesnd_zongguanxian$."

