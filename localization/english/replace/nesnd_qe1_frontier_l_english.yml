 nesnd_qe1_frontier.1.t:0 "Tribal Names in the Register"
 nesnd_qe1_frontier.1.d:0 "The headmen and militia captains of the mountain states have formed a league and submitted a joint petition to the authorities. They ask for their arrears of pay, for leave to try cases in their own script, and for the mosques to be reopened. The petition is not signed 'Han-Qiang'. Each man has set down the name of his own tribe.\n\nWhen Chen Qin advanced westward it enrolled the inhabitants of both flanks of the Hindu Kush as 'Qiang', taught them the Chinese script and settled agriculture, and granted office for military service. For two centuries [GetCulture('pashtun').GetName] headmen have served from father to son as captains of militia and have held the passes for the court. These are the men who have now signed the petition. They hold military commissions, and the militia under them stand on the army's rolls. Since the defeat at Lanzhou in 1821 the main Qin army has stood at Ili, and the authority of [ROOT.GetCountry.GetName] on the frontier is much diminished. The headmen have chosen this moment to change their signature because they mean the court to concede that the tribes of the mountains were never Han-Qiang."
 nesnd_qe1_frontier.1.f:0 "'The Pashtun, Tajik and Hazara tribes have held the passes these two hundred years. We ask henceforth to be entered in the registers under our own names.'\n- Joint petition of the Afghan headmen"
 nesnd_qe1_frontier.1.a:0 "Direct the yamen to examine each request."
 nesnd_qe1_frontier.2.t:0 "The Gathering on the Steppe"
 nesnd_qe1_frontier.2.d:0 "The sultans and biys of the steppe hordes have met in council with the officers of their own peoples in the Anbei cavalry. The council resolved that the pastures enclosed by the military colonies must be returned to the hordes, and that the people of the steppe will no longer style themselves Han-Qiang.\n\nThe Anbei command lies along the line of Ili and the Chu, and its colonies consist chiefly of pastures and herding villages. More than two centuries ago Duke Jing of Chen Qin, by the policy known as 'the whale sweeps the ground', destroyed in pitched battle and long-distance raids the Uzbek Khanate that held the western steppe, and planted Qiang military colonies on its lands. Since then the sons of the hordes have been enrolled in the cavalry and have campaigned with the Qin armies, while the boundary posts of the colonies have advanced steadily into the pastures. The council has raised the name of the Uzbek Khanate again. Many of those present are serving officers of the Anbei command, and the horsemen under them still stand on the court's rolls."
 nesnd_qe1_frontier.2.f:0 "'All pasture taken by the military colonies shall be restored to the hordes. The name Han-Qiang shall no longer be used.'\n- Oath of the steppe council"
 nesnd_qe1_frontier.2.a:0 "Order the Anbei command to find out who leads them."
 nesnd_qe1_frontier.3.t:0 "The Mountains Take Up Arms"
 nesnd_qe1_frontier.3.d:0 "[SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName] has been proclaimed, and the militia battalions of the mountain states no longer obey Ili. The rising is not confined to the hill tribes. Many officers who hold commissions from the court have joined it, and the militia under them have gone over with them.\n\nThe insurgents repudiate the name Han-Qiang and demand a state founded on their own peoples' names and faith. As they see it, two centuries of Chen Qin rule did no more than enter the [GetCulture('pashtun').GetName], [GetCulture('tajik').GetName] and [GetCulture('hazara').GetName] tribes in a single register and then set them to guard the frontier and deliver grain for the Qin who came from the east. [ROOT.GetCountry.GetName] must send an army across the Hindu Kush. The headmen of Transoxiana and the steppe are waiting on the outcome of this war, and if the court cannot win it the name Han-Qiang will be hard to uphold in the other commands."
 nesnd_qe1_frontier.3.f:0 "'From this day the lands south of the Hindu Kush pay no Qin grain and answer no Qin levy.'\n- Proclamation sent by the insurgents to the towns"
 nesnd_qe1_frontier.3.a:0 "Assemble the army and march south against the rebels."
 nesnd_qe1_frontier.4.t:0 "The Steppe Takes Up Arms"
 nesnd_qe1_frontier.4.d:0 "The steppe hordes have risen and proclaimed [SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName]. Most of the horsemen of their peoples in the Anbei battalions have defected, and a considerable number of the [GetCulture('ce_xiyu').GetName] of the colonies have followed them.\n\nThe insurgents demand the return of the pastures enclosed by the military colonies and the expulsion of the colony officers. For two hundred years the Anbei command has relied on the horsemen of these hordes to guard the northern frontier of the empire. Those horsemen are now the court's enemies, and the force on which the command can count is much reduced. The steppe offers no defensible line and the fortified colonies lie far apart, so that each garrison can only hold its own post. If [ROOT.GetCountry.GetName] is to keep the northern frontier, it must defeat in the open field a cavalry that the Anbei command trained itself."
 nesnd_qe1_frontier.4.f:0 "'Let every horde take back its pastures and drive out the colony officers. Those who follow are our people, and those who resist are our enemies.'\n- Summons from the khan's tent to the hordes"
 nesnd_qe1_frontier.4.a:0 "Order the Anbei battalions to hold their posts."
 nesnd_qe1_frontier.5.t:0 "South of the Passes"
 nesnd_qe1_frontier.5.d:0 "Hostilities have ceased and [SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName] has secured its independence. The mountain states no longer render grain or service to Ili, and the passes of the Hindu Kush are held by the troops of the new state.\n\nThe outcome was soon known in every town of Transoxiana. Headmen and captains everywhere have learned that men who repudiated the name Han-Qiang and took up arms against the court compelled Ili in the end to make peace and accept the existing frontier. The registers and titles by which [ROOT.GetCountry.GetName] bound the peoples of the Western Regions together have been openly cast aside in the mountains. The headmen of the other commands will not overlook the precedent, and the authority of the court on the frontier will decline further because of it."
 nesnd_qe1_frontier.5.f:0 "'The two states lay down their arms and each keeps the line it holds.'\n- Instrument of armistice"
 nesnd_qe1_frontier.5.a:0 "Put the remaining garrisons in order."
 nesnd_qe1_frontier.6.t:0 "The Steppe Changes Hands"
 nesnd_qe1_frontier.6.d:0 "Hostilities have ceased and [SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName] is in possession of the steppe. The military pastures that the Anbei command administered for more than two hundred years have passed out of the jurisdiction of Ili, and the [GetCulture('ce_xiyu').GetName] who remain in the colonies are henceforth subjects of the khanate.\n\nDuke Jing of Chen Qin destroyed the khanate of the steppe so that the empire should have no nomad court on its northern side. The name of that khanate now stands on the steppe again, and the men who lead it are officers from the Anbei cavalry. Nothing covers Ili to the north, and [ROOT.GetCountry.GetName] must lay out a new line of defence. The court has also a question to answer: why did two hundred years of colonies and instruction not make the hordes of the steppe into Qin?"
 nesnd_qe1_frontier.6.f:0 "'The two states lay down their arms and each keeps the line it holds.'\n- Instrument of armistice"
 nesnd_qe1_frontier.6.a:0 "Strengthen the line north of Ili."
 nesnd_qe1_frontier.7.t:0 "The Mountains Pacified"
 nesnd_qe1_frontier.7.d:0 "The rising in the mountains has been suppressed and its states are again under the jurisdiction of Ili. The command has punished the headmen who led it and has taken no proceedings against the militia who followed them. The battalions are entered on the army's rolls as before.\n\nThe war has shown that [ROOT.GetCountry.GetName] can still send an army across the Hindu Kush. The command judges that the frontier is unlikely to rise again within ten years. The demands of the insurgents, however, did not disappear with their defeat. The name Han-Qiang was preserved by this war, and the rule of the court in the mountains can henceforth rest only on its garrisons."
 nesnd_qe1_frontier.7.f:0 "'The ringleaders are dealt with and those they forced will not be pursued. Every battalion is to answer the roll as usual.'\n- Notice of the command to the population"
 nesnd_qe1_frontier.7.a:0 "Reorganise the southern battalions."
 nesnd_qe1_frontier.8.t:0 "The Steppe Pacified"
 nesnd_qe1_frontier.8.d:0 "The rising on the steppe has been suppressed and its states are again under the jurisdiction of Ili. The bounds of the military colonies have been restored. The Anbei command has punished the sultans who led the rising. The other hordes pay their dues as before, and the horsemen who defected have been entered on the rolls again.\n\nThe Qin army has once more defeated the cavalry of the steppe in the open field, and the name of the khanate has been abolished. The command judges that the steppe is unlikely to rise again within ten years. The dispute between pasture and colony, however, has not been settled by this. The hordes still repudiate the name Han-Qiang, and that claim has outlived the khanate."
 nesnd_qe1_frontier.8.f:0 "'The ringleaders are dealt with and those they forced will not be pursued. Every horde is to pay its dues as usual.'\n- Notice of the Anbei command to the population"
 nesnd_qe1_frontier.8.a:0 "Draw up the Anbei rolls afresh."
 nesnd_qe1_frontier.9.t:0 "Alarm in Transoxiana"
 nesnd_qe1_frontier.9.d:0 "The [GetCulture('turkmen').GetName] tribes and the invested chief of Khiva have risen in succession and no longer obey Ili. Two columns have set out, one from the Karakum and one from Khwarazm, and both are advancing on Transoxiana.\n\nThe wars on the frontier and the decline of the court's authority have persuaded the chiefs of these lands that the time has come to break with Ili. Chen Qin regarded the country west of the Pamirs as rich ground fit for the plough. The towns of Transoxiana were among the first lands it took, and it was from here that the Ningqiang garrison entered Samarkand. [ROOT.GetCountry.GetName] can no longer treat the war on the frontier as a local disturbance. The court now faces at one time several enemies who have founded states in the names of their own peoples, and if Kangguo is lost the rule of the empire west of the Pamirs cannot be maintained."
 nesnd_qe1_frontier.9.f:0 "'The rebels come by two roads, one out of the Black Sands and one out of Khwarazm. Send relief at once.'\n- Dispatch from the commander at Kang"
 nesnd_qe1_frontier.9.a:0 "Kang must not be lost."
 nesnd_qe1_frontier.10.t:0 "Fergana Takes Up Arms"
 nesnd_qe1_frontier.10.d:0 "The headmen of Fergana have risen under the name of Kokand. The towns of the valley have shut their gates, the post roads are cut, and the valley no longer obeys Ili.\n\nThe Fergana valley lies between the Tian Shan and the Pamirs and is the main road from Ili to Transoxiana. The [GetCulture('turkmen').GetName] tribes and Khiva rose first and the headmen of the valley have followed them, so that the commands of [ROOT.GetCountry.GetName] west of the Pamirs are now cut off from one another. These insurgents also repudiate the name Han-Qiang, and the name they have raised is an old one of their own country. Unless the court recovers the valley quickly, the reinforcement of Transoxiana will be gravely hindered."
 nesnd_qe1_frontier.10.f:0 "'The towns of the valley have shut their gates and the post road is closed.'\n- Dispatch from the frontier"
 nesnd_qe1_frontier.10.a:0 "Send troops to suppress them."
 nesnd_qe1_frontier.11.t:0 "Arrears"
 nesnd_qe1_frontier.11.d:0 "The militia battalions of the mountains have submitted a joint petition stating that their pay has long gone unissued in full and asking the court to make it good. The captains who head the list are all of local headmen's families.\n\nThe militia are the principal force of [ROOT.GetCountry.GetName] in the mountains. They are raised from the sons of the local tribes, and in ordinary times they hold the passes and keep order in the districts. When the men go long without their full pay the captains can hardly control them, and the standing of the headmen among their own people suffers with it. If the court issues the money the treasury must bear the charge. If it does nothing, the resentment in the battalions will turn upon the court."
 nesnd_qe1_frontier.11.f:0 "'The sons of this camp bear arms on empty stomachs, and we fear the court will not be the better for it.'\n- Petition of the southern militia battalions"
 nesnd_qe1_frontier.11.a:0 "Issue the arrears in full from the treasury."
 nesnd_qe1_frontier.11.b:0 "The command is itself in arrears. Payment is deferred."
 nesnd_qe1_frontier.12.t:0 "Boundary Posts"
 nesnd_qe1_frontier.12.d:0 "The Anbei colonies have again extended their cultivation northward this year, and the newly broken ground is the winter pasture of [GetCulture('kazak').GetName] clans. The colony heads hold the court's reclamation order. The herdsmen maintain that the pasture has come down to them from their forefathers. Neither side will give way, and the case has been referred to Ili.\n\nThe order provides that soldier households may claim unowned waste land and that it becomes liable to land tax after three years. As the colony heads see it, herdsmen follow water and grass, arrive in winter and leave in spring, and such ground plainly has no owner. The herdsmen camp there only in the winter months, and without a winter pasture their herds cannot live through the season. [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] have always been the gainers by the extension of the colonies, and they ask the court to uphold the law as it stands. The sultans of the hordes regard the case as proof of whether the court has any care for their livelihood."
 nesnd_qe1_frontier.12.f:0 "'Military households may register and break any land without an owner, and it shall be taxed from the third year.'\n- The court's order on new ground"
 nesnd_qe1_frontier.12.a:0 "The reclamation order stands."
 nesnd_qe1_frontier.12.b:0 "Withdraw the boundary posts and restore the pasture."
 nesnd_qe1_frontier.13.t:0 "The Converts"
 nesnd_qe1_frontier.13.d:0 "The surveillance office reports that the [GetCulture('ce_xiyu').GetName] of the frontier have in recent years returned in large numbers to the faith of their forefathers. Some of them have registered a dharma name at a monastery and also pray at the akhund's house. Others have placed themselves under [GetReligion('shiite').GetName] teachers from Persia.\n\nAfter Chen Qin enrolled the inhabitants of Transoxiana, the steppe and the mountains as Qiang, they were entered in the household registers as Buddhists, and the monastic register became part of what it meant to be Han-Qiang. For two centuries the old faith was handed down in private, at home and in the villages. Since the authority of the court declined the converts have grown more numerous. [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] urge that the schools be closed and the teachers prosecuted, so as to uphold the law of the court. The converts, however, pay their grain and render their service as before, and many of them are soldier households with the colours. Proceedings against them would touch the recruiting of every battalion on the frontier."
 nesnd_qe1_frontier.13.f:0 "'Of the military households examined, three or four in ten are entered as Buddhist and practise Islam in private.'\n- Report of the surveillance office"
 nesnd_qe1_frontier.13.a:0 "Close the prayer halls and prosecute the teachers."
 nesnd_qe1_frontier.13.b:0 "The court does not inquire into the faith of those who render grain and service."

