l_english:
 # Western Qin: The Frontier Peoples
 nesnd_qe1_frontier_journal:0 "The Frontier Peoples"
 nesnd_qe1_frontier_journal_reason:0 "When Chen Qin advanced westward it enrolled the inhabitants of Transoxiana, the steppe and both flanks of the Hindu Kush as 'Qiang', taught them the Chinese script and settled agriculture, and admitted them to office through military service. Over the two centuries that followed, [GetCulture('pashtun').GetName] headmen served as captains of militia and [GetCulture('kazak').GetName] sultans commanded the cavalry of the Anbei command. Their sons studied Chinese letters, followed Qin custom and were entered in the household registers as Han-Qiang.\n\nAfter the defeat at Lanzhou in 1821 the Qin army withdrew to Ili, and the authority of the court declined with it. The faith and culture of the frontier Han-Qiang have long been suppressed, their people remain poor, and in office and in the army they rank below the Old Qin. Their headmen command battalions and hold commissions from the court. They have begun to repudiate the name Han-Qiang and to demand the restoration of their own peoples' names and faiths."
 nesnd_qe1_frontier_journal_lobby:0 "Chen Qin enrolled the inhabitants of Transoxiana, the steppe and both flanks of the Hindu Kush as 'Qiang' and admitted them to office through military service. Two centuries later $nesnd_lobby_name_qe1$ has withdrawn to Ili, and the authority of the court has declined. The faith and culture of the frontier Han-Qiang have long been suppressed, their people remain poor, and in office and in the army they rank below the Old Qin. Their headmen command battalions and hold commissions from the court. They have begun to repudiate the name Han-Qiang and to demand the restoration of their own peoples' names and faiths."
 nesnd_qe1_frontier_status_quiet:0 "The frontier battalions remain at their stations."
 nesnd_qe1_frontier_status_stirring:0 "The headmen and captains are in correspondence with one another. Once a separatist movement reaches #v 75%#! radicalism, a rising begins to gather."
 nesnd_qe1_frontier_status_war:0 "The frontier is at war."
 nesnd_qe1_frontier_done_conclusion:0 "The fate of the frontier peoples has been settled."
 nesnd_qe1_frontier_done_tt:0 "Afghanistan and the steppe are both settled, or neither is under our direct rule any longer"

