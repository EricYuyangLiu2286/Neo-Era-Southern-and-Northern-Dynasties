 # The Persian generalship: Which Way the Generalship Turns
 nesnd_per_stance_journal:0 "Which Way the Generalship Turns"
 nesnd_per_stance_journal_reason:0 "[ROOT.GetCountry.GetName] renders tribute to Ili because the Qin army still commands respect in Khorasan. Should Western Qin lose its frontiers one after another, the generalship will have no further reason to acknowledge Ili as its suzerain. The staff is weighing two courses: to send troops in aid of Qin and extend its own power westward with Qin support, or to seize the occasion and declare independence."
 nesnd_per_stance_journal_lobby:0 "$nesnd_lobby_name_per$ renders tribute to Ili because the Qin army still commands respect in Khorasan. Should Western Qin lose its frontiers one after another, the generalship will have no further reason to acknowledge Ili as its suzerain. The staff is weighing two courses: to send troops in aid of Qin and extend its own power westward with Qin support, or to seize the occasion and declare independence."
