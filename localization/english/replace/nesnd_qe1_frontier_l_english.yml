 nesnd_per_stance_endings_tt:0 "At #v 80#! Loyalty, if no strategy has yet been chosen, the generalship adopts the western strategy and expands westward with the support of $nesnd_lobby_name_qe1$. At #v 100#!, while $nesnd_lobby_name_qe1$ is fighting frontier rebels, the generalship sends troops to help put them down, Loyalty falls back to #v 70#! and no further troops are sent for three years.\nAt #v 0#! Loyalty, when not at war, the generalship breaks away from $nesnd_lobby_name_qe1$ and, if no strategy has yet been chosen, turns east.\nFrom #v 60#! Loyalty, $nesnd_lobby_name_qe1$ sends help from time to time."
 nesnd_per_stance_closed_tt:0 "If no strategy has yet been chosen, the eastern strategy is adopted."
 nesnd_per_stance_lean_qin_button:0 "Send Envoys to Ili"
 nesnd_per_stance_lean_qin_button_desc:0 "Send envoys to declare that the forces of Khorasan are at the disposal of Ili."
 nesnd_per_stance_lean_qin_tt:0 "Loyalty rises by #g 1#! each month until we turn to receiving envoys from the frontier."
 nesnd_per_stance_lean_out_button:0 "Receive Envoys from the Frontier"
 nesnd_per_stance_lean_out_button_desc:0 "Receive the envoys of the Afghan and steppe tribes and hear their representations."
 nesnd_per_stance_lean_out_tt:0 "Loyalty falls by #r 1#! each month until we again send envoys to Ili."
 nesnd_per_stance.2.t:0 "Persia Withholds Its Tribute"
 nesnd_per_stance.2.d:0 "$nesnd_lobby_name_per$ sent no tribute mission this year and has declared in full court that it no longer owes allegiance to Ili.\n\nThe Persian generalship was one of the four great commands of Chen Qin, and in 1821 it was ordered east together with the Anbei, Anxi and Annan commands. After the defeat at Lanzhou it continued to acknowledge Ili as its suzerain because the Qin army still commanded respect in Khorasan. The generalship has now concluded that [ROOT.GetCountry.GetName] can no longer attend to the west and has resolved to act for itself. Henceforth the orders of the Persian army do not issue from Ili. The news has reached the mountains, where the headmen who favour breaking with the court have gained a neighbour to whom they can turn."
 nesnd_per_stance.2.f:0 "'From this day the orders of our army come from our own court.'\n- Edict proclaimed at the Persian court"
 nesnd_per_stance.2.a:0 "Redeploy the defences of the south-western frontier."
 nesnd_per_stance.3.t:0 "Auxiliaries from Khorasan"
 nesnd_per_stance.3.d:0 "$nesnd_lobby_name_per$ has sent troops to help put down the rising. Its cavalry have reached the mountains and joined the court's army.\n\nIn name the generalship is discharging the duty of a vassal, and its marching orders state that the battalions stand at the disposal of Ili. There have long been men in its council who urged that it should use the troubles of Western Qin to make itself independent. This expedition shows that the party which would rather use the strength of Western Qin to extend Persian power westward has prevailed. The arrival of the Persian auxiliaries has greatly strengthened the court's army in the mountains, and the insurgent tribes have lost ground accordingly. The generalship expects the support of [ROOT.GetCountry.GetName] when it later takes the field in the west."
 nesnd_per_stance.3.f:0 "'Ordered to march east with horse and foot and to await the commands of Ili.'\n- Marching orders of the Persian generalship"
 nesnd_per_stance.3.a:0 "Issue a commendation."
 nesnd_per_stance_broke_tt:0 "Unity falls by #r 5#!, and unrest in the mountains rises by #r 10#!."
 nesnd_per_stance_aid_tt:0 "For three years our armies gain #g +10%#! offence and military goods cost #g 10%#! less. Unrest in the mountains falls by #g 20#!."
 nesnd_qe1_fr_src_shia:0 "Shia teachers"
