l_english:
 nesnd_kr_restoration:0 "Korean Restoration Movement"
 nesnd_kr_restoration_reason:0 "The government in Seoul has fallen. The county clerks still have their land registers. Foreign officials need them to collect taxes; local delegates use the same pages to find households willing to supply grain, money and recruits. Several powers may divide Korea between them. None can answer the petition for all the others."
 nesnd_kr_restoration_concluded:0 "Korean Restoration Movement"
 nesnd_kr_concluded:0 "Korea is sovereign and governs every homeland state where Korean communities remain."
 nesnd_kr_extinct:0 "No inhabitants of Korean culture or heritage remain in the Korean homeland."
 nesnd_kr_success:0 "A sovereign Korean government holds every inhabited Korean community in the homeland, and the restoration contest is settled"
 nesnd_kr_pressure_bar:0 "Pressure for restoration"
 nesnd_kr_pressure_desc:0 "Pressure: [GetGlobalVariable('nesnd_kr_pressure').GetValue|1]/100   Last monthly change: [GetGlobalVariable('nesnd_kr_delta').GetValue|=+2]"
 nesnd_kr_breakdown:0 "Administration by country (hover for the monthly breakdown)"
 nesnd_kr_row:0 "[Country.GetName]: [Country.MakeScope.Var('nesnd_kr_count').GetValue|K] people   Share: [Country.MakeScope.Var('nesnd_kr_share').GetValue|1%]   Contribution: [Country.MakeScope.Var('nesnd_kr_sum').GetValue|=+2]"
 nesnd_kr_row_tt:0 "Korean homeland population under [Country.GetName]: [Country.MakeScope.Var('nesnd_kr_count').GetValue|K]\nLocal organising: +0.25\nTreatment of Korean communities: [Country.MakeScope.Var('nesnd_kr_rights').GetValue|=+2]\nSpeech and representation: [Country.MakeScope.Var('nesnd_kr_voice').GetValue|=+2]\nLocal turmoil: [Country.MakeScope.Var('nesnd_kr_unrest').GetValue|=+2]\nCouncils or police orders: [Country.MakeScope.Var('nesnd_kr_orders').GetValue|=+2]\nLast month's sum × population share ([Country.MakeScope.Var('nesnd_kr_share').GetValue|1%]): [Country.MakeScope.Var('nesnd_kr_sum').GetValue|=+2]. People under the Korean government carry no foreign weight."
 nesnd_kr_stateless:0 "No Korean government has formed. At 75 pressure, the largest eligible Korean community petitions for restoration."
 nesnd_kr_subject:0 "A Korean government exists under a suzerain. It must obtain independence through diplomacy or an independence play."
 nesnd_kr_reunite:0 "A Korean government has formed. Other holders can return their own Korean territories."
 nesnd_kr_petition:0 "A petition from territory held by [GetGlobalVariable('nesnd_kr_target').GetCountry.GetName] awaits an answer. The deadline is 90 days."
 nesnd_kr_mobilizing:0 "The petition has gone unanswered or been refused. Mobilisation: [GetGlobalVariable('nesnd_kr_months').GetValue|0]/12 months; it pauses below 75 pressure. The Korean government cannot open a new contest while subject or under truce."
 nesnd_kr_fighting:0 "The restoration demand has reached a diplomatic play. Concessions or an enforced war goal will decide the territory."
 nesnd_kr_recognize:0 "Negotiate restoration and cession"
 nesnd_kr_recognize_desc:0 "Invite a Korean government to take over our district offices."
 nesnd_kr_deal_gate:0 "Hold a Korean community in the homeland; governments concerned are at peace and the territory is uncontested"
 nesnd_kr_at_peace:0 "No restoration war is underway; a subject may petition only outside a pending case or setback"
 nesnd_kr_deal_tt:0 "Return the holder’s own Korean homeland territory. Establish a Korean government locally if none exists. A subject needs its suzerain’s consent."
 nesnd_kr_reform:0 "Convene district councils"
 nesnd_kr_reform_desc:0 "Let the districts choose who accounts for their grain and taxes."
 nesnd_kr_reform_tt:0 "For 12 months, reduce local pressure by 0.5 per month before population weighting."
 nesnd_kr_suppress:0 "Disperse restoration societies"
 nesnd_kr_suppress_desc:0 "Seize the rolls and summon the district organisers."
 nesnd_kr_suppress_tt:0 "For 12 months, reduce local pressure by 1 per month before weighting. In controlled Korean states with Korean residents, 5% of the population turns towards radicalism."
 nesnd_kr_action_gate:0 "Control a homeland community, have funds available and finish any previous local measure"
 nesnd_kr_councils:0 "District councils"
 nesnd_kr_police:0 "Ban on assemblies"
 nesnd_kr_registers:0 "Restored land registers"
 nesnd_kr_muster:0 "District musters"
 dp_nesnd_kr_restoration:0 "Contest for Korea"
 wg_nesnd_kr_restoration:0 "Korean restoration settlement"
 wg_nesnd_kr_restoration_desc:0 "A Korean victory returns the opponent’s homeland holdings. A defending victory restores the territory detached to raise this uprising."
 nesnd_kr_refuse_tt:0 "Mobilisation takes 12 qualifying months at 75 pressure or higher."
 nesnd_kr.1.t:0 "A register without a government"
 nesnd_kr.1.d:0 "The seals of the Korean offices have changed hands. County clerks still draw up their rolls. A second copy now passes from village to village: beside each name the organisers note a guarantor or a contribution towards sending a petition to every power holding Korean land."
 nesnd_kr.1.a:0 "Receive their memorial."
 nesnd_kr.2.t:0 "A petition for the county seals"
 nesnd_kr.2.d:0 "The Korean delegates have listed the districts whose administration they seek. They ask for authority over revenue and garrisons. Below the petition are the names of villages prepared to send men should negotiations fail."
 nesnd_kr.2.a:0 "Hand over the district offices."
 nesnd_kr.2.b:0 "The seals stay here."
 nesnd_kr.3.t:0 "The settlement"
 nesnd_kr.3.d:0 "Messengers have brought the terms back to the districts. Clerks settle their accounts and the garrisons take their posts along the agreed line. Districts held by other powers remain a matter for separate negotiations."
 nesnd_kr.3.a:0 "Record the terms."
 nesnd_kr.4.t:0 "A government of their own"
 nesnd_kr.4.d:0 "The county registers have reached a single government at last. Korean officials can now levy taxes, summon troops and conclude treaties under their own seal."
 nesnd_kr.4.a:0 "Affix the seal."
 nesnd_kr.5.t:0 "Opening the offices"
 nesnd_kr.5.d:0 "The revenue clerks and the officers arrived together. One delegation wants the districts to restore their land rolls; the other wants a muster before pay is sent to soldiers who may exist only on paper. Which takes precedence?"
 nesnd_kr.5.a:0 "First account for the land tax."
 nesnd_kr.5.b:0 "First muster the troops."
 dp_nesnd_kr_restoration_desc:0 "$wg_nesnd_kr_restoration_desc$"
 dp_nesnd_kr_restoration_tooltip:0 "$wg_nesnd_kr_restoration_desc$"
 war_goal_wg_nesnd_kr_restoration:0 "$wg_nesnd_kr_restoration$"
 war_goal_wg_nesnd_kr_restoration_desc:0 "$wg_nesnd_kr_restoration_desc$"
