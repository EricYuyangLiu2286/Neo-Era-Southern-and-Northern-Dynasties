 ig_soldier_officials_desc: "Qin was once a semi-representative monarchical military state led by soldier-officials and troops, but modern politics no longer permits landholders to monopolize the army. The rank-and-file soldiery class has faded, leaving only the elite soldier-officials."
 ig_qin_aristocrats_desc: "Qin's aristocracy is an alliance of major landowners, decorated military men, and old nobility."
 ig_ce_mongol_landowners_desc: "Mongol nomadic tribes still retain nobility that serves as local administrators in organized nomadic polities, replacing the chiefs and clan heads of more primitive tribal structures. Some lineages can even be traced back to warriors of Genghis Khan's era."
 ig_ce_mongol_warboss_desc: "Mongol nobles who preserve power amid harsh environments and long internal-external conflict are one in ten thousand. Their support represents ancient Mongol tradition."
 ig_cne_xungui_desc: "The Chinese Empire is, in many ways, a progressive form of the ideal Qin-style empire. The officer corps that supported the Mu imperial project earned great merit and thus obtained corresponding power and land."
 ig_xibei_literati_desc: "After the Western Qin Revolution, northern scholars no longer resembled traditional literary gentry; they became a group grounded in practical science and practical politics."
 
