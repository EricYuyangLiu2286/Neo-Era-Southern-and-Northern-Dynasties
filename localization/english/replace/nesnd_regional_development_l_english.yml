l_english:
 nesnd_rg_pru:0 "Where the Railways Reach"
 nesnd_rg_pru_reason:0 "Prussian officers calculate marching times; Silesian manufacturers calculate the cost of sending coal and iron to Berlin. Both want railways, though they may disagree over which lines deserve support. Connecting these regions would give the country a firmer foundation than diplomatic promises alone."
 nesnd_rg_aus:0 "Beyond Vienna"
 nesnd_rg_aus_reason:0 "The Hungarian question has reached a settlement, but debate across the country continues. Scholars in Prague seek support for their schools, while officials in Vienna want provincial administrations capable of carrying out common policies. New investment will help determine how the central government holds together provinces with different languages and interests."
 nesnd_rg_tur:0 "Commerce after Reform"
 nesnd_rg_tur_reason:0 "The Tanzimat has left laws and unfulfilled ambitions. Coastal merchants want to move their goods; provincial officials complain of inadequate revenues. If the country is to escape its dependence on debt and the costs of war, its ports and administration must sustain more than promises of reform."
 nesnd_rg_egy:0 "Workshops of the Nile"
 nesnd_rg_egy_reason:0 "Cotton travels down the Nile to the coast, while imported cloth makes the return journey. The army and government tax this commerce, but Egyptian craftsmen want workshops of their own. The development of schools, textiles and ports will shape Egypt's room for manoeuvre among its neighbours and foreign powers."
 nesnd_rg_mex:0 "Mexico's Provinces"
 nesnd_rg_mex_reason:0 "The capital has established its authority, yet its decisions often fail to reach the provinces. Roads controlled by military strongmen, schools without funds and workshops dependent on imported tools consume the hopes left by independence. The provinces need visible improvements, and the government needs people who can carry them through."
 nesnd_rg_usa:0 "Life after Emancipation"
 nesnd_rg_usa_reason:0 "Slavery has been abolished in law, but labour and landholding in the South will not be transformed by proclamation alone. Freed people need schools and work. Merchants want transport restored, while former slaveholders seek to preserve local power. Celebrations of freedom cannot settle these questions."
 nesnd_rg_peu:0 "The Andes and the Coast"
 nesnd_rg_peu_reason:0 "Lima's merchants look out to sea, while miners in the interior must first contend with mountain roads. The cost of bringing ore to market shapes wages, profits and provincial revenues. Peru needs connections between its mines and ports, and people capable of running them."
