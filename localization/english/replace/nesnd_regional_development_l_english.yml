 nesnd_rg_technical_schools:0 "Schools of Mining and Engineering"
 nesnd_regional.1.t:0 "An Argument at the Station"
 nesnd_regional.1.d:0 "Trains from Silesia bring coal and iron to Berlin, along with new petitions. The railway companies want the government to back trunk-line freight; the manufacturers want to build more machines and tools. The officers naturally favour more carrying capacity, though they have worked out a separate military use for every station."
 nesnd_regional.1.a:0 "Let the railways carry more."
 nesnd_regional.1.b:0 "Our workshops need their own machinery."
 nesnd_regional.2.t:0 "Voices from the Provinces"
 nesnd_regional.2.d:0 "Provincial schools are beginning to turn out a new generation of teachers and clerks. Some want them kept at home; others want them drawn into Vienna's bureaucracy. Both sides say they are serving the country. At bottom, the question is whether the money for education stays in the provinces, or the people who do the work go to the centre."
 nesnd_regional.2.a:0 "Support education in the provinces."
 nesnd_regional.2.b:0 "Strengthen the central administration."
 nesnd_regional.3.t:0 "Ledgers from the Coast"
 nesnd_regional.3.d:0 "The port's shipping returns and the tax office's ledgers are starting to show what the investment has achieved. Merchants ask the government to keep its money in shipping; treasury officials say this is the moment to put the administration in order. Emergency levies are no way to run a country for long."
 nesnd_regional.3.a:0 "Support the ports and their commerce."
 nesnd_regional.3.b:0 "Put administration on a lasting footing."
 nesnd_regional.4.t:0 "More than Cotton"
 nesnd_regional.4.d:0 "Egypt's workshops can now weave more of the country's cotton into cloth. The manufacturers want to expand production, but the schoolteachers warn the court that if reading and skills stay in the hands of a few, the new industries will soon run short of hands again."
 nesnd_regional.4.a:0 "Help the textile workshops expand."
 nesnd_regional.4.b:0 "Schools must keep pace with industry."
 nesnd_regional.5.t:0 "The Capital and the States"
 nesnd_regional.5.d:0 "The provincial schools, ports and workshops have all shown results. The state representatives want to keep the money flowing to the provinces; the government in the capital wants to use these achievements to shore up its authority."
 nesnd_regional.5.a:0 "Continue the local works."
 nesnd_regional.5.b:0 "Make this a foundation for public confidence."
 nesnd_regional.6.t:0 "A School and a Railway"
 nesnd_regional.6.d:0 "Schools and transport in the South are showing some signs of life. Those who broke free of bondage want the chance to learn, and the business interests are urging the Union to keep supporting the railways. Abolishing slavery was only the beginning."
 nesnd_regional.6.a:0 "Widen access to education."
 nesnd_regional.6.b:0 "Support the South's railways."
 nesnd_regional.7.t:0 "From the Mines to Lima"
 nesnd_regional.7.d:0 "Railways now link part of the mining country to the coast, and Lima's merchants have begun to talk of bigger investments. The mine owners want to expand while the going is good; the engineers worry that without enough skilled men, the new machinery will simply stand idle."
 nesnd_regional.7.a:0 "Help the mines increase production."
 nesnd_regional.7.b:0 "Train people to master these techniques."
 nesnd_regional.unavailable:0 "Circumstances no longer permit this arrangement."
 nesnd_regional.8.t:0 "Unfinished Works"
 nesnd_regional.8.d:0 "This round of improvements was never finished as hoped. Schools, industry and transport are as pressing as ever, but the hopes that gathered around the programme have melted away. What was built still stands, and the promises that were broken are still remembered."
 nesnd_regional.8.a:0 "The work before us remains."
