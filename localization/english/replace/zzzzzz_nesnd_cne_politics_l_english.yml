l_english:
 nesnd_land_disorder_bar_desc: "Local disorder: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_reform_politics_tt Cabinet and disorder#!#!"
 nesnd_reform_politics_tt: "#bold Cabinet and local disorder#!\nAfter the land-rights requirements are met, a powerful Landowner [concept_interest_group] in government with [concept_approval] at most #v −5#! adds #n 0.25#! disorder each month.\n\nA powerful Rural Folk, Industrialist, or Intelligentsia group in government with approval at least #v 5#! reduces monthly disorder by #p 0.25#!. Multiple qualifying groups grant this reduction once. Both effects can apply together.\n\n[Concept('concept_unemployed','$concept_unemployment$')], living standards, education, and administration still determine reform outcomes. War, the penalty period following [concept_bankruptcy], and prolonged hardship retain their existing effects."
