l_english:
 sold_alaska_tt: "We have sold our holdings in Aixue."
 not_sold_alaska_tt: "We have yet to sell our holdings in Aixue."
 alaska_transaction_ongoing_tt: "No country is currently making an offer for #b Aixue#!"
 notification_alaska_negotiations_fail_name: "Offer for Aixue refused"
 notification_alaska_negotiations_fail_desc: "[SCOPE.sCountry('alaska_buyer').GetName] has backed out of the negotiations for the sale of Aixue. The territory will remain under our control until another attempt is made."
 je_sale_of_alaska: "The Sale of Aixue"
 je_sale_of_alaska_reason: "With the coast of Aixue under threat, officials have urged the [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] to find a buyer for the holdings our country and its subjects govern there."
 je_sell_alaska_button_desc: "Defending our holdings in Aixue is growing costly. We can seek a buyer for them."
 selling_alaska_tt: "The buyer will acquire the holdings of the seller and its subjects in Aixue, pay the purchase price, and improve [concept_relations] with the seller."
 je_buy_alaska_button: "Make an Offer for Land in Aixue"
 je_buy_alaska_button_desc: "We can offer to purchase the lands a friendly country and its subjects hold in Aixue."
 sale_of_alaska_happened: "The Sale of Aixue has happened"
 usa_purchase_alaska: "Negotiate the Aixue Purchase"
 usa_purchase_alaska_desc: "Though some doubt the strategic and economic value of the vast expanses of Aixue, we should not pass up the opportunity to push the frontiers of liberty."
 alaska.1.t: "An Offer for Aixue"
 alaska.1.d: "[SCOPE.sCountry('alaska_buyer').GetName] has offered to buy the lands we and our subjects hold in Aixue."
 alaska.1.b: "Aixue may hide riches yet."
 alaska.2.t: "The Aixue Purchase"
 alaska.2.d: "[SCOPE.sCountry('alaska_seller').GetName] has accepted our offer. The treaty cedes the lands held by the seller and its subjects in Aixue to us."
 alaska.3.t: "Failed Aixue Purchase"
 alaska.3.d: "We have failed to reach an agreement with [SCOPE.sCountry('alaska_seller').GetName] over the purchase of its holdings in Aixue."
 alaska.4.t: "An Offer for Aixue"
 alaska.4.d: "[SCOPE.sCountry('alaska_seller').GetName] is struggling to defend its holdings in Aixue and appears willing to entertain an offer."
 je_alaska: "The Acquisition of Aixue"
 je_alaska_reason: "Situated in the far North, Aixue is a vast, uncharted territory that may hold many riches. Acquiring the territory will expand our borders greatly, advance our national prestige, and allow for dominating trade in the northern Pacific. "
 alaska_usa_big_money: "Paying for Aixue - Large Payments"
 alaska_usa_medium_money: "Paying for Aixue - Moderate Payments"
 alaska_usa_small_money: "Paying for Aixue - Meager Payments"
 alaska_rus_big_money: "Sale of Aixue - Large Payments"
 alaska_rus_medium_money: "Sale of Aixue - Moderate Payments"
 alaska_rus_small_money: "Sale of Aixue - Meager Payments"
 achievement_quiet_flows_the_yukon_tt: "Establish a [GetBuildingType('building_cossack_host').GetName] in Yujing, Shuohai, or Linmang Aixue."
