l_english:
 YAN:0 "Great Yan"
 YAN_ADJ:0 "Great Yan"
 YAN_FLAVOR_TEXT:0 "In 1824 the Mu armies destroyed the ancestral temples and altars of the Yan dynasty. A collateral branch of the house of Xu has now restored the court in Songjiang. It depends on the old Yan officers in the forests, the Jurchen chiefs of the camps, and the landless men and deserters who drifted north after the land revolution."
 nesnd_sha_yan_xu:0 "Xu"
 nesnd_sha_yan_jingheng:0 "Jingheng"
 nesnd_sha_restore_yan:0 "The Road to the Restoration of Yan"
 nesnd_sha_restore_yan_reason:0 "In 1822 Mu Zhongtang suffered defeat on his southern campaign. On his return he pressed ahead with plans for conquest elsewhere. The following year Xu Dingyuan, the Lie Emperor of Eastern Yan, died. Emperor Mu sent his generals Zhang Baili and Hua Yiguan east and north. Six months on campaign through the wilderness brought the ancestral shrines of Yan down at last. The expedition swept away the imperial house at Fengtian and dealt harshly with the Jurchen and Han warlords along its march who had acknowledged Yan.\n\nSince Xu Qiye first established his seat at Tianjin, successive rulers of his house had campaigned on the steppe and in the northeast. For more than four hundred years their authority reached into the snowy forests of Liaodong. Their rule was often rough and inattentive. They faced banditry and rebellion enough, yet some local commanders had good reason to remain loyal. Zhang Baili’s purge barely grazed the surface of that vast country. The Mu regime was itself too unsteady to do more. Some of the northern Yan forces crossed the sea to Southern Ming, others fled to the Greater Khingan. Then came the land revolution. Deserters and men ruined by the loss of their estates stole north and fortified camps in the wooded valleys, each with purposes of his own. The understaffed authorities in the northeast could scarcely govern them.\n\nFor the republic and the men of Yan to restore the dynasty in the northeast will take more than ardour. Grain, arms, ammunition and money go without saying. They must bring the enemies of Mu inside and beyond the northeast into concert. There is also the question of how to divide the spoils if they win, and where to run if they lose."
 nesnd_sha_yan_banner:0 "The Yan Banner"
 nesnd_sha_yan_banner_desc:0 "Yan banner #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_sha_yan_at_war:0 "[JournalEntry.GetCountry.MakeScope.Var('nesnd_sha_yan_north').GetCountry.GetName] is at war"
 nesnd_sha_yan_at_war_korea:0 "The government in Bianliang is at war"
 nesnd_sha_yan_disorder_low:0 "Land-reform disorder in [JournalEntry.GetCountry.MakeScope.Var('nesnd_sha_yan_north').GetCountry.GetName] has reached 30"
 nesnd_sha_yan_disorder_high:0 "Land-reform disorder in [JournalEntry.GetCountry.MakeScope.Var('nesnd_sha_yan_north').GetCountry.GetName] has reached 60"
 nesnd_sha_yan_turmoil_row:0 "Average turmoil in the districts of the projected rising in the Eight Provinces has reached 25%"
 nesnd_sha_yan_compact_row:0 "The Korean compact is in force"
 nesnd_sha_yan_ten_battalions:0 "Denglai has at least ten battalions"
 nesnd_sha_yan_prep_status:0 "The assembly has allowed twelve years for preparations. Funding the Yan societies raises the Yan banner. Once it reaches #v 100#!, the rising must still wait until [JournalEntry.GetCountry.MakeScope.Var('nesnd_sha_yan_north').GetCountry.GetName] is at war, has a revolution or sees its land reform fail."
 nesnd_sha_yan_ready_status:0 "The banner is ready. Within the Eight Provinces, the government in Bianliang must still hold land in $STATE_SONGJIANG$, $STATE_NORTHERN_MANCHURIA$, $STATE_AMUR$, $STATE_OUTER_MANCHURIA$ and $STATE_BOLI$. When the rising comes, these five go to the Yan court, together with whatever Bianliang still holds of $STATE_SHENGJING$ and $STATE_SOUTHERN_MANCHURIA$. The Xu must not already have restored their court elsewhere, and the societies must have received Denglai’s funds. Once [JournalEntry.GetCountry.MakeScope.Var('nesnd_sha_yan_north').GetCountry.GetName] falls into war or its land reform fails, the assembly may settle the territorial terms."
 nesnd_sha_yan_existing_status:0 "The Xu have already restored the Yan court elsewhere. The Songjiang societies cannot set up a second court. The preparation period continues to run."
 nesnd_sha_yan_war_status:0 "Denglai has gone to war for Yan as its suzerain, and the agreed land has already passed to Denglai. Whether the Yan court survives depends on the outcome of the war."
 nesnd_sha_yan_observer_status:0 "Denglai has paid for six additional battalions of Yan infantry. Denglai stays out of the war. If the Yan court survives, it hands over the agreed land and enters an alliance."
 nesnd_sha_yan_root_active:0 "The former Yan forces in Songjiang and Heilongjiang are in touch with Denglai. See The Road to the Restoration of Yan for the assembly’s negotiations over a northeastern port."
 nesnd_sha_yan_root_port:0 "The Yan rising in the northeast has ended in our favour. We have secured the fine harbour of Vladivostok. It is time to decide what to build there."
 nesnd_sha_yan_root_no_port:0 "Our dealings with the remnants of Eastern Yan have come to nothing. Republicans have lost more risings than they have won. What we have in our favour is persistence… and always another plan."
 nesnd_sha_yan_subsidy:0 "Fund the Yan Societies"
 nesnd_sha_yan_subsidy_desc:0 "Give the anti-Mu societies a year’s funding to renew their contacts among the Liaodong and Jurchens under northern rule."
 nesnd_sha_yan_funding:0 "Funds for the Yan Societies"
 nesnd_sha_yan_subsidy_terms_tt:0 "Liaodong and Jurchen Pops under the government in Bianliang in the districts of the projected rising gain #r 10%#! radicals. The authorities have a #v 25%#! chance to trace the funds to Denglai, costing #r 10#! relations."
 nesnd_sha_yan_disorder:0 "The Liaodong Rising"
 nesnd_sha_yan_disavowed:0 "Defeat of the Restoration"
 nesnd_sha_yan_restoration_army:0 "Army of Great Yan"
 nesnd_sha_yan_local_army:0 "Songjiang Volunteers"
 nesnd_sha_yan_supplied_army:0 "New Infantry of Great Yan"
 nesnd_sha_yan_suppression:0 "Suppress the Xu Rebellion"
 nesnd_sha_yan_suppression_desc:0 "Take the field against the court the Xu have restored in the northeast."
 nesnd_sha_yan_suppression_tooltip:0 "Demands the annexation of the Xu regime."
 nesnd_sha_yan_war:0 "War of the Yan Restoration"
 nesnd_sha_annex_yan:0 "Annex Great Yan"
 nesnd_sha_annex_yan_desc:0 "Recover the territory held by the Xu regime. States that were incorporated before the rising resume incorporated status once recovered."
 nesnd_sha_yan_holds_terms_tt:0 "Denglai holds the northeastern states due under its chosen terms."
 nesnd_sha_yan_survived_tt:0 "The Yan court has survived the war and the land set out in the compact has been handed over."
 nesnd_sha_yan_complete_desc:0 "The Yan court has survived, and Denglai has gained the territory set out in the compact."
 nesnd_sha_yan_defeat_tt:0 "The restored court has fallen, or the territorial terms could not be fulfilled after the war."
 nesnd_sha_yan_defeat_desc:0 "The agreement we reached with the insurgents can no longer be honoured."
 nesnd_sha_yan_time_header:0 "Time Allowed for the Rising"
 nesnd_sha_yan_time_effect_header:0 "When the Period Expires"
 nesnd_sha_yan_time_tt:0 "The remnants of Yan have yet to rise after #v 12#! years of preparations."
 nesnd_sha_yan_timeout_desc:0 "The twelve years allowed for preparations are over. We must abandon the plan."
 nesnd_sha_yan_two_terms_tt:0 "First settlement: Denglai receives $STATE_OUTER_MANCHURIA$, $STATE_BOLI$ and $STATE_AMUR$."
 nesnd_sha_yan_port_terms_tt:0 "Second settlement: Denglai receives $STATE_AMUR$ and $STATE_OUTER_MANCHURIA$. Yan retains $STATE_BOLI$ and raises #v 8#! additional infantry battalions."
 nesnd_sha_yan_war_terms_tt:0 "Military route: Denglai takes the ceded land immediately, becomes suzerain of the Yan court and fights for it in the war of suppression."
 nesnd_sha_yan_peace_terms_tt:0 "Commercial route: Denglai pays #v 5%#! of GDP, at least @money!#v 7,500#!, for #v 6#! additional Yan infantry battalions. Denglai stays out of the war. If the Yan court survives, it cedes the agreed land and enters an alliance."
 nesnd_sha_yan_recruit:0 "Offer Passage from the Northeast"
 nesnd_sha_yan_recruit_desc:0 "Once preparations for the rising are over, offer passage to refugees from the Eight Provinces. Shipowners seek Liaodong and Jurchen people under Yan or Bianliang’s rule in $STATE_SHENGJING$, $STATE_SOUTHERN_MANCHURIA$, $STATE_SONGJIANG$, $STATE_NORTHERN_MANCHURIA$, $STATE_AMUR$, $STATE_OUTER_MANCHURIA$ and $STATE_BOLI$. The usual fare and three-year interval apply."
 nesnd_sha_korean_compact:0 "The Korean Compact"
 nesnd_sha_korean_compact_desc:0 "Denglai asks Korea to carry messages for the Yan societies. Once the rising begins, Korea's relations with both Denglai and the Yan court improve."
 nesnd_sha_yan_korean_cooldown_tt:0 "Korea has not declined this compact in the last #v 36#! months."
 nesnd_sha_yan_korea_accept_tt:0 "While Korea exists, the Yan banner gains an additional #v 0.25#! per month. At the rising, Korea gains #g 15#! relations with each government."
 nesnd_sha_yan.1.t:0 "The Yan Banner Raised"
 nesnd_sha_yan.1.d:0 "Word has reached us from Songjiang that Xu Jingheng has taken the throne. Former Yan officers can at last issue orders in the name of the house of Xu, and landowners holding Yan deeds have opened their granaries to the army. The Jurchen chiefs along the river arrived a little later, bringing the strength each band would muster and documents from land disputes going back to the surveys of [SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName]. Only when the troops and supplies were assembled could the loyal servants of Great Yan formally call for a rising.\n\nEven the ineffectual provincial officials have noticed an upheaval on this scale. Bianliang is in uproar and the court is calling out its armies. Years of trouble have taken their toll. Veterans have retired and the recruits have seen little action. The regional commands of [SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName] can no longer execute orders with their old speed or discipline. Most of the Mu forces are reportedly still on the road to their assembly point at Shuntian. Many soldiers from Hebei and Liaodong refuse to fight the Army of Restoration. Several columns have already mutinied on the march."
 nesnd_sha_yan.1.f:0 "“We join our arms against the tyrant, brothers in duty as in blood. Strike down the despot and the deed shall live a thousand years! Let men of honour be of one body and keep faith with one another. In the people’s revolution we share life and death!” — Oath of the Liaoyang republicans before their attack on the Gaizhou garrison headquarters in 1813. The Yan imperial troops defeated them. Most died fighting and the survivors were beheaded."
 nesnd_sha_yan.1.a:0 "Accept the letter of state from the Yan court."
 nesnd_sha_yan.2.t:0 "The Articles of the Eight Provinces"
 nesnd_sha_yan.2.d:0 "The final negotiations have begun. Xu Jingheng, head of the surviving imperial kin, has at last agreed to ride south from his stronghold beyond the Greater Khingan. They meet in a stockade in a logging ground at the headwaters of the Heilongjiang, barely two li from the nearest forestry office. As drafting begins, delegates from the former Yan forces still serving in the Mu army at Songjiang ask who is to occupy the imperial throne when the rising begins. A Denglai representative writes Xu Jingheng’s name on the paper. Nobody objects. Signatures and seals settle the matter in a moment. Then the delegates from Denglai unroll a new map showing Vladivostok and the prefectural boundaries of Outer Manchuria. A long silence descends.\n\nDenglai wants the harbour and the roads into the interior. The men of Yan, particularly the old officers, crowd around their new ‘master’, talking all at once. They will give the republic a port but want to keep enough country to recruit an army. The delegates from the Jurchen chieftains are remarkably quiet. The ink lines cross creeks and winter camps that these old inhabitants of the forest know well. Whichever state takes the land makes little difference to them. They mean to retain the forces and the standing to defend… everything."
 nesnd_sha_yan.2.f:0 "“Give Vladivostok to the northerners, and what are we to eat?” — Li Hede, garrison commander of the Five Lake Circuits of the new Yan"
 nesnd_sha_yan.2.a:0 "Sign the first agreement. Cede the prefectures of Outer Manchuria and the stockades of the northern reaches of the Heilongjiang to Denglai in return for its military support."
 nesnd_sha_yan.2.b:0 "Sign the second agreement. Cede Vladivostok. The rest can be discussed after the war…"
 nesnd_sha_yan.3.t:0 "Vladivostok"
 nesnd_sha_yan.3.d:0 "The Yan court has survived the war, and the Compact of the Eight Provinces is being honoured. Vladivostok and the agreed land now come under the administration of [ROOT.GetCountry.GetName]. Denglai ships will anchor and pay their dues in their own harbour, no longer waiting for clearance from Yan or Mu customs officers.\n\nThe assembly has set about developing the port: forts are to be built, a garrison raised, and the shipyards and trading houses of the far north moved here. The Yan troops still in the harbour have been given a deadline to hand over their barracks and stores."
 nesnd_sha_yan.3.f:0 "“The Yan troops in the harbour will hand over the forts and stores within three days. Any who fail to do so will be treated as enemy forces.”— Denglai order for the occupation of Vladivostok"
 nesnd_sha_yan.3.a:0 "Vladivostok comes under the jurisdiction of the republic."
 nesnd_sha_yan.4.t:0 "A Dispatch from Songjiang"
 nesnd_sha_yan.4.d:0 "The Yan court has been destroyed by [SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName], and the Compact of the Eight Provinces is a dead letter. The officers and chiefs who rose have been killed, have surrendered or have fled into the forests. Bianliang has established that Denglai paid the societies and shipped them arms, and relations between the two countries have frozen.\n\nBeaten soldiers and their families in the northeast still want to cross the sea to us. The assembly may decide how many to take in."
 nesnd_sha_yan.4.f:0 "“The ledger records war funds. What we got for them is a worthless piece of paper.”— A member of the National Assembly"
 nesnd_sha_yan.4.a:0 "Open our harbours to ships carrying refugees from the northeast."
 nesnd_sha_yan.5.t:0 "The Old Commandery Roll"
 nesnd_sha_yan.5.d:0 "The Yan societies have obtained a muster roll of the old regional command. The Yan court once issued commissions according to this roll and counted the men of every camp as the emperor's soldiers. The societies are now making contact rank by rank, from the top of the roll down.\n\nMore than ten years on, the order of the roll means little. Some Liaodong officers still keep their commissions, but their men have long since gone to other camps. Some Jurchen chiefs appear at the very bottom of the roll, yet the camps on both sides of a mountain pass now take their orders. If Denglai pays by the old ranks, most of the silver will not reach the men who actually command troops."
 nesnd_sha_yan.5.f:0 "“The Yan court gave my father a commission. I have three thousand mouths to feed. If you want my men, bring the grain and pay to my gate first.”— A Jurchen chief to an envoy of the Yan societies"
 nesnd_sha_yan.5.a:0 "Have the societies establish who commands each stockade today."
 nesnd_sha_yan.6.t:0 "The Surveyors Cross the River"
 nesnd_sha_yan.6.d:0 "After crossing the river, the land surveyors of [SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName] included a fishery the Jurchen clans have always shared among themselves in the land to be distributed. The office issued deeds household by household. Only when the new holders arrived with their papers did they find that a river's fishing season cannot be divided by the acreage on a deed. The escort drove the Jurchens from the bank. When the fish run upriver next year, they will be back.\n\nThe Yan societies have already sent men to win over the chiefs along the river. When the Yan court raised troops, it asked the chiefs to call up the camps, and the chiefs also allotted the fisheries. If the societies recognise that old right, the chiefs will have reason to fight for the Xu once more."
 nesnd_sha_yan.6.f:0 "“You can clear the banks today. When the fish come up next year, how many soldiers will you send to decide which boat casts its nets first?” — A Jurchen chief to a surveyor"
 nesnd_sha_yan.6.a:0 "Bring the river clans’ claims to fishing rights before the negotiators."
 nesnd_sha_yan.7.t:0 "Exiles from Korea"
 nesnd_sha_yan.7.d:0 "Since the fall of Korea, there has been no Korean government left to put its seal to the compact. Some Koreans who escaped have found their way to Denglai shipowners. They know the border, know which camps used to take in Korean traders, and some still have relatives along the river who can pass on letters.\n\nThe shipowners are willing to carry them, on condition that they carry letters for the Yan societies."
 nesnd_sha_yan.7.f:0 "“The court is gone, but the roads are still there. My people know every mountain path. The price is the same as before.”— A Korean exile to a Denglai shipowner"
 nesnd_sha_yan.7.a:0 "Have the merchants establish a post to the Yan societies."
 nesnd_sha_yan_exiles_progress_tt:0 "The Yan Banner gains #v 10#! progress."
 nesnd_sha_yan.8.t:0 "Twelve Years"
 nesnd_sha_yan.8.d:0 "Twelve years ago the National Assembly judged that [SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName] was beset at home and abroad, and that many Liaodong people and Jurchens hated the Mu family. It authorised preparations for a Yan restoration, hoping to gain a northeastern outlet to the sea under the Xu name. Twelve years have passed, and the Yan societies have never risen.\n\nThe assembly has withdrawn its authorisation for the rising. From now on, shipowners may apply to the government for passage money to bring Liaodong and Jurchen people from the northeast across the sea."
 nesnd_sha_yan.8.f:0 "“Twelve years of funding have bought us a list of names. If the people on that list will not rise, let them come and fell timber in Kamchatka.”— A Denglai assemblyman"
 nesnd_sha_yan.8.a:0 "End preparations for the rising and authorise passage for settlers from the northeast."
 nesnd_sha_yan.4.d_land:0 "Xu Jingheng has kept his throne, but part of the land the Compact of the Eight Provinces assigned to Denglai remains out of Denglai's hands. The Yan court will not and cannot surrender it, and the assembly has to accept that the compact has failed."
