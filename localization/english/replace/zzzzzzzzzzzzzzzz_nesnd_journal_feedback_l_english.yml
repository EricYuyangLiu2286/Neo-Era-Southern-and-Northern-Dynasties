 nesnd_south_holdout_campaign:0 "An Unsettled Southern War"
 nesnd_south_holdout_campaign_reason:0 "Wu’s authority does not yet extend across the south. The surviving Ming loyalists are divided: some prepare to fight again, others seek northern protection, and some consider submission. The court must still reckon with those who refuse its rule."
 nesnd_south_holdout_campaign_status:0 "Ming loyalists still hold out."
 nesnd_south_holdouts_settled_tt:0 "The remaining Ming loyalists have settled their allegiance, and the southern fighting has ended."
 nesnd_south_holdouts.1.t:0 "After the Armistice"
 nesnd_south_holdouts.1.d:0 "Our part in this war has ended, but the dispute between Wu and the Ming loyalists remains unresolved. Reports of defeat and appeals for peace arrive together; some officers still refuse to lay down their arms. We must decide whether to fight again, seek northern protection, or submit to Wu."
 nesnd_south_holdouts.resist:0 "Prepare to fight again."
 nesnd_south_holdouts.north:0 "Send envoys north to seek protection."
 nesnd_south_holdouts.surrender:0 "Submit to Wu."
 nesnd_south_holdouts_resist_tt:0 "Prepare to renew the war against Wu."
 nesnd_south_holdouts_north_tt:0 "Ask to become a protectorate of the Chinese Empire. If protection is refused, we must choose between renewed war and submission."
 nesnd_south_holdouts_surrender_tt:0 "Our country will be annexed by Wu. A Ming emperor still sheltered here will be sent to safety first."
 nesnd_south_holdouts.2.t:0 "Envoys from the South"
 nesnd_south_holdouts.2.d:0 "Envoys from [SCOPE.sCountry('nesnd_holdout_sender').GetName] seek our protection. Their government offers to accept our suzerainty in return for preserving its territory and army. Accepting would give us a new responsibility in the southern dispute."
 nesnd_south_holdouts.accept:0 "Accept their submission."
 nesnd_south_holdouts.refuse:0 "We will not undertake this obligation."
 nesnd_south_holdouts_accept_tt:0 "Accept the requesting country as a protectorate."
 nesnd_south_holdouts_refuse_tt:0 "Decline protection, leaving the requesting country to decide its next course."
 nesnd_south_holdouts.3.t:0 "Without Northern Protection"
 nesnd_south_holdouts.3.d:0 "Northern protection has not materialised. The envoys’ journey has left us with the same choice: defend our country against Wu again, or end the struggle by submitting."
 nesnd_south_holdouts.4.t:0 "Northern Protection"
 nesnd_south_holdouts.4.d:0 "The envoys have returned with acceptance. Our territory and army remain intact, and the northern empire is now our overlord. Restoring livelihoods and order after the war remains our task."
 nesnd_south_holdouts.4.a:0 "Let the people recover."
