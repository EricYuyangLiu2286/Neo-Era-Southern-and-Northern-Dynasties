l_english:
 nesnd_canon_no_pending_reply:0 "No diplomatic reply is pending"
 nesnd_canon_diplomatic_cooldown:0 "Six months have passed since the last proposal"
 nesnd_canon_no_french_alliance_tt:0 "The prospective partner is not allied to France"
 nesnd_canon_request_1_desc:0 "Seek a military alliance with a German state to share the risks of continental rivalry."
 nesnd_canon_request_11_desc:0 "Offer mutual defence to a German state without committing it to an offensive alliance."
 nesnd_canon_request_2_desc:0 "Open the federation to European investment in support of industry and continental armaments."
 nesnd_canon_request_3_desc:0 "Seek political credit from [SCOPE.sCountry('nesnd_label_fra').GetName] for the country’s Italian programme."
 nesnd_canon_request_4_desc:0 "Protect an Italian state through a defensive agreement and establish a basis for intervention."
 nesnd_canon_request_5_desc:0 "Seek an investment partner to support the country’s economic development."
 nesnd_canon_request_sent_tt:0 "Send the proposal and await a reply. It remains open for at most 45 days; another proposal cannot be sent for six months."
 nesnd_canon_accept_request_tt:0 "Accept the undertaking set out in the proposal."
 nesnd_canon_diplomacy.1.t:0 "A Proposal from Abroad"
 nesnd_canon_diplomacy.1.d:0 "A diplomatic proposal has reached the government. The envoy awaits an answer."
 nesnd_canon_diplomacy.1.alliance:0 "[SCOPE.sCountry('canon_sender').GetName] proposes a military alliance with a five-year binding period. Its envoy links the security of the German states to the continental order dominated by France and asks us to share the risks of diplomacy and war."
 nesnd_canon_diplomacy.1.defense:0 "[SCOPE.sCountry('canon_sender').GetName] proposes a defensive pact with a five-year binding period. It seeks a practical safeguard for national independence and expects both governments to fulfil their obligations if either is attacked."
 nesnd_canon_diplomacy.1.credit:0 "[SCOPE.sCountry('canon_sender').GetName] asks France to lend political credit to its Italian programme for six years. Its supporters hope French prestige will persuade domestic and foreign interests to accept the undertaking. The commitment itself does not alter the sovereignty of the Italian states."
 nesnd_canon_diplomacy.1.investment:0 "[SCOPE.sCountry('canon_sender').GetName] offers our investors access under an agreement with a five-year binding period. It hopes to attract factories and expertise while accepting the disputes over income and influence that foreign capital can bring. The agreement grants investment rights; construction remains a business decision."
 nesnd_canon_diplomacy.1.a:0 "Accept the proposal."
 nesnd_canon_diplomacy.1.b:0 "We cannot undertake this commitment."
 nesnd_canon_diplomacy.2.t:0 "The Envoy Returns with an Agreement"
 nesnd_canon_diplomacy.2.d:0 "The other government has accepted the terms, and the agreed undertaking is now in place. Further cooperation will depend on both countries continuing to fulfil their obligations."
 nesnd_canon_diplomacy.2.a:0 "Honour our commitment."
 nesnd_canon_diplomacy.3.t:0 "Negotiations Without Agreement"
 nesnd_canon_diplomacy.3.d:0 "These negotiations have produced no effective agreement. The other government either withheld its commitment or circumstances changed before the original terms could be settled. The envoy will return with that outcome."
 nesnd_canon_diplomacy.3.a:0 "Wait for another opportunity."
 nesnd_austria_intervene:0 "Intervene to Protect the Italian State"
 nesnd_austria_intervene_desc:0 "Commit Austria’s forces and prestige to the defence of the threatened state."
 nesnd_austria_intervene_tt:0 "Join the defending side in the current Italian dispute. Victory, territorial loss and stalemate have different consequences for Austrian influence."
 nesnd_austria_acknowledge:0 "Accept This Change in the Balance"
 nesnd_austria_acknowledge_desc:0 "Decline to use Austrian arms against the current territorial or unification demand."
 nesnd_austria_acknowledge_tt:0 "Decline intervention in this dispute. Another intervention cannot be proposed for 24 months."
