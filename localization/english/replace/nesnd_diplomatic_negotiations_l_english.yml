 nesnd_final_canon_success_condition_tt:0 "The requesting country receives the following support only if the commitment takes effect. Investment requires an actual investment-rights agreement. Permission does not guarantee new factories. First-investment awards cannot be claimed again."
 nesnd_final_french_credit_existing_tt:0 "Once political credit takes effect: Influence +100 and Prestige +25 for 72 months."
