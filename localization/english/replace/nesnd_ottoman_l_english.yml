 nesnd_ottoman_recovery.18.t:0 "Petitions at the Consulate"
 nesnd_ottoman_recovery.18.d_rumelia:0 "Consuls across the Balkans have sent urgent dispatches reporting repeated crackdowns by [SCOPE.sCountry('nesnd_tur_country').GetName] garrisons in the Orthodox towns of Rumelia. Town delegates and local residents have delivered petitions to foreign consulates asking the great powers to step in.\n\nThe foreign ministry of [ROOT.GetCountry.GetName] has drafted a note to Istanbul and laid both a diplomatic challenge and a formal protest before the government."
 nesnd_ottoman_recovery.18.d_east:0 "Consuls across Anatolia and the Caucasus have sent urgent dispatches reporting repeated operations by [SCOPE.sCountry('nesnd_tur_country').GetName] garrisons against Armenian communities in Kars, Erzurum and Diyarbakir. Community delegates and merchants have delivered petitions to foreign consulates asking the great powers to intervene.\n\nThe foreign ministry of [ROOT.GetCountry.GetName] has drafted a note to Istanbul and laid both a diplomatic challenge and a formal protest before the government."
 nesnd_ottoman_recovery.18.f:0 "'Petitions from provincial towns keep arriving, and dispatches from the interior crowd the consular desk.'\n- Urgent dispatch from a consulate in the Near East"
 nesnd_ottoman_recovery.18.a:0 "Press the Ottomans over the crackdown."
 nesnd_ottoman_recovery.18.b:0 "Deliver a formal diplomatic protest."
 nesnd_rtw_play:0 "Northern Conflict"
 nesnd_rtw_tur:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_rtw_title')]"
 nesnd_rtw_tur_reason:0 "With the Balkan and eastern turmoil scarcely settled, divisions of our northern rival are massing along the Danube and the Caucasian border. Frontier outposts report heavy troop movements, putting both the Straits and northern Anatolia under growing strain.\n\nWar could break out at any moment. The Porte must ready its armies before the adversary strikes and seek dependable backing among interested powers or to the east."
 nesnd_rtw_rus:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_rtw_title')]"
 nesnd_rtw_rus_reason:0 "The General Staff has drawn up a two-front campaign along the Danube and the Caucasus aimed at the remaining Ottoman defences in the Balkans and the southern approaches of the Caucasus.\n\nOnce the moment arrives, we may open a [concept_diplomatic_play] against Istanbul to redraw the map of the Black Sea and the Balkans."
 nesnd_rtw_status_war:0 "The [concept_war] on the Danube and Caucasus fronts is underway."
 nesnd_rtw_status_play:0 "The [concept_diplomatic_play] over the Black Sea and the Caucasus has opened, and both sides are seeking backers."
 nesnd_rtw_status_mobilized:0 "The Porte has issued repeated mobilization orders, reinforcing garrisons along the Danube and the Caucasus."
 nesnd_rtw_status_standoff:0 "Forces of the northern rival remain massed on the border while Istanbul prepares its armies and seeks foreign support."
 nesnd_rtw_rus_status_ready:0 "The General Staff's two-front campaign plans are ready, and frontier forces stand on alert."
 nesnd_rtw_result_rus_won_tt:0 "The northern rival has won the northern war"
 nesnd_rtw_result_tur_held_tt:0 "The Ottomans have held the line or secured peace in the northern war"
 nesnd_rtw_result_standoff_tt:0 "The border standoff ended without war, or the Ottomans no longer exist"
 nesnd_rtw_timeout_tt:0 "#v 180#! months have passed since this journal opened, and no [concept_diplomatic_play] or [concept_war] with the northern rival is underway"
 nesnd_rtw_lost_claims_tt:0 "Every Balkan or southern target state region held when this journal opened that no longer belongs wholly to us or our [concept_subject] receives our [concept_claim]"
 nesnd_rtw_tur_lost_conclusion:0 "Armies of the northern rival have broken the imperial lines on the Danube and in the Caucasus, forcing Istanbul to accept harsh terms."
 nesnd_rtw_tur_lost_event_tt:0 "Defeat: grants [concept_claim] on lost Balkan and southern target regions, permanently applies '$nesnd_rtw_lost_mod$', and triggers the event '$nesnd_ottoman_recovery.19.t$' in #v 5#! days."
 nesnd_rtw_tur_held_conclusion:0 "The empire has withstood the northern offensive and held its lines along the Danube and the Caucasus."
 nesnd_rtw_tur_held_event_tt:0 "Held the line: permanently grants '$nesnd_rtw_held_mod$'; if currently unrecognized, restores [concept_recognized_power] standing."
 nesnd_rtw_tur_standoff_conclusion:0 "Fifteen years of armed standoff have passed without a decisive offensive from the north, leaving the Porte's frontiers intact."
 nesnd_rtw_tur_standoff_event_tt:0 "Prolonged standoff without war: permanently grants '$nesnd_rtw_standoff_mod$' and closes the northern confrontation."
 nesnd_rtw_invalid_conclusion:0 "The parties to this northern crisis no longer hold their standing, ending the crisis."
 nesnd_rtw_rus_won_conclusion:0 "Our armies have prevailed on the Danube and in the Caucasus, forcing Istanbul to yield."
 nesnd_rtw_rus_won_event_tt:0 "Victory: permanently grants '$nesnd_rtw_rus_won_mod$', raising [concept_prestige]."
 nesnd_rtw_rus_failed_conclusion:0 "Our armies have failed to break the Ottomans, stalling the two-front drive south."
 nesnd_rtw_rus_failed_event_tt:0 "Thwarted: permanently applies '$nesnd_rtw_rus_failed_mod$', lowering [concept_prestige]."
 nesnd_rtw_rus_shelved_conclusion:0 "Plans for a southern campaign have been set aside, frontier garrisons have returned to routine readiness, and military procurement costs have eased."
 nesnd_rtw_rus_shelved_event_tt:0 "Campaign shelved: permanently grants '$nesnd_rtw_rus_shelved_mod$', slightly reducing military goods costs."
 nesnd_rtw_mobilize:0 "Mobilize the Army"
 nesnd_rtw_mobilize_desc:0 "Call up provincial levies and rush munitions to the front to fortify the Danube and Caucasus lines before the northern rival strikes."
