 nesnd_ottoman_recovery.16.t:0 "The Islamic Modernist"
 nesnd_ottoman_recovery.16.d:0 "The universities and newspapers of [ROOT.GetCountry.GetName] have raised a new generation of Muslim men of letters. In Istanbul, the writer [SCOPE.sCharacter('nesnd_namik_kemal').GetFullName] has published essays citing the Islamic legal tradition of consultation to argue that a constitution and parliament accord with religious law.\n\nThe [SCOPE.gsInterestGroup('nesnd_academy_intel_ig').GetName] have nominated him as a government advisor on education and press affairs. Days later, the [SCOPE.gsInterestGroup('nesnd_academy_devout_ig').GetName] submitted a joint petition accusing his writings of usurping religious authority and demanding that he be handed over to the ulema for trial."
 nesnd_ottoman_recovery.16.f:0 "'The flourishing of the fatherland rests on the learning of its citizens, and the law never forbade subjects to take part in public affairs.'\n- Signed essay printed in an Istanbul newspaper"
 nesnd_ottoman_recovery.16.a:0 "Appoint him as a government advisor."
 nesnd_ottoman_recovery.16.b:0 "Hand him over to the ulema for trial."
 nesnd_ottoman_recovery.17.t:0 "Unions and Factories"
 nesnd_ottoman_recovery.17.d:0 "As mechanised workshops open across the capital and provincial ports, the towns of [ROOT.GetCountry.GetName] have gathered a growing workforce living on regular wages. Craftsmen in textile mills and dockyards have quietly organised mutual-aid societies demanding shorter hours, fixed pay scales and official recognition of their right to associate openly.\n\nThe [SCOPE.gsInterestGroup('nesnd_trade_unions_ig').GetName] have put forward delegates from several industrial towns to lay a petition before the cabinet. At the same time, the Ministry of the Interior has forwarded police reports from the provinces asking how these workers' associations are to be handled."
 nesnd_ottoman_recovery.17.f:0 "'The machines run day and night, the workers fill whole quarters, and the old guild rules can no longer govern the new factory floor.'\n- Interior Ministry report on urban workshops"
 nesnd_ottoman_recovery.17.a:0 "Tolerate workers' associations."
 nesnd_ottoman_recovery.17.b:0 "Outlaw workers' associations."
 nesnd_ottoman_rumelia:0 "Rumelia"
 nesnd_ottoman_rumelia_reason:0 "With the Tanzimat failed, the sultan's empire faces both nationalist movements and foreign interference across the Balkan provinces. Reports of tax resistance and clandestine societies arrive from towns south of the Danube while foreign consuls press the Porte over provincial rule.\n\nBefore the Great Eastern Crisis closes, Istanbul must decide how to hold Rumelia: grant provincial charters, concede autonomy to the most turbulent province, or send garrisons to suppress unrest. Should the crisis slip beyond control, every lost province will remain a grievance for future reckoning."
 nesnd_ottoman_rumelia_status_ongoing:0 "The Great Eastern Crisis continues while nationalist movements and foreign pressure mount across the Balkans."
 nesnd_ottoman_rumelia_status_charter:0 "Repeated charter concessions in the Balkans have stirred growing resentment among conservative factions."
 nesnd_ottoman_rumelia_status_crackdown:0 "Repeated crackdowns across the Balkans have raised provincial [concept_fervor] and drawn sharp scrutiny from major powers with interests in the Balkans."
 nesnd_ottoman_rumelia_held_conclusion:0 "The Great Eastern Crisis has been contained, and Ottoman authority in Rumelia endures."
 nesnd_ottoman_rumelia_held_event_tt:0 "Crisis contained: permanently gains '$nesnd_ottoman_rumelia_held_mod$', raising [concept_legitimacy] and [concept_prestige]."
 nesnd_ottoman_rumelia_lost_conclusion:0 "The Great Eastern Crisis slipped out of control, costing the empire its hold over Balkan provinces."
 nesnd_ottoman_rumelia_lost_claims_tt:0 "Every Balkan state region held when this journal opened that no longer belongs wholly to us or our [concept_subject] receives our [concept_claim]"
 nesnd_ottoman_rumelia_lost_event_tt:0 "Crisis lost or unresolved after twenty-five years: grants [concept_claim] on lost former Balkan provinces and permanently applies '$nesnd_ottoman_rumelia_lost_mod$'."
 nesnd_ottoman_rumelia_timeout_conclusion:0 "Twenty-five years have passed without restoring order in the Balkans, eroding imperial authority over the lost lands."
 nesnd_ottoman_rumelia_invalid_conclusion:0 "The sultan's empire no longer stands, and the Rumelia crisis has ended."
 nesnd_ottoman_rumelia_charter:0 "Issue a Balkan Charter"
 nesnd_ottoman_rumelia_charter_desc:0 "Extend charter protections to the largest non-Turkish peoples of the Balkan provinces to calm local unrest."
 nesnd_ottoman_rumelia_charter_acceptance_tt:0 "In each Balkan state we hold, its largest non-primary culture gains higher [concept_acceptance] for #v 60#! months"
 nesnd_ottoman_rumelia_autonomy:0 "Grant Provincial Autonomy"
 nesnd_ottoman_rumelia_autonomy_desc:0 "Release the most turbulent non-capital Balkan province as an autonomous principality under Ottoman suzerainty."
 nesnd_ottoman_rumelia_autonomy_rank_tt:0 "If recognized, has a [concept_rank] of at least [concept_minor_power]; if unrecognized, has a [concept_rank] of at least $unrecognized_regional_power$"
 nesnd_ottoman_rumelia_autonomy_tt:0 "Releases the non-capital Balkan state with the highest [concept_turmoil] under its largest non-primary culture as a new [concept_subject] (protectorate if recognized, tributary if unrecognized)"
 nesnd_ottoman_rumelia_crackdown:0 "Suppress Balkan Unrest"
 nesnd_ottoman_rumelia_crackdown_desc:0 "Deploy imperial garrisons against Balkan provinces harbouring cultural minority movements to enforce order by force."
 nesnd_ottoman_rumelia_crackdown_states_tt:0 "Adds a small number of [concept_radical] in each of our Balkan states affected by a cultural minority [concept_political_movement], and raises the [concept_fervor] target of each state's largest non-primary culture for #v 60#! months"
 nesnd_ottoman_rumelia_crackdown_rus_tt:0 "Another crackdown in Rumelia: a major power with interests in the Balkans will respond."
 nesnd_ottoman_rumelia_cd_tt:0 "At least #v 24#! months have passed since our last measure in Rumelia"
 nesnd_ottoman_rumelia_cd_set_tt:0 "No further Rumelia measures may be taken for #v 24#! months."
 nesnd_ottoman_eastern_provinces:0 "The Eastern Provinces"
 nesnd_ottoman_eastern_provinces_reason:0 "Across the rugged provinces of Erzurum, Diyarbakir and Kars, Kurdish tribes and Armenian communities press conflicting demands while major powers with interests in the Near East and the Caucasus watch the frontier.\n\nThe Porte may raise tribal cavalry to police the borderlands, issue a charter protecting Armenian communities, or suppress unrest by force. If twenty years pass without settlement, disorder in the eastern provinces will harden into a lasting burden."
 nesnd_ottoman_east_status_active:0 "Kurdish or Armenian cultural minority [concept_political_movement] activity persists in the eastern provinces."
 nesnd_ottoman_east_status_calm:0 "No Kurdish or Armenian cultural minority [concept_political_movement] is currently active in the eastern provinces."
 nesnd_ottoman_east_holds_province_tt:0 "Still holds at least one state in Erzurum, Diyarbakir or Kars"
 nesnd_ottoman_east_charter_count_tt:0 "Enacted '$nesnd_ottoman_east_charter$' at least #v 3#! times"
 nesnd_ottoman_east_charter_conclusion:0 "Imperial charters have secured the standing of the Armenian millet in the eastern provinces and eased tension along the eastern frontier."
 nesnd_ottoman_east_charter_event_tt:0 "Charter settlement: permanently raises Armenian [concept_acceptance], permanently grants '$nesnd_ottoman_armenian_millet$', and improves [concept_relations] with a major power holding interests in the Near East or the Caucasus."
 nesnd_ottoman_east_force_count_tt:0 "Used '$nesnd_ottoman_east_crackdown$' and '$nesnd_ottoman_east_cavalry$' at least #v 3#! times combined"
 nesnd_ottoman_east_no_movement_tt:0 "No Kurdish or Armenian cultural minority [concept_political_movement] remains in the eastern three provinces"
 nesnd_ottoman_east_crushed_conclusion:0 "Minority movements in the eastern provinces have been crushed, and tribal cavalry levies have become a permanent fixture on the frontier."
 nesnd_ottoman_east_crushed_event_tt:0 "Suppression complete: permanently grants '$nesnd_ottoman_tribal_cavalry$'; accumulated [concept_infamy] remains."
 nesnd_ottoman_east_lost_all_tt:0 "No longer holds any state in Erzurum, Diyarbakir or Kars"
 nesnd_ottoman_east_lost_conclusion:0 "All three eastern provinces have been lost, leaving eastern Anatolia exposed."
 nesnd_ottoman_east_lost_event_tt:0 "Eastern provinces lost: permanently applies '$nesnd_ottoman_east_lost_mod$'."
 nesnd_ottoman_east_timeout_conclusion:0 "Twenty years have passed without restoring order in the eastern provinces, leaving chronic unrest across the frontier."
 nesnd_ottoman_east_timeout_event_tt:0 "Unresolved: permanently applies '$nesnd_ottoman_eastern_unrest$', worsening [concept_turmoil] and movement radicalism."
 nesnd_ottoman_east_invalid_conclusion:0 "The sultan's empire no longer stands, and the Eastern Provinces crisis has ended."
 nesnd_ottoman_east_cavalry:0 "Raise Tribal Cavalry"
 nesnd_ottoman_east_cavalry_desc:0 "Arm Kurdish tribal horsemen in the eastern provinces as irregular cavalry to police the frontier and curb unrest."
 nesnd_ottoman_east_charter:0 "Issue an Eastern Charter"
 nesnd_ottoman_east_charter_desc:0 "Guarantee Armenian millet rights in the eastern provinces to ease local grievances and foreign pressure."
 nesnd_ottoman_east_crackdown:0 "Suppress Eastern Unrest"
 nesnd_ottoman_east_crackdown_desc:0 "Send regular garrisons across Erzurum, Diyarbakir and Kars to break resistance despite foreign condemnation."
 nesnd_ottoman_east_crackdown_rus_tt:0 "Another crackdown in the eastern provinces: a major power with interests in the Near East or the Caucasus will respond."
 nesnd_ottoman_east_cd_tt:0 "At least #v 24#! months have passed since our last measure in the eastern provinces"
