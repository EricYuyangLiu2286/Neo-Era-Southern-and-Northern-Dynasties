 nesnd_ottoman_claims_voided_tt:0 "Our [concept_claim]s on every state covered by the enthusiasm buttons are voided"
 nesnd_ottoman_recovery.3.t:0 "Eastern Order"
 nesnd_ottoman_recovery.3.d:0 "In the summer of 1723 the Qin army lifted its siege of Baghdad, and that battle became the turning point of the Fourth Near West War. Baghdad, Mosul, Basra, Syria and Aleppo are all under the direct rule of [ROOT.GetCountry.GetName] again, and Mesopotamia and Syria are joined once more.\n\nThe officers in Istanbul say the next step is to cross Khorasan and march on Herat and Transoxiana. Other ministers want the new cities governed well first, so that the Muslims there come to see the Sultan's government as their own."
 nesnd_ottoman_recovery.3.f:0 "'From Baghdad, Mosul and Basra to Syria and Aleppo, every province shall keep the laws of the empire alike.'\n- Decree after the recovery of Mesopotamia"
 nesnd_ottoman_recovery.3.a:0 "Press east"
 nesnd_ottoman_recovery.3.b:0 "Consolidate"
 nesnd_ottoman_recovery.3.no_frontier_tt:0 "There is no land to claim in the five Central Asian frontier states right now."
 nesnd_ottoman_recovery.3.b_tt:0 "$nesnd_ottoman_unity_order_desc$ in '$nesnd_ottoman_unity$' gains #v 0.1#! more each month"
 nesnd_ottoman_recovery.4.t:0 "End of the Old Order"
 nesnd_ottoman_recovery.4.d:0 "[SCOPE.sCountry('nesnd_thrace_taker').GetName] has taken land in Eastern Thrace, and the capital has lost its shield. More than a hundred years ago the armies of Russia and Qin stood before Istanbul and could not take it.\n\nThe ministers have two courses left: move into the Anatolian interior, or seek help from the rivals of [SCOPE.sCountry('nesnd_thrace_taker').GetName]."
 nesnd_ottoman_recovery.4.d_unknown:0 "Eastern Thrace no longer belongs wholly to the empire, and the capital has lost its shield. More than a hundred years ago the armies of Russia and Qin stood before Istanbul and could not take it.\n\nThe ministers have two courses left: move into the Anatolian interior, or seek help abroad."
 nesnd_ottoman_recovery.4.f:0 "'Eastern Thrace is lost, and the gates of Istanbul stand open.'\n- Dispatch to the provinces"
 nesnd_ottoman_recovery.4.a:0 "Move the capital to Ankara"
 nesnd_ottoman_recovery.4.b:0 "Seek help"
 nesnd_ottoman_recovery.4.no_rival_tt:0 "No country is currently a rival of theirs to turn to."
 nesnd_ottoman_recovery.5.t:0 "A Constitutional Empire"
 nesnd_ottoman_recovery.5.d:0 "With the Tanzimat complete, [ROOT.GetCountry.GetName] has new schools, a new army and a new civil service. The men who led the reforms say the next step is a charter that binds the ministers and the Sultan, and brings educated men like the [SCOPE.gsInterestGroup('nesnd_route_charter_ig').GetName] into government.\n\nThe officers trained by the Qin-style army reform think otherwise. In their view the reforms succeeded because of the army's discipline, and the empire needs a single chain of command, not quarrels in a parliament. The [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName] and the reformers each claim to be the heirs of the Tanzimat."
 nesnd_ottoman_recovery.5.f:0 "'Ministers and Sultan alike are bound by this Charter.'\n- Draft charter of the reformers"
 nesnd_ottoman_recovery.5.a:0 "The charter first"
 nesnd_ottoman_recovery.5.b:0 "The barracks first"
 nesnd_ottoman_recovery.6.t:0 "The Sultan's Empire"
 nesnd_ottoman_recovery.6.d:0 "With the old Sultan dead, a new Sultan takes the throne of a broken empire. The subject states have gone their own way, the great powers no longer treat [ROOT.GetCountry.GetName] as their equal, and the men of the Tanzimat have fallen from power.\n\nThe [SCOPE.gsInterestGroup('nesnd_route_faith_ig').GetName] urge the new Sultan to rule in person, and to call the Muslims of every land to rally around Istanbul in the name of the leader of the Islamic world. The officers trained by the Qin-style army reform believe only the army can hold what is left, and the [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName] demand that government be handed to men who know how to fight."
 nesnd_ottoman_recovery.6.f:0 "'Let every Muslim rally beneath the banner of the leader of the Islamic world.'\n- Accession decree of the new Sultan"
 nesnd_ottoman_recovery.6.a:0 "The Sultan rules"
 nesnd_ottoman_recovery.6.b:0 "Lean on the barracks"
 nesnd_ottoman_recovery.7.t:0 "Peoples United"
 nesnd_ottoman_recovery.7.d:0 "For three years running, no great wave of estrangement has swept the lands of [ROOT.GetCountry.GetName]. Anatolian officials, Balkan notables and the newly joined peoples alike have begun to treat the Ottoman government as the place where their own affairs are settled.\n\nWhether the empire follows the constitution or the Sultan's personal rule, the place of each people in government is still to be fought over."
 nesnd_ottoman_recovery.7.f:0 "'The affairs of subjects of every people shall be handled alike by the imperial government.'\n- Government gazette"
 nesnd_ottoman_recovery.7.a:0 "Recognize these states as a Turkish homeland."
 nesnd_ottoman_recovery.7.no_state_tt:0 "No incorporated state currently has a Turkish majority without already being a Turkish [concept_homeland]."
 nesnd_ottoman_recovery.8.t:0 "Peoples Estranged"
 nesnd_ottoman_recovery.8.d:0 "For two years running, the unity of [ROOT.GetCountry.GetName] has stayed low. In places like [SCOPE.sState('nesnd_discord_state').GetName], where Turks are not the majority, people no longer believe that Istanbul will look after their interests.\n\nThe government has lost the hearts of these lands."
 nesnd_ottoman_recovery.8.d_none:0 "For two years running, the unity of [ROOT.GetCountry.GetName] has stayed low. People across the provinces no longer believe that Istanbul will look after their interests.\n\nThe government has lost the hearts of the provinces."
 nesnd_ottoman_recovery.8.f:0 "'Istanbul will not look after our interests.'\n- A provincial petition"
 nesnd_ottoman_recovery.8.a:0 "The provinces' anger can only be eased slowly."
 nesnd_ottoman_recovery.8.no_state_tt:0 "No state currently lacks a Turkish majority."
