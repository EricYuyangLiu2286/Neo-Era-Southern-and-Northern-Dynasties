 nesnd_ottoman_unity_concord_conclusion:0 "The peoples of the empire have come together under the Ottoman government."
 nesnd_ottoman_unity_discord_conclusion:0 "The peoples of the empire have lost faith in the Ottoman government."
 nesnd_ottoman_unity_concord_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.7.t$': incorporated states with a Turkish majority that are not yet a Turkish [concept_homeland] become one."
 nesnd_ottoman_unity_discord_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.8.t$': states without a Turkish majority gain [concept_radical]s."
 nesnd_ottoman_recovery_eastern_order_conclusion:0 "Mesopotamia and Syria are again under direct Ottoman rule."
 nesnd_ottoman_recovery_eastern_order_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.3.t$', choose one:\n• $nesnd_ottoman_recovery.3.a$: gain [concept_claim]s on five Central Asian frontier states\n• $nesnd_ottoman_recovery.3.b$: permanently raise [concept_legitimacy], and $nesnd_ottoman_unity_order_desc$ in '$nesnd_ottoman_unity$' gains #v 0.1#! more each month"
 nesnd_ottoman_recovery_old_order_conclusion:0 "The capital has lost its shield, and the plan to restore the eastern order is over."
 nesnd_ottoman_recovery_old_order_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.4.t$', choose one:\n• $nesnd_ottoman_recovery.4.a$: move the capital to Ankara (requires land in Ankara)\n• $nesnd_ottoman_recovery.4.b$: improve relations with the rivals of the country that took Eastern Thrace"
