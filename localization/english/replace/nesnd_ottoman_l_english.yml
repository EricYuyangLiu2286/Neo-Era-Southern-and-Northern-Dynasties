l_english:
 nesnd_ottoman_unity:0 "Peoples of the Empire"
 nesnd_ottoman_unity_reason:0 "Conquest has brought peoples of different faiths, languages and histories under Ottoman rule. Officials in Anatolia, provincial interests in the Balkans and newly incorporated communities all expect the government to protect their interests.\n\nSchools, effective administration and secure work can strengthen allegiance to the state. Prolonged war and discrimination deepen divisions. Lasting rule requires cooperation in the provinces as well as success in conquest."
 nesnd_ottoman_unity_bar:0 "National Cohesion"
 nesnd_ottoman_unity_bar_desc:0 "$nesnd_ottoman_unity_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
