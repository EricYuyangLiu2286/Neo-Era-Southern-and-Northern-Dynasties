 nesnd_north_help_cd_set_tt:0 "No further appeal for foreign aid may be sent for #v 12#! months."
 nesnd_north_not_in_war_tt:0 "Open [concept_war] with the northern rival has not yet begun"
 nesnd_north_seek_help_tt:0 "Deliver a formal appeal for aid to the major power most likely to answer."
 nesnd_rtw_ask_qe1:0 "Seek Aid from Western Qin"
 nesnd_rtw_ask_qe1_desc:0 "Dispatch envoys across Persia to the Western Qin military command, offering to renounce our [concept_claim]s on their lands in exchange for military advisers or a [concept_defensive_pact]."
 nesnd_rtw_qe1_not_in_civil_war_tt:0 "Western Qin is not currently in a civil war"
 nesnd_rtw_qe1_not_via_per_war_tt:0 "No [concept_subject] of Western Qin is at war with us"
 nesnd_rtw_has_qinist_leader_tt:0 "At least one interest group leader holds the $ideology_ce_qin_royalist_leader$ ideology"
 nesnd_rtw_qe1_relations_tt:0 "[concept_relations] with Western Qin are at least Poor"
 nesnd_rtw_not_asked_qe1_tt:0 "We have not yet appealed to Western Qin for aid"
 nesnd_rtw_ask_qe1_tt:0 "Send envoys to Western Qin requesting military advisers or a [concept_defensive_pact]."
 nesnd_rtw_cd_tt:0 "At least #v 12#! months have passed since our last mobilization or appeal to Western Qin"
 nesnd_rtw_cd_set_tt:0 "No further mobilization or appeal to Western Qin may be taken for #v 12#! months."
 nesnd_rtw_rus_launch:0 "Go to War with the Ottomans"
 nesnd_rtw_rus_launch_desc:0 "Execute the General Staff's two-front plan and launch a [concept_diplomatic_play] against the Ottomans to seize the Caucasian approaches or force Istanbul to yield."
 nesnd_rtw_rus_relations_tt:0 "[concept_relations] with the Ottomans are below Cordial"
 nesnd_rtw_not_started_tt:0 "The [concept_diplomatic_play] for this crisis has not yet been launched"
 nesnd_rtw_rus_launch_tt:0 "Launches a [concept_diplomatic_play] against the Ottomans (conquest of Kars or Erzurum if held by the Ottomans; otherwise a humiliation play)."
 nesnd_rtw_renounce_qe1_claims_tt:0 "The Ottomans renounce all [concept_claim]s on state regions currently held by Western Qin"
 nesnd_rtw_mobilize_army:0 "Emergency Mobilization"
 nesnd_rtw_mobilize_cost:0 "Pre-War Munitions Procurement"
 nesnd_rtw_qe1_appeal_devout:0 "Appeal to an Old Infidel Foe"
 nesnd_rtw_held_mod:0 "Lines of the Porte Held"
 nesnd_rtw_lost_mod:0 "Humiliation of the Northern War"
 nesnd_rtw_standoff_mod:0 "Armed Standoff on the Frontier"
 nesnd_rtw_rus_won_mod:0 "Triumph on the Danube and Caucasus"
 nesnd_rtw_rus_failed_mod:0 "Checked Before the Porte"
 nesnd_rtw_rus_shelved_mod:0 "Southern Campaign Shelved"
 nesnd_rtw_isolated:0 "Left Without Allies"
 nesnd_rtw_qin_advisers:0 "Western Qin Military Advisers"
 nesnd_rtw_qinist_up:0 "Bolstered by Western Qin Aid"
 nesnd_rtw_qinist_down:0 "Rebuffed by Western Qin"
 nesnd_ottoman_revenge_east:0 "Swords Turned East"
 nesnd_ottoman_revenge_west:0 "Vow to Reclaim Rumelia"
 nesnd_rtw.1.t:0 "The Straits Note"
 nesnd_rtw.1.d:0 "The ambassador of [SCOPE.sCountry('nesnd_tur_country').GetName] has sought an urgent audience at the Foreign Ministry to present a formal note from Istanbul. The note warns that [SCOPE.sCountry('nesnd_north_foe_scope').GetName] is bringing heavy pressure to bear along the Danube and the Caucasus and asks [ROOT.GetCountry.GetName] to stand with the Sublime Porte in defence of the Bosporus.\n\nDebate has erupted in parliament and at court over whether to commit forces for the Straits. Military and naval advisers have laid reports on eastern Mediterranean sea lanes before the cabinet, warning that control of the Straits by [SCOPE.sCountry('nesnd_north_foe_scope').GetName] would upset the regional balance."
 nesnd_rtw.1.d_plain:0 "The ambassador of [SCOPE.sCountry('nesnd_tur_country').GetName] has sought an urgent audience at the Foreign Ministry to present a formal note from Istanbul. The note warns that a northern rival is bringing heavy pressure to bear along the Danube and the Caucasus and asks [ROOT.GetCountry.GetName] to stand with the Sublime Porte in defence of the Bosporus.\n\nDebate has erupted in parliament and at court over whether to commit forces for the Straits, while military advisers lay their assessments of eastern Mediterranean sea lanes before the government."
 nesnd_rtw.1.f:0 "'Control of the Bosporus touches every sea lane and balance of power in the eastern Mediterranean.'\n- Diplomatic dispatch from an ambassador abroad"
 nesnd_rtw.1.a:0 "Stand with the Sublime Porte."
 nesnd_rtw.1.b:0 "Issue a diplomatic declaration only."
 nesnd_rtw.1.c:0 "Refuse to intervene."
 nesnd_rtw.2.t:0 "Dispatches of Support"
 nesnd_rtw.2.d_joined:0 "An urgent cipher from our embassy confirms that [SCOPE.sCountry('nesnd_helper_country').GetName] has resolved to join the current [concept_diplomatic_play] on the side of [ROOT.GetCountry.GetName]. Its diplomats have notified our northern rival that the existing order at the Straits will not be overturned by force.\n\nMinisters at the Porte summoned the General Staff through the night to revise defence plans around the expected arrival of allied forces from [SCOPE.sCountry('nesnd_helper_country').GetName]."
 nesnd_rtw.2.d_pact:0 "An urgent cipher from our embassy confirms that the government of [SCOPE.sCountry('nesnd_helper_country').GetName] has agreed to conclude a defensive pact with [ROOT.GetCountry.GetName]. Its diplomats have declared publicly that the order at the Straits cannot be overturned by force.\n\nMinisters at the Porte summoned the General Staff through the night to revise coastal defence plans with the prospect of backing from [SCOPE.sCountry('nesnd_helper_country').GetName]."
 nesnd_rtw.2.d_rel:0 "An urgent cipher from our embassy reports that existing treaty constraints prevented [SCOPE.sCountry('nesnd_helper_country').GetName] from signing a formal defensive pact at once, yet it has extended clear diplomatic support to [ROOT.GetCountry.GetName] and instructed its envoys to watch the Straits closely.\n\nOttoman diplomats have reopened talks with their embassy in Istanbul, warming relations between the two capitals."
 nesnd_rtw.2.f:0 "'Our government cannot look on while the order of the Straits is overturned by force of arms.'\n- Reply from a foreign ministry to the Porte"
 nesnd_rtw.2.a:0 "Word of support has reached the Straits."
 nesnd_rtw.2.a_joined_tt:0 "[SCOPE.sCountry('nesnd_helper_country').GetName] has joined our side in the active [concept_diplomatic_play]."
 nesnd_rtw.2.a_pact_tt:0 "[SCOPE.sCountry('nesnd_helper_country').GetName] has concluded a #v 5#!-year [concept_defensive_pact] with us."
 nesnd_rtw.2.a_rel_tt:0 "Unable to sign a treaty at present, [SCOPE.sCountry('nesnd_helper_country').GetName] has instead improved [concept_relations] with us."
 nesnd_rtw.3.t:0 "Reply to the Note"
 nesnd_rtw.3.d_note:0 "Our ambassador has forwarded the official reply of the Foreign Ministry of [SCOPE.sCountry('nesnd_helper_country').GetName]. Its government has issued a public declaration expressing concern over troop concentrations on the border, while making clear that it will neither sign a defensive alliance with [ROOT.GetCountry.GetName] nor commit troops.\n\nMinisters fold the dispatch away, left with a diplomatic statement of limited weight to restrain our northern rival."
 nesnd_rtw.3.d_refused:0 "Our ambassador has telegraphed that [SCOPE.sCountry('nesnd_helper_country').GetName] has rejected the Porte's appeal and declared it will stay out of any conflict in the Balkans or the Caucasus. Word has spread rapidly through the embassies and newspapers of Istanbul.\n\nSilence settles over the council chamber as [ROOT.GetCountry.GetName] faces the armies massing on its northern frontier alone."
 nesnd_rtw.3.f:0 "'The Porte must not expect outside powers to hold the crossings of the Danube on its behalf.'\n- Cipher dispatch from an embassy abroad"
 nesnd_rtw.3.a:0 "We must rely on our own armies."
 nesnd_rtw.3.a_note_tt:0 "[SCOPE.sCountry('nesnd_helper_country').GetName] has issued a diplomatic declaration: our [concept_relations] with them have improved slightly while their [concept_relations] with our northern rival have cooled."
 nesnd_ottoman_qe1.4.t:0 "Ottoman Envoys Reach the Command"
 nesnd_ottoman_qe1.4.d:0 "A discreet mission from [SCOPE.sCountry('nesnd_tur_country').GetName] has crossed the Persian plateau to reach the military headquarters of [ROOT.GetCountry.GetName]. The envoys bear a sealed letter from the Ottoman army leadership reporting that [SCOPE.sCountry('nesnd_north_foe_scope').GetName] is massing forces on their borders and asking [ROOT.GetCountry.GetName] for military instructors and staff officers, or a formal defensive pact.\n\nIn return, the Porte offers to renounce all old claims over territory currently held by [ROOT.GetCountry.GetName]. Maps are spread across the command hall alongside frontier defence rolls and reports on [SCOPE.sCountry('nesnd_north_foe_scope').GetName] garrisons along the northern steppe."
 nesnd_ottoman_qe1.4.d_plain:0 "A discreet mission from [SCOPE.sCountry('nesnd_tur_country').GetName] has crossed the Persian plateau to reach the military headquarters of [ROOT.GetCountry.GetName]. The envoys bear a sealed letter from the Ottoman army leadership reporting heavy northern deployments and asking [ROOT.GetCountry.GetName] for military instructors and staff officers, or a formal defensive pact.\n\nIn return, the Porte offers to renounce all old claims over territory currently held by [ROOT.GetCountry.GetName]. Maps are spread across the command hall as the court weighs its answer."
 nesnd_ottoman_qe1.4.f:0 "'Envoys from the Far West crossed the Pamirs, offering to trade hollow old claims for garrison instructors and a treaty.'\n- Relay dispatch of the military command"
 nesnd_ottoman_qe1.4.a:0 "Dispatch military advisers to the Porte."
 nesnd_ottoman_qe1.4.b:0 "Conclude a defensive pact with the Porte."
 nesnd_ottoman_qe1.4.c:0 "Turn away the Porte's request."
 nesnd_ottoman_qe1.5.t:0 "Word from Ili"
 nesnd_ottoman_qe1.5.d_pact:0 "Our eastern envoys have returned to Istanbul bearing a sealed treaty. [SCOPE.sCountry('nesnd_qin_country').GetName] has agreed to a defensive pact with [ROOT.GetCountry.GetName] in return for the formal withdrawal of Ottoman claims on lands held by [SCOPE.sCountry('nesnd_qin_country').GetName].\n\nAs the news spreads, old grievances from the Near Western Wars resurface. Envoys from neighbouring Muslim states lodge sharp protests at the Porte."
 nesnd_ottoman_qe1.5.d_advisers:0 "Our eastern envoys have returned to Istanbul accompanied by a detachment of military instructors and staff officers from [SCOPE.sCountry('nesnd_qin_country').GetName]. The advisers have taken up posts at the War Ministry and provincial barracks to overhaul supply and drill on Qin lines, and [ROOT.GetCountry.GetName] has formally withdrawn its claims on lands held by [SCOPE.sCountry('nesnd_qin_country').GetName].\n\nOfficers who favour Qin methods gain standing in the barracks. Envoys from neighbouring Muslim states deliver protests denouncing this arrangement with an old adversary."
 nesnd_ottoman_qe1.5.f:0 "'The enemy we once fought beneath the walls of Baghdad now sits at the council table of the Istanbul War Ministry.'\n- Diary of an Ottoman staff officer"
 nesnd_ottoman_qe1.5.a:0 "Put the new regulations into force."
 nesnd_ottoman_qe1.5.a_pact_tt:0 "[SCOPE.sCountry('nesnd_qin_country').GetName] has concluded a #v 5#!-year [concept_defensive_pact] with us, and our [concept_claim]s on lands held by [SCOPE.sCountry('nesnd_qin_country').GetName] have been withdrawn."
 nesnd_ottoman_qe1.5.a_advisers_tt:0 "We have permanently gained '$nesnd_rtw_qin_advisers$', our Qinist leaders have gained [concept_popularity], and our [concept_claim]s on lands held by [SCOPE.sCountry('nesnd_qin_country').GetName] have been withdrawn."
 nesnd_ottoman_qe1.6.t:0 "Western Qin Refuses Aid"
 nesnd_ottoman_qe1.6.d:0 "The envoys sent east across Persia have returned to Istanbul empty-handed. The military command of [SCOPE.sCountry('nesnd_qin_country').GetName] declined to send advisers or sign a treaty, returning only a coolly worded reply.\n\nAs news reaches the barracks, officers who championed Qin methods lose standing, while conservative ministers and the ulema denounce the humiliation of courting an old rival in vain."
 nesnd_ottoman_qe1.6.f:0 "'The eastern command can barely guard Transoxiana; why would it spend its strength for the Bosporus?'\n- Talk in an Istanbul coffeehouse"
 nesnd_ottoman_qe1.6.a:0 "Recall the eastern envoys."
 nesnd_ottoman_qe1.6.a_tt:0 "Our Qinist leaders have lost [concept_popularity], and [concept_relations] with [SCOPE.sCountry('nesnd_qin_country').GetName] have cooled."
 nesnd_ottoman_recovery.19.t:0 "Where the Sword Turns"
 nesnd_ottoman_recovery.19.d:0 "A freshly drawn map of the empire hangs on the wall of the Porte's council chamber, red ink circling wide losses south of the Danube and along the Caucasian border. With the fighting over, the surviving regular divisions of [ROOT.GetCountry.GetName] are pulling back into Anatolia to refit.\n\nThe War Ministry has laid the next army budget and deployment schedules before the council. Commanders on the eastern Anatolian border report that the eastern frontier and Mesopotamia lie lightly defended and ask for funds to press east. Officers withdrawn from the Balkans have submitted a separate plan to concentrate the rebuilt army on the Thracian line to retake the lost lands."
 nesnd_ottoman_recovery.19.f:0 "'The red line on the map draws tighter every decade; the empire must choose which frontier to strike.'\n- Minutes of the Porte war council"
 nesnd_ottoman_recovery.19.a:0 "Turn east and reclaim Mesopotamia."
 nesnd_ottoman_recovery.19.b:0 "Rebuild our armies to retake the lost lands."
 nesnd_ottoman_recovery.20.t:0 "The Price of the Straits"
 nesnd_ottoman_recovery.20.d:0 "Our northern neighbour [SCOPE.sCountry('nesnd_north_ally_scope').GetName] is bound to [ROOT.GetCountry.GetName] by treaty, and warships passing through the Bosporus now fly an ally's ensign. The shore batteries salute according to the pact while merchantmen clear the channel.\n\nEnvoys of the other major powers wait outside the Sublime Porte for an answer. Their notes are blunt, demanding to know whether Istanbul means to place the passage of the Straits at the disposal of [SCOPE.sCountry('nesnd_north_ally_scope').GetName]."
 nesnd_ottoman_recovery.20.f:0 "'As soon as warships pass the Bosporus under an ally's flag, the carriages of every other embassy line up outside the Porte.'\n- Diary of an Ottoman diplomat"
 nesnd_ottoman_recovery.20.a:0 "Keep the pact."
 nesnd_ottoman_recovery.20.a_no_rival_tt:0 "No major power that treats [SCOPE.sCountry('nesnd_north_ally_scope').GetName] as a rival has lodged a protest."
 nesnd_ottoman_recovery.20.b:0 "Distance ourselves."
