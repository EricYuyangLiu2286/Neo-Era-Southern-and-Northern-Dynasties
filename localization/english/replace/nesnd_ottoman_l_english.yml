 nesnd_ottoman_recovery.2.t:0 "From Drill to Statecraft"
 nesnd_ottoman_recovery.2.d:0 "At first [SCOPE.sCharacter('nesnd_qinist_leader').GetFullName] saw the Qin-style army reform as a matter of drill and supply. Since the reform began, [ROOT.GetCountry.GetAdjective] officers have translated the [SCOPE.sCountry('nesnd_qin_country').GetAdjective] establishment regulations and started mustering men by the roll and issuing rations by head count. [SCOPE.sCharacter('nesnd_qinist_leader').GetLastName] read something more in those regulations, and came to believe that the [SCOPE.sCountry('nesnd_qin_country').GetAdjective] army can be moved this way only because the [SCOPE.sCountry('nesnd_qin_country').GetAdjective] monarch holds men and provisions in one hand.\n\nNow this leader of the [SCOPE.gsInterestGroup('nesnd_qinist_ig').GetName] argues openly that the empire must learn not only the [SCOPE.sCountry('nesnd_qin_country').GetAdjective] art of war but the [SCOPE.sCountry('nesnd_qin_country').GetAdjective] order of the state. The Ottomans once led the Righteous Jihad and drove the Qin back from Baghdad. In such a country the argument sounds close to treason."
 nesnd_ottoman_recovery.2.d_fallen:0 "At first [SCOPE.sCharacter('nesnd_qinist_leader').GetFullName] saw the Qin-style army reform as a matter of drill and supply. Since the reform began, [ROOT.GetCountry.GetAdjective] officers have translated the Qin-style establishment regulations and started mustering men by the roll and issuing rations by head count. [SCOPE.sCharacter('nesnd_qinist_leader').GetLastName] read something more in those regulations, and came to believe that behind them lies the principle of a monarch holding men and provisions in one hand.\n\nNow this leader of the [SCOPE.gsInterestGroup('nesnd_qinist_ig').GetName] argues openly that the empire must learn not only the Qin-style art of war but the Qin-style order of the state. The Ottomans once led the Righteous Jihad and drove the Qin back from Baghdad. In such a country the argument sounds close to treason."
 nesnd_ottoman_recovery.2.f:0 "'Each battalion is to muster by the roll and draw rations by head count.'\n- A muster notice of the army reform"
 nesnd_ottoman_recovery.2.a:0 "Let [SCOPE.sCharacter('nesnd_qinist_leader').GetLastName] finish speaking."
