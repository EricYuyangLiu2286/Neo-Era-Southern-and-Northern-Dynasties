 nesnd_ottoman_recovery:0 "Restoring the Eastern Order"
 nesnd_ottoman_recovery_reason:0 "The Near Western War exposed the weaknesses of the old army. With Western Qin driven out of central China, officers in Istanbul urge an advance eastward to restore Ottoman standing in the Islamic world.\n\nThe achievements and failures of the Tanzimat will shape this army. The government must raise the money and decide how much strength to devote to territorial demands and how much to military reform."
 nesnd_ottoman_recovery_success_status:0 "The Tanzimat has succeeded, strengthening military reform and mobilization."
 nesnd_ottoman_recovery_failed_status:0 "The Tanzimat has failed, limiting the results of military reform and mobilization."
 nesnd_ottoman_recovery_ongoing_status:0 "The Tanzimat is still underway, while competition in the east has already begun."
