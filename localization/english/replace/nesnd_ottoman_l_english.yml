 nesnd_ottoman_barracks_grievance:0 "Barracks Grievance"
 nesnd_ottoman_army_vexed:0 "Barracks Vexed"
 nesnd_ottoman_recovery.9.t:0 "The Constitutionalist Writers"
 nesnd_ottoman_recovery.9.d:0 "The universities and new schools of [ROOT.GetCountry.GetName] have produced a group of officials and writers. They want a charter that binds the ministers and a parliament that debates the affairs of state, and they call themselves the heirs of the Tanzimat.\n\nSome in the [SCOPE.gsInterestGroup('nesnd_charter_ig').GetName] propose bringing the most respected of them into government. The officers of the [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName] say these men can only write articles, and the empire has no use for them."
 nesnd_ottoman_recovery.9.f:0 "'Ministers must be bound by a charter, and the affairs of state debated in parliament.'\n- Leaflet of the constitutionalist writers"
 nesnd_ottoman_recovery.9.a:0 "Bring this writer into government."
 nesnd_ottoman_recovery.9.b:0 "Drive the ringleaders out of the capital."
 nesnd_ottoman_recovery.10.t:0 "The Qin Barracks Rules"
 nesnd_ottoman_recovery.10.d:0 "[SCOPE.sCharacter('nesnd_barracks_leader').GetFullName] has found a method in the Qin-style regulations: the army keeps its own funds and runs its own military supply factories, without depending on the treasury for everything. This leader of the [SCOPE.gsInterestGroup('nesnd_barracks_ig').GetName] asks [ROOT.GetCountry.GetName] to adopt it and hand the money and workshops for army supply to the [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName].\n\nThe treasury officials fear that an army with its own revenue will no longer obey the government."
 nesnd_ottoman_recovery.10.f:0 "'The army's money and grain are managed by the army.'\n- Article of the Qin-style barracks rules"
 nesnd_ottoman_recovery.10.a:0 "Grant the request."
 nesnd_ottoman_recovery.10.b:0 "Army supply stays with the treasury."
 nesnd_ottoman_recovery.10.third_tt:0 "This is the third rejection of the barracks rules in a row"
 nesnd_ottoman_recovery.10.count_tt:0 "One more rejection of the barracks rules is recorded. A third in a row will bring a coup or open resentment from the barracks"
 nesnd_ottoman_recovery.11.t:0 "Proclaiming the Charter"
 nesnd_ottoman_recovery.11.d:0 "The constitutionalists' demands are now the law of the empire. What remains is who elects the parliament. One side wants it made up of provincial notables and officials, the other wants men of landed property to vote for its members."
 nesnd_ottoman_recovery.11.f:0 "'The parliament is established by this Charter and elected under it.'\n- Text of the proclaimed Charter"
 nesnd_ottoman_recovery.11.a:0 "A parliament of notables and officials."
 nesnd_ottoman_recovery.11.b:0 "Let men of landed property vote."
 nesnd_ottoman_islam_leader:0 "Leader of the Islamic World"
 nesnd_ottoman_islam_leader_reason:0 "During the Fourth Near Western War, the Islamic world acclaimed the Ottomans as leader of the Righteous Jihad. With the Tanzimat complete, the constitutional empire faces a rival power to the north and Western Qin to the east.\n\nIstanbul must secure its footing across the Black Sea, the Caucasus and Central Asia, holding that standing through its contest with the northern rival and its dealings with Western Qin."
 nesnd_ottoman_islam_leader_status_crimea:0 "War has broken out across the Black Sea and the Caucasus, testing the empire's standing."
 nesnd_ottoman_islam_leader_status_order:0 "Mesopotamia and Syria are under direct rule, and the empire is consolidating its standing in the Islamic world."
 nesnd_ottoman_islam_leader_status_ongoing:0 "The empire is seeking diplomatic initiative between its northern neighbour and Western Qin."
 nesnd_ottoman_islam_leader_crimea_win_tt:0 "The Ottoman side wins the war on the Black Sea and the Caucasus"
 nesnd_ottoman_islam_leader_order_win_tt:0 "Achieved the '$nesnd_ottoman_eastern_order$' outcome and this journal entry has been active for at least #v 60#! months"
 nesnd_ottoman_islam_leader_win_conclusion:0 "The constitutional empire has secured its place as Leader of the Islamic World between its northern neighbour and Western Qin."
 nesnd_ottoman_islam_leader_win_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.12.t$', choose one:\n• $nesnd_ottoman_recovery.12.a$: permanently gain '$nesnd_ottoman_caliphate$' (raises [concept_prestige], shared-religion [concept_acceptance] and Devout [concept_approval])\n• $nesnd_ottoman_recovery.12.b$: sharply improve [concept_relations] with up to two great powers holding interests in the Balkans or the Near East, permanently gain '$nesnd_ottoman_concert$', and, where a treaty is possible, sign a [concept_defensive_pact] with one of them"
 nesnd_ottoman_islam_leader_failed_crimea_tt:0 "The northern rival wins the war on the Black Sea and the Caucasus"
 nesnd_ottoman_islam_leader_failed_conclusion:0 "Defeated on the Black Sea and still without Baghdad, the empire has lost its standing in the Islamic world."
 nesnd_ottoman_islam_leader_failed_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.13.t$': the empire's eastern order passes back to the checks of '$nesnd_ottoman_recovery$'."
 nesnd_ottoman_islam_leader_timeout_conclusion:0 "Twenty-five years have passed, and Istanbul has left the claim to leadership of the Islamic world unproven."
 nesnd_ottoman_islam_leader_timeout_event_tt:0 "The title of leader is left to whoever comes after."
 nesnd_ottoman_islam_leader_lost_autonomy_tt:0 "Unable to act abroad for #v 12#! months running: a [concept_subject] of another country, or without all of Eastern Thrace"
 nesnd_ottoman_islam_leader_lost_autonomy_conclusion:0 "The empire's foreign affairs are now settled by others, and Istanbul can no longer speak for the Islamic countries. Muslim rulers have stopped sending their envoys to the Sublime Porte."
 nesnd_ottoman_islam_leader_lost_autonomy_event_tt:0 "Claims already made are kept."
 nesnd_ottoman_islam_leader_invalid_conclusion:0 "The constitutional empire no longer stands, and the matter is closed."
 nesnd_ottoman_fund_tribes:0 "Fund Frontier Tribes"
 nesnd_ottoman_fund_tribes_desc:0 "Disburse funds covertly to the frontier tribes under Western Qin rule, straining its hold over Central Asia."
 nesnd_ottoman_seek_qin_pact:0 "Seek a Pact with Western Qin"
 nesnd_ottoman_seek_qin_pact_desc:0 "Send envoys to Western Qin to propose a [concept_defensive_pact] against our northern rival."
 nesnd_ottoman_seek_qin_pact_tt:0 "Send Western Qin an offer to conclude a [concept_defensive_pact]."
 nesnd_ottoman_qin_cd_tt:0 "#v 24#! months have passed since the last diplomatic action toward Western Qin"
 nesnd_ottoman_qin_cd_set_tt:0 "Neither $nesnd_ottoman_fund_tribes$ nor $nesnd_ottoman_seek_qin_pact$ can be used for #v 24#! months"
 nesnd_ottoman_challenge_russia:0 "Challenge the Northern Rival"
 nesnd_ottoman_challenge_russia_desc:0 "Launch a [concept_diplomatic_play] against our northern rival over Crimea or the Caucasus, opening the northern contest."
 nesnd_ottoman_challenge_russia_tt:0 "Launch a [concept_diplomatic_play] for a target state in Crimea or the Caucasus held by the northern rival."
 nesnd_north_foe_valid_tt:0 "An independent northern rival stands ready to be challenged"
 nesnd_north_foe_peaceful_tt:0 "We have no active [concept_war], [concept_diplomatic_play], or [concept_truce] with the northern rival"
 nesnd_crimea_not_active_tt:0 "The northern conflict is not already underway"
 nesnd_crimea_not_ended_tt:0 "The northern conflict has not yet been decided, or the reopening cooldown has elapsed"
 nesnd_crimea_rus_holds_target_tt:0 "The northern rival holds land in at least one of Crimea, Kars, Greater Caucasus, Armenia, Azerbaijan or Elizavetpol"
 nesnd_crimea_title_rus:0 "The Crimean War"
 nesnd_crimea_title_north:0 "The Northern War"
 nesnd_rtw_title_rus:0 "The Russo-Turkish War"
 nesnd_rtw_title_north:0 "The Northern Threat"
 nesnd_crimea_play:0 "War on the Black Sea and Caucasus"
 nesnd_crimea_tur:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_crimea_title')]"
 nesnd_crimea_tur_reason:0 "A [concept_diplomatic_play] over the Black Sea and the Caucasus is underway. Istanbul may appeal to interested great powers to join the contest, drive the northern rival back and secure Ottoman standing across the Black Sea and the Islamic world."
 nesnd_crimea_rus:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_crimea_title')]"
 nesnd_crimea_rus_reason:0 "The contest with the Ottomans over the Black Sea, the Balkans and the Caucasus has begun. The General Staff must force Istanbul to yield before outside powers close the Black Sea."
 nesnd_crimea_helper:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_crimea_title')]"
 nesnd_crimea_helper_reason:0 "Conflict has broken out between the Ottomans and their northern rival over the Black Sea and the Caucasus. Having answered the Porte's appeal, we must weigh our commitment and the course of the war to check northern expansion toward the Straits and the Near East."
 nesnd_crimea_status_war:0 "The [concept_war] across the Black Sea and the Caucasus is underway."
 nesnd_crimea_status_play:0 "Both sides are mobilising and seeking backers in the [concept_diplomatic_play]."
 nesnd_crimea_status_lull:0 "Fighting has paused, though the Black Sea dispute remains unsettled."
 nesnd_crimea_ally_status_joined:0 "We have entered the northern conflict on the Ottoman side."
 nesnd_crimea_ally_status_watching:0 "We have not yet committed forces to the fighting."
 nesnd_north_tur_lost_tt:0 "Both the [concept_diplomatic_play] and [concept_war] with the northern rival have ended, and we had a war goal enforced on us, lost a region wholly held at the outset, or became a [concept_subject]"
 nesnd_north_tur_won_tt:0 "Both the [concept_diplomatic_play] and [concept_war] with the northern rival have ended without Ottoman defeat, and our side enforced a war goal or took a northern target region held by the rival at the outset"
 nesnd_north_war_drawn_tt:0 "Both the [concept_diplomatic_play] and [concept_war] with the northern rival have ended, with neither side achieving its goals"
 nesnd_north_lost_autonomy_tt:0 "No war has broken out, and we have been unable to act abroad for #v 12#! months running (a [concept_subject] or without all of Eastern Thrace)"
 nesnd_north_lost_autonomy_conclusion:0 "Having lost control of its foreign policy, Istanbul can no longer marshal armies on the northern frontier. Garrisons draw back into the interior, and the northern confrontation closes."
 nesnd_north_lost_autonomy_event_tt:0 "Autonomy lost: grants '$nesnd_ottoman_lost_autonomy$' if not already held; existing [concept_claim]s are kept."
 nesnd_north_situation_changed_tt:0 "The northern rival no longer exists, has become a [concept_subject], or has allied with us, and no [concept_war] continues between us"
 nesnd_north_situation_changed_claims_tt:0 "Grants [concept_claim]s on northern target regions formerly held by the rival that remain outside our hands (or on Crimea and Kars if unavailable)"
 nesnd_north_situation_changed_conclusion:0 "The northern balance has shifted abruptly, and the rival that stood across the frontier is no longer there. Istanbul lays aside its war plans for now, keeps its claims along the northern shore and the Caucasus, and waits to see what power takes its place."
 nesnd_north_situation_changed_event_tt:0 "Situation changed: retains [concept_claim]s on northern target regions; after #v 24#! months the contest may open again against a newly selected rival."
 nesnd_north_reopen_cd_tt:0 "After #v 24#! months this contest may open again against a newly selected northern rival."
 nesnd_crimea_timeout_tt:0 "#v 120#! months have passed since this journal opened, and no [concept_diplomatic_play] or [concept_war] with the northern rival is underway"
 nesnd_crimea_result_ottoman_tt:0 "The Ottoman side has won the northern war"
 nesnd_crimea_result_russia_tt:0 "The northern rival's side has won the northern war"
 nesnd_crimea_result_none_tt:0 "The northern war has ended inconclusively"
 nesnd_crimea_tur_win_conclusion:0 "The Ottoman side has driven the northern rival back across the Black Sea and the Caucasus."
 nesnd_crimea_tur_win_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.14.t$': permanently raises [concept_prestige], grants [concept_claim]s on remaining Crimean and Caucasus target states, and advances '$nesnd_ottoman_islam_leader$'."
 nesnd_crimea_tur_loss_conclusion:0 "The Ottomans have suffered defeat against the northern rival on the Black Sea and in the Caucasus."
 nesnd_crimea_tur_loss_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.15.t$': permanently lowers [concept_prestige]; if '$nesnd_ottoman_charter$' is active, the constitutionalists count #v 1#! more item for #v 60#! months."
 nesnd_crimea_rus_win_conclusion:0 "Our forces have defeated the Ottomans across the Black Sea and the Caucasus."
 nesnd_crimea_rus_win_event_tt:0 "Triggers the event '$nesnd_crimea.3.t$': permanently raises [concept_prestige]."
 nesnd_crimea_rus_loss_conclusion:0 "Our forces have suffered defeat against the Ottoman coalition on the Black Sea."
 nesnd_crimea_rus_loss_event_tt:0 "Triggers the event '$nesnd_crimea.4.t$': permanently lowers [concept_prestige]."
 nesnd_crimea_stalemate_conclusion:0 "The dispute over the Black Sea and the Caucasus has dragged on without a decisive verdict."
 nesnd_crimea_inconclusive_conclusion:0 "The contest across the Black Sea and the Caucasus ended without a verdict, and the dispute has been set aside for now."
 nesnd_crimea_stalemate_event_tt:0 "The conflict ends inconclusively, costing both sides a small amount of [concept_prestige]."
 nesnd_crimea_invalid_conclusion:0 "The parties to this northern conflict no longer hold their standing, closing the crisis."
 nesnd_crimea_ally_tur_win_conclusion:0 "The Ottoman side has won the northern war."
 nesnd_crimea_ally_rus_win_conclusion:0 "The northern rival has won the northern war."
 nesnd_crimea_ally_joined_win_tt:0 "We joined and prevailed: permanently gain '$nesnd_crimea_ally_victory$' and improve [concept_relations] with the Ottomans."
 nesnd_crimea_ally_stayed_out_tur_win_tt:0 "We stayed out of the war: [concept_relations] with the Ottomans decline."
 nesnd_crimea_ally_joined_loss_tt:0 "We joined and suffered defeat: permanently gain '$nesnd_crimea_ally_defeat$' and lose [concept_relations] with the northern rival."
 nesnd_crimea_ally_stayed_out_rus_win_tt:0 "We stayed out of the war: [concept_relations] with the northern rival improve."
 nesnd_crimea_ally_joined_draw_tt:0 "We backed the Ottomans: [concept_relations] with the Ottomans improve slightly."
 nesnd_crimea_ally_stayed_out_draw_tt:0 "We stayed out of the war: [concept_relations] with the Ottomans cool slightly."
 nesnd_ottoman_caliphate:0 "Empire of the Caliph"
 nesnd_ottoman_concert:0 "Concert of Europe"
 nesnd_ottoman_crimean_humiliation:0 "Crimean Humiliation"
 nesnd_ottoman_leader_unclaimed:0 "Unclaimed Leadership"
 nesnd_ottoman_lost_autonomy:0 "Autonomy Lost"
 nesnd_ottoman_tribes_funded:0 "Ottoman-Backed Frontier Tribes"
 nesnd_qe1_frontier_bolstered:0 "Frontier Garrisons Reinforced"
 nesnd_crimea_victory:0 "Black Sea Victory"
 nesnd_crimea_defeat:0 "Black Sea Defeat"
 nesnd_crimea_stalemate:0 "Black Sea Stalemate"
 nesnd_crimea_ally_victory:0 "Triumph on the Black Sea"
 nesnd_crimea_ally_defeat:0 "Setback on the Black Sea"
 nesnd_ottoman_recovery.12.t:0 "Caliph or Great Power"
 nesnd_ottoman_recovery.12.d:0 "Through years of war and statecraft, [ROOT.GetCountry.GetName] has secured its authority across the Near East, the Caucasus and Central Asia. In the ministries of Istanbul, two foreign proposals now lie before the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle].\n\nThe [SCOPE.gsInterestGroup('nesnd_devout_ig').GetName] urge the throne to reaffirm the leadership won during the Righteous Jihad and raise the banner of the Caliphate for the Muslims of Central Asia and the Near East. Officials at the Foreign Ministry have drawn up a separate plan, proposing that the empire enter the Concert of Europe as an equal power and conclude treaties with European great powers to hold the northern neighbour in check."
 nesnd_ottoman_recovery.12.f:0 "'The empire sits astride the Bosporus, looking east to Mecca and Transoxiana, and west to Paris and London.'\n- Memorandum of the Istanbul Foreign Ministry"
 nesnd_ottoman_recovery.12.a:0 "Raise the banner of the Caliphate."
 nesnd_ottoman_recovery.12.b:0 "Take our seat among the European powers."
 nesnd_ottoman_recovery.13.t:0 "Crimean Humiliation"
 nesnd_ottoman_recovery.13.d:0 "The war against [SCOPE.sCountry('nesnd_north_foe_scope').GetName] has ended in defeat, and Baghdad remains outside the rule of [ROOT.GetCountry.GetName]. From Damascus to Cairo, congregations question whether Istanbul can still shield the Islamic world.\n\nThe cabinet is forced to draw in its lines, and the appetite for expansion cools."
 nesnd_ottoman_recovery.13.d_plain:0 "The war on the Black Sea has ended in defeat, and Baghdad remains outside the rule of [ROOT.GetCountry.GetName]. From Damascus to Cairo, congregations question whether Istanbul can still shield the Islamic world.\n\nThe cabinet is forced to draw in its lines, and the appetite for expansion cools."
 nesnd_ottoman_recovery.13.f:0 "'Checked on the Black Sea, Mesopotamia unrecovered, and the provinces watching.'\n- Confidential frontier report to the cabinet"
 nesnd_ottoman_recovery.13.a:0 "Hold the provinces we still possess."
 nesnd_ottoman_recovery.13.a_tt:0 "The eastern order passes back to the existing outcomes of '$nesnd_ottoman_recovery$'."
 nesnd_ottoman_recovery.14.t:0 "Victory on the Black Sea"
 nesnd_ottoman_recovery.14.d:0 "The armistice dispatches have reached Istanbul: the advance of [SCOPE.sCountry('nesnd_north_foe_scope').GetName] across the Black Sea and the Caucasus has been broken. The army reorganised under the Tanzimat has stood the test of battle, and provincial gazettes print the front-line reports across the empire.\n\nInitiative along the Black Sea coast and the Caucasus passes now belongs to [ROOT.GetCountry.GetName], and voices across the Islamic world look once more to Istanbul."
 nesnd_ottoman_recovery.14.d_plain:0 "The armistice dispatches have reached Istanbul: the fighting across the Black Sea and the Caucasus has ended in victory for [ROOT.GetCountry.GetName]. The army reorganised under the Tanzimat has stood the test of battle, and provincial gazettes print the front-line reports across the empire.\n\nInitiative along the Black Sea coast and the Caucasus passes now belongs to the empire, and voices across the Islamic world look once more to Istanbul."
 nesnd_ottoman_recovery.14.f:0 "'The enemy armies have retired to the northern shore, and the passes of the Caucasus stand open.'\n- War Ministry bulletin to the provinces"
 nesnd_ottoman_recovery.14.a:0 "Proclaim the empire's victory."
 nesnd_ottoman_recovery.14.a_tt:0 "This victory clears the path to complete '$nesnd_ottoman_islam_leader$'."
 nesnd_ottoman_recovery.15.t:0 "Setback on the Black Sea"
 nesnd_ottoman_recovery.15.d:0 "Word of the retreat from the front has reached Istanbul, and [ROOT.GetCountry.GetName] has been forced to concede terms to [SCOPE.sCountry('nesnd_north_foe_scope').GetName]. In the council chamber, constitutionalist deputies blame the army's high-handedness for the failure of preparation and press for wider civilian and parliamentary oversight.\n\nPetitions of censure pile up before the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle], while senior commanders find little to say in reply."
 nesnd_ottoman_recovery.15.d_plain:0 "Word of the retreat from the front has reached Istanbul, and [ROOT.GetCountry.GetName] has been forced to accept harsh terms. In the council chamber, constitutionalist deputies blame the army's high-handedness for the failure of preparation and press for wider civilian and parliamentary oversight.\n\nPetitions of censure pile up before the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle], while senior commanders find little to say in reply."
 nesnd_ottoman_recovery.15.f:0 "'Defeat on the northern front came because the barracks answered to no charter.'\n- Editorial in an Istanbul newspaper"
 nesnd_ottoman_recovery.15.a:0 "Contain the damage."
 nesnd_ottoman_recovery.15.a_tt:0 "If Baghdad is also not under direct Ottoman rule, '$nesnd_ottoman_islam_leader$' will fail."
 nesnd_crimea.1.t:0 "Initiative on the Black Sea"
 nesnd_crimea.1.d:0 "Having completed the Tanzimat, [SCOPE.sCountry('nesnd_tur_country').GetName] has rebuilt its army and is courting powers across Europe and Asia as leader of the Islamic world. Staff officers argue that [ROOT.GetCountry.GetName] should strike first along the Danube or the Caucasus rather than wait for Istanbul to complete its mobilisation and gather allies.\n\nMinisters at the Foreign Office warn the government that opening hostilities may draw other powers with interests in the Straits into the fray."
 nesnd_crimea.1.f:0 "'If our adversary is allowed to complete its rearmament, the Black Sea fleet will be bottled up.'\n- Submission of a General Staff officer"
 nesnd_crimea.1.a:0 "Strike first and press the Ottomans."
 nesnd_crimea.1.b:0 "Hold our hand and watch."
 nesnd_crimea.1.b_tt:0 "Refrain from launching a [concept_diplomatic_play]; this proposal will not return for three years."
 nesnd_crimea.3.t:0 "Triumph on the Black Sea"
 nesnd_crimea.3.d:0 "The war against [SCOPE.sCountry('nesnd_tur_country').GetName] has ended in victory for [ROOT.GetCountry.GetName]. Celebration fills the capital: our positions along the Caucasus and the Black Sea are secure, and Istanbul's bid to reclaim its old prestige has been dealt a heavy blow."
 nesnd_crimea.3.d_plain:0 "The war on the Black Sea and in the Caucasus has ended in victory for [ROOT.GetCountry.GetName]. Celebration fills the capital, and our southern frontier stands secure."
 nesnd_crimea.3.f:0 "'The Black Sea is calm, and the southern border is secure.'\n- Address of congratulation from a senior minister"
 nesnd_crimea.3.a:0 "Consolidate the southern gains."
 nesnd_crimea.4.t:0 "Setback on the Black Sea"
 nesnd_crimea.4.d:0 "In the contest along the Black Sea and the Caucasus, [ROOT.GetCountry.GetName] proved unable to overcome [SCOPE.sCountry('nesnd_tur_country').GetName] and its backers. Dispatches from the front have shaken the capital, and senior commanders acknowledge that logistics and organisation lagged behind the enemy.\n\nOur government must curtail its southward ambitions for now and rebuild its armies and treasury in the north."
 nesnd_crimea.4.d_plain:0 "In the contest along the Black Sea and the Caucasus, [ROOT.GetCountry.GetName] proved unable to overcome its foes. Dispatches from the front have shaken the capital, and senior commanders acknowledge that logistics and organisation require urgent reform."
 nesnd_crimea.4.f:0 "'Supplies failed to arrive, and courage at the front was spent in vain.'\n- Retreat report from a front-line commander"
 nesnd_crimea.4.a:0 "Rebuild the army and bide our time."
 nesnd_ottoman_qe1.1.t:0 "Ottoman Funds for the Frontier Tribes"
 nesnd_ottoman_qe1.1.d:0 "Frontier garrisons have intercepted a caravan smuggling silver and firearms across the border. Under interrogation, the caravan leaders confessed that the funds came from [SCOPE.sCountry('nesnd_tur_country').GetName], bound for steppe and Afghan chieftains quietly organising unrest.\n\nThe caravan leaders' confessions and an inventory of the seized goods have reached court, listing the tribal contacts along the route. At the same time, several frontier garrisons report heavier movement of horsemen beyond the passes, with commissioned chieftains making excuses to stay away from scheduled councils."
 nesnd_ottoman_qe1.1.f:0 "'Western merchants entered the pass with silver and muskets, claiming orders from Istanbul to contact the tribes.'\n- Secret memorial from the frontier garrison"
 nesnd_ottoman_qe1.1.a:0 "Deliver a protest and mark them as enemies."
 nesnd_ottoman_qe1.1.b:0 "Release funds and reinforce the frontier."
 nesnd_ottoman_qe1.2.t:0 "Ottoman Offer of a Pact"
 nesnd_ottoman_qe1.2.d:0 "Envoys from [SCOPE.sCountry('nesnd_tur_country').GetName] have arrived at court bearing a state letter proposing that both empires set aside the old bitterness of the Near Western Wars and sign a defensive pact to check the advance of [SCOPE.sCountry('nesnd_north_foe_scope').GetName] into Central Asia and the Caucasus.\n\nThe envoys have attached draft treaty terms and arrangements for diplomatic correspondence to their letter and await the court's reply at their quarters. Recent dispatches from the northern frontier garrisons report that troops of [SCOPE.sCountry('nesnd_north_foe_scope').GetName] are strengthening outposts along the northern edge of the steppe, with patrols repeatedly approaching the defensive line of [ROOT.GetCountry.GetName]."
 nesnd_ottoman_qe1.2.d_plain:0 "Envoys from [SCOPE.sCountry('nesnd_tur_country').GetName] have arrived at court bearing a state letter proposing that both empires set aside the old bitterness of the Near Western Wars and sign a defensive pact to check northern expansion into Central Asia and the Caucasus.\n\nThe envoys have attached draft treaty terms and arrangements for diplomatic correspondence to their letter and await the court's reply at their quarters."
 nesnd_ottoman_qe1.2.f:0 "'Our northern neighbour eyes both the Caucasus and the steppe; together our two empires hold the line.'\n- State letter presented by the Ottoman envoys"
 nesnd_ottoman_qe1.2.a:0 "Sign the defensive pact."
 nesnd_ottoman_qe1.2.b:0 "Decline Istanbul's proposal."
 nesnd_ottoman_qe1.3.t:0 "Ottoman Call to Arms"
 nesnd_ottoman_qe1.3.d:0 "Conflict has broken out between [SCOPE.sCountry('nesnd_tur_country').GetName] and [SCOPE.sCountry('nesnd_north_foe_scope').GetName] over the Black Sea and the Caucasus. Urgent envoys from Istanbul have reached court, asking [ROOT.GetCountry.GetName] to join the war and strike [SCOPE.sCountry('nesnd_north_foe_scope').GetName] from the east.\n\nThe Ottoman couriers have delivered sealed dispatches reporting that the main forces of [SCOPE.sCountry('nesnd_north_foe_scope').GetName] are marching west in strength toward the Black Sea and the Caucasus. Word from the northern garrisons confirms that opposing forces along the steppe have grown thinner than usual, and the frontier commands await orders from court."
 nesnd_ottoman_qe1.3.d_plain:0 "Conflict has broken out along the Black Sea and the Caucasus. Urgent envoys from [SCOPE.sCountry('nesnd_tur_country').GetName] have reached court, asking [ROOT.GetCountry.GetName] to join the war and strike the northern adversary from the east.\n\nThe Ottoman couriers have delivered sealed dispatches reporting that opposing forces are tied down on the Black Sea front, and the frontier commands await orders from court."
 nesnd_ottoman_qe1.3.f:0 "'War has opened on the Black Sea; we ask your court to take up arms with us against our northern neighbour.'\n- Urgent letter from Istanbul to Western Qin"
 nesnd_ottoman_qe1.3.a:0 "Take the field alongside the Ottomans."
 nesnd_ottoman_qe1.3.b:0 "Keep our armies in garrison and watch."
 nesnd_ottoman_academy_1:0 "Academies and the Press: The University"
 nesnd_ottoman_academy_1_reason:0 "The new schools and newspapers founded during the Tanzimat must put down lasting roots within the constitutional empire. The state must establish universities and public schools, lift nationwide [concept_literacy], and bring secular learning to the provinces.\n\nThe ulema continue to guard [GetLawType('law_religious_schools').GetName] and traditional instruction. All four stages must be completed within twenty-five years, or control over schooling will return to the ulema."
 nesnd_ottoman_academy_2:0 "Academies and the Press: Public Schools"
 nesnd_ottoman_academy_2_reason:0 "With universities and literacy foundations in place, the next stage brings primary and secondary instruction under state administration. Enacting [GetLawType('law_public_schools').GetName] is required to sustain state-run secular schools across the provinces.\n\nThe ulema continue to rally religious opposition against secular schooling. All four stages must be completed within twenty-five years of the opening stage."
 nesnd_ottoman_academy_3:0 "Academies and the Press: Press and Assembly"
 nesnd_ottoman_academy_3_reason:0 "A growing public educated in the universities and [GetLawType('law_public_schools').GetName] has expanded the newspapers and societies of Istanbul and the provinces. The empire must secure [GetLawType('law_right_of_assembly').GetName] or [GetLawType('law_protected_speech').GetName] so public debate endures under legal protection.\n\nThe ulema watch every secular step closely. All four stages must be completed within twenty-five years of the opening stage."
 nesnd_ottoman_academy_4:0 "Academies and the Press: The Arts Academy"
 nesnd_ottoman_academy_4_reason:0 "Universities, [GetLawType('law_public_schools').GetName] and an open press are now established, leaving a final stage for imperial enlightenment: founding at least one Arts Academy within the realm to carry literature, painting and architecture alongside modern instruction.\n\nCompleting this final stage within twenty-five years of the first will anchor enlightenment across the constitutional empire."
 nesnd_ottoman_academy_1_status:0 "Stage 1 of 4: Expand a university and raise national [concept_literacy]."
 nesnd_ottoman_academy_2_status:0 "Stage 2 of 4: Enact [GetLawType('law_public_schools').GetName]."
 nesnd_ottoman_academy_3_status:0 "Stage 3 of 4: Establish [GetLawType('law_right_of_assembly').GetName] or [GetLawType('law_protected_speech').GetName]."
 nesnd_ottoman_academy_4_status:0 "Stage 4 of 4: Establish an Arts Academy within the country."
 nesnd_ottoman_academy_1_win_conclusion:0 "Universities and literacy foundations are secured, and educational reform moves to the second stage."
 nesnd_ottoman_academy_1_win_event_kemal_tt:0 "Opens the next stage '$nesnd_ottoman_academy_2$' and triggers the event '$nesnd_ottoman_recovery.16.t$'."
 nesnd_ottoman_academy_1_win_event_tt:0 "Opens the next stage '$nesnd_ottoman_academy_2$'."
 nesnd_ottoman_academy_1_schools_done_tt:0 "The new schools were already founded during the Tanzimat"
 nesnd_ottoman_academy_2_win_conclusion:0 "[GetLawType('law_public_schools').GetName] is now in force, and reform moves to the press and public assembly."
 nesnd_ottoman_academy_2_win_event_tt:0 "Opens the next stage '$nesnd_ottoman_academy_3$'."
 nesnd_ottoman_academy_3_win_conclusion:0 "The press and public assembly stand under legal protection, bringing the programme to its final stage."
 nesnd_ottoman_academy_3_win_event_tt:0 "Opens the next stage '$nesnd_ottoman_academy_4$'."
 nesnd_ottoman_academy_4_win_conclusion:0 "Universities, public schools, the press and the Arts Academy have taken root across the constitutional empire."
 nesnd_ottoman_academy_4_win_event_tt:0 "Completes all four stages: permanently grants '$nesnd_ottoman_enlightenment$' and shifts the Intelligentsia toward a progressive ideology; if '$nesnd_ottoman_charter$' is active, the constitutionalists count #v 1#! more item for #v 60#! months."
 nesnd_ottoman_academy_timeout_tt:0 "#v 300#! months have passed since '$nesnd_ottoman_academy_1$' opened"
 nesnd_ottoman_academy_ulema_conclusion:0 "Twenty-five years have passed without completing the secular programme, and the ulema have reclaimed authority over the empire's schools."
 nesnd_ottoman_academy_ulema_event_tt:0 "The ulema prevail: if not already active and available, the empire enacts [GetLawType('law_religious_schools').GetName]; permanently grants '$nesnd_ottoman_ulema_schools$'; if '$nesnd_ottoman_charter$' is active, the barracks party counts #v 1#! more item for #v 60#! months."
 nesnd_ottoman_academy_invalid_conclusion:0 "The constitutional empire no longer stands, and the programme of academies and press has ended."
