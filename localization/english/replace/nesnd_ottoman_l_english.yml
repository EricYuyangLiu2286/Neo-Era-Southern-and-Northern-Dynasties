 nesnd_north_seek_help_desc:0 "Deliver a formal diplomatic note to an interested major power in the Balkans, Anatolia, or the Caucasus asking it to stand with the Sublime Porte."
 nesnd_north_has_helper_tt:0 "At least one eligible major power has not yet been approached for aid"
 nesnd_north_asked_limit_tt:0 "Fewer than #v 2#! foreign appeals have been sent during this crisis"
