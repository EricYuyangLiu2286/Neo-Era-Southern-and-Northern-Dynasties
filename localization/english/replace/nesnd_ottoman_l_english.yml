 nesnd_ottoman_claims_voided_tt:0 "Our [concept_claim]s on every state covered by the enthusiasm buttons are voided"
 nesnd_ottoman_recovery.3.t:0 "Eastern Order"
 nesnd_ottoman_recovery.3.d:0 "In the summer of 1723 the Qin army lifted its siege of Baghdad, and that battle became the turning point of the Fourth Near Western War. Baghdad, Mosul, Basra, Syria and Aleppo are all now under the direct rule of [ROOT.GetCountry.GetName], and Mesopotamia and Syria form a single whole.\n\nThe officers in Istanbul say the next step is to cross Khorasan and march on Herat and Transoxiana. Other ministers want the new cities governed well first, so that the Muslims there come to see the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]'s government as their own."
 nesnd_ottoman_recovery.3.f:0 "'From Baghdad, Mosul and Basra to Syria and Aleppo, every province shall keep the laws of the empire alike.'\n- Decree on the annexation of Mesopotamia"
 nesnd_ottoman_recovery.3.a:0 "Press east"
 nesnd_ottoman_recovery.3.b:0 "Consolidate"
 nesnd_ottoman_recovery.3.no_frontier_tt:0 "There is no land to claim in the five Central Asian frontier states right now."
 nesnd_ottoman_recovery.3.b_tt:0 "$nesnd_ottoman_unity_order_desc$ in '$nesnd_ottoman_unity$' gains #v 0.1#! more each month"
 nesnd_ottoman_recovery.4.t:0 "End of the Old Order"
 nesnd_ottoman_recovery.4.d:0 "[SCOPE.sCountry('nesnd_thrace_taker').GetName] has taken land in Eastern Thrace, and the capital has lost its shield. More than a hundred years ago the armies of Russia and Qin stood before Istanbul and could not take it.\n\nThe ministers have two courses left: move into the Anatolian interior, or seek help from the rivals of [SCOPE.sCountry('nesnd_thrace_taker').GetName]."
 nesnd_ottoman_recovery.4.d_unknown:0 "Eastern Thrace no longer belongs wholly to the empire, and the capital has lost its shield. More than a hundred years ago the armies of Russia and Qin stood before Istanbul and could not take it.\n\nThe ministers have two courses left: move into the Anatolian interior, or seek help abroad."
 nesnd_ottoman_recovery.4.f:0 "'Eastern Thrace is lost, and the gates of Istanbul stand open.'\n- Dispatch to the provinces"
 nesnd_ottoman_recovery.4.a:0 "Move the capital to Ankara"
 nesnd_ottoman_recovery.4.b:0 "Seek help"
 nesnd_ottoman_recovery.4.no_rival_tt:0 "No country is currently a rival of theirs to turn to."
 nesnd_ottoman_recovery.5.t:0 "A Constitutional Empire"
 nesnd_ottoman_recovery.5.d:0 "With the Tanzimat complete, [ROOT.GetCountry.GetName] has new schools, a new army and a new civil service. The men who led the reforms say the next step is a charter that binds the ministers and the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle], and brings educated men like the [SCOPE.gsInterestGroup('nesnd_route_charter_ig').GetName] into government.\n\nThe officers trained by the Qin-style army reform think otherwise. In their view the reforms succeeded because of the army's discipline, and the empire should have a single chain of command and no parliament. The [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName] and the reformers each claim to be the heirs of the Tanzimat."
 nesnd_ottoman_recovery.5.d_plain:0 "With the Tanzimat complete, [ROOT.GetCountry.GetName] has new schools, a new army and a new civil service. The men who led the reforms say the next step is a charter that binds the ministers and the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle], and brings educated men like the [SCOPE.gsInterestGroup('nesnd_route_charter_ig').GetName] into government.\n\nThe officers think otherwise. In their view the reforms succeeded because of the army's discipline, and the empire should have a single chain of command and no parliament. The [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName] and the reformers each claim to be the heirs of the Tanzimat."
 nesnd_ottoman_recovery.5.f:0 "'Ministers and Sultan alike are bound by this Charter.'\n- Draft charter of the reformers"
 nesnd_ottoman_recovery.5.a:0 "The charter first"
 nesnd_ottoman_recovery.5.b:0 "The barracks first"
 nesnd_ottoman_recovery.6.t:0 "The Sultan's Empire"
 nesnd_ottoman_recovery.6.d:0 "With the old [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle] dead, a new [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle] takes the throne of a broken empire. The subject states have gone their own way, the great powers no longer treat [ROOT.GetCountry.GetName] as their equal, and the Tanzimat has failed to modernise the empire.\n\nThe [SCOPE.gsInterestGroup('nesnd_route_faith_ig').GetName] urge the new [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle] to rule in person, and to call the Muslims of every land to rally around Istanbul in the name of the leader of the Islamic world. The officers trained by the Qin-style army reform believe only the army can hold what is left, and the [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName] demand that government be handed to men who know how to fight."
 nesnd_ottoman_recovery.6.d_plain:0 "With the old [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle] dead, a new [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle] takes the throne of a broken empire. The subject states have gone their own way, the great powers no longer treat [ROOT.GetCountry.GetName] as their equal, and the Tanzimat has failed to modernise the empire.\n\nThe [SCOPE.gsInterestGroup('nesnd_route_faith_ig').GetName] urge the new [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle] to rule in person, and to call the Muslims of every land to rally around Istanbul in the name of the leader of the Islamic world. The officers believe only the army can hold what is left, and the [SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName] demand that government be handed to men who know how to fight."
 nesnd_ottoman_recovery.6.f:0 "'We beg the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle] to rule in person, and to call the Muslims of every land in the name of the leader of the Islamic world.'\n- Petition to the new [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]"
 nesnd_ottoman_recovery.6.a:0 "The Sultan rules"
 nesnd_ottoman_recovery.6.b:0 "Lean on the barracks"
 nesnd_ottoman_recovery.7.t:0 "Peoples United"
 nesnd_ottoman_recovery.7.d:0 "For three years running, no great wave of estrangement has swept the lands of [ROOT.GetCountry.GetName]. Anatolian officials, provincial notables and the newly joined peoples alike have begun to treat the Ottoman government as the place where their own affairs are settled.\n\nWhether the empire follows the constitution or the [SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]'s personal rule, the place of each people in government is still to be fought over."
 nesnd_ottoman_recovery.7.f:0 "'The affairs of subjects of every people shall be handled alike by the imperial government.'\n- Government gazette"
 nesnd_ottoman_recovery.7.a:0 "Show favour to the main peoples of each province."
 nesnd_ottoman_recovery.7.no_state_tt:0 "The largest culture of every incorporated state is currently one of our primary cultures."
 nesnd_ottoman_recovery.8.t:0 "Peoples Estranged"
 nesnd_ottoman_recovery.8.d:0 "For two years running, the unity of [ROOT.GetCountry.GetName] has stayed low. In places like [SCOPE.sState('nesnd_discord_state').GetName], where [SCOPE.sCulture('nesnd_turkish_culture').GetName] people are not the majority, people no longer believe that Istanbul will look after their interests.\n\nThe government has lost the hearts of these lands."
 nesnd_ottoman_recovery.8.d_none:0 "For two years running, the unity of [ROOT.GetCountry.GetName] has stayed low. People across the provinces no longer believe that Istanbul will look after their interests.\n\nThe government has lost the hearts of the provinces."
 nesnd_ottoman_recovery.8.f:0 "'Istanbul will not look after our interests.'\n- Leaflet passed around the provinces"
 nesnd_ottoman_recovery.8.a:0 "The provinces' anger can only be eased slowly."
 nesnd_ottoman_recovery.8.no_state_tt:0 "No state currently lacks a Turkish majority."
 nesnd_ottoman_charter:0 "Charter and Barracks"
 nesnd_ottoman_charter_reason:0 "With the Tanzimat complete, the men who led the reforms want a charter that brings the newly educated into government. The officers in the barracks want a state with a single chain of command, where soldiers hold the purse.\n\nEach side wants to remake the laws of the empire in its own image, and neither will give way."
 nesnd_ottoman_charter_status_charter:0 "More of the constitutionalists' demands are now law."
 nesnd_ottoman_charter_status_qin:0 "More of the barracks party's demands are now law."
 nesnd_ottoman_charter_status_even:0 "Both sides have as many demands written into law."
 nesnd_ottoman_charter_lean_charter_tt:0 "Chose $nesnd_ottoman_recovery.5.a$ in '$nesnd_ottoman_recovery.5.t$'"
 nesnd_ottoman_charter_lean_qin_tt:0 "Chose $nesnd_ottoman_recovery.5.b$ in '$nesnd_ottoman_recovery.5.t$'"
 nesnd_ottoman_charter_bonus_charter_tt:0 "Recently brought a constitutionalist writer into government"
 nesnd_ottoman_charter_bonus_qin_tt:0 "Recently let the army keep its own purse"
 nesnd_ottoman_charter_bonus_charter_gain_tt:0 "In '$nesnd_ottoman_charter$' the constitutionalists count #v 1#! more item for #v 60#! months"
 nesnd_ottoman_charter_bonus_qin_gain_tt:0 "In '$nesnd_ottoman_charter$' the barracks party counts #v 1#! more item for #v 60#! months"
 nesnd_ottoman_charter_c_laws_tt:0 "At least #v 4#! of the six constitutionalist law demands are met"
 nesnd_ottoman_charter_q_laws_tt:0 "At least #v 4#! of the six barracks party law demands are met"
 nesnd_ottoman_charter_constitution_event_tt:0 "Triggers the event '$nesnd_ottoman_recovery.11.t$', choose one: enact [GetLawType('law_oligarchy').GetName] or [GetLawType('law_landed_voting').GetName] (if already in force, raise [concept_legitimacy] instead)"
 nesnd_ottoman_charter_constitution_conclusion:0 "The constitutionalists' demands are now the law of the empire."
 nesnd_ottoman_charter_qin_conclusion:0 "The barracks party's demands are now the law of the empire, which governs and fights in the Qin manner."
 nesnd_ottoman_charter_stalemate_conclusion:0 "Twenty years have passed, and neither side has remade the laws of the empire in its own image."
 nesnd_ottoman_charter_invalid_conclusion:0 "The contest between charter and barracks no longer has a stage."
 nesnd_ottoman_charter_assembly:0 "Constitutionalist Assembly"
 nesnd_ottoman_charter_assembly_desc:0 "Allow the constitutionalists to meet openly in the capital and debate a charter."
 nesnd_ottoman_charter_discipline:0 "Restore Army Discipline"
 nesnd_ottoman_charter_discipline_desc:0 "Tighten discipline across the battalions, and give the officers more weight at court."
 nesnd_ottoman_charter_cooldown_tt:0 "#v 24#! months have passed since the last assembly or drill"
 nesnd_ottoman_charter_cooldown_set_tt:0 "Neither $nesnd_ottoman_charter_assembly$ nor $nesnd_ottoman_charter_discipline$ can be used for #v 24#! months"
 nesnd_ottoman_unity_tanzimat_over_tt:0 "The Tanzimat has ended"
 nesnd_ottoman_constitution:0 "Ottoman Constitution"
 nesnd_ottoman_charter_approval:0 "Supporters of the Charter"
 nesnd_ottoman_qin_state:0 "Qin-Style State"
 nesnd_ottoman_law_settled:0 "Settled Law"
 nesnd_ottoman_charter_stalemate:0 "Charter and Barracks Unresolved"
 nesnd_ottoman_assembly_cost:0 "Constitutionalist Assembly"
 nesnd_ottoman_charter_rally:0 "Ascendant at Court"
 nesnd_ottoman_qinist_acclaim:0 "Credit for the Drill"
 nesnd_ottoman_qinist_rebuffed:0 "Barracks Rules Rejected"
 nesnd_ottoman_barracks_purse:0 "The Army's Purse"
