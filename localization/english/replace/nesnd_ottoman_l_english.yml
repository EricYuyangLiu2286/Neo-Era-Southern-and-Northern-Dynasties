 nesnd_ottoman_recovery:0 "Restoring the Eastern Order"
 nesnd_ottoman_recovery_reason:0 "The Near Western War exposed the weaknesses of the old army. With Western Qin driven out of central China, officers in Istanbul urge an advance eastward to restore Ottoman standing in the Islamic world.\n\nThe achievements and failures of the Tanzimat will decide what this army becomes. We must raise the money and decide how much strength to devote to territorial demands and how much to military reform."
