l_english:
 nesnd_polish_windows.1.a:0 "Support the revolution and prepare for action."
 nesnd_polish_windows.1.b:0 "Remain neutral."
 nesnd_polish_windows.1.c:0 "Offer assistance in suppressing unrest in exchange for compensation."
 nesnd_polish_windows.1.t:0 "Revolution in Europe"
 nesnd_polish_windows.1.d:0 "Revolutionary unrest in Europe offers [ROOT.GetCountry.GetName] an opening to seek changes to the frontier. The Reds urge preparations for action, while the Whites seek concessions in exchange for supporting the established order."
 nesnd_polish_windows.2.a:0 "Join the French side."
 nesnd_polish_windows.2.b:0 "Wait for the peace negotiations."
 nesnd_polish_windows.2.t:0 "$nesnd_lobby_name_fra$ at War"
 nesnd_polish_windows.2.d:0 "[SCOPE.sCountry('window_enemy').GetName] is at war with [SCOPE.sCountry('window_france').GetName]. We may join the French side and demand the return of one of the old Duchy of Warsaw’s provinces still in enemy hands. If none remains, intervention can only strengthen our diplomatic position after the war."
 nesnd_polish_windows.3.a:0 "Offer neutrality in exchange for French compensation."
 nesnd_polish_windows.3.b:0 "Join $nesnd_lobby_name_fra$’s opponent."
 nesnd_polish_windows.3.t:0 "Neutrality during the War"
 nesnd_polish_windows.3.d:0 "The war between [SCOPE.sCountry('window_france').GetName] and [SCOPE.sCountry('window_enemy').GetName] puts the frontiers of the 1829 settlement at issue. We may offer $nesnd_lobby_name_fra$ friendly neutrality, or support its opponent to preserve the partitioning powers’ common position on Poland."
 nesnd_polish_windows.4.a:0 "Pay compensation and accept assistance."
 nesnd_polish_windows.4.b:0 "We will pay no compensation."
 nesnd_polish_windows.4.t:0 "Terms of Repression"
 nesnd_polish_windows.4.d:0 "[SCOPE.sCountry('window_krakow').GetName] offers to discourage radical action among our [GetCulture('polish').GetName] population in return for financial compensation. Acceptance will reduce [GetCulture('polish').GetName] radicals in our states and commit funds from our treasury."
 nesnd_polish_windows.5.a:0 "Seek Austrian protection."
 nesnd_polish_windows.5.b:0 "Reject a new protectorate."
 nesnd_polish_windows.5.t:0 "The Threat of Partition"
 nesnd_polish_windows.5.d:0 "$nesnd_lobby_name_fra$ can no longer attend to the Polish settlement. The powers may again revise the position of [ROOT.GetCountry.GetName] before we have recovered the territories we claim. Seeking Austrian protection would place our survival in the hands of another powerful neighbour."
 nesnd_polish_windows.6.a:0 "Apply pressure alongside the other partitioning powers."
 nesnd_polish_windows.6.b:0 "Uphold the settlement of 1829."
 nesnd_polish_windows.6.t:0 "Revising the Polish Settlement"
 nesnd_polish_windows.6.d:0 "[SCOPE.sCountry('window_krakow').GetName] has rejected a new protectorate. We may apply diplomatic pressure or uphold the existing settlement. Joint pressure will weaken Polish preparations for war."
 nesnd_polish_windows.7.a:0 "Submit our case to the congress."
 nesnd_polish_windows.7.t:0 "Poland at the Peace Conference"
 nesnd_polish_windows.7.d:0 "The war between $nesnd_lobby_name_fra$ and a partitioning power has ended. Our agenda will be submitted to the Continental Congress. Territorial concessions require a defeated power. A peace without imposed demands permits renewed guarantees, not the territorial claims of a victor."
 nesnd_polish_windows.8.a:0 "Continue our preparations."
 nesnd_polish_windows.8.t:0 "The Diplomatic Opening Closes"
 nesnd_polish_windows.8.d:0 "This diplomatic opening has passed. We must continue our preparations and await a new division among the powers."
 nesnd_polish_windows.9.a:0 "Reassess our position."
 nesnd_polish_windows.9.t:0 "No French Peace Conference"
 nesnd_polish_windows.9.d:0 "The war has left no basis for a French-led peace conference on Poland. Our territorial claims remain unresolved."
 nesnd_polish_windows.11.a:0 "Renew French support."
 nesnd_polish_windows.11.b:0 "Avoid a new commitment."
 nesnd_polish_windows.11.t:0 "The Polish Delegation"
 nesnd_polish_windows.11.d:0 "[SCOPE.sCountry('window_krakow').GetName] asks us to renew our public support for Polish territorial restoration. A pledge will encourage its government and strain relations with the partitioning powers."
 nesnd_polish_windows.12.a:0 "Approve an armaments grant."
 nesnd_polish_windows.12.b:0 "Retain the funds."
 nesnd_polish_windows.12.t:0 "Polish Armaments"
 nesnd_polish_windows.12.d:0 "[SCOPE.sCountry('window_krakow').GetName] seeks French funds for armaments. The grant would accelerate its preparations at the expense of our treasury."
 nesnd_polish_windows.13.a:0 "Fund Polish diplomacy."
 nesnd_polish_windows.13.b:0 "Urge restraint in Polish territorial demands."
 nesnd_polish_windows.13.t:0 "The Settlement and Polish Claims"
 nesnd_polish_windows.13.d:0 "Polish territorial claims force us to choose how far to support [SCOPE.sCountry('window_krakow').GetName]. Assisting its diplomacy would strengthen our influence there and prolong the disputes over the frontiers of 1829."
 nesnd_poland_partition_pressure:0 "Pressure from the Partitioning Powers"
 wg_nesnd_poland_restoration:0 "Restore Polish Territory"
 wg_nesnd_poland_restoration_desc:0 "Transfer the targeted state to $nesnd_lobby_name_kra$."
 wg_nesnd_poland_restoration_tooltip:0 "Transfer the targeted state to $nesnd_lobby_name_kra$."
 nesnd_polish_windows.10.a:0 "Pay compensation and improve relations."
 nesnd_polish_windows.10.b:0 "Refuse payment."
 nesnd_polish_windows.10.t:0 "The Price of Neutrality"
 nesnd_polish_windows.10.d:0 "[SCOPE.sCountry('window_neutral').GetName] offers neutrality in the present war in exchange for compensation worth two weeks of its fixed income."
 nesnd_polish_windows.3.c:0 "Join the war and demand Polish territory."
 nesnd_poland_window_status_1: "European revolutions have reopened the Polish question. The Diet must decide whether to support the insurgents."
 nesnd_poland_window_status_2: "The Eastern War has brought Paris and St Petersburg into open conflict."
 nesnd_poland_window_status_3: "War on the Rhine and Elbe has made the Polish frontier a matter for the belligerents."
 nesnd_poland_window_status_4: "With fighting at an end, the Continental Congress will hear the Polish claims."
 nesnd_poland_window_status_5: "Paris can no longer uphold the settlement. Kraków may seek protection in Vienna or face pressure from the partitioning powers."
 nesnd_poland_window_map_tt: "The present crisis concerns the future of this territory."
 nesnd_poland_window_preparation: "Preparations during the European crisis"
 nesnd_poland_order_from_congress: "The order maintained by the Continental Congress"
 nesnd_poland_veto_mandate_tt: "The Continental Congress rejected our proposal and the Diet has authorised one rising."
 war_goal_wg_nesnd_poland_restoration_type_name: "$wg_nesnd_poland_restoration$"
 war_goal_wg_nesnd_poland_restoration_type_desc: "$wg_nesnd_poland_restoration_desc$"
 war_goal_wg_nesnd_poland_restoration: "Return [WAR_GOAL_DRAFT.GetTargetState.GetName] to Poland"
 war_goal_wg_nesnd_poland_restoration_desc: "[WAR_GOAL_DRAFT.GetTarget.GetName] cedes [WAR_GOAL_DRAFT.GetTargetState.GetName] to $nesnd_lobby_name_kra$."
