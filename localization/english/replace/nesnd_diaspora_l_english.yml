l_english:
 nesnd_diaspora:0 "The Yin Diaspora"
 nesnd_diaspora_reason:0 "The uprising has failed and the old borders are back in place. In the villages that sent people to fight, families wonder whether it is safe to raise their children at home. The first to leave seek refuge in Dongzhou and in the Indigenous states of the Americas. As word reaches home, relatives follow with their households.\n\nWhen a government defeats an uprising, half of its Indigenous population will leave in successive parties. Families leave sooner where citizenship is more exclusive and political power is held by fewer hands."
 nesnd_diaspora_total_bar:0 "Share of Exiles Resettled"
 nesnd_diaspora_total_bar_desc:0 "$nesnd_diaspora_total_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
 nesnd_diaspora_batch_bar:0 "The Next Departure"
 nesnd_diaspora_batch_bar_desc:0 "$nesnd_diaspora_batch_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_diaspora_weekly_base:0 "Families preparing for the journey"
 nesnd_diaspora_citizenship_row:0 "[GetLawGroup('lawgroup_citizenship').GetName] ([GetGlobalVariable('nesnd_diaspora_origin').GetCountry.GetActiveLawFromGroup('lawgroup_citizenship').GetName])"
 nesnd_diaspora_distribution_row:0 "[GetLawGroup('lawgroup_distribution_of_power').GetName] ([GetGlobalVariable('nesnd_diaspora_origin').GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName])"
 nesnd_diaspora_route_status:0 "[GetGlobalVariable('nesnd_diaspora_pop').GetPop.GetCulture.GetName] families in [GetGlobalVariable('nesnd_diaspora_departure').GetState.GetName], [GetGlobalVariable('nesnd_diaspora_origin').GetCountry.GetName], are preparing to leave for [GetGlobalVariable('nesnd_diaspora_destination').GetState.GetName] in [GetGlobalVariable('nesnd_diaspora_destination').GetState.GetOwner.GetName].\n$nesnd_diaspora_people_count$"
 nesnd_diaspora_waiting_status:0 "$nesnd_diaspora_no_route_status$\n$nesnd_diaspora_people_count$"
 nesnd_diaspora_no_route_status:0 "The next party has yet to find a route."
 nesnd_diaspora_people_count:0 "Of the #v [GetGlobalVariable('nesnd_diaspora_total').GetValue|0]#! people expected to leave, #v [GetGlobalVariable('nesnd_diaspora_remaining').GetValue|0]#! have yet to resettle."
 nesnd_diaspora_complete_tt:0 "All those displaced by these uprisings have reached a place of refuge."
 nesnd_diaspora_finish_tt:0 "For ten years, the governments that put down the uprisings gain [concept_authority]. Countries offering refuge gain [concept_prestige]."
 nesnd_diaspora_no_refuge_tt:0 "Families are still waiting to leave, but no eligible country has a whole state in the Americas where they can settle."
 nesnd_diaspora_no_refuge_conclusion:0 "No place of refuge could be found. The families still waiting to leave remained at home."
 nesnd_diaspora_no_refuge_effect_tt:0 "Of the Indigenous people still living in each country of departure, #r 20%#! move towards [Concept('concept_radical','radicalism')]."
 nesnd_diaspora_origin_aftermath:0 "Authority after the Uprising"
 nesnd_diaspora_reception:0 "A Refuge for Exiles"
 nesnd_diaspora.1.t:0 "Those Who Left"
 nesnd_diaspora.1.d:0 "The last Indigenous families to leave their homes have found refuge abroad. In the villages where the rebels once found recruits, those who stayed tend their relatives’ fields and look after the elders who would not leave. We can collect our taxes there in peace. Many villagers must now cross a border to see their kin."
 nesnd_diaspora.1.f:0 "“All persons crossing the border to visit relatives must present identity papers at the post.”\n- Notice at a border post"
 nesnd_diaspora.1.a:0 "They still have family across the border."
 nesnd_diaspora.2.t:0 "A Home in Exile"
 nesnd_diaspora.2.d:0 "Word has come from the border. The last families to leave the rebel provinces have found shelter. In the villages they left behind, people remember which countries offered them a home."
 nesnd_diaspora.2.f:0 "“We have settled here and have a roof over our heads. Please tell everyone in the village that the people here opened their doors to us.”\n- A letter sent home to the village"
 nesnd_diaspora.2.a:0 "Let them make their homes here."
