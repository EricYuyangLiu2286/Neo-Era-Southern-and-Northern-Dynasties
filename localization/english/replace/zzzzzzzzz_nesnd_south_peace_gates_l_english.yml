l_english:
 nesnd_south_peace_stability_tt:0 "Succession pressure is below #v 60#! and the [concept_bankruptcy] recovery modifier is absent."
 nesnd_south_ming_supply_tt:0 "Paper, tools and small arms in the central market cost at most #v 50%#! above base price, with no corresponding local shortage in our country. Shared-market supplies qualify."
 nesnd_south_peace_b1_note:0 "Peace requires succession pressure below #v 60#! and the end of [concept_bankruptcy] recovery. Ming also requires market supplies of paper, tools and small arms."
 nesnd_south_politics_summary:0 "#bold Political groups#!: mainland #v 50#!, overseas #v 30#!, Japan #v 20#!, normalized by representation within each existing group. Foreign sponsors have no dynastic vote.\n#bold Shared foundations#!: finances #v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!; government cooperation #v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!. A living legitimate Zhu monarch supplies #v 20#! continuity points; Wu military projection supplies #v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!.\n#bold Active accords#!: Ming #v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!; Wu #v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!. The central route has passed #v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#! consecutive monthly checks; a separate #v 12-month#! elapsed-time guard is required, with conditions rechecked weekly.\nPeace requires a chosen central route, a political score of #v 85#! and a lead of #v 20#!. Ming requires #v 75%#! accords and two mainland cores. Wu requires #v 80%#!, consent from every territory to be integrated and the Japanese parties, plus naval crewing and maintenance readiness.\n$nesnd_south_peace_b1_note$"
