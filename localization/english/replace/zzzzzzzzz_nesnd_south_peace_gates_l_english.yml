l_english:
 nesnd_south_peace_stability_tt:0 "Succession Pressure is below #v 60#!, and the country has recovered from [concept_bankruptcy]."
 nesnd_south_ming_supply_tt:0 "Paper, Tools and Small Arms cost no more than #v 50%#! above their base prices in the central market, and none is locally scarce in our country. Supplies from our shared market count toward this requirement."
 nesnd_south_peace_b1_note:0 "A peaceful settlement requires Succession Pressure below #v 60#! and recovery from [concept_bankruptcy]. Ming also needs adequate market supplies of Paper, Tools and Small Arms."
 nesnd_south_politics_summary:0 "#bold Political support#!: mainland #v 50#!, overseas #v 30#!, Japan #v 20#!. Each group's share is divided among its participating governments. Foreign sponsors have no vote in the succession.\n#bold Shared foundations#!: finances #v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!; cooperation in government #v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!. A living, legitimate Zhu monarch contributes #v 20#! points to Ming continuity; Wu military power contributes #v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!.\n#bold Accords in force#!: Ming #v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!; Wu #v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!. Months of uninterrupted compliance: #v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#!, with a minimum #v 12-month#! period before settlement.\nPeace requires a chosen side, political support of #v 85#! and a lead of #v 20#!. Ming requires #v 75%#! accord support and two mainland strongholds. Wu requires #v 80%#!, the consent of every government surrendering territory and of the Japanese parties, and a fleet with sufficient crews and maintenance.\n$nesnd_south_peace_b1_note$"
