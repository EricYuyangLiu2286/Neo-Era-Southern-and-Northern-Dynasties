l_english:
 nesnd_south_peace_stability_tt:0 "Succession Pressure is below #v 60#!, and the country has recovered from [concept_bankruptcy]."
 nesnd_south_ming_supply_tt:0 "Paper, Tools and Small Arms cost no more than #v 50%#! above their base prices in the central market, and none is locally scarce in our country. Supplies from our shared market count toward this requirement."
