 nesnd_south_holdout_campaign:0 "An Unsettled Southern War"
 nesnd_south_holdout_campaign_reason:0 "Huai can call on its garrisons and the Philippines on its ports. An inland or overseas state that fought Wu and remains independent after the fighting must still decide the fate of its troops and people. Some prepare to resist again, some hope for northern protection, and others are prepared to submit."
 nesnd_south_holdout_campaign_status:0 "The court is considering the terms of the settlement."
 nesnd_south_holdout_refuge_status:0 "The Ming court can renew its appeal to a host in Huguang or Sichuan while its supporters still face Wu."
 nesnd_south_holdout_front_status:0 "Wu and the Jingnan states are still facing each other. Any state that drops out of the fighting must find its own way forward."
 nesnd_south_holdout_petition_status:0 "A holdout government has sent an envoy north and awaits a reply. If accepted, it will enter the northern empire’s protection."
 nesnd_south_holdout_truce_status:0 "A truce is still in force between Wu and some holdouts. A government that chooses resistance must wait for its truce with Wu to expire before fighting again."
 nesnd_south_holdout_wu_busy_status:0 "Wu is engaged in another war or diplomatic play. It must conclude that commitment before opening a new front or accepting a surrender."
 nesnd_south_holdout_resistance_status:0 "A holdout government has chosen to resist. When both sides are free to fight again, Wu will open another [concept_diplomatic_play]."
 nesnd_south_holdout_decision_status:0 "The holdouts are deciding their course. Those who surrender join Wu. The northern empire may protect those who appeal to it, while those who resist prepare to fight again."
 nesnd_south_holdouts_settled_tt:0 "The remaining belligerents have settled their allegiance and the southern fighting has ended."
 nesnd_south_holdouts.1.t:0 "After the Armistice"
 nesnd_south_holdouts.1.d:0 "Our country has left the fighting, but its dispute with Wu remains unresolved. Reports of defeat and appeals for peace arrive together. Some officers still refuse to lay down their arms. Shall we fight again, seek protection in the north or accept Wu’s rule?"
 nesnd_south_holdouts.resist:0 "Prepare to fight again."
 nesnd_south_holdouts.north:0 "Send envoys north to seek protection."
 nesnd_south_holdouts.surrender:0 "Submit to Wu."
 nesnd_south_holdouts_resist_tt:0 "Choose to fight Wu again. A new [concept_diplomatic_play] can begin once the truce has expired and both sides are free of other wars and diplomatic plays."
 nesnd_south_holdouts_north_tt:0 "Ask to become a protectorate of the Chinese Empire. If protection is refused, we must choose between renewed war and submission."
 nesnd_south_holdouts_surrender_tt:0 "Our country will be annexed by Wu. A Ming emperor still sheltered here will be sent to safety first."
 nesnd_south_holdouts.2.t:0 "Envoys from the South"
 nesnd_south_holdouts.2.d:0 "Envoys from [SCOPE.sCountry('nesnd_holdout_sender').GetName] seek northern protection. They will acknowledge the empire as overlord if only they may keep their land and their army. Take them on as subjects, and the empire has set foot in the Southern war."
 nesnd_south_holdouts.accept:0 "Accept their submission."
 nesnd_south_holdouts.refuse:0 "The South's mess is not the empire's to clean up."
 nesnd_south_holdouts_accept_tt:0 "Accept the requesting country as a protectorate."
 nesnd_south_holdouts_refuse_tt:0 "Decline protection, leaving the requesting country to decide its next course."
 nesnd_south_holdouts.3.t:0 "Without Northern Protection"
 nesnd_south_holdouts.3.d:0 "The North will not lift a finger. The envoys made the journey for nothing, and the same two roads lie before us: fight Wu again to keep our land, or, if we will not fight, submit."
 nesnd_south_holdouts.4.t:0 "Northern Protection"
 nesnd_south_holdouts.4.d:0 "The envoys have come back with the North's acceptance. Our land and army are safe, and the North is our overlord now. Life after the war is still ours to rebuild."
 nesnd_south_holdouts.4.a:0 "Let the people recover."
 nesnd_south_defender_in_campaign_war_tt:0 "Our country is fighting against Wu in the #bold Jingnan War#!."
