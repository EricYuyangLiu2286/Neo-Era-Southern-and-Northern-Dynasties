 nesnd_south_holdout_campaign:0 "An Unsettled Southern War"
 nesnd_south_holdout_campaign_reason:0 "Huai can call on its garrisons and the Philippines on its ports. An inland or overseas state that fought Wu and remains independent after the fighting must still decide the fate of its troops and people. Some prepare to resist again, some hope for northern protection, and others are prepared to submit."
 nesnd_south_holdout_campaign_status:0 "The court is considering the terms of the settlement."
 nesnd_south_holdout_refuge_status:0 "The Ming court can renew its appeal to a host in Huguang or Sichuan while its supporters still face Wu."
 nesnd_south_holdout_front_status:0 "Wu and the remaining belligerents are still in confrontation. Each surviving holdout must decide its own course once it leaves the fighting."
 nesnd_south_holdout_petition_status:0 "A holdout government has sent an envoy north and awaits a reply. If accepted, it will enter the northern empire’s protection."
 nesnd_south_holdout_truce_status:0 "A truce is still in force between Wu and some holdouts. A government that chooses resistance must wait for its truce with Wu to expire before fighting again."
 nesnd_south_holdout_wu_busy_status:0 "Wu is engaged in another war or [concept_diplomatic_play]. It must finish that business before opening a new front or accepting a surrender."
 nesnd_south_holdout_resistance_status:0 "A holdout government has chosen to resist. When both sides are free to fight again, Wu will open another [concept_diplomatic_play]."
 nesnd_south_holdout_decision_status:0 "The holdouts are deciding their course. Those who surrender join Wu. The northern empire may protect those who appeal to it, while those who resist prepare to fight again."
 nesnd_south_holdouts_settled_tt:0 "The remaining belligerents have settled their allegiance and the southern fighting has ended."
 nesnd_south_holdouts.1.t:0 "After the Armistice"
 nesnd_south_holdouts.1.d:0 "We have left the fighting, but the quarrel with Wu is not over. Reports of defeat and appeals for peace arrive together. Some officers still refuse to lay down their arms. Shall we fight again, seek protection in the north or accept Wu’s rule?"
 nesnd_south_holdouts.1.f:0 "“While the men of Wu remain, the Jingnan army must not disband.”\n- Proclamation copied among the Jingnan troops"
 nesnd_south_holdouts.resist:0 "Prepare to fight again."
 nesnd_south_holdouts.north:0 "Send envoys north to seek protection."
 nesnd_south_holdouts.surrender:0 "Submit to Wu."
 nesnd_south_holdouts_resist_tt:0 "Choose to fight Wu again. A new [concept_diplomatic_play] can begin once the truce has expired and both sides are free of other wars and diplomatic plays."
 nesnd_south_holdouts_north_tt:0 "Seek protection from the Chinese Empire. If it accepts, it will fight alongside us against Wu and take us under its protection. If it refuses, we will fight on."
 nesnd_south_holdouts_surrender_tt:0 "We will be annexed by Wu. A Ming emperor still sheltered here will be sent to safety first."
 nesnd_south_holdouts.2.t:0 "Envoys from the South"
 nesnd_south_holdouts.2.d:0 "Envoys from [SCOPE.sCountry('nesnd_holdout_sender').GetName] seek our protection. Their government offers to accept our suzerainty in return for preserving its territory and army. Accepting would give us a new responsibility in the southern dispute."
 nesnd_south_holdouts.2.f:0 "“The great who serve the small delight in Heaven. The small who serve the great stand in awe of Heaven.”\n- Mencius, King Hui of Liang II"
 nesnd_south_holdouts.accept:0 "Accept their submission."
 nesnd_south_holdouts.refuse:0 "We will not undertake this obligation."
 nesnd_south_holdouts_accept_tt:0 "Commit the empire to the next war against Wu. Take the petitioner as a protectorate once both countries have entered the war."
 nesnd_south_holdouts_refuse_tt:0 "Refuse protection. The petitioner will continue the war against Wu."
 nesnd_south_holdouts.3.t:0 "Without Northern Protection"
 nesnd_south_holdouts.3.d:0 "Northern protection has not materialised. The envoys’ journey has left us with the same choice: fight Wu again for our land, or end the struggle by submitting."
 nesnd_south_holdouts.4.t:0 "Northern Protection"
 nesnd_south_holdouts.4.d:0 "The northern armies have taken the field against Wu. Our banners now march beside theirs, and the empire has recognised us as its protectorate."
 nesnd_south_holdouts.4.a:0 "Let the people recover."
 nesnd_south_defender_in_campaign_war_tt:0 "We are fighting against Wu in the #bold Jingnan War#!."
