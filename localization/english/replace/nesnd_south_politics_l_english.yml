l_english:
 nesnd_federal_compact:0 "Constitutional Settlement"
 nesnd_court_protection:0 "Protection and Open Deliberation"
 nesnd_federal_compact_button:0 "Revise the Constitution"
 nesnd_federal_compact_button_desc:0 "Reform has carried the Southern realm beyond the old order of military fiefs. Hangzhou can no longer decide its government alone. Provincial delegates will debate appointments, taxation, military funding and provincial powers in the Assembly of Rites, while the cabinet and Six Ministries must govern under the revised constitution. We should first seek support from the Western provinces and overseas states, allowing the Zhu sovereign to govern constitutionally, free of the Southern Administration’s domination."
 nesnd_south_status_qin:0 "The King of Wu still restrains calls for accession among his followers, but the dispute with the Ming court grows sharper.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The court dispute#!#!"
 nesnd_south_status_succession:0 "The Southern Administration presses for a new dynasty, while the Ming court and provinces defend their positions.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The court dispute#!#!"
 nesnd_south_rules:0 "$nesnd_south_pressure_detail_tt$\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_pressure_bar:0 "Succession Pressure"
 nesnd_south_pressure_bar_desc:0 "$nesnd_south_pressure_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_south_compact_bar:0 "Support for the Settlement"
 nesnd_south_compact_bar_desc:0 "$nesnd_south_compact_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_federal_compact_button_requirements:0 "The Ming–Wu dispute is active, [concept_bureaucracy] is not negative, [concept_legitimacy] is at least #v 50#!, and #v 18 months#! have passed since the last agreement."
 nesnd_federal_compact_button_outcome_tt:0 "Central negotiation progress #p +20#!; succession pressure #p −8#!. Renewal is available after #v 18 months#!."
 nesnd_south_unsettled_tt:0 "The southern political crisis has not yet been settled."
 nesnd_south_qin_departed_tt:0 "Zheng Qin has died or left the country, or the crisis has reached #v 1839#!."
 nesnd_south_conflicts_failure_tt:0 "Either condition is met:\nThis country owns fewer than #v 2#! [Concept('concept_state','States')].\nOr each of Sichuan, Hunan, the Philippines, the Nanyang United Provinces and Yuannan has ceased to exist or ceased to be our direct [concept_subject]."
 nesnd_south_settled_tt:0 "The southern political crisis has been settled."
 nesnd_south_wu_established_tt:0 "The Wu dynasty has been established."
 nesnd_south_monarchy_ended_tt:0 "This country has abolished #v monarchy#!."
 nesnd_south_pressure_detail_tt:0 "#bold Succession Pressure#!: #v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\nMonthly change: #v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!. Pressure rises by #n +3#! each month, or #n +2.5#! under the Constitutional Settlement. Active reconciliation reduces it by #p 3#!.\n\n#bold The First Minister's Case#!\nFrom #v July 1837#!, the case may begin when pressure exceeds #v 24#!. From the beginning of #v 1838#!, an unresolved case involving Chen Dongyang, if he remains in the country, leads to the assassination and protection events. His death adds #n +25#! pressure, injury #n +10#!, and escape #n +3#!.\n\nAfter the case is resolved, #v 70#! pressure permits an early accession. At #v 100#!, succession proceeds if Zheng Qin has departed. From the beginning of #v 1839#!, an unresolved dynastic dispute rises to #v 100#! once the First Minister's case has concluded. Succession and the other states' responses then proceed whether or not Zheng Qin is still alive. A peaceful settlement ends the dispute."
 nesnd_south_compact_detail_tt:0 "#bold Support for the settlement#!\nMainland, overseas and Japanese governments account for #v 50%, 30% and 20%#! respectively. Commitments last #v 36 months#! and cease to count after a change of alignment or overlord, war against the centre, or withdrawal.\n\n#bold A peaceful constitutional settlement#!\nThe chosen side needs political support of #v 85#! and a lead of #v 20#!, sustained for #v 12 months#!. Ming needs #v 75%#! commitment support and at least two mainland core governments. Wu needs #v 80%#!, consent from every government due for integration and the Japanese territorial parties, and a sufficiently prepared fleet. A completed settlement ends the dispute."
 nesnd_south_succession_board:0 "The Southern Polities"
 nesnd_south_succession_board_reason:0 "Whose realm is the South: the Zhu emperor's, or the one the Zheng family carved out? Nanjing still holds the Ming succession; the Southern Administration in Hangzhou commands the troops and revenue that drive reform. While the Western provinces and Hangzhou stood together against the North, the question of sovereign and minister could wait. Now reform has reached deep into the provinces, and neither side can dodge the question of who governs.\n\nHuguang's academies and the Xiangfan garrisons keep the Zhu calendar; Sichuan's republicans are still arguing over Hangzhou's reforms. The governors of the Southern Seas and the lords of Japan are reckoning up how much land, money and manpower a change of dynasty will demand of them."
 nesnd_south_succession_board_status:0 "The provinces and overseas states are declaring their positions and preparing their governments and forces. The dispute over Southern government now reaches across the seas."
 nesnd_board_table_heading:0 "The Southern Countries"
 nesnd_board_country_metrics:0 "Regular #v [Country.GetRegularBattalions|0]#! / Conscriptable #v [Country.CalcConscriptableBattalions|0]#!　Ships #v [Country.GetNumShips|0]#!\nFixed balance @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　Army projection #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\nSupply preparations: [Country.GetCustom('nesnd_board_supply_loc')]\n[Country.GetCustom('nesnd_south_ready_loc')]"
 nesnd_board_supply_known:0 "#v [Country.MakeScope.Var('nesnd_board_supply_score').GetValue|0] / 4#! conditions"
 nesnd_board_supply_unknown:0 "Not assessed"
 nesnd_board_stance_unstated:0 "Undeclared"
 nesnd_board_stance_ming:0 "Ming"
 nesnd_board_stance_wu:0 "Wu"
 nesnd_board_stance_neutral:0 "Neutral"
 nesnd_board_stance_autonomy:0 "Autonomy"
 nesnd_board_stance_available_tt:0 "The civil war has not begun, and six months have passed since our last change of allegiance. Xiangfan remains committed to Ming. The central court cannot choose neutrality or autonomy."
 nesnd_board_stance_effect_tt:0 "Declare our alignment, fixed for #v 6 months#!. Withdrawing an existing commitment also cancels unfulfilled consent to integration or cession and reduces relations with the centre by #n 15#!."
 nesnd_board_choose_ming:0 "Support the Ming Court"
 nesnd_board_choose_ming_desc:0 "The Zhu succession remains the recognised authority of the Southern provinces and overseas states. Support Ming government under the constitution and limits on Hangzhou’s dominance."
 nesnd_board_choose_wu:0 "Support the Zheng House"
 nesnd_board_choose_wu_desc:0 "The Zheng family has long commanded the Southern realm’s military and fiscal power. Support the King of Wu in founding a dynasty whose constitution defines the powers of monarch and assembly."
 nesnd_board_choose_neutral:0 "Remain Neutral"
 nesnd_board_choose_neutral_desc:0 "Let the Ming court and Hangzhou quarrel as they please. We will look after our own trade and defence."
 nesnd_board_choose_autonomy:0 "Seek Autonomy"
 nesnd_board_choose_autonomy_desc:0 "While the court fights over the succession, take our taxes, appointments and defence back into our own hands. Make that plain to Ming and Wu alike."
 nesnd_board_ming_bar_name:0 "Ming Continuity"
 nesnd_board_wu_bar_name:0 "Zheng Statecraft"
 nesnd_board_ming_bar_desc:0 "$nesnd_board_ming_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_wu_bar_desc:0 "$nesnd_board_wu_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_compact_bar_name:0 "Support for the Settlement"
 nesnd_board_pressure_bar_name:0 "Gathering Conflict"
 nesnd_board_compact_bar_desc:0 "$nesnd_board_compact_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_pressure_bar_desc:0 "$nesnd_board_pressure_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_not_ming_tt:0 "This country has not declared support for the Ming court."
 nesnd_board_not_wu_tt:0 "This country has not declared support for the Zheng regime."
 nesnd_board_not_neutral_tt:0 "This country has not declared neutrality."
 nesnd_board_not_autonomy_tt:0 "This country has not declared its intention to seek autonomy."
 nesnd_ming_host_huguang:0 "Court refuge: Huguang"
 nesnd_ming_host_huguang_desc:0 "Prefer Huguang if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_sichuan:0 "Court refuge: Sichuan"
 nesnd_ming_host_sichuan_desc:0 "Prefer Sichuan if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_effect_tt:0 "When the provinces break with the centre, establish the court in refuge here if possible. Otherwise consider the other available host."
 nesnd_ming_renew_convocation:0 "Reopen the Deliberations"
 nesnd_ming_renew_convocation_desc:0 "Summon representatives of the provinces and states to reconsider the positions of the Ming court and the King of Wu."
 nesnd_ming_court.3.t:0 "The Provisional Court"
 nesnd_ming_court.3.d:0 "The ministers who followed the sovereign have reached the refuge, and the local officials are busy settling the court in. The garrison here must still raise supplies and draft men, the administrative commission must still govern the counties, and now there is a travelling court to feed as well. Ming loyalists finally have a sovereign to serve; and the host province has become the first to break openly with Hangzhou.\n\nEnvoys from the provinces and overseas states are still on the road. The claims once argued in the Assembly of Rites and the cabinet will be settled by soldiers from now on."
 nesnd_ming_court.3.a:0 "Put the court in order."
 nesnd_ming_court.9.t:0 "Remain in Nanjing"
 nesnd_ming_court.9.d:0 "Neither Huguang nor Sichuan has a government able to receive the sovereign, so the court must stay in Nanjing. Ming loyalist ministers are canvassing the provinces with one hand and parrying Hangzhou, which holds the troops and the money, with the other. The Zheng bid for the throne is already on the table."
 nesnd_ming_court.9.a:0 "Negotiate in the capital and defer succession."
 nesnd_ming_court.9.b:0 "Recognize the Zheng claim."
 nesnd_ming_court.10.t:0 "The Provinces Reconsider"
 nesnd_ming_court.10.d:0 "Those who oppose the new dynasty have not yet formed an alliance able to take up arms. Appointments, taxation, military costs and overseas status are still bitterly disputed. If Hangzhou wants the Zheng title to hold, it must answer each of these claims in turn; meanwhile, Ming loyalists are still searching for men who will stand or fall with them."
 nesnd_ming_court.10.a:0 "Continue negotiations over provincial demands."
 nesnd_ming_court_country:0 "Ming Court in Exile"
 nesnd_ming_interregnum_country:0 "Ming Provisional Government"
 nesnd_ming_court_adj:0 "Ming"
 nesnd_ming_court_transfer_effect_tt:0 "Take control of [ROOT.GetCountry.GetName], with its existing forces, treasury, lands and tax system. If the legitimate Ming monarch accompanies the court, establish a monarchy under that ruler."
 nesnd_ming_court.12.t:0 "The Route Is Uncertain"
 nesnd_ming_court.12.d:0 "The provinces have broken with the centre, but something has gone wrong with the government that was to receive the court. The sovereign cannot leave the capital for now, and loyalist ministers must keep writing to Huguang and Sichuan, looking for someone strong enough to protect him and rich enough to keep a court. Every extra day in Nanjing is another day at Hangzhou's mercy."
 nesnd_ming_court.12.a:0 "Remain in the capital and seek another opening."
 nesnd_ming_court.12.b:0 "Serve the new dynasty and abandon the evacuation."
 nesnd_ming_seek_refuge:0 "Send Another Envoy"
 nesnd_ming_seek_refuge_desc:0 "Send envoys again to Huguang and Sichuan to find a government able to receive the court and uphold the Ming succession."
 nesnd_ming_after_truce:0 "A Court Without Its Capital"
 nesnd_ming_after_truce_reason:0 "The truce has not returned the court to Nanjing. Ming loyalist provinces retain their armies and revenues, while Hangzhou has not abandoned its imperial claim. The court must rebuild its finances and seek allies before it can recover the old capital and settle the succession."
 nesnd_ming_after_truce_status:0 "In a new war, take Nanjing and the Wu capital and meet the terms for a restoration settlement."
 nesnd_ming_refuge_available_tt:0 "The succession confrontation or war is still underway. A Ming supporter in Huguang or Sichuan must be independent, hold its capital and be free of another player's control."
 nesnd_south_politics_summary:0 "#bold The Ming Court and Hangzhou#!\nFinances and administration #v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!　Cooperation in government #v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!\nZhu succession #v 20#!　Wu military strength #v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!\n#bold Commitments#!　Ming #v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!　Wu #v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!\nContinuous fulfilment #v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#! months.\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_offer_accord:0 "Seek Consent for Constitutional Reform"
 nesnd_south_offer_accord_desc:0 "Appointments, taxation and military funding need a constitution that everyone accepts. Send our proposals to the provinces and overseas states and ask them to declare their support."
 nesnd_south_offer_available_tt:0 "The court supports Ming or Wu, the crisis has not reached open conflict, and the country is neither at war nor in [concept_default]. Six months have passed since the last mission, and an eligible state can respond."
 nesnd_south_accord_offer_tt:0 "Send the proposed settlement to eligible provinces and states for their acceptance or refusal. Another mission may be sent after #v 6 months#!. Negotiations increase government wages by #n 3%#! and use #n 25#! [concept_authority]."
 nesnd_south_accord_accept_tt:0 "Support the proposed settlement for #v 36 months#!, with alignment fixed for #v 6 months#!. Changing alignment, fighting the Southern central government, joining another overlord or expiry ends the commitment. Wu integration terms cede our Chinese territories. Japanese terms cede our holdings in Shikoku and Kyushu while retaining other lands. Relations with the centre improve by #p 15#!."
 nesnd_south_leave_accord:0 "Withdraw Our Commitment"
 nesnd_south_leave_accord_desc:0 "Withdraw our consent to the settlement and reconsider our relationship with the Southern central government."
 nesnd_south_accord_leave_tt:0 "Withdraw the commitment and any unfulfilled consent to integration or cession. Relations with the centre fall by #n 15#!. Alignment cannot change for #v 6 months#!."
 nesnd_south_retry_confrontation:0 "Renew Negotiations with the Provinces"
 nesnd_south_retry_confrontation_desc:0 "The last negotiations came to nothing, and those who reject the new dynasty still sit behind their own troops. Confront them again: do they recognise the court or not? Make them give a straight answer."
 nesnd_south_accords.1.t:0 "The Southern Constitutional Settlement"
 nesnd_south_accords.1.ming:0 "The cabinet's envoy has arrived in [ROOT.GetCountry.GetName] to seek our support for a settlement preserving the Ming dynasty. A constitution will define the powers of the centre and provinces. The Zhu sovereign will remain at the head of government, the cabinet and Six Ministries will administer under law, and provincial delegates will participate through the Assembly of Rites.\n\nTo agree is to recognise the Zhu succession and back this settlement. Our government, territory and existing laws are left untouched, and our dealings with overseas states, as subjects or as trading partners, remain as our treaties provide."
 nesnd_south_accords.1.integration:0 "The Southern Administration's envoy offers clear terms: recognise Zheng accession and place our Chinese territories under direct central administration as provinces. Their separate military and political authority will end; appointments, taxation and military funding will fall under the new dynasty's constitution and the cabinet and Six Ministries.\n\nThe centralising reform Hangzhou has pursued for years lacks only this final step. Once we agree, the question of who governs these lands and who taxes them will be settled for good. Any overseas territory we hold keeps its government and borders."
 nesnd_south_accords.1.japan:0 "The Southern Administration asks us to recognise the Zheng succession and surrender any territory we hold in Shikoku and Kyushu to direct Wu rule. Our government would retain its remaining lands.\n\nSo the Southern succession has been tied to Japan's borders. Accepting it buys a place in the new order, and the price is these lands."
 nesnd_south_accords.1.overseas:0 "The Southern Administration asks [ROOT.GetCountry.GetName] to recognise the Zheng succession while retaining our government, territory and existing status. The Assembly of Rites and cabinet will settle the Southern constitution's distribution of sovereign and provincial powers. Our commerce, ports and military obligations will remain matters for separate treaties.\n\nWhat the Zheng want is support, at home and abroad."
 nesnd_south_accords.1.a:0 "Support the settlement and recognise the succession."
 nesnd_south_accords.1.b:0 "Accept provincial integration under the central government."
 nesnd_south_accords.1.c:0 "Recognise the succession and accept the territorial cession."
 nesnd_south_accords.1.d:0 "Withhold our consent."
 nesnd_south_accords.20.t:0 "Revising the Constitution"
 nesnd_south_accords.20.d:0 "For a year, the provinces and states supporting Ming have upheld their commitment to reform. The provisions debated by provincial delegates in the Assembly of Rites on appointments, land taxes and military funding now have a basis for enactment. The cabinet asks [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] to proclaim a constitution defining the powers of the centre and provinces.\n\nSince Chen Dongyang restored provincial administrative commissions, the Southern government has coordinated civil and military affairs, but the titles of former feudal lords still sustain local influence. Disputes set aside during resistance to the North can at last be settled in the assembly. The Zhu succession is saved, and from now on the sovereign, the cabinet and the provinces each act under the constitution."
 nesnd_south_accords.20.a:0 "Proclaim the constitution."
 nesnd_south_accords.21.t:0 "A Constitution for the Succession"
 nesnd_south_accords.21.d:0 "The parties supporting Zheng have sustained their commitment to reform for a year. States due for provincial integration have accepted the transfer of their Chinese territories, and the Japanese governments have accepted the terms concerning Shikoku and Kyushu. Hangzhou’s military and fiscal power now has a basis for establishing the new order.\n\nThe Assembly of Rites and cabinet will incorporate appointments, taxation, military funding and provincial government into a new constitution defining the powers of monarch and assembly. If the Zheng family accepts the throne, it must also accept these obligations. The Southern Administration, long governing in Ming’s name, will face the world under its own dynasty."
 nesnd_south_accords.21.a:0 "Accept the throne and govern under the constitution."
 nesnd_south_accords.reconsider:0 "Defer the settlement and reopen deliberations."
 nesnd_south_ming_peace_result_tt:0 "Preserve the Zhu sovereign and Ming state. Members retain their territories, governments and economic laws. The centre accepts constitutional obligations for #v 10 years#!. States honouring their commitments receive temporary prestige benefits, with an additional reward for sufficient preparations."
 nesnd_south_wu_peace_result_tt:0 "Establish Wu and integrate only eligible Chinese territories with explicit consent and local control. Overseas countries and overseas lands remain separate. Japan cedes only its own Shikoku and Kyushu territories. A player who explicitly accepted whole-country integration takes control of Wu only if no other human controls it. New provinces face #v 12 months#! of transition costs."
 nesnd_south_accords.22.t:0 "The Constitution Established"
 nesnd_south_accords.22.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has proclaimed the revised constitution. Provincial delegates participate in the Assembly of Rites; the cabinet and Six Ministries conduct central government; provincial administrative commissions administer local affairs under the settlement. The Zhu house has won back room to govern from under Hangzhou's thumb, and the price is a throne bound by the constitution.\n\nSouthern Ming survives as a Confucian constitutional democracy and federation. The provinces and overseas states keep their own governments and territories, and the centre pays for the new institutions. The powers that the Southern and Western Administrations once fought over with soldiers now have a constitution both sides accept to decide them."
 nesnd_south_accords.23.t:0 "The Wu Dynasty Established"
 nesnd_south_accords.23.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has taken the throne and proclaimed the Wu constitution. The centre has assumed administration of the Chinese territories that accepted integration, together with the lands ceded in Shikoku and Kyushu. Overseas states retaining their territories continue to govern themselves and deal with the new dynasty under their existing treaties.\n\nThe constitution recognises both the deliberative powers of the Assembly of Rites and the sovereign authority of the Zheng monarch, with the cabinet and Six Ministries conducting government accordingly. Generations of military power, commerce and overseas expansion since Zheng Zhao have at last become an empire ruled in the Zheng family’s own name."
 nesnd_south_accords.done:0 "Govern according to the constitution."
 nesnd_south_negotiation_cost:0 "Constitutional Negotiations"
 nesnd_south_accord_respected:0 "Settlement Honoured"
 nesnd_south_prepared_member:0 "Prepared Administration"
 nesnd_south_prepared_mobilization:0 "Prepared Mobilization"
 nesnd_south_hasty_mobilization:0 "Hasty Mobilization"
 nesnd_south_peace_administration:0 "Peaceful Reorganization"
 nesnd_south_new_province:0 "Provincial Transition"
 nesnd_south_ready_unknown:0 "National preparedness has not yet been assessed."
 nesnd_south_ready_known:0 "Preparations #v [Country.MakeScope.Var('nesnd_ready_total').GetValue|1]/100#! (finances [Country.MakeScope.Var('nesnd_ready_finance').GetValue|1]/20, military [Country.MakeScope.Var('nesnd_ready_military').GetValue|1]/35, inputs [Country.MakeScope.Var('nesnd_ready_supply').GetValue|0]/25, government [Country.MakeScope.Var('nesnd_ready_domestic').GetValue|1]/20)\nCrew #v [Country.MakeScope.Var('nesnd_ready_actual_crew').GetValue|D]#!. Crew-ready ships #v [Country.MakeScope.Var('nesnd_ready_ships_ready').GetValue|0]/[Country.MakeScope.Var('nesnd_ready_ships').GetValue|0]#!. Naval projection #v [Country.MakeScope.Var('nesnd_ready_naval_projection').GetValue|1]#!."
 nesnd_south_failed_alignment:0 "A Defeated Political Cause"
 nesnd_south_peace_stability_tt:0 "Succession Pressure is below #v 60#!, and the country has recovered from [concept_bankruptcy]."
 nesnd_south_ming_supply_tt:0 "Paper, Tools and Small Arms cost no more than #v 50%#! above their base prices in the central market, and none is locally scarce in our country. Supplies from our shared market count toward this requirement."
 nesnd_south_peace_b1_note:0 "A peaceful settlement requires Succession Pressure below #v 60#! and recovery from [concept_bankruptcy]. Ming also needs adequate market supplies of Paper, Tools and Small Arms."
 nesnd_board_external_observer:0 "External Observer"
 nesnd_south_reconciliation:0 "Reconciling the Realm"
 nesnd_south_reconciliation_reason:0 "Chen Dongyang's reforms long ago turned the Southern provinces into something other than the military fiefs of old Northern Ming. But the bad blood between the Southern and Western Administrations will not melt away after one debate in the assembly. Now that the parties stand behind the same settlement, the centre must produce the administrative funds it promised and turn the constitution's paper powers into practice.\n\nThe overseas states are watching to see whether the court keeps its word. Only by honouring the settlement month after month can the succession dispute be brought back to a point where it can be talked out."
 nesnd_south_reconciliation_status:0 "Months implementing the settlement: #v [ROOT.GetCountry.MakeScope.Var('nesnd_south_reconciliation_payments').GetValue|0]#!. Succession Pressure: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!. While active: [concept_budget_government_wages] #n +5%#!, [concept_authority] #n −50#!. Implementation ends at #v 40#! pressure."
 nesnd_south_reconciliation_start:0 "Implement the Agreed Settlement"
 nesnd_south_reconciliation_start_desc:0 "Meet the administrative costs of reform, coordinate the centre and provinces, and fulfil commitments to overseas states."
 nesnd_south_reconciliation_stop:0 "Suspend Implementation"
 nesnd_south_reconciliation_stop_desc:0 "Stop the extra administrative spending for the settlement; the effort to calm the court dispute through it ends here."
 nesnd_south_reconciliation_requirements:0 "Meet every other peace requirement for the chosen Ming or Wu route, with no southern [concept_diplomatic_play] or war and no [concept_bankruptcy] recovery penalty."
 nesnd_south_reconciliation_effect_tt:0 "Maintain additional [concept_budget_government_wages] of #n +5%#! and use #n 50#! [concept_authority]. After #v 1 month#!, each month in which the chosen side’s political, financial and commitment conditions hold reduces succession pressure by #p 3#!. Sending proposals or renewing commitments does not itself reduce pressure. Implementation stops if conditions cease to hold, and ends once pressure reaches #v 40#!. A formal peaceful settlement still requires #v 12 months#! of continuous fulfilment."
 nesnd_south_reconciliation_cost:0 "Reform Administration"
 nesnd_ming_royal_allowance:0 "Ming Royal Allowances"
 nesnd_ming_receive_court_tt:0 "If legitimate Ming royals have taken refuge here, supporting Ming enthrones the surviving emperor or heir while retaining the local leader. With no living legitimate successor, a regency remains."
 nesnd_court_followup.15.t:0 "Royal Allowances"
 nesnd_court_followup.15.d:0 "After the change of dynasty, the Zhu relatives remaining in [ROOT.GetCountry.GetName] still need food, clothing and a roof. Supporting these princes without a throne lets them keep their dignity, and lets the old dynasty's followers see how the new one treats its predecessors. Centuries of imperial rule do not vanish with a change of name."
 nesnd_court_followup.15.a:0 "Provide their customary support."
 nesnd_court_followup.19.t:0 "Standing Agreements"
 nesnd_court_followup.19.d:0 "The succession dispute has dragged on for two years, and the court has still not brought the parties round to a single position. The Southern provinces and overseas states go on governing with the powers they have, and the split between Ming and Wu loyalists has not grown into a common war.\n\nBetter to let it rest here, and accept the borders, governments and treaties as they stand. No one's reforms have been carried, but at least the realm need not keep waiting for a constitution no one can agree on."
 nesnd_court_followup.19.a:0 "Accept the present settlement and let the people recover."
 nesnd_court_followup.19.b:0 "Keep talking."
 nesnd_south_inconclusive_order:0 "Confirm the Status Quo"
 nesnd_south_inconclusive_order_desc:0 "After two years without a new constitution or a Jingnan confrontation, accept the existing borders, governments and treaty relations and close the succession negotiations."
 nesnd_south_inconclusive_result_tt:0 "End the Ming–Wu crisis on the basis of current territory, governments and treaties. No subjects are annexed, and neither side receives victory rewards."
 nesnd_federal_compact_button_alt_desc:0 "Reform has carried the Southern realm beyond the old order of military fiefs, while Hangzhou still commands the troops and revenues needed to sustain it. The time has come for a new dynasty. We should first seek the consent of the provinces and overseas states, then bring appointments, taxation, military funding, provincial powers and the position of the Zhu house before the Assembly of Rites and cabinet. A constitution defining the powers of sovereign and assembly will lay the foundations of Zheng rule."
