l_english:
 nesnd_federal_compact:0 "Constitutional Settlement"
 nesnd_court_protection:0 "Protection and Open Deliberation"
 nesnd_federal_compact_button:0 "Revise the Constitution"
 nesnd_federal_compact_button_desc:0 "Reform has carried the Southern realm beyond the old order of [Glossary('glossary_nesnd_fanzhen','military fiefs')]. Hangzhou can no longer decide its government alone. Provincial delegates will debate appointments, taxation, military funding and provincial powers in the Assembly of Rites, while the cabinet and Six Ministries must govern under the revised constitution. We should first seek support from the Western provinces and overseas states, allowing the Zhu sovereign to govern constitutionally, free of the Southern Administration’s domination."
 nesnd_south_status_qin:0 "The King of Wu still restrains calls for accession among his followers, but the dispute with the Ming court grows sharper.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The court dispute#!#!"
 nesnd_south_status_succession:0 "The Southern Administration presses for a new dynasty, while the Ming court and provinces defend their positions.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The court dispute#!#!"
 nesnd_south_rules:0 "$nesnd_south_pressure_detail_tt$\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_pressure_bar:0 "Succession Pressure"
 nesnd_south_pressure_bar_desc:0 "$nesnd_south_pressure_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_south_compact_bar:0 "Support for the Settlement"
 nesnd_south_compact_bar_desc:0 "$nesnd_south_compact_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_federal_compact_button_requirements:0 "The Ming–Wu dispute is active, [concept_bureaucracy] is not negative, [concept_legitimacy] is at least #v 50#!, and #v 18 months#! have passed since the last agreement."
 nesnd_federal_compact_button_outcome_tt:0 "Central negotiation progress #p +20#!; succession pressure #p −8#!. Renewal is available after #v 18 months#!."
 nesnd_south_unsettled_tt:0 "The southern political crisis has not yet been settled."
 nesnd_south_qin_departed_tt:0 "Zheng Qin has died or left the country, or the crisis has reached #v 1839#!."
 nesnd_south_conflicts_failure_tt:0 "Either condition is met:\nWe own fewer than #v 2#! [Concept('concept_state','States')].\nOr each of Sichuan, Hunan, the Philippines, the Nanyang United Provinces and Yuannan has ceased to exist or ceased to be our direct [concept_subject]."
 nesnd_south_settled_tt:0 "The southern political crisis has been settled."
 nesnd_south_wu_established_tt:0 "The Wu dynasty has been established."
 nesnd_south_monarchy_ended_tt:0 "We have abolished #v monarchy#!."
 nesnd_south_pressure_detail_tt:0 "#bold Succession Pressure#!: #v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\nMonthly change: #v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!. Pressure rises by #n +3#! each month, or #n +2.5#! under the Constitutional Settlement. Active reconciliation reduces it by #p 3#!.\n\n#bold The First Minister's Case#!\nFrom #v July 1837#!, the case may begin when pressure exceeds #v 24#!. From the beginning of #v 1838#!, a case still open against Chen Dongyang, if he remains in the country, leads to the assassination and protection events. His death adds #n +25#! pressure, injury #n +10#!, and escape #n +3#!.\n\nAfter the case is resolved, #v 70#! pressure permits an early accession. At #v 100#!, succession proceeds if Zheng Qin has departed. From the beginning of #v 1839#!, a dynastic dispute still undecided rises to #v 100#! once the First Minister's case has concluded. Succession and the other states' responses then proceed whether or not Zheng Qin is still alive. A peaceful settlement ends the dispute."
 nesnd_south_compact_detail_tt:0 "#bold Support for the settlement#!\nMainland, overseas and Japanese governments account for #v 50%, 30% and 20%#! respectively. Pledges last #v 36 months#! and cease to count after a change of alignment or overlord, war against the centre, or withdrawal.\n\n#bold A peaceful constitutional settlement#!\nThe chosen side needs political support of #v 85#! and a lead of #v 20#!, held for #v 12 months#!. Ming needs #v 75%#! pledged support and at least two mainland core governments. Wu needs #v 80%#!, consent from every government due for integration and the Japanese territorial parties, and a sufficiently prepared fleet. A completed settlement ends the dispute."
 nesnd_south_succession_board:0 "The Southern Polities"
 nesnd_south_succession_board_reason:0 "Whose realm is Southern Ming: the Zhu emperor’s, or the Zheng family’s creation? Nanjing retains the imperial succession, while the Southern Administration in Hangzhou commands the troops and revenues that drive reform. The Western provinces and Hangzhou could postpone their dispute over sovereign and minister while resisting the North. With reform reaching deep into provincial life, they can no longer avoid the question of who will govern.\n\nHuguang’s academies and Xiangfan’s troops uphold the Zhu succession, while Sichuan’s republicans continue to debate the Southern Administration’s reforms. Governors in the Southern Seas and lords in Japan weigh the land, money and soldiers a new dynasty might demand. Representatives in the Assembly of Rites, ministers in the cabinet and provincial commanders will eventually have to answer for their choices."
 nesnd_south_succession_board_status:0 "The provinces and overseas states are declaring their positions and preparing their governments and forces. The dispute over Southern government now reaches across the seas."
 nesnd_board_table_heading:0 "The Southern Countries"
 nesnd_board_country_metrics:0 "Regular #v [Country.GetRegularBattalions|0]#! / Conscriptable #v [Country.CalcConscriptableBattalions|0]#!　Ships #v [Country.GetNumShips|0]#!\nFixed balance @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　Army projection #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\nSupply preparations: [Country.GetCustom('nesnd_board_supply_loc')]\n[Country.GetCustom('nesnd_south_ready_loc')]"
 nesnd_board_supply_known:0 "#v [Country.MakeScope.Var('nesnd_board_supply_score').GetValue|0] / 4#! conditions"
 nesnd_board_supply_unknown:0 "Not assessed"
 nesnd_board_stance_unstated:0 "Undeclared"
 nesnd_board_stance_ming:0 "Ming"
 nesnd_board_stance_wu:0 "Wu"
 nesnd_board_stance_neutral:0 "Neutral"
 nesnd_board_stance_autonomy:0 "Autonomy"
 nesnd_board_stance_available_tt:0 "The civil war has not begun, and six months have passed since our last change of allegiance. Xiangfan remains committed to Ming. The central court cannot choose neutrality or autonomy."
 nesnd_board_stance_effect_tt:0 "Declare our alignment, fixed for #v 6 months#!. Withdrawing an existing pledge also cancels unfulfilled consent to integration or cession and reduces relations with the centre by #n 15#!."
 nesnd_board_choose_ming:0 "Support the Ming Court"
 nesnd_board_choose_ming_desc:0 "The Zhu succession remains the recognised dynasty of the Southern provinces and overseas states. Support Ming government under the constitution and limits on Hangzhou’s dominance."
 nesnd_board_choose_wu:0 "Support the Zheng House"
 nesnd_board_choose_wu_desc:0 "The Zheng family has long commanded the Southern realm’s military and fiscal power. Support the King of Wu in founding a dynasty whose constitution defines the powers of monarch and assembly."
 nesnd_board_choose_neutral:0 "Remain Neutral"
 nesnd_board_choose_neutral_desc:0 "The Ming court and Hangzhou press rival claims. Remain outside the succession dispute for now and attend to our own trade and defence."
 nesnd_board_choose_autonomy:0 "Seek Autonomy"
 nesnd_board_choose_autonomy_desc:0 "As the court disputes the succession, seek control of our own taxation, appointments and defence. Make our position clear to both Ming and Wu."
 nesnd_board_ming_bar_name:0 "Ming Continuity"
 nesnd_board_wu_bar_name:0 "Zheng Statecraft"
 nesnd_board_ming_bar_desc:0 "$nesnd_board_ming_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_wu_bar_desc:0 "$nesnd_board_wu_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_compact_bar_name:0 "Support for the Settlement"
 nesnd_board_pressure_bar_name:0 "Gathering Conflict"
 nesnd_board_compact_bar_desc:0 "$nesnd_board_compact_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_pressure_bar_desc:0 "$nesnd_board_pressure_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_not_ming_tt:0 "We have not declared support for the Ming court."
 nesnd_board_not_wu_tt:0 "We have not declared support for the Zheng regime."
 nesnd_board_not_neutral_tt:0 "We have not declared neutrality."
 nesnd_board_not_autonomy_tt:0 "We have not declared its intention to seek autonomy."
 nesnd_ming_host_huguang:0 "Court refuge: Huguang"
 nesnd_ming_host_huguang_desc:0 "Prefer Huguang if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_sichuan:0 "Court refuge: Sichuan"
 nesnd_ming_host_sichuan_desc:0 "Prefer Sichuan if the court leaves the capital. Its government must support Ming and be able to act independently."
 nesnd_ming_host_effect_tt:0 "When the provinces break with the centre, establish the court in refuge here if possible. Otherwise consider the other available host."
 nesnd_ming_renew_convocation:0 "Reopen the Deliberations"
 nesnd_ming_renew_convocation_desc:0 "Summon representatives of the provinces and states to reconsider the positions of the Ming court and the King of Wu."
 nesnd_ming_court.3.t:0 "The Provisional Court"
 nesnd_ming_court.3.d:0 "The accompanying ministers have reached the court’s refuge, and the local government is making room for them. Its army must still raise supplies and its administrative commissions govern the province; now it must also maintain the travelling court. Ming loyalism has acquired a centre to serve, and the host must bear the first costs of breaking with Hangzhou.\n\nEnvoys continue to arrive from the provinces and overseas states. Claims once debated in the Assembly of Rites and cabinet must now be backed by military strength."
 nesnd_ming_court.3.f:0 "“Under the wide heaven, all is the king's land. To the borders of the land, all are the king's servants.”\n- Book of Songs, Minor Odes, Beishan"
 nesnd_ming_court.3.a:0 "Put the court in order."
 nesnd_ming_court.9.t:0 "Remain in Nanjing"
 nesnd_ming_court.9.d:0 "Neither Huguang nor Sichuan can presently receive the court, which must remain in Nanjing. Ming loyalists must continue seeking provincial support while negotiating with Hangzhou, which controls the troops and revenues. The Zheng claim to the throne is already before us; deliberations in the capital will determine how much room remains to act."
 nesnd_ming_court.9.f:0 "“Your Majesty remains in Nanjing for now. Let each minister keep to his post and await events.”\n- Memorial of the ministers who stayed in the capital"
 nesnd_ming_court.9.a:0 "Negotiate in the capital and defer succession."
 nesnd_ming_court.9.b:0 "Recognise the Zheng claim."
 nesnd_ming_court.10.t:0 "The Provinces Reconsider"
 nesnd_ming_court.10.d:0 "Opponents of the new dynasty have not formed a coalition capable of taking up arms. Appointments, taxation, military obligations and overseas status remain disputed. Hangzhou must keep answering those demands if Zheng rule is to win acceptance, while Ming loyalists continue seeking allies."
 nesnd_ming_court.10.f:0 "“Opinions differ among you, gentlemen, on the new dynasty. On appointments, tax quotas and military funds, I hope the provinces will first consult one another before deciding what to do.”\n- Letter exchanged among Ming loyalists"
 nesnd_ming_court.10.a:0 "Continue negotiations over provincial demands."
 nesnd_ming_court_country:0 "Ming Court in Exile"
 nesnd_ming_interregnum_country:0 "Ming Provisional Government"
 nesnd_ming_court_adj:0 "Ming"
 nesnd_ming_court_transfer_effect_tt:0 "Take control of [ROOT.GetCountry.GetName], with its existing forces, treasury, lands and tax system. If the legitimate Ming monarch accompanies the court, establish a monarchy under that ruler."
 nesnd_ming_court.12.t:0 "The Route Is Uncertain"
 nesnd_ming_court.12.d:0 "The provinces have broken with the centre, but circumstances have changed in the government chosen to receive the court. Unable to leave the capital, Ming loyalists must seek another host in Huguang or Sichuan capable of protecting the sovereign and maintaining the court. Every further day in Nanjing makes it harder to escape Hangzhou’s grip."
 nesnd_ming_court.12.f:0 "“The letter from Huguang says that receiving the court must be discussed further.”\n- From the court's correspondence"
 nesnd_ming_court.12.a:0 "Remain in the capital and seek another opening."
 nesnd_ming_court.12.b:0 "Serve the new dynasty and abandon the evacuation."
 nesnd_ming_seek_refuge:0 "Send Another Envoy"
 nesnd_ming_seek_refuge_desc:0 "Send envoys again to Huguang and Sichuan to find a government able to receive the court and uphold the Ming succession."
 nesnd_ming_after_truce:0 "A Court Without Its Capital"
 nesnd_ming_after_truce_reason:0 "The truce has not returned the court to Nanjing. Ming loyalist provinces retain their armies and revenues, while Hangzhou has not abandoned its imperial claim. The court must rebuild its finances and seek allies before it can recover the old capital and settle the succession."
 nesnd_ming_after_truce_status:0 "In a new war, take Nanjing and the Wu capital and meet the terms for a restoration settlement."
 nesnd_ming_refuge_available_tt:0 "The succession confrontation or war is still underway. A Ming supporter in Huguang or Sichuan must be independent, hold its capital and be free of another player's control."
 nesnd_south_politics_summary:0 "#bold The Ming Court and Hangzhou#!\nFinances and administration #v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!　Cooperation in government #v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!\nZhu succession #v 20#!　Wu military strength #v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!\n#bold Pledges#!　Ming #v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!　Wu #v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!\nContinuous fulfilment #v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#! months.\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_offer_accord:0 "Seek Consent for Constitutional Reform"
 nesnd_south_offer_accord_desc:0 "Appointments, taxation and military funding require a constitution that the Southern realm can uphold. Send our proposed settlement to the provinces and overseas states to seek their support."
 nesnd_south_offer_available_tt:0 "The court supports Ming or Wu, the crisis has not reached open conflict, and the country is neither at war nor in [concept_default]. Six months have passed since the last mission, and an eligible state can respond."
 nesnd_south_accord_offer_tt:0 "Send the proposed settlement to eligible provinces and states for their acceptance or refusal. Another mission may be sent after #v 6 months#!. Negotiations increase government wages by #n 3%#! and use #n 25#! [concept_authority]."
 nesnd_south_accord_accept_tt:0 "Support the proposed settlement for #v 36 months#!, with alignment fixed for #v 6 months#!. Changing alignment, fighting the Southern central government, joining another overlord or expiry ends the pledge. Wu integration terms cede our Chinese territories. Japanese terms cede our holdings in Shikoku and Kyushu while retaining other lands. Relations with the centre improve by #p 15#!."
 nesnd_south_leave_accord:0 "Withdraw Our Pledge"
 nesnd_south_leave_accord_desc:0 "Withdraw our consent to the settlement and reconsider our relationship with the Southern central government."
 nesnd_south_accord_leave_tt:0 "Withdraw the pledge and any unfulfilled consent to integration or cession. Relations with the centre fall by #n 15#!. Alignment cannot change for #v 6 months#!."
 nesnd_south_retry_confrontation:0 "Renew Negotiations with the Provinces"
 nesnd_south_retry_confrontation_desc:0 "The previous negotiations failed, and opponents of the new dynasty still command their own territory and troops. Reopen the confrontation and demand an answer on whether they accept the court's rule."
 nesnd_south_accords.1.t:0 "The Southern Constitutional Settlement"
 nesnd_south_accords.1.ming:0 "The cabinet’s envoy has arrived in [ROOT.GetCountry.GetName] to seek our support for a settlement preserving the Ming dynasty. A constitution will define the powers of the centre and provinces. The Zhu sovereign will remain at the head of government, the cabinet and Six Ministries will administer under law, and provincial delegates will participate through the Assembly of Rites.\n\nAcceptance commits our government to the Zhu succession and this settlement. We retain our government, territory and existing laws. The status and commerce of overseas states will continue to be governed by their separate treaties."
 nesnd_south_accords.1.integration:0 "The Southern Administration’s envoy offers clear terms: recognise Zheng accession and place our Chinese territories under direct central administration as provinces. Their separate military and political authority will end; appointments, taxation and military funding will fall under the new dynasty’s constitution and the cabinet and Six Ministries.\n\nThis would complete the centralising reforms long pursued by Hangzhou. Accepting means deciding who will govern and tax these lands. If we also hold territory overseas, its government and boundaries there will be retained."
 nesnd_south_accords.1.japan:0 "The Southern Administration asks us to recognise the Zheng succession and surrender any territory we hold in Shikoku and Kyushu to direct Wu rule. Our government would retain its remaining lands.\n\nThe proposal ties a Southern dynastic succession to Japan’s borders. Acceptance would secure our place in the new order, at the cost of those territories. The court and the great houses must weigh that price before answering Hangzhou."
 nesnd_south_accords.1.overseas:0 "The Southern Administration asks [ROOT.GetCountry.GetName] to recognise the Zheng succession while retaining our government, territory and existing status. The Assembly of Rites and cabinet will settle the Southern constitution’s distribution of sovereign and provincial powers. Our commerce, ports and military obligations will remain matters for separate treaties.\n\nThe Zheng family needs recognition at home and overseas. Before answering, we must consider the place this succession would leave for us."
 nesnd_south_accords.1.f:0 "“All provinces are requested to declare within one month which dynasty they acknowledge.”\n- Cabinet circular to the provinces"
 nesnd_south_accords.1.a:0 "Support the settlement and recognise the succession."
 nesnd_south_accords.1.b:0 "Accept provincial integration under the central government."
 nesnd_south_accords.1.c:0 "Recognise the succession and accept the territorial cession."
 nesnd_south_accords.1.d:0 "Withhold our consent."
 nesnd_south_accords.20.t:0 "Revising the Constitution"
 nesnd_south_accords.20.d:0 "For a year, the provinces and states supporting Ming have kept their pledge of reform. The provisions debated by provincial delegates in the Assembly of Rites on appointments, land taxes and military funding now have a basis for enactment. The cabinet asks [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] to proclaim a constitution defining the powers of the centre and provinces.\n\nSince Chen Dongyang restored provincial administrative commissions, the Southern government has coordinated civil and military affairs, but the titles of former feudal lords still prop up local power. Disputes set aside during resistance to the North can at last be settled in the assembly. The Zhu succession will endure, with sovereign, cabinet and provinces each exercising authority under the constitution."
 nesnd_south_accords.20.f:0 "“The proposals of the provinces on appointments, land tax and military funds now have a basis for enforcement. We beg that an edict be issued writing the powers of the centre and the provinces into the laws and rites of the state.”\n- Memorial of the cabinet asking for an edict"
 nesnd_south_accords.20.a:0 "Proclaim the constitution."
 nesnd_south_accords.21.t:0 "A Constitution for the Succession"
 nesnd_south_accords.21.d:0 "The parties supporting Zheng have kept their pledge of reform for a year. States due for provincial integration have accepted the transfer of their Chinese territories, and the Japanese governments have accepted the terms concerning Shikoku and Kyushu. Hangzhou’s military and fiscal power now has a basis for establishing the new order.\n\nThe Assembly of Rites and cabinet will incorporate appointments, taxation, military funding and provincial government into a new constitution defining the powers of monarch and assembly. If the Zheng family accepts the throne, it must also accept these obligations. The Southern Administration, long governing in Ming’s name, will face the world under its own dynasty."
 nesnd_south_accords.21.f:0 "“Appointments, tax quotas, military funds and the provincial system are all to be written into the laws and rites of the new dynasty, and the powers of the sovereign and of the deliberative bodies are to be defined anew.”\n- Articles agreed by the Assembly of Rites and the cabinet"
 nesnd_south_accords.21.a:0 "Accept the throne and govern under the constitution."
 nesnd_south_accords.reconsider:0 "Defer the settlement and reopen deliberations."
 nesnd_south_ming_peace_result_tt:0 "Preserve the Zhu sovereign and Ming state. Members retain their territories, governments and economic laws. The centre accepts constitutional obligations for #v 10 years#!. States that kept their pledges receive temporary [concept_prestige] benefits, with an additional reward for sufficient preparations."
 nesnd_south_wu_peace_result_tt:0 "Establish Wu and integrate only eligible Chinese territories with explicit consent and local control. Overseas countries and overseas lands remain separate. Japan cedes only its own Shikoku and Kyushu territories. A player who explicitly accepted whole-country integration takes control of Wu only if no other human controls it. New provinces face #v 12 months#! of transition costs."
 nesnd_south_accords.22.t:0 "The Constitution Established"
 nesnd_south_accords.22.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has proclaimed the revised constitution. Provincial delegates participate in the Assembly of Rites; the cabinet and Six Ministries conduct central government; provincial administrative commissions administer local affairs under the settlement. The Zhu house has gained room to govern beyond Hangzhou’s domination, while accepting constitutional limits on the sovereign.\n\nThe settlement preserves Southern Ming’s Confucian form of constitutional democracy and federation. Its provinces and overseas states retain their governments and territories, and the centre assumes the expense of maintaining the new institutions. Powers once contested by the Southern and Western Administrations through military strength now have an agreed constitutional basis."
 nesnd_south_accords.22.f:0 "“Ritual order governs the state, secures the altars of the realm, ranks its people and benefits its heirs.”\n- Zuo Zhuan, Eleventh Year of Duke Yin"
 nesnd_south_accords.23.t:0 "The Wu Dynasty Established"
 nesnd_south_accords.23.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has taken the throne and proclaimed the Wu constitution. The centre has assumed administration of the Chinese territories that accepted integration, together with the lands ceded in Shikoku and Kyushu. Overseas states retaining their territories continue to govern themselves and deal with the new dynasty under their existing treaties.\n\nThe constitution recognises both the deliberative powers of the Assembly of Rites and the sovereign authority of the Zheng monarch, with the cabinet and Six Ministries conducting government accordingly. Generations of military power, commerce and overseas expansion since Zheng Zhao have at last become an empire ruled in the Zheng family’s own name."
 nesnd_south_accords.done:0 "Govern according to the constitution."
 nesnd_south_negotiation_cost:0 "Constitutional Negotiations"
 nesnd_south_accord_respected:0 "Settlement Honoured"
 nesnd_south_prepared_member:0 "Prepared Administration"
 nesnd_south_prepared_mobilization:0 "Prepared Mobilisation"
 nesnd_south_hasty_mobilization:0 "Hasty Mobilisation"
 nesnd_south_peace_administration:0 "Peaceful Reorganisation"
 nesnd_south_new_province:0 "Provincial Transition"
 nesnd_south_ready_unknown:0 "National preparedness has not yet been assessed."
 nesnd_south_ready_known:0 "Preparations #v [Country.MakeScope.Var('nesnd_ready_total').GetValue|1]/100#! (finances [Country.MakeScope.Var('nesnd_ready_finance').GetValue|1]/20, military [Country.MakeScope.Var('nesnd_ready_military').GetValue|1]/35, inputs [Country.MakeScope.Var('nesnd_ready_supply').GetValue|0]/25, government [Country.MakeScope.Var('nesnd_ready_domestic').GetValue|1]/20)\nCrew #v [Country.MakeScope.Var('nesnd_ready_actual_crew').GetValue|D]#!. Crew-ready ships #v [Country.MakeScope.Var('nesnd_ready_ships_ready').GetValue|0]/[Country.MakeScope.Var('nesnd_ready_ships').GetValue|0]#!. Naval projection #v [Country.MakeScope.Var('nesnd_ready_naval_projection').GetValue|1]#!."
 nesnd_south_failed_alignment:0 "A Defeated Political Cause"
 nesnd_south_peace_stability_tt:0 "Succession Pressure is below #v 60#!, and the country has recovered from [concept_bankruptcy]."
 nesnd_south_ming_supply_tt:0 "Paper, Tools and Small Arms cost no more than #v 50%#! above their base prices in the central market, and none is locally scarce in our lands. Supplies from our shared market count towards this requirement."
 nesnd_south_peace_b1_note:0 "A peaceful settlement requires Succession Pressure below #v 60#! and recovery from [concept_bankruptcy]. Ming also needs adequate market supplies of Paper, Tools and Small Arms."
 nesnd_board_external_observer:0 "External Observer"
 nesnd_south_reconciliation:0 "Reconciling the Realm"
 nesnd_south_reconciliation_reason:0 "Chen Dongyang’s reforms have carried the Southern provinces beyond the [Glossary('glossary_nesnd_fanzhen','military fiefs')] of the old [Glossary('glossary_nesnd_beiming','Northern Ming')] order. Yet a deliberation in the assembly cannot by itself dissolve the grievances between the Southern and Western Administrations. With the parties supporting the same settlement, the centre must meet the agreed administrative expenses and put its proposed distribution of powers into practice.\n\nOverseas states also wait for the court to keep its pledges. Keeping this up month by month may bring the succession dispute back within reach of negotiation."
 nesnd_south_reconciliation_status:0 "Months implementing the settlement: #v [ROOT.GetCountry.MakeScope.Var('nesnd_south_reconciliation_payments').GetValue|0]#!. Succession Pressure: #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!. While active: [concept_budget_government_wages] #n +5%#!, [concept_authority] #n −50#!. Implementation ends at #v 40#! pressure."
 nesnd_south_reconciliation_start:0 "Implement the Agreed Settlement"
 nesnd_south_reconciliation_start_desc:0 "Meet the administrative costs of reform, coordinate the centre and provinces, and keep the pledges made to overseas states."
 nesnd_south_reconciliation_stop:0 "Suspend Implementation"
 nesnd_south_reconciliation_stop_desc:0 "Stop the additional administrative expenditure for the settlement, ending this effort to ease the court dispute."
 nesnd_south_reconciliation_requirements:0 "Meet every other peace requirement for the chosen Ming or Wu route, with no southern [concept_diplomatic_play] or war and no [concept_bankruptcy] recovery penalty."
 nesnd_south_reconciliation_effect_tt:0 "Maintain additional [concept_budget_government_wages] of #n +5%#! and use #n 50#! [concept_authority]. After #v 1 month#!, each month in which the chosen side’s political, financial and pledge conditions hold reduces succession pressure by #p 3#!. Sending proposals or renewing pledges does not itself reduce pressure. Implementation stops if conditions cease to hold, and ends once pressure reaches #v 40#!. A formal peaceful settlement still requires #v 12 months#! of continuous fulfilment."
 nesnd_south_reconciliation_cost:0 "Reform Administration"
 nesnd_ming_royal_allowance:0 "Ming Royal Allowances"
 nesnd_ming_receive_court_tt:0 "If legitimate Ming royals have taken refuge here, supporting Ming enthrones the surviving emperor or heir while retaining the local leader. With no living legitimate successor, a regency remains."
 nesnd_court_followup.15.t:0 "Royal Allowances"
 nesnd_court_followup.15.d:0 "After the succession, the Zhu relatives remaining in [ROOT.GetCountry.GetName] still need homes and support. Providing for the former imperial family preserves their status and shows their old followers how the new government treats its predecessors. The people and obligations left by centuries of imperial rule cannot vanish with a change of dynasty."
 nesnd_court_followup.15.f:0 "“Revive extinguished states, restore broken lines of succession, raise up those who withdrew from office, and the hearts of all the people will turn to you.”\n- The Analects, Yao Yue"
 nesnd_court_followup.15.a:0 "Provide their customary support."
 nesnd_court_followup.19.t:0 "Standing Agreements"
 nesnd_court_followup.19.d:0 "The succession dispute has lasted two years without a settlement acceptable to all parties. The Southern provinces and overseas states continue to exercise their existing powers, while the divide between Ming and Wu has not produced a common war.\n\nWe can close these constitutional negotiations and accept the present borders, governments and treaty relations. Neither side will have carried its programme of reform, but the realm need no longer wait for a constitution that remains beyond agreement."
 nesnd_court_followup.19.f:0 "“The question of the dynasty has been debated for two years without agreement. We beg that the matter be set aside, and that the present borders, governments and treaties stand as they are.”\n- Memorial of the cabinet"
 nesnd_court_followup.19.a:0 "Accept the present settlement and let the people recover."
 nesnd_court_followup.19.b:0 "Continue the negotiations."
 nesnd_south_inconclusive_order:0 "Confirm the Status Quo"
 nesnd_south_inconclusive_order_desc:0 "After two years without a new constitution or a Jingnan confrontation, accept the existing borders, governments and treaty relations and close the succession negotiations."
 nesnd_south_inconclusive_result_tt:0 "End the Ming–Wu crisis on the basis of current territory, governments and treaties. No subjects are annexed, and neither side receives victory rewards."
 nesnd_federal_compact_button_alt_desc:0 "Reform has carried the Southern realm beyond the old order of [Glossary('glossary_nesnd_fanzhen','military fiefs')], while Hangzhou still commands the troops and revenues needed to carry it further. The time has come for a new dynasty. We should first seek the consent of the provinces and overseas states, then bring appointments, taxation, military funding, provincial powers and the position of the Zhu house before the Assembly of Rites and cabinet. A constitution defining the powers of sovereign and assembly will lay the foundations of Zheng rule."
 nesnd_south_reconsider_tt:0 "Restart the #v 12-month#! period of continuous fulfilment."
