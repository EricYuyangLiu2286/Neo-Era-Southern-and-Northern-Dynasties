 flavorUSM.5.t: "Assassination of Chen Dongyang"
 flavorUSM.5.d: "Chen Dongyang (courtesy name Manyue, 1772-[Date.GetString|v]) was a representative figure of civic republican thought during the Western Qin Great Revolution and a founding hero of its short-lived revolutionary republic. Forced into exile from the state he built, he later cooperated with southern progressives and, as chief minister of Southern Ming, became a key leader of modernization reform.\n\nYet reform brought not only prosperity but also severe political turmoil and resistance from powerful local interests. After core political and economic reforms were largely completed, Zheng Qin and allies grew weary of republican ideals beyond Chen's control. Having once declared 'what I desire, I shall take and hold alone,' Zheng Qin dismissed Chen earlier this year and secretly ordered Zheng (Tokugawa) Jiaqi to monitor him. Ultimately, on [Date.GetString|v], while Chen sailed to lecture in the Far East Continent, a retained Wa assassin named Zheng Liulang poisoned him aboard ship."
 flavorUSM.5.f: "A great state is not in vast mountains and rivers...\n- On the Great State, Chen Dongyang"
 flavorUSM.5.1: "The end of an era."

 flavorUSM.6.t: "After the Chief Minister’s Death"
 flavorUSM.6.d: "Chen Dongyang, courtesy name Manyue, was the leading voice of citizen republicanism in the Western Qin Revolution and one of the founders of its short-lived republic. Driven out of the state he had helped create, he joined the southern progressives and, as chief minister of Southern Ming, became the leader of its modernising reforms.\n\nNow he is dead. The southern republicans who followed him have lost their mainstay, and the cabinet and Six Ministries must parcel out the duties he left behind. The provincial delegates are still arguing over the future of reform in the Assembly of Rites, but Hangzhou is already courting the leaderless officials."
 flavorUSM.6.d1: "Chen Dongyang (courtesy name Manyue, 1772-[Date.GetString|v]) was a representative figure of civic republican thought during the Western Qin Great Revolution and a founding hero of its short-lived revolutionary republic. After being forced to leave the country he founded, he cooperated with southern progressives and became a key leader of Southern Ming modernization as chief minister.\n\nYet reform brought not only prosperity but severe political turmoil and resistance from local powerholders. As political and economic reform neared completion, Zheng Qin and his allies grew fearful of republican ideals beyond their control. Ultimately, on [Date.GetString|v], while Chen Dongyang was departing for the Far East Continent to lecture, an unidentified Wa ronin shot and killed the republican leader on deck.\n\nAfter Chen's death, southern republicans who had followed him immediately fell into mutual accusations and dispute."
 flavorUSM.6.f: "A great state is not in vast mountains and rivers, not in number of people, not in quantity of iron and gold. It lies in nurturing life, standing with the people, and governing production. Taking boundless heaven and earth as its outer wall and the right path as its inner city, even a single city, a single ward, a single corner may still be a great state.\n- On the Great State, Chen Dongyang"
 flavorUSM.6.1: "The end of an era."

 flavorUSM.7.t: "Diaojin Enters Shu"
 flavorUSM.7.d: "In late Southern Ming, armed forces were chiefly divided between Western Office and Southern Office. Unlike Zheng's Southern Office, the Western Office lacked a single dominant political leader and functioned as a loose alliance led by Sichuan Shu, Hubei Chu, and Guangxi Huai. Once, Zheng Diaojin was its rising star - foremost strategist under Zhu Banbo. Banbo's charisma and command could make men betray decaying lineage and embrace civic republicanism in the south.\n\nYet Heaven seemed tired of the Ming story: Chen Dongyang and Zhu Banbo, two pillars of the age, fell without warning. The men who followed Diaojin from Xi'an to Monan, back to Xi'an, and then south of the great river scattered to their own fates. In a blink, it seemed only he remained who could still glimpse the summit of republican order.\n\nSo be it. Dreamers of the future failed in France, failed in Qin, and Ming now seems destined to fail as well. Justice in history is known to fail again and again - but if the cause truly follows history's tide, persistence will one day prevail. What Yue Fei and Wen Tianxiang could not do, Zhu Yuanzhang did. And Diaojin may not even need such sacrifice, for somewhere in the western mountains there may still be an old friend."
 flavorUSM.7.f: "Citizens, do you want a revolution without revolution?\n- Robespierre, 5 November 1792"
 flavorUSM.7.1: "People give up, people flee, yet history still moves forward - if not today, then tomorrow."

 flavorUSM.8.t: "Eastern Sichuan Rectification"
 flavorUSM.8.d: "In 1850, the Ritual Assembly proclaimed that Zheng's Wu had replaced Ming. The Shu Prince Zhu Shenhui and Guangxi (Huai) Prince Jingyin rebelled; Jingyin proclaimed a restoration era 'Fuzhao.' The assembly dispatched Zeng Guofan, Zuo Zongtang, Zheng (Tokugawa) Jiaqi, and Wu (Ii) Naosuke to suppress them. Huai fell in March. Next year Shu general Xiao Huli died of illness; minister Wei Jian held old Chengdu and died cursing traitors with sword in hand. The Shu Prince fled south to Dali.\n\nAfter Chengdu's fall, western troops scattered. Zeng and Wu then had southern troops seal Sichuan prefectures for three days, sweep the land, and kill any robust civilians found outside. Chengdu, Jiange, Meizhou and others were violently looted. Those resisting were slaughtered wherever seized. The Jinsha ran red for weeks. The Zheng emperor reportedly showed displeasure, but issued only mild admonition."
 flavorUSM.8.f: "...In Year Three of Tianyan...\n- New Chronicles of Huayang"
 flavorUSM.8.1: "Those western rebels who speak of 'revolution' think bloodshed alone is courage. They read too little Eastern history."

 flavorUSM.9.t: "Yunnan Bloodshed"
 flavorUSM.9.d: "In 1852, Zeng Guofan and Zheng Jiaqi entered Yunnan. The Shu prince surrendered bare-chested, was reduced to Marquis of Dali, and retained stipends. Jingyin, usurper of Huai, was exiled to Kunlunzhou (South Africa) for high treason; his Zhu surname was stripped and changed to 'Zhi.' Thus ended the so-called 'Twin Jing National Crisis.' That winter, Zheng Diaojin, former vice minister of rites and administrator of Huguang, rebelled with disciples and six thousand southwestern tribesmen. He attacked Liulibao in southern Yunnan but failed against local defenders and fled to Burma. Many Sichuan-Yunnan soldiers and civilians still favored old Shu and shielded him, exhausting imperial troops. Upon hearing this, the emperor sent Duke Wucheng Zeng south from Chongqing for a second southwest inspection. In following years Yunnan remained under martial law with repeated purge-killings; native chieftaincies withered and the wilds fell silent."
 flavorUSM.9.f: "...All my life I never sold my dragon-slaying skill...\n- Lu You"
 flavorUSM.9.1: "Countrymen, I can no longer hear your voices. Is this victory?"

 flavorUSM.10.t: "The Great Guilin Trials"
 flavorUSM.10.d: "In 1850, Shu, Huai, and Chu rebelled - called in national history the 'Western Office Turmoil.' The two northwestern feudatories favored revolutionary politics influenced by French radicals. Huai differed: from usurper Zhi Jingyin down to ministers like Yang Xiuqing and Xiao Chaogui, their coalition centered on sectarian land networks, bearing the Lotus banner and Christian crosses. In essence this became the only major modern rebellion of White Lotus heterodox sectarian movements.\n\nWhite Lotus sects had cultivated Guizhou and Guangxi for a century. Did not chaos respond by the millions? After land reform under the national dynasty, Guangxi gentry entered even deeper. Thus, after Duke Zhongzheng Naosuke broke Huai prefectures, he launched a three-month purge of sect members: one convert found, whole family exterminated. Even meritorious old Ming houses were not spared. Harsh in form, but medicine for the state."
 flavorUSM.10.f: "...In the seventh month, letters came from Nanjing bearing the chief minister's seal...\n- Chronicle of Southwestern Rectification Decrees"
 flavorUSM.10.1: "Where did my own seal go? Ah, so it is with His Majesty..."

