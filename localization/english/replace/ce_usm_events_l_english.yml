 flavorUSM.1.t: "A Century of Ming Fortune Nears Its End"
 flavorUSM.1.d: "The Ming banner may still symbolize boundless eastern glory on this Earth. Under sun and moon, the hegemonic states of Northern Ming measured themselves and the world on a scale even more radical than Han and Tang, permanently reshaping power across the World Island. Yet for people who endured centuries of Ming-era regional warlord politics, the royal house of Zhu brought blood and tears equal to its glory.\n\nAfter a new Yumen wind blew from the northwest - where Chen Dongyang and his Zhongren (Civic) Republicans, supported by Prince Zheng Qin of Wu, launched top-down reforms - the reaction of the Zhu house, old court retainers, and hereditary magnates became ever more glaring. Land, debt contracts, forced conscription: these, denounced by republicans as tools by which men consume men, came under sharper criticism for leaving villages empty and broken.\n\nAt this once-in-a-millennium turning point, the wise and cunning might look to the south. Hangzhou - city of Ming exploration into the New World, Europe, the Islamic sphere. That's the seat of the prince of Wu that once saved the dynasty from northerner ambitions now sits amid a chaotic arena of public opinion, waiting for history's torrent to surge again."
 flavorUSM.1.f: "In all under Heaven, shrines that benefit not the people should receive not thy sacrifice...\n- Veritable Records of Emperor Taizu of Ming, Edict on Removing Honorary Titles"
 flavorUSM.1.1: "The wind howls and horses scream. The dying sound of a greater state."

 flavorUSM.2.t: "Conflict in the Shadows"
 flavorUSM.2.d: "Compared with total explosion of contradictions, decisive Southern Court statesmen delayed imperial collapse through a sequence of hard choices, easing direct confrontation between republicans and conservatives. Even so, this survivor crawling out of four centuries of warlord politics also lost much. The age of war-peace confrontation ended. Yet opponents, regional discrimination among old feudatory populations, and new radical groups still move in the shadows of the new era, casting a heavy fog over this country - and the whole East - on its road to the future."
 flavorUSM.2.f: "In ancient times the people followed order without rulers...\n- Qianfu Lun"
 flavorUSM.2.1: "At least we saved our own destiny."

 flavorUSM.3.t: "Crossing the River by Feeling the Stones"
 flavorUSM.3.d: "Compared with total explosion of contradictions, decisive Southern Court statesmen delayed imperial collapse through a sequence of hard choices, easing direct confrontation between republicans and conservatives. Even so, this survivor crawling out of four centuries of warlord politics also lost much. The age of war-peace confrontation ended. Yet opponents, regional discrimination among old feudatory populations, and new radical groups still move in the shadows of the new era, casting a heavy fog over this country's road to the future."
 flavorUSM.3.f: "...In ancient times...\n- Qianfu Lun"
 flavorUSM.3.1: "The same story, a different future."

 flavorUSM.4.t: "The Ming–Wu Succession: Zheng Zhao’s Audience"
 flavorUSM.4.d: "In the spring of 1678, Zheng Zhao—later Emperor Wuzong of Wu, then Duke of Wu, Ming’s Nanjing Protector and Minister of Rites—announced that he would visit the emperor after a succession of victories at home and overseas. The ruler of Yan at Tianjin, victorious in the Great Constitutional War thirty years earlier, still stood at the height of his power. Yet Zheng’s determination overcame his ministers’ warnings and his enemies’ threats. He set out in June.\n\nNothing comparable to this procession had been seen in the nearly three centuries of Northern Ming’s military governors and princely states. Pressure from Yan, Qin and Qi limited Zheng to five thousand guards and a handful of officials, but the entourage included the finest of Wu’s forces: marines from the Southern Seas, Japanese swordsmen, early Jurchen grenadiers, and even exiled nobles of the Far Eastern Yin seeking imperial redress and military aid. They carried treasures gathered during a century of Wu expansion across the world, while nearly ten thousand labourers hauled tribute rice from Annam and Cambodia. Beyond the procession lay a Central Plain kept close to famine by local fighting and the exactions of military governors and transport officials.\n\nAfter returning, Zheng Zhao adopted the title of Supreme Lord. Wu and its colonies entered a period of rapid growth as refugees arrived from both north and south. Zheng and his successors pressed their centralising reforms and the commercialisation of land ever harder, securing the foundations of our authority over the Southern realm and its many states. Wu’s advance has continued to this day..."
 flavorUSM.4.f: "I had heard that the Zhu Son of Heaven held Heaven’s mandate, a divine dragon descended among men. The founding emperor rose from beggary, destroyed foreign rule and restored the Chinese heartland. His achievements would outlast the inscriptions of history. Though virtue might decline, the mandate seemed unchanged. Yet today I have seen him: the Zhu boy is mortal too.\n—Zheng Zhao"
 flavorUSM.4.1: "Yao and Shun yielded the throne; Tang and Wu won it by revolution. Heaven’s favour rests with virtue among the people and service to humanity, not one family or an unbridgeable division between ruler and ruled."

