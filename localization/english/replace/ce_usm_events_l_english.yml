 RULER_TITLE_CE_FANWANG: "Feudatory Prince"

 usm_civilwar.3.t: "A Silent Dynastic Transfer"
 usm_civilwar.3.d: "Rather than let the conflict explode, the South's statesmen used a string of decisive measures to put off the empire's collapse. Even through an upheaval as great as the passing of Ming to Wu, the provinces and overseas states that stayed loyal never took up arms, and swallowed the Wu account of a Ming court rotten to the core; a few others simply left the old hierarchy.\n\nIn a sense, the dynasty of sun and moon may long since have become a rotten trunk that no one would follow into the grave.\n\nYet this survivor, which crawled out of long centuries of military fiefdoms, has also lost a great deal. Opponents, regional prejudice between the peoples of the old fiefs, and new radical societies still move in the shadows of the new age, laying a thick fog over the country's road ahead."
 usm_civilwar.3.d1: "Rather than full explosion of contradictions, decisive Southern Court politicians delayed imperial collapse through firm choices. Even amid Wu-Ming dynastic upheaval, regional governors chose no effective resistance and accepted Wu narratives of total corruption by the Ming emperor and his magnates, preserving a fragile peace in South China.\n\nIn one sense, this implies the sun-and-moon dynasty had long become rotten wood no one wished to die with. Zhu Kuobin, the last emperor to defend court order, may simply have been born at the wrong time.\n\nYet this survivor of four centuries of warlord politics lost much. The age of war-peace confrontation ended, but opponents, regional prejudice among old feudatory populations, and new radical groups still move in the shadows of the new era, cloaking the nation's road forward in dense fog."
 usm_civilwar.3.f: "He who is cursed by ten thousand dies without illness.\n- Ban Gu"
 usm_civilwar.3.1: "I too once wished to live in the age of Ming."
 usm_civilwar.3.2: "Should Ming districts everywhere rename themselves now?"

 usm_civilwar.4.t: "Jingnan Defeated"
 usm_civilwar.4.d: "Zhu Banbo's vision has worn away; Zheng Diaojin's defiance has scattered. Northern princess Mu Muzi once said the bloodstorm at Xiangyang defended only an illusion. It now seems true. Zeng Guofan's firm pacification, Feng Yunshan's defense of Changsha, Chu generals hedging both sides - who can clearly judge their merit and fault? In mortal dust, however, the age of Chu has ended..."
 usm_civilwar.4.d1: "Who could have imagined that Sichuan people once most mocking federation restoration would become the final line defending Ming legitimacy? Shu was the safe harbor of four centuries of Northern Ming chaos, yet could not escape slaughter and decline. Old and new Shu commanders alike now turn to mirage beneath Southern Office cannon. Let Wei Jian's last stand leave at least a loyal shadow in history."
 usm_civilwar.4.d2: "A century of sectarian linkage, one morning of shared resolve. Yet against a behemoth ruling half the world from the southeast, courage and strategy still fell one move short. May Huai's famous generals admire Guilin moonlight again in another life."
 usm_civilwar.4.d3: "That stubborn stone by the Yangtze never reached the height teacher Banbo hoped for. Perhaps when we were forced to carry half the Chu army south to Luzon, our result against Hangzhou was already decided. Yet true civic republicans never fear one last gamble if they still hold the people's support. We lament only our own insufficiency, having squandered the blood of the great Ming people..."
 usm_civilwar.4.d4: "Western winds disperse, Yunnan colors fade. Our great struggle for independence has reached this unhappy end. At least this country dies pursuing independence, not as burial for some warlord daimyo's campaigns."
 usm_civilwar.4.d5: "Our fronts collapsed through defeat after defeat. Southern Office armies crossed our lands and razed our capital. A hundred-thousand-man force exhausted itself in resistance. In four hundred years of Northern Ming Warring States, a great state's destruction looked no different. We can blame only our own inadequacy."
 usm_civilwar.4.f: "All men must die: some weightier than Mount Tai, others lighter than a feather.\n- Sima Qian"
 usm_civilwar.4.1: "It is time."
 usm_civilwar.4.2: "I am Wei Mingjian of Guanzhou! If my plan failed, it was Heaven's will!"

 usm_civilwar.6.t: "The Wu Dream Fades"
 usm_civilwar.6.d: "Sometimes history does not favor the prepared. Works built over decades and centuries can burn into smoke and ruins beneath war's thunder and axe. The conquest of Earth undertaken by Wu's supreme rulers in Ming and Eastern name may endure, but their own authority and might have reached the endpoint history assigned today."
 usm_civilwar.6.f: "Jiangnan has many worthy ministers.\n- Book of Southern Qi"
 usm_civilwar.6.1: "Under history's gaze, posterity will judge merit and fault. Our task is to ensure there will be a posterity that judges rightly."

 usm_civilwar.7.t: "The Wu Dream Fades"
 usm_civilwar.7.d: "Sometimes history does not favor the prepared. Works built over decades and centuries can burn into smoke and ruins beneath war's thunder and axe. The conquest of Earth undertaken by Wu's supreme rulers in Ming and Eastern name may endure, but their own authority and might have reached the endpoint history assigned today."
 usm_civilwar.7.f: "All men must die: some weightier than Mount Tai, others lighter than a feather.\n- Sima Qian"
 usm_civilwar.7.1: "Can four centuries of foundation be ruined by my hand alone?"

 usm_civilwar.8.t: "Dawn of the Great Wu Empire"
 usm_civilwar.8.d: "It is time to raise our glorious heads from years of war. Since the dynastic revolution, southern turmoil has finally ended in the best possible way in our hands. That old official vessel which entered Hangzhou harbor 450 years ago has become a colossal warship that breaks all difficulties beneath the waves of the whole world.\n\nBy sweeping away warlords who call themselves loyal and filial, Great Wu at last fulfills the federation reform dream of 'great centralization.' The heroes of Zheng's house can finally remove the mask of loyal service and contend openly among world powers. Better yet, our victory on the world stage was won even before we stepped onto it."
 usm_civilwar.8.f: "Ancient sages contended with dragons and beasts and won...\n- Tang Zhen"
 usm_civilwar.8.1: "Heaven evolves; Great Ming endures!"

 usm_loss_the_civil_war_tt: "Zheng-Wu #bold loses#! the civil war or reaches the #bold North-South partition#! ending"
 usm_civilwar.9.t: "North-South Partition"
 usm_civilwar.9.d: "This world-shaking farce ended with no winner. In prolonged attrition, east and west of the Southern Court exhausted war potential and industrial foundations alike. Perhaps this fragile peace will soon break and an even greater, bloodier age will come. But for now, at least, we have breathing room..."
 usm_civilwar.9.f: "There has never been a good war or a bad peace.\n- Benjamin Franklin"
 usm_civilwar.9.1: "Is this the curse of the sun-and-moon nation?"

 usm_civilwar.10.t: "Victory in the Second Jingnan War"
 usm_civilwar.10.d: "The civil war unleashed by the treacherous Zheng has ended at last in victory for us, the upholders of the rightful way. It was not an age to be proud of. Loyal servants slaughtered loyal servants, and republicans denounced republicans.\n\nOnly now that the war is won do the real difficulties come to the table. The Zhu house wants its throne back, the victorious provincial leaders will not give up their military and civil power, and the republicans want the citizens who fought side by side brought into a new deliberative government. Who, then, is to rule from Nanjing?"
 usm_civilwar.10.f: "In peace, sons bury fathers. In war, fathers bury sons.\n- Western proverb"
 usm_civilwar.10.1: "Set chaos right and renew sun and moon under a new sky!"
 usm_civilwar.10.2: "Wu's crime lies in disorderly governance, not central authority itself."
 usm_civilwar.10.3: "We couldn't win it in 1812. We'll try again today!"

 usm_civilwar.11.t: "After the War"
 usm_civilwar.11.d: "The war is over, but its fruits were seized by others. Our relationship with the new regime has become awkward. Since Northern Ming, princely politics in the Central Plains was no novelty. But if today's victor turns guns on us, do we truly have confidence to resist the 'royal host'?"
 usm_civilwar.11.f: "Victory and defeat are uncertain in war; to endure shame is the mark of a man.\n- Du Mu"
 usm_civilwar.11.1: "We should maintain our independence."
 usm_civilwar.11.2: "Embrace the new regime."

 usm_civilwar.12.t: "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting] Insists on Independence"
 usm_civilwar.12.d: "[SCOPE.sCountry('usm_mister_rebel').GetName] fought beside the coalition. No sooner was the Second Jingnan War over than they sent us a declaration of independence: they refuse to swear allegiance to the new central government at Nanjing that we represent, and mean to run their own army, finances and diplomacy."
 usm_civilwar.12.f: "In our age, true power belongs not to politicians or peoples, but to muskets and cast-iron cannon.\n- Aisin Gioro Minning"
 usm_civilwar.12.1: "An unresolved matter, nothing more."

 usm_civilwar.13.t: "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting] Swears Allegiance"
 usm_civilwar.13.d: "[SCOPE.sCountry('usm_mister_rebel').GetName] has sent envoys to Nanjing to swear allegiance to the new central government. Having weighed strength and popular standing, they have traded the comradeship of the war for the bond between sovereign and subject; local civil and military affairs will now run under the terms newly agreed."
 usm_civilwar.13.f: "In our age, true power belongs not to politicians or peoples, but to muskets and cast-iron cannon.\n- Aisin Gioro Minning"
 usm_civilwar.13.1: "A wise decision."

 usm_civilwar.14.t: "Pledge to Return Kyushu"
 usm_civilwar.14.d: "One reason we fought through fire and blood for Southern Ming was their promise to return Japanese lands they occupied. Now we have won this great war - it is time for the Ming to honor their pact."
 usm_civilwar.14.f: "Heaven and earth are vast; rule need not belong to one lord alone...\n- Prince Kanenaga of Southern Japan"
 usm_civilwar.14.1: "Yes. Send it."

 usm_civilwar.15.t: "[SCOPE.sCountry('current_jap').GetNameNoFormatting] Demands Fulfillment"
 usm_civilwar.15.d: "Recent internal turmoil forced us to the negotiating table with the Wa. They demand return of occupied Japanese territories in exchange for helping us win this war. It is a profound humiliation, but we have little choice. Perhaps when conditions favor us later, our armies can erase this shame."
 usm_civilwar.15.f: "The Celestial Court has plans to wage war; small states have plans to resist...\n- Prince Kanenaga of Southern Japan"
 usm_civilwar.15.1: "Only a minor setback."

 usm_civilwar.16.t: "[SCOPE.sCountry('current_jap').GetNameNoFormatting] Demands Fulfillment"
 usm_civilwar.16.d: "Recent military losses forced us to negotiate with the Wa. They demand the return of occupied Japanese territories as the price for wartime support. It is humiliating, but we have little choice. Next time we occupy foreign lands and fight, we should defend those holdings more actively."
 usm_civilwar.16.f: "The Celestial Court has plans to wage war; small states have plans to resist. In letters we have Confucian moral classics, in arms we have Sun and Wu's stratagems. You may choose your finest generals and elite troops to invade our borders, but in marsh and mountain and island sea we have our own preparations. Why should we kneel in the road and submit?\n- Prince Kanenaga of Southern Japan"
 usm_civilwar.16.1: "Only a minor setback."
 usm_civilwar.16.2: "Outrageous! You merely did your duty!"

 usm_civilwar.17.t: "Pledge to Return Kyushu"
 usm_civilwar.17.d: "Having defeated our enemies in Southern Ming strife and reoccupied Japanese Kyushu, it is time to issue an ultimatum to the regime that usurped our lands. The Land of the Rising Sun will no longer tolerate this insult to our dignity. The old shogunate's land cession was a mistake."
 usm_civilwar.17.f: "From the Three Sovereigns and Five Emperors onward, China has had rulers - shall the frontier peoples be without them? Heaven and earth are vast, not for one lord alone; the cosmos is broad, and many states may each guard their own sphere. All-under-Heaven belongs to all-under-Heaven, not to one person.\n- Prince Kanenaga of Southern Japan"
 usm_civilwar.17.1: "Time to negotiate."

 usm_civilwar.18.t: "[SCOPE.sCountry('current_jap').GetNameNoFormatting] Demands Fulfillment"
 usm_civilwar.18.d: "Recent military losses forced us to negotiate with the Wa. They demand the return of occupied Japanese territories as the price for helping us win this war. It is humiliating, but we have little choice. Perhaps next time we occupy foreign lands and go to war, we should defend those lands more actively."
 usm_civilwar.18.f: "The Celestial Court has plans to wage war; small states have plans to resist. In letters we have Confucian moral classics, in arms we have Sun and Wu's stratagems. You may choose your finest generals and elite troops to invade our borders, but in marsh and mountain and island sea we have our own preparations. Why should we kneel in the road and submit?\n- Prince Kanenaga of Southern Japan"
 usm_civilwar.18.1: "Damn it."

 usm_civilwar.19.t: "Wa Forces Exit the Jingnan War"
 usm_civilwar.19.d: "With their war aim achieved, Wa forces who once stood with us against Wu are now gradually withdrawing. Their departure will certainly affect the strategic situation."
 usm_civilwar.19.f: "He who understands the times is a true talent; he who adapts is a hero.\n- Yanzi Chunqiu"
 usm_civilwar.19.1: "News neither good nor bad."

 usm_civilwar.20.t: "A Missed Opportunity"
 usm_civilwar.20.d: "This world-shaking farce ended with no winner. In prolonged attrition, east and west of the Southern Court exhausted war potential and industrial foundations alike. Perhaps this fragile peace will soon break and an even greater, bloodier age will come. But for now, at least, we have breathing room..."
 usm_civilwar.20.1: "This is our hard-won independence."
 usm_civilwar.20.2: "Perhaps this age has no need for second-rate players..."

 usm_civilwar.21.t: "[SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting] Comes to Offer Tribute"
 usm_civilwar.21.d: "On the eve of the Second Jingnan War's end, [SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting] declared independence amid chaos. Yet once we established authority in Nanjing, they recognized the gap in strength and legitimacy and chose to join the new central government we formed."
 usm_civilwar.21.f: "He who understands the times is a true talent; he who adapts is a hero.\n- Yanzi Chunqiu"
 usm_civilwar.21.1: "Change will come again sooner or later."

 usm_civilwar.22.t: "Japan Defeated"
 usm_civilwar.22.d: "The war we pushed with all our power has still ended in defeat. Southern Ming - now the Great Wu Empire - proved too strong an opponent. Perhaps only after recovering for a long time in the shadows can our eastern island state pursue independence again. Or perhaps this dissatisfaction with status is merely a darker impulse. In villages and castle towns many voices now say our bloodshed was a tragedy born of greed and tyranny. As a state founded by learning from the great court, we should know contentment."
 usm_civilwar.22.f: "He who understands the times is a true talent; he who adapts is a hero.\n- Yanzi Chunqiu"
 usm_civilwar.22.1: "Shameless."

 usm_civilwar.23.t: "An Agreement Across the Strait"
 usm_civilwar.23.d: "The Zheng and the rulers of Japan are old acquaintances. Truth be told, they have long been the masters of China in all but name; by the precedents of Chinese history, a master of the realm taking one step further would be nothing new, and if anything the Zheng have waited a long time.\n\nNow Wu and the provinces against it have both sent men across the sea to ask Japan for troops, and both offer the same price: the return of the Zheng-held parts of Kyushu after the war. Such a chance comes once in a hundred years."
 usm_civilwar.23.f: "Look across all under Heaven and sea - what lives forever?\n- Oda Nobunaga"
 usm_civilwar.23.1: "We need leaders loyal to Shenzhou."
 usm_civilwar.23.2: "Support those who stand against Wu!"
 usm_civilwar.23.3: "Perhaps our era has not yet arrived..."

 usm_civilwar.24.t: "[SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting] Collapses"
 usm_civilwar.24.d: "As enemy forces advanced, the final defensive line held by rebel power [SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting] collapsed at last. Its final organized resistance has ended. Its leaders either died for the state or fled their people in despair."
 usm_civilwar.24.f: "Bodhi has no tree, nor mirror any stand...\n- Huineng"
 usm_civilwar.24.1: "An ending long foreordained."

 usm_civilwar.25.t: "Lin Hanhan Departs"
 usm_civilwar.25.d: "One of our important commanders, Lin Hanhan, quietly left surveillance with his family earlier this week and never returned. It is an intolerable scandal. Perhaps we will get our chance to execute this traitor on the battlefield."
 usm_civilwar.25.f: "Good birds choose trees, worthy ministers choose lords...\n- Popular Romance of the Three Kingdoms"
 usm_civilwar.25.1: "No real harm done..."

 usm_civilwar.26.t: "Zhu Jingyin Goes to Nanjing"
 usm_civilwar.26.d: "By proclamation of victory, Zhu Jingyin of Huai - honored by anti-Wu forces as Ming sovereign - has finally ascended as Supreme. This means leaving Guilin and going to Nanjing to enthrone as emperor of Great Ming, like the selected heirs of Huai princes in the old 'Huai-Ning mutual abdication' tradition."
 usm_civilwar.26.f: "The Son of Heaven should be the one with strong troops and warhorses - was he born to it?\n- Old History of the Five Dynasties"
 usm_civilwar.26.1: "This may benefit us, but we have our own affairs to handle."

