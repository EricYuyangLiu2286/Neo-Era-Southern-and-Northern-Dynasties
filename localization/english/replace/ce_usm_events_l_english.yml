 flavorJAP_ce.1.t: "Breaking Free from the Dragon"
 flavorJAP_ce.1.d: "Ever since the armies of Wu principality aided the late Taikō Toyotomi Hideyoshi in seizing power in Japan, our position has long remained beneath the Southern Ming court led by the prince in Hangzhou. In time, we gradually reduced to that of a vassal and consort to the Ming-nese rule. In the end, not only was Kyushu lost, but the authority over customs and maritime trade was likewise placed under the control of the “Eastern Ocean Consular Office” established by the Chines. Yet fortune has always turned by the change of ages. Amid the torrent of the Southern Ming Federation’s collapse, the current Shogun, [SCOPE.sCharacter('japanese_ruler').GetIdeology.GetName], seized the pulse of the times and won a hard-earned independence."
 flavorJAP_ce.1.f: "“By command of the Taikun of Japan, we hereby respectfully address His Majesty, Emperor of the Great Chinese Court. From this day forth, Japan shall no longer stand among the tributary states. All matters of territory, governance, military affairs, and commerce shall be judged and administered independently by this country. The old bonds of favor and obligation are not forgotten. Yet as Heaven and Earth have changed, so too must names and stations be rectified with the times. May our two countries each keep to their own frontiers, preserve the old amity, and sever the old order.”"
 flavorJAP_ce.1.1: "The Times Are Changing"

 flavorJAP_ce.2.t: "Scorching Summer"
 flavorJAP_ce.2.d: "The sweltering heat of midsummer caused the health of the aged [SCOPE.sCharacter('japanese_shogun').GetPrimaryRoleTitle] [SCOPE.sCharacter('japanese_shogun').GetFullName] to deteriorate rapidly, and he ultimately passed away earlier this month. His heir, the reform-minded [SCOPE.sCharacter('japanese_heir').GetFullName], now rules Japan. He has long dreamed of a new and powerful shogunate, and many among the vassals respect this vision."
 flavorJAP_ce.2.f: "“As the summer heat reached its height, our late lord fell gravely ill and at last passed from this world, leaving all the subjects of the realm in mourning. Yet the perilous state of the country permits us no long indulgence in grief. Now that the new lord has inherited the succession, he must restore discipline, strengthen the military, open the path of learning, observe the conditions of all nations, and adopt their strengths, so that the country may be enriched, the army strengthened, and the shogunate renewed. This is no private design for the sake of one house; it is truly a grand policy for Japan for all ages to come.”"
 flavorJAP_ce.2.1: "We must learn from the Ming."
 flavorJAP_ce.2.2: "We must modernize!"

 flavorJAP_ce.3.t: "An Ill-Fated Beginning"
 flavorJAP_ce.3.d: "[SCOPE.sCharacter('japanese_shogun').GetFullName]’s radicalism ultimately proved more than his body could bear. During a sudden outbreak of influenza, he tragically collapsed, never to rise again. As the [SCOPE.sCharacter('japanese_shogun').GetPrimaryRoleTitle] lay on his deathbed, loyal retainers gathered at his bedside seeking guidance, while conservatives hidden in the shadows began to stir..."
 flavorJAP_ce.3.f: "The Shōgun's bed had been moved to face the window. His attendants had hoped the cool air blowing in from the sea would supplement their fans. A chest of ice sat open at the foot of the bed, and a wet cloth across his forehead.\n\nThere was no wind, today. The air rippled beneath the setting sun. Merciless, all-enveloping. He could no longer make out the shape of the waves below."
 flavorJAP_ce.3.1: "“As in the Ming precedent, my brother [SCOPE.sCharacter('japanese_heir').GetFullName] would be as Yao and Shun...”"
 flavorJAP_ce.3.2: "Who would heed the command of a dying [SCOPE.sCharacter('japanese_shogun').GetPrimaryRoleTitle]?"

