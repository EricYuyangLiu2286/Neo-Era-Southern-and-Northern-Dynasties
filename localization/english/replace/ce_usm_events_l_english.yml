 usm_civilwar_play: "Second Jingnan War"
 ce_usm_civilwar_journal: "Southern Ming Civil War"
 ce_usm_civilwar_journal_reason: "The Zheng house of Hangzhou commands overwhelming prestige in old provinces of Min, Wu, Yue, Ning, and Miao, with a million soldiers under Southern Office banners. It also led reform and resistance against the Northern Court. By all right it can compel abdication from the weak Zhu throne to found a world empire and reunify Huaxia. Yet elsewhere in Southern Ming - especially the western inland influenced by Zhu Banbo and republican radicals - even people no longer loyal to Ming banner despise Hangzhou's 'examination-gentry parliamentarism.' In such turbulence, ambitious and unworthy opportunists will rebel against our great project of restoring order and renewing the age. Of course, should they lack courage, would the generous Supreme of Great Wu begrudge them marquisates?"
 ce_usm_civilwar_journal_fail.tt: "When all six autonomous Southern Ming dominions eligible to join the civil war have made their choice, and more than #bold 1#! holds opposition"
 ce_usm_civilwar_journal_invalid.t1: "All forces eligible for the Southern Ming civil war [concept_journal_entry] have lost eligibility"
 ce_usm_civilwar_journal_invalid.t2: "If all participants choose not to oppose Wu immediately, this log becomes invalid and the [concept_journal_entry] fails"

 ce_usm_suppress_rebellion: "Second Jingnan War: Crush the Rebels"
 ce_usm_suppress_rebellion_reason: "Remnants of the Western Office tore apart the realm merely because Zhu rule decayed and died, opening opportunities for Northern autocrats and western barbarians. They are criminals against China's progressive tomorrow. To continue economic construction and deepen land reform, we must quell rebellion by force and disarm old nobles and warlord adventurers completely."

 ce_usm_restoration_of_ming: "Second Jingnan War: Overthrow Wu, Restore Ming"
 ce_usm_restoration_of_ming_reason: "Southern Office Wu are no more than Wa-blood usurpers, yet dare commit great treason akin to Southern Dynasties usurpations. They treat Ming as another Eastern Jin or Southern Tang while imposing extractive land-plunder rule and abusing pillars of state. Since antiquity, those who usurp by treason are enemies of China and may be slain by all. We are loyal ministers of Ming. Follow Taizong Yongle's example: obey Heaven's mandate, pacify national calamity!"

 ce_usm_acheive_revolution: "Second Jingnan War: Anti-Wu Revolution"
 ce_usm_acheive_revolution_reason: "The Napoleonic clique of Southern Office Zheng are wolves at heart. At the critical moment they betrayed former leader Chen Dongyang's ideal and now seek to suppress our just movement for freedom and unification. They and the Zhu landlord bloc they discarded belong in history's grave!"

 ce_usm_cw_japanese_interest: "Second Jingnan War: Wa Independence Movement"
 ce_usm_cw_japanese_interest_reason: "The Zheng foothold in Kyushu forms part of Wu’s maritime power and has long affected the interests of Japan’s great houses. With civil war threatening the Southern realm, rival envoys cross the sea seeking ships and supplies. The government has an opportunity to recover the Wu-held lands of Kyushu and reshape relations across the strait."

