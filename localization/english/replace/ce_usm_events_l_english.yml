 usm_civilwar.14.d_stalemate: "The civil war in Southern Ming has paused. We sent troops in exchange for a promise to return the Japanese territories, and the Southern Government now lacks the strength to continue fighting. Kyushu cannot remain a pledge on paper forever. It is time to lay the old agreement on the negotiating table."
 usm_civilwar.20.d_defeated_ally: "Our wager on the Southern Government has failed. The Ming restoration armies have won, while the promise to return Kyushu has brought us no spoils. The shogunate must now choose whether to bear this miscalculation alone or bow to the restored Ming government."
