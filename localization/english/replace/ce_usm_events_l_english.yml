 ce_usm_conflicts_within: "Wu-Ming Debate"
 ce_usm_conflicts_within_remove: "Remove [concept_journal_entry] #bold Wu-Ming Debate#!"
 ce_usm_conflicts_within_reason: "Ming’s Zhu dynasty, or Wu’s Zheng house? For those able to take part in Southern Chinese politics, the question demands an answer at every moment. From village lecture halls on Sichuan’s frontier to the chamber of the Ministry of Rites in Nanjing, arguments, memorials, essays and reports call out to the public. There are more questions than answers, more quarrels than considered debate."

 ce_usm_ruling_of_nanfu: "Southern Office Remote Rule"
 ce_usm_ruling_of_nanfu_reason: "The Wu princely house, descended from Yongle-era admiral Zheng He, may long since have forgotten that its ancestors were nearly consumed by old eunuch abuses. Yet alliance with southern civic republicans has forged one of the world's most efficient and clean bureaucratic systems, while two centuries of autocratic reform ensured all institutions and controllers remain, to varying degrees, loyal to Prince Wu and his political bloc. Compared with inland feudatories struggling to govern even parts of China, the Zheng elites of Southern Wu direct the whole world in orderly fashion - and have done so for nearly a century."


