l_english:
 lawgroup_nesnd_hus_social_hierarchy:0 "Dongzhou Social Hierarchy"
 lawgroup_nesnd_hus_social_hierarchy_desc:0 "A system that assigns social standing within the republic by cultural registration."
 nesnd_hus_social_hierarchy:0 "Dongzhou Social Hierarchy"
 nesnd_hus_social_hierarchy_desc:0 "Han, Manchu and Mongol, Indigenous American, and European registrations determine acceptance and treatment within the republic."
 law_nesnd_hus_four_tier_system:0 "Four-Tier Registration"
 law_nesnd_hus_four_tier_system_desc:0 "Han people occupy the first tier, Manchu and Mongol peoples the second, Indigenous Americans the third, and Europeans the fourth. Cultural registration limits social standing regardless of wealth or profession."
 law_nesnd_hus_manchu_registration:0 "Manchu and Mongol Registration"
 law_nesnd_hus_manchu_registration_desc:0 "Manchu and Mongol residents receive the same first-tier registration as Han residents. Indigenous Americans remain in the third tier and Europeans in the fourth, as the republic enlarges the body entitled to its highest standing."
 law_nesnd_hus_native_registration:0 "Indigenous Registration"
 law_nesnd_hus_native_registration_desc:0 "Indigenous Americans receive the same first-tier registration as Han residents. Manchu and Mongol residents remain in the second tier and Europeans in the fourth. Equal civic standing reshapes the relationship between settlers and Indigenous peoples."
 law_nesnd_hus_hierarchy:0 "$law_nesnd_hus_four_tier_system$"
 law_nesnd_hus_hierarchy_desc:0 "$law_nesnd_hus_four_tier_system_desc$"
 law_nesnd_hus_registry_manchu:0 "$law_nesnd_hus_manchu_registration$"
 law_nesnd_hus_registry_manchu_desc:0 "$law_nesnd_hus_manchu_registration_desc$"
 law_nesnd_hus_registry_native:0 "$law_nesnd_hus_native_registration$"
 law_nesnd_hus_registry_native_desc:0 "$law_nesnd_hus_native_registration_desc$"
 nesnd_hus_registration:0 "Registration in the Republic"
 nesnd_hus_registration_reason:0 "Citizenship has never carried equal weight in the $HUS$. Han residents stand first, followed by Manchu and Mongol peoples, Indigenous Americans, and Europeans. Living in the same republic does not bring the same treatment. The question of widening the civic body has now reached the government. Manchu and Mongol residents seek equality through their ties with the Han. Indigenous peoples demand recognition of their claims upon this land and its republic.\n\nThe government will grant first-tier registration to one of these groups after a year of registration. Its decision will also reshape relations with those left under the old distinctions."
 nesnd_hus_registration_goal:0 "Choose whom to admit to the first tier and complete a year of registration."
 nesnd_hus_registration_lock_tt:0 "$lawgroup_citizenship$ laws cannot be changed while the Dongzhou social hierarchy remains in force"
 nesnd_hus_registration_uncommitted_tt:0 "No registration has been chosen"
 nesnd_hus_registration_enacted:0 "Registration is complete and its law is in force"
 nesnd_hus_registration_choose:0 "The government has yet to decide whom to admit to the first tier."
 nesnd_hus_registration_pending_manchu:0 "Manchu and Mongol registration is underway."
 nesnd_hus_registration_pending_native:0 "Indigenous registration is underway."
 nesnd_hus_registration_pending:0 "Registration is underway."
 nesnd_hus_registration_completed:0 "Registration is complete and the new law is in force."
 nesnd_hus_registration_conflict:0 "Conflicting registration decisions have left the existing hierarchy in place."
 nesnd_hus_register_manchu:0 "Admit Manchu and Mongol Residents"
 nesnd_hus_register_manchu_desc:0 "Ties between Manchu, Mongol, and Han residents offer one path to a broader civic body. The government will recognize their equal social standing."
 nesnd_hus_register_manchu_tt:0 "$law_nesnd_hus_manchu_registration$ takes effect after #bold 12 months#!. Indigenous Americans remain in the third tier and Europeans in the fourth. This choice cannot be changed."
 nesnd_hus_register_native:0 "Admit Indigenous Residents"
 nesnd_hus_register_native_desc:0 "Indigenous peoples share the republic’s land. The government will recognize their equal standing with Han residents, prompting Manchu and Mongol residents left in the second tier to seek a life elsewhere."
 nesnd_hus_register_native_tt:0 "$law_nesnd_hus_native_registration$ takes effect after #bold 12 months#!. Manchu and Mongol residents remain in the second tier and Europeans in the fourth. Manchu and Mongol communities will subsequently leave for $CNE$ or the American West. This choice cannot be changed."
