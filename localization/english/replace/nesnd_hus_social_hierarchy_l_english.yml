l_english:
 lawgroup_nesnd_hus_social_hierarchy:0 "Dongzhou Social Hierarchy"
 lawgroup_nesnd_hus_social_hierarchy_desc:0 "A system that assigns social standing within the republic by cultural registration."
 nesnd_hus_social_hierarchy:0 "Dongzhou Social Hierarchy"
 nesnd_hus_social_hierarchy_desc:0 "Han, Manchu and Mongol, Indigenous American, and European registrations determine acceptance and treatment within the republic."
 law_nesnd_hus_four_tier_system:0 "Four-Tier Registration"
 law_nesnd_hus_four_tier_system_desc:0 "Han people occupy the first tier, Manchu and Mongol peoples the second, Indigenous Americans the third, and Europeans the fourth. Cultural registration limits social standing regardless of wealth or profession."
 law_nesnd_hus_manchu_registration:0 "Manchu and Mongol Registration"
 law_nesnd_hus_manchu_registration_desc:0 "Manchu and Mongol residents receive the same first-tier registration as Han residents. Indigenous Americans remain in the third tier and Europeans in the fourth, as the republic enlarges the body entitled to its highest standing."
 law_nesnd_hus_native_registration:0 "Indigenous Registration"
 law_nesnd_hus_native_registration_desc:0 "Indigenous Americans receive the same first-tier registration as Han residents. Manchu and Mongol residents remain in the second tier and Europeans in the fourth. Equal civic standing reshapes the relationship between settlers and Indigenous peoples."
 law_nesnd_hus_hierarchy:0 "$law_nesnd_hus_four_tier_system$"
 law_nesnd_hus_hierarchy_desc:0 "$law_nesnd_hus_four_tier_system_desc$"
 law_nesnd_hus_registry_manchu:0 "$law_nesnd_hus_manchu_registration$"
 law_nesnd_hus_registry_manchu_desc:0 "$law_nesnd_hus_manchu_registration_desc$"
 law_nesnd_hus_registry_native:0 "$law_nesnd_hus_native_registration$"
 law_nesnd_hus_registry_native_desc:0 "$law_nesnd_hus_native_registration_desc$"
 nesnd_hus_registration:0 "Registration in the Republic"
 nesnd_hus_registration_reason:0 "Citizenship has never carried the same weight for everyone in the $HUS$. The Han come first, then Manchu and Mongol residents, Indigenous Americans and Europeans in turn: one country, but treatment divided into ranks. Now the argument over widening citizenship has reached the government. The Manchu and Mongols claim equality through their old ties to the Han; Indigenous peoples demand that the republic recognise their share in this land and this country.\n\nThe government can raise only one of them to first-tier registration, with the new law taking effect after a year of registration. Those left in the old ranks will remember this choice."
 nesnd_hus_registration_lock_tt:0 "$lawgroup_citizenship$ laws cannot be changed while the Dongzhou social hierarchy remains in force"
 nesnd_hus_registration_uncommitted_tt:0 "No registration has been chosen"
 nesnd_hus_registration_enacted:0 "Registration is complete and its law is in force"
 nesnd_hus_registration_choose:0 "The government has yet to decide whom to admit to the first tier."
 nesnd_hus_registration_pending_manchu:0 "Manchu and Mongol registration has begun. $law_nesnd_hus_manchu_registration$ will take effect automatically one year after the choice was made."
 nesnd_hus_registration_pending_native:0 "Indigenous registration has begun. $law_nesnd_hus_native_registration$ will take effect automatically one year after the choice was made."
 nesnd_hus_registration_pending:0 "Registration is underway."
 nesnd_hus_registration_completed:0 "Registration is complete and the new law is in force."
 nesnd_hus_registration_conflict:0 "Conflicting registration decisions have left the existing hierarchy in place."
 nesnd_hus_registration_manchu_conclusion:0 "Manchu and Mongol residents now share first-tier registration with the Han. Indigenous Americans remain in the third tier and Europeans in the fourth. The ranks still stand; the first rank has simply grown larger."
 nesnd_hus_registration_native_conclusion:0 "Indigenous Americans now share first-tier registration with the Han. Manchu and Mongol residents remain in the second tier and Europeans in the fourth. The Manchu and Mongols have been left behind in the old hierarchy."
 nesnd_hus_registration_closed:0 "The former Dongzhou government’s registration reform has ended."
 nesnd_hus_registration_closed_tt:0 "The former Dongzhou government’s registration reform no longer applies"
 nesnd_hus_registration.20.t:0 "A Wider Civic Body"
 nesnd_hus_registration.20.manchu:0 "The government has chosen to admit Manchu and Mongol residents to the first tier. Registration begins today and will take twelve months, after which $law_nesnd_hus_manchu_registration$ will take effect."
 nesnd_hus_registration.20.native:0 "The government has chosen to admit Indigenous Americans to the first tier. Registration begins today and will take twelve months, after which $law_nesnd_hus_native_registration$ will take effect."
 nesnd_hus_registration.20.a:0 "Let the new law take effect on schedule."
 nesnd_hus_registration.21.t:0 "The Registration Law Takes Effect"
 nesnd_hus_registration.21.manchu:0 "$law_nesnd_hus_manchu_registration$ is now in force. Manchu and Mongol residents share first-tier registration with the Han. Indigenous Americans remain in the third tier and Europeans in the fourth."
 nesnd_hus_registration.21.native:0 "$law_nesnd_hus_native_registration$ is now in force. Indigenous Americans share first-tier registration with the Han. Manchu and Mongol residents remain in the second tier and Europeans in the fourth."
 nesnd_hus_registration.21.a:0 "The new law stands."
 nesnd_hus_register_manchu:0 "Admit Manchu and Mongol Residents"
 nesnd_hus_register_manchu_desc:0 "The Manchu and Mongols have deep ties to the Han. Raising them to the first rank is the easiest step towards a wider citizenship."
 nesnd_hus_register_manchu_tt:0 "$law_nesnd_hus_manchu_registration$ takes effect after #bold 12 months#!. Indigenous Americans remain in the third tier and Europeans in the fourth. This choice cannot be changed."
 nesnd_hus_register_native:0 "Admit Indigenous Residents"
 nesnd_hus_register_native_desc:0 "This land was the Indigenous peoples' home first, and they deserve the same standing as the Han. The Manchu and Mongols left in the second tier will look for a life elsewhere."
 nesnd_hus_register_native_tt:0 "$law_nesnd_hus_native_registration$ takes effect after #bold 12 months#!. Manchu and Mongol residents remain in the second tier and Europeans in the fourth. Manchu and Mongol communities will subsequently leave for $CNE$ or the American West. This choice cannot be changed."
