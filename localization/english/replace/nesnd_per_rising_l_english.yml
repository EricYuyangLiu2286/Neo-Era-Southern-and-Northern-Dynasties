 nesnd_per_tension_rising_tt:0 "Tension reaches #v 100#!"
 nesnd_per_tension_rising_effect_tt:0 "The Iranians rise: the court may enthrone a Shah (if the wider Iranians are at least half the country), or put the rising down."
 nesnd_per_tension_rising_conclusion:0 "The Iranians have risen, and the Tang court must answer."
 nesnd_per_rising.1.t:0 "The Iranians Rise"
 nesnd_per_rising.1.d:0 "The bazaar of Isfahan has shut, and the pulpits no longer speak the sovereign's name. Persian notables, Kurdish chiefs and Lur tribes have joined overnight under a single line on their banners: Iran for the Iranians.\n\nThe Martial Clans demand to march. Others at court murmur that rather than fight a war already lost, they should enthrone a Persian as Shah, leave the realm to the Iranians and keep their own lives."
 nesnd_per_rising.1.f:0 "'Iran for the Iranians.' - the rebels' banner"
 nesnd_per_rising.1.a:0 "Let them have the realm. We keep our heads."
 nesnd_per_rising.1.a.tt:0 "#r Change of dynasty#!: a Persian Shah takes the throne; the Tang leave the primary cultures, the state faith becomes Shia and the social hierarchy returns to default; '$nesnd_per_new_dynasty$' for 5 years, and the Martial Clans are displeased. Persian rule begins."
 nesnd_per_rising.1.b:0 "The Tang won this realm with the sword."
 nesnd_per_rising.1.b.civil_tt:0 "The provinces where the wider Iranians are a majority form '$IRN$' and fight the court for #r the whole country#!: the loser is annexed."
 nesnd_per_rising.1.b.independence_tt:0 "The provinces where the wider Iranians are a majority form '$IRN$'; the court marches to #v retake#! them, and the rebels fight only for independence."
 nesnd_per_rising.1.c:0 "A wise bird chooses its tree."
 nesnd_per_rising.1.c.tt:0 "As above, the war goes ahead, but you take control of '$IRN$'."
 nesnd_per_rising.10.t:0 "The Old Tang Conspiracy"
 nesnd_per_rising.10.d:0 "The night watch has found rolls and weapons in a Tang clan hall. The rolls name sons of the old military houses, and several men who still hold office at the Shah's court. They meant to rise on the day of the ancestral rites and bring back the heirs of the Li house from Western Qin."
 nesnd_per_rising.10.f:0 "'There are more tablets in the clan hall than men in the mosque.' - an Isfahan watch officer"
 nesnd_per_rising.10.a:0 "Every name on that roll answers for it."
 nesnd_per_rising.10.a.tt:0 "#r 20%#! of Western Regions Han-Qiang become radical; Old Tang Grievance falls to #v 40#!"
 nesnd_per_rising.10.b:0 "All they want is a tablet for their ancestors. Let them have it."
 nesnd_per_rising.10.b.tt:0 "Old Tang Grievance falls to #v 50#!"
 nesnd_per_rising.20.t:0 "Shame Avenged"
 nesnd_per_rising.20.d:0 "The Shah's army has entered the cities of Western Qin. For two centuries the Persian chronicles were filled with the hoofbeats of the Qin marching west. From today, another hand holds the pen."
 nesnd_per_rising.20.f:0 "'The Persians know the road the Qin came by.' - the Shah's proclamation of the northern campaign"
 nesnd_per_rising.20.a:0 "Two hundred years of debts, settled today."
 nesnd_per_rising.21.t:0 "The Rivers and the Gulf"
 nesnd_per_rising.21.d:0 "From Mosul to Laristan, the lands of the two rivers and the Gulf have passed into the Shah's realm. No one can yet say what lies beneath them, but the trade roads and ports above ground are enough to feed a new army."
 nesnd_per_rising.21.f:0 "'Wherever the sea wind reaches, so does the Shah's banner.' - a Basra shipowner"
 nesnd_per_rising.21.a:0 "The west is settled."
 nesnd_per_shah_invalid_tt:0 "Iranians no longer rule this country"
 nesnd_per_shah_invalid_conclusion:0 "The Shah's court is gone."
 nesnd_per_shah_court_journal:0 "The Shah's New Court"
 nesnd_per_shah_court_journal_reason:0 "The Tang of the old court are still here: some command troops, some hold office, some simply keep their ancestral homes. Should the new court send them east, banish them, let them stay under new names, or simply keep them in honour?\n\nEach choice will win someone's praise and someone's grudge."
 nesnd_per_court_status_many:0 "Many Tang of the old regime remain at the Shah's court."
 nesnd_per_court_status_none:0 ""
 nesnd_per_court_done_tt:0 "No Tang characters remain, or the old nobility has been kept in honour"
 nesnd_per_court_done_conclusion:0 "The Tang of the old court have each found their place."
 nesnd_per_court_expel_button:0 "Send Them East"
 nesnd_per_court_expel_button_desc:0 "Send them back to Western Qin and let Ili deal with them."
 nesnd_per_court_exile_button:0 "Banish Them"
 nesnd_per_court_exile_button_desc:0 "The world is wide. They may go anywhere but here."
 nesnd_per_court_naturalize_button:0 "Naturalise and Retain"
 nesnd_per_court_naturalize_button_desc:0 "Take Persian names, join the Shia, and keep their posts."
 nesnd_per_court_tolerate_button:0 "Keep the Old Nobility"
 nesnd_per_court_tolerate_button_desc:0 "The men of the old regime keep their places. The new court needs their swords, and their pens."
 nesnd_per_court_qin_tt:0 "Western Qin still exists"
 nesnd_per_court_cooldown_tt:0 "#v 3#! months have passed since the last measure"
 nesnd_per_court_tang_tt:0 "Tang characters remain in the country"
 nesnd_per_court_expel_tt:0 "Up to #v 3#! Tang characters are sent to Western Qin."
 nesnd_per_court_exile_tt:0 "Up to #v 3#! Tang characters are banished."
 nesnd_per_court_naturalize_tt:0 "Up to #v 3#! Tang characters become Persian and Shia."
 nesnd_per_court_tolerate_tt:0 "All remaining Tang characters stay in office and the matter is closed; '$nesnd_per_old_tang_journal$' begins."
 nesnd_per_old_tang_journal:0 "Old Tang Grievance"
 nesnd_per_old_tang_journal_reason:0 "The Tang of the old court stayed: officials still officials, soldiers still soldiers. But the tablets in the clan halls were never taken down and the names in the genealogies never changed; at every festival someone still bows to the east.\n\nIn another generation these feelings may fade. Until then, the new court must keep watch."
 nesnd_per_old_tang_status_high:0 "Strangers come and go at the Tang clan halls of late."
 nesnd_per_old_tang_status_low:0 "The old Tang families keep to themselves."
 nesnd_per_old_tang_done_tt:0 "#v 20#! years have passed since the old nobility was kept in honour"
 nesnd_per_old_tang_done_conclusion:0 "A generation has passed, and the old Tang longings have faded."
 nesnd_per_old_tang_bar_name:0 "Old Tang Grievance"
 nesnd_per_old_tang_bar_desc:0 "$nesnd_per_old_tang_bar_name$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_per_old_tang_src_base:0 "The nobility remembers the old court"
 nesnd_per_old_tang_src_many:0 "Many Tang remain"
 nesnd_per_old_tang_src_war_qin:0 "At war with Western Qin"
 nesnd_per_old_tang_src_revival:0 "The old Tang stir again"
 nesnd_per_old_tang_src_assimilating:0 "The Tang are assimilating"
 nesnd_per_old_tang_src_revenge:0 "Shame avenged"
 nesnd_per_old_tang_soothe_button:0 "Placate the Old Nobility"
 nesnd_per_old_tang_soothe_button_desc:0 "Grants of land and title, and dignified posts for a few old generals."
 nesnd_per_old_tang_soothe_tt:0 "Old Tang Grievance #v -15#!"
 nesnd_per_old_tang_cooldown_tt:0 "#v 2#! years have passed since the last placation"
 nesnd_per_old_tang_money_tt:0 "Treasury holds at least the cost (#v 1%#! of GDP)"
 nesnd_per_shah_road_journal:0 "The Shah's Road"
 nesnd_per_shah_road_journal_reason:0 "The new court has found its footing, and the Shah's councillors argue over the road ahead. Some would march north to settle two centuries of accounts with Western Qin. Others would march west and take the two rivers and the Gulf.\n\nOnly one road can be taken."
 nesnd_per_road_status_north:0 "The Shah's banner points north."
 nesnd_per_road_status_west:0 "The Shah's banner points west."
 nesnd_per_road_status_none:0 ""
 nesnd_per_road_north_done_tt:0 "Take the target region of the northern campaign"
 nesnd_per_road_west_done_tt:0 "Own all of Khuzestan, Fars, Laristan, Basra, Baghdad and Mosul"
 nesnd_per_road_north_conclusion:0 "The northern campaign has succeeded, and the old shame is avenged."
 nesnd_per_road_west_conclusion:0 "The two rivers and the Gulf belong to the Shah."
 nesnd_per_road_north_button:0 "March North"
 nesnd_per_road_north_button_desc:0 "The Qin came west two centuries ago. Now the Persians march north."
 nesnd_per_road_west_button:0 "March West"
 nesnd_per_road_west_button_desc:0 "The two rivers and the Gulf were Persian land before."
 nesnd_per_road_north_target_tt:0 "Western Qin has a state bordering this country"
 nesnd_per_road_cooldown_tt:0 "#v 5#! years have passed since the last northern campaign"
 nesnd_per_road_west_target_tt:0 "Other countries still hold states in the two rivers and the Gulf"
 nesnd_per_road_north_tt:0 "Claim the most populous Western Qin state bordering this country and start a diplomatic play over it. Taking the region completes the road: '$nesnd_per_revenge$' for 10 years, and Western Qin's unity suffers."
 nesnd_per_road_west_tt:0 "Claim the other countries' states in the six regions of the two rivers and the Gulf (the west is then chosen, and the northern campaign is no longer available). Owning all of them completes the road: '$nesnd_per_gulf_fields$' for 10 years. The clergy are displeased unless the state faith is Shia and a Sunni country is among the targets."
 nesnd_qe1_unity_persia_north_desc:0 "Persian Northern Campaign"
