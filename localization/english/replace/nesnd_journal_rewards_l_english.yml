l_english:
 nesnd_supply_open_routes:0 "$nesnd_supply_verified$"
 nesnd_supply_open_routes_desc:0 "Merchants know where to buy supplies and where to sell their goods."
 nesnd_jingnan_muster:0 "Supplies for the Jingnan Armies"
