 nesnd_southern_local_offices:0 "Local Schools and Revenue Offices"
 nesnd_southern_local_offices_desc:0 "Local officials can collect taxes more effectively, and more families can send their children to school."
 nesnd_phi_naval_supply:0 "Naval Procurement"
 nesnd_phi_naval_supply_desc:0 "Luzon's navy has regular suppliers, reducing the cost of goods needed to maintain its fleet."
 nesnd_mug_provincial_schools:0 "$nesnd_india_school_service$"
 nesnd_mug_provincial_schools_desc:0 "More people in the provinces can attend school and gain the qualifications they need to take up skilled work."
