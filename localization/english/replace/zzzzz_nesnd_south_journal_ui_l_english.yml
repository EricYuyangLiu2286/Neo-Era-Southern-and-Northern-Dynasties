l_english:
 nesnd_south_unsettled_tt:0 "The southern political crisis has not yet been settled."
 nesnd_south_qin_departed_tt:0 "Zheng Qin has died or left the country, or the crisis has reached #v 1839#!."
 nesnd_south_conflicts_failure_tt:0 "Either condition is met:\nThis country owns fewer than #v 2#! [Concept('concept_state','States')];\nor each of Sichuan, Hunan, the Philippines, the Nanyang United Provinces and Yuannan has ceased to exist or ceased to be our direct [concept_subject]."
 nesnd_south_settled_tt:0 "The southern political crisis has been settled."
 nesnd_south_wu_established_tt:0 "The Wu dynasty has been established."
 nesnd_south_monarchy_ended_tt:0 "This country has abolished #v monarchy#!."
 nesnd_south_pressure_bar_desc:0 "Succession Pressure: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!  #tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_pressure_detail_tt Changes#!#!"
 nesnd_south_compact_bar_desc:0 "Commitments: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_compact_detail_tt Settlement requirements#!#!"
 nesnd_south_pressure_detail_tt:0 "#bold Succession Pressure#!: #v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\nMonthly change: #v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!. Pressure rises by #n +3#! each month, or #n +2.5#! under the Constitutional Settlement. Active reconciliation reduces it by #p 3#!.\n\n#bold The First Minister's Case#!\nFrom #v July 1837#!, the case may begin when pressure exceeds #v 24#!. From the beginning of #v 1838#!, an unresolved case involving Chen Dongyang, if he remains in the country, leads to the assassination and protection events. His death adds #n +25#! pressure, injury #n +10#!, and escape #n +3#!.\n\nAfter the case is resolved, #v 70#! pressure permits an early accession. At #v 100#!, succession proceeds if Zheng Qin has departed. From the beginning of #v 1839#!, an unresolved dynastic dispute rises to #v 100#! once the First Minister's case has concluded. Succession and the other states' responses then proceed whether or not Zheng Qin is still alive. A peaceful settlement ends the dispute."
 nesnd_south_compact_detail_tt:0 "#bold Support for the settlement#!\nMainland, overseas and Japanese governments account for #v 50%, 30% and 20%#! respectively. Commitments last #v 36 months#! and cease to count after a change of alignment or overlord, war against the centre, or withdrawal.\n\n#bold A peaceful constitutional settlement#!\nThe chosen side needs political support of #v 85#! and a lead of #v 20#!, sustained for #v 12 months#!. Ming needs #v 75%#! commitment support and at least two mainland core governments. Wu needs #v 80%#!, consent from every government due for integration and the Japanese territorial parties, and a sufficiently prepared fleet. A completed settlement ends the dispute."
 nesnd_south_rules:0 "$nesnd_south_pressure_detail_tt$\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_status_succession:0 "The Southern Administration presses for a new dynasty, while the Ming court and provinces defend their positions.\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules The court dispute#!#!"
