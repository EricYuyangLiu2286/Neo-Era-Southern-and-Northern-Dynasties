l_english:
 nesnd_sha_snow_republic:0 "Dream of the Snow Country"
 nesnd_sha_snow_republic_reason:0 "When the king of Qi took Kamchatka as an overseas possession, he can hardly have imagined his nobles seeking refuge in that wilderness of snow and ice after 1711. In 1712–13 the defeated Guoren republicans crossed the sea as well. Former ruler and subjects fought again on a foreign shore. Once again it was the republic that survived.\n\nBacking from Wu, and later from the Ming Federation, allowed Denglai’s ships to range far afield. In the forests its people felled timber, grazed their herds and hunted. At sea they fished and took whales. The shipowners had another profitable trade. They sold Jurchen and Mongol captives to Dongzhou’s agricultural settlements. Some invested the proceeds in the settlements themselves. Others used the silver to smuggle arms from Western Qin. For the right price, a merchant would even run arms out of enemy territory in Eastern Yan. This northern trade endured for generations. Then Mu Zhongtang betrayed the revolution, the Shanxi Republic fell, and time and again the cries of fugitives reached the shore from outside the harbour.\n\nAs the exiles grew in number, the fragile economy of the snow country began to buckle. Officials and merchants hurried to lay in provisions, yet the bitter north wind still claimed many lives. Today the Old World’s only modern republic must answer the hopes of exiles who have come here from every quarter. After winter upon winter, their most fervent wish is to see their families live until spring."
