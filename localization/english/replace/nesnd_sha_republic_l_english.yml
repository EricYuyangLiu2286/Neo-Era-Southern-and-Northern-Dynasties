 nesnd_sha_republic.1.t:0 "A Choice in the Snow"
 nesnd_sha_republic.1.d:0 "On the day the deputies debated sending Denglai to war, a single old Fujian junk remained at the wharf. Her cramped hold carried the next-to-last shipment of staple grain due before the White Sea froze over for the year.\n\nThe advocates of rearmament pointed to Irkutsk on the map. Liaodong exiles lived there too. If one day they rose of their own accord and Denglai could not muster so much as a battalion to meet them, how did anyone propose to cross the sea and take Shandong?\n\nThe merchants were more direct. They did not even come in person. They sent the Assembly of Rites a ledger filled with what it would cost to feed, clothe and supply the government that winter. On the last page they had added a reckoning of the ships and cargo swallowed by the waves in the past five years. They were no southern weaklings, corrupt gentry or swindlers. They too were Han men born and bred in the far north, with blood debts deeper than the sea and higher than the mountains. They were ready to lead men into the blizzard-racked forests to open mines, to cross the ice-strewn White Sea to see their friends in Dongzhou, even to stake their fortunes and their lives on the republican cause of returning west and crossing south. But they could not pledge the money and provisions for two national undertakings at once. They had neither the means nor the right to do so."
 nesnd_sha_republic.1.a:0 "Raise the army. Shandong can follow."
 nesnd_sha_republic.1.b:0 "Open trade and seek allies."
 nesnd_sha_republic.2.t:0 "The King of Qi’s Men"
 nesnd_sha_republic.2.d:0 "The king of Qi died on the gallows a century ago. His likeness endures in stone, and the titles he granted have travelled farther than he ever did. Descendants of the old Qi nobility petition to have their ancestral honours entered on the parliamentary roll. The clerk stops writing and looks up. A few petitioners still wear sable and gold. Most are scarcely distinguishable from their neighbours after so many years of republican rule. One deputy remembers queuing in the snow beside a petitioner for a ration of fish. Until the man began haranguing the assembly today, he had no idea he had stood in line with a marquis."
 nesnd_sha_republic.2.a:0 "Every deputy shall be addressed as a deputy."
 nesnd_sha_republic.2.b:0 "Let the families keep their old styles."
 nesnd_sha_republic.3.t:0 "Accounts of the Northern Trade"
 nesnd_sha_republic.3.d:0 "Representatives of the Jurchen clans have brought a ledger into the assembly. A dark stain covers much of its leather binding. Inside, the clerk recorded every captive sold, the agricultural settlement in Dongzhou that received each shipment, and the silver paid by the buyers, down to the last fraction. The petitioners ask that the names of both buyers and sellers be published. Deputies call for the ledger to be seized and the petitioners silenced. One deputy who made his money in shipping will not even look at the ledger. He summons the doorkeeper and demands the name of the man who let these Jurchens in."
 nesnd_sha_republic.3.a:0 "Open the accounts and hear their testimony."
 nesnd_sha_republic.3.b:0 "Jurchen slave rebels! Arrest them and send them into exile in Xiling!"
 nesnd_sha_republic.4.t:0 "A Seat for the Yakuts"
 nesnd_sha_republic.4.d:0 "As the assembly sets the taxes for Yakut country, many deputies see the petitioners in person for the first time. In previous years they received a tally of pelts and heard nothing from the people who paid. This time the interpreter states the request plainly. When local taxes come before the assembly, the Yakuts want a representative of their own choosing in the chamber. The word brings laughter from the benches. It dies away as the interpreter reads how many pelts each household had to sell to pay its assessment in a bad year. Some deputies still insist on having the visitors thrown out."
 nesnd_sha_republic.4.a:0 "Support a representative of their choosing."
 nesnd_sha_republic.4.b:0 "You have some nerve, barbarian, standing there before your betters!"
 nesnd_sha_republic.5.t:0 "Before the Paper Goes to Press"
 nesnd_sha_republic.5.d:0 "Half a page stands empty at the printing office. The censor has held an article for days. It reports ominous talk in the ranks. Anyone who has seen a republican army defeated knows that a proclamation can pass through the barracks in a night. An inquiry into who circulated it can implicate half a newspaper’s staff. The officers want this issue withheld. The editor calls at the government office every day. He endured press seizures on the mainland. This time he wants the government’s signature on the order."
 nesnd_sha_republic.5.a:0 "Return the manuscript and permit publication."
 nesnd_sha_republic.5.b:0 "Refer the article to the censor for further examination."
 nesnd_sha_republic.6.t:0 "The Question of Sakhalin"
 nesnd_sha_republic.6.d:0 "The envoy from $CNE$ has sent a courteous note. He asks only that the assembly agree to discuss Sakhalin the next time the two governments meet. The officers on the island remember the retreat that brought the previous generation from Lake Baikal to the sea. They read the note twice. Every word is familiar, yet the few words asking to discuss the matter weigh more than all the rest."
 nesnd_sha_republic.6.a:0 "Agree to an exchange of notes."
 nesnd_sha_republic.6.b:0 "If they mean to take Sakhalin, they will have to step over our bodies."
 nesnd_sha_republic.7.t:0 "Another Ship of Exiles"
 nesnd_sha_republic.7.d:0 "A sodden sheaf of names came ashore before the passengers. The northern republican army had been defeated. Families from North and Northwest China had followed the old sea passage to Denglai. People on the quay searched the lists for a familiar surname or held a spare coat above the crowd. A few shouts across the water were enough. Each shore could still understand the other."
 nesnd_sha_republic.7.a:0 "Grant residence and enter their names."
 nesnd_sha_republic.8.t:0 "Where the Government Shall Sit"
 nesnd_sha_republic.8.d:0 "The port of Vladivostok stands ready to receive the central seat of our glorious National Assembly. The deputies from Kamchatka know what their vote entails. The archives must go aboard ship, and the Han families of Kamchatka and Okhotsk will move south with them. Men must also stay in the north to keep watch over islands and frozen ground that have cost so much blood and so many tears. Perhaps they will keep that watch until the end of the world."
 nesnd_sha_republic.8.a:0 "Move to Vladivostok and keep troops in the far north against any eventuality."
 nesnd_sha_republic.8.b:0 "Why not keep a ceremonial capital here? Let the law preserve our memory."
 nesnd_sha_republic.9.t:0 "Denglai and Huaxia"
 nesnd_sha_republic.9.d_republic:0 "The defeated republicans who sailed from Qi had to fight the king’s men once more in Kamchatka before they could hold a piece of ground of their own. Later, when Mu Zhongtang took the throne and the Shanxi Republic fell, other defeated soldiers and fugitives crossed from the mainland. They had different reasons for taking ship. They all knew of one place in the far north where republicans could still raise their flag.\n\nNow [ROOT.GetCountry.GetName] has united Huaxia. For some families of Shandong descent, the way home is open at last. In Kamchatka there are also families who have farmed the settlements for generations and have never seen Shandong. Their forebears fed soldiers who came across the sea in defeat and buried those who did not survive the winter. When the republic writes its history, the first volume ought to begin in the country those families held."
 nesnd_sha_republic.9.d:0 "Denglai has united Huaxia under the name of [ROOT.GetCountry.GetName]. When the news reaches the far north, some elders whose families came from Shandong weep at the thought of going home. Will those who write the history of this state be able to preserve the whole account of why the exiles crossed the sea, and why the flag they raised in Kamchatka was a republican one?"
 nesnd_sha_republic.9.a:0 "Enter the account of our founding in the national history."
 nesnd_sha_exiles_arrived_tt:0 "#v [SCOPE.GetValue('nesnd_sha_exile_count')|0]#! North Chinese and Northwest exiles have arrived in the capital."
 nesnd_sha_presidential_mandate:0 "The Duke of Zhou’s Electoral Standing"
 nesnd_sha_republic.1.f:0 "“Last night I told my boy that once the sea route was open, I’d take him home to Shandong. He was so pleased he hardly slept. This morning he ran after me as I was leaving. ‘Papa, do they have blizzards in Shandong? Should we buy more whale blubber this year?’” — Liang Bingzhou, deputy for Denglai"
 nesnd_sha_republic.2.f:0 "“The king of Qi granted my family its title before this assembly owned a table, sir.” “Quite so. But it is at this table that your name must be entered today.”"
 nesnd_sha_republic.3.f:0 "“Lose one fish and it goes down in the books. Miss a single nail in the workshop and you get a beating. How is it that when I turn to the page where you sold my family, all I find is a number?” — A Jurchen petitioner"
 nesnd_sha_republic.4.f:0 "“I went from house to house collecting those pelts last year. Turn to the last page of the tax roll. You’ll find my name. When you set this year’s levy, I want to sit here and hear how you arrive at the figure.” — A Yakut delegate"
 nesnd_sha_republic.5.f:0 "“If you are withholding the article, sign the order. When someone asks who suppressed a report from the army, the newspaper would like to have a name to show them.” — The editor to the censor"
 nesnd_sha_republic.6.f:0 "“If you wish to discuss our two countries’ shipping at Sakhalin, I can take your note. If you wish to discuss sovereignty over the island, put that claim in writing under the name of your government.” — The republic’s delegate at the northern talks"
 nesnd_sha_republic.7.f:0 "“Mother, you said we would be home when we reached the shore. Why are the people on the shore asking the way home too?”"
 nesnd_sha_republic.8.f:0 "“If the assembly votes to move, I’ll have the Kamchatka garrison on parade at the quay to see you off. Once the ship clears the harbour, look north. You’ll still be able to see our colours flying on shore.” — An officer of the northern garrison"
 nesnd_sha_republic.9.f:0 "“After the exiles left their country, the old people taught their children to recognise the streams and hills of their villages, for fear the names would be forgotten. Now let the children of Shandong learn to say Kamchatka on the very first page of their history.”"
