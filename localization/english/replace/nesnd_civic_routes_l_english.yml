 nesnd_c2_hus_agenda: "Land and People of the Republic"
 nesnd_c2_usm_agenda: "Livelihoods Under the Constitution"
 nesnd_c2_italy_agenda_reason:0 "France shields the Lombard Republic, yet each Italian state still pays for its own army, schools and officials. Whether they seek unification or lasting cooperation, the Italians must first agree on where the money for common undertakings comes from and who spends it.\n\nThis [concept_journal_entry] ends if the country loses its Italian primary cultures or all its inhabited states in Italy."
 nesnd_c2_hus_agenda_reason: "$nesnd_hus_registration_reason$"
 nesnd_c2_hus_frontier_choose:0 "First choose one of three courses: pasture routes, land purchase or garrisons."
 nesnd_c2_hus_citizenship_choose:0 "Choose one course: fund workers' education, or open the public works accounts."
 nesnd_c2_hus_oil_choose:0 "Choose how oil should benefit the locality: concessions, local royalties or public oversight."
 nesnd_c2_hus_frontier_no_target:0 "No state in our country currently has Mongol residents, leaving no eligible location for these pasture arrangements."
 nesnd_c2_hus_project_no_target:0 "Our country currently has no populated state eligible to receive this funding."
 nesnd_c2_hus_project_target_wait:0 "The original location can no longer host the work. A new plan can be chosen when the current funding period ends."
 nesnd_c2_hus_project_reselect:0 "The original location can no longer host the work. Choose a new plan and location."
 nesnd_c2_hus_project_operating:0 "The chosen plan meets its operating requirements. Sustain them for three consecutive months to complete the work. Any interruption restarts the count."
 nesnd_c2_hus_frontier_build:0 "An arrangement has been chosen. Bring the selected state’s railway, mines and logging camps, or garrison up to the chosen plan’s operating requirements. Maintain market access and government support."
 nesnd_c2_hus_citizenship_build:0 "Funding has been committed. Bring the selected state’s education or administration into operation as required by the chosen plan. Maintain market access and government support."
 nesnd_c2_hus_oil_build:0 "An oil policy has been chosen. Expand profitable, adequately staffed oil wells in the selected state. Maintain market access and government support."
 nesnd_c2_usm_agenda_reason: "The cabinet and Six Ministries propose new measures, the Assembly of Rites debates the Constitution, provincial administrators run finance and government, and provincial delegates speak for their provinces in national affairs. Academy students learn their trades while preparing for the Assembly's examinations. The more schools and industries open, the louder the quarrel over who may enter office and who must pay."
 nesnd_c2_italian_propose_lom: "Negotiate Schools and Revenue with $LOM$"
 nesnd_c2_italian_propose_sar: "Negotiate Schools and Revenue with $SAR$"
 nesnd_c2_italian_propose_sic: "Negotiate Schools and Revenue with $SIC$"
 nesnd_c2_italian_propose_pap: "Negotiate Schools and Revenue with $PAP$"
 nesnd_c2_italian_propose_par: "Negotiate Schools and Revenue with $PAR$"
 nesnd_c2_italian_propose_mod: "Negotiate Schools and Revenue with $MOD$"
 nesnd_c2_italian_propose_tus: "Negotiate Schools and Revenue with $TUS$"
 nesnd_c2_compact_expense: "Italian Accord Expenditure"
 nesnd_c2_italian_propose_desc: "Each state funds twelve months of expenditure and maintains services in its own schools, administration or military establishments. The other state decides whether to accept. Three months of mutual fulfilment establish an accord. An unanswered proposal lapses after ninety days. Talks may resume after twelve months."
 nesnd_civic_routes.10.t: "Schools, Military Revenue and the States"
 nesnd_civic_routes.10.d: "A neighbouring state proposes that we share the burden of public works. Schools, local taxes and army costs would no longer be fine words in speeches about unity: each country would pay from its own treasury and get the work done on its own soil. The proposal leaves both governments and both territories untouched."
 nesnd_civic_routes.10.a: "Each pays its share, and what we agreed gets done."
 nesnd_civic_routes.10.b: "Schools and local services come first."
 nesnd_civic_routes.10.c: "We will not sign up to this bill."
 nesnd_civic_routes.11.t: "Conditions from the Local Government"
 nesnd_civic_routes.11.d:0 "The other side will cooperate, on condition that the money goes to schools and local services rather than military supply. If we agree, both countries fund these undertakings, each running the services within its own borders."
 nesnd_civic_routes.11.a: "Schools first, then. So be it."
 nesnd_civic_routes.12.t: "The Talks End"
 nesnd_civic_routes.12.d: "The states could not agree on this term's public obligations. Schools, taxes and army costs remain each state's own business."
 nesnd_civic_routes.12.a: "Proceed separately for now."
 nesnd_civic_routes.13.t: "The States Fulfil Their Accord"
 nesnd_civic_routes.13.d:0 "Both countries have kept their word, each finding the money and the people for its schools, administration or military supply. Having made cooperation work once, the next round of talks should come easier."
 nesnd_civic_routes.13.a: "Carry on as we have begun."
 nesnd_c2_italy_direction_french_republic: "French-Supported Republican Integration"
 nesnd_c2_italy_direction_french_republic_desc:0 "Use French support, republican institutions, public works and negotiations among the states to advance Italian integration."
 nesnd_c2_italy_direction_autonomous_concord: "Autonomous Cooperation"
 nesnd_c2_italy_direction_autonomous_concord_desc:0 "Let the Italian states finance and negotiate cooperation themselves, reducing dependence on French support."
 nesnd_c2_italy_direction_southern_monarchy: "Southern Monarchical Integration"
 nesnd_c2_italy_direction_southern_monarchy_desc:0 "Support cooperation under a southern dynasty, bringing local finances and military arrangements into negotiations among the states."
 nesnd_c2_italy_direction_plural_compact: "Papal and Interstate Cooperation"
 nesnd_c2_italy_direction_plural_compact_desc:0 "Support lasting cooperation in education, church affairs and finance while preserving the governments of the individual states."
 nesnd_c2_usm_paused: "Constitutional deliberation is suspended while the Ming–Wu conflict continues."
 nesnd_c2_usm_west_open: "Western provincial integration remains underway; local works concern current territory."
 nesnd_c2_usm_west_success: "Western provincial integration has succeeded; revenue and military expenditure remain disputed."
 nesnd_c2_usm_west_fail: "Western provincial integration has failed. The schools and industries we already run will be kept going."
 nesnd_c2_usm_truce: "The parties to the truce govern their respective territories."
