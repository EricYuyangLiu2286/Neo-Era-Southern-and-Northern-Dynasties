 nesnd_civic_routes.30.t: "Debt Bonds Lose Their Former Power"
 nesnd_civic_routes.30.d: "Current law has ended slavery and provides protection for assembly or speech. Debt bonds no longer govern a life in their former fashion, while education, occupations and social standing remain disputed. The consequences of the registration order do not disappear automatically."
 nesnd_civic_routes.30.a: "Freedom still needs a foothold."
 nesnd_c2_scholarly_exchange: "Exchange Scholars with Independent Sichuan"
 nesnd_c2_scholarly_exchange_desc: "Invite a Sichuan teacher to discussions of curricula and educational places. Independent Sichuan must consent. This changes neither borders nor the person’s home and grants no delegate’s qualification."
 nesnd_civic_routes.40.t: "A Scholarly Invitation from the Southern Court"
 nesnd_civic_routes.40.d: "The southern government asks Duan Jingchuan to discuss academy curricula and educational places. Sichuan is independent; this invitation requires its own decision. The teacher’s home and the affairs of local schools remain under this government."
 nesnd_civic_routes.40.a: "Allow a scholarly exchange."
 nesnd_civic_routes.40.b: "Keep the teacher at home."
 nesnd_civic_routes.41.t: "Correspondence Between Academies"
 nesnd_civic_routes.41.d: "Independent Sichuan has agreed to a scholarly exchange with the southern government. Curricula and educational places offer a basis for contact between their academies, while each state retains its own schools. Qualifications for the Assembly of Rites remain subject to its examinations and constitutional procedures."
 nesnd_civic_routes.41.a: "Maintain scholarly contact."
 nesnd_c2_italian_abandon: "End the Current Accord"
 nesnd_c2_italian_abandon_desc: "End the current mutual obligations without claiming fulfilment. The original twelve-month expenditure continues to its expiry; negotiations may resume after twelve months."
 nesnd_c2_productive_levels_tt: "For three consecutive months, operating levels in the selected state and production group must reach the total built levels at the start plus the required increase. Market access must be at least 80%. Only building levels with at least 75% employment and a positive weekly profit count; empty or loss-making levels do not."

