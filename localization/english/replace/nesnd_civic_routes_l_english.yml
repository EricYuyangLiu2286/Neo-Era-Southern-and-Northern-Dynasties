 nesnd_c2_compact_expense: "Italian Accord Expenditure"
 nesnd_c2_italian_propose_desc: "Each state funds twelve months of expenditure and maintains services in its own schools, administration or military establishments. The other state decides whether to accept. Three months of mutual fulfilment establish an accord. An unanswered proposal lapses after ninety days; talks may resume after twelve months."
 nesnd_civic_routes.10.t: "Schools, Military Revenue and the States"
 nesnd_civic_routes.10.d: "A neighbouring state proposes a shared public undertaking. Schools, local revenues and military expenses would become budgetary obligations for both governments. Each must fund services on its own territory. The proposal preserves both states and their borders; the decision is ours."
 nesnd_civic_routes.10.a: "Accept the mutual obligations."
 nesnd_civic_routes.10.b: "Ask for schools and local services first."
 nesnd_civic_routes.10.c: "Decline the proposal."
 nesnd_civic_routes.11.t: "Conditions from the Local Government"
 nesnd_civic_routes.11.d:0 "The other government is willing to cooperate but asks that schools and local services take priority over military supply. If we agree, both countries will fund these undertakings and maintain the services within their own borders."
 nesnd_civic_routes.11.a: "Accept the proposed priorities."
 nesnd_civic_routes.12.t: "The Talks End"
 nesnd_civic_routes.12.d: "The states have failed to settle the obligations of this undertaking. Each remains responsible for its schools, revenue and military expenditure; further talks must await another occasion."
 nesnd_civic_routes.12.a: "Proceed separately for now."
 nesnd_civic_routes.13.t: "The States Fulfil Their Accord"
 nesnd_civic_routes.13.d:0 "Both countries have fulfilled the agreement, funding and providing the promised educational, administrative or military services. Cooperation has created shared interests in the provinces and built trust for further negotiations."
 nesnd_civic_routes.13.a: "Let the accord take root."
 nesnd_c2_italy_direction_french_republic: "French-Supported Republican Integration"
 nesnd_c2_italy_direction_french_republic_desc:0 "Use French support, republican institutions, public works and negotiations among the states to advance Italian integration."
 nesnd_c2_italy_direction_autonomous_concord: "Autonomous Cooperation"
 nesnd_c2_italy_direction_autonomous_concord_desc:0 "Let the Italian states finance and negotiate cooperation themselves, reducing dependence on French support."
 nesnd_c2_italy_direction_southern_monarchy: "Southern Monarchical Integration"
 nesnd_c2_italy_direction_southern_monarchy_desc:0 "Support cooperation under a southern dynasty, bringing local finances and military arrangements into negotiations among the states."
 nesnd_c2_italy_direction_plural_compact: "Papal and Interstate Cooperation"
 nesnd_c2_italy_direction_plural_compact_desc:0 "Support lasting cooperation in education, church affairs and finance while preserving the governments of the individual states."
