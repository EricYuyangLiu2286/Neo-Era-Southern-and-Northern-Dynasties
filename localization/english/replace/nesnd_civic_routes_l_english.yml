 nesnd_c2_italy_agenda: "The Italian Common Undertaking"
 nesnd_c2_hus_agenda: "Land and People of the Republic"
 nesnd_c2_usm_agenda: "Livelihoods Under the Constitution"
 nesnd_c2_italy_agenda_reason:0 "France supports the Lombard Republic, but the Italian states still fund their own armies, schools and administrations. Whether they seek unification or lasting cooperation, they must agree on who will pay for shared undertakings and who will control the money."
 nesnd_c2_hus_agenda_reason: "Workshops, railways and trading houses continue to expand, while debt bonds, inherited privilege and pasture boundaries divide the republic’s freedoms. The government can choose contractors, schools and local distributions; the registration order remains a question for the existing laws and political struggle."
 nesnd_c2_usm_agenda_reason: "The cabinet and Six Ministries propose policy; the Assembly of Rites considers constitutional law. Provincial administrators execute fiscal administration, while provincial delegates represent their provinces. Academy students learn useful arts and prepare for the Assembly’s examinations. Expanding schools and industry sharpens the dispute over who may enter public life and who must pay."
