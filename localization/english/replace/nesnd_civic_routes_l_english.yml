 nesnd_c2_italy_foundations_public_works: "Public Military Works"
 nesnd_c2_italy_foundations_public_works_desc: "Back military works and provide construction assistance to domestic workshops."
 nesnd_c2_italy_foundations_public_works_politics: "Public Military Works: Support and Opposition"
 nesnd_c2_italy_foundations_commercial_credit: "Merchant Finance"
 nesnd_c2_italy_foundations_commercial_credit_desc: "Support merchant credit for workshops and direct public funds towards local industry."
 nesnd_c2_italy_foundations_commercial_credit_politics: "Merchant Finance: Support and Opposition"
 nesnd_c2_italy_foundations_local_partnerships: "Local School Partnerships"
 nesnd_c2_italy_foundations_local_partnerships_desc: "Support schools maintained with local contributors."
 nesnd_c2_italy_foundations_local_partnerships_politics: "Local School Partnerships: Support and Opposition"
 nesnd_c2_italy_foundations: "Workshops and the Italian States"
 nesnd_c2_italy_foundations_reason: "French support for the Lombard Republic gave the republican cause a foothold in Italy. Orders for workshops, credit for merchants and funds for schools must still be found within Italy. The army presses for military works, merchants seek dependable repayment, and local contributors want places for their children. The government’s spending will help determine whose needs take priority."
 nesnd_c2_italy_foundations_bar: "Stable Operation"
 nesnd_c2_italy_foundations_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_italy_foundations_expense: "Workshops and the Italian States Expenditure"
 nesnd_c2_italy_common_budget_fiscal_union: "Pool Tax Revenue"
 nesnd_c2_italy_common_budget_fiscal_union_desc: "Back pooled revenue and strengthen fiscal administration in the selected state."
 nesnd_c2_italy_common_budget_fiscal_union_politics: "Pool Tax Revenue: Support and Opposition"
 nesnd_c2_italy_common_budget_federal_councils: "Local Revenue and Schools"
 nesnd_c2_italy_common_budget_federal_councils_desc: "Support local education funding and give the case for retained revenue a basis in school services."
 nesnd_c2_italy_common_budget_federal_councils_politics: "Local Revenue and Schools: Support and Opposition"
 nesnd_c2_italy_common_budget_military_accounts: "Military Accounts and Veterans"
 nesnd_c2_italy_common_budget_military_accounts_desc: "Back public works for military expenditure and veterans, with assistance for local military construction."
 nesnd_c2_italy_common_budget_military_accounts_politics: "Military Accounts and Veterans: Support and Opposition"
 nesnd_c2_italy_common_budget: "A Common Budget"
 nesnd_c2_italy_common_budget_reason: "Building a common Italy means reckoning with the states’ existing military obligations and taxes. Industrial interests favour pooled resources; local traders want revenue kept for schools, and the army puts military accounts and veterans first. A common budget must reconcile these burdens, whether the states pursue unification or negotiate a lasting relationship among themselves."
 nesnd_c2_italy_common_budget_bar: "Stable Operation"
 nesnd_c2_italy_common_budget_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_italy_common_budget_expense: "A Common Budget Expenditure"
 nesnd_c2_hus_transport_chartered_contractors: "Chartered Contractors"
 nesnd_c2_hus_transport_chartered_contractors_desc: "Back chartered contractors with assistance for local construction."
 nesnd_c2_hus_transport_chartered_contractors_politics: "Chartered Contractors: Support and Opposition"
 nesnd_c2_hus_transport_open_tenders: "Open Tenders"
 nesnd_c2_hus_transport_open_tenders_desc: "Support open tenders and assist local transport infrastructure."
 nesnd_c2_hus_transport_open_tenders_politics: "Open Tenders: Support and Opposition"
 nesnd_c2_hus_transport_local_transport: "Local Transport Funds"
 nesnd_c2_hus_transport_local_transport_desc: "Support transport links serving rural communities and local trade."
 nesnd_c2_hus_transport_local_transport_politics: "Local Transport Funds: Support and Opposition"
 nesnd_c2_hus_transport: "Dongqing and the Continental Roads"
 nesnd_c2_hus_transport_reason: "The overseas trade associated with Dongqing depends on routes linking ports with inland timber, minerals and farm produce. Large contractors offer capital through concessions that would also deepen their hold on local trade. Smaller firms seek open tenders, while rural communities want connections to their own towns. The government must decide whose needs will shape the continental roads."
 nesnd_c2_hus_transport_bar: "Stable Operation"
 nesnd_c2_hus_transport_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_hus_transport_expense: "Dongqing and the Continental Roads Expenditure"
 nesnd_c2_hus_frontier_pasture_passage: "Protect Pasture Routes"
 nesnd_c2_hus_frontier_pasture_passage_desc: "Support passage for pastoral communities. Local infrastructure receives assistance, while construction bears the cost of accommodating pasture routes."
 nesnd_c2_hus_frontier_pasture_passage_politics: "Protect Pasture Routes: Support and Opposition"
 nesnd_c2_hus_frontier_land_compensation: "Compensated Development"
 nesnd_c2_hus_frontier_land_compensation_desc: "Support compensated development, improving local infrastructure while accepting slower construction."
 nesnd_c2_hus_frontier_land_compensation_politics: "Compensated Development: Support and Opposition"
 nesnd_c2_hus_frontier_frontier_garrisons: "Garrisons for Construction"
 nesnd_c2_hus_frontier_frontier_garrisons_desc: "Back the army’s proposal to support construction through frontier garrisons."
 nesnd_c2_hus_frontier_frontier_garrisons_politics: "Garrisons for Construction: Support and Opposition"
 nesnd_c2_hus_frontier: "Pastures and Passage"
 nesnd_c2_hus_frontier_reason: "Railways and mines are reaching into pasture used for seasonal migration. Herds need water and passage; developers need land, and the army wants secure communications. Pastoral communities seek protected routes, developers press for compensated development, and military advocates propose garrisons to support construction. Each course places a different burden on the people who live there."
 nesnd_c2_hus_frontier_bar: "Stable Operation"
 nesnd_c2_hus_frontier_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_hus_frontier_expense: "Pastures and Passage Expenditure"
 nesnd_c2_hus_citizenship_labour_schools: "Labour and Learning"
 nesnd_c2_hus_citizenship_labour_schools_desc: "Support education for workers and families bound by debt through school services in the selected state."
 nesnd_c2_hus_citizenship_labour_schools_politics: "Labour and Learning: Support and Opposition"
 nesnd_c2_hus_citizenship_public_accounts: "Publish Public Accounts"
 nesnd_c2_hus_citizenship_public_accounts_desc: "Back scrutiny of public works accounts and assist local fiscal administration."
 nesnd_c2_hus_citizenship_public_accounts_politics: "Publish Public Accounts: Support and Opposition"
 nesnd_c2_hus_citizenship: "People Beyond the Debt Bond"
 nesnd_c2_hus_citizenship_reason: "Families bound by debt bring old obligations and inherited rank with them into the workshops. Teachers and workers seek access to learning; local traders demand to know who benefits from public expenditure. Support for education and scrutiny of public accounts offer different ways into a dispute over freedom and standing that now reaches into everyday working life."
