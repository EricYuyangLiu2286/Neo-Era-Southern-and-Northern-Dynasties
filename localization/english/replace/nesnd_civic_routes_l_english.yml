 je_risorgimento_reason: "The Italian states have different governments, armies and foreign ties. The Lombard Republic endures with French support, while republican conviction, dynastic interests and local finances shape the road ahead. The states may pursue unification or lasting cooperation through public obligations."
 italian_unification.6.d: "Italian political mobilisation has changed local government. Established republics and newly organised republican forces seek cooperation, while military costs, revenue and representation remain matters for concrete negotiation."
 italian_unification.10.d: "Italy’s future is debated in schools, barracks and state governments. Support for unification need not entail hostility to France; protection cannot answer local questions of revenue and political standing."
