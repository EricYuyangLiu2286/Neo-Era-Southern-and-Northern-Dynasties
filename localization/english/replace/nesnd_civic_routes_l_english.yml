l_english:
 nesnd_c2_italy_foundations_public_works: "Public Military Works"
 nesnd_c2_italy_foundations_public_works_desc: "Get the army's supplies under way first, and the workshops will have orders enough."
 nesnd_c2_italy_foundations_public_works_politics: "Army First in Line for Contracts"
 nesnd_c2_italy_foundations_commercial_credit: "Merchant Finance"
 nesnd_c2_italy_foundations_commercial_credit_desc: "Let the merchants raise credit for the workshops. A mill opens only when someone can lend the money."
 nesnd_c2_italy_foundations_commercial_credit_politics: "Mill Owners Find Credit"
 nesnd_c2_italy_foundations_local_partnerships: "Local School Partnerships"
 nesnd_c2_italy_foundations_local_partnerships_desc: "Bring the townsfolk who pay into running the schools, and their own children will have a place to study."
 nesnd_c2_italy_foundations_local_partnerships_politics: "Townsfolk Fund the Schools"
 nesnd_c2_italy_foundations: "Workshops and the Italian States"
 nesnd_c2_italy_foundations_reason: "France's patronage of the Lombard Republic has given the republican cause in Italy something to lean on. But the orders for the workshops, the merchants' credit and the money for local schools must still be found by Italians themselves. The army wants military works first, the merchants want loans with a fixed term, and the townsfolk who fund the schools want a place for their own children."
 nesnd_c2_italy_foundations_bar: "Stable Operation"
 nesnd_c2_italy_foundations_bar_desc: "$nesnd_c2_italy_foundations_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_italy_foundations_expense: "Workshops and the Italian States Expenditure"
 nesnd_c2_italy_common_budget_fiscal_union: "Pool Tax Revenue"
 nesnd_c2_italy_common_budget_fiscal_union_desc: "Gather the taxes in one place, and common undertakings can finally be paid for."
 nesnd_c2_italy_common_budget_fiscal_union_politics: "Taxes Pooled at the Centre"
 nesnd_c2_italy_common_budget_federal_councils: "Local Revenue and Schools"
 nesnd_c2_italy_common_budget_federal_councils_desc: "Let each state keep its school money, and the schools will open on its own doorstep."
 nesnd_c2_italy_common_budget_federal_councils_politics: "States Keep Taxes for Schools"
 nesnd_c2_italy_common_budget_military_accounts: "Military Accounts and Veterans"
 nesnd_c2_italy_common_budget_military_accounts_desc: "Count army pay and the settlement of veterans among the public works as well."
 nesnd_c2_italy_common_budget_military_accounts_politics: "Army Pay Comes First"
 nesnd_c2_italy_common_budget: "A Common Budget"
 nesnd_c2_italy_common_budget_reason: "Before Italy can come together, someone must settle the accounts of each state's armies and taxes. The industrialists want resources pooled, local traders want to keep the money for schools, and the army puts military pay and veterans first. Whether the states bargain one by one or unite at a stroke, there is no way round the question of who controls the revenue."
 nesnd_c2_italy_common_budget_bar: "Stable Operation"
 nesnd_c2_italy_common_budget_bar_desc: "$nesnd_c2_italy_common_budget_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_italy_common_budget_expense: "A Common Budget Expenditure"
 nesnd_c2_hus_transport_chartered_contractors: "Chartered Contractors"
 nesnd_c2_hus_transport_chartered_contractors_desc: "Hand the ports and roads to the big contractors and build them with their capital."
 nesnd_c2_hus_transport_chartered_contractors_politics: "Big Contractors Take the Works"
 nesnd_c2_hus_transport_open_tenders: "Open Tenders"
 nesnd_c2_hus_transport_open_tenders_desc: "Put the works out to open tender, so the small firms get their share of the jobs."
 nesnd_c2_hus_transport_open_tenders_politics: "Small Firms Win Tenders"
 nesnd_c2_hus_transport_local_transport: "Local Transport Funds"
 nesnd_c2_hus_transport_local_transport_desc: "Run the branch lines out to the country market towns first."
 nesnd_c2_hus_transport_local_transport_politics: "Branch Lines to Market Towns First"
 nesnd_c2_hus_transport: "Dongqing and the Continental Roads"
 nesnd_c2_hus_transport_reason: "Dongqing trades across the ocean, and its ports must be linked to inland timber, ore and farm produce. The big contractors bring capital, but they bring concessions with it, and the districts they serve will come to depend on them. Smaller firms want open tenders, and the countryside wants branch lines run to its own market towns first."
 nesnd_c2_hus_transport_bar: "Stable Operation"
 nesnd_c2_hus_transport_bar_desc: "$nesnd_c2_hus_transport_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_transport_expense: "Dongqing and the Continental Roads Expenditure"
 nesnd_c2_hus_frontier_pasture_passage: "Protect Pasture Routes"
 nesnd_c2_hus_frontier_pasture_passage_desc: "Leave a path for the herds. The works must detour around the pasture routes and will go more slowly."
 nesnd_c2_hus_frontier_pasture_passage_politics: "Pasture Routes Kept Open"
 nesnd_c2_hus_frontier_land_compensation: "Compensated Development"
 nesnd_c2_hus_frontier_land_compensation_desc: "Pay a fair price for the land taken. The road will get built, but it will take longer."
 nesnd_c2_hus_frontier_land_compensation_politics: "Land Bought at a Fair Price"
 nesnd_c2_hus_frontier_frontier_garrisons: "Garrisons for Construction"
 nesnd_c2_hus_frontier_frontier_garrisons_desc: "Station troops along the works, and the road will get built."
 nesnd_c2_hus_frontier_frontier_garrisons_politics: "Garrisons Guard the Line"
 nesnd_c2_hus_frontier: "Pastures and Passage"
 nesnd_c2_hus_frontier_reason: "Railways and mines are pushing into the pastures. The blanks on the map are crossed by herds every year: the animals need water, the works need land, and the garrisons need secure roads. The herders want the routes left open, the developers press for land bought outright, and the army proposes troops to guard the works."
 nesnd_c2_hus_frontier_bar: "Stable Operation"
 nesnd_c2_hus_frontier_bar_desc: "$nesnd_c2_hus_frontier_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_frontier_expense: "Pastures and Passage Expenditure"
 nesnd_c2_hus_citizenship_labour_schools: "Labour and Learning"
 nesnd_c2_hus_citizenship_labour_schools_desc: "Put the children of debt-bound families, and the workers themselves, into school."
 nesnd_c2_hus_citizenship_labour_schools_politics: "Debtors' Children in School"
 nesnd_c2_hus_citizenship_public_accounts: "Publish Public Accounts"
 nesnd_c2_hus_citizenship_public_accounts_desc: "Lay out every coin spent on the public works for all to see."
 nesnd_c2_hus_citizenship_public_accounts_politics: "Works Accounts Made Public"
 nesnd_c2_hus_citizenship: "People Beyond the Debt Bond"
 nesnd_c2_hus_citizenship_reason: "The sons of debt-bound families have come into the workshops, and their old debts, their inherited rank and the dependence they cannot shake off have come in with them. Teachers and workers want a chance to learn; local traders want to know whose pockets the public works money went into. The argument over freedom and standing has landed in the schoolroom and the workshop."
 nesnd_c2_hus_citizenship_bar: "Stable Operation"
 nesnd_c2_hus_citizenship_bar_desc: "$nesnd_c2_hus_citizenship_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_citizenship_expense: "People Beyond the Debt Bond Expenditure"
 nesnd_c2_hus_oil_oil_concessions: "Oil Concessions"
 nesnd_c2_hus_oil_oil_concessions_desc: "Grant the drilling rights as concessions and let the companies sink new wells with their profits."
 nesnd_c2_hus_oil_oil_concessions_politics: "Concession Companies Expand"
 nesnd_c2_hus_oil_oil_royalties: "Local Oil Royalties"
 nesnd_c2_hus_oil_oil_royalties_desc: "Keep the oil revenue where the oil comes from, and spend it on roads and schools."
 nesnd_c2_hus_oil_oil_royalties_politics: "Oil Revenue Stays Local"
 nesnd_c2_hus_oil_oil_oversight: "Public Oil Oversight"
 nesnd_c2_hus_oil_oil_oversight_desc: "Let the workers' organisations watch over the wells, and put the local assistance into schools."
 nesnd_c2_hus_oil_oil_oversight_politics: "Unions Watch the Wells"
 nesnd_c2_hus_oil: "Oil Wells and Local Revenue"
 nesnd_c2_hus_oil_reason: "The wells have struck oil, and where the money goes has become local politics. The concession companies want to plough the profits into further expansion, the traders want the royalties kept for roads and schools, and the workers' organisations want the whole industry brought into the open under public oversight."
 nesnd_c2_hus_oil_bar: "Stable Operation"
 nesnd_c2_hus_oil_bar_desc: "$nesnd_c2_hus_oil_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_oil_expense: "Oil Wells and Local Revenue Expenditure"
 nesnd_c2_usm_constitution_classical_franchise: "Retain Classical Examinations"
 nesnd_c2_usm_constitution_classical_franchise_desc: "Classical learning is the foundation of office. That must not be touched."
 nesnd_c2_usm_constitution_classical_franchise_politics: "Classical Gentry Secured"
 nesnd_c2_usm_constitution_practical_franchise: "Admit Practical and Commercial Learning"
 nesnd_c2_usm_constitution_practical_franchise_desc: "A man who understands machines and can keep accounts deserves a road into office too."
 nesnd_c2_usm_constitution_practical_franchise_politics: "Practical Men Enter Office"
 nesnd_c2_usm_constitution_local_franchise: "Broaden Provincial Places"
 nesnd_c2_usm_constitution_local_franchise_desc: "Give the provinces more examination places, so their sons have a chance to rise."
 nesnd_c2_usm_constitution_local_franchise_politics: "More Provincial Places"
 nesnd_c2_usm_constitution: "The Constitution and Public Office"
 nesnd_c2_usm_constitution_reason: "At the doors of the Assembly of Rites stand scholars versed in the classics, and beside them newcomers who understand machinery, accounts and trade. The cabinet and Six Ministries want capable men from among them, and every province wants to know whether its own sons will be chosen. How much weight goes to classical qualifications, practical experience and provincial places decides who may enter public life under the Constitution, and puts the old gentry's standing in question."
 nesnd_c2_usm_constitution_bar: "Stable Operation"
 nesnd_c2_usm_constitution_bar_desc: "$nesnd_c2_usm_constitution_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_constitution_expense: "The Constitution and Public Office Expenditure"
 nesnd_c2_usm_schools_practical_schools: "Practical Curricula"
 nesnd_c2_usm_schools_practical_schools_desc: "Add practical courses to the academies, and the teachers' salaries will be found."
 nesnd_c2_usm_schools_practical_schools_politics: "Academies Teach Practical Learning"
 nesnd_c2_usm_schools_provincial_schools: "Provincial Places"
 nesnd_c2_usm_schools_provincial_schools_desc: "Give the provinces more school places, so the village youth have books to read."
 nesnd_c2_usm_schools_provincial_schools_politics: "More Places for Local Youth"
 nesnd_c2_usm_schools: "Academies and Provincial Delegates"
 nesnd_c2_usm_schools_reason: "The academy teachers lecture on the classics; their students want surveying, machinery and commercial learning. The students hope to learn something useful, and hope even more to qualify for the Assembly of Rites examinations. Provincial administrators have to find the money, and provincial delegates carry each province's demands for courses and places into national politics. Practical courses and provincial places are fighting over the same education budget."
 nesnd_c2_usm_schools_bar: "Stable Operation"
 nesnd_c2_usm_schools_bar_desc: "$nesnd_c2_usm_schools_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_schools_expense: "Academies and Provincial Delegates Expenditure"
 nesnd_c2_usm_industry_coastal_industry: "Coastal Workshops"
 nesnd_c2_usm_industry_coastal_industry_desc: "Put the money into the coastal works first. That is where the ports and shipping lanes are."
 nesnd_c2_usm_industry_coastal_industry_politics: "Coastal Mill Owners Ascendant"
 nesnd_c2_usm_industry_inland_industry: "Inland Industry"
 nesnd_c2_usm_industry_inland_industry_desc: "Industry cannot stop at the coast. The interior needs roads and works of its own."
 nesnd_c2_usm_industry_inland_industry_politics: "Inland Towns Get Investment"
 nesnd_c2_usm_industry: "Industry and Waterways"
 nesnd_c2_usm_industry_reason: "Coastal merchants set up their workshops along the ports and shipping lanes, and the inland towns hold out their hands for investment too. Machinery, labour and goods must move between provinces, yet each provincial administrator sees only his own province's taxes and building costs. Prosperity in memorials to the throne counts for nothing; only works that keep running show where the money went."
 nesnd_c2_usm_industry_bar: "Stable Operation"
 nesnd_c2_usm_industry_bar_desc: "$nesnd_c2_usm_industry_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_industry_expense: "Industry and Waterways Expenditure"
 nesnd_c2_usm_distribution_commercial_empire: "Concentrate Commercial Investment"
 nesnd_c2_usm_distribution_commercial_empire_desc: "Concentrate the investment where trade already thrives, and put the best steel to the sharpest edge."
 nesnd_c2_usm_distribution_commercial_empire_politics: "Trading Ports Take the Lion's Share"
 nesnd_c2_usm_distribution_provincial_balance: "Public Investment Across Provinces"
 nesnd_c2_usm_distribution_provincial_balance_desc: "Move public funds between provinces, so that even the poor ones can afford their works."
 nesnd_c2_usm_distribution_provincial_balance_politics: "Public Funds Shared Across Provinces"
 nesnd_c2_usm_distribution_scholars_franchise: "Broaden Delegate Qualifications"
 nesnd_c2_usm_distribution_scholars_franchise_desc: "Widen the qualifications for provincial delegates and let more scholars into the Assembly of Rites."
 nesnd_c2_usm_distribution_scholars_franchise_politics: "Delegate Qualifications Widened"
 nesnd_c2_usm_distribution: "Where the Revenue Goes"
 nesnd_c2_usm_distribution_reason: "New works and new shipping have brought in new revenue. It can be poured back into the thriving commercial centres, or shared among the provinces for public works. The cabinet and Six Ministries plan the spending; the provincial delegates in the Assembly of Rites must answer for what their provinces paid in and what they got back. The constitutional quarrel over shares now has a fresh pot of money to fight over."
 nesnd_c2_usm_distribution_bar: "Stable Operation"
 nesnd_c2_usm_distribution_bar_desc: "$nesnd_c2_usm_distribution_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_distribution_expense: "Where the Revenue Goes Expenditure"
 nesnd_civic_routes.1.t: "The Work Becomes Routine"
 nesnd_civic_routes.1.d: "The works have survived their first months and settled into everyday operation. The services and production that the money paid for are showing real results, and the long local argument over costs and returns finally has accounts to check."
 nesnd_civic_routes.1.a: "Let it endure."
