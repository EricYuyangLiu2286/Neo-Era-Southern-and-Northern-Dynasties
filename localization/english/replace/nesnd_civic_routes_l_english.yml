 nesnd_c2_usm_industry_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_usm_industry_expense: "Industry and Waterways Expenditure"
 nesnd_c2_usm_distribution_commercial_empire: "Concentrate Commercial Investment"
 nesnd_c2_usm_distribution_commercial_empire_desc: "Support concentrated commercial investment and assist industrial construction in the selected state."
 nesnd_c2_usm_distribution_commercial_empire_politics: "Concentrate Commercial Investment: Support and Opposition"
 nesnd_c2_usm_distribution_provincial_balance: "Public Investment Across Provinces"
 nesnd_c2_usm_distribution_provincial_balance_desc: "Back public investment across the provinces and assist fiscal administration in the selected state."
 nesnd_c2_usm_distribution_provincial_balance_politics: "Public Investment Across Provinces: Support and Opposition"
 nesnd_c2_usm_distribution_scholars_franchise: "Broaden Delegate Qualifications"
 nesnd_c2_usm_distribution_scholars_franchise_desc: "Back broader qualifications for provincial delegates through assistance to local education."
 nesnd_c2_usm_distribution_scholars_franchise_politics: "Broaden Delegate Qualifications: Support and Opposition"
 nesnd_c2_usm_distribution: "Where the Revenue Goes"
 nesnd_c2_usm_distribution_reason: "Revenue from industry and trade may return to prosperous commercial centres or support public works across the provinces. The cabinet and Six Ministries plan expenditure; delegates in the Assembly of Rites must answer for what their provinces contribute and receive. Commercial investment, provincial development and access to public office now contend over the gains of industrial growth."
