 nesnd_civic_routes.1.t: "The Work Becomes Routine"
 nesnd_civic_routes.1.d: "The programme has run in ordinary conditions for some time. The services or production supported by the expenditure now offer tangible results, giving local debate over costs and benefits something concrete to judge."
 nesnd_civic_routes.1.f: "“An account of how each grant was spent is appended to this report for the assembly's scrutiny.”\n- Annual report on public works"
 nesnd_civic_routes.1.a: "Let it endure."
 nesnd_c2_project_target_tt: "Selected project state: [STATE.GetName]"
 nesnd_c2_retarget: "Choose a New Site"
 nesnd_c2_retarget_desc: "After the present funding term, choose a state within the current borders. Paid costs are not refunded; the new site must be observed from the start."
