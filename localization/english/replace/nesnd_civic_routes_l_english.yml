 nesnd_civic_routes.30.national: "The law abolishing slavery has taken effect. A creditor may still bring an old bond before the authorities and sue for repayment. Debtors may leave his household and find work for their children elsewhere. The names entered beside sums of money in the old ledgers can no longer be awarded to him as property."
 nesnd_civic_routes.30.f: "“Read me the sum I owe you. And while the book is open, strike out my daughter’s name.”"
 nesnd_civic_routes.30.b: "Leave the local society to raise the teacher’s fee."
 nesnd_civic_routes.30.c: "Apply the new law to debt claims."
 nesnd_civic_routes.40.f: "“We can set a lectern in the east hall. If your academy will spare a teacher for us, we will send one of ours to teach in Sichuan.”"
 nesnd_civic_routes.41.f: "“Pack your books. Your hosts will provide a room and a lectern.”"

