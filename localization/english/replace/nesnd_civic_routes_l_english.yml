 nesnd_c2_italy_agenda: "The Italian Common Purse"
 nesnd_c2_hus_agenda: "Land and People of the Republic"
 nesnd_c2_usm_agenda: "Living Under the Rites"
 nesnd_c2_italy_agenda_reason:0 "France supports the Lombard Republic, but the Italian states still fund their own armies, schools and administrations. Whether they seek unification or lasting cooperation, they must agree on who will pay into a common purse and who will control the money.\n\nThis [concept_journal_entry] ends if the country loses its Italian primary cultures or all its inhabited states in Italy."
 nesnd_c2_hus_agenda_reason: "$nesnd_hus_registration_reason$"
 nesnd_c2_hus_frontier_choose:0 "Choose a plan for pasture routes, compensated development or frontier garrisons."
 nesnd_c2_hus_citizenship_choose:0 "Choose whether to fund workers’ education or open public accounts to scrutiny."
 nesnd_c2_hus_oil_choose:0 "Choose how oil should benefit the locality: concessions, local royalties or public oversight."
 nesnd_c2_hus_frontier_no_target:0 "None of our states currently has Mongol residents, so there is nowhere to apply a pasture plan."
 nesnd_c2_hus_project_no_target:0 "We currently have no populated state that can receive this funding."
 nesnd_c2_hus_project_target_wait:0 "The original location can no longer host the work. A new plan can be chosen when the current funding period ends."
 nesnd_c2_hus_project_reselect:0 "The original location can no longer host the work. Choose a new plan and location."
 nesnd_c2_hus_project_operating:0 "The chosen plan meets its operating requirements. Keep them up for three consecutive months to complete the work. Any interruption restarts the count."
 nesnd_c2_hus_frontier_build:0 "A plan has been chosen. Bring the selected state’s railway, mines and logging camps, or garrison up to the chosen plan’s operating requirements. Maintain market access and government support."
 nesnd_c2_hus_citizenship_build:0 "Funding has been committed. Bring the selected state’s education or administration into operation as required by the chosen plan. Maintain market access and government support."
 nesnd_c2_hus_oil_build:0 "An oil policy has been chosen. Expand profitable, adequately staffed oil wells in the selected state. Maintain market access and government support."
 nesnd_c2_usm_agenda_reason: "Provincial delegates must pass an examination before they can sit in the Assembly of Rites. The Assembly sets the qualifications. Provincial academies seek more places to nominate their own students. The delegates also deliberate on grants for education and industry. The treasury provides the money, but either the Six Ministries or the provincial administration may direct the spending."
 nesnd_c2_italian_propose_lom: "Negotiate Schools and Revenue with [SCOPE.sCountry('nesnd_label_lom').GetName]"
 nesnd_c2_italian_propose_sar: "Negotiate Schools and Revenue with [SCOPE.sCountry('nesnd_label_sar').GetName]"
 nesnd_c2_italian_propose_sic: "Negotiate Schools and Revenue with [SCOPE.sCountry('nesnd_label_sic').GetName]"
 nesnd_c2_italian_propose_pap: "Negotiate Schools and Revenue with [SCOPE.sCountry('nesnd_label_pap').GetName]"
 nesnd_c2_italian_propose_par: "Negotiate Schools and Revenue with [SCOPE.sCountry('nesnd_label_par').GetName]"
 nesnd_c2_italian_propose_mod: "Negotiate Schools and Revenue with [SCOPE.sCountry('nesnd_label_mod').GetName]"
 nesnd_c2_italian_propose_tus: "Negotiate Schools and Revenue with [SCOPE.sCountry('nesnd_label_tus').GetName]"
 nesnd_c2_compact_expense: "Italian Accord Expenditure"
 nesnd_c2_italian_propose_desc: "Each state funds twelve months of expenditure and maintains services in its own schools, administration or military establishments. The other state decides whether to accept. If both keep up the payments and services for three months, the cooperation counts as complete. An unanswered proposal lapses after ninety days. Talks may resume after twelve months."
 nesnd_civic_routes.10.t: "Schools, Military Revenue and the States"
 nesnd_civic_routes.10.d: "A neighbouring state proposes that we share the cost of public works. Schools, local revenues and military expenses would become budgetary obligations for both governments. Each must fund services on its own territory. The proposal preserves both states and their borders; the decision is ours."
 nesnd_civic_routes.10.f: "“Unity cannot be made with speeches alone. Schools, roads and soldiers all need someone to pay for them.”\n- A Turin newspaper"
 nesnd_civic_routes.10.a: "Accept the mutual obligations."
 nesnd_civic_routes.10.b: "Ask for schools and local services first."
 nesnd_civic_routes.10.c: "Decline the proposal."
 nesnd_civic_routes.11.t: "Conditions from the Local Government"
 nesnd_civic_routes.11.d:0 "[SCOPE.sCountry('c2_compact_partner').GetName] is willing to cooperate but asks that schools and local services take priority over military supply. If we agree, both countries will fund these services and maintain the services within their own borders."
 nesnd_civic_routes.11.f:0 "“This government is willing to cooperate, provided that your government agrees that our joint funds go first to schools and local services, and not to military supply.”\n- Reply from the partner government"
 nesnd_civic_routes.11.a: "Accept the proposed priorities."
 nesnd_civic_routes.12.t: "The Talks End"
 nesnd_civic_routes.12.d: "The states have failed to agree on this round of public spending. Each remains responsible for its schools, revenue and military expenditure; further talks must await another occasion."
 nesnd_civic_routes.12.f: "“The delegates of the states failed to agree on public expenditure for this term. Schools, taxes and military costs remain the responsibility of each state until the next meeting.”\n- Minutes of the conference of states"
 nesnd_civic_routes.12.a: "Proceed separately for now."
 nesnd_civic_routes.13.t: "The States Keep Their Word"
 nesnd_civic_routes.13.d:0 "Both countries have kept the agreement, funding and providing the promised educational, administrative or military services. Cooperation has created shared interests in the provinces and built trust for further negotiations."
 nesnd_civic_routes.13.f:0 "“Both states' payments for the year have been received. Schools and garrisons are operating as agreed.”\n- State treasury report"
 nesnd_civic_routes.13.a: "Let the accord take root."
 nesnd_c2_italy_direction_french_republic: "French-Supported Republican Integration"
 nesnd_c2_italy_direction_french_republic_desc:0 "Use French support, republican institutions, public works and negotiations among the states to advance Italian integration."
 nesnd_c2_italy_direction_autonomous_concord: "Autonomous Cooperation"
