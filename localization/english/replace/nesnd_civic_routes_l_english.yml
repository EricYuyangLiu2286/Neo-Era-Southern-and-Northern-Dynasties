 nesnd_c2_usm_constitution_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_usm_constitution_expense: "The Constitution and Public Office Expenditure"
 nesnd_c2_usm_schools_practical_schools: "Practical Curricula"
 nesnd_c2_usm_schools_practical_schools_desc: "Support practical curricula in the academies and assist their teaching."
 nesnd_c2_usm_schools_practical_schools_politics: "Practical Curricula: Support and Opposition"
 nesnd_c2_usm_schools_provincial_schools: "Provincial Places"
 nesnd_c2_usm_schools_provincial_schools_desc: "Support wider provincial access to learning through local school services."
 nesnd_c2_usm_schools_provincial_schools_politics: "Provincial Places: Support and Opposition"
 nesnd_c2_usm_schools: "Academies and Provincial Delegates"
 nesnd_c2_usm_schools_reason: "Academy teachers must make room for surveying, machinery and commercial learning alongside the classics. Students seek useful knowledge and a chance to qualify for the Assembly of Rites examinations. Provincial administrators must find the money; provincial delegates bring demands for curricula and places into national debate. Practical teaching and wider provincial access compete for the same education funds."
