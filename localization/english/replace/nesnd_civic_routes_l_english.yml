 nesnd_c2_italy_foundations_public_works: "Public Military Works"
 nesnd_c2_italy_foundations_public_works_desc: "Back military works and provide construction assistance to domestic workshops."
 nesnd_c2_italy_foundations_public_works_politics: "Public Military Works: Support and Opposition"
 nesnd_c2_italy_foundations_commercial_credit: "Merchant Finance"
 nesnd_c2_italy_foundations_commercial_credit_desc: "Support merchant credit for workshops and direct public funds towards local industry."
 nesnd_c2_italy_foundations_commercial_credit_politics: "Merchant Finance: Support and Opposition"
 nesnd_c2_italy_foundations_local_partnerships: "Local School Partnerships"
 nesnd_c2_italy_foundations_local_partnerships_desc: "Support schools maintained with local contributors."
 nesnd_c2_italy_foundations_local_partnerships_politics: "Local School Partnerships: Support and Opposition"
 nesnd_c2_italy_foundations: "Workshops and the Italian States"
 nesnd_c2_italy_foundations_reason: "French support for the Lombard Republic gave the republican cause a foothold in Italy. Orders for workshops, credit for merchants and funds for schools must still be found within Italy. The army presses for military works, merchants want to know when they will be repaid, and local contributors want places for their children. Our spending will help determine whose needs take priority."
 nesnd_c2_italy_foundations_bar: "Stable Operation"
 nesnd_c2_italy_foundations_bar_desc: "$nesnd_c2_italy_foundations_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_italy_foundations_expense: "Workshops and the Italian States Expenditure"
 nesnd_c2_italy_common_budget_fiscal_union: "Pool Tax Revenue"
 nesnd_c2_italy_common_budget_fiscal_union_desc: "Back pooled revenue and strengthen fiscal administration in the selected state."
 nesnd_c2_italy_common_budget_fiscal_union_politics: "Pool Tax Revenue: Support and Opposition"
 nesnd_c2_italy_common_budget_federal_councils: "Local Revenue and Schools"
 nesnd_c2_italy_common_budget_federal_councils_desc: "Support local education funding and give the case for retained revenue a basis in school services."
 nesnd_c2_italy_common_budget_federal_councils_politics: "Local Revenue and Schools: Support and Opposition"
 nesnd_c2_italy_common_budget_military_accounts: "Military Accounts and Veterans"
 nesnd_c2_italy_common_budget_military_accounts_desc: "Back public works for military expenditure and veterans, with assistance for local military construction."
 nesnd_c2_italy_common_budget_military_accounts_politics: "Military Accounts and Veterans: Support and Opposition"
 nesnd_c2_italy_common_budget: "A Common Budget"
 nesnd_c2_italy_common_budget_reason: "Building a common Italy means reckoning with the states’ existing military obligations and taxes. Industrial interests favour pooled resources. Local traders want revenue kept for schools, and the army puts military accounts and veterans first. A common budget must reconcile these burdens, whether the states pursue unification or negotiate a lasting relationship among themselves."
 nesnd_c2_italy_common_budget_bar: "Stable Operation"
 nesnd_c2_italy_common_budget_bar_desc: "$nesnd_c2_italy_common_budget_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_italy_common_budget_expense: "A Common Budget Expenditure"
 nesnd_c2_hus_transport_chartered_contractors: "Chartered Contractors"
 nesnd_c2_hus_transport_chartered_contractors_desc: "Award a charter for industrial expansion and freight. The company $company_ce_daqing_coop$ takes the contract if it operates within our borders. The industries and freight links in the selected state must meet the terms for three consecutive months."
 nesnd_c2_hus_transport_chartered_contractors_politics: "Chartered Contractors: Support and Opposition"
 nesnd_c2_hus_transport_open_tenders: "Open Tenders"
 nesnd_c2_hus_transport_open_tenders_desc: "Support open tenders and assist local transport infrastructure."
 nesnd_c2_hus_transport_open_tenders_politics: "Open Tenders: Support and Opposition"
 nesnd_c2_hus_transport_local_transport: "Local Transport Funds"
 nesnd_c2_hus_transport_local_transport_desc: "Support transport links serving rural communities and local trade."
 nesnd_c2_hus_transport_local_transport_politics: "Local Transport Funds: Support and Opposition"
 nesnd_c2_hus_transport: "Dongqing and the Continental Roads"
 nesnd_c2_hus_transport_reason: "The overseas trade associated with Dongqing depends on routes linking ports with inland timber, minerals and farm produce. Large contractors offer capital through concessions that would also deepen their hold on local trade. Smaller firms seek open tenders, while rural communities want connections to their own towns. We must decide whose needs the continental roads will serve first."
 nesnd_c2_hus_transport_bar: "Stable Operation"
 nesnd_c2_hus_transport_bar_desc: "$nesnd_c2_hus_transport_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_transport_expense: "Dongqing and the Continental Roads Expenditure"
 nesnd_c2_hus_frontier_pasture_passage: "Protect Pasture Routes"
 nesnd_c2_hus_frontier_pasture_passage_desc: "Support passage for pastoral communities. Local infrastructure receives assistance, while construction bears the cost of accommodating pasture routes."
 nesnd_c2_hus_frontier_pasture_passage_politics: "Protect Pasture Routes: Support and Opposition"
 nesnd_c2_hus_frontier_land_compensation: "Compensated Development"
 nesnd_c2_hus_frontier_land_compensation_desc: "Support compensated development, improving local infrastructure while accepting slower construction."
 nesnd_c2_hus_frontier_land_compensation_politics: "Compensated Development: Support and Opposition"
 nesnd_c2_hus_frontier_frontier_garrisons: "Garrisons for Construction"
 nesnd_c2_hus_frontier_frontier_garrisons_desc: "Back the army’s proposal to support construction through frontier garrisons."
 nesnd_c2_hus_frontier_frontier_garrisons_politics: "Garrisons for Construction: Support and Opposition"
 nesnd_c2_hus_frontier: "Pastures and Passage"
 nesnd_c2_hus_frontier_reason: "Railways and mines are reaching into pasture used for seasonal migration. Herds need water and passage; developers need land, and the army wants secure communications. Pastoral communities seek protected routes, developers press for compensated development, and military advocates propose garrisons to support construction. Each course places a different burden on the people who live there."
 nesnd_c2_hus_frontier_bar: "Stable Operation"
 nesnd_c2_hus_frontier_bar_desc: "$nesnd_c2_hus_frontier_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_frontier_expense: "Pastures and Passage Expenditure"
 nesnd_c2_hus_citizenship_labour_schools: "Labour and Learning"
 nesnd_c2_hus_citizenship_labour_schools_desc: "Support education for workers and families bound by debt through school services in the selected state."
 nesnd_c2_hus_citizenship_labour_schools_politics: "Labour and Learning: Support and Opposition"
 nesnd_c2_hus_citizenship_public_accounts: "Publish Public Accounts"
 nesnd_c2_hus_citizenship_public_accounts_desc: "Back scrutiny of public works accounts and assist local fiscal administration."
 nesnd_c2_hus_citizenship_public_accounts_politics: "Publish Public Accounts: Support and Opposition"
 nesnd_c2_hus_citizenship: "People Beyond the Debt Bond"
 nesnd_c2_hus_citizenship_reason: "Families bound by debt bring old obligations and inherited rank with them into the workshops. Teachers and workers seek access to learning. Local traders demand to know who benefits from public expenditure. Support for education and scrutiny of public accounts offer different ways into a dispute over freedom and standing that now reaches into everyday working life."
 nesnd_c2_hus_citizenship_bar: "Stable Operation"
 nesnd_c2_hus_citizenship_bar_desc: "$nesnd_c2_hus_citizenship_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_citizenship_expense: "People Beyond the Debt Bond Expenditure"
 nesnd_c2_hus_oil_oil_concessions: "Oil Concessions"
 nesnd_c2_hus_oil_oil_concessions_desc: "Back oil concessions and assist construction serving the oil industry."
 nesnd_c2_hus_oil_oil_concessions_politics: "Oil Concessions: Support and Opposition"
 nesnd_c2_hus_oil_oil_royalties: "Local Oil Royalties"
 nesnd_c2_hus_oil_oil_royalties_desc: "Support the case for local oil royalties and assist fiscal administration in the producing state."
 nesnd_c2_hus_oil_oil_royalties_politics: "Local Oil Royalties: Support and Opposition"
 nesnd_c2_hus_oil_oil_oversight: "Public Oil Oversight"
 nesnd_c2_hus_oil_oil_oversight_desc: "Back workers’ demands for public oversight of oil and direct local assistance towards education."
 nesnd_c2_hus_oil_oil_oversight_politics: "Public Oil Oversight: Support and Opposition"
 nesnd_c2_hus_oil: "Oil Wells and Local Revenue"
 nesnd_c2_hus_oil_reason: "As oil reaches the market, its proceeds become a question of local power. Concessionary companies want to finance further expansion, traders seek royalties for roads and schools, and workers’ organisations demand public oversight. We must fund the course we choose as well as count the revenue promised by the wells."
 nesnd_c2_hus_oil_bar: "Stable Operation"
 nesnd_c2_hus_oil_bar_desc: "$nesnd_c2_hus_oil_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_oil_expense: "Oil Wells and Local Revenue Expenditure"
 nesnd_c2_usm_constitution_classical_franchise: "Retain Classical Examinations"
 nesnd_c2_usm_constitution_classical_franchise_desc: "Let the Assembly of Rites set a common examination in the classics for candidates from every province."
 nesnd_c2_usm_constitution_classical_franchise_politics: "Retain Classical Examinations: Support and Opposition"
 nesnd_c2_usm_constitution_practical_franchise: "Admit Practical and Commercial Learning"
 nesnd_c2_usm_constitution_practical_franchise_desc: "Let the Assembly of Rites examine candidates in practical learning, commerce and industry."
 nesnd_c2_usm_constitution_practical_franchise_politics: "Admit Practical and Commercial Learning: Support and Opposition"
 nesnd_c2_usm_constitution_local_franchise: "More Provincial Places"
 nesnd_c2_usm_constitution_local_franchise_desc: "Expand provincial places and let the academies nominate students for the examinations of the Assembly of Rites."
 nesnd_c2_usm_constitution_local_franchise_politics: "More Provincial Places: Support and Opposition"
 nesnd_c2_usm_constitution: "The Constitution and Public Office"
 nesnd_c2_usm_constitution_reason: "The Assembly of Rites draws candidates trained in the classics alongside men versed in machinery, accounts and trade. The cabinet and Six Ministries seek capable officials, while the provinces press the claims of their own students. The weight given to classical qualifications, practical learning and provincial places will decide who enters public life under the Constitution and the standing of the established gentry."
 nesnd_c2_usm_constitution_bar: "Stable Operation"
 nesnd_c2_usm_constitution_bar_desc: "$nesnd_c2_usm_constitution_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_constitution_expense: "Civil Service Reform Funding"
 nesnd_c2_usm_schools_practical_schools: "Practical Curricula"
 nesnd_c2_usm_schools_practical_schools_desc: "Give the Six Ministries control of academy funding and the practical curriculum."
 nesnd_c2_usm_schools_practical_schools_politics: "Practical Curricula: Support and Opposition"
 nesnd_c2_usm_schools_provincial_schools: "Provincial Places"
 nesnd_c2_usm_schools_provincial_schools_desc: "Give provincial administrations control of academy funding so that they can offer more places."
 nesnd_c2_usm_schools_provincial_schools_politics: "Provincial Places: Support and Opposition"
 nesnd_c2_usm_schools: "Academies and Provincial Delegates"
 nesnd_c2_usm_schools_reason: "Academy teachers must make room for surveying, machinery and commercial learning alongside the classics. Students seek useful knowledge and a chance to qualify for the Assembly of Rites examinations. Provincial administrators must find the money; provincial delegates bring demands for curricula and places into national debate. Practical teaching and wider provincial access compete for the same education funds."
 nesnd_c2_usm_schools_bar: "Stable Operation"
 nesnd_c2_usm_schools_bar_desc: "$nesnd_c2_usm_schools_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_schools_expense: "Academy Funding"
 nesnd_c2_usm_industry_coastal_industry: "Ministerial Grant: Coastal Workshops"
 nesnd_c2_usm_industry_coastal_industry_desc: "Expand coastal workshops with treasury funds administered by the Six Ministries."
 nesnd_c2_usm_industry_coastal_industry_politics: "Coastal Workshops: Support and Opposition"
 nesnd_c2_usm_industry_inland_industry: "Ministerial Grant: Inland Industry"
 nesnd_c2_usm_industry_inland_industry_desc: "Put the Six Ministries in charge of the grant for inland workshops and mines."
 nesnd_c2_usm_industry_inland_industry_politics: "Inland Industry: Support and Opposition"
 nesnd_c2_usm_industry: "Industry and Waterways"
 nesnd_c2_usm_industry_reason: "The treasury can finance textile mills, shipyards and paper mills along the coast, or workshops and mines inland. In making an appropriation, the Assembly of Rites must also settle whether the Six Ministries or the provincial administration will direct the spending."
 nesnd_c2_usm_industry_bar: "Stable Operation"
 nesnd_c2_usm_industry_bar_desc: "$nesnd_c2_usm_industry_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_industry_expense: "Industrial Funding"
 nesnd_c2_usm_distribution_commercial_empire: "Concentrate Commercial Investment"
 nesnd_c2_usm_distribution_commercial_empire_desc: "Give the Six Ministries control of these revenues to fund workshops in the selected state."
 nesnd_c2_usm_distribution_commercial_empire_politics: "Concentrate Commercial Investment: Support and Opposition"
 nesnd_c2_usm_distribution_provincial_balance: "Public Investment Across Provinces"
 nesnd_c2_usm_distribution_provincial_balance_desc: "Put the funding in the hands of two provincial administrations for their local government offices."
 nesnd_c2_usm_distribution_provincial_balance_politics: "Public Investment Across Provinces: Support and Opposition"
 nesnd_c2_usm_distribution_scholars_franchise: "Wider Delegate Qualifications"
 nesnd_c2_usm_distribution_scholars_franchise_desc: "Broaden the provinces’ right to nominate delegates. Their academies may put forward candidates for the examination of the Assembly of Rites."
 nesnd_c2_usm_distribution_scholars_franchise_politics: "Wider Delegate Qualifications: Support and Opposition"
 nesnd_c2_usm_distribution: "Allocation of Tax Revenue"
 nesnd_c2_usm_distribution_reason: "Revenue from industry and trade may return to prosperous commercial centres or support public works across the provinces. The cabinet and Six Ministries plan expenditure; delegates in the Assembly of Rites must answer for what their provinces contribute and receive. Commercial investment, provincial development and access to public office now contend over the gains of industrial growth."
