 nesnd_usm_mandate_central_desc: "Place provincial administration and public works under the Six Ministries. At 60, bureaucracy and construction efficiency rise by 10% each, and tax waste rises by 5 percentage points. At 75, all three effects double."
 nesnd_usm_mandate_provincial_desc: "Give provincial administrations greater authority over local affairs. At 40, growth in radicalism among pops of every acceptance status, the bureaucracy cost of governing the population, resource and agricultural throughput, and construction efficiency each fall by 10%. Rural Folk attraction and political strength each rise by 10%. At 25, these effects double."
