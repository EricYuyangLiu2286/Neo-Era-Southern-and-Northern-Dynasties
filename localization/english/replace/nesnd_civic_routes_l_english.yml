 nesnd_c2_usm_distribution_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_usm_distribution_expense: "Where the Revenue Goes Expenditure"
 nesnd_civic_routes.1.t: "The Work Becomes Routine"
 nesnd_civic_routes.1.d: "The undertaking has stood the test of ordinary operation. The services or production supported by the expenditure now offer tangible results, giving local debate over costs and benefits something concrete to judge."
 nesnd_civic_routes.1.a: "Let it endure."
