 nesnd_c2_hus_oil_oil_concessions_desc: "Back oil concessions and assist construction serving the oil industry."
 nesnd_c2_hus_oil_oil_concessions_politics: "Oil Concessions: Support and Opposition"
 nesnd_c2_hus_oil_oil_royalties: "Local Oil Royalties"
 nesnd_c2_hus_oil_oil_royalties_desc: "Support the case for local oil royalties and assist fiscal administration in the producing state."
 nesnd_c2_hus_oil_oil_royalties_politics: "Local Oil Royalties: Support and Opposition"
 nesnd_c2_hus_oil_oil_oversight: "Public Oil Oversight"
 nesnd_c2_hus_oil_oil_oversight_desc: "Back workers’ demands for public oversight of oil and direct local assistance towards education."
 nesnd_c2_hus_oil_oil_oversight_politics: "Public Oil Oversight: Support and Opposition"
 nesnd_c2_hus_oil: "Oil Wells and Local Revenue"
 nesnd_c2_hus_oil_reason: "As oil reaches the market, its proceeds become a question of local power. Concessionary companies want to finance further expansion, traders seek royalties for roads and schools, and workers’ organisations demand public oversight. The government must fund the course it chooses as well as count the revenue promised by the wells."
 nesnd_c2_hus_oil_bar: "Stable Operation"
 nesnd_c2_hus_oil_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_hus_oil_expense: "Oil Wells and Local Revenue Expenditure"
 nesnd_c2_usm_constitution_classical_franchise: "Retain Classical Examinations"
 nesnd_c2_usm_constitution_classical_franchise_desc: "Support classical learning as the basis of public qualifications and strengthen local fiscal administration."
 nesnd_c2_usm_constitution_classical_franchise_politics: "Retain Classical Examinations: Support and Opposition"
 nesnd_c2_usm_constitution_practical_franchise: "Admit Practical and Commercial Learning"
 nesnd_c2_usm_constitution_practical_franchise_desc: "Back recognition of practical and commercial learning through assistance to local education."
 nesnd_c2_usm_constitution_practical_franchise_politics: "Admit Practical and Commercial Learning: Support and Opposition"
 nesnd_c2_usm_constitution_local_franchise: "Broaden Provincial Places"
 nesnd_c2_usm_constitution_local_franchise_desc: "Support wider provincial places and assist the education of prospective candidates."
 nesnd_c2_usm_constitution_local_franchise_politics: "Broaden Provincial Places: Support and Opposition"
 nesnd_c2_usm_constitution: "The Constitution and Public Office"
 nesnd_c2_usm_constitution_reason: "The Assembly of Rites draws candidates trained in the classics alongside men versed in machinery, accounts and trade. The cabinet and Six Ministries seek capable officials, while the provinces press the claims of their own students. The weight given to classical qualifications, practical learning and provincial places will shape access to public life under the Constitution and the standing of the established gentry."
