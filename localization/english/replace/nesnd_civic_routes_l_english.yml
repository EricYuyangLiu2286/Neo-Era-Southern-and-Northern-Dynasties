 nesnd_c2_usm_schools_bar_desc: "Consecutive operating months / three months"
 nesnd_c2_usm_schools_expense: "Academies and Provincial Delegates Expenditure"
 nesnd_c2_usm_industry_coastal_industry: "Coastal Workshops"
 nesnd_c2_usm_industry_coastal_industry_desc: "Assist construction and industrial operations in coastal workshops."
 nesnd_c2_usm_industry_coastal_industry_politics: "Coastal Workshops: Support and Opposition"
 nesnd_c2_usm_industry_inland_industry: "Inland Industry"
 nesnd_c2_usm_industry_inland_industry_desc: "Direct industrial investment inland and assist local workshop operations through infrastructure."
 nesnd_c2_usm_industry_inland_industry_politics: "Inland Industry: Support and Opposition"
 nesnd_c2_usm_industry: "Industry and Waterways"
 nesnd_c2_usm_industry_reason: "Coastal merchants look to ports and shipping when establishing workshops. Inland towns also seek industrial investment, while provincial administrators must answer for local taxes and construction costs. Machinery, labour and goods cross provincial boundaries more readily than those obligations. The government’s choice of where to invest must eventually be borne out in the operation of the works."
