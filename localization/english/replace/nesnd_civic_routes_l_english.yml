 nesnd_civic_routes.30.t: "What a Debt Bond Can Claim"
 nesnd_civic_routes.30.d: "In [SCOPE.sState('c2_dayuan').GetName] a creditor can still demand his money. He can no longer claim a debtor’s children along with it. Some families want their children taught to read, so that the next time a bond is put before them they can read it for themselves. A local society is collecting money for a teacher. The families most anxious for a place have the least to spare."
 nesnd_civic_routes.30.a: "Pay for tuition from the treasury so debtor families can send their children."
 nesnd_c2_scholarly_exchange: "Exchange Teachers with the Western Administration"
 nesnd_c2_scholarly_exchange_desc: "While the Western Administration is independent, invite its academies to exchange teachers with ours. If the invitation is accepted, one state in each country receives the following benefit for two years.\n[GetStaticModifier('nesnd_civic_academy_exchange').GetDesc]"
 nesnd_civic_routes.40.t: "An Invitation to Exchange Teachers"
 nesnd_civic_routes.40.d: "A letter from [SCOPE.sCountry('c2_scholar_sender').GetName] asks [SCOPE.sCharacter('c2_duan').GetFullName] to arrange an exchange between the academies in [SCOPE.sState('c2_host_school').GetName] and [SCOPE.sState('c2_sender_school').GetName]. Pupils in both places could hear teachers from beyond the border. A letter of invitation from the Assembly of Rites, however, cannot by itself release a teacher from his duties here."
 nesnd_civic_routes.40.a: "Approve a two-year exchange between the academies."
 nesnd_civic_routes.40.b: "Decline the invitation. The academy needs its teachers here."
 nesnd_civic_routes.41.t: "Letters between the Academies"
 nesnd_civic_routes.41.d: "The academies have agreed on a term. The academy in [SCOPE.sState('c2_sender_school').GetName] may invite teachers from Sichuan and must name teachers of its own for [SCOPE.sState('c2_host_school').GetName]. For the next two years, pupils who want to study under a teacher from across the border can do so at home."
 nesnd_civic_routes.41.a: "Announce the courses and their term to the pupils."
 nesnd_c2_italian_abandon: "End the Current Accord"
 nesnd_c2_italian_abandon_desc: "End the current mutual obligations without claiming fulfilment. The original twelve-month expenditure continues to its expiry. Negotiations may resume after twelve months."
 nesnd_c2_productive_levels_tt: "For three consecutive months, operating levels in the selected state and production group must reach the total built levels at the start plus the required increase. Market access must be at least 80%. Only building levels with at least 75% employment and a positive weekly profit count. Empty or loss-making levels do not."

