 da_nesnd_south_concede_autonomy_action_notification_name:0 "[INITIATOR_COUNTRY.GetName] concedes autonomy to [TARGET_COUNTRY.GetName]"
 da_nesnd_south_concede_autonomy_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] has loosened its hold on [TARGET_COUNTRY.GetName] to win it over to the Ming house."
 da_nesnd_south_concede_autonomy_action_notification_third_party_name:0 "[INITIATOR_COUNTRY.GetName] concedes autonomy to a subject"
 da_nesnd_south_concede_autonomy_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName] has loosened its hold on us, hoping to win us over to the Ming house."
 nesnd_south_concede_wu_zone_tt:0 "Its political balance is on the Wu side."
 nesnd_south_concede_cooldown_tt:0 "#v 12 months#! have passed since the last concession to it."
 nesnd_south_concede_swing_tt:0 "Its political balance moves #v 1.5#! a month towards the Ming house for #v 12 months#!. If its autonomy cannot be raised any further, it becomes independent."
