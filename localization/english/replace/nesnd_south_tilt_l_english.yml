l_english:
 nesnd_south_allegiance:0 "The Fate of [ROOT.GetCountry.GetName]"
 nesnd_south_allegiance_reason:0 "[ROOT.GetCountry.GetCustom('nesnd_south_allegiance_reason_loc')]"
 nesnd_south_allegiance_status_ming:0 "Our loyalty is plain as the sun and moon. The Wu usurpers shall never seize the realm!"
 nesnd_south_allegiance_status_neutral:0 "The quarrel at Nanjing is no business of outer vassals. Our gentlemen ask only to keep the borders and the people safe."
 nesnd_south_allegiance_status_wu:0 "See whose realm the South is today. The feeble house of Zhu and its foolish ministers are mantises before a cart."
 nesnd_south_allegiance_conclusion:0 "[ROOT.GetCountry.GetName] has taken its position."
 nesnd_south_allegiance_invalid_conclusion:0 "[ROOT.GetCountry.GetName] is no longer a subject of the southern court."
 nesnd_south_locked_tt:0 "Succession pressure is full, or the reform pledge is full."
 nesnd_south_fate_effect_tt:0 "Our position follows the political balance: #v −12#! or lower sides with Ming, #v +12#! or higher sides with Wu, and anything between stays neutral."
 nesnd_south_tilt_bar:0 "Political Balance"
 nesnd_south_tilt_bar_desc:0 "$nesnd_south_tilt_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!"
 nesnd_tilt_src_legacy:0 "Old grievances"
 nesnd_tilt_src_election:0 "Wu's electoral law"
 nesnd_tilt_src_land:0 "Wu's land law"
 nesnd_tilt_src_court:0 "Wu stands by the Ming house"
 nesnd_tilt_src_events:0 "Recent events"
 nesnd_tilt_src_appease:0 "Conciliation by the court"
 nesnd_tilt_src_envoy:0 "Envoys from other subjects"
 nesnd_tilt_src_declared:0 "Our own declaration"
 nesnd_tilt_declare_ming_button:0 "Declare for the Ming House"
 nesnd_tilt_declare_ming_button_desc:0 "All under heaven know that we keep the calendar of the Great Ming."
 nesnd_tilt_declare_ming_tt:0 "Political balance #v −1#! a month for #v 6#! months. We may declare again after #v 12#! months."
 nesnd_tilt_declare_wu_button:0 "Declare for the Zheng"
 nesnd_tilt_declare_wu_button_desc:0 "Our future lies in Hangzhou, not in Nanjing."
 nesnd_tilt_declare_wu_tt:0 "Political balance #v +1#! a month for #v 6#! months. We may declare again after #v 12#! months."
 nesnd_tilt_declare_cooldown_tt:0 "#v 12#! months have passed since our last declaration."
 nesnd_south_side_ming_button:0 "Loyal to the Ming House"
 nesnd_south_side_ming_button_desc:0 "We have lived on the dynasty's favour for generations. We will not stand by while an overmighty minister steals the realm!"
 nesnd_south_side_ming_tt:0 "We side with the Ming house. The political balance of Shu, Chu and Huai moves #v −1#! a month. We cannot change sides again for #v 12#! months."
 nesnd_south_side_wu_button:0 "Follow the Zheng"
 nesnd_south_side_wu_button_desc:0 "It was the Zheng who saved the South from the hooves of the Mu, not the Zhu emperor in his palace at Nanjing."
 nesnd_south_side_wu_tt:0 "We follow the Zheng. We cannot change sides again for #v 12#! months."
 nesnd_south_side_cooldown_tt:0 "#v 12#! months have passed since we last changed sides."
 nesnd_south_pledge_full_tt:0 "The reform pledge has reached #v 100#!."
 nesnd_south_lock_effect_tt:0 "Every subject takes the position its political balance gives it.\nIf any subject takes up arms, the Zheng take the throne and the Second Jingnan War begins the same day.\nIf none does, the matter is settled without a war."
 nesnd_south_tilt.100.t:0 "The Dagger Revealed"
 nesnd_south_tilt.100.d:0 "The summons from the southern office in Hangzhou has arrived. Citing ‘a change in the mandate of heaven’, the lord of Wu orders every subject to send a memorial urging him to take the throne within ten days. Those who fail will be treated as rebels. The question argued over for three years in assemblies, newspapers and academies is one the southern office does not mean to argue any longer.\n\n"
 nesnd_south_tilt.100.f:0 "“Now that I have seen him, the Zhu boy is a mortal like any other.”\n— Zheng Zhao"
 nesnd_south_tilt.100.a:0 "$usm_civilwar.1.1$"
 nesnd_south_tilt.100.b:0 "Neither the Zhu nor the Zheng deserve to rule the realm any longer."
 nesnd_south_tilt.100.c_cne:0 "Send north and ask $nesnd_lobby_name_cne$ for troops."
 nesnd_south_tilt.100.c_qe1:0 "Send west and ask $nesnd_lobby_name_qe1$ for troops."
 nesnd_south_tilt.100.c_hus:0 "Send across the sea and ask $nesnd_lobby_name_hus$ for protection."
 nesnd_south_tilt.100.i:0 "From today we govern ourselves. The wars of the mainland are none of ours."
 nesnd_south_tilt.100.e:0 "Hold our borders and watch."
 nesnd_south_tilt.100.w:0 "$usm_civilwar.1.3$"
 nesnd_south_tilt.100.g:0 "$usm_civilwar.1.2$"
 nesnd_south_tilt.100.h:0 "The cause is lost. Send the memorial and submit."
 nesnd_south_tilt.110.t:0 "$flavorUSM.4.t$"
 nesnd_south_tilt.110.d:0 "Zheng Qin, lord of Wu, is dead, and his son Zheng Ju has succeeded him. The officials of Nanjing, whatever their origin, all went to Hangzhou to offer their congratulations, so that at the court of the Ming emperor of the Ning line only Zhu Jiangchen, vice-minister of war and son of the late Marshal Zhu Banbo, remained. Three days later Hao Tingjiang, minister of Wu, entered the palace at Nanjing with ten officers of Wu. The next day the emperor, following the example of Yao and Shun, abdicated in favour of Wu. Zheng Ju took the throne as emperor and named his dynasty the Great Wu. A general amnesty was proclaimed and the era was renamed Tianyan.\n\nAs the news spread, the provinces that refused the calendar of the Great Wu rose under the banner ‘Against Wu, for Ming: pacify the troubles in heaven's name’."
 nesnd_south_tilt.110.d_peace:0 "Zheng Qin, lord of Wu, is dead, and his son Zheng Ju has succeeded him. The officials of Nanjing, whatever their origin, all went to Hangzhou to offer their congratulations, so that at the court of the Ming emperor of the Ning line only Zhu Jiangchen, vice-minister of war and son of the late Marshal Zhu Banbo, remained. Three days later Hao Tingjiang, minister of Wu, entered the palace at Nanjing with ten officers of Wu. The next day the emperor, following the example of Yao and Shun, abdicated in favour of Wu. Zheng Ju took the throne as emperor and named his dynasty the Great Wu. A general amnesty was proclaimed and the era was renamed Tianyan.\n\nSome provinces sent their congratulations and some shut their borders. Not one took up arms."
 nesnd_south_tilt.110.f:0 "$flavorUSM.4.f$"
 nesnd_south_tilt.110.a:0 "$flavorUSM.4.1$"
 nesnd_south_tilt.111.t:0 "Three Days in Hangzhou"
 nesnd_south_tilt.111.d:0 "Not one province would pull the chestnuts out of the fire for the Zheng, and overnight the southern office in Hangzhou became a city alone. The Ming court gave the lord of Wu and his son no chance to plead. Troops loyal to the house of Zhu sealed off the headquarters of the Five Military Commissions. Zheng Qin, Zheng Ju and their confidants were executed where they stood, and for three whole days the officials, secretaries and naturalised Japanese guards of the southern office were hunted down and killed. The line of the lords of Wu, which had held the court in its grip for decades, was ended.\n\nDeng Mingyu betrayed his patron once again, and in good time, and emerged as the voice of the Jiangsu and Zhejiang merchant gentry at the new court.\n\nYet the struggle for power never ends. The Ming court is full of upright men, and already they are scrambling over the vacuum the fall of the southern office has left. But this time those who hold political ideals will no longer live under the shadow of the southern office... or, perhaps, under its protection?"
 nesnd_south_tilt.111.f:0 "“He who does much that is unjust will bring about his own destruction.”\n— Zuo Commentary, Duke Yin, year 1"
 nesnd_south_tilt.111.a:0 "Root out the traitors!"
 nesnd_south_tilt.111.tt:0 "Zheng Qin and Zheng Ju are dead. Deng Mingyu leads the industrialists. The southern quarrel is settled without a war."
 nesnd_south_tilt.120.t:0 "A Missed Opportunity"
 nesnd_south_tilt.120.d_wu:0 "A southern province sent to us for help and promised to open the way. Yet the Zheng replaced the Ming without meeting any resistance worth the name. The provinces submitted or shut their gates, and nothing more was heard from the envoys. [ROOT.GetCountry.GetName] might have made something of this civil strife in the south. Now we can only watch a Great Wu, whole and unbroken, stand south of the Yangtze."
 nesnd_south_tilt.120.d_ming:0 "A southern province sent to us for help and promised to open the way. Yet the southern office in Hangzhou fell in a single night, the Ming court took back its power, and nothing more was heard from the envoys. [ROOT.GetCountry.GetName] might have made something of this civil strife in the south. Now we can only watch the southern court come through its crisis."
 nesnd_south_tilt.120.f:0 "“Refuse what heaven offers and you take the blame. Fail to act when the hour comes and you suffer the calamity.”\n— Records of the Historian, The Marquis of Huaiyin"
 nesnd_south_tilt.120.a:0 "There will be other days."
 nesnd_south_tilt.130.t:0 "The Republic at Xiangyang"
 nesnd_south_tilt.130.d:0 "[ROOT.GetCountry.GetName] has left the southern court, and the republicans hold Xiangyang. They must now choose a leader. One party favours Lin Zexu, Zhu Banbo's successor, far away in Luzon, and would bring him home in secret. The other holds that Zhu Jiangchen, Zhu Banbo's son, is here with the army and has the better title."
 nesnd_south_tilt.130.f:0 "“Were the old marshal alive, Xiangyang would not be living at another's pleasure.”\n— talk in the Xiangyang army"
 nesnd_south_tilt.130.a:0 "Bring Lin Zexu home."
 nesnd_south_tilt.130.b:0 "Choose Zhu Jiangchen."
 nesnd_south_tilt.131.t:0 "The Buddha's Realm"
 nesnd_south_tilt.131.d:0 "On the night [ROOT.GetCountry.GetName] declared that it would govern itself, Yang Xiuqing, who commands the troops, led them into the palace in the name of ‘clearing the ruler's side’. The decayed house of Huai put up no resistance worth the name. Zhu Zhongying, Prince of Huai, and his heir Zhu Jingyin were put to death. Yang Xiuqing then abolished the princely title and announced that the country would be ruled by the Buddhist law, with scholars chosen by examination to deliberate on affairs."
 nesnd_south_tilt.131.f:0 "“All conditioned things are like a dream, an illusion, a bubble, a shadow.”\n— Diamond Sutra"
 nesnd_south_tilt.131.a:0 "The mandate has left the house of Zhu."
 nesnd_south_tilt.131.tt:0 "The princely house of Huai is dead. Yang Xiuqing rules, and Huai adopts theocracy and examination voting."
 nesnd_south_peace_secession_tt:0 "#n The breakaway provinces have gone to war for their independence!#!"
 nesnd_south_loyal_autonomy:0 "Reward for Loyalty"
 nesnd_board_tilt_row:0 "[Country.GetCustom('nesnd_board_tilt_loc')]"
 nesnd_board_tilt_line:0 "$nesnd_south_tilt_bar$ #v [Country.MakeScope.Var('nesnd_tilt_value').GetValue|0]#! (this month [Country.MakeScope.Var('nesnd_tilt_delta').GetValue|+0])"
 nesnd_board_tilt_none:0 ""
 nesnd_south_tilt.1.a_tt:0 "$nesnd_lobby_name_sih$, $nesnd_lobby_name_hna$ and $nesnd_lobby_name_gng$: political balance #v −1#! a month\n$nesnd_lobby_name_dei$: political balance #v +1#! a month for #v 6#! months."
 nesnd_south_tilt.1.b_tt:0 "$nesnd_lobby_name_phi$: political balance #v −1#! a month\n$nesnd_lobby_name_dei$: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.1.t:0 "When the Birds Are Gone the Bow Is Put Away"
 nesnd_south_tilt.1.d:0 "It is eighteen years since Zheng Qin, lord of Wu, took in the republicans who had fled south and made Chen Dongyang chief minister in 1818. The domains were abolished and made provinces. Their former lords were pensioned off in the capital and the country was handed to the commissions for administration, justice and garrisons. The privileges of the military nobility were cut down. The old houses may no longer command troops, their tax-free land quotas are gone, replaced by fixed annuities, and the garrison farms have been bought out and thrown on the market for rich farmers and plantation companies to bid on. Of all the princes of the South only Shu and Huai remain.\n\nAll of it was decreed in the chief minister's name, and none of it could have been done without the fleet and treasury of the southern office. To Zheng Qin, Chen Dongyang's ‘republic of the people of the realm’ was a tool for sweeping away the domains and nothing more. The domains are gone, yet the republicans now want the assemblies to reach over the southern office itself, and the lord of Wu has run out of patience. Chen Dongyang has been dismissed and Deng Mingyu put in his place. The assembly in Nanjing has not dared to say a word.\n\nThe Zhu of Ming, or the Zheng of Wu? [ROOT.GetCountry.GetName] can no longer pretend not to hear the question."
 nesnd_south_tilt.1.f:0 "“What I give and what I take, I alone shall decide.”\n— Zheng Qin"
 nesnd_south_tilt.2.a:0 "Try it in the open. Let the whole realm see who is stirring up riot in the countryside."
 nesnd_south_tilt.2.a_tt:0 "$nesnd_lobby_name_hna$: political balance #v +1#! a month\n$nesnd_lobby_name_phi$: political balance #v +1#! a month\n$nesnd_lobby_name_gng$: political balance #v −2#! a month\n$nesnd_lobby_name_sih$: political balance #v −2#! a month for #v 6#! months."
 nesnd_south_tilt.2.b:0 "This must not become a spectacle. Forbid the papers to print it and settle out of court."
 nesnd_south_tilt.2.b_tt:0 "$nesnd_lobby_name_hna$: political balance #v −1#! a month\n$nesnd_lobby_name_phi$: political balance #v −1#! a month\n$nesnd_lobby_name_gng$: political balance #v +2#! a month\n$nesnd_lobby_name_sih$: political balance #v +2#! a month for #v 6#! months."
 nesnd_south_tilt.2.t:0 "The Garrison Farm Case"
 nesnd_south_tilt.2.d:0 "Under the statutes abolishing the land quotas, the court bought out the farms of a garrison and prepared to auction them. Radicals among the republicans went into the villages and stirred the peasants to demand that the land be given outright to those who till it. A leaseholding landlord whose family had rented these fields from the nobility for generations insisted that the land was rightfully his and would not yield. Angry peasants broke into his house, and members of his family were hurt.\n\nThe family used its connections to bring the case straight to the Ministry of Justice, which has decided to hear it in open court. A village quarrel over land has become a contest between landlords, the old nobility and the republicans in every newspaper in the country. Shall we use the case to rein in the republican radicals, or bury it before it stains the name of the reforms?"
 nesnd_south_tilt.2.f:0 "“The government bought out the master's fields. Nobody said whether it would buy out our lives.”\n— testimony of a villager before the Ministry of Justice"
 nesnd_south_tilt.3.a:0 "The colonies are the court's own land. They should pay first."
 nesnd_south_tilt.3.a_tt:0 "$nesnd_lobby_name_phi$: political balance #v −1#! a month\n$nesnd_lobby_name_dei$: political balance #v −1#! a month for #v 12#! months."
 nesnd_south_tilt.3.b:0 "The princes and native rulers have enjoyed our protection for years. It is time they bore a share."
 nesnd_south_tilt.3.b_tt:0 "the Nanyang states: political balance #v −1#! a month\nthe Indochinese vassals: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.3.t:0 "Who Pays the Annuities"
 nesnd_south_tilt.3.d:0 "The annuities that replaced the land quotas are paid in their first year out of the money that bought the garrison farms. That sum is now the largest hole in the accounts of the Ministry of Revenue. With the southern office ruling from a distance, taxes pass through many hands and never arrive in full. Chief Minister Deng Mingyu has only one remedy, which is to levy more overseas: either on $nesnd_lobby_name_phi$ and $nesnd_lobby_name_dei$, the colonies the court rules directly, or on the princes and native states of Nanyang. Whichever it is, someone overseas will pay for the reforms at home."
 nesnd_south_tilt.3.f:0 "“If the people have plenty, how can the ruler be in want? If the people are in want, how can the ruler have plenty?”\n— Analects, Yan Yuan"
 nesnd_south_tilt.4.a:0 "The Outline of the State promised as much. Let it be widened."
 nesnd_south_tilt.4.a_tt:0 "$nesnd_lobby_name_hna$: political balance #v +1#! a month\n$nesnd_lobby_name_phi$: political balance #v +1#! a month\n$nesnd_lobby_name_yn1$: political balance #v +1#! a month\n$nesnd_lobby_name_gng$: political balance #v −1#! a month\n$nesnd_lobby_name_sih$: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.4.b:0 "The assemblies are for debate, not for giving orders."
 nesnd_south_tilt.4.b_tt:0 "$nesnd_lobby_name_hna$: political balance #v −1#! a month\n$nesnd_lobby_name_phi$: political balance #v −1#! a month\n$nesnd_lobby_name_gng$: political balance #v +1#! a month\n$nesnd_lobby_name_sih$: political balance #v +1#! a month for #v 6#! months."
 nesnd_south_tilt.4.t:0 "A Night Council in Hangzhou"
 nesnd_south_tilt.4.d:0 "The republicans have petitioned for wider representation: more seats in the assemblies and more powers for them. [SCOPE.sCharacter('nesnd_wu_king').GetFullName], lord of Wu, has summoned Hao Tingjiang, minister of Wu, and Chief Minister Deng Mingyu to the southern office in Hangzhou. Hao holds that the assemblies were a dignity the court granted to the gentry, and that a dignity must not become a power. Deng reminds the lord of Wu that most officials in $nesnd_lobby_name_hna$ and $nesnd_lobby_name_phi$ owe their careers to the republicans, and that a flat refusal will only drive them towards Nanjing.\n\nThe Outline of the State speaks of ‘a realm that belongs to the many’. Tonight it must be decided whether those words mean anything."
 nesnd_south_tilt.4.f:0 "“The people are the root of the state. When the root is firm, the state is at peace.”\n— Book of Documents, Songs of the Five Sons"
 nesnd_south_tilt.5.a:0 "Raise the tribute as precedent allows."
 nesnd_south_tilt.5.a_tt:0 "the Indochinese vassals: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.5.b:0 "Lower the tribute and take their soldiers instead."
 nesnd_south_tilt.5.b_tt:0 "the Indochinese vassals: political balance #v +1#! a month\n$nesnd_lobby_name_gng$: political balance #v −1#! a month\n$nesnd_lobby_name_sih$: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.5.t:0 "The Question of Tribute"
 nesnd_south_tilt.5.d:0 "The vassals of Indochina send rice and local goods in tribute every year, and the court defends them against outsiders. The Ministry of Revenue now proposes to raise the tribute by old precedent to cover the cost of the land redemption. The Ministry of War cares more for the vassals' soldiers and would lower the tribute in exchange for their troops in wars to come. The princes' envoys have waited a month in Hangzhou for the court to make up its mind."
 nesnd_south_tilt.5.f:0 "“Under the wide heaven there is no land that is not the king's. Within the borders of the land there is none who is not the king's subject.”\n— Book of Songs, Lesser Odes, Bei Shan"
 nesnd_south_tilt.6.a:0 "The abolition of the domains should not stop at the shore."
 nesnd_south_tilt.6.a_tt:0 "the Nanyang states: political balance #v −2#! a month\n$nesnd_lobby_name_dei$: political balance #v +2#! a month\n$nesnd_lobby_name_phi$: political balance #v +1#! a month for #v 6#! months."
 nesnd_south_tilt.6.b:0 "The lands overseas are not the mainland. Let the old investitures stand."
 nesnd_south_tilt.6.b_tt:0 "the Nanyang states: political balance #v +1#! a month\n$nesnd_lobby_name_dei$: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.6.t:0 "Magistrates across the Sea"
 nesnd_south_tilt.6.d:0 "The domains of the mainland are provinces now, but the princes and native rulers of Nanyang still hold their lands. $nesnd_lobby_name_dei$ has petitioned to replace several neighbouring rulers with appointed magistrates under its own authority. The envoys of the Nanyang states are pleading all over Hangzhou that their forefathers held their thrones by the investiture of Wu, and that the court should not break its own word.\n\nThe southern office has not forgotten how much blood the abolition of the domains cost on the mainland."
 nesnd_south_tilt.6.f:0 "“Until the lords are dead, the new law cannot be made!”\n— Chen Dongyang, Memorial on Abolishing the Domains"
 nesnd_south_tilt.7.a:0 "Chen Dongyang has lost his office. He has not lost the argument."
 nesnd_south_tilt.7.a_tt:0 "$nesnd_lobby_name_gng$: political balance #v −3#! a month\n$nesnd_lobby_name_sih$: political balance #v −3#! a month\n$nesnd_lobby_name_hna$: political balance #v −1#! a month\n$nesnd_lobby_name_phi$: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.7.b:0 "The emperor has spoken. His servants obey."
 nesnd_south_tilt.7.b_tt:0 "$nesnd_lobby_name_hna$: political balance #v −3#! a month\n$nesnd_lobby_name_phi$: political balance #v −1#! a month\n$nesnd_lobby_name_gng$: political balance #v −1#! a month\n$nesnd_lobby_name_sih$: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.7.t:0 "Gunfire in Nanjing"
 nesnd_south_tilt.7.d:0 "Young scholars and labourers drawn by the republicans marched through the streets of Nanjing and were stopped by Ming troops sent on the emperor's order. No one expected the emperor to side with the conservatives. He pities the noble friends who lost their privileges to the reforms. The troops fired into the crowd.\n\nIn the assembly after the bloodshed, the radicals around Chen Dongyang, dismissed but still in the capital, and Zhu Jiangchen faced the loyalists led by Zhu Zhongying, Prince of Huai. Mei Zheng, education commissioner of Guangdong, and Watanabe Kazan, who speaks for the Toyotomi of Japan, led the members from the directly ruled provinces in declaring that they would wait and see. Where the debate goes now depends on the moderate Deng Mingyu and on Hao Tingjiang of the southern office.\n\nWhatever the southern office chooses, two things are past mending. The republicans are slipping out of the empire's control, and the empire has no wish to carry the ‘republic of the people of the realm’ any further."
 nesnd_south_tilt.7.f:0 "“To stop the mouths of the people is more dangerous than to dam a river.”\n— Discourses of the States, Zhou I"
 nesnd_south_tilt.9.a:0 "Beyond the pale, only force of arms will change custom."
 nesnd_south_tilt.9.a_tt:0 "the Indochinese vassals: political balance #v −1#! a month\nthe Nanyang states: political balance #v −1#! a month\n$nesnd_lobby_name_sih$: political balance #v +1#! a month\n$nesnd_lobby_name_gng$: political balance #v +1#! a month for #v 6#! months."
 nesnd_south_tilt.9.b:0 "The lands overseas are newly settled. Go slowly."
 nesnd_south_tilt.9.b_tt:0 "$nesnd_lobby_name_phi$: political balance #v +1#! a month\n$nesnd_lobby_name_dei$: political balance #v +1#! a month\n$nesnd_lobby_name_yn1$: political balance #v +1#! a month\nthe Indochinese vassals: political balance #v +1#! a month\n$nesnd_lobby_name_sih$: political balance #v −1#! a month\n$nesnd_lobby_name_gng$: political balance #v −1#! a month for #v 6#! months."
 nesnd_south_tilt.9.t:0 "Changing the Barbarian by Chinese Ways"
 nesnd_south_tilt.9.d:0 "For years the court has argued over whether the lands overseas should be made to follow Chinese ways. To general surprise the western command, where conservatives and progressives sit side by side, is the fiercest. It would forbid native speech and custom and put down resistance by force. The republican administrators who made their careers in $nesnd_lobby_name_phi$ and the Nanyang colonies beg the court to go slowly and not to provoke the lands overseas. The delegates of Burma and the other vassal kingdoms ask only to keep their autonomy and their culture."
 nesnd_south_tilt.9.f:0 "“I have heard of using Chinese ways to change the barbarians. I have never heard of being changed by them.”\n— Mencius, Teng Wen Gong I"
 nesnd_south_tilt.1.common_tt:0 "Elections are postponed and the government cannot be reformed until the war breaks out or the matter is settled in peace. Clout and attraction of the industrialists and landowners #v +15%#!. Legitimacy is raised for a year. Liberty desire of every subject rises each month."
 nesnd_south_tilt.1.a:0 "The realm has long been governed from Hangzhou."
 nesnd_south_tilt.1.b:0 "The chief minister serves the emperor. He is no retainer of the lord of Wu."
 nesnd_south_tilt.50.t:0 "A Request for Pay"
 nesnd_south_tilt.50.d:0 "The garrison of [SCOPE.sCountry('nesnd_tilt_subject').GetName] has gone without full pay for months, and the troops are restless. Its officials have written to the Ministry of Revenue asking the court to make up the arrears, warning that if the money does not come they will have to levy it on local merchants and landowners."
 nesnd_south_tilt.50.f:0 "“…the camp has grain for half a month. We beg that funds be sent at once.”\n— the request for pay from [SCOPE.sCountry('nesnd_tilt_subject').GetName]"
 nesnd_south_tilt.50.a:0 "Pay it in full."
 nesnd_south_tilt.50.b:0 "The ministry has no money. Let them find it themselves."
 nesnd_south_tilt.51.t:0 "Whose Transit Dues"
 nesnd_south_tilt.51.d:0 "The customs houses and transit stations of [SCOPE.sCountry('nesnd_tilt_subject').GetName] bring in a good deal each year. The Ministry of Revenue wants the whole sum sent to Nanjing, while the officials of [SCOPE.sCountry('nesnd_tilt_subject').GetName] ask to keep half for local schools, roads and the garrison. The ministry answers that if every region keeps its own revenue, the court can no longer plan its spending."
 nesnd_south_tilt.51.f:0 "“When the granaries are full, people learn propriety. When food and clothing suffice, they learn honour and shame.”\n— Guanzi, Shepherding the People"
 nesnd_south_tilt.51.a:0 "Leave it with them."
 nesnd_south_tilt.51.b:0 "Send every coin to the ministry."
 nesnd_south_tilt.52.t:0 "Soldiers and Townsmen"
 nesnd_south_tilt.52.d:0 "Government troops stationed in [SCOPE.sCountry('nesnd_tilt_subject').GetName] have clashed with local people, and several are dead or wounded. The authorities of [SCOPE.sCountry('nesnd_tilt_subject').GetName] want to try the case, but the commanders refuse to hand over the officer and say the locals struck first. Both sides have sent their papers to Nanjing for the court to decide."
 nesnd_south_tilt.52.f:0 "“Bandits go through us like a comb, soldiers like a fine-tooth comb.”\n— a saying in the villages of [SCOPE.sCountry('nesnd_tilt_subject').GetName]"
 nesnd_south_tilt.52.a:0 "Punish the officer."
 nesnd_south_tilt.52.b:0 "Discipline is a matter for military law, not for the locals."
 nesnd_south_tilt.53.t:0 "Examination Quotas"
 nesnd_south_tilt.53.d:0 "The gentry of [SCOPE.sCountry('nesnd_tilt_subject').GetName] have petitioned together for more places at the local academies. Academy students are the candidates for the Assembly of Rites, so more places mean more men from [SCOPE.sCountry('nesnd_tilt_subject').GetName] can pass into the Assembly. Delegates from other provinces object, fearing that once the quotas give way, every region will press for more."
 nesnd_south_tilt.53.f:0 "“He who excels in learning should take office.”\n— Analects, Zi Zhang"
 nesnd_south_tilt.53.a:0 "Grant the increase."
 nesnd_south_tilt.53.b:0 "The quotas are fixed by statute."
 nesnd_south_tilt.54.t:0 "An Envoy in Hangzhou"
 nesnd_south_tilt.54.d:0 "The envoy of [SCOPE.sCountry('nesnd_tilt_subject').GetName] has not gone to Nanjing to pay court to the emperor. He has come straight to Hangzhou and asks to see the King of Wu. By custom an envoy goes first to Nanjing, to be presented by the Ministry of Rites. If the Southern Administration receives him with honour, it shows openly that Hangzhou can receive envoys in the court's place."
 nesnd_south_tilt.54.f:0 "“Courtesy demands that what is given be returned.”\n— Book of Rites, Qu Li I"
 nesnd_south_tilt.54.a:0 "Receive him with rich gifts."
 nesnd_south_tilt.54.b:0 "Tell him to go to Nanjing first and pay court to the emperor."
 nesnd_south_tilt.55.t:0 "The Salt Licences"
 nesnd_south_tilt.55.d:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName] asks the Ministry of Revenue to issue more salt licences for the region. The ministry fixes the number of licences, and only licensed merchants may sell government salt. More licences would bring down the price of salt in [SCOPE.sCountry('nesnd_tilt_subject').GetName], but the merchants who already hold them would lose part of their trade, and they have submitted a joint petition."
 nesnd_south_tilt.55.f:0 "“All the bustle under heaven comes for profit. All the jostling under heaven goes after profit.”\n— Records of the Historian, The Money-makers"
 nesnd_south_tilt.55.a:0 "Grant the licences."
 nesnd_south_tilt.55.b:0 "Issue licences at the existing number."
 nesnd_south_tilt.56.t:0 "Contributions for Coastal Defence"
 nesnd_south_tilt.56.d:0 "The court is strengthening its coastal defences with new warships and batteries, and the Ministry of Revenue has assessed each region by its means. The share set for [SCOPE.sCountry('nesnd_tilt_subject').GetName] is a heavy one. Its officials have written that local revenue cannot bear it and ask to be excused."
 nesnd_south_tilt.56.f:0 "“War is the great affair of the state, the ground of life and death, the way to survival or ruin. It must be studied.”\n— Sunzi, Laying Plans"
 nesnd_south_tilt.56.a:0 "Excuse them."
 nesnd_south_tilt.56.b:0 "Assess them in full."
 nesnd_south_tilt.57.t:0 "A Year of Disaster"
 nesnd_south_tilt.57.d:0 "Disaster has struck [SCOPE.sCountry('nesnd_tilt_subject').GetName]. The harvest has failed and many households have run out of food. Its officials ask to keep this year's taxes owed to the Ministry of Revenue and buy grain for the victims on the spot."
 nesnd_south_tilt.57.d_tribute:0 "Disaster has struck [SCOPE.sCountry('nesnd_tilt_subject').GetName], and many households have run out of food. [SCOPE.sCountry('nesnd_tilt_subject').GetName] has sent an envoy to Nanjing asking to be excused this year's tribute, so that the money and grain can stay at home for relief."
 nesnd_south_tilt.57.f:0 "“The people matter most, the altars of soil and grain come next, and the ruler least.”\n— Mencius, Jin Xin II"
 nesnd_south_tilt.57.a:0 "Grant the request."
 nesnd_south_tilt.57.b:0 "It must be paid as usual."
