 nesnd_south_allegiance_reason_mainland:0 "The second battle of Xiangyang destroyed Zhu Banbo, and with him the western command's means of standing up to the southern office. Since then nothing has checked Wu's encroachment. The statutes abolishing the domains came west province by province, annuities bought out the nobles' tax-free quotas and their commands, and one old domain after another became a province under the three commissions.\n\n[ROOT.GetCountry.GetName] has not forgotten whose subject it is. Its officers keep in touch in secret and wait for the day the Zheng show themselves as usurpers. But waiting has a price. Every year that passes brings the fleet and treasury of the southern office a step closer to the throne in Nanjing."
 nesnd_south_allegiance_reason_colony:0 "[ROOT.GetCountry.GetName] is a settlement colony of the court. Its troops and officials are sent from the mainland, its pay and its orders come from the southern office in Hangzhou, and its legitimacy rests on the emperor in Nanjing. Since Hangzhou dismissed the chief minister, people here have begun to reckon: if the two courts ever come to blows, can an overseas colony afford to choose wrongly even once?"
 nesnd_south_allegiance_reason_vassal:0 "The throne of [ROOT.GetCountry.GetName] rests on investiture by Wu. Its tribute, too, goes to Hangzhou. Only its envoys still travel to Nanjing. News of domains abolished on the mainland comes closer every year, and everyone here understands that whichever of the Zhu and the Zheng prevails, the next realm to be made a province may be their own."
 nesnd_south_tilt.100.d_ming:0 "The answer of [ROOT.GetCountry.GetName] has long been no secret. Since Chen Dongyang's fall its officers and officials have drawn steadily away from the Zheng, and today there is no room left to turn. The summons was torn up in public. The only question is which banner to raise: to take up arms for the Ming, to proclaim a republic outright, or to call in foreign troops for our own safety?"
 nesnd_south_tilt.100.d_neutral:0 "In three years [ROOT.GetCountry.GetName] has settled on one thing only: the blood of this change of dynasty shall not be ours. Our reply is respectful and our tribute will continue, but we will send no troops, whether to rescue the emperor or to punish rebels."
 nesnd_south_tilt.100.d_wu:0 "The memorial of [ROOT.GetCountry.GetName] was written long ago. Our trade, our offices and the pay of our garrison all hang on the southern office. To us the Zhu emperor is a name without substance, and when the Zheng replace the Ming an edict will merely record what has long been true."
 nesnd_tilt_src_concession:0 "Concession by the court"
