 bm_the_book: "Chronicles of the Northern Ming Warring States"

 flavorCNE.15.t: "Publication of Chronicles of the Northern Ming Warring States"
 flavorCNE.15.d: "Chronicles of the Northern Ming Warring States is a late-life novel by Mu Muzi, younger sister of founder Mu Zhongtang, written after the Chinese Great Revolution in the Northern Ming world. The work spans five major and ten minor volumes, 480 chapters, and nearly two million characters, with a composition period of thirty-five years. Mu Muzi departed from chaptered-serial conventions and rigid portrayals of princes and generals, drawing on the narrative strengths of classics such as Water Margin, Strange Tales, and Journey to the West to shape characters from every class and stratum of society. In a near-modern historical style, the book recounts over four centuries from the sudden death of Yongle in a 1408 hunt to the 1835 Treaty of Yangzhou and the north-south river partition. Because the work 'bears history's weight while transforming it with the spirit of fiction,' and 'tells both Chinese heroism and old-age suffering,' and is 'required reading for anyone seeking the roots of Asian modernity,' later generations ranked it among the Five Great Chinese Classics and one of the longest novels in human history."
 flavorCNE.15.f: "As Yan and Ming decline, sun and moon fade...\n- Opening verse of Chronicles of the Northern Ming Warring States"
 flavorCNE.15.1: "'Nothing brings greater suffering and fortune to humankind than history itself. Next only to that comes resisting it.'"

