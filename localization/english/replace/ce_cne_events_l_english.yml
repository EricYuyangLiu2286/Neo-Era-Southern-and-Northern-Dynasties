 flavorCNE.11.t: "Northern Chinese Court Abandons Monarchy"
 flavorCNE.11.d: "Since Mu Zhongtang became Duke of Zhou (President) and State Chancellor of the Great Han Republic in 1818, the military 'tutelary rule' built by this former Western Qin youth officer has traveled a long road. Without question, this young man - once mocked by classmates for admiring Emperor Napoleon of France - has permanently changed the course of history, or at least sharply bent its wheel under the East's Great Unification Movement he helped ignite.\n\nHis contemporaries may never know what future his slogan, 'One Shenzhou state, universal Han soil,' will truly bring. But one of his most striking creations - the Mu dynasty spanning almost all of North China - has come to its end today."
 flavorCNE.11.f: "Defeat made the defeated seem nobler still; fallen Bonaparte appeared taller than standing Napoleon.\n- Victor Hugo"
 flavorCNE.11.1: "May this change carry us into a farther age."

 flavorCNE.12.t: "Death of Mu Zhongtang"
 flavorCNE.12.d: "In 1852, Mu Zhongtang, founding emperor of the Chinese Empire, died at the Menghua detached palace outside Bianliang. He was seventy years old and posthumously honored as Gao Emperor of Hua. As one of the most successful military commanders, statesmen, and strategists in Northern Ming China, Mu built a nationalist theoretical framework of lasting influence. Applying those theories, he founded a vast empire across North China, the Northeast, and Mongolia, greatly advanced Eastern industrial modernization, and to some extent inherited and preserved the legacy of the early-19th-century Western Qin Revolution.\n\nBefore his death, Mu foresaw inner-palace struggles among princes and unrest among old intimates such as Su Hong. He entrusted his younger sister Mu Muzi to veteran general Fei Xiyi and urged her to avoid political conflict as much as possible."
 flavorCNE.12.f: "Do not forget your ancestors; cultivate their virtue. Seek to match Heaven's mandate and gain abundant blessing of your own."
 flavorCNE.12.1: "Protect the crown prince and drive back the traitors!"
 flavorCNE.12.2: "The crown prince is frail; can he secure the realm? The second prince Mu Chisheng is capable and esteemed - let him rule China."

 flavorCNE.13.t: "War of the Princes"
 flavorCNE.13.d: "After Mu Zhongtang died in early October, his eldest son Mu Chimin proclaimed himself emperor in the eastern secondary capital of Qingdao. He then rushed back to Bianliang and met key succession figures including Prince Ju Mu Chisheng, Grand Chancellor Cha Wanfang, and Central Capital Guard Hua Laishi. The next day, the new emperor summoned all Mu princes stationed across the realm to return for mourning. His true intent was unclear.\n\nOn the night of November 18, when the fifth and sixth princes Mu Chiwu and Mu Chiguang arrived, Mu Chimin suddenly died of heart illness. He named no successor, leaving only two children too young to judge right from wrong. With the throne vacant, the War of the Mu Princes erupted."
 flavorCNE.13.f: "When the ruler is young, the state uncertain, ministers unconvinced, and people distrustful - then to whom should power belong, to your son or to me?\n- Records of the Grand Historian"
 flavorCNE.13.1: "By state law, father to son. We must protect the imperial grandson."
 flavorCNE.13.2: "The south is unsettled and Western Qin still stirs. A mature ruler must be enthroned!"

 flavorCNE.14.t: "Muzi Crosses the Eastern Sea"
 flavorCNE.14.d: "Mu Muzi, younger sister of Mu Zhongtang, was nearly twenty years younger than her brother. Bright and dignified, she held steadfast loyalty. In Mu's later years she was uniquely favored: above all palace women, and often acting in his place to inspect armies and aid civilians when old Xiangyang wounds limited his mobility. Mu even assigned his capital-camp general Fei Xiyi to escort her, giving the princess great prestige. After Mu's death, she stepped forward to stabilize state affairs and stood among the foremost contributors to succession order.\n\nYet for the emperor's aunt to hold such authority over palace stability and military-civil peace inevitably reminded powerful old courtiers of Princess Taiping's precedent. In addition, many civil officials in the East Garden outside Bianliang - some nurturing more republican ideals - placed hopes in this populist noblewoman. Ultimately, veteran military elders of the Privy Council agreed to remove her and other unstable elements from decision-making by a 'gentle' method.\n\nThus, under the 'example' of retiring imperial marshal Fei Xiyi, a group of former capital-camp elders 'escorted' Mu Muzi to reside in the Eastern Continent as a long-term 'traveler.' She never returned to Mu Hua rule again."
 flavorCNE.14.f: "Parting in youth was never light; reunion in old age is sorrow still...\n- Wang Anshi, To the Lord of Chang'an"
 flavorCNE.14.1: "Your Highness, this is not my heartlessness - this is state necessity."
 flavorCNE.14.2: "Elder Fei is a pillar of the realm; he cannot simply depart."

