 flavorCNE.8.t: "Peasants Flood the Cities"
 flavorCNE.8.d: "The streets of [SCOPE.sState('cne_land_reform_peasants_in_city_state').GetName] are filling with newcomers from the countryside. Farming families have sold their land and come in search of wages. Employment brokers send them to factories and building sites, deducting recruitment and lodging charges from their pay.\n\nWorkers have accused the brokers of withholding contracts and enforcing old debts. Manufacturers fear that an inquiry will disrupt recruitment, while local gentry defend brokers linked to their own associations. The governor must decide whether to prosecute the organisations that bind workers to them or leave the disputes to ordinary civil proceedings. In these growing towns, the promise that peasants could leave their old estates and freely earn a living faces its first practical tests."
 flavorCNE.8.f: ""
 flavorCNE.8.1: "Workers' interests must be protected"
 flavorCNE.8.2: "Do not intervene in civil disputes"

