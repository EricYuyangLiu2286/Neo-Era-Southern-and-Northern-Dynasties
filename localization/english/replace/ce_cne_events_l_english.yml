 flavorCNE.2.t: "Land Reform Loses Its Way"
 flavorCNE.2.d: "As time passes and politics shift, the imperial land-rights revolution launched by founder Mu Zhongtang can no longer be pushed forward. We must accept the present condition of domestic land ownership. All related policies and decrees will be reviewed in the coming months. Measures still useful to government and the economy will be retained; those that fail review must be abolished swiftly and decisively to prevent further instability."
 flavorCNE.2.f: "The people's interests build the empire; those unable to defend them perish, however strong.\n- Mu Zhongtang, Ten Admonitions to Ministers on the Haihe Inspection"
 flavorCNE.2.1: "We admit failure and preserve the status quo."

 flavorCNE.3.t: "Victory of the Land Rights Revolution"
 flavorCNE.3.d: "Our improved land code, labor code, and family-law civil clauses have now reached every corner of the empire, establishing a new economic order. In this order, people once bound for millennia by blood-clan structures have been liberated. The elevated ridges of private estate return to their character as natural resources.\n\nAs old clan and land bonds can no longer lock peasants in place, endless streams of young, dust-covered but vigorous faces pour from the countryside into the cities. They yearn for a new life built through human intelligence and scientific power. Remnants of bloodline privilege disguise themselves in local associations to reclaim control, but police batons and the magistrate's gavel will shatter their ambition.\n\nOnce again we have brought founder Mu Zhongtang's ideal into reality. We have proven this empire was built for the interests of the Huaxia nation. For that reason, it will protect even the smallest and most helpless person's freedom to choose their own fate - now pursued in the cities, where it creates new prosperity for the empire."
 flavorCNE.3.f: "From each according to ability, by free will. The state voices the people's aspiration, and together they build the empire.\n- Cha Wanfang, Memorial on Empowering the Many as Imperial Mandate"
 flavorCNE.3.1: "Human power, expressed in changing fate, is the highest source of wealth."

