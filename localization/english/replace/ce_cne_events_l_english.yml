 flavorCNE.2.t: "Land Reform Loses Its Way"
 flavorCNE.2.d: "As time passes and politics shift, the imperial land-rights revolution launched by founder Mu Zhongtang can no longer be pushed forward. We must accept the present condition of domestic land ownership. All related policies and decrees will be reviewed in the coming months. Measures still useful to government and the economy will be retained; those that fail review must be abolished swiftly and decisively to prevent further instability."
 flavorCNE.2.f: "The people's interests build the empire; those unable to defend them perish, however strong.\n- Mu Zhongtang, Ten Admonitions to Ministers on the Haihe Inspection"
 flavorCNE.2.1: "Recognize the military estates and grant the district charters."

 flavorCNE.3.t: "Victory of the Land Rights Revolution"
 flavorCNE.3.d: "Our revised laws on land, employment and family relations have reached every corner of the Empire and established a new economic order. We have freed people from the bonds of kinship that held them for thousands of years. The fields have returned to their proper place as a natural resource.\n\nAs the old lineages and their land can no longer bind the peasantry, young faces, dusty yet full of life, stream from the countryside into the cities. They dream of a new life built through human intelligence and science. The remnants of hereditary power disguise themselves as local associations and try to regain control over them. Police batons and the magistrate’s gavel will break their ambitions.\n\nOnce more we have brought the founding emperor Mu Zhongtang’s ideals into reality. We have shown that this Empire was built for the interests of the Huaxia nation. It will protect even the weakest person’s freedom to choose a future. Those now seeking happiness in the cities are bringing new prosperity to the Empire."
 flavorCNE.3.f: "From each according to ability, by free will. The state voices the people’s aspirations; together they build the Empire. \n—Cha Wanfang, Memorial on the People’s Grant of the Imperial Mandate"
 flavorCNE.3.1: "Human power, expressed in changing fate, is the highest source of wealth."

 CNE_land_draft_debuff: "Land Rights Held by the Military Merit Bloc"
