 flavorCNE.1.t: "Advance the Land Rights Revolution"
 flavorCNE.1.d: "The ruling bloc of the Empire of China was born in the great revolutionary era barely twenty years ago. They witnessed the old military clans and their two empires ground into dust by that vast upheaval. On those ruins, new officer corps led by Mu Zhongtang rose in the people's name, cleared out corruption and radical terror. Then, he the great led the founding of our great empire upon the promise of 'equal land rights and people's governance'.\n\nEverything should have remained so...\n\nIn 1819, after founding emperor Mu Zhongtang and his military meritorious allies completed 'the land purge' across all North China, the empire replaced the republic to public acclaim. Yet the celebrated reforms were far from complete. Landlords in Liaodong and the northwest escaped punishment due to close military ties. The collapse of war bonds after the failed southern campaign of 1820-22 pushed countless small households into poverty. At this moment of peril, the founding emperor decisively revived the slogan of 'land rights revolution'. Land reorganization profits and population mobility stabilized a faltering imperial economy. But as peace endured and reforms deepened, a dark current gathered in the shadows. Vested interests in the army, the tycoons, the officials, and even old gentry stripped of surplus lands began to return. Their schemes, resentment, and desire now corrode the foundations of the imperial ideals like some deadly acid..."
 flavorCNE.1.f: "When a broad table is to be made, and the edges of planks do not fit, the artist takes a little from both, and makes a good joint.\n- Benjamin Franklin"
 flavorCNE.1.1: "The people's interests build the empire; those unable to defend them perish, however strong."

 ce_cne_land_reform: "Land Rights Revolution"
 ce_cne_land_reform_remove: "Remove Jornal #bold Land Rights Revolution#!"
 ce_cne_land_reform_reason: "This movement began with the Western Qin Great Revolution of 1810. People of the age understood it as a modern economic transformation arising among the agrarian states of the East, where powerful lineages had long dominated rural life. Through purchase or compulsory confiscation, land accumulated beyond all measure by its old owners was redistributed among a portion of the peasantry. The aim was to break the lineages’ hold over the rural population. The ruling group of the Empire of China suspended the movement during its rise to power. Around Mu Zhongtang’s southern campaign of 1820, however, he and his confidants revived it to restore the economy, free productive activity and mobilise peasants and soldiers.\n\nLand commercialisation, urbanisation and military-estate reform offer three ways to consolidate the land revolution."
 owns_3_modern_china_provinces.ce.tt: "You and your subjects #bold fully control#! at least three #bold Chinese provinces#! (for example, Shanxi Province)"

 ce_cne_land_draft_failing: "Imperial Corruption"
 ce_cne_land_draft_failing_reason: "The imperial ruling bloc is centered on the Mu military-merit aristocracy and a new stratum of rising gentry around them. Their memory of the Western Qin Great Revolution that destroyed the Qin-Yan Empire in North China remains vivid, so they were once willing to concede to lower classes for self-preservation. Yet as time passes and internal struggles deepen, both reason and fear decay. They will inevitably turn against certain progressive policies..."
 cne_landreform_failure_tracker_100: "When progress reaches #bold 100#!, the corruption journal is completed automatically"

