 ce_cne_reform_legal_system: "Doctrine of Great Unity Society"

 ce_cne_reform_limited_market_access_reason: "In the years of turbulence, wartime and social revolution created a special boom that encouraged wild local economic growth. This produced market instability and serious internal trade imbalances. It is time to reverse that trend."
 ce_cne_war_with_western_qin_reason: "The so-called 'Western Qin' regime entrenched in the Western Regions and Transoxiana occupies Huaxia land and people while continuously raiding and infiltrating our western provinces. Its existence gravely disrupts political and economic reform in the northwest. This hostile force must be destroyed or neutralized."
 ce_cne_war_with_usm_reason: "Southern pretenders were already imperial enemies in the era of founding emperor Mu Zhongtang. Military figures such as Zhu Banbo, Lin Zexu, Xiao Huli, and Lin Hanhan blocked our national army's southern unification drive, forcing temporary peace. Yet our state was founded upon unification as a national vision. So long as North and South remain divided, domestic unrest and suspicion will not cease."
 ce_cne_technology_advantage_reason: "After the failed southern campaign, many thinkers began reconsidering the meaning of our state's existence. Not only do former-regime remnants yearn for the Qin-Yan Empire, some even claim every founding institution is inferior to ancient models. In this age where republican dreams have dimmed, such reactionary currents still attract followers. To destroy this countercurrent, we must stride forward in the realm of thought."
 ce_cne_reform_legal_system_reason: "Founding emperor Mu Zhongtang carried the legacy of the Western Qin Revolution and opened the grand project of a national empire. To advance national development and civic welfare, first-generation chancellors Cha Wanfang and Zhang Baili set out the founding blueprint in Four Strategies for Building Great Unity. But this alone is not enough. To stabilize hearts, defeat poverty, and build an 'eternal empire of free will,' we must continually reform imperial politics itself - turn our efforts and ideas into law, and carve them into stone."

