 flavorCNE.4.t: "The Petition of Ten Thousand People"
 flavorCNE.4.d: "Land rights revolution is economic reform, but also a harsh political movement. It transfers wealth stolen for millennia by an old social order into the hands of a new elite born only decades ago. Such a process cannot end through monetary redemption alone. It inevitably involves legal pursuit, fraud, repeated contestation, betrayal by executors, and even brutal violence.\n\nThis process enrages local gentry and frightens socially undecided middle strata. The latter are easily rallied by the former and turned into their vanguard."
 flavorCNE.4.f: "Heavenly slaughter leaves no escape; earth's sweep gives no refuge. At year's end, with only tiny savings left, how can officials bear to take them?"
 flavorCNE.4.1: "Nonsense - no need to worry."
 flavorCNE.4.2: "The tide is fierce; we should avoid its edge for now."

 CNE_land_related_uprising: "Land Rights Conflict"

 flavorCNE.5.t: "Flurries in the Wind"
 flavorCNE.5.d: "Soldiers have lives and families. Many are younger sons of clans once expected to rise; some are destitute men cast out by those clans, hoping army life can change their fate. The latter have been overzealous in the movement, while the former often became obstacles.\n\nRecently we received reports that grassroots officers colluded with local gentry. Most had received letters from home saying their clans' lands were declared illegal or forcibly redeemed by government. They organized and acted with military discipline and efficiency. Local politics turned unstable and the impact was severe."
 flavorCNE.5.f: ""
 flavorCNE.5.1: "Time to raise their pay."
 flavorCNE.5.2: "What can they do, overturn heaven itself?"

 CNE_appease_army_je: "Appease Officers' Families"

 flavorCNE.6.t: "Mass Arrest Scandal"
 flavorCNE.6.d: "Land commissioners in [SCOPE.sState('cne_land_reform_mess_imprisonment_state').GetName] have arrested villagers who drafted petitions over disputed titles and placed them in military custody for concealing property. Officers widened the arrests to local gentry, teachers and clerks who kept the old deeds.\n\nThe new law empowers officials to settle land ownership, but also permits farmers to defend their property. The prisoners' families have taken their deeds to the provincial capital, and the governor has referred the case to the Ministry of Justice. The commissioners warn of collusion and unrest and ask the Ministry of War to protect the officers involved. Transferring a few officials would allow the affair to pass quietly. A prosecution would make the reform's own agents answer for crimes committed in its name."
 flavorCNE.6.f: ""
 flavorCNE.6.1: "Simply transfer the officials involved"
 flavorCNE.6.2: "Punish all responsible parties"

 flavorCNE.7.t: "Support from Industry"
 flavorCNE.7.d: "Manufacturers and merchants in [SCOPE.sState('cne_land_reform_industrialists_support_state').GetName] have jointly offered to finance land reform. Workshops are expanding and more carts travel the commercial roads. They want the new law to allow farming families to move freely and bring more workers into the towns.\n\nTheir representatives also seek to submit proposals on land, roads and employment contracts through the Consultative Council. The governor is willing to accept the funding. Officials in the Ministry of Revenue argue that these wealthy men understand industry and could take a greater part in government. The rising manufacturers hope to gain a position in imperial affairs commensurate with their wealth."
 flavorCNE.7.f: ""
 flavorCNE.7.1: "Accept their gifts"
 flavorCNE.7.2: "Corporate influence is the real gift"

