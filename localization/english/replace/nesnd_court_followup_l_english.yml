l_english:
 character_role_nesnd_ming_refuge:0 "Ming Royal"
 character_role_nesnd_ming_refuge_desc:0 "A surviving member of the Ming dynasty during the southern succession."
 character_role_nesnd_ming_patron:0 "Court Protector"
 character_role_nesnd_ming_patron_desc:0 "A former local ruler supporting the provisional Ming court."
 character_role_nesnd_ming_fanwang:0 "Ming Prince"
 character_role_nesnd_ming_fanwang_desc:0 "A Ming emperor stripped of the imperial title, who remains in his former court as a noble."
 nesnd_ming_court_refused:0 "Emperor Turned Away"
 nesnd_ming_court_refused_desc:0 "We refused to receive the emperor from the court in exile, and he has been reduced to a prince."
 nesnd_ming_court_reunion_emperor_tt:0 "This country is still ruled by a Ming emperor"
 nesnd_ming_court_reunion_not_done_tt:0 "The question of receiving the emperor has not been settled"
 nesnd_court_followup.20.t:0 "Receiving the Emperor"
 nesnd_court_followup.20.d:0 "The southern government has fallen and [ROOT.GetCountry.GetName] now holds Nanjing. Yet [SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName] still holds court in [SCOPE.sCountry('nesnd_reunion_court').GetName]. The court in exile, set up in wartime to keep the Ming house alive, has become a second Ming court standing beside Nanjing.\n\nThe southern provinces and the overseas states are waiting for our answer: send envoys and bring the emperor back to the capital, or refuse him and leave the court in exile to reduce him to a prince."
 nesnd_court_followup.20.f:0 "'There are not two suns in the sky, nor two kings over the people.'\n- Mencius, Wan Zhang I"
 nesnd_court_followup.20.a:0 "Send envoys and bring the emperor back to the capital."
 nesnd_court_followup.20.a_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName] moves to our country, together with any Ming heir at the court in exile. If we are a monarchy, the emperor becomes our ruler. Otherwise he lives here as a member of the Ming royal house.\n[SCOPE.sCountry('nesnd_reunion_court').GetName] is no longer the Ming court in exile, and its former local leader, if still alive, rules again."
 nesnd_court_followup.20.b:0 "Nanjing will not receive the emperor from the court in exile."
 nesnd_court_followup.20.b_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName] is reduced to a Ming prince and remains in [SCOPE.sCountry('nesnd_reunion_court').GetName] as a noble.\n[SCOPE.sCountry('nesnd_reunion_court').GetName] is no longer the Ming court in exile, and its former local leader, if still alive, rules again."
 nesnd_court_followup.21.t:0 "The Question of the Emperor"
 nesnd_court_followup.21.d_received:0 "[SCOPE.sCountry('nesnd_reunion_successor').GetName] has sent envoys to bring [SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName] back to Nanjing. The court in exile has been dissolved. [ROOT.GetCountry.GetName] is no longer the seat of the Ming court, and [ROOT.GetCountry.GetRuler.GetFullName] now governs the country."
 nesnd_court_followup.21.d_refused:0 "[SCOPE.sCountry('nesnd_reunion_successor').GetName] has refused to receive [SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]. Nanjing does not recognise the emperor of the court in exile, and the court has been dissolved. [SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName] has been reduced to a Ming prince and remains in [ROOT.GetCountry.GetName], which [ROOT.GetCountry.GetRuler.GetFullName] now governs."
 nesnd_court_followup.21.a:0 "So be it."
 nesnd_court_followup.21.a_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName] has moved to [SCOPE.sCountry('nesnd_reunion_successor').GetName]. We are no longer the Ming court in exile."
 nesnd_court_followup.21.b_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName] has been reduced to a Ming prince and remains here as a noble. We are no longer the Ming court in exile."
