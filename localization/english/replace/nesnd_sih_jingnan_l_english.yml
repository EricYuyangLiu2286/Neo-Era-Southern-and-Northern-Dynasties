l_english:
 Xinghua:0 "Xinghua"

 nesnd_sih_jingnan.1.t:0 "Who Holds Chengdu"
 nesnd_sih_jingnan.1.d:0 "The Jingnan War has turned against us, and the provincial government must decide who directs it.\n\nThe conservatives around Liu Zhongming, Prince of Shu, have begun to discuss submitting to the Wu court in order to keep Chengdu. The veteran general Xiao Huli still commands the northern garrisons and wants to hold the passes. The younger officers back Wei Jian. To them, submission would betray the rising, and they demand that Wei Jian take over the government."
 nesnd_sih_jingnan.1.a:0 "The Prince and Xiao Huli remain in charge."
 nesnd_sih_jingnan.1.a_tt:0 "Liu Zhongming and Xiao Huli continue to govern. The court must then decide whether to submit to Wu."
 nesnd_sih_jingnan.1.b:0 "Back Wei Jian."
 nesnd_sih_jingnan.wei_seizes_tt:0 "The former Prince of Shu flees Chengdu by boat overnight with his household and a few conservatives, and goes into exile. Wei Jian becomes Prince of Shu and takes over the government."
 nesnd_sih_jingnan.rally_tt:0 "For #v 6#! months, losing our capital or most of our land will not end our country.\nIf Chengdu is occupied, it is retaken at once. Otherwise another occupied state is retaken. #v 20#! battalions of regular line infantry are raised in the retaken state, or in Chengdu if no state can be retaken."

 nesnd_sih_jingnan.2.t:0 "Terms of Submission"
 nesnd_sih_jingnan.2.d:0 "The Prince of Shu summons his court. The conservatives' terms: every prefecture outside Chengdu is handed to [SCOPE.sCountry('nesnd_sih_wu').GetName], and Shu keeps Chengdu as a vassal of [SCOPE.sCountry('nesnd_sih_wu').GetName].\n\nXiao Huli opposes submission and wants to keep holding the passes."
 nesnd_sih_jingnan.2.a:0 "Submit to the Wu court."
 nesnd_sih_jingnan.surrender_tt:0 "Every state of ours except Chengdu passes to [SCOPE.sCountry('nesnd_sih_wu').GetName] and is #bold incorporated#! at once.\nWe become a dominion of [SCOPE.sCountry('nesnd_sih_wu').GetName] and leave the anti-Wu side.\nWei Jian, Xiao Huli and Xiao Xinghua each have a #v 65%#! chance to flee, a #r 30%#! chance to be killed and a #v 5%#! chance to submit with the court."
 nesnd_sih_jingnan.2.b:0 "Xiao Huli fights on."

 nesnd_sih_jingnan.3.t:0 "The Officers After the Surrender"
 nesnd_sih_jingnan.3.d:0 "Shu has submitted to [SCOPE.sCountry('nesnd_sih_wu').GetName], and every prefecture outside Chengdu has been handed over. News of what became of the rising's officers reaches Chengdu."
 nesnd_sih_jingnan.3.a:0 "Gather what remains."
 nesnd_sih_jingnan.3.wei_jian_fled:0 "Wei Jian has fled into exile."
 nesnd_sih_jingnan.3.wei_jian_killed:0 "Wei Jian has been killed."
 nesnd_sih_jingnan.3.wei_jian_stayed:0 "Wei Jian has submitted with the court and remains in Chengdu."
 nesnd_sih_jingnan.3.xiao_huli_fled:0 "Xiao Huli has fled into exile."
 nesnd_sih_jingnan.3.xiao_huli_killed:0 "Xiao Huli has been killed."
 nesnd_sih_jingnan.3.xiao_huli_stayed:0 "Xiao Huli has submitted with the court and remains in Chengdu."
 nesnd_sih_jingnan.3.xiao_xinghua_fled:0 "Xiao Xinghua has fled into exile."
 nesnd_sih_jingnan.3.xiao_xinghua_killed:0 "Xiao Xinghua has been killed."
 nesnd_sih_jingnan.3.xiao_xinghua_stayed:0 "Xiao Xinghua has submitted with the court and remains in Chengdu."

 nesnd_sih_jingnan.4.t:0 "A Throne Taken With Foreign Backing"
 nesnd_sih_jingnan.4.d:0 "Shu had already submitted to [SCOPE.sCountry('nesnd_sih_patron').GetName]. As the Jingnan War turns against us, Wei Jian uses our overlord's support to stage a mutiny and seize the government."
 nesnd_sih_jingnan.4.a:0 "Wei Jian takes the throne."

 nesnd_sih_jingnan.10.t:0 "Vassals of the New Dynasty"
 nesnd_sih_jingnan.10.d:0 "The army of Shu has entered Nanjing, the Wu court has fallen and [SCOPE.sCountry('nesnd_han_overlord').GetName] has been proclaimed. We were a vassal of the Wu court. Now our overlord has a new name and a new sovereign.\n\nSome at court would keep our allegiance. Others would break with the new dynasty while it is still finding its feet."
 nesnd_sih_jingnan.10.a:0 "Keep our allegiance."
 nesnd_sih_jingnan.10.a_tt:0 "We remain a subject of [SCOPE.sCountry('nesnd_han_overlord').GetName]."
 nesnd_sih_jingnan.10.b:0 "Break with the new dynasty."

 nesnd_sih_jingnan.20.t:0 "The South Made Whole"
 nesnd_sih_jingnan.20.d:0 "All twenty-six states once held by the Ming court and the domains of Shu, Chu and Huai now belong to [ROOT.GetCountry.GetName] or its vassals. The division of the south that began with the Jingnan War is over."
 nesnd_sih_jingnan.20.a:0 "The south is settled."

 nesnd_sih_xiao_holds:0 "Xiao Huli Holds the Passes"
 nesnd_sih_wei_rules:0 "Wei Jian's Government"
 nesnd_south_unified:0 "The South Made Whole"

 nesnd_postwar_great_han_wei_option:0 "Raise Wei Jian to the throne of Great Han."
 nesnd_postwar_great_han_wei_tt:0 "Adopt the name Great Han, with Wei Jian as emperor. If Liu Zhongming is still at court, he will die in an 'accident'."
 nesnd_great_han_mutual_claims_tt:0 "We and [SCOPE.sCountry('usm_rebel_winner').GetName] each claim all of the other's territory."

 nesnd_unify_south:0 "Unify the South"
 nesnd_unify_south_reason:0 "The Jingnan War is over, yet the twenty-six states once held by the Ming court and the domains of Shu, Chu and Huai remain divided between several governments. The south will be whole again only when we or our vassals hold all twenty-six."
 nesnd_unify_south_goal_tt:0 "We and our subjects fully own all #v 26#! target states (Taiwan included, Tonkin and overseas states excluded)"
 nesnd_unify_south_reward_tt:0 "For #v 15#! years: authority #g +20%#!, prestige #g +20%#!, bureaucracy #g +15%#!, devastation decay #g +50%#!."
 nesnd_unify_south_bar:0 "States of the South"
 nesnd_unify_south_bar_readout:0 "$nesnd_unify_south_bar$: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 26#!"
 nesnd_unify_south_bar_change:0 "Change in states held"

 nesnd_restore_ming:0 "Rebuild the Ming"
 nesnd_restore_ming_desc:0 "Since the Jingnan War, the south has had no Ming court. Holding Nanjing or much of the south, we can enthrone a prince of the Zhu house and call on the Ming loyalists to rebuild the Ming."
 nesnd_restore_ming_tt:0 "We become the seat of the Ming court and found the Ming Federation. A living prince of the Zhu house is enthroned, and the other loyalist countries either submit or refuse."
 nesnd_restore_ming_no_court_tt:0 "No other Ming court exists"
 nesnd_restore_ming_no_wu_tt:0 "The Wu court no longer exists"
 nesnd_restore_ming_stalemate_tt:0 "The Jingnan War is over and the twenty-six southern states are not yet united"
 nesnd_restore_ming_core_tt:0 "Fully own Nanjing, or own land in at least #v 8#! of the twenty-six southern states"
