l_english:
 ideology_ce_qin_royalist_leader: "Qin Institutional Royalist"
 ideology_ce_qin_royalist_leader_desc: "#lore This leader believes that the state and all its people should form an efficient, unified, and egalitarian collective order. They oppose uncontrolled movement of wealth, capital, and industry, and generally support a powerful political family as hereditary head of state!"
 
 ideology_ce_qin_royalist: "Qin Institutional Royalist"
 ideology_ce_qin_royalist_desc: "#lore This group believes that the state and all its citizens should form an efficient, unified, and egalitarian collective order. It views the military and its affiliated institutions as the core organs of such a state, and seeks to fully integrate many social functions - basic education, medical security, elite bureaucratic training, and moral instruction - into that structure!"
 
 ideology_ce_feixiyism: "Feixiyi-ist"
 ideology_ce_feixiyism_desc: "#lore This group believes that the state and all its citizens should form an efficient, unified, and egalitarian collective order. It views the military and its affiliated institutions as the core organs of such a state, and seeks to fully integrate many social functions - basic education, medical security, elite bureaucratic training, and moral instruction - into that structure!"
