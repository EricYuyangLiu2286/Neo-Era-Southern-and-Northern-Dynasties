l_english:
 nesnd_tenasserim_recovery:0 "Livelihoods in Tenasserim"
 nesnd_tenasserim_recovery_reason:0 "Dye shipments connect the southern plantations to the imperial market. Rent, advances and debt bind many village households to that trade. New paid work and viable smallholdings will determine whether the interior can sustain its own customers and savings."
 nesnd_ten_status_sampling:0 "Local officials are reporting on employment and livelihoods over the first three months. Logging commissions and legislation may proceed in the meantime."
 nesnd_ten_status_war:0 "War has interrupted the recovery. Ports, shipping and access to markets must be restored."
 nesnd_ten_status_bankruptcy:0 "An active [concept_bankruptcy] penalty interrupts consolidation."
 nesnd_ten_status_access:0 "Local market access is below 85%."
 nesnd_ten_status_working_hungry:0 "Many hungry workers already have jobs. Review household income, rent, taxation and food prices."
 nesnd_ten_status_jobs:0 "Unemployed workforce exceeds 12%. Check existing vacancies, wages and qualifications."
 nesnd_ten_status_income:0 "Employment has improved, but household livelihoods remain below the target."
 nesnd_ten_status_review:0 "Local livelihoods are recovering. At least one industry that does not use arable land must also reach 75% staffing."
 nesnd_ten_conditions_bar:0 "Local livelihood conditions"
 nesnd_ten_conditions_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_ten_conditions_bar_detail:0 "Unemployed workforce: #v [Country.MakeScope.Var('nesnd_ten_unemployment').GetValue|%1]#!\nWorkforce below the starvation threshold: #v [Country.MakeScope.Var('nesnd_ten_starving').GetValue|%1]#!\nEmployed and below the starvation threshold: #v [Country.MakeScope.Var('nesnd_ten_working_hungry').GetValue|%1]#!\nWorkforce household [concept_sol]: #v [Country.MakeScope.Var('nesnd_ten_sol').GetValue|1]#!\n[concept_market_access]: #v [Country.MakeScope.Var('nesnd_ten_access').GetValue|%1]#!\n\nRequirements: unemployment at most #v 12%#!; at most #v 25%#! below the starvation threshold and living standards of at least #v 6.5#!; market access of at least #v 85%#!; peace and no active [concept_bankruptcy] penalty. Shares are calculated from the workforce in our part of Tenasserim and updated monthly. Subsistence farmers count as employed."
 nesnd_ten_continuity_bar:0 "Consolidation"
 nesnd_ten_continuity_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 6 months#!"
 nesnd_ten_continuity_bar_detail:0 "After the first three months of local reports, gain #p 1#! per month with all four livelihood requirements met and at least one logging camp, fishery, iron mine, tooling workshop, textile mill or food industry #v 75%#! staffed without input shortages. A failure resets the consecutive-month count. Completion grants #p +10%#! qualifications gain locally for #v 24 months#!.\n\nNational institutional reform proceeds through $je_reform_indies$."
 nesnd_ten_build_button:0 "Commission a logging camp"
 nesnd_ten_build_button_desc:0 "Commission a logging camp to provide paid work without taking arable land.\n\nEach commission queues #v 1 level#! of government construction, up to #v 2 commissions#! at least #v 6 months#! apart. Any existing logging camp must be #v 75%#! staffed without input shortages. Wood must sell for at least #v 50%#! of its base price, the treasury must hold #v £5,000#!, and local capacity must permit construction. Normal construction and treasury costs apply. Simple forestry can be used where tools or trained machinists are scarce."
 nesnd_ten_build_result_tt:0 "Queue one logging-camp level in Tenasserim. Normal construction costs apply; completion and hiring occur through the economy."
 nesnd_ten_train_button:0 "Fund practical instruction"
 nesnd_ten_train_button_desc:0 "Pay 2.5% of weekly total income, minimum £1,000 (estimated £[Country.MakeScope.Var('nesnd_ten_training_quote').GetValue|0]). Local qualifications +10% for 12 months; 12-month cooldown. Requires an existing nonfarm vacancy. Laws and household conditions still govern qualification eligibility."
 nesnd_ten_tenant_button:0 "Propose tenant contracts"
 nesnd_ten_tenant_button_desc:0 "Replace serfs’ personal dependence with tenancy, allowing farmers to plan their livelihoods after paying rent.\n\nBegin enacting Tenant Farmers. The law must be enactable and supported by an interest group in government or a political movement with at least #v 10%#! support. Enactment chance must be at least #v 15%#! and legitimacy at least #v 25#!, with no other law being enacted, war or revolution."
 nesnd_ten_abolish_button:0 "Propose emancipation"
 nesnd_ten_abolish_button_desc:0 "Abolish slavery so that workers can no longer be held as another person’s property.\n\nOnce serfdom has ended, local unemployment must be at most #v 15%#! and three months of local reports must be available. The support, enactment-chance and legitimacy requirements are the same as for Tenant Farmers. Emancipation takes effect when the law passes."
 nesnd_ten_compromise_button:0 "Negotiate landowner compensation"
 nesnd_ten_compromise_button_desc:0 "During tenant or abolition enactment, pay 25% of weekly income, minimum £5,000 (estimated £[Country.MakeScope.Var('nesnd_ten_compromise_quote').GetValue|0]). Requires landowner clout of 20%. Landowner approval +3 for 24 months; 24-month cooldown. No change to law stance or enactment chance."
 nesnd_ten_dismiss_button:0 "End the special programme"
 nesnd_ten_dismiss_button_desc:0 "Return the programme’s duties to the existing administration and merchants, ending its special instruction. The programme can reopen after one year."
 nesnd_ten_dismiss_tt:0 "End the programme and withdraw its practical instruction. It may reopen after one year. Queued construction, ongoing legislation and compensation already paid remain in effect; previous commissions and rewards still count."
 nesnd_ten_continue_tt:0 "Continue the Tenasserim programme with its existing construction, legislation and funding arrangements."
 nesnd_ten_reopen:0 "Reopen the Tenasserim programme"
 nesnd_ten_reopen_desc:0 "Resume efforts to improve employment and rural livelihoods in Tenasserim. Previous commissions still count towards the limit, and the period of recovery begins again."
 nesnd_ten_training:0 "Practical Instruction"
 nesnd_ten_recovery_skills:0 "Local Craft Instruction"
 nesnd_ten_landowners_compromise:0 "Landowner Compensation"
 nesnd_tenasserim.1.t:0 "Rent and Interest"
 nesnd_tenasserim.1.d:0 "The Tenasserim programme has run into difficulty. Logging camps and workshops need employers able to pay wages; villagers need tenancy and credit arrangements that leave them a livelihood. The practical instruction provided by the authorities also requires sustained funding.\n\nThe government must decide whether to keep committing resources or return these responsibilities to the existing administration and merchants."
 nesnd_tenasserim.1.a:0 "Continue the review."
 nesnd_tenasserim.1.b:0 "Return it to local management."
 nesnd_tenasserim.2.t:0 "Villages and Markets"
 nesnd_tenasserim.2.d:0 "Paid work is bringing money back to the villages of Tenasserim. Household purchases support the local market, and fewer residents have lost their livelihoods. Provincial authorities will continue practical instruction for two years as these new trades take root."
 nesnd_tenasserim.2.a:0 "Let these livelihoods take root."
