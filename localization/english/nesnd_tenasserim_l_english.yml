l_english:
 nesnd_tenasserim_recovery:0 "Livelihoods in Tenasserim"
 nesnd_tenasserim_recovery_reason:0 "Dye shipments connect the southern plantations to the imperial market. Rent, advances and debt bind many village households to that trade. New paid work and viable smallholdings will determine whether the interior can sustain its own customers and savings."
 nesnd_ten_status_sampling:0 "Collecting the first three monthly observations."
 nesnd_ten_status_war:0 "Consolidation is interrupted by war. Review the port and market access."
 nesnd_ten_status_bankruptcy:0 "Bankruptcy interrupts consolidation."
 nesnd_ten_status_access:0 "Local market access is below 85%."
 nesnd_ten_status_working_hungry:0 "Many hungry workers already have jobs. Review household income, rent, taxation and food prices."
 nesnd_ten_status_jobs:0 "Unemployed workforce exceeds 12%. Check existing vacancies, wages and qualifications."
 nesnd_ten_status_income:0 "Employment has improved, but household livelihoods remain below the target."
 nesnd_ten_status_review:0 "Continue monitoring; a non-arable industry must also reach 75% occupancy."
 nesnd_ten_conditions_bar:0 "Local livelihood conditions"
 nesnd_ten_conditions_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_ten_conditions_bar_detail:0 "Unemployed workforce: #v [Country.MakeScope.Var('nesnd_ten_unemployment').GetValue|%1]#!\nHungry workforce: #v [Country.MakeScope.Var('nesnd_ten_starving').GetValue|%1]#!\nEmployed and hungry: #v [Country.MakeScope.Var('nesnd_ten_working_hungry').GetValue|%1]#!\nWorkforce-weighted living standards: #v [Country.MakeScope.Var('nesnd_ten_sol').GetValue|1]#!\nMarket access: #v [Country.MakeScope.Var('nesnd_ten_access').GetValue|%1]#!\n\nTargets: unemployment <=12%; hunger <=25% and living standards >=6.5; access >=85%; peace and no bankruptcy. Workforce shares are refreshed monthly. Subsistence farmers are employed."
 nesnd_ten_continuity_bar:0 "Consolidation"
 nesnd_ten_continuity_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 6 months#!"
 nesnd_ten_continuity_bar_detail:0 "After three samples, meet all four conditions and keep a logging camp, fishery, iron mine, tooling workshop, textile mill or food industry at 75% occupancy without an input shortage for six consecutive months. Interruption resets the streak. Completion grants local qualifications +10% for 24 months. National reform continues separately."
 nesnd_ten_build_button:0 "Commission a logging camp"
 nesnd_ten_build_button_desc:0 "Queue one level of government construction, at normal construction and treasury cost. At most two commissions, six months apart. Existing logging must reach 75% occupancy with no input shortage before expansion; market wood price must be at least 50% of base, reserves at least £5,000, and actual capacity available. Check production methods after creation; simple forestry avoids tool and machinist requirements."
 nesnd_ten_build_result_tt:0 "Queue one logging-camp level in Tenasserim. Normal construction costs apply; completion and hiring occur through the economy."
 nesnd_ten_train_button:0 "Fund practical instruction"
 nesnd_ten_train_button_desc:0 "Pay 2.5% of weekly total income, minimum £1,000 (estimated £[Country.MakeScope.Var('nesnd_ten_training_quote').GetValue|0]). Local qualifications +10% for 12 months; 12-month cooldown. Requires an existing nonfarm vacancy. Laws and household conditions still govern qualification eligibility."
 nesnd_ten_tenant_button:0 "Propose tenant contracts"
 nesnd_ten_tenant_button_desc:0 "Begin normal Tenant Farmers enactment only if legally enactable, supported by a government interest group or a movement with 10% support, with at least 15% enactment chance and 25 legitimacy. No other enactment, war or revolution may be active."
 nesnd_ten_abolish_button:0 "Propose emancipation"
 nesnd_ten_abolish_button_desc:0 "After serfdom ends and local unemployment is at most 15%, begin normal slavery abolition with the same support and legitimacy requirements. At least three monthly samples are required. Enactment must actually pass."
 nesnd_ten_compromise_button:0 "Negotiate landowner compensation"
 nesnd_ten_compromise_button_desc:0 "During tenant or abolition enactment, pay 25% of weekly income, minimum £5,000 (estimated £[Country.MakeScope.Var('nesnd_ten_compromise_quote').GetValue|0]). Requires landowner clout of 20%. Landowner approval +3 for 24 months; 24-month cooldown. No change to law stance or enactment chance."
 nesnd_ten_dismiss_button:0 "End the special programme"
 nesnd_ten_dismiss_button_desc:0 "Return responsibility to existing local authorities. The programme can reopen after one year."
 nesnd_ten_dismiss_tt:0 "Remove this journal and its instructional grant. Normal construction, enactment and paid compensation continue. Reopening after one year does not reset commissions or rewards."
 nesnd_ten_continue_tt:0 "Continue reviewing existing investments, laws and local livelihoods. No free land, buildings or subsidy is added."
 nesnd_ten_reopen:0 "Reopen the Tenasserim programme"
 nesnd_ten_reopen_desc:0 "Resume observation and restart the consolidation streak. Prior commission records remain."
 nesnd_ten_training:0 "Practical Instruction"
 nesnd_ten_recovery_skills:0 "Local Craft Instruction"
 nesnd_ten_landowners_compromise:0 "Landowner Compensation"
 nesnd_tenasserim.1.t:0 "Rent and Interest"
 nesnd_tenasserim.1.d:0 "Village accounts have reached the provincial capital. Families work their rice fields throughout the year, then settle rent, seed advances and interest. Ships still carry plantation exports away while many households lack the money for food. Officials must review recruitment, tenancy and the funds available to sustain the programme."
 nesnd_tenasserim.1.a:0 "Continue the review."
 nesnd_tenasserim.1.b:0 "Return it to local management."
 nesnd_tenasserim.2.t:0 "Villages and Markets"
 nesnd_tenasserim.2.d:0 "Paid work is bringing money back to the villages of Tenasserim. Household purchases support the local market, and fewer residents have lost their livelihoods. Provincial authorities will continue practical instruction for two years as these new trades take root."
 nesnd_tenasserim.2.a:0 "Let these livelihoods take root."
