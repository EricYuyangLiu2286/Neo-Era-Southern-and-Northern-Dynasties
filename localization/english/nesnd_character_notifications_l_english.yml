l_english:
 nesnd_jingyin_departure_title:0 "The Prince of Huai Takes the Throne"
 nesnd_jingyin_departure_desc:0 "News of the accession has reached [ROOT.GetCountry.GetName]. #bold [SCOPE.sCharacter('nesnd_jingyin_claimant').GetFullName]#! has received the ministers’ support and left for [SCOPE.sCountry('new_jingyin_owner').GetCapital.GetName] to take charge of government. Officials at the former residence must complete the handover, while those accompanying the new ruler will serve at the new court."
 nesnd_jingyin_departure_tt:0 "#bold [SCOPE.sCharacter('nesnd_jingyin_claimant').GetFullName]#! now rules [SCOPE.sCountry('new_jingyin_owner').GetName]. [ROOT.GetCountry.GetName] gains #bold $USM_benifit_of_an_emperor$#! for #v 10 years#!."
