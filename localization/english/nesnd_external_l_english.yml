l_english:
 nesnd_external_choose_wu:0 "Contact the Wu Government"
 nesnd_external_choose_sih:0 "Contact Sichuan"
 nesnd_external_choose_hus:0 "Send Republican Envoys to Dongzhou"
 nesnd_external_choose_fra:0 "Write to France"
 nesnd_external_hus_title:0 "A Letter from Across the Sea"
 nesnd_external_hus_desc:0 "News of the Southern succession has reached Dongzhou. The Zheng maritime empire that we fought for independence is again divided over who should rule it. Its opponents may seek support from our republic, while merchants watch for changes to the ports and routes on which they depend.\n\nWe can pursue those openings, but assistance abroad will draw on our own treasury and industry. The government must decide which relationships serve the republic and which commitments it can sustain."
 nesnd_external_fra_title:0 "Between Two Seas"
 nesnd_external_fra_desc:0 "Southern envoys seek recognition and the continuation of old agreements, while India remains divided by disputes over the southern coast. French merchants, creditors and officers have interests in both regions. The government must decide whom to support and how far its money and arms should follow its diplomacy."
 nesnd_external_qe1_title:0 "The Mountains of Bashu"
 nesnd_external_qe1_desc:0 "Caravans from Sichuan have brought news of the Southern dispute. Since the defeat at Dunhuang, Western Qin has had to consider its military strength and finances carefully. Renewed war in the east would make the roads through Bashu more important to trade and security alike. We should decide whether to cultivate Sichuan, support the anti-Wu coalition, or keep our resources at home."
 nesnd_external_sha_title:0 "Dispatches in the Snow"
 nesnd_external_sha_desc:0 "News of the Southern succession has reached the northern republic. Exiles recognise familiar names among those now disputing power, and some are already seeking contacts in Dongzhou. A friendly republic might supply funds or arms, but our government must decide what help it needs and what relationship it can sustain."
 nesnd_external_bur_title:0 "The River Mouth and the Court"
 nesnd_external_bur_desc:0 "The Southern succession may alter the court’s dealings with a powerful neighbour. Trade along the rivers and the obligations inherited from existing treaties remain immediate concerns. Before committing money or arms to either side, we must consider our own status and which government can best protect our interests."
 nesnd_external_mug_title:0 "The Southern Coast"
 nesnd_external_mug_desc:0 "The Southern succession offers another opening to raise our claims on the Indian coast. Ming possessions in Mysore and the arrangements of coastal traders remain sources of contention. Our ministers may seek French assistance in money or arms; if Southern rule still holds land in Mysore, we can also press our territorial claim."
 nesnd_external_gbr_title:0 "After the Blockade"
 nesnd_external_gbr_desc:0 "The old alliance between France and Ming placed heavy pressure on British trade routes. A disputed succession in the Southern realm may create openings for commerce and diplomacy. Merchants seek access to its ports, while the government weighs the expense of supporting a foreign partner."
 nesnd_external_rus_title:0 "Dispatches from the East"
 nesnd_external_rus_desc:0 "Russia’s long eastern frontier gives the Southern dispute consequences far beyond its place of origin. A reliable trading partner or a government willing to accept our support might strengthen our position. We may wait for the outcome, or commit funds and arms while the rivals still need foreign friends."
 nesnd_external_policy:0 "Diplomacy in the Southern Crisis"
 nesnd_external_policy_reason:0 "The Southern succession has placed old treaties, trade routes and overseas dependencies in question. Our government must choose which relationships to cultivate and whether to offer assistance or seek it from abroad. Existing agreements continue to bind their parties while new proposals are negotiated."
 nesnd_external_follow:0 "Prepare our response and make further enquiries."
 nesnd_external_decline:0 "Attend to our own affairs first."
 nesnd_external_choose_desc:0 "Choose a diplomatic partner. Existing treaties remain in force. Only one aid agreement can be concluded through this crisis."
 nesnd_external_choose_opposition:0 "Contact the Anti-Wu Leader"
 nesnd_external_choose_opposition_desc:0 "An anti-Wu coalition leader must exist. Our country must be independent and at peace with that government. Funds or arms require a separate proposal."
 nesnd_external_offer_money:0 "Provide Military Funds"
 nesnd_external_offer_money_desc:0 "Offer a transfer of @money!#v 500#! per week, binding for #v 1 year#!. This requires #v 26,000#! in reserves, fixed net income of at least #v 5,000#!, total net income of at least #v 1,000#! and eligibility to sign the treaty. The other government may refuse. The transfer continues after the binding period until withdrawn or renegotiated."
 nesnd_external_offer_arms:0 "Negotiate Arms Deliveries"
 nesnd_external_offer_arms_desc:0 "Offer a transfer of #v 10#! small arms, binding for #v 1 year#!. Our supply, prices, export allowance and transport must permit it. The other government may refuse; shortages or transport difficulties can suspend deliveries."
 nesnd_external_request_tt:0 "Our envoy will present the request in #v 7 days#!. No funds or goods are transferred before acceptance."
 nesnd_external_status_choose:0 "Select a partner, then consider the available terms."
 nesnd_external_status_selected:0 "Partner: #bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#!. The proposed funds and arms are shown in the relevant offers."
 nesnd_external_status_pending:0 "Our envoy awaits a reply. An unsigned request may still be withdrawn."
 nesnd_external_status_committed:0 "The treaty has been signed. Its fulfilment, suspension and withdrawal terms are available in the treaty interface."
 nesnd_external_money_title:0 "An Offer of Funds"
 nesnd_external_money_desc:0 "The envoy from [SCOPE.sCountry('nesnd_external_requester').GetName] offers @money!#v 500#! each week under a treaty binding for #v 1 year#!. Acceptance would establish the transfer between our treasuries."
 nesnd_external_arms_title:0 "An Offer of Arms"
 nesnd_external_arms_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName] offers a transfer of #v 10#! small arms under a treaty binding for #v 1 year#!. Its envoy has presented the terms for our government to accept or refuse."
 nesnd_external_accept:0 "Approve the treaty."
 nesnd_external_refuse:0 "Decline the offer."
 nesnd_external_commitment_tt:0 "The treaty takes effect immediately. Its #bold binding period is not an expiry date#!. Early withdrawal carries the treaty’s penalties; normal withdrawal, suspension and costs can be reviewed in the treaty interface."
 nesnd_external_request_money:0 "Request Financial Assistance"
 nesnd_external_request_money_desc:0 "Ask the selected partner for @money!#v 500#! each week under a treaty binding for #v 1 year#!. The partner must be able and willing to pay."
 nesnd_external_request_arms:0 "Request Arms"
 nesnd_external_request_arms_desc:0 "Request a transfer of #v 10#! small arms from the selected partner, binding for #v 1 year#!. Market access, transport and treaty eligibility must permit it. The partner may refuse."
 nesnd_external_request_money_title:0 "A Request for Assistance"
 nesnd_external_request_money_event_desc:0 "The envoy from [SCOPE.sCountry('nesnd_external_requester').GetName] requests financial assistance of @money!#v 500#! each week under a treaty binding for #v 1 year#!."
 nesnd_external_request_arms_title:0 "An Arms Request from Abroad"
 nesnd_external_request_arms_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName] requests a transfer of #v 10#! small arms under a treaty binding for #v 1 year#!. Its envoy awaits our decision on the proposed deliveries."
 nesnd_external_accept_request:0 "Approve the assistance and sign."
 nesnd_external_refuse_request:0 "Our resources are needed elsewhere."
 nesnd_external_reconsider:0 "Choose Another Partner"
 nesnd_external_reconsider_desc:0 "Choose another partner before an aid agreement is signed."
 nesnd_external_mysore:0 "Raise the Mysore Question"
 nesnd_external_mysore_desc:0 "Assert a claim on Mysore while the Southern government still holds land there. Relations with it fall by #v 10#!. This establishes a claim without transferring territory or starting a war."
 nesnd_external_mysore_tt:0 "The Mysore claim enters our diplomatic agenda. Subject status and the right to wage war remain governed by existing relationships and treaties."
 nesnd_external_cancel_request:0 "Withdraw the Request"
 nesnd_external_cancel_request_desc:0 "Withdraw the unsigned request. Existing treaties remain in force."
 nesnd_external_dismiss:0 "Set the Matter Aside"
 nesnd_external_dismiss_desc:0 "Close the diplomatic mission and withdraw pending requests. Treaties already in force must be handled separately through diplomacy."
 nesnd_external_resume:0 "Reopen Southern Diplomacy"
 nesnd_external_resume_desc:0 "Resume negotiations while the Southern crisis remains unresolved. An aid agreement already concluded cannot be repeated through this mission."
 nesnd_external_end_title:0 "Our Envoys Return"
 nesnd_external_end_desc:0 "The Southern succession has reached a settlement. Our envoys have completed their mission, but treaties already signed remain in force. The government must continue meeting those obligations and attend to the relationships that survive the crisis."
 nesnd_external_end_option:0 "Close the mission and fulfil our agreements."
