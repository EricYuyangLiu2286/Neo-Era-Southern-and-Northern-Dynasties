l_english:
 nesnd_external_choose_wu:0 "与吴朝往来"
 nesnd_external_choose_sih:0 "联络川蜀"
 nesnd_external_choose_hus:0 "共和使节赴东洲"
 nesnd_external_choose_fra:0 "向法国致书"
 nesnd_external_hus_title:0 "海东的来信"
 nesnd_external_hus_desc:0 "南明易帜的消息传到了东洲。商馆将南洋的船期和各藩的动静抄在同一份报告上；当年独立战争留下的名字，又一次出现在议员们的案头。若南方诸国各自立政，郑氏的海上帝国便要分出新的关口与航路。共和国的国库、工厂和船队，也须各自交出一份账目。"
 nesnd_external_fra_title:0 "两海之间"
 nesnd_external_fra_desc:0 "外交部收到了来自南明与印度的两封公文。南明的新朝要求履行旧约，莫卧儿宫廷仍在抱怨南印度的殖民地。法国的商人、债权人与军官遍布两地；他们请皇帝裁定，下一封国书应当送往何处。"
 nesnd_external_qe1_title:0 "巴蜀关山"
 nesnd_external_qe1_desc:0 "商队从四川带来了南朝的消息。敦煌败绩之后，西秦诸臣清点过边军，也清点过国库；东方若再起兵戈，往来巴蜀的道路便更关乎生计。驿骑已经备马，朝廷还须定下国书的措辞。"
 nesnd_external_sha_title:0 "风雪中的国书"
 nesnd_external_sha_desc:0 "南方政变的传闻越过海峡，送到了北地共和国。侨居此处的旧党人从报纸上辨认着熟悉的姓氏，有人忆及长安，有人写信到东洲。码头上的船还要运粮过冬，议事厅也不能只谈远方的战事。"
 nesnd_external_bur_title:0 "江口与王庭"
 nesnd_external_bur_desc:0 "南朝更易帝号的诏书送抵王庭。沿江商路仍在运货，地方官还在催征税款，驻外使臣已等着新的训令。朝廷须先查明本国与南明的盟约和宗藩名分，再决定这场变局中的去向。"
 nesnd_external_mug_title:0 "南方的海岸"
 nesnd_external_mug_desc:0 "南明的新帝登基了。宫中的地图仍将南方海岸涂作不同颜色，迈索尔的殖民地、沿海商馆与内陆诸邦各有旧约。军官请求整顿军费，朝臣请再派一位使者赴法；旧帝国必须用现有的财力，为这些要求排出先后。"
 nesnd_external_gbr_title:0 "封锁之后"
 nesnd_external_gbr_desc:0 "来自东方的商报在伦敦传阅。法兰西与明人的旧同盟曾使英国航路备受挤压，如今南朝的朝号变了，船货和旧债却仍要结算。内阁请商会列出可行的生意，也请海军先报本国海面的用度。"
 nesnd_external_rus_title:0 "东方驿报"
 nesnd_external_rus_desc:0 "使者将南朝更立的消息送到了宫廷。东方疆界漫长，边吏的报告与商路的账册一道堆在案上。朝廷可以等待局势明朗，也可以寻求一位可靠的交易者；无论如何，调兵和拨款都须另有着落。"
 nesnd_external_policy:0 "使节与账册"
 nesnd_external_policy_reason:0 "南明的新朝已向诸国递交国书。旧约、商路和地方诸侯的去向，正从同一场政变中分出不同的前程。外交部须逐一核对来信，再决定与谁往来。"
 nesnd_external_follow:0 "备好国书，继续查问。"
 nesnd_external_decline:0 "先料理本国的事务。"
 nesnd_external_choose_desc:0 "选定接洽国。改变对象不会取消已经生效的条约；同一场危机只可经本项目落实一份援助。"
 nesnd_external_choose_opposition:0 "联络实际反吴领袖"
 nesnd_external_choose_opposition_desc:0 "须已有真实反吴领袖，本国独立且未与其交战。选定对象后仍须另议资金或军械。"
 nesnd_external_offer_money:0 "支给军费"
 nesnd_external_offer_money_desc:0 "提出每周@money!#v 500#!的资金转移，约束期#v 1年#!。须有#v 26000#!储备、固定净收入至少#v 5000#!、总净收入至少#v 1000#!且原生条约资格有效；对方可拒绝。期满仍须撤回或重谈。"
 nesnd_external_offer_arms:0 "商议军械输送"
 nesnd_external_offer_arms_desc:0 "提出#v 10#!小武器的商品转移，约束期#v 1年#!。核查本国短缺、价格、原生出口上限与航路；对方可拒绝，运输或供给不足可令条约冻结。"
 nesnd_external_request_tt:0 "使节将在#v 7日#!后递交请求。对方接受前不拨款、不转移商品。"
 nesnd_external_status_choose:0 "先选择接洽国，再检查可行的条款。"
 nesnd_external_status_selected:0 "接洽国：#bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#!。资金额与军械额分别列在提案按钮中。"
 nesnd_external_status_pending:0 "使节正在等候回信；可撤回尚未签成的请求。"
 nesnd_external_status_committed:0 "条约已经签成。实际履行、冻结及退出条件可在外交条约界面查看。"
 nesnd_external_money_title:0 "一份拨款提议"
 nesnd_external_money_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者带来了拨款提案。其国库拟每周支付@money!#v 500#!，约束期为#v 1年#!。承诺将记入双方的外交条约和收支。"
 nesnd_external_arms_title:0 "军械清单"
 nesnd_external_arms_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]送来一份军械清单，拟向本国转移#v 10#!小武器，约束期为#v 1年#!。使者附上了条约草案，交由本国决定是否签署。"
 nesnd_external_accept:0 "准予签署。"
 nesnd_external_refuse:0 "谢绝这份提议。"
 nesnd_external_commitment_tt:0 "条约立即生效。约束期不是自动到期日；提前退出承担原生违约后果，正常撤回、供给冻结及费用见条约界面。"
 nesnd_external_request_money:0 "请求财政协助"
 nesnd_external_request_money_desc:0 "向选定伙伴请求每周@money!#v 500#!的拨款，约束期#v 1年#!。由对方支付，须对方有相应财力并自愿接受；本国不会反向向伙伴拨款。"
 nesnd_external_request_arms:0 "请求军械协助"
 nesnd_external_request_arms_desc:0 "向选定伙伴请求#v 10#!小武器的商品转移，约束期#v 1年#!。双方原生市场、运输及条约资格均须有效；对方可拒绝。"
 nesnd_external_request_money_title:0 "一封求助的国书"
 nesnd_external_request_money_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者请求财政协助。他呈上每周@money!#v 500#!的拨款方案，希望与本国订立约束期#v 1年#!的条约。"
 nesnd_external_request_arms_title:0 "远方的军械请求"
 nesnd_external_request_arms_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]遣使请求输送#v 10#!小武器，并提出约束期#v 1年#!的条约。货单已经送至外交部，是否承诺这项输送，仍待本国裁定。"
 nesnd_external_accept_request:0 "拨款照准，交付签署。"
 nesnd_external_refuse_request:0 "本国另有用度，暂不允准。"
 nesnd_external_reconsider:0 "另择接洽国"
 nesnd_external_reconsider_desc:0 "清除尚未签成援助的接洽选择，再选择新对象。不能借此重复领取或承诺援助。"
 nesnd_external_mysore:0 "重提迈索尔之议"
 nesnd_external_mysore_desc:0 "仅在吴朝仍实际持有迈索尔土地时提出主张。此举增加对迈索尔的宣称，并使与吴朝关系降低#v 10#!；不转移土地，不自动发动战争。"
 nesnd_external_mysore_tt:0 "迈索尔主张进入本国外交议程。附属身份与战争资格继续按现行条约处理。"
 nesnd_external_cancel_request:0 "撤回使节请求"
 nesnd_external_cancel_request_desc:0 "尚未签成的请求作废，既有条约继续有效。"
 nesnd_external_dismiss:0 "暂罢此议"
 nesnd_external_dismiss_desc:0 "停止本项目并撤回待答请求。已经生效的条约须在外交界面分别处理。"
 nesnd_external_resume:0 "重开南朝外交议程"
 nesnd_external_resume_desc:0 "在南朝危机仍未结束时恢复接洽；已签成的援助不会重复发放。"
 nesnd_external_end_title:0 "使臣复命"
 nesnd_external_end_desc:0 "南朝这一轮争位已有定局。使臣将往来的国书、借据和军械清单送回本国。已签成的条约仍按各自条款履行，财政官与外交官须继续查验。"
 nesnd_external_end_option:0 "将文书交付各署。"
