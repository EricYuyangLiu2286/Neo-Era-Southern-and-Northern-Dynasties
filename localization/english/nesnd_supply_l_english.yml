l_english:
 nesnd_supply_preparations:0 "Fragile Trade"
 nesnd_supply_preparations_reason:0 "Wu shipping brings grain from the Southern Seas, distant timber and foreign goods into the Southern realm. Inland workshops, garrisons and academies already depend on those exchanges. Provincial powers differ, but production and livelihoods can scarcely stand apart from the common market. Closing a port or severing a trade route spreads losses far beyond it.\n\nAs the Ming court and Hangzhou dispute the succession, [ROOT.GetCountry.GetName] must keep its government and forces functioning. Offices need paper, garrisons need recruits and arms, and academy students are preparing to enter political life. We must maintain trade with willing partners and make local workshops, schools and livelihoods capable of enduring the present disruption."
 nesnd_supply_status_war:0 "#n War has reached the trading routes.#! Requisitions and disrupted shipping have broken the previous period of stability.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_inputs:0 "#n Workshops and garrisons lack reliable supplies.#! Paper, tools and arms are straining their budgets.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_jobs:0 "#n Workshops and offices still lack workers.#! More posts must be filled to sustain their business.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_livelihood:0 "#n Livelihoods remain insecure.#! Unemployment, grain prices and famine threaten commercial life.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_diplomacy:0 "Trading arrangements remain undecided. Send envoys abroad or rely on merchants at home.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_stable:0 "#p Supplies, employment and livelihoods are becoming stable.#! Sustain them for a season to establish lasting trade.\n$nesnd_supply_rules_link$"
 nesnd_supply_readiness_bar:0 "Foundations of trade"
 nesnd_supply_readiness_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_supply_continuity_bar:0 "Weeks of stable trade"
 nesnd_supply_continuity_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 12#!"
 nesnd_supply_invite_desc:0 "Send envoys to discuss merchant contacts and procurement arrangements, and hear the other government’s terms."
 nesnd_supply_invitation_tt:0 "The envoys arrive in seven days and serve for six months."
 nesnd_supply_accept_tt:0 "Establish commercial contact."
 nesnd_supply_self:0 "Rely on Domestic Merchants"
 nesnd_supply_self_desc:0 "Ask our merchants to arrange procurement and recall the envoys already sent."
 nesnd_supply_end_contact:0 "End Commercial Contacts"
 nesnd_supply_end_contact_desc:0 "Recall our envoys and seek trade routes that can be sustained."
 nesnd_supply_end_contact_tt:0 "End these contacts and reset consecutive weeks of stability. Formal treaties already signed remain in force."
 nesnd_supply_trade:0 "Negotiate Reciprocal Trade"
 nesnd_supply_trade_desc:0 "Give the two countries’ merchants reciprocal trading advantages through a treaty."
 nesnd_supply_trade_request_tt:0 "In #v 7 days#!, propose a reciprocal trade treaty binding for #v 2 years#!. The other government may accept or refuse."
 nesnd_supply_finish:0 "Trade Routes Stabilise"
 nesnd_supply_finish_desc:0 "After supply, employment, livelihoods and commercial arrangements remain stable for #v 12 weeks#!, gain trade benefits for #v 2 years#! on the first completion."
 nesnd_supply_dismiss:0 "Defer Commercial Arrangements"
 nesnd_supply_dismiss_desc:0 "Recall the mission and return to commercial arrangements later. Existing mission expenses remain due until their term ends."
 nesnd_supply_envoys:0 "Commercial Mission Abroad"
 nesnd_supply_verified:0 "Trade Routes Reopened"
 nesnd_supply_treaty:0 "Reciprocal Trade Agreement"
 nesnd_supply_resume:0 "Renew Commercial Contacts"
 nesnd_supply_resume_desc:0 "Reconnect with merchants, secure supplies and employment, and restore dealings with other states."
 nesnd_supply.1.t:0 "Merchants Lead the Way"
 nesnd_supply.1.d:0 "Envoys from [SCOPE.sCountry('nesnd_supply_requester').GetName] have brought a request from their merchants. They hope to maintain procurement contacts between the two countries and exchange information about supplies of paper, timber and manufactured goods, preserving trading opportunities as the political situation changes.\n\nThese contacts would broaden our commercial relations, but need officials to receive the mission and merchants to sustain the exchanges. [ROOT.GetCountry.GetName] may appoint representatives to hear the proposed arrangements."
 nesnd_supply.1.a:0 "Invite them to discuss it."
 nesnd_supply.1.b:0 "Our domestic affairs must come first."
 nesnd_supply.2.t:0 "A Reciprocal Trade Agreement"
 nesnd_supply.2.d:0 "[SCOPE.sCountry('nesnd_supply_requester').GetName] proposes a formal treaty granting reciprocal trade advantages. Merchants hope to expand their markets, while those buying supplies seek more stable commercial relations. Once signed, both countries will be obliged to fulfil its terms."
 nesnd_supply.2.a:0 "Approve the treaty."
 nesnd_supply.2.b:0 "The terms need further discussion."
 nesnd_supply.3.t:0 "Trade and Livelihoods"
 nesnd_supply.3.d:0 "For the past season, workshops and garrisons in [ROOT.GetCountry.GetName] have been able to buy what they need, while schools, offices and factories have filled their posts. Merchants have renewed their trading contacts, and people across the states have supported themselves through production and exchange.\n\nThe Southern political dispute continues. The cargo ships leaving our ports give us the means to keep trading through it."
 nesnd_supply.3.a:0 "Keep trade flowing."
 nesnd_supply_invite_hna:0 "Send Envoys to Huguang"
 nesnd_supply_invite_sih:0 "Send Envoys to Sichuan"
 nesnd_supply_invite_gng:0 "Send Envoys to Guangxi"
 nesnd_supply_invite_yn1:0 "Send Envoys to Yuannan"
 nesnd_supply_invite_cne:0 "Send Envoys to the Chinese Empire"
 nesnd_supply_invite_fra:0 "Send Envoys to France"
 nesnd_supply_hus_preparations:0 "The Republic’s Trade Routes"
 nesnd_supply_hus_preparations_reason:0 "Immigrants and merchant ships built the republic’s coastal towns. War against Wu brought its states together; the northern alliance opened further markets. Work in the harbours, production in the mills and provincial revenue now depend upon these connections.\n\nNews of the southern dispute crosses the ocean. Whether we continue in the shared market or arrange our own trade, production and livelihoods at home must endure."
 nesnd_supply_finish_shared:0 "Continue in the Common Market"
 nesnd_supply_finish_shared_desc:0 "Continue trading in the common market and retain existing agreements. Supply and livelihoods must remain stable for #v 12 weeks#!; first completion grants trade benefits for #v 2 years#!."
 nesnd_supply_finish_autonomous:0 "Manage Our Own Trade"
 nesnd_supply_finish_autonomous_desc:0 "Control our own market and commercial arrangements. Maintain all conditions for #v 12 weeks#!; first completion grants trade benefits for #v 2 years#!."
 nesnd_supply_status_bankruptcy:0 "#n The treasury is bankrupt.#! Finances must recover before a new period of stability can be established.\n$nesnd_supply_rules_link$"
 nesnd_supply_workforce_ready_tt:0 "National workforce unemployment is at most #v 12%#!, and at most #v 20%#! in states with at least #v 50,000#! workers."
 nesnd_supply_rules_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_supply_rules Supplies and livelihoods#!#!"
 nesnd_supply_rules:0 "#bold Supplies#!\nPaper, tools and small arms must have no local shortages and cost no more than #v 50%#! above base price; Dongzhou also requires hardwood.\n\n#bold Buildings and workers#!\nEach required building type must have at least one building staffed to #v 75%#! without input shortages. Huguang requires a university and barracks; Sichuan a tooling workshop and either an iron mine or logging camp; Guangxi a paper mill and logging camp; Dongzhou a port and government administration. If recruitment is difficult, check [concept_pop_qualifications], [concept_building_wage] and input supplies.\n\n#bold Livelihoods#!\nUnemployed workers may be at most #v 12%#! of the national workforce. States with at least #v 50,000#! workers have a limit of #v 20%#!. Subsistence workers count as employed. There must be no famine or local grain shortage, and grain must cost no more than #v 25%#! above base price.\nUnemployed workforce: #v [Country.MakeScope.Var('nesnd_supply_unemployed').GetValue|0] / [Country.MakeScope.Var('nesnd_supply_workforce').GetValue|0]#! (#v [Country.MakeScope.Var('nesnd_supply_unemployment').GetValue|%1]#!). States above the local unemployment limit: #v [Country.MakeScope.Var('nesnd_supply_critical_states').GetValue|0]#!.\n\n#bold Stable commerce#!\nChoose a commercial partner or rely on domestic merchants, and maintain all four conditions for #v 12 weeks#!. War, bankruptcy, a change of market or failure of any condition restarts the consecutive count."
