l_english:
 nesnd_supply_preparations:0 "Fragile Trade"
 nesnd_supply_preparations_reason:0 "Wu’s ships carry grain and raw materials between distant ports. The workshops, garrisons and schools of the southern countries have come to depend on that traffic. A closed harbour or a detained cargo can now take livelihoods away far beyond its own shores.\n\nWhile Nanjing and Hangzhou dispute the dynasty, merchants consider their own future. [ROOT.GetCountry.GetName] needs paper for its offices, supplies for its soldiers and employment for its people. We must renew our trading connections and sustain the production at home that gives us room to act."
 nesnd_supply_status_war:0 "#n War has reached the trading routes.#! Requisitions and disrupted shipping have broken the previous period of stability.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_inputs:0 "#n Workshops and garrisons lack reliable supplies.#! Paper, tools and arms are straining their budgets.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_jobs:0 "#n Workshops and offices still lack workers.#! More posts must be filled to sustain their business.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_livelihood:0 "#n Livelihoods remain insecure.#! Unemployment, grain prices and famine threaten commercial life.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_diplomacy:0 "Trading arrangements remain undecided. Send envoys abroad or rely on merchants at home.\n$nesnd_supply_rules_link$"
 nesnd_supply_status_stable:0 "#p Supplies, employment and livelihoods are becoming stable.#! Sustain them for a season to establish lasting trade.\n$nesnd_supply_rules_link$"
 nesnd_supply_readiness_bar:0 "Foundations of trade"
 nesnd_supply_readiness_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_supply_continuity_bar:0 "Weeks of stable trade"
 nesnd_supply_continuity_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 12#!"
 nesnd_supply_invite_desc:0 "遣使与对方商议商人往来和采购联络，听取他们的条件。"
 nesnd_supply_invitation_tt:0 "The envoys arrive in seven days and serve for six months."
 nesnd_supply_accept_tt:0 "Establish commercial contact."
 nesnd_supply_self:0 "自行筹办"
 nesnd_supply_self_desc:0 "由本国商人和官署安排采购，撤回待答邀请并结束现有联络。继续检查实际市场供给。"
 nesnd_supply_end_contact:0 "结束通商联络"
 nesnd_supply_end_contact_desc:0 "召回负责此次筹办的联络人员，另行寻找伙伴。"
 nesnd_supply_end_contact_tt:0 "清除本次联络和连续周数；已有的正式外交条约继续按原生规则生效。"
 nesnd_supply_trade:0 "商议互惠贸易条约"
 nesnd_supply_trade_desc:0 "向联络伙伴提出双向贸易优惠。两国须具备签约资格；共同市场中的从属成员不能单独签署这一条款。"
 nesnd_supply_trade_request_tt:0 "7日后请求对方签署双向贸易优惠条约，约束期2年。条款、维护与退出使用原生外交规则，对方可以拒绝。"
 nesnd_supply_finish:0 "结束本轮筹办"
 nesnd_supply_finish_desc:0 "四项条件连续合格12周后，公布本轮筹办结果。首次完成获得“通商筹办成效”，持续2年。"
 nesnd_supply_dismiss:0 "中止筹办"
 nesnd_supply_dismiss_desc:0 "关闭本项目，清除联络与准备计时。派使的既有外交成本继续至期限届满，可在决议中恢复项目。"
 nesnd_supply_envoys:0 "驻外通商使团"
 nesnd_supply_verified:0 "通商筹办成效"
 nesnd_supply_treaty:0 "互惠通商约"
 nesnd_supply_resume:0 "恢复通商筹办"
 nesnd_supply_resume_desc:0 "重新核查当前市场、地方配员和民生，另行安排对外联络。"
 nesnd_supply.1.t:0 "商人先行"
 nesnd_supply.1.d:0 "[SCOPE.sCountry('nesnd_supply_requester').GetName]的使者带来了商人的请托。他们希望在两国之间保留采购联络，互通纸张、木材和工坊的供货消息，使商人在局势变化时仍能找到交易的门路。\n\n这些往来会扩大我们的交游，也需要官员接待和商人经营。[ROOT.GetCountry.GetName]可以派人接洽，听取对方的采购安排。"
 nesnd_supply.1.a:0 "请他们来谈。"
 nesnd_supply.1.b:0 "本国事务尚多，暂不接洽。"
 nesnd_supply.2.t:0 "互惠通商约"
 nesnd_supply.2.d:0 "[SCOPE.sCountry('nesnd_supply_requester').GetName]提议将两国的商贸往来写入正式条约，互相给予贸易优惠。商人盼望借此扩大销路，采购人员也希望得到更稳定的交易关系。条约一经签署，两国便须依约履行各自的义务。"
 nesnd_supply.2.a:0 "准予签署。"
 nesnd_supply.2.b:0 "此约尚须再议。"
 nesnd_supply.3.t:0 "商路与生计"
 nesnd_supply.3.d:0 "[ROOT.GetCountry.GetName]已经完成本轮通商筹办。官署、军队与工坊所需的关键商品保持供应，受检的学校、营伍或生产设施已有人员任事，各州的生计也经受了这一季的检验。\n\n商人熟悉了往来的门路，官员掌握了本国生产的长短。此后的建设与交涉，可以从这些实际经验继续做起。"
 nesnd_supply.3.a:0 "让商旅继续往来。"
 nesnd_supply_invite_hna:0 "遣使湖广"
 nesnd_supply_invite_sih:0 "遣使四川"
 nesnd_supply_invite_gng:0 "遣使广西"
 nesnd_supply_invite_yn1:0 "遣使远南"
 nesnd_supply_invite_cne:0 "遣使中华帝国"
 nesnd_supply_invite_fra:0 "遣使法兰西"
 nesnd_supply_hus_preparations:0 "共和国的商路"
 nesnd_supply_hus_preparations_reason:0 "Immigrants and merchant ships built the republic’s coastal towns. War against Wu brought its states together; the northern alliance opened further markets. Work in the harbours, production in the mills and provincial revenue now depend upon these connections.\n\nNews of the southern dispute crosses the ocean. Whether we continue in the shared market or arrange our own trade, production and livelihoods at home must endure."
 nesnd_supply_finish_shared:0 "继续经营共同市场"
 nesnd_supply_finish_shared_desc:0 "确认在当前共同市场内的供应与民生准备。保留现有市场和盟约，首次验收获得2年的通商筹办成效。"
 nesnd_supply_finish_autonomous:0 "完成自主市场检验"
 nesnd_supply_finish_autonomous_desc:0 "在本国掌管的市场内，连续12周维持全部条件。首次验收获得2年的通商筹办成效。"
 nesnd_supply_status_bankruptcy:0 "#n The treasury is bankrupt.#! Finances must recover before a new period of stability can be established.\n$nesnd_supply_rules_link$"
 nesnd_supply_workforce_ready_tt:0 "National workforce unemployment is at most #v 12%#!, and at most #v 20%#! in states with at least #v 50,000#! workers."
 nesnd_supply_rules_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_supply_rules Supplies and livelihoods#!#!"
 nesnd_supply_rules:0 "#bold Latest refresh#!\nUnemployed workforce: #v [Country.MakeScope.Var('nesnd_supply_unemployed').GetValue|0] / [Country.MakeScope.Var('nesnd_supply_workforce').GetValue|0]#! (#v [Country.MakeScope.Var('nesnd_supply_unemployment').GetValue|%1]#!)\nStates beyond the local unemployment limit: #v [Country.MakeScope.Var('nesnd_supply_critical_states').GetValue|0]#!\n\n#bold Employment requirements#!\nUnemployed workers may be at most #v 12%#! of the national workforce. In states with at least #v 50,000#! workers, the limit is #v 20%#!. Subsistence workers count as employed. Statistics refresh weekly and when arrangements change; completion checks current conditions.\n\nEach required school, barracks, workshop or administrative facility must have at least one building staffed to #v 75%#! without input shortages. Check its hiring tooltip for [concept_pop_qualifications], [concept_building_wage] and [concept_good]. Education, suitable vacancies and market supplies can support occupational transitions. There must be no famine, no local grain shortage and no more than a #v 25%#! grain price increase.\n\nContinue in the shared market, approach a foreign partner, or arrange purchases domestically. All four requirements must hold for #v 12 consecutive weeks#!; war, market changes or failed requirements restart the count."
