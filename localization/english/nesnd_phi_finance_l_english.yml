l_english:
 nesnd_phi_service_recovery:0 "吕宋驻屯经费"
 nesnd_phi_service_recovery_reason:0 "楚军南渡之后，吕宋的营垒里又添了许多湖广乡音。随林则徐出海的将士在此领饷、操练，把故乡的消息夹在家书里传回军中。宣慰司的船队往来海上，税粮与军饷也一道经过马尼拉的库房。\n\n驻屯军的开销逐年列在吕宋账下，朝廷征调的海船仍须备齐官兵。宣慰司将营册与税册并排呈送，要求重新议定驻屯、海防和岁贡。"
 nesnd_phi_status_external:0 "现有宗属、共同市场或双方和平条件已改变。原协议停止续付；按本国现有收入、军事义务与外交安排重订经费。"
 nesnd_phi_status_stalled:0 "付款方当前未能履行钱款条约。检查条约冻结与其[concept_default]情况；账面约定金额不计作已收到的收入。"
 nesnd_phi_status_pending:0 "议案正在两国间审议，120天内须由双方确认。尚未拨款或移交舰船，吕宋继续按现有财政运作。"
 nesnd_phi_status_active:0 "协定正在履行。按每月实际收支、驻军、舰员与居民生计检验恢复；本次钱款协定在签订12个月后结束。"
 nesnd_phi_status_review:0 "钱款协定已经结束。以现有收入和义务维持三个月；需要续议时，重新取得两国同意。"
 nesnd_phi_status_proposal:0 "可请求中央承担驻屯军费，或议定舰队分任。先检查宗属与条约资格，再提出正式议案。"
 nesnd_phi_service_bar:0 "军民经费"
 nesnd_phi_service_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_phi_service_bar_detail:0 "当前非建设周结余：#v £[Country.MakeScope.Var('nesnd_phi_budget').GetValue|0]#!\n舰队实际满员需求：#v [Country.MakeScope.Var('nesnd_phi_needed_crew').GetValue|0]#!\n无业劳动力：#v [Country.MakeScope.Var('nesnd_phi_unemployment').GetValue|%1]#!\n欠食劳动力：#v [Country.MakeScope.Var('nesnd_phi_starving').GetValue|%1]#!\n\n四项各计一格：非建设收支非负、未[concept_default]或[concept_bankruptcy]且现行拨款确在履行；常备军至少#v 35营#!；驻屯协定至少#v 40舰#!、海防分任至少#v 20舰#!各有#v 75%#!船员，海军维护履行至少#v 80%#!；无业不超过#v 12%#!且欠食不超过#v 15%#!。每月更新。"
 nesnd_phi_continuity_bar:0 "经费巩固"
 nesnd_phi_continuity_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3个月#!"
 nesnd_phi_continuity_bar_detail:0 "和平期间四项军民经费条件持续达标，每月增加#p 1#!，中断后归零。钱款终止时重新计算；终止后三个月达标才完成日志。完成不额外增加建筑、军队或财政收入。"
 nesnd_phi_request_a_button:0 "议定驻屯军费"
 nesnd_phi_request_a_button_desc:0 "凭已签署且与吕宋、中央当前立场一致的拥明或拥吴盟书，请中央承担海外驻屯。中央须再次同意支出，吕宋最后确认。\n\n$nesnd_phi_route_1_terms_tt$"
 nesnd_phi_request_b_button:0 "议定海防分任"
 nesnd_phi_request_b_button_desc:0 "提出分任远洋舰队与地方海防，保留吕宋西府驻屯大营。此议案不改变政治立场。\n\n$nesnd_phi_route_2_terms_tt$"
 nesnd_phi_cancel_request_button:0 "撤回议案"
 nesnd_phi_cancel_request_button_desc:0 "结束尚未履行的议案，30天后可重提。已签署的其他外交安排不受影响。"
 nesnd_phi_withdraw_button:0 "提前终止钱款协定"
 nesnd_phi_withdraw_button_desc:0 "由吕宋撤回本日志签订的钱款条约，依原生条约计算约束期内违约的恶名和关系损失。减贡、免役与其他条约照常依原生外交规则存续。移交过的舰船仍归中央。"
 nesnd_phi_route_1_terms_tt:0 "中央每周向吕宋转付#v £8,000#!，期限#v 12个月#!；原生减贡协议降低#v 10个百分点#!的收入转移比例。保留舰队与驻军。中央须有至少#v £10,000#!非建设周结余、#v £100,000#!储备，且原生钱款条约与减贡合法可签。钱款到期主动撤回，减贡按原生外交规则继续。"
 nesnd_phi_route_2_terms_tt:0 "首次签订时将吕宋实际拥有且未参战的#v 20艘战列舰#!移交中央，保留#v 20艘护卫舰#!与驻屯军。中央每周转付#v £3,000#!，期限#v 12个月#!，并签原生减贡与免役协议。中央须有至少#v £5,000#!非建设周结余、#v £60,000#!储备。续签钱款不重复转舰；钱款到期终止，减贡、免役按原生外交规则继续。"
 nesnd_phi_usm_accept_tt:0 "将核准的条款交回吕宋作最后确认。确认前再次核对条约、财政、宗属和舰队条件；此刻不支付补贴、不转移舰船。"
 nesnd_phi_reject_tt:0 "退回议案，90天后可再提。"
 nesnd_phi_defer_tt:0 "本次不签约，30天后可再议。"
 nesnd_phi_finance.reject:0 "此项开支暂不核拨。"
 nesnd_phi_finance.defer:0 "退回重议。"
 nesnd_phi_finance.cancel:0 "暂缓签署。"
 nesnd_phi_finance.1.t:0 "吕宋军饷"
 nesnd_phi_finance.1.d:0 "吕宋送来的奏牍附着两本册子，一本记税粮，一本记军饷。宣慰司在末页列明驻屯大营与海船各项开销，请朝廷按年拨款，并减去一部分岁贡。\n\n“将士远戍海疆，营中一日不可缺饷。请先定经制，再议久远。”\n\n库曹依此开列每周#v £8,000#!的军费，支给一年，另议减贡。"
 nesnd_phi_finance.1.a:0 "准此军费，交吕宋核议。"
 nesnd_phi_finance.2.t:0 "海船归属"
 nesnd_phi_finance.2.d:0 "吕宋的海防册另附了一份交舰清单：二十艘战列舰可由中央接管，护卫舰留守群岛，驻屯大营照旧编练。朝廷受领舰船之后，远洋征调与军费也须另立章程。\n\n议案请免吕宋从征，减其岁贡，以每周#v £3,000#!支给一年的整顿费用。中央海军将为受领的战列舰安排驻地、船员与日常供给。"
 nesnd_phi_finance.2.a:0 "按此分任海防。"
 nesnd_phi_finance.3.t:0 "核拨文书"
 nesnd_phi_finance.3.d:0 "核拨军费的文书到了马尼拉。军需官按月重排支用，缺额的水手、营中口粮和船厂费用逐项登记。\n\n印信尚待钤下。此后一年，中央须按周付给吕宋#v £8,000#!，减贡另依新议；驻屯大营与舰队继续由宣慰司维持。"
 nesnd_phi_finance.3.a:0 "钤印，依约支用。"
 nesnd_phi_finance.4.t:0 "交舰议定"
 nesnd_phi_finance.4.d:0 "中央的批复抵达之后，海军衙门将战列舰的名册、船籍与修理记录一并备齐。留守群岛的护卫舰仍归吕宋调遣，西府驻屯大营的营册也留在宣慰司。\n\n此次签押将确定舰队分任、减贡和免役。整顿款按周支付#v £3,000#!，支给一年；已经办过交舰的续议沿用旧册。"
 nesnd_phi_finance.4.a:0 "签押，照册办理。"
 nesnd_phi_finance.5.t:0 "支用新章"
 nesnd_phi_finance.5.d:0 "两地官署各存了一份签押文书。库曹将新议的拨款列入常支，宣慰司也把营饷、船员与税粮重新分册。\n\n下一次呈报，须连同实际收支与各营缺额一并送来。"
 nesnd_phi_finance.5.a:0 "按月查核。"
 nesnd_phi_finance.6.t:0 "一年军费"
 nesnd_phi_finance.6.d:0 "一年的军费支用期已满，钱款条约依议终止。吕宋官署把本年账册送交中央，请核阅驻军与舰队的现况。\n\n新一年的经费须另行商定。既有宗属与军事义务依现行约定办理。"
 nesnd_phi_finance.6.a:0 "重核来岁经费。"
 nesnd_phi_finance.7.t:0 "军费中止"
 nesnd_phi_finance.7.d:0 "钱款条约已不能按原议继续。宣慰司将未结账目另列一册，通知营伍与海军官署重新编排支出。\n\n下一份经费方案，将依现有宗属、市场与军事义务商议。"
 nesnd_phi_finance.7.a:0 "查明账目，另议支用。"
 nesnd_phi_finance.8.t:0 "营饷有经"
 nesnd_phi_finance.8.d:0 "钱款支用期结束之后，吕宋接连三个月的账目已经报齐。军营照常发饷，海船补入了水手，宣慰司也终于可以按实际收入编定下一季开支。\n\n核销过的营册已经封存，库曹另留副本。往后的军费审议，便从这些有据可查的账目开始。"
 nesnd_phi_finance.8.a:0 "照章续办。"
 nesnd_phi_finance.10.t:0 "另订的条款"
 nesnd_phi_finance.10.d:0 "两国已通过外交程序改订了原条约，所列条款与旧军费协定不同。宣慰司将新约另行存档，往后依新约办理。\n\n新约的付款期限与其余条款，应在外交界面重新查核。"
 nesnd_phi_finance.10.a:0 "依新约办理。"

 nesnd_phi_request_cash_a_button:0 "驻屯岁费（定额）"
 nesnd_phi_request_cash_a_button_desc:0 "按驻屯大营与远洋舰队的支出，议定中央每周承担的岁费。须先有双方立场一致的正式拥明或拥吴盟书。\n\n$nesnd_phi_cash_1_terms_tt$"
 nesnd_phi_request_cash_b_button:0 "海防分任（定额）"
 nesnd_phi_request_cash_b_button_desc:0 "由中央接管战列舰，吕宋留护卫舰守备群岛；驻屯大营照旧编练，分任之后另订定额经费。此协议不改变拥明、拥吴、中立或自主立场。\n\n$nesnd_phi_cash_2_terms_tt$"
 nesnd_phi_cash_1_terms_tt:0 "中央每周向吕宋支付#v £8,700#!，持续#v 12个月#!。保留驻屯军与舰队，属国贡赋按现有宗属关系另计；本协定不降低贡率或附加独立倾向效果。中央须有至少#v £10,000#!非建设周结余、#v £100,000#!储备，且原生钱款条约可签。两国先后确认后才开始付款；期满终止本笔钱款。"
 nesnd_phi_cash_2_terms_tt:0 "首次签订时向中央移交实际#v 20艘战列舰#!，吕宋保留#v 20艘护卫舰#!和驻屯军；原生免役资格通过后免除军事服务。中央每周支付#v £3,700#!，持续#v 12个月#!。属国贡赋按现有关系另计，本协定不降低贡率；中央须有至少#v £5,000#!非建设周结余、#v £60,000#!储备。续签不重复交舰，期满只终止本笔钱款。"
 nesnd_phi_finance.11.t:0 "驻屯岁费"
 nesnd_phi_finance.11.d:0 "吕宋呈来驻屯大营与海船的支用册，请朝廷按年核拨岁费。宣慰司仍按旧章解送贡款，营饷与远洋海防另列一项，由中央库曹承支。\n\n此次议案开列每周#v £8,700#!，支给一年。朝廷与吕宋各存一册，以备逐月核销。"
 nesnd_phi_finance.11.a:0 "核准岁费，交吕宋签议。"
 nesnd_phi_finance.12.t:0 "岁费签押"
 nesnd_phi_finance.12.d:0 "中央核拨岁费的文书送到了马尼拉。军需官把新款列在贡粮之外，重新登记各营的口粮、船员与修理开销。\n\n这一年，库曹每周支付#v £8,700#!。贡款仍循现有宗属章程解送，舰队与驻屯大营由宣慰司继续维持。"
 nesnd_phi_finance.12.a:0 "签押，分册支用。"
 nesnd_phi_finance.13.t:0 "分任海防岁费"
 nesnd_phi_finance.13.d:0 "吕宋请将二十艘战列舰及其船籍交由中央，留下护卫舰守备群岛。驻屯大营仍留宣慰司，远洋从征的义务另按免役之议办理。\n\n贡款照章解送；整顿岁费则由中央每周支付#v £3,700#!，限一年。受领战列舰的驻地、船员和日常供给，由中央海军筹办。"
 nesnd_phi_finance.13.a:0 "按册分任，核拨岁费。"
 nesnd_phi_finance.14.t:0 "交舰与岁费"
 nesnd_phi_finance.14.d:0 "中央的批复和交舰清单一同摆在宣慰司案上。二十艘战列舰归中央接管，护卫舰与驻屯军留守；续签时沿用已经办结的船籍清单。\n\n整顿岁费每周#v £3,700#!，支给一年。贡赋依现有关系另计，免役依两国现行约定办理。"
 nesnd_phi_finance.14.a:0 "签押，照册交接。"

 nesnd_phi_propose_native_a_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟定条款：\n\n$nesnd_phi_route_1_terms_tt$"

 nesnd_phi_propose_native_b_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟定条款：\n\n$nesnd_phi_route_2_terms_tt$"

 nesnd_phi_propose_cash_a_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟定条款：\n\n$nesnd_phi_cash_1_terms_tt$"

 nesnd_phi_propose_cash_b_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟定条款：\n\n$nesnd_phi_cash_2_terms_tt$"
