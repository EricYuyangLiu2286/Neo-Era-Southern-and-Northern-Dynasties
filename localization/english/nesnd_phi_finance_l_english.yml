l_english:
 nesnd_phi_service_recovery:0 "Funding the Luzon Garrison"
 nesnd_phi_service_recovery_reason:0 "The soldiers who sailed south with Lin Zexu brought the voices of Huguang to Luzon’s garrisons. Their pay, provisions and training now depend on the islands, while the administration must also keep ships ready for imperial service.\n\nThe cost of these obligations has become a question for both governments. Luzon seeks a new settlement of garrison expenses, naval service and tribute, so that its revenues can support the troops as well as the people who sustain them."
 nesnd_phi_status_external:0 "The subject relationship, shared market or peace between the two countries has changed. Payments under the agreement will cease. A new settlement must reflect our present income and obligations."
 nesnd_phi_status_stalled:0 "The paying country is unable to meet its obligations. The treaty may be suspended or the country in [concept_default]. Promised payments count as income only when received."
 nesnd_phi_status_pending:0 "Both governments must approve the proposal within 120 days. Until then, no money or ships change hands."
 nesnd_phi_status_active:0 "The agreement is in force. The subsidy ends 12 months after signature; garrison strength, naval staffing and local livelihoods must remain sustainable."
 nesnd_phi_status_review:0 "The subsidy has ended. Sustain the required finances, forces and livelihoods for three months. Renewed payments require the consent of both governments."
 nesnd_phi_status_proposal:0 "Request central funding for the garrison, or negotiate a division of naval responsibilities."
 nesnd_phi_service_bar:0 "Garrison Finances and Livelihoods"
 nesnd_phi_service_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_phi_service_bar_detail:0 "Weekly balance excluding construction: #v £[Country.MakeScope.Var('nesnd_phi_budget').GetValue|0]#!\nCrew required for a fully staffed fleet: #v [Country.MakeScope.Var('nesnd_phi_needed_crew').GetValue|0]#!\nUnemployed workforce: #v [Country.MakeScope.Var('nesnd_phi_unemployment').GetValue|%1]#!\nWorkforce below the starvation threshold: #v [Country.MakeScope.Var('nesnd_phi_starving').GetValue|%1]#!\n\nEach requirement fills one segment: a nonnegative balance excluding construction, no [concept_default] or [concept_bankruptcy], and any agreed subsidy actually being paid; at least #v 35 battalions#! in the standing army; at least #v 40 ships#! under the garrison agreement or #v 20 ships#! under the naval division, with #v 75%#! of crews and at least #v 80%#! naval maintenance fulfillment; unemployment at most #v 12%#! and no more than #v 15%#! of the workforce below the starvation threshold. Updated monthly."
 nesnd_phi_continuity_bar:0 "Financial Stability"
 nesnd_phi_continuity_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3 months#!"
 nesnd_phi_continuity_bar_detail:0 "Gain #p 1#! each month at peace with all four requirements met. A failure resets the count. The count also resets when the subsidy ends; three successful months after that are required to complete the Journal Entry."
 nesnd_phi_request_a_button:0 "Negotiate Garrison Funding"
 nesnd_phi_request_a_button_desc:0 "Use the confirmed commitment to Ming or Wu, which must match both governments’ present allegiances, to seek central funding for the overseas garrison. The central government must approve the expense before Luzon gives final consent.\n\n$nesnd_phi_route_1_terms_tt$"
 nesnd_phi_request_b_button:0 "Divide Naval Responsibilities"
 nesnd_phi_request_b_button_desc:0 "Propose a division between the ocean-going fleet and the defence of the islands, retaining the Western Administration’s garrison in Luzon. The agreement does not change either government’s political allegiance.\n\n$nesnd_phi_route_2_terms_tt$"
 nesnd_phi_cancel_request_button:0 "Withdraw the Proposal"
 nesnd_phi_cancel_request_button_desc:0 "Withdraw the unsigned proposal. Another may be submitted after 30 days. Existing diplomatic agreements remain in force."
 nesnd_phi_withdraw_button:0 "End the Subsidy Early"
 nesnd_phi_withdraw_button_desc:0 "Withdraw from the subsidy treaty negotiated here. Leaving during its binding period incurs the treaty’s Infamy and relations penalties. Tribute reductions, exemption from military service and other treaties retain their own terms. Ships already transferred remain with the central government."
 nesnd_phi_route_1_terms_tt:0 "The central government pays Luzon #v £8,000#! a week for #v 12 months#!. A separate treaty reduces the share of income paid in tribute by #v 10 percentage points#!. Luzon retains its fleet and garrison. The central government needs at least #v £10,000#! in weekly surplus excluding construction, #v £100,000#! in reserves, and eligibility for both treaties. The subsidy treaty is withdrawn at the end of the year; the tribute reduction retains its own terms."
 nesnd_phi_route_2_terms_tt:0 "On the first agreement, Luzon transfers #v 20 ships of the line#! that it owns and that are not engaged in war. It retains #v 20 frigates#! and the garrison. The central government pays #v £3,000#! weekly for #v 12 months#!, and concludes separate treaties for reduced tribute and exemption from military service. It needs at least #v £5,000#! in weekly surplus excluding construction and #v £60,000#! in reserves. Renewals do not transfer more ships. The subsidy ends after a year; the other agreements retain their own terms."
 nesnd_phi_usm_accept_tt:0 "Return the approved terms to Luzon for final consent. Treaty eligibility, finances, the subject relationship and the fleet must still meet the requirements. No subsidy is paid and no ships are transferred yet."
 nesnd_phi_reject_tt:0 "Return the proposal. Another may be submitted after 90 days."
 nesnd_phi_defer_tt:0 "Do not sign this agreement. Negotiations may resume after 30 days."
 nesnd_phi_finance.reject:0 "We cannot authorize this expense."
 nesnd_phi_finance.defer:0 "Return it for further negotiation."
 nesnd_phi_finance.cancel:0 "Withhold our signature."
 nesnd_phi_finance.1.t:0 "Paying the Luzon Garrison"
 nesnd_phi_finance.1.d:0 "Luzon asks the central government to share the cost of the troops and ships maintained on the islands. Its administration argues that overseas service cannot depend indefinitely on local revenue alone.\n\nThe proposal provides #v £8,000#! a week for one year, alongside a reduction in tribute. It now falls to the central government to decide whether to undertake these obligations."
 nesnd_phi_finance.1.a:0 "Approve the funding and seek Luzon’s consent."
 nesnd_phi_finance.2.t:0 "A Division of the Fleet"
 nesnd_phi_finance.2.d:0 "Luzon proposes to transfer twenty ships of the line to the central navy. The frigates would remain to defend the islands, as would the garrison. Taking over the ships would also make the central government responsible for their crews, bases and supplies.\n\nIn return, Luzon seeks exemption from military service, reduced tribute and #v £3,000#! a week for one year to support the reorganization."
 nesnd_phi_finance.2.a:0 "Agree to this division of responsibilities."
 nesnd_phi_finance.3.t:0 "The Funding Offer"
 nesnd_phi_finance.3.d:0 "The central government has approved Luzon’s request. It offers #v £8,000#! a week for one year, with reduced tribute under a separate agreement. The fleet and garrison would remain Luzon’s responsibility.\n\nThe administration in Manila must now give its consent before the payments can begin."
 nesnd_phi_finance.3.a:0 "Sign the agreement."
 nesnd_phi_finance.4.t:0 "The Naval Agreement"
 nesnd_phi_finance.4.d:0 "The central government has accepted the proposed division of naval duties. The frigates will defend the islands, and the Western Administration’s garrison will remain in Luzon.\n\nLuzon’s signature will confirm the ship transfer, reduced tribute and exemption from service, together with #v £3,000#! in weekly payments for one year. A renewal will retain the previous transfer without requiring further ships."
 nesnd_phi_finance.4.a:0 "Sign and carry out the transfer."
 nesnd_phi_finance.5.t:0 "A Settlement of Expenses"
 nesnd_phi_finance.5.d:0 "Both governments have signed. The central treasury must now make the agreed payments, while Luzon’s administration must use its revenues to support the garrison, the fleet and the islands’ civilian needs.\n\nThe coming year will show whether these obligations can be maintained after the temporary subsidy ends."
 nesnd_phi_finance.5.a:0 "Put the agreement into effect."
 nesnd_phi_finance.6.t:0 "A Year of Funding"
 nesnd_phi_finance.6.d:0 "The year of payments is over, and the subsidy treaty has ended as agreed. Luzon must now support its remaining forces from current revenues or negotiate fresh assistance. Its other obligations remain governed by the existing subject relationship and treaties."
 nesnd_phi_finance.6.a:0 "Settle the coming year’s expenses."
 nesnd_phi_finance.7.t:0 "Funding Interrupted"
 nesnd_phi_finance.7.d:0 "The subsidy can no longer continue on the agreed terms. Luzon’s military and naval authorities must revise their spending. Any new agreement will have to reflect the present subject relationship, market arrangements and military obligations."
 nesnd_phi_finance.7.a:0 "Reconsider the budget."
 nesnd_phi_finance.8.t:0 "The Garrison Sustained"
 nesnd_phi_finance.8.d:0 "For three months after the subsidy ended, Luzon has maintained its finances, forces and civilian livelihoods. The garrison remains supplied and the fleet has the crews it needs. The administration can plan its next season of spending from revenues it actually receives."
 nesnd_phi_finance.8.a:0 "Maintain this settlement."
 nesnd_phi_finance.10.t:0 "Revised Terms"
 nesnd_phi_finance.10.d:0 "The two governments have amended the treaty through diplomatic negotiations. Its terms now differ from the earlier military funding agreement. Luzon’s administration will follow the revised treaty; its payment schedule and other obligations can be reviewed in the diplomacy panel."
 nesnd_phi_finance.10.a:0 "Observe the revised agreement."

 nesnd_phi_request_cash_a_button:0 "Negotiate a Fixed Garrison Subsidy"
 nesnd_phi_request_cash_a_button_desc:0 "Agree on a weekly contribution from the central government towards the garrison and ocean-going fleet. A confirmed commitment to Ming or Wu must match both governments’ present allegiances.\n\n$nesnd_phi_cash_1_terms_tt$"
 nesnd_phi_request_cash_b_button:0 "Divide Naval Duties with Fixed Funding"
 nesnd_phi_request_cash_b_button_desc:0 "Transfer the ships of the line to the central government, retaining frigates to defend the islands and the existing garrison. Negotiate fixed funding for the new arrangement. This agreement does not change allegiance to Ming or Wu, neutrality or independence.\n\n$nesnd_phi_cash_2_terms_tt$"
 nesnd_phi_cash_1_terms_tt:0 "The central government pays Luzon #v £8,700#! weekly for #v 12 months#!. Luzon retains its garrison and fleet. Tribute continues under the existing subject relationship; this agreement neither reduces the tribute rate nor changes Liberty Desire. The central government needs at least #v £10,000#! in weekly surplus excluding construction, #v £100,000#! in reserves, and eligibility for the subsidy treaty. Payments begin only after both governments consent and end after the agreed year."
 nesnd_phi_cash_2_terms_tt:0 "The first agreement transfers #v 20 ships of the line#! to the central government. Luzon retains #v 20 frigates#! and the garrison, and gains exemption from military service if eligible. The central government pays #v £3,700#! weekly for #v 12 months#!. Tribute continues at the existing rate. The central government needs at least #v £5,000#! in weekly surplus excluding construction and #v £60,000#! in reserves. Renewals do not transfer additional ships; the end of the year terminates only this subsidy."
 nesnd_phi_finance.11.t:0 "A Garrison Subsidy"
 nesnd_phi_finance.11.d:0 "Luzon requests an annual contribution towards the troops and ships it maintains for imperial service. Tribute would continue under the existing arrangement, while the central treasury would take on a separate share of the military expense.\n\nThe proposed payment is #v £8,700#! a week for one year."
 nesnd_phi_finance.11.a:0 "Approve the subsidy and seek Luzon’s consent."
 nesnd_phi_finance.12.t:0 "Consent to the Subsidy"
 nesnd_phi_finance.12.d:0 "The central government has approved #v £8,700#! in weekly payments for one year. Luzon would continue paying tribute under its present obligations and remain responsible for the fleet and garrison.\n\nThe administration in Manila must give final consent to begin the payments."
 nesnd_phi_finance.12.a:0 "Sign the agreement."
 nesnd_phi_finance.13.t:0 "Funding the Naval Division"
 nesnd_phi_finance.13.d:0 "Luzon asks the central navy to take over twenty ships of the line, retaining the frigates and garrison for local defence. The central government would provide their new bases, crews and supplies.\n\nTribute would continue on the existing terms. Luzon seeks #v £3,700#! a week for one year and exemption from further military service under the agreed arrangements."
 nesnd_phi_finance.13.a:0 "Approve the division and its funding."
 nesnd_phi_finance.14.t:0 "Ships and Funding"
 nesnd_phi_finance.14.d:0 "The central government has accepted the naval division. Twenty ships of the line would pass to its navy, while the frigates and garrison remain in Luzon. Renewals retain the transfer already made.\n\nThe agreement provides #v £3,700#! a week for one year. Tribute and exemption from military service follow their separate terms. Luzon must now give final consent."
 nesnd_phi_finance.14.a:0 "Sign and complete the handover."

 nesnd_phi_propose_native_a_tt:0 "Submit the proposal to the central government. If approved, it returns to Luzon for final consent. Proposed terms:\n\n$nesnd_phi_route_1_terms_tt$"

 nesnd_phi_propose_native_b_tt:0 "Submit the proposal to the central government. If approved, it returns to Luzon for final consent. Proposed terms:\n\n$nesnd_phi_route_2_terms_tt$"

 nesnd_phi_propose_cash_a_tt:0 "Submit the proposal to the central government. If approved, it returns to Luzon for final consent. Proposed terms:\n\n$nesnd_phi_cash_1_terms_tt$"

 nesnd_phi_propose_cash_b_tt:0 "Submit the proposal to the central government. If approved, it returns to Luzon for final consent. Proposed terms:\n\n$nesnd_phi_cash_2_terms_tt$"
