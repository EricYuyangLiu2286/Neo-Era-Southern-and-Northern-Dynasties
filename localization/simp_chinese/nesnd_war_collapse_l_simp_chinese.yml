l_simp_chinese:
 nesnd_japan_war_collapse:0 "幕府危局"
 nesnd_japan_war_collapse_reason:0 "吴军渡海而来，幕府的号令还能传至何处？京都维系朝廷的名分，关东聚集诸家的兵力。一旦两地同时失守，丰臣家便再无力约束各藩。战败后的日本，将由胜者重定三家的疆界与名分。"
 nesnd_japan_war_collapse_status:0 "与吴朝交战期间，#bold 京都与关东同时被敌军占领#!，幕府便告崩溃。京都或关东尚有一地未失，仍可继续抵抗。向吴朝屈服、被其强制执行战争要求，也将进入战败处置。"
 nesnd_japan_war_collapse_fallen:0 "幕府已告崩溃。丰臣、德川与朝廷的疆界正在重定。仍被第三国占据的土地，须待战局厘清后处置。"
 nesnd_xiangyang_camp_journal:0 "襄阳大营"
 nesnd_xiangyang_camp_journal_reason:0 "襄阳扼汉水而通江汉，是南朝内地兵马往来的枢纽。大营将士追随陈东阳的新政，既不愿为郑氏易代效力，也不愿把立宪的前途交回旧士绅手中。军需统筹与常年操练，使这支内陆军队仍有守住阵地的本钱。"
 nesnd_xiangyang_camp:0 "襄阳大营"
 nesnd_xiangyang_camp_desc:0 "统一筹措军械与粮饷，整饬营伍，固守江汉。"
 nesnd_capital_surrender_accept:0 "大势已去。"
 nesnd_capital_surrender_tt:0 "本国将被吴朝吞并。"
