l_simp_chinese:
 nesnd_external_choose_wu:0 "与吴朝往来"
 nesnd_external_choose_sih:0 "联络川蜀"
 nesnd_external_choose_hus:0 "共和使节赴东洲"
 nesnd_external_choose_fra:0 "向法国致书"
 nesnd_external_hus_title:0 "海东的来信"
 nesnd_external_hus_desc:0 "南朝易代的消息传到了东洲。当年同我们争夺独立的郑氏海上帝国，如今为谁来主持天下而分裂。反郑的一方或许会来向共和国求援，商人则盯着港口与航路的去向。\n\n这是扩大交往的机会。只是援助别人，花的是共和国自己的国库与工厂。"
 nesnd_external_fra_title:0 "两海之间"
 nesnd_external_fra_desc:0 "南朝使者请法国承认易代、延续旧约；印度那边，南部海岸与殖民地的争执还没有了结。两头都押着法国商人、债权人和军官的身家。"
 nesnd_external_qe1_title:0 "巴蜀关山"
 nesnd_external_qe1_desc:0 "四川商队带来了南朝的消息。敦煌一败，西秦的兵力和财赋都经不起再折腾。东边若再动刀兵，巴蜀的商道和边防会一起吃紧。"
 nesnd_external_sha_title:0 "风雪中的国书"
 nesnd_external_sha_desc:0 "南朝争位的消息传到了北地共和国。流亡者从战报里认出了旧日的名字，有人已经开始联络东洲的同道。这些旧交，或许能为共和国换来钱和军械。"
 nesnd_external_bur_title:0 "江口与王庭"
 nesnd_external_bur_desc:0 "南朝易代，王庭同这个强邻的交道也要变了。沿江的买卖和旧约里的义务，哪一样都撂不下。许诺钱或军械之前，王庭得先看清谁靠得住。"
 nesnd_external_mug_title:0 "南方的海岸"
 nesnd_external_mug_desc:0 "南朝易代，印度海岸的旧账又被翻了出来。明人在迈索尔的属地和沿海商约，一直扎在帝国身上。朝臣可以向法国求钱求械；南朝若仍占着迈索尔的土地，正好借机重提领土主张。"
 nesnd_external_gbr_title:0 "封锁之后"
 nesnd_external_gbr_desc:0 "法兰西与明人结盟的那些年，英国的航路处处受挤。如今南朝争位，商人想趁乱挤进新的港口，伦敦也可以重新挑选朋友。"
 nesnd_external_rus_title:0 "东方驿报"
 nesnd_external_rus_desc:0 "俄国的东方疆界漫长，南朝之争也牵着圣彼得堡的利益。一个靠得住的贸易伙伴，或一个肯收援助的政府，都能让俄国在东方好过些。可以等胜负分明再说，也可以趁各方还在四处求援，拿钱和军械先结下交情。"
 nesnd_external_policy:0 "南朝变局与外交"
 nesnd_external_policy_reason:0 "南朝易代，旧约、商路和海外属邦的归属都悬了起来。各国使节开始往来奔走，有人来求援，也有人等着我们开口。已经签下的条约，照旧约束签约各方。"
 nesnd_external_follow:0 "备好国书，继续查问。"
 nesnd_external_decline:0 "自家的事要紧。"
 nesnd_external_choose_desc:0 "使节先与对方商定收受国书的途径。"
 nesnd_external_choose_opposition:0 "联络反吴盟主"
 nesnd_external_choose_opposition_desc:0 "遣使拜会领兵反吴的盟主，探问军中所需。"
 nesnd_external_offer_money:0 "支给军费"
 nesnd_external_offer_money_desc:0 "拟从本国国库每周拨给接洽国@money!#v 500#!，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_offer_arms:0 "商议军械输送"
 nesnd_external_offer_arms_desc:0 "向接洽国提议输送#v 10#!单位小武器，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_status_choose:0 "先选择接洽国，再检查可行的条款。"
 nesnd_external_status_selected:0 "使节已与#bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#!取得联系，正在等候本国训令。"
 nesnd_external_status_pending:0 "使节正在等候回信。可撤回尚未签成的请求。"
 nesnd_external_status_committed:0 "条约已经签成。实际履行、冻结及退出条件可在外交条约界面查看。"
 nesnd_external_money_title:0 "一份拨款提议"
 nesnd_external_money_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者带来了拨款提案。其国库拟每周支付@money!#v 500#!，约束期为#v 1年#!。承诺将记入双方的外交条约和收支。"
 nesnd_external_arms_title:0 "军械清单"
 nesnd_external_arms_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]送来一份军械清单，拟向本国转移#v 10#!小武器，约束期为#v 1年#!。使者附上了条约草案，只等我们落笔。"
 nesnd_external_accept:0 "准予签署。"
 nesnd_external_refuse:0 "谢绝这份提议。"
 nesnd_external_commitment_tt:0 "条约即日生效，约束期满后仍会履行，直至撤回或重议。"
 nesnd_external_request_money:0 "请求财政协助"
 nesnd_external_request_money_desc:0 "请接洽国每周拨给本国@money!#v 500#!，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_request_arms:0 "请求军械协助"
 nesnd_external_request_arms_desc:0 "请接洽国向本国输送#v 10#!单位小武器，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_request_money_title:0 "一封求助的国书"
 nesnd_external_request_money_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者请求财政协助。他呈上每周@money!#v 500#!的拨款方案，希望与本国订立约束期#v 1年#!的条约。"
 nesnd_external_request_arms_title:0 "远方的军械请求"
 nesnd_external_request_arms_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]遣使请求输送#v 10#!小武器，并提出约束期#v 1年#!的条约。货单已经摆在外交部的案头。"
 nesnd_external_accept_request:0 "可以，拟约吧。"
 nesnd_external_refuse_request:0 "自家用度尚紧，恕难从命。"
 nesnd_external_reconsider:0 "另择接洽国"
 nesnd_external_reconsider_desc:0 "在援助尚未签成时，另选接洽对象。"
 nesnd_external_mysore:0 "重提迈索尔之议"
 nesnd_external_mysore_desc:0 "在南朝仍占据迈索尔土地时提出领土主张。与南朝关系降低#v 10#!。获得宣称，但不立即转移土地或发动战争。"
 nesnd_external_mysore_tt:0 "获得对迈索尔的宣称，与南朝的关系降低#v 10#!。"
 nesnd_external_cancel_request:0 "撤回使节请求"
 nesnd_external_cancel_request_desc:0 "尚未签成的请求作废，既有条约继续有效。"
 nesnd_external_dismiss:0 "暂罢此议"
 nesnd_external_dismiss_desc:0 "收起国书，撤回还没答复的请求。已经生效的条约，要在外交界面另行处理。"
 nesnd_external_resume:0 "重开南朝外交议程"
 nesnd_external_resume_desc:0 "南朝的危机还没过去，使节可以再出发。上一轮已经签成的援助，不能再议一次。"
 nesnd_external_end_title:0 "使臣复命"
 nesnd_external_end_desc:0 "南朝争位有了定局，使臣回国复命。签下的条约照旧有效，该付的钱、该运的械，一样不能少。"
 nesnd_external_end_option:0 "将文书交付各署。"
 nesnd_external_contact_offer_tt:0 "选定接洽国后，可向其提议拨款或输送军械。"
 nesnd_external_contact_request_tt:0 "选定接洽国后，可向其请求拨款或军械。"
 nesnd_external_agenda_live_tt:0 "南朝之争尚容本国遣使接洽。"
 nesnd_external_no_target_tt:0 "使节尚未选定接洽国。"
 nesnd_external_no_pending_tt:0 "使节手中没有待答的提案。"
 nesnd_external_no_commitment_tt:0 "本国尚未为南朝之争议定援助。"
 nesnd_external_wu_available_tt:0 "吴朝仍在，且两国之间并无战事。"
 nesnd_external_sih_available_tt:0 "川蜀政权仍在，且两国之间并无战事。"
 nesnd_external_hus_available_tt:0 "华夏东洲共和国仍在，且两国之间并无战事。"
