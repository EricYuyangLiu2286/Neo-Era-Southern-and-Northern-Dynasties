 nesnd_external_no_cooldown_tt:0 "过去#v 6个月#!内，本国未曾为此递交提案。"
 nesnd_external_india_free_tt:0 "本国在印度的外交往来中没有待答请求或尚在限期内的援助承诺。"
 nesnd_external_export_room_tt:0 "小武器的剩余出口额度至少为#v 10#!。"
 nesnd_external_import_room_tt:0 "小武器的剩余进口额度至少为#v 10#!。"
 nesnd_external_money_terms_tt:0 "两国可签订每周拨付@money!#v 500#!、约束期#v 1年#!的条约。"
 nesnd_external_arms_terms_tt:0 "两国可签订输送#v 10#!单位小武器、约束期#v 1年#!的条约。"
 nesnd_external_agenda_over_tt:0 "南朝之争已有定局，或使节已无可接洽的一方。"
 nesnd_external_dismissed_tt:0 "本国已召回使节，结束此次交涉。"
 nesnd_external_status_refused:0 "#bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#!已谢绝提案，双方未曾签约。"
 nesnd_external_end_no_partner_desc:0 "国书已经无处可递，使节只得回国复命。先前签下的条约照旧履行。"
 nesnd_external_cancelled_tt:0 "召回待答的提案。再次遣使须距上次发函满#v 6个月#!。"
 nesnd_external_dismiss_tt:0 "召回使节及待答提案，结束此次外交议程。"
 nesnd_external_reconsider_tt:0 "撤回对现有接洽国的委任，可另择一国。"
 nesnd_external_mysore_unclaimed_tt:0 "本国尚未借南朝之争重提迈索尔主张。"
