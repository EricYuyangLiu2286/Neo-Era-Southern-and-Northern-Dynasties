l_simp_chinese:
 nesnd_external_choose_wu:0 "与吴朝往来"
 nesnd_external_choose_sih:0 "联络川蜀"
 nesnd_external_choose_hus:0 "共和使节赴东洲"
 nesnd_external_choose_fra:0 "向法国致书"
 nesnd_external_hus_title:0 "海东的来信"
 nesnd_external_hus_desc:0 "南朝易代的消息传到了东洲。曾与我们争夺独立的郑氏海上帝国，如今又因谁应当主持天下而分裂。反对郑氏的势力可能向共和国寻求援助，商人则在关注港口与航路的去向。\n\n我们可以借此扩大对外交往，援助别国却须动用自己的国库与工厂。政府应当判断哪些关系有利于共和国，又能承担多少承诺。"
 nesnd_external_fra_title:0 "两海之间"
 nesnd_external_fra_desc:0 "南朝使者请求承认易代并延续旧约，印度方面则仍有南部海岸与殖民地的争执。法国商人、债权人与军官在两地都有利益。政府须决定与谁往来，又愿意为外交主张付出多少资金与军械。"
 nesnd_external_qe1_title:0 "巴蜀关山"
 nesnd_external_qe1_desc:0 "四川商队带来了南朝的消息。敦煌败绩以后，西秦更须慎用兵力与财赋。东方若再起兵戈，往来巴蜀的道路将同时牵动商贸与边防。我们应当决定，是联络川中、支持反吴联盟，还是先将财力用于本国。"
 nesnd_external_sha_title:0 "风雪中的国书"
 nesnd_external_sha_desc:0 "南朝争位的消息传到了北地共和国。流亡者从往事中认出参与争斗的名字，也有人开始联络东洲的同道。共和国或可从这些关系中求得资金与军械，但政府须先决定自己需要什么援助，又愿意维持怎样的往来。"
 nesnd_external_bur_title:0 "江口与王庭"
 nesnd_external_bur_desc:0 "南朝易代将改变王庭与这个强邻的往来。沿江贸易与既有条约所定的义务都不能置之不理。在向任何一方许诺资金或军械以前，朝廷须先考虑本国的地位，以及谁能维护我们的利益。"
 nesnd_external_mug_title:0 "南方的海岸"
 nesnd_external_mug_desc:0 "南朝易代使印度海岸的旧争端再受关注。明人在迈索尔的属地与沿海通商安排，长期牵动帝国的利益。朝臣可以向法国请求资金或军械。若南朝仍占据迈索尔土地，我们也可借此重新提出领土主张。"
 nesnd_external_gbr_title:0 "封锁之后"
 nesnd_external_gbr_desc:0 "法兰西与明人的旧同盟曾使英国航路备受挤压。如今南朝争位，商人希望借局势变化进入新的港口，政府也可重新选择交往的对象。若要用资金与军械争取影响，我们仍须衡量这项支出对本国的用处。"
 nesnd_external_rus_title:0 "东方驿报"
 nesnd_external_rus_desc:0 "漫长的东方疆界使南朝之争也牵动俄国的利益。一个可靠的贸易伙伴，或愿意接受援助的政府，都可能改善我们在东方的处境。朝廷可以等待胜负分明，也可以趁各方仍在寻求外援时，以资金和军械争取交往。"
 nesnd_external_policy:0 "南朝变局与外交"
 nesnd_external_policy_reason:0 "南朝易代牵动旧约、商路与海外属邦的去向。政府须决定同谁往来，是否提供援助，又是否需要向外国求助。各项新提议尚待商定，既有条约则仍约束着签署它们的国家。"
 nesnd_external_follow:0 "备好国书，继续查问。"
 nesnd_external_decline:0 "先料理本国的事务。"
 nesnd_external_choose_desc:0 "选择接洽国。既有条约仍然有效。本次南朝危机中只能议定一份援助。"
 nesnd_external_choose_opposition:0 "联络实际反吴领袖"
 nesnd_external_choose_opposition_desc:0 "反吴联盟须已有领袖。本国须独立，且未与其交战。选定接洽对象后，再另议资金或军械。"
 nesnd_external_offer_money:0 "支给军费"
 nesnd_external_offer_money_desc:0 "提出每周@money!#v 500#!的资金援助，约束期#v 1年#!。须有#v 26,000#!储备、固定净收入至少#v 5,000#!、总净收入至少#v 1,000#!，并满足条约签署条件。对方可以拒绝。约束期满后，仍须撤回或重谈才能停止转移。"
 nesnd_external_offer_arms:0 "商议军械输送"
 nesnd_external_offer_arms_desc:0 "提出#v 10#!小武器的商品援助，约束期#v 1年#!。本国的供应、价格、出口额度与运输须满足条件。对方可以拒绝。供给或运输不足时，输送可能中止。"
 nesnd_external_request_tt:0 "使节将在#v 7日#!后递交请求。对方接受前不拨款、不转移商品。"
 nesnd_external_status_choose:0 "先选择接洽国，再检查可行的条款。"
 nesnd_external_status_selected:0 "接洽国：#bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#!。资金额与军械额分别列在提案按钮中。"
 nesnd_external_status_pending:0 "使节正在等候回信。可撤回尚未签成的请求。"
 nesnd_external_status_committed:0 "条约已经签成。实际履行、冻结及退出条件可在外交条约界面查看。"
 nesnd_external_money_title:0 "一份拨款提议"
 nesnd_external_money_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者带来了拨款提案。其国库拟每周支付@money!#v 500#!，约束期为#v 1年#!。承诺将记入双方的外交条约和收支。"
 nesnd_external_arms_title:0 "军械清单"
 nesnd_external_arms_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]送来一份军械清单，拟向本国转移#v 10#!小武器，约束期为#v 1年#!。使者附上了条约草案，交由本国决定是否签署。"
 nesnd_external_accept:0 "准予签署。"
 nesnd_external_refuse:0 "谢绝这份提议。"
 nesnd_external_commitment_tt:0 "条约立即生效。#bold 约束期不是自动到期日#!。提前退出须承担违约后果。正常撤回、供给中止及费用可在条约界面查看。"
 nesnd_external_request_money:0 "请求财政协助"
 nesnd_external_request_money_desc:0 "向选定伙伴请求每周@money!#v 500#!的资金援助，约束期#v 1年#!。须由对方承担支出，并自愿接受。"
 nesnd_external_request_arms:0 "请求军械协助"
 nesnd_external_request_arms_desc:0 "向选定伙伴请求#v 10#!小武器的商品援助，约束期#v 1年#!。双方须满足市场、运输与条约签署条件。对方可以拒绝。"
 nesnd_external_request_money_title:0 "一封求助的国书"
 nesnd_external_request_money_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者请求财政协助。他呈上每周@money!#v 500#!的拨款方案，希望与本国订立约束期#v 1年#!的条约。"
 nesnd_external_request_arms_title:0 "远方的军械请求"
 nesnd_external_request_arms_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]遣使请求输送#v 10#!小武器，并提出约束期#v 1年#!的条约。货单已经送至外交部，是否承诺这项输送，仍待本国裁定。"
 nesnd_external_accept_request:0 "同意援助，交付签署。"
 nesnd_external_refuse_request:0 "本国另有用度，暂不允准。"
 nesnd_external_reconsider:0 "另择接洽国"
 nesnd_external_reconsider_desc:0 "在援助尚未签成时，另选接洽对象。"
 nesnd_external_mysore:0 "重提迈索尔之议"
 nesnd_external_mysore_desc:0 "在南朝仍占据迈索尔土地时提出领土主张。与南朝关系降低#v 10#!。获得宣称，但不立即转移土地或发动战争。"
 nesnd_external_mysore_tt:0 "迈索尔主张进入本国外交议程。附属身份与战争资格继续按现行条约处理。"
 nesnd_external_cancel_request:0 "撤回使节请求"
 nesnd_external_cancel_request_desc:0 "尚未签成的请求作废，既有条约继续有效。"
 nesnd_external_dismiss:0 "暂罢此议"
 nesnd_external_dismiss_desc:0 "结束此次外交议程并撤回待答请求。已经生效的条约仍须在外交界面分别处理。"
 nesnd_external_resume:0 "重开南朝外交议程"
 nesnd_external_resume_desc:0 "南朝危机尚未结束，可以恢复接洽。此次议程已经签成的援助不能重复议定。"
 nesnd_external_end_title:0 "使臣复命"
 nesnd_external_end_desc:0 "南朝争位已有定局，使臣也已完成此行的使命。已经签成的条约仍然有效，政府须继续承担相应义务，经营这场变局留下的关系。"
 nesnd_external_end_option:0 "将文书交付各署。"
