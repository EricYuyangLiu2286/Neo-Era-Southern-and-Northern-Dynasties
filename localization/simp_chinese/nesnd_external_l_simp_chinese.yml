 nesnd_external_request_arms_tt:0 "使节将在#v 7日#!后向对方请求供应本国#v 10#!单位小武器，由对方决定是否应允。"
 nesnd_external_refuse_tt:0 "谢绝这份提案，使节将答复带回本国。"
