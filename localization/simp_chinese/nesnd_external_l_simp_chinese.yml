l_simp_chinese:
 nesnd_external_choose_wu:0 "与吴朝往来"
 nesnd_external_choose_sih:0 "联络川蜀"
 nesnd_external_choose_hus:0 "共和使节赴东洲"
 nesnd_external_choose_fra:0 "向法国致书"
 nesnd_external_hus_title:0 "海东的来信"
 nesnd_external_hus_desc:0 "南朝易代的消息传到了东洲。曾与我们争夺独立的郑氏海上帝国，如今又因谁应当主持天下而分裂。反对郑氏的势力可能向共和国寻求援助，商人则在关注港口与航路的去向。\n\n我们可以借此扩大对外交往，援助别国却须动用自己的国库与工厂。政府应当判断哪些关系有利于共和国，又能承担多少承诺。"
 nesnd_external_fra_title:0 "两海之间"
 nesnd_external_fra_desc:0 "南朝使者请求承认易代并延续旧约，印度方面则仍有南部海岸与殖民地的争执。法国商人、债权人与军官在两地都有利益。政府须决定与谁往来，又愿意为外交主张付出多少资金与军械。"
 nesnd_external_qe1_title:0 "巴蜀关山"
 nesnd_external_qe1_desc:0 "四川商队带来了南朝的消息。敦煌败绩以后，西秦更须慎用兵力与财赋。东方若再起兵戈，往来巴蜀的道路将同时牵动商贸与边防。我们应当决定，是联络川中、支持反吴联盟，还是先将财力用于本国。"
 nesnd_external_sha_title:0 "风雪中的国书"
 nesnd_external_sha_desc:0 "南朝争位的消息传到了北地共和国。流亡者从往事中认出参与争斗的名字，也有人开始联络东洲的同道。共和国或可从这些关系中求得资金与军械，但政府须先决定自己需要什么援助，又愿意维持怎样的往来。"
 nesnd_external_bur_title:0 "江口与王庭"
 nesnd_external_bur_desc:0 "南朝易代将改变王庭与这个强邻的往来。沿江贸易与既有条约所定的义务都不能置之不理。在向任何一方许诺资金或军械以前，朝廷须先考虑本国的地位，以及谁能维护我们的利益。"
 nesnd_external_mug_title:0 "南方的海岸"
 nesnd_external_mug_desc:0 "南朝易代使印度海岸的旧争端再受关注。明人在迈索尔的属地与沿海通商安排，长期牵动帝国的利益。朝臣可以向法国请求资金或军械。若南朝仍占据迈索尔土地，我们也可借此重新提出领土主张。"
 nesnd_external_gbr_title:0 "封锁之后"
 nesnd_external_gbr_desc:0 "法兰西与明人的旧同盟曾使英国航路备受挤压。如今南朝争位，商人希望借局势变化进入新的港口，政府也可重新选择交往的对象。若要用资金与军械争取影响，我们仍须衡量这项支出对本国的用处。"
 nesnd_external_rus_title:0 "东方驿报"
 nesnd_external_rus_desc:0 "漫长的东方疆界使南朝之争也牵动俄国的利益。一个可靠的贸易伙伴，或愿意接受援助的政府，都可能改善我们在东方的处境。朝廷可以等待胜负分明，也可以趁各方仍在寻求外援时，以资金和军械争取交往。"
 nesnd_external_policy:0 "南朝变局与外交"
 nesnd_external_policy_reason:0 "南朝易代牵动旧约、商路与海外属邦的去向。政府须决定同谁往来，是否提供援助，又是否需要向外国求助。各项新提议尚待商定，既有条约则仍约束着签署它们的国家。"
 nesnd_external_follow:0 "备好国书，继续查问。"
 nesnd_external_decline:0 "先料理本国的事务。"
 nesnd_external_choose_desc:0 "使节先与对方商定收受国书的途径。"
 nesnd_external_choose_opposition:0 "联络反吴盟主"
 nesnd_external_choose_opposition_desc:0 "遣使拜会领兵反吴的盟主，探问军中所需。"
 nesnd_external_offer_money:0 "支给军费"
 nesnd_external_offer_money_desc:0 "拟从本国国库每周拨给接洽国@money!#v 500#!，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_offer_arms:0 "商议军械输送"
 nesnd_external_offer_arms_desc:0 "向接洽国提议输送#v 10#!单位小武器，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_status_choose:0 "先选择接洽国，再检查可行的条款。"
