l_simp_chinese:
 nesnd_tenasserim_recovery:0 "丹那沙林生计"
 nesnd_tenasserim_recovery_reason:0 "南洋联省的海船将染料运往江南，田主和商行从这条航路上收取地租、货款与利息。沿岸的村社也被卷入了这场繁荣：农户把收成交给园主，流民向承包人借钱，下一年的劳动便早早写进了债契。\n\n[Country.GetName]需要伐木、搬运和经营港务的人，也需要留下能够养活一家人的稻田。让新雇工领到工钱、让佃户留住收成，将决定联省的腹地能否成为一个有买卖、有积蓄的地方。"
 nesnd_ten_status_sampling:0 "正在采集前三个月的地方就业与生计数据。林场委办和正常立法可先行安排。"
 nesnd_ten_status_war:0 "战争中暂停巩固。检查丹那沙林的港口、海运和实际市场接入。"
 nesnd_ten_status_bankruptcy:0 "国家处于破产状态，巩固月份已中断。"
 nesnd_ten_status_access:0 "市场接入低于85%。检查当地基础设施、港口与海运。"
 nesnd_ten_status_working_hungry:0 "大量欠食人口仍在工作。检查农户收入、地租、税负和粮食价格，并推进适合本国支持力量的土地制度。"
 nesnd_ten_status_jobs:0 "无业劳动力超过12%。先检查已有空缺的工资和资质，再安排不占耕地的岗位。"
 nesnd_ten_status_income:0 "就业已有改善，家庭生计仍未达到巩固条件。检查工资、农户自给收入与日用品价格。"
 nesnd_ten_status_review:0 "继续检验就业、收入与市场接入；完成还需一处非占地产业达到75%配员。"
 nesnd_ten_conditions_bar:0 "地方生计条件"
 nesnd_ten_conditions_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_ten_conditions_bar_detail:0 "无业劳动力：#v [Country.MakeScope.Var('nesnd_ten_unemployment').GetValue|%1]#!\n欠食劳动力：#v [Country.MakeScope.Var('nesnd_ten_starving').GetValue|%1]#!\n其中在岗且欠食：#v [Country.MakeScope.Var('nesnd_ten_working_hungry').GetValue|%1]#!\n劳动力家庭[concept_sol]：#v [Country.MakeScope.Var('nesnd_ten_sol').GetValue|1]#!\n[concept_market_access]：#v [Country.MakeScope.Var('nesnd_ten_access').GetValue|%1]#!\n\n四项条件：无业至多#v 12%#!；欠食至多#v 25%#!且生活水平至少#v 6.5#!；接入至少#v 85%#!；和平且未破产。份额按丹那沙林本国州的劳动力计算，自给农属于有业人口，每月更新。"
 nesnd_ten_continuity_bar:0 "生计巩固"
 nesnd_ten_continuity_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 6个月#!"
 nesnd_ten_continuity_bar_detail:0 "采样至少三个月后，四项地方条件达标，且林场、渔场、铁矿、工具厂、纺织厂或食品厂中至少一处配员达到#v 75%#!并无原料短缺，每月增加#p 1#!。条件中断时连续月份归零。完成后当地获得#v 24个月#!的#p +10%#!资质获取。\n\n全国制度改革仍由$je_reform_indies$推进。"
 nesnd_ten_build_button:0 "委办林场"
 nesnd_ten_build_button_desc:0 "将林场列入政府的正常建设计划，向木商和承包人开放雇工。保留染料园和稻田，先以一处林场检验当地的招工与销路。\n\n每次排入#v 1级#!，专项最多委办#v 2次#!，间隔#v 6个月#!。第二次需已有林场达到#v 75%#!配员且无原料短缺；木材市场价格须不低于基础价的#v 50%#!，国库至少#v £5,000#!，实际资源容量允许施工。工程照常消耗建设力和财政。新建后检查生产方式，工具或技工资质不足时可选原始林业。"
 nesnd_ten_build_result_tt:0 "在丹那沙林排入1级林场的政府建设。正常支付施工费用，完工后招聘；本次不直接获得建筑、工人或进度。"
 nesnd_ten_train_button:0 "派驻学工教习"
 nesnd_ten_train_button_desc:0 "向已有空缺的非农产业派驻教习，教授记账和作业技艺。\n\n支付周总收入的#v 2.5%#!，至少#v £1,000#!；预计#v £[Country.MakeScope.Var('nesnd_ten_training_quote').GetValue|0]#!。丹那沙林资质获取#p +10%#!，持续#v 12个月#!，冷却#v 12个月#!。法律、财富和识字率仍决定各职业能够积累资质的人口。"
 nesnd_ten_tenant_button:0 "提出租佃法案"
 nesnd_ten_tenant_button_desc:0 "以固定租佃关系取代农奴的人身依附，让农户在交租之后安排自己的生计。\n\n启动原生租佃法立法：法律须可制定，有在阁利益集团或支持率至少#v 10%#!的政治运动支持；预计通过机会至少#v 15%#!、合法性至少#v 25#!，且没有其他法案、战争或革命。法案照常经历辩论、挫折与反对。"
 nesnd_ten_abolish_button:0 "提出解放法案"
 nesnd_ten_abolish_button_desc:0 "终止以债务拘束人身的制度，把劳动契约与债契分开。\n\n取消农奴制后，地方无业劳动力至多#v 15%#!且已采样三个月，方可由此提出废奴法案。其余支持、通过机会及合法性门槛与租佃法案相同。实际解放发生在原生立法通过时。"
 nesnd_ten_compromise_button:0 "议定田主补偿"
 nesnd_ten_compromise_button_desc:0 "立法期间向田主支付一次补偿，争取他们接受正在审议的新契约。\n\n地主政治力量至少#v 20%#!时可用；支付周总收入的#v 25%#!，至少#v £5,000#!，预计#v £[Country.MakeScope.Var('nesnd_ten_compromise_quote').GetValue|0]#!。地主赞同#p +3#!持续#v 24个月#!，冷却#v 24个月#!。本项不改变法案通过机会、地主立场或其他利益集团的态度。"
 nesnd_ten_dismiss_button:0 "停办专项"
 nesnd_ten_dismiss_button_desc:0 "将地方经营交回现有官署与商行，停止专项统计和教习安排。一年后可以重新开办。"
 nesnd_ten_dismiss_tt:0 "移除本日志与专项教习效果；一年后可从决议重新开办。已排入的正常建设、正在审议的法律及已支付的补偿继续有效；委办额度和已得奖励不会重置。"
 nesnd_ten_continue_tt:0 "继续专项，保留已有投资、法律和统计。不会增加土地、建筑或免费补贴。"
 nesnd_ten_reopen:0 "重开丹那沙林专项"
 nesnd_ten_reopen_desc:0 "重新检验丹那沙林的就业与农户生计。保留以前的委办记录，从零重新计算连续巩固月份。"
 nesnd_ten_training:0 "学工教习"
 nesnd_ten_recovery_skills:0 "地方工艺传习"
 nesnd_ten_landowners_compromise:0 "田主补偿协议"
 nesnd_tenasserim.1.t:0 "田租与债息"
 nesnd_tenasserim.1.d:0 "丹那沙林的地方官把村社账目送到了联省首府。许多农户一年到头守着稻田，收成出手之后，还要逐项偿还田租、种粮和债息。园主的货船照常离港，招工告示也已经贴出，村民手里的余钱仍买不起一家人所需的食粮。\n\n专项的账目需要重新审议：已有产业怎样雇人，旧契约怎样征收，官署又能从中拨出多少款项，都须一项项作出安排。"
 nesnd_tenasserim.1.a:0 "续办，逐项重议。"
 nesnd_tenasserim.1.b:0 "由地方照旧经营。"
 nesnd_tenasserim.2.t:0 "村社与市集"
 nesnd_tenasserim.2.d:0 "新的雇工把工钱带回了丹那沙林的村社。集市上的日用品有了买主，地方账目中失去生计的人数也逐渐减少。过去依靠预借货款安排一年的家庭，如今能够先留下本月所需，再决定下一笔开销。\n\n联省官署决定将已有的工艺传习延续两年，让受雇的工人和新来的学徒继续学习。港口与腹地之间的买卖，也将由这些家庭的收入支撑起来。"
 nesnd_tenasserim.2.a:0 "把这门生计做长久。"
