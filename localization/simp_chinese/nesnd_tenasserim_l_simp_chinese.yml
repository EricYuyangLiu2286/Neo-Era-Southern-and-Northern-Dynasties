l_simp_chinese:
 nesnd_tenasserim_recovery:0 "丹那沙林生计"
 nesnd_tenasserim_recovery_reason:0 "南洋联省的海船将染料运往江南，田主和商行从这条航路上收取地租、货款与利息。沿岸的村社也被卷入了这场繁荣：农户把收成交给园主，流民向承包人借钱，下一年的劳动便早早写进了债契。\n\n[Country.GetName]需要伐木、搬运和打理港务的人，也得给人留下能养活一家的稻田。新雇工领得到工钱，佃户留得住收成，联省的腹地才会有买卖、有积蓄。"
 nesnd_ten_status_sampling:0 "地方官正在汇报最初三个月的就业与生计。林场委办和法案审议可以先行。\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_war:0 "巩固经济民生的进程被战争打断，港口、海运与市场萧条下去...\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_bankruptcy:0 "国家仍受[concept_bankruptcy]惩罚，巩固月份已中断。\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_access:0 "市场接入低于85%。检查当地基础设施、港口与海运。\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_working_hungry:0 "大量欠食人口仍在工作。检查农户收入、地租、税负和粮食价格，并推进适合本国支持力量的土地制度。\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_jobs:0 "无业劳动力超过12%。先检查已有空缺的工资和资质，再安排不占耕地的岗位。\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_income:0 "就业已有所改善，但家庭生活成本仍未达到巩固条件。工资、农户自给收入与日用品价格仍在持续走高。\n$nesnd_ten_status_details_link$"
 nesnd_ten_status_review:0 "四项条件已达标。\n$nesnd_ten_status_details_link$"
 nesnd_ten_conditions_bar:0 "民生水平"
 nesnd_ten_conditions_bar_desc:0 "$nesnd_ten_conditions_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_ten_conditions_bar_detail:0 "无业劳动力：#v [Country.MakeScope.Var('nesnd_ten_unemployment').GetValue|%1]#!（至多#v 12%#!）\n欠食劳动力：#v [Country.MakeScope.Var('nesnd_ten_starving').GetValue|%1]#!（至多#v 25%#!）\n其中在岗且欠食：#v [Country.MakeScope.Var('nesnd_ten_working_hungry').GetValue|%1]#!\n劳动力家庭[concept_sol]：#v [Country.MakeScope.Var('nesnd_ten_sol').GetValue|1]#!（至少#v 6.5#!）\n[concept_market_access]：#v [Country.MakeScope.Var('nesnd_ten_access').GetValue|%1]#!（至少#v 85%#!）\n\n另须和平，且未受[concept_bankruptcy]惩罚。三项劳动力份额按本国丹那沙林州的全部劳动力计算，自给农计作有业。每月更新。"
 nesnd_ten_continuity_bar:0 "民生巩固"
 nesnd_ten_continuity_bar_desc:0 "$nesnd_ten_continuity_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 6#!"
 nesnd_ten_continuity_bar_detail:0 "已有三个月地方汇报后，四项生计条件须全部达标，且林场、渔场、铁矿、工具厂、纺织厂或食品厂中至少一处达到#v 75%#!配员、没有原料短缺。\n\n每个达标月份增加#p 1个月#!，连续#v 6个月#!即可完成。任一条件不达标，连续月份归零。完成后，丹那沙林的资质获取提高#p 10%#!，持续#v 24个月#!。"
 nesnd_ten_build_button:0 "委办林场"
 nesnd_ten_build_button_desc:0 "委托商人经营林场，为当地增加不占耕地的雇工岗位。\n\n每次排入#v 1级#!政府建设，最多委办#v 2次#!，间隔#v 6个月#!。已有林场须达到#v 75%#!配员且无原料短缺。木价至少为基础价的#v 50%#!，国库至少#v £5,000#!，当地仍可建林场。工程照常消耗建设力和财政。工具或技工资质不足时，可选原始林业。"
 nesnd_ten_build_result_tt:0 "在丹那沙林排入1级林场的政府建设。正常支付施工费用，完工后招聘。本次不直接获得建筑、工人或进度。"
 nesnd_ten_train_button:0 "派驻学工教习"
 nesnd_ten_train_button_desc:0 "向已有空缺的非农产业派驻教习，教授记账和作业技艺。\n\n支付周总收入的#v 2.5%#!，至少#v £1,000#!。预计#v £[Country.MakeScope.Var('nesnd_ten_training_quote').GetValue|0]#!。丹那沙林资质获取#p +10%#!，持续#v 12个月#!，冷却#v 12个月#!。法律、财富和识字率仍决定各职业能够积累资质的人口。"
 nesnd_ten_tenant_button:0 "提出租佃法案"
 nesnd_ten_tenant_button_desc:0 "以固定租佃关系取代农奴的人身依附，让农户在交租之后安排自己的生计。\n\n开始审议租佃法案：法律须可制定，并有执政利益集团或支持率至少#v 10%#!的政治运动支持。预计通过机会至少#v 15%#!，合法性至少#v 25#!，且没有其他在议法案、战争或革命。"
 nesnd_ten_abolish_button:0 "提出解放法案"
 nesnd_ten_abolish_button_desc:0 "废除奴隶制度，使劳动者不再作为他人的财产。\n\n取消农奴制后，地方无业劳动力至多#v 15%#!，且已有三个月的地方汇报，方可由此提出废奴法案。支持、通过机会及合法性门槛与租佃法案相同。法律通过后实行解放。"
 nesnd_ten_compromise_button:0 "议定田主补偿"
 nesnd_ten_compromise_button_desc:0 "立法期间向田主支付一次补偿，争取他们接受正在审议的新契约。\n\n地主政治力量至少#v 20%#!时可用。支付周总收入的#v 25%#!，至少#v £5,000#!，预计#v £[Country.MakeScope.Var('nesnd_ten_compromise_quote').GetValue|0]#!。地主赞同#p +3#!持续#v 24个月#!，冷却#v 24个月#!。本项不改变法案通过机会、地主立场或其他利益集团的态度。"
 nesnd_ten_dismiss_button:0 "停办专项"
 nesnd_ten_dismiss_button_desc:0 "将地方经营交回现有官署与商行，停办专项教习。一年后可以重新开办。"
 nesnd_ten_dismiss_tt:0 "停办专项并撤回学工教习，一年后可重新开办。已排入的建设、正在审议的法律及已付补偿继续有效。此前的委办次数与奖励仍然保留。"
 nesnd_ten_continue_tt:0 "续办丹那沙林专项，保留已有的工程、法案与拨款安排。"
 nesnd_ten_reopen:0 "重开丹那沙林专项"
 nesnd_ten_reopen_desc:0 "重新着手改善丹那沙林的就业与农户生计。以前的委办次数保留，生计巩固重新累计。"
 nesnd_ten_training:0 "学工教习"
 nesnd_ten_recovery_skills:0 "地方工艺传习"
 nesnd_ten_landowners_compromise:0 "田主补偿协议"
 nesnd_tenasserim.1.t:0 "田租与债息"
 nesnd_tenasserim.1.d:0 "丹那沙林的经营遇到了难处。林场和工场招工，得有人肯付工钱；村民要留住收成，得先理清租佃和债务；官署派的教习，也要年年拨钱养着。"
 nesnd_tenasserim.1.a:0 "续办，逐项重议。"
 nesnd_tenasserim.1.b:0 "由地方照旧经营。"
 nesnd_tenasserim.2.t:0 "村社与市集"
 nesnd_tenasserim.2.d:0 "新的雇工把工钱带回了丹那沙林的村社。集市上的日用品有了买主，地方账目中失去生计的人数也逐渐减少。过去依靠预借货款安排一年的家庭，如今能够先留下本月所需，再决定下一笔开销。\n\n联省官署决定将已有的工艺传习延续两年，让受雇的工人和新来的学徒继续学习。港口与腹地之间的买卖，也将由这些家庭的收入支撑起来。"
 nesnd_tenasserim.2.a:0 "把这门生计做长久。"
 nesnd_ten_status_details_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_ten_conditions_bar_detail 地方汇报#!#! · #tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_ten_continuity_bar_detail 巩固条件#!#!"
