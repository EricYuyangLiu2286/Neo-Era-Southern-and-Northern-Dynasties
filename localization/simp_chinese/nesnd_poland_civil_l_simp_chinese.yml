l_simp_chinese:
 nesnd_poland_secret_societies:0 "组织秘密社团"
 nesnd_poland_secret_societies_desc:0 "在一个瓜分国境内扶植[GetCulture('polish').GetName]人的少数民族运动，红白条偏红10点，与对象国关系降低10。冷却3年，秘密联络维持3年，每年有20%的机会被揭发。"
 nesnd_poland_shelter_exiles:0 "庇护流亡者"
 nesnd_poland_shelter_exiles_desc:0 "支援一个瓜分国的自由派与激进派运动，提高其激进度，持续3年。红白条偏红10点，与对象国关系降低10。冷却3年。"
 nesnd_poland_covert_arms:0 "秘密军火援助"
 nesnd_poland_exile_agitation:0 "境外流亡者的支援"
 nesnd_poland_civil.arms:0 "暗中输送军火。"
 nesnd_poland_civil.government:0 "援助现政府镇压革命。"
 nesnd_poland_civil.neutral:0 "不干涉这场内战。"
 nesnd_poland_civil.ultimatum:0 "趁乱准备通牒。"
 nesnd_poland_civil.cancel:0 "暂缓行动。"
 nesnd_poland_civil_ultimatum_tt:0 "一年内，即使[SCOPE.sCountry('nesnd_poland_government').GetName]陷于内战，也可以向它提出领土要求。其余条件与通牒按钮相同。"
 nesnd_poland_sanctions_claim_tt:0 "对象国取得要求制裁本国的依据。"
 nesnd_poland_civil.1.t:0 "边境那一边的起义"
 nesnd_poland_civil.1.d:0 "[SCOPE.sCountry('nesnd_poland_rebels').GetName]已起兵反抗[SCOPE.sCountry('nesnd_poland_government').GetName]。[GetCulture('polish').GetName]人的分离战争使1829年的疆界再次受到挑战。红党主张由[ROOT.GetCountry.GetName]资助起义军，待他们独立后议定合并。白党则反对把我国也拖入列强的报复之中。"
 nesnd_poland_civil.2.t:0 "瓜分国的革命"
 nesnd_poland_civil.2.d:0 "[SCOPE.sCountry('nesnd_poland_government').GetName]陷入内战，[SCOPE.sCountry('nesnd_poland_rebels').GetName]正争夺全国政权。[ROOT.GetCountry.GetName]可以支援革命军，向新政府索回土地，也可以援助现政府，改善双方关系。趁乱准备通牒的主张同样得到了支持，但它会直接损害1829年的共识。"
 nesnd_poland_civil.3.t:0 "法国的内战"
 nesnd_poland_civil.3.d:0 "[SCOPE.sCountry('nesnd_poland_government').GetName]与[SCOPE.sCountry('nesnd_poland_rebels').GetName]已开始争夺法国的统治权。法国对[ROOT.GetCountry.GetName]的支持关系到我国能否继续争取领土。援助胜者能使战后的政府更愿意支持我们，援助败者则会损害这层关系。"
 nesnd_poland_civil.4.t:0 "与华沙合并"
 nesnd_poland_civil.4.d:0 "[SCOPE.sCountry('nesnd_poland_union_country').GetName]主张将两国合并，由其政府统一治理双方的领土和人民。[ROOT.GetCountry.GetName]已经能够自行决定这一提议。接受合并意味着终止本国的独立政府，拒绝则保留现有国界。"
 nesnd_poland_civil.4.a:0 "同意合并。"
 nesnd_poland_civil.4.b:0 "保留独立政府。"
 nesnd_poland_civil.5.t:0 "革命后的边界"
 nesnd_poland_civil.5.d:0 "内战已经结束。[SCOPE.sCountry('nesnd_poland_union_country').GetName]曾向革命军提供援助，现在要求新政府承认其领土主张。革命的胜利并没有消除边界争端，我们必须决定是否让出一州来换取两国关系的改善。"
 nesnd_poland_civil.5.a:0 "让出[SCOPE.sState('nesnd_poland_concession').GetName]。"
 nesnd_poland_civil.5.b:0 "政府更替不改变国界。"
 nesnd_poland_civil.6.t:0 "政府军获胜"
 nesnd_poland_civil.6.d:0 "[SCOPE.sCountry('nesnd_poland_winner').GetName]镇压了革命。我方提供的军火援助改善了双方关系，也加强了维护1829年安排的主张。"
 nesnd_poland_civil.6.a:0 "继续与其政府交涉。"
 nesnd_poland_civil.7.t:0 "巴黎的胜者"
 nesnd_poland_civil.7.d:0 "[SCOPE.sCountry('nesnd_poland_winner').GetName]赢得了法国的内战。新政府对[ROOT.GetCountry.GetName]的态度，将受到我国在战争中所作选择的影响。"
 nesnd_poland_civil.7.a:0 "恢复与巴黎的往来。"
 nesnd_poland_civil.10.t:0 "秘密社团"
 nesnd_poland_civil.10.d:0 "红党要求[ROOT.GetCountry.GetName]在瓜分国境内扶植[GetCulture('polish').GetName]人的少数民族运动。秘密社团将扩大分离运动的组织力量，政府也必须承担境外煽动被揭发的风险。"
 nesnd_poland_civil.11.t:0 "流亡者的政治"
 nesnd_poland_civil.11.d:0 "[ROOT.GetCountry.GetName]可以庇护瓜分国的流亡者，支持其自由派与激进派运动继续反对本国政府。这项政策会加剧对象国的政治冲突，也会损害两国关系。"
 nesnd_poland_civil.12.t:0 "秘密援助被揭发"
 nesnd_poland_civil.12.d:0 "[SCOPE.sCountry('nesnd_poland_conspiracy_target').GetName]揭发了[ROOT.GetCountry.GetName]对境内反对力量的秘密援助，要求列强追究我国破坏1829年共识的责任。"
 nesnd_poland_civil.12.a:0 "承受外交后果。"
 nesnd_poland_civil.target_rus:0 "选择[SCOPE.sCountry('nesnd_poland_rus').GetName]。"
 nesnd_poland_civil.target_pru:0 "选择[SCOPE.sCountry('nesnd_poland_pru').GetName]。"
 nesnd_poland_civil.target_aus:0 "选择[SCOPE.sCountry('nesnd_poland_aus').GetName]。"
 nesnd_poland_arms_cost_tt:0 "支出相当于本国3周固定收入的资金，受援方的军需品开支降低15%，持续12个月。"
