 lawgroup_nesnd_per_tang_order:0 "唐律分等"
 lawgroup_nesnd_per_tang_order_desc:0 "按族属划定唐衣大食居民的待遇。"
 nesnd_per_tang_hierarchy:0 "唐衣等第"
 nesnd_per_tang_hierarchy_desc:0 "唐人居一等，广义伊朗人居二等，其余各族居三等，每等之内再分上中下。"
 law_nesnd_per_tang_strict:0 "唐律严分"
 law_nesnd_per_tang_strict_desc:0 "唐人在上，诸族各安其位。族属载入户帖，纵有万贯家财、满腹诗书，也越不过那道界线。"
 law_nesnd_per_tang_codified:0 "唐律成文"
 law_nesnd_per_tang_codified_desc:0 "等第既入律令，便也留下几架阶梯。读书、从军、纳粟，皆可使波斯人向上攀援，只是每一架阶梯的尽头，都比唐人低一级。"
 law_nesnd_per_tang_lenient:0 "唐律宽和"
 law_nesnd_per_tang_lenient_desc:0 "律令上唐人仍居其首，执法却已宽宥许多。波斯人只要守法纳赋，便不必事事俯首。"
