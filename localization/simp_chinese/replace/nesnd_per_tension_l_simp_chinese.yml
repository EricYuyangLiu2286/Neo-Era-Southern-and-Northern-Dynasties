 nesnd_per_tension_journal:0 "波斯之忧"
 nesnd_per_tension_journal_reason:0 "两百余年前，陈秦的军府在呼罗珊竖起李氏的大纛，唐人自此成了伊朗高原的主人。贤王阿兹丹以商路与百工换来数十年承平，而《巴格达条约》既成，秦国西进的鼓声便戛然而止。留给唐衣大食的，只有自家的兵、自家的官，和一个大过自己数倍的波斯。\n\n市集里的说书人仍在吟诵《列王纪》，主麻日的讲坛上，乌理玛一遍遍提醒信众，谁才是这片土地的旧主。唐人的门第、波斯人的人丁、教士的讲坛、军府的刀枪，这一口气，还能压过下一代人吗？"
 nesnd_per_tension_status_frozen:0 "国土仅余不足三州，唐人与波斯人的宿怨暂且搁置。"
 nesnd_per_tension_status_uprising:0 "积怨已至极处，伊朗人起事只欠一点火星。"
 nesnd_per_tension_status_restless:0 "波斯骚动蔓延州县，统治日益吃力。"
 nesnd_per_tension_status_uneasy:0 "市面如常，讲坛上的言辞却一日重过一日。"
