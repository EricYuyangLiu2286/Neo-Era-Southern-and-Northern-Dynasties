 nesnd_per_tension_journal:0 "波斯之忧"
 nesnd_per_tension_journal_reason:0 "两百多年前，陈秦的军府在呼罗珊立起李氏的旗号，唐人从此做了伊朗高原的主人。贤王阿兹丹靠商路和工匠换来过几十年安宁；《巴格达条约》之后，秦国的西进就此收场，唐衣大食手里只剩下自己的兵、自己的官，和一个比自己大好几倍的波斯。\n\n市集里的说书人仍在念《列王纪》，礼拜五的讲坛上，乌理玛提醒信众谁才是这片土地的旧主。唐人的门第、波斯人的人数、教士的讲坛和军府的刀枪，这口气还能压到下一代吗？"
