 law_nesnd_per_tang_codified:0 "唐律成文"
 law_nesnd_per_tang_codified_desc:0 "等第写进了律令，也留下几道缝：读书、从军与纳粟，都能让一个波斯人离唐人近一点，却到不了唐人的位置。"
 law_nesnd_per_tang_lenient:0 "唐律宽和"
 law_nesnd_per_tang_lenient_desc:0 "律令里仍有唐人的位置，执行起来却宽松得多。波斯人只要守法纳税，便不再处处低人一等。"
