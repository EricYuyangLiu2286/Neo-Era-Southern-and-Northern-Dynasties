 nesnd_per_tension.1.t:0 "阿舒拉日"
 nesnd_per_tension.1.d:0 "穆哈兰月第十日，[SCOPE.sState('nesnd_per_tension_state').GetName]的街巷挤满了捶胸恸哭的人群。他们哀悼的是一千多年前殉难于卡尔巴拉的侯赛因。游行的队伍经过军府门前时，鞭笞之声里混进了别的东西：有人在呼喊旧王的名字。\n\n守门的唐人校尉前来请示：今年的游行，是任其走完，还是入夜之前肃清街巷？"
 nesnd_per_tension.1.f:0 "“每一天都是阿舒拉，每一片土地都是卡尔巴拉。”——什叶派谚语"
 nesnd_per_tension.1.a:0 "让他们哭完。"
 nesnd_per_tension.1.b:0 "日落之后，街上不许再有一人。"
 nesnd_per_tension.2.t:0 "香客税"
 nesnd_per_tension.2.d:0 "每年春天，成千上万的香客沿着驿道走向马什哈德，到伊玛目礼萨的陵前祈祷。户部的唐人书吏算过账：一人一钱，便是一笔不小的岁入。乌理玛也算过账：一人一钱，就是一句“异族向圣陵收租”。"
 nesnd_per_tension.2.f:0 "“香客的鞋底，比任何檄文都走得远。”——马什哈德驿道上的驿卒"
 nesnd_per_tension.2.a:0 "免了吧，国库不差这一份。"
 nesnd_per_tension.2.b:0 "圣陵归圣陵，国库归国库。"
 nesnd_per_tension.3.t:0 "苛吏"
 nesnd_per_tension.3.d:0 "[SCOPE.sState('nesnd_per_tension_state').GetName]的唐人知州在秋收时加派了三成“军府粮”。村长们联名上告，状纸一路递进了朝廷。而那位知州的岳丈，正是武勋门阀中有头有脸的人物。"
 nesnd_per_tension.3.f:0 "“唐人的秤称波斯人的麦子，从来不会短一钱。”——伊斯法罕巴扎的粮商"
 nesnd_per_tension.3.a:0 "革职，把粮退回去。"
 nesnd_per_tension.3.b:0 "不过一场误会，申饬几句即可。"
 nesnd_per_tension.4.t:0 "列王纪"
 nesnd_per_tension.4.d:0 "设拉子的诗社接连数夜朗诵菲尔多西的《列王纪》。座中人最爱的不是鲁斯塔姆的武功，而是那几行诗：伊朗的王冠，只该戴在伊朗人的头上。巡夜的差役抄下了诗社的名册，呈到了州衙。"
 nesnd_per_tension.4.f:0 "“我以波斯语使伊朗复生。”——菲尔多西"
 nesnd_per_tension.4.a:0 "朝廷也出一笔钱，再请他们读几首唐诗。"
 nesnd_per_tension.4.b:0 "查封诗社，焚毁抄本。"
 nesnd_per_tension.5.t:0 "营中不平"
 nesnd_per_tension.5.d:0 "军府的兵丁大半是波斯人，能升到校尉的却几乎都姓唐。一名屡立战功的波斯百夫长第三次被人越过，他麾下的兵在营门口坐了整整一日，默然无声。"
 nesnd_per_tension.5.f:0 "“刀是波斯人磨的，功劳是唐人领的。”——军府营房墙上的刻字"
 nesnd_per_tension.5.a:0 "擢升他，让门阀去抱怨。"
 nesnd_per_tension.5.b:0 "军令如山，坐着的人按律处置。"
 nesnd_per_tension.6.t:0 "通婚之议"
 nesnd_per_tension.6.d:0 "一位唐人门阀的嫡子要迎娶设拉子富商的女儿。新娘家陪嫁的是半条街的铺面，新郎家却有长辈放言：唐人的血，不能掺进波斯人的账簿。婚书递到朝廷，只等一个“准”字。"
 nesnd_per_tension.6.f:0 "“联姻换得来铺子，换不来族谱。”——门阀长老的家训"
 nesnd_per_tension.6.a:0 "准了。账本和族谱，早晚要合成一本。"
