l_simp_chinese:
 je_manifest_destiny_mexico:0 "昭昭天命：通向太平洋"
 je_manifest_destiny_mexico_reason:0 "东洲在太平洋沿岸经营已久，墨西哥的共和政权也曾得到它的援助。美国的扩张者仍把西部港湾、牧地与通商道路画入联邦的未来。要让共和国从大西洋伸展到太平洋，联邦就必须争取这些土地的归属，并承担同西部各国交涉与作战的代价。"
 je_manifest_destiny_frontier_wars:0 "昭昭天命：大平原之争"
 je_manifest_destiny_frontier_wars_reason:0 "原住民与蒙古牧民沿着大平原的牧道迁徙，东洲的军队与商人也不断向内陆伸展。美国的移民、土地商人与边疆军官希望把这些土地纳入联邦。村社的土地、牧民的通道和各国的边界，已成为新一轮扩张的争夺所在。"
