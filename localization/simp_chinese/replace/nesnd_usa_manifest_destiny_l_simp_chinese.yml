l_simp_chinese:
 je_manifest_destiny_mexico:0 "昭昭天命：通向太平洋"
 je_manifest_destiny_mexico_reason:0 "东洲在太平洋沿岸经营已久，墨西哥的共和政权也曾得到它的援助。美国的扩张者仍把西部港湾、牧地与通商道路画进联邦的将来。要让共和国从大西洋一直伸到太平洋，这些土地就得归联邦，不管要同西部各国谈多少回、打多少仗。"
 je_manifest_destiny_frontier_wars:0 "昭昭天命：大平原之争"
 je_manifest_destiny_frontier_wars_reason:0 "原住民与蒙古牧民沿着大平原的牧道往来，东洲的军队与商人也不断向内陆伸展。美国的移民、土地商人与边疆军官，都想把这些土地划进联邦。"
