 nesnd_per_unity.1.t:0 "祠堂冷落"
 nesnd_per_unity.1.d:0 "[SCOPE.sState('nesnd_per_unity_state').GetName]的唐人已经三代没有回过宗祠了。年轻人说波斯话，在波斯人的作坊里做工，账本上的名字也换成了波斯名字。族中长老写信到朝廷，求一笔钱修祠办学，把孩子们拉回来。"
 nesnd_per_unity.1.f:0 "“祠堂的门槛高了，就没人跨了。”——呼罗珊唐人的俗话"
 nesnd_per_unity.1.a:0 "随他们去吧。"
 nesnd_per_unity.1.a.tt:0 "该州#r 25%#!的西域汉羌转为当地的一种伊朗文化"
 nesnd_per_unity.1.b:0 "拨款修祠办学。"
 nesnd_per_unity.1.b.tt:0 "该州的西域汉羌不受影响"
 nesnd_per_unity.2.t:0 "旧唐人"
 nesnd_per_unity.2.d:0 "[SCOPE.sState('nesnd_per_unity_state').GetName]的一些人家翻出了压在箱底的族谱。新朝对唐人的猜疑越重，他们越愿意承认自己是唐人的后代，有人连名字都改回了唐名。地方官来请示要不要管。"
 nesnd_per_unity.2.f:0 "“姓是改不掉的，只是藏起来了。”——伊斯法罕老人的话"
 nesnd_per_unity.2.a:0 "由他们去。"
 nesnd_per_unity.2.a.tt:0 "该州#r 25%#!的广义伊朗人转为西域汉羌"
 nesnd_per_unity.2.b:0 "派人安抚，别让这事张扬。"
 nesnd_per_unity.2.b.tt:0 "该州人口不受影响"

 # 天命说（开局可替换佛门）
 nesnd_per_faith_mandate_journal:0 "三教消长"
 nesnd_per_faith_mandate_journal_reason:0 "唐衣大食的朝堂上，三种声音此起彼伏。李氏君主依逊尼派的礼法即位；波斯人的礼拜寺里诵的是什叶派的经文；伊犁的西秦朝廷奉天命说为国教，如今唐人里也有人想把这部学说请到西边来。\n\n天命说在这片土地上还没有一座讲堂、一个门生。它能走多远，要看唐人与伊犁还有几分往来，唐人自己还有几分同心。"
 nesnd_per_faith_status_mandate_leads:0 "天命说的讲堂门生最多，国教压不过它。"
 nesnd_per_faith_src_preach_cut:0 "与伊犁断了往来"
 nesnd_per_faith_src_preach_unity:0 "唐人离心"
 nesnd_per_faith_src_preach_war:0 "与西秦交战"
 nesnd_per_faith.1.d_mandate:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家改奉天命说。讲堂里讲的是君臣父子、天命去留，听惯了的人，渐渐也就照着这一套过日子了。"
 nesnd_per_faith.1.d_preach:0 "西秦经师在[SCOPE.sState('nesnd_per_faith_conv_state').GetName]讲学一季，听讲的唐人回家便撤了旧日的香案，在堂上写起「天地君亲师」。也有不少邻里跟着去听，听完再没回礼拜寺。"
 nesnd_per_faith.2.t:0 "西来的学说"
 nesnd_per_faith.2.d:0 "伊犁的使者带来了西秦朝廷的问候，还带来几箱经书。西秦奉天命说为国教：天命归于有德之君，失德则去。使者说，唐人与秦人同出一源，何不把这部学说也立在西边？\n\n朝中有人以为，唐人守着佛门已经两百年，不必舍近求远；也有人以为，佛门只管来世，天命说却能讲清唐人凭什么治理这片土地。"
 nesnd_per_faith.2.f:0 "“天命靡常，惟德是辅。”——西秦经师常引的古语"
 nesnd_per_faith.2.a:0 "唐人自有佛门。"
 nesnd_per_faith.2.a.tt:0 "「三教消长」中的第三教为#v 佛门#!"
 nesnd_per_faith.2.b:0 "请西秦经师来讲学。"
 nesnd_per_faith.2.b.tt:0 "「三教消长」中的第三教改为#v 天命说#!：开局没有信众，靠与伊犁的往来和讲堂起步，再靠传道把唐人引入门下。此后不能再改回佛门。"
 nesnd_per_faith_mandate_bar_name:0 "天命说影响力"
 nesnd_per_faith_mandate_bar_desc:0 "$nesnd_per_faith_mandate_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]%#!（#v [JournalEntry.GetCountry.MakeScope.Var('nesnd_per_inf_mandate_v').GetValue|1]#!）"
