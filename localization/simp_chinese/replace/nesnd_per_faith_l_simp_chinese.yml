 nesnd_per_unity_journal:0 "唐人同心"
 nesnd_per_unity_journal_reason:0 "西来的唐人在伊朗高原已栖居两百余年。先祖说秦地的官话，守宗族的祠堂，子孙却在波斯人的集市里谋生，学会了波斯语、普什图语或其他的什么语言。他们中有的改信了至大的那位，有的娶了山中民族的女儿。\n\n门第和族谱犹在。但人们的心灵会在谁讲述的英雄故事中安歇？"
 nesnd_per_unity_status_high:0 "诸族渐习唐人的言语与门风，西域汉羌也一日日与老秦同俗。"
 nesnd_per_unity_status_mid:0 "各家各守门户。"
 nesnd_per_unity_status_low:0 "唐人的宗族日渐离散，祠堂一年冷过一年。"
 nesnd_per_unity_status_persian_rule:0 "伊朗族裔重归王座，唐人的去留由新朝定夺。"
 nesnd_per_unity_next_decay:0 "\n下次月结：[ROOT.GetCountry.MakeScope.Var('nesnd_per_next_state').GetState.GetName]约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_next_size')|D]#! 名[GetCulture('ce_xiyu').GetName]转为[ROOT.GetCountry.MakeScope.Var('nesnd_per_next_culture').GetCulture.GetName]，届时的事件中可拨款免除。团结度须仍低于 #v 40#!。"
 nesnd_per_unity_next_decay_any:0 "\n下次月结：[ROOT.GetCountry.MakeScope.Var('nesnd_per_next_state').GetState.GetName]约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_next_size')|D]#! 名[GetCulture('ce_xiyu').GetName]转入当地一种伊朗文化，届时的事件中可拨款免除。团结度须仍低于 #v 40#!。"
 nesnd_per_unity_next_revival:0 "\n下次月结：[ROOT.GetCountry.MakeScope.Var('nesnd_per_next_state').GetState.GetName]约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_next_size')|D]#! 名伊朗诸族居民转为[GetCulture('ce_xiyu').GetName]，届时的事件中可花钱免除。团结度须仍低于 #v 40#!。"
 nesnd_per_unity_next_gain:0 "\n下次月结：约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_gain_size')|D]#! 名各族居民转为[GetCulture('ce_xiyu').GetName]，约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_laoqin_size')|D]#! 名[GetCulture('ce_xiyu').GetName]转为[GetCulture('ce_laoqin').GetName]。团结度须仍高于 #v 75#!。"
 nesnd_per_unity_next_loss:0 "\n下次月结：约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_per_unity_loss_size')|D]#! 名[GetCulture('ce_xiyu').GetName]转入所在[concept_state]的伊朗诸族。团结度须仍高于 #v 75#!。"
 nesnd_per_unity_next_missed:0 "\n下次月结：不转化。本月没有抽中任何[concept_state]，团结度低于 #v 40#! 时每月有 #v 15%#! 的几率。"
 nesnd_per_unity_next_no_state:0 "\n下次月结：不转化。没有符合条件的[concept_state]。"
 nesnd_per_unity_next_mid:0 "\n下次月结：不转化。团结度在 #v 40#! 到 #v 75#! 之间。"
 nesnd_per_unity_next_none:0 "\n下次月结：不转化。"
 nesnd_per_unity_invalid_tt:0 "本国已无自认为西域汉羌[concept_culture]的族裔"
 nesnd_per_unity_invalid_conclusion:0 "西域汉羌已不复为这个国家的子民。"
