 nesnd_per_unity_journal:0 "唐人同心"
 nesnd_per_unity_journal_reason:0 "西来的唐人在伊朗高原已经住了两百多年。祖先说秦地的官话，守宗族的祠堂；子孙们在波斯人的集市里讨生活，学会了波斯话，有的改信了伊玛目，有的娶了阿拉伯人的女儿。\n\n门第还在，族谱还在。下一代人还会认这份族谱吗？"
 nesnd_per_unity_status_high:0 "诸族渐渐改习唐人的语言与门第，西域汉羌也一天天与老秦同风。"
 nesnd_per_unity_status_mid:0 "各家各守门户。"
 nesnd_per_unity_status_low:0 "唐人的宗族正在离散，祠堂一年比一年冷清。"
 nesnd_per_unity_status_persian_rule:0 "伊朗人当政，唐人的去留由新朝决定。"
 nesnd_per_unity_invalid_tt:0 "本国已无西域汉羌"
 nesnd_per_unity_invalid_conclusion:0 "西域汉羌已经不在这个国家里了。"
 nesnd_per_unity_bar_name:0 "唐人团结度"
 nesnd_per_unity_bar_desc:0 "$nesnd_per_unity_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
