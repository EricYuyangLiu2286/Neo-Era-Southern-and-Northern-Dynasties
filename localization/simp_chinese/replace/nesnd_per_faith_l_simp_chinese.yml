l_simp_chinese:
 nesnd_per_faith_journal:0 "三教消长"
 nesnd_per_faith_journal_reason:0 "唐衣大食的朝堂上，三种祷告声此起彼伏。李氏君主依逊尼派的礼法即位；波斯人的礼拜寺里诵的是什叶派的经文；随陈秦军府西来的唐人，有的早已跟着邻里去了礼拜寺，也有的还在家里供着一尊佛像。\n\n国教写在律令里，人心却跟着讲坛走。哪一边的讲坛声音最大，朝廷的律令就最难推行。"
 nesnd_per_faith_status_state_leads:0 "国教的讲坛，正是声音最大的讲坛。"
 nesnd_per_faith_status_shia_leads:0 "什叶派的讲坛声音最大，国教压不过它。"
 nesnd_per_faith_status_sunni_leads:0 "逊尼派的讲坛声音最大，国教压不过它。"
 nesnd_per_faith_status_buddhist_leads:0 "佛门的香火最盛，国教压不过它。"
 nesnd_per_faith_status_none:0 ""
 nesnd_per_faith.1.t:0 "改宗"
 nesnd_per_faith.1.d_shia:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家走进了什叶派的礼拜寺。有的是跟着邻里去的，有的是为了在讲坛下讨一份差事，也有人只是觉得那里的经文更像自己的话。"
 nesnd_per_faith.1.d_sunni:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家改从逊尼派的礼法。朝廷的礼法写在哪一边，求官求差的人就往哪一边走。"
 nesnd_per_faith.1.d_buddhist:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家在堂上供起了佛像。唐人的寺院施粥舍药，来求的人多了，信的人也就多了。"
 nesnd_per_faith.1.f:0 "“讲坛下站的人多了，讲坛就高了。”——呼罗珊的俗话"
 nesnd_per_faith.1.a:0 "人心各有所归。"
 nesnd_per_faith_invalid_tt:0 "唐人不再执政"
 nesnd_per_faith_invalid_conclusion:0 "三教的消长，已经不由唐人的朝廷来权衡了。"
