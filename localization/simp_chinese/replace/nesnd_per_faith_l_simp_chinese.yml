l_simp_chinese:
 nesnd_per_faith_journal:0 "教派消长"
 nesnd_per_faith_journal_reason:0 "唐衣大食的朝堂之上，三种祷声此起彼伏。李氏君主依逊尼派的礼法践祚，波斯人的礼拜寺里诵读的是什叶派的经文，而随陈秦军府西来的唐人，有的早已随邻里步入礼拜寺，有的仍在家中供奉一尊佛像。\n\n国教写在律令里，人心却随讲坛而去。"
 nesnd_per_faith_status_state_leads:0 "$nesnd_per_faith_current_faith$国教影响力居首。\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_shia_leads:0 "$nesnd_per_faith_current_faith$什叶派影响力居首。\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_sunni_leads:0 "$nesnd_per_faith_current_faith$逊尼派影响力居首。\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_buddhist_leads:0 "$nesnd_per_faith_current_faith$佛门影响力居首。\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_status_none:0 "$nesnd_per_faith_current_faith$\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith.1.t:0 "改宗"
 nesnd_per_faith.1.d_shia:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家走进了什叶派的礼拜寺。有人随邻里而去，有人为在讲坛下谋一份差事，也有人只是觉得，那里的经文有着一种“更亲切的音色”。"
 nesnd_per_faith.1.d_sunni:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家改从逊尼派的礼法。朝廷的礼法立在哪一边，求官谋差的人便往哪一边去。"
 nesnd_per_faith.1.d_buddhist:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家在堂上供起了佛像。唐人的寺院施粥舍药，宣讲鼓励社会上的慈救善济之行。救助的人多了，信奉的人也就多了。"
 nesnd_per_faith.1.f:0 "“讲坛下站的人多了，讲坛便高了。”——马什哈德的一位宣礼人"
 nesnd_per_faith.1.a:0 "人心各有所归。"
 nesnd_per_faith_invalid_tt:0 "唐人不再执政"
 nesnd_per_faith_invalid_conclusion:0 "教派的消长已不再由唐人的朝廷权衡。"
