 nesnd_per_unity_src_war_qin:0 "与故国交兵"
 nesnd_per_unity_src_tension:0 "波斯之忧"
 nesnd_per_unity_src_few:0 "唐人寡少"
 nesnd_per_tension_src_state_faith:0 "国教"
 nesnd_per_tension_src_unity:0 "唐人离心"

 nesnd_per_unity.1.t:0 "祠堂冷落"
 nesnd_per_unity.1.d:0 "[SCOPE.sState('nesnd_per_unity_state').GetName]的唐人已三代不曾回过宗祠。年轻人说波斯语，在波斯人的作坊里做工，账簿上的名字也换成了波斯名字。族中长老上书朝廷，恳请拨款修祠兴学，把孩子们唤回来。"
 nesnd_per_unity.1.f:0 "“祠堂的门槛高了，便无人再跨。”——呼罗珊一位族长的家书"
 nesnd_per_unity.1.a:0 "随他们去吧。"
 nesnd_per_unity.1.a.tt:0 "该州#r 25%#!的西域汉羌转为伊朗当地的一种文化"
 nesnd_per_unity.1.b:0 "拨款修祠兴学。"
 nesnd_per_unity.1.b.tt:0 "该州的西域汉羌不受影响"
 nesnd_per_unity.2.t:0 "旧唐人"
 nesnd_per_unity.2.d:0 "[SCOPE.sState('nesnd_per_unity_state').GetName]的一些人家翻出了压在箱底的族谱。新朝对唐人的猜忌愈深，他们便愈肯承认自己是唐人的后裔，有人甚至改回了唐名。地方官员前来请示如何干预。"
 nesnd_per_unity.2.f:0 "“姓氏改不掉，只能藏起来。”——伊斯法罕一位老塾师"
 nesnd_per_unity.2.a:0 "由他们去。"
 nesnd_per_unity.2.a.tt:0 "该州#r 25%#!的广义伊朗人转为西域汉羌"
 nesnd_per_unity.2.b:0 "或许一些黄金会有用..."
 nesnd_per_unity.2.b.tt:0 "该州人口不受影响"

 # 天命说（开局可替换佛门）
 nesnd_per_faith_mandate_journal:0 "教派消长"
 nesnd_per_faith_mandate_journal_reason:0 "唐衣大食的朝堂之上，三种声音此起彼伏。中洲佛教样式的寺阙高塔之间，李氏君主依逊尼派的礼法践祚，波斯人的礼拜寺里诵读什叶派的经文。而伊犁的西秦朝廷以《天命说》诸法度文书为国家信经。强调天命自然，受法诸汉，以正气、真理为心为骨，无用诸神的学说。唐人朝廷也有意学习这种做法。\n\n然而，《天命说》作为一套近代以来才出现的新经。发源自遥远的中洲腹地，成长于汉字古学的北明末年。在这片土地上尚无一座讲堂、一个门生。如果真要强调诸汉[concept_culture]之国的文化统一，是否应该保持我们对佛陀传授的古老信仰的忠诚呢？"
 nesnd_per_faith_status_mandate_leads:0 "$nesnd_per_faith_current_faith$天命说影响力居首。\n$nesnd_per_faith_choose_faith$"
 nesnd_per_faith_src_preach_cut:0 "与伊犁断了往来"
 nesnd_per_faith_src_preach_unity:0 "唐人离心"
 nesnd_per_faith_src_preach_war:0 "与西秦交战"
 nesnd_per_faith.1.d_mandate:0 "[SCOPE.sState('nesnd_per_faith_conv_state').GetName]又有一批人家改奉天命说。讲堂里讲的是君臣父子、天命去留，听得久了，人们便也依着这一套过起日子来。"
 nesnd_per_faith.1.d_preach:0 "西秦经师在[SCOPE.sState('nesnd_per_faith_conv_state').GetName]讲学一季。听讲的唐人回到家中，撤去旧日的香案，在堂上恭书“天地君亲师”五字。不少邻人也随之前往，听罢便再未踏进礼拜寺。"
 nesnd_per_faith.2.t:0 "西来的学说"
 nesnd_per_faith.2.d:0 "伊犁的使者带来了西秦朝廷的问候，也带来了几箱经书。西秦以天命说为国教：天命归于有德之君，失德则去。使者说，唐人与秦人同出一源，何不将此学也立于西土？\n\n朝中有人以为，唐人守着佛门已两百年，不必舍近求远。也有人以为，佛门只管来世，天命说却能讲明唐人凭什么治理这片土地。"
 nesnd_per_faith.2.f:0 "“皇天无亲，惟德是辅。”——《尚书·蔡仲之命》"
 nesnd_per_faith.2.a:0 "唐人自有佛门。"
 nesnd_per_faith.2.a.tt:0 "「教派消长」中的第三教派为#v 佛门#!"
 nesnd_per_faith.2.b:0 "请西秦经师来讲学。"
 nesnd_per_faith.2.b.tt:0 "「教派消长」中的第三教派改为#v 天命说#!：开局没有信众，靠与伊犁的往来和讲堂起步，再靠传道把唐人引入门下。此后不能再改回佛门。"
 nesnd_per_faith_mandate_bar_name:0 "天命说影响力"
 nesnd_per_faith_mandate_bar_desc:0 "$nesnd_per_faith_mandate_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]%#!（#v [JournalEntry.GetCountry.MakeScope.Var('nesnd_per_inf_mandate_v').GetValue|1]#!）"
 nesnd_per_faith_preach_bar_name:0 "传道进度"
 nesnd_per_faith_preach_bar_desc:0 "$nesnd_per_faith_preach_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_per_faith_src_preach_base:0 "西秦经师讲学"
 nesnd_per_faith_src_preach_aid:0 "朝贡伊犁"
 nesnd_per_faith_src_preach_halls:0 "讲堂"
 nesnd_per_faith_src_preach_state:0 "立为国教"
 nesnd_per_faith_rep_label_mandate:0 "天命说"
 nesnd_per_faith_adopt_mandate:0 "以天命说为国教"
 nesnd_per_faith_adopt_mandate_desc:0 "天命归于真理，正义在于诸汉。把这句话写进我《大高唐国律》，唐人治理这片土地，便不必再借他人的礼法。"
 nesnd_per_faith_adopt_mandate_tt:0 "波斯人视天命说为秦人之教，「$nesnd_per_tension_journal$」中的国教一项随之加重。传道大为加快，非唐人的什叶、逊尼信众也会受其感化。"
 nesnd_per_faith_lecture_hall:0 "设讲堂"
 nesnd_per_faith_lecture_hall_desc:0 "修一座讲堂，请伊犁来的经师坐堂讲学。"
 nesnd_per_faith_hall_effect_tt:0 "讲堂多一座：天命说影响力增加，传道加快。与伊犁断了往来时，讲堂每年荒废一座。"
 nesnd_per_faith_hall_cooldown_tt:0 "距上次设讲堂已满#v 2#!年"
 nesnd_per_faith_hall_max_tt:0 "讲堂不足#v 6#!座"
 nesnd_per_faith_hall_ties_tt:0 "与伊犁仍有往来，且未与西秦交战"
 nesnd_per_faith_hall_money_tt:0 "国库存银不少于本次修建的费用（GDP 的#v 1.5%#!）"
 nesnd_per_n_han:0 "韩"
 nesnd_per_n_shouzheng:0 "守正"
 nesnd_per_n_zhao:0 "赵"
 nesnd_per_n_jingzhi:0 "敬之"
 nesnd_per_n_wang:0 "王"
 nesnd_per_n_mingde:0 "明德"
 ig_nesnd_per_clergy:0 "教派宗师"
 ig_nesnd_per_clergy_desc:0 "什叶派的穆智台希德、逊尼派的穆夫提，与唐人寺院的住持或西秦来的经师同列一班。他们彼此争夺信众，却也同样在意朝廷站在哪一座讲坛之下。"
 nesnd_per_faith_conversion_rule:0 "#bold $nesnd_per_faith_conversion_bar_name$#!（满100归零）\n改宗对象为什叶、逊尼、佛门和天命说信众。\n在有改宗对象的州中，选总人口最多的一州。\n当地其余各派有5%的信众改信影响力最高的教派。"
 nesnd_per_faith_preach_rule:0 "#bold $nesnd_per_faith_preach_bar_name$#!（满100归零）\n传道对象为唐人中的佛门、什叶和逊尼信众。\n选一州，其中至少一个此类人口群体须满5000人。\n当地上述信众有25%改信天命说。\n若为国教，同州非唐人什叶、逊尼信众有30%改信。"
 nesnd_per_faith_influence_rule:0 "#bold 诸派影响力#!（每月结算）\n每十万信众，什叶得0.8、逊尼0.7、第三教派0.6点。\n每十万唐人信众另加4点。国教加6点。\n每次捐修圣陵为什叶加2点，最多10点。"
 nesnd_per_faith_rules:0 "$nesnd_per_faith_conversion_rule$\n\n$nesnd_per_faith_influence_rule$\n有代表在任，本派总分再加10%。\n条上百分比为本派得分占教派总分的比重。"
 nesnd_per_faith_mandate_rules:0 "$nesnd_per_faith_conversion_rule$\n\n$nesnd_per_faith_preach_rule$\n\n$nesnd_per_faith_influence_rule$\n天命说每座讲堂加0.6点。\n与西秦往来加3点，朝贡伊犁时改为4点。\n有代表在任，本派总分再加10%。\n天命说须同时与西秦有往来，才得这项加成。\n条上百分比为本派得分占教派总分的比重。"
 nesnd_per_faith_current_faith:0 "现行国教为#v [ROOT.GetCountry.GetStateReligion.GetNameNoFormatting]#!。"
 nesnd_per_faith_choose_faith:0 "保留现状无需操作。改立请点头像下方的国教按钮。\n改立后须满20年，方可再改。"
 nesnd_per_faith_different_state_faith_tt:0 "拟立宗教与现行国教不同"
 nesnd_per_faith_status_cooldown:0 "$nesnd_per_faith_current_faith$\n上次改立未满20年，暂不能再选。"
 nesnd_per_faith_status_frozen:0 "$nesnd_per_faith_current_faith$\n至少拥有三个州，方可改立国教。"
