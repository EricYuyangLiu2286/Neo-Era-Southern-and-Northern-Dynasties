 nesnd_per_faith_adopt_shia:0 "以什叶为国教"
 nesnd_per_faith_adopt_shia_desc:0 "让礼拜寺的讲坛与朝廷站在一处，波斯人便少了一个仇视唐人的理由。"
 nesnd_per_faith_adopt_sunni:0 "以逊尼为国教"
 nesnd_per_faith_adopt_sunni_desc:0 "李氏君主依逊尼派的礼法即位，朝廷的正统就写在这部礼法里。"
 nesnd_per_faith_adopt_buddhist:0 "以佛法为国教"
 nesnd_per_faith_adopt_buddhist_desc:0 "唐人西来时怀抱佛像而行。两百年后，供在家中的佛像已多过寺里的。"
 nesnd_per_faith_cooldown_tt:0 "距上次改定国教已满#v 20#!年"
 nesnd_per_faith_adopt_top_tt:0 "所立宗教的影响力为教派之首：不付代价。"
