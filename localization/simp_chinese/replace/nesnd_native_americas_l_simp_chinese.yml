l_simp_chinese:
 nesnd_hus_registration.1.t:0 "草原盟约再起"
 nesnd_hus_registration.1.d:0 "[SCOPE.sCountry('nesnd_a2_khanate').GetName]已经建立。来自东洲与美国的原住民迁入草原，把亲族、家当与保住土地的希望一同带到新国。各共同体拥立的新汗，必须凭他们的支持维持统治，也必须替他们守住安身之地。\n\n美国不肯放弃割出的领土，东洲也主张收回这片草原。对于迁来的人，汗国的存亡却不只是由谁发号施令，而是他们能否免于再一次迁徙。"
 nesnd_hus_registration.1.a:0 "草原已经有了新的主人。"
 nesnd_hus_registration.2.t:0 "登记之后的迁居"
 nesnd_hus_registration.2.d:0 "原住民编户完成之后，满蒙居民仍被留在二等户籍之中。如今，他们已经离开共和国：有人投向$CNE$，也有人前往美国西部，在新的土地上寻找生活。"
 nesnd_hus_registration.2.a:0 "这一选择已经作出。"
 war_goal_wg_nesnd_usm_annex_type_name:0 "$war_goal_annex_country_type_name$"
 war_goal_wg_nesnd_usm_annex_type_desc:0 "$war_goal_annex_country_type_desc$"
 war_goal_wg_nesnd_usm_annex:0 "$war_goal_annex_country$"
 war_goal_wg_nesnd_usm_annex_desc:0 "$war_goal_annex_country_desc$"
 war_goal_wg_nesnd_usm_annex_sway_desc:0 "$war_goal_annex_country_sway_desc$"
 nesnd_american_restoration:0 "旧王朝与地方共同体"
 nesnd_american_restoration_reason:0 "蒙特祖玛王族与安第斯宫廷的复兴，得到了一批原住民村社的支持。共和国曾许诺自由，新的统治者却照样侵夺公地、征取税款。对于仍在田间劳作的人而言，首都换了一面旗帜，并没有减轻他们肩上的负担。\n\n旧王朝的拥护者正凭这种不满重新活动。他们以保护公地和地方权利为条件，争取村社的人口与武装。乡村也希望借君主的威望，摆脱新贵对自己的侵夺。政府如今须决定，是承认王朝的权利，通过地方议会与地权改革分化它的支持者，还是派军队去压下这些复统的呼声。"
 nesnd_native_recognize:0 "承认旧王朝与地方盟约"
 nesnd_native_recognize_desc:0 "承认旧王朝的统治，由宫廷与地方共同体重新商定政治盟约。"
 nesnd_native_recognize_tt:0 "恢复原住民君主制。若印卡宫廷已经建立，则提出合并请求，须由对方在九十日内同意。"
 nesnd_native_negotiate:0 "谈判地方议会与地权"
 nesnd_native_negotiate_desc:0 "同地方代表商议地权与议会，让乡村的要求能够在现有政府下得到回应。"
 nesnd_native_negotiate_tt:0 "复统压力降低#p 15#!，并停止正在进行的起兵筹备。地方议会持续缓和乡村的复统呼声。"
 nesnd_native_suppress:0 "镇压复统组织"
 nesnd_native_suppress_desc:0 "派军队驱散复统派的集会与联络，暂时压低乡村的反抗声势。"
 nesnd_native_suppress_tt:0 "复统压力降低#p 20#!。本国原住民人口中#n 5%#!转为[concept_radical]。"
 nesnd_native_local_councils:0 "地方议会与地权谈判"
 nesnd_native_restored_rule:0 "复兴王朝的威望"
 nesnd_native_exiles:0 "原住民避难网络"
 nesnd_restoration_pressure_bar:0 "复统压力"
 nesnd_restoration_pressure_bar_desc:0 "$nesnd_restoration_pressure_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_restoration_pressure_base:0 "复统组织的扩展"
 nesnd_restoration_pressure_radicals:0 "激进人口的支持"
 nesnd_restoration_pressure_poverty:0 "贫困中的不满"
 nesnd_restoration_pressure_repression:0 "地方议会的调解"
 nesnd_restoration_existing_court_status:0 "印卡宫廷已经建立。两国独立且未交战时，可以提出合并请求，须由对方同意。"
 nesnd_restoration_waiting_land_status:0 "复统派正在寻找足以起兵的核心地区。土地、人口或当前战事尚不允许割地建国。"
 nesnd_restoration_politics_status:0 "旧王朝的拥护者正以土地与地方权利的诉求争取乡村支持。"
 nesnd_native_restoration_war:0 "王朝复兴之战"
 nesnd_native_restoration_war_reason:0 "复统派已经另立政府，将村社的武装与旧王朝的名义结合起来，要求取得整个国家的统治权。原政府同样不肯放弃割出的国土。地方公地由谁保护，税款听谁征取，军队服从哪一道号令，如今都要在战争中决定。\n\n双方以吞并对方为目标，拒绝议和分治。取得胜利的政府，也须面对支持者在战争中提出的政治要求。"
 nesnd_restoration_war_status:0 "国土与政权的归属尚待确定。"
 nesnd_restoration_war_against:0 "我军正与[ROOT.GetCountry.MakeScope.Var('nesnd_restoration_opponent').GetCountry.GetName]争夺国家的统治权，要求吞并对方，结束两国并立。"
 nesnd_restoration_war_mustering:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_restoration_opponent').GetCountry.GetName]仍在统治自己的国土，两方都在为继续争夺统治权集结兵力。"
 nesnd_restoration_war:0 "原住民复国战争"
 dp_nesnd_native_restoration:0 "原住民复国战争"
 dp_nesnd_native_restoration_desc:0 "原住民政权与原政府争夺国家的统治权，胜者将吞并对方。"
 dp_nesnd_native_restoration_tooltip:0 "#header $dp_nesnd_native_restoration$#!\n$dp_nesnd_native_restoration_desc$"
 wg_nesnd_restoration_settlement:0 "统一国家"
 wg_nesnd_restoration_settlement_desc:0 "击败对方政府并吞并其全部领土。原住民政权战败后，部分居民可能外逃，政治人物也可能流亡。"
 nesnd_american_restoration.1.t:0 "旧王朝的旗帜"
 nesnd_american_restoration.1.d:0 "复统派已经另立政府。旧王朝的名号召来了地方武装，村社首领则希望借这场起兵保住公地与自治。此前要求政府让步的人，如今要求政府交出整个国家。\n\n首都同样不肯承认国土分裂。两方都以吞并对方为目标，拒绝议和分治，两个政权的争执终于成为了决战。"
 nesnd_american_restoration.1.a:0 "准备迎战。"
 nesnd_american_restoration.2.t:0 "避难者抵达"
 nesnd_american_restoration.2.d:0 "遭到镇压的原住民社区已经逃亡越境，带来亲族、地方组织和失去故土的记忆。接纳他们的地区将成为新的避难网络。空旷的土地会接纳他们，让他们终于安歇。前提是他们在陌生的大地上存活到熟悉它的一切。\n\n假以时日，或许他们能比过去更好。"
 nesnd_american_restoration.2.a:0 "望大地母神恩泽，维护大地沃土于阳光中..."
 nesnd_american_restoration.3.t:0 "复统派遭到打击"
 nesnd_american_restoration.3.d:0 "军队驱散了复统派的集会，地方首领之间的联络也遭到打击。支持用兵的人称许政府终于恢复了威严，受到搜捕的原住民却有更多理由相信，这个政府只愿意保护侵夺他们土地的人。\n\n复统组织暂时失去了声势，乡村的怨恨却更深了。那些未被军队抓到的王朝拥护者，大概不会白白放过这样的机会。"
 nesnd_american_restoration.3.a:0 "军队已经出面，乡村却未必服从。"
 nesnd_american_restoration.4.t:0 "王朝与共同体的盟约"
 nesnd_american_restoration.4.d:0 "旧王朝重新取得了国家的统治权。各地村社为宫廷提供支持，宫廷则以承认地方权利来维持这份盟约。原来被首都拒绝的代表，如今终于有了可以诉说要求的地方。\n\n君主的权力也将依靠这些人来维持。无论征税还是征兵，复兴的王朝都必须记得自己是靠谁的拥立回来的。"
 nesnd_american_restoration.4.a:0 "王朝的根基，就在支持它的乡村。"
 nesnd_american_restoration.5.t:0 "战争后的统一"
 nesnd_american_restoration.5.d:0 "对方政府已经失去最后的领土，国家重新统一。军队正接管各地，战时由两方分别征取的税款，也将重新解往同一座首都。\n\n乡村里仍有许多人追随过失败的一方。他们并不会随着敌国的旗帜落下便改变自己的想法，政府还须决定怎样对待这些人，以及他们曾经为之拿起武器的要求。"
 nesnd_american_restoration.5.a:0 "先恢复各地的秩序。"
 nesnd_american_restoration.6.t:0 "被局势打断的复统之争"
 nesnd_american_restoration.6.d:0 "国土与政权的变动打断了复统之争。原先与本国争夺统治权的对手已无法继续参战，我们却也没有接管它的全部国土。\n\n局势已经改变，政府须重新判断周围的敌友。此前未能解决的地方问题，只得在新的疆界之内继续处置。"
 nesnd_american_restoration.6.a:0 "先看清如今由谁统治这些土地。"
 nesnd_american_restoration.10.t:0 "共同承认一个印卡宫廷"
 nesnd_american_restoration.10.d:0 "[SCOPE.sCountry('nesnd_restoration_applicant').GetName]提议共同拥戴现存的印卡宫廷，并将本国并入我们的统治。双方所承认的王朝传统，使两国的代表有了可以商谈统一的根据。\n\n对方的地方共同体也将随国土一同归附。他们希望宫廷维护公地与地方权利，如今正等待我们的答复。"
 nesnd_american_restoration.10.a:0 "同奉一个宫廷，就归于同一个国家。"
 nesnd_american_restoration.10.b:0 "共同的传统，尚不足以让两国合一。"
 nesnd_a2_itzcoatl_first:0 "伊特斯科亚特"
 nesnd_a2_moctezuma_last:0 "蒙特祖玛"
 nesnd_a2_amaru_first:0 "尤潘基"
 nesnd_a2_amaru_last:0 "阿马鲁一世"
 nesnd_a2_rumi_first:0 "鲁米"
 nesnd_a2_quispe_last:0 "基斯佩"
 nesnd_a2_tatanka_first:0 "塔坦卡"
 nesnd_a2_temur_last:0 "帖木儿"
 nesnd_khanate_emergence:0 "草原盟约的复兴"
 nesnd_khanate_emergence_reason:0 "美国内战使大平原的统治发生动摇，东洲的新登记法又把原住民的不满推向前台。各共同体的首领开始联络旧日起义的支持者，希望借两国局势的变化，在草原建立自己的汗国。\n\n这一联合以土地为根基。迁徙与登记都牵连着人们能够在哪里生活、由谁决定他们的身份。新汗若要取得共同体的拥护，就必须承诺保住这些权利，也必须有力量抵御两国的干涉。"
 nesnd_khanate_waiting_status:0 "等待四座相连的美国大平原人口州。割地后，美国仍须保有居民和领土。"
 nesnd_khanate_established_tt:0 "原住民汗国已实际取得八州并建立政府。"
 nesnd_khanate_survival:0 "汗国的生存之战"
 nesnd_khanate_survival_reason:0 "美国与东洲都要求吞并汗国。刚刚迁入草原的原住民因此又须拿起武器，保卫好不容易得到的安身之地。各共同体既然拥戴了同一位汗，也希望他能把分散的武装组织起来，抵御两国进攻。\n\n新汗需要他们提供兵员与给养，地方首领则要求保有自己的权利。战争把各部联合到了一起，这份联合能否维持，将决定他们还能不能留在这片草原。"
 nesnd_khanate_usa_status:0 "美国仍未结束对汗国的干涉。"
 nesnd_khanate_hus_status:0 "东洲仍未结束对汗国的干涉。"
 nesnd_khanate_survival_status:0 "两国对汗国的干涉均已结束。"
 nesnd_khanate_legacy_status:0 "汗国已经建立。"
 nesnd_khanate_survived_tt:0 "汗国仍然存活，两条独立干涉均已结束。"
 nesnd_suppress_native_khanate:0 "干涉大平原汗国"
 nesnd_suppress_native_khanate_reason:0 "大平原的割地与人口迁移，已经改变了北美的力量分布。汗国凭原住民共同体的支持建立政府，试图把迁民、土地与地方武装联成新的国家。我们若任其立足，原有的领土主张便将越来越难维持。\n\n政府准备以吞并结束汗国的统治，新汗则希望迫使干涉者屈服，为草原盟约赢得威望。双方争夺的，既是这片国土，也是今后谁有权安排原住民的生活。"
 nesnd_khanate_intervention_status:0 "本国正在争取吞并汗国。"
 nesnd_khanate_destroyed_tt:0 "本国已吞并大平原汗国。"
 nesnd_khanate_suppression_failed_tt:0 "围绕大平原的纷争已经结束，汗国未被本国吞并。"
 nesnd_khanate_war:0 "大平原干涉战争"
 dp_nesnd_khanate_suppression:0 "大平原干涉战争"
 dp_nesnd_khanate_suppression_desc:0 "干涉者要求吞并大平原汗国，汗国则要求羞辱干涉者。"
 dp_nesnd_khanate_suppression_tooltip:0 "#header $dp_nesnd_khanate_suppression$#!\n$dp_nesnd_khanate_suppression_desc$"
 NKH:0 "大平原汗国"
 NKH_ADJ:0 "大平原汗国"
 wg_nesnd_khanate_annex:0 "吞并汗国"
 wg_nesnd_khanate_annex_desc:0 "吞并大平原汗国。"
 wg_nesnd_khanate_humiliation:0 "羞辱干涉者"
 wg_nesnd_khanate_humiliation_desc:0 "迫使这场干涉的发动国接受羞辱。"
 nesnd_khanate_army:0 "草原盟军"
 nesnd_native_american_republic:0 "建立原住民共和国"
 nesnd_native_american_republic_desc:0 "统一全美洲与格陵兰，在旧国家灭亡后建立以原住民为主流的共和国，并施行共和国的法律。"
 nesnd_native_khanate.2.t:0 "草原上的新国家"
 nesnd_native_khanate.2.d:0 "两国的干涉已经结束，汗国保住了自己的政府。各共同体曾为抵御外敌而联合，迁来的人也得以留在草原经营生活。\n\n新汗如今要同地方首领商定税收、防务与权力。共同作战时可以暂置一旁的分歧，将重新进入日常事务。草原盟约能否维持，取决于国家还能给支持它的人留下多少利益。"
 nesnd_native_khanate.2.a:0 "共同守住的草原，还要共同经营。"
 nesnd_native_khanate.3.t:0 "美洲原住民的共和国"
 nesnd_native_khanate.3.d:0 "从北方的草原到南方的群山，美洲已归于同一个政府。旧东洲政权不复存在，新的[ROOT.GetCountry.GetName]继承了它的国号，废除等级制度，以共和国的名义统治这片大陆。\n\n原住民曾经为土地、身份与地方权利奔走，如今已成为这个国家的主人。幅员广大的共和国将由他们承担，也将由他们回答：共同的法律怎样进入不同地方的生活，取得的权力又将用来保护谁。"
 nesnd_native_khanate.3.a:0 "由美洲的人民承担自己的未来。"
 nesnd_a2_exodus_both_desc:0 "登记完成以后，仍被留在二等户籍中的满蒙社区开始离开共和国。有人投向[SCOPE.sCountry('nesnd_a2_cne_country').GetName]，有人前往[SCOPE.sCountry('nesnd_a2_usa_country').GetName]西部，把亲族与旧日联系一同带往新的土地。\n\n各社区有七成概率迁往前者、三成概率迁往后者。人们带走的不只是人口与家当，也带走了在这里取得平等身份的期待。"
 nesnd_a2_exodus_cne_desc:0 "美国西部已无处接纳这批迁民，离开共和国的满蒙社区全部前往[SCOPE.sCountry('nesnd_a2_cne_country').GetName]。登记没有给他们带来所期待的身份，迁居便成了寻找另一种生活的办法。\n\n亲族与旧日联系随着他们一同东去。留下的家园，将由别人继续经营。"
 nesnd_a2_exodus_usa_desc:0 "东方已无处接纳这批迁民，离开共和国的满蒙社区全部前往[SCOPE.sCountry('nesnd_a2_usa_country').GetName]西部。他们把亲族与家当带向新的土地，希望不再以二等户籍度过此后的生活。\n\n那里能给他们怎样的机会，还要在迁居以后才能知道。原来的家园，已经留在身后。"
 nesnd_a2_exodus_none_desc:0 "满蒙社区既未能在东方找到接纳之地，也无法迁往美国西部。他们只得留在原居地，在登记确定的身份下继续生活。\n\n迁居的打算就此落空，促使他们离开的不满却没有因此消失。"
 nesnd_american_restoration.11.t:0 "合并请求已经逾期"
 nesnd_american_restoration.11.d:0 "约定的期限已经过去，印卡宫廷没有同意合并。共同的王朝传统，尚未使两个政府归于同一统治，双方仍各自承担自己的国土与人民。\n\n地方共同体对宫廷的期待，也须继续同眼前的政治处境相处。此后仍可重新商谈，眼下的两国并立却不会因一份未获答复的请求而改变。"
 nesnd_american_restoration.11.a:0 "暂且保留各自的统治。"
 nesnd_american_restoration.12.t:0 "印卡宫廷拒绝合并"
 nesnd_american_restoration.12.d:0 "印卡宫廷拒绝了合并的请求。王朝的共同传统可以使双方相互接近，却不足以让现有的统治者接受同一国家的安排。\n\n政府须继续处理本国的土地与地方政治，不能把这些责任都寄于宫廷的答复。经过等待期，双方仍可重新商谈。"
 nesnd_american_restoration.12.a:0 "保留日后的谈判余地。"
 nesnd_restore_native_hus:0 "建立原住民共和国"
 nesnd_restore_native_hus_desc:0 "统一全美洲与格陵兰，在旧国家灭亡后建立以原住民为主流的共和国，并施行共和国的法律。"
 nesnd_native_americas_unified_tt:0 "完整拥有全美洲与格陵兰的所有地区，包括未殖民地与外国分割州。"
 nesnd_native_hus_restored_tt:0 "以原住民文化为主流建立共和国，并确立二十四组普通法律。"
 nesnd_american_restoration.13.t:0 "重建王朝的统治"
 nesnd_american_restoration.13.d:0 "王朝的支持者重新召集地方共同体，商议宫廷与乡村之间的政治安排。复兴的名义已经确立，地方首领却还要知道自己的土地与代表能在新统治下取得什么地位。\n\n旧日争夺留下的分歧，仍须由这个国家承担。宫廷需要乡村支持，乡村也要求宫廷保护自己的利益。双方只有把这些要求落实到日常事务，盟约才有继续维持的根据。"
 nesnd_american_restoration.13.a:0 "维持国家，重立盟约。"
 nesnd_native_khanate.2.both:0 "两场干涉的发动者都曾被迫接受羞辱，汗国保住了自己的政府。草原盟军的胜利，使新汗与各共同体的联合取得了威望，迁民也得以在新家园继续生活。\n\n战争使他们共同抵御外敌，此后却还要商定怎样征税、怎样分担防务、地方保有哪些权利。草原盟约要成为长久的统治，不能只依靠已经赢得的胜仗。"
 nesnd_native_khanate.2.one:0 "一场干涉以对手接受羞辱告终，另一场干涉也已结束。汗国保住了政府与国土，迁来的人得以留在草原经营生活。\n\n共同体曾为了抵御进攻聚在新汗旗下，如今则要议论税收、防务与地方权力。战时愿意共同承担的事务，到了日常生活中，也需要让各方看见自己的所得。"
 nesnd_native_khanate.2.none:0 "两国的干涉都已结束。汗国没有迫使对手接受羞辱，却保住了自己的政府，草原上的共同体也得以继续经营新家园。\n\n新汗仍须依靠地方首领与迁民的支持。怎样负担税收与防务，怎样维护各地的权利，将决定这份为求生存而结成的盟约能够维持多久。"
 war_goal_wg_nesnd_restoration_settlement_type_name:0 "统一国家"
 war_goal_wg_nesnd_restoration_settlement_type_desc:0 "击败对方政府并吞并其全部领土。原住民政权战败后，部分居民可能外逃，政治人物也可能流亡。"
