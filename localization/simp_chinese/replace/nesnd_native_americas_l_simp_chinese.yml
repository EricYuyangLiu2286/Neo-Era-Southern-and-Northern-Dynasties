 nesnd_ui_restoration_native_population_tt:0 "本国仍有原住民人口"
 nesnd_ui_restoration_no_invitation_tt:0 "没有尚待答复的复国邀请"
 nesnd_ui_restoration_wait_over_tt:0 "上次复国交涉后的等待期已结束"
 nesnd_ui_khanate_campaign_ended_tt:0 "围绕大平原的纷争已经结束"
 nesnd_ui_khanate_not_annexed_tt:0 "本国未吞并大平原汗国"
 nesnd_native_repression:0 "军事镇压"
 nesnd_restoration_repression_pressure_tt:0 "复统压力至少为#v 50#!"
 nesnd_restoration_mobilizing_status:0 "复统派已在地方建立联络，正在筹集起兵所需的人手与给养。筹备期共#v 12个月#!。"
 nesnd_restoration_mobilization_paused_status:0 "十二个月的筹备已经结束。复统压力低于#v 75#!，起兵暂缓。"
 nesnd_restoration_mobilization_ready_status:0 "筹备已经结束。复统压力至少#v 75#!、原定地区具备起兵条件，且没有待答复的合并提议或其他内战时，复统派将另立政府。"
 nesnd_american_restoration.14.t:0 "村社之间的联络"
 nesnd_american_restoration.14.d:0 "旧王朝的支持者已经同一些原住民村社结成联络。地方首领开始筹集人手与给养，准备以新的政权保住土地和自治。\n\n这场筹备将持续十二个月。[ROOT.GetCountry.GetName]政府面前的土地与地方权力之争，正逐渐成为武装对抗。村社是否响应、双方能否谈妥地方议会与地权，将决定复统派是否最终举兵。"
 nesnd_american_restoration.14.a:0 "我们的统治正受挑战。"
 notification_nesnd_restoration_repression_notice_name:0 "复统组织遭到镇压"
 notification_nesnd_restoration_repression_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]动用军队压制复统组织。复统派受到打击，原住民的不满也随之加深。"
 notification_nesnd_restoration_repression_notice_tooltip:0 "#header $notification_nesnd_restoration_repression_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_repression_notice_desc$"
 notification_nesnd_restoration_mobilization_notice_name:0 "复统派准备起兵"
 notification_nesnd_restoration_mobilization_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]的复统派开始了十二个月的起兵筹备，旧王朝拥护者与地方共同体正聚集人手和给养。"
 notification_nesnd_restoration_mobilization_notice_tooltip:0 "#header $notification_nesnd_restoration_mobilization_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_mobilization_notice_desc$"
