 notification_nesnd_restoration_country_created_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]的复统派已经另立政府，原有国土分属两个政权。"
 notification_nesnd_restoration_country_created_notice_tooltip:0 "#header $notification_nesnd_restoration_country_created_notice_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nesnd_restoration_country_created_notice_desc$"
