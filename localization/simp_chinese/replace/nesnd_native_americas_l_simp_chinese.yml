 nesnd_american_restoration.14.t:0 "村社之间的联络"
 nesnd_american_restoration.14.d:0 "旧王朝的支持者已经同一些原住民村社结成联络。地方首领开始筹集人手与给养，希望借一个新的政权保住土地和自治。复统派则要凭这些乡村力量重建王朝的统治。\n\n这场筹备要持续十二个月。[ROOT.GetCountry.GetName]政府还可以拿地方议会和地权谈判去争取村社；拖得越久，复统派的组织就越严密。"
 nesnd_american_restoration.14.a:0 "我们的统治正受挑战。"
