 nesnd_american_restoration.14.t:0 "村社之间的联络"
 nesnd_american_restoration.14.d:0 "旧王朝的支持者已经同一些原住民村社结成联络。地方首领开始筹集人手与给养，希望借一个新的政权保住土地和自治。复统派则要凭这些乡村力量重建王朝的统治。\n\n这场筹备将持续十二个月。[ROOT.GetCountry.GetName]政府仍可通过地方议会与地权谈判争取合作，但拖延也会给复统派更多组织的时间。村社是否响应，将决定这些联络最终能召集起怎样的武装。"
 nesnd_american_restoration.14.a:0 "我们的统治正受挑战。"
