 nesnd_native_khanate.4.t:0 "干涉前的毁约"
 nesnd_native_khanate.4.d:0 "[SCOPE.sCountry('nesnd_khanate_opponent').GetName]已经退出同汗国之间载有联盟或防御协定的条约，为干涉清除障碍。曾经用来保证彼此安全的承诺，如今让位于吞并与领土的要求。\n\n退出的条约若还载有贸易或其他约定，那些安排也一同终止，毁约的代价由退出国承担。汗国原先可以依靠的这段关系，已经随着战争的准备破裂。"
 nesnd_native_khanate.4.a:0 "战争先从盟约的破裂开始。"
