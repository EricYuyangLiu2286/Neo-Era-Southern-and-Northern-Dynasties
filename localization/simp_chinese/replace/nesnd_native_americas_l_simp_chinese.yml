l_simp_chinese:
 nesnd_hus_registration.1.t:0 "草原盟约再起"
 nesnd_hus_registration.1.d:0 "[SCOPE.sCountry('nesnd_a2_khanate').GetName]已经建立。来自东洲与美国的原住民正在迁入新国，各共同体将拥立的新汗视作保卫土地的领袖。华盛顿与东洲政府都拒绝承认这次割地，草原上的战争迫在眉睫。"
 nesnd_hus_registration.1.a:0 "草原已经有了新的主人。"
 nesnd_hus_registration.2.t:0 "登记之后的迁居"
 nesnd_hus_registration.2.d:0 "原住民编户完成之后，满蒙居民仍被留在二等户籍之中。如今，他们已经离开共和国：有人投向$CNE$，也有人前往美国西部，在新的土地上寻找生活。"
 nesnd_hus_registration.2.a:0 "这一选择已经作出。"
 war_goal_wg_nesnd_usm_annex_type_name:0 "$war_goal_annex_country_type_name$"
 war_goal_wg_nesnd_usm_annex_type_desc:0 "$war_goal_annex_country_type_desc$"
 war_goal_wg_nesnd_usm_annex:0 "$war_goal_annex_country$"
 war_goal_wg_nesnd_usm_annex_desc:0 "$war_goal_annex_country_desc$"
 war_goal_wg_nesnd_usm_annex_sway_desc:0 "$war_goal_annex_country_sway_desc$"
 nesnd_american_restoration:0 "旧王朝与地方共同体"
 nesnd_american_restoration_reason:0 "蒙特祖玛王族与安第斯宫廷的复兴有着不同的来路，却都要回答同一个问题：共和国建立以后，原住民共同体能否掌握自己的土地和地方政治？王朝的支持者从旧日盟约中寻找合法性，乡村则要求结束新统治者对地权的侵夺。承认、谈判或镇压，将决定这些诉求怎样进入国家的未来。"
 nesnd_native_recognize:0 "承认旧王朝与地方盟约"
 nesnd_native_recognize_desc:0 "让旧王朝与地方共同体共同参与新的统治安排。"
 nesnd_native_recognize_tt:0 "恢复原住民君主制；若印卡宫廷已经建立，则提出合并请求，须由对方在九十日内同意。"
 nesnd_native_negotiate:0 "谈判地方议会与地权"
 nesnd_native_negotiate_desc:0 "以地方议会和地权谈判换取乡村的合作。"
 nesnd_native_negotiate_tt:0 "复统压力立即降低十五点；谈判期间，地方议会持续缓和复统运动。"
 nesnd_native_suppress:0 "镇压复统组织"
 nesnd_native_suppress_desc:0 "动用军队摧毁复统组织，承担随之而来的迁徙和乡村激化。"
 nesnd_native_suppress_tt:0 "现存原住民人口各有四成迁往具备接纳州的避难国。没有可接纳目的地时，人口留在原处。接纳迁民的州在60个月内迁徙吸引力提高25%。部分政治人物将流亡；迁徙后，本国剩余原住民人口的15%转为激进派。"
 nesnd_native_local_councils:0 "地方议会与地权谈判"
 nesnd_native_restored_rule:0 "复兴王朝的威望"
 nesnd_native_exiles:0 "原住民避难网络"
 nesnd_restoration_pressure_bar:0 "复统压力"
 nesnd_restoration_pressure_bar_desc:0 "乡村共同体与旧王朝支持者联合行动的力量。压力达到顶点后，复统派将在具备足够土地和人口的地区起兵。"
 nesnd_restoration_pressure_base:0 "复统组织的扩展"
 nesnd_restoration_pressure_radicals:0 "激进人口的支持"
 nesnd_restoration_pressure_poverty:0 "贫困中的不满"
 nesnd_restoration_pressure_repression:0 "地方议会的调解"
 nesnd_restoration_existing_court_status:0 "印卡宫廷已经建立。两国独立且未交战时，可以提出合并请求，须由对方同意。"
 nesnd_restoration_waiting_land_status:0 "复统派正在寻找足以起兵的核心地区；土地、人口或当前战事尚不允许割地建国。"
 nesnd_restoration_politics_status:0 "旧王朝的拥护者与地方共同体正在争取政治支持。"
 nesnd_native_restoration_war:0 "王朝复兴之战"
 nesnd_native_restoration_war_reason:0 "复统派已经另立政府，要求中央政府交出统治权。地方共同体的土地、军队的归属和旧王朝的地位，都成了战争中的争夺。吞并对方可以结束两国并立；若双方议和，则须接受分治。"
 nesnd_restoration_war_status:0 "双方仍须以实际战争或和约决定复统的命运。"
 nesnd_restoration_war:0 "王朝复兴之战"
 dp_nesnd_native_restoration:0 "王朝复兴之战"
 dp_nesnd_native_restoration_desc:0 "复统王朝与共和国争夺国家的统治权，胜者将吞并败者。"
 dp_nesnd_native_restoration_tooltip:0 "#header $dp_nesnd_native_restoration$#!\n$dp_nesnd_native_restoration_desc$"
 wg_nesnd_restoration_settlement:0 "统一复国疆土"
 wg_nesnd_restoration_settlement_desc:0 "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 nesnd_american_restoration.1.t:0 "旧王朝的旗帜"
 nesnd_american_restoration.1.d:0 "旧王朝的支持者联合地方武装，宣布脱离中央政府，另立政府。村社要求守住土地，复统派则要求恢复王朝的统治。双方的军队已经开始争夺地方的支持。"
 nesnd_american_restoration.1.a:0 "准备迎战。"
 nesnd_american_restoration.2.t:0 "避难者抵达"
 nesnd_american_restoration.2.d:0 "遭到镇压的原住民共同体已经越境，带来亲族、地方组织和失去故土的记忆。接纳他们的地区将成为新的避难网络；迁居并不能使他们立即恢复原来的生计。"
 nesnd_american_restoration.2.a:0 "让他们在这里安顿下来。"
 nesnd_american_restoration.3.t:0 "复统组织遭到镇压"
 nesnd_american_restoration.3.d:0 "军队驱散了复统组织，乡村的政治冲突却没有因此消失。有接纳地的家庭开始迁居；无处可去的人仍留在原地。被剥夺政治地位的代表走向流亡，土地和地方权力的争执继续留在国内。"
 nesnd_american_restoration.3.a:0 "承担这一决定的后果。"
 nesnd_american_restoration.4.t:0 "王朝与共同体的盟约"
 nesnd_american_restoration.4.d:0 "旧王朝重新进入国家的政治中心。地方共同体以支持王朝为条件，要求自己的土地和代表得到承认。宫廷、议会与乡村之间的关系，将在新的统治安排下继续展开。"
 nesnd_american_restoration.4.a:0 "让新的统治从这里开始。"
 nesnd_american_restoration.5.t:0 "战争后的统一"
 nesnd_american_restoration.5.d:0 "对方政府已失去最后的领土，国家重新统一。新接管的地区仍有战争留下的创伤，地方土地的争夺和流亡者的去向，也需要政府作出安排。"
 nesnd_american_restoration.5.a:0 "接管战争留下的国家。"
 nesnd_american_restoration.6.t:0 "复统之争暂告一段落"
 nesnd_american_restoration.6.d:0 "复统之争已经暂告一段落。政府未能以这场对抗实现统一，必须依据眼前的疆界与各地势力，重新安排今后的方略。"
 nesnd_american_restoration.6.a:0 "接受眼前的局面。"
 nesnd_american_restoration.10.t:0 "共同承认一个印卡宫廷"
 nesnd_american_restoration.10.d:0 "[SCOPE.sCountry('nesnd_restoration_applicant').GetName]提出承认现存印卡宫廷，并将本国并入我们的统治。这个决定将结束两国并立，也使其地方共同体成为宫廷必须接纳的政治力量。"
 nesnd_american_restoration.10.a:0 "接受共同归于一国。"
 nesnd_american_restoration.10.b:0 "保留两国各自的统治。"
 nesnd_a2_itzcoatl_first:0 "伊特斯科亚特"
 nesnd_a2_moctezuma_last:0 "蒙特祖玛"
 nesnd_a2_amaru_first:0 "尤潘基"
 nesnd_a2_amaru_last:0 "阿马鲁一世"
 nesnd_a2_rumi_first:0 "鲁米"
 nesnd_a2_quispe_last:0 "基斯佩"
 nesnd_a2_tatanka_first:0 "塔坦卡"
 nesnd_a2_temur_last:0 "帖木儿"
 nesnd_khanate_emergence:0 "草原盟约的复兴"
 nesnd_khanate_emergence_reason:0 "美国内战使大平原的统治陷入动摇。东洲的新登记法又激起原住民的不满，各共同体的首领开始联络旧日起义的支持者，准备在草原建立自己的汗国。"
 nesnd_khanate_waiting_status:0 "等待四座相连的美国大平原人口州；割地后，美国仍须保有居民和领土。"
 nesnd_khanate_established_tt:0 "原住民汗国已实际取得四州并建立政府。"
 nesnd_khanate_survival:0 "汗国的生存之战"
 nesnd_khanate_survival_reason:0 "美国与东洲都要求收回汗国的领土。新汗必须率领各共同体抵御两国进攻，守住迁民赖以安身的草原。"
 nesnd_khanate_usa_status:0 "美国仍未结束对汗国的干涉。"
 nesnd_khanate_hus_status:0 "东洲仍未结束对汗国的干涉。"
 nesnd_khanate_survival_status:0 "两国对汗国的干涉均已结束。"
 nesnd_khanate_legacy_status:0 "汗国已经建立。"
 nesnd_khanate_survived_tt:0 "汗国仍然存活，两条独立干涉均已结束。"
 nesnd_suppress_native_khanate:0 "干涉大平原汗国"
 nesnd_suppress_native_khanate_reason:0 "大平原的割地与人口迁移改变了北美的力量分布。政府准备以吞并汗国恢复自己的主张，汗国则要求以战争迫使干涉者承认其地位。"
 nesnd_khanate_intervention_status:0 "本国正在争取吞并汗国。"
 nesnd_khanate_destroyed_tt:0 "本国已吞并大平原汗国。"
 nesnd_khanate_suppression_failed_tt:0 "本次干涉已结束，汗国没有被本国吞并。"
 nesnd_khanate_war:0 "大平原干涉战争"
 dp_nesnd_khanate_suppression:0 "大平原干涉战争"
 dp_nesnd_khanate_suppression_desc:0 "干涉者要求吞并大平原汗国，汗国则要求羞辱干涉者。"
 dp_nesnd_khanate_suppression_tooltip:0 "#header $dp_nesnd_khanate_suppression$#!\n$dp_nesnd_khanate_suppression_desc$"
 NKH:0 "大平原汗国"
 NKH_ADJ:0 "大平原汗国"
 wg_nesnd_khanate_annex:0 "吞并汗国"
 wg_nesnd_khanate_annex_desc:0 "吞并大平原汗国。"
 wg_nesnd_khanate_humiliation:0 "羞辱干涉者"
 wg_nesnd_khanate_humiliation_desc:0 "迫使这场干涉的发动国接受羞辱。"
 nesnd_khanate_army:0 "草原盟军"
 nesnd_native_american_republic:0 "建立原住民共和国"
 nesnd_native_american_republic_desc:0 "统一全美洲与格陵兰，在旧国家已经灭亡后，以原住民为主流重建共和国，并确立完整的普通法制。"
 nesnd_native_khanate.2.t:0 "草原上的新国家"
 nesnd_native_khanate.2.d:0 "两国的干涉已经结束，汗国保住了自己的政府。各地共同体曾为抵御外敌而联合，如今必须商定税收、防务和地方权力，使草原盟约能够维持下去。"
 nesnd_native_khanate.2.a:0 "守住已经取得的国家。"
 nesnd_native_khanate.3.t:0 "美洲原住民的共和国"
 nesnd_native_khanate.3.d:0 "从北方的草原到南方的群山，美洲已归于同一个政府。旧东洲政权不复存在，新的[ROOT.GetCountry.GetName]继承了它的国号，废除等级制度，以共和国的名义统治这片大陆。"
 nesnd_native_khanate.3.a:0 "由美洲的人民承担自己的未来。"
 nesnd_a2_exodus_both_desc:0 "登记后的满蒙社区分别选择迁往[SCOPE.sCountry('nesnd_a2_cne_country').GetName]或[SCOPE.sCountry('nesnd_a2_usa_country').GetName]西部。每个社区有七成概率选择前者、三成选择后者；各社区人口不同，实际人数并不按七三比例分割。亲族和旧日联系随着迁居重新分布。"
 nesnd_a2_exodus_cne_desc:0 "美国西部已没有可接纳的目的地。满蒙社区此次全部迁往[SCOPE.sCountry('nesnd_a2_cne_country').GetName]，原定的两地分流没有实行。"
 nesnd_a2_exodus_usa_desc:0 "东方已没有可接纳的目的地。满蒙社区此次全部迁往[SCOPE.sCountry('nesnd_a2_usa_country').GetName]西部，原定的两地分流没有实行。"
 nesnd_a2_exodus_none_desc:0 "两处目的地都已无法接纳迁居的满蒙社区。各社区留在当前居地，此次迁徙到此结束；已经实行的登记选择继续有效。"
 nesnd_american_restoration.11.t:0 "合并请求已经逾期"
 nesnd_american_restoration.11.d:0 "印卡宫廷未在期限内同意合并。两国继续保有自己的政府和领土；经过一段时间，双方仍可重新商谈。"
 nesnd_american_restoration.11.a:0 "暂且保留各自的统治。"
 nesnd_american_restoration.12.t:0 "印卡宫廷拒绝合并"
 nesnd_american_restoration.12.d:0 "印卡宫廷拒绝了此次合并请求。承认王朝的共同传统尚不足以结束两国并立，双方仍可在等待期后重新商谈。"
 nesnd_american_restoration.12.a:0 "保留日后的谈判余地。"
 nesnd_restore_native_hus:0 "建立原住民共和国"
 nesnd_restore_native_hus_desc:0 "统一全美洲与格陵兰，在旧国家已经灭亡后，以原住民为主流重建共和国，并确立完整的普通法制。"
 nesnd_native_americas_unified_tt:0 "完整拥有全美洲与格陵兰的所有地区，包括未殖民地与外国分割州。"
 nesnd_native_hus_restored_tt:0 "采用原住民主流文化，改建共和国并实行完整的二十四组普通法律。"
 nesnd_american_restoration.13.t:0 "重建王朝的统治"
 nesnd_american_restoration.13.d:0 "王朝的支持者重新召集地方共同体，商定宫廷、地方代表与乡村之间的统治安排。现存国家将在新的政治盟约下继续生活，旧日战争造成的分歧也将由它承担。"
 nesnd_american_restoration.13.a:0 "维持国家，重立盟约。"
 nesnd_native_khanate.2.both:0 "两场干涉的发动者都曾被迫接受羞辱，汗国仍保有自己的政府。战时的胜利使草原盟约获得威望，各地共同体现在必须把这种联合变成长久的统治。"
 nesnd_native_khanate.2.one:0 "一场干涉以对手接受羞辱告终，另一场干涉也已结束。汗国保住了自己的政府，草原共同体现在必须把战时合作延续到日常统治中。"
 nesnd_native_khanate.2.none:0 "两国的干涉都已结束，汗国虽未迫使对手接受羞辱，却保住了自己的政府。各地共同体仍须共同承担税收与防务，维持这个新国家。"
 war_goal_wg_nesnd_restoration_settlement_type_name:0 "统一复国疆土"
 war_goal_wg_nesnd_restoration_settlement_type_desc:0 "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 war_goal_wg_nesnd_restoration_settlement:0 "统一复国疆土：[WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_restoration_settlement_desc:0 "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 war_goal_wg_nesnd_restoration_settlement_sway_desc:0 "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 war_goal_wg_nesnd_khanate_annex_type_name:0 "吞并汗国"
 war_goal_wg_nesnd_khanate_annex_type_desc:0 "吞并大平原汗国。"
 war_goal_wg_nesnd_khanate_annex:0 "吞并汗国：[WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_annex_desc:0 "吞并大平原汗国。"
 war_goal_wg_nesnd_khanate_annex_sway_desc:0 "吞并大平原汗国。"
 war_goal_wg_nesnd_khanate_humiliation_type_name:0 "羞辱干涉者"
 war_goal_wg_nesnd_khanate_humiliation_type_desc:0 "迫使这场干涉的发动国接受羞辱。"
 war_goal_wg_nesnd_khanate_humiliation:0 "羞辱干涉者：[WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_humiliation_desc:0 "迫使这场干涉的发动国接受羞辱。"
 war_goal_wg_nesnd_khanate_humiliation_sway_desc:0 "迫使这场干涉的发动国接受羞辱。"
 nesnd_native_khanate.4.t:0 "干涉前的毁约"
 nesnd_native_khanate.4.d:0 "[SCOPE.sCountry('nesnd_khanate_opponent').GetName]已退出与汗国之间含有联盟或防御协定条款的条约，为干涉清除障碍。若同一份条约还载有贸易或其他约定，那些条款也随之终止；毁约的外交代价仍由退出国承担。两国与第三国的条约不在此次退出之列。"
 nesnd_native_khanate.4.a:0 "战争先从盟约的破裂开始。"
 nesnd_final_native_restored_existing_tt:0 "复统后的统治：威望+30，乡村民众认可+3，建设效率+10%；持续120个月。"
