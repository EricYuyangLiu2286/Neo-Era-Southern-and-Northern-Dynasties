 nesnd_rising.1.t:0 "共和军的军报"
 nesnd_rising.1.d:0 "地方来报，共和军旧部已在下列各州约定举事。兵部估计还有九十天可以部署。\n\n[ROOT.GetCountry.GetCustom('nesnd_rep_show_shanxi')][ROOT.GetCountry.GetCustom('nesnd_rep_show_jinbei')][ROOT.GetCountry.GetCustom('nesnd_rep_show_shaanbei')][ROOT.GetCountry.GetCustom('nesnd_rep_show_hinggan')][ROOT.GetCountry.GetCustom('nesnd_rep_show_shengjing')][ROOT.GetCountry.GetCustom('nesnd_rep_show_southern_manchuria')][ROOT.GetCountry.GetCustom('nesnd_rep_show_shandong')][ROOT.GetCountry.GetCustom('nesnd_rep_show_zhili')][ROOT.GetCountry.GetCustom('nesnd_rep_show_beijing')]"
 nesnd_rising.1.f:0 "“各省驻军、仓储、道路，请分册具报。”——兵部移文"
 nesnd_rising.1.a:0 "将各州军报送来。"
 nesnd_rising.2.t:0 "东北各营的约期"
 nesnd_rising.2.d:0 "登莱与徐氏已订下约书。东北各营中，下列各州已有旧部应约。地方官报来的举兵日期在九十天后。\n\n[ROOT.GetCountry.GetCustom('nesnd_yan_show_songjiang')][ROOT.GetCountry.GetCustom('nesnd_yan_show_outer_manchuria')][ROOT.GetCountry.GetCustom('nesnd_yan_show_northern_manchuria')][ROOT.GetCountry.GetCustom('nesnd_yan_show_amur')][ROOT.GetCountry.GetCustom('nesnd_yan_show_boli')][ROOT.GetCountry.GetCustom('nesnd_yan_show_shengjing')][ROOT.GetCountry.GetCustom('nesnd_yan_show_southern_manchuria')]"
 nesnd_rising.2.f:0 "“谨将应约各营开列于后，呈部核阅。”——东北来报"
 nesnd_rising.2.a:0 "取东北舆图来。"
 nesnd_rising.3.t:0 "旧部应约"
 nesnd_rising.3.d:0 "[SCOPE.sState('nesnd_yan_contact_target').GetName]的旧部已经回信，愿在徐氏举兵之日奉约起事。"
 nesnd_rising.3.f:0 "“至期举旗。”——旧部复书"
 nesnd_rising.3.a:0 "把回书收好。"
 nesnd_rising.4.t:0 "未得回书"
 nesnd_rising.4.d:0 "送往[SCOPE.sState('nesnd_yan_contact_target').GetName]的经费已经支出，当地旧部却始终没有给登莱回信。"
 nesnd_rising.4.f:0 "“前次所询，至今未复。”——会党来函"
 nesnd_rising.4.a:0 "另候消息。"
 nesnd_usm_recognise_japanese:0 "承认和人为国人"
 nesnd_usm_recognise_japanese_desc:0 "分离运动、主张总统制或议会共和制的革命者，或社会主义者在国内举兵之际，若朝廷在日本列岛本土仍拥有并控制至少一个已整合州，国内和人又没有参加分离动员，便可承认日本文化为[concept_primary_culture]。"
 nesnd_usm_native_insurrection_tt:0 "正在与本国分离运动、争取总统制或议会共和制的革命运动，或社会主义革命运动交战。"
 nesnd_usm_japanese_home_state_tt:0 "在日本列岛本土拥有并控制至少一个已整合州。"
 nesnd_usm_no_japanese_secession_tt:0 "本国和人没有正在动员的分离运动。"
 nesnd_yan_missing_bases:0 "会党须先在北朝所辖的松江、海参崴两地立足。两地州份齐备以后，才可接洽其余各州的旧部。"
