l_simp_chinese:
 nesnd_sha_snow_republic:0 "雪国之梦"
 nesnd_sha_snow_republic_reason:0 "当年齐王把勘察加收作海外领地，大概没有料到，1711年以后，齐国的贵人们要到这冰天雪地里来避难。1712至1713年间，战败的国人共和派也渡海而来。昔日的君臣在异乡再交了一回手。这一回，活下来的又是共和国。\n\n吴国，然后是大明联邦的资助使登莱的海船得以远航。登莱人在林间伐木、放牧、捕猎，出海捕鱼、捕鲸，海上的船商却另有一门获利丰厚的买卖。他们把俘来的女真人和蒙古人卖给东洲的屯垦地，收了价银，有的把本钱投进当地的垦殖事业，有的用这笔钱从西秦走私军械。只要有利可图，连敌国东燕的军火也有人敢贩运。这条远北商路就这样经营了几代人。后来牧仲棠背叛革命，山西共和国覆灭，港外一次又一次响起向岸上求救的呼声。\n\n流亡者越来越多，脆弱的雪国经济渐渐不堪重负。政府和商家紧锣密鼓地筹措粮秣，仍有许多不幸的人被凛冽的北风夺去了性命。今天，旧大陆唯一的近代共和国必须回应五湖四海来到此地的流亡者们的期待。但在经历了一个又一个冬天后，他们最炽热的渴盼已经变成了让自己的家人能活到开春。"
