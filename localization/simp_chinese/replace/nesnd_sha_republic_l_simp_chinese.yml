 nesnd_sha_muster_cooldown_tt:0 "首次誓师，或上次誓师修正到期已过 #v 60#! 个月。"
 nesnd_sha_publish_constitution:0 "颁布共和宪草"
 nesnd_sha_publish_constitution_desc:0 "将宪草颁行各地，并送交华北、华南诸国，请其审议统一后的政制。"
 nesnd_sha_constitution_relations_tt:0 "与在华北或华南拥有领土的各国改善关系。共和制国家 #g +30#!，其余国家 #g +15#!。宪草只颁布一次。"
 nesnd_sha_vladivostok:0 "定都海参崴"
 nesnd_sha_vladivostok_desc:0 "召集议员，议决定都海参崴或留在现都。若迁都，费用为全国 GDP 的 #v 5%#!，至少 @money!#v 7,500#!。议定后不再重提。"
 nesnd_sha_qingdao:0 "还都青岛"
 nesnd_sha_qingdao_desc:0 "在山东重设中央政府。迁都所费为全国 GDP 的 #v 5%#!，至少 @money!#v 7,500#!。定都青岛后，海参崴之议就此结束。"
 nesnd_sha_transfer_north_tt:0 "勘察加的行政机构迁至新都。勘察加、鄂霍次克仍归登莱镇守，改为未整编州。登莱在两州的华北人一并迁往新都。"
 nesnd_sha_republic.1.t:0 "雪中的抉择"
 nesnd_sha_republic.1.d:0 "议员们争论登莱出兵的那一天，码头上只有一条老旧的福船还留着。在它曾窄小的肚子里停着今年白海彻底封冻前的倒数第二批主粮。\n\n主张整军的人指着地图上的伊尔库茨克说，那里也有流落他乡的辽东人，倘若有一天他们自己举起义旗，登莱连一营能去接应的兵马都凑不齐，将来凭什么渡海去取山东？\n\n商人们简单些，他们甚至没有亲自来，只是把今年冬天官府的吃穿用度写满了一本册子寄到了礼议会，又在尾页附上了一个统计数字——近五年来有多少被海浪吞噬的货物和商船。他们不是南方的软蛋、劣绅、骗子，他们也是土生土长的远北汉，他们的血仇也一样比山海还要深重。他们愿意带人在暴风雪肆虐的林莽里开矿，愿意渡过冰山白海去见东洲的朋友，更愿意为西归南渡的共和大业倾家荡产、死而后已。可是，他们绝不能，也没有力量同时为国家筹措两份大计的钱粮。"
 nesnd_sha_republic.1.a:0 "先整军，再图山东。"
 nesnd_sha_republic.1.b:0 "先通商，与同道结盟。"
 nesnd_sha_republic.2.t:0 "齐王的旧臣"
 nesnd_sha_republic.2.d:0 "死在绞索上的齐王早在百年前已经刻入石头。但他封的爵位却比他走得远。今日齐藩旧族的后人把请愿书递进议会，要求把祖上的封号一并写进议员名册。书记员的笔悬在纸上看着这些人，他们有的仍旧披貂挂金，但大多数世家在共和派多年的统治下已泯然众人。有位议员出身平民，当年甚至同某个请愿者一道在雪里排队领过鱼。却是头一次听说自己面前大放厥词的人原来是一位侯爷。"
 nesnd_sha_republic.2.a:0 "议席之上，一概以议员相称。"
 nesnd_sha_republic.2.b:0 "准其沿用家族旧衔。"
 nesnd_sha_republic.3.t:0 "远北的旧账"
 nesnd_sha_republic.3.d:0 "女真部族的代表把一册旧账带进了议会。牛皮封面上浸着一大片发黑的污迹。翻开来，每船卖了多少人，送往东洲哪处屯垦地，买主付了多少银子，连零头都算得明白。请愿人要议会把买卖双方的名字也公之于众。席间立刻有人要求收走账簿，喝令申诉人住口。一位船商出身的议员连账簿都没看，先把守门人叫了过来，要他供出是谁准许这些女真人进来的。"
 nesnd_sha_republic.3.a:0 "公开贩奴的旧账，准其陈述。"
 nesnd_sha_republic.3.b:0 "这是女真奴匪！把他们抓起来流放西岭！"
 nesnd_sha_republic.4.t:0 "雅库特人的席位"
 nesnd_sha_republic.4.d:0 "议会核定雅库特地方的税赋，许多议员头一次见到前来陈情的雅库特人。往年送到他们案头的只有皮张的数目，从来不必听交税的人开口。这一回，译员把请求说得很明白：往后凡是议到当地的税，雅库特人要推举自己的代表到会。席间有人听到“代表”便笑出了声。等译员念完歉收之年各户卖掉多少皮子才凑齐税款，笑声停了，仍有人执意要把来客赶出去。"
 nesnd_sha_republic.4.a:0 "支持他们推举自己的代表。"
 nesnd_sha_republic.4.b:0 "蛮子，在老爷面前站着你还是有些胆子！"
 nesnd_sha_republic.5.t:0 "付印之前"
 nesnd_sha_republic.5.d:0 "待印的报纸空着半版，稿子已经在审查官案头压了好些天。文章记下了军中一些不祥的议论。见过共和军兵败的人知道，一篇檄文传进营房要不了一夜，事后追查是谁散发的，却足够牵连半个报馆。军官们要扣下这一期，主笔天天到官署等回音。他在大陆上就吃过查禁报纸的苦头，这一回他要政府在禁令上署名。"
 nesnd_sha_republic.5.a:0 "发还原稿，准予刊印。"
 nesnd_sha_republic.5.b:0 "交审查官继续核办。"
 nesnd_sha_republic.6.t:0 "苦兀之问"
 nesnd_sha_republic.6.d:0 "$CNE$来使的文书写得十分客气。他只求议会答应，下回两国使臣坐在一起时，可以谈一谈苦兀。岛上的军官却记得，上一代人是怎样从贝加尔湖边一路退到海边来的。他们把那封文书又读了一遍，字字都认识，独有“谈一谈”三个字，读来比其余的沉重得多。"
 nesnd_sha_republic.6.a:0 "愿就此事交换文书。"
 nesnd_sha_republic.6.b:0 "若要夺取苦兀，他们得先踏过我们的尸首。"
 nesnd_sha_republic.7.t:0 "又一船流亡者"
 nesnd_sha_republic.7.d:0 "海船靠岸时，先递上来的是一叠被海水泡透的名册。北朝的共和军败了，从华北、西北逃出来的人拖家带口，循着前人的航路到了登莱。岸上有人在寻一个熟悉的姓，有人把家里多出来的棉衣举过头顶。隔着水叫了几声，两边才发现，乡音原来还听得懂。"
 nesnd_sha_republic.7.a:0 "准予居留，登记来者姓名。"
 nesnd_sha_republic.8.t:0 "海参崴议都"
 nesnd_sha_republic.8.d:0 "海参崴港如今装点一新，足以容纳我们的光荣的国人议会中央。从勘察加来的议员知道，这一票一旦投下去，旧日案卷要装船，两地的汉人也要举家南迁。但仍需要有人留在这里，留在北方，要有人看着洒满了血和泪的岛屿和冻土。或许直到世界末日。"
 nesnd_sha_republic.8.a:0 "迁都海参崴，远北留兵镇守以备不测。"
 nesnd_sha_republic.8.b:0 "为什么不在这里留下一个仪式性的首都呢？这是用法律替我们记忆。"
 nesnd_sha_republic.9.t:0 "登莱与华夏"
 nesnd_sha_republic.9.d_republic:0 "当年齐国的共和派兵败出海，到了勘察加，还要同先他们一步逃来的齐国旧臣再打一仗，才有了立足之地。后来牧仲棠称帝，山西共和国覆灭，大陆上又有败兵和逃亡者来投。那些人渡海的理由各不相同，却都知道远北还有一处地方肯让国人共和升起自己的旗帜。\n\n如今[ROOT.GetCountry.GetName]已经统一华夏。对一些祖籍山东的家庭来说，这一天终于等来了回乡的机会。在勘察加，还有世代屯田、从未见过山东的人家。他们的父祖在这里养活过渡海的败兵，也埋葬过没能熬过冬天的死者。共和国今日修史，第一卷理应从他们守住的这片土地写起。"
 nesnd_sha_republic.9.d:0 "登莱终以[ROOT.GetCountry.GetName]之名统一了华夏。消息传回远北，有些祖籍山东的老人听见“还乡”二字，欢喜得落下泪来。至于当初为什么渡海，又为什么在勘察加举起旗帜，往后写这部国史的人能不能把那些风霜雨雪原原本本地传承下去？"
 nesnd_sha_republic.9.a:0 "将建国始末收入国史。"
 nesnd_sha_exiles_arrived_tt:0 "已有 #v [SCOPE.GetValue('nesnd_sha_exile_count')|0]#! 名华北人、西北人抵达首都。"
 nesnd_sha_presidential_mandate:0 "周公的选举声望"
 nesnd_sha_republic.1.f:0 "“我昨晚跟儿子说，等海路通了，爹带你回山东老家。他高兴得一宿没睡。今早我出门，他又追出来问我：‘爹，山东刮不刮雪暴？要不要今年多买点鲸脂？’”——登莱议员梁秉舟"
 nesnd_sha_republic.2.f:0 "“书记先生，齐王给我家封爵的时候，你们这议会还没有一张桌子。”“诚然，阁下。可今天替您登记的，偏偏就是这张桌子。”"
 nesnd_sha_republic.3.f:0 "“卖鱼的账上连少掉一尾都要记，工厂里少打一个钉子都要揍，怎么翻到卖人的那一页我的家人就只剩下一个数了？”——席间一位女真请愿人"
 nesnd_sha_republic.4.f:0 "“去年是我挨家去收的皮子。请把税册翻到末页，那里有我的名字。诸位算今年的税时，我要坐在这里，听听这个数是怎么算出来的。”——一位雅库特代表"
 nesnd_sha_republic.5.f:0 "“要扣稿，就请您签字。日后追究是谁压下了军情，报馆也好拿出一张有落款的公文。”——报馆主笔致审查官"
 nesnd_sha_republic.6.f:0 "“贵使若要商议两国船只进出苦兀的事，我可以接下国书。若要商议苦兀归谁，请把这几个字明写在国书上，署上贵国的名。”——北方谈判会，共和国代表"
 nesnd_sha_republic.7.f:0 "“北朝共和军败兵及眷属自华北、西北渡海来投。名册经海水浸湿，姓名多有不清，请岸上亲友前来认领。”\n——港口登记处的告示"
 nesnd_sha_republic.8.f:0 "“若议会决定迁都，启航那天，我带勘察加驻军在码头列队，给诸位送行。船过了港口，往北边看，还能望见岸上的军旗。”——远北驻军的一名军官"
 nesnd_sha_republic.9.f:0 "“当初离开故国，老人们怕孩子忘了，天天教他们认故乡的溪流和土岗。今日国史第一页，倒该让山东的孩子学着念一念勘察加了。”"
