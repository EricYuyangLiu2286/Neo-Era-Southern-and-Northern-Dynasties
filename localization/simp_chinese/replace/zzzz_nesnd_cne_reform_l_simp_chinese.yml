l_simp_chinese:
 ce_cne_land_reform_goal:0 "落实新的地权制度，改善人口就业、教育与生活，并维持十二个月的改革成果。"
 nesnd_reform_completion_tt:0 "改革进度达到#v 100#!，连续#v 12#!个月达到地权、就业、教育、生活与行政条件，失序低于#v 50#!。"
 nesnd_reform_failure_tt:0 "失序达到#v 90#!，连续#v 12#!个月发生严重民生危机，全国动乱超过#v 40%#!，合法性低于#v 25#!，且正在战争或破产。"
 nesnd_land_completion_bar:0 "地权改革"
 nesnd_land_completion_bar_desc:0 "改革进度：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_land_disorder_bar:0 "地方失序"
 nesnd_land_disorder_bar_desc:0 "地方失序：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_reform_status_warmup:0 "正在汇集各省民生统计。前三个月收集数据，随后开始结算。\n$nesnd_land_rules_link$"
 nesnd_reform_status_regions:0 "#n 地方民生持续困顿#!：#v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_neglected_regions').GetValue|0]#!个重要地区已连续六个月严重失业或欠食，巩固月份中断。\n$nesnd_land_rules_link$"
 nesnd_reform_status_law:0 "#bold 产权改革尚待立法#!：采用自耕农、商业化农业或集体化农业制度后，开始结算制度落实的成果。\n$nesnd_land_rules_link$"
 nesnd_land_status_admin:0 "#n 行政不足#!：连续巩固月份中断，每月增加#n 0.5#!失序。\n$nesnd_land_rules_link$"
 nesnd_land_status_war:0 "#n 战时改革#!：连续巩固月份中断，每月增加#n 0.5#!失序。\n$nesnd_land_rules_link$"
 nesnd_reform_status_healthy:0 "#p 改革成果正在巩固#!：已连续#v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_good_months').GetValue|0]#!个月达到条件。\n$nesnd_land_rules_link$"
 nesnd_land_status_normal:0 "改革持续#v [ROOT.GetCountry.MakeScope.Var('nesnd_land_months').GetValue|0]#!个月；连续巩固#v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_good_months').GetValue|0] / 12#!个月。\n$nesnd_land_rules_link$"
 nesnd_land_rules_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 民生统计与改革条件#!#!"
 nesnd_land_rules:0 "#bold 本月统计#!\n无业劳动力占比：#v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!\n劳动力家庭欠食份额：#v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!\n劳动力家庭[concept_sol]：#v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!\n人口加权[concept_market_access]：#v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!\n\n#bold 巩固条件#!\n自耕农、商业化农业或集体化农业制度；学校机构至少#v 2#!级，识字率至少#v 48%#!；无业劳动力占比至多#v 6%#!，欠食份额至多#v 8%#!，生活水平至少#v 11#!，市场接入至少#v 85%#!；行政非负、和平且未破产。社保至少#v 2#!级且生活水平达到#v 12#!时，失业上限为#v 12%#!。\n\n达标月份增加#p 2#!改革进度，减少#p 1#!失序。已落实地权制度、失业至多#v 10%#!、欠食至多#v 12%#!、生活水平至少#v 10.5#!、市场接入至少#v 80%#!、学校至少#v 1#!级且未破产时，可每月增加#p 0.5#!进度。完成需进度#v 100#!、连续#v 12#!个达标月及失序低于#v 50#!；四十八个月内完成、连续达标至少#v 24#!个月且失序低于#v 30#!，另获快速改革奖励。\n\n统计采本国拥有的改革地区，包含盛京、外东北与阿穆尔：失业按无业劳动力除以总劳动力；市场接入按州人口加权；生活水平与欠食按各人口群体劳动力加权，每月更新。自给农业从业者属于有业人口。全国与地方失业采用同一口径。\n\n#bold 地方民生底线#!\n人口至少#v 50万#!的州，若连续六个月无业劳动力占比超过#v 20%#!、欠食劳动力超过#v 25%#!或严重饥饿劳动力超过#v 10%#!，将中断巩固月份并增加失序。可用有资质的岗位、粮食与日用品供给、救济或产业转型改善当地状况；须实际降到上述严重困境线以内。"
 nesnd_land_survey:0 "拨款官营工坊"
 nesnd_land_survey_desc:0 "土地整理所得用于新工坊与实业学堂。国家应当扶助人口转业，使各省的工匠和农户参与产业的增长。"
 nesnd_land_survey_outcome_tt:0 "支出#v 半周总收入#!，至少#v £25,000#!。当前中国地区中失业率最高的一州获得十二个月的建设速度、职业资质增长与教育机会增益；十二个月后可再次拨款。实际金额见下方国库效果。"
 nesnd_land_review:0 "复核地权争讼"
 nesnd_land_review_desc:0 "清理军籍与民籍之间的争讼，审查地方官员执行新法的成效。已经取得田产的农户，应当能够依法保有他们的生计。"
 nesnd_land_review_outcome_tt:0 "支出#v 十分之一周总收入#!，至少#v £5,000#!。失序减少#p 5#!，执行十二个月的申诉复核；十二个月后可再次办理。"
 nesnd_land_military:0 "增拨转业救济"
 nesnd_land_military_desc:0 "离开田庄的农户需要寻找新的生业。已有救济机关将向生活困难的家庭增拨补助，使失去收入的人仍能维持日用。"
 nesnd_land_military_outcome_tt:0 "支出#v 十分之一周总收入#!，至少#v £5,000#!。在有欠食人口的中国地区中，失业率最高的一州获得十二个月的额外救济，按正常工资的#v 10%#!计入实际福利支出；需要已有社会保障机构，十二个月后可再次办理。"
 nesnd_reform_public_workshops:0 "官营工坊与实业学堂"
 nesnd_reform_transitional_relief:0 "转业救济"
 nesnd_crisis.33.d:0 "[ROOT.GetCountry.GetName]的改革使许多农户离开了旧庄田。山西各地的工坊与矿井招工不及，失去生计的农人和退伍军人聚集到县城，要求官府兑现当年平均地权的承诺。\n\n共和派借乡校与旧日军中关系联络各县，推举代表审查土地分配，接管救济。几处营伍也加入了他们的集会。地方官已无法自行收束局面，请求朝廷裁定各县提出的赔补与撤官之议。"
 nesnd_crisis.30.c:0 "新法既定，诸营皆当奉行。"
 flavorCNE.6.d:0 "[SCOPE.sState('cne_land_reform_mess_imprisonment_state').GetName]的清丈官员拘捕了一批代写田契诉状的乡民，将他们以串通隐产的罪名交由驻军看押。军官随即扩大搜捕，地方士绅、乡校教员与整理旧契的书吏都被带入营中。\n\n新法赋予官员清理田产的权力，也准许农户为自己的产业提出申诉。这些囚犯的家属带着田契前往省城，要求官府公开审理。负责清丈的官员则请朝廷将案件交回军营处置。"
 flavorCNE.7.d:0 "[SCOPE.sState('cne_land_reform_industrialists_support_state').GetName]的厂主与商人联名呈请，愿意为土地改革垫付一笔款项。工坊正在扩建，商路上的货车日渐增多；他们希望新法能够准许农户自由迁居，将更多劳动力带入城镇。\n\n商人的代表还请求参加地方实业事务的商议。土地、道路与雇工契约将成为今后官商共同处理的要务，这批新兴的产业家也希望在帝国政府中取得与其财富相称的位置。"
 flavorCNE.8.d:0 "[SCOPE.sState('cne_land_reform_peasants_in_city_state').GetName]的街巷里住进了许多来自乡间的新客。农户卖去田产，带着家人寻找工钱；招工的牙行将他们送往厂房、码头和工地，又从每一份工资中扣取引荐与食宿的费用。\n\n一批工人向官府告发牙行私扣契约、追索旧债。厂主担心查办牙行将妨碍招工，要求地方官承认现行的用工办法。雇工凭什么离开旧主人，又能以什么条件获得新的工作，已经成为新法必须处置的事务。"
 cne_landreform_completion_tracker_add_2:0 "#bold 地权革命#![concept_journal_entry]进度#p 增加2#!"
 cne_landreform_completion_tracker_add_1:0 "#bold 地权革命#![concept_journal_entry]进度#p 增加1#!"
