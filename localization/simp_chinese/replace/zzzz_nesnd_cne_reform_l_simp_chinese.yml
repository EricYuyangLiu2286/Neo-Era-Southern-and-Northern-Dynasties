 nesnd_land_disorder_bar:0 "地方失序"
 nesnd_land_disorder_bar_desc:0 "地方失序：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_reform_status_warmup:0 "正在汇集各省民生统计。前三个月收集数据，随后开始结算。\n$nesnd_land_rules_link$"
 nesnd_reform_status_regions:0 "#n 地方民生持续困顿#!：#v [ROOT.GetCountry.MakeScope.Var('nesnd_reform_neglected_regions').GetValue|0]#!个重要地区已连续六个月严重失业或欠食，巩固月份中断。\n$nesnd_land_rules_link$"
 nesnd_reform_status_law:0 "#bold 产权改革尚待立法#!：采用自耕农、商业化农业或集体化农业制度后，开始结算制度落实的成果。\n$nesnd_land_rules_link$"
 nesnd_land_status_admin:0 "#n 行政不足#!：连续巩固月份中断，每月增加#n 0.5#!失序。\n$nesnd_land_rules_link$"
