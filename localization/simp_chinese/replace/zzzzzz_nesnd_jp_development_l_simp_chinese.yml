l_simp_chinese:
 nesnd_jp_mining:0 "山中的铁矿"
 nesnd_jp_mining_reason:0 "征税和征兵曾是武士的本分，开矿、办厂却要仰仗商人。北方的矿藏给江户带来了新的财源，也带来了旧军府不熟悉的合作者。那些不佩刀的人正在积累财富，并开始要求政府保护他们的生意。"
 nesnd_jp_arsenals:0 "兵工与船坞"
 nesnd_jp_arsenals_reason:0 "兵工厂和船坞把军费带进了城镇。承包商盼望长久的订单，军方则担心自己的装备受制于商人的价钱。工场越是兴旺，这场讨价还价就越难留在营门之外。"
 nesnd_jp_metal_cities:0 "城下町的变迁"
 nesnd_jp_metal_cities_reason:0 "城下町原本围着城郭与武士宅邸生长，如今来此谋生的人却越来越多。工人、学徒和小店主住进新街区，他们的孩子也要在这里读书。旧日替领主办事的城镇，正在长成有自己诉求的社会。"
 nesnd_jp_cash_crops:0 "棉田、桑园与茶山"
 nesnd_jp_cash_crops_reason:0 "海港把远方的价钱带到了乡间。棉田、桑园和茶山有了新的买主，土地所有者与商人都想从中分得更多。农民日复一日的劳作，也开始受到这些遥远市场的支配。"
 nesnd_jp_textiles:0 "机杼声中"
 nesnd_jp_textiles_reason:0 "收购生丝与棉花的商人开始把织工集中起来。熟悉的手艺进入了更大的工场，雇工按时领钱，也须服从工头的规矩。对于离开田地的人，这是新的生计；对于商人，则是把乡村生产握得更紧的办法。"
 nesnd_jp_consumer_goods:0 "百姓的买卖"
 nesnd_jp_consumer_goods_reason:0 "食品、家具和日用器皿的生意，正在从少数富户扩展到更多家庭。经营这些工场的人开始关心普通人的收入：顾客若只能勉强糊口，工场便难以扩大销路，产品的价格与收益也会受到压制。"
 nesnd_jp_living_standards:0 "富足的生活"
 nesnd_jp_living_standards_reason:0 "已经进入工场的人开始盘算房租、米价和孩子读书的钱。他们为城市带来了劳力与税收，也要求从繁荣中得到自己的份额。政府许诺的新生活，终究要落到这些日常开支上。"
 nesnd_jp_food_supply:0 "城市的生计"
 nesnd_jp_food_supply_reason:0 "田间的收成、渔人的船和往来的粮商，维持着城里的生活。粮价一涨，街市上的怨声便传到官署。政府须让运粮的人愿意进城，也让城里的人买得起饭。"
 nesnd_jp_food_cities:0 "商都的成长"
 nesnd_jp_food_cities_reason:0 "粮商带来了买卖，工匠和学徒也跟着留下。新街区需要学校，官府与书商需要纸张；许多过去由乡里宗族包办的事情，开始交到城镇的机构手中。"
 nesnd_jp_food_processing:0 "粮食入市"
 nesnd_jp_food_processing_reason:0 "城镇需要能够储存和远运的食品，粮商与渔商也在寻找收获季节以外的买主。罐藏技术让他们有机会把收购、加工和运输连成一门生意；办起食品工场，还能让雇工不必随收获季节结束而失去工作。"
 nesnd_jp_living_year:0 "已连续 #v 12#! 个月达到生活水平、学校和城市目标"
 nesnd_jp_metal_foundries:0 "金属工业扩张"
 nesnd_jp_arsenal_towns:0 "兵工与船业繁荣"
 nesnd_jp_industrial_cities:0 "工业城市兴盛"
 nesnd_jp_cash_crop_trade:0 "经济作物兴盛"
 nesnd_jp_textile_trade:0 "纺织业兴盛"
 nesnd_jp_consumer_trade:0 "日用工业兴盛"
 nesnd_jp_towns_prosper:0 "富足的城镇"
 nesnd_jp_rural_markets:0 "农渔业兴旺"
 nesnd_jp_growing_cities:0 "城市扩展"
 nesnd_jp_food_exports:0 "食品加工业兴盛"
 nesnd_jp_cohesion:0 "国民团结"
 nesnd_jp_cohesion_reason:0 "幕府治下的诸藩、乡间的宗族和城下町的商人，曾各自维持着一方秩序。学校与官府把远近的地方联结起来，繁荣的工商业又使更多人的生活休戚相关。百姓能否过得安定，国家能否在战争中保护他们，都在改变人们对共同前途的信心。"
 nesnd_jp_cohesion_bar_name:0 "国民团结"
 nesnd_jp_cohesion_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]#!/100"
 nesnd_jp_cohesion_order_desc:0 "政府威信"
 nesnd_jp_cohesion_living_desc:0 "民生与财政"
 nesnd_jp_cohesion_learning_desc:0 "学校与行政"
 nesnd_jp_cohesion_conflict_desc:0 "内忧与外患"
 nesnd_jp_cohesion_victory_desc:0 "战争胜负"
 nesnd_jp_cohesion_doubt:0 "民众对政府失去信任，地方分歧正在扩大。"
 nesnd_jp_cohesion_calm:0 "各地仍能维持共同的秩序。"
 nesnd_jp_cohesion_confident:0 "国民对共同前途的信心正在促进文化融合。\n每月有 #v 30%#! 的概率，在一个合格的本国[concept_state]中，使至多相当于该州总人口 #v 10%#! 的人口同化为[GetCulture('japanese').GetName]文化；宗教不变。"
 nesnd_jp_cohesion_confident_jiangnan:0 "国民对共同前途的信心正在促进文化融合。\n每月有 #v 30%#! 的概率，在一个合格的本国[concept_state]中，使至多相当于该州总人口 #v 10%#! 的人口同化为[GetCulture('ce_wuu').GetName]文化；宗教不变。"
 nesnd_jp_divided_councils:0 "人心离散"
 nesnd_jp_politics:0 "国政之争"
 nesnd_jp_politics_reason:0 "丰臣氏平定日本以后，朝廷的名分、诸藩的兵马和大阪的商业共同支撑着幕府的统治。新的财源与知识正在改变旧有的权力关系，商人、军官和读书人都希望参与国家的决断。围绕官员任用、军队和法令的争论，已经关系到政府将由谁来掌握。"
 nesnd_jp_court_reform:0 "君主与新政"
 nesnd_jp_court_reform_reason:0 "旧臣们希望新政仍以君主的名义推行。商人和新学出身的官员则要求法令保障，免受临时征敛与地方势力的摆布。王朝能够把他们召集到一起，具体的权利却还要重新划分。"
 nesnd_jp_military_reform:0 "军府的新秩序"
 nesnd_jp_military_reform_reason:0 "军官们把军队视为国家最可靠的支柱。他们要求将征募、训练与军需交给统一的指挥，使地方的兵力能够供国家调度。兵工厂和工具厂将为这支军队提供装备，集中的政令则让军府有机会把自己的主张推行到各地。"
 nesnd_jp_representative_reform:0 "国人议政"
 nesnd_jp_representative_reform_reason:0 "读书人讨论国政，商人关心税赋，地方居民也希望有人替自己说话。代议派要把这些议论带进议会，以选举决定代表，以公开辩论约束执政者。教育的普及将使更多国人能够读懂法令、参与公共事务。"
 nesnd_jp_nation:0 "自主之国"
 nesnd_jp_nation_reason:0 "争取独立时许下的承诺，正在成为政府必须回答的问题。军费由谁承担，关税由谁决定，地方权力又该划到哪里？出资的人和出力的人，都希望在新的国家里得到自己的位置。"
 nesnd_jp_new_army:0 "整顿国军"
 nesnd_jp_new_army_reason:0 "旧日军队依靠世袭武士与地方关系维持，征募和训练也随各家而异。国家需要有组织的兵员、受过训练的军官和能够听从统一调度的部队。无论以常备军还是国民军承担防务，都应使军事服务于共同的国事。"
 nesnd_jp_open_diplomacy:0 "与诸国往来"
 nesnd_jp_open_diplomacy_reason:0 "过去的朝贡和海禁把外交、通商交织在宗主的安排之中。我们需要以本国的名义派遣商船、开放港口，同其他国家商谈彼此的利益。持续的自主将使这些往来有一个可以信赖的政府作为依托。"
 nesnd_jp_open_ports:0 "重开海门"
 nesnd_jp_open_ports_reason:0 "日本的海外买卖长久受制于少数口岸和严密的禁令。商人希望取得远方的原料，也希望把本国出产卖到更广阔的市场。政府须重新安排开港，并处理依靠旧日禁令维持权势者的反对。"
 nesnd_jp_islands:0 "九州与四国"
 nesnd_jp_islands_reason:0 "本州已经归于一统，九州与四国的归属仍未完全解决。两岛的港口和海路关系着日本南部的贸易与防务。政府可以设法收回尚在他人掌握中的土地，也可以接受现有边界，放下这场领土争端。"
 nesnd_jp_choose_court:0 "以君主统合新政"
 nesnd_jp_choose_court_desc:0 "王朝的号召力可以把旧臣与改制者召到一处。保留君主，任用新官员，让议政与实业为国家带来新的力量。\n\n选定后 #v 12#! 个月内不能改换方针。改换方针将清空已有改革进度。"
 nesnd_jp_choose_military:0 "支持军府整顿"
 nesnd_jp_choose_military_desc:0 "军队需要统一的指挥，国家也需要能够贯彻到底的政令。支持军官们整顿兵制与军需，把地方的人力和财力用于共同的防务。\n\n选定后 #v 12#! 个月内不能改换方针。改换方针将清空已有改革进度。"
 nesnd_jp_choose_representative:0 "扩张代议政治"
 nesnd_jp_choose_representative_desc:0 "国事关乎所有纳税、服役和谋生的人。让更多代表参与议政，使官员必须面对公开的讨论，也使国民能够以选票影响政府。\n\n选定后 #v 12#! 个月内不能改换方针。改换方针将清空已有改革进度。"
 nesnd_jp_advance_reform:0 "资助新政"
 nesnd_jp_advance_reform_desc:0 "拨款支持主张改制的人士，让他们的议论更快成为国家的法令。"
 nesnd_jp_abandon_reform:0 "搁置新政"
 nesnd_jp_abandon_reform_desc:0 "撤回当前改革方针，结束政府为新政进行的动员。改革进度归零，#v 24#! 个月内不能重新提出改革；已有法律和建设保留。"
 nesnd_jp_mercantile_ports:0 "重商开港"
 nesnd_jp_mercantile_ports_desc:0 "准许商人经营海外买卖，以关税维护国家的收入和本国商业的地位。"
 nesnd_jp_protected_ports:0 "保护主义开港"
 nesnd_jp_protected_ports_desc:0 "开放海路，让工场取得所需的原料，再以关税扶持本国生产者在新市场中的地位。"
 nesnd_jp_islands_settlement:0 "接受现有边界"
 nesnd_jp_islands_settlement_desc:0 "放弃对九州与四国的领土要求，承认目前的疆界。"
 nesnd_jp_court_policy:0 "以君主名义推行宪政改革。"
 nesnd_jp_military_policy:0 "集中政令，整顿军制与军需。"
 nesnd_jp_representative_policy:0 "扩大代议，保障公开议政。"
 nesnd_jp_unsettled_policy:0 "政府尚未决定改革的方向。"
 nesnd_jp_nation_subject:0 "国家重归藩属，对外事务受宗主约束。"
 nesnd_jp_nation_independent:0 "国家可以自主处理内外事务。"
 nesnd_jp_reform_settled:0 "改革进度已满，所选新政已持续落实 #v 12#! 个月"
 nesnd_jp_nation_complete:0 "产业、军制与外交建设均已完成，且国家已连续保持独立 #v 12#! 个月"
 nesnd_jp_political_bar_name:0 "新政推行"
 nesnd_jp_nation_bar_name:0 "国家建设"
 nesnd_jp_political_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]#!/100"
 nesnd_jp_nation_bar_desc:0 "#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]#!/3"
 nesnd_jp_political_administration_desc:0 "行政与新学"
 nesnd_jp_political_laws_desc:0 "制度确立"
 nesnd_jp_political_opposition_desc:0 "战争与激进情绪"
 nesnd_jp_court_debate:0 "君主制改革"
 nesnd_jp_court_settlement:0 "君主立宪"
 nesnd_jp_military_debate:0 "军方推动改制"
 nesnd_jp_military_settlement:0 "军制振兴"
 nesnd_jp_representative_debate:0 "代议改革运动"
 nesnd_jp_representative_settlement:0 "代议政治确立"
 nesnd_jp_reform_effort:0 "改革派的奔走"
 nesnd_jp_independent_state:0 "独立国家的声望"
 nesnd_jp_home_waters:0 "九州与四国归统"
 nesnd_jp_opening_dispute:0 "开港之议"
 nesnd_jp_development.1.t:0 "独立的根基"
 nesnd_jp_development.1.d:0 "各国使节如今直接同我们的政府交涉。过去借宗主之手维持的军政与海上往来，已经有了本国自己的制度。\n\n当年支持独立的商人和地方人士并未因此退出国事。他们带着新的请愿来到政府面前，要求它兑现曾经许下的承诺。"
 nesnd_jp_development.1.a:0 "国事当由国人自决。"
 nesnd_jp_development.2.t:0 "新政立定"
 nesnd_jp_development.2.d:0 "新的任官办法已经推行，国家的法令也改变了权力在各阶层间的分配。旧日凭借门第把持地方的人，如今必须面对由政府确定的职位和权限；参与改制的官员、军人和商人，则在新的秩序中寻找自己的位置。这场改革已经进入日常统治，成为处理国事的准则。"
 nesnd_jp_development.2.a:0 "使新法行之久远。"
 nesnd_japan_reunification_reason:0 "海峡两岸的盟约曾替丰臣打开平定诸侯的道路，也让唐土朝廷得以介入日本的继承、封地和征战。城下町的税赋汇往各家府库，军队与商人各认其主。[ROOT.GetCountry.GetName]要重建统一的政府，就须使本州归于一统，并取得自主决定内外政务的地位。"
 nesnd_japan_reunification_status:0 "统一本州，确立自主的政府。"
 nesnd_japan_reunification_goal:0 "独立并完整拥有本州七地区：关东、京都、关西、中国、东海、东北与北陆信越。"
 nesnd_jp_foreign:0 "东洋交涉"
 nesnd_jp_foreign_reason:0 "大陆朝廷的援军曾帮助丰臣平定日本，朝贡与海上贸易也由此同列岛的政治纠缠在一起。我们所争取的自主权，关系着宗主的收入、海防和对日本的控制；即使旧约解除，这些利益也不会随之消失。"
 nesnd_jp_korea:0 "海峡彼岸"
 nesnd_jp_korea_reason:0 "朝鲜南部的煤矿和港口支撑着跨海的商业。当地商人需要这些航路，地方士人却不愿把民政全交给海峡对岸的官员。乡里最常争论的，往往是下一笔税款归谁处置。"
 nesnd_jp_envoy_away:0 "使者正在等待对方的答复。"
 nesnd_jp_envoy_rest:0 "使团尚未整顿完毕；两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_subject_treaties:0 "本国仍受宗主约束，可以就自主权与建设寻求交涉。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_independent_treaties:0 "本国可以自行寻求外援与合邦。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_korea_across_the_strait:0 "朝鲜的领土争议仍待交涉。"
 nesnd_jp_korea_governors_status:0 "朝鲜属地的税务与民政由总督集中处理。"
 nesnd_jp_korea_councils_status:0 "当地议事会参与民政与教育。"
 nesnd_jp_korea_undecided:0 "政府尚未确定朝鲜属地的治理办法。"
 nesnd_jp_seek_autonomy:0 "争取更多自主"
 nesnd_jp_seek_autonomy_desc:0 "请求宗主放宽对本国的约束，将现有宗属关系提升一个自治等级。\n\n若获同意，双方将有 #v 5#! 年停战期。"
 nesnd_jp_seek_independence:0 "商议独立"
 nesnd_jp_seek_independence_desc:0 "要求宗主解除藩属关系，让本国自行处理内外事务。\n\n若获同意，双方将有 #v 5#! 年停战期。"
 nesnd_jp_seek_reform_permission:0 "请求改制许可"
 nesnd_jp_seek_reform_permission_desc:0 "请宗主认可本国的制度改革，让我们能够自行筹划官员任用、军政与议政的安排。"
 nesnd_jp_seek_union_permission:0 "请求合邦许可"
 nesnd_jp_seek_union_permission_desc:0 "请宗主允许我们同其他日本属国商议归并，由愿意合邦的双方共同结束分立。"
 nesnd_jp_seek_overlord_capital:0 "向宗主请求建设资金"
 nesnd_jp_seek_overlord_capital_desc:0 "请求宗主拨款兴办工场、培养熟练工匠，使本国的生产能够成长。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_seek_capital_cne:0 "向北朝寻求资金"
 nesnd_jp_seek_capital_cne_desc:0 "以工商业合作为纽带，向北朝争取建设资金，吸引其参与日本的发展。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_seek_capital_hus:0 "向东洲寻求资金"
 nesnd_jp_seek_capital_hus_desc:0 "以通商和工业发展为由，向东洲争取一笔用于工场建设的资金。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_seek_capital_usm:0 "向南朝寻求资金"
 nesnd_jp_seek_capital_usm_desc:0 "南朝与日本的商业联系由来已久。我们可以循着这些关系寻求资助，为本国工场筹集资本、培养工匠。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_independence_play:0 "独立最后通牒"
 nesnd_jp_independence_play_desc:0 "向宗主提出独立的最后通牒，发起独立[concept_diplomatic_play]，准备以战争迫使其接受。"
 nesnd_jp_union_jap:0 "请$JAP$归统"
 nesnd_jp_union_jap_desc:0 "向$JAP$提出合邦。对方若同意，其国家将并入本国，由我们的政府统辖。"
 nesnd_jp_union_jtk:0 "请$JTK$归统"
 nesnd_jp_union_jtk_desc:0 "向$JTK$提出合邦。对方若同意，其国家将并入本国，由我们的政府统辖。"
 nesnd_jp_union_jim:0 "请$JIM$归统"
 nesnd_jp_union_jim_desc:0 "向$JIM$提出合邦。对方若同意，其国家将并入本国，由我们的政府统辖。"
 nesnd_jp_korean_governor:0 "委派总督"
 nesnd_jp_korean_governor_desc:0 "任用总督，将朝鲜属地的税务与民政集中起来，使政府能够更直接地掌握当地的收入与事务。\n\n此后 #v 24#! 个月内不能改换朝鲜治理方针。"
 nesnd_jp_korean_councils:0 "设立地方议事会"
 nesnd_jp_korean_councils_desc:0 "让当地议事会参与民政、兴办学校，以地方人士的合作缓和居民对统治的抵触。\n\n此后 #v 24#! 个月内不能改换朝鲜治理方针。"
 nesnd_jp_korean_envoy:0 "交涉朝鲜归属"
 nesnd_jp_korean_envoy_desc:0 "向朝鲜或其宗主提出和解。对方若同意，我们将把本国在釜山与两湖的领土移交朝鲜，并放弃对这两个地区的宣称。\n\n两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_foreign_workshops:0 "海外建设资助"
 nesnd_jp_korea_governor:0 "总督辖治"
 nesnd_jp_korea_councils:0 "地方议事会"
 nesnd_jp_korea_administration:0 "朝鲜行政开支"
 nesnd_jp_foreign.1.t:0 "来自[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者"
 nesnd_jp_foreign.1.d1:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]希望扩大自行处理国事的权力，要求我们放宽现有宗属关系的约束。使者认为，更大的自主可以让地方政府及时应对国内事务，同时保留两国之间的联系。"
 nesnd_jp_foreign.1.d2:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者要求结束藩属关系。他们希望从此自行决定外交、军队与通商事务，并以独立国家的身份同我们往来。这份答复将决定我们是否愿意交出原有的宗主权。"
 nesnd_jp_foreign.1.d3:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]希望改造国内的官员任用、军政与议政制度。使者前来寻求我们的认可，以便政府能够召集支持者、推行新政。原有的宗属关系仍将保留。"
 nesnd_jp_foreign.1.d4:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]正为工场建设寻求一笔资金。使者希望我们拨款，帮助他们扩建生产、培养熟练工匠，以日益兴盛的工商业加深双方的往来。"
 nesnd_jp_foreign.1.d5:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]提出就朝鲜南部的领土问题达成和解。他们愿意放弃对釜山与两湖的宣称，并将本国仍持有的当地领土移交朝鲜。使者要求我们接受这一安排，结束这项长期争端。"
 nesnd_jp_foreign.1.d6:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]请求我们承认其政府主持日本的统一，并将本国领土交由对方统治。接受这份盟约，便是结束本国的单独存在。"
 nesnd_jp_foreign.1.d7:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]希望得到我们的许可，同其他日本属国商议归并。他们打算由本国政府主持统一，并承诺只有受邀国家同意才结束其单独统治。我们需要决定是否允许这项合邦计划在现有宗属体系内进行。"
 nesnd_jp_foreign.1.d:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者已经抵达，带来了有关两国关系的提议。他们正在等待我们的答复。"
 nesnd_jp_foreign.1.a:0 "同意所议。"
 nesnd_jp_foreign.1.b:0 "我们不接受这些条件。"
 nesnd_jp_foreign.2.t:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的答复"
 nesnd_jp_foreign.3.t:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的答复"
 nesnd_jp_foreign.2.d:0 "使者带回了[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的答复。对方已经接受我们的提议，双方将依照商定的安排处理此事。"
 nesnd_jp_foreign.2.a:0 "就按商定的办法办理。"
 nesnd_jp_foreign.3.d:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]拒绝了使者带去的条件。我们未能说服对方让步，这次交涉也使两国的关系更为紧张。"
 nesnd_jp_foreign.3.a:0 "只得另作打算。"
 gov_nesnd_japan_lin_regency:0 "摄政政府"
 gov_nesnd_japan_lin_regency_desc:0 "保留天皇名位，由摄政王代行统治、主持政务的君主制政权。"
 RULER_TITLE_NESND_JAPAN_REGENT:0 "摄政王"
 nesnd_jp_toyotomi_court_name:0 "秀隆"
 nesnd_jp_development.2.d_court:0 "朝廷以新法确认了议政与任官的办法。旧臣仍在君主身边，地方官署却开始接纳另一批熟悉实务的人。\n\n拥护王朝的改制派认为，这些让步足以使君主制延续下去。至于取得议政权的人们会不会满足，朝廷眼下还没有答案。"
 nesnd_jp_development.2.d_military:0 "主张集权的军官终于让自己的办法成为国策。征募、训练和军需被纳入统一调度，地方官员也须执行中央的命令。兵工厂与工具厂为扩充后的军队提供装备，军府由此取得了在各地贯彻政令的力量。"
 nesnd_jp_development.2.d_representative:0 "取得选举权的人开始用选票选择代表，报纸也能公开议论政府的行为。官员须面对新的任用办法，而议场内外的争论已经越出旧日少数家族的范围。\n\n新学堂还在把更多人带进这个世界。下一代读书人将怎样运用这些权利，要由他们自己决定。"
 nesnd_jp_sovereign_year:0 "已连续保持独立 #v 12#! 个月"
