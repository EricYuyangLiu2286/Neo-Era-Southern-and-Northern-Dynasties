 nesnd_india_order_tax_desc:0 "决定[Concept('concept_subject', '$concept_subjects|q$')]向我国上缴多少收入。"
 nesnd_india_order_army_desc:0 "决定[Concept('concept_subject', '$concept_subjects|q$')]是否随我国参加[Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')]和战争。"
 nesnd_india_order_school_desc:0 "决定学校和官职的资格由谁来定。"
 nesnd_india_order_tax_central_tt:0 "我国本国直辖的州[concept_tax_capacity] +5%。我国与每个[concept_subject]订立$raise_payments$：对方上缴的收入增加，每周的[concept_liberty_desire]上升，每份条约占用我国 25 点[concept_influence]。[concept_protectorate]、陷入[concept_default]或[concept_liberty_desire]达到 75 的附属国签不了，什么都不加。"
 nesnd_india_order_tax_local_tt:0 "我国与每个[concept_subject]订立$decrease_payments$：对方上缴的收入减少，每周的[concept_liberty_desire]下降。[concept_protectorate]签不了，什么都不加。我国本国不加修正。"
 nesnd_india_order_army_central_tt:0 "我国每有一个[concept_subject]，[concept_authority] +10。每个[concept_subject]每周的[concept_liberty_desire]上升。附属国的类型不变。"
 nesnd_india_order_army_local_tt:0 "我国与每个[concept_subject]订立$exempt_from_service$：对方不必随我国参加[Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')]和战争，每周的[concept_liberty_desire]下降。[concept_tributary]和[concept_protectorate]本来就不随宗主国参战，签不了，什么都不加。我国本国不加修正。"
 nesnd_india_order_school_central_tt:0 "我国本国直辖的州[concept_pop_qualifications] +5%。我国与每个[concept_subject]订立$da_knowledge_sharing$：我国的[concept_technology_spread]变慢，对方的变快，对方每周的[concept_liberty_desire]下降，每份条约占用我国 50 点[concept_influence]。我国已研究的科技不多于对方时签不了，什么都不加。"
