 ce_usm_civilwar_journal: "南明内战"
 ce_usm_civilwar_journal_reason: "杭州郑家在闽、吴、越、宁、苗五藩旧省德望遮天，麾下南府雄兵百万。又兼主持变法、抵抗北朝之大功。自然可以让朱明昏主行禅代之事，为一统华夏于一世界帝国的更加宏伟事业奠基。但在南明的其他地方，尤其是被西府故主朱班博联合共和派中的过激分子蛊惑的了西方内地，即使人民已经不念明帜，却也对杭州所行的“科举士族代议制“毫无好感。值此动荡之际，不免有德不配位的狼心狗肺之徒反抗我们定乱代兴的伟业。当然，如果他们没那个胆子，慷慨的大吴至尊又岂会吝啬封侯之位？"
