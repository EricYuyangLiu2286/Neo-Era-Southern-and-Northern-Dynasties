 usm_civilwar.14.d_stalemate: "南明的内战暂时停息了。我们曾以出兵相助换取归还占日领土的承诺，如今南府却已没有余力继续征战。九州不能永远只留在一纸誓言上，是时候把旧约送回谈判桌了。"
 usm_civilwar.20.d_defeated_ally: "我们押在南府身上的赌注已经落空。复明诸军取得了胜利，九州归还的承诺却没有成为我们的战果。如今摆在幕府面前的，是独自承担这场失算，还是向重建的大明中央俯首。"
