 usm_civilwar.1.t: "襄阳梦华花落屏"
 usm_civilwar.1.d: "郑氏已提出易代，要求各省与海外诸邦奉吴正朔。南府所掌军财使这项主张有了力量，朱氏数百年的帝统却仍有追随者。礼议院与内阁中未能平息的争执，终于传到了地方。\n\n[ROOT.GetCountry.GetName]须就此作答。承认吴朝，便接受郑氏以新礼法主持中央。举兵奉明，则须联络同道，准备抵抗南府军队。也有人主张趁此脱离原有隶属，由本国自行主持政务。"
 usm_civilwar.1.f: "笼络人心，一统天下。\n——《三国志通俗演义》"
 usm_civilwar.1.1: "奉明正朔，联络各省！"
 usm_civilwar.1.2: "本国自理国政。"
 usm_civilwar.1.3: "上表劝进，奉吴正朔。"
 usm_civilwar_participate: "这将导致你与大吴的战争"
 
 SHA_gold_mines: "共和与黄金之国"
 USM_civilwar_buffer: "山雨欲来"
 usm_civilwar.2.t: "第二次靖难战争"
 usm_civilwar.2.d: "反对易代的檄文已经传开。吴朝调集中央军，要求地方承认郑氏统治。奉明各省则联络营伍，筹措共同作战的兵力与粮饷。曾共同抵御北朝的南府与西府，如今终于兵戎相见。\n\n江海商路将承载军队，也会因战争而受阻。海外属邦、邻国与远方的商人都须重新决定自己的去向。无论哪一方获胜，战后的政府都要面对参战者为其流血所提出的要求。"
 usm_civilwar.2.d1: "开始于吴明易姓的南明内乱，终于在[Date.GetString|v]达到了前所未有的高峰。\n\n前明的支持者、土地改革中被牺牲的地主们和世纪初国人革命的残党，这三派诉求和行为都大相径庭的集团在面对南府郑家的步步紧逼时走到了一起。楚藩朱绛臣、冯云山，蜀藩魏鉴、萧虎力，淮藩朱靖堙、杨秀清等人以“反吴复明，奉天靖难”为旗帜举兵起义。天演帝遂以大将曾国藩、李鸿章、林则徐、吴（井伊氏）直弼率兵进剿。\n\n天演帝登基时，南明名义上已经成为世界第一帝国，此举当即引起了世界哗然，从极东洲到西极英蒽兰，列国纷纷遣使闻讯。而今日，他们的使节也将见证这场东方世界在和平不到半个世纪后就再次燃起的剧烈烽烟。"
 usm_civilwar.2.d2: "开始于吴明易姓的南明内乱，终于在[Date.GetString|v]达到了前所未有的高峰。\n\n前明的支持者、土地改革中被牺牲的地主们和世纪初国人革命的残党，这三派诉求和行为都大相径庭的集团在面对南府郑家的步步紧逼时走到了一起。楚藩朱绛臣、冯云山，蜀藩魏鉴、萧虎力，淮藩朱靖堙、杨秀清等人以“反吴复明，奉天靖难”为旗帜举兵起义。天演帝遂以大将曾国藩、李鸿章、林则徐、吴（井伊氏）直弼率兵进剿。\n\n天演帝登基时，南明名义上已经成为世界第一帝国，此举当即引起了世界哗然，从极东洲到西极英蒽兰，列国纷纷遣使闻讯。而今日，他们的使节也将见证这场东方世界在和平不到半个世纪后就再次燃起的剧烈烽烟。"
 # TODO MORE DIFFERENT DESC
 usm_civilwar.2.f: "哀哉普世穆斯林，王者不出大地分。此起彼落英雄陨，横行无忌暴君多。破碎山河鞑靼马，荼毒生灵不信者。命数无常星如流，万姓同心盼大国。\n——《近西战争史通俗演义·土耳其酒徒阿里对吴国商人的歌唱》"
 usm_civilwar.2.1: "筹饷、调兵，以实力兑现新朝的命令。"
 usm_civilwar.2.2: "奉明正朔，联合反吴。"
 usm_civilwar.2.3: "联合反吴，但胜利之后要由国人议政。"
 usm_civilwar.2.4: "依此前承诺，处理大陆战局。"
 usm_civilwar.2.5: "观察战局，履行已经作出的承诺。"
 
 RULER_TITLE_CE_TAISHI: "太师"
 RULER_TITLE_CE_FANWANG: "藩王"
 
 usm_civilwar.3.t: "悄无声息的易代"
 usm_civilwar.3.d: "地方的反对尚未汇成共同举兵的联盟。仍然归顺的各省与海外诸邦承认郑氏的新名位，另有一些地方退出了原有隶属。南府得以继续主持中央，却不能因此把所有人的沉默都当作拥戴。\n\n新朝须按礼法任官施政，也须凭现有军财维护自己的统治。那些尚未解决的地方关系，将由往后的建设、交涉与争端逐渐决定。"
 usm_civilwar.3.d1: "相较于矛盾的全面爆发，富有决断力的南朝政治家们凭借一系列果断地决策延缓了帝国的瓦解。即使遭逢吴明易姓这样的大乱，各地督抚最终也决定不做出任何有效抵抗。接纳了吴国人对于明朝皇帝及其勋贵腐败透顶的说辞。从而维系了华南地区的脆弱和平。\n\n从某种意义上来说，这也意味着日月照临之朝或许早已成为无人愿意殉葬的朽木王朝。那个最后来维护朝廷秩序的皇帝朱阔彬也不过是生不逢时罢了。\n\n虽然如此，这个从四百年的藩镇政治中爬出来的幸存者也失去了很多。战争与和平对峙的年代结束了。但反对者、藩国旧民之间的地域歧视、新的激进派政治团体仍在新时代的阴影下活动者。让这个国家向未来前进的道路蒙上了一层厚重的迷雾。"
 usm_civilwar.3.f: "千夫所指，无病而死。\n——《汉书·王嘉传》班固"
 usm_civilwar.3.1: "朕，本也乐生于有明之世。"
 usm_civilwar.3.2: "那各地的明人街是不是该改名了？"
 
 usm_civilwar.4.t: "靖难兵败"
 usm_civilwar.4.d: "朱班博的愿景消磨，郑雕锦的顽抗零落。北朝长公主牧沐子曾言襄阳大战的腥风血雨不过是保卫了一场幻梦。如今看来所言不虚。坚决镇乱的曾国藩、死守长沙的冯云山。两面下注的楚军诸将谁能又能说清自己的功过呢？但在俗世凡尘之中，属于楚人的时代结束了......"
 usm_civilwar.4.d1: "谁有能想到，当初在联邦复明时最揶揄的四川人，如今却成了捍卫明统的最后一道防线？蜀国曾经是北明四百年乱世的避风港。却终不免于屠戮和衰亡。旧蜀军将领的执拗，新蜀军将领的血性，如今都即将在南府军的炮口下化作梦幻泡影。只希望魏鉴等人最后的抵抗能在青史上留下一抹忠魂掠影......"
 usm_civilwar.4.d2: "百年教门联结，一朝万众同心。但面对东南方占据了半个世界的庞然大物，光有热血和智谋恐怕也只能棋差一招。桂林花好月圆，淮土的名将们或许来生还能再欣赏吧。"
 usm_civilwar.4.d3: "昔日长江边的那块顽石，至今也没能达到班博老师所期望的高度。或许再被迫携带着一半楚军南渡吕宋的时候，我们和杭州郑家至尊的胜负就已是注定。然而，真正的国人主义者、共和梦想家如果有着我们人民的支持，从来都是不惧一搏的。我们悲痛叹息的只是自己的无能，浪掷了伟大的大明人民的热血罢了......"
 usm_civilwar.4.d4: "西风飘散，彩云南消。我们为自己独立而奋战的这一场大战。终于走到了如今的不幸终点。但好歹这个国家是死在追求独立的道路上，而不是为某些战国大名的征伐侵略而殉葬。"
 usm_civilwar.4.d5: "我们的战线在一场又一场失败中崩溃了。南府的大兵已经掠过我们的领土，夷平了我们的都城。十万人的军队，在不断地抵抗中还是丧尽。北明战国四百有余年。那时候的一个大国要灭亡，其势也不过如此。而何况我们是死于自己的忠义之中呢！我们能够自责的，也只是自己过于无能罢了。"
 usm_civilwar.4.f: "人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。\n——司马迁"
 usm_civilwar.4.1: "是时候了。"
 usm_civilwar.4.2: "吾乃灌州魏明鉴！吾计不成，乃天命也！"
 
 
 usm_civilwar.7.t: "吴祚梦消"
 usm_civilwar.7.d: "有时候，历史并不是亲睐于那些有准备的人。一群人用数十年、上百年建立的功业，也会在战争的雷鸣瓦斧中燃烧为残烟缭绕的废墟。吴国历代至尊主以大明和东方世界之名义对于地球的征服或许不会消灭，但他们自身的权力和威势今天走到了历史赋予他们的终点。"
 usm_civilwar.7.f: "人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。\n——司马迁"
 usm_civilwar.7.1: "四百年基业，岂能毁于孤手？"
 
 usm_civilwar.8.t: "大吴帝国的黎明"
 usm_civilwar.8.d: "是时候从经年的战争中抬起我们光荣的头颅了。自从易姓革命以来的南方乱局，终于在我们的手中以最美好的结局落下帷幕。在四百五十多年前驶入杭州港湾的那艘老旧的官船，如今已变换为在整个世界的波涛冲刷下冲破万难的艨艟巨舰。\n\n扫平那些自称是忠臣孝子的军阀割据之徒，大吴帝国终于完成了联邦制度改革所梦想的”伟大集权“。而郑家的英雄豪杰也终于可以揭下名为忠臣的面纱，堂堂正正地争雄于世界强国之林！而更妙的是，我们在世界舞台上的胜利还早就获得于我们入场之前！"
 usm_civilwar.8.f: "上古圣人与龙蛇虎豹争而胜之，尧舜与洪水争而胜之，汤武与桀纣争而胜之，盖龙蛇虎豹洪水虽毒，不若心之神也。桀纣虽暴，不若心之强也。\n——《潜书》唐甄"
 usm_civilwar.8.1: "天演变化，大明始终！"
 
 usm_loss_the_civil_war_tt: "郑吴在内战中#bold 失败#!或达成了#bold 南朝贰分#!结局"
 usm_civilwar.9.t: "南朝贰分"
 usm_civilwar.9.d: "这场震惊了世界的闹剧最终没有任何赢家。在长期的战争消磨中，南朝东西双方都耗尽了自己的战争潜力和工业底蕴。或许在不久的将来，这样脆弱的和平将会被打破，而更加伟大和血腥的时代将会到来。但至少现在的我们获得了喘息之机......"
 usm_civilwar.9.f: "从来就不存在好的战争，也不存在坏的和平。\n——本杰明·富兰克林"
 usm_civilwar.9.1: "这难道是日月照临之国的诅咒吗？"
 
 usm_civilwar.10.t: "胜利之后的名分"
 usm_civilwar.10.d: "联军已经击败吴朝的中央军。奉明的旗号曾使西府诸省与各方同道一同作战，如今胜利者却须回答另一件事：南京的中央政府将由谁主持？\n\n朱氏宗室仍有重返帝位的主张，获胜的地方领袖也不愿轻易交出军政大权。共和派则希望把并肩作战的国人带入新的议政制度。战时共同反吴的联盟能否容纳这些主张，将决定南朝此后的国制。"
 usm_civilwar.10.f: "在和平年代里，儿子埋葬他们的父亲。在战争年代里，父亲埋葬他们的儿子。\n——西方谚语"
 usm_civilwar.10.1: "奉还政权，恢复朱姓王室。"
 usm_civilwar.10.2: "保留明号，由我们的政府主持国政。"
 usm_civilwar.10.3: "由国人议政，不再另立天子。"
 
 usm_civilwar.11.t: "战争结束之后"
 usm_civilwar.11.d: "战争已然结束，胜果为他人所夺。我们和新朝的关系尴尬了起来。自北明以来，中原各省行诸侯政治不是什么新闻。但今日战胜之国若是转变枪口对准我们，我们难道就有信息抗拒”王师“吗？"
 usm_civilwar.11.f: "胜败兵家事不期，包羞忍耻是男儿。\n——《题乌江亭》杜牧"
 usm_civilwar.11.1: "我们应该维持自己的独立。"
 usm_civilwar.11.2: "拥抱新政权。"
 
 usm_civilwar.12.t: "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting]坚持独立"
 usm_civilwar.12.d: "[SCOPE.sCountry('usm_mister_rebel').GetName]的代表递交了独立声明，要求以本国政府的名义处理战后的军队、财政与外交。他们曾同联军一道作战，如今准备保有自己的国政。"
 usm_civilwar.12.f: "我们这个时代，真正拥有权柄的不是政客或人民，而是火铳和铁桶炮。\n——《中原倥偬三十年——一个东洲外交官的见闻录》爱新觉罗·绵宁"
 usm_civilwar.12.1: "悬而未决之事罢了。"
 
 usm_civilwar.13.t: "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting]宣誓效忠"
 usm_civilwar.13.d: "[SCOPE.sCountry('usm_mister_rebel').GetName]已遣使宣誓效忠，承认新中央的统辖。战时并肩作战的关系由此转为君臣名分，地方军政也将按重新议定的关系办理。"
 usm_civilwar.13.f: "我们这个时代，真正拥有权柄的不是政客或人民，而是火铳和铁桶炮。\n——《中原倥偬三十年——一个东洲外交官的见闻录》爱新觉罗·绵宁"
 usm_civilwar.13.1: "聪明的决断。"
 
 usm_civilwar.14.t: "九州归还之誓言"
 usm_civilwar.14.d: "我们为南明赴汤蹈火，其中一各原因就是我们曾经被承诺了他们所占日本领土的归还。现在我们已经答打赢了这场大战，是时候让明朝人履行契约了。"
 usm_civilwar.14.f: "臣闻三皇立极，五帝禅宗，惟中华之有主，岂夷狄而无君。乾坤浩荡，非一主之独权，宇宙宽洪，作诸邦以分守。盖天下者，乃天下之天下，非一人之天下也。\n——日本南朝怀良亲王"
 usm_civilwar.14.1: "就是这样，发出去！"
 
 usm_civilwar.15.t: "[SCOPE.sCountry('current_jap').GetNameNoFormatting]要求兑现承诺"
 usm_civilwar.15.d: "最近一段时间的内乱迫使我们被拉到了与和族人的谈判桌上。他们要求我们以返还占日领土为帮助我们打赢这场战争的代价。这实在是奇耻大辱。但我们也毫无办法。或许以后我们处于更有利的状况下时，我们的大军可以一雪前耻。"
 usm_civilwar.15.f: "臣闻天朝有兴战之策，小邦亦有御敌之图。论文有孔孟道德之文章，论武有孙吴韬略之兵法。又闻陛下选股肱之将，起精锐之师，来侵臣境。水泽之地，山海之洲，自有其备，岂肯跪途而奉之乎？\n——日本南朝怀良亲王"
 usm_civilwar.15.1: "微小的失利罢了。"
 
 usm_civilwar.16.t: "[SCOPE.sCountry('current_jap').GetNameNoFormatting]要求兑现承诺"
 usm_civilwar.16.d: "最近一段时间的军事失利迫使我们被拉到了与和族人的谈判桌上。他们要求我们以返还占日领土为帮助我们打赢这场战争的代价。这实在是奇耻大辱。但我们也毫无办法，或许下一次我们占领别国领土又与人开战的时候，应该更积极地对那些领土进行防御。"
 usm_civilwar.16.f: "臣闻天朝有兴战之策，小邦亦有御敌之图。论文有孔孟道德之文章，论武有孙吴韬略之兵法。又闻陛下选股肱之将，起精锐之师，来侵臣境。水泽之地，山海之洲，自有其备，岂肯跪途而奉之乎？\n——日本南朝怀良亲王"
 usm_civilwar.16.1: "微小的失利罢了。"
 usm_civilwar.16.2: "岂有此理！你不过是尽了本分！"
 
 usm_civilwar.17.t: "九州归还之誓言"
 usm_civilwar.17.d: "随着我们在南明的内乱中击败了敌人并重新占领了日本被侵占的领土九州。是时候向那个窃据我们土地的政权发布最后通牒了。日出之国不会再容忍这种对我们尊严的的冒犯。前任幕府割让土地的决策是错误的！"
 usm_civilwar.17.f: "臣闻三皇立极，五帝禅宗，惟中华之有主，岂夷狄而无君。乾坤浩荡，非一主之独权，宇宙宽洪，作诸邦以分守。盖天下者，乃天下之天下，非一人之天下也。\n——日本南朝怀良亲王"
 usm_civilwar.17.1: "是时候谈判了。"
 
 usm_civilwar.18.t: "[SCOPE.sCountry('current_jap').GetNameNoFormatting]要求兑现承诺"
 usm_civilwar.18.d: "最近一段时间的军事失利迫使我们被拉到了与和族人的谈判桌上。他们要求我们以返还占日领土为帮助我们打赢这场战争的代价。这实在是奇耻大辱。但我们也毫无办法，或许下一次我们占领别国领土又与人开战的时候，应该更积极地对那些领土进行防御。"
 usm_civilwar.18.f: "臣闻天朝有兴战之策，小邦亦有御敌之图。论文有孔孟道德之文章，论武有孙吴韬略之兵法。又闻陛下选股肱之将，起精锐之师，来侵臣境。水泽之地，山海之洲，自有其备，岂肯跪途而奉之乎？\n——日本南朝怀良亲王"
 usm_civilwar.18.1: "该死。"
 
 usm_civilwar.19.t: "和族人退出靖难战争"
 usm_civilwar.19.d: "随着他们的战争目标达成，起先和我们还在统一战线上反吴的和族倭军现在逐渐向后退去。他们的撤离无疑将对局势产生一定影响。"
 usm_civilwar.19.f: "识时务者为俊杰，通机变者为英豪。\n——《晏子春秋》"
 usm_civilwar.19.1: "不好不坏的消息。"
 
 usm_civilwar.20.t: "错失良机"
 usm_civilwar.20.d: "这场震惊了世界的闹剧最终没有任何赢家。在长期的战争消磨中，南朝东西双方都耗尽了自己的战争潜力和工业底蕴。或许在不久的将来，这样脆弱的和平将会被打破，而更加伟大和血腥的时代将会到来。但至少现在的我们获得了喘息之机......"
 usm_civilwar.20.1: "这是我们来之不易的独立。"
 usm_civilwar.20.2: "或许这个时代不需要次一等的棋手......"
 
 usm_civilwar.21.t: "[SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting]前来朝贡"
 usm_civilwar.21.d: "在第二次靖难战争结束前夕，[SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting]趁乱宣布了自身独立。但随着我们在南京建立治权，他们察觉到实力和人望的差距，最终决定加入我们组建的新中央政府。"
 usm_civilwar.21.f: "识时务者为俊杰，通机变者为英豪。\n——《晏子春秋》"
 usm_civilwar.21.1: "迟早还要起变化。"
 
 usm_civilwar.22.t: "日本战败"
 usm_civilwar.22.d: "我们用尽权力推动的战争终于还是失败了。南明，或者说现在的大吴帝国中就是一个太过强大而对手。或许在我们用更长久的时间在阴影中恢复过来后，我们的东方岛国才能再一次追求自身独立。又或许这种对自身地位的不满不过是更阴暗情绪的反应。在乡间、城下町里，许多声音都在说着我们这次的流血是贪婪和暴政带来的惨剧。作为一个学习大朝而建立的国家，我们应该学会知足。"
 usm_civilwar.22.f: "识时务者为俊杰，通机变者为英豪。\n——《晏子春秋》"
 usm_civilwar.22.1: "真是不知耻辱。"
 
 usm_civilwar.23.t: "海峡两岸的盟约"
 usm_civilwar.23.d: "南朝内战使九州重新成为日本朝野关注的焦点。郑氏在当地经营的港口、商路与驻军，关系着吴朝的海上力量，也牵动着日本领主和商人的利益。\n\n吴朝与反吴诸省都在争取日本出兵，并以战后交还郑氏所持九州为条件。支援哪一方，将决定日本军队渡海后的敌友，以及战后向谁索取出兵的报偿。"
 usm_civilwar.23.f: "放眼天下，海天之内，岂有长生不灭者。\n——织田信长"
 usm_civilwar.23.1: "支持吴朝，要求战后归还其所持九州。"
 usm_civilwar.23.2: "联合反吴各省，以战果争取九州。"
 usm_civilwar.23.3: "维持中立，不作军事承诺。"
 
 usm_civilwar.24.t: "[SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting]崩溃"
 usm_civilwar.24.d: "随着敌人的挺进，叛贼势力[SCOPE.sCountry('usm_opposition_lost_scope').GetNameNoFormatting]坚持许久的最后防线终于崩溃。这个军事集团最后的有组织抵抗也就此消弭。其领袖或是殉国，或是在绝望中逃离了自己的人民。"
 usm_civilwar.24.f: "菩提本无树，明镜亦非台。从来无一物，何处惹尘埃。\n——六祖慧能"
 usm_civilwar.24.1: "早已注定的结局。"
 
 usm_civilwar.25.t: "林汉涵离开"
 usm_civilwar.25.d: "我们的一位重要将领林汉涵在本周早些时候悄悄带着家人离开了我们的监视，然后再也没有回来。这真是令人不可忍受的重大丑闻。或许我们将来会有机会在战场上将这位叛徒正法！"
 usm_civilwar.25.f: "良禽择木而栖，贤臣择主而事。见机不早，悔之晚矣。\n——《三国志通俗演义》"
 usm_civilwar.25.1: "无伤大雅......"
 
 usm_civilwar.26.t: "朱靖堙前往南京"
 usm_civilwar.26.d: "在胜利者的宣告下，被反吴势力尊为明主的淮国朱靖堙终于登顶至尊。这意味着他将离开位于桂林的淮国，前往南京登基为大明皇帝。正如过去“淮宁相禅”中获选的淮王世子们那般。"
 usm_civilwar.26.f: "天子，兵强马壮者当为之，宁有种耶！\n——《旧五代史·后晋·列传十三》"
 usm_civilwar.26.1: "这有可能让我们获得好处，但我们还有自己的事情要做。"

