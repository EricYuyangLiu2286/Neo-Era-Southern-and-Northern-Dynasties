 flavorUSM.1.t: "百年明祚终难延"
 flavorUSM.1.d: "明字大旗或许在这个地球上象征着东方世界的无限荣光。日月照临下前进的北明诸霸用比汉唐更加激进的尺度丈量自己和世界，永久地改变了人类对于世界岛的势力划分。但对于经历了北明数百年藩镇政治的人们来说，朱姓的王朝给神州大地也带来了与它荣光相等的血与泪。\n\n就算将西历1433-1549年看作统一时期的南京御用文人，在面对尔后至今长达三个世纪的内外战争时，也只能侧过脸去。而在自西北吹来的玉门新风——陈东阳及其国人共和党人在吴王郑钦的支持下进行了自上而下的改革后，朱姓皇族及其羽翼下明廷藩臣勋旧的奢靡反动就更加惹眼。土地、债契、门第。共和党人口中这些人吃掉人用的工具，在十室九空的和平之后，也愈发地为人们所厌弃和批判。\n\n值此千年未有之变局时刻，大明联邦的人们在惶恐和义愤中举目南望。\n\n杭州，一个象征着明人对于新大陆、欧罗巴、大食世界以及更偏远角落探索开拓的城市。在那里，力挽狂澜从牧氏野心中拯救了明朝的郑氏家族正在嘈杂迷乱的舆论场斗战中静坐，等待着历史湍流的下一次激荡。"
 flavorUSM.1.f: "天下神祠，无功于民不应祀典者，即淫祠也，有司无得致祭。 \n——《大明太祖高皇帝实录·卷五十三·去封号诏》"
 flavorUSM.1.1: "听那风啸马嘶，确是大国将亡。"
 
 flavorUSM.2.t: "阴影中的纷争"
 flavorUSM.2.d: "相较于矛盾的全面爆发，富有决断力的南朝政治家们凭借一系列果断地决策延缓了帝国的瓦解，消弭了共和派和保守派之间的剑拔弩张。虽然如此，这个从四百年的藩镇政治中爬出来的幸存者也失去了很多。战争与和平对峙的年代结束了。但反对者、藩国旧民之间的地域歧视、新的激进派政治团体仍在新时代的阴影下活动者。让这个国家乃至整个东方世界向未来前进的道路蒙上了一层厚重的迷雾。"
 flavorUSM.2.f: "...太古之时，烝黎初载，未有上下，而自顺序，天未事焉，君未设焉。后稍矫虔，或相陵虐，侵渔不止，为萌巨害。于是天命圣人使司牧之，使不失性...——\n《潜夫论》"
 flavorUSM.2.1: "但起码我们拯救了自己的命运。"
 
 flavorUSM.3.t: "摸着石头过河"
 flavorUSM.3.d: "相较于矛盾的全面爆发，富有决断力的南朝政治家们凭借一系列果断地决策延缓了帝国的瓦解，消弭了共和派和保守派之间的剑拔弩张。虽然如此，这个从四百年的藩镇政治中爬出来的幸存者也失去了很多。战争与和平对峙的年代结束了。但反对者、藩国旧民之间的地域歧视、新的激进派政治团体仍在新时代的阴影下活动者。让这个国家向未来前进的道路蒙上了一层厚重的迷雾。"
 flavorUSM.3.f: "...太古之时，烝黎初载，未有上下，而自顺序，天未事焉，君未设焉。后稍矫虔，或相陵虐，侵渔不止，为萌巨害。于是天命圣人使司牧之，使不失性...\n——《潜夫论》"
 flavorUSM.3.1: "一样的故事，不一样的未来。"
 
 flavorUSM.4.t: "吴明易代，郑昭宋聋"
 flavorUSM.4.d: "西元1678年春，时为北明吴国公的大明南京留守使、南京礼部尚书的（吴武宗）郑昭在他在海内外的一系列军事胜利后，单方面向朝廷上书，准备进京觐见大明天子。当是时，在三十年前的大宪战争中大获全胜的天津燕主及其国势还如烈火烹油。堪称北明战国末期的天下之雄。但郑氏的执拗战胜了朝臣的规劝和敌人的威胁。终于在同年六月成行。\n\n这次觐见是一场北明从藩镇时期到诸侯时期近三百年来都未有人见过的盛大巡游。虽然吴国主在燕、秦、齐等势力的胁迫下，最终只带了5000卫士和一些官员随行。但在这队伍中包罗了吴国海陆军事力量在那个时代的全部精锐，南洋的海兵、倭国的刀牌手、女真掷弹兵的早期营队，甚至还包括一个由“极东殷人”流亡贵族组成的，向中国皇帝伸冤借兵的队伍。并携带着吴人在这个地球上纵横百年来所获得无数珍宝，以及又用了近万名民夫运送的安南、高棉贡米。与之相对的，则是在藩镇节度使制度下被小规模械斗和转运使卡要下，四时常乱，在饥荒边缘长久徘徊的中原。\n\n在郑昭的觐见使团归来后。他当即改其称号为”至尊“，吴国随即见证了一个南北流民向自己及殖民地不断涌入的快速发展时期。而在那之后，郑昭及其继承者也开始以更加严苛的力度推进集权主义的“专权变法”及土地商品化改革。并最终稳固了我们作为南朝尊主，总领万国的基业。吴人前进的脚步从未停下，直至今天......"
 flavorUSM.4.f: ".吾常闻朱家天子受命于天，乃神龙降世。明太祖高皇帝以一乞儿之身，执长策，灭胡氛，恢复汉家中原。功在千古，更比青史石刻永恒。所以周德虽衰，天命未改。今日一见，朱家小子亦凡人尔。\n——郑昭"
 flavorUSM.4.1: "尧舜禅让，汤武革命。中国天命所衷不在一家一姓，上下分隔，而在于民有德，于人有功。"
 
