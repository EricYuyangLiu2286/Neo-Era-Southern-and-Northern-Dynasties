 flavorUSM.5.t: "陈东阳遇刺"
 flavorUSM.5.d: "陈东阳（字满越）（1772-[Date.GetString|v]）是西秦大革命时期的国人主义共和思想的代表人物，也是短命的革命共和国的开国元勋。在被迫逃离自己建立的国家后，陈东阳与南方的进步派合作，以南明首辅的身份又成为南明近代化改革的主要领袖。\n\n然而，改革带来的不只有繁荣，还有巨大的政治动荡和许多地方有力人士的抵抗。随着改革在政治上和经济上的工作基本完成，郑钦及其盟友开始对陈东阳集团无法控制的共和派理想感到厌烦。曾言“予取予求，孤当自专”的郑钦在今年早些时候罢免了在集权改革中逐渐和自己分道扬镳的陈东阳，并密令归化和族官员郑（德川）家齐监视其行动。最终，[Date.GetString|v]，陈东阳离开大陆前往极东洲讲学时，吴王豢养的和族死士郑六郎在航船中毒杀了这位青史留名的政治家。"
 flavorUSM.5.f: "大国不在山川之广，不在人民之众，不在金铁之数。其唯生生地，其唯立立民，其唯治治产。以无限之天地为圆郭，取正道为方城。虽一城、一郭、一隅之地，犹大国也。\n——《大国论》陈东阳"
 flavorUSM.5.1: "一个时代的落幕。"
 
 flavorUSM.6.t: "首辅身后"
 flavorUSM.6.d: "陈东阳已经去世。南朝共和派失去了主持改制的领袖，内阁及六部也须重新分派他留下的职权。各省学政还在礼议院争论新政的前途，南府却已开始争取那些失去领袖的官员。"
 flavorUSM.6.d1: "陈东阳（字满越）（1772-[Date.GetString|v]）是西秦大革命时期的国人主义共和思想的代表人物，也是短命的革命共和国的开国元勋。在被迫逃离自己建立的国家后，陈东阳与南方的进步派合作，以南明首辅的身份又成为南明近代化改革的主要领袖。\n\n然而，改革带来的不只有繁荣，还有巨大的政治动荡和许多地方有力人士的抵抗。随着改革在政治上和经济上的工作基本完成，郑钦及其盟友开始对陈东阳集团无法控制的共和派理想感到畏惧。最终，[Date.GetString|v]，在陈东阳离开大陆前往极东洲讲学时，一位身份不明的和族浪人用短铳在船舷上刺杀了这位共和派领袖。\n\n陈东阳死后，追随他的南方共和派几乎立刻就陷入了相互指责和争论中。"
 flavorUSM.6.f: "大国不在山川之广，不在人民之众，不在金铁之数。其唯生生地，其唯立立民，其唯治治产。以无限之天地为圆郭，取正道为方城。虽一城、一郭、一隅之地，犹大国也。\n——《大国论》陈东阳"
 flavorUSM.6.1: "一个时代的落幕。"
 
 flavorUSM.7.t: "雕锦入蜀"
 flavorUSM.7.d: "南明政权后期，武装力量主要分为西府、南府两大部分。其中的西府军队没有南府郑氏这样独断的政治领袖，而实际上是一个由四川蜀藩、湖北楚藩、广西淮藩为首的松散联盟。曾几何时，郑雕锦正是其中那颗冉冉升起的明星——朱班博麾下最有力的智囊。后者的人格魅力和军事指挥能力足以让他背叛自己腐朽的家族。成为国人共和派在南方的坚定信徒。\n\n然而，仿佛是老天爷看厌了明朝故事。陈东阳、朱班博这两尊时代的巨擎几乎是毫无征兆地倒下了。曾经追随他从西安走到漠南，再从漠南回到西安，又从那里来到江水之南的那些人也各奔前程。转眼间，这世上唯一还能看到共和制度塔尖的人仿佛就剩下了他一个。\n\n好吧！迈向未来的梦想家们在法国失败了，秦国失败了，明国眼看也要失败下去。但众所周知，在历史上正义的一方总是要不断地失败下去。但只要这是真正顺着历史的潮流的事情。做下去，最终都会成功。就像岳飞、文天祥做不到的事情，朱重八就可以做到。而郑雕锦甚至不必像前人那样牺牲自己，因为在西方的崇山峻岭中，恐怕还有一个他的老朋友。"
 flavorUSM.7.f: "公民们，你们想要一场没有革命的革命吗？\n——《1792年11月5日在国民公会反驳卢韦指控的演讲》罗伯斯庇尔"
 flavorUSM.7.1: "人们放弃，人们逃离，但历史总还是要向前进。不是今天，就是明天。"
 
 flavorUSM.8.t: "川东整肃事件"
 flavorUSM.8.d: "大吴天演元年（1850年），礼议（会）以吴国郑氏代明而立。蜀王朱深橞、广西（淮）王靖堙反。朱靖堙登基践祚，改元“复昭”，号称“天日复昭”。礼议（会）以曾国藩、左宗棠、郑（德川）家齐、吴（井伊）直弼讨之。三月灭淮，次年，蜀将萧虎力病逝，重臣魏鉴死守成都旧城，持剑骂贼死。蜀王南奔大理。\n\n成都既克，西兵星散。曾、吴遂使南兵封闭川中州县三日，搜检山河，野外有民人健者皆可杀。令既下，成都、剑阁、眉州等皆为众军强夺。有不从者无论何处受捕，皆为屠戮。金沙水赤，旬月可见。郑帝闻讯有愠色，却不过稍诫而已。"
 flavorUSM.8.f: "......天演三年，吴主使齐人周匾昪督川，见道路萧条，十室九空，人不信国，遂使两广、赣西人填入四川。至今，有外省川人归乡，皆云乡音改矣......——《新华阳国志》"
 flavorUSM.8.1: "西人反贼云“革命”者多以敢流血为勇，朕却觉得彼等少读了几本东方史书。"
 
 flavorUSM.9.t: "云南流血事件"
 flavorUSM.9.d: "大吴天演二年（1852年），曾国藩、郑家齐入滇。蜀王肉袒降，贬为大理侯，仍得恩养。淮藩僭主靖堙之后以大逆罪流于昆仑洲（南非），并夺其朱氏，改为“彘”姓。如是，贼人所谓“二靖国难”方得告终。同年冬，前明礼部侍郎、湖广布政使郑雕锦率弟子、西南夷六千反。往攻滇南琉璃堡，千总扈熵、沐三友拒之。竞日难克，南逃缅甸。川滇军民多念旧蜀，复往护之，于是官兵烦累，不能追。上闻讯，使曾武成公国藩南出重庆，二巡西南。往后数年，滇地戒严，多有搜杀。土司凋零，野无鸡鸣。"
 flavorUSM.9.f: "......一生未售屠龙技，万里犹思汗马功。王衍诸人宁足责，姜维竖子自应穷......\n——《登千峰榭》陆游"
 flavorUSM.9.1: "老乡，我听不到你们的声音了？是胜利了吗？"
 
 flavorUSM.10.t: "桂林大审判"
 flavorUSM.10.d: "大吴大吴天演元年（1850年），蜀、淮、楚三藩反。是为国史所谓“西府倡乱”。其中西北两藩以革命为能事，多有法国激进派之政治举动。然淮藩与之不同。彼淮藩自反王彘靖堙以下，重臣如炀秀清、枭朝贵等，皆以教门土地为联结。举宝莲妖帜，并与景教十字架护身。其实乃近代唯一一起白莲邪教道会门之大叛乱也。\n\n白莲邪教于贵州、广西深耕百年。响应呼喝之乱民愚夫岂止百万？在国朝行新政改革土地后，广西士绅更是多入毂中。于是，吴忠正公直弼既破淮国诸州，乃用三月搜杀教门党徒。查得一人入教，全家灭门。前明功勋士族亦不能免。貌似酷烈，实乃为国除害之猛药。"
 flavorUSM.10.f: "......野多乱民，遮蔽群山。广西不能定。逾七月，南京有书来，签以首辅郝廷疆朱印。令诸将有在淮者皆可便宜行事，平乱以军情为重，不必通问中朝、枢密院。次日，闻直弼谕众军曰：“石过刀，草过火，人换种。”\n——《西南整肃令纪实》"
 flavorUSM.10.1: "本相的印信哪去了？原来在陛下这......"
 
