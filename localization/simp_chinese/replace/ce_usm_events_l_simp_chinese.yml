 ce_usm_suppress_rebellion: "第二次靖难战争：覆灭乱党"
 ce_usm_suppress_rebellion_reason: "西府余孽不过因为朱氏政权老病而死，就割裂国家领土，还让北朝专制者和泰西蛮夷有了可乘之机。实在是中国进步明天之罪人。我们要推进国家的经济建设，进一步深化土地改革。就必须以武力戡平叛乱，彻底解除彼等旧贵族、军阀野心家之武装。"
 
 ce_usm_restoration_of_ming: "第二次靖难战争：反吴复明"
 ce_usm_restoration_of_ming_reason: "南府吴国不过倭人野种，居然亦敢行南朝五代之大逆，复以我明为东晋乎？为南唐乎？其为聚敛更施土地剥夺之暴政。多有残虐国家栋梁。自古以来，臣妾谋逆而僭位者，为中国大逆，人人得而诛之！吾等乃明室之忠臣也。当效太宗永乐皇帝之故事！奉天命，靖国难！"
 
 ce_usm_acheive_revolution: "第二次靖难战争：反吴革命"
 ce_usm_acheive_revolution_reason: "南府郑氏的拿破仑主义者皆是狼子野心。在最关键的时刻背叛了先领袖陈东阳的伟大理想，还试图镇压我天朝国人追求自由和统一的正义运动。他们和被他们扔进垃圾堆的朱明地主集团一样要下地狱去！"
 
 ce_usm_cw_japanese_interest: "第二次靖难战争：和族独立运动"
 ce_usm_cw_japanese_interest_reason: "郑氏在九州的据点，是吴国海上事业的一部分，也长期牵动日本诸家的利害。如今南朝内战，各方使者相继渡海，请日本提供兵船与军需。朝廷有机会借此次战争收回九州的吴国领地，并重新安排海峡两岸的关系。"
 
