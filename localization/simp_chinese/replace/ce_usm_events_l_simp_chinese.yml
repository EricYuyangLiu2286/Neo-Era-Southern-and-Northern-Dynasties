 ce_usm_conflicts_within_reason: "明朝朱姓，还是吴国郑氏？这对于中国南朝有能力参预政治的国人来说，是一个每分每秒都要自问的难题。从川边乡校的讲习台到南京礼部的议会殿。争论、札子、散文、报道，各式各样体裁的文字都在对人们呼喊。却是问多于答，争大于论。"
 
 ce_usm_ruling_of_nanfu: "南府遥制"
 ce_usm_ruling_of_nanfu_reason: "起源自永乐朝大将郑和的吴王世家，或许在繁荣中早已忘却自己的祖先几乎不免于旧时代的阉宦陋习。如今，与南来的国人共和派革命者的联盟缔造了世界上最高效和清廉的官僚团体，长达两个多世纪的专权变法又确保着所有机构及其控制者都或多或少地向吴王殿下及其政治集团效忠。相对于内陆三藩只统治中国的一小部分就棘手不已，南吴郑氏及其羽翼下的精英们正有条不紊地指挥着整个世界，而且他们已经这样做了将近百年有余。"
 
 
