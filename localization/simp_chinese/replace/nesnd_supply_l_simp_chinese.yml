l_simp_chinese:
 nesnd_supply_preparations:0 "脆弱的贸易"
 nesnd_supply_preparations_reason:0 "吴人的海船把南洋稻米、远方木材与各国货物运进南朝，内陆工坊、营伍与书院也早已离不开这些货。各省虽保有不同的地方势力，生产和生计却已难以独立于共同市场。停下一处港口、截断一条商路，损失便会传到远方。\n\n明廷与南府争论帝统时，[ROOT.GetCountry.GetName]仍必须维持自己的军政。官署要用纸，营伍要补兵添械，书院中的监生也正从讲席走向议政。我们既要同愿意通商的诸邦保持买卖，又要使本地工坊、学校与乡里的生计经得住眼前的动荡。"
 nesnd_supply_status_war:0 "#n 战火已波及商路。#!军需征发与航运受阻，先前的安定未能延续。\n$nesnd_supply_rules_link$"
 nesnd_supply_status_inputs:0 "#n 工坊与营伍所需的货物供给不济。#!纸张、工具与军械的价钱正推高各处开支。\n$nesnd_supply_rules_link$"
 nesnd_supply_status_jobs:0 "#n 工坊与官署尚缺人手。#!现有职位仍必须招足工人，才能维持生产和官署日常运转。\n$nesnd_supply_rules_link$"
 nesnd_supply_status_livelihood:0 "#n 各[concept_state]的生计仍未安定。#!失业者难以谋生，粮价与饥馑也在拖累买卖。\n$nesnd_supply_rules_link$"
 nesnd_supply_status_diplomacy:0 "通商联络尚未议定。可以派使去谈，也可以让商人自行买卖。\n$nesnd_supply_rules_link$"
 nesnd_supply_status_stable:0 "#p 货源、工场与民生渐趋安定。#!若能维持一季，我们便有把握把这些买卖长久做下去。\n$nesnd_supply_rules_link$"
 nesnd_supply_readiness_bar:0 "通商根基"
 nesnd_supply_readiness_bar_desc:0 "$nesnd_supply_readiness_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_supply_continuity_bar:0 "商路安定周数"
 nesnd_supply_continuity_bar_desc:0 "$nesnd_supply_continuity_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 12#!"
 nesnd_supply_invite_desc:0 "派使与对方商议通商，争取更好的两国关系。现有市场中的买卖照常进行。"
 nesnd_supply_invitation_tt:0 "商使将在七日后抵达。本次使团任期六个月。"
 nesnd_supply_no_pending_envoy_tt:0 "目前没有商使正在等候对方答复"
 nesnd_supply_no_partner_tt:0 "本国目前没有通商联络伙伴"
 nesnd_supply_envoy_interval_tt:0 "首次派使，或距上次派使已满#v 6个月#!"
 nesnd_supply_self_available_tt:0 "我国尚未决定让商人自行买卖"
 nesnd_supply_partner_valid_tt:0 "本国与伙伴的通商联络仍然有效"
 nesnd_supply_trade_interval_tt:0 "首次提议互惠贸易条约，或距上次提议已满#v 6个月#!"
 nesnd_supply_commercial_arrangement_tt:0 "我国与他国共处同一市场、已有通商联络伙伴，或已决定让商人自行买卖"
 nesnd_supply_twelve_weeks_tt:0 "货源、工场用工、生计与通商章程已连续#v 12周#!达标"
 nesnd_supply_accept_tt:0 "建立通商联络。"
 nesnd_supply_self:0 "让商人自行买卖"
 nesnd_supply_self_desc:0 "撤回专项使团与待答请求，由商人继续经营现有买卖。市场归属和已经签署的条约照旧。"
 nesnd_supply_end_contact:0 "结束通商联络"
 nesnd_supply_end_contact_desc:0 "召回专项使团，结束此次商业联络。现有市场中的买卖与已签条约继续有效。"
 nesnd_supply_end_contact_tt:0 "结束此次联络。若通商章程因此中断，连续稳定周数重新累计。已经签署的正式条约照常有效。"
 nesnd_supply_trade:0 "商议互惠贸易条约"
 nesnd_supply_trade_desc:0 "把两国商人的买卖写入盟约，互予贸易优惠。"
 nesnd_supply_trade_request_tt:0 "#v 7日#!后向对方提出互惠贸易条约，约束期#v 2年#!。对方可接受或拒绝。"
 nesnd_supply_finish:0 "商路渐稳"
 nesnd_supply_finish_desc:0 "货源、用工、生计与通商章程连续稳定 #v 12周#! 后，首次完成可使进口和出口贸易优势各提高 #p 10%#!，持续 #v 2年#!。此后若参加反吴一方的靖难战争，参战时获得为期 #v 1年#! 的训练率 #p +10%#! 和动员商品需求 #p −5%#!。"
 nesnd_supply_dismiss:0 "暂缓通商"
 nesnd_supply_dismiss_desc:0 "先召回使团，日后再议商路。已有的派使开支仍要付到到期为止。"
 nesnd_supply_envoys:0 "驻外通商使团"
 nesnd_supply_verified:0 "商路渐通"
 nesnd_supply_treaty:0 "互惠通商约"
 nesnd_supply_resume:0 "重续商路"
 nesnd_supply_resume_desc:0 "重新联络商人，整顿货源与雇工，恢复同各邦的通商。"
 nesnd_supply.1.t:0 "商人先行"
 nesnd_supply.1.d:0 "[SCOPE.sCountry('nesnd_supply_requester').GetName]的使者带来了商人的请托。他们希望在两国之间保留采购联络，互通纸张、木材和工坊的供货消息，使商人在局势变化时仍能找到交易的门路。\n\n这样的联络能多结交几家主顾，可也要有官员接待、有商人奔走。[ROOT.GetCountry.GetName]可以派人去谈，听听对方想买些什么。"
 nesnd_supply.1.f:0 "“敝国商人请两国保留采购联络，互通纸张、木材与工坊供货的消息。”\n——来使转呈的商人请托"
 nesnd_supply.1.a:0 "请他们来谈。"
 nesnd_supply.1.b:0 "国内的事还多，暂不接待。"
 nesnd_supply.2.t:0 "互惠通商约"
 nesnd_supply.2.d:0 "[SCOPE.sCountry('nesnd_supply_requester').GetName]提议把两国的通商写入正式条约，互相给予贸易优惠。商人盼望借此扩大销路，采购人员也希望得到更稳定的交易关系。条约一经签署，两国就必须照条约办事。"
 nesnd_supply.2.f:0 "“两国互相给予贸易优惠，自签约之日起照约办理。”\n——互惠通商条约草案"
 nesnd_supply.2.a:0 "准予签署。"
 nesnd_supply.2.b:0 "此约还必须再议。"
 nesnd_supply.3.t:0 "商路与经济"
 nesnd_supply.3.d:0 "过去一季，[ROOT.GetCountry.GetName]的工坊与营伍有货可购，学堂、官署和厂场也逐渐补齐了人手。商人重新摸熟了做买卖的门路，各州的人们得以靠生产与买卖维持生活。\n\n海内外的朝争还在继续。那些装着货物驶离码头的船只，给我们留下了接着做下去的本钱。"
 nesnd_supply.3.f:0 "“天下熙熙，皆为利来。天下壤壤，皆为利往。”\n——《史记·货殖列传》"
 nesnd_supply.3.a:0 "让商旅照常通行。"
 nesnd_supply_invite_hna:0 "遣使[SCOPE.sCountry('nesnd_label_hna').GetName]"
 nesnd_supply_invite_sih:0 "遣使[SCOPE.sCountry('nesnd_label_sih').GetName]"
 nesnd_supply_invite_gng:0 "遣使[SCOPE.sCountry('nesnd_label_gng').GetName]"
 nesnd_supply_invite_yn1:0 "遣使[SCOPE.sCountry('nesnd_label_yn1').GetName]"
 nesnd_supply_invite_cne:0 "遣使[SCOPE.sCountry('nesnd_label_cne').GetName]"
 nesnd_supply_invite_fra:0 "遣使[SCOPE.sCountry('nesnd_label_fra').GetName]"
 nesnd_supply_hus_preparations:0 "共和国的商路"
 nesnd_supply_hus_ready_shared_status:0 "各项准备已稳定#v 12周#!。点击“#bold 继续经营共同市场#!”，确认现有的通商章程。"
 nesnd_supply_hus_ready_autonomous_status:0 "各项准备已稳定#v 12周#!。点击“#bold 自掌商路#!”，确认现有的通商章程。"
 nesnd_supply_hus_review_complete_tt:0 "已确认现有的通商章程。"
 nesnd_supply_hus_review_effect_tt:0 "确认现有的通商章程，结束筹备。"
 nesnd_supply_hus_preparations_reason:0 "共和国的沿海城镇因移民与商船而兴盛。反抗吴人的战争使东洲诸邦走到一起，北朝的盟约又为我们的货物打开了新的销路。港口中的装卸、工坊中的生产和各州的赋税，已经靠这些买卖紧紧连在一起。\n\n如今南朝争位的消息越海而来。商人要打听货源，船主忧心航路，工人仍等着每周的工钱。无论继续经营共同市场，还是由共和国另定通商章程，我们都必须先稳住自己的生产与生计。"
 nesnd_supply_finish_shared:0 "继续经营共同市场"
 nesnd_supply_finish_shared_desc:0 "继续在现有共同市场中经营。各项条件连续维持 #v 12周#! 后，首次完成可使进口和出口贸易优势各提高 #p 15%#!，持续 #v 2年#!。"
 nesnd_supply_finish_autonomous:0 "自掌商路"
 nesnd_supply_finish_autonomous_desc:0 "在我国掌管的市场中继续经营。各项条件连续维持 #v 12周#! 后，首次完成可使进口和出口贸易优势各提高 #p 15%#!，持续 #v 2年#!。"
 nesnd_supply_status_bankruptcy:0 "#n 国库已经破产。#!官署必须重整财政，商路的安定也要重新积累。\n$nesnd_supply_rules_link$"
 nesnd_supply_workforce_ready_tt:0 "全国[concept_unemployed]劳动力占比至多#v 12%#!，且劳动力至少#v 5万#!的[concept_state]失业占比至多#v 20%#!。"
 nesnd_supply_rules_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_supply_rules 货源与生计#!#!"
 nesnd_supply_rules:0 "#bold 货源#!\n纸张、工具、小武器无本国短缺，价格涨幅不超过#v 50%#!。东洲另需硬木。\n\n#bold 工场与人手#!\n所需建筑各有至少一座雇员达到#v 75%#!，且不缺生产投入。湖广为大学与军营。四川为工具厂，以及铁矿或伐木场。广西为纸厂与伐木场。东洲为港口与官署。招工困难时可查看[concept_pop_qualifications]、[concept_building_wage]与原料供应。\n\n#bold 生计#!\n全国[concept_unemployed]劳动力不超过#v 12%#!。劳动力至少#v 5万#!的[concept_state]不超过#v 20%#!。自给农民属于有业人口。全国无饥荒，粮食无本国短缺且涨价不超过#v 25%#!。\n现有[concept_unemployed]劳动力：#v [Country.MakeScope.Var('nesnd_supply_unemployed').GetValue|0] / [Country.MakeScope.Var('nesnd_supply_workforce').GetValue|0]#!（#v [Country.MakeScope.Var('nesnd_supply_unemployment').GetValue|%1]#!）。超过地方失业界线的[concept_state]：#v [Country.MakeScope.Var('nesnd_supply_critical_states').GetValue|0]#!。\n\n#bold 商路安定#!\n处于共同市场时，通商章程自动满足。我国单独掌管市场时，可确定联络伙伴或让商人自行买卖。四项条件连续维持#v 12周#!。战争、破产、市场改变或任一条件不满足，连续周数重新计算。"
