 nesnd_company.1.t:0 "天工开物"
 nesnd_company.1.d:0 "[GetStateRegion('STATE_NANJING').GetName]的[GetBuildingType('building_tooling_workshop').GetName]已经能为东南各厂造出车床和锅炉配件。几家作坊的东家联名向[ROOT.GetCountry.GetName]政府请求特许，以宋应星的书名为号，合股开办一家机器行，并请国库在开办的头两年贴补经费。获准之后，各坊的工匠、图样和订单将归入同一家商行。"
 nesnd_company.1.f:0 "“本行专造车床、汽机及一切制器之器。股本由各坊东家分认，官款只贴开办经费。”\n——天工开物行招股章程"
 nesnd_company.1.a:0 "准其开办，国库贴补两年。"
 nesnd_company.1.b:0 "此事不急，暂不开办。"

 nesnd_company.2.t:0 "考工"
 nesnd_company.2.d:0 "[GetStateRegion('STATE_XIAN').GetName]已有数家[GetBuildingType('building_arms_industry').GetName]。[SCOPE.gsInterestGroup('nesnd_co_army_ig').GetName]的将领要求[ROOT.GetCountry.GetName]政府把这些工厂并为一家总行，统一按[GetTechnology('rifling').GetName]的式样制造枪械，由军方督办，国库在开办的头两年贴补经费。汉代长安设考工令，专掌兵器的制造。将领们要恢复的正是这项制度。"
 nesnd_company.2.f:0 "“天有时，地有气，材有美，工有巧。合此四者，然后可以为良。”\n——《周礼·考工记》"
 nesnd_company.2.a:0 "交由军方督办。"
 nesnd_company.2.b:0 "兵工厂暂不合并。"

 nesnd_company.3.t:0 "百炼成钢"
 nesnd_company.3.d:0 "[GetStateRegion('STATE_CHELYABINSK').GetName]的[GetBuildingType('building_iron_mine').GetName]日益扩大。当地的铁厂主请求[ROOT.GetCountry.GetName]政府准许他们把采矿与冶炼合为一家经营，以“百炼钢”为号，并请国库在开办的头两年贴补经费。"
 nesnd_company.3.f:0 "“凡入股者，以矿石、炉座或现银作价，岁终按股分利。”\n——百炼钢招股章程"
 nesnd_company.3.a:0 "准其合办，国库贴补两年。"
 nesnd_company.3.b:0 "暂不准许合办。"

 nesnd_company.4.t:0 "王道"
 nesnd_company.4.d:0 "从[GetStateRegion('STATE_LIMA').GetName]通往旧都库斯科所在的[GetStateRegion('STATE_ICA').GetName]，铁路已经修进山区。勘路的工程师多沿印加时代的石砌王道选线，当地人仍把这条路叫作卡帕克南。沿线的承包商请求[ROOT.GetCountry.GetName]政府颁发特许，以王道之名合组一家铁路公司，把铁轨延伸到高原各城，并请国库在开办的头两年贴补经费。"
 nesnd_company.4.f:0 "“自利马至库斯科，凡王道旧基可用者，本公司一律依旧基铺轨。”\n——卡帕克南公司特许状"
 nesnd_company.4.a:0 "颁发特许，国库贴补两年。"
 nesnd_company.4.b:0 "特许状暂不颁发。"

 nesnd_co_transcontinental:0 "贯通大陆的干线"
 nesnd_co_transcontinental_reason:0 "[ROOT.GetCountry.GetName]的领土从太平洋岸边的[GetStateRegion('STATE_CALIFORNIA').GetName]延伸到大平原上的[GetStateRegion('STATE_NEBRASKA').GetName]。两地之间隔着[GetStateRegion('STATE_NEVADA').GetName]的荒漠和[GetStateRegion('STATE_UTAH').GetName]的盐湖，货物和移民仍要靠马车翻越群山。铁路连通东西之后，西岸的港口和平原的农场将进入同一个市场。全线贯通之后，各段的承包商可以合组一家总会，经营这条干线。"
 nesnd_co_transcontinental_conclusion:0 "铁路已从[GetStateRegion('STATE_CALIFORNIA').GetName]通到[GetStateRegion('STATE_NEBRASKA').GetName]。各段承包商合组的$company_nesnd_zongguanxian$可以开办了。"

