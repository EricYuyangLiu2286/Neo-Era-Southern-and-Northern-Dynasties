l_simp_chinese:
 nesnd_japan_war_collapse:0 "幕府危局"
 nesnd_japan_war_collapse_reason:0 "京都的使者催问援兵，关东诸侯却要先知道，幕府还留着多少兵守江户。两地送来的军报摊在案上，丰臣家今日能调哪一藩的兵，又能让哪一藩安心守城？"
 nesnd_japan_war_collapse_status:0 "本次靖难战争中，#bold 京都和关东同时被吴方军队占领#!，幕府就算战败。吴方对日本执行战争要求，也会触发战败处置。"
 nesnd_xiangyang_camp_journal:0 "襄阳大营"
 nesnd_xiangyang_camp_journal_reason:0 "襄阳扼汉水而通江汉，是南朝内地兵马调动的枢纽。大营将士追随陈东阳的新政，既不愿为郑氏易代效力，也不愿把立宪的前途交回旧士绅手中。严明的后勤统筹、科学操练和朱班博的精神遗产共同铸成了襄阳西府的军魂。"
 nesnd_xiangyang_camp:0 "襄阳大营"
 nesnd_xiangyang_camp_desc:0 "统一筹措军械与粮饷，整饬营伍，固守江汉。"
 nesnd_capital_surrender_accept:0 "大势已去。"
