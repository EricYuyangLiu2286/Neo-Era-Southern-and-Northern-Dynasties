 nesnd_xiangyang_camp_journal:0 "襄阳大营"
 nesnd_xiangyang_camp_journal_reason:0 "襄阳扼汉水而通江汉，是南朝内地兵马调动的枢纽。[ROOT.GetCountry.GetName]的大营将士追随陈东阳的新政，反对郑氏易代和旧士绅复辟。严明的后勤统筹、科学操练和朱班博的精神遗产，共同铸成了襄阳西府的军魂。"
 nesnd_xiangyang_camp_journal_lobby:0 "襄阳扼汉水、通江汉，是南朝内地调动兵马的枢纽。$nesnd_lobby_name_hna$的大营将士追随陈东阳的新政，反对郑氏易代和旧士绅复辟。严明的后勤统筹、科学的操练和朱班博留下的精神遗产，铸成了襄阳西府的军魂。"
 nesnd_xiangyang_camp:0 "襄阳大营"
