l_simp_chinese:
 character_role_nesnd_ming_refuge:0 "明室宗亲"
 character_role_nesnd_ming_refuge_desc:0 "在明吴易代中保留宗室身份的朱氏成员。"
 character_role_nesnd_ming_patron:0 "行在保护人"
 character_role_nesnd_ming_patron_desc:0 "为明廷行在提供地方军政支持的旧任领袖。"
 character_role_nesnd_ming_fanwang:0 "明藩王"
 character_role_nesnd_ming_fanwang_desc:0 "失去帝位后作为贵族留居故地的明朝天子。"
 nesnd_ming_court_refused:0 "拒迎天子"
 nesnd_ming_court_refused_desc:0 "我国拒绝迎回行在的天子，他已被降为藩王。"
 nesnd_ming_court_reunion_emperor_tt:0 "该国的君主仍是明室天子"
 nesnd_ming_court_reunion_not_done_tt:0 "迎驾之议尚未决定"
 nesnd_court_followup.20.t:0 "迎驾"
 nesnd_court_followup.20.d:0 "南府已经覆灭，[ROOT.GetCountry.GetName]入主南京。然而，[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]仍在[SCOPE.sCountry('nesnd_reunion_court').GetName]坐朝。战时为保存明室而设的行在，如今成了与南京并立的另一个大明朝廷。\n\n南方各省与海外诸邦都在等待[ROOT.GetCountry.GetName]的答复：遣使迎驾，奉天子还都，或者拒绝迎驾，由行在把他降为藩王。"
 nesnd_court_followup.20.f:0 "“天无二日，民无二王。”\n——《孟子·万章上》"
 nesnd_court_followup.20.a:0 "遣使迎驾，奉天子还都。"
 nesnd_court_followup.20.a_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]迁入我国，行在若有明室储君也一同前来。我国若行君主制，天子即位为我国君主，否则以明室宗亲的身份居留。\n[SCOPE.sCountry('nesnd_reunion_court').GetName]不再是明廷行在，原地方领袖在世时复任君主。"
 nesnd_court_followup.20.b:0 "南京不再奉迎行在的天子。"
 nesnd_court_followup.20.b_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]降为明藩王，作为贵族留居[SCOPE.sCountry('nesnd_reunion_court').GetName]。\n[SCOPE.sCountry('nesnd_reunion_court').GetName]不再是明廷行在，原地方领袖在世时复任君主。"
 nesnd_court_followup.21.t:0 "迎驾之议"
 nesnd_court_followup.21.d_received:0 "[SCOPE.sCountry('nesnd_reunion_successor').GetName]遣使奉迎[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]还都南京。行在的朝廷随之撤销，[ROOT.GetCountry.GetName]不再是明廷的所在，由[ROOT.GetCountry.GetRuler.GetFullName]主持国政。"
 nesnd_court_followup.21.d_refused:0 "[SCOPE.sCountry('nesnd_reunion_successor').GetName]拒绝迎回[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]。南京不承认行在的天子，行在的朝廷随之撤销。[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]降为明藩王，留居[ROOT.GetCountry.GetName]，由[ROOT.GetCountry.GetRuler.GetFullName]主持国政。"
 nesnd_court_followup.21.a:0 "知道了。"
 nesnd_court_followup.21.a_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]已迁往[SCOPE.sCountry('nesnd_reunion_successor').GetName]。我国不再是明廷行在。"
 nesnd_court_followup.21.b_tt:0 "[SCOPE.sCharacter('nesnd_reunion_emperor').GetFullName]已降为明藩王，作为贵族留居我国。我国不再是明廷行在。"
