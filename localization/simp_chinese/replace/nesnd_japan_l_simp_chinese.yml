 JTK: "扶国"
 JTK_ADJ: "扶国"
 JIM: "和国"
 JIM_ADJ: "和国"
 nesnd_toyotomi_sang: "桑国"
 nesnd_united_japan: "日本"
 nesnd_wu_eastern_question: "东洋之议"
 nesnd_wu_eastern_question_reason: "丰臣氏借明吴之力平定战国，又与郑氏一同争夺朝鲜。两家结盟数代，九州的驻军同日本诸侯早已利害相缠。如今南朝大局已定，朝中议起东征：调西军旧部渡海，在丰臣之外扶起天皇与德川，三家各领其土，九州、四国归吴朝直辖。远洋驻军和海上商路，都要跟着这次分封重新划分。"
 nesnd_wu_eastern_question_status: "南京正在议定对日条件。财政、陆军与海军三项准备中，至少两项就绪方可出兵。"
 nesnd_wu_eastern_question_status_offer: "使节已经渡海，回信未到。"
 nesnd_wu_eastern_question_status_war: "东征已进入[concept_diplomatic_play]或战争阶段。领土重组须由战争目标获准执行。"
 nesnd_japan_send_terms: "提出三家分封"
 nesnd_japan_send_terms_desc: "遣使赴日，提议由丰臣、德川与天皇三家各领其土。"
 nesnd_japan_send_terms_requirements: "吴、日两国均处于和平，未投入外交博弈，且彼此没有停战协定。日本须由丰臣、德川或大和家君主统治，独立或隶属吴朝，完整拥有京都、关东、关西和中国地区。扶国与和国尚未建立。"
 nesnd_japan_accept_status_quo: "维持东洋旧约"
 nesnd_japan_accept_status_quo_desc: "不动日本的政权和疆界。舰队和军饷，留给本土和别处的海外诸藩。"
 nesnd_japan_partition_tt: "#bold 日本的领土安排#!\n九州与四国的日本领地转交吴朝。德川据江户和北方诸领建立扶国，和国奉天皇统治京都与大阪。丰臣治关西余部、中国地区及原有朝鲜领地。扶、和成为吴朝保护国，丰臣原属国关系保留，原本独立时成为保护国。三家各自宣称由另两家完整控制的分封首府地区。#v EZO、琉球及其他外国领土不受转移。#!"
 nesnd_japan_war_tt: "日本若为吴朝属国，将脱离吴朝并进入[concept_diplomatic_play]。吴朝主张重组日本，日本则要求羞辱吴朝。#v 重组日本的战争目标获执行后，才会划分领土。#!"
 dp_nesnd_eastern_intervention: "东征日本"
 wg_nesnd_japan_reorganization: "重组日本诸藩"
 wg_nesnd_japan_reorganization_action_name: "重组日本诸藩"
 nesnd_japan_reunification: "天下之归"
 nesnd_japan_reunification_reason:0 "海峡两岸的盟约替丰臣扫平了诸侯，也把唐土朝廷请进了日本的继承、封地和征战。如今城下町的税赋流进各家的府库，军队和商人各认各的主子。[ROOT.GetCountry.GetName]要重建统一的政府，先得收拢本州，再把内外政务拿回自己手里。"
 nesnd_japan_reunification_status:0 "统一本州，确立自主的政府。"
 nesnd_japan_integrated: "天下一统"
 nesnd_japan.1.t: "海东封国"
 nesnd_japan.1.d: "南京使节带来了分封之议：京都与大阪奉天皇名位，德川以江户为府，丰臣领关西余部与中国地区，九州和四国归吴朝直辖。海东诸藩的兵马和赋税，从此要分给好几家。家臣把各地的兵数和军粮簿册摆到了[ROOT.GetCountry.GetRuler.GetFullName]面前。"
 nesnd_japan.1.a: "同意三家分封。"
 nesnd_japan.1.b: "日本之事，由日本决断。"
 nesnd_japan.1.c: "遣使南京，保留统一的日本。"
 nesnd_japan.2.t: "海东使者的答复"
 nesnd_japan.2.d: "日本使者不肯接受分封。要东征，就得筹饷、调船，扶着三家去接管海东诸藩；不然，就收回成命，让日本维持统一。使者的回书已经呈到[ROOT.GetCountry.GetRuler.GetFullName]案前。"
 nesnd_japan.2.a: "命舰队护送东征军。"
 nesnd_japan.2.b: "撤回分封之议。"
 nesnd_japan.3.t: "东洋四府"
 nesnd_japan.3.d: "日本的分封已经施行。丰臣治关西余部与中国地区，德川接掌江户及北方领地。京都与大阪奉天皇为和国君主。九州、四国归吴朝直辖。各政权接管辖地的税赋与军队。"
 nesnd_japan.3.a: "各府修治其政。"
 nesnd_japan.4.t: "东征罢议"
 nesnd_japan.4.d: "东征的战局已了，日本没有分成三家。舰队与驻军按现有疆界重新布防，军费和商路要一项一项交接。往后的东洋事务，照已生效的和约办理。"
 nesnd_japan.4.a: "按现约办理。"
 nesnd_japan.5.t: "天下归一"
 nesnd_japan.5.d: "本州终于归于一个独立的政府。[ROOT.GetCountry.GetName]接管了旧诸侯的赋税与军队，各自为政的领地开始遵行同一套法令。城下町的商人等着关卡和赋役重新议定，好把生意做到旧日的领界之外。"
 nesnd_japan.5.a: "休养民力，整顿邦国。"
 nesnd_wu_eastern_question_progress: "远征条件：#v [JournalEntry.GetGoalProgressValue|0] / [JournalEntry.GetGoalAddValue|0]#!"
 nesnd_japan_reunification_progress: "核心地区：#v [JournalEntry.GetGoalProgressValue|0] / [JournalEntry.GetGoalAddValue|0]#!"
 nesnd_japan_tokugawa_successor_name: "家亲"
 nesnd_japan_yamato_successor_name: "顺仁"
 nesnd_japan.2.d_commander: "日本使者不肯接受分封。[SCOPE.sCharacter('nesnd_japan_commander').GetFullName]已奉命筹划东征，旧西军的军官等着随主帅出海，舰队、军饷和诸藩援军都要南京调拨。打，还是收回分封之议？"
 dp_nesnd_eastern_intervention_desc: "吴朝要求以天皇、德川、丰臣及吴朝直辖领地重组日本。"
 dp_nesnd_eastern_intervention_tooltip: "#header $dp_nesnd_eastern_intervention$#!\n$dp_nesnd_eastern_intervention_desc$"
 war_goal_wg_nesnd_japan_reorganization: "重组日本诸藩"
 war_goal_wg_nesnd_japan_reorganization_desc: "$nesnd_japan_partition_tt$"
 nesnd_japan_reorganization:0 "日本军政整顿"
 nesnd_jp_mining:0 "山中的铁矿"
 nesnd_jp_mining_reason:0 "征税和征兵曾是武士的本分，开矿、办厂却要仰仗商人。北方的矿藏给江户带来了新的财源，也带来了旧军府不熟悉的合作者。那些不佩刀的人正在积累财富，并开始要求政府保护他们的生意。"
 nesnd_jp_arsenals:0 "兵工与船坞"
 nesnd_jp_arsenals_reason:0 "兵工厂和船坞把军费带进了城镇。承包商盼望长久的订单，军方则担心自己的装备受制于商人的价钱。工场越是兴旺，这场讨价还价就越难留在营门之外。"
 nesnd_jp_metal_cities:0 "城下町的变迁"
 nesnd_jp_metal_cities_reason:0 "城下町原本围着城郭与武士宅邸生长，如今来此谋生的人却越来越多。工人、学徒和小店主住进新街区，他们的孩子也要在这里读书。旧日替领主办事的城镇，正在长成有自己诉求的社会。"
 nesnd_jp_cash_crops:0 "棉田、桑园与茶山"
 nesnd_jp_cash_crops_reason:0 "海港把远方的价钱带到了乡间。棉田、桑园和茶山有了新的买主，土地所有者与商人都想从中分得更多。农民日复一日的劳作，也开始受到这些遥远市场的支配。"
 nesnd_jp_textiles:0 "机杼声中"
 nesnd_jp_textiles_reason:0 "收购生丝与棉花的商人开始把织工集中起来。熟悉的手艺搬进了更大的工场，雇工按时领钱，也得守工头的规矩。离开田地的人有了新的指望，商人则把乡村的生产攥得更紧了。"
 nesnd_jp_consumer_goods:0 "百姓的买卖"
 nesnd_jp_consumer_goods_reason:0 "食品、家具和日用器皿的生意，正从少数富户走进更多人家。开工场的人开始操心普通人的收入：顾客只够糊口，东西就卖不出去，价钱也抬不起来。"
 nesnd_jp_living_standards:0 "富足的生活"
 nesnd_jp_living_standards_reason:0 "进了工场的人，开始盘算房租、米价和孩子读书的钱。城里的劳力和税收出自他们，他们也要从繁荣里分到自己的一份。政府许下的新生活好不好，就看这几笔开销。"
 nesnd_jp_food_supply:0 "城市也要生活"
 nesnd_jp_food_supply_reason:0 "田里的收成、渔船和往来的粮商，养活着城里人。粮价一涨，街市上的怨声就传进了官署。运粮的人肯进城，城里人买得起饭，市面才安稳。"
 nesnd_jp_food_cities:0 "商都的成长"
 nesnd_jp_food_cities_reason:0 "粮商带来了买卖，工匠和学徒也跟着留下。新街区需要学校，官府与书商需要纸张。许多过去由乡里宗族包办的事情，开始交到城镇的机构手中。"
 nesnd_jp_food_processing:0 "粮食入市"
 nesnd_jp_food_processing_reason:0 "城镇要能存放、能远运的食品，粮商和渔商也在找收获季以外的买主。罐藏让他们能把收购、加工和运输连成一门生意。食品工场办起来，雇工也不会一过收获季就丢了活计。"
 nesnd_jp_living_year:0 "已连续 #v 12#! 个月达到生活水平、学校和城市目标"
 nesnd_jp_metal_foundries:0 "金属工业扩张"
 nesnd_jp_arsenal_towns:0 "兵工与船业繁荣"
 nesnd_jp_industrial_cities:0 "工业城市兴盛"
 nesnd_jp_cash_crop_trade:0 "经济作物兴盛"
 nesnd_jp_textile_trade:0 "纺织业兴盛"
 nesnd_jp_consumer_trade:0 "日用工业兴盛"
 nesnd_jp_towns_prosper:0 "富足的城镇"
 nesnd_jp_rural_markets:0 "农渔业兴旺"
 nesnd_jp_growing_cities:0 "城市扩展"
 nesnd_jp_food_exports:0 "食品加工业兴盛"
 nesnd_jp_cohesion:0 "国民团结"
 nesnd_jp_cohesion_reason:0 "幕府治下的诸藩、乡间的宗族、城下町的商人，从前各管一方。如今学校和官府把远近各地连到一处，工商业又把更多人的生计拴在一起。日子过得安不安稳，打起仗来国家护不护得住他们，百姓都看在眼里。"
 nesnd_jp_cohesion_bar_name:0 "国民团结"
 nesnd_jp_cohesion_bar_desc:0 "$nesnd_jp_cohesion_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_jp_cohesion_order_desc:0 "政府威信"
 nesnd_jp_cohesion_living_desc:0 "民生与财政"
 nesnd_jp_cohesion_learning_desc:0 "学校与行政"
 nesnd_jp_cohesion_conflict_desc:0 "内忧与外患"
 nesnd_jp_cohesion_victory_desc:0 "战争胜负"
 nesnd_jp_cohesion_doubt:0 "民众对政府失去信任，地方分歧正在扩大。\n每月随机选取本国一州的一个主流文化[concept_pop]，使其中#v 25%#!的人口转向[GetCulture('han').GetName]或[GetCulture('ce_wuu').GetName]文化，两者机会相同。"
 nesnd_jp_cohesion_doubt_jiangnan:0 "民众对政府失去信任，地方分歧正在扩大。\n每月随机选取本国一州中尚未采用[GetCulture('japanese').GetName]文化的一个主流文化[concept_pop]，使其中#v 25%#!的人口转向这一文化。"
 nesnd_jp_cohesion_calm:0 "各地仍能维持共同的秩序。"
 nesnd_jp_cohesion_confident:0 "国民对共同前途的信心正在促进文化融合。\n每月有 #v 30%#! 的概率，在一个合格的本国[concept_state]中，使至多相当于该州总人口 #v 10%#! 的人口同化为[GetCulture('japanese').GetName]文化。宗教不变。"
 nesnd_jp_cohesion_confident_jiangnan:0 "国民对共同前途的信心正在促进文化融合。\n每月有 #v 30%#! 的概率，在一个合格的本国[concept_state]中，使至多相当于该州总人口 #v 10%#! 的人口同化为[GetCulture('ce_wuu').GetName]文化。宗教不变。"
 nesnd_jp_divided_councils:0 "人心离散"
 nesnd_jp_politics:0 "国政之争"
 nesnd_jp_politics_reason:0 "丰臣氏平定日本以后，以吴主之助北征朝鲜，东勘藩土。终于凭借明国朝廷、本部兵马和大阪的票号支撑起太阁幕府的统治。如今新的财源和学问松动了旧日的权力，商人、军官和读书人都想在国事上说话。任官、军队和法令的争论，最后争的是政府的主导权。"
 nesnd_jp_court_reform:0 "君主与新政"
 nesnd_jp_court_reform_reason:0 "旧臣们希望新政仍以君主的名义推行。商人和新学出身的官员则要求法令保障，免受临时征敛与地方势力的摆布。王朝的名义能把这些人召到一处，可各人的权利，还得一条一条重新划。"
 nesnd_jp_military_reform:0 "军府的新秩序"
 nesnd_jp_military_reform_reason:0 "军官们把军队视为国家最可靠的支柱。他们要求将征募、训练与军需交给统一的指挥，使地方的兵力能够供国家调度。兵工厂和工具厂将为这支军队提供装备，集中的政令则让军府有机会把自己的主张推行到各地。"
 nesnd_jp_representative_reform:0 "国人议政"
 nesnd_jp_representative_reform_reason:0 "读书人讨论国政，商人关心税赋，地方居民也希望有人替自己说话。代议派要把这些议论带进议会，以选举决定代表，以公开辩论约束执政者。教育的普及将使更多国人能够读懂法令、参与公共事务。"
 nesnd_jp_nation:0 "自主之国"
 nesnd_jp_nation_reason:0 "独立时许下的诺言，如今要一笔一笔兑现。军费谁出，关税谁定，地方能管到哪一步，都还没有说法。出过钱的和出过力的，都在新国家里等着自己的位子。"
 nesnd_jp_new_army:0 "整顿国军"
 nesnd_jp_new_army_reason:0 "旧日军队靠世袭武士和地方关系撑着，征募与操练各家各有规矩。国家要的是有组织的兵员、受过训练的军官、听统一调度的部队。"
 nesnd_jp_open_diplomacy:0 "与诸国往来"
 nesnd_jp_open_diplomacy_reason:0 "过去朝贡和海禁把外交、通商都绑在宗主的安排里。如今我们要以本国的名义派商船、开港口，同各国谈各自的利益。"
 nesnd_jp_open_ports:0 "重开海门"
 nesnd_jp_open_ports_reason:0 "日本的海外买卖，长年困在少数口岸和严密的禁令里。商人想取得远方的原料，也想把本国的出产卖到更远的市场。靠旧禁令吃饭的人，不会轻易让出口岸。"
 nesnd_jp_islands:0 "九州与四国"
 nesnd_jp_islands_reason:0 "本州已经统一，九州与四国却还没有全部收回。两岛的港口和海路，是日本南部贸易与防务的门户。"
 nesnd_jp_choose_court:0 "以君主统合新政"
 nesnd_jp_choose_court_desc:0 "王朝的名义能把旧臣和改制派召到一处。君主照旧在位，新官员照样任用，议政与实业都替国家出力。\n\n选定后 #v 12#! 个月内不能改换方针。改换方针将清空已有改革进度。"
 nesnd_jp_choose_military:0 "支持军府整顿"
 nesnd_jp_choose_military_desc:0 "军队要统一指挥，政令要贯彻到底。让军官们整顿兵制与军需，把各地的人力财力收来充实国防。\n\n选定后 #v 12#! 个月内不能改换方针。改换方针将清空已有改革进度。"
 nesnd_jp_choose_representative:0 "扩张代议政治"
 nesnd_jp_choose_representative_desc:0 "纳税的、服役的、谋生的，国事桩桩件件都落在他们身上。让更多代表进议场，官员就得当众答辩，国民也能用选票说话。\n\n选定后 #v 12#! 个月内不能改换方针。改换方针将清空已有改革进度。"
 nesnd_jp_advance_reform:0 "资助新政"
 nesnd_jp_advance_reform_desc:0 "拨款支持主张改制的人士，让他们的议论更快成为国家的法令。"
 nesnd_jp_abandon_reform:0 "搁置新政"
 nesnd_jp_abandon_reform_desc:0 "撤回当前改革方针，结束政府为新政进行的动员。改革进度归零，#v 24#! 个月内不能重新提出改革。已有法律和建设保留。"
 nesnd_jp_mercantile_ports:0 "重商开港"
 nesnd_jp_mercantile_ports_desc:0 "准许商人经营海外买卖，以关税维护国家的收入和本国商业的地位。"
 nesnd_jp_protected_ports:0 "保护主义开港"
 nesnd_jp_protected_ports_desc:0 "开放海路，让工场取得所需的原料，再以关税扶持本国生产者在新市场中的地位。"
 nesnd_jp_islands_settlement:0 "接受现有边界"
 nesnd_jp_islands_settlement_desc:0 "放弃对九州与四国的领土要求，承认目前的疆界。"
 nesnd_jp_court_policy:0 "以君主名义推行宪政改革。"
 nesnd_jp_military_policy:0 "集中政令，整顿军制与军需。"
 nesnd_jp_representative_policy:0 "扩大代议，保障公开议政。"
 nesnd_jp_unsettled_policy:0 "政府尚未决定改革的方向。"
 nesnd_jp_nation_subject:0 "国家重归藩属，对外事务受宗主约束。"
 nesnd_jp_nation_independent:0 "国家可以自主处理内外事务。"
 nesnd_jp_reform_settled:0 "改革进度已满，所选新政已持续落实 #v 12#! 个月"
 nesnd_jp_nation_complete:0 "产业、军制与外交建设均已完成，且国家已连续保持独立 #v 12#! 个月"
 nesnd_jp_political_bar_name:0 "新政推行"
 nesnd_jp_nation_bar_name:0 "国家建设"
 nesnd_jp_political_bar_desc:0 "$nesnd_jp_political_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_jp_nation_bar_desc:0 "$nesnd_jp_nation_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
