 nesnd_jp_home_waters:0 "九州与四国归统"
 nesnd_jp_opening_dispute:0 "开港之议"
 nesnd_jp_development.1.t:0 "独立的根基"
 nesnd_jp_development.1.d:0 "各国使节如今直接同我们的政府交涉。过去借宗主之手维持的军政与海上往来，已经有了本国自己的制度。\n\n当年支持独立的商人和地方人士并未因此退出国事。他们带着新的请愿来到政府面前，要求它兑现曾经许下的承诺。"
 nesnd_jp_development.1.a:0 "国事当由国人自决。"
 nesnd_jp_development.2.t:0 "新政立定"
 nesnd_jp_development.2.d:0 "新的任官制度已在各地施行。旧日由门第决定的官职，如今须按法令授任，各级官员的职权也有了明文规定。改制之议由此成为地方官署日常奉行的制度。"
 nesnd_jp_development.2.a:0 "使新法行之久远。"
 nesnd_jp_foreign:0 "东洋交涉"
 nesnd_jp_foreign_reason:0 "大陆朝廷的援军曾帮助丰臣平定日本，朝贡与海上贸易也由此同列岛的政治纠缠在一起。我们所争取的自主权，关系着宗主的收入、海防和对日本的控制。即使旧约解除，这些利益也不会随之消失。"
 nesnd_jp_korea:0 "海峡彼岸"
 nesnd_jp_korea_reason:0 "朝鲜南部的煤矿和港口支撑着跨海的商业。当地商人需要这些航路，地方士人却不愿把民政全交给海峡对岸的官员。乡里最常争论的，往往是下一笔税款归谁处置。"
 nesnd_jp_envoy_away:0 "使者正在等待对方的答复。"
 nesnd_jp_envoy_rest:0 "使团尚未整顿完毕。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_subject_treaties:0 "本国仍受宗主约束，可以就自主权与建设寻求交涉。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_independent_treaties:0 "本国可以自行寻求外援与合邦。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_korea_across_the_strait:0 "本国已失去在庆尚道和全罗道的最后一块属地。"
 nesnd_jp_korea_governors_status:0 "总督正在核定税册。连续达标 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_jp_korea_months')|0]/12#! 个月，满一年可呈交税册。"
 nesnd_jp_korea_councils_status:0 "议事会正在筹办地方学务。连续达标 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_jp_korea_months')|0]/12#! 个月，满一年可议定学款。"
 nesnd_jp_korea_undecided:0 "委派总督清查税册，或让地方议事会掌管学务。独立后，也可在「东洋交涉」遣使归还属地。"
 nesnd_jp_seek_autonomy:0 "争取更多自主"
 nesnd_jp_seek_autonomy_desc:0 "本国拟请宗主扩大地方政府自行处理内政的权限，并提议双方缔结为期 #v 5#! 年的停战协定。"
 nesnd_jp_seek_independence:0 "商议独立"
 nesnd_jp_seek_independence_desc:0 "本国要求宗主承认独立，愿与宗主缔结 #v 5#! 年停战协定。"
 nesnd_jp_seek_reform_permission:0 "请求改制许可"
 nesnd_jp_seek_reform_permission_desc:0 "请宗主认可本国的制度改革，让我们能够自行筹划官员任用、军政与议政的安排。"
 nesnd_jp_seek_union_permission:0 "请求合邦许可"
 nesnd_jp_seek_union_permission_desc:0 "请宗主允许我们同其他日本属国商议归并，由愿意合邦的双方共同结束分立。"
 nesnd_jp_seek_overlord_capital:0 "向宗主请求建设资金"
 nesnd_jp_seek_overlord_capital_desc:0 "请求宗主拨款兴办工场、训练工匠。自获款之日起，本国 #v 3#! 年内不再申请同类资助。"
 nesnd_jp_seek_capital_cne:0 "向北朝寻求资金"
 nesnd_jp_seek_capital_cne_desc:0 "本国拟邀请北朝资助工场建设。若此次拨款获准，今后 #v 3#! 年内不再申请同类资助。"
 nesnd_jp_seek_capital_hus:0 "向东洲寻求资金"
 nesnd_jp_seek_capital_hus_desc:0 "本国拟向东洲申请工场建设经费，以扩充两国的工业品贸易，获款后 #v 3#! 年内不再申请同类资助。"
 nesnd_jp_seek_capital_usm:0 "向[SCOPE.sCountry('nesnd_label_usm').GetName]寻求资金"
 nesnd_jp_seek_capital_usm_desc:0 "[SCOPE.sCountry('nesnd_label_usm').GetName]与日本素有通商往来。本国拟请其出资兴办工场、培养工匠，并承诺自获款之日起 #v 3#! 年内不再申请同类资助。"
 nesnd_jp_independence_play:0 "独立最后通牒"
 nesnd_jp_independence_play_desc:0 "向宗主发出要求承认本国独立的最后通牒。在这场[concept_diplomatic_play]中，本国将保留诉诸武力的权利。"
 nesnd_jp_union_jap:0 "请[SCOPE.sCountry('nesnd_label_jap').GetName]归统"
 nesnd_jp_union_jap_desc:0 "向[SCOPE.sCountry('nesnd_label_jap').GetName]提出合邦，请其接受本国政府的统一管辖。"
 nesnd_jp_union_jtk:0 "请[SCOPE.sCountry('nesnd_label_jtk').GetName]归统"
 nesnd_jp_union_jtk_desc:0 "向[SCOPE.sCountry('nesnd_label_jtk').GetName]提出合邦，请其接受本国政府的统一管辖。"
 nesnd_jp_union_jim:0 "请[SCOPE.sCountry('nesnd_label_jim').GetName]归统"
 nesnd_jp_union_jim_desc:0 "向[SCOPE.sCountry('nesnd_label_jim').GetName]提出合邦，请其接受本国政府的统一管辖。"
 nesnd_jp_korean_governor:0 "委派总督"
 nesnd_jp_korean_governor_desc:0 "港商的货单、乡里的田契，都得在总督的税册上对得起来。"
 nesnd_jp_korean_councils:0 "设立地方议事会"
 nesnd_jp_korean_councils_desc:0 "地方士人肯为学校筹款，也要在定学款的席上占一席。"
 nesnd_jp_korean_envoy:0 "交涉朝鲜归属"
 nesnd_jp_korean_envoy_desc:0 "本国拟将庆尚道和全罗道的属地归还朝鲜，并撤销对两地的宣称。朝鲜若有宗主，此议须由宗主答复。"
 nesnd_jp_foreign_workshops:0 "海外建设资助"
 nesnd_jp_korea_governor:0 "总督辖治"
 nesnd_jp_korea_councils:0 "地方议事会"
 nesnd_jp_korea_administration:0 "朝鲜行政开支"
 nesnd_jp_korea_handover:0 "原有的对朝交涉已中止，属地章程停止审议。"
 nesnd_jp_korea_land_tt:0 "本国在庆尚道或全罗道持有属地"
 nesnd_jp_korea_envoy_free_tt:0 "本国没有尚待答复的外交请求"
 nesnd_jp_korea_envoy_wait_tt:0 "过去 #v 6#! 个月内未派遣使团"
 nesnd_jp_korea_home_tt:0 "归还属地后，本国仍有领土"
 nesnd_jp_korea_counterpart_tt:0 "朝鲜仍存续，半岛上没有进行中的朝鲜重建运动"
 nesnd_jp_korea_open_tt:0 "本国尚未核准属地章程，也未议定归还属地"
 nesnd_jp_korea_control_tt:0 "本国在庆尚道和全罗道的所有州块均由本国控制"
 nesnd_jp_korea_order_tt:0 "上述每一处属地的动乱均低于 #v 25%#!"
 nesnd_jp_korea_offices_tt:0 "每处属地均有至少 #v 2#! 级的政府行政机构，且岗位填补率至少 #v 50%#!"
 nesnd_jp_korea_college_tt:0 "至少一处属地有大学，且岗位填补率至少 #v 50%#!"
 nesnd_jp_korea_choose_governor_tt:0 "属地尚未实行总督辖治"
 nesnd_jp_korea_choose_councils_tt:0 "属地尚未设立地方议事会"
 nesnd_jp_korea_wait_tt:0 "过去 #v 24#! 个月内未改定治理方针"
 nesnd_jp_korea_current_tt:0 "这是属地现行的治理方针。"
 nesnd_jp_korea_switch_tt:0 "采用后 #v 24#! 个月内不能改换方针，连续达标月数从零起算。"
 nesnd_jp_korea_remaining_tt:0 "距可改换治理方针约 #v [Divide_CFixedPoint(IntToFixedPoint(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_jp_korea_policy_cooldown')), '(CFixedPoint)30')|1]#! 个月。"
 nesnd_jp_korea_governor_terms:0 "属地征税能力 #g +15%#!，动乱的影响 #r +10%#!，全国政府工资开支 #r +5%#!。扩充当地政府行政机构，满足「呈交税册」的条件。"
 nesnd_jp_korea_councils_terms:0 "属地教育机会 #g +10#! 个百分点，动乱的影响 #g −10%#!，征税能力 #r −10%#!，全国政府工资开支 #r +5%#!。投资教育机构，在属地办大学，满足「议定学款」的条件。"
 nesnd_jp_korea_year_tt:0 "上述条件须连续满足 #v 12#! 次月检（当前 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_jp_korea_months')|0]/12#!）。月检未通过即从零重计。"
 nesnd_jp_register_korea:0 "呈交税册"
 nesnd_jp_register_korea_desc:0 "让各地税吏在册尾署名。哪一笔收了两回，就找哪一个人。"
 nesnd_jp_endow_korea:0 "议定学款"
 nesnd_jp_endow_korea_desc:0 "请各地代表核定教习的薪俸，把款项和领款人的姓名一道张榜。"
 nesnd_jp_register_korea_reward:0 "核准总督章程，结束「海峡彼岸」。现有属地另获 #v 3#! 年「税册定本」，征税能力 #g +10%#!。总督留任，行政开支照付。"
 nesnd_jp_endow_korea_reward:0 "核准议事会章程，结束「海峡彼岸」。现有属地另获 #v 3#! 年「地方学款」，教育机会 #g +5#! 个百分点。议事会留任，行政开支照付。"
 nesnd_jp_korea_tax_rolls:0 "税册定本"
 nesnd_jp_korea_school_fund:0 "地方学款"
 nesnd_jp_korea_charter_header:0 "核准属地章程"
 nesnd_jp_korea_charter_tt:0 "本国已呈交税册或议定学款，正式核准属地章程"
 nesnd_jp_korea_charter_conclusion:0 "属地已有定章，原有税务与民政安排继续施行。独立后仍可在「东洋交涉」商议归还。"
 nesnd_jp_korea_treaty_header:0 "交涉归还"
 nesnd_jp_korea_treaty_tt:0 "独立后由「东洋交涉」遣使，朝鲜或其宗主已同意接收属地"
 nesnd_jp_korea_no_land_tt:0 "本国在庆尚道与全罗道已无属地"
 nesnd_jp_korea_treaty_conclusion:0 "庆尚道与全罗道的属地已依约移交朝鲜。"
 nesnd_jp_korea_exit_header:0 "终止议章"
 nesnd_jp_korea_exit_effect_header:0 "属地事务"
 nesnd_jp_korea_exit_tt:0 "本国失去最后一处属地，或朝鲜亡国，或朝鲜重建运动已经开启"
 nesnd_jp_korea_exit_conclusion:0 "属地章程停止审议。朝鲜亡国后，半岛若兴起重建运动，持地各国将共同应对。"
 nesnd_jp_coast.1.t:0 "税册定本"
 nesnd_jp_coast.1.d:0 "总督让各地税吏把过去一年的收据也送来。一个船户在渡口纳过税，进城又被收了一遍，偏偏两张收据上都有印。税吏们原想删掉一张，好让账目相合。船户坚持把两张都订进册子，往后收第二遍的人须在他眼前签名。总督照准了。"
 nesnd_jp_coast.1.a:0 "两张都留着。"
 nesnd_jp_coast.2.t:0 "学款公议"
 nesnd_jp_coast.2.d:0 "议事会头一回公开议学款，教习的薪俸才念过，后排便有人问，渡口那头的孩子也得过河来听课么？一名船主愿意早晚各渡一班，把船钱列入学款。书记摊开簿子，请他报个价。旁边另一名船主举起了手。"
 nesnd_jp_coast.2.a:0 "把两家的价钱都记下来。"
 nesnd_jp_foreign.1.t:0 "来自[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者"
 nesnd_jp_foreign.1.d1:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]请求扩大自治权，将部分须经宗主核准的内政事务交由本国政府裁决。"
 nesnd_jp_foreign.1.d2:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者要求解除宗藩关系，由本国政府独立行使外交、军事与通商权。"
 nesnd_jp_foreign.1.d3:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]希望改造国内的官员任用、军政与议政制度。使者前来寻求我们的认可，以便政府能够召集支持者、推行新政。原有的宗属关系仍将保留。"
 nesnd_jp_foreign.1.d4:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]请求我国拨款，协助扩建当地工场并培养熟练工匠。"
 nesnd_jp_foreign.1.d5:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]提出就朝鲜南部的领土问题达成和解。他们愿意放弃对釜山与两湖的宣称，并将本国仍持有的当地领土移交朝鲜。使者要求我们接受这一安排，结束这项长期争端。"
 nesnd_jp_foreign.1.d6:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]请求我们承认其政府主持日本的统一，并将本国领土交由对方统治。接受这份盟约，便是结束本国的单独存在。"
 nesnd_jp_foreign.1.d7:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]请求宗主授权其与其他日本属国商议合邦。各国是否加入，仍须分别取得其政府的同意。"
 nesnd_jp_foreign.1.d:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者已经抵达，带来了有关两国关系的提议。他们正在等待我们的答复。"
 nesnd_jp_foreign.1.a:0 "同意所议。"
 nesnd_jp_foreign.1.b:0 "我们不接受这些条件。"
 nesnd_jp_foreign.2.t:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的答复"
 nesnd_jp_foreign.3.t:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的答复"
 nesnd_jp_foreign.2.d:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]已复函接受我方提议。"
 nesnd_jp_foreign.2.a:0 "就按商定的办法办理。"
 nesnd_jp_foreign.3.d:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]拒绝了使者带去的条件。我们未能说服对方让步，这次交涉也使两国的关系更为紧张。"
 nesnd_jp_foreign.3.a:0 "只得另作打算。"
 nesnd_jp_toyotomi_court_name:0 "秀隆"
 nesnd_jp_development.2.d_court:0 "朝廷以新法确认了议政与任官的办法。旧臣仍在君主身边，地方官署却开始接纳另一批熟悉实务的人。\n\n拥护王朝的改制派认为，这些让步足以使君主制延续下去。至于取得议政权的人们会不会满足，朝廷眼下还没有答案。"
 nesnd_jp_development.2.d_military:0 "主张集权的军官终于让自己的办法成为国策。征募、训练和军需被纳入统一调度，地方官员也须执行中央的命令。兵工厂与工具厂为扩充后的军队提供装备，军府由此取得了在各地贯彻政令的力量。"
 nesnd_jp_development.2.d_representative:0 "取得选举权的国民已经开始推举代表，报刊也能公开评论政府的施政。过去限于少数家族之间的政治争议，如今可以提交议会审议。随着新式学校日渐普及，能够阅读法案、参与公共讨论的人也在增多。"
 nesnd_jp_sovereign_year:0 "已连续保持独立 #v 12#! 个月"
 nesnd_jp_establish_edo:0 "江户的军府"
 nesnd_jp_establish_edo_reason:0 "江户如今统辖大片北方领地。守备各处要道所需的军饷，须由各地征收的赋税维持。军府若要按期供饷，便须任用地方官员，查明各领的岁入与支出，并在城下町建立常设官署。"
 nesnd_jp_establish_kyoto:0 "京都与大阪"
 nesnd_jp_establish_kyoto_reason:0 "京都公卿奉天皇主持朝政，大阪商人掌握着新朝赖以维持的商业财源。两地同属一个政权，驻军与官署的开支也须在同一财政制度下筹措。朝廷眼下需要的是熟悉大阪商情、能与商人议定征税办法的官员。"
 nesnd_jp_establish_toyotomi:0 "桑国的旧臣"
 nesnd_jp_establish_toyotomi_reason:0 "分封之后，丰臣氏向诸藩征调兵赋的旧权已随领土一并缩减，西部诸领仍要供养军队与家臣。厘定各领的税额，任用负责征收的地方官员，是丰臣旧臣眼下必须议定的政务。"
 nesnd_jp_establishment_required_tt:0 "本国已能自行维持地方政务。"
 nesnd_jp_independence_cooldown_tt:0 "距上次发起独立博弈已满六个月。"
 nesnd_jp_settled_administration:0 "地方政务初定"
 nesnd_jp_union_permission_required_tt:0 "宗主已经同意本国合并日本诸政权。"
 nesnd_jp_foreign.2.d1:0 "宗主已同意扩大本国政府的自治权限。双方同时订立停战协定，期限为五年。"
 nesnd_jp_foreign.2.d2:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]已经承认本国独立。宗属关系就此解除，双方议定休兵五年。今后的内外事务，将由本国政府自行决定。"
 nesnd_jp_foreign.2.d3:0 "宗主同意本国推行新政。政府可以开始筹划任官、军政与议政制度的改革，原有的宗属关系仍然保留。"
 nesnd_jp_foreign.2.d4:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]已同意拨付工场建设经费，并资助本国训练工匠。此次拨款获准后，本国三年内不得再申请同类援助。"
 nesnd_jp_foreign.2.d5:0 "对方接受了朝鲜和解方案。本国对釜山与两湖的宣称已经撤回，两地尚在本国掌握中的领土也已依约移交朝鲜。海峡两岸的关系将依新的边界继续经营。"
 nesnd_jp_foreign.2.d7:0 "宗主允许本国与其他日本属国商议合邦。使者可以带着这份许可前去交涉，受邀国家仍须自行同意归并。"
 nesnd_japan_unification_bar_name:0 "日本核心地区"
 nesnd_japan_unification_bar_desc:0 "$nesnd_japan_unification_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 7#!"
 nesnd_japan_unification_bar_change:0 "领土变化"

 nesnd_japan_force_ready_tt:0 "陆、海军投射均非零，并至少满足以下两项。\n#v 财政#!　周收支与行政力非负。\n#v 陆军#!　合法性至少为50，陆军投射不低于日本。\n#v 海军#!　军舰维护满足率至少为90%，海军投射不低于日本。"
 nesnd_jp_culture_preview_state:0 "\n下月，[ROOT.GetCountry.MakeScope.Var('nesnd_jp_next_state').GetState.GetName]的部分居民预计将转向[ROOT.GetCountry.MakeScope.Var('nesnd_jp_next_target').GetCulture.GetName]文化。"
 nesnd_jp_culture_preview_none:0 "\n下月暂无预计发生文化转变的州。"

 nesnd_jp_policy_other:0 "选择另一项方针；当前方针已在实行"
 nesnd_jp_policy_date:0 "已到1840年，或日本已经分封"
 nesnd_jp_policy_wait:0 "距可改换方针还有约 #v [Divide_CFixedPoint(IntToFixedPoint(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_jp_policy_cooldown')), '(CFixedPoint)30')|1]#! 个月；改换将清空改革进度"
 nesnd_jp_policy_unlocked:0 "可以改换方针；改换将清空改革进度及连续落实月份，并重新锁定 #v 12#! 个月。"
 nesnd_jp_policy_cost:0 "选择或改换支付 #v £[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_jp_negotiation_cost')|0]#!，撤去旧方针修正，改革进度及连续落实月份归零；#v 12#! 个月内不能改换。"
 nesnd_jp_policy_court_current:0 "当前方针：君主统合新政。"
 nesnd_jp_policy_court_choose:0 "采用君主统合新政：立法速度+10%，地主赞同−2，知识分子赞同+1。"
 nesnd_jp_policy_court_next:0 "推进“君主与新政”：保留君主制，任命官僚，实行财富、财产或普选，学校机构达到2级，并修建所需铁路。 达标后每月+2.5；进度达到100且全部条件连续保持12个月，新政完成。"
 nesnd_jp_policy_military_current:0 "当前方针：军府整顿。"
 nesnd_jp_policy_military_choose:0 "采用军府整顿：立法速度+10%，地主赞同−2，军队赞同+1，知识分子赞同−1。"
 nesnd_jp_policy_military_next:0 "推进“军府的新秩序”：任命官僚，实行独裁或寡头制，完成军制整顿及枪械厂、工具厂建设。 达标后每月+2.5；进度达到100且全部条件连续保持12个月，新政完成。"
 nesnd_jp_policy_representative_current:0 "当前方针：代议政治。"
 nesnd_jp_policy_representative_choose:0 "采用代议政治：立法速度+10%，地主赞同−2，军队赞同−1，实业家赞同+1。"
 nesnd_jp_policy_representative_next:0 "推进“国人议政”：实行财产或普选，保障集会或言论自由，任命或选举官僚，学校机构达到2级，识字率达到40%。 达标后每月+2.5；进度达到100且全部条件连续保持12个月，新政完成。"
 nesnd_jp_political_war_desc:0 "战争阻力"
 nesnd_jp_political_radicals_desc:0 "激进情绪"
 nesnd_jp_policy_country:0 "本国是丰臣、德川或天皇政权之一"
 nesnd_jp_policy_access:0 "尚未完成新政，未处于改革挫折期；丰臣政权尚未分封，或本国已独立、获准改革、开始推行新政"
 nesnd_jp_policy_failure:0 "推行君主方针期间废除了君主制"
