 nesnd_jp_opening_dispute:0 "开港之议"
 nesnd_jp_development.1.t:0 "独立的根基"
 nesnd_jp_development.1.d:0 "各国使节如今直接来同我们的政府打交道。从前借宗主之手办理的军政和海上往来，都有了本国自己的章程。\n\n当年支持独立的商人和地方人士没有就此散去。他们带着新的请愿书找上门来，要政府兑现当初的诺言。"
 nesnd_jp_development.1.a:0 "国事当由国人自决。"
 nesnd_jp_development.2.t:0 "新政立定"
 nesnd_jp_development.2.d:0 "新的任官办法推行开了，法令也重划了各阶层手里的权力。从前凭门第把持地方的人，如今得按政府定下的职位和权限办事。参与改制的官员、军人和商人，则在新秩序里找自己的位子。"
 nesnd_jp_development.2.a:0 "使新法行之久远。"
 nesnd_jp_foreign:0 "东洋交涉"
 nesnd_jp_foreign_reason:0 "大陆朝廷的援军帮丰臣平定了日本，朝贡和海上贸易也从此同列岛的政治缠在一起。我们每多争一分自主，宗主就少一分收入、海防和对日本的掌控。旧约解了，这些利益也不会跟着消失。"
 nesnd_jp_korea:0 "海峡彼岸"
 nesnd_jp_korea_reason:0 "朝鲜南部的煤矿和港口支撑着跨海的商业。当地商人需要这些航路，地方士人却不愿把民政全交给海峡对岸的官员。乡里最常争论的，往往是下一笔税款归谁处置。"
 nesnd_jp_envoy_away:0 "使者正在等待对方的答复。"
 nesnd_jp_envoy_rest:0 "使团尚未整顿完毕。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_subject_treaties:0 "本国仍受宗主约束，可以就自主权与建设寻求交涉。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_independent_treaties:0 "本国可以自行寻求外援与合邦。两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_korea_across_the_strait:0 "朝鲜的领土争议仍待交涉。"
 nesnd_jp_korea_governors_status:0 "朝鲜属地的税务与民政由总督集中处理。"
 nesnd_jp_korea_councils_status:0 "当地议事会参与民政与教育。"
 nesnd_jp_korea_undecided:0 "政府尚未确定朝鲜属地的治理办法。"
 nesnd_jp_seek_autonomy:0 "争取更多自主"
 nesnd_jp_seek_autonomy_desc:0 "请求宗主放宽对本国的约束，将现有宗属关系提升一个自治等级。\n\n若获同意，双方将有 #v 5#! 年停战期。"
 nesnd_jp_seek_independence:0 "商议独立"
 nesnd_jp_seek_independence_desc:0 "要求宗主解除藩属关系，让本国自行处理内外事务。\n\n若获同意，双方将有 #v 5#! 年停战期。"
 nesnd_jp_seek_reform_permission:0 "请求改制许可"
 nesnd_jp_seek_reform_permission_desc:0 "请宗主认可本国的制度改革，让我们能够自行筹划官员任用、军政与议政的安排。"
 nesnd_jp_seek_union_permission:0 "请求合邦许可"
 nesnd_jp_seek_union_permission_desc:0 "请宗主允许我们同其他日本属国商议归并，由愿意合邦的双方共同结束分立。"
 nesnd_jp_seek_overlord_capital:0 "向宗主请求建设资金"
 nesnd_jp_seek_overlord_capital_desc:0 "请求宗主拨款兴办工场、培养熟练工匠，使本国的生产能够成长。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_seek_capital_cne:0 "向北朝寻求资金"
 nesnd_jp_seek_capital_cne_desc:0 "拿工商合作作引子，请北朝出钱帮日本建厂。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_seek_capital_hus:0 "向东洲寻求资金"
 nesnd_jp_seek_capital_hus_desc:0 "以通商和办厂为由，请东洲拿出一笔建厂的钱。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_seek_capital_usm:0 "向南朝寻求资金"
 nesnd_jp_seek_capital_usm_desc:0 "南朝同日本做了多年生意。循着这些老关系去讨一笔资助，给本国工场筹本钱、带工匠。\n\n获准后，#v 3#! 年内不能再次获得这项资助。"
 nesnd_jp_independence_play:0 "独立最后通牒"
 nesnd_jp_independence_play_desc:0 "向宗主提出独立的最后通牒，发起独立[concept_diplomatic_play]，准备以战争迫使其接受。"
 nesnd_jp_union_jap:0 "请$JAP$归统"
 nesnd_jp_union_jap_desc:0 "向$JAP$提出合邦。对方若同意，其国家将并入本国，由我们的政府统辖。"
 nesnd_jp_union_jtk:0 "请$JTK$归统"
 nesnd_jp_union_jtk_desc:0 "向$JTK$提出合邦。对方若同意，其国家将并入本国，由我们的政府统辖。"
 nesnd_jp_union_jim:0 "请$JIM$归统"
 nesnd_jp_union_jim_desc:0 "向$JIM$提出合邦。对方若同意，其国家将并入本国，由我们的政府统辖。"
 nesnd_jp_korean_governor:0 "委派总督"
 nesnd_jp_korean_governor_desc:0 "任用总督，将朝鲜属地的税务与民政集中起来，使政府能够更直接地掌握当地的收入与事务。\n\n此后 #v 24#! 个月内不能改换朝鲜治理方针。"
 nesnd_jp_korean_councils:0 "设立地方议事会"
 nesnd_jp_korean_councils_desc:0 "让当地议事会参与民政、兴办学校，以地方人士的合作缓和居民对统治的抵触。\n\n此后 #v 24#! 个月内不能改换朝鲜治理方针。"
 nesnd_jp_korean_envoy:0 "交涉朝鲜归属"
 nesnd_jp_korean_envoy_desc:0 "向朝鲜或其宗主提出和解。对方若同意，我们将把本国在釜山与两湖的领土移交朝鲜，并放弃对这两个地区的宣称。\n\n两次遣使须相隔 #v 6#! 个月。"
 nesnd_jp_foreign_workshops:0 "海外建设资助"
 nesnd_jp_korea_governor:0 "总督辖治"
 nesnd_jp_korea_councils:0 "地方议事会"
 nesnd_jp_korea_administration:0 "朝鲜行政开支"
 nesnd_jp_foreign.1.t:0 "来自[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者"
 nesnd_jp_foreign.1.d1:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]想多管一些自己的国事，请我们放宽宗属关系的约束。使者说，多些自主，他们处理国内的事就不必事事等候批复，两国的联系照旧。"
 nesnd_jp_foreign.1.d2:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者要求结束藩属关系。从今往后，外交、军队和通商都由他们自己作主，同我们以独立国家相待。"
 nesnd_jp_foreign.1.d3:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]希望改造国内的官员任用、军政与议政制度。使者前来寻求我们的认可，以便政府能够召集支持者、推行新政。原有的宗属关系仍将保留。"
 nesnd_jp_foreign.1.d4:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]正为建厂筹钱。使者请我们拨款，帮他们扩建工场、培养熟练工匠。"
 nesnd_jp_foreign.1.d5:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]提出就朝鲜南部的领土问题达成和解。他们愿意放弃对釜山与两湖的宣称，并将本国仍持有的当地领土移交朝鲜。使者请我们就此了结这桩旧案。"
 nesnd_jp_foreign.1.d6:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]请求我们承认其政府主持日本的统一，并将本国领土交由对方统治。接受这份盟约，便是结束本国的单独存在。"
 nesnd_jp_foreign.1.d7:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]希望得到我们的许可，同其他日本属国商议归并。他们打算由本国政府主持统一，并承诺只有受邀国家同意才结束其单独统治。"
 nesnd_jp_foreign.1.d:0 "[SCOPE.sCountry('jp_sender').GetNameNoFormatting]的使者已经抵达，带来了有关两国关系的提议。他们正在等待我们的答复。"
 nesnd_jp_foreign.1.a:0 "同意所议。"
 nesnd_jp_foreign.1.b:0 "这些条件，我们不能答应。"
 nesnd_jp_foreign.2.t:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的答复"
 nesnd_jp_foreign.3.t:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的答复"
 nesnd_jp_foreign.2.d:0 "使者带回了[SCOPE.sCountry('jp_partner').GetNameNoFormatting]的回音：对方答应了。"
 nesnd_jp_foreign.2.a:0 "照议定的办。"
 nesnd_jp_foreign.3.d:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]回绝了使者带去的条件。对方寸步不让，两国的关系也因此更僵了。"
 nesnd_jp_foreign.3.a:0 "只得另作打算。"
 nesnd_jp_toyotomi_court_name:0 "秀隆"
 nesnd_jp_development.2.d_court:0 "新法写定了议政与任官的规矩。旧臣仍守在君主身边，地方官署里却来了另一批熟悉实务的人。\n\n拥护王朝的改制派相信，有了这些让步，君主制就能传下去。拿到议政权的人是否就此知足，谁也说不准。"
 nesnd_jp_development.2.d_military:0 "主张集权的军官终于让自己的办法成为国策。征募、训练和军需被纳入统一调度，地方官员也须执行中央的命令。兵工厂与工具厂为扩充后的军队提供装备，军府由此取得了在各地贯彻政令的力量。"
 nesnd_jp_development.2.d_representative:0 "取得选举权的人开始用选票选择代表，报纸也能公开议论政府的行为。官员须面对新的任用办法，而议场内外的争论已经越出旧日少数家族的范围。\n\n新学堂还在把更多人带进这个世界。"
 nesnd_jp_sovereign_year:0 "已连续保持独立 #v 12#! 个月"
 nesnd_jp_establish_edo:0 "江户的军府"
 nesnd_jp_establish_edo_reason:0 "江户如今管着大片北方领地。驻军守得住要道，却办不了各地的政务。军府得任用办事的人，把税收和开支理成一本账；各地的城下町，也要容得下商人、工匠和离乡谋生的人。这些地方撑得起日常的统治，江户才腾得出手去争更大的权利。"
 nesnd_jp_establish_kyoto:0 "京都与大阪"
 nesnd_jp_establish_kyoto_reason:0 "京都的公卿和大阪的商人各有各的交游与盘算。朝廷的名位换不来军饷，商人的钱也不会自己流进公库。管钱粮的官员得把现有辖地的收入和政务理顺，让这两座城养得起新立的政府。"
 nesnd_jp_establish_toyotomi:0 "桑国的旧臣"
 nesnd_jp_establish_toyotomi_reason:0 "分封之后，丰臣家再也号令不了全日本。留在西国的军队和家臣却一个不少，都等着领禄米。年贡从哪里收，村町派谁去管，单凭旧日的威名已经办不成。丰臣政权须在现有领地上设起靠得住的奉行所，让城下町成为收税、办事和招工的地方。"
 nesnd_jp_establishment_required_tt:0 "本国已能自行维持地方政务。"
 nesnd_jp_independence_cooldown_tt:0 "距上次发起独立博弈已满六个月。"
 nesnd_jp_settled_administration:0 "地方政务初定"
 nesnd_jp_union_permission_required_tt:0 "宗主已经同意本国合并日本诸政权。"
 nesnd_jp_mercantile_ports_junior_desc:0 "以重商主义取代闭关，准许本国商人经营海外买卖。共同市场的关税仍由市场主导国制定。"
 nesnd_jp_protected_ports_junior_desc:0 "改定保护主义贸易法，放开本国口岸。共同市场的关税仍由市场主导国制定。"
 nesnd_jp_foreign.2.d1:0 "宗主答应放宽约束，宗属关系升了一等，多了几分自主。双方议定休兵五年。从前处处要请示的事，如今可以自己着手了。"
 nesnd_jp_foreign.2.d2:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]已经承认本国独立。宗属关系就此解除，双方议定休兵五年。今后的内外事务，将由本国政府自行决定。"
 nesnd_jp_foreign.2.d3:0 "宗主同意本国推行新政。政府可以开始筹划任官、军政与议政制度的改革，原有的宗属关系仍然保留。"
 nesnd_jp_foreign.2.d4:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]答应拨给建设资金，扩建工场、训练工匠的钱有了着落。三年之内，不能再要同类的拨款。"
 nesnd_jp_foreign.2.d5:0 "对方接受了朝鲜和解方案。本国对釜山与两湖的宣称已经撤回，两地尚在本国掌握中的领土也已依约移交朝鲜。"
 nesnd_jp_foreign.2.d7:0 "宗主允许本国与其他日本属国商议合邦。使者可以带着这份许可前去交涉，受邀国家仍须自行同意归并。"
 nesnd_japan_unification_bar_name:0 "日本核心地区"
 nesnd_japan_unification_bar_desc:0 "$nesnd_japan_unification_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 7#!"
 nesnd_japan_unification_bar_change:0 "领土变化"

 nesnd_japan_force_ready_tt:0 "陆、海军投射均非零，并至少满足以下两项。\n#v 财政#!　周收支与行政力非负。\n#v 陆军#!　合法性至少为50，陆军投射不低于日本。\n#v 海军#!　军舰维护满足率至少为90%，海军投射不低于日本。"
 nesnd_jp_culture_preview_state:0 "\n下月，[ROOT.GetCountry.MakeScope.Var('nesnd_jp_next_state').GetState.GetName]的部分居民预计将转向[ROOT.GetCountry.MakeScope.Var('nesnd_jp_next_target').GetCulture.GetName]文化。"
 nesnd_jp_culture_preview_none:0 "\n下月暂无预计发生文化转变的州。"
