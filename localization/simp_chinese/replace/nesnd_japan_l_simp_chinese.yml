 nesnd_jp_political_bar_monthly_tt:0 "#title 每月变化#!\n行政与新学（已选方针、官僚力非负、识字率≥25%）：[JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_administration')|=+1]\n所选方针的全部目标达标：[JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_laws')|=+1]\n战争阻力：[JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_war')|=+1]\n激进派占比≥25%：[JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_jp_political_radicals')|=+1]"
