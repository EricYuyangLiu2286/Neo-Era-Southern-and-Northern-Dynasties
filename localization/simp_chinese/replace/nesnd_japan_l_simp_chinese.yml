 nesnd_jp_fund_local_schools_desc:0 "让各地讲习所添几张书案。今日能读懂告示的孩子，往后也能读懂选票。"
 nesnd_jp_fund_local_schools_modifier:0 "地方讲习所"
 nesnd_jp_seat_local_notables:0 "请地方名望人士主持议事"
 nesnd_jp_seat_local_notables_desc:0 "请当地有声望的人坐首席，乡里容易服气，年轻议员要发言就得多等一会儿。"
