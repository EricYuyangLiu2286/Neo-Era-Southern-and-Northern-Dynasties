 nesnd_toyotomi_sang: "桑国"
 nesnd_united_japan: "日本"
 nesnd_wu_eastern_question: "东洋之议"
 nesnd_wu_eastern_question_reason: "丰臣氏借明吴之力平定战国，又与郑氏共争朝鲜。两家的旧盟维持了海东秩序，也使九州驻军与日本诸侯结下了绵延数代的利害。如今南朝大局已定，朝廷开始议论东征：将西军旧部调往海东，在丰臣之外扶植天皇与德川的政权，使三家各领其土，九州、四国则归吴朝直辖。远洋驻军与海上商路，也将随这次分封重新安排。"
 nesnd_wu_eastern_question_status: "筹备条件：#v 财政与行政、陆军与政府、海军与军需#!。三项齐备后可向日本提出安排。"
 nesnd_wu_eastern_question_status_offer: "使节已赴日本。等待丰臣的答复及朝廷最后决断。"
 nesnd_wu_eastern_question_status_war: "东征已进入[concept_diplomatic_play]或战争阶段。领土重组须由战争目标获准执行。"
 nesnd_wu_eastern_question_goal: "完成对日交涉，或选择保留现有安排。"
 nesnd_japan_send_terms: "议定东征方略"
 nesnd_japan_send_terms_desc: "以天皇、丰臣和德川各领其土，结束丰臣一门独掌东洋诸藩的局面。"
 nesnd_japan_send_terms_requirements: "#v 财政#!：周收支与行政力非负。#v 陆军#!：军力不低于日本，政府合法性至少50。#v 海军#!：海军投射不低于日本且非零，军舰维护满足率至少90%。两国均未处于战争、已投入的外交博弈或相互停战期，京都、关东、关西、中国地区仍由日本完整控制。日本须仍为丰臣君主政权；扶国与和国尚未存在。"
 nesnd_japan_accept_status_quo: "维持东洋旧约"
 nesnd_japan_accept_status_quo_desc: "保留日本现有政权和疆界，将舰队与军饷留给本土及其他海外诸藩。"
 nesnd_japan_partition_tt: "#bold 日本的领土安排#!\n九州与四国的日本领地转交吴朝；江户及北部现有日本领地组建扶国；京都与大阪组建和国；丰臣保留关西余部、中国地区及朝鲜领地。新两国成为吴朝保护国，丰臣原属国关系保留；原本独立时成为保护国。#v EZO、琉球及其他外国领土不受转移。#!"
 nesnd_japan_war_tt: "日本若为吴朝属国，将脱离吴朝并进入[concept_diplomatic_play]。吴朝主张重组日本，日本则要求羞辱吴朝。#v 重组日本的战争目标获执行后，才会划分领土。#!"
 dp_nesnd_eastern_intervention: "东征日本"
 wg_nesnd_japan_reorganization: "重组日本诸藩"
 wg_nesnd_japan_reorganization_action_name: "重组日本诸藩"
 nesnd_japan_reunification: "天下之归"
 nesnd_japan_reunification_reason: "海峡两岸的盟约曾替丰臣打开平定诸侯的道路，也让唐土朝廷得以介入日本的继承、封地和征战。城下町的税赋沿官道汇往各家府库，军队与商人各认其主。[ROOT.GetCountry.GetName]若要重建天下人的权柄，便须收拢本州、九州和四国，并取得自主决定内外政务的地位。"
 nesnd_japan_reunification_status: "进度计算完整控制的#v 九个核心地区#!。完成还须成为独立国家；北海道、琉球和朝鲜不在此日志的领土要求内。"
 nesnd_japan_reunification_goal: "成为独立国家并完整控制关东、京都、关西、中国、九州、四国、东海、东北和北陆信越。"
 nesnd_japan_integrated: "天下一统"
 nesnd_japan.1.t: "海东封国"
 nesnd_japan.1.d: "南京的使节带来了一份新的封国方案。天皇将亲政京都与大阪，德川以江户为府，丰臣退守关西，九州和四国则交由吴朝直接管理。两百年来丰臣依靠唐土军力取得的霸业，如今被写进了另一位天下人的分封册。家臣们已将各处兵粮与守备送到[ROOT.GetCountry.GetRuler.GetFullName]案前，等候大坂的命令。"
 nesnd_japan.1.a: "保全丰臣家的领土。"
 nesnd_japan.1.b: "日本之事，由日本决断。"
 nesnd_japan.1.c: "遣使南京，保留统一的日本。"
 nesnd_japan.2.t: "丰臣的答复"
 nesnd_japan.2.d: "日本使者请求撤回分封方案，仍由丰臣统一主持海东政务。南京朝廷准备以东征扶植新的日本政权，把丰臣掌握的兵力与财源分到数家。军费、舰船与海外防务也须随之重新安排。如何答复这项请求，已交由[ROOT.GetCountry.GetRuler.GetFullName]裁定。"
 nesnd_japan.2.a: "命舰队护送东征军。"
 nesnd_japan.2.b: "准其所请，维持旧约。"
 nesnd_japan.3.t: "东洋四府"
 nesnd_japan.3.d: "新的封国诏令已经发往日本各地。丰臣以中国地区和关西余部存其家业，德川接掌江户及北方诸侯，天皇在京都亲理政务，大阪商人与公卿有了共同的朝廷。九州、四国归吴朝直接管理。各府随领土接收百姓、田地与产业，旧日统一的征税和军需体系也由此分开。"
 nesnd_japan.3.a: "各府修治其政。"
 nesnd_japan.4.t: "东征罢议"
 nesnd_japan.4.d: "东征所需的战局已经结束，分封日本的安排未能施行。舰队与驻军依现有疆界重新部署，军费和商路仍须逐项交接。朝廷将按已经生效的和约处理东洋事务。"
 nesnd_japan.4.a: "按现约办理。"
 nesnd_japan.5.t: "天下归一"
 nesnd_japan.5.d: "本州、九州与四国的政令终于归于一府。[ROOT.GetCountry.GetName]取得了自行处理内外事务的地位，各地官员开始合并税册、衔接道路，编整曾分属不同诸侯的军队。城下町的货物越过旧日关卡，商人与农民也将逐渐面对同一套赋役和法令。"
 nesnd_japan.5.a: "休养民力，整顿邦国。"
