 nesnd_jp_abandon_reform:0 "搁置新政"
 nesnd_jp_abandon_reform_desc:0 "政府拟搁置现行新政，已颁行的法律和已开办的工程照旧。新政一经搁置，此前的推行进展和连续落实的月数均从零起算。#v 24#! 个月后方可重提改革。"
