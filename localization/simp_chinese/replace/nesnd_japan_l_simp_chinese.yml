 nesnd_japan_tokugawa_successor_name: "家亲"
 nesnd_japan_yamato_successor_name: "顺仁"
 nesnd_japan.2.d_commander: "日本使者请求收回分封诸藩的方案，仍由丰臣主持海东政务。[SCOPE.sCharacter('nesnd_japan_commander').GetFullName]已奉命筹划东征。旧西军的军官将随主帅离开本土，南京则以舰队、军饷和海东诸侯接应这支军队。丰臣若被击败，天皇和德川便可据新的封地分掌日本。朝廷现在须决定是否将交涉付诸兵戎。"
 dp_nesnd_eastern_intervention_desc: "吴朝要求以天皇、德川、丰臣及吴朝直辖领地重组日本。"
