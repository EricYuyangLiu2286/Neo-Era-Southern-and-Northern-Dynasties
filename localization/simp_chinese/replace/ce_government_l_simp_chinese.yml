l_simp_chinese:
 gov_ce_xuanweisi_colony_state: "海外宣慰司"
 gov_ce_xuanweisi_colony_state_desc:1 "这种[concept_government]体制下，国家代表殖民宗主的利益，但大多数时候元首是从本地的寡头世家中选出来的。"
 RULER_TITLE_CE_XUANWEISHI: "宣慰使"
 RULER_TITLE_CE_HUANGDI: "天子"
 gov_ce_taishi_celestial_empire: "天朝"
 gov_ce_taishi_celestial_empire_desc:1 "这种[concept_government]体制下，国家及其君主自认为是世界上的中央帝国，并以绝对的荣誉感保卫同阵营国家和统治集团的利益。"
 gov_ce_celestial_empire: "天朝"
 gov_ce_celestial_empire_desc:1 "这种[concept_government]体制下，国家及其君主自认为是世界上的中央帝国，并以绝对的荣誉感保卫同阵营国家和统治集团的利益。"
 ce_gov_fanwang_guo_state: "藩王国"
 ce_gov_fanwang_guo_state_desc:1 "这种[concept_government]体制下，国家代表着其天赋君主及其贵族家庭的利益，但也常会有地方士绅、学者、科举选举人（通过科举获得了选举权的一般人）组成的代议机构。"
 gov_ce_chinese_fed_republic: "众人共和国"
 gov_ce_chinese_fed_republic_desc:1 "这种[concept_government]体制下，国家是国内万族共和而成的代议制国家，代表着有权投票者和全国各族人民的共同利益。是万族主义和国人主义在人类间的代言人。"
 RULER_TITLE_CE_ZHOUGONG: "周公"
 ce_gov_chinese_subject_republic: "共和行都司"
 ce_gov_chinese_subject_republic_desc:1 "这种[concept_government]体制下，国家一般代表着其宗主国和本地合作者的意志和利益。由本地选举的领袖进行管理。"
 
