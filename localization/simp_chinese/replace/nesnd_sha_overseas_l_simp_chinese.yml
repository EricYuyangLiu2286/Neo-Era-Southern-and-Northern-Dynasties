l_simp_chinese:
 nesnd_sha_foothold:0 "海外落脚点"
 nesnd_sha_foothold_reason:0 "登莱船商在东洲经营屯垦地已有几代。如今议会把目光投向非洲，要在那里取得一处由共和国管辖的土地，给远洋船队提供码头、粮仓和征税的依据。\n\n索马里兰和马达加斯加北部的港口各有主人，可以提出宣称，也可以出价租借。肯尼亚沿岸的港区已有主人。只有当地部落仍控制海岸时，登莱才可在那里依殖民法开拓。大明在莫桑比克的口岸只能议租。"
 nesnd_sha_foothold_status:0 "在非洲领有土地或通商口岸。可在索马里兰、北马达加斯加择地提出[concept_claim]或议价租港，在肯尼亚沿岸依殖民法开拓，或向大明租借莫桑比克口岸。"
 nesnd_sha_settlement:0 "垦殖"
 nesnd_sha_settlement_reason:0 "有了属地，下一步是往那里运人。议会出钱补贴船期，把国内的穷人、读书人和教士送到非洲落户，让他们开垦土地、建立城镇，日后再从那里收粮、收税。\n\n岸上的土著部落世代在这里耕作放牧。在登莱的官吏看来，这些人不懂地契，也不纳国税，划给垦殖民的土地不必征求他们的同意。"
 nesnd_sha_ocean_company:0 "登莱远洋公司"
 nesnd_sha_choose_landing:0 "选定登陆地"
 nesnd_sha_choose_landing_desc:0 "授权船队勘定一处候选地。提出[concept_claim]必须动用国库，此后仍由政府决定是否发起[concept_diplomatic_play]。"
 nesnd_sha_change_destination:0 "改选目的地"
 nesnd_sha_change_destination_desc:0 "将下一批垦殖民改派到另一处已有居民的登莱非洲属地，船期重新计算。"
 nesnd_sha_change_people:0 "改选人群"
 nesnd_sha_change_people_desc:0 "改向已获议会批准的下一类人群招募乘客，重新排定船期。"
 nesnd_sha_extra_sailings:0 "加开船期"
 nesnd_sha_extra_sailings_desc:0 "在平常船期、一档加班和两档加班之间调整。加开的船次由国库按周付费。"
 nesnd_sha_expand_transport:0 "扩大每批人数"
 nesnd_sha_expand_transport_desc:0 "扩充一次船期能够运送的人数。扩至一万人必须首都港口达到二级，扩至两万人必须达到三级。"
 nesnd_sha_expand_recruitment:0 "放宽人选"
 nesnd_sha_expand_recruitment_desc:0 "三批到岸、首都港口达到二级后，可以招募东北的辽东人和女真人。五批到岸、港口达到三级，且朝鲜有密约或已亡时，可再联络朝鲜人及俄属远北同乡。"
 nesnd_sha_intensive_settlement:0 "倾力垦殖"
 nesnd_sha_intensive_settlement_desc:0 "调派官吏优先经办殖民地的公事，为期一年。"
 nesnd_sha_settlement_office:0 "海外垦殖经办处"
 nesnd_sha_extra_colonists:0 "增派垦殖人员"
 nesnd_sha_ocean_republic:0 "远洋的共和国"
 nesnd_sha_lease_port:0 "租借口岸"
 nesnd_sha_lease_port_desc:0 "由登莱付给港口主人价款，换取一处非洲通商口岸的管辖权。"
 nesnd_sha_lease_terms:0 "成交后支付登莱 GDP 的 #v 3%#!，至少 @money!#v 7,500#!。对方拒绝后，#v 36#! 个月才能再请。"
 nesnd_sha_lease_unrecognized:0 "对方为未承认国家"
 nesnd_sha_sailings:0 "垦殖船期"
 nesnd_sha_sailings_desc:0 "垦殖船期 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_sha_change_destination_tt:0 "切换至下一个可用目的地，船期从零开始。"
 nesnd_sha_change_people_tt:0 "切换招募人群，船期从零开始。"
 nesnd_sha_extra_sailings_tt:0 "一档每周多 #g 1#! 点船期，花费 GDP 的 #v 0.025%#!。二档多 #g 2#! 点，花费 #v 0.05%#!。再点一次恢复平常船期。"
 nesnd_sha_expand_recruitment_tt:0 "准许船商从下一档人群中招募乘客。"
 nesnd_sha_manifest_north:0 "华北的知识分子与贫民"
 nesnd_sha_manifest_northeast:0 "东北的辽东人和女真人"
 nesnd_sha_manifest_frontier:0 "朝鲜人及俄属远北的同乡"
 nesnd_sha_manifest_harbor:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_sha_destination').GetState.GetName]"
 nesnd_sha_manifest_no_harbor:0 "尚无可接收的属地"
 nesnd_sha_sailings_base:0 "平常船期"
 nesnd_sha_sailings_extra:0 "加开的船次"
 nesnd_sha_ocean_company_desc:0 "取得非洲属地之后，登莱有了经营种植园与航运的根据地。在首都备足码头、按殖民法经营属地的公司，可以向共和国申请特许。"
 nesnd_sha_ocean_company_tt:0 "已有非洲属地。实施殖民法律且首都港口达到 #v 3#! 级后，可在公司界面筹办$nesnd_sha_ocean_company$。"
 nesnd_sha_seven_states_tt:0 "登莱直接持有非洲土地，按原生殖民网络计算，登莱及其非洲属国共控制至少 #v 7#! 个非洲州。"
 nesnd_sha_overseas.1.t:0 "远洋船队往何处去"
 nesnd_sha_overseas.1.d:0 "船主们请议会先定下一处登陆地。索马里兰和马达加斯加北部的港口各有主人，无论宣称还是租借，都要先同港口的主人打交道。肯尼亚沿岸的港区已有主人。只有当地部落仍控制海岸时，登莱才可在那里依殖民法开拓。大明辖下的莫桑比克口岸只能议租，不在此列。"
 nesnd_sha_overseas.1.f:0 "“我只管把船开进港。岸上要是有人拦，请给我一纸准许开炮的文书。”——一名远洋船主"
 nesnd_sha_overseas.1.a:0 "选定$STATE_SOMALILAND$。"
 nesnd_sha_overseas.1.b:0 "选定$STATE_NORTH_MADAGASCAR$。"
 nesnd_sha_overseas.1.c:0 "选定$STATE_KENYA$沿岸。"
 nesnd_sha_overseas.1.wait:0 "暂缓授权。"
 nesnd_sha_overseas.2.t:0 "首批垦殖民上岸"
 nesnd_sha_overseas.2.d:0 "从[SCOPE.sState('nesnd_sha_embarkation').GetName]出发的首批垦殖民已在[SCOPE.sState('nesnd_sha_harbor').GetName]上岸，实到 #v [SCOPE.GetValue('nesnd_sha_landed')|0]#! 人。港口官署按这个数目分派住处、口粮和农具。"
 nesnd_sha_overseas.2.f:0 "“船上发的口粮吃到上岸为止。头一季的收成下来之前，请官署按人头发粮。”——垦殖民联名呈文"
 nesnd_sha_overseas.2.a:0 "按实际到岸人数发放口粮。"
 nesnd_sha_overseas.3.t:0 "水源与道路"
 nesnd_sha_overseas.3.d:0 "第三批垦殖民在[SCOPE.sState('nesnd_sha_harbor').GetName]上岸以后，官署把通往水源的一段道路划进了垦地。当地土著世代沿这条路取水放牧，如今被拦在界外，几次聚众闹事。\n\n另修一条道路需要国库出钱。照原图划界，就得派兵把土著赶开。"
 nesnd_sha_overseas.3.f:0 "“地契上写的是登莱的地。不认地契的，就让他们认枪。”——一名垦殖官"
 nesnd_sha_overseas.3.a:0 "拨款另修道路。"
 nesnd_sha_overseas.3.b:0 "照原图划界，派兵驱散闹事的土著。"
 nesnd_sha_overseas.4.t:0 "船期落空"
 nesnd_sha_overseas.4.d:0 "这一批垦殖民没有一人在预定的目的地落户。出发地招不到人、航路被战事阻断，或目的地已不归登莱，都会让船期落空。连续三次落空，船期便会暂停。"
 nesnd_sha_overseas.4.f:0 "“船开出去了，人没送到。这趟的运费，我照样要领。”——一名承运船主"
 nesnd_sha_overseas.4.a:0 "本批到岸人数记为零。"
 nesnd_sha_overseas.5.t:0 "远洋的共和国"
 nesnd_sha_overseas.5.d:0 "从前远北的船把俘来的人卖给东洲，再用卖人的钱投资屯垦、贩运军械。如今共和国在非洲有了自己的属地，种植园、船厂和港口税收都成了国人议会的议题。船商们认为，议会终于有了保护他们产业的力量。"
 nesnd_sha_overseas.5.f:0 "“东洲的地是别人的，非洲的地是我们自己的。”——一名登莱船商"
 nesnd_sha_overseas.5.a:0 "把海外属地的事交议会议决。"
 nesnd_sha_settlement_status:0 "目的地：[ROOT.GetCountry.GetCustom('nesnd_sha_current_harbor')]。招募人群：[ROOT.GetCountry.GetCustom('nesnd_sha_current_people')]。每班最多 [ROOT.GetCountry.MakeScope.Var('nesnd_sha_capacity').GetValue|0] 人，加开船期为第 [ROOT.GetCountry.MakeScope.Var('nesnd_sha_sailing_level').GetValue|0] 档，已成功到岸 [ROOT.GetCountry.MakeScope.Var('nesnd_sha_voyages').GetValue|0] 批。"
 nesnd_sha_settlement_paused:0 "连续三班没有乘客落户，船期暂停。改选目的地或人群后重新开航。\n目的地：[ROOT.GetCountry.GetCustom('nesnd_sha_current_harbor')]。招募人群：[ROOT.GetCountry.GetCustom('nesnd_sha_current_people')]。每班最多 [ROOT.GetCountry.MakeScope.Var('nesnd_sha_capacity').GetValue|0] 人，加开船期为第 [ROOT.GetCountry.MakeScope.Var('nesnd_sha_sailing_level').GetValue|0] 档，已成功到岸 [ROOT.GetCountry.MakeScope.Var('nesnd_sha_voyages').GetValue|0] 批。"
 nesnd_sha_lease_port_action_name:0 "租借口岸"
 nesnd_sha_lease_port_action_propose_name:0 "提出租港请求"
 nesnd_sha_lease_port_proposal_notification_name:0 "登莱来书求租口岸"
 nesnd_sha_lease_port_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName]拟向我国租借非洲口岸，按约支付价款。"
 nesnd_sha_lease_port_proposal_notification_effects_desc:0 "$nesnd_sha_lease_terms$"
 nesnd_sha_lease_port_proposal_accepted_name:0 "租港条件议定"
 nesnd_sha_lease_port_proposal_accepted_desc:0 "[TARGET_COUNTRY.GetName]同意出租口岸。"
 nesnd_sha_lease_port_proposal_declined_name:0 "租港请求遭拒"
 nesnd_sha_lease_port_proposal_declined_desc:0 "[TARGET_COUNTRY.GetName]拒绝了租港请求。三年后可再行交涉。"
 nesnd_sha_lease_port_action_notification_name:0 "$nesnd_sha_lease_port_proposal_accepted_name$"
 nesnd_sha_lease_port_action_notification_desc:0 "$nesnd_sha_lease_port_proposal_accepted_desc$"
 nesnd_sha_lease_port_proposal_third_party_accepted_name:0 "$nesnd_sha_lease_port_proposal_accepted_name$"
 nesnd_sha_lease_port_proposal_third_party_accepted_desc:0 "$nesnd_sha_lease_port_proposal_accepted_desc$"
 nesnd_sha_lease_port_proposal_third_party_declined_name:0 "$nesnd_sha_lease_port_proposal_declined_name$"
 nesnd_sha_lease_port_proposal_third_party_declined_desc:0 "$nesnd_sha_lease_port_proposal_declined_desc$"
