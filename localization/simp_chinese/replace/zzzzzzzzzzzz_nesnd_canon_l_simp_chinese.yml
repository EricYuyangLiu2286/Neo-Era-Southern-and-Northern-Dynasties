l_simp_chinese:
 nesnd_crisis.30.local:0 "[SCOPE.sState('nesnd_land_petition_state').GetName]的清丈官带着新法下乡勘定后，当地几处军功庄园却仍在按旧例征租。已经缴清赎价的农户被他们的“老爷”告知，所耕之田属于军籍，不许抵触租税。一些替农民代写申诉的塾师也因包庇隐产而遭拘押。\n\n涉事各县呈来的契约与军营的册籍彼此抵牾。省督要求接手复核，清丈官则请朝廷派兵收缴隐匿的文书。迁延日久，原本期待分田的农民聚集到县城，等待这个许诺解放他们的新政府作出答复。"
 nesnd_federal_compact_button_alt_desc:0 "新政已使南朝无法退回旧日的藩镇格局，而杭州南府仍掌握着推行新政所需的兵财。易代改姓的时机已然成熟。我们应先遣使争取各省与海外诸邦，再请礼议院与内阁议定任官、赋额、军费、省制以及朱明皇室的地位。以礼法确立君权与议政之权，为郑氏称制奠定国制。"
 nesnd_south_reconsider_tt:0 "重新开始#v 12个月#!的连续履行期。"
 nesnd_jp_foreign.2.d1:0 "宗主已同意放宽对本国的约束，原有的宗属关系升为更自主的等级。双方议定休兵五年，政府可以据此着手处理此前受制的事务。"
 nesnd_jp_foreign.2.d2:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]已经承认本国独立。宗属关系就此解除，双方议定休兵五年；今后的内外事务，将由本国政府自行决定。"
 nesnd_jp_foreign.2.d3:0 "宗主同意本国推行新政。政府可以开始筹划任官、军政与议政制度的改革，原有的宗属关系仍然保留。"
 nesnd_jp_foreign.2.d4:0 "[SCOPE.sCountry('jp_partner').GetNameNoFormatting]同意拨给建设资金。工场扩建与工匠训练有了新的助力；政府须善用这笔资助，三年内不能再获同类拨款。"
 nesnd_jp_foreign.2.d5:0 "对方接受了朝鲜和解方案。本国对釜山与两湖的宣称已经撤回，两地尚在本国掌握中的领土也已依约移交朝鲜。海峡两岸的关系将依新的边界继续经营。"
 nesnd_jp_foreign.2.d7:0 "宗主允许本国与其他日本属国商议合邦。使者可以带着这份许可前去交涉，受邀国家仍须自行同意归并。"
 nesnd_per.4.d_unavailable:0 "朝廷已经决定向西扩张，原定与伊犁建立的朝贡安排却未能成立。军府与商人仍可经营西方，所需兵力与财源须从眼下能够取得的支持中筹措。"
