l_simp_chinese:
 nesnd_federal_compact:0 "礼法定制"
 nesnd_court_protection:0 "首辅护卫与公开审议"
 nesnd_federal_compact_button:0 "重订国家礼法"
 nesnd_federal_compact_button_desc:0 "新政已使南朝无法退回旧日的藩镇格局，杭州南府也不能再独断国政。各省学政将在礼议院议定任官、赋额、军费与省制，内阁及六部则须依新定礼法施政。我们应先遣使争取西府各省与海外诸邦的支持，使朱姓天子摆脱南府的挟持，依礼法主持国政。"
 nesnd_south_status_qin:0 "吴王仍在约束近臣的易代之议，明廷与南府的争论却一日紧过一日。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules 朝争进展#!#!"
 nesnd_south_status_succession:0 "南府已在催促改定帝统，明廷与各省仍在争取自己的主张。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules 朝争进展#!#!"
 nesnd_south_rules:0 "$nesnd_south_pressure_detail_tt$\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_pressure_bar:0 "易代压力"
 nesnd_south_pressure_bar_desc:0 "$nesnd_south_pressure_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_south_compact_bar:0 "改制承诺"
 nesnd_south_compact_bar_desc:0 "$nesnd_south_compact_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_federal_compact_button_requirements:0 "吴明论战仍在进行。[concept_bureaucracy]不为负。[concept_legitimacy]至少#v 50#!。距上次订约已满#v 18个月#!。"
 nesnd_federal_compact_button_outcome_tt:0 "中央议约进度#p +20#!，易代压力#p −8#!。#v 18个月#!后可再次订约。"
 nesnd_south_unsettled_tt:0 "南朝的朝争尚未平息。"
 nesnd_south_qin_departed_tt:0 "郑钦已去世或离开本国，或朝争已延续至#v 1839年#!。"
 nesnd_south_conflicts_failure_tt:0 "以下任一情况发生：\n本国拥有的[Concept('concept_state','州')]不足#v 2#!个。\n或四川、湖南、菲律宾、南洋联省和远南五邦均已不再是本国的直属[Concept('concept_subject','附属国')]（包括已经灭亡的邦国）。"
 nesnd_south_settled_tt:0 "南朝的朝争已经结束。"
 nesnd_south_wu_established_tt:0 "吴朝已经建立。"
 nesnd_south_monarchy_ended_tt:0 "本国已经废除#v 君主制#!。"
 nesnd_south_pressure_detail_tt:0 "#bold 易代压力#!：#v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\n当前每月净变化：#v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!。通常每月#n ＋3#!，礼法定制修正生效时#n ＋2.5#!。有效和解进程另每月减少#p 3#!。\n\n#bold 首辅案#!\n自#v 1837年7月#!起，压力超过#v 24#!时可能发生。至#v 1838年初#!，尚未结案且陈东阳仍在本国，就会进入刺杀与护卫分支。死亡使压力#n ＋25#!，受伤#n ＋10#!，脱险#n ＋3#!。\n\n首辅案已有结果后，压力达到#v 70#!可主动提前易代。达到#v 100#!且郑钦已离去，易代便会推进。自#v 1839年初#!起，若首辅案已有结果而朝争仍未解决，压力将升至#v 100#!，届时无论郑钦是否在世，都会进入易代与诸国答复。已达成和解则朝争告终。"
 nesnd_south_compact_detail_tt:0 "#bold 改制承诺#!\n大陆、海外与日本诸邦的承诺分别占#v 50%、30%、20%#!。承诺有效#v 36个月#!。改换立场、与中央交战、改投宗主或撤回支持后，相应承诺失效。\n\n#bold 和平议定国制#!\n所选一方的政治支持须达到#v 85#!，领先另一方#v 20#!，并连续维持#v 12个月#!。明廷须获#v 75%#!支持及至少两个大陆核心政府同意。吴方须获#v 80%#!支持、拟改省诸国与日本割地各方同意，并备有合格舰队。新制议定后，朝争结束。"
 nesnd_south_succession_board:0 "南朝诸国"
 nesnd_south_succession_board_reason:0 "南朝的天下，究竟是朱氏皇帝的天下，还是郑氏开拓出来的天下？南京仍有朱明的帝统，杭州南府则掌握着推行新政的兵财。西府各省与南府共同抵御北朝时，尚能把君臣名分的争论留待来日。如今改革已深入地方，两方再不能回避谁来主持国政。\n\n湖广的书院和襄樊的营伍奉朱氏正朔，四川的共和派仍在议论南府的新政。南洋总督与日本诸侯也在衡量易代将向他们索取多少土地、钱粮和兵员。礼议院中的学政、内阁中的大臣以及各省带兵的将领，终须为自己的主张承担后果。"
 nesnd_south_succession_board_status:0 "各省与海外诸邦正在表明立场，整顿军政。南朝的国制之争已牵动海内外。"
 nesnd_board_table_heading:0 "诸国军政"
 nesnd_board_country_metrics:0 "常备营 #v [Country.GetRegularBattalions|0]#! / 可动员 #v [Country.CalcConscriptableBattalions|0]#!　舰船 #v [Country.GetNumShips|0]#!\n固定收支 @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　陆军力量 #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\n供给准备：[Country.GetCustom('nesnd_board_supply_loc')]\n[Country.GetCustom('nesnd_south_ready_loc')]"
 nesnd_board_supply_known:0 "#v [Country.MakeScope.Var('nesnd_board_supply_score').GetValue|0] / 4#!项"
 nesnd_board_supply_unknown:0 "商情未明"
 nesnd_board_stance_unstated:0 "尚未表态"
 nesnd_board_stance_ming:0 "拥明"
 nesnd_board_stance_wu:0 "拥吴"
 nesnd_board_stance_neutral:0 "中立"
 nesnd_board_stance_autonomy:0 "自主"
 nesnd_board_stance_available_tt:0 "内战尚未爆发，本国不受固定立场约束，距上次改换立场已满#v 6个月#!。襄樊大营固定拥明。朝廷不能选择中立或自主。"
 nesnd_board_stance_effect_tt:0 "公开本国立场，#v 6个月#!内不再更改。撤回既有承诺时，尚未执行的改省或割地同意一并作废，与中央关系#n −15#!。"
 nesnd_board_choose_ming:0 "拥护明廷"
 nesnd_board_choose_ming_desc:0 "朱氏帝统仍是南朝诸省与海外诸邦共同奉行的正朔。支持明廷依礼法主持国政，约束南府独断之权。"
 nesnd_board_choose_wu:0 "支持郑氏"
 nesnd_board_choose_wu_desc:0 "郑氏经营海陆、掌握兵财已久。支持吴王以今日功业改定帝统，并以礼法确立新朝的君权与议政之权。"
 nesnd_board_choose_neutral:0 "守持中立"
 nesnd_board_choose_neutral_desc:0 "明廷与南府各有主张。本国暂不参与易代之争，先照顾自己的商路与防务。"
 nesnd_board_choose_autonomy:0 "争取自主"
 nesnd_board_choose_autonomy_desc:0 "朝廷正在争论易代，本国也当争取自行决定财赋、任官与防务。向明吴两方说明我们的主张。"
 nesnd_board_ming_bar_name:0 "朱明统绪"
 nesnd_board_wu_bar_name:0 "郑氏新政"
 nesnd_board_ming_bar_desc:0 "$nesnd_board_ming_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_wu_bar_desc:0 "$nesnd_board_wu_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_compact_bar_name:0 "改制承诺"
 nesnd_board_pressure_bar_name:0 "兵戈之势"
 nesnd_board_compact_bar_desc:0 "$nesnd_board_compact_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_pressure_bar_desc:0 "$nesnd_board_pressure_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_not_ming_tt:0 "本国尚未公开拥护明廷。"
 nesnd_board_not_wu_tt:0 "本国尚未公开支持郑氏。"
 nesnd_board_not_neutral_tt:0 "本国尚未宣布中立。"
 nesnd_board_not_autonomy_tt:0 "本国尚未选择争取自主。"
 nesnd_ming_host_huguang:0 "行在筹备：湖广"
 nesnd_ming_host_huguang_desc:0 "将湖广列为朝廷出京时的首选行在。当地政府须愿意拥明并具备独立行动的条件。"
 nesnd_ming_host_sichuan:0 "行在筹备：四川"
 nesnd_ming_host_sichuan_desc:0 "将四川列为朝廷出京时的首选行在。当地政府须愿意拥明并具备独立行动的条件。"
 nesnd_ming_host_effect_tt:0 "诸省与中央决裂时，优先在此建立行在。无法接驾时，再考虑另一处接应地。"
 nesnd_ming_renew_convocation:0 "重开公议"
 nesnd_ming_renew_convocation_desc:0 "召集各省与诸邦的代表，重新商议明廷与吴王的名位。"
 nesnd_ming_court.3.t:0 "行在立朝"
 nesnd_ming_court.3.d:0 "随驾臣僚已经抵达行在，地方政府正在安置朝廷。原有军队仍须征饷调兵，布政司仍须治理各地，如今又要供给天子的行朝。拥明的主张由此有了可以奉事的中央，也使接驾之地首先承担了同南府决裂的代价。\n\n各省与海外诸邦还在遣使往来。曾经在礼议院与内阁争执的名分，如今已须由彼此的军力担保。"
 nesnd_ming_court.3.a:0 "先整顿行在诸务。"
 nesnd_ming_court.9.t:0 "留守南京"
 nesnd_ming_court.9.d:0 "湖广与四川尚无能够接驾的政府，朝廷只得留在南京。拥明大臣须继续争取地方支持，也须同掌握兵财的南府商议眼前的处境。郑氏的易代主张已摆在面前，留京廷议将决定我们还能争取多少余地。"
 nesnd_ming_court.9.a:0 "留京议约，暂缓易代。"
 nesnd_ming_court.9.b:0 "承认郑氏的新名位。"
 nesnd_ming_court.10.t:0 "诸省复议"
 nesnd_ming_court.10.d:0 "反对新朝的地方尚未结成足以举兵的联盟。任官、赋额、军费与海外地位仍是各方争执的要害。南府要使郑氏的帝号为人接受，就须继续回应这些主张。拥明者也仍在寻找可以共进退的同道。"
 nesnd_ming_court.10.a:0 "继续商议地方主张。"
 nesnd_ming_court_country:0 "大明行在"
 nesnd_ming_interregnum_country:0 "大明监国政府"
 nesnd_ming_court_adj:0 "明廷"
 nesnd_ming_court_transfer_effect_tt:0 "你现在执掌[ROOT.GetCountry.GetName]。原有军队、财政、土地和税制继续运作。有合法君主随行时改行君主制，由同一人物主持行在。"
 nesnd_ming_court.12.t:0 "去路未定"
 nesnd_ming_court.12.d:0 "地方已经与中央决裂，预定接驾的政府却发生了变故。朝廷一时无法出京，拥明大臣只能继续联络湖广与四川，寻找能够保护天子、维持行朝的接应者。留在南京的每一日，都使我们更难摆脱南府的安排。"
 nesnd_ming_court.12.a:0 "暂留京中，另寻接应。"
 nesnd_ming_court.12.b:0 "留任新朝，放弃迎驾之议。"
 nesnd_ming_seek_refuge:0 "再遣迎驾使"
 nesnd_ming_seek_refuge_desc:0 "再遣使者前往湖广与四川，寻求能够接驾并维护明统的地方政府。"
 nesnd_ming_after_truce:0 "行在未归"
 nesnd_ming_after_truce_reason:0 "停战以后，朝廷仍未返回南京。拥明各省保有自己的军队与财赋，南府也没有放弃新朝的帝号。行在须休养财力、结交盟友，待有实力收复旧都时，再议天下的名分。"
 nesnd_ming_after_truce_status:0 "在新的战争中控制南京及吴朝首都，并满足实际胜利条件后，议定复国安排。"
 nesnd_ming_refuge_available_tt:0 "对应靖难对峙或战争仍在进行。湖广或四川有独立、拥明、控制首都且未由另一玩家执掌的接应政府。"
 nesnd_south_politics_summary:0 "#bold 明廷与南府#!\n财政与行政 #v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!　朝臣合作 #v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!\n朱氏统绪 #v 20#!　吴方军力 #v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!\n#bold 各方改制承诺#!　奉明 #v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!　拥吴 #v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!\n连续履行 #v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#!个月。\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_offer_accord:0 "遣使议定改制"
 nesnd_south_offer_accord_desc:0 "南朝的任官、赋额与军费须有共同遵守的礼法。先将本方的改制主张送交各省与海外诸邦，争取他们对新秩序的支持。"
 nesnd_south_offer_available_tt:0 "已选择拥明或拥吴，朝争尚未决裂。本国未[concept_default]且不在战争中，距上次遣使已满六个月，并有可以答复的诸邦。"
 nesnd_south_accord_offer_tt:0 "向可以接洽的各省与诸邦提出改制条款，由对方决定是否接受。#v 6个月#!内不能再次遣使。议约期间政府工资#n +3%#!、[concept_authority]#n −25#!。"
 nesnd_south_accord_accept_tt:0 "本国支持所提路线，承诺有效#v 36个月#!，立场在#v 6个月#!内固定。改换立场、与南朝中央交战、改投其他宗主或承诺到期后，支持失效。吴方改省条款包括交出本国在中国的辖地。日本条款包括交出本国持有的四国、九州，保留其他辖地。与中央关系#p +15#!。"
 nesnd_south_leave_accord:0 "撤回改制承诺"
 nesnd_south_leave_accord_desc:0 "撤回对改制条款的同意，重新决定本国与南朝中央的关系。"
 nesnd_south_accord_leave_tt:0 "撤回改制承诺及尚未执行的改省、割地同意。与中央关系#n −15#!，#v 6个月#!内不能改换立场。"
 nesnd_south_retry_confrontation:0 "再提地方交涉"
 nesnd_south_retry_confrontation_desc:0 "前次交涉未成，反对新朝的地方仍据地拥兵。再次提出交涉，要求他们就朝廷的统治权作出答复。"
 nesnd_south_accords.1.t:0 "南朝改制之议"
 nesnd_south_accords.1.ming:0 "内阁的使者来到[ROOT.GetCountry.GetName]，请求我们支持保全明统的改制主张。南朝将以礼法划定中央与各省的权力，朱氏天子继续主持国政，内阁及六部依法施政，各省学政在礼议院参预国事。\n\n对本国而言，接受提议意味着承认朱明统绪，并支持这一安排。本国的政府、辖地与现行法制仍予保留。涉及海外诸邦的宗属和通商关系，另依彼此所立条约办理。"
 nesnd_south_accords.1.integration:0 "南府使者提出的条件十分明确：承认郑氏易代，并将本国在中国的辖地改设为中央直接治理的行省。地方原有的独立军政权将随之收回，任官、赋额与军费纳入新朝礼法，由内阁及六部统筹。\n\n这将使南府多年推动的集权变法取得最后的成果。我们一旦答允，便是在替本地决定日后由谁施政、向谁纳税。若本国另有海外辖地，那里的政府和疆界仍予保留。"
 nesnd_south_accords.1.japan:0 "南府使者要求本国承认郑氏取代朱明，并将实际持有的四国、九州辖地交由吴朝直接治理，其余领土仍由本国政府掌管。\n\n这份提议把南朝的易代与日本的疆界连在了一起。接受它可以换取新秩序中的名位，却也意味着放弃这些土地。朝廷与诸家须先认清代价，才能向杭州作答。"
 nesnd_south_accords.1.overseas:0 "南府使者请[ROOT.GetCountry.GetName]承认郑氏的新名位，并表示本国的政府、辖地与现有宗属安排均可延续。南朝内部如何以礼法重定君权和省权，将由其礼议院与内阁办理。我国与它的通商、港务和军费往来，仍须依各项条约行事。\n\n郑氏需要海内外的支持。我们也应在作答以前想清楚，这次易代将给本国留下怎样的位置。"
 nesnd_south_accords.1.a:0 "赞同改制，奉此正朔。"
 nesnd_south_accords.1.b:0 "接受改省，归中央统治。"
 nesnd_south_accords.1.c:0 "承认易代，接受割地。"
 nesnd_south_accords.1.d:0 "暂不答允。"
 nesnd_south_accords.20.t:0 "重定礼法"
 nesnd_south_accords.20.d:0 "一年来，支持明统的各省与诸邦维持了对改制的承诺。礼议院中各省学政所议的任官、田赋与军费条陈，如今已有推行的基础。内阁请[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]颁诏，将中央与各省的权责载入国家礼法。\n\n自陈东阳重设行省布政司以来，南朝已能统一调度军政，旧封君的名位却仍牵动地方势力。过去因抗击北朝而暂且搁置的争执，终于可以在礼议院作成定议。朱明统绪得以保全，天子、内阁与各省也须各依礼法行使职权。"
 nesnd_south_accords.20.a:0 "颁诏施行礼法。"
 nesnd_south_accords.21.t:0 "以礼法定易代"
 nesnd_south_accords.21.d:0 "支持郑氏的各方已将改制主张维持了一年。拟改设行省的各国同意交出在中国的辖地，日本诸政权也已接受有关四国、九州的条件。南府所掌兵财因此有了推行新制的依凭。\n\n礼议院与内阁将把任官、赋额、军费和省制纳入新朝礼法，重新规定君权与议政之权。郑氏若在此时受禅，就须接下这些已经许诺的责任。旧日借明廷名义施政的南府，终于要以自己的国号面对天下。"
 nesnd_south_accords.21.a:0 "受禅建国，依礼法施政。"
 nesnd_south_accords.reconsider:0 "暂缓定议，再行会商。"
 nesnd_south_ming_peace_result_tt:0 "保全朱氏君主与明廷国号，各成员保留现有领土、政府和经济法律。中央承担#v 10年#!礼法约束。履行承诺者获得有期限的声望收益，筹备充足者另获奖励。"
 nesnd_south_wu_peace_result_tt:0 "建立吴朝，并整合明确同意且控制本地的中国范围辖地。海外国家保留本国及海外领土。日本仅转让自己实际持有的四国、九州。整国并入的玩家成员若已同意且中央无人类玩家，则转为执掌吴朝。新并入州承担#v 12个月#!过渡成本。"
 nesnd_south_accords.22.t:0 "礼法既定"
 nesnd_south_accords.22.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]已颁诏施行新定礼法。各省学政在礼议院参预国政，内阁与六部承担中央施政之责，行省布政司依定议办理地方事务。朱明皇室从南府挟持下争得了施政的余地，也接受了礼法对君权的约束。\n\n这场改制保全了南明儒家特色的立宪民主联邦。各省及海外诸邦仍有自己的政府与辖地，而中央必须承担维持新制的经费。南、西两府昔日依兵力争执的权责，如今有了共同认可的裁断依据。"
 nesnd_south_accords.23.t:0 "吴朝立国"
 nesnd_south_accords.23.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]已登基称制，并颁诏施行新朝礼法。接受改省的中国辖地由中央接管，日本方面依约交出的四国、九州也归入吴朝统治。仍保有疆土的海外诸邦继续自行施政，与新朝另循既有条约往来。\n\n礼议院的议政之权与郑氏的君权共同列入国制，内阁及六部据此主持政务。自郑昭以来数代人用军队、工商业和海外经营积累的权势，如今终于成为郑氏自己的帝国。"
 nesnd_south_accords.done:0 "依礼法施行。"
 nesnd_south_negotiation_cost:0 "改制会商"
 nesnd_south_accord_respected:0 "践行改制承诺"
 nesnd_south_prepared_member:0 "军政有备"
 nesnd_south_prepared_mobilization:0 "有备奉调"
 nesnd_south_hasty_mobilization:0 "仓促奉调"
 nesnd_south_peace_administration:0 "和平建制"
 nesnd_south_new_province:0 "行省接管"
 nesnd_south_ready_unknown:0 "军政情形尚未报齐。"
 nesnd_south_ready_known:0 "军政筹备 #v [Country.MakeScope.Var('nesnd_ready_total').GetValue|1]/100#!（财政[Country.MakeScope.Var('nesnd_ready_finance').GetValue|1]/20，军务[Country.MakeScope.Var('nesnd_ready_military').GetValue|1]/35，供给[Country.MakeScope.Var('nesnd_ready_supply').GetValue|0]/25，政府[Country.MakeScope.Var('nesnd_ready_domestic').GetValue|1]/20）\n水手 #v [Country.MakeScope.Var('nesnd_ready_actual_crew').GetValue|D]#!。配员达标舰 #v [Country.MakeScope.Var('nesnd_ready_ships_ready').GetValue|0]/[Country.MakeScope.Var('nesnd_ready_ships').GetValue|0]#!。海军投射 #v [Country.MakeScope.Var('nesnd_ready_naval_projection').GetValue|1]#!。"
 nesnd_south_failed_alignment:0 "失势的主张"
 nesnd_south_peace_stability_tt:0 "易代压力低于#v 60#!，且没有[concept_bankruptcy]恢复期修正。"
 nesnd_south_ming_supply_tt:0 "中央所在市场的纸张、工具和轻武器价格均不高于基价#v 50%#!，本国没有对应的本地短缺。这些商品可以通过共同市场供应。"
 nesnd_south_peace_b1_note:0 "和平须在易代压力#v 60#!以下，并已结束[concept_bankruptcy]恢复期。明廷另须满足纸张、工具、轻武器的市场供应条件。"
 nesnd_board_external_observer:0 "域外观察"
 nesnd_south_reconciliation:0 "弥合朝争"
 nesnd_south_reconciliation_reason:0 "南朝诸省的军政关系经过陈东阳改制，已不同于北明旧日的藩镇。可是南府与西府之间的积怨，并不会随着一场礼议自行消失。各方既已支持同一路线，中央就须承担商定的行政经费，使礼法中拟定的权责能够真正施行。\n\n海外诸邦也在等待朝廷兑现承诺。逐月维持这些安排，才有机会让易代之争重新回到可以商议的地步。"
 nesnd_south_reconciliation_status:0 "已完成#v [ROOT.GetCountry.MakeScope.Var('nesnd_south_reconciliation_payments').GetValue|0]#!次月度履约。当前易代压力：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!。履约期间，[concept_budget_government_wages]开支#n +5%#!、[concept_authority]#n −50#!。压力降至#v 40#!时结束。"
 nesnd_south_reconciliation_start:0 "履行改制安排"
 nesnd_south_reconciliation_start_desc:0 "承担改制所需的行政经费，协调中央与各省的施政，并兑现对海外诸邦的承诺。"
 nesnd_south_reconciliation_stop:0 "暂停履行"
 nesnd_south_reconciliation_stop_desc:0 "停止为改制额外拨付行政经费。由此缓解朝争的努力也将中止。"
 nesnd_south_reconciliation_requirements:0 "所选明廷或吴朝路线满足其余和平条件。当前没有南朝内部的[concept_diplomatic_play]或战争，且中央不在[concept_bankruptcy]恢复期。"
 nesnd_south_reconciliation_effect_tt:0 "持续承担[concept_budget_government_wages]开支#n +5%#!和[concept_authority]#n −50#!。满#v 1个月#!后，所选路线的支持承诺、政治及财政条件每维持一个月，易代压力#p −3#!。遣使或续订承诺本身不降低压力。条件不再满足时停止履行，压力降至#v 40#!后结束。正式和平结局仍须连续维持#v 12个月#!。"
 nesnd_south_reconciliation_cost:0 "改制行政经费"
 nesnd_ming_royal_allowance:0 "明室岁费"
 nesnd_ming_receive_court_tt:0 "如合法明室成员已在本国避居，拥明将拥立其中在世的天子或储君，并保留原有地方领袖。王室由实际人物承接。无在世继承人时维持监国。"
 nesnd_court_followup.15.t:0 "明室岁费"
 nesnd_court_followup.15.d:0 "易代以后，留在[ROOT.GetCountry.GetName]的朱氏宗亲仍有衣食与居处之需。新朝可以供养这些失去帝位的宗室，使他们保有身份，也让旧日追随者看见朝廷对前朝的处置。数百年皇统留下的人与事，终究不能随国号一同消失。"
 nesnd_court_followup.15.a:0 "照例供养。"
 nesnd_court_followup.19.t:0 "各守成约"
 nesnd_court_followup.19.d:0 "易代之争已延续两年，朝廷仍未能使各方接受同一主张。南朝各省与海外诸邦继续按现有权力施政，拥明与拥吴的分歧也没有汇成一场共同的战争。\n\n我们可以就此停止此次国制交涉，承认眼前的疆界、政府与条约关系。谁也未能完成自己的改制目标，但至少不必再让天下等候一份迟迟不能议定的新法。"
 nesnd_court_followup.19.a:0 "各安现状，休息生民。"
 nesnd_court_followup.19.b:0 "会商继续。"
 nesnd_south_inconclusive_order:0 "议定现状"
 nesnd_south_inconclusive_order_desc:0 "两年来未能议定新制，也未形成靖难对峙。承认各方现有疆界、政府与条约关系，结束此次易代交涉。"
 nesnd_south_inconclusive_result_tt:0 "结束本轮明吴危机。保留各国当前领土、政体及实际条约。不吞并附属国，不颁发明廷或吴朝胜利奖励。"
 nesnd_federal_compact_button_alt_desc:0 "新政已使南朝无法退回旧日的藩镇格局，而杭州南府仍掌握着推行新政所需的兵财。易代改姓的时机已然成熟。我们应先遣使争取各省与海外诸邦，再请礼议院与内阁议定任官、赋额、军费、省制以及朱明皇室的地位。以礼法确立君权与议政之权，为郑氏称制奠定国制。"
 nesnd_south_reconsider_tt:0 "重新开始#v 12个月#!的连续履行期。"
