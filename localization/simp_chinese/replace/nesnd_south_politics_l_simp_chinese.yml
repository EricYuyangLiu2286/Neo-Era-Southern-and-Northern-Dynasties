 nesnd_south_holdout_campaign:0 "未息的南朝战事"
 nesnd_south_holdout_campaign_reason:0 "淮国有自己的营伍，菲律宾有自己的港口。在内地与海外，凡是曾与吴朝交战、停战后仍能自立的邦国，都还得为自己的兵民打算。有人准备再战，有人盼借北朝之力保住基业，也有人愿意归降。"
 nesnd_south_holdout_campaign_status:0 "朝廷正议定战后的安排。"
 nesnd_south_holdout_refuge_status:0 "明廷可以再议出奔，投往仍在迎战吴军的湖广或四川。"
 nesnd_south_holdout_front_status:0 "吴朝与靖难诸国仍在对峙。各国脱离战事后，仍须决定各自的去向。"
 nesnd_south_holdout_petition_status:0 "有靖难一方的政权已遣使北上，正等候北朝答复。若获接纳，该国便归北朝保护。"
 nesnd_south_holdout_truce_status:0 "吴朝与部分靖难一方的政权尚有停战约。即使已决意再战，也须等本国与吴朝的停战期满。"
 nesnd_south_holdout_wu_busy_status:0 "吴朝另有战事或外交博弈在身。朝廷须待此事结束，方可另行出兵或受降。"
 nesnd_south_holdout_resistance_status:0 "已有靖难一方的政权决意再战。待双方可以重新出兵，吴朝将再次发起[concept_diplomatic_play]。"
 nesnd_south_holdout_decision_status:0 "靖难诸国各自议定去向。愿归降者并入吴朝，北朝可接纳前来求援者，拒不归附者则准备再战。"
 nesnd_south_holdouts_settled_tt:0 "参战诸邦的去向已经确定，南朝战事已停。"
 nesnd_south_holdouts.1.t:0 "停战之后"
 nesnd_south_holdouts.1.d:0 "本国已经退出战事，与吴朝的争端却未了结。败报与求和的消息相继传来，军中仍有人不肯放下兵器。如今，是再度举兵、向北朝请求庇护，还是接受吴朝统治？"
 nesnd_south_holdouts.resist:0 "整军再战。"
 nesnd_south_holdouts.north:0 "遣使北上，请求庇护。"
 nesnd_south_holdouts.surrender:0 "向吴朝归降。"
 nesnd_south_holdouts_resist_tt:0 "决意再战。待停战期满，双方都已脱离其他战争与外交博弈，吴朝便可再次发起[concept_diplomatic_play]。"
 nesnd_south_holdouts_north_tt:0 "请求成为中华帝国的保护国。北朝将决定是否接纳。若未获保护，还须决定再战或归降。"
 nesnd_south_holdouts_surrender_tt:0 "本国将被大吴吞并。若明帝仍在本国，先安排其逃亡。"
 nesnd_south_holdouts.2.t:0 "南方来使"
 nesnd_south_holdouts.2.d:0 "[SCOPE.sCountry('nesnd_holdout_sender').GetName]的使者请求北朝保护。他们愿承认帝国的宗主地位，以求保住国土与军队。接受这份请求，便意味着帝国将在南朝纷争中承担新的责任。"
 nesnd_south_holdouts.accept:0 "接受归附。"
 nesnd_south_holdouts.refuse:0 "帝国无意承担此事。"
 nesnd_south_holdouts_accept_tt:0 "接纳来使所属国家为保护国。"
 nesnd_south_holdouts_refuse_tt:0 "不提供保护，由来使所属国家另作决定。"
 nesnd_south_holdouts.3.t:0 "北朝未允"
 nesnd_south_holdouts.3.d:0 "北朝未能给予我们保护。使者的往返没有改变眼前的局势：要保住自己的国土，便须重新迎战吴军。要结束这场争夺，便只能向吴朝归降。"
 nesnd_south_holdouts.4.t:0 "北朝的保护"
 nesnd_south_holdouts.4.d:0 "使者带回了接受归附的答复。我们的国土与军队得以保留，北朝也成为本国的宗主。战后的生活与秩序仍须由我们自己收拾。"
 nesnd_south_holdouts.4.a:0 "先让百姓休息吧。"
 nesnd_south_defender_in_campaign_war_tt:0 "本国正作为反吴一方参加#bold 靖难战争#!。"
