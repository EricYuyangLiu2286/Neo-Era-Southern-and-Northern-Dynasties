 nesnd_premier_btn_investigate:0 "调查反对派领袖"
 nesnd_premier_btn_investigate_desc:0 "授意检察机关调查[ROOT.GetCountry.GetCustom('nesnd_premier_rival_name')]。"
 nesnd_premier_btn_investigate_tt:0 "调查结果由事件决定。成功时[ROOT.GetCountry.GetCustom('nesnd_premier_rival_name')]被逐出国境，失败时平衡向在野一方偏移 #v 10#!。无论成败，[ROOT.GetCountry.GetCustom('nesnd_premier_rival_ig_name')]的激进派都会增加。成功率取决于首相人气，当前为 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_premier_arrest_chance')|0]%#!。"
 nesnd_premier_btn_dissolve:0 "奏请解散议会"
