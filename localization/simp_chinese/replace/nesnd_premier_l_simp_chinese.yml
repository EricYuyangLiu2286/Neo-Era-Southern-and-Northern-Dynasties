 nesnd_premier.1.t:0 "内阁改组"
 nesnd_premier.1.d:0 "[SCOPE.sInterestGroup('nesnd_premier_old_ig_scope').GetName]已不在政府中，原任首相随之去职。政府中影响力最大的[SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName]由领袖[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]出任首相，新内阁的人选与议程都要重新商定。"
 nesnd_premier.1.d_generic:0 "原任首相去职，[SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName]的领袖[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]出任首相，新内阁的人选与议程都要重新商定。"
 nesnd_premier.1.f:0 "“新任首相今日受命组阁。”\n——政府公报"
 nesnd_premier.1.a:0 "新内阁成立"
 nesnd_premier.1.tt:0 "改组已使政潮 #r +15#!"

 nesnd_premier.11.t:0 "议会质询"
 nesnd_premier.11.d_rival:0 "[SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName]的领袖[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]在议会中质询首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]，指责内阁施政失当，要求首相当场答复。"
 nesnd_premier.11.d_all:0 "各派议员在议会中轮番质询首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]，指责内阁施政失当，要求首相当场答复。"
 nesnd_premier.11.f:0 "“请首相就内阁近来的施政答复本院。”\n——议会质询记录"
 nesnd_premier.11.a:0 "当场驳斥"
 nesnd_premier.11.b:0 "承诺调查"

 nesnd_premier.12.t:0 "统治者与首相"
 nesnd_premier.12.d:0 "[SCOPE.sCharacter('nesnd_premier_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_premier_ruler_scope').GetFullName]召见首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]，对内阁的几项施政表示不满，希望首相收回成议。"
 nesnd_premier.12.f:0 "“首相今日奉召，就内阁施政当面陈述。”\n——政府公报"
 nesnd_premier.12.a:0 "首相让步"
 nesnd_premier.12.b:0 "坚持内阁的主张"

 nesnd_premier.13.t:0 "阁员丑闻"
 nesnd_premier.13.d:0 "报章揭发一名出自[SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName]的阁员滥用职权，把工程与特许交给亲友经营。反对者要求首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]表态。"
 nesnd_premier.13.f:0 "“本报取得的文件显示，该部的工程合同多数交给了同一家公司。”\n——报纸社论"
 nesnd_premier.13.a:0 "令其辞职"
 nesnd_premier.13.b:0 "首相出面担保"

 nesnd_premier.14.t:0 "报章评议"
 nesnd_premier.14.d:0 "首都几家大报连日评议首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]的施政，褒贬不一。内阁可以拨款资助立场友好的报纸，也可以不予理会。"
 nesnd_premier.14.f:0 "“首相是否称职，读者自有公论。”\n——报纸社论"
 nesnd_premier.14.a:0 "资助友好的报纸"
 nesnd_premier.14.b:0 "不予理会"

 nesnd_premier.15.t:0 "部长席位之争"
 nesnd_premier.15.d:0 "同在政府中的其他利益集团认为[SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName]占据的部长席位太多，要求重新分配。"
 nesnd_premier.15.f:0 "“本集团在内阁中的席位，与本集团在议会中的实力不相称。”\n——在朝集团致首相的信函"
 nesnd_premier.15.a:0 "让出部分席位"
 nesnd_premier.15.b:0 "维持现状"

 nesnd_premier.16.t:0 "预算案"
 nesnd_premier.16.d:0 "国库入不敷出，首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]必须向议会提出新的预算案。削减开支会加重下层民众的负担，另筹款项则会让首相承受批评。"
 nesnd_premier.16.f:0 "“本年度预算案提请本院审议。”\n——议会议事日程"
 nesnd_premier.16.a:0 "削减开支"
 nesnd_premier.16.b:0 "另筹款项"

 nesnd_premier.17.t:0 "首相请辞"
 nesnd_premier.17.d:0 "首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]主持内阁已逾五年，近日递上辞呈，请求退出政坛。"
 nesnd_premier.17.f:0 "“本人任事日久，恳请准予退职。”\n——首相辞呈"
 nesnd_premier.17.a:0 "慰留"
 nesnd_premier.17.b:0 "准其退休"
 nesnd_premier.17.b.tt:0 "[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]退出政坛。首相由[SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName]的新领袖接任，该集团不在政府中时，由政府中影响力最大的集团的领袖接任。政潮 #r +5#!"

 nesnd_premier.18.t:0 "补选"
 nesnd_premier.18.d:0 "议会有一个议席出缺，需要补选。[SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName]和它的对手都把这次补选看作对首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]的信任投票。"
 nesnd_premier.18.f:0 "“本选区补选定于下月举行。”\n——选举告示"
 nesnd_premier.18.a:0 "全力助选"
 nesnd_premier.18.b:0 "顺其自然"

 nesnd_premier.19.t:0 "本党议员倒戈"
 nesnd_premier.19.d:0 "[SCOPE.sInterestGroup('nesnd_premier_pm_ig_scope').GetName]对内阁不满，一批本集团的议员在表决中倒向对方，首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]的威信受到打击。"
 nesnd_premier.19.f:0 "“我们投票只对选民负责。”\n——倒戈议员的联名声明"
 nesnd_premier.19.a:0 "向本集团让步"
 nesnd_premier.19.b:0 "开除倒戈议员"

 nesnd_premier.20.t:0 "王室经费之争"
 nesnd_premier.20.d:0 "议会审议王室经费。反对者提议削减[SCOPE.sCharacter('nesnd_premier_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_premier_ruler_scope').GetFullName]的年俸与宫廷开支，首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]必须表明立场。"
 nesnd_premier.20.f:0 "“王室经费一项，提请本院审议。”\n——议会议事日程"
 nesnd_premier.20.a:0 "照旧拨付"
 nesnd_premier.20.b:0 "支持削减"

 nesnd_premier.21.t:0 "不信任案"
 nesnd_premier.21.d_rival:0 "[SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName]的领袖[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]在议会提出对首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]的不信任案，各派纷纷表态支持，内阁已难以维持。"
 nesnd_premier.21.d_all:0 "议会各派联名提出对首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]的不信任案，内阁已难以维持。"
 nesnd_premier.21.f:0 "“本院对首相已失去信任。”\n——不信任案原文"
 nesnd_premier.21.a:0 "首相辞职"
 nesnd_premier.21.b:0 "奏请解散议会"
 nesnd_premier.21.c:0 "拒不辞职"

 nesnd_premier.22.t:0 "首相专权"
 nesnd_premier.22.d:0 "议会中已无人能够制衡首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]，内阁的提案往往不经辩论即获通过。[SCOPE.sCharacter('nesnd_premier_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_premier_ruler_scope').GetFullName]召见首相，考虑如何处置。"
 nesnd_premier.22.f:0 "“本院今日表决的各项议案均获通过，无人反对。”\n——议会议事录"
 nesnd_premier.22.a:0 "罢免首相"
 nesnd_premier.22.b:0 "听之任之"
 nesnd_premier.22.c:0 "告诫首相"

 nesnd_premier.23.t:0 "行刺首相"
 nesnd_premier.23.d_dead:0 "首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]在公开场合遇刺身亡。"
 nesnd_premier.23.d_wounded:0 "首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]在公开场合遇刺，身负重伤，保住了性命。"
 nesnd_premier.23.d_escaped:0 "首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]在公开场合遭人行刺，刺客失手被捕。"
 nesnd_premier.23.f:0 "“警方已封锁现场，正在搜捕同谋。”\n——警察局通告"
 nesnd_premier.23.a:0 "严查到底"
 nesnd_premier.23.b:0 "安定人心"

 nesnd_premier.24.t:0 "反对派领袖遇险"
 nesnd_premier.24.d_dead:0 "[SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName]的领袖[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]遇袭身亡，凶手下落不明。"
 nesnd_premier.24.d_exiled:0 "[SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName]的领袖[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]被控参与密谋，遭逮捕后被逐出国境。"
 nesnd_premier.24.d_escaped:0 "[SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName]的领袖[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]遇袭后侥幸脱身，随即公开指责首相一方。"
 nesnd_premier.24.f:0 "“本集团领袖遇袭一事，必须彻查。”\n——在野集团的声明"
 nesnd_premier.24.a:0 "彻查此事"
 nesnd_premier.24.b:0 "不予追究"

 nesnd_premier.26.t:0 "调查反对派领袖"
 nesnd_premier.26.d_success:0 "检察机关查出了[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]的不法证据。[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]被定罪后逐出国境。"
 nesnd_premier.26.d_fail:0 "调查没有找到足以定罪的证据，[SCOPE.sCharacter('nesnd_premier_rival_scope').GetFullName]安然无恙。[SCOPE.sInterestGroup('nesnd_premier_rival_ig_scope').GetName]指责内阁滥用权力。"
 nesnd_premier.26.f:0 "“调查已经结束，检察机关将另行公布结论。”\n——司法部通告"
 nesnd_premier.26.a:0 "就此了结"

 nesnd_premier.31.t:0 "请愿运动"
 nesnd_premier.31.d:0 "各地民众联名请愿，要求内阁减轻负担、改善生计，请愿队伍聚集在议会门外。"
 nesnd_premier.31.f:0 "“我们请求议会倾听我们的声音。”\n——请愿书"
 nesnd_premier.31.a:0 "接见请愿代表"
 nesnd_premier.31.b:0 "驱散人群"

 nesnd_premier.32.t:0 "军方与内阁"
 nesnd_premier.32.d:0 "[SCOPE.sInterestGroup('nesnd_premier_army_scope').GetName]要求增加军费，指责首相[SCOPE.sCharacter('nesnd_premier_pm_scope').GetFullName]的内阁削弱国防。"
 nesnd_premier.32.f:0 "“军队的需要不能等到下一个预算年度。”\n——总参谋部致内阁的备忘录"
 nesnd_premier.32.a:0 "增加军费"
 nesnd_premier.32.b:0 "拒绝要求"
