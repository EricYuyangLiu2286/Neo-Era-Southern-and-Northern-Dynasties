l_simp_chinese:
 # 「统治者与内阁」。进度条明细见 nesnd_premier_bars_l_simp_chinese.yml（生成文件）。
 nesnd_premier_journal:0 "统治者与内阁"
 nesnd_premier_journal_reason:0 "[ROOT.GetCountry.GetName]的日常政务由内阁主持。首相必须是政府中某个[concept_interest_group]的领袖，首相在民间的人望决定内阁推行法律的快慢，也牵动政府的合法性。不在政府中的集团里，影响力最大的一个就是首相在议会中的主要对手。所有集团都已入阁时，首相要应付的是其余各派。政府改组后，首相所属的集团一旦不在政府中，首相便随之去职，由政府中影响力最大的集团的领袖接任。"
 nesnd_premier_status_vacant:0 "政府中暂时没有可以出任首相的集团领袖。内阁空缺期间，首相带来的修正暂停。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_premier_end_rules 失效条件#!#!"
 nesnd_premier_status_rival:0 "首相[ROOT.GetCountry.GetCustom('nesnd_premier_pm_name')]出自[ROOT.GetCountry.GetCustom('nesnd_premier_pm_ig_name')]。最大的在野集团是[ROOT.GetCountry.GetCustom('nesnd_premier_rival_ig_name')]，领袖为[ROOT.GetCountry.GetCustom('nesnd_premier_rival_name')]。平衡表示双方的消长，高于 #v 90#! 或低于 #v 10#! 时，满条的政潮有可能演变为极端事件。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_premier_end_rules 失效条件#!#!"
 nesnd_premier_status_all:0 "所有[concept_interest_group]都在政府中。平衡表示首相[ROOT.GetCountry.GetCustom('nesnd_premier_pm_name')]所属的[ROOT.GetCountry.GetCustom('nesnd_premier_pm_ig_name')]与其余各派的消长，高于 #v 90#! 或低于 #v 10#! 时，满条的政潮有可能演变为极端事件。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_premier_end_rules 失效条件#!#!"
 nesnd_premier_end_rules:0 "出现以下任一情况时，本日志暂停，日志带来的修正随之撤销：\n- 国家等级不再是帝国或霸权\n- 改行共和政体，改由「执政者与派系」接续\n- 可以任命宠臣，改由「宫廷力量」接续\n- 开启明内战、维持拿破仑王朝、宫廷与外省或伊犁的朝议日志\n条件恢复后日志自动重新开始。期间换过另一个日志的，平衡回到中点，政潮清零。"

 nesnd_premier_cond_no_favorites:0 "不能任命宠臣：权力分配不是独裁、寡头、地产投票或技术官僚，或本国是共主邦"
