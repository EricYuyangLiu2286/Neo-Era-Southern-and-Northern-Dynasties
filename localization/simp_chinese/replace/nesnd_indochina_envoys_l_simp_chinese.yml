l_simp_chinese:
 nesnd_south_indochina_envoy:0 "遣使南疆"
 nesnd_south_indochina_envoy_desc:0 "海外的藩属与屯垦地是南朝的属国，宗主一旦用兵，就要奉调出兵。我们派出使者，请它们在易代之争中按兵不动。"
 nesnd_indochina_envoy_window_tt:0 "内战尚未爆发。"
 nesnd_indochina_envoy_cooldown_tt:0 "距上次遣使已满#v 6个月#!。"
 nesnd_indochina_envoy_target_tt:0 "海外仍有尚未作出最终答复的南朝属国。"
 nesnd_indochina_envoy_outcome_tt:0 "使者前往拥吴各国中立场最不坚定、尚未答复的一国，#v 7天#!后抵达。对方可以拒绝，每国最多遣使#v 两次#!。"
 nesnd_indochina_envoys:0 "南疆使团"
 nesnd_indochina_envoys_desc:0 "随使团出行的官员离开了原来的职位。"
 nesnd_indochina.1.t:0 "[SCOPE.sCountry('nesnd_indochina_sender').GetNameNoFormatting]的使者"
 nesnd_indochina.1.t_rumour:0 "风闻南朝将乱"
 nesnd_indochina.1.d:0 "[SCOPE.sCountry('nesnd_indochina_sender').GetName]的使者来到[ROOT.GetCountry.GetName]。使者说，杭州南府的郑氏掌握[SCOPE.sCountry('nesnd_indochina_overlord').GetName]的兵财已久，迟早要改换帝统。一旦如此，西府诸省必然起兵，[ROOT.GetCountry.GetName]作为藩属也要奉调北上。[SCOPE.sCountry('nesnd_indochina_sender').GetName]请我们届时按兵不动，只照常纳贡，不随宗主出兵。"
 nesnd_indochina.1.d_rumour:0 "[SCOPE.sCountry('nesnd_indochina_overlord').GetName]传来消息，明廷与杭州南府已势同水火，易代之争随时可能爆发。[ROOT.GetCountry.GetName]身为藩属，到时要奉调随宗主出兵。政府必须在战事爆发之前决定，是奉调出兵，还是按兵不动、只照常纳贡。"
 nesnd_indochina.1.a:0 "静观其变"
 nesnd_indochina.1.a_tt:0 "易代之争爆发时，本国不随宗主参战。若南府一方赢得内战，可能追究此事。"
 nesnd_indochina.1.b:0 "谨守藩职"
 nesnd_indochina.2.t:0 "南疆回音"
 nesnd_indochina.2.d_accepted:0 "[SCOPE.sCountry('nesnd_indochina_target').GetName]接受了我们的请求，已改为只向[SCOPE.sCountry('nesnd_indochina_overlord').GetName]纳贡、不出兵的属国。易代之争爆发时，它的军队不会北上。"
 nesnd_indochina.2.d_refused:0 "[SCOPE.sCountry('nesnd_indochina_target').GetName]谢绝了我们的使者，仍将随[SCOPE.sCountry('nesnd_indochina_overlord').GetName]出兵。"
 nesnd_indochina.2.a:0 "少了一路敌军。"
 nesnd_indochina.2.b:0 "只能另想办法。"
 nesnd_indochina.3.t:0 "锦衣卫密报"
 nesnd_indochina.3.d_envoy:0 "锦衣卫密报：[SCOPE.sCountry('nesnd_indochina_sender').GetName]的使团近日到了[SCOPE.sCountry('nesnd_indochina_target').GetName]。线人混在使团的随从之中，探知双方已私下立约：[SCOPE.sCountry('nesnd_indochina_sender').GetName]若举兵与朝廷为敌，[SCOPE.sCountry('nesnd_indochina_target').GetName]按兵不动，不发一兵相助。"
 nesnd_indochina.3.d_rumour:0 "锦衣卫密报：线人在[SCOPE.sCountry('nesnd_indochina_target').GetName]宫中探知，[SCOPE.sCountry('nesnd_indochina_target').GetName]已暗中定计，各藩若举兵与朝廷为敌，[SCOPE.sCountry('nesnd_indochina_target').GetName]按兵不动。此事未见别家使者牵线，是[SCOPE.sCountry('nesnd_indochina_target').GetName]自作的主张。"
 nesnd_indochina.3.d_refused:0 "锦衣卫密报：[SCOPE.sCountry('nesnd_indochina_sender').GetName]遣使至[SCOPE.sCountry('nesnd_indochina_target').GetName]，劝它在[SCOPE.sCountry('nesnd_indochina_sender').GetName]举兵与朝廷为敌时按兵不动。[SCOPE.sCountry('nesnd_indochina_target').GetName]回绝了来使，仍言届时听候朝廷征调。"
 nesnd_indochina.3.a:0 "此事记档，不必声张。"
 nesnd_indochina.10.t:0 "南疆清算"
 nesnd_indochina.10.d:0 "易代之争已经结束。[SCOPE.sCountry('nesnd_indochina_target').GetName]在战时按兵不动，至今仍只向[ROOT.GetCountry.GetName]纳贡，不承担出兵的义务。"
 nesnd_indochina.10.a:0 "恢复出兵的义务"
 nesnd_indochina.10.b:0 "兴师问罪"
 nesnd_indochina.10.c:0 "既往不咎"
 nesnd_indochina.10.c_tt:0 "[SCOPE.sCountry('nesnd_indochina_target').GetName]仍为只纳贡、不出兵的属国。"
