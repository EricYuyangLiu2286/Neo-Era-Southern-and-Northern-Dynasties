 nesnd_crimea_stalemate_conclusion:0 "十年过去，围绕克里米亚与高加索的争端未能分出胜负。"
 nesnd_crimea_inconclusive_conclusion:0 "土俄之间的较量没有分出胜负，克里米亚的争端暂且搁置。"
 nesnd_crimea_stalemate_event_tt:0 "冲突无果而终，交战双方各损少许[concept_prestige]。"
 nesnd_crimea_invalid_conclusion:0 "克里米亚战争的当事国已不复存在。"
 nesnd_crimea_ally_tur_win_conclusion:0 "奥斯曼一方赢得了克里米亚战争。"
 nesnd_crimea_ally_rus_win_conclusion:0 "俄国赢得了克里米亚战争。"
 nesnd_crimea_ally_joined_win_tt:0 "本国出兵并赢得胜利：永久获得「$nesnd_crimea_ally_victory$」修正，并与奥斯曼改善[concept_relations]。"
 nesnd_crimea_ally_stayed_out_tur_win_tt:0 "本国未介入战事：与奥斯曼的[concept_relations]下降。"
 nesnd_crimea_ally_joined_loss_tt:0 "本国出兵但战败：永久获得「$nesnd_crimea_ally_defeat$」修正，并与俄国的[concept_relations]下降。"
 nesnd_crimea_ally_stayed_out_rus_win_tt:0 "本国置身事外：与俄国的[concept_relations]改善。"
 nesnd_crimea_ally_joined_draw_tt:0 "本国曾出兵声援：与奥斯曼的[concept_relations]略有改善。"
 nesnd_crimea_ally_stayed_out_draw_tt:0 "本国置身事外：与奥斯曼的[concept_relations]略微转冷。"
 nesnd_ottoman_caliphate:0 "哈里发的帝国"
 nesnd_ottoman_concert:0 "欧洲列强"
 nesnd_ottoman_crimean_humiliation:0 "克里米亚之耻"
 nesnd_ottoman_leader_unclaimed:0 "虚悬的领袖名分"
 nesnd_ottoman_tribes_funded:0 "奥斯曼暗助边疆诸部"
 nesnd_qe1_frontier_bolstered:0 "整饬边防"
 nesnd_crimea_victory:0 "黑海大捷"
 nesnd_crimea_defeat:0 "黑海败绩"
 nesnd_crimea_stalemate:0 "黑海僵局"
 nesnd_crimea_ally_victory:0 "克里米亚联军凯旋"
 nesnd_crimea_ally_defeat:0 "克里米亚出兵失利"
 nesnd_ottoman_recovery.12.t:0 "哈里发还是列强"
 nesnd_ottoman_recovery.12.d:0 "经过多年的征战与经营，[ROOT.GetCountry.GetName]在近东、高加索与中亚方向立住了威信。伊斯坦布尔的官邸里，两种外交主张摆到了[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]面前。\n\n[SCOPE.gsInterestGroup('nesnd_devout_ig').GetName]主张重申帝国在正义吉哈德里赢得的领袖地位，高举哈里发旗号，号召中亚与近东的穆斯林归心。另一些外交官则认为，帝国应当以对等大国身份融入欧洲协调，同伦敦与巴黎缔结条约，借西方列强的力量长久制衡北方强邻。"
 nesnd_ottoman_recovery.12.f:0 "“帝国坐镇博斯普鲁斯海峡，东望麦加与河中，西接巴黎与伦敦。”\n——伊斯坦布尔外交部的备忘录"
 nesnd_ottoman_recovery.12.a:0 "高举哈里发的旗号。"
 nesnd_ottoman_recovery.12.b:0 "以欧洲列强的身份立身。"
 nesnd_ottoman_recovery.13.t:0 "克里米亚之耻"
 nesnd_ottoman_recovery.13.d:0 "对[SCOPE.sCountry('nesnd_rus_country').GetName]的战事以失利告终，巴格达也未能回到[ROOT.GetCountry.GetName]手中。从大马士革到开罗，各地清真寺里议论纷纷，人们开始怀疑伊斯坦布尔是否还能护卫伊斯兰世界。\n\n内阁不得不收拢战线，扩张的雄心一时冷却。"
 nesnd_ottoman_recovery.13.d_plain:0 "黑海的战事以失利告终，巴格达也未能回到[ROOT.GetCountry.GetName]手中。从大马士革到开罗，各地清真寺里议论纷纷，人们开始怀疑伊斯坦布尔是否还能护卫伊斯兰世界。\n\n内阁不得不收拢战线，扩张的雄心一时冷却。"
 nesnd_ottoman_recovery.13.f:0 "“黑海受挫，两河未复，诸省观望。”\n——呈送内阁的边情密报"
 nesnd_ottoman_recovery.13.a:0 "先守住手里的行省。"
 nesnd_ottoman_recovery.13.a_tt:0 "东方秩序转入「$nesnd_ottoman_recovery$」原有的结局检查。"
 nesnd_ottoman_recovery.14.t:0 "黑海捷报"
 nesnd_ottoman_recovery.14.d:0 "停战文书已经送达伊斯坦布尔，[SCOPE.sCountry('nesnd_rus_country').GetName]在黑海与高加索的攻势遭到挫败。坦志麦特以来整顿的陆军经受了实战检验，各省报馆竞相刊出前线战报。\n\n黑海沿岸与高加索山口的主动权落入[ROOT.GetCountry.GetName]手中，各地穆斯林对伊斯坦布尔的呼声随之高涨。"
 nesnd_ottoman_recovery.14.d_plain:0 "停战文书已经送达伊斯坦布尔，黑海与高加索的战事以[ROOT.GetCountry.GetName]获胜告终。坦志麦特以来整顿的陆军经受了实战检验，各省报馆竞相刊出前线战报。\n\n黑海沿岸与高加索山口的主动权落入帝国手中，各地穆斯林对伊斯坦布尔的呼声随之高涨。"
 nesnd_ottoman_recovery.14.f:0 "“俄军退守北岸，高加索诸隘皆通。”\n——陆军部发往各省的捷报"
 nesnd_ottoman_recovery.14.a:0 "宣告帝国的胜利。"
 nesnd_ottoman_recovery.14.a_tt:0 "此胜将推动「$nesnd_ottoman_islam_leader$」达成完成结局。"
 nesnd_ottoman_recovery.15.t:0 "黑海失利"
 nesnd_ottoman_recovery.15.d:0 "前线溃退的消息传回伊斯坦布尔，[ROOT.GetCountry.GetName]被迫向[SCOPE.sCountry('nesnd_rus_country').GetName]让步。议政厅里指责之声四起，宪政派议员痛陈军方专断导致备战失当，要求立刻扩大文官与议会的监督权力。\n\n[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]面前摆着一叠弹劾书，军队的高级将领一时无言以对。"
 nesnd_ottoman_recovery.15.d_plain:0 "前线溃退的消息传回伊斯坦布尔，[ROOT.GetCountry.GetName]被迫接受不利的和约。议政厅里指责之声四起，宪政派议员痛陈军方专断导致备战失当，要求立刻扩大文官与议会的监督权力。\n\n[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]面前摆着一叠弹劾书，军队的高级将领一时无言以对。"
 nesnd_ottoman_recovery.15.f:0 "“兵败于北疆，皆因军营不受宪章节制。”\n——伊斯坦布尔报馆的社论"
 nesnd_ottoman_recovery.15.a:0 "重整残局。"
 nesnd_ottoman_recovery.15.a_tt:0 "若巴格达也未归本国直辖，「$nesnd_ottoman_islam_leader$」将走向失败。"
 nesnd_crimea.1.t:0 "黑海先机"
 nesnd_crimea.1.d:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]在坦志麦特之后重新整顿了陆军，并打着伊斯兰领袖的旗号联络欧亚列强。圣彼得堡的参谋官认为，与其坐等伊斯坦布尔完成动员并拉拢西方盟友，不如由[ROOT.GetCountry.GetName]先行在多瑙河口或高加索发难。\n\n外交部的大臣提醒宫廷，一旦开战，法国与西秦都可能趁机介入。"
 nesnd_crimea.1.f:0 "“若任由土耳其人整军经武，黑海舰队将无出海之日。”\n——圣彼得堡总参谋部的呈文"
 nesnd_crimea.1.a:0 "先发制人，向奥斯曼施压。"
 nesnd_crimea.1.b:0 "暂缓用兵，静观其变。"
 nesnd_crimea.1.b_tt:0 "暂不发起[concept_diplomatic_play]，三年内不再重复提议。"
 nesnd_crimea.2.t:0 "奥斯曼求援"
 nesnd_crimea.2.d:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]驻巴黎使节紧急求见，通报与[SCOPE.sCountry('nesnd_rus_country').GetName]围绕黑海与高加索的争端已经升级，恳请[ROOT.GetCountry.GetName]出兵相助。\n\n使节呈上了伊斯坦布尔的求援照会，称俄军正沿黑海与高加索一线调动兵力。陆军与海军部已将地中海东岸的兵力部署呈送内阁，等候巴黎对海峡局势作出答复。"
 nesnd_crimea.2.f:0 "“海峡若落入俄国之手，地中海的均势便不复存在。”\n——巴黎外交部的密电"
 nesnd_crimea.2.a:0 "出兵支援奥斯曼。"
 nesnd_crimea.2.b:0 "法国不卷入这场战争。"
 nesnd_crimea.3.t:0 "黑海凯旋"
 nesnd_crimea.3.d:0 "与[SCOPE.sCountry('nesnd_tur_country').GetName]的战事以[ROOT.GetCountry.GetName]获胜告终。圣彼得堡的宫廷里欢声雷动，俄军在高加索与黑海方向的屏障得以巩固，伊斯坦布尔重振威望的企图遭到沉重打击。"
 nesnd_crimea.3.d_plain:0 "黑海与高加索的战事以[ROOT.GetCountry.GetName]获胜告终。圣彼得堡的宫廷里欢声雷动，帝国在南方边境的屏障得以巩固。"
 nesnd_crimea.3.f:0 "“黑海波平，南方边境自此安稳。”\n——圣彼得堡宫廷的贺表"
 nesnd_crimea.3.a:0 "巩固南方战果。"
 nesnd_crimea.4.t:0 "黑海受挫"
 nesnd_crimea.4.d:0 "在黑海与高加索的较量中，[ROOT.GetCountry.GetName]未能压倒[SCOPE.sCountry('nesnd_tur_country').GetName]及其盟友。战报传回圣彼得堡，朝野上下震动，将军们承认帝国的后勤与军制落后于对手。\n\n帝国被迫暂时收缩南下脚步，在北方整顿军备与财政。"
 nesnd_crimea.4.d_plain:0 "在黑海与高加索的较量中，[ROOT.GetCountry.GetName]未能压倒对手。战报传回圣彼得堡，朝野上下震动，将军们承认帝国的后勤与军制亟待整顿。"
 nesnd_crimea.4.f:0 "“补给难继，前线将士徒有勇武。”\n——克里米亚前线的退兵呈报"
 nesnd_crimea.4.a:0 "整顿军备，以待来日。"
 nesnd_ottoman_qe1.1.t:0 "奥斯曼资助诸部"
 nesnd_ottoman_qe1.1.d:0 "边疆军镇截获了一批由西方商队偷运入境的银钱与火器。审讯商队头目后，官府查明这批资助来自[SCOPE.sCountry('nesnd_tur_country').GetName]，收受者正是暗中串联的草原与阿富汗部族头人。\n\n商队头目的供词与查获的清单已经送抵朝廷，上面列着沿途接应的部族名录。与此同时，多处边镇报称关外骑队往来频密，几名领有官职的头人托词推诿，迟迟不肯入镇议事。"
 nesnd_ottoman_qe1.1.f:0 "“西商挟火器银两入关，称奉伊斯坦布尔之命联络诸部。”\n——边疆军镇的密奏"
 nesnd_ottoman_qe1.1.a:0 "照会抗议，视之为敌。"
 nesnd_ottoman_qe1.1.b:0 "拨款增兵，加强边防。"
 nesnd_ottoman_qe1.2.t:0 "奥斯曼邀约抗俄"
 nesnd_ottoman_qe1.2.d:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]派出的特使抵达朝廷，呈递国书，提议两国抛开近西战争的旧怨，缔结共同防御条约，联手遏制[SCOPE.sCountry('nesnd_rus_country').GetName]向中亚与高加索渗透。\n\n使团随国书附上了条约草案与往来联络细则，正在馆驿等候朝廷答复。近来北疆边镇接连报称，俄军在草原北缘增修据点，巡骑屡次逼近[ROOT.GetCountry.GetName]的驻防线。"
 nesnd_ottoman_qe1.2.f:0 "“俄人南窥高加索与草原，两国合则两利。”\n——奥斯曼特使呈递的国书"
 nesnd_ottoman_qe1.2.a:0 "签署共同防御条约。"
 nesnd_ottoman_qe1.2.b:0 "婉拒伊斯坦布尔的提议。"
 nesnd_ottoman_qe1.3.t:0 "奥斯曼请兵抗俄"
 nesnd_ottoman_qe1.3.d:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]与[SCOPE.sCountry('nesnd_rus_country').GetName]围绕黑海与高加索的冲突已经爆发，伊斯坦布尔紧急遣使来求援，请[ROOT.GetCountry.GetName]出兵夹击俄国。\n\n奥斯曼急使呈上火漆密函，转报俄军主力正大批西调，驰援黑海与高加索前线。北方边镇随之传回军情，称俄国在草原一线的驻军较往日空虚，边地各营正在等候朝廷号令。"
 nesnd_ottoman_qe1.3.f:0 "“黑海战端已开，请贵国同举义师，共制俄人。”\n——伊斯坦布尔发往西秦的急书"
 nesnd_ottoman_qe1.3.a:0 "出兵支援奥斯曼。"
 nesnd_ottoman_qe1.3.b:0 "按兵不动，静观战局。"
 nesnd_ottoman_academy_1:0 "学院与报馆：大学"
 nesnd_ottoman_academy_1_reason:0 "坦志麦特时期开办的新式学堂与报馆，亟须在宪政的帝国里扎根。国家必须兴办大学与公立学校，普及全民[concept_literacy]，把世俗学识推向各省。\n\n乌理玛仍力守[GetLawType('law_religious_schools').GetName]与旧学传统。帝国必须在二十五年内依次完成四环建设，否则学校主导权将重归乌理玛。"
 nesnd_ottoman_academy_2:0 "学院与报馆：公立学校"
 nesnd_ottoman_academy_2_reason:0 "大学与识字基础已经立住，下一环是将初等与中等教育纳入国家体制。唯有推行[GetLawType('law_public_schools').GetName]，国家兴办的新式学堂才能在各省持续运转。\n\n乌理玛正借宗教团体抵制世俗办学。全部四环须在自第一环开启起满二十五年内完成。"
 nesnd_ottoman_academy_3:0 "学院与报馆：报馆与集会"
 nesnd_ottoman_academy_3_reason:0 "新式大学与[GetLawType('law_public_schools').GetName]培养出的读者日渐增多，伊斯坦布尔与各省的报馆、学会要求更宽阔的公共空间。帝国须确立[GetLawType('law_right_of_assembly').GetName]或[GetLawType('law_protected_speech').GetName]，让公共讨论在法律保障下延续。\n\n乌理玛仍紧盯每一项世俗化举措。全部四环须在自第一环开启起满二十五年内完成。"
 nesnd_ottoman_academy_4:0 "学院与报馆：艺术学院"
 nesnd_ottoman_academy_4_reason:0 "大学、[GetLawType('law_public_schools').GetName]与公开报馆均已确立，帝国的启蒙事业只差最后一环：在境内兴建至少一座艺术学院，以文学、美术与建筑承接新式教育的风气。\n\n若能在自第一环开启起满二十五年内建成，这场启蒙运动将在宪政的帝国里站稳脚跟。"
 nesnd_ottoman_academy_1_status:0 "第一环（共四环）：扩建大学并提升全国[concept_literacy]。"
 nesnd_ottoman_academy_2_status:0 "第二环（共四环）：通过并施行[GetLawType('law_public_schools').GetName]。"
 nesnd_ottoman_academy_3_status:0 "第三环（共四环）：确立[GetLawType('law_right_of_assembly').GetName]或[GetLawType('law_protected_speech').GetName]。"
 nesnd_ottoman_academy_4_status:0 "第四环（共四环）：在本国建成艺术学院。"
 nesnd_ottoman_academy_1_win_conclusion:0 "帝国的大学与识字根基已经打牢，教育改革转入第二环。"
 nesnd_ottoman_academy_1_win_event_kemal_tt:0 "开启下一环「$nesnd_ottoman_academy_2$」，并触发事件「$nesnd_ottoman_recovery.16.t$」。"
 nesnd_ottoman_academy_1_win_event_tt:0 "开启下一环「$nesnd_ottoman_academy_2$」。"
 nesnd_ottoman_academy_2_win_conclusion:0 "[GetLawType('law_public_schools').GetName]已经施行，学校体系转入公共报馆与集会一环。"
 nesnd_ottoman_academy_2_win_event_tt:0 "开启下一环「$nesnd_ottoman_academy_3$」。"
 nesnd_ottoman_academy_3_win_conclusion:0 "报馆与集会获得法律保障，启蒙事业进入最后一环。"
 nesnd_ottoman_academy_3_win_event_tt:0 "开启下一环「$nesnd_ottoman_academy_4$」。"
 nesnd_ottoman_academy_4_win_conclusion:0 "大学、公立学校、报馆与艺术学院相继落成，新式学风在宪政的帝国扎下根基。"
 nesnd_ottoman_academy_4_win_event_tt:0 "完成全部四环：永久获得「$nesnd_ottoman_enlightenment$」修正，推动知识分子集团意识形态转向进步；若「$nesnd_ottoman_charter$」仍在进行，宪政派在#v 60#!个月内多算#v 1#!项。"
 nesnd_ottoman_academy_timeout_tt:0 "自「$nesnd_ottoman_academy_1$」开启起已满#v 300#!个月"
 nesnd_ottoman_academy_ulema_conclusion:0 "二十五年过去，世俗教育与报馆未能全部落成，乌理玛重新掌住了帝国的学堂。"
 nesnd_ottoman_academy_ulema_event_tt:0 "乌理玛胜出：若尚未施行且条件允许，帝国改行[GetLawType('law_religious_schools').GetName]；永久获得「$nesnd_ottoman_ulema_schools$」修正；若「$nesnd_ottoman_charter$」仍在进行，军营一派在#v 60#!个月内多算#v 1#!项。"
 nesnd_ottoman_academy_invalid_conclusion:0 "宪政的帝国已不复存在，学院与报馆的建制就此中止。"
 nesnd_ottoman_academy_ring1:0 "帝国大学初兴"
 nesnd_ottoman_academy_ring2:0 "公立学堂成制"
 nesnd_ottoman_academy_ring3:0 "报馆与公开议政"
 nesnd_ottoman_academy_ring4:0 "帝国艺术学院"
 nesnd_ottoman_academy_ulema_backlash:0 "乌理玛守旧反击"
