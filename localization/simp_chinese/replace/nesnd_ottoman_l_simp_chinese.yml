 nesnd_ottoman_recovery_eastern_order_event_tt:0 "触发事件「$nesnd_ottoman_recovery.3.t$」，二选一：\n• $nesnd_ottoman_recovery.3.a$：对中亚边疆五州获得[concept_claim]\n• $nesnd_ottoman_recovery.3.b$：永久提高[concept_legitimacy]，「$nesnd_ottoman_unity$」的$nesnd_ottoman_unity_order_desc$每月多#v 0.1#!"
 nesnd_ottoman_recovery_old_order_conclusion:0 "都城失去了屏障，重整东方秩序的计划就此终止。"
 nesnd_ottoman_recovery_old_order_event_tt:0 "触发事件「$nesnd_ottoman_recovery.4.t$」，二选一：\n• $nesnd_ottoman_recovery.4.a$：首都迁往安卡拉（须持有安卡拉的土地）\n• $nesnd_ottoman_recovery.4.b$：与夺走东色雷斯之国的宿敌改善关系"
 nesnd_ottoman_enthusiasm_reset_tt:0 "$nesnd_ottoman_enthusiasm_bar$归零"
 nesnd_ottoman_claims_voided_tt:0 "扩张热情按钮涉及的各州，本国的[concept_claim]一律作废"
 nesnd_ottoman_recovery.3.t:0 "东方秩序"
 nesnd_ottoman_recovery.3.d:0 "1723 年夏，秦军在巴格达城下撤围，这一仗成了第四次近西战争的转折点。巴格达、摩苏尔、巴士拉、叙利亚和阿勒颇都已归[ROOT.GetCountry.GetName]直辖，两河与叙利亚连成一片。\n\n伊斯坦布尔的军官认为，下一步应当越过呼罗珊，向赫拉特和河中进军。另一些大臣主张先治理好新得的城市，让当地的穆斯林把[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]的政府当作自己的政府。"
 nesnd_ottoman_recovery.3.f:0 "“自巴格达、摩苏尔、巴士拉至叙利亚、阿勒颇，各地一体奉行帝国法令。”\n——两河归入版图后的诏令"
 nesnd_ottoman_recovery.3.a:0 "继续东进"
 nesnd_ottoman_recovery.3.b:0 "巩固"
 nesnd_ottoman_recovery.3.no_frontier_tt:0 "中亚边疆五州眼下没有可以宣称的土地。"
 nesnd_ottoman_recovery.3.b_tt:0 "「$nesnd_ottoman_unity$」的$nesnd_ottoman_unity_order_desc$每月多#v 0.1#!"
 nesnd_ottoman_recovery.4.t:0 "旧秩序的终结"
 nesnd_ottoman_recovery.4.d:0 "[SCOPE.sCountry('nesnd_thrace_taker').GetName]夺走了东色雷斯的土地，帝国的都城失去了屏障。一百多年前，俄国与秦国的军队兵临伊斯坦布尔，也没能攻破这座城。\n\n大臣们只剩两条路：迁往安纳托利亚腹地，或者向[SCOPE.sCountry('nesnd_thrace_taker').GetName]的宿敌求援。"
 nesnd_ottoman_recovery.4.d_unknown:0 "东色雷斯已经不再完整地属于帝国，帝国的都城失去了屏障。一百多年前，俄国与秦国的军队兵临伊斯坦布尔，也没能攻破这座城。\n\n大臣们只剩两条路：迁往安纳托利亚腹地，或者向外国求援。"
 nesnd_ottoman_recovery.4.f:0 "“东色雷斯已失，伊斯坦布尔门户洞开。”\n——发往各省的急报"
 nesnd_ottoman_recovery.4.a:0 "迁都安卡拉"
 nesnd_ottoman_recovery.4.b:0 "求援"
 nesnd_ottoman_recovery.4.no_rival_tt:0 "眼下没有与对方互为宿敌的国家可以求援。"
 nesnd_ottoman_recovery.5.t:0 "宪政的帝国"
 nesnd_ottoman_recovery.5.d:0 "坦志麦特完成以后，[ROOT.GetCountry.GetName]有了新式的学校、军队和文官。主持改革的人认为，下一步应当用一部宪章约束大臣和[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]，让[SCOPE.gsInterestGroup('nesnd_route_charter_ig').GetName]这样受过新式教育的人进入政府。\n\n秦式军改培养出的军官另有主张。他们认为改革的成果靠的是军队的纪律，帝国应当号令统一，不必设议会。[SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName]和改革派都自认是坦志麦特的继承人。"
 nesnd_ottoman_recovery.5.d_plain:0 "坦志麦特完成以后，[ROOT.GetCountry.GetName]有了新式的学校、军队和文官。主持改革的人认为，下一步应当用一部宪章约束大臣和[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]，让[SCOPE.gsInterestGroup('nesnd_route_charter_ig').GetName]这样受过新式教育的人进入政府。\n\n军官们另有主张。他们认为改革的成果靠的是军队的纪律，帝国应当号令统一，不必设议会。[SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName]和改革派都自认是坦志麦特的继承人。"
 nesnd_ottoman_recovery.5.f:0 "“大臣与苏丹，皆受本宪章约束。”\n——改革派起草的宪章草案"
 nesnd_ottoman_recovery.5.a:0 "宪章先行"
 nesnd_ottoman_recovery.5.b:0 "军营先行"
 nesnd_ottoman_recovery.6.t:0 "苏丹的帝国"
 nesnd_ottoman_recovery.6.d:0 "老[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]死后，新[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]在一个四分五裂的帝国里即位。附属国纷纷离去，列强不再把[ROOT.GetCountry.GetName]当作对等的国家，坦志麦特也没能让帝国完成现代化。\n\n[SCOPE.gsInterestGroup('nesnd_route_faith_ig').GetName]劝新[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]亲自执政，以伊斯兰世界领袖的名义号召各地穆斯林团结在伊斯坦布尔周围。秦式军改培养出的军官则认为，只有军队能够守住剩下的土地，[SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName]要求把政府交给懂得打仗的人。"
 nesnd_ottoman_recovery.6.d_plain:0 "老[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]死后，新[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]在一个四分五裂的帝国里即位。附属国纷纷离去，列强不再把[ROOT.GetCountry.GetName]当作对等的国家，坦志麦特也没能让帝国完成现代化。\n\n[SCOPE.gsInterestGroup('nesnd_route_faith_ig').GetName]劝新[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]亲自执政，以伊斯兰世界领袖的名义号召各地穆斯林团结在伊斯坦布尔周围。军官们则认为，只有军队能够守住剩下的土地，[SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName]要求把政府交给懂得打仗的人。"
 nesnd_ottoman_recovery.6.f:0 "“请[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]亲自执政，以伊斯兰世界领袖的名义号召各地穆斯林。”\n——呈给新[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]的请愿书"
 nesnd_ottoman_recovery.6.a:0 "苏丹亲政"
 nesnd_ottoman_recovery.6.b:0 "依靠军营"
 nesnd_ottoman_recovery.7.t:0 "诸民同心"
 nesnd_ottoman_recovery.7.d:0 "接连三年，[ROOT.GetCountry.GetName]各地没有出现大的离心风潮。安纳托利亚的官员、各省的地方势力和新近归附的各族，都开始把奥斯曼政府当作处理自己事务的地方。\n\n帝国走宪政还是走[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]亲政，各族在政府里的位置还要再争。"
 nesnd_ottoman_recovery.7.f:0 "“各族臣民的事务，由帝国政府一体处理。”\n——政府公报"
 nesnd_ottoman_recovery.7.a:0 "善待各州的主体民族。"
 nesnd_ottoman_recovery.7.no_state_tt:0 "眼下各个已整合州的最大文化都是本国的主要文化。"
 nesnd_ottoman_recovery.8.t:0 "诸民离心"
 nesnd_ottoman_recovery.8.d:0 "接连两年，[ROOT.GetCountry.GetName]的团结度一直低迷。在[SCOPE.sState('nesnd_discord_state').GetName]这样[SCOPE.sCulture('nesnd_turkish_culture').GetName]人不占多数的地方，人们不再相信伊斯坦布尔会照顾他们的利益。\n\n政府已经失去了这些地方的人心。"
 nesnd_ottoman_recovery.8.d_none:0 "接连两年，[ROOT.GetCountry.GetName]的团结度一直低迷。各地的人们不再相信伊斯坦布尔会照顾他们的利益。\n\n政府已经失去了地方的人心。"
 nesnd_ottoman_recovery.8.f:0 "“伊斯坦布尔不会照顾我们的利益。”\n——各省流传的传单"
 nesnd_ottoman_recovery.8.a:0 "各省的怨气只能慢慢平息。"
 nesnd_ottoman_recovery.8.no_state_tt:0 "目前没有土耳其人不占多数的州。"
 nesnd_ottoman_charter:0 "宪章与军营"
 nesnd_ottoman_charter_reason:0 "坦志麦特完成以后，主持改革的人要一部宪章，让受过新式教育的人进入政府。军营里的军官要的却是号令统一、由军人掌管钱粮的国家。\n\n两派都想把帝国的法律改成自己的样子，谁也不肯让步。"
