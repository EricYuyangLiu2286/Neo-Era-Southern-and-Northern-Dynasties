 nesnd_ottoman_capital_fallen:0 "都城失去屏障"
 nesnd_ottoman_recovery.21.t:0 "谢赫伊斯兰的教令"
 nesnd_ottoman_recovery.21.d:0 "坦志麦特失败以后，[ROOT.GetCountry.GetName]的清真寺和宗教学校里一直有人说，帝国的衰落是背离教法的结果。如今谢赫伊斯兰拟好了一道教令，要求各省臣民服从[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]与教法，并请[SCOPE.sCharacter('nesnd_ottoman_ruler').GetPrimaryRoleTitle]批准后向全国颁行。\n\n[SCOPE.gsInterestGroup('nesnd_autocracy_devout_ig').GetName]希望借这道教令确立宗教在国家中的地位。[SCOPE.gsInterestGroup('nesnd_autocracy_army_ig').GetName]的军官则认为，教令是要用宗教的权威压制军营的主张。"
 nesnd_ottoman_recovery.21.f:0 "“各省臣民应当服从君主，遵行教法。”\n——谢赫伊斯兰拟定的教令"
 nesnd_ottoman_recovery.21.a:0 "向各省颁行这道教令。"
 nesnd_ottoman_recovery.21.b:0 "军营的不满不能不顾，教令暂且搁置。"
 nesnd_ottoman_recovery.22.t:0 "军校的教官"
 nesnd_ottoman_recovery.22.d:0 "[SCOPE.sCountry('nesnd_prussia_country').GetName]的军事使团仍在[ROOT.GetCountry.GetName]的军校里任教，教的是欧洲军队的操典。推行过秦式军改的军官向陆军部提出，军校应当改聘[SCOPE.sCountry('nesnd_qin_country').GetName]的教官，把秦式的编制和补给办法教给年轻军官。\n\n[SCOPE.gsInterestGroup('nesnd_autocracy_devout_ig').GetName]反对这项提议。在他们看来，[SCOPE.sCountry('nesnd_qin_country').GetName]是近西战争里的敌国，不能让它的军官来训练[ROOT.GetCountry.GetName]的军队。"
 nesnd_ottoman_recovery.22.d_prussia_only:0 "[SCOPE.sCountry('nesnd_prussia_country').GetName]的军事使团仍在[ROOT.GetCountry.GetName]的军校里任教，教的是欧洲军队的操典。推行过秦式军改的军官对这套操典并不满意，可是眼下请不到秦人教官。\n\n陆军部打算继续留用使团。"
 nesnd_ottoman_recovery.22.d_qin_only:0 "[ROOT.GetCountry.GetName]的军校眼下由本国军官任教。推行过秦式军改的军官向陆军部提出，军校应当聘请[SCOPE.sCountry('nesnd_qin_country').GetName]的教官，把秦式的编制和补给办法教给年轻军官。\n\n[SCOPE.gsInterestGroup('nesnd_autocracy_devout_ig').GetName]反对这项提议。在他们看来，[SCOPE.sCountry('nesnd_qin_country').GetName]是近西战争里的敌国，不能让它的军官来训练[ROOT.GetCountry.GetName]的军队。"
 nesnd_ottoman_recovery.22.f:0 "“军校教官的聘任事关全军的训练，请尽早决定。”\n——陆军部的报告"
 nesnd_ottoman_recovery.22.a:0 "留用[SCOPE.sCountry('nesnd_prussia_country').GetName]教官。"
 nesnd_ottoman_recovery.22.b:0 "聘请[SCOPE.sCountry('nesnd_qin_country').GetName]教官。"
 nesnd_ottoman_recovery.22.c:0 "军校仍由本国军官任教。"
