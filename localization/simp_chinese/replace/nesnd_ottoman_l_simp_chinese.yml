 nesnd_ottoman_recovery.18.t:0 "领事馆的请愿书"
 nesnd_ottoman_recovery.18.d_rumelia:0 "驻巴尔干各地的领事接连发回急电，报告[SCOPE.sCountry('nesnd_tur_country').GetName]驻军在鲁米利亚诸省反复弹压东正教城镇的经过。当地的城镇代表与居民纷纷向各国领事馆递交请愿书，请求列强出面斡旋。\n\n[ROOT.GetCountry.GetName]的外交部门已拟好致伊斯坦布尔的照会，并把外交施压与抗议两套方案一并送交政府定夺。"
 nesnd_ottoman_recovery.18.d_east:0 "驻安纳托利亚与高加索一线的领事接连发回急电，报告[SCOPE.sCountry('nesnd_tur_country').GetName]驻军在卡尔斯、埃尔祖鲁姆与迪亚巴克尔反复弹压亚美尼亚社群的经过。当地的社群代表与商民陆续向各国领事馆递交请愿书，请求列强出面干预。\n\n[ROOT.GetCountry.GetName]的外交部门已拟好致伊斯坦布尔的照会，并把外交施压与抗议两套方案一并送交政府定夺。"
 nesnd_ottoman_recovery.18.f:0 "“各地城镇的请愿书接连送达，领事馆的案头已经堆满来自省内的急件。”\n——驻近东领事馆的急电"
 nesnd_ottoman_recovery.18.a:0 "借此向奥斯曼施压。"
 nesnd_ottoman_recovery.18.b:0 "提出严正外交抗议。"
 nesnd_rtw_play:0 "北方战事"
 nesnd_rtw_tur:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_rtw_title')]"
 nesnd_rtw_tur_reason:0 "巴尔干与东线的动荡刚刚平息，北方对手的军队已开始在多瑙河沿线与高加索边界集结。前线哨所接连传来敌军调动的消息，海峡与安纳托利亚北麓同时承受重压。\n\n战事随时可能爆发，高门必须在对手发难之前整顿兵备，并向有利害关系的列强与东方邻国寻求外援。"
 nesnd_rtw_rus:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_rtw_title')]"
 nesnd_rtw_rus_reason:0 "总参谋部已经拟定多瑙河与高加索两线进军的方案，目标直指奥斯曼在巴尔干的残余防线与高加索南麓要冲。\n\n只要时机成熟，本国便可向伊斯坦布尔发起[concept_diplomatic_play]，一举改写黑海与巴尔干的格局。"
 nesnd_rtw_status_war:0 "多瑙河与高加索两线的[concept_war]正在进行。"
 nesnd_rtw_status_play:0 "围绕黑海与高加索的[concept_diplomatic_play]已经开启，双方正在争取外援。"
