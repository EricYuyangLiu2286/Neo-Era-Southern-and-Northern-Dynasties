 nesnd_ottoman_levant_reason:0 "$STATE_ADANA$、$STATE_ALEPPO$与$STATE_SYRIA$并不都在[ROOT.GetCountry.GetName]手中。1825年的协定承认埃及摆脱帝国的统辖，到1836年，$STATE_ALEPPO$、$STATE_SYRIA$和$STATE_ADANA$的大部分都在埃及手中。如今黎凡特仍有土地在[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_ottoman_levant_foe_name')]的势力之下。\n\n军队主张出兵收复黎凡特，为此先要取得[concept_claim]，并鼓动当地人反抗现在的统治者。政府可以请在近东有[concept_interest]的大国支持本国，也可以承认现状，放弃对这三处地方的领土要求，换取南部边境的安宁。"
