 nesnd_ottoman_charter_constitution_event_tt:0 "触发事件「$nesnd_ottoman_recovery.11.t$」，二选一：颁布[GetLawType('law_oligarchy').GetName]或[GetLawType('law_landed_voting').GetName]（已是该法律则改为提高[concept_legitimacy]）"
 nesnd_ottoman_charter_constitution_conclusion:0 "宪政派的主张写进了帝国的法律。"
 nesnd_ottoman_charter_qin_conclusion:0 "军营一派的主张写进了帝国的法律，帝国照秦式的办法治军理政。"
 nesnd_ottoman_charter_stalemate_conclusion:0 "二十年过去，两派谁也没能把帝国的法律改成自己的样子。"
