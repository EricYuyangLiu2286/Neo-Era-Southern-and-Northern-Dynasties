 nesnd_ottoman_recovery.26.t:0 "黎凡特告急"
 nesnd_ottoman_recovery.26.d_subject:0 "[SCOPE.sCountry('nesnd_levant_tur').GetName]派人到黎凡特各地活动，鼓动当地人反抗现在的统治者。在[ROOT.GetCountry.GetName]治下的黎凡特土地上，不满正在蔓延。\n\n[SCOPE.sCountry('nesnd_levant_overlord').GetName]是本国的宗主，这件事也关系到它在黎凡特的地位。"
 nesnd_ottoman_recovery.26.d_independent:0 "[SCOPE.sCountry('nesnd_levant_tur').GetName]派人到黎凡特各地活动，鼓动当地人反抗现在的统治者。在[ROOT.GetCountry.GetName]治下的黎凡特土地上，不满正在蔓延。"
 nesnd_ottoman_recovery.26.f:0 "“[SCOPE.sCountry('nesnd_levant_tur').GetName]派来的人正在本地活动。”\n——黎凡特驻军的报告"
 nesnd_ottoman_recovery.26.a:0 "向黎凡特增兵。"
 nesnd_ottoman_recovery.26.b:0 "请[SCOPE.sCountry('nesnd_levant_overlord').GetName]出面。"
 nesnd_ottoman_recovery.26.c:0 "不予理会。"
 nesnd_ottoman_recovery.26.c_tt:0 "不采取措施，黎凡特新出现的[concept_radical]依然存在"
 nesnd_ottoman_recovery.27.t:0 "承认现状的提议"
 nesnd_ottoman_recovery.27.d:0 "[SCOPE.sCountry('nesnd_levant_tur').GetName]的使节带来一项提议。[SCOPE.sCountry('nesnd_levant_tur').GetName]愿意放弃对$STATE_ADANA$、$STATE_ALEPPO$和$STATE_SYRIA$的领土要求，承认黎凡特的现状。"
 nesnd_ottoman_recovery.27.f:0 "“本国不再对$STATE_ADANA$、$STATE_ALEPPO$与$STATE_SYRIA$提出领土要求。”\n——[SCOPE.sCountry('nesnd_levant_tur').GetName]的照会"
 nesnd_ottoman_recovery.27.a:0 "接受，黎凡特的现状就此确定。"
 nesnd_ottoman_recovery.27.a_claims_tt:0 "[SCOPE.sCountry('nesnd_levant_tur').GetName]放弃对$STATE_ADANA$、$STATE_ALEPPO$与$STATE_SYRIA$的[concept_claim]（如有）"
 nesnd_ottoman_recovery.27.b:0 "拒绝，黎凡特的归属不容商议。"
 nesnd_ottoman_recovery.27.lapsed_tt:0 "这项提议已经失效"
 nesnd_ottoman_recovery.28.t:0 "承认现状的答复"
 nesnd_ottoman_recovery.28.d_accepted:0 "[SCOPE.sCountry('nesnd_levant_foe_scope').GetName]接受了提议。[ROOT.GetCountry.GetName]放弃对$STATE_ADANA$、$STATE_ALEPPO$与$STATE_SYRIA$的领土要求，黎凡特的现状就此确定。"
 nesnd_ottoman_recovery.28.d_refused:0 "[SCOPE.sCountry('nesnd_levant_foe_scope').GetName]拒绝了提议，不肯与[ROOT.GetCountry.GetName]商谈黎凡特的现状。"
 nesnd_ottoman_recovery.28.f:0 "“本国政府对贵国的提议已有答复。”\n——[SCOPE.sCountry('nesnd_levant_foe_scope').GetName]的照会"
 nesnd_ottoman_recovery.28.a:0 "知道了。"
 nesnd_ottoman_recovery.28.a_accepted_tt:0 "「$nesnd_ottoman_levant$」将以承认现状告终"
 nesnd_ottoman_recovery.28.a_refused_tt:0 "提议未成，「$nesnd_ottoman_levant$」继续进行"
 nesnd_ottoman_recovery.29.t:0 "黎凡特问题上的求助"
 nesnd_ottoman_recovery.29.d:0 "[SCOPE.sCountry('nesnd_levant_tur').GetName]的使节来到本国，请[ROOT.GetCountry.GetName]在黎凡特问题上支持[SCOPE.sCountry('nesnd_levant_tur').GetName]。$STATE_ADANA$、$STATE_ALEPPO$与$STATE_SYRIA$有土地在[SCOPE.sCountry('nesnd_levant_foe_scope').GetName]的势力之下，[SCOPE.sCountry('nesnd_levant_tur').GetName]想把它们收回。"
 nesnd_ottoman_recovery.29.f:0 "“本国政府请求贵国在黎凡特问题上给予支持。”\n——[SCOPE.sCountry('nesnd_levant_tur').GetName]的照会"
 nesnd_ottoman_recovery.29.a:0 "公开支持[SCOPE.sCountry('nesnd_levant_tur').GetName]。"
 nesnd_ottoman_recovery.29.b:0 "不介入此事。"
 nesnd_ottoman_recovery.29.lapsed_tt:0 "这项请求已经失效"
 nesnd_ottoman_recovery.30.t:0 "求助的答复"
 nesnd_ottoman_recovery.30.d_accepted:0 "[SCOPE.sCountry('nesnd_levant_helper_scope').GetName]答应在黎凡特问题上支持[ROOT.GetCountry.GetName]。"
 nesnd_ottoman_recovery.30.d_refused:0 "[SCOPE.sCountry('nesnd_levant_helper_scope').GetName]不愿介入黎凡特问题，没有答应[ROOT.GetCountry.GetName]的请求。"
 nesnd_ottoman_recovery.30.f:0 "“本国政府对贵国的请求已有答复。”\n——[SCOPE.sCountry('nesnd_levant_helper_scope').GetName]的照会"
 nesnd_ottoman_recovery.30.a:0 "知道了。"
 nesnd_ottoman_recovery.30.a_accepted_tt:0 "[SCOPE.sCountry('nesnd_levant_helper_scope').GetName]已表示支持本国"
 nesnd_ottoman_recovery.30.a_refused_tt:0 "[SCOPE.sCountry('nesnd_levant_helper_scope').GetName]没有答应本国的请求"
 nesnd_ottoman_recovery.31.t:0 "北上"
 nesnd_ottoman_recovery.31.d:0 "[ROOT.GetCountry.GetName]保住了独立。军队里有人主张趁此向北用兵，夺取与本国接壤的[SCOPE.sCountry('nesnd_egypt_tur').GetName]土地。政府里的另一些人主张与[SCOPE.sCountry('nesnd_egypt_tur').GetName]修好，把财力用在尼罗河沿岸的建设上。"
 nesnd_ottoman_recovery.31.f:0 "“与[SCOPE.sCountry('nesnd_egypt_tur').GetName]接壤的边境地区应当归于[ROOT.GetCountry.GetName]。”\n——军队提交政府的报告"
 nesnd_ottoman_recovery.31.a:0 "向北用兵。"
 nesnd_ottoman_recovery.31.a_claims_tt:0 "对与本国接壤的[SCOPE.sCountry('nesnd_egypt_tur').GetName]各地区获得[concept_claim]"
 nesnd_ottoman_recovery.31.b:0 "经营尼罗河。"
