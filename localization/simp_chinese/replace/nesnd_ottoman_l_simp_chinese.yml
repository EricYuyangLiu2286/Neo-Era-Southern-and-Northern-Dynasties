 nesnd_ottoman_recovery.16.t:0 "伊斯兰现代主义者"
 nesnd_ottoman_recovery.16.d:0 "[ROOT.GetCountry.GetName]的大学与报馆培养出一批新的穆斯林文人。作家[SCOPE.sCharacter('nesnd_namik_kemal').GetFullName]在伊斯坦布尔刊发政论，援引伊斯兰法理中的协商传统，论证宪政与议会合乎教法。\n\n[SCOPE.gsInterestGroup('nesnd_academy_intel_ig').GetName]推举他出任政府顾问，襄助教育与报务。数日后，[SCOPE.gsInterestGroup('nesnd_academy_devout_ig').GetName]递交联署抗议，指责他的文章僭越教义解释权，要求将他移交乌理玛审讯。"
 nesnd_ottoman_recovery.16.f:0 "“祖国的兴盛系于公民的学识，教法从未禁止臣民参与国政。”\n——伊斯坦布尔报馆刊发的署名政论"
 nesnd_ottoman_recovery.16.a:0 "收为政府顾问。"
 nesnd_ottoman_recovery.16.b:0 "交乌理玛审判。"
 nesnd_ottoman_recovery.17.t:0 "工会与工厂"
 nesnd_ottoman_recovery.17.d:0 "随着首都与各省港埠的机器工坊陆续开工，[ROOT.GetCountry.GetName]的城镇聚集起大批长年领薪的工人。多处织造厂与船坞的工匠暗中成立互助会，要求缩短工时、核定工资，并请求当局承认他们公开结社的权利。\n\n[SCOPE.gsInterestGroup('nesnd_trade_unions_ig').GetName]已在几座工业城镇推出代表，向内阁呈递请愿书。内政部同时送来各地警署的报告，请示对这些工人结社采取何种处置。"
 nesnd_ottoman_recovery.17.f:0 "“机器日夜运转，工匠聚居成坊，旧日的行会章程已经管不住新厂的车间。”\n——内政部关于城镇工坊的报告"
 nesnd_ottoman_recovery.17.a:0 "容许工人结社。"
 nesnd_ottoman_recovery.17.b:0 "取缔工人结社。"
 nesnd_ottoman_rumelia:0 "鲁米利亚"
 nesnd_ottoman_rumelia_reason:0 "坦志麦特改革失败后，苏丹的帝国在巴尔干各省同时面对地方民族运动与外国干涉。多瑙河以南的城镇不断传出抗税与结社消息，列强领事频频致函质询各省治理。\n\n高门必须在大东方危机结束前决定对鲁米利亚诸省的方略：以宪章安抚地方、准许动荡最烈之省自治，还是动用武力弹压。一旦危机失控，失去的故土将成为日后清算的依据。"
 nesnd_ottoman_rumelia_status_ongoing:0 "大东方危机仍在进行，巴尔干各省的民族运动与外部压力持续加剧。"
 nesnd_ottoman_rumelia_status_charter:0 "高门已多次向巴尔干各省颁布宪章让步，保守集团的不满正在累积。"
 nesnd_ottoman_rumelia_status_crackdown:0 "巴尔干各省的镇压接连升级，各地民族[concept_fervor]高涨，在巴尔干有利益的大国正密切关注局势。"
 nesnd_ottoman_rumelia_held_conclusion:0 "大东方危机得到遏制，帝国在鲁米利亚稳住了阵脚。"
 nesnd_ottoman_rumelia_held_event_tt:0 "大东方危机以遏制告终：永久获得「$nesnd_ottoman_rumelia_held_mod$」修正，提升[concept_legitimacy]与[concept_prestige]。"
 nesnd_ottoman_rumelia_lost_conclusion:0 "大东方危机失控，帝国失去了对部分巴尔干行省的掌控。"
 nesnd_ottoman_rumelia_lost_claims_tt:0 "本日志开启时由本国持有、如今不再完全归本国及本国[concept_subject]所有的巴尔干地区，一律获得本国[concept_claim]"
 nesnd_ottoman_rumelia_lost_event_tt:0 "大东方危机失控或拖延二十五年未决：对失去的原巴尔干行省获得[concept_claim]，永久获得「$nesnd_ottoman_rumelia_lost_mod$」修正。"
 nesnd_ottoman_rumelia_timeout_conclusion:0 "二十五年过去，巴尔干的动荡始终未能平息，帝国对故土的威信一落千丈。"
 nesnd_ottoman_rumelia_invalid_conclusion:0 "苏丹的帝国已不复存在，鲁米利亚事务就此中止。"
 nesnd_ottoman_rumelia_charter:0 "颁布巴尔干宪章"
 nesnd_ottoman_rumelia_charter_desc:0 "向巴尔干各省的非土耳其主体族群颁布宪章与特许条款，换取地方稳定。"
 nesnd_ottoman_rumelia_charter_acceptance_tt:0 "在本国持有的每个巴尔干地区，该地区人数最多的非主要文化获得持续#v 60#!个月的[concept_acceptance]提升"
 nesnd_ottoman_rumelia_autonomy:0 "准许行省自治"
 nesnd_ottoman_rumelia_autonomy_desc:0 "将动荡最烈的一处非首都巴尔干行省改为自治邦，交由当地主体族群治理并保留宗主关系。"
 nesnd_ottoman_rumelia_autonomy_rank_tt:0 "若已获认可，[concept_rank]至少为[concept_minor_power]；若未获认可，[concept_rank]至少为$unrecognized_regional_power$"
 nesnd_ottoman_rumelia_autonomy_tt:0 "将[concept_turmoil]最高的一处非首都巴尔干地区以当地最大非主要文化释放为新国家，并确立为本国的[concept_subject]（获列强认可时为保护国，未获认可时为朝贡国）"
 nesnd_ottoman_rumelia_crackdown:0 "弹压巴尔干动乱"
 nesnd_ottoman_rumelia_crackdown_desc:0 "调遣驻军弹压存在文化少数派运动的巴尔干行省，强行维持高门号令。"
 nesnd_ottoman_rumelia_crackdown_states_tt:0 "在每个存在文化少数派[concept_political_movement]的本国巴尔干地区增加少量[concept_radical]，并使该地区最大非主要文化的[concept_fervor]目标在#v 60#!个月内上升"
 nesnd_ottoman_rumelia_crackdown_rus_tt:0 "再次在鲁米利亚动用武力弹压：在巴尔干有利益的大国将作出回应。"
 nesnd_ottoman_rumelia_cd_tt:0 "距上次鲁米利亚处置已满#v 24#!个月"
 nesnd_ottoman_rumelia_cd_set_tt:0 "#v 24#!个月内无法再次采取鲁米利亚处置措施。"
 nesnd_ottoman_eastern_provinces:0 "东方诸省"
 nesnd_ottoman_eastern_provinces_reason:0 "埃尔祖鲁姆、迪亚巴克尔与卡尔斯三省山川险峻，库尔德部落与亚美尼亚社群各有诉求，在近东与高加索拥有利益的大国正注视边境动向。\n\n高门可招募部落骑兵守备边疆，向亚美尼亚社群颁布宪章以缓和边境压力，或调集驻军强行弹压地方骚动。若二十年内未能定局，东方诸省的动荡将长久拖累帝国。"
 nesnd_ottoman_east_status_active:0 "东方三省仍有库尔德或亚美尼亚文化少数派[concept_political_movement]活动。"
 nesnd_ottoman_east_status_calm:0 "东方三省眼下没有活跃的库尔德或亚美尼亚文化少数派[concept_political_movement]。"
