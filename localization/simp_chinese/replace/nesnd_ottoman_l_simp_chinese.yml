l_simp_chinese:
 nesnd_ottoman_unity:0 "帝国诸民"
 nesnd_ottoman_unity_reason:0 "征服把信仰、语言和历史各异的人们置于奥斯曼统治之下。安纳托利亚的官员、巴尔干的地方势力和新近归附的各族，都要求政府保护他们的利益。\n\n学校、行政与安定的生活可以加强各地对国家的认同，长期征战和歧视则会加深分歧。政府必须在扩张之外维持地方的合作，才能使这些土地长久归于同一国家。"
 nesnd_ottoman_unity_bar:0 "国家团结度"
 nesnd_ottoman_unity_bar_desc:0 "$nesnd_ottoman_unity_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_ottoman_unity_fractured:0 "各地对政府的信任已经动摇，地方动荡正在加重统治的负担。"
 nesnd_ottoman_unity_confident:0 "各地的共同归属正在巩固，不同群体更愿意融入帝国的社会生活。"
 nesnd_ottoman_unity_calm:0 "中央政府与各省仍在维持合作，各族对国家的认同有待巩固。"
