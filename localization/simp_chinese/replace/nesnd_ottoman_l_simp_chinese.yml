 nesnd_rtw.1.t:0 "海峡照会"
 nesnd_rtw.1.d:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]大使求见外务官员，递交伊斯坦布尔的正式照会。照会称[SCOPE.sCountry('nesnd_north_foe_scope').GetName]正在多瑙河与高加索一线施加军事压力，请求[ROOT.GetCountry.GetName]站在高门一边，维护博斯普鲁斯海峡的均势。\n\n议会与宫廷随即就海峡局势展开争论。军政各部送来东地中海与近东航路的评估报告，指出一旦[SCOPE.sCountry('nesnd_north_foe_scope').GetName]控制海峡，周边海路与近东均势都将大受动摇。"
 nesnd_rtw.1.d_plain:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]大使求见外务官员，递交伊斯坦布尔的正式照会。照会称北方强邻正在多瑙河与高加索一线施加军事压力，请求[ROOT.GetCountry.GetName]站在高门一边，维护博斯普鲁斯海峡的均势。\n\n议会与宫廷随即就海峡局势展开争论，军政各部已将东地中海与近东局势的评估报告呈送案前。"
 nesnd_rtw.1.f:0 "“博斯普鲁斯海峡的归属牵动东地中海的航路与各方均势。”\n——一份驻外使节的外交报告"
 nesnd_rtw.1.a:0 "站到高门一边。"
 nesnd_rtw.1.b:0 "只作外交声明。"
 nesnd_rtw.1.c:0 "不介入此事。"
 nesnd_rtw.2.t:0 "外援来电"
 nesnd_rtw.2.d_joined:0 "驻外使馆发回加急密电，确认[SCOPE.sCountry('nesnd_helper_country').GetName]已决定在此次[concept_diplomatic_play]中站在[ROOT.GetCountry.GetName]一边出兵声援。该国随即向北方对手递交严正照会，申明海峡现状不容单方面破坏。\n\n高门大臣连夜召见总参谋部将领，将[SCOPE.sCountry('nesnd_helper_country').GetName]援军加入战局的情形计入防务部署。"
 nesnd_rtw.2.d_pact:0 "驻外使馆发回加急密电，确认[SCOPE.sCountry('nesnd_helper_country').GetName]政府已同意与[ROOT.GetCountry.GetName]缔结共同防御条约。对方随即照会各方，申明海峡秩序不容武力推翻。\n\n高门大臣连夜召见总参谋部将领，将[SCOPE.sCountry('nesnd_helper_country').GetName]协防海峡的情形计入防务部署。"
 nesnd_rtw.2.d_rel:0 "驻外使馆发回加急密电，称[SCOPE.sCountry('nesnd_helper_country').GetName]因条约格局所限，眼下无法签署防御同盟，但仍向[ROOT.GetCountry.GetName]作出明确的外交声援，并指示驻外使团严密注视海峡局势。\n\n伊斯坦布尔的外交官借机与对方使馆重开磋商，两国往来随之转暖。"
 nesnd_rtw.2.f:0 "“本国政府不能坐视海峡秩序被武力推翻。”\n——一封发往高门的复照"
 nesnd_rtw.2.a:0 "援手的回音已传抵海峡。"
 nesnd_rtw.2.a_joined_tt:0 "[SCOPE.sCountry('nesnd_helper_country').GetName]已站在本国一方加入当前的[concept_diplomatic_play]。"
 nesnd_rtw.2.a_pact_tt:0 "[SCOPE.sCountry('nesnd_helper_country').GetName]已与本国缔结为期#v 5#!年的[concept_defensive_pact]。"
 nesnd_rtw.2.a_rel_tt:0 "因眼下无法签署条约，[SCOPE.sCountry('nesnd_helper_country').GetName]改为与本国改善[concept_relations]。"
 nesnd_rtw.3.t:0 "照会的答复"
 nesnd_rtw.3.d_note:0 "驻外大使将[SCOPE.sCountry('nesnd_helper_country').GetName]外交部的复照抄报回伊斯坦布尔。对方公开发表声明，对边境集结重兵表示关切，但明确表示眼下不会与[ROOT.GetCountry.GetName]签署防务同盟，亦不承诺出兵。\n\n大臣们收起复照，只能把这份外交声明当作牵制北方对手的有限筹码。"
 nesnd_rtw.3.d_refused:0 "驻外大使发回密电，称[SCOPE.sCountry('nesnd_helper_country').GetName]已经拒绝高门的求援照会，明确声明不会介入巴尔干与高加索的战事。消息很快在伊斯坦布尔的使馆区与报馆传开。\n\n议事厅里一片沉寂，[ROOT.GetCountry.GetName]必须独自面对北方边界的压境重兵。"
 nesnd_rtw.3.f:0 "“高门切勿指望他国替自己守住多瑙河的渡口。”\n——一位驻外使节的密电"
 nesnd_rtw.3.a:0 "只能依靠自己的军队。"
 nesnd_rtw.3.a_note_tt:0 "[SCOPE.sCountry('nesnd_helper_country').GetName]已发表外交声明：本国与对方的[concept_relations]略有改善，对方与北方对手的[concept_relations]转冷。"
 nesnd_ottoman_qe1.4.t:0 "高门使者抵达军府"
 nesnd_ottoman_qe1.4.d:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]的秘密使团翻越波斯高原，抵达[ROOT.GetCountry.GetName]军府。使者呈上伊斯坦布尔军方亲笔密函，称[SCOPE.sCountry('nesnd_north_foe_scope').GetName]大军压境，恳请[ROOT.GetCountry.GetName]派遣教官与参谋，或径行订立共同防御条约。\n\n作为回报，高门愿正式放弃对[ROOT.GetCountry.GetName]现有全部疆域的旧日领土主张。军府堂上展开舆图，中亚边疆的防务清单与北疆[SCOPE.sCountry('nesnd_north_foe_scope').GetName]驻军的动向一并摆在案前。"
 nesnd_ottoman_qe1.4.d_plain:0 "[SCOPE.sCountry('nesnd_tur_country').GetName]的秘密使团翻越波斯高原，抵达[ROOT.GetCountry.GetName]军府。使者呈上伊斯坦布尔军方亲笔密函，称北方大军压境，恳请[ROOT.GetCountry.GetName]派遣教官与参谋，或径行订立共同防御条约。\n\n作为回报，高门愿正式放弃对[ROOT.GetCountry.GetName]现有全部疆域的旧日领土主张。军府堂上展开舆图，等候朝廷定夺。"
 nesnd_ottoman_qe1.4.f:0 "“远西使者越帕米尔而至，愿以旧日虚名换取军府教官与盟书。”\n——军府驿报"
 nesnd_ottoman_qe1.4.a:0 "派遣军事顾问前往高门。"
 nesnd_ottoman_qe1.4.b:0 "与高门订立防御同盟。"
 nesnd_ottoman_qe1.4.c:0 "回绝高门的请求。"
 nesnd_ottoman_qe1.5.t:0 "来自伊犁的回音"
 nesnd_ottoman_qe1.5.d_pact:0 "赴东使团带着盖印盟书返回伊斯坦布尔。[SCOPE.sCountry('nesnd_qin_country').GetName]答应与[ROOT.GetCountry.GetName]缔结共同防御条约，交换条件是高门正式撤回对[SCOPE.sCountry('nesnd_qin_country').GetName]治下诸州的旧日宣称。\n\n消息传开以后，当年近西战争的旧账随即被重新提起。邻近的伊斯兰诸国陆续遣使递交抗议，指责高门背弃旧谊。"
 nesnd_ottoman_qe1.5.d_advisers:0 "赴东使团领着一批[SCOPE.sCountry('nesnd_qin_country').GetName]军事教官与参谋返回伊斯坦布尔。这批顾问随即进驻陆军部与各省军营，照秦式操典整顿补给与编制；作为交换，[ROOT.GetCountry.GetName]正式撤回对[SCOPE.sCountry('nesnd_qin_country').GetName]治下诸州的旧日宣称。\n\n军中推崇秦制的将领声望随之上涨。邻近的伊斯兰诸国陆续照会高门，斥责此举背弃近西旧谊。"
 nesnd_ottoman_qe1.5.f:0 "“昔日巴格达城下的劲敌，如今坐在伊斯坦布尔陆军部的议事桌旁。”\n——伊斯坦布尔军官的日记"
 nesnd_ottoman_qe1.5.a:0 "把新的章程落到各营。"
 nesnd_ottoman_qe1.5.a_pact_tt:0 "[SCOPE.sCountry('nesnd_qin_country').GetName]已与本国缔结为期#v 5#!年的[concept_defensive_pact]，本国对[SCOPE.sCountry('nesnd_qin_country').GetName]现有地区的[concept_claim]已撤回。"
 nesnd_ottoman_qe1.5.a_advisers_tt:0 "本国已永久获得「$nesnd_rtw_qin_advisers$」修正，国内秦制主义者领袖的[concept_popularity]提升，本国对[SCOPE.sCountry('nesnd_qin_country').GetName]现有地区的[concept_claim]已撤回。"
 nesnd_ottoman_qe1.6.t:0 "西秦回绝求援"
 nesnd_ottoman_qe1.6.d:0 "越过波斯东去的使团空手回到伊斯坦布尔。[SCOPE.sCountry('nesnd_qin_country').GetName]军府婉辞了派遣顾问与缔结盟约的请求，只交还了一封措辞冷淡的复函。\n\n消息传回军营，一向主张效法秦制的军官一时失势，保守大臣与乌理玛趁机指责向旧敌求助白费周章。"
 nesnd_ottoman_qe1.6.f:0 "“东方军府自顾河中犹恐不暇，何曾念及博斯普鲁斯？”\n——伊斯坦布尔茶馆里的议论"
 nesnd_ottoman_qe1.6.a:0 "收回东去的使节。"
 nesnd_ottoman_qe1.6.a_tt:0 "国内秦制主义者领袖的[concept_popularity]已下降，本国与[SCOPE.sCountry('nesnd_qin_country').GetName]的[concept_relations]转冷。"
 nesnd_ottoman_recovery.19.t:0 "兵锋所向"
 nesnd_ottoman_recovery.19.d:0 "高门议事厅的墙上挂着一幅新绘的帝国全图，多瑙河以南与高加索边界被红墨圈出大片缺口。战事落定之后，[ROOT.GetCountry.GetName]残余的精锐部队陆续退回安纳托利亚整补。\n\n陆军部已将下一阶段的扩军预算和兵力调拨表送入议事厅。安纳托利亚东线的指挥官递交报告，指出东面两河方向防备空虚，请求调拨军费向东进取。从巴尔干撤回的将领提交了另一份方案，主张把重整陆军的兵力压在色雷斯防线上，留待收复失地。"
 nesnd_ottoman_recovery.19.f:0 "“地图上的红线越缩越紧，帝国总得选定一个方向挥刀。”\n——高门军事会议记录"
 nesnd_ottoman_recovery.19.a:0 "向东进取，收复两河。"
 nesnd_ottoman_recovery.19.b:0 "重整陆军，收复失地。"
 nesnd_ottoman_recovery.20.t:0 "海峡的代价"
 nesnd_ottoman_recovery.20.d:0 "北方的强邻[SCOPE.sCountry('nesnd_north_ally_scope').GetName]如今与[ROOT.GetCountry.GetName]订有盟约，驶过博斯普鲁斯海峡的军舰桅杆上挂着盟友的旗帜。炮台照约放行，码头上的水手与商船远远避让。\n\n其他列强的使节已在高门外等候答复。他们递交的照会措辞严厉，质问伊斯坦布尔是否打算把海峡的门户交到[SCOPE.sCountry('nesnd_north_ally_scope').GetName]手中。"
 nesnd_ottoman_recovery.20.f:0 "“军舰挂着盟友的旗帜穿过海峡，使馆区的马车便一辆接一辆停在高门外。”\n——一位伊斯坦布尔外交官的日记"
 nesnd_ottoman_recovery.20.a:0 "守约。"
 nesnd_ottoman_recovery.20.a_no_rival_tt:0 "目前没有将[SCOPE.sCountry('nesnd_north_ally_scope').GetName]视为宿敌的列强提出抗议。"
 nesnd_ottoman_recovery.20.b:0 "与之疏远。"
 nesnd_ottoman_autocracy:0 "专制的主导权"
 nesnd_ottoman_autocracy_reason:0 "[ROOT.GetCountry.GetName]的政府在坦志麦特失败以后不再谈论宪章，剩下的问题是由谁来主持专制。[ROOT.GetCountry.GetInterestGroupOfType('ig_devout').GetName]要求[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]以伊斯兰世界领袖的名义治国，保住国教和宗教学校，用禁令和秘密警察压制异议。秦式军改培养出的军官同样拥护专制，然而他们要的是一个秦式国家，官僚由军人充任，学校由国家开办，土地和工资都归国家支配。\n\n两方都要靠立法实现自己的主张。各省的[ROOT.GetCountry.GetInterestGroupOfType('ig_landowners').GetName]乐于看到首都争执不下，这样政府就无暇过问各省的事务。"
 nesnd_ottoman_autocracy_status_sultan:0 "目前苏丹一方占上风。"
 nesnd_ottoman_autocracy_status_barracks:0 "目前军营一方占上风。"
 nesnd_ottoman_autocracy_status_even:0 "目前两方不分高下。"
 nesnd_ottoman_autocracy_lean_sultan_tt:0 "在「$nesnd_ottoman_recovery.6.t$」中选择了「$nesnd_ottoman_recovery.6.a$」"
 nesnd_ottoman_autocracy_lean_barracks_tt:0 "在「$nesnd_ottoman_recovery.6.t$」中选择了「$nesnd_ottoman_recovery.6.b$」"
 nesnd_ottoman_autocracy_bonus_sultan_tt:0 "谢赫伊斯兰的教令颁行未满#v 60#!个月"
 nesnd_ottoman_autocracy_bonus_barracks_tt:0 "聘请秦人教官未满#v 120#!个月"
