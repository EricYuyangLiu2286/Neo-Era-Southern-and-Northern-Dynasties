 nesnd_ottoman_recovery_reason:0 "近西战争暴露了旧军制的弱点。如今西秦退出中原，伊斯坦布尔的军官主张趁势向东方扩张，夺回奥斯曼在伊斯兰世界的威望。\n\n坦志麦特留下的成果与阻力都将影响这支军队。政府既要筹措军费，也要在新的领土要求和军队整顿之间分配力量。"
