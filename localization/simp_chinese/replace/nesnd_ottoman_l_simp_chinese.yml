 nesnd_ottoman_unity_concord_event_tt:0 "触发事件「$nesnd_ottoman_recovery.7.t$」：在已整合州里是最大文化、又不是本国主要文化的各个文化，[concept_acceptance]永久提高。"
 nesnd_ottoman_unity_discord_event_tt:0 "触发事件「$nesnd_ottoman_recovery.8.t$」：土耳其人不占多数的州出现[concept_radical]。"
