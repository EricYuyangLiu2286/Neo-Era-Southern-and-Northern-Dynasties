 nesnd_ottoman_recovery_reason:0 "近西战争暴露了旧军制的弱点。如今西秦退出中原，伊斯坦布尔的军官主张趁势向东方扩张，夺回奥斯曼在伊斯兰世界的威望。\n\n坦志麦特留下的成果与阻力都将影响这支军队。政府要筹措军费，并决定把多少力量用于新的领土要求，多少用于整顿军队。"
