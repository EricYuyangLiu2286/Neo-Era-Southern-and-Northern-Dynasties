 nesnd_rtw_status_standoff:0 "北方对手仍在边境集结兵力，伊斯坦布尔加紧筹措军备并联络外援。"
 nesnd_rtw_rus_status_ready:0 "总参谋部的两线作战方案已经拟妥，边境驻军处于待命状态。"
 nesnd_rtw_result_rus_won_tt:0 "北方对手赢得本次战事"
