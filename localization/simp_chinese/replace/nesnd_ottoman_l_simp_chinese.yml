 nesnd_ottoman_meso_reason:0 "$STATE_BAGHDAD$、$STATE_MOSUL$与$STATE_BASRA$并不都在[ROOT.GetCountry.GetName]手中。第四次近西战争里，正义吉哈德的军队正是在巴格达城下逼退了秦军，如今两河的土地却在[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_ottoman_meso_foe_name')]的势力之下。\n\n军队主张出兵收复两河，为此先要取得[concept_claim]，并鼓动当地的部族反抗现在的统治者。政府也可以放弃对两河的领土要求，与[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_ottoman_meso_foe_name')]划定边界，换取东南各省的安宁。"
