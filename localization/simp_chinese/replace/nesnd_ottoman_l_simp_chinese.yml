 nesnd_ottoman_recovery.9.t:0 "宪政派文人"
 nesnd_ottoman_recovery.9.d:0 "[ROOT.GetCountry.GetName]的大学和新式学校培养出一批官员与文人。他们主张用一部宪章约束大臣，让议会讨论国事，自认是坦志麦特的继承人。\n\n[SCOPE.gsInterestGroup('nesnd_charter_ig').GetName]里有人提议把其中最有声望的一位请进政府。[SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName]的军官们则认为，这些人只会写文章，帝国用不着他们。"
 nesnd_ottoman_recovery.9.f:0 "“大臣须受宪章约束，国事须经议会讨论。”\n——宪政派文人的传单"
 nesnd_ottoman_recovery.9.a:0 "请这位文人进入政府。"
 nesnd_ottoman_recovery.9.b:0 "把为首的人逐出首都。"
 nesnd_ottoman_recovery.10.t:0 "秦人的营规"
 nesnd_ottoman_recovery.10.d:0 "[SCOPE.sCharacter('nesnd_barracks_leader').GetFullName]从秦式条例里读到一种办法：军队自管军费，自办军需工厂，不必事事仰赖财政部。这位[SCOPE.gsInterestGroup('nesnd_barracks_ig').GetName]的领袖要求[ROOT.GetCountry.GetName]照这个办法办理，把军需的钱和厂交给[SCOPE.gsInterestGroup('nesnd_route_army_ig').GetName]。\n\n财政部的官员担心，军队有了自己的财源，就不再听命于政府。"
 nesnd_ottoman_recovery.10.f:0 "“军中钱粮，由军中自理。”\n——秦式营规的条文"
 nesnd_ottoman_recovery.10.a:0 "准其所请。"
 nesnd_ottoman_recovery.10.b:0 "军需仍归财政部管。"
 nesnd_ottoman_recovery.10.third_tt:0 "这是连续第三次驳回营规"
 nesnd_ottoman_recovery.10.count_tt:0 "本次驳回会记录在案，连续驳回满三次，军营会以政变或公开的怨气回应"
 nesnd_ottoman_recovery.11.t:0 "颁布宪章"
 nesnd_ottoman_recovery.11.d:0 "宪政派的主张已经写进帝国的法律，剩下的问题是议会由谁来选。一派主张由各地的显贵与官员组成议会，另一派主张让有地产的人投票选出议员。"
 nesnd_ottoman_recovery.11.f:0 "“议会由本宪章设立，依本宪章选举。”\n——颁布的宪章正文"
 nesnd_ottoman_recovery.11.a:0 "由显贵与官员组成议会。"
 nesnd_ottoman_recovery.11.b:0 "让有地产的人投票。"
 nesnd_ottoman_islam_leader:0 "伊斯兰领袖"
 nesnd_ottoman_islam_leader_reason:0 "第四次近西战争中，伊斯兰世界在正义吉哈德里公推奥斯曼为领袖。坦志麦特完成后，宪政的帝国北面面对强邻，东面面对西秦。\n\n奥斯曼必须在黑海、高加索与中亚之间站稳脚跟，在同北方对手的较量与对西秦的周旋中保住这份声望。"
 nesnd_ottoman_islam_leader_status_crimea:0 "黑海与高加索的战事已经打响，北方局势牵动帝国的声望。"
 nesnd_ottoman_islam_leader_status_order:0 "两河与叙利亚已经回到帝国治下，帝国正在巩固伊斯兰世界的领袖地位。"
 nesnd_ottoman_islam_leader_status_ongoing:0 "帝国正在北方强邻与西秦之间谋求外交主动。"
 nesnd_ottoman_islam_leader_crimea_win_tt:0 "奥斯曼一方赢得黑海与高加索战事"
 nesnd_ottoman_islam_leader_order_win_tt:0 "已达成「$nesnd_ottoman_eastern_order$」结局，且本日志已开启满#v 60#!个月"
 nesnd_ottoman_islam_leader_win_conclusion:0 "宪政的帝国在北方强邻与西秦之间立住了伊斯兰领袖的位置。"
 nesnd_ottoman_islam_leader_win_event_tt:0 "触发事件「$nesnd_ottoman_recovery.12.t$」，二选一：\n• $nesnd_ottoman_recovery.12.a$：永久获得「$nesnd_ottoman_caliphate$」修正（提升[concept_prestige]、同宗教[concept_acceptance]与宗教集团[concept_approval]）\n• $nesnd_ottoman_recovery.12.b$：大幅改善与在巴尔干或近东拥有利益的最多两个列强的[concept_relations]，永久获得「$nesnd_ottoman_concert$」修正，并在条件允许时与其中一方缔结[concept_defensive_pact]"
 nesnd_ottoman_islam_leader_failed_crimea_tt:0 "北方对手赢得黑海与高加索战事"
 nesnd_ottoman_islam_leader_failed_conclusion:0 "黑海战败而又未能收复巴格达，帝国在伊斯兰世界的声望随之坠落。"
 nesnd_ottoman_islam_leader_failed_event_tt:0 "触发事件「$nesnd_ottoman_recovery.13.t$」：帝国的东方秩序转入「$nesnd_ottoman_recovery$」原有的检查。"
 nesnd_ottoman_islam_leader_timeout_conclusion:0 "二十五年过去，伊斯坦布尔未能把伊斯兰领袖的名分坐实。"
 nesnd_ottoman_islam_leader_timeout_event_tt:0 "领袖地位留给后来者。"
