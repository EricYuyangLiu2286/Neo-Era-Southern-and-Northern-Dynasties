 nesnd_ottoman_recovery.2.t:0 "从军法到国制"
 nesnd_ottoman_recovery.2.d:0 "起初，[SCOPE.sCharacter('nesnd_qinist_leader').GetFullName]只把秦式军改看作操典和补给的整顿。军改开始以后，[ROOT.GetCountry.GetAdjective]军官翻译[SCOPE.sCountry('nesnd_qin_country').GetName]的编制条例，照条例按名册点兵、计口发粮。[SCOPE.sCharacter('nesnd_qinist_leader').GetLastName]却从这些条例里读出了更多的东西，认定[SCOPE.sCountry('nesnd_qin_country').GetName]的君主把兵员和粮秣握在一处，军队才能这样调度。\n\n如今这位[SCOPE.gsInterestGroup('nesnd_qinist_ig').GetName]的领袖公开主张，帝国要学的不只是[SCOPE.sCountry('nesnd_qin_country').GetName]的军法，还有[SCOPE.sCountry('nesnd_qin_country').GetName]的国制。奥斯曼人曾经领导正义吉哈德，在巴格达城下逼退秦军。在这样一个国家里，这种主张听起来近乎背叛。"
 nesnd_ottoman_recovery.2.d_fallen:0 "起初，[SCOPE.sCharacter('nesnd_qinist_leader').GetFullName]只把秦式军改看作操典和补给的整顿。军改开始以后，[ROOT.GetCountry.GetAdjective]军官翻译秦式的编制条例，照条例按名册点兵、计口发粮。[SCOPE.sCharacter('nesnd_qinist_leader').GetLastName]却从这些条例里读出了更多的东西，认定条例背后是君主把兵员和粮秣握在一处的道理。\n\n如今这位[SCOPE.gsInterestGroup('nesnd_qinist_ig').GetName]的领袖公开主张，帝国要学的不只是秦式的军法，还有秦式的国制。奥斯曼人曾经领导正义吉哈德，在巴格达城下逼退秦军。在这样一个国家里，这种主张听起来近乎背叛。"
 nesnd_ottoman_recovery.2.f:0 "“各营按名册点兵，计口发粮。”\n——军改期间的点兵告示"
 nesnd_ottoman_recovery.2.a:0 "让[SCOPE.sCharacter('nesnd_qinist_leader').GetLastName]把话说完。"
