 nesnd_rtw_lost_claims_tt:0 "本日志开启时由本国持有、如今不再完全归本国及本国[concept_subject]所有的巴尔干与南方目标地区，一律获得本国[concept_claim]"
 nesnd_rtw_tur_lost_conclusion:0 "北方对手的军队击破了帝国在多瑙河与高加索的防线，奥斯曼被迫承受城下之盟。"
