 nesnd_ottoman_east_charter_count_tt:0 "已推行「$nesnd_ottoman_east_charter$」至少#v 3#!次"
 nesnd_ottoman_east_charter_conclusion:0 "高门以宪章确立了亚美尼亚社群在东方诸省的地位，边境紧张得以缓和。"
 nesnd_ottoman_east_charter_event_tt:0 "宪章成制：亚美尼亚文化永久获得[concept_acceptance]提升，永久获得「$nesnd_ottoman_armenian_millet$」修正，并与在近东或高加索有利益的大国改善[concept_relations]。"
