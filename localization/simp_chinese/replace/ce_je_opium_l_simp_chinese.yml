 je_nesnd_opium_recovery: "戒除鸦片瘾"
 je_nesnd_opium_recovery_reason: "一切还没有结束，全世界的医生都知道——即使疾病的预防失败了，也不代表我们不能治愈它！但既然我们的国家已经陷入烟瘾之中，治疗他就意味着我们某种程度上在对同胞骨肉开战。\n\n首先是医疗——有些人把生命和一切的财产都砸在烟膏上，但也还是有药铺和医院以之为必须的麻醉药。稽查人员要查散卖的烟膏，就得弄清药师领了多少原料、凭哪些处方发了药，而哪些又是所谓“快活馆”的进货。再然后——常去烟馆的市民和兼卖烟膏的小店主都反对查禁。同时——有些地主既种[GetGoods('tobacco').GetName]，又把地租给人种[GetGoods('opium').GetName]，怕丢掉租金。最后——投资制药和批发的实业家则担心新的禁令会连“正当的”药材生意一并断送。"
 je_nesnd_opium_recovery_no_capacity: "[GetInstitutionType('institution_health_system').GetName]或[GetInstitutionType('institution_police').GetName]必须达到 #v 2#! 级，地方才有能力依章稽查。[GetGoods('opium').GetName]禁运仍可单独推动戒烟。"
 je_nesnd_opium_recovery_awaiting_order: "地方已有执行能力，正等候政府颁行戒烟章程。"
 je_nesnd_opium_recovery_underway: "地方正在稽查烟馆和药铺。$nesnd_opium_recovery_bar$降至 #v 40%#! 或以下，即可解除「$ce_war_to_opium_fail_modifier$」。"
 je_nesnd_opium_recovery_goal: "$nesnd_opium_recovery_bar$降至 #v 40%#! 或以下"
 je_nesnd_opium_recovery_conclusion: "地方医局凭处方逐笔登记药用鸦片，烟馆也失去了公开揽客的生意。延续多年的烟患终于平息。"
 nesnd_opium_register_dispensaries: "正规化查禁章程"
 nesnd_opium_register_dispensaries_desc: "责令地方取缔烟馆零售，逐户核查药铺的[GetGoods('opium').GetName]进货与处方账簿。章程有效期为 #v 5#! 年，颁行满 #v 3#! 个月后可提前撤销。施行期间，小市民、地主和实业家的[concept_approval]各降低 #v 3#! 点。"
 nesnd_opium_regulations: "戒烟查禁章程"
 nesnd_opium_repeal_regulations: "撤销查禁章程"
 nesnd_opium_repeal_regulations_desc: "停止依章稽查烟馆与药铺。章程对鸦片瘾传播的抑制作用和三个集团的[concept_approval]惩罚同时解除。撤销时保留当前覆盖率。"
 nesnd_opium_repeal_unlocked: "章程已施行至少 #v 3#! 个月"
 ce_opium_events.4.recovery_tt: "可通过「$je_nesnd_opium_recovery$」日志解除「$ce_war_to_opium_fail_modifier$」，并消除我国主流文化对[GetGoods('opium').GetName]的[concept_obsession]。"
 nesnd_opium_recovery_bar: "鸦片瘾覆盖率"
 nesnd_opium_recovery_bar_desc: "$nesnd_opium_recovery_bar$ #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
