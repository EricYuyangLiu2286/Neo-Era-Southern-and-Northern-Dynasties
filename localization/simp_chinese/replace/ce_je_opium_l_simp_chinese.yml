l_simp_chinese:
 je_ce_war_to_opium: "鸦片之战"
 je_ce_war_to_opium_reason: "过量的鸦片流入正在毒害我国人民，我们必须阻止这一切。"
 possible_je_ce_war_to_opium: "以我们为[concept_market_owner]的[concept_market]中存在大量@opium!鸦片时，某个敌对势力对我们触发了这个日志......"

 opium_je_event_1_state: "毒害肆虐的地区"
 opium_je_event_2_state: "受害的工业区"
 opium_je_event_3_ig: "牵涉的政治集团"
 opium_je_event_4_state: "地下产业泛滥区"
 ce_opium_events.1.b.tt: "[SCOPE.sCountry('opium_addict_country').GetName]将收到「$je_ce_war_to_opium$」日志。危机期间，该国的[concept_legitimacy]和军队攻防下降。烟瘾降至#v 0#!，该国将获得为期 #v 25#! 年的增益。烟瘾升至#v 100#!，该国将承受「$ce_war_to_opium_fail_modifier$」，一种原本不嗜鸦片的[concept_primary_cultures]将对@opium!鸦片产生[concept_obsession]。日志结束后，该国可在符合外交条件时要求我国拆除鸦片种植园。"

 ce_opium_events.2.t: "鸦片之战"
 ce_opium_events.2.d: "今年以来，在我市场内流通的成瘾性鸦片类产品已经翻了三番。与之相关的恶性事件和灰色产业的规模也在有关部门的报告里持续扩大。甚至到了摧毁某些偏裨乡县正常工作、生活秩序的地步。我们曾经只是将这种怪异的药物视为和烟草、酒精类似，但是伤害更大、更不道德的一种刺激消遣，并未对其设限。但它及其背后的资金流在社会的阴影中不断壮大，现在已经成为我国的一项重大社会危机。"
 ce_opium_events.2.f: "“苟利国家生死以，岂因祸福避趋之。”"
 ce_opium_events.2.a: "正式发起禁烟运动！"
 ce_opium_events.2.instigator_tt: "[SCOPE.sCountry('ce_opium_instigator').GetName]向我国市场推销了鸦片。禁烟运动结束后，我国可在满足外交条件时要求该国拆除境内的鸦片种植园。"

 ce_opium_events.3.t: "拒绝鸦片"
 ce_opium_events.3.d: "我们在全国范围内对鸦片的清剿与封锁取得了空前的胜利。人民终于从毒品的阴霾中清醒，国家的行政和建设也迎来了新的生机。"
 ce_opium_events.3.f: "“一个没有毒品的国家，才是真正的伟大国家。”"
 ce_opium_events.3.a: "胜利属于我们！"
 ce_war_to_opium_success_modifier: "拒绝鸦片"
 ce_war_to_opium_ig_success_modifier: "禁烟成功"

 ce_opium_events.4.t: "鸦片失控"
 ce_opium_events.4.d: "我们的努力彻底失败了。鸦片如同瘟疫一般在全国蔓延开来，军队失去了战斗力，工人与农民萎靡不振，社会秩序正处于崩溃的边缘。"
 ce_opium_events.4.f: "“我们输掉了这场战争，输掉了国家的未来。”"
 ce_opium_events.4.a: "无可挽回的溃败。"
 ce_war_to_opium_fail_modifier: "鸦片泛滥"

 ce_opium_events.5.t: "鸦片贸易的遗产"
 ce_opium_events.5.d: "由于我们不再控制相关的市场，针对鸦片泛滥的系统性打击暂时宣告中止。然而，这场禁毒运动所留下的社会影响，仍然在这片土地上长久地回荡。"
 ce_opium_events.5.f: "“这场未竟的战争改变了很多人。”"
 ce_opium_events.5.a: "只能如此。"
 ce_war_to_opium_legacy_modifier: "毒品贸易的遗产"

 ce_opium_events.6.t: "黑馆"
 ce_opium_events.6.d: "鸦片馆内烟雾缭绕，无数沉迷于此的民众形容枯槁、不辨昼夜。这些无法无天的灰色地带正在吞噬我们社会的根基。"
 ce_opium_events.6.f: "混乱与堕落在这里交织。"
 ce_opium_events.6.a: "实施临时立法管理。"
 ce_opium_events.6.b: "只要他们不闹事，就随他们去吧。"
 ce_war_to_opium_event_1_mod_1: "强硬禁毒管理"
 ce_war_to_opium_event_1_mod_2: "鸦片经济"

 ce_opium_events.7.t: "厂房里的骷髅们"
 ce_opium_events.7.d: "一些工厂主竟然暗中引诱工人吸食鸦片，以此来麻痹他们对恶劣工作环境和超长工时的不满。工人们在毒雾中消瘦如柴，犹如行尸走肉。"
 ce_opium_events.7.f: "“只要给他们一口烟，他们就能一直干下去。”"
 ce_opium_events.7.a: "向执法机构施压，彻查此事！"

 ce_opium_events.8.t: "鸦片商会的影响力"
 ce_opium_events.8.d: "庞大的鸦片贸易催生了一批腰缠万贯的商人和黑帮头目，他们甚至开始利用金钱干预我国的政治进程，试图收买执政集团中的关键人物。"
 ce_opium_events.8.f: "毒资正在腐蚀权力的根基。"
 ce_opium_events.8.a: "将这些腐化分子列为不受信任者！"
 ce_opium_events.8.b: "要求他们上贡“政治献金”。"
 ce_war_to_opium_event_3_mod_1: "肮脏的政治献金"
 ce_war_to_opium_event_3_mod_2: "牵涉腐败丑闻"

 ce_opium_events.9.t: "新的灰色产业"
 ce_opium_events.9.d: "在鸦片高额利润的诱惑下，越来越多的新兴黑帮将贩毒作为主业。他们建立起严密的地下网络，不仅逃避税收，更引发了接连不断的暴力冲突。"
 ce_opium_events.9.f: "财富在阴暗的角落里流转。"
 ce_opium_events.9.a: "在当地实施严打，不惜代价！"
 ce_opium_events.9.b: "我们实在无能为力……"
 ce_war_to_opium_event_4_mod_1: "大规模严打行动"

