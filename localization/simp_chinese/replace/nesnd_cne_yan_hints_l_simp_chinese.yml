l_simp_chinese:
 nesnd_cne_yan.1.t:0 "$STATE_SHENGJING$的寿宴"
 nesnd_cne_yan.1.d:0 "$STATE_SHENGJING$省督府转来一份例行呈报。省城里几家前朝燕廷封爵的军户世家为一位老夫人祝寿，连开了三日宴席。宴前，主人家把宾客名单送到了省督府。但并没有邀请布政、指挥同去。省府疑惑之余阅后核查，履历清晰，皆是[Glossary('glossary_nesnd_zhang_baili_expedition','百里东征')]时降顺的燕军。也是仍在本朝任职的将门。\n\n名单上有几位客人来自$STATE_SONGJIANG$和$STATE_NORTHERN_MANCHURIA$的屯营军，也就是张百里平燕后以降兵、女真部族建立的所谓“巡防营”军官。并不是这几户的亲眷。据奉命巡场的差役说，席间奏的是旧朝乐府曲子。老夫人坐北面，向南摆几座长桌，宾客对坐捧杯都朝老夫人寿。\n\n省督府认为，寿宴并无违制之处，呈报只作备案。"
 nesnd_cne_yan.1.f:0 "“宾客名单俱已呈送，乐用旧曲，未见违制，谨此备案。”——$STATE_SHENGJING$省督府呈报"
 nesnd_cne_yan.1.a:0 "勋贵人家的家宴，由他们去吧。"
 nesnd_cne_yan.2.t:0 "$STATE_SONGJIANG$的账目"
 nesnd_cne_yan.2.d:0 "户部核对东北各省上一年的账目，在$STATE_SONGJIANG$查出几处不合。几座官仓报的鼠耗比往年高出数倍。官府开出的放木票有一批没有存根。本地市面上还多了一批成色极好的东洲银元，钱庄说不清是从哪里流进来的。\n\n如此，户部下僚核算讹误后就要求$STATE_SONGJIANG$地方解释。复文却又改口说是东洲客商往来伐木、运输时雇佣了官家林场的人员，买了粮食。洋元是对方支付的报酬，粮食也是依例平仓陈粮而非私卖。只是东北林莽广远，差役素质不高，因此忘了复核。\n\n资料送来的同时也附上了像模像样的往来信件、字据和拓印的林场账本。最后附上了几位仓官的具结，字迹工整，口径一致。"
 nesnd_cne_yan.2.f:0 "“仓粮短少，查系鼠耗。银元系过往商旅携来。林区路远，盘查不易。”——$STATE_SONGJIANG$省督府复户部文"
 nesnd_cne_yan.2.a:0 "边地的账目，向来如此。"
 nesnd_cne_yan.3.t:0 "军械册上的缺数"
 nesnd_cne_yan.3.d:0 "$STATE_NORTHERN_MANCHURIA$驻军例行清点军械，库存的火枪和火药比册上少了一批。经手的库吏报称，这批枪受潮锈坏，已在营后焚毁。营中却没有人见过焚枪留下的铁件。\n\n兵部派员核查，在江边几处女真寨子里见到了同式的火枪，枪托上的编号已被刮去。寨里的人说，这些枪是用皮货从过路商人手里换来的。核查的官员问起商人的去向，寨里的人只说是往海边去了。"
 nesnd_cne_yan.3.f:0 "“库存火枪若干，受潮锈坏，已于营后焚毁。”——$STATE_NORTHERN_MANCHURIA$驻军军械册附注"
 nesnd_cne_yan.3.a:0 "女真人添几杆猎枪，不足为奇。"
 nesnd_cne_yan.4.t:0 "一夜点卯"
 nesnd_cne_yan.4.d:0 "$STATE_SONGJIANG$巡防营的营官呈报：某夜点卯，营中辽东籍的兵丁缺了将近一半。天亮之前，这些人陆续回营，衣襟上沾着松脂，问起来都说是去邻村吃喜酒。\n\n营官按营规责打了军棍，事情本可以到此为止。他事后查问附近几个村子，那一夜并没有人家办喜事。同一夜，$STATE_AMUR$和$STATE_BOLI$的几处哨卡也有兵丁告假。"
 nesnd_cne_yan.4.f:0 "“某夜点卯，辽东籍兵丁缺额近半，次晨陆续归营，据称赴邻村喜宴，已各责军棍。”——$STATE_SONGJIANG$巡防营营官呈文"
 nesnd_cne_yan.4.a:0 "兵丁贪杯，军棍管用。"
 nesnd_cne_yan.5.t:0 "林中的蓝布"
 nesnd_cne_yan.5.d:0 "兵部派往东北的勘界委员从$STATE_SONGJIANG$与$STATE_NORTHERN_MANCHURIA$交界的林区回来，在报告后面附了一页见闻。几处山谷里有成片新砍出的空地，地上留着整齐的脚印和车辙，但是看不出是商队还是附近的土匪、巡防营（虽然两者本差距不大）。附近几座寨子的门前晾着蓝布，布上用白线似乎绣着什么。看门屯丁见到生人便收了起来。\n\n回程时，向导说寨里的老人都讲，燕子今年要早些北来。他问勘界委员，这算不算好兆头。"
 nesnd_cne_yan.5.f:0 "“林中有新伐空地数处。寨门晾蓝布，绣白字，见人即收。”——勘界委员报告所附见闻"
 nesnd_cne_yan.5.a:0 "春来燕归，本是常事。"
