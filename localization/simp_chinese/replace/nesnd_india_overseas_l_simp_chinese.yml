l_simp_chinese:
 nesnd_india_overseas:0 "海外通商"
 nesnd_india_overseas_void_conclusion:0 "我国不再经营这些海外交涉。"
 nesnd_india_overseas_reason_steel:0 "[ROOT.GetCountry.GetName]已是[concept_recognized_power]，可以向三个海外方向的当地政府提出请求：[GetStrategicRegion('region_indonesia').GetName]、[GetStrategicRegion('region_persian_gulf').GetName]沿岸和[GetStrategicRegion('region_east_africa').GetName]。当地政府可以给予我国[concept_trade_privilege]，也可以让出一处有$building_port$的州作我国的[concept_treaty_port]，同意与否由它决定。它是别国的[Concept('concept_subject','附属国')]时，有时还要先得到[concept_overlord]许可：请求贸易特权只在它是[concept_puppet]时要问，请求条约港则凡是附属国都要问。领土和保护关系不在这些条约里，要另行发起[concept_diplomatic_play]。\n\n#bold 本国国力#!\n[concept_gdp]世界排名：[ROOT.GetCountry.GetGDPRanking]\n[concept_gdp_per_capita]世界排名：[ROOT.GetCountry.GetGDPPerCapitaRanking]\n通$building_railway$的[concept_incorporated_state]：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_rail_states')|0] / [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_incorporated_states')|0]\n$building_steel_mill$：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_steel_levels')|0] 级，在岗人数约占岗位的 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_steel_staffed_percent')|0]%\n$building_port$总级数：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_levels')|0]\n[concept_naval_power_projection]世界排名：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_navy_rank')|0]"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName]已是[concept_recognized_power]，可以向三个海外方向的当地政府提出请求：[GetStrategicRegion('region_indonesia').GetName]、[GetStrategicRegion('region_persian_gulf').GetName]沿岸和[GetStrategicRegion('region_east_africa').GetName]。当地政府可以给予我国[concept_trade_privilege]，也可以让出一处有$building_port$的州作我国的[concept_treaty_port]，同意与否由它决定。它是别国的[Concept('concept_subject','附属国')]时，有时还要先得到[concept_overlord]许可：请求贸易特权只在它是[concept_puppet]时要问，请求条约港则凡是附属国都要问。领土和保护关系不在这些条约里，要另行发起[concept_diplomatic_play]。\n\n#bold 本国国力#!\n[concept_gdp]世界排名：[ROOT.GetCountry.GetGDPRanking]\n[concept_gdp_per_capita]世界排名：[ROOT.GetCountry.GetGDPPerCapitaRanking]\n通$building_railway$的[concept_incorporated_state]：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_rail_states')|0] / [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_incorporated_states')|0]\n$building_steel_mill$：没有\n$building_port$总级数：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_levels')|0]\n[concept_naval_power_projection]世界排名：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_navy_rank')|0]"
