 nesnd_journal_closures_qin_unity_conclusion:0 "维系西秦诸地共同认同的旧有安排已经结束。"
 nesnd_journal_closures_south_succession_tt:0 "南朝的明吴之争已有定局，或已经演变为内战。"
 nesnd_journal_closures_south_succession_conclusion:0 "明吴之争已越过此前各方议论与选边的阶段。"
 nesnd_journal_closures_xiangyang_tt:0 "本国已不再完整拥有襄阳地区。"
 nesnd_journal_closures_xiangyang_conclusion:0 "襄阳大营已失去完整的驻地，其军事支援随之结束。"
