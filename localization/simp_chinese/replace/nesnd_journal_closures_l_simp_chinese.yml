 nesnd_journal_closures_japan_foreign_tt:0 "本国已不再属于日本三国。"
 nesnd_journal_closures_japan_foreign_conclusion:0 "原有日本政权的使节交涉已经结束。"
 nesnd_journal_closures_ottoman_recovery_tt:0 "本国已不再延续奥斯曼国家。"
 nesnd_journal_closures_ottoman_recovery_conclusion:0 "奥斯曼复兴政策所维系的军政安排已经结束。"
 nesnd_journal_closures_ottoman_unity_tt:0 "本国已不再延续奥斯曼国家。"
 nesnd_journal_closures_ottoman_unity_conclusion:0 "奥斯曼国家原有的团结政策已经结束。"
 nesnd_journal_closures_persia_west_tt:0 "波斯已放弃借助西秦援助向西扩张的路线，或本国已不再延续波斯国家。"
