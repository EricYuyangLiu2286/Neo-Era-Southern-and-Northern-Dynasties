l_simp_chinese:
 nesnd_journal_closures_header:0 "终止条件"
 nesnd_journal_closures_effect_header:0 "终止后"
 nesnd_journal_closures_parent_cne:0 "此项事务随“$ce_cne_land_reform$”一同结束。"
 nesnd_journal_closures_parent_qin:0 "此项朝议随“$nesnd_qe1_agenda_journal$”一同结束。"
 nesnd_journal_closures_restoration_tt:0 "本国已退出原有的原住民复统交涉，或交涉已经转为政权之间的对抗。"
 nesnd_journal_closures_restoration_conclusion:0 "本国原有的原住民复国交涉已经结束。"
 nesnd_journal_closures_austria_tt:0 "奥地利失去独立，或本国已不再延续奥地利的国家地位。"
 nesnd_journal_closures_austria_conclusion:0 "奥地利已无法以原有身份主持对意大利的干预。"
 nesnd_journal_closures_america_tt:0 "$HUS$不复存在或转为原住民继承国，或本国已不再是美利坚合众国。"
 nesnd_journal_closures_america_conclusion:0 "围绕$HUS$的大陆扩张议程已经结束。"
 nesnd_journal_closures_india_society_tt:0 "本国已不再是完成改革、发展民族主义的印度帝国政权。"
 nesnd_journal_closures_india_society_conclusion:0 "原有的印度共同认同议程已经结束。"
 nesnd_journal_closures_india_princes_tt:0 "本国已不再是拥有印度领地的地方邦国。"
 nesnd_journal_closures_india_princes_conclusion:0 "原有印度邦国的对外交涉安排已经结束。"
 nesnd_journal_closures_india_usm_tt:0 "本国已不再以南朝或其天竺宣慰司的身份直接统治有人居住的天竺领地。"
 nesnd_journal_closures_india_usm_conclusion:0 "本国原有的天竺直接治理已经结束。"
 nesnd_journal_closures_india_dynasty_tt:0 "本国已废除君主制，或印度共同认同的建设已经中止。"
 nesnd_journal_closures_india_dynasty_conclusion:0 "本国围绕王朝维系政治效忠的议程已经结束。"
 nesnd_journal_closures_india_france_tt:0 "法国不复存在，或本国已不再属于印度的帝国与地方邦国。"
 nesnd_journal_closures_india_france_conclusion:0 "原有的对法交涉及法国顾问安排已经结束。"
 nesnd_journal_closures_india_uprising_tt:0 "本国已不再是印度帝国政权；或在没有进行中的起义联络时，$STATE_CIRCARS$、$STATE_KURNOOL$、$STATE_MADRAS$、$STATE_MYSORE$、$STATE_TRAVANCORE$和$STATE_GUJARAT$均已脱离南朝及其所属天竺宣慰司的统治。"
 nesnd_journal_closures_india_uprising_conclusion:0 "原有的起义联络议程已经结束。"
 nesnd_journal_closures_japan_cohesion_tt:0 "本国已不再属于日本三国。"
