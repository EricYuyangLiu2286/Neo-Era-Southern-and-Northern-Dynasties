l_simp_chinese:
 nesnd_journal_closures_header:0 "终止条件"
 nesnd_journal_closures_effect_header:0 "终止后"
 nesnd_journal_closures_parent_cne:0 "这件事随“$ce_cne_land_reform$”一并了结。"
 nesnd_journal_closures_parent_qin:0 "这场朝议随“$nesnd_qe1_agenda_journal$”一并收场。"
 nesnd_journal_closures_restoration_tt:0 "本国已退出原有的原住民复统交涉，或交涉已经转为政权之间的对抗。"
 nesnd_journal_closures_restoration_conclusion:0 "原住民复国的交涉，到此为止。"
 nesnd_journal_closures_austria_tt:0 "奥地利失去独立，或本国已不再延续奥地利的国家地位。"
 nesnd_journal_closures_austria_conclusion:0 "奥地利已无法以原有身份主持对意大利的干预。"
 nesnd_journal_closures_america_tt:0 "$HUS$不复存在或转为原住民继承国，或本国已不再是美利坚合众国。"
 nesnd_journal_closures_america_conclusion:0 "向$HUS$扩张的大陆计划，到此收场。"
 nesnd_journal_closures_india_society_tt:0 "本国已不再是完成改革、发展民族主义的印度帝国政权。"
 nesnd_journal_closures_india_society_conclusion:0 "印度共同认同的筹议，中途搁下了。"
 nesnd_journal_closures_india_princes_tt:0 "本国已不再是拥有印度领地的地方邦国。"
 nesnd_journal_closures_india_princes_conclusion:0 "这个印度邦国的对外交涉，到这里结束。"
 nesnd_journal_closures_india_usm_tt:0 "本国已不再以南朝或其天竺宣慰司的身份直接统治有人居住的天竺领地。"
 nesnd_journal_closures_india_usm_conclusion:0 "本国对天竺的直接治理，到此为止。"
 nesnd_journal_closures_india_dynasty_tt:0 "本国已废除君主制，或印度共同认同的建设已经中止。"
 nesnd_journal_closures_india_dynasty_conclusion:0 "靠王朝名望维系人心的努力，就此结束。"
 nesnd_journal_closures_india_france_tt:0 "法国不复存在，或本国已不再属于印度的帝国与地方邦国。"
 nesnd_journal_closures_india_france_conclusion:0 "同法国的交涉和顾问团的差事，都结束了。"
 nesnd_journal_closures_india_uprising_tt:0 "本国已不再是印度帝国政权；或在没有进行中的起义联络时，$STATE_CIRCARS$、$STATE_KURNOOL$、$STATE_MADRAS$、$STATE_MYSORE$、$STATE_TRAVANCORE$和$STATE_GUJARAT$均已脱离南朝及其所属天竺宣慰司的统治。"
 nesnd_journal_closures_india_uprising_conclusion:0 "同各地起义组织的联络，到此中断。"
 nesnd_journal_closures_japan_cohesion_tt:0 "本国已不再属于日本三国。"
 nesnd_journal_closures_japan_cohesion_conclusion:0 "原来的日本政权不在了，它主持的国民团结也随之作罢。"
 nesnd_journal_closures_japan_foreign_tt:0 "本国已不再属于日本三国。"
 nesnd_journal_closures_japan_foreign_conclusion:0 "原日本政权的使节，不再奔走了。"
 nesnd_journal_closures_ottoman_recovery_tt:0 "本国已不再延续奥斯曼国家。"
 nesnd_journal_closures_ottoman_recovery_conclusion:0 "靠复兴政策撑着的那套军政，到此散了。"
 nesnd_journal_closures_ottoman_unity_tt:0 "本国已不再延续奥斯曼国家。"
 nesnd_journal_closures_ottoman_unity_conclusion:0 "奥斯曼原来的团结政策，到此为止。"
 nesnd_journal_closures_persia_west_tt:0 "波斯已放弃借助西秦援助向西扩张的路线，或本国已不再延续波斯国家。"
 nesnd_journal_closures_persia_west_conclusion:0 "借西秦之力西进的打算，就此作罢。"
 nesnd_journal_closures_persia_east_tt:0 "波斯已放弃秘密挑战西秦的路线，或本国已不再延续波斯国家。"
 nesnd_journal_closures_persia_east_conclusion:0 "东去挑战西秦边疆的计划，作罢了。"
 nesnd_journal_closures_persia_governance_tt:0 "本国已不再延续波斯国家。"
 nesnd_journal_closures_persia_governance_conclusion:0 "原波斯政府的专项拨款，停了。"
 nesnd_journal_closures_qin_court_tt:0 "本国已不再是西秦，或出现以下任一情形：实行普选制或委员会共和制、直辖州不足五个、三权朝议终止。"
 nesnd_journal_closures_qin_court_conclusion:0 "皇族、士人与军队之间的朝议，散了。"
 nesnd_journal_closures_qin_unity_tt:0 "本国已不再是西秦，或西秦帝国已经解体。"
 nesnd_journal_closures_qin_unity_conclusion:0 "维系西秦诸地认同的旧办法，到此为止。"
 nesnd_journal_closures_south_succession_tt:0 "南朝的明吴之争已有定局，或已经演变为内战。"
 nesnd_journal_closures_south_succession_conclusion:0 "明吴之争已越过此前各方议论与选边的阶段。"
 nesnd_journal_closures_xiangyang_tt:0 "本国已不再完整拥有襄阳地区。"
 nesnd_journal_closures_xiangyang_conclusion:0 "襄阳大营已失去完整的驻地，其军事支援随之结束。"
