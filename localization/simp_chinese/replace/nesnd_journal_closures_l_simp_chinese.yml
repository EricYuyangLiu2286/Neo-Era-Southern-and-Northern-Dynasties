 nesnd_journal_closures_persia_east_tt:0 "波斯已放弃秘密挑战西秦的路线，或本国已不再延续波斯国家。"
 nesnd_journal_closures_persia_east_conclusion:0 "挑战西秦边疆的扩张议程已经结束。"
 nesnd_journal_closures_persia_governance_tt:0 "本国已不再延续波斯国家。"
 nesnd_journal_closures_persia_governance_conclusion:0 "原有波斯政府的专项拨款安排已经结束。"
 nesnd_journal_closures_qin_court_tt:0 "本国已不再是西秦，或出现以下任一情形：实行普选制或委员会共和制、直辖州不足五个、三权朝议终止。"
 nesnd_journal_closures_qin_court_conclusion:0 "皇族、士人与军队之间原有的朝议安排已经结束。"
