l_simp_chinese:
 glossary_nesnd_beiming: "北明"
 glossary_nesnd_beiming_desc: "#b;italic 北明#!指1408年永乐帝在田猎中暴崩以后，直到1707年秦燕灭明的明朝。1433年宣德帝驾崩至灭明的两百余年，史称[Glossary('glossary_nesnd_beiming_zhanguoshi','北明战国世')]。\n\n[Glossary('glossary_nesnd_saiwang_rebellion','塞王之乱')]后，宣德帝派驻各地的大营渐成[Glossary('glossary_nesnd_fanzhen','藩镇')]，天下的局面近于中唐与五代。各镇逐步变为自行治国的诸侯，吴、秦、越、闽等国向南洋、中亚乃至新大陆殖民。几次[Glossary('glossary_nesnd_central_plains_wars','中原大战')]后，天下进入南北两军对垒的[Glossary('glossary_nesnd_coalition_order','联军体系')]。1705年秦燕结盟，在[Glossary('glossary_nesnd_overthrow_of_ming','灭明战争')]中攻入燕京，北明灭亡。燕、秦称帝，南方诸侯另立南明，形成新的南北朝。"

 glossary_nesnd_beiming_zhanguoshi: "北明战国世"
 glossary_nesnd_beiming_zhanguoshi_desc: "#b;italic 《北明战国世》#!是中华帝国太祖牧仲棠的幼妹牧沐子中晚年写成的长篇小说，历时三十五年，分五大卷、十小卷。全书从1408年永乐帝暴崩写到1835年南北两朝签订[Glossary('glossary_nesnd_treaty_of_yangzhou','扬州条约')]。第五卷所记大革命前后的事，多得自牧仲棠向幼妹的亲口讲述。\n\n牧沐子把1433年宣德帝驾崩至灭明的时代分为燕京体系、藩镇体系、[Glossary('glossary_nesnd_coalition_order','联军体系')]三个阶段。后人便以书名称呼这一时代。"

 glossary_nesnd_saiwang_rebellion: "塞王之乱"
 glossary_nesnd_saiwang_rebellion_desc: "#b;italic 塞王之乱#!是北明开端的宗室内战。永乐帝朱棣在靖难成功后暴崩，宁王朱权、晋王朱济熺、齐王朱榑等洪武诸子乘机起兵，与燕京的洪熙帝分庭抗礼。关中二王中立，周王不愿附逆，逃往广东。战事持续三年有余，双方议和相持。\n\n宣德帝即位后灭晋平宁。1433年，他亲征突袭关中的蜀王朱椿，病逝于洛阳。此后朱姓藩王一蹶不振，异姓诸侯取而代之。"

 glossary_nesnd_fanzhen: "藩镇"
 glossary_nesnd_fanzhen_desc: "#b;italic 藩镇#!是北明割据势力的通称。1425年起，宣德帝猜忌南京留守使郑和，命他再下西洋，分其南京留守之权，又将河北塞兵分驻全国各地，称为“大营”，权归兵部。\n\n宣德帝死后，正统朝政被武功勋贵把持，各地大营的将领割据城池，开府摄政。他们仍以明朝的官爵自称，就像唐末五代的军阀仍称节度使、留后。北明天子维持着朝廷，却无力恢复永乐、宣德时的统一，处境近于中唐以后的唐室。"

 glossary_nesnd_central_plains_wars: "中原大战"
 glossary_nesnd_central_plains_wars_desc: "#b;italic 中原大战#!是北明[Glossary('glossary_nesnd_fanzhen','藩镇')]诸侯争夺中原的六次大战。第一次（1500—1503）后，诸侯订立凤阳盟誓，中原安定近一个世纪。第二次（1549—1553）后，燕京朝廷再也无法约束诸侯。第三次（1611—1619）打破了凤阳盟誓的秩序。第四次（1706—1713）中，秦燕联军灭亡北明。\n\n第五次（1788—1792）之后，秦燕又于1800年发动第六次中原大战。秦、燕、明三朝穷兵黩武，为了各自统一天下的野心压制绅商工农，民生经济衰退，从东宁到羌城民变四起。1810年，秦国在战争中爆发革命。"

 glossary_nesnd_coalition_order: "联军体系"
 glossary_nesnd_coalition_order_desc: "#b;italic 联军体系#!是北明最后一个世纪的格局（1611—1707）。宣德年间，郑和以南京留守使镇守江南，郑氏此后世袭吴国公。1443年，天津侯徐祁烨在夺门之变中挟持天子，受封燕国公，又以太师身份掌握京营一部。\n\n第三次[Glossary('glossary_nesnd_central_plains_wars','中原大战')]后，天下分为南北两军。南军以南京留守司五军都督府的吴国公为首，常以清君侧、救天子与生民为名，讨伐天津辅国摄政五军太师府的燕国公，也常遭北军讨伐。北军以燕国为主，陈秦时而加入，南军则较为松散。两军都与尚未被吞并的楚、蜀、齐等国合纵连横。越国在吴越战争（1669—1675）中失去殖民地水师，向南京投降，闽国也向吴国让利求存。"

 glossary_nesnd_overthrow_of_ming: "灭明战争"
 glossary_nesnd_overthrow_of_ming_desc: "#b;italic 灭明战争#!是第四次[Glossary('glossary_nesnd_central_plains_wars','中原大战')]中秦燕联军攻灭燕京明廷的战争（1706—1707）。1705年秦燕结盟后，燕国直隶诸军与秦国安北幕府的龙骑军合围北京，齐、吴、楚、蜀、淮、宁六国对秦燕联军宣战。[Glossary('glossary_nesnd_coalition_order','联军体系')]随之终结。\n\n北明灭亡后，燕、秦两国君主称帝。南方诸侯在楚国公与淮王带领下，于南京签署《联邦平贼诏书》，由诸侯与士绅推举朱明宗室为帝，建立南明，又称大明联邦。联邦各国偏安之心远大于光复燕京之志，此后与燕、秦维持了数十年的和平。"

 glossary_nesnd_chinese_revolution: "中华大革命"
 glossary_nesnd_chinese_revolution_desc: "#b;italic 中华大革命#!是19世纪初推翻北方秦、燕两朝的革命。第五、第六次[Glossary('glossary_nesnd_central_plains_wars','中原大战')]中后期，三朝穷兵黩武，为了各自统一天下的野心，压制绅商工农，民生经济衰退，民变四起。1810年，秦军在[Glossary('glossary_nesnd_lantian_mutiny','蓝田哗变')]后进军长安，与城中共和派发动[Glossary('glossary_nesnd_changan_uprising','长安起义')]，掀起[Glossary('glossary_nesnd_western_qin_revolution','西秦大革命')]。\n\n1815年，牧仲棠在[Glossary('glossary_nesnd_eastern_campaigns','东征')]途中回师关中，借[Glossary('glossary_nesnd_gulou_society','鼓楼结社')]推翻青年派政府，杀死吴省。陈东阳等共和派南逃，为吴国主郑钦收纳。1819年，牧仲棠灭燕，在开封宣布废除共和政府，登基称帝，建立中华帝国。次年的[Glossary('glossary_nesnd_southern_campaign','南征')]受阻于襄阳，1822年以失败告终。1835年，南北两朝以[Glossary('glossary_nesnd_treaty_of_yangzhou','扬州条约')]划江而治。"

 glossary_nesnd_lantian_mutiny: "蓝田哗变"
 glossary_nesnd_lantian_mutiny_desc: "#b;italic 蓝田哗变#!是西秦大革命的导火索。第六次[Glossary('glossary_nesnd_central_plains_wars','中原大战')]期间，秦军接连发生贪墨军饷、拖欠军资的案件。案件集中于工兵单位和工程采购，大批前线军官受牵连被捕，技术兵种的调度因此瘫痪。秦国的军国高层仍强令部队强攻明军在剑阁的高山防线。\n\n1810年春，前线一批青年军官按秦国旧俗结成兄弟会“立心社”，取“为天地立心”之意。何伯辰、牧仲棠、苏阿宏（苏宏）等人在同袍掩护下潜入长安以南、伤兵与后备军驻扎的蓝田大营。经牧仲棠鼓动，营中官兵群情沸腾，次日蓝田即为立心社掌握。他们推举年长位高的共和派军人何伯辰为领袖，扣押营中高级军官，以“讨饷鸣冤，乞请君父”为号向长安进军。"

 glossary_nesnd_changan_uprising: "长安起义"
 glossary_nesnd_changan_uprising_desc: "#b;italic 长安起义#!是西秦大革命的开端。战争期间，被列国通缉的共和派魁首吴省潜回长安，以共和派商号“岭北辉永商会”替秦军筹措物资为掩护，在贫民窟分发物资与书籍、开办学校，又用流出的军械武装了一支力工卫队。\n\n1810年，[Glossary('glossary_nesnd_lantian_mutiny','蓝田哗变')]的部队在京郊被禁卫军包围。牧仲棠等人趁夜纵火，带一部分人换上便装潜入城中。次日，一些仍对秦皇抱有幻想的军官不顾牧仲棠反对，聚众请求面圣，秦皇陈炯下令捕杀。吴省趁乱鼓动市民，与陈东阳、邓明舆等人夺取城楼炮台，轰击城外的禁卫军。苏阿宏抢占武库，开城接应蓝田士兵。革命军随后炮轰长安王宫，绞死陈炯。"

 glossary_nesnd_western_qin_revolution: "西秦大革命"
 glossary_nesnd_western_qin_revolution_desc: "#b;italic 西秦大革命#!是1810年在秦国爆发的共和革命。[Glossary('glossary_nesnd_changan_uprising','长安起义')]后，一批秘密国人派元老出任共和政府首脑。1812年“东方共和国”成立，几经更名，定为“大汉共和邦”。元老们无力应付内外困局，又排斥在起义中冲入王宫的革命军人，几乎将他们判刑。\n\n1814年，陈东阳发表《论东方的革命》与《共和宪法》，阐明“万族共和”的主张。1815年3月，以牧仲棠、吴省、陈东阳、邓明舆“共和四子”为首的青年派发动政变，夺取革命领导权。陈东阳任国家元首周公，吴省任召公。"

 glossary_nesnd_gulou_society: "鼓楼结社"
 glossary_nesnd_gulou_society_desc: "#b;italic 鼓楼结社#!是1815年7月推翻[Glossary('glossary_nesnd_western_qin_revolution','西秦大革命')]青年派政府的密谋集团。青年派推行的土地改革逐渐失控，牧仲棠从前线突然回到关中，在军队与国人的拥戴下，与邓明舆等人秘密结社，发动政变。他们以破坏革命、施行暴政为名，捕杀昔日同窗、革命领袖吴省。陈东阳劝阻无果，逃往南明。\n\n次年，共和邦更名为“中华联邦”，以“混一寰宇，再兴国族”取代“万族共和，国人革命”为最终目标。邓明舆也举家南逃。"

 glossary_nesnd_eastern_campaigns: "牧仲棠东征"
 glossary_nesnd_eastern_campaigns_desc: "#b;italic 牧仲棠东征#!是牧仲棠率共和邦军队对燕国与南明联军的战争（1815—1819）。1815年，他先在洞庭湖、后在徐州击败明燕联军，南明宗室别支朱班博因保全所部声名大振。1818年第二次东征，南明淮王中流弹而死，旧西府军几乎覆没。\n\n1819年正月，牧仲棠在德州、束鹿击溃燕军，斩燕帝徐柬，进入北京，延续379年的徐燕政权灭亡。燕国宗室、辽东总督徐鼎元逃往辽阳，自称监国，建立东燕。"

 glossary_nesnd_southern_campaign: "南征"
 glossary_nesnd_southern_campaign_desc: "#b;italic 南征#!是[Glossary('glossary_nesnd_eastern_campaigns','东征')]灭燕之后，中华帝国皇帝牧仲棠统一南北的战役（1820—1822）。他依《南征札记》分兵三路：偏师屯汉中牵制巴蜀，奇兵自徐州、蚌埠南下江淮，他亲率正兵围攻襄阳。朱班博坚守襄阳，萧虎力在剑阁挡住费西翼。\n\n徐州会战中，郑（德川）家齐统率的南府军坐视西府军覆没。苏宏乘势渡江，却在南京城下被吴国主郑钦击溃。1821年秋，逃亡鄯州的陈秦政权举兵东进，牧仲棠回师兰州破之，秦军残部退守伊犁，号称西秦。南征以失败告终。"

 glossary_nesnd_treaty_of_yangzhou: "扬州条约"
 glossary_nesnd_treaty_of_yangzhou_desc: "#b;italic 扬州条约#!是中华帝国与南明在1835年签订的条约。[Glossary('glossary_nesnd_southern_campaign','南征')]失败后，两国以此结束敌对，划江而治。"

