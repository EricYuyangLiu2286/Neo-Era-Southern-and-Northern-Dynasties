l_simp_chinese:
 nesnd_rg_pru:0 "铁路所及之地"
 nesnd_rg_pru_reason:0 "普鲁士的军官习惯在地图上计算行军的日程，西里西亚的厂主则计算煤铁运到柏林的价钱。他们都盼望铁路，却未必愿意为同一条线路付钱。把这些腹地连接起来，将使国家拥有比外交辞令更可靠的力量。"
 nesnd_rg_aus:0 "维也纳以外"
 nesnd_rg_aus_reason:0 "匈牙利问题暂时有了结果，各地的争论却没有因此停止。布拉格的学者要求自己的学校，维也纳的官员希望地方能够执行统一的政令。新一轮建设要回答的，是中央政府究竟准备怎样维系这些语言与利益各不相同的省份。"
 nesnd_rg_tur:0 "改革之后的商路"
 nesnd_rg_tur_reason:0 "坦志麦特留下了法令，也留下了没有兑现的愿望。沿海商人希望货物能够运出去，内地的官员则抱怨税收不足。国家若要摆脱对外债与战争赔款的忧虑，必须让港口、商路和地方行政真正运转起来。"
 nesnd_rg_egy:0 "尼罗河的工场"
 nesnd_rg_egy_reason:0 "棉花沿尼罗河运往海岸，外来的布匹又从港口运回内地。军队和政府从这种往来中征税，埃及的工匠却希望得到自己的工场。学校、纺织业与港口能否一同发展，将决定埃及面对周围强国时有多少回旋余地。"
 nesnd_rg_mex:0 "墨西哥的地方"
 nesnd_rg_mex_reason:0 "首都已经建立自己的权威，命令却常常到不了地方。军人把持的道路、缺少经费的学校和依赖进口工具的工场，都在消耗独立留下的希望。地方需要看得见的建设，政府也需要能够办事的人。"
 nesnd_rg_usa:0 "自由之后的生活"
 nesnd_rg_usa_reason:0 "奴隶制的法律已经废除，南方的劳动与土地关系却不会随一纸法令重新安排。获得自由的人需要学校和工作，商人希望恢复交通，旧种植园主则仍在争取地方权力。联邦政府无法只用庆祝自由的演说回答这些问题。"
 nesnd_rg_peu:0 "安第斯与海岸"
 nesnd_rg_peu_reason:0 "利马的商人面向大海，山区的矿工却首先要面对崎岖的道路。矿石出山的代价决定着工钱与利润，也决定地方有多少税款可用。秘鲁需要连接山地与海岸的交通，更需要能够经营矿场和铁路的人才。"
 nesnd_rg_work:0 "建设成果"
 nesnd_rg_work_desc:0 "达标月份：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 12#!"
