 nesnd_rg_railway_support:0 "铁路经营扶助"
 nesnd_rg_workshop_support:0 "工场扩充"
 nesnd_rg_provincial_schools:0 "地方教育经费"
 nesnd_rg_administrative_service:0 "行政整顿"
 nesnd_rg_port_support:0 "港口经营扶助"
 nesnd_rg_nile_textiles:0 "尼罗河纺织业"
 nesnd_rg_local_works:0 "地方工程"
 nesnd_rg_federal_authority:0 "政府威信"
 nesnd_rg_andean_mines:0 "安第斯矿路"
 nesnd_rg_technical_schools:0 "矿业与工程学校"
 nesnd_regional.1.t:0 "车站里的争论"
 nesnd_regional.1.d:0 "从西里西亚抵达的列车给柏林带来了煤铁，也带来了新的请愿。铁路公司要求支持干线运输，工场主则希望扩大机器和工具的生产。军官们当然赞成增加运力，只是他们给每一座车站都另算了一笔军用的账。政府现在可以决定下一笔支持投向何处。"
 nesnd_regional.1.a:0 "先让铁路承担更多运输。"
 nesnd_regional.1.b:0 "工场需要自己的机器与工具。"
 nesnd_regional.2.t:0 "省份的声音"
 nesnd_regional.2.d:0 "地方学校已经开始培养新一代教师和办事人员。有人希望他们留在本地，也有人主张将他们纳入维也纳的行政体系。两种意见都声称是在维护国家；真正的分歧，是地方应当得到更多教育资源，还是让中央获得更强的办事能力。"
 nesnd_regional.2.a:0 "让学校在地方扎根。"
 nesnd_regional.2.b:0 "先充实中央的行政机关。"
 nesnd_regional.3.t:0 "通往海岸的账本"
 nesnd_regional.3.d:0 "港口的货运和官署的税册开始显示建设的成果。商人请求把支持留在航运事业上，财政官员却认为现在正是整顿行政的机会。政府不能永远靠临时征收解决困难，接下来的投入必须有所取舍。"
 nesnd_regional.3.a:0 "支持港口与海运。"
 nesnd_regional.3.b:0 "让税政与行政能够长期维持。"
 nesnd_regional.4.t:0 "棉花之外"
 nesnd_regional.4.d:0 "埃及的工场已经能够将更多棉花织成布匹。厂主请求扩大生产，学校的教员则提醒政府：若识字和技艺仍只掌握在少数人手里，新产业很快又会缺少人才。繁荣的开端带来了新的选择。"
 nesnd_regional.4.a:0 "先扶植纺织工场。"
 nesnd_regional.4.b:0 "学校应当跟上工场。"
 nesnd_regional.5.t:0 "首都与各州"
 nesnd_regional.5.d:0 "地方学校、港口和工场已有了建设成果。各州代表要求继续投资地方，首都的政府则希望借这些政绩巩固权威。接下来的拨款将决定哪一方先得到支持。"
 nesnd_regional.5.a:0 "把成果留给地方建设。"
 nesnd_regional.5.b:0 "这是政府重新赢得信任的机会。"
 nesnd_regional.6.t:0 "一所学校，一段铁路"
 nesnd_regional.6.d:0 "南方的学校和交通事业已经恢复了一些活力。摆脱奴役的人们要求受教育的机会，商界则催促联邦继续扶助铁路。摆脱奴隶制只是开始；获得自由的人是否能在新的经济秩序中立足，仍取决于今后的投入。"
 nesnd_regional.6.a:0 "扩大公民受教育的机会。"
 nesnd_regional.6.b:0 "让南方的交通恢复繁荣。"
 nesnd_regional.7.t:0 "从矿山到利马"
 nesnd_regional.7.d:0 "铁路已经把部分矿区与海岸连接起来，利马的商人开始谈论更大的投资。矿主希望乘势扩张，工程师却担心人才不足会让新的设备闲置。政府可以扶助矿业继续生产，也可以把这一阶段的成果用于培养矿务与工程人才。"
 nesnd_regional.7.a:0 "让矿路带来更多产出。"
 nesnd_regional.7.b:0 "我们需要能够掌握这些技术的人。"
 nesnd_regional.unavailable:0 "局势已经改变，这项安排无法实行。"
 nesnd_regional.8.t:0 "未竟的建设"
 nesnd_regional.8.d:0 "当初提出的建设议程未能如愿完成。办学、工场与交通仍是国家必须面对的问题，但围绕这一轮计划形成的政治期待已经散去。留下的建筑属于今后的生活，未兑现的承诺也会被人记住。"
 nesnd_regional.8.a:0 "眼前的问题仍要解决。"
