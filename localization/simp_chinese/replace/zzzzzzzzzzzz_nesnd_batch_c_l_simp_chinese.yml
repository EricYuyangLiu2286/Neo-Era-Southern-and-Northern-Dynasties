l_simp_chinese:
 nesnd_egypt_independence:0 "独立的代价"
 nesnd_egypt_independence_reason:0 "1825年的协定承认埃及摆脱奥斯曼的统辖，六国以保证独立换取在尼罗河沿岸投资的权利。王朝因而得到一段宝贵的喘息，却也把工场、学校和军队的前途交到了新的债权人面前。\n\n外国的机器与教师可以帮助我们扩充国力，外国资本对埃及经济的支配也会侵蚀自主。朝廷可以选择合作的对象，也可以撤回政治承诺。三十年之后，这个国家能否依然决定自己的命运，要由这些选择和它们留下的经济秩序回答。"
 nesnd_egypt_with_investor_status:0 "当前投资国：[JournalEntry.GetCountry.MakeScope.Var('nesnd_egypt_investor').GetCountry.GetName]。外国持有的经济份额：[JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]。"
 nesnd_egypt_without_investor_status:0 "尚未承诺由一国主持投资。外国持有的经济份额：[JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]。"
 nesnd_egypt_investment_accounts:0 "尼罗河的学堂与工场"
 nesnd_egypt_investment_accounts_reason:0 "购入机器容易，留下能够制造、修理和使用机器的人却要付出更多心力。大学要教出本国的技术人才，工具工场要供给生产所需的器械，新的工业也要招得到真正的工人。\n\n朝廷希望这些事业能成为埃及自己的立国之本。无论资本来自何处，学堂有人讲授、工场有人劳作，才算把纸上的许诺变成了国力。"
 nesnd_egypt_independence_bar:0 "独立性"
 nesnd_egypt_independence_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100"
 nesnd_egypt_sponsor_drain:0 "对投资国的政治承诺"
 nesnd_egypt_foreign_drain:0 "超过25%的外资经济份额"
 nesnd_egypt_generation_passed:0 "独立安排已维持三十年"
 nesnd_egypt_still_independent:0 "独立性仍高于0"
 nesnd_egypt_dependence_reached:0 "独立性降至0"
 nesnd_egypt_dependence_result:0 "独立性耗尽时，埃及将接受合格投资国的保护。若无人能够承担，或保护关系未能成立，王朝将承担保障落空的政治后果。"
 nesnd_egypt_investor_desc:0 "从仍然存在且独立的签约国中，选择能够承担保护责任的主要投资伙伴，以建设、教育与产业合作换取长期支持。印度的历史投资权益仍受1825年协定保障；其附属于南朝时，不能主持埃及的新投资安排。"
 nesnd_egypt_choose_cost:0 "有效投资承诺每月消耗1独立性。更换投资国不重置独立性或三十年期限。"
 nesnd_egypt_investor_none:0 "不指定投资国"
 nesnd_egypt_investor_none_desc:0 "由埃及自行承担发展的政治责任。"
 nesnd_egypt_none_effect:0 "撤回投资承诺并失去赞助利益。既有外资所有权仍会影响独立性。"
 nesnd_egypt_investor_fra:0 "接受$FRA$投资"
 nesnd_egypt_investor_usm:0 "接受$USM$投资"
 nesnd_egypt_investor_sih:0 "接受$SIH$投资"
 nesnd_egypt_investor_gbr:0 "接受$GBR$投资"
