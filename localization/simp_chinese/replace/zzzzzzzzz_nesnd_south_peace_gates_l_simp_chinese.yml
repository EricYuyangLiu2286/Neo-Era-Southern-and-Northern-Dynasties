 nesnd_south_politics_summary:0 "#bold 宗盟分组#!：大陆#v 50#!、海外#v 30#!、日本#v 20#!；按各组有效代表权重归一。外国援助者不计宗盟票。\n#bold 共同基础#!：财政行政#v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!，政府合作#v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!。合法朱氏君主提供统绪#v 20#!；吴方军务投射提供#v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!。\n#bold 有效盟书#!：拥明#v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!；拥吴#v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!。本国路线已通过连续月度核验#v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#!次；实际履约期另须满#v 12个月#!，条件每周复核。\n和平须本国明确选定路线、政治分至少#v 85#!且领先#v 20#!。明廷须盟书#v 75%#!及两大陆核心签署；吴朝须#v 80%#!、全部拟整合国与日本方面同意、真实海军配员和维护达标。\n$nesnd_south_peace_b1_note$"
