l_simp_chinese:
 # 任务65 第④批：经济线「大食的矿冶」
 nesnd_per_mines_1_journal:0 "大食的矿冶：矿产与木材"
 nesnd_per_mines_1_journal_reason:0 "伊斯法罕和克尔曼的山里埋着金铁，西边的山口出硫磺和铅。马赞德兰的雪松林莽不再有伐木人的声音。先人开过几处矿，大半早已坍塌。\n\n重开矿治，大炼钢铁，将是稳固[ROOT.GetCountry.GetAdjective]的基础。"
 nesnd_per_mines_2_journal:0 "大食的矿冶：煤与钢"
 nesnd_per_mines_2_journal_reason:0 "矿石既已出山，却无煤以炼，无炉以熔，更无铁路将二者聚于一处。倘若伊斯法罕至克尔曼之间能连起一道钢铁的脊梁，大食便不必再仰人鼻息，向外邦求购铁轨与炮管。"
 nesnd_per_mines_3_journal:0 "大食的矿冶：石油与汽车"
 nesnd_per_mines_3_journal_reason:0 "胡齐斯坦与法尔斯的砂土间，黑油自古便汩汩渗出，先民只拿它点灯、填补船缝。而今西洋的新机器嗜油如命，谁握住了油井，谁便扼住了下一个世纪的咽喉。"
 nesnd_per_mines_status_tang:0 "矿山与工坊尽在唐人掌中。"
 nesnd_per_mines_status_persian:0 "巴扎的商贾已在矿山与工坊中分得一席。"
 nesnd_per_mines_status_none:0 ""
 nesnd_per_mines_1_goal_tt:0 "采矿建筑组共#v 20#!级，伐木场#v 15#!级"
 nesnd_per_mines_2_goal_tt:0 "煤矿#v 20#!级、铁矿#v 30#!级、钢铁厂#v 10#!级、铁路#v 20#!级"
 nesnd_per_mines_3_goal_tt:0 "油井#v 30#!级、汽车工业#v 10#!级"
 nesnd_per_mines_1_reward_tt:0 "「$nesnd_per_mines_boom$」#v 10#!年，「$nesnd_per_tension_journal$」不低于#v 70#!时减半。研究炼钢与铁路后开启下一阶段。"
 nesnd_per_mines_2_reward_tt:0 "「$nesnd_per_steel_belt$」#v 10#!年，「$nesnd_per_tension_journal$」不低于#v 70#!时减半。研究抽油机与内燃机后开启下一阶段。"
 nesnd_per_mines_3_reward_tt:0 "「$nesnd_per_gulf_oil$」#v 10#!年，「$nesnd_per_tension_journal$」不低于#v 70#!时减半。"
 nesnd_per_mines_timeout_tt:0 "本阶段没有奖励，下一阶段照常开启。"
 nesnd_per_mines_1_conclusion:0 "沉寂多年的矿洞重新亮起灯火，马赞德兰的林间又响起了斧声。"
 nesnd_per_mines_2_conclusion:0 "伊斯法罕的高炉昼夜不熄，铁轨一程程向克尔曼延伸。"
 nesnd_per_mines_3_conclusion:0 "井架林立于海湾之滨，第一辆汽车驶出了厂门。"
 nesnd_per_mines_timeout_conclusion:0 "二十年转瞬即逝，这一程终究未能走完。"
 nesnd_per_concession_tang_button:0 "唐人专营"
 nesnd_per_concession_tang_button_desc:0 "利不外流，权不旁落。矿山工坊，唯唐人经营。"
 nesnd_per_concession_persian_button:0 "波斯商贾入股"
 nesnd_per_concession_persian_button_desc:0 "巴扎的银子与其压在箱底生怨，不如投进矿井生息。"
 nesnd_per_concession_open_tt:0 "本阶段尚未选定利权"
 nesnd_per_concession_tang_tt:0 "本阶段内获得「$nesnd_per_concession_tang$」（建造 +10%），「$nesnd_per_tension_journal$」每月 #r +0.05#!。"
 nesnd_per_concession_persian_tt:0 "本阶段内「$nesnd_per_tension_journal$」每月 #g −0.05#!，武勋门阀不满。"
 nesnd_per_concession_tang:0 "唐人专营"
 nesnd_per_oil_foreign_button:0 "许给外国资本"
 nesnd_per_oil_foreign_button_desc:0 "洋行出银钱，出机器，我们只需坐地收租。"
 nesnd_per_oil_self_button:0 "自办油田"
 nesnd_per_oil_self_button_desc:0 "宁缓勿失。油井必须握在我们自己手中。"
 nesnd_per_oil_foreign_tt:0 "立即获得 GDP 的#v 10%#!，并获「$nesnd_per_oil_foreign$」#v 10#!年。唐人执政时，「$nesnd_per_tension_journal$」每月 #r +0.05#!，持续#v 10#!年。"
 nesnd_per_oil_self_tt:0 "获得「$nesnd_per_oil_self$」#v 10#!年。唐人执政时，「$nesnd_per_tension_journal$」每月 #g −0.03#!，持续#v 10#!年。"
 nesnd_per_oil_foreign:0 "外国油田特许权"
 nesnd_per_oil_self:0 "自办油田"
 nesnd_per_mines_boom:0 "矿冶初兴"
 nesnd_per_mines_boom_half:0 "矿冶初兴（减半）"
 nesnd_per_steel_belt:0 "伊斯法罕钢铁带"
 nesnd_per_steel_belt_half:0 "伊斯法罕钢铁带（减半）"
 nesnd_per_gulf_oil:0 "海湾油田"
 nesnd_per_gulf_oil_half:0 "海湾油田（减半）"
 nesnd_per_tension_src_ev7:0 "矿工罢工"
 nesnd_per_tension_src_ev8:0 "铁路与油井遭破坏"
 nesnd_per_tension_src_concession:0 "经济利权"
 nesnd_per_tension_src_oil:0 "油田特许权"
 nesnd_per_mines.1.t:0 "井下罢工"
 nesnd_per_mines.1.d:0 "[SCOPE.sState('nesnd_per_mines_state').GetName]的矿工放下了镐头。下井的是波斯人与库尔德人，执账簿的是唐人。一年来工钱分文未涨，坑道却已两度坍落，压在石下的人至今未能尽数挖出。几个带头的矿工如今昼夜有巡兵尾随，矿区的空气里弥漫着火药未燃的气味。"
 nesnd_per_mines.1.f:0 "“地底下是波斯人的骨头，地面上是唐人的账簿。”——矿区墙上的涂写"
 nesnd_per_mines.1.a:0 "几个刁民，拿下便是。"
 nesnd_per_mines.1.a.tt:0 "本[concept_state]#r 10%#!的人口转为[concept_radicals]，「$nesnd_per_tension_journal$」每月 #r +0.04#!，持续#v 36#!个月"
 nesnd_per_mines.1.b:0 "井要修，饷也要加。"
 nesnd_per_mines.1.b.tt:0 "「$nesnd_per_tension_journal$」每月 #g −0.04#!，持续#v 36#!个月"
 nesnd_per_mines.2.t:0 "夜火"
 nesnd_per_mines.2.d:0 "一夜之间，[SCOPE.sState('nesnd_per_mines_state').GetName]的一段铁路与数座井架同时起火。灰烬旁钉着一张字条：“伊朗之物，归于伊朗人。”地方官禀报，左近几个村落人人知道纵火者是谁，却无一人肯开口。"
 nesnd_per_mines.2.f:0 "“他们铺路，是为了把我们的山川一车车运走。”——那张字条的背面"
 nesnd_per_mines.2.a:0 "挨家挨户地搜，总有人会开口。"
 nesnd_per_mines.2.a.tt:0 "本[concept_state]#r 10%#!的人口转为[concept_radicals]，「$nesnd_per_tension_journal$」每月 #r +0.04#!，持续#v 36#!个月"
 nesnd_per_mines.2.b:0 "修好铁路，再请几位本地士绅入股，让他们自己去看守。"
 nesnd_per_mines.2.b.tt:0 "「$nesnd_per_tension_journal$」每月 #g −0.04#!，持续#v 36#!个月"
 nesnd_per_mines.3.t:0 "大食的矿冶"
 nesnd_per_mines.3.d:0 "从马赞德兰的林场到胡齐斯坦的油井，从伊斯法罕的高炉到德黑兰的汽车厂，[ROOT.GetCountry.GetAdjective]用了数十年光阴，将沉睡于地底的财富一一唤醒。如今远道而来的外国人，已不只是为了地毯。"
 nesnd_per_mines.3.f:0 "“马赞德兰的林场、胡齐斯坦的油井、伊斯法罕的高炉与德黑兰的汽车厂，本年均有外国商行前来洽购。”\n——商务部的年度报告"
 nesnd_per_mines.3.a:0 "高原的血脉，终于涌上了地面。"
