l_simp_chinese:
 # 任务65 第④批：经济线「大食的矿冶」
 nesnd_per_mines_1_journal:0 "大食的矿冶：矿产与木材"
 nesnd_per_mines_1_journal_reason:0 "伊斯法罕和克尔曼的山里埋着金铁，西边的山口出硫磺和铅。马赞德兰的雪松林莽不再有伐木人的声音。先人开过几处矿，大半早已坍塌。\n\n重开矿治，大炼钢铁，将是稳固[ROOT.GetCountry.GetAdjective]的基础。"
 nesnd_per_mines_2_journal:0 "大食的矿冶：煤与钢"
 nesnd_per_mines_2_journal_reason:0 "铁有了，还缺煤，缺炉，缺把它们运到一处的铁路。伊斯法罕到克尔曼一线，若能连成一条钢铁带，大食就不必再向外人买铁轨和炮管。"
 nesnd_per_mines_3_journal:0 "大食的矿冶：石油与汽车"
 nesnd_per_mines_3_journal_reason:0 "胡齐斯坦和法尔斯的地下渗出黑油，从前只拿来点灯、补船。如今西洋人的新机器要喝这种油，谁掌握了油井，谁就掌握了下一个世纪。"
 nesnd_per_mines_status_tang:0 "矿场与工坊由唐人一手经营。"
 nesnd_per_mines_status_persian:0 "波斯商贾在矿场和工坊里占了股份。"
 nesnd_per_mines_status_none:0 ""
 nesnd_per_mines_1_goal_tt:0 "采矿建筑组共#v 20#!级，伐木场#v 15#!级"
 nesnd_per_mines_2_goal_tt:0 "煤矿#v 20#!级、铁矿#v 30#!级、钢铁厂#v 10#!级、铁路#v 20#!级"
 nesnd_per_mines_3_goal_tt:0 "油井#v 30#!级、汽车工业#v 10#!级"
 nesnd_per_mines_1_reward_tt:0 "「$nesnd_per_mines_boom$」#v 10#!年；「$nesnd_per_tension_journal$」不低于#v 70#!时减半。下一阶段在研究炼钢与铁路后开启。"
 nesnd_per_mines_2_reward_tt:0 "「$nesnd_per_steel_belt$」#v 10#!年；「$nesnd_per_tension_journal$」不低于#v 70#!时减半。下一阶段在研究抽油机与内燃机后开启。"
 nesnd_per_mines_3_reward_tt:0 "「$nesnd_per_gulf_oil$」#v 10#!年；「$nesnd_per_tension_journal$」不低于#v 70#!时减半。"
 nesnd_per_mines_timeout_tt:0 "本阶段没有奖励，下一阶段照常开启。"
 nesnd_per_mines_1_conclusion:0 "矿山重开，林场伐木的号子又响了起来。"
 nesnd_per_mines_2_conclusion:0 "伊斯法罕的高炉日夜不熄，铁轨一节节铺向克尔曼。"
 nesnd_per_mines_3_conclusion:0 "油井林立，汽车从工厂里开了出来。"
 nesnd_per_mines_timeout_conclusion:0 "二十年过去，这一步终究没有走完。"
 nesnd_per_concession_tang_button:0 "唐人专营"
 nesnd_per_concession_tang_button_desc:0 "矿场和工坊只许唐人经营，钱不外流，官府说了算。"
 nesnd_per_concession_persian_button:0 "波斯商贾入股"
 nesnd_per_concession_persian_button_desc:0 "让巴扎的大商人出钱入股，赚了钱，大家一起分。"
 nesnd_per_concession_open_tt:0 "本阶段尚未选定利权"
 nesnd_per_concession_tang_tt:0 "本阶段内「$nesnd_per_concession_tang$」（建造 +10%）；「$nesnd_per_tension_journal$」每月 #r +0.05#!。"
 nesnd_per_concession_persian_tt:0 "本阶段内「$nesnd_per_tension_journal$」每月 #g −0.05#!；武勋门阀不满。"
 nesnd_per_concession_tang:0 "唐人专营"
 nesnd_per_oil_foreign_button:0 "许给外国资本"
 nesnd_per_oil_foreign_button_desc:0 "外国公司出钱出机器，我们出地，按年收租。"
 nesnd_per_oil_self_button:0 "自办油田"
 nesnd_per_oil_self_button_desc:0 "慢一点，也要把油井握在自己手里。"
 nesnd_per_oil_foreign_tt:0 "立得 GDP 的#v 10%#!；「$nesnd_per_oil_foreign$」#v 10#!年。唐人执政时「$nesnd_per_tension_journal$」每月 #r +0.05#!，持续#v 10#!年。"
 nesnd_per_oil_self_tt:0 "「$nesnd_per_oil_self$」#v 10#!年。唐人执政时「$nesnd_per_tension_journal$」每月 #g −0.03#!，持续#v 10#!年。"
 nesnd_per_oil_foreign:0 "外国油田特许权"
 nesnd_per_oil_self:0 "自办油田"
 nesnd_per_mines_boom:0 "矿冶初兴"
 nesnd_per_mines_boom_half:0 "矿冶初兴（减半）"
 nesnd_per_steel_belt:0 "伊斯法罕钢铁带"
 nesnd_per_steel_belt_half:0 "伊斯法罕钢铁带（减半）"
 nesnd_per_gulf_oil:0 "海湾油田"
 nesnd_per_gulf_oil_half:0 "海湾油田（减半）"
 nesnd_per_tension_src_ev7:0 "矿工罢工"
 nesnd_per_tension_src_ev8:0 "铁路与油井遭破坏"
 nesnd_per_tension_src_concession:0 "经济利权"
 nesnd_per_tension_src_oil:0 "油田特许权"
 nesnd_per_mines.1.t:0 "矿工罢工"
 nesnd_per_mines.1.d:0 "[SCOPE.sState('nesnd_per_mines_state').GetName]的矿工停了工。下井的是波斯人和库尔德人，管账的是唐人；他们说工钱一年没涨，井下却塌了两回。领头的几个人已经被巡兵盯上了。"
 nesnd_per_mines.1.f:0 "“井下的人是波斯人，井上的账是唐人的。”——罢工矿工"
 nesnd_per_mines.1.a:0 "抓几个领头的。"
 nesnd_per_mines.1.a.tt:0 "本州#r 10%#!的人口转为激进；「$nesnd_per_tension_journal$」每月 #r +0.04#!，持续#v 36#!个月"
 nesnd_per_mines.1.b:0 "涨工钱，修井口。"
 nesnd_per_mines.1.b.tt:0 "「$nesnd_per_tension_journal$」每月 #g −0.04#!，持续#v 36#!个月"
 nesnd_per_mines.2.t:0 "夜里的火"
 nesnd_per_mines.2.d:0 "[SCOPE.sState('nesnd_per_mines_state').GetName]的一段铁路和几座油井在夜里起了火。现场留下一张字条，写着“伊朗的东西归伊朗人”。地方官说，附近几个村子的人都知道是谁干的，只是没人肯开口。"
 nesnd_per_mines.2.f:0 "“他们修路，是为了把我们的东西运走。”——字条上的话"
 nesnd_per_mines.2.a:0 "挨村搜查。"
 nesnd_per_mines.2.a.tt:0 "本州#r 10%#!的人口转为激进；「$nesnd_per_tension_journal$」每月 #r +0.04#!，持续#v 36#!个月"
 nesnd_per_mines.2.b:0 "修好了事，再请几位本地士绅入股。"
 nesnd_per_mines.2.b.tt:0 "「$nesnd_per_tension_journal$」每月 #g −0.04#!，持续#v 36#!个月"
 nesnd_per_mines.3.t:0 "大食的矿冶"
 nesnd_per_mines.3.d:0 "从马赞德兰的林场到胡齐斯坦的油井，从伊斯法罕的高炉到德黑兰的汽车厂，[ROOT.GetCountry.GetAdjective]用了几十年，把地下的东西都翻了出来。外国人如今来这里不再只为了买地毯。"
 nesnd_per_mines.3.f:0 "“地毯是祖宗织的，油井是我们打的。”——德黑兰的工程师"
 nesnd_per_mines.3.a:0 "地下的东西，终于见了天日。"
