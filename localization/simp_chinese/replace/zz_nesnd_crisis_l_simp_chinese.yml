 nesnd_land_status_petition:0 "#bold 地方请愿已出现#!：继续清丈，或通过复核申诉降低失序。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 清丈规则与结算#!#!"
 nesnd_land_status_normal:0 "#bold 各省清丈进行中#!：本轮改革已持续#v [ROOT.GetCountry.MakeScope.Var('nesnd_land_months').GetValue|0]#!个月。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 清丈规则与结算#!#!"
 nesnd_land_completion_bar:0 "田籍清理"
 nesnd_land_completion_bar_desc:0 "田籍清理：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_land_disorder_bar:0 "地方失序"
 nesnd_land_disorder_bar_desc:0 "地方失序：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_huguang_preparations_status:0 "完成书院、粮运、老兵集会三项准备，每项#v 30#!点；达到#v 90#!点后获得#v 10年#!地方防卫收益。"
 nesnd_south_status_qin:0 "吴王仍在约束近臣的易代之议，明廷与南府的争论却一日紧过一日。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules 朝争进展#!#!"
 nesnd_south_status_succession:0 "南府已在催促改定帝统，明廷与各省仍在争取自己的主张。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules 朝争进展#!#!"
 nesnd_south_rules:0 "#bold 易代压力#!每月#n +1#!；邦国契约修正生效时每月#n +0.4#!。压力达到#v 100#!且郑钦已去世后进入易代事件。\n#bold 邦国契约#!每次议定增加#p 20#!点，并降低易代压力#p 8#!点，冷却#v 18个月#!。契约达到#v 100#!后保全明朝。"
