 nesnd_refugee_reception:0 "安置南来流亡者"
 nesnd_maritime_security:0 "护航与通商交涉"
 nesnd_japan_reorganization:0 "日本军政整顿"
 nesnd_huguang_preparations:0 "襄阳之后"
 nesnd_huguang_preparations_reason:0 "朱班博整顿湖广时曾修复襄阳工事，召集青年军官任教，又用军工铁件向川蜀换取粮食。伤兵与退伍军人分入后勤、屯垦卫所，留在襄阳的共和派协助总督府改造岳麓书院。二十年间，总督府掌握的军队、田赋与书院渐成一体，朝中又有陈东阳为奥援。时人多以襄阳兵为“新西府”的魁首，南明联邦也不能缺少这根柱石。\n\n然而，曾经极力支持朱班博的郑家如今屡屡指责襄阳拖欠税款、瞒报户籍。石元辅、林汉涵等亲近湖广的南兵高层相继外调，朝中与我们交好的共和派官员也受到排挤。我们必须做好最坏的准备：重新核定屯田兵农丁口，接续上游粮运，并争取书院中即将步入政坛的监生。"
 nesnd_hna_academy_button:0 "整顿联合书院"
 nesnd_hna_academy_button_desc:0 "襄阳的岳麓书院是湖广官员与议政士子的精神中心。院中监生一面读书，一面习议国事，日后须通过礼议院的考试，才能进入南朝政坛。书院自创办以来便以忠于南朝训育诸生，如今南府步步相逼，我们须让教员讲明：把持朝政的郑吴与朱明皇室并非一体。今日在讲席间争取到的士子，或许就是来日同我们共进退的学政。"
 nesnd_hna_supply_button:0 "荆蜀密室之约"
 nesnd_hna_supply_button_desc:0 "抗击牧贼时，湖广的工坊与川蜀的粮船曾共同供养襄阳军民。如今南府与西府的裂痕日深，我们应当重新联络川中旧交，依两省所需组织军工与粮运，启用战时的沿江转运库。奸臣若要发难，襄阳总得有粮有械。"
 nesnd_hna_veterans_button:0 "使老兵集会待命"
 nesnd_hna_veterans_button_desc:0 "朱班博治楚时，楚兵待遇已远优于南朝友军。他又仿照北朝规定退伍年限、组织老兵集会，使受过训练的退伍士兵带领垦丁充实乡里，改善久困于战火的湖广民生。如今各地集会已有根基，老兵既熟悉营伍，也熟悉乡里。召集他们筹办粮食、救济与后勤，战时动员便可有所依凭。"
 nesnd_federal_compact_button:0 "重订国家礼法"
 nesnd_federal_compact_button_desc:0 "新政已使南朝无法退回旧日的藩镇格局，杭州南府也不能再独断国政。各省学政将在礼议院议定任官、赋额、军费与省制，内阁及六部则须依新定礼法施政。我们应先遣使争取西府各省与海外诸邦的支持，使朱姓天子摆脱南府的挟持，依礼法主持国政。"
 nesnd_protect_chen_button:0 "首辅警卫案"
 nesnd_protect_chen_button_desc:0 "陈东阳主持的改制触及士族、旧封君与军官的田产和爵位。东关先生本人虽无所畏惧，朝廷却不能轻视这些敌意。安排专任护卫，并决定是否令他暂留官署、清查内应，以保全继续推动新政的力量。\n\n警卫任期#v 六个月#!。未设专卫时，本案死亡、负伤、脱险的概率为#v 40／25／35#!；详细经费与续办办法见警卫议案。"
 nesnd_crisis.10.a:0 "以法建国，国家堪成！"
 nesnd_crisis.10.t:0 "《诸省、大营布政以礼法行事疏》通过"
 nesnd_crisis.10.d:0 "各省学政在礼议院支持新法，任官、田赋与军费条陈由此写入南明的国家礼法。明廷保全了朱氏统绪，中央与各省的权责也有了共同认可的依据。\n\n陈东阳重设行省布政司时，南朝已能够统一调度军政，却没有一并解决旧封君的名位与地方权力。南、西两府面临北朝南下，曾以共同的军队压服不从。如今，因战事而暂且搁置的争执终于有了法定的处置办法。"
 nesnd_crisis.11.a:0 "公布案情，循线查办。"
 nesnd_crisis.11.b:0 "密查严查，一查到底！"
 nesnd_crisis.11.t:0 "首辅门外"
 nesnd_crisis.11.d:0 "首辅护卫查获了一封伪造的换防手令。携信者与同伙很快被锦衣卫、大理寺捕获，分别收押；陈东阳先被送往安全之地，待案犯落网才返回住处。\n\n调查随后牵出经办军需、海运的官员，以及同他们往来的各省名绅与旧封君。大理寺主张公开案情，借此追究藏在官场中的关系；锦衣卫则坚持封锁消息，以免惊动尚未落网的人。内阁须决定如何继续查办，也须承担事情扩大后的政治后果。"
 nesnd_crisis.20.a:0 "先整顿国内。"
 nesnd_crisis.20.b:0 "接济湖广军需。"
 nesnd_crisis.20.c:0 "联络襄樊大营，准备南下。"
 nesnd_crisis.20.t:0 "伪朝禅代"
 nesnd_crisis.20.d:0 "倭吴叛明称制的消息传来，江北大臣纷纷弹冠相庆。更有人提起牧家天子当年御辇南下的盛举。伪吴与西府诸省决裂互斗，若无暇北顾，南征统一或可一举成功。\n\n边将已经请求拨饷，并派人联络湖广的“有识之士”。然而，我朝也远非太平兴国之世。国内政务仍须军队与财力维持，地权改革若尚未完成，更难兼顾南征。此时卷入南朝的混战，究竟能为帝国赢得什么？"
 nesnd_crisis.21.a:0 "保障通商，维持往来。"
 nesnd_crisis.21.b:0 "接纳南来之人。"
 nesnd_crisis.21.c:0 "向反吴诸省提供军需。"
 nesnd_crisis.21.t:0 "南方的来客"
 nesnd_crisis.21.d:0 "郑氏的舰队、商馆与属地，将南朝战争的消息带到了远方。各港商人担心货物遭到扣押，交战各方的使者则要求承认自己的政府，并为军需和借款寻求援助。\n\n[ROOT.GetCountry.GetName]在这些往来中有自己的利益。维持通商，需要与实际控制港口和航线的势力交涉；收容流亡者、接济反吴军队，也将使南朝的新旧政治力量同我国发生更深的联系。"
 nesnd_crisis.40.a:0 "分案审理，留用地方人才。"
 nesnd_crisis.40.b:0 "清查旧党，重定军政。"
 nesnd_crisis.40.t:0 "经始新朝"
 nesnd_crisis.40.d:0 "战事平定以后，地方军政陆续归入吴朝统辖。新朝须面对的已是怎样施政：被战争打断的生产与通商要恢复，各省百姓仍须生活，曾经反对郑氏的官员与士人也不会随战败一同消失。\n\n南府多年积累的军财足以支持重建。我们可以分案审理抵抗者，留用熟悉地方的人才；也可以借胜利清查旧党，使军队成为新秩序的支柱。无论如何处置，天下将从这些政令中认识郑氏自己的朝廷。"
 nesnd_crisis.41.a:0 "整顿军政，颁行新章。"
 nesnd_crisis.41.b:0 "依旧例酬赏诸军。"
 nesnd_crisis.41.t:0 "回到海峡这一边"
 nesnd_crisis.41.d:0 "参战军队陆续归国。地方领主要求兑现出兵时的许诺，港口商人催促恢复航运，中央也须重新安排驻军与征收。\n\n大陆战争使[ROOT.GetCountry.GetName]有了整理军政的机会。统一地方征收、训练官员，可以扩大中央的施政能力；先行酬赏军功，则能稳住此次出征所倚重的将领与领主。"
 flavorCNE.6.d:0 "[SCOPE.sState('cne_land_reform_mess_imprisonment_state').GetName]的清丈官员拘捕了一批代写田契诉状的乡民，将他们以串通隐产的罪名交由驻军看押。军官随即扩大搜捕，地方士绅、乡校教员与整理旧契的书吏都被带入营中。\n\n新法赋予官员清理田产的权力，也准许农户为自己的产业提出申诉。囚犯的家属带着田契到省城求告，省督将案情报请刑部查办。负责清丈的官员却以军民勾连、恐生变乱为由，请兵部保护承办军官。若只把涉事官吏调离，营中的追捕便可轻轻揭过；若要追究，清丈官也须为奉行新法时犯下的罪行负责。"
 flavorCNE.7.d:0 "[SCOPE.sState('cne_land_reform_industrialists_support_state').GetName]的厂主与商人联名呈请，愿意为土地改革垫付一笔款项。工坊正在扩建，商路上的货车日渐增多；他们希望新法能够准许农户自由迁居，将更多劳动力带入城镇。\n\n商人的代表还请求通过咨议局提出土地、道路与雇工契约方面的建议。省督愿意接纳这笔资助，户部官员则认为，这些人有财力，也熟悉实业，可以让他们更多参与政府事务。这批新兴的产业家，希望在帝国政府中取得与其财富相称的位置。"
 flavorCNE.8.d:0 "[SCOPE.sState('cne_land_reform_peasants_in_city_state').GetName]的街巷里住进了许多来自乡间的新客。农户卖去田产，带着家人寻找工钱；招工的牙行将他们送往厂房和工地，又从每一份工资中扣取引荐与食宿的费用。\n\n一批工人向官府告发牙行私扣契约、追索旧债。厂主担心查办牙行将妨碍招工，地方士绅也替这些与乡党往来密切的经纪说情。省督须决定，是责令官署查办这些束缚雇工的行会，还是将争端仍作普通民事案件处置。农民离开旧田庄以后能否自由谋生，正在这些新生的城镇中受到考验。"
 flavorCNE.3.d:0 "我们完善的土地法案、雇工法案、民法家庭相关条文已被推行至帝国的每一个角落，建起来一个崭新的经济秩序。在这一秩序中，我们解放了被血亲家族束缚了数千年的人们。高高的田垄回归了它自然资源的本来面目。\n\n随着旧宗族和土地不再能锁住农民，无数稚嫩、满是灰土却充满朝气的脸孔源源不断地从郊野涌入城市。他们憧憬新的生活。一种用人类的智慧和科学力量构建的生活。许多血缘的余孽用各种各样的地方团体伪装自己，试图重新夺回对这些人的控制。但巡捕的警棍和判官的惊堂木终会粉碎他们的野心。\n\n我们又一次将开国帝牧仲棠的理想照进现实。我们证明了这个帝国是为了华夏民族之利益而构建。为此，它将保护哪怕最细小无助者自由选择自己命运的权力——他们如今在城市中追求幸福，给帝国带来新的繁荣。"
 nesnd_early_accession:0 "提前推动易代"
 nesnd_early_accession_desc:0 "南府已经掌握南朝兵财。召集支持郑氏的臣僚，向明廷提出禅位之请，并要求各省与海外诸邦表明立场。"
 ce_usm_conflicts_within_reason:0 "明朝朱姓，还是吴国郑氏？这对于中国南朝有能力参预政治的国人来说，是一个每分每秒都要自问的难题。从川边乡校的讲习台到南京礼部的议会殿。争论、札子、散文、报道，各式各样体裁的文字都在对人们呼喊。却是问多于答，争大于论。"
 flavorUSM.4.1:0 "尧舜禅让，汤武革命。中国天命所衷不在一家一姓，上下分隔，而在于民有德，于人有功。"
 flavorUSM.4.t:0 "吴明易代，郑昭宋聋"
 flavorUSM.4.d:0 "西元1678年春，时为北明吴国公的大明南京留守使、南京礼部尚书的（吴武宗）郑昭在他在海内外的一系列军事胜利后，单方面向朝廷上书，准备进京觐见大明天子。当是时，在三十年前的大宪战争中大获全胜的天津燕主及其国势还如烈火烹油。堪称北明战国末期的天下之雄。但郑氏的执拗战胜了朝臣的规劝和敌人的威胁。终于在同年六月成行。\n\n这次觐见是一场北明从藩镇时期到诸侯时期近三百年来都未有人见过的盛大巡游。虽然吴国主在燕、秦、齐等势力的胁迫下，最终只带了5000卫士和一些官员随行。但在这队伍中包罗了吴国海陆军事力量在那个时代的全部精锐，南洋的海兵、倭国的刀牌手、女真掷弹兵的早期营队，甚至还包括一个由“极东殷人”流亡贵族组成的，向中国皇帝伸冤借兵的队伍。并携带着吴人在这个地球上纵横百年来所获得无数珍宝，以及又用了近万名民夫运送的安南、高棉贡米。与之相对的，则是在藩镇节度使制度下被小规模械斗和转运使卡要下，四时常乱，在饥荒边缘长久徘徊的中原。\n\n在郑昭的觐见使团归来后。他当即改其称号为”至尊“，吴国随即见证了一个南北流民向自己及殖民地不断涌入的快速发展时期。而在那之后，郑昭及其继承者也开始以更加严苛的力度推进集权主义的“专权变法”及土地商品化改革。并最终稳固了我们作为南朝尊主，总领万国的基业。吴人前进的脚步从未停下，直至今天......"
 flavorUSM.6.t:0 "首辅身后"
 flavorUSM.6.d:0 "陈东阳已经去世。南朝共和派失去了主持改制的领袖，内阁及六部也须重新分派他留下的职权。各省学政还在礼议院争论新政的前途，南府却已开始争取那些失去领袖的官员。"
 usm_civilwar.1.d:0 "郑氏已提出易代，要求各省与海外诸邦奉吴正朔。南府所掌军财使这项主张有了力量，朱氏数百年的帝统却仍有追随者；礼议院与内阁中未能平息的争执，终于传到了地方。\n\n[ROOT.GetCountry.GetName]须就此作答。承认吴朝，便接受郑氏以新礼法主持中央；举兵奉明，则须联络同道，准备抵抗南府军队。也有人主张趁此脱离原有隶属，由本国自行主持政务。"
 usm_civilwar.1.1:0 "奉明正朔，联络各省！"
 usm_civilwar.1.2:0 "本国自理国政。"
 usm_civilwar.1.3:0 "上表劝进，奉吴正朔。"
 usm_civilwar.2.1:0 "筹饷、调兵，以实力兑现新朝的命令。"
 usm_civilwar.2.2:0 "奉明正朔，联合反吴。"
 usm_civilwar.2.3:0 "联合反吴，但胜利之后要由国人议政。"
 usm_civilwar.2.4:0 "依此前承诺，处理大陆战局。"
 usm_civilwar.2.5:0 "观察战局，履行已经作出的承诺。"
 usm_civilwar.2.t:0 "第二次靖难战争"
 usm_civilwar.2.d:0 "反对易代的檄文已经传开。吴朝调集中央军，要求地方承认郑氏统治；奉明各省则联络营伍，筹措共同作战的兵力与粮饷。曾共同抵御北朝的南府与西府，如今终于兵戎相见。\n\n江海商路将承载军队，也会因战争而受阻。海外属邦、邻国与远方的商人都须重新决定自己的去向。无论哪一方获胜，战后的政府都要面对参战者为其流血所提出的要求。"
 usm_civilwar.3.1:0 "开始治理这个新朝。"
 usm_civilwar.3.t:0 "易代未起兵戈"
 usm_civilwar.3.d:0 "地方的反对尚未汇成共同举兵的联盟。仍然归顺的各省与海外诸邦承认郑氏的新名位，另有一些地方退出了原有隶属。南府得以继续主持中央，却不能因此把所有人的沉默都当作拥戴。\n\n新朝须按礼法任官施政，也须凭现有军财维护自己的统治。那些尚未解决的地方关系，将由往后的建设、交涉与争端逐渐决定。"
 usm_civilwar.10.1:0 "奉还政权，恢复朱姓王室。"
 usm_civilwar.10.2:0 "保留明号，由我们的政府主持国政。"
 usm_civilwar.10.3:0 "由国人议政，不再另立天子。"
 usm_civilwar.10.t:0 "胜利之后的名分"
 usm_civilwar.10.d:0 "联军已经击败吴朝的中央军。奉明的旗号曾使西府诸省与各方同道一同作战，如今胜利者却须回答另一件事：南京的中央政府将由谁主持？\n\n朱氏宗室仍有重返帝位的主张，获胜的地方领袖也不愿轻易交出军政大权。共和派则希望把并肩作战的国人带入新的议政制度。战时共同反吴的联盟能否容纳这些主张，将决定南朝此后的国制。"
 usm_civilwar.12.t:0 "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting]坚持独立"
 usm_civilwar.12.d:0 "[SCOPE.sCountry('usm_mister_rebel').GetName]的代表递交了独立声明，要求以本国政府的名义处理战后的军队、财政与外交。他们曾同联军一道作战，如今准备保有自己的国政。"
 usm_civilwar.13.t:0 "[SCOPE.sCountry('usm_mister_rebel').GetNameNoFormatting]宣誓效忠"
 usm_civilwar.13.d:0 "[SCOPE.sCountry('usm_mister_rebel').GetName]已遣使宣誓效忠，承认新中央的统辖。战时并肩作战的关系由此转为君臣名分，地方军政也将按重新议定的关系办理。"
 usm_civilwar.23.1:0 "支持吴朝，要求战后归还其所持九州。"
 usm_civilwar.23.2:0 "联合反吴各省，以战果争取九州。"
 usm_civilwar.23.3:0 "维持中立，不作军事承诺。"
 usm_civilwar.23.t:0 "海峡两岸的盟约"
 usm_civilwar.23.d:0 "南朝内战使九州重新成为日本朝野关注的焦点。郑氏在当地经营的港口、商路与驻军，关系着吴朝的海上力量，也牵动着日本领主和商人的利益。\n\n吴朝与反吴诸省都在争取日本出兵，并以战后交还郑氏所持九州为条件。支援哪一方，将决定日本军队渡海后的敌友，以及战后向谁索取出兵的报偿。"
 ce_usm_cw_japanese_interest_reason:0 "郑氏在九州的据点，是吴国海上事业的一部分，也长期牵动日本诸家的利害。如今南朝内战，各方使者相继渡海，请日本提供兵船与军需。朝廷有机会借此次战争收回九州的吴国领地，并重新安排海峡两岸的关系。"
 nesnd_land_status_admin:0 "#n 行政不足#!：[concept_bureaucracy]为负，清丈基础进度停止，每月额外增加失序。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 清丈规则与结算#!#!"
