l_simp_chinese:
 je_forest_of_bayonets_reason: "在[Glossary('glossary_nesnd_settlement_of_1829','1829年的和议')]上，[GetGeographicRegion('geographic_region_europe').GetName]列强就东欧的疆界达成了妥协。对于臣民应当享有哪些政治权利，三代波拿巴皇帝却各有主张。拿破仑一世曾在欧洲推行“反激进派恐怖”。约瑟夫继位后废止了这项政策，并准许流亡贵族回国。1832年，拿破仑三世任命归国的奥尔良公爵路易－腓力为外交大臣。公爵虽已入阁，他的追随者在巴黎的沙龙与报刊上谈及扩大选举权，措辞仍很谨慎。\n\n然而，在重重压力之下，自由、平等、博爱的梦想并未死去。[Concept('concept_revolution', '$concept_revolutionary|q$')]力量仍致力于推翻会议秩序，而贫困且被剥夺权利的劳动阶级的怨恨，已在每个欧洲首都制造出社会爆发的威胁。只要有足够的火星，整个欧洲都可能陷入烈焰。\n\n@warning!如果[Concept('concept_revolution', '$concept_revolutionary|q$')]活动达到临界规模，脆弱的会议秩序将爆发为一场#b 革命之春#!"
 je_springtime_of_the_peoples_reason: "争取民权的斗争已从报刊延及街垒，[GetIdeology('ideology_radical').GetName]的主张在#b 欧洲#!各地得到响应。自由革命者高举三色旗，高呼自由、平等、博爱。\n\n#b 到街垒去！：#!\n如果在我们的[Concept('concept_capital_state','$concept_capital_state_short|q$')]存在[Concept('concept_insurrection', '$concept_insurrectionary|q$')]#tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_movements_list_tt 自由主义#!或#tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt 社会主义#![concept_political_movement]，并且此[concept_journal_entry]已激活，革命力量会尝试夺取国家的权力。"
 glossary_nesnd_settlement_of_1829: "$treaty_name_kra_fra_relationship$"
 glossary_nesnd_settlement_of_1829_desc: "1829年，为应对明国局势的变化，欧洲列强同意以克拉科夫为治所，保留一个半独立的波兰政权。华沙及其他波兰人聚居地仍由邻国管辖。"
