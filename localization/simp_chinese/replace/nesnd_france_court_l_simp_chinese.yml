l_simp_chinese:
 je_nesnd_france_court: "[ROOT.GetCountry.GetCustom('nesnd_court_government_title')]"
 je_nesnd_france_court_reason: "[ROOT.GetCountry.GetCustom('nesnd_court_government_reason')]"
 je_nesnd_france_court_concluded: "巴黎与外省的公共工程"
 nesnd_court_royal_title: "宫廷与外省"
 nesnd_court_republic_title: "共和国的公共工程"
 nesnd_court_royal_reason: "巴黎市政厅已呈交新码头的图样。外省商会的代表等了三天，才有机会向大臣陈述本地厂主的困难。他列出一船煤运抵巴黎和运抵本省工厂的两笔费用，请宫廷在议定工程拨款时考虑外省工业的运输负担。"
 nesnd_court_republic_reason: "公共工程部的书吏把卷宗上印着王冠的封面换了下来。承包商倒很少理会这些变动，他们拿来的仍是上届政府签过的图纸，末页还留着验收的日子。如今要回答巴黎市政厅和外省商会来信的，轮到共和国了。"
 nesnd_court_activation: "帝位继承已定，法国由波旁或奥尔良家族执政；摄政期间以储君的家族为准。"
 nesnd_court_no_paris: "法国已失去法兰西岛。公共工程政策暂停，五年评议日期照旧。"
 nesnd_court_no_towns: "法属本土暂无都市中心，无法计算巴黎份额。"
 nesnd_court_counts: "法兰西岛都市 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_court_paris_levels')|0]#! 级，法属本土合计 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_court_total_levels')|0]#! 级（含科西嘉）。"
 nesnd_court_opened: "选定现行政策时，巴黎占本土都市 #v [ROOT.GetCountry.MakeScope.Var('nesnd_court_opening_share').GetValue|1]%#!。"
 nesnd_court_status_choose: "尚未确定工程重点。$nesnd_court_counts$\n$nesnd_court_review_rules$"
 nesnd_court_status_paris: "工程重点在巴黎。$nesnd_court_counts$\n$nesnd_court_opened$\n$nesnd_court_review_rules$"
 nesnd_court_status_provinces: "工程重点在外省。$nesnd_court_counts$\n$nesnd_court_opened$\n$nesnd_court_review_rules$"
 nesnd_court_review_rules: "五年期满，只比较现行政策下疆界未变的法属本土州。重点地区都市净增 #v 1#! 级可获 #g 5#! 威望，若其都市份额同时提高至少 #v 1#! 个百分点，可获 #g 10#! 威望。两档均持续 #v 24#! 个月。"
 nesnd_court_wait: "距上次选定工程重点已满十二个月"
 nesnd_court_requires_paris: "法国持有法兰西岛的土地"
 nesnd_court_requires_towns: "法属本土至少有一级都市中心"
 nesnd_court_requires_provinces: "法国持有巴黎以外的本土州"
 nesnd_court_paris_available: "巴黎尚未列为工程重点"
 nesnd_court_provinces_available: "外省尚未列为工程重点"
 nesnd_court_share_name: "巴黎都市份额"
 nesnd_court_share_desc: "巴黎 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
 nesnd_court_choose_paris: "发展巴黎"
 nesnd_court_choose_paris_desc: "塞纳河两岸还有多少货车在等一个卸货的地方？"
 nesnd_court_choose_provinces: "发展外省"
 nesnd_court_choose_provinces_desc: "给厂主一条进煤的路，他就能在家乡招工。"
 nesnd_court_change_tt: "以今日起的都市等级评议新政策。#v 12#! 个月后可改换重点，原评议日期照旧。"
 nesnd_court_paris_policy_tt: "法兰西岛人口提供的基础设施 #g +20%#!。$nesnd_court_change_tt$"
 nesnd_court_provinces_policy_tt: "法兰西岛移民吸引力 #r −15%#!。其余法属本土州移民吸引力 #g +15%#!、建造效率 #g +10%#!。$nesnd_court_change_tt$"
 nesnd_court_closed: "原定公共工程议程终止。"
 nesnd_court_review_header: "公共工程五年评议"
 nesnd_court_review_effect: "核对都市增长并结清本期工程"
 nesnd_court_paris_works: "塞纳河工务"
 nesnd_court_paris_outflow: "外省招工"
 nesnd_court_provincial_works: "外省兴工"
 nesnd_court_reported_growth: "工程见效"
 nesnd_court_marked_growth: "工务声誉"
 nesnd_france_court.1.t: "五年总账"
 nesnd_france_court.1.marked: "审计员复核了本期拨款前后的两份账册。在疆界未变的法国本土各州中，获拨款地区的城镇规模有所增长，所占份额也有提高。公共工程部长将这份核算结果交给报馆刊布。\n\n法国获得 #g 10#! 威望，持续 #v 24#! 个月。"
 nesnd_france_court.1.growth: "各地呈报的账册显示，本期获得工程拨款的地区已有新的都市街区。公共工程部长在议事厅宣读了审计结果，说明五年前议定的工程已有成效。\n\n法国获得 #g 5#! 威望，持续 #v 24#! 个月。"
 nesnd_france_court.1.flat: "书记把上次拨款时的册子取来，摊在新账旁边。重点地区的都市合计仍未超过旧数。前来听取报告的商会代表在席间问了一句：五年前开工时剪下的那条缎带，部里还留着么？"
 nesnd_france_court.1.missing: "核账的日子到了。审计员要的是同一批城镇在拨款前后的两栏数目，案卷里凑不出这样一张表。他把缘由写进呈文，签了名，将本期卷宗送还公共工程部。"
 nesnd_france_court.1.paris: "核算地区：巴黎。$nesnd_court_figures$"
 nesnd_france_court.1.provinces: "核算地区：外省。$nesnd_court_figures$"
 nesnd_court_figures: "在本期疆界未变的本土州中，核算地区的都市等级期初为 #v [SCOPE.GetValue('nesnd_court_before')|0]#! 级，期末为 #v [SCOPE.GetValue('nesnd_court_after')|0]#! 级，占上述各州都市总等级的份额由 #v [SCOPE.GetValue('nesnd_court_share_before')|2]%#! 变为 #v [SCOPE.GetValue('nesnd_court_share_after')|2]%#!。"
 nesnd_france_court.1.unfiled: "本期无可比账目。"
 nesnd_france_court.1.a: "准予刊布。"
