l_simp_chinese:
 Xinghua:0 "兴华"

 nesnd_sih_jingnan.1.t:0 "成都的去从"
 nesnd_sih_jingnan.1.d:0 "靖难战事转向不利，藩府必须决定由谁来主持战局。\n\n蜀王刘忠明身边的守旧派开始商量向吴廷请降，以求保住成都一州。老将萧虎力仍掌握着防北的营伍，主张凭关隘固守。青年军官多拥护魏鉴，他们认为请降就是出卖起义，要求由魏鉴接掌藩府。"
 nesnd_sih_jingnan.1.a:0 "仍由蜀王与萧虎力主持。"
 nesnd_sih_jingnan.1.a_tt:0 "蜀王刘忠明与萧虎力继续执政。藩府随后要决定是否向吴廷请降。"
 nesnd_sih_jingnan.1.b:0 "支持魏鉴接掌藩府。"
 nesnd_sih_jingnan.wei_seizes_tt:0 "原蜀王携家眷和若干守旧派连夜乘船逃出成都，流亡在外。魏鉴即蜀王位，接掌藩府。"
 nesnd_sih_jingnan.rally_tt:0 "#v 6#! 个月内，首都失守或大半国土被占都不会使本国覆亡。\n成都若被占领，立即收复，否则收复另一个被占领的州。在收复的州新编 #v 20#! 营正规线列步兵，没有可收复的州时编在成都。"

 nesnd_sih_jingnan.2.t:0 "请降之议"
 nesnd_sih_jingnan.2.d:0 "蜀王召集藩府商议。守旧派提出的条件是：成都以外的州县全部交给[SCOPE.sCountry('nesnd_sih_wu').GetName]，蜀国保留成都，向[SCOPE.sCountry('nesnd_sih_wu').GetName]称臣。\n\n萧虎力反对请降，主张继续凭关隘固守。"
 nesnd_sih_jingnan.2.a:0 "向吴廷请降。"
 nesnd_sih_jingnan.surrender_tt:0 "成都以外，本国所有州交给[SCOPE.sCountry('nesnd_sih_wu').GetName]，并立即成为其#bold 已整合#!州。\n本国成为[SCOPE.sCountry('nesnd_sih_wu').GetName]的自治领，退出反吴一方。\n魏鉴、萧虎力、萧兴华各自有 #v 65%#! 的可能出逃，#r 30%#! 的可能被杀，#v 5%#! 的可能随同归降。"
 nesnd_sih_jingnan.2.b:0 "由萧虎力继续作战。"

 nesnd_sih_jingnan.3.t:0 "降后诸将"
 nesnd_sih_jingnan.3.d:0 "蜀国已向[SCOPE.sCountry('nesnd_sih_wu').GetName]称臣，成都以外的州县都已移交。起义诸将的下落陆续传回成都。"
 nesnd_sih_jingnan.3.a:0 "收拾残局。"
 nesnd_sih_jingnan.3.wei_jian_fled:0 "魏鉴出逃，流亡在外。"
 nesnd_sih_jingnan.3.wei_jian_killed:0 "魏鉴被杀。"
 nesnd_sih_jingnan.3.wei_jian_stayed:0 "魏鉴随同归降，留在成都。"
 nesnd_sih_jingnan.3.xiao_huli_fled:0 "萧虎力出逃，流亡在外。"
 nesnd_sih_jingnan.3.xiao_huli_killed:0 "萧虎力被杀。"
 nesnd_sih_jingnan.3.xiao_huli_stayed:0 "萧虎力随同归降，留在成都。"
 nesnd_sih_jingnan.3.xiao_xinghua_fled:0 "萧兴华出逃，流亡在外。"
 nesnd_sih_jingnan.3.xiao_xinghua_killed:0 "萧兴华被杀。"
 nesnd_sih_jingnan.3.xiao_xinghua_stayed:0 "萧兴华随同归降，留在成都。"

 nesnd_sih_jingnan.4.t:0 "借兵自立"
 nesnd_sih_jingnan.4.d:0 "蜀国此前已向[SCOPE.sCountry('nesnd_sih_patron').GetName]称臣。靖难战事转向不利，魏鉴借助宗主国的支持发动兵变，夺取了藩府。"
 nesnd_sih_jingnan.4.a:0 "魏鉴即位。"

 nesnd_sih_jingnan.10.t:0 "新朝的藩属"
 nesnd_sih_jingnan.10.d:0 "蜀军攻入南京，吴廷覆亡，[SCOPE.sCountry('nesnd_han_overlord').GetName]就此建立。我国原先是吴廷的藩属，如今宗主换了国号和君主。\n\n朝中有人主张照旧称臣，也有人主张趁新朝立足未稳，脱离宗藩关系。"
 nesnd_sih_jingnan.10.a:0 "照旧称臣。"
 nesnd_sih_jingnan.10.a_tt:0 "本国继续作为[SCOPE.sCountry('nesnd_han_overlord').GetName]的附属国。"
 nesnd_sih_jingnan.10.b:0 "脱离宗藩关系。"

 nesnd_sih_jingnan.20.t:0 "南方一统"
 nesnd_sih_jingnan.20.d:0 "原属明廷及蜀、楚、淮三藩的二十六州，如今都已归入[ROOT.GetCountry.GetName]或其藩属。靖难以来南方的分裂到此结束。"
 nesnd_sih_jingnan.20.a:0 "南方已定。"

 nesnd_sih_xiao_holds:0 "萧虎力固守"
 nesnd_sih_wei_rules:0 "魏鉴执政"
 nesnd_south_unified:0 "南方一统"

 nesnd_postwar_great_han_wei_option:0 "推魏鉴即位，建号大汉。"
 nesnd_postwar_great_han_wei_tt:0 "更改国号为大汉，由魏鉴即皇帝位。刘忠明若仍在朝中，将死于一场“意外”。"
 nesnd_great_han_mutual_claims_tt:0 "我们与[SCOPE.sCountry('usm_rebel_winner').GetName]互相宣称对方的全部领土。"

 nesnd_unify_south:0 "统一南方"
 nesnd_unify_south_reason:0 "靖难战争已经结束，原属明廷及蜀、楚、淮三藩的二十六州仍分属不同的政权。只有本国或藩属据有全部二十六州，南方才算重归一统。"
 nesnd_unify_south_goal_tt:0 "本国及附属国完整拥有全部 #v 26#! 个目标州（台湾在内，东京与海外诸州不计）"
 nesnd_unify_south_reward_tt:0 "#v 15#! 年内权威 #g +20%#!，威望 #g +20%#!，行政力 #g +15%#!，荒废衰减 #g +50%#!。"
 nesnd_unify_south_bar:0 "南方诸州"
 nesnd_unify_south_bar_readout:0 "$nesnd_unify_south_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 26#!"
 nesnd_unify_south_bar_change:0 "据有州数增减"

 nesnd_restore_ming:0 "重建大明"
 nesnd_restore_ming_desc:0 "靖难之后，南方已没有明廷。本国据有南京或南方大片州县，可以迎立朱氏宗室，号召拥明各国重建大明。"
 nesnd_restore_ming_tt:0 "本国成为明廷行在，成立大明联邦。迎立在世的朱氏宗室，其余拥明国家或称臣，或拒绝。"
 nesnd_restore_ming_no_court_tt:0 "当前没有其他明廷"
 nesnd_restore_ming_no_wu_tt:0 "吴廷已不复存在"
 nesnd_restore_ming_stalemate_tt:0 "靖难已经结束，南方二十六州尚未统一"
 nesnd_restore_ming_core_tt:0 "完整拥有南京，或在南方二十六州中至少 #v 8#! 州拥有领土"
