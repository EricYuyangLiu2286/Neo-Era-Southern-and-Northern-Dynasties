 ig_soldier_officials_desc: "曾经的秦国是军士和兵士组成的半代议制君主制军国，但近代化的政治已经不允许土地所有者垄断军队。因此，兵士阶层灭亡了，只剩下作为精英的军士。"
 ig_qin_aristocrats_desc: "秦国的贵族，是大土地所有者和有功军人、旧贵族的联盟。"
 ig_ce_mongol_landowners_desc: "蒙古的游牧部落仍有贵族，作为有组织游牧国家的基层治理人员而存在，代替其他更原始部落的酋长和族长。他们的血统甚至可以追溯到成吉思汗时代的勇士。"
 ig_ce_mongol_warboss_desc: "能在严酷的环境和长期的内外摩擦中保住权力的蒙古贵族万里挑一。他们的支持代表了蒙古族群的古老传统。"
 ig_ce_native_landowners_desc: "受到东洲各族移民影响而组织起来的原住民贵族。其中大部分都是曾受雇于东洲的佣兵头领后裔。"
 ig_ce_native_warboss_desc: "能在严酷的环境和长期的内外摩擦中保住权力的原住民贵族万里挑一。他们的支持代表了原住民族群的古老传统。"
 ig_cne_xungui_desc: "中华帝国基本上是秦制帝国理想状态的进步版本，支持牧子帝业的军官团们居功甚伟，因此也获得了应得的权力和土地。"
 ig_xibei_literati_desc: "西秦大革命后，北方的学士们不同于传统的文人士绅，而是在科学和政治上都讲求实际的一群人。"
 
