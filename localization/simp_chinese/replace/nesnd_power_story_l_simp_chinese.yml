 nesnd_usm_court_pressure_subtract_4_tt:0 "$nesnd_south_pressure_bar$ #g -4#!"
 nesnd_usm_court.1.t:0 "礼议院的帝统之辩"
 nesnd_usm_court.1.d:0 "[ROOT.GetCountry.GetNameNoFlag]的礼议院就帝统应归朱姓还是郑氏再起争论。内阁可以压下这项议题，也可以任由议员公开辩论。"
 nesnd_usm_court.1.f:0 "“帝统当归朱姓抑或郑氏，请交礼议院公议。”\n——议员的提案"
 nesnd_usm_court.1.a:0 "由内阁压下议题"
 nesnd_usm_court.1.b:0 "准许公开辩论"
 nesnd_usm_court.2.t:0 "郑氏门下的荐书"
 nesnd_usm_court.2.d:0 "郑氏一系呈上荐书，请将门下官员补入六部要职。"
 nesnd_usm_court.2.f:0 "“谨荐下列诸人，补六部要职。”\n——郑氏的荐书"
 nesnd_usm_court.2.a:0 "照荐任用"
 nesnd_usm_court.2.b:0 "交内阁复议"
 nesnd_usm_court.3.t:0 "各省的札子"
 nesnd_usm_court.3.d:0 "各省士绅接连呈递札子，陈述对帝统之争的看法。内阁可以转呈礼议院，也可以留中不发。"
 nesnd_usm_court.3.f:0 "“本省士绅谨陈帝统之议，伏请转呈礼议院。”\n——一省士绅的札子"
 nesnd_usm_court.3.a:0 "转呈礼议院"
 nesnd_usm_court.3.b:0 "留中不发"
 nesnd_fra_court.1.t:0 "皇帝的近臣"
 nesnd_fra_court.1.d:0 "[SCOPE.sCharacter('nesnd_fra_court_ruler').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_fra_court_ruler').GetFullName]的几位近臣深得信任，各部的公文常常先经他们的手。大臣们抱怨绕不过这道门。"
 nesnd_fra_court.1.f:0 "“各部公文须经皇帝近臣之手方能呈递，本部无从直达。”\n——一位大臣的申诉"
 nesnd_fra_court.1.a:0 "倚重近臣"
 nesnd_fra_court.1.b:0 "疏远近臣"
 nesnd_fra_court.2.t:0 "宫廷与内阁之争"
 nesnd_fra_court.2.d:0 "宫廷内务府与内阁为一笔开支归谁支配争执不下，双方都要[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]裁决。"
 nesnd_fra_court.2.f:0 "“此项开支，宫廷内务府与内阁各执一词，恳请陛下裁决。”\n——呈陛下的请示"
 nesnd_fra_court.2.a:0 "支持宫廷"
 nesnd_fra_court.2.b:0 "支持内阁"
 nesnd_fra_court.3.t:0 "皇室开支"
 nesnd_fra_court.3.d:0 "[ROOT.GetCountry.GetNameNoFlag]的皇室开支连年超支。国务会议要求削减，皇室则希望追加拨款。"
 nesnd_fra_court.3.f:0 "“皇室开支连年超支，本会议请求削减。”\n——国务会议的决议"
 nesnd_fra_court.3.a:0 "追加拨款"
 nesnd_fra_court.3.b:0 "削减开支"
