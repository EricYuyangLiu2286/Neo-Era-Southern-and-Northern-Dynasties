 nesnd_qe1_court_purge:0 "整肃朝堂"
 nesnd_qe1_intrigue.1.t:0 "御前三议"
 nesnd_qe1_intrigue.1.d:0 "朝中要职出缺，奉宸官员与地方士人各荐人选，在[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]面前争执不下。军中将领冷眼旁观。"
 nesnd_qe1_intrigue.1.f:0 "“要职出缺，奉宸官员与地方士人各荐一人，请圣裁。”\n——吏部的请旨"
 nesnd_qe1_intrigue.1.a:0 "任用奉宸官员"
 nesnd_qe1_intrigue.1.b:0 "任用地方士人"
 nesnd_qe1_intrigue.1.c:0 "暂缓任命"
 nesnd_qe1_intrigue.2.t:0 "边将请饷"
 nesnd_qe1_intrigue.2.d:0 "[ROOT.GetCountry.GetNameNoFlag]的边地将领联名请饷，称军饷拖欠已久，士卒怨声载道。"
 nesnd_qe1_intrigue.2.f:0 "“边军欠饷已久，士卒怨望。恳请速发饷银。”\n——边将联名请饷疏"
 nesnd_qe1_intrigue.2.a:0 "拨饷"
 nesnd_qe1_intrigue.2.b:0 "驳回"
 nesnd_qe1_intrigue.3.t:0 "士人上书"
 nesnd_qe1_intrigue.3.d:0 "地方士人联名上书[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]，请求增设学校，并让地方在朝议中有更多发言的机会。"
 nesnd_qe1_intrigue.3.f:0 "“请增设学校，并准地方于朝议中多所陈言。”\n——地方士人的上书"
 nesnd_qe1_intrigue.3.a:0 "采纳"
 nesnd_qe1_intrigue.3.b:0 "驳回"
 nesnd_qe1_intrigue.4.t:0 "一方独大"
 nesnd_qe1_intrigue.4.d_crown:0 "皇权在朝中占了六成以上的份量，地方士人与军队都抱怨无处说话。"
 nesnd_qe1_intrigue.4.d_literati:0 "地方士人在朝中占了六成以上的份量，皇室与军队都担心被架空。"
 nesnd_qe1_intrigue.4.d_army:0 "军队在朝中占了六成以上的份量，文官与皇室都要看将领的脸色行事。"
 nesnd_qe1_intrigue.4.f:0 "“近来朝议，异议日少。”\n——一位御史的奏疏"
 nesnd_qe1_intrigue.4.a:0 "加以裁抑"
 nesnd_qe1_intrigue.4.b:0 "顺其自然"
 nesnd_usm_court_pressure_add_2_tt:0 "$nesnd_south_pressure_bar$ #r +2#!"
 nesnd_usm_court_pressure_add_3_tt:0 "$nesnd_south_pressure_bar$ #r +3#!"
 nesnd_usm_court_pressure_add_4_tt:0 "$nesnd_south_pressure_bar$ #r +4#!"
