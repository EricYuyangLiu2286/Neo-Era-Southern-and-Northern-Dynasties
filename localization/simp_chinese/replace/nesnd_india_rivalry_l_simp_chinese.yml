l_simp_chinese:
 nesnd_india_rivalry:0 "法明对立"
 nesnd_india_rivalry_reason:0 "$nesnd_lobby_name_fra$与$nesnd_lobby_name_usm$都在印度占有领土，也各有附属的邦国。两国的边界在次大陆上犬牙交错，独立的土邦夹在中间，倒向哪一方，当地的力量对比就偏向哪一方。\n\n两国派驻印度的官员正竞相拉拢王公，并提防对方的军队越界。"
 nesnd_india_rivalry_bar:0 "印度角逐"
 nesnd_india_rivalry_bar_usm_desc:0 "$nesnd_lobby_name_usm$"
 nesnd_india_rivalry_bar_fra_desc:0 "$nesnd_lobby_name_fra$"
 nesnd_india_rivalry_prog_fra_subjects:0 "$nesnd_lobby_name_fra$的印度属邦所持的印度州，多于$nesnd_lobby_name_usm$的印度属邦"
 nesnd_india_rivalry_prog_usm_subjects:0 "$nesnd_lobby_name_usm$的印度属邦所持的印度州，多于$nesnd_lobby_name_fra$的印度属邦"
 nesnd_india_rivalry_prog_fra_states:0 "$nesnd_lobby_name_fra$印度直辖州多于$nesnd_lobby_name_usm$"
 nesnd_india_rivalry_prog_usm_states:0 "$nesnd_lobby_name_usm$印度直辖州多于$nesnd_lobby_name_fra$"
 nesnd_india_rivalry_can_pay_tt:0 "我国[concept_gold_reserves]不少于 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_rivalry_court_price')|K]，且未陷入[concept_default]"
 nesnd_india_rivalry_court_wait_tt:0 "距上次拉拢土邦已满十二个月"
 nesnd_india_rivalry_has_prince_tt:0 "印度境内存在独立的土邦"
 nesnd_india_rivalry_court_button:0 "拉拢土邦"
 nesnd_india_rivalry_court_button_desc:0 "拨出外交经费厚赠与我国关系最亲近的独立印度土邦，扩大本国在次大陆的声势。"
 nesnd_india_rivalry_court_effect_tt:0 "与我国[concept_relations]最高的独立印度土邦关系提高 #g 15#! 点，印度角逐进度向我国一侧移动 #g 10#! 点。十二个月内不得再次拉拢土邦。"
 nesnd_india_rivalry_border_button:0 "提议划界"
 nesnd_india_rivalry_border_button_desc:0 "趁双方势均力敌且未交战之际，向对手提出签订划界与互不侵犯安排，结束本轮印度角逐。"
 nesnd_india_rivalry_border_range_tt:0 "印度角逐进度位于 #v -30#! 至 #v 30#! 之间"
 nesnd_india_rivalry_not_at_war_tt:0 "$nesnd_lobby_name_fra$与$nesnd_lobby_name_usm$目前未处于交战状态"
 nesnd_india_rivalry_border_wait_tt:0 "距上次提议划界已满二十四个月"
 nesnd_india_rivalry_border_propose_tt:0 "向对手递交划界草案。对方若同意，双方缔结十年期通行与停战协议，[concept_relations]提高 #g 30#! 点并结束本日志。对方若拒绝，我国对其产生负面[concept_diplomatic_catalyst]，两国[concept_relations]下降 #r 10#! 点，角逐进度向我国一侧移动 #g 10#! 点。二十四个月内不得再次提议划界。"
 nesnd_india_rivalry_fra_win_header:0 "#title $nesnd_lobby_name_fra$占上风#!\n"
 nesnd_india_rivalry_fra_win_effect_header:0 "#title 若$nesnd_lobby_name_fra$占上风：#!\n$EFFECT$"
 nesnd_india_rivalry_fra_win_tt:0 "印度角逐进度达到 #v 100#!（$nesnd_lobby_name_fra$一端）"
 nesnd_india_rivalry_fra_win_effect_tt:0 "$nesnd_lobby_name_fra$获得$nesnd_lobby_name_usm$在印度与$nesnd_lobby_name_fra$领土或其附属国相邻之州的[concept_claim]（至多三个），并获得十年[concept_prestige]加成。$nesnd_lobby_name_usm$承受同等期限的[concept_legitimacy]惩罚。两国日志同时结束，期满后若条件仍成立可再次开启。"
 nesnd_india_rivalry_fra_win_conclusion:0 "$nesnd_lobby_name_fra$在这一轮印度角逐中占得上风，取得了对方几处相邻州的宣称。"
 nesnd_india_rivalry_fra_win_outcome_tt:0 "胜负双方各自收到对应事件，宣布$nesnd_lobby_name_fra$在印度角逐中占得上风。"
 nesnd_india_rivalry_usm_win_header:0 "#title $nesnd_lobby_name_usm$占上风#!\n"
 nesnd_india_rivalry_usm_win_effect_header:0 "#title 若$nesnd_lobby_name_usm$占上风：#!\n$EFFECT$"
 nesnd_india_rivalry_usm_win_tt:0 "印度角逐进度达到 #v -100#!（$nesnd_lobby_name_usm$一端）"
 nesnd_india_rivalry_usm_win_effect_tt:0 "$nesnd_lobby_name_usm$获得$nesnd_lobby_name_fra$在印度与$nesnd_lobby_name_usm$领土或其附属国相邻之州的[concept_claim]（至多三个），并获得十年[concept_prestige]加成。$nesnd_lobby_name_fra$承受同等期限的[concept_legitimacy]惩罚。两国日志同时结束，期满后若条件仍成立可再次开启。"
 nesnd_india_rivalry_usm_win_conclusion:0 "$nesnd_lobby_name_usm$在这一轮印度角逐中占得上风，取得了对方几处相邻州的宣称。"
 nesnd_india_rivalry_usm_win_outcome_tt:0 "胜负双方各自收到对应事件，宣布$nesnd_lobby_name_usm$在印度角逐中占得上风。"
 nesnd_india_rivalry_border_header:0 "#title 划界收场#!\n"
 nesnd_india_rivalry_border_effect_header:0 "#title 若双方同意划界：#!\n$EFFECT$"
 nesnd_india_rivalry_border_trigger_tt:0 "双方已就印度势力范围划界达成协议"
 nesnd_india_rivalry_border_outcome_effect_tt:0 "两国缔结十年期划界[concept_treaty]与双向[concept_truce]，[concept_relations]提高 #g 30#! 点，双方各得十年[concept_influence]加成。两国日志结束，二十年内不再开启「$nesnd_india_rivalry$」。"
 nesnd_india_rivalry_border_conclusion:0 "$nesnd_lobby_name_fra$与$nesnd_lobby_name_usm$正式签署划界协定，印度之争暂告平息。"
 nesnd_india_rivalry.4_outcome_tt:0 "双方各自收到事件「$nesnd_india_rivalry.4.t$」，确认划界条约生效并在二十年内不再重启对立。"
 nesnd_india_rivalry_upper:0 "印度占先"
 nesnd_india_rivalry_lower:0 "印度受挫"
 nesnd_india_rivalry_border:0 "印度划界协定"
 nesnd_india_rivalry.1.t:0 "《孟买条约》草案"
 nesnd_india_rivalry.1.d:0 "[SCOPE.sCountry('india_rivalry_proposer').GetName]的使节递来一份印度划界草案，建议两国以现行占领区与附属国为界，相互承认彼此在次大陆的势力范围，并约定长期互不兴兵。"
 nesnd_india_rivalry.1.f:0 "“为免次大陆兵连祸结，谨拟定十年界约草案，请贵国政府审裁。”\n——划界全权代表照会"
 nesnd_india_rivalry.1.a:0 "同意划界，签署协定"
 nesnd_india_rivalry.1.a_tt:0 "双方签署十年期双向军事通行[concept_treaty]（若可缔结）并立下十年双向[concept_truce]，[concept_relations]提高 #g 30#! 点，各自获得十年[concept_influence]加成。「$nesnd_india_rivalry$」结束，二十年内不再开启。"
 nesnd_india_rivalry.1.b:0 "拒绝这份草案"
 nesnd_india_rivalry.1.b_tt:0 "[SCOPE.sCountry('india_rivalry_proposer').GetName]对我国产生负面[concept_diplomatic_catalyst]，印度角逐进度向对方一侧移动 #r 10#! 点。"
 nesnd_india_rivalry.2.t:0 "印度角逐占得上风"
 nesnd_india_rivalry.2.d:0 "在印度的领土、属邦和土邦的向背上，[ROOT.GetCountry.GetName]都已压过[SCOPE.sCountry('india_rivalry_loser').GetName]。政府已经照会各方，对对方在印度相邻的几处州提出宣称。"
 nesnd_india_rivalry.2.f:0 "“次大陆形势既已明朗，前线领土主张业已照会各方。”\n——殖民部简报"
 nesnd_india_rivalry.2.a:0 "巩固既得优势"
 nesnd_india_rivalry.2.a_tt:0 "我国获得至多三个相邻印度州的[concept_claim]与十年[concept_prestige]加成。期满后若两强仍在印度并立，对立可能重燃。"
 nesnd_india_rivalry.3.t:0 "印度角逐陷入下风"
 nesnd_india_rivalry.3.d:0 "[ROOT.GetCountry.GetName]没能压住[SCOPE.sCountry('india_rivalry_winner').GetName]在印度的扩张。对方已经对我国在印度相邻的几处领地提出宣称，国内对政府的指责随之而来。"
 nesnd_india_rivalry.3.f:0 "“对方已就边境数州提出主权要求，请速示应对之策。”\n——驻印度司令部急报"
 nesnd_india_rivalry.3.a:0 "重整防务"
 nesnd_india_rivalry.3.a_tt:0 "我国在十年内承受[concept_legitimacy]惩罚，对手已取得相邻印度州的[concept_claim]。"
 nesnd_india_rivalry.4.t:0 "《孟买条约》"
 nesnd_india_rivalry.4.d:0 "[ROOT.GetCountry.GetName]与[SCOPE.sCountry('india_rivalry_partner').GetName]的全权代表已经互换批准书，《孟买条约》正式生效。双方确认彼此在印度现有的领土与属邦边界，并订立停战与通行安排。"
 nesnd_india_rivalry.4.f:0 "“两国政府兹于孟买互换批准书，彼此尊重次大陆既有界线，十年之内互不侵犯。”\n——《孟买条约》序言"
 nesnd_india_rivalry.4.a:0 "批准生效"
 nesnd_india_rivalry.4.a_tt:0 "划界与停战安排生效，双方获得十年[concept_influence]加成。此后二十年内不会再开启「$nesnd_india_rivalry$」。"
 nesnd_india_rivalry.5.t:0 "划界提议遭到拒绝"
 nesnd_india_rivalry.5.d:0 "[SCOPE.sCountry('india_rivalry_refuser').GetName]正式驳回了[ROOT.GetCountry.GetName]提出的印度划界草案，不肯就势力范围让步。两国关系随之转冷，一些王公转而倾向于提出划界的一方。"
 nesnd_india_rivalry.5.f:0 "“贵方所拟划界条款，本国政府无法接受。”\n——正式外交复照"
 nesnd_india_rivalry.5.a:0 "继续周旋"
 nesnd_india_rivalry.5.a_tt:0 "我国对[SCOPE.sCountry('india_rivalry_refuser').GetName]产生负面[concept_diplomatic_catalyst]，两国[concept_relations]下降 #r 10#! 点，印度角逐进度向我国一侧移动 #g 10#! 点。"
