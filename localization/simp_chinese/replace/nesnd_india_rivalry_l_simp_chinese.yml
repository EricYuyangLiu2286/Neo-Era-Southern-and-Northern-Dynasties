l_simp_chinese:
 nesnd_india_rivalry:0 "法明对立"
 nesnd_india_rivalry_reason:0 "以$nesnd_lobby_name_fra$为代表的欧洲殖民者与$nesnd_lobby_name_usm$的中国军阀在印度争夺土地已有百余年。至1830年代，$nesnd_lobby_name_fra$虽然只直接控制了$STATE_GUJARAT$与$STATE_MADRAS$的一部分，但却依靠印度人对于中国殖民者的恐惧，将北方的多数土邦和庞大富庶的莫卧儿帝国纳入法兰西羽翼之下。而老牌殖民列强$nesnd_lobby_name_usm$几乎将整个南印度沿海与迈索尔纳入帝国的政税体系，仅剩十五个土邦君主仍保持半独立地位。两国的领地与附属邦国在若干地区彼此交错，多次爆发冲突。随着东西方政治局势在近年来的动荡和变化，在印度大陆的争端开始变得不那么经济。因此，在两国的外交官员中有人开始主张缓和历史矛盾，用和平谈判划定各自在印度的势力范围。"
 nesnd_india_rivalry_bar:0 "在印度的优势"
 nesnd_india_rivalry_bar_usm_desc:0 "$nesnd_lobby_name_usm$"
 nesnd_india_rivalry_bar_fra_desc:0 "$nesnd_lobby_name_fra$"
 nesnd_india_rivalry_prog_fra_subjects:0 "$nesnd_lobby_name_fra$的印度附属国领有的州更多"
 nesnd_india_rivalry_prog_usm_subjects:0 "$nesnd_lobby_name_usm$的印度附属国领有的州更多"
 nesnd_india_rivalry_prog_fra_states:0 "$nesnd_lobby_name_fra$直辖的印度州更多"
 nesnd_india_rivalry_prog_usm_states:0 "$nesnd_lobby_name_usm$直辖的印度州更多"
 nesnd_india_rivalry_can_pay_tt:0 "本国的[concept_gold_reserves]足以支付这笔款项，且没有[concept_default]或[concept_bankruptcy]"
 nesnd_india_rivalry_court_wait_tt:0 "一年内没有结好过王公"
 nesnd_india_rivalry_has_prince_tt:0 "印度还有独立的土邦"
 nesnd_india_rivalry_court_button:0 "结好王公"
 nesnd_india_rivalry_court_button_desc:0 "出资结好与本国关系最好的独立土邦。"
 nesnd_india_rivalry_court_effect_tt:0 "与该土邦的[concept_relations] #g +15#!，$nesnd_india_rivalry_bar$向我方移动 #g 10#!。一年之内不能再次结好。"
 nesnd_india_rivalry_border_button:0 "提议划界"
 nesnd_india_rivalry_border_button_desc:0 "向对方提议划定两国在印度的势力范围：十年之内互不开战，能够缔约时并相互开放军事通行十年。"
 nesnd_india_rivalry_border_range_tt:0 "$nesnd_india_rivalry_bar$在 #v -30#! 到 #v 30#! 之间"
 nesnd_india_rivalry_not_at_war_tt:0 "两国没有交战"
 nesnd_india_rivalry_border_wait_tt:0 "两年内没有提议过划界"
 nesnd_india_rivalry_border_propose_tt:0 "对方随后答复。两年之内不能再提议。"
 nesnd_india_rivalry_fra_win_header:0 "#title $nesnd_lobby_name_fra$占上风的条件：\n#!"
 nesnd_india_rivalry_fra_win_effect_header:0 "#title 如果$nesnd_lobby_name_fra$占上风：#!\n$EFFECT$"
 nesnd_india_rivalry_fra_win_tt:0 "$nesnd_india_rivalry_bar$到达$nesnd_lobby_name_fra$一端"
 nesnd_india_rivalry_fra_win_effect_tt:0 "$nesnd_lobby_name_fra$对$nesnd_lobby_name_usm$至多三个与$nesnd_lobby_name_fra$或其附属国相邻的印度州提出[concept_claim]，获得[GetStaticModifier('nesnd_india_rivalry_upper').GetName]。$nesnd_lobby_name_usm$获得[GetStaticModifier('nesnd_india_rivalry_lower').GetName]。十年之内不再开启「$nesnd_india_rivalry$」。"
 nesnd_india_rivalry_fra_win_conclusion:0 "$nesnd_lobby_name_fra$在印度占了上风。"
 nesnd_india_rivalry_fra_win_outcome_tt:0 "两国都将得知结果。"
 nesnd_india_rivalry_usm_win_header:0 "#title $nesnd_lobby_name_usm$占上风的条件：\n#!"
 nesnd_india_rivalry_usm_win_effect_header:0 "#title 如果$nesnd_lobby_name_usm$占上风：#!\n$EFFECT$"
 nesnd_india_rivalry_usm_win_tt:0 "$nesnd_india_rivalry_bar$到达$nesnd_lobby_name_usm$一端"
 nesnd_india_rivalry_usm_win_effect_tt:0 "$nesnd_lobby_name_usm$对$nesnd_lobby_name_fra$至多三个与$nesnd_lobby_name_usm$或其附属国相邻的印度州提出[concept_claim]，获得[GetStaticModifier('nesnd_india_rivalry_upper').GetName]。$nesnd_lobby_name_fra$获得[GetStaticModifier('nesnd_india_rivalry_lower').GetName]。十年之内不再开启「$nesnd_india_rivalry$」。"
 nesnd_india_rivalry_usm_win_conclusion:0 "$nesnd_lobby_name_usm$在印度占了上风。"
 nesnd_india_rivalry_usm_win_outcome_tt:0 "两国都将得知结果。"
 nesnd_india_rivalry_border_header:0 "#title 划界的条件：\n#!"
 nesnd_india_rivalry_border_effect_header:0 "#title 如果划界：#!\n$EFFECT$"
 nesnd_india_rivalry_border_trigger_tt:0 "两国签订了划界条约"
 nesnd_india_rivalry_border_outcome_effect_tt:0 "两国休战十年，能够缔约时并相互开放军事通行十年。二十年之内不再开启「$nesnd_india_rivalry$」。"
 nesnd_india_rivalry_border_conclusion:0 "两国在印度划定了各自的势力范围。"
 nesnd_india_rivalry.4_outcome_tt:0 "两国签订划界条约。"
 nesnd_india_rivalry_upper:0 "印度的上风"
 nesnd_india_rivalry_lower:0 "印度的下风"
 nesnd_india_rivalry_border:0 "划界条约"
 nesnd_india_rivalry.1.t:0 "划界的提议"
 nesnd_india_rivalry.1.d:0 "[SCOPE.sCountry('india_rivalry_proposer').GetName]的使节提议，两国划定在印度的势力范围：相互开放军事通行十年，十年之内互不开战。"
 nesnd_india_rivalry.1.f:0 "“两国在印度的边界与势力范围，经双方会商，划定如下。”\n——划界条约草案"
 nesnd_india_rivalry.1.a:0 "同意划界"
 nesnd_india_rivalry.1.a_tt:0 "两国休战十年，能够缔约时并签订为期十年的相互[concept_military_access]条约。与[SCOPE.sCountry('india_rivalry_proposer').GetName]的[concept_relations] #g +30#!，双方获得[GetStaticModifier('nesnd_india_rivalry_border').GetName]。"
 nesnd_india_rivalry.1.b:0 "拒绝"
 nesnd_india_rivalry.1.b_tt:0 "与[SCOPE.sCountry('india_rivalry_proposer').GetName]的[concept_relations] #r -10#!，$nesnd_india_rivalry_bar$向对方移动 #r 10#!。"
 nesnd_india_rivalry.2.t:0 "印度的上风"
 nesnd_india_rivalry.2.d:0 "本国在印度的地位已明显超过[SCOPE.sCountry('india_rivalry_loser').GetName]。本国政府已就[SCOPE.sCountry('india_rivalry_loser').GetName]与我方或我方附属邦国相邻的印度各州提出领土要求。"
 nesnd_india_rivalry.2.f:0 "“我国在印度的地位现已超过[SCOPE.sCountry('india_rivalry_loser').GetName]，谨请就其邻近我方的各州提出要求。”\n——驻印度官员的报告"
 nesnd_india_rivalry.2.a:0 "乘势而进"
 nesnd_india_rivalry.2.a_tt:0 "我们对[SCOPE.sCountry('india_rivalry_loser').GetName]至多三个与我方或我方附属国相邻的印度州提出[concept_claim]，获得[GetStaticModifier('nesnd_india_rivalry_upper').GetName]。"
 nesnd_india_rivalry.3.t:0 "印度的下风"
 nesnd_india_rivalry.3.d:0 "[SCOPE.sCountry('india_rivalry_winner').GetName]在印度的地位已明显超过本国。该国已就本国与其或其附属邦国相邻的印度各州提出领土要求。"
 nesnd_india_rivalry.3.f:0 "“[SCOPE.sCountry('india_rivalry_winner').GetName]在印度的地位现已超过我国，并已就我方邻近各州提出要求。”\n——驻印度官员的报告"
 nesnd_india_rivalry.3.a:0 "暂且隐忍"
 nesnd_india_rivalry.3.a_tt:0 "[SCOPE.sCountry('india_rivalry_winner').GetName]对我们至多三个印度州提出[concept_claim]，我们获得[GetStaticModifier('nesnd_india_rivalry_lower').GetName]。"
 nesnd_india_rivalry.4.t:0 "划界条约"
 nesnd_india_rivalry.4.d:0 "本国与[SCOPE.sCountry('india_rivalry_partner').GetName]签订了划界条约，划定了两国在印度的势力范围。依约，两国十年之内不得交战。"
 nesnd_india_rivalry.4.f:0 "“两国在印度的边界与势力范围，经双方会商，划定如下。”\n——划界条约"
 nesnd_india_rivalry.4.a:0 "签字"
 nesnd_india_rivalry.4.a_tt:0 "二十年之内不再开启「$nesnd_india_rivalry$」。"
 nesnd_india_rivalry.5.t:0 "划界遭拒"
 nesnd_india_rivalry.5.d:0 "[SCOPE.sCountry('india_rivalry_refuser').GetName]拒绝了本国的划界提议。两国在印度的范围仍未划定。"
 nesnd_india_rivalry.5.f:0 "“本国政府无意就印度的边界与贵国会商。”\n——对方的复照"
 nesnd_india_rivalry.5.a:0 "知道了"
 nesnd_india_rivalry.5.a_tt:0 "与[SCOPE.sCountry('india_rivalry_refuser').GetName]的[concept_relations] #r -10#!，$nesnd_india_rivalry_bar$向我方移动 #g 10#!。"
