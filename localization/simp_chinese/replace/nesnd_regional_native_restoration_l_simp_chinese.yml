l_simp_chinese:
 nesnd_regional_native_restoration:0 "原住民与地方自治"
 nesnd_regional_native_restoration_reason:0 "原住民社群希望掌握自己的土地，让地方代表参与乡村的统治。中央政府则坚持对各地的管辖。双方能否通过地方议会达成妥协，还是走向独立与战争，将决定这里的政治前途。"
 nesnd_regional_native_war:0 "地方统治权之争"
 nesnd_regional_native_war_reason:0 "原住民社群已经另立政府，与原政府争夺统治权。地方土地、军队的归属和社群的政治地位，都成为双方争执的内容。吞并对方将结束两国并立。"
 nesnd_regional_native_war_status:0 "原住民政权与原政府各据一方，统治权之争尚未结束。"
 nesnd_regional_native_request_status:0 "政治协议正在等待答复，期限为#v 90日#!。答复之前，武装势力暂不起事。"
 nesnd_regional_native_mobilizing_status:0 "地方武装正在集结，起兵筹备为期#v 12个月#!。"
 nesnd_regional_native_paused_status:0 "十二个月的筹备已经完成，但反抗压力低于#v 75#!。地方武装暂缓起事。"
 nesnd_regional_native_ready_status:0 "筹备已经完成。原定起兵地区仍须能够建国，反抗压力须达到#v 75#!，且没有其他内战或待答复的协议请求。"
 nesnd_regional_native_political_status:0 "地方社群仍在争取政治权利，目前没有足以独立建国的地区。"
 nesnd_regional_native_pressure_status:0 "原住民社群正在争取土地与地方权力。反抗压力达到#v 100#!且有合适的起兵地区时，将开始为期#v 12个月#!的筹备。"
 nesnd_regional_native_pressure_bar:0 "反抗压力"
 nesnd_regional_native_pressure_bar_desc:0 "$nesnd_regional_native_pressure_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_regional_native_pressure_growth:0 "地方组织的扩展"
 nesnd_regional_native_release_button:0 "承认地方独立"
 nesnd_regional_native_release_button_desc:0 "承认选定地区的原住民国家，使当地社群在自己的政府下生活。"
 nesnd_regional_native_release_effect_tt:0 "承认#v [SCOPE.sCountry('nesnd_regional_release_host').GetCustom('nesnd_regional_native_polity_name')]#!独立，将议定的领地交由其管辖。"
 nesnd_regional_native_request_button:0 "提出政治协议"
 nesnd_regional_native_request_button_desc:0 "向已经独立的原住民国家提出协议，争取其对地方议会与地权安排的支持。"
 nesnd_regional_native_request_effect_tt:0 "对方须在#v 90日#!内答复。只有对方接受，下列地方议会修正才会生效，双方关系提高#p 25#!，反抗压力降低#p 25#!，并停止起兵筹备。提出请求后#v 12个月#!内不能再次请求。"
 nesnd_regional_native_negotiate_button:0 "商谈地方议会与地权"
 nesnd_regional_native_negotiate_button_desc:0 "让地方代表参与议会与地权谈判，争取乡村的合作。"
 nesnd_regional_native_negotiate_effect_tt:0 "反抗压力降低#p 15#!，并停止正在进行的起兵筹备。"
 nesnd_regional_native_suppress_button:0 "镇压地方反抗"
 nesnd_regional_native_suppress_button_desc:0 "派军队驱散集会，压制地方首领之间的联络。"
 nesnd_regional_native_suppress_effect_tt:0 "反抗压力降低#p 20#!。本国原住民人口中#n 5%#!转为[concept_radical]。"
 nesnd_regional_native_release_state_tt:0 "拟建国的地区：#v [SCOPE.sCountry('nesnd_regional_release_host').GetCustom('nesnd_regional_native_territory_name')]#!。"
 nesnd_regional_native_no_release_state_tt:0 "目前没有符合独立条件的地区。"
 nesnd_regional_native_request_free_tt:0 "没有等待答复的政治协议请求。"
 nesnd_regional_native_request_wait_tt:0 "距离上次提出政治协议已满#v 12个月#!，或尚未提出过请求。"
 nesnd_regional_native_partner_tt:0 "存在与当地原住民相应的独立国家，拥有正式政府，且未与本国交战。"
 nesnd_regional_native_recognized_tt:0 "地方独立已经获得承认，或双方的统治权之争已经通过吞并解决。"
 nesnd_regional_native_war_victory_tt:0 "我国已经赢得战争，吞并敌国。"
 nesnd_regional_native_war_terminal_tt:0 "双方的统治权之争已经结束。"
 nesnd_regional_native_war_not_victorious_tt:0 "我国未能吞并对方。"
 nesnd_regional_native_restored_rule:0 "地方社群的威望"
 nesnd_regional_native.1.t:0 "地方战争爆发"
 nesnd_regional_native.1.d:0 "原住民政权与原政府之间的战争已经开始，双方都要求吞并对方。土地、武装力量和地方社群的政治地位，都成了战争中的争夺。"
 nesnd_regional_native.1.a:0 "准备应对冲突。"
 nesnd_regional_native.2.t:0 "地方反抗受到压制"
 nesnd_regional_native.2.d:0 "军队驱散了集会，地方首领之间的联络受到打击。武装力量支持政府用兵，乡村却积下了更多怨恨。土地与地方权力的争执仍未解决。"
 nesnd_regional_native.2.a:0 "争执还没有结束。"
 nesnd_regional_native.3.t:0 "统治权的归属"
 nesnd_regional_native.3.d:0 "对方政府的全部领土已经归入[ROOT.GetCountry.GetName]。两国并立的局面结束了，地方社群须在新的统治下重新争取自己的地位。"
 nesnd_regional_native.3.a:0 "接管新的领土。"
 nesnd_regional_native.4.t:0 "未定的地方秩序"
 nesnd_regional_native.4.d:0 "这场争端已经结束，本国未能借此吞并对方。政府仍须处理当地社群的土地与政治要求。"
 nesnd_regional_native.4.a:0 "面对眼前的局面。"
 nesnd_regional_native.5.t:0 "村社之间的联络"
 nesnd_regional_native.5.d:0 "地方首领正在联络村社和武装，准备另立政府。集结将持续十二个月，政府仍可通过地方谈判缓和这场危机。"
 nesnd_regional_native.5.a:0 "乡村的支持正在汇集。"
 nesnd_regional_native.6.t:0 "避难者抵达"
 nesnd_regional_native.6.d:0 "因原住民政权失败而离乡的居民已经来到[ROOT.GetCountry.GetName]。他们带来了亲族联系，也带来了改变的需要。"
 nesnd_regional_native.6.a:0 "让他们安顿下来。"
 nesnd_regional_native.7.t:0 "地方议会的协议"
 nesnd_regional_native.7.d:0 "[SCOPE.sCountry('regional_native_sender').GetName]希望与我们订立政治协议，争取我们对其地方议会与地权安排的支持。达成协议将改善双边关系，并缓和对方国内原住民社群的反抗。"
 nesnd_regional_native.7.a:0 "同意这份协议。"
 nesnd_regional_native.8.t:0 "承认地方独立"
 nesnd_regional_native.8.d:0 "选定地区已经成为独立的原住民国家。当地社群将由自己的政府统治，本国仍保有其余领土。"
 nesnd_regional_native.8.a:0 "承认新的邻国。"
 nesnd_regional_native.7.b:0 "拒绝这份协议。"
 nesnd_regional_native.9.t:0 "政治协议的答复"
 nesnd_regional_native.9.a:0 "知悉。"
 nesnd_regional_native.9.accepted:0 "对方接受了政治协议。地方议会获得承认，双边关系改善，乡村的反抗压力也随之缓和。"
 nesnd_regional_native.9.refused:0 "对方拒绝了协议。双方没有就地方议会与地权安排达成共同立场。"
 nesnd_regional_native.9.expired:0 "双方未能达成协议，请求现已失效。"
 notification_nesnd_regional_native_repression_notice_name:0 "地方反抗受到压制"
 notification_nesnd_regional_native_repression_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]的政府动用军队压制原住民组织，乡村的怨恨随之加深。"
 notification_nesnd_regional_native_repression_notice_tooltip:0 "#header $notification_nesnd_regional_native_repression_notice_name$#!\n$notification_nesnd_regional_native_repression_notice_desc$"
 notification_nesnd_regional_native_mobilization_notice_name:0 "原住民武装开始筹备"
 notification_nesnd_regional_native_mobilization_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]的地方武装开始为期十二个月的起兵筹备。"
 notification_nesnd_regional_native_mobilization_notice_tooltip:0 "#header $notification_nesnd_regional_native_mobilization_notice_name$#!\n$notification_nesnd_regional_native_mobilization_notice_desc$"
 notification_nesnd_regional_native_country_created_notice_name:0 "原住民政权建立"
 notification_nesnd_regional_native_country_created_notice_desc:0 "原属[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]的原住民地区已经另立政府。"
 notification_nesnd_regional_native_country_created_notice_tooltip:0 "#header $notification_nesnd_regional_native_country_created_notice_name$#!\n$notification_nesnd_regional_native_country_created_notice_desc$"
 notification_nesnd_regional_native_war_started_notice_name:0 "原住民复国战争爆发"
 notification_nesnd_regional_native_war_started_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]与原住民政权之间的战争已经开始，双方都要求吞并对方。"
 notification_nesnd_regional_native_war_started_notice_tooltip:0 "#header $notification_nesnd_regional_native_war_started_notice_name$#!\n$notification_nesnd_regional_native_war_started_notice_desc$"
 notification_nesnd_regional_native_dispatch_failed_notice_name:0 "战争未能展开"
 notification_nesnd_regional_native_dispatch_failed_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]与原住民政权之间未能形成战争，统治权之争暂告一段落。"
 notification_nesnd_regional_native_dispatch_failed_notice_tooltip:0 "#header $notification_nesnd_regional_native_dispatch_failed_notice_name$#!\n$notification_nesnd_regional_native_dispatch_failed_notice_desc$"
 notification_nesnd_regional_native_opponent_lost_notice_name:0 "对峙无法继续"
 notification_nesnd_regional_native_opponent_lost_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]已无法继续与原来的对手争夺统治权，争端暂告结束。"
 notification_nesnd_regional_native_opponent_lost_notice_tooltip:0 "#header $notification_nesnd_regional_native_opponent_lost_notice_name$#!\n$notification_nesnd_regional_native_opponent_lost_notice_desc$"
 notification_nesnd_regional_native_dispute_ended_notice_name:0 "地方争端暂息"
 notification_nesnd_regional_native_dispute_ended_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]与原住民政权的争端已经结束，双方均未吞并对方。"
 notification_nesnd_regional_native_dispute_ended_notice_tooltip:0 "#header $notification_nesnd_regional_native_dispute_ended_notice_name$#!\n$notification_nesnd_regional_native_dispute_ended_notice_desc$"
 notification_nesnd_regional_native_settlement_notice_name:0 "统治权已有归属"
 notification_nesnd_regional_native_settlement_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]已经吞并对方政府的全部领土，结束了这场统治权之争。"
 notification_nesnd_regional_native_settlement_notice_tooltip:0 "#header $notification_nesnd_regional_native_settlement_notice_name$#!\n$notification_nesnd_regional_native_settlement_notice_desc$"
 notification_nesnd_regional_native_reopened_notice_name:0 "地方诉求再起"
 notification_nesnd_regional_native_reopened_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]的原住民社群重新提出地方自治与地权要求。"
 notification_nesnd_regional_native_reopened_notice_tooltip:0 "#header $notification_nesnd_regional_native_reopened_notice_name$#!\n$notification_nesnd_regional_native_reopened_notice_desc$"
 notification_nesnd_regional_native_peace_recognized_notice_name:0 "原住民独立获承认"
 notification_nesnd_regional_native_peace_recognized_notice_desc:0 "[SCOPE.sCountry('nesnd_restoration_notice_actor').GetName]承认了一个原住民地区的独立地位。"
 notification_nesnd_regional_native_peace_recognized_notice_tooltip:0 "#header $notification_nesnd_regional_native_peace_recognized_notice_name$#!\n$notification_nesnd_regional_native_peace_recognized_notice_desc$"
 nesnd_regional_native_repression_pressure_tt:0 "反抗压力至少为#v 50#!。"
 nesnd_regional_native_accept_effect_tt:0 "接受协议后，[SCOPE.sCountry('regional_native_sender').GetName]的反抗压力降低#p 25#!，当地正在进行的起兵筹备也将停止。"
