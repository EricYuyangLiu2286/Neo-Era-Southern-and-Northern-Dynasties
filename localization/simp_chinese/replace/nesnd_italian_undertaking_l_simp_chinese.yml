l_simp_chinese:
 nesnd_it_offer_effect_tt:0 "向对方递交共同筹款的提案。对方可接受、要求改办学校或拒绝。双方接受后才开始拨款。提案在#v 90日#!后失效。"
 nesnd_it_end_mutual_tt:0 "双方结束履约，已付拨款不退，原有开支持续至期满。双方均须等候#v 12个月#!方可再议。"
 nesnd_it_end_local_tt:0 "结束本国剩余的履约义务。现有拨款持续至期满，本国须等候#v 12个月#!方可再议。"
 nesnd_it_project_site_missing_tt:0 "本项目须先在意大利境内选定本国有居民的工程州，才能拨款开办。"
 nesnd_it_counteroffer_tt:0 "向提案方提出以学校履约。对方仍可决定是否接受，双方尚不拨款。"
 nesnd_it_refuse_tt:0 "结束这次交涉。双方均须等候#v 12个月#!方可再议。"
 nesnd_it_compact_active:0 "正与[ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName]共同履约。本国已连续达标#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_compact_months')|0] / 3#!个月，双方均满三个月后议定合作。"
 nesnd_it_compact_broken:0 "原约已失去相应的履约方。政府可以结束本国剩余的义务。"
 nesnd_it_compact_sent:0 "已向[ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName]提出协商，尚待双方议定。"
 nesnd_it_compact_received:0 "正与[ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_incoming').GetCountry.GetName]商议对方提出的条款。"
