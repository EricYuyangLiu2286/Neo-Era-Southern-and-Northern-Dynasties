l_simp_chinese:
 nesnd_it_offer_effect_tt:0 "向对方递交共同筹款的提案。对方可接受、要求改办学校或拒绝。双方接受后才开始拨款。提案在#v 90日#!后失效。"
 nesnd_it_end_mutual_tt:0 "双方结束合作，已付拨款不退，原有开支持续到期为止。双方都必须等候#v 12个月#!才能再议。"
 nesnd_it_end_local_tt:0 "结束我国剩余的义务。现有拨款持续到期为止，我国必须等候#v 12个月#!才能再议。"
 nesnd_it_project_site_missing_tt:0 "本项目必须先在意大利境内选定我国有居民的工程地区，才能拨款开办。"
 nesnd_it_counteroffer_tt:0 "向提案方提出改以学校维持合作。对方仍可决定是否接受，双方尚不拨款。"
 nesnd_it_refuse_tt:0 "结束这次交涉。双方都要等#v 12个月#!后才能再次商议。"
 nesnd_it_compact_active:0 "正与[ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName]共同拨款维持服务。我国已连续达标#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_compact_months')|0] / 3#!个月，双方均满三个月后议定合作。"
 nesnd_it_compact_broken:0 "对方已不再受原约约束。政府可以结束我国剩余的义务。"
 nesnd_it_compact_sent:0 "已向[ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_partner').GetCountry.GetName]提出协商，还等双方议定。"
 nesnd_it_compact_received:0 "正与[ROOT.GetCountry.MakeScope.Var('nesnd_c2_compact_incoming').GetCountry.GetName]商议对方提出的条款。"
 nesnd_it_foundations_active:0 "“工场与诸邦”的拨款已经开始。所选工程必须连续三个月达到经营要求。"
 nesnd_it_budget_active:0 "共同财政的拨款已经开始。所选项目必须连续三个月达到经营要求。"
 nesnd_it_compact_ready:0 "我国已办成第一项事业，可向其他意大利邦国提议共同筹款。"
 nesnd_it_foundations_choose:0 "军需工程、商人融资与地方合资学校，必须先择一筹办。"
 nesnd_it_compact_unavailable:0 "本国目前无从另议新的邦际协约。"
