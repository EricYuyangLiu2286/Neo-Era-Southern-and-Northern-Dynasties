 nesnd_it_budget_active:0 "共同财政的拨款已经开始。所选项目须连续三个月达到经营要求。"
 nesnd_it_compact_ready:0 "本国已办成第一项事业，可向其他意大利邦国提议共同筹款。"
 nesnd_it_foundations_choose:0 "军需工程、商人融资与地方合资学校，须先择一筹办。"
