 nesnd_qe1_army_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100"
 nesnd_qe1_court_status:0 "皇族、地方士人与军府正在争夺帝国的中枢。"
 nesnd_qe1_court_journal:0 "伊犁的朝议"
 nesnd_qe1_court_journal_reason:0 "皇族以旧日征服的威望维系奉宸官僚，地方士人依靠学堂、商号和官署经营政务，军队则掌握帝国赖以扩张的武力。三方都要借助另外两方治理各地，也都在争取任官、征税和调兵的决定权。"
 nesnd_qe1_patron_crown_button:0 "奖掖奉宸官僚"
 nesnd_qe1_patron_crown_button_desc:0 "让拥护皇室的军士与官员掌握更多职位。"
 nesnd_qe1_patron_literati_button:0 "奖掖地方士人"
 nesnd_qe1_patron_literati_button_desc:0 "让学堂、商号与文官的意见更多地进入朝廷。"
 nesnd_qe1_patron_army_button:0 "奖掖军府"
 nesnd_qe1_patron_army_button_desc:0 "让军队及支持军府的市民取得更多的政治声望。"
 nesnd_qe1_patron_cancel_button:0 "撤回奖掖"
 nesnd_qe1_patron_cancel_button_desc:0 "朝廷停止对这一方的特别扶持。"
 nesnd_qe1_coup_army_button:0 "军府接掌中枢"
 nesnd_qe1_coup_army_button_desc:0 "以军队与职业团体重组国家，专制的权力将由法团机关行使。"
 nesnd_qe1_coup_literati_button:0 "改立共和"
 nesnd_qe1_coup_literati_button_desc:0 "改立总统共和，由民选总统与实行比例代表的议会主持国政。"
 nesnd_qe1_coup_crown_button:0 "重整皇权"
 nesnd_qe1_coup_crown_button_desc:0 "以君主制与技术官僚重组政府，使皇室重新掌握国家的统治。"
 nesnd_qe1_patronage_crown:0 "奖掖皇权"
 nesnd_qe1_patronage_literati:0 "奖掖地方士人"
 nesnd_qe1_patronage_army:0 "奖掖军队"
 law_nesnd_qe1_proportional_representation:0 "比例代表制"
 law_nesnd_qe1_proportional_representation_desc:0 "财产达到门槛的选民取得投票资格，识字程度也影响其选票的政治分量。各政治团体依支持力量组成议会与政府。"
 nesnd_qe1_recovery_journal:0 "恢复故土"
 nesnd_qe1_recovery_journal_reason:0 "河西的关隘与关中的田地仍在陈秦皇族的记忆之中。若帝国能够重新控制通往东方的道路，恢复军队与官署的力量，朝廷便有机会以故土为起点，再次争夺华夏的天下。"
 nesnd_qe1_recovered_military:0 "再造秦军"
 nesnd_qe1_recovered_civil:0 "故土新政"
 nesnd_qe1_recovery.1.a:0 "以故土重整军伍。"
 nesnd_qe1_recovery.1.b:0 "先把新政推向各地。"
 nesnd_qe1_recovery.1.t:0 "重返故土"
 nesnd_qe1_recovery.1.d:0 "秦军重新控制了河西与关中的道路。故土的归属已经改变，朝廷却仍须决定如何使用这次胜利：以新军继续向东，还是先把新的官署、产业与共同身份扎根于各省。"
 QRC:0 "秦国讨逆军"
 QRC_ADJ:0 "讨逆军"
 QFR:0 "西部诸省联邦"
 QFR_ADJ:0 "西部联邦"
 nesnd_qe1_rebel_army:0 "讨逆军"
 nesnd_qe1_frontier_army:0 "边地新军"
 nesnd_qe1_commander_first:0 "兆毅"
 nesnd_qe1_commander_last:0 "梁"
 dp_nesnd_qe1_civil:0 "秦国权争"
 dp_nesnd_qe1_frontier:0 "西域反秦战争"
 nesnd_qe1_fracture.1.a:0 "向朝廷效忠的军队，听候调遣。"
 nesnd_qe1_fracture.2.a:0 "帝国只剩下最后的疆土。"
 nesnd_qe1_fracture.1.t:0 "朝议之外"
 nesnd_qe1_fracture.1.d:0 "被排除在朝议之外的官员与军人已经集结成军。他们自称讨逆，宣告伊犁已被一派私党控制，要求以武力重新决定帝国的政务。朝廷内部的争执终于走出了官署。"
 nesnd_qe1_fracture.2.t:0 "西部帝国的崩解"
 nesnd_qe1_fracture.2.d:0 "地方官署已经改换旗帜。布哈拉、花剌子模与草原的旧名重新进入军令和税册，各地不再承认伊犁对人丁、土地与征赋的支配。朝廷保住的疆土之外，昔日帝国正在变成彼此争夺的新国家。"
 nesnd_per_future_progress:0 "近西帝国的前途"
 nesnd_per_future_delta_desc:0 "朝廷的部署"
 nesnd_per_future_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100"
 nesnd_per_future_status_choice:0 "朝廷尚未决定与伊犁的关系。"
 nesnd_per_future_status_aid:0 "朝廷已选定求援伊犁、向西经营的方针。"
 nesnd_per_future_status_covert:0 "朝廷的使者正在中亚联络不满伊犁的地方势力。"
 nesnd_per_future_journal:0 "近西帝国的未来"
 nesnd_per_future_journal_reason:0 "唐衣大食的君臣熟悉秦国的军府，也熟悉波斯的商旅与地方家族。近西战争留下了土地和声望，却没有替后人决定帝国的方向：朝廷可以借伊犁的力量向西经营，也可以在西秦的地方纷争中寻找独立扩张的机会。"
 nesnd_per_civil_journal:0 "唐衣之下"
 nesnd_per_civil_journal_reason:0 "军府带来的官制与本地的书院、宗教学校和家族并存。朝廷要使不同出身的官员共同办事，就需要可靠的任官制度，也需要能够训练新人的学堂。"
 nesnd_per_economy_journal:0 "波斯的市镇"
 nesnd_per_economy_journal_reason:0 "棉田、织工与往来商旅维持着波斯的繁荣。朝廷希望用铁路联结产地与市镇，使近西战争得到的土地不仅供养军队，也能养活新的工场。"
 nesnd_per_west_journal:0 "重启远西战争"
 nesnd_per_west_journal_reason:0 "朝廷已把目光投向两河以西。来自秦国的军事传统与波斯的财力将服务于新的扩张，而奥斯曼、埃及及阿拉伯的诸国也会寻找自己的强国援手。"
 nesnd_per_east_journal:0 "近西战争重启"
 nesnd_per_east_journal_reason:0 "伊犁的权威正在受到挑战。朝廷准备沿中亚与印度的道路追求自己的利益，昔日宗主的边疆如今也进入了军府的地图。"
 nesnd_per_seek_aid_button:0 "遣使伊犁"
 nesnd_per_seek_aid_button_desc:0 "请求秦国帮助朝廷整顿官署与军政，为向西扩张准备力量。"
 nesnd_per_subvert_button:0 "联络西秦诸部"
 nesnd_per_subvert_button_desc:0 "结交不满伊犁的地方领袖，准备摆脱宗主并经营东方。"
 nesnd_per_civil_commit_button:0 "整顿官署"
 nesnd_per_civil_commit_button_desc:0 "任用受过训练的官员，把书院与官署的培养连在一起。"
 nesnd_per_economy_commit_button:0 "奖掖工商业"
 nesnd_per_economy_commit_button_desc:0 "支持已有的棉田、织造与铁路，使商路和工场相互接续。"
 nesnd_per_claim_levant_button:0 "申明黎凡特旧权"
 nesnd_per_claim_levant_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_egypt_button:0 "申明尼罗河流域旧权"
 nesnd_per_claim_egypt_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_arabia_button:0 "申明阿拉伯旧权"
 nesnd_per_claim_arabia_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_central_asia_button:0 "申明中亚旧权"
 nesnd_per_claim_central_asia_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_india_button:0 "申明印度西北诸地的权利"
 nesnd_per_claim_india_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_aid_law:0 "伊犁的议法官"
 nesnd_per_aid_building:0 "援建工匠"
 nesnd_per_aid_legitimacy:0 "秦使的认可"
 nesnd_per_claim_cost:0 "边地交涉"
 nesnd_per_civil_order:0 "官署渐整"
 nesnd_per_industry_order:0 "市镇渐兴"
 nesnd_per.1.a:0 "接纳这些援助。"
 nesnd_per.1.t:0 "伊犁的议法官"
 nesnd_per.1.d:0 "秦国派来的官员带来了军府之外的另一种经验。他们与本地书吏共同整理法令，希望使官员、商人和田主不必再为同一件事奔走于几套不同的规矩之间。"
 nesnd_per.2.a:0 "接纳这些援助。"
 nesnd_per.2.t:0 "援建工匠"
 nesnd_per.2.d:0 "随使团而来的工匠已经进入当地工场。他们传授测量、营造与机器维修的方法，也需要本地工人与商人把这些知识变成能够长期经营的产业。"
 nesnd_per.3.a:0 "接纳这些援助。"
 nesnd_per.3.t:0 "秦使入朝"
 nesnd_per.3.d:0 "秦国使者在朝会上确认了对本朝的支持。与伊犁保持联系的军官和商人因此安下心来，朝廷也得以暂时压低反对者的声势。"
 nesnd_per.4.a:0 "向西经营。"
 nesnd_per.4.t:0 "西向之策"
 nesnd_per.4.d:0 "本朝与伊犁已经确定朝贡往来，朝廷也将扩张的方向转向西方。军府准备新的远征，商人则打算沿着军队前进的道路寻找市场。"
 nesnd_per.5.a:0 "近西战争将有新的篇章。"
 nesnd_per.5.t:0 "东方的机会"
 nesnd_per.5.d:0 "联络西秦地方势力的部署已经完成。朝廷准备以自身的名义经营中亚与印度，来自伊犁的号令将不再决定这条道路。"
 nesnd_per.6.a:0 "将照会交予各国。"
