l_simp_chinese:
 FRA_FLAVOR_TEXT: "向第一公民、欧洲进步与文明的保护者路易一世陛下三呼万岁！因为他，田野和山岗恢复了生机。因为他，法国人重新拥有了我们的报纸和心灵。因为他，钢铁铸成的前程在嗡鸣的蒸汽力推动下不断延申。但是，这样英明的皇帝却仍未看到拿破仑开启的欧洲共和时代。他和他的叔父兼养父一样，在人民的主权上安置了不容挑衅的帝权桂冠。迎接这样一个矛盾之国的将是什么呢？"
 
 GBR_FLAVOR_TEXT: "在四面楚歌声中，大不列颠步履阑珊地踏入了法国人的世纪。从新大陆的独立到大革命的恐怖，再到拿破仑的兴起，最后是法兰西-明人同盟的全球封锁。天不佑啊！不列颠尼亚！让命运和病痛随着垂老的威廉王离去吧，不列颠已经不再需要帝国的幻梦，我们将埋头耕耘，静待时机......"
 
 USM_FLAVOR_TEXT: "秦燕明三帝国争霸的南北朝时代已经是昨日黄花，在历史长河里中流击水的襄阳会战也渐渐远去。在改革家郑钦和陈东阳手中重获新生的南明政权已经走入了历史的下一个时代。工业的火车在东南三省嗡鸣作响，伴随着它们的则是更加喧闹和疯狂的论战。这个国家未来将往何处去？人们的诘问，或许最终将在沉寂的杭州别馆中得到回答。"
 
 CNE_FLAVOR_TEXT: "“愿死广大之中夏，不奉裂土之君王。“长安革命青年派的一声声疾呼，最终在时代的炮声隆隆里灰飞烟灭。在辽远的华北大地上，唯有一个胜利者还屹立——那就是牧仲棠和他那不可一世的进步派军事集团。背叛了革命大雅的人们最终苟延残喘于自己的国风。北方共和党人和南方的士绅财阀联合在一起绞杀了他们的统一之梦。失去了理想的人们不再奉献，只留下残缺不全的土地改革，让帝国的将来更加扑朔迷离......"
 
 QE1_FLAVOR_TEXT: "尽管帝国高层仍传唱着”赳赳老秦，共赴国难“的激昂歌曲，西秦人仍不能改变自己被历史无情抛弃的事实。自陈德建军西北以来四百多年，这个强盛的大陆帝国一度最接近中国天命，却在更加洪亮而伟大的革命班车面前撞得粉碎。仅存的希望也在1822年的敦煌会战中被华朝将领张百里的马蹄碾为尘埃。侥幸存在下去的西部帝国必须要正视现实、锐意变法，才能在后南北朝的时代龙卷中重振旗鼓。"
 
 HUS_FLAVOR_TEXT: "资本的奇迹不仅属于世界上的列强，也属于那些真正愿意追求理想和正义的自由人民。1644年的勇敢起义缔造了华夏东洲。尔后二十年，孙承宗、李成梁和努尔哈赤的子孙们从一隅之地解放了整个东洲西岸。随着洛阳、西安两次国内起义的失败，东方的国人共和主义者愈加倚重这个一度被视为蛮夷女真国家的政权。只要他们能够真正确立自己的大陆霸权，东洲的未来就必是不可限量。"
 
 SIH_FLAVOR_TEXT: "蜀藩主刘忠明曾也不过是一庶人，只是因为明朝南府掌权人郑钦需要一个压制西府川军的人才登上王位。因此，他的统治战战兢兢，束手束脚。让这个一度在北明和革命战乱中独善其身的地方错失了在动荡时代进一步发展的机会。但如今，天下之间的争斗只是暂时停止，还不是偃旗息鼓。川蜀之地的豪杰们只要勇于任事，在新一轮的机遇中就少不了他们的位置。"
 
 HNA_FLAVOR_TEXT: "朱班博战死，郑雕锦贬谪，叶银漕归隐，李汉涵东归，林则徐外放。曾被视为新政、国人共和与新西府进步集团核心的楚国迅速地衰落着，在南府郑氏的政治攻势下逐渐瓦解。聚集德望、忠贞、勇气的朱绛臣势单力孤，无能阻止这一切。但他并不是全然已经输了。在政治上的勇敢一跃，或是其他的手段，也许能够挽回共和与人民在大明的局面。"
 
 JAP_FLAVOR_TEXT: "曾几何时，辉煌的丰臣幕府东定战国，北破高丽，西援大国，南访诸岛。创造了我日本历史上绝无仅有的辉煌时代。然而，随着吴国郑氏一门逐渐从对等盟友成长为唐土明国的天下人，日本的地位开始岌岌可危了。在过去的一百年间，我们的土地和财富在不断被蚕食。甚至丢失了整个九州岛。东方上国的野心逐渐显然的这个时代，久负盛名的太阁幕府还能在历史的风暴中稳定日本的航向吗？"
 
 GNG_FLAVOR_TEXT: "宗族、忠贞、圣人教诲。在朱姓淮国立足于西南偏僻之地的数百年来，这些准则为我们在曾经穷困野蛮的山林荒野中开拓，最终建立起令天下侧目的富足强盛之国。然而，这样的藩国割据一方或许可以，但在北明结束之后的新时代却远远不够。淮土西藩从不缺英雄人物，但要在工业和革命的时代前进到更遥远的地方，我们需要比英雄更本质和伟大的精神力量。"
 
 PHI_FLAVOR_TEXT: "林则徐和吕宋都曾经是南明的模范。一个是改革先锋、襄阳英雄朱班博的学生，一度作为湖广总督执掌天下名镇。另一个则曾经是支撑整个吴藩乃至南明一步步巩固江南半壁，并首推科举代议的王业基础。但如今，昔日的新星被南府郑氏打压流放，曾经的基业则在时光中缓慢腐烂。等待着他们的究竟是怎样的未来？"
 
 YN1_FLAVOR_TEXT: "远南是大明最偏远的行都司，比他更遥远的地方可能是还不入流的昆仑洲（南非）。但远南却也是中国人最早看中的海外仙山。不仅广袤的土地上生长着许多令郎中和学士们兴奋的奇珍异草和新动物，更在过去的二百多年中成长为南明重要的铅、铁矿区。纵使那炎热的内陆沙漠阻滞了定居屯垦的进程，但随着技术进步和中原乱局，远南作为海外乐土的价值必将不断提升。"
 
 SHA_FLAVOR_TEXT: "冰天雪地之中，中华大地上唯一的共和派国家遗世独立。它是一群逃亡的人们覆灭了本土的齐国贵胄残党后建立的崭新国家。享国至今不过二十余年。在这几乎被人类遗忘的世界边缘，他们能够让国人共和的宣告穿透狂风与暴雪，抵达希望的彼岸吗？抑或是一切都不过是再次重复了西秦长安大革命的琉璃幻景？"
 
 PER_FLAVOR_TEXT: "高昌李氏的传奇在大陆上无人不晓。他们源于元代汉军世侯，在浩罕和希瓦之间作为军阀为蒙古和汉人的征服者们效力。最终凭借与旧伊尔汗和一些穆斯林贵族的联姻获得了秦国安西军府的亲睐。使之得以带着秦军和部分穆斯林军阀主宰伊朗全土。虽然波斯民众早已对各类民族的统治和征服习以为常，李氏家族却不能只考虑眼下的仅存。作为一个真正的西秦后裔和先知的忠贞追随者，他们应当对自己的王朝和统治有着更为宏伟和正义的愿景。"
 
 MUG_FLAVOR_TEXT: "莫卧儿王朝曾是伊斯兰世界对抗东方孔门、佛教追随者的坚实堡垒，其统治王朝更参与过全部四次对西秦的”正义吉哈德“。但大帝国不能仅靠历史的辉光存在下去。其死亡往往就是由历史的厚重压得粉碎。如今的莫卧儿就是这样一个过去多于未来的国度。腐败、酒精、鸦片、外国干涉和南方的明朝殖民地。这一切都让莫卧儿的突厥-蒙古统治集团以一种前所未有的历史速度滑向失败的一方。或许他们应该进一步倚重法国的帮助，以对抗日益膨胀的东方天朝，抑或完全相反，乃至自力更生。但是历史不会给他们斟酌的时间......"
 

