l_simp_chinese:
 nesnd_india_schools:0 "教育规范化"
 nesnd_india_schools_reason:0 "在[ROOT.GetCountry.GetName]，上过学并不等于你就能从事文化工作。清真寺附设的经学校、神庙的学堂和乡间的私人教师，各按自己的课程和教材授课。这在过去并不是什么问题。但如果[ROOT.GetCountry.GetName]想要成为一个独立自主的现代国家，就不能只有会读经书的官员和挥舞刀枪的贵族。我们需要的是复式记账法、金融专家、工程管理人员……一切管理和发展工业社会所需要的人才——这些技能现在只能在印度之外的大国里学习。如若不然，我们即使驱逐了眼前的殖民者，也还是被“外国人”控制的国度。"
 nesnd_india_school_service:0 "学校出身的官员"
 nesnd_india_industry:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_india_industry_name')]"
 nesnd_india_industry_reason:0 "[ROOT.GetCountry.GetName]军中的步枪、火炮和弹药多从外国购买，价格和交货期限都由卖方决定。一旦卖方停止供货，[ROOT.GetCountry.GetName]的军队便无从补充。"
 nesnd_india_industrial_service:0 "本国军工"
 nesnd_india_request_4:0 "请求提高自治"
 nesnd_india_society:0 "谁代表国家"
 nesnd_india_society_reason:0 "民族主义的思想传进了印度，[ROOT.GetCountry.GetName]的臣民开始追问：这个国家究竟属于谁？在旧帝国的传统里，国家属于王朝，王公与臣民各安其位。新式学校培养出来的一代人却相信国家属于全体国民，应当由国民选出的代表说话，其中激进的人更认定王冠本身就是障碍。境内操各种语言的印度各族都关注这场争论，争论的结果关系到他们在这个国家里能否被承认为国民。"
