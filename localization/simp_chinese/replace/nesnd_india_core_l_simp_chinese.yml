 nesnd_india_caste:0 "“官制”改革"
 nesnd_india_caste_reason:0 "在[ROOT.GetCountry.GetName]，一个人能做什么官、操什么业，多半在他出生时就定下了。少数几个高等种姓的子弟世代把持着政府里的职位，$shudras$和$dalit$即使受过教育，也很少能获得任用，更不用说那些因为欠债而被束缚在土地上的人。人权的学说传进来以后，改革派要求官职向全体国民开放，按学识而不按出身授予。宗教界的人士坚持种姓是神定的秩序，只要他们还在政府里，任何改革都可能被推翻。"
 nesnd_india_equal_service:0 "按学识任官"
 nesnd_india_princes:0 "诸邦之间"
 nesnd_india_princes_reason:0 "[ROOT.GetCountry.GetName]是印度众多土邦之一。莫卧儿皇帝仍以全印度的共主自居，法国人和明朝人直接统治着沿海和南方的许多州，不少土邦已经成了他们的附属国。宫廷中有人主张归附帝国，换取王公的年金，并保住本邦的税收和军队。另一些人主张借助邻邦或外国的资金兴办新式事业，使本邦逐步自立。"
