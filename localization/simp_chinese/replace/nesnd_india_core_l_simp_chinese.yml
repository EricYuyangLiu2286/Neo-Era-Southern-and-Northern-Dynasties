 nesnd_india_indep_goal_autonomy:0 "当前目标是取得自行发起[concept_diplomatic_play]的权利。\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_goal_independence:0 "当前目标是独立。\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_lord_counts:0 "[concept_liberty_desire]达到 75 的属邦有 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_above_75')|0] 个，其中达到 90 的有 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_above_90')|0] 个。\n国内受资助的[concept_political_movement]有 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_funded_count')|0] 个。\n本国境内印度文化的文化少数政治运动有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_indian_movements_count')|0]#! 个，其中受[concept_subject]资助的有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_indian_funded_count')|0]#! 个。"
 nesnd_india_indep_lord_status:0 "$nesnd_india_indep_lord_counts$\n独立倾向最高的属邦是[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetName]。\n[concept_liberty_desire]为#tooltippable;tooltip:[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetTooltipTag],liberty_desire_factors_tt #v [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetLibertyDesireRaw|0]#!（#blue [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetWeeklyLibertyDesireChange|2]#!/周）#!\n对[concept_overlord]的[concept_economic_dependence]：[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetEconomicDependenceOn(ROOT.GetCountry.Self)]。\n$lobby_pro_overlord$：[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetCustom('nesnd_india_indep_pro_presence')]。$lobby_anti_overlord$：[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetCustom('nesnd_india_indep_anti_presence')]。\n最近案卷[ROOT.GetCountry.GetCustom('nesnd_india_indep_cases')]"
