 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName]是[ROOT.GetCountry.GetOverlord.GetName]的附属国，两国之间有一份旧约。按照旧约，帝国政府名下的工厂可以作价卖给宗主国政府，日后也可以由帝国出钱赎回，只是赎回的价钱比卖出时高出六成。帝国的大臣们把出售工厂视为应急筹款的办法。主张独立的人则表示反对，认为这些产业一旦归宗主国所有，帝国的经济也就更受宗主国控制。"
