 nesnd_tianzhu_governance:0 "天竺的庶务"
 nesnd_tianzhu_governance_reason:0 "天竺的商人熟悉海上贸易，内地的田赋与地方公事则多由王公和村社经手。宣慰使受命治理港口、供养驻军，若要把学校和税政推行到乡村，还必须取得地方的合作。"
 nesnd_yuanshan_commission:0 "筹建远山宣慰司"
 nesnd_yuanshan_commission_reason:0 "远山的港口面向两洋，也是[ROOT.GetCountry.GetName]船队进入非洲腹地的起点。南京有意在这里另设宣慰司，就近统辖当地军政，前提是先在远山站稳脚跟。"
 nesnd_yuanshan_governance:0 "远山的庶务"
 nesnd_yuanshan_governance_reason:0 "远山的港口已经成为两洋航路上的据点，腹地的治理刚刚开始。道路、税务和学校要随驻军一同建立，宣慰司的政令才能从沿海走进腹地。"
 nesnd_india_foreign:0 "出使求援"
 nesnd_india_foreign_reason:0 "[ROOT.GetCountry.GetName]要兴办学校、开设工坊、训练新式军队，却缺少教师、工程师和教官，也缺少资金。[concept_overlord]或外国政府可以派来顾问，再提供一笔拨款。接受了这份帮助，我国就欠下了出资国的人情。"
 nesnd_india_uprising:0 "举事的烽火"
 nesnd_india_uprising_reason:0 "大明联邦和它的天竺宣慰司依靠港口、驻军和当地盟友维持统治。反对它们的地方组织要公开举事，需要外来的经费和支持。[ROOT.GetCountry.GetName]资助他们，是为了让这些地方脱离大明联邦，由当地人自己治理。"
 nesnd_india_contact_bar:0 "当地筹备"
 nesnd_india_imperial_army:0 "莫卧儿帝国军"
 nesnd_tianzhu_commission_name:0 "天竺宣慰司"
 nesnd_establish_tianzhu:0 "设立天竺宣慰司"
 nesnd_establish_tianzhu_desc:0 "天竺距南京万里，政府拟设天竺宣慰司，由宣慰使就地统辖当地军政。"
 nesnd_establish_tianzhu_tt:0 "将本国在$region_north_india$、$region_south_india$与$STATE_INDIAN_OCEAN_TERRITORY$的全部直辖州划归天竺宣慰司，结为[concept_dominion]。$STATE_MADRAS$仍属本国时以其为宣慰司首府，否则以人口最多的[concept_state]为首府。本国的[concept_subject]国不受影响。"
 nesnd_yuanshan_commission_name:0 "远山宣慰司"
 nesnd_establish_yuanshan:0 "设立远山宣慰司"
 nesnd_establish_yuanshan_desc:0 "远山距南京遥远，政府拟任命宣慰使，就地统辖当地军政。"
 nesnd_establish_yuanshan_tt:0 "将本国在南非的全部直辖州划归远山宣慰司，结为[concept_dominion]。$STATE_ZULULAND$仍属本国时以其为宣慰司首府，否则以人口最多的[concept_state]为首府。各[concept_subject]国的领土不变。"
