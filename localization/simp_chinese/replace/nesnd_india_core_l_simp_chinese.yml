 # Independence
 nesnd_india_indep:0 "谋求独立"
 nesnd_india_indep_reason:0 "[ROOT.GetCountry.GetName]要掌握自己的财政和军队，以主权国家的身份同别国订约。为争取独立，我国可以扶持国内的$lobby_anti_overlord$，把工业筹款拨入本国的[concept_investment_pool]，暗中接济[concept_overlord][ROOT.GetCountry.GetOverlord.GetName]国内的[concept_political_movement]，或者私储本国工厂生产的军械。宗主国若查明款项的来路或查获军械，可能会追究我国政府的责任。"
 nesnd_india_indep_conclusion:0 "[ROOT.GetCountry.GetName]已取得独立。"
 nesnd_india_indep_overlord:0 "属邦动向"
 nesnd_india_indep_overlord_reason:0 "[ROOT.GetCountry.GetName]在印度的属邦仍掌管着一部分税收和军队。有的属邦会从自己的收入中拨款，或从本国工厂调拨军需，暗中接济我国的[concept_political_movement]。一旦查明钱物的来路，我国若要追究，就须向出资的属邦政府交涉。"
 nesnd_india_indep_market_threshold:0 "[concept_liberty_desire]达到 25，可以向掌管本国市场的直属[concept_overlord]$request_market_control$。\n"
 nesnd_india_indep_thresholds:0 "[concept_liberty_desire]为#tooltippable;tooltip:[ROOT.GetCountry.GetTooltipTag],liberty_desire_factors_tt #v [ROOT.GetCountry.GetLibertyDesireRaw|0]#!（#blue [ROOT.GetCountry.GetWeeklyLibertyDesireChange|2]#!/周）#!\n[ROOT.GetCountry.GetCustom('nesnd_india_indep_market_line')][concept_liberty_desire]达到 75，可以请求提高自治。\n达到 90，可以发起独立博弈。\n对[concept_overlord]的[concept_economic_dependence]：[ROOT.GetCountry.GetEconomicDependenceOn(ROOT.GetCountry.GetOverlord.Self)]。\n$lobby_pro_overlord$：[ROOT.GetCountry.GetCustom('nesnd_india_indep_pro_presence')]。$lobby_anti_overlord$：[ROOT.GetCountry.GetCustom('nesnd_india_indep_anti_presence')]。\n已储军械 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_stores')|0] 批。"
 nesnd_india_indep_goal_protectorate:0 "当前目标是升为[concept_protectorate]。\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_goal_autonomy:0 "当前目标是取得自行发起[concept_diplomatic_play]的权利。\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_goal_independence:0 "当前目标是独立。\n$nesnd_india_indep_thresholds$"
 nesnd_india_indep_lord_counts:0 "[concept_liberty_desire]达到 75 的属邦有 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_above_75')|0] 个，其中达到 90 的有 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_above_90')|0] 个。\n国内受资助的[concept_political_movement]有 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_indep_funded_count')|0] 个。"
 nesnd_india_indep_lord_status:0 "$nesnd_india_indep_lord_counts$\n独立倾向最高的属邦是[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetName]。\n[concept_liberty_desire]为#tooltippable;tooltip:[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetTooltipTag],liberty_desire_factors_tt #v [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetLibertyDesireRaw|0]#!（#blue [ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetWeeklyLibertyDesireChange|2]#!/周）#!\n对[concept_overlord]的[concept_economic_dependence]：[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetEconomicDependenceOn(ROOT.GetCountry.Self)]。\n$lobby_pro_overlord$：[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetCustom('nesnd_india_indep_pro_presence')]。$lobby_anti_overlord$：[ROOT.GetCountry.MakeScope.Var('nesnd_india_indep_leader').GetCountry.GetCustom('nesnd_india_indep_anti_presence')]。\n最近案卷[ROOT.GetCountry.GetCustom('nesnd_india_indep_cases')]"
