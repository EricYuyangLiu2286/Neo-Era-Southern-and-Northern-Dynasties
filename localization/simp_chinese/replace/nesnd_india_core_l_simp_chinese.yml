 nesnd_india_community_empty_tt:0 "国民共同体降到 #v 0#!"
 nesnd_india_society_formed_conclusion:0 "各省的受教育者已经承认彼此同属一个国家。"
 nesnd_india_society_broken_conclusion:0 "各省的人们不再承认自己同属一个国家。"
 nesnd_india_community_broken:0 "共同体破裂"
 nesnd_india_community_broken_radicals_tt:0 "我国每个州里，不属于我国主体文化的南亚文化人口，其中 #r 10%#! 成为[concept_radical]。"
 nesnd_india_core.2_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n•王朝宪章（须为君主制）：[concept_legitimacy]永久 #g +5#!，开始「$nesnd_india_dynasty_journal$」。\n•共和安排：[ROOT.GetCountry.GetInterestGroupOfType('ig_intelligentsia').GetName]五年内满意，十年内[concept_enactment_success]几率提高。#!"
 nesnd_india_core.2.t:0 "谁代表这个国家"
 nesnd_india_core.2.d:0 "各省的报纸、学会和议事会争论多年以后，[ROOT.GetCountry.GetName]的受教育者已经接受，他们同属一个国家。下一个问题是这个国家由谁代表。拥戴王朝的人要求由皇室颁布宪章，把各省的权利写进去。知识分子和城市里的新派人士则要求按共和的办法安排政府，由选出的代表议定法律。"
 nesnd_india_core.2.f:0 "“我们同属一国。这个国家由谁代表，现在必须定下来。”\n——一份学会宣言"
 nesnd_india_core.2.a:0 "由皇室颁布宪章。"
 nesnd_india_core.2.a_tt:0 "「$nesnd_india_dynasty_journal$」已经开始，或者条件尚未满足，无须另开。"
 nesnd_india_core.2.b:0 "按共和的办法安排政府。"
 nesnd_india_dynastic_charter:0 "王朝宪章"
