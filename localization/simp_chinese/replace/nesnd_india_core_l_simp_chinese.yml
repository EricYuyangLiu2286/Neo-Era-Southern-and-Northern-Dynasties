 nesnd_india_landowners_pleased:0 "地方特权得保"
 nesnd_india_reform_lapsed:0 "改革中辍"
 nesnd_india_intelligentsia_dismayed:0 "改革中辍"
 nesnd_india_back_empire_lobby_tt:0 "该国已有亲近我国的[concept_political_lobby]时，这个游说团更受安抚。没有时，该国最强的、未加入任何游说团的[concept_interest_group]组成一个亲近我国的游说团。"
 nesnd_india_core.1_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n•集权：得到永久修正「$nesnd_india_reform_central$」，[ROOT.GetCountry.GetInterestGroupOfType('ig_landowners').GetName]五年内不满。日后「$nesnd_india_order$」开始时，三件事都先由中央管。\n•分权：[ROOT.GetCountry.GetInterestGroupOfType('ig_landowners').GetName]五年内满意。我国每个[concept_subject]对我国的[concept_relations] +20，并在其国内扶持一个亲近我国的[concept_political_lobby]。日后「$nesnd_india_order$」开始时，三件事都先由地方管。#!"
 nesnd_india_core.1.t:0 "改革既成"
 nesnd_india_core.1.d:0 "各省的学校已经开学，[ROOT.GetCountry.GetName]的工场也造出了自己的枪炮。新学校的毕业生和新式军队都等着朝廷安排去处。一派大臣主张把赋税、军队和学务都收归中央，由朝廷委派官员治理各省。地主和各邦王公则要求维持旧日的地方权利，由他们在本地出钱办事，朝廷只问结果。"
 nesnd_india_core.1.f:0 "“各省的事务，今后由谁做主？”\n——呈送朝廷的奏议"
 nesnd_india_core.1.a:0 "政令出于中央。"
 nesnd_india_core.1.a_tt:0 "日后「$nesnd_india_order$」开始时，税收、军队与外交、学校与官职三件事都先由中央管。"
 nesnd_india_core.1.b:0 "各邦自理本地事务。"
 nesnd_india_core.1.b_tt:0 "日后「$nesnd_india_order$」开始时，税收、军队与外交、学校与官职三件事都先由地方管。"
 nesnd_india_society_ended_tt:0 "国民共同体尚未成形，也尚未破裂"
