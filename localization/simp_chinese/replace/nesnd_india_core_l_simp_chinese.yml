 nesnd_tianzhu_governance:0 "天竺的庶务"
 nesnd_tianzhu_governance_reason:0 "天竺大陆广大富饶有类中原，但自古以来教派林立、民族争衡，并由此创造了许多治理难题。即使在天朝治下也是如此。国家在天竺建立[ROOT.GetCountry.GetName]，正是要在这片遥远但富庶的土地上榨取更多的利润。要做好这份工作，我们就必须逐步瓦解并重建天竺土著既有的贵族、村社治理体系，甚至帮助当地人建立现代化的法治机关。相信在我们帮助下建立的行政系统和新印度精英会比那些阳奉阴违的土邦君更好地服务我们……"
 nesnd_yuanshan_commission:0 "筹建远山宣慰司"
 nesnd_yuanshan_commission_reason:0 "远山之地处于昆仑洲极南点，不仅被文人们视为东西方世界交汇之处，也是事实上非常重要的跨洋航行补给站。考虑到它的位置和农业条件，这里也可以成为[ROOT.GetCountry.GetName]进入非洲腹地的殖民立足点。为了更好地治理和建设这个远离南京的重要殖民地，朝廷应当新设宣慰使司就近统辖当地军政。"
 nesnd_yuanshan_governance:0 "远山的庶务"
 nesnd_yuanshan_governance_reason:0 "管理一个距离本土万里之遥的殖民地不是简单的事情，更何况南京朝廷对我们期许甚多。我们不仅要为水师跨洋建立仓储，要为深入内陆的拓荒军民提供保障，还要开设屯田、种植园和工坊为殖民活动牟利——毕竟朝廷的税和投资人的分红不能短少。要做到这些，只靠只会塞红包的商号掌柜和阳奉阴违的新地主可不行，一套完备且自行运转的行政体系和基础设施是不可或缺的。"
 nesnd_india_foreign:0 "出使求援"
 nesnd_india_foreign_reason:0 "为了让[ROOT.GetCountry.GetName]在新时代存活下来，我们必须进行坚决的改革和建设。但在工商业上，本土投资者显然过于保守且缺乏经营现代产业的经验。而在其他国家事务，譬如军政、教育的规范上我们更是缺乏哪怕最基础的了解。当然，独立的人不害怕从零开始，但如果能够有“好心人”的帮助，我们说不定可以事半功倍……"
 nesnd_india_uprising:0 "诸邦的独立运动"
 nesnd_india_uprising_reason:0 "中国来的“明人”和欧洲来的“法兰克人”在印度大肆圈地。一开始仅仅是商团的这些外族如今已经成长为所有印度邦国的威胁。当然，对于许多土邦君来说，他们和过去曾见过的波斯人、拉普杰特人、伽色尼人，或者现在仍旧控制着大片土地的蒙兀儿人并无不同。但对意图更大霸业的[ROOT.GetCountry.GetName]来说，这些甚至是从万里之外来的帝国显然是势不两立的竞争者。且必须将他们全部逐出这块次大陆！"
