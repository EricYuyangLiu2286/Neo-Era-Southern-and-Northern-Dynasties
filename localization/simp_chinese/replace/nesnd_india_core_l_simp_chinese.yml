 nesnd_mug_council_intro:0 "[ROOT.GetCountry.GetName]的改革已经完成，政府可以把[concept_princely_state]的王公召到一处，就铁路、赈济或共同防务中的一件事订立共同的约定。王公们来去自便，出席的与我国同享约定的好处，不出席的不受约束。政府也可以在这里邀请王公并入帝国。"
