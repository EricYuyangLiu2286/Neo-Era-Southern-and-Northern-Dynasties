 nesnd_india_schools_reason:0 "首都的学院可以培养一批官员，各省的学务还要靠地方自己承担。地方政府需要会记账的文员，各省学校也必须延聘教师。维持校舍、购置纸张和支付薪俸，都有赖于常年的地方经费。"
