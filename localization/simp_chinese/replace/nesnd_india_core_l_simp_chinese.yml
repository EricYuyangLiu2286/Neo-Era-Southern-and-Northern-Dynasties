 nesnd_india_society_formed_conclusion:0 "[ROOT.GetCountry.GetName]境内的印度各族已把这个国家当作自己的国家。"
 nesnd_india_society_broken_conclusion:0 "[ROOT.GetCountry.GetName]境内的印度各族不再相信这个国家属于他们。"
 nesnd_india_community_broken:0 "国民认同破裂"
 nesnd_india_community_broken_radicals_tt:0 "本国各州中，不属于[Concept('concept_primary_cultures','$concept_primary_culture$')]的印度文化人口有 #r 10%#! 转为[concept_radical]。"
 nesnd_india_core.2_outcome_tt:0 "政府将以王朝宪章或议会立法确认国民的地位。"
 nesnd_india_core.2.t:0 "国民的国家"
 nesnd_india_core.2.d:0 "[ROOT.GetCountry.GetName]境内的印度各族，如今多半已把这个国家当作自己的国家。识字的人越来越多，各地的代表在议会里为本乡本族说话，人们开始以国民自称，而不只是某位王公的臣民。剩下的问题是，用什么来确认这个结果：君主颁给国民的宪章，还是国民的代表自己制定的法律。"
 nesnd_india_core.2.f:0 "“凡生于本国之印度人，无论语言、教派，皆为国民。”\n——宪章草案第一条"
 nesnd_india_core.2.a:0 "颁布王朝宪章"
 nesnd_india_core.2.b:0 "交由议会立法"
 nesnd_india_dynastic_charter:0 "王朝宪章"
 nesnd_india_intelligentsia_pleased:0 "知识界满意"
 nesnd_india_republican_enactment:0 "议会立法"
 nesnd_india_caste_law_lost_tt:0 "曾经实行的$law_freedom_of_conscience$或$law_total_separation$已被废除"
 nesnd_india_caste_reaction_conclusion:0 "宗教界在政府中推翻了改革，官职仍按出身授予。"
 nesnd_india_dynasty_crisis:0 "王朝危机"
 nesnd_india_core.3.t:0 "王朝的危机"
 nesnd_india_core.3.d:0 "国民认同破裂了。境内的印度各族不再相信这个国家属于他们，激进者在各州集会，矛头直指王朝：一个只属于皇帝和贵族的国家凭什么要求他们效忠？宫廷必须决定，是交出权力、准许议会里的激进派推进所谓“共和制度”，还是把这场风潮镇压下去。"
 nesnd_india_core.3.f:0 "“国家属于国民，不属于王座！”\n——各州集会的标语"
 nesnd_india_core.3.a:0 "向共和让步"
 nesnd_india_core.3.a_tt:0 "本国已经实行$law_presidential_republic$。"
 nesnd_india_core.3.b:0 "镇压风潮"
 nesnd_india_unified_claims_tt:0 "我们对首都不在印度的国家所领有的每一个印度州提出[concept_claim]。"
 nesnd_india_unified_fervor_tt:0 "本国的南亚[Concept('concept_primary_cultures','$concept_primary_culture$')]的[concept_fervor]目标长期提高。"
 nesnd_india_unified_fallen:0 "建制倾覆"
 nesnd_india_core.6.t:0 "建制倾覆"
 nesnd_india_core.6.d_subject:0 "[ROOT.GetCountry.GetName]沦为别国的附属国。全国政府的法令甚至无法离开都城，那些对外国人统治的印度州提出的宣称，也就成了一纸空文。"
 nesnd_india_core.6.d_seat:0 "[ROOT.GetCountry.GetName]失去了建制时的都城所在的地区。政府陷入混乱，那些对外国人统治的印度州提出的宣称，也就成了一纸空文。"
 nesnd_india_core.6.f:0 "“本国政府对外国所属印度各州提出的宣称，即日起一律撤回。”\n——外交部的通告"
 nesnd_india_core.6.a:0 "收拾残局"
 nesnd_india_core.6.a_tt:0 "建制时提出的宣称全部撤回。"
 nesnd_india_core.4_outcome_tt:0 "帝国将逐一决定各附属邦的去留。"
 nesnd_india_core.4.t:0 "附属邦的去留"
 nesnd_india_core.4.d:0 "税收、兵权和学制都已归于中央，[SCOPE.sCountry('india_annex_candidate').GetName]的王公手里只剩下一个名号。帝国可以把这个邦正式并入，也可以让该邦保留附属国的地位。"
 nesnd_india_core.4.f:0 "“本邦一切政务，今后悉归帝国。”\n——并入诏书的草案"
 nesnd_india_core.4.a:0 "并入帝国"
 nesnd_india_core.4.b:0 "保留现状"
 nesnd_india_core.4.b_tt:0 "[SCOPE.sCountry('india_annex_candidate').GetName]仍是帝国的附属国。"
