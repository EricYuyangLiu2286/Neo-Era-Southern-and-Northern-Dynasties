 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName]是[ROOT.GetCountry.GetOverlord.GetName]的[ROOT.GetCountry.GetSubjectType.GetName]，收入的一部分要交给[ROOT.GetCountry.GetOverlord.GetName]。[ROOT.GetCountry.GetOverlord.GetName]的政府和投资者在我国境内持有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_overlord_levels')|0]#! 级建筑。宫廷缺钱时，可以把本国的一级产业卖给[ROOT.GetCountry.GetOverlord.GetName]政府。有了积蓄，也可以向[ROOT.GetCountry.GetOverlord.GetName]政府买回一级产业。"
 nesnd_mug_france_terms:0 "出售一级产业，对方付 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_sale_price')|K]。买回一级产业，我国付 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_buyback_price')|K]。"
