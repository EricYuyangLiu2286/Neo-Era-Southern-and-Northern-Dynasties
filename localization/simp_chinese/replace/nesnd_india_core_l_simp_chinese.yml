 nesnd_india_core.3.t:0 "王朝危机"
 nesnd_india_core.3.d:0 "各省已不再承认皇室的权威。报纸要求君主退位，地方议事会拒绝以皇帝的名义征税。宫廷里有人主张顺应舆论，由君主交出权力、改行共和。另一些人认为，只要军队和地主仍然站在皇室一边，就能压下这场风潮。"
 nesnd_india_core.3.f:0 "“皇室不能再代表这个国家。”\n——一份地方议事会决议"
 nesnd_india_core.3.a:0 "君主退位，改行共和。"
 nesnd_india_core.3.a_tt:0 "我国已是[GetLawType('law_presidential_republic').GetName]。"
 nesnd_india_core.3.b:0 "调动军队，压下风潮。"
 nesnd_india_unified_claims_tt:0 "首都在$region_north_india$与$region_south_india$以外的国家所持有的每个印度州，我国都对其提出[concept_claim]。"
 nesnd_india_unified_fervor_tt:0 "我国主体文化中每个南亚文化的[concept_fervor]目标 #g +10#!。"
 nesnd_india_unified_fallen:0 "新秩序瓦解"
 nesnd_india_core.6.t:0 "新秩序瓦解"
 nesnd_india_core.6.d:0 "[ROOT.GetCountry.GetName]统一各省时立下的新秩序已经守不住了。首都所在的地区落入他人之手，或者我国已经成为别国的[concept_subject]。我国再也无力主张对外国所持印度各州的权利。"
 nesnd_india_core.6.f:0 "“统一的诺言已不能兑现。”\n——政府公告"
 nesnd_india_core.6.a:0 "撤回主张。"
 nesnd_india_core.6.a_tt:0 "撤回「$nesnd_india_unified$」完成时我国提出的全部[concept_claim]。"
 nesnd_india_core.4_outcome_tt:0 "我国的每个成员国各问一次：#indent_newline:3 \n•并入：该国并入我国。\n•保留：该国仍为[concept_subject]。#!"
 nesnd_india_core.4.t:0 "并入还是保留"
 nesnd_india_core.4.d:0 "十年来，[SCOPE.sCountry('india_annex_candidate').GetName]的赋税、军队和学校都由我国管理，它的王公只保留了名义。朝中有人提议把它直接并入[ROOT.GetCountry.GetName]，由朝廷委派官员治理。也有人认为保留它的王公更省事，王公的家族在当地仍有声望。"
 nesnd_india_core.4.f:0 "“名义上的邦，还要保留多久？”\n——呈送朝廷的奏议"
 nesnd_india_core.4.a:0 "并入[SCOPE.sCountry('india_annex_candidate').GetName]。"
 nesnd_india_core.4.b:0 "保留它的王公。"
 nesnd_india_core.4.b_tt:0 "[SCOPE.sCountry('india_annex_candidate').GetName]仍为我国的[concept_subject]。"
