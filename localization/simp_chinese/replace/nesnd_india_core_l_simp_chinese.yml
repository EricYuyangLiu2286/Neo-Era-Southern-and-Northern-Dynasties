 nesnd_india_reform:0 "学务与实业"
 nesnd_india_reform_reason:0 "莫卧儿的旧帝国曾靠君主的声望维系各省。法兰西的商人与教官带来了资本和新式兵器，法兰西的投资者也随之在各省置下了产业。[ROOT.GetCountry.GetName]希望以各省赋税兴办自己的学校和工场，逐步培养自己的教员与军械工匠。"
