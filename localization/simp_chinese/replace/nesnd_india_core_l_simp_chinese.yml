l_simp_chinese:
 nesnd_india_schools:0 "教育规范化"
 nesnd_india_schools_reason:0 "在[ROOT.GetCountry.GetName]，上过学并不等于你就能从事文化工作。清真寺附设的经学校、神庙的学堂和乡间的私人教师，各按自己的课程和教材授课。这在过去并不是什么问题。但如果[ROOT.GetCountry.GetName]想要成为一个独立自主的现代国家，就不能只有会读经书的官员和挥舞刀枪的贵族。我们需要的是复式记账法、金融专家、工程管理人员……一切管理和发展工业社会所需要的人才——这些技能现在只能在印度之外的大国里学习。如若不然，我们即使驱逐了眼前的殖民者，也还是被“外国人”控制的国度。"
 nesnd_india_school_service:0 "各省学校"
 nesnd_india_industry:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_india_industry_name')]"
 nesnd_india_industry_reason:0 "军队用的枪炮若都要向外国购买，[ROOT.GetCountry.GetName]的军备就始终受制于人。本国要先有煤、铁、工具和钢，或者能在市场上以平价买到，再由兵工厂把它们造成枪炮，由铁路运到各地驻军。兵工厂开工盈利，军队也扩充起来，才算有了自己的重工业。"
 nesnd_india_industrial_service:0 "帝国工场"
 nesnd_india_request_4:0 "商议自治"
 nesnd_india_society:0 "谁代表国家"
 nesnd_india_society_reason:0 "[ROOT.GetCountry.GetName]的各省有自己的语言、信仰和旧日王公。同在一国之下，人们并没有因此把彼此看作同胞。随着学校与城市的发展，受过教育的人开始争论谁有权代表这个国家：王朝、地方领袖，还是新兴的国民运动。"
