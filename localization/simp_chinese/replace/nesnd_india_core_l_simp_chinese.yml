 nesnd_india_owned_by_our_government:0 "归我国政府所有"
 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName]是[ROOT.GetCountry.GetOverlord.GetName]的[ROOT.GetCountry.GetSubjectType.GetName]，收入的一部分要交给[ROOT.GetCountry.GetOverlord.GetName]。[ROOT.GetCountry.GetOverlord.GetName]的政府和投资者在我国境内持有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_overlord_levels')|0]#! 级建筑。宫廷缺钱时可以向[ROOT.GetCountry.GetOverlord.GetName]借款，有了积蓄也可以出钱赎回附属关系。赎回只结束附属关系，外国在我国境内的建筑产权不在其内。"
 nesnd_mug_france_terms:0 "借款以 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|K] 为限，五年内付回 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|K]。担保是：还款期间我国陷入[concept_default]或宣布[concept_bankruptcy]，即为违约。担保条款要求我国给予对方十年[concept_trade_privilege]。$nesnd_india_own_markets_tt$。若无法签署该条约，两国[concept_relations]下降。赎回附属关系的价钱是 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|K]。"
 nesnd_mug_council_intro:0 "[ROOT.GetCountry.GetName]的改革已经完成，政府可以把土邦的王公召到一处，就铁路、赈济或共同防务中的一件事订立共同的约定。王公们来去自便，出席的与我国同享约定的好处，不出席的不受约束。"
 nesnd_india_overseas_button_trade_tt:0 "接着从这一方向的当地政府中选择交涉对象，按与我国的[concept_relations]排列，至多列出四个。对方同意后，两国签订[concept_treaty]，[concept_binding_period]十年，我国在签约时一次付给对方 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_payment')|K]。"
 nesnd_india_overseas_button_port_tt:0 "接着从这一方向的当地政府中选择交涉对象，按与我国的[concept_relations]排列，至多列出四个。对方同意后，两国签订[concept_treaty]，[concept_binding_period]十年，我国在签约时一次付给对方 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_port_payment')|K]。这份条约不设到期日。"
 nesnd_india_overseas_no_such_treaty_trade_tt:0 "我国现在没有从对方取得[concept_trade_privilege]的条约"
 nesnd_india_overseas_no_such_treaty_port_tt:0 "我国现在没有从对方取得[concept_treaty_port]的条约"
 nesnd_india_overseas_record_free_trade_tt:0 "对方没有经由「$nesnd_india_overseas$」把[concept_trade_privilege]给予别国"
 nesnd_india_overseas_record_free_port_tt:0 "对方没有经由「$nesnd_india_overseas$」把[concept_treaty_port]让给别国"
 nesnd_india_overseas_port_named_1_tt:0 "对方将让出[SCOPE.sState('india_overseas_port_1').GetName]作我国的[concept_treaty_port]。在对方这一方向可以让出的州里，这个州人口最多。"
 nesnd_india_overseas_port_claimed_1_tt:0 "[SCOPE.sState('india_overseas_port_1').GetName]有别国的[concept_claim]，或在「$nesnd_per_west_journal$」的目标之中。这不妨碍我国提出请求。"
