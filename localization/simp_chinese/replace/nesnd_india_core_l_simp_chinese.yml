 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName]是[ROOT.GetCountry.GetOverlord.GetName]的[ROOT.GetCountry.GetSubjectType.GetName]，收入的一部分要上缴[ROOT.GetCountry.GetOverlord.GetName]。[ROOT.GetCountry.GetOverlord.GetName]的政府和商人在我国境内置下了许多产业。宫廷缺钱时，可以把本国的产业卖给[ROOT.GetCountry.GetOverlord.GetName]政府。[concept_gold_reserves]充足时，也可以把它们买回来。"
