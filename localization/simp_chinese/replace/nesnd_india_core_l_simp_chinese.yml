 nesnd_india_reform_central:0 "中央主导的改革"
 nesnd_india_landowners_slighted:0 "地主受冷落"
 nesnd_india_landowners_pleased:0 "地主称便"
 nesnd_india_reform_lapsed:0 "改革中辍"
 nesnd_india_intelligentsia_dismayed:0 "改革派失望"
 nesnd_india_back_empire_lobby_tt:0 "该国支持[ROOT.GetCountry.GetName]的$lobby_pro_overlord$[concept_political_lobby_appeasement] #g +4#!。若还没有这样的[concept_political_lobby]，就由一个尚未加入任何游说团的[concept_interest_group]组建。"
 nesnd_india_core.1_outcome_tt:0 "两项改革均已完成。政府将决定改革由中央统一推行，还是交由各邦自行办理。"
 nesnd_india_core.1.t:0 "改革的归属"
 nesnd_india_core.1.d:0 "学校和兵工厂都已办起来了。[ROOT.GetCountry.GetName]的大臣们主张乘势把税收、兵权和学校一并收归中央，由帝国统一拨款、统一考选官员。各地的地主和附属于帝国的王公们则要求各邦保持高度自治，帝国的官员收税练兵即可，不要插手地方事务。"
 nesnd_india_core.1.f:0 "“请将新办学校与兵工厂的经费、人事一并归于中央，由帝国统一考选、统一拨款。”\n——呈交皇帝的建言书"
 nesnd_india_core.1.a:0 "由中央统一推行"
 nesnd_india_core.1.a_tt:0 "「$nesnd_india_order$」开启时，税收、军队与外交、学校与官职三项事务都按中央的办法安排。"
 nesnd_india_core.1.b:0 "交由各邦办理"
 nesnd_india_core.1.b_tt:0 "「$nesnd_india_order$」开启时，税收、军队与外交、学校与官职三项事务都按各邦自主的办法安排。"
 nesnd_india_society_ended_tt:0 "「$nesnd_india_society$」尚未结束"
