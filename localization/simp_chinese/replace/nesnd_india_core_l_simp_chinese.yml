 # Independence
 nesnd_india_indep:0 "摆脱宗主"
 nesnd_india_indep_reason:0 "[ROOT.GetCountry.GetName]是[ROOT.GetCountry.GetOverlord.GetName]的附属国，对外事务受宗主国节制。政府中主张独立的一派要求争取完整的主权，由本国自办外交。宗主国则把印度的附属国视为自身势力的一部分，对一切削弱宗属关系的举动都十分警惕，一旦查明附属国暗中资助其国内的政治运动或私藏军械，便会追究。"
 nesnd_india_indep_conclusion:0 "[ROOT.GetCountry.GetName]已经摆脱宗主国，成为独立国家。"
 nesnd_india_indep_overlord:0 "附属国的离心"
 nesnd_india_indep_overlord_reason:0 "[ROOT.GetCountry.GetName]在印度的附属国中，有的正图谋脱离本国。据密探报告，这些附属国暗中资助本国境内的政治运动，并在仓库里私藏军械。已经查获的只是其中一部分，未查明的有多少，无从得知。"
