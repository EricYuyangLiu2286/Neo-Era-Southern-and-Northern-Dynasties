 nesnd_india_unified:0 "统一与新秩序"
 nesnd_india_unified_reason:0 "[ROOT.GetCountry.GetName]以统一$region_north_india$与$region_south_india$为己任。旧邦界正在失去政治意义，各省沿用的税制与办学成规仍有差异。共同的法律要在全国施行，新政府必须使地方政府有能力征收赋税，维持学校和各级行政机构。"
 nesnd_india_unified_lobby:0 "统一$region_north_india$与$region_south_india$的事业尚未完成。旧邦界正在失去政治意义，各省沿用的税制和办学成规仍各不相同。新政府要让共同的法律在全国施行，就必须使地方政府有能力征税，维持学校和各级行政机构。"
 nesnd_india_unified_status:0 "在$region_north_india$与$region_south_india$，首都设在当地的国家持有的有人口[Concept('concept_state', '$concept_states|q$')]中，我国和我国的[Concept('concept_subject', '$concept_subjects|q$')]占 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!。首都在当地以外的国家所持的州，以及这些国家的附属国所持的州，都不计在内。我国自己的州总是计入。"
 nesnd_india_unified_share_tt:0 "在$region_north_india$与$region_south_india$，首都设在当地的国家持有的有人口[Concept('concept_state', '$concept_states|q$')]中，我国和我国的[Concept('concept_subject', '$concept_subjects|q$')]至少占 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_unified_share_needed')|0]%#!（现在是 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!）。不计外国及其附属国持有的州"
 nesnd_india_unified_reward:0 "共同的国家"
 nesnd_india_dynasty_journal:0 "王朝的民望"
 nesnd_india_dynasty_journal_reason:0 "皇室的旧名望仍有分量，但人们也会用眼前的政绩评判君主。各省的信仰能否得到尊重，朝廷能否作出自己的决定，都将影响他们是否愿意拥戴这个王朝。"
