 nesnd_tianzhu_transfer:0 "将新得的天竺土地划归宣慰司"
 nesnd_tianzhu_transfer_desc:0 "宣慰司开府以后，本国在天竺新得的直辖州仍由本土管辖。把它们划归宣慰司，驻军、关税与讼案便一并由宣慰使就地处置。"
 nesnd_tianzhu_transfer_tt:0 "将本国在$region_north_india$、$region_south_india$与$STATE_INDIAN_OCEAN_TERRITORY$的全部直辖州划归天竺宣慰司。"
 nesnd_yuanshan_transfer:0 "将新得的远山土地划归宣慰司"
 nesnd_yuanshan_transfer_desc:0 "宣慰司开府以后，本国在远山新得的直辖州仍由本土管辖。把它们划归宣慰司，由宣慰使就地一并治理。"
 nesnd_yuanshan_transfer_tt:0 "将本国在南非的全部直辖州划归远山宣慰司。"
