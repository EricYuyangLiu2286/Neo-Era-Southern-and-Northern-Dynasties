 nesnd_india_union_ask_button:0 "请求加入[SCOPE.sCountry('nesnd_label_india_empire').GetName]"
 nesnd_india_usm:0 "天竺的土地"
 nesnd_india_usm_reason:0 "南朝在印度的领地隔海相望，商人、驻军与地方王公各有利益。南京可以派遣官员直接治理，也可以把这些土地交给另设的宣慰司。一切为了天朝的荣光和税金！"
 nesnd_tianzhu_regions_bar:0 "天竺直辖地区"
 nesnd_tianzhu_founded_tt:0 "天竺宣慰司已经设立。"
 nesnd_tianzhu.1.t:0 "宣慰司开府"
 nesnd_tianzhu.1.d:0 "天竺宣慰司开府。本国在天竺的直辖州尽数划归宣慰司，驻军、关税与讼案从此由宣慰使就地决断。南京只保留任免宣慰使的权力，并按时收取岁入。\n\n天竺的王公、商行与村社今后都同宣慰司打交道，许多从前要报到南京的事，在当地就能办结。"
 nesnd_tianzhu.1.f:0 "“天竺驻军、关税、讼案，由宣慰司就地决断。宣慰使由南京任免，岁入按时解送。”\n——开府诏书"
 nesnd_tianzhu.1.a:0 "天朝的恩德，由宣慰使代为布施。"
 nesnd_india_usm_ready_status:0 "本国在天竺直辖的地区已经满足设立宣慰司的领土要求。"
 nesnd_india_usm_status:0 "直辖的天竺地区尚不足以单设宣慰司。"
 nesnd_india_unified:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_india_unified_name')]"
 nesnd_india_unified_reason:0 "[ROOT.GetCountry.GetName]以统一$region_north_india$与$region_south_india$为己任。旧日的邦界已经失去政治意义。新政府要让全国服从同一套法律，就必须养得起各级官员，修通连接各省的铁路，并把印度的大部分土地纳入我国和我国附属国的治下。"
 nesnd_india_unified_lobby:0 "统一$region_north_india$与$region_south_india$的事业尚未完成。旧邦界正在失去政治意义，各省沿用的税制和办学成规仍各不相同。新政府要让共同的法律在全国施行，就必须使地方政府有能力征税，维持学校和各级行政机构。"
 nesnd_india_unified_status:0 "在$region_north_india$与$region_south_india$，首都设在当地的国家持有的有人口[Concept('concept_state', '$concept_states|q$')]中，我国和我国的[Concept('concept_subject', '$concept_subjects|q$')]占 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!。"
 nesnd_india_unified_share_tt:0 "在$region_north_india$与$region_south_india$，首都设在当地的国家持有的有人口[Concept('concept_state', '$concept_states|q$')]中，我国和我国的[Concept('concept_subject', '$concept_subjects|q$')]至少占 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_unified_share_needed')|0]%#!（现在是 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!）。不计外国及其附属国持有的州"
 nesnd_india_unified_reward:0 "共同的国家"
