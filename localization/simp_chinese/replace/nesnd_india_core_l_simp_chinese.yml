 nesnd_india_unified:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_india_unified_name')]"
 nesnd_india_unified_reason:0 "[ROOT.GetCountry.GetName]以统一$region_north_india$与$region_south_india$为己任。随着旧日的邦界在外交地图上被我们抹去，崭新的全国政府必须让全国服从同一套法律。这意味着规范化和统一化各“邦”的行政机构，修通连接各省的铁路、道路，把我们的统治从喧嚣的城市延伸出去，到这块伟大陆地的原野、高原、密林，直到喜马拉雅和大洋激浪。"
 nesnd_india_unified_lobby:0 "统一$region_north_india$与$region_south_india$的事业尚未完成。旧邦界失去了外交意义，却仍具有“政治意义”。如果我们要成为真正的“全国政府”，就必须将我们的国家机器和基础设施延伸到这片大陆的尽头。直到喜马拉雅的天高和大洋的海远成为中央权力的唯一边界。我们将超越以往所有的印度政权！"
 nesnd_india_unified_status:0 "我们与附属国领有的印度州：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!"
 nesnd_india_unified_share_tt:0 "我们与附属国领有的州，占印度有人口州的至少 #v 75%#!（目前 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_held_share')|0]%#!）"
