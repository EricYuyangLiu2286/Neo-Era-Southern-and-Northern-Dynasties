 nesnd_india_caste:0 "“官制”改革"
 nesnd_india_caste_reason:0 "学校的大门已经打开，旧身份仍决定着人们能够走多远。让军官与官员凭才干任职，需要改变成文法律，也需要把教育送到原先被排斥的家庭。"
 nesnd_india_equal_service:0 "公职开放"
 nesnd_india_princes:0 "诸邦之间"
 nesnd_india_princes_reason:0 "莫卧儿和承继它的帝国、法兰西与大明联邦都向各[concept_princely_state]开出了合作的条件。[ROOT.GetCountry.GetName]的王公愿意接受外援，但要保全世袭的领地和征税的权力。"
 nesnd_india_project_status_consent:0 "拟办的[ROOT.GetCountry.GetCustom('nesnd_india_project_name')]须经[ROOT.GetCountry.MakeScope.Var('nesnd_india_request_await').GetCountry.GetName]许可，正在等候答复。"
