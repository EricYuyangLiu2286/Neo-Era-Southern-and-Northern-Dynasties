 nesnd_tianzhu_governance:0 "天竺的庶务"
 nesnd_tianzhu_governance_reason:0 "天竺的商人熟悉海上贸易，内地的田赋与地方公事则多由王公和村社经手。宣慰使受命治理港口、供养驻军，若要将学务和税政推及乡村，还必须取得地方的合作。"
 nesnd_yuanshan_commission:0 "筹建远山宣慰司"
 nesnd_yuanshan_commission_reason:0 "远山的港口面向两洋，也是[ROOT.GetCountry.GetName]船队进入非洲腹地的起点。只有真正取得并经营这片土地，朝廷才能在那里设立自己的宣慰司。"
 nesnd_yuanshan_governance:0 "远山的庶务"
 nesnd_yuanshan_governance_reason:0 "远山的港口已经成为两洋航路上的据点，腹地的治理刚刚开始。道路、税务和学校要随驻军一同建立，宣慰司的政令才能从沿海走进腹地。"
 nesnd_india_foreign:0 "出使求援"
 nesnd_india_foreign_reason:0 "[ROOT.GetCountry.GetName]要兴办学校、开设工坊、训练新式军队，却缺少教师、工程师和教官，也缺少资金。宗主国或外国政府可以派来顾问，再提供一笔拨款。顾问在我国任职四年，薪俸由我国负担，我国也将欠出资国一份[concept_obligation]。"
 nesnd_india_uprising:0 "举事的烽火"
 nesnd_india_uprising_reason:0 "大明联邦和它的天竺宣慰司依靠港口、驻军和当地盟友维持统治。反对它们的地方组织若要公开举事，需要外来的经费和支持。[ROOT.GetCountry.GetName]可以资助他们争取独立，但举事地区的归属仍由当地人决定，资助不会使这片土地归我国所有。"
