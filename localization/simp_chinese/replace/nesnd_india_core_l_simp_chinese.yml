 nesnd_mug_france_intro:0 "[ROOT.GetCountry.GetName]是[ROOT.GetCountry.GetOverlord.GetName]的[ROOT.GetCountry.GetSubjectType.GetName]，收入的一部分要上缴[ROOT.GetCountry.GetOverlord.GetName]。[ROOT.GetCountry.GetOverlord.GetName]的政府和商人在我国境内置下了许多产业。宫廷缺钱时，可以把本国的产业卖给[ROOT.GetCountry.GetOverlord.GetName]政府。[concept_gold_reserves]充足时，也可以把它们买回来。"
 nesnd_india_mug_schools_lasting:0 "$nesnd_india_school_service$"
 nesnd_india_mug_arms_lasting:0 "$nesnd_mug_arms_and_rail$"
 nesnd_india_industry_tech_known_tt:0 "我国已掌握[GetTechnology('bessemer_process').GetName]与[GetTechnology('mechanized_workshops').GetName]，不再另得[concept_technology]进度。"
 nesnd_india_reform_lapse_tt:0 "距上次改革中辍已满十年"
 nesnd_india_reform_lapse_conclusion:0 "国库无力支撑，改革中途停办。"
 nesnd_india_reform_lapse_effect_tt:0 "十年之内不能重开「$nesnd_india_schools$」与「$nesnd_india_industry_name_empire$」。已经完成的一项仍然算数。"
 nesnd_india_reform_central:0 "中央集权的行政"
 nesnd_india_landowners_slighted:0 "地方特权受抑"
 nesnd_india_landowners_pleased:0 "地方特权得保"
 nesnd_india_reform_lapsed:0 "改革中辍"
 nesnd_india_intelligentsia_dismayed:0 "改革中辍"
 nesnd_india_back_empire_lobby_tt:0 "该国已有亲近我国的[concept_political_lobby]时，这个游说团更受安抚。没有时，该国最强的、未加入任何游说团的[concept_interest_group]组成一个亲近我国的游说团。"
 nesnd_india_core.1_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n•集权：永久获得「$nesnd_india_reform_central$」，[ROOT.GetCountry.GetInterestGroupOfType('ig_landowners').GetName]五年内不满。日后「$nesnd_india_order$」开始时，三件事都先由中央管。\n•分权：[ROOT.GetCountry.GetInterestGroupOfType('ig_landowners').GetName]五年内满意。我国每个[concept_subject]对我国的[concept_relations] +20，并在其国内扶持一个亲近我国的[concept_political_lobby]。日后「$nesnd_india_order$」开始时，三件事都先由地方管。#!"
 nesnd_india_core.1.t:0 "改革既成"
 nesnd_india_core.1.d:0 "各省的学校已经开学，[ROOT.GetCountry.GetName]的工场也造出了自己的枪炮。新学校的毕业生和新式军队都等着政府安排去处。一派大臣主张把赋税、军队和学校都收归中央，由宫廷委派官员治理各省。地主和各邦王公则要求保留旧日的地方权利，由他们在本地出钱办事，宫廷只问结果。"
 nesnd_india_core.1.f:0 "“各省的事务，今后由谁做主？”\n——呈交宫廷的陈情书"
 nesnd_india_core.1.a:0 "政令出于中央。"
 nesnd_india_core.1.a_tt:0 "日后「$nesnd_india_order$」开始时，税收、军队与外交、学校与官职三件事都先由中央管。"
 nesnd_india_core.1.b:0 "各邦自理本地事务。"
 nesnd_india_core.1.b_tt:0 "日后「$nesnd_india_order$」开始时，税收、军队与外交、学校与官职三件事都先由地方管。"
 nesnd_india_society_ended_tt:0 "国民共同体尚未成形，也尚未破裂"
 nesnd_india_community_full_tt:0 "国民共同体达到 #v 100#!"
 nesnd_india_community_empty_tt:0 "国民共同体降到 #v 0#!"
 nesnd_india_society_formed_conclusion:0 "各省的受教育者已经承认彼此同属一个国家。"
 nesnd_india_society_broken_conclusion:0 "各省的人们不再承认自己同属一个国家。"
 nesnd_india_community_broken:0 "共同体破裂"
 nesnd_india_community_broken_radicals_tt:0 "我国每个州里，不属于我国主体文化的南亚文化人口，其中 #r 10%#! 成为[concept_radical]。"
 nesnd_india_core.2_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n•王朝宪章（须为君主制）：[concept_legitimacy]永久 #g +5#!。\n•共和安排：[ROOT.GetCountry.GetInterestGroupOfType('ig_intelligentsia').GetName]五年内满意，十年内[concept_enactment_success]几率提高。#!"
 nesnd_india_core.2.t:0 "谁代表这个国家"
 nesnd_india_core.2.d:0 "各省的报纸、学会和议事会争论多年以后，[ROOT.GetCountry.GetName]的受教育者已经接受，他们同属一个国家。下一个问题是这个国家由谁代表。拥戴王朝的人要求由皇室颁布宪章，把各省的权利写进去。知识分子和城市里的新派人士则要求按共和的办法安排政府，由选出的代表制定法律。"
 nesnd_india_core.2.f:0 "“我们同属一国。这个国家由谁代表，现在必须定下来。”\n——一份学会宣言"
 nesnd_india_core.2.a:0 "由皇室颁布宪章。"
 nesnd_india_core.2.b:0 "按共和的办法安排政府。"
 nesnd_india_dynastic_charter:0 "王朝宪章"
 nesnd_india_intelligentsia_pleased:0 "共和安排"
 nesnd_india_republican_enactment:0 "共和安排"
 nesnd_india_caste_law_lost_tt:0 "曾经施行的[GetLawType('law_freedom_of_conscience').GetName]或[GetLawType('law_total_separation').GetName]已被废除"
 nesnd_india_caste_reaction_conclusion:0 "宗教集团重掌政府，废除了宗教自由或重新施行种姓制度，官职又按出身授予。"
 nesnd_india_dynasty_crisis:0 "王朝危机"
 nesnd_india_core.3.t:0 "王朝危机"
 nesnd_india_core.3.d:0 "各省已不再承认皇室的权威。报纸要求君主退位，地方议事会拒绝以皇帝的名义征税。宫廷里有人主张顺应舆论，由君主交出权力、改行共和。另一些人认为，只要军队和地主仍然站在皇室一边，就能压下这场风潮。"
 nesnd_india_core.3.f:0 "“皇室不能再代表这个国家。”\n——一份地方议事会决议"
 nesnd_india_core.3.a:0 "君主退位，改行共和。"
 nesnd_india_core.3.a_tt:0 "我国已是[GetLawType('law_presidential_republic').GetName]。"
 nesnd_india_core.3.b:0 "调动军队，压下风潮。"
 nesnd_india_unified_claims_tt:0 "首都在$region_north_india$与$region_south_india$以外的国家所持有的每个印度州，我国都对其提出[concept_claim]。"
 nesnd_india_unified_fervor_tt:0 "五十年内，我国主体文化中每个南亚文化的[concept_fervor]目标 #g +10#!。"
 nesnd_india_unified_fallen:0 "新秩序瓦解"
 nesnd_india_core.6.t:0 "新秩序瓦解"
 nesnd_india_core.6.d_subject:0 "[ROOT.GetCountry.GetName]统一各省时立下的新秩序已经守不住了。政府如今须听命于外国，对外订约已不能自主。"
 nesnd_india_core.6.d_seat:0 "[ROOT.GetCountry.GetName]统一各省时立下的新秩序已经守不住了。首都周围的地区落入他人之手，宣布统一的政府已失去对所在之地的治理。"
 nesnd_india_core.6.f:0 "“统一的诺言已不能兑现。”\n——政府公告"
 nesnd_india_core.6.a:0 "撤回主张。"
 nesnd_india_core.6.a_tt:0 "撤回「$nesnd_india_unified$」完成时我国提出的全部[concept_claim]。"
 nesnd_india_core.4_outcome_tt:0 "我国的每个成员国各问一次：#indent_newline:3 \n•并入：该国并入我国。\n•保留：该国仍为[concept_subject]。#!"
 nesnd_india_core.4.t:0 "并入还是保留"
 nesnd_india_core.4.d:0 "十年来，[SCOPE.sCountry('india_annex_candidate').GetName]的赋税、军队和学校都由我国管理，该邦的王公只保留了名义。政府中有人提议把[SCOPE.sCountry('india_annex_candidate').GetName]直接并入[ROOT.GetCountry.GetName]，由中央委派官员治理。也有人认为保留该邦的王公更省事，王公的家族在当地仍有声望。"
 nesnd_india_core.4.f:0 "“名义上的邦，还要保留多久？”\n——一份呈交宫廷的条陈"
 nesnd_india_core.4.a:0 "并入[SCOPE.sCountry('india_annex_candidate').GetName]。"
 nesnd_india_core.4.b:0 "保留该邦的王公。"
 nesnd_india_core.4.b_tt:0 "[SCOPE.sCountry('india_annex_candidate').GetName]仍为我国的[concept_subject]。"
 # ==== 印度批次 16：种姓与公职读种姓阶层 ====
