 nesnd_mug_council_intro:0 "莫卧儿皇帝曾是全印度的共主，如今的王公们各有朝廷、各有军队，皇帝的诏令无法走出帝国的边界。改革之后，[ROOT.GetCountry.GetName]有了重新召集诸邦议事的底气。愿意赴会的，多半是与帝国交好的王公。他们来，是为了铁路、赈灾和防务这些实实在在的好处，在会上坐得久了，也就渐渐习惯了帝国坐在上首。"
