 nesnd_c2_hus_frontier_bar_desc: "$nesnd_c2_hus_frontier_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_frontier_expense: "牧地与通道拨款"
 nesnd_c2_hus_citizenship_labour_schools: "债役与工人教育"
 nesnd_c2_hus_citizenship_labour_schools_desc: "支持债役家庭与工人的教育，协助选定地区的学校服务。"
 nesnd_c2_hus_citizenship_labour_schools_politics: "债役与工人教育的支持与反对"
 nesnd_c2_hus_citizenship_public_accounts: "公开工程账目"
 nesnd_c2_hus_citizenship_public_accounts_desc: "支持公开工程收支，协助地方财政行政。"
 nesnd_c2_hus_citizenship_public_accounts_politics: "公开工程账目的支持与反对"
 nesnd_c2_hus_citizenship: "债契之外的人"
 nesnd_c2_hus_citizenship_reason: "债役家庭的子弟来到工场，带来的还有旧债、门第和难以摆脱的依附。教习与工人要求求学的机会，地方商户要求知道公共工程的钱花在谁身上。政府可以支持教育，也可以公开收支。关于自由与身份的争论，就这样从议会带进了学校和工场。"
 nesnd_c2_hus_citizenship_bar: "稳定经营"
 nesnd_c2_hus_citizenship_bar_desc: "$nesnd_c2_hus_citizenship_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_citizenship_expense: "债契之外的人拨款"
 nesnd_c2_hus_oil_oil_concessions: "矿权特许"
 nesnd_c2_hus_oil_oil_concessions_desc: "支持矿权特许，以建设协助推动油业经营。"
 nesnd_c2_hus_oil_oil_concessions_politics: "矿权特许的支持与反对"
 nesnd_c2_hus_oil_oil_royalties: "地方保留油税"
 nesnd_c2_hus_oil_oil_royalties_desc: "支持油税留用于地方的主张，协助当地财政行政。"
 nesnd_c2_hus_oil_oil_royalties_politics: "地方保留油税的支持与反对"
 nesnd_c2_hus_oil_oil_oversight: "公开监督油业"
 nesnd_c2_hus_oil_oil_oversight_desc: "支持工人组织监督油业的主张，将地方协助用于教育。"
 nesnd_c2_hus_oil_oil_oversight_politics: "公开监督油业的支持与反对"
 nesnd_c2_hus_oil: "油井与地方收益"
 nesnd_c2_hus_oil_reason: "油井开始出油，收益的去向也成了地方政治。特许公司希望用利润继续扩张，商户要求留下油税修路办学，工人组织则要求把油业置于公开监督之下。政府必须为所选的办法承担开支，不能只在油田的繁荣中计算国库的收入。"
 nesnd_c2_hus_oil_bar: "稳定经营"
 nesnd_c2_hus_oil_bar_desc: "$nesnd_c2_hus_oil_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_oil_expense: "油井与地方收益拨款"
 nesnd_c2_usm_constitution_classical_franchise: "维持经学资格"
 nesnd_c2_usm_constitution_classical_franchise_desc: "由礼议院统一按经学取士。各省应试者须通过同一场考试。"
 nesnd_c2_usm_constitution_classical_franchise_politics: "维持经学资格的支持与反对"
 nesnd_c2_usm_constitution_practical_franchise: "纳入实学商工"
 nesnd_c2_usm_constitution_practical_franchise_desc: "由礼议院统一考选通晓实学、熟悉商工的应试者。"
 nesnd_c2_usm_constitution_practical_franchise_politics: "纳入实学商工的支持与反对"
 nesnd_c2_usm_constitution_local_franchise: "扩大地方学额"
 nesnd_c2_usm_constitution_local_franchise_desc: "扩大各省学额，由各省书院推举学生参加礼议院考试。"
 nesnd_c2_usm_constitution_local_franchise_politics: "扩大地方学额的支持与反对"
 nesnd_c2_usm_constitution: "礼法与入仕之门"
 nesnd_c2_usm_constitution_reason: "礼议院的门前聚集着通晓经学的士人，也有懂得机器、账务和商路的新进之士。内阁六部要从中取得办事的人才，各省则关切自己的子弟能否入选。经学资格、实学经历和地方学额各占多少分量，决定了谁能循礼法进入国政，也使原有士绅的地位受到追问。"
 nesnd_c2_usm_constitution_bar: "稳定经营"
 nesnd_c2_usm_constitution_bar_desc: "$nesnd_c2_usm_constitution_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_constitution_expense: "选官改革经费"
 nesnd_c2_usm_schools_practical_schools: "实学课程"
 nesnd_c2_usm_schools_practical_schools_desc: "由六部拨付学款，统一厘定各书院的实学课程。"
 nesnd_c2_usm_schools_practical_schools_politics: "实学课程的支持与反对"
 nesnd_c2_usm_schools_provincial_schools: "地方学额"
 nesnd_c2_usm_schools_provincial_schools_desc: "将学款交给各省布政司，由各省增设学额。"
 nesnd_c2_usm_schools_provincial_schools_politics: "地方学额的支持与反对"
 nesnd_c2_usm_schools: "书院与学政"
 nesnd_c2_usm_schools_reason: "书院教习既要传授经义，也面对测绘、机器和商工实学的需要。学生盼望学成有用，更盼望取得礼议院考试的资格。布政司要筹出地方开支，学政则把各省对课程与学额的要求带入国政。实学课程与地方学额，正在争取同一笔教育经费。"
