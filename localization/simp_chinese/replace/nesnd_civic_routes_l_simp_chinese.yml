 nesnd_c2_usm_distribution_commercial_empire: "集中商业投入"
 nesnd_c2_usm_distribution_commercial_empire_desc: "投入集中到商业繁盛之地，好钢用在刀刃上。"
 nesnd_c2_usm_distribution_commercial_empire_politics: "商埠独享投入"
 nesnd_c2_usm_distribution_provincial_balance: "跨省公共投入"
 nesnd_c2_usm_distribution_provincial_balance_desc: "跨省调剂公帑，穷省也办得起事业。"
 nesnd_c2_usm_distribution_provincial_balance_politics: "各省均分公帑"
 nesnd_c2_usm_distribution_scholars_franchise: "扩展学政资格"
 nesnd_c2_usm_distribution_scholars_franchise_desc: "放宽学政资格，让更多读书人进礼议院。"
 nesnd_c2_usm_distribution_scholars_franchise_politics: "学政资格放宽"
 nesnd_c2_usm_distribution: "税款流向何处"
 nesnd_c2_usm_distribution_reason: "新厂场和通航带来了新收入。这笔钱可以接着投到商业繁盛之地，也可以分给各省办公共事业。内阁六部筹划支出，礼议院里的学政则要回答本省出了多少、得了多少。礼法之下的分配之争，从此多了一笔可争的财源。"
