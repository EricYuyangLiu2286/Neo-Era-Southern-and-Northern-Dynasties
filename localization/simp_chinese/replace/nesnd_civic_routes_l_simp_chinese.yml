 je_risorgimento_reason: "意大利的各邦已经拥有不同的政府、军队和外交关系。伦巴第共和国在法国支持下延续，共和主义、王朝利益与地方财政都在塑造统一的道路。各邦可以追求统一，也可以在公共义务中寻找长期合作。"
 italian_unification.6.d: "意大利的政治动员已经改变了地方政局。现有共和国与新形成的共和力量都在争取合作，但军费、财政与代表资格仍有待具体协商。"
 italian_unification.10.d: "意大利的未来正在学校、军营与各邦政府之间受到争论。支持统一不必以敌视法国为前提，保护关系也不能替地方回答财政与政治资格的问题。"
