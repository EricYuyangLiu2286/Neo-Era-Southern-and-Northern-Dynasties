 nesnd_c2_hus_frontier_pasture_passage: "保留牧地通道"
 nesnd_c2_hus_frontier_pasture_passage_desc: "给牧群留出通道。工程要绕着牧道走，施工慢些。"
 nesnd_c2_hus_frontier_pasture_passage_politics: "牧道得以保留"
 nesnd_c2_hus_frontier_land_compensation: "补偿开发"
 nesnd_c2_hus_frontier_land_compensation_desc: "征地照价补偿。路能修通，工期要拖长些。"
 nesnd_c2_hus_frontier_land_compensation_politics: "按价征地"
 nesnd_c2_hus_frontier_frontier_garrisons: "驻军保障施工"
