 nesnd_c2_hus_oil_oil_concessions: "矿权特许"
 nesnd_c2_hus_oil_oil_concessions_desc: "把矿权特许出去，让公司拿利润接着打井。"
 nesnd_c2_hus_oil_oil_concessions_politics: "特许公司扩张"
 nesnd_c2_hus_oil_oil_royalties: "地方保留油税"
 nesnd_c2_hus_oil_oil_royalties_desc: "油税留在当地，拿来修路办学。"
 nesnd_c2_hus_oil_oil_royalties_politics: "油税留在本地"
 nesnd_c2_hus_oil_oil_oversight: "公开监督油业"
 nesnd_c2_hus_oil_oil_oversight_desc: "让工人组织监督油井，地方的协助用在学堂上。"
 nesnd_c2_hus_oil_oil_oversight_politics: "工会盯着油井"
 nesnd_c2_hus_oil: "油井与地方收益"
 nesnd_c2_hus_oil_reason: "油井出了油，收益往哪里去，也成了地方上的政治。特许公司要拿利润接着扩张，商户要留下油税修路办学，工人组织则要求把油业摆到明处，受公众监督。"
 nesnd_c2_hus_oil_bar: "稳定经营"
 nesnd_c2_hus_oil_bar_desc: "$nesnd_c2_hus_oil_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_oil_expense: "油井与地方收益拨款"
 nesnd_c2_usm_constitution_classical_franchise: "维持经学资格"
 nesnd_c2_usm_constitution_classical_franchise_desc: "经学是入仕的根基，这一条不能动。"
 nesnd_c2_usm_constitution_classical_franchise_politics: "经学门第得保"
 nesnd_c2_usm_constitution_practical_franchise: "纳入实学商工"
 nesnd_c2_usm_constitution_practical_franchise_desc: "懂机器、会算账的人，也该有入仕的门路。"
 nesnd_c2_usm_constitution_practical_franchise_politics: "实学之士入仕"
 nesnd_c2_usm_constitution_local_franchise: "扩大地方学额"
 nesnd_c2_usm_constitution_local_franchise_desc: "各省多给应试名额，本省子弟才有出头之日。"
 nesnd_c2_usm_constitution_local_franchise_politics: "各省学额扩充"
 nesnd_c2_usm_constitution: "礼法与入仕之门"
 nesnd_c2_usm_constitution_reason: "礼议院门前站着通晓经学的士人，也站着懂机器、账务和商路的新进之士。内阁六部要从中挑办事的人，各省关心的是自家子弟能否入选。经学资格、实学经历和地方学额各占几分，决定了谁能循礼法进入国政，旧士绅的地位也因此被人追问。"
 nesnd_c2_usm_constitution_bar: "稳定经营"
 nesnd_c2_usm_constitution_bar_desc: "$nesnd_c2_usm_constitution_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_constitution_expense: "礼法与入仕之门拨款"
 nesnd_c2_usm_schools_practical_schools: "实学课程"
 nesnd_c2_usm_schools_practical_schools_desc: "书院添开实学课，教习的薪水有了着落。"
 nesnd_c2_usm_schools_practical_schools_politics: "书院开讲实学"
 nesnd_c2_usm_schools_provincial_schools: "地方学额"
 nesnd_c2_usm_schools_provincial_schools_desc: "多给地方学额，让乡里子弟有书可读。"
 nesnd_c2_usm_schools_provincial_schools_politics: "乡里子弟多了学额"
 nesnd_c2_usm_schools: "书院与学政"
 nesnd_c2_usm_schools_reason: "书院教习讲的是经义，学生要的却是测绘、机器和商工实学。学生盼着学成有用，更盼着取得礼议院考试的资格。布政司要筹地方开支，学政则把各省对课程和学额的要求带进国政。实学课程与地方学额，争的是同一笔教育经费。"
 nesnd_c2_usm_schools_bar: "稳定经营"
 nesnd_c2_usm_schools_bar_desc: "$nesnd_c2_usm_schools_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_usm_schools_expense: "书院与学政拨款"
 nesnd_c2_usm_industry_coastal_industry: "沿海工场"
 nesnd_c2_usm_industry_coastal_industry_desc: "钱先投到沿海的厂场，那里有港口，有航路。"
 nesnd_c2_usm_industry_coastal_industry_politics: "沿海厂主得势"
 nesnd_c2_usm_industry_inland_industry: "内陆实业"
 nesnd_c2_usm_industry_inland_industry_desc: "实业不能只开在海边，内陆也要通路设厂。"
 nesnd_c2_usm_industry_inland_industry_politics: "内陆市镇得到投入"
 nesnd_c2_usm_industry: "实业与通航"
 nesnd_c2_usm_industry_reason: "沿海商人循着港口和航路办起工场，内陆市镇也伸手要实业投入。机器、劳工和货物要在各省之间流动，布政司眼里却只有本省的赋税和建设负担。奏议里的繁荣作不得数，厂场能不能办下去，才看得出这笔钱花在了哪里。"
