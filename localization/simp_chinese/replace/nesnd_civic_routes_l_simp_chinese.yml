 nesnd_civic_routes.30.national: "禁止奴隶制的法令已经生效。债主若要追索旧账，仍可拿契纸到官署求偿。欠债人能离开他的宅院，也能替自己的儿女另找生计。旧账簿上原本挨着银钱写下的那些名字，官署再不能当作财物判给债主了。"
 nesnd_civic_routes.30.f: "“我欠你的钱，你把数目念一遍。我女儿的名字，也请你从账上划去。”"
