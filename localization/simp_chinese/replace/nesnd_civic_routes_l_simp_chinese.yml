 nesnd_c2_italy_agenda_reason: "法国支持着伦巴第共和国，各邦却仍各自负担军队、学校与行政。无论追求统一，还是维持长期合作，意大利人都需要商定共同事业的钱从何处征收、由谁支配。\n\n本[concept_journal_entry]在失去意大利主流文化或意大利境内全部有人居住的地区时结束。"
