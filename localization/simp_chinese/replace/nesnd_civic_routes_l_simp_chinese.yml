 nesnd_civic_routes.30.t: "债契失去了旧日的权力"
 nesnd_civic_routes.30.d: "在[SCOPE.sState('c2_dayuan').GetName]，债主如今还能讨钱，却不能再凭债契把欠债人的儿女留在自己家里。有人想趁这个时候教孩子读书，将来再拿到一张契纸，至少能自己念出上面的字。地方互助会愿意凑钱请先生，只是最想送孩子来的人家，往往也最拿不出这份钱。"
 nesnd_civic_routes.30.a: "国库出钱办学，让欠过债的人家也送得起孩子。"
 nesnd_c2_scholarly_exchange: "与西府交流教习"
 nesnd_c2_scholarly_exchange_desc: "西府独立期间，可邀请两地书院互派教习。若对方同意，两国各有一州受益两年。\n[GetStaticModifier('nesnd_civic_academy_exchange').GetDesc]"
 nesnd_civic_routes.40.t: "两地书院的聘书"
 nesnd_civic_routes.40.d: "[SCOPE.sCountry('c2_scholar_sender').GetName]来信，希望由[SCOPE.sCharacter('c2_duan').GetFullName]牵头，让[SCOPE.sState('c2_host_school').GetName]和[SCOPE.sState('c2_sender_school').GetName]的书院互派教习。两地的学生都能听到远方先生的讲授。可川中教习出境授课必须得到我们允准，礼议院发来的聘书，还不能替书院放人。"
 nesnd_civic_routes.40.a: "准两地书院互派教习，为期两年。"
 nesnd_civic_routes.40.b: "川中书院仍需用人，此次不应聘。"
 nesnd_civic_routes.41.t: "书院互聘"
 nesnd_civic_routes.41.d: "两地已经议定聘期。[SCOPE.sState('c2_sender_school').GetName]的书院可以延请川中教习，也要为[SCOPE.sState('c2_host_school').GetName]备好回聘的人选。今后两年，想求教于外地先生的学生，在本乡便有听课的机会。"
 nesnd_civic_routes.41.a: "将聘期和课程告知两地学生。"
 nesnd_c2_italian_abandon: "结束本期协定"
 nesnd_c2_italian_abandon_desc: "停止本期共同义务，不计为已经履行的协定。原有十二个月拨款仍按期结束。十二个月后才能重议。"
 nesnd_c2_productive_levels_tt: "施工地区同组厂场的经营等级必须达到起办时的既有总等级，再加本期要求的增量，并连续维持三个月。市场接入必须至少为80%。只有雇用率至少75%且盈利的厂场等级计入，空置或亏损的等级不计。"

