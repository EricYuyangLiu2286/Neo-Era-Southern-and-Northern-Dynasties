 nesnd_civic_routes.30.t: "债契失去了旧日的权力"
 nesnd_civic_routes.30.d: "奴隶制废除了，集会与言论也有了法律的保障。一纸债契，再也不能照旧支配一个人的一生。可登记法留下的东西不会一夜消失：谁能读书，谁能做什么行当，谁算什么身份，共和国还得一样一样去争。"
 nesnd_civic_routes.30.a: "自由还须有立足之地。"
 nesnd_c2_scholarly_exchange: "与独立西府交流教习"
 nesnd_c2_scholarly_exchange_desc: "邀请巴蜀教习参与课程与学额讨论。须由独立西府同意，不改变领土或人物归属，也不授予学政身份。"
 nesnd_civic_routes.40.t: "来自南朝的教习邀请"
 nesnd_civic_routes.40.d: "南朝请段敬川去参与书院课程与学额的商议。西府已经独立，南京不能再像从前那样一纸省令把人调走。去不去，由我们说了算。"
 nesnd_civic_routes.40.a: "让他去走一趟。"
 nesnd_civic_routes.40.b: "西府的教习，留在西府。"
 nesnd_civic_routes.41.t: "书院之间的往来"
 nesnd_civic_routes.41.d: "西府答应了教习交流。两边的书院可以就课程和学额常来常往，学校还是各办各的。礼议院的资格，仍要经南朝自己的考试和礼法来定。"
 nesnd_civic_routes.41.a: "以学问保持往来。"
 nesnd_c2_italian_abandon: "结束本期协定"
 nesnd_c2_italian_abandon_desc: "停止本期共同义务，不计为已经履行的协定。原有十二个月拨款仍按期结束。十二个月后方可重议。"
 nesnd_c2_productive_levels_tt: "施工地区同组厂场的经营等级须达到起办时的既有总等级，再加本期要求的增量，并连续维持三个月。市场接入须至少为80%。只有雇用率至少75%且盈利的厂场等级计入，空置或亏损的等级不计。"

