 nesnd_c2_usm_distribution_provincial_balance_desc: "将拨款交给两个省的布政司，用于当地的政府行政机构。"
 nesnd_c2_usm_distribution_provincial_balance_politics: "跨省公共投入的支持与反对"
 nesnd_c2_usm_distribution_scholars_franchise: "扩展学政资格"
 nesnd_c2_usm_distribution_scholars_franchise_desc: "扩大各省荐举学政的范围，由书院推举合格人选参加礼议院考试。"
 nesnd_c2_usm_distribution_scholars_franchise_politics: "扩展学政资格的支持与反对"
 nesnd_c2_usm_distribution: "税款分配"
 nesnd_c2_usm_distribution_reason: "新厂场和通航带来的收入，可以继续集中到商业繁盛之地，也可以用于各省的公共事业。内阁六部筹划支出，礼议院里的学政则要回答本省负担了多少、得到多少。商业投入、跨省建设与入仕资格争的是同一笔钱，礼法之下的分配之争因此更难收场。"
