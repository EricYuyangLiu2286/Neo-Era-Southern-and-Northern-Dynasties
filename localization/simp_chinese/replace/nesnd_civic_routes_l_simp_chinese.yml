 nesnd_c2_italian_propose_tus: "与[SCOPE.sCountry('nesnd_label_tus').GetName]协商学校及税款"
 nesnd_c2_compact_expense: "诸邦协定拨款"
 nesnd_c2_italian_propose_desc: "两邦各自负担十二个月拨款，并在自己的学校、行政或军需机构中落实服务。接受必须由对方决定。双方连续三个月按约拨款、维持服务，即算合作完成。提议九十日未获回复则结束，十二个月后可再议。"
 nesnd_civic_routes.10.t: "学校、军费与邦国"
 nesnd_civic_routes.10.d: "邻邦提出共同负担公共事业。学校责任、地方税款和军费不再只是统一演说中的许诺：两国都必须从自己的财政中拨款，在自己的土地上维持服务。这个提议保留双方的政权和领土，是否接受仍由我们决定。"
 nesnd_civic_routes.10.f: "“统一不能只靠演说。学校、道路和军队，都要有人拿出钱来。”\n——都灵的一份报纸"
 nesnd_civic_routes.10.a: "各自承担约定的开支。"
 nesnd_civic_routes.10.b: "要求优先保障学校与地方服务。"
 nesnd_civic_routes.10.c: "我们不接受这项提议。"
 nesnd_civic_routes.11.t: "来自地方的条件"
 nesnd_civic_routes.11.d:0 "[SCOPE.sCountry('c2_compact_partner').GetName]愿意合作，但要求优先支持学校和地方服务，而非军需。若同意，两国都将为这些事业拨款，并各自维持境内的公共服务。"
 nesnd_civic_routes.11.f:0 "“本政府愿意合作，但请贵国同意：共同经费先用于学校与地方公益，不用于军需。”\n——对方政府的复函"
 nesnd_civic_routes.11.a: "接受对方定下的先后次序。"
 nesnd_civic_routes.12.t: "诸邦协商未成"
 nesnd_civic_routes.12.d: "诸邦没能就这一期的公共开支谈拢。各自的学校、税款与军费仍要各自照管，再谈只能等下一次机会。"
 nesnd_civic_routes.12.f: "“本期公共开支，各邦代表未能达成一致。学校、税款与军费仍由各邦自行负担，待下次会议再议。”\n——诸邦会议纪要"
 nesnd_civic_routes.12.a: "暂且各行其事。"
 nesnd_civic_routes.13.t: "各邦履行了约定"
 nesnd_civic_routes.13.d:0 "两国已经履行约定，各自为学校、行政或军需提供了经费和服务。地方的合作使各邦有了共同的利益，也为进一步协商积累了信任。"
 nesnd_civic_routes.13.f:0 "“本年度两邦的拨款均已到位，学校与驻军按协议运作。”\n——邦国财政报告"
 nesnd_civic_routes.13.a: "让协定立足于日常。"
 nesnd_c2_italy_direction_french_republic: "法国支持的共和整合"
 nesnd_c2_italy_direction_french_republic_desc:0 "依靠法国支持，以共和制度、公共工程和逐邦协商推动意大利整合。"
 nesnd_c2_italy_direction_autonomous_concord: "自主合作"
 nesnd_c2_italy_direction_autonomous_concord_desc:0 "由意大利各邦筹措经费、商定合作，减少对法国支持的依赖。"
 nesnd_c2_italy_direction_southern_monarchy: "南方君主整合"
 nesnd_c2_italy_direction_southern_monarchy_desc:0 "支持南方王朝主持合作，把各邦的地方财政和军队一并拿到谈判桌上。"
 nesnd_c2_italy_direction_plural_compact: "教宗与诸邦合作"
 nesnd_c2_italy_direction_plural_compact_desc:0 "支持各邦分担办学、教会与财政义务，在保留各自政府的基础上长期合作。"
