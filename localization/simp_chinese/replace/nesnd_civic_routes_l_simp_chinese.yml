 nesnd_c2_compact_expense: "诸邦协定拨款"
 nesnd_c2_italian_propose_desc: "两邦各自负担十二个月拨款，并在自己的学校、行政或军需机构中落实服务。接受须由对方决定。双方稳定履约三个月后计为合作成果。提议九十日未获回复则结束，十二个月后可再议。"
 nesnd_civic_routes.10.t: "学校、军费与邦国"
 nesnd_civic_routes.10.d: "邻邦提议两家一起负担公共事业。学校、地方税款和军费，不再只是统一演说里的漂亮话：两国都要从自家国库拨款，在自家土地上把事办起来。提议不动双方的政权和领土。"
 nesnd_civic_routes.10.a: "各出各的钱，说好的事照办。"
 nesnd_civic_routes.10.b: "学校和地方的事要排在前头。"
 nesnd_civic_routes.10.c: "这笔账我们不认。"
 nesnd_civic_routes.11.t: "来自地方的条件"
 nesnd_civic_routes.11.d:0 "对方愿意合作，条件是钱先花在学校和地方服务上，不花在军需上。答应下来，两国都要为这些事业拨款，各管各的公共服务。"
 nesnd_civic_routes.11.a: "先办学校，也行。"
 nesnd_civic_routes.12.t: "诸邦协商未成"
 nesnd_civic_routes.12.d: "诸邦没能谈拢这一期的公共义务。学校、税款和军费，还是各管各的。"
 nesnd_civic_routes.12.a: "暂且各行其事。"
 nesnd_civic_routes.13.t: "各邦履行了约定"
 nesnd_civic_routes.13.d:0 "两国守住了约定，各自为学校、行政或军需拿出了经费和人手。合作办成了一回，下回再谈就容易些。"
 nesnd_civic_routes.13.a: "照这样办下去。"
 nesnd_c2_italy_direction_french_republic: "法国支持的共和整合"
 nesnd_c2_italy_direction_french_republic_desc:0 "依靠法国支持，以共和制度、公共工程和逐邦协商推动意大利整合。"
 nesnd_c2_italy_direction_autonomous_concord: "自主合作"
 nesnd_c2_italy_direction_autonomous_concord_desc:0 "由意大利各邦筹措经费、商定合作，减少对法国支持的依赖。"
 nesnd_c2_italy_direction_southern_monarchy: "南方君主整合"
 nesnd_c2_italy_direction_southern_monarchy_desc:0 "支持南方王朝主持合作，将地方财政与军队安排纳入各邦谈判。"
 nesnd_c2_italy_direction_plural_compact: "教宗与诸邦合作"
 nesnd_c2_italy_direction_plural_compact_desc:0 "支持各邦分担办学、教会与财政义务，在保留各自政府的基础上长期合作。"
