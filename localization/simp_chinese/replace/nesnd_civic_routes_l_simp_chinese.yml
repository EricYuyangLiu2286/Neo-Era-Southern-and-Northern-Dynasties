 nesnd_c2_hus_transport_chartered_contractors: "特许承包"
 nesnd_c2_hus_transport_chartered_contractors_desc: "把港路交给大承包商，借他们的资本修起来。"
 nesnd_c2_hus_transport_chartered_contractors_politics: "大承包商包揽工程"
 nesnd_c2_hus_transport_open_tenders: "公开竞标"
 nesnd_c2_hus_transport_open_tenders_desc: "工程公开招标，让小商户也能分到活计。"
 nesnd_c2_hus_transport_open_tenders_politics: "小商户竞标"
 nesnd_c2_hus_transport_local_transport: "地方港路出资"
 nesnd_c2_hus_transport_local_transport_desc: "先把支路修到乡村的市镇。"
 nesnd_c2_hus_transport_local_transport_politics: "支路先通乡镇"
 nesnd_c2_hus_transport: "东青行与大陆道路"
 nesnd_c2_hus_transport_reason: "东青行做的是通洋的买卖，港口得连上内陆的木材、矿产和农货。大承包商带着资本来，也带来了特许经营，地方从此离不开他们。小商户要求公开竞标，乡村则要先把支路修到自己的市镇。"
