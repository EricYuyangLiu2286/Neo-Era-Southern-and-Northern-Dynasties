l_simp_chinese:
 nesnd_c2_italy_foundations_public_works: "公共军需工程"
 nesnd_c2_italy_foundations_public_works_desc: "支持军方筹办军需工程，为本国厂场提供建设协助。"
 nesnd_c2_italy_foundations_public_works_politics: "公共军需工程的支持与反对"
 nesnd_c2_italy_foundations_commercial_credit: "商人融资"
 nesnd_c2_italy_foundations_commercial_credit_desc: "支持商人为厂场筹措信用，将公共投入用于地方实业。"
 nesnd_c2_italy_foundations_commercial_credit_politics: "商人融资的支持与反对"
 nesnd_c2_italy_foundations_local_partnerships: "地方合资学校"
 nesnd_c2_italy_foundations_local_partnerships_desc: "由地方出资者参与办学，支持我国的学校。"
 nesnd_c2_italy_foundations_local_partnerships_politics: "地方合资学校的支持与反对"
 nesnd_c2_italy_foundations: "工场与诸邦"
 nesnd_c2_italy_foundations_reason: "法国对伦巴第共和国的扶持，使共和事业在意大利有了依托。工场的订货、商人的信用和地方学校的经费，仍必须由意大利人筹措。军方希望先办军需，商人要求偿款有期，地方出资者则要为自己的子弟留下求学之地。政府把钱投向何处，也就在决定哪些人的需要将先得到照顾。"
 nesnd_c2_italy_foundations_bar: "稳定经营"
 nesnd_c2_italy_foundations_bar_desc: "$nesnd_c2_italy_foundations_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_italy_foundations_expense: "工场与诸邦拨款"
 nesnd_c2_italy_common_budget_fiscal_union: "集中税款"
 nesnd_c2_italy_common_budget_fiscal_union_desc: "支持集中税款的主张，在选定地区加强财政行政。"
 nesnd_c2_italy_common_budget_fiscal_union_politics: "集中税款的支持与反对"
 nesnd_c2_italy_common_budget_federal_councils: "地方留税与学校"
 nesnd_c2_italy_common_budget_federal_councils_desc: "支持地方保留办学经费，以学校服务落实地方留税的主张。"
 nesnd_c2_italy_common_budget_federal_councils_politics: "地方留税与学校的支持与反对"
 nesnd_c2_italy_common_budget_military_accounts: "军费与退伍安置"
 nesnd_c2_italy_common_budget_military_accounts_desc: "把军费与退伍安置列入公共事业，协助地方军需建设。"
 nesnd_c2_italy_common_budget_military_accounts_politics: "军费与退伍安置的支持与反对"
 nesnd_c2_italy_common_budget: "共同的财政"
 nesnd_c2_italy_common_budget_reason: "走向共同的意大利，先要处理各邦原有的军费与税制。工商界希望集中财力，地方商户要留下办学的收入，军方则把军费与退伍安置摆在前面。共同财政必须从这些不同的负担中办起。逐邦协商或追求统一，都绕不开税款归谁支配。"
 nesnd_c2_italy_common_budget_bar: "稳定经营"
 nesnd_c2_italy_common_budget_bar_desc: "$nesnd_c2_italy_common_budget_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_italy_common_budget_expense: "共同的财政拨款"
 nesnd_c2_hus_transport_chartered_contractors: "特许承包"
 nesnd_c2_hus_transport_chartered_contractors_desc: "将厂场扩建和货运交给特许承包商。若$company_ce_daqing_coop$在我国经营，由该行承包。工程州的厂场和货路必须连续三个月达到约定条件。"
 nesnd_c2_hus_transport_chartered_contractors_politics: "特许承包的支持与反对"
 nesnd_c2_hus_transport_open_tenders: "公开竞标"
 nesnd_c2_hus_transport_open_tenders_desc: "支持公开竞标，使地方交通工程得到基础设施协助。"
 nesnd_c2_hus_transport_open_tenders_politics: "公开竞标的支持与反对"
 nesnd_c2_hus_transport_local_transport: "地方港路出资"
 nesnd_c2_hus_transport_local_transport_desc: "支持乡村所需的港路联通，协助地方交通经营。"
 nesnd_c2_hus_transport_local_transport_politics: "地方港路出资的支持与反对"
 nesnd_c2_hus_transport: "东青行与大陆道路"
 nesnd_c2_hus_transport_reason: "东青行所代表的通洋贸易，需要港口与内陆的木材、矿产和农货相联通。把工程交给大承包商，可以借用他们的资本，也会使地方经济更深地依赖特许经营。小商户争取公开竞标，乡村则要求先把支路接到自己的市镇。大陆上的道路先顺着谁的需要修，要由政府来定。"
 nesnd_c2_hus_transport_bar: "稳定经营"
 nesnd_c2_hus_transport_bar_desc: "$nesnd_c2_hus_transport_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_c2_hus_transport_expense: "东青行与大陆道路拨款"
 nesnd_c2_hus_frontier_pasture_passage: "保留牧地通道"
 nesnd_c2_hus_frontier_pasture_passage_desc: "为牧民保留通行空间。地方基础设施获得协助，施工则必须承受避让牧道的负担。"
 nesnd_c2_hus_frontier_pasture_passage_politics: "保留牧地通道的支持与反对"
 nesnd_c2_hus_frontier_land_compensation: "补偿开发"
 nesnd_c2_hus_frontier_land_compensation_desc: "支持补偿开发，改善地方基础设施，并承担施工放缓的代价。"
 nesnd_c2_hus_frontier_land_compensation_politics: "补偿开发的支持与反对"
 nesnd_c2_hus_frontier_frontier_garrisons: "驻军保障施工"
 nesnd_c2_hus_frontier_frontier_garrisons_desc: "支持驻军保障工程的主张，为地方施工提供协助。"
 nesnd_c2_hus_frontier_frontier_garrisons_politics: "驻军保障施工的支持与反对"
 nesnd_c2_hus_frontier: "牧地与通道"
 nesnd_c2_hus_frontier_reason: "铁路和矿场向牧地伸展时，地图上的空白并非无人经过的土地。季节迁徙的牲畜要饮水，工程要用地，驻军要保障交通。牧民要求保留通道，开发者催促补偿征地，军方主张由驻军护持施工。无论选哪一种，当地人往后的生计都会随之改变。"
