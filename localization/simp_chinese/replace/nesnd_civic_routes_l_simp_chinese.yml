 nesnd_c2_italy_foundations_public_works: "公共军需工程"
 nesnd_c2_italy_foundations_public_works_desc: "先替军队把军需办起来，厂里自然有订货。"
 nesnd_c2_italy_foundations_public_works_politics: "军方先拿到订单"
 nesnd_c2_italy_foundations_commercial_credit: "商人融资"
 nesnd_c2_italy_foundations_commercial_credit_desc: "让商人替厂场筹措信用。钱借得出去，工场才开得起来。"
 nesnd_c2_italy_foundations_commercial_credit_politics: "厂主借到了钱"
 nesnd_c2_italy_foundations_local_partnerships: "地方合资学校"
 nesnd_c2_italy_foundations_local_partnerships_desc: "请出钱的乡里人一同办学，他们的子弟也就有了读书的地方。"
 nesnd_c2_italy_foundations_local_partnerships_politics: "乡里出资办学"
 nesnd_c2_italy_foundations: "工场与诸邦"
 nesnd_c2_italy_foundations_reason: "法国扶持伦巴第共和国，意大利的共和事业有了靠山。可工场的订货、商人的信用、地方学校的经费，还得意大利人自己去筹。军方要先办军需，商人要借款有期，出资办学的乡里人则要给自家子弟留个读书的地方。"
 nesnd_c2_italy_foundations_bar: "稳定经营"
