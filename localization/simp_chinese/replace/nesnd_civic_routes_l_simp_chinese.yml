 nesnd_c2_hus_citizenship_labour_schools_politics: "债役子弟入学"
 nesnd_c2_hus_citizenship_public_accounts: "公开工程账目"
 nesnd_c2_hus_citizenship_public_accounts_desc: "工程的每一笔收支，都摊开来给人看。"
 nesnd_c2_hus_citizenship_public_accounts_politics: "工程账目公开"
 nesnd_c2_hus_citizenship: "债契之外的人"
 nesnd_c2_hus_citizenship_reason: "债役人家的子弟进了工场，旧债、门第和甩不掉的依附也一起跟了进来。教习和工人要读书的机会，商户要知道公共工程的钱花在了谁身上。关于自由与身份的争论，就这样落到了学堂和工场里。"
