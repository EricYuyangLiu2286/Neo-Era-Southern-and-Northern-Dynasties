 nesnd_c2_usm_agenda_reason: "各省派往礼议院的学政都要经过考试。礼议院审定取士资格，各省书院则希望多得一些荐考名额，让本省监生有机会入院参政。学政在院中议定的拨款，还要交给官署支用。国库出钱办学、兴办实业，工款和学款可以由六部掌管，也可以拨给当地布政司。"
