 nesnd_c2_usm_industry: "实业与通航"
 nesnd_c2_usm_industry_reason: "沿海的纺织、造船和造纸都可动用国库拨款，内陆工场和矿山也在拨款之列。礼议院议定实业支出时，还须决定这笔工款由六部统一调度，还是拨给当地布政司支用。"
