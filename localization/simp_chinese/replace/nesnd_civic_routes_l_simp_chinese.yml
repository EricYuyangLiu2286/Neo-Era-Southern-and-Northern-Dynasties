 nesnd_c2_italy_common_budget_fiscal_union: "集中税款"
 nesnd_c2_italy_common_budget_fiscal_union_desc: "税款收到一处，共同的事业才办得起来。"
 nesnd_c2_italy_common_budget_fiscal_union_politics: "税款收归中枢"
 nesnd_c2_italy_common_budget_federal_councils: "地方留税与学校"
 nesnd_c2_italy_common_budget_federal_councils_desc: "各邦留下办学的钱，学校就开在自家门口。"
 nesnd_c2_italy_common_budget_federal_councils_politics: "各邦留税办学"
 nesnd_c2_italy_common_budget_military_accounts: "军费与退伍安置"
 nesnd_c2_italy_common_budget_military_accounts_desc: "把军费和退伍兵的安置，也算进公共事业里。"
 nesnd_c2_italy_common_budget_military_accounts_politics: "军费优先入账"
 nesnd_c2_italy_common_budget: "共同的财政"
 nesnd_c2_italy_common_budget_reason: "意大利要走到一起，先得算清各邦原有的军费与税制。厂主们想把财力集中起来，地方商户要留下办学的钱，军方则把军费与退伍安置摆在头里。逐邦协商也好，一举统一也好，税款归谁支配都绕不过去。"
