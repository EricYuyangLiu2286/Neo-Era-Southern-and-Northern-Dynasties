 nesnd_ottoman_unity: "帝国诸民"
 nesnd_ottoman_unity_reason: "征服使苏丹能够支配更广阔的土地，也把信仰、语言和历史各异的人们置于同一朝廷之下。安纳托利亚的官员、巴尔干的地方势力和新近归附的各族，都要求国家保护他们的利益。\n\n学校、行政和安定的生活可以培育共同的归属，长期征战和排斥性的制度则会使地方社会离心。帝国必须在扩张之外，为这些臣民提供愿意留在一起的理由。"
