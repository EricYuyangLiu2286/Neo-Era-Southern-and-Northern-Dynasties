 nesnd_ottoman_unity_fractured: "各地对朝廷的信任已经动摇，地方动荡正在加重统治的负担。"
 nesnd_ottoman_unity_confident: "各地的共同归属正在巩固，不同群体更愿意融入帝国的社会生活。"
 nesnd_ottoman_unity_calm: "朝廷与地方仍在维持合作，各族对帝国的认同有待巩固。"
