 nesnd_unity_material_subsidy_desc: "向贫困、受歧视的群体提供补贴，使他们更愿意参与共同的社会生活。享有旧有地位的人群却会把这笔支出看作对自身利益的侵蚀。"
 nesnd_unity_political_subsidy: "补贴政治存在"
 nesnd_unity_political_subsidy_desc: "让长期处于政治边缘的人群在国家事务中获得更多关注。旧有的统治基础因此受到冲击，共同的国家认同也有了生长的余地。"
