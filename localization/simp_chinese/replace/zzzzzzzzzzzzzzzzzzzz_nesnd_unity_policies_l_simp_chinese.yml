 nesnd_ottoman_reform_army_desc: "吸收秦国组织军队和供给部队的经验，使军官在国家事务中承担更大责任。改革期间，朝廷需要收束扩张的呼声，把精力用于军队本身。各类营级部队，包括陆战营，都将受益。"
