 nesnd_ottoman_recovery: "重整东方秩序"
 nesnd_ottoman_recovery_reason: "坦志麦特的成果关系到奥斯曼国家的生存，也关系到苏丹能否重新向东方伸张权力。军官希望改进训练与补给，朝廷则要把军队的力量变成对亚洲土地的实际要求。秦国及其周边诸国的秩序，正是这场竞争所要改变的对象。\n\n改革带来的力量仍须由军备和政治支持维持。每一项新的领土要求，都需要消耗国内积聚起来的扩张热情。"
 nesnd_ottoman_recovery_success_status: "坦志麦特已经成功。改革后的军队与朝廷可以更有力地推动东方扩张。"
 nesnd_ottoman_recovery_failed_status: "坦志麦特已经失败。朝廷仍可推动扩张，但军改与动员的成效较弱。"
 nesnd_ottoman_recovery_ongoing_status: "坦志麦特仍在进行，东方的竞争已经开始。"
