l_simp_chinese:
 nesnd_diaspora:0 "殷民人口的流散"
 nesnd_diaspora_reason:0 "起义失败以后，边界又回到了原处。可是在曾经响应起义的村落里，谁还敢指望儿女能在故乡平安长大？最先离乡的殷民向东洲和美洲各原住民政权寻求庇护。等到消息传回故乡，又有亲友循着他们走过的路举家出发。\n\n每有一国平定起义，该国原住民人口的一半便将陆续迁离。迁出国的公民权和权力分配制度越排外、越专断，人们动身便越急。"
 nesnd_diaspora_total_bar:0 "已安置人口"
 nesnd_diaspora_total_bar_desc:0 "$nesnd_diaspora_total_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]%#!"
 nesnd_diaspora_batch_bar:0 "下一批人启程"
 nesnd_diaspora_batch_bar_desc:0 "$nesnd_diaspora_batch_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_diaspora_weekly_base:0 "亲友相携，筹备远行"
 nesnd_diaspora_citizenship_row:0 "[GetLawGroup('lawgroup_citizenship').GetName]（[GetGlobalVariable('nesnd_diaspora_origin').GetCountry.GetActiveLawFromGroup('lawgroup_citizenship').GetName]）"
 nesnd_diaspora_distribution_row:0 "[GetLawGroup('lawgroup_distribution_of_power').GetName]（[GetGlobalVariable('nesnd_diaspora_origin').GetCountry.GetActiveLawFromGroup('lawgroup_distribution_of_power').GetName]）"
 nesnd_diaspora_route_status:0 "[GetGlobalVariable('nesnd_diaspora_origin').GetCountry.GetName]的[GetGlobalVariable('nesnd_diaspora_pop').GetPop.GetCulture.GetName]人正准备从[GetGlobalVariable('nesnd_diaspora_departure').GetState.GetName]前往[GetGlobalVariable('nesnd_diaspora_destination').GetState.GetOwner.GetName]的[GetGlobalVariable('nesnd_diaspora_destination').GetState.GetName]。\n$nesnd_diaspora_people_count$"
 nesnd_diaspora_waiting_status:0 "$nesnd_diaspora_no_route_status$\n$nesnd_diaspora_people_count$"
 nesnd_diaspora_no_route_status:0 "下一批人的行程尚未定下。"
 nesnd_diaspora_people_count:0 "预计迁徙 #v [GetGlobalVariable('nesnd_diaspora_total').GetValue|0]#! 人，尚有 #v [GetGlobalVariable('nesnd_diaspora_remaining').GetValue|0]#! 人待迁。"
 nesnd_diaspora_complete_tt:0 "这次流散的人们都已抵达避难地。"
 nesnd_diaspora_finish_tt:0 "平定起义的政府获得权威，向流亡者开放国境的国家获得威望，均持续十年。"
 nesnd_diaspora_no_refuge_tt:0 "仍有家庭等待迁徙，但可接纳他们的国家已没有完整拥有的美洲州可供安置。"
 nesnd_diaspora_no_refuge_conclusion:0 "各地再也找不到落脚之处。尚未启程的家庭留在了故乡。"
 nesnd_diaspora_no_refuge_effect_tt:0 "各迁出国境内仍居住的原住民人口中，#r 20%#!转向[concept_radical]。"
 nesnd_diaspora_origin_aftermath:0 "起义平定后的权威"
 nesnd_diaspora_reception:0 "流亡者的庇护所"
 nesnd_diaspora.1.t:0 "离乡的人们"
 nesnd_diaspora.1.d:0 "最后一批离乡的原住民也已在异国落脚。在起义军曾经招募兵员的村镇，留下的人要重种亲族的田地，照看不肯离开的老人。政府如今可以在这些地方平安征税。许多村民要见自己的亲人，却得先跨过国境了。"
 nesnd_diaspora.1.a:0 "他们在国境那边还有亲人。"
 nesnd_diaspora.2.t:0 "在异乡安家"
 nesnd_diaspora.2.d:0 "边境传来消息，最后一批离开起义各省的人家也找到了住处。在他们离开的村庄，人们还记得哪些国家肯为逃难的亲友开门。"
 nesnd_diaspora.2.a:0 "让他们在这里安家。"
