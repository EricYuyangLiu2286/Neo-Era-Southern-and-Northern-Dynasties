 nesnd_sha_qi_joint_tt:0 "盟约满 #v 12#! 个月后，若对方仍以共和政体据有山东省城，且与汴梁方面不在交战，登莱即请对方把登州辟为登莱的通商口岸。对方同意，渡海即告完成。"
 nesnd_sha_qi.9.t:0 "登州之请"
 nesnd_sha_qi.9.d:0 "[SCOPE.sCountry('nesnd_sha_qi_petitioner').GetName]的使节递交国书，请我国把登州辟为该国的通商口岸，港务与关税由该国派员管理。两国结盟已满一年。"
 nesnd_sha_qi.9.a:0 "开放登州"
 nesnd_sha_qi.9.b:0 "拒绝"
 nesnd_sha_qi.10.t:0 "登州之请遭拒"
 nesnd_sha_qi.10.d:0 "[SCOPE.sCountry('nesnd_sha_qi_host').GetName]拒绝把登州辟为登莱的口岸。两国的盟约仍然有效，议会五年之内不能再提此事。"
 nesnd_sha_qi.10.a:0 "暂且作罢"
