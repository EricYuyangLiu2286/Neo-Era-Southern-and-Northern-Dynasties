l_simp_chinese:
 nesnd_sha_crossing:0 "渡海"
 nesnd_sha_crossing_reason:0 "齐国败亡以后，争夺山东的国人有的渡海，有的留在登州、莱州。百余年间，海那边的国号换了几次，远北也早已长成另一个国家。今天愿意给登莱带路的人，有人想逐走驻军，有人想替本地共和党人争一席之地。他们都肯帮共和国的船靠岸，至于船上来的兵马该听谁的号令，却未必肯作同一个答复。\n\n国人议会可以出钱联络山东旧部。要把领土要求公之于众，还得等汴梁方面顾不上东海。当初从山东出走的人留下了这项主张，今日要承担军费的，却是整个[JournalEntry.GetCountry.GetName]。"
 nesnd_sha_qilu:0 "齐鲁之约"
 nesnd_sha_qilu_reason:0 "登州、莱州给了远北的共和国一个沿用至今的名字。到了今天，议会上仍有人把山东称为故土，也有从未到过山东的议员，只想知道沿海肯不肯让登莱的商船长久停泊。两边的人都肯在开埠的议案上署名，拿给对岸的条件也很明白：由国库付出价款，换取共和国管辖的一处口岸。\n\n若是治理山东的人也承认共和，国人还有另一种办法堂堂正正地走进登州。两个政府可以会盟，交换国书，各自保有疆土。这样的盟约能让登莱在山东有一个说得上话的盟友，却不能让国人议会在别人的土地上征税。"
 nesnd_sha_old_guard:0 "登莱旧部"
 nesnd_sha_old_guard_desc:0 "登莱旧部 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_sha_qi_disorder:0 "地方失序达到50"
 nesnd_sha_qi_war:0 "对方正在交战"
 nesnd_sha_qi_south:0 "汴梁已决定南下干预"
 nesnd_sha_qi_reform:0 "地权革命已经成功"
 nesnd_sha_qi_rebels:0 "大汉共和军仍在"
 nesnd_sha_qi_fleet:0 "登莱已有海军投射力量"
 nesnd_sha_land_agents:0 "派人潜回登莱"
 nesnd_sha_land_agents_desc:0 "拨款给熟悉山东沿岸的联络人，由他们探明哪些旧部仍肯接应登岸。"
 nesnd_sha_agents_terms:0 "旧部联络每 #v 12#! 个月可资助一次。有 #v 5%#! 的概率联络人被捕，登莱与汴梁政府的关系下降 #r 20#! 点。"
 nesnd_sha_coastal_aid:0 "接济北朝共和党人"
 nesnd_sha_coastal_aid_desc:0 "给山东、河间和燕京的共和党人拨付一年的活动经费，由当地人招募支持者。"
 nesnd_sha_coastal_aid_terms:0 "在汴梁方面管辖的山东、河间、燕京，各州对激进运动的支持吸引力提高 #g 15%#!，持续一年。拨款时、第六个月和第十二个月，各增加 #r 5%#! 激进派。有 #v 20%#! 的概率暴露资助来源，两国关系下降 #r 30#! 点。"
 nesnd_sha_coastal_funding:0 "华北共和党人经费"
 nesnd_sha_coastal_societies:0 "沿海共和党人的活动"
 nesnd_sha_court_gentry:0 "结交北朝地主"
 nesnd_sha_court_gentry_desc:0 "拨款联络有意抵制朝廷地政的地主，支持他们在本国政坛上施加影响。"
 nesnd_sha_gentry_terms:0 "地主政治力量提高 #v 10%#!，认可下降 #r 2#!，持续 #v 24#! 个月，期满后再等 #v 24#! 个月可重新结交。有 #v 20%#! 的概率暴露资助来源，两国关系下降 #r 30#! 点。"
 nesnd_sha_gentry_opposition:0 "地主抵制地政"
 nesnd_sha_homecoming_prestige:0 "还乡"
 nesnd_sha_homecoming_army:0 "渡海得胜"
 nesnd_sha_shandong_settled_status:0 "山东交涉已有定局。国人议会可以重新议定政体。"
 nesnd_sha_crossing_status:0 "先派人联络旧部或接济共和党人。旧部达到 #v 100#! 后，须等汴梁方面交战、爆发革命或地权革命失败。与山东主人停战期间不能发难。"
 nesnd_sha_claim_ready:0 "议会已对山东提出领土要求。取得当地土地即可完成渡海。与对方停战而未得地，必须重新联络旧部。"
 nesnd_sha_qi_allied_status:0 "山东的共和政府已与登莱结盟。盟约满一年、对方与汴梁方面停战后，登莱将请对方把登州辟为登莱的口岸，对方同意即完成渡海。遭拒后须等五年才能再请。盟约存续期间，议会不对盟友提出领土要求。"
 nesnd_sha_qilu_status:0 "可向掌握山东口岸的政府提出「请开登州」。若山东省城由共和政府治理，两国结盟或同属一个国家集团，也可完成会盟。"
 nesnd_sha_crossing_landed:0 "登莱在山东实际占有土地。"
 nesnd_sha_qilu_open_port:0 "登莱已取得山东通商口岸或整个山东。"
 nesnd_sha_qilu_allied:0 "治理山东省城的共和政府已与登莱结盟或同属一个国家集团。"
 nesnd_sha_qi_deadline:0 "十五年期限"
 nesnd_sha_qi_on_deadline:0 "期限届满后"
 nesnd_sha_qi_time_up:0 "议会为山东计划划定的十五年期限已满。"
 nesnd_sha_qi_bankrupt:0 "对方已宣布破产"
 nesnd_sha_qi_republic:0 "对方采用共和政体"
 nesnd_sha_qi_against_north:0 "对方与汴梁政府交战"
 nesnd_sha_qi_subject:0 "对方为附属国"
 nesnd_sha_qi_passage_terms:0 "从汴梁政府治下接运 #v 5,000–10,000#! 名华北人抵达登莱首都，两国关系下降 #r 10#! 点。"
 nesnd_sha_open_dengzhou:0 "请开登州"
 nesnd_sha_open_dengzhou_desc:0 "请求掌握山东口岸的政府将港区交由登莱管辖。登莱在交割时支付价款。"
 nesnd_sha_open_dengzhou_terms:0 "登莱支付本国 GDP 的 #v 5%#!，至少 @money!#v 7,500#!，对方取得价款并割让山东口岸。拒绝后 #v 60#! 个月可再提议。"
 nesnd_sha_republic_league:0 "倡立共和同盟"
 nesnd_sha_republic_league_desc:0 "邀请对方加入登莱主持的国家集团。登莱已有集团且为盟主时，来约直接邀请入盟。"
 nesnd_sha_republic_league_terms:0 "获准后登莱主持集团，对方加入。需要新建时采用意识形态联盟。拒绝后 #v 24#! 个月可再提议。"
 nesnd_sha_league_of_republics:0 "共和同盟"
 nesnd_sha_qi.1.t:0 "登州的灯火"
 nesnd_sha_qi.1.d:0 "登州沿岸传来消息。过去愿意替登莱送信的人，只肯把信送到熟人手里。如今他们肯告诉船主哪处可以下锚，也肯在岸上等共和国的兵马。[SCOPE.sCountry('nesnd_sha_qi_host').GetName]仍掌握着山东省城，登莱没有因此多出一寸土地。但国人议会终于有了向对方公开提出山东要求的凭据。"
 nesnd_sha_qi.1.f:0 "“你们若只派人送信，一条渔船我就能给你们找来。若是要我在岸上接应军队，请议会先把肯派多少艘船告诉我。”——山东联络人致登莱代表"
 nesnd_sha_qi.1.a:0 "以共和国名义提出对山东的宣称。"
 nesnd_sha_qi.2.t:0 "两个共和国"
 nesnd_sha_qi.2.d:0 "登莱旧部送来的消息里，山东省城上空的旗帜已经变了。[SCOPE.sCountry('nesnd_sha_qi_host').GetName]也以共和的名义治理这片土地。国人议会原先答应山东同道，到了能登岸的那一天，两方的兵马会站在一边。如今要兑现这句话，只消承认对岸也有一个能签约的政府。可若仍要对山东行使主权，议员们就必须当众说明，为何同一面共和旗帜下会有两支彼此为敌的军队。"
 nesnd_sha_qi.2.f:0 "“他们在山东称国人，我们在远北也称国人。请诸位把下一道军令写得明白些，好让领命的人知道究竟要向谁开火。”——登莱议会辩论"
 nesnd_sha_qi.2.a:0 "与山东的共和政府结盟，合兵作战。"
 nesnd_sha_qi.2.b:0 "议会仍然要求山东主权。"
 nesnd_sha_qi.3.t:0 "还乡"
 nesnd_sha_qi.3.d:0 "一纸领土要求，如今终于换成了山东境内由[ROOT.GetCountry.GetName]直接管辖的土地。随船来到岸上的人当中，有些确实是来还乡的。他们的亲族还住在附近，甚至有同宗的人肯领他们去认祖坟。军队里也有头一回见到山东的人。他们奉共和国的命令来此驻防，在故乡等他们写信的人还远在辽东或海的另一头。\n\n国人议会可以另外决定是否还都青岛。山东已经有了共和国的疆土，这场争论终于有了可以落脚的地方。"
 nesnd_sha_qi.3.f:0 "“我来时，母亲要我给她捎一把祖坟上的土。同船那位在苦兀出生的军官听说了，立刻准了我的假。他自己还得留在码头接下一船人。”——一名山东籍士兵的家书"
 nesnd_sha_qi.3.a:0 "将山东属地列入共和国版图。"
 nesnd_sha_qi.4.t:0 "海上的十五年"
 nesnd_sha_qi.4.d:0 "国人议会给渡海一事定下十五年期限。到了这一天，山东的州县仍旧没有一处向登莱纳税，议员也无法再凭当年的授权向国库索取渡海经费。有些山东出身的家庭还会自己筹措船资。共和国要在山东取得的那一席之地，却只能等以后的国人另想办法。"
 nesnd_sha_qi.4.f:0 "“这十五年，海上的路我们已经走熟了。至于山东岸上的路，我今日还不能请诸位标在本国的地图上。”——登莱代表向议会复命"
 nesnd_sha_qi.4.a:0 "渡海授权至此期满。"
 nesnd_sha_qi.5.t:0 "登州开埠"
 nesnd_sha_qi.5.d:0 "往来山东的船主过去最担心的，是船到岸才听说通商的成例又变了。如今[ROOT.GetCountry.GetName]在山东有了自己的口岸，可以自行颁给船照、检验货单，也要自行承担沿海缉私和修葺码头的开销。当初鼓吹开埠的商家已经把货运了来。议会上那些主张向内地再走一步的人，也已经开始打听青岛的事了。"
 nesnd_sha_qi.5.f:0 "“从前泊在这里，我得先问今年许不许卸货。今日我只问收多少税。议会若肯把税则也定下来，我下次能多带一船。”——登莱船主"
 nesnd_sha_qi.5.a:0 "准许本国船只在山东口岸报关。"
 nesnd_sha_qi.6.t:0 "会盟"
 nesnd_sha_qi.6.d:0 "治理山东的共和政府如今已与登莱会盟。往日山东来信，要托可靠的人辗转送到国人议员手里。此后两国若要商议海运、侨民或共同的敌人，可以派出使节，堂堂正正地向对方递交国书。\n\n对方保有山东的管辖权。对许多远北议员来说，能在山东有这样一位盟友，已经足以向当年为此拨款的选民交代。"
 nesnd_sha_qi.6.f:0 "“两国的印信各盖各的，倒比当年许多人只肯给我们捎一句口信的时候，更像是真正的同道了。”——登莱使节致国人议会"
 nesnd_sha_qi.6.a:0 "承认山东盟友的管辖权。"
 nesnd_sha_qi.7.t:0 "收容流亡者"
 nesnd_sha_qi.7.d:0 "华北的共和党人与朝廷交兵，逃出驻地的人往往还带着家眷。他们走到海边才发现，船主肯空着舱位等议会担保，却不肯凭一句同情就替一家人付清渡海的钱。登莱若出面接运，愿走的人就能在共和国首都落脚。汴梁方面也会知道，是谁给这些人留了一条退路。"
 nesnd_sha_qi.7.f:0 "“人上了船，我可以在舱单上写下他们的名字。到了港口让不让他们下来，得有议会一句准话。”——一名承运船主"
 nesnd_sha_qi.7.a:0 "准许他们在首都落户。"
 nesnd_sha_qi.7.b:0 "这一次不给船主担保。"
 nesnd_sha_qi.8.t:0 "望乡"
 nesnd_sha_qi.8.d:0 "十五年来，登莱的使者试过开埠，也盼过与山东会盟。到了议会约定的期限，两个政府之间仍没有一份足以交代此行的约书。登莱的船仍可照旧往来，船到岸上要听谁的号令，也仍须看对方的脸色。"
 nesnd_sha_qi.8.f:0 "“海上望得见山东，并不表示山东的官员非得给我们开门。诸位若还有别的办法，下次请另提议案。”——国人议会辩论"
 nesnd_sha_qi.8.a:0 "结束这次山东交涉。"
