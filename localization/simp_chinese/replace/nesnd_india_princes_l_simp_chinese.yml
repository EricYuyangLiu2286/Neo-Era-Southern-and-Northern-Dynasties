 nesnd_india_revolt.1.t:0 "宣告独立"
 nesnd_india_revolt.1.d:0 "[SCOPE.sState('india_case_state').GetName]的起义者宣告脱离[SCOPE.sCountry('india_case_owner').GetName]独立，成立了共和政府，实行$law_oligarchy$，经费来自[SCOPE.sCountry('india_sponsor').GetName]。[SCOPE.sCountry('india_case_owner').GetName]不会坐视，收复的军队即将出发。"
