 nesnd_india_north_held_trigger_tt:0 "「$nesnd_india_north_bar$」进度达到 #v 100#!"
 nesnd_india_north_held_effect_tt:0 "被宣称的我国各州获得持续十年的「$nesnd_india_north_garrison$」，当地我国主体文化人口中 #g 5%#! 成为[concept_loyalist]。我国与$nesnd_lobby_name_per$的[concept_relations]恶化 #r 10#! 点。十年内不再为此事重开日志。"
 nesnd_india_north_held_conclusion:0 "边防整顿完成，$nesnd_lobby_name_per$的东进势头已被挡下。"
 nesnd_india_north_lost_trigger_tt:0 "被宣称的州地区中至少有一处落入$nesnd_lobby_name_per$、其宗主或其附属国之手"
 nesnd_india_north_lost_effect_tt:0 "失守各州成为$nesnd_lobby_name_per$主体文化的[concept_homeland]，我国对失守各州获得[concept_claim]。我国首都州 #r 10%#! 人口成为[concept_radical]。十年后若条件再成立可重开日志。"
 nesnd_india_north_lost_conclusion:0 "被宣称的边州已经失守，$nesnd_lobby_name_per$的东征得手。"
 nesnd_india_north.1.t:0 "[SCOPE.sCountry('india_north_defender').GetName]整饬边备"
 nesnd_india_north.1.d:0 "边境探报送抵[ROOT.GetCountry.GetName]政府，[SCOPE.sCountry('india_north_defender').GetName]正针对我国的[concept_claim]加紧整顿军务，在各要冲增调兵员并四出遣使。城防与联络一旦就绪，东进将面对更严密的抵抗。"
 nesnd_india_north.1.f:0 "“彼邦连月调兵遣使，边防日渐周密，不可不察。”\n——边境军政急报"
 nesnd_india_north.1.a:0 "加紧图谋。"
 nesnd_india_north.1.b:0 "暂缓东进。"
 nesnd_india_north.2_outcome_tt:0 "收到事件「$nesnd_india_north.2.t$」：我国永久获得「$nesnd_india_north_held$」（部队[concept_defense] #g +5%#!、[concept_prestige] #g +5%#!），被宣称各州获持续十年的「$nesnd_india_north_garrison$」与主体文化[concept_loyalist]，双方[concept_relations]恶化 #r 10#! 点。"
 nesnd_india_north.2.t:0 "东征被挡"
 nesnd_india_north.2.d:0 "经过连年筹备与交涉，[ROOT.GetCountry.GetName]已在被$nesnd_lobby_name_per$宣称的各州站稳脚跟。地方营伍与对外联络均已就绪，对方的东进企图未能趁虚而入。"
 nesnd_india_north.2.f:0 "“边州戒备已成，疆土未损分毫。”\n——[ROOT.GetCountry.GetName]政府公告"
 nesnd_india_north.2.a:0 "守住边疆。"
 nesnd_india_north.2.a_tt:0 "我国已永久获得「$nesnd_india_north_held$」，被宣称各州获得十年「$nesnd_india_north_garrison$」与 #g 5%#! 主体文化[concept_loyalist]，与$nesnd_lobby_name_per$[concept_relations]恶化 #r 10#! 点。"
 nesnd_india_north.3.t:0 "[SCOPE.sCountry('india_north_defender').GetName]稳住边防"
 nesnd_india_north.3.d:0 "[SCOPE.sCountry('india_north_defender').GetName]已完成边疆整备，其境内被[ROOT.GetCountry.GetName]宣称的各州均在重兵防卫之下。先前的[concept_claim]未能迫使对方退让，两国关系随之进一步趋冷。"
 nesnd_india_north.3.f:0 "“东境诸城守备已固，徒凭文书恐难使其屈服。”\n——前线回禀"
 nesnd_india_north.3.a:0 "暂记此事，另寻战机。"
 nesnd_india_north.3.a_tt:0 "我国与[SCOPE.sCountry('india_north_defender').GetName]的[concept_relations]恶化 #r 10#! 点。"
 nesnd_india_north.4_outcome_tt:0 "收到事件「$nesnd_india_north.4.t$」：失守各州成为$nesnd_lobby_name_per$主体文化的[concept_homeland]，我国对失守各州获得[concept_claim]，获得持续十年的「$nesnd_india_north_lost$」（[concept_legitimacy] #r -5#!），首都州 #r 10%#! 人口成为[concept_radical]。"
 nesnd_india_north.4.t:0 "东征得手"
 nesnd_india_north.4.d:0 "被$nesnd_lobby_name_per$宣称的印度边州已落入对方阵营之手。[ROOT.GetCountry.GetName]未能守住原有疆界，都城内外人心浮躁，政府只得保留对失地的[concept_claim]以待日后收复。"
 nesnd_india_north.4.f:0 "“边州失陷，民情惶然，唯存旧图以俟他日。”\n——[ROOT.GetCountry.GetName]政府布告"
 nesnd_india_north.4.a:0 "铭记失地，以待收复。"
 nesnd_india_north.4.a_tt:0 "失守各州已成为$nesnd_lobby_name_per$主体文化的[concept_homeland]，我国获得失守各州[concept_claim]与十年「$nesnd_india_north_lost$」，首都州 #r 10%#! 人口成为[concept_radical]。"
 nesnd_india_north.5.t:0 "东征立足印度"
 nesnd_india_north.5.d:0 "[SCOPE.sCountry('india_north_defender').GetName]原本持有的被宣称州份已归入[ROOT.GetCountry.GetName]一方统治。新占之地开始迁入并安置本国族群，而对方政府仍未放弃对旧土的[concept_claim]。"
