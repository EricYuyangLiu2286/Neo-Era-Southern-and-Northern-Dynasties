 nesnd_india_union.3.d_ask_silent:0 "[SCOPE.sCountry('india_consent_lord').GetName]在期限内没有答复，我国加入[SCOPE.sCountry('india_partner').GetName]的请求没有送出。"
 nesnd_india_union.3.d_ask_void:0 "情况已经改变，我国加入[SCOPE.sCountry('india_partner').GetName]的请求不再成立。"
 nesnd_india_union.3.f:0 "“[concept_subject]国的去留，须先经[concept_overlord]许可。”\n——[ROOT.GetCountry.GetName]政府的备忘录"
 nesnd_india_union_no_consent_tt:0 "没有任何款项付出，附属关系不变。"
 nesnd_india_union_wait_tt:0 "六个月内，我国不能再提出交涉。"
 nesnd_india_union.4.t:0 "请求加入"
 nesnd_india_union.4.d:0 "[ROOT.GetCountry.GetName]可以请求加入[SCOPE.sCountry('india_union_host').GetName]。王公身边的人对加入的方式意见不一：有人愿意直接并入，有人只肯做它的[concept_dominion]，保留本邦的政府。"
 nesnd_india_union.4.f:0 "“本邦愿意加入贵国，请贵国政府开列条件。”\n——[ROOT.GetCountry.GetName]致[SCOPE.sCountry('india_union_host').GetName]的国书"
 nesnd_india_union.4.merge:0 "请求并入[SCOPE.sCountry('india_union_host').GetName]。"
 nesnd_india_union_ask_merge_tt:0 "请[SCOPE.sCountry('india_union_host').GetName]将我国并入。[SCOPE.sCountry('india_union_host').GetName]同意后，支付 @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|K] 的安置费，并为我国王公记一份王公年金，我国的州、人口和军队归[SCOPE.sCountry('india_union_host').GetName]所有。"
 nesnd_india_union_ask_consent_tt:0 "我国是[ROOT.GetCountry.GetOverlord.GetName]的[concept_subject]，请求须先经[ROOT.GetCountry.GetOverlord.GetName]许可，许可以后才送到[SCOPE.sCountry('india_union_host').GetName]。[SCOPE.sCountry('india_union_host').GetName]同意时，另付给[ROOT.GetCountry.GetOverlord.GetName] @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|K] 的补偿。"
 nesnd_india_union_ask_wait_tt:0 "得到答复以前，我国不能提出别的交涉。请求送出以后六个月内，也不能再提出交涉。"
 nesnd_india_union.4.dominion:0 "请求成为[SCOPE.sCountry('india_union_host').GetName]的[concept_dominion]。"
 nesnd_india_union_ask_not_own_subject_tt:0 "我国还不是[SCOPE.sCountry('india_union_host').GetName]的[concept_subject]"
 nesnd_india_union_ask_dominion_tt:0 "请[SCOPE.sCountry('india_union_host').GetName]接纳我国为[concept_dominion]。[SCOPE.sCountry('india_union_host').GetName]同意后，付给我国 @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|K]，并为我国王公记一份王公年金，我国保留自己的州、政府、法律、[concept_treasury]和军队。"
 nesnd_india_union.4.later:0 "暂不请求。"
 nesnd_india_union_ask_later_tt:0 "这次不提出请求，也不占用交涉的机会。"
