 nesnd_india_lord_two_left_tt:0 "十年内已有两个属邦独立"
 nesnd_india_lord_scattered_claims_tt:0 "我国对离去属邦持有的印度各[concept_state]提出[concept_claim]。"
 nesnd_india_lord_scattered_goal_tt:0 "我国把两国中[concept_gdp]较高的一个视为敌手。"
 nesnd_india_lord_calm_conclusion:0 "十年来，没有一个属邦走到独立的边缘。"
