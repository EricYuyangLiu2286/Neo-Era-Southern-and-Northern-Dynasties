 nesnd_india_diplomacy.1.t12:0 "赈灾求援"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName]政府请求本国拨款，并选派教师到该国的学校任教四年。该国愿对本国负一项义务。本国的语言和学说可由此传入该国的学校。"
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName]政府请求本国拨款，并派工程师协助该国兴建$building_tooling_workshop$。拨款折为本国在该厂的所有权，该国并愿对本国负一项义务。"
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName]政府请求本国拨款，并派军官训练该国军队四年。该国愿向本国军队开放领土五年，并对本国负一项义务。"
 nesnd_india_diplomacy.1.d4:0 "[SCOPE.sCountry('india_sender').GetName]正式请求提高自治。如予拒绝，该国对本国的不满将更为显著，两国关系亦将受损。"
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName]的使者提议两国缔结为期三年的防御条约：一方遭受攻击时，另一方应出兵援助。"
 nesnd_india_diplomacy.1.d6_own:0 "[ROOT.GetCountry.GetName]现为[SCOPE.sCountry('india_sender').GetName]的附属国。[SCOPE.sCountry('india_sender').GetName]邀请本邦正式并入帝国：王室由帝国供养，本邦不再作为国家存在。如予拒绝，[SCOPE.sCountry('india_sender').GetName]将对本邦的土地提出领土要求。"
 nesnd_india_diplomacy.1.d6_former:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]加入帝国。本邦现在的宗主国已经准许，[SCOPE.sCountry('india_sender').GetName]将另行向其补偿。本邦可以并入帝国，也可以作为帝国的自治领，保留本邦的政府、法律、国库和军队。如予拒绝，[SCOPE.sCountry('india_sender').GetName]将对本邦的土地提出领土要求。"
 nesnd_india_diplomacy.1.d6_merge_only:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]并入帝国，王室由帝国供养。按两国的地位，本邦不能以自治领的身份加入。如予拒绝，[SCOPE.sCountry('india_sender').GetName]将对本邦的土地提出领土要求。"
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]加入帝国。本邦可以并入帝国，由帝国供养王室，也可以作为帝国的自治领，保留本邦的政府、法律、国库和军队，并收取帝国的一笔款项。如予拒绝，[SCOPE.sCountry('india_sender').GetName]将对本邦的土地提出领土要求。"
 nesnd_india_diplomacy.1.d8_dominion:0 "[SCOPE.sCountry('india_sender').GetName]请求成为本国的[concept_dominion]。该邦将保留其政府、法律、国库和军队，本国须向该邦支付一笔款项，并负担王公年金十年。"
 nesnd_india_diplomacy.1.d8_merge:0 "[SCOPE.sCountry('india_sender').GetName]请求并入本国，该邦王室由帝国供养。本国须支付一笔款项，并负担王公年金十年。"
 nesnd_india_diplomacy.1.d9_survey:0 "[SCOPE.sCountry('india_sender').GetName]请本国派工程师前往测绘，费用由该邦支付。"
 nesnd_india_diplomacy.1.d9_grant:0 "[SCOPE.sCountry('india_sender').GetName]请本国拨款，在[SCOPE.sState('india_project_site').GetName]兴建一所大学。该邦愿对本国负一项义务。"
 nesnd_india_diplomacy.1.d9_workshop:0 "[SCOPE.sCountry('india_sender').GetName]请本国出资，在[SCOPE.sState('india_project_site').GetName]兴建一座$building_tooling_workshop$。建成的一级归本国所有，该邦并愿对本国负一项义务。"
 nesnd_india_diplomacy.1.d9_railway:0 "[SCOPE.sCountry('india_sender').GetName]请本国出资，在[SCOPE.sState('india_project_site').GetName]修筑一段$building_railway$。建成的一级归本国所有，该邦并愿对本国负一项义务。"
 nesnd_india_diplomacy.1.d10:0 "[SCOPE.sCountry('india_sender').GetName]提出把[SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_mug_deal_state').GetState.GetName]一处产业中的一级作价 #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#! 卖给我们。"
