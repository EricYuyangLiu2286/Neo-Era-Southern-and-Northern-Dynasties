 nesnd_india_union:0 "王公同盟"
 nesnd_india_union_reason:0 "[ROOT.GetCountry.GetName]是印度仍保持独立的土邦之一。印度的帝国邀请土邦归附，遭拒绝时即对该邦的土地提出领土要求。独立的土邦之间现无共同的盟约。本邦宫廷中有人主张与他邦订立互保的盟约：一邦遭受攻击，他邦出兵援助。"
