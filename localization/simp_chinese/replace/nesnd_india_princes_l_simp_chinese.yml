 nesnd_india_union_invite_cooldown_tt:0 "十二个月内没有派出过使者"
 nesnd_india_union_invite_target_tt:0 "有可以联络的土邦"
 nesnd_india_union_invite_effect_tt:0 "使者出发，对方随后答复。十二个月后才能再派使者。"
 nesnd_india_union_pact:0 "王公同盟"
 nesnd_india_union_broken:0 "同盟瓦解"
 nesnd_india_union_pact_conclusion:0 "三个以上的独立土邦结成了同盟，约定彼此担保。"
 nesnd_india_union_pact_trigger_tt:0 "$nesnd_india_union$中至少有 #v 3#! 个独立土邦"
 nesnd_india_union_pact_protect_tt:0 "同盟各邦互以保护对方为外交目标。"
 nesnd_india_union_pact_resist_tt:0 "帝国邀请同盟中的一邦遭拒时，其余各邦与帝国的[concept_relations] #r -10#!。"
 nesnd_india_union_broken_conclusion:0 "同盟中的独立土邦已不足两个，同盟不复存在。"
