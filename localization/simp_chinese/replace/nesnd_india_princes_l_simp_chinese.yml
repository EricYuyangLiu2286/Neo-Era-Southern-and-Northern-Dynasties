 nesnd_india_diplomacy.1.t:0 "外交使团"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName]请[SCOPE.sCountry('india_partner').GetName]派教师到当地授课，并拨款资助学校。"
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName]想开办[GetBuildingType('building_tooling_workshop').GetName]，请[SCOPE.sCountry('india_partner').GetName]派工程师，并提供拨款。"
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName]请[SCOPE.sCountry('india_partner').GetName]派教官训练军队，并拨付训练经费。"
 nesnd_india_diplomacy.1.d4:0 "[SCOPE.sCountry('india_sender').GetName]的使者要求扩大自治权，让当地政府自己处理更多的内政。"
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName]提议缔结共同防御条约。对方希望在受到进攻时得到援助，也愿承担保卫我们的义务。"
 nesnd_india_diplomacy.1.d6_own:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]并入，并愿意为我国王公承担一份王公年金。我国已经是[SCOPE.sCountry('india_sender').GetName]的[concept_subject]，并入以后，土地与人民由[SCOPE.sCountry('india_sender').GetName]的政府直接管辖。如果婉拒，我国维持现状。"
 nesnd_india_diplomacy.1.d6_former:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]加入，并愿意为我国王公承担一份王公年金。[SCOPE.sCountry('india_partner').GetOverlord.GetName]已经以[concept_overlord]的身份许可此事。我国接受邀请，就将脱离[SCOPE.sCountry('india_partner').GetOverlord.GetName]。如果婉拒，我国仍是[SCOPE.sCountry('india_partner').GetOverlord.GetName]的[concept_subject]。"
 nesnd_india_diplomacy.1.d6_merge_only:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]并入，愿意支付安置费，并为我国王公承担一份王公年金。并入以后，我国的土地与人民由[SCOPE.sCountry('india_sender').GetName]的政府管辖。我国眼下不能成为[SCOPE.sCountry('india_sender').GetName]的[concept_dominion]，只能选择并入或者婉拒。如果婉拒，两国之间已有的约定都不受影响。"
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]加入，愿意支付安置费，并为我国王公承担一份王公年金。我国可以并入[SCOPE.sCountry('india_sender').GetName]，土地与人民从此由它的政府管辖。我国也可以成为它的[concept_dominion]，保留自己的政府、法律、[concept_treasury]和军队。如果婉拒，两国之间已有的约定都不受影响。"
 nesnd_india_diplomacy.1.d8_dominion:0 "[SCOPE.sCountry('india_sender').GetName]请求成为[ROOT.GetCountry.GetName]的[concept_dominion]，保留它自己的政府、法律、[concept_treasury]和军队。我国要为它的王公承担一份王公年金。"
 nesnd_india_diplomacy.1.d8_merge:0 "[SCOPE.sCountry('india_sender').GetName]请求并入[ROOT.GetCountry.GetName]。并入以后，它的土地与人民将由我国政府管辖，我国要为它的王公承担一份王公年金。"
