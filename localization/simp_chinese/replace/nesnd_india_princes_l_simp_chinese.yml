 nesnd_india_project_ask_grant_tt:0 "请对方政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|K] 资助办学，对方不取得产权。对方同意后，工程进入我国政府的建造队列，我国欠对方一份[concept_obligation]，两国[concept_relations]改善 #g 25#! 点。三年内没有建成，这项工程就不再作为本地项目跟进。"
 nesnd_india_project_ask_stake_tt:0 "请对方政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|K]。对方同意后，一级建筑立即落成，产权归对方政府。我国得到拨款，欠对方一份[concept_obligation]，两国[concept_relations]改善 #g 25#! 点。"
