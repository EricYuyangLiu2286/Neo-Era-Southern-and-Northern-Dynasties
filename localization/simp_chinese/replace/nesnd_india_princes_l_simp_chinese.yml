 nesnd_india_union.1.d_former_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName]经我国许可，已经脱离我国，成为[SCOPE.sCountry('india_union_empire').GetName]的[concept_dominion]。"
 nesnd_india_union_host_paid_tt:0 "我国支付了 @money![SCOPE.GetValue('india_union_price')|K]，[SCOPE.sCountry('india_union_prince').GetName]的王公列入我国的王公年金。王公年金现为 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_pension_count_value')|0]#! 份，最多 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_pension_cap')|0]#! 份。"
 nesnd_india_union_prince_paid_tt:0 "[SCOPE.sCountry('india_union_empire').GetName]已付给我国 @money![SCOPE.GetValue('india_union_price')|K]，并为我国王公承担一份王公年金。"
 nesnd_india_union.1.d_host_merge:0 "[SCOPE.sCountry('india_union_prince').GetName]已经并入我国，它的土地与人民从此由我国政府管辖。"
 nesnd_india_union.1.d_host_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName]已经成为我国的[concept_dominion]，保留自己的政府、法律、[concept_treasury]和军队。"
 nesnd_india_union.1.d_prince_dominion:0 "[SCOPE.sCountry('india_union_empire').GetName]同意了我国的请求，我国已经成为[SCOPE.sCountry('india_union_empire').GetName]的[concept_dominion]，保留自己的政府、法律、[concept_treasury]和军队。"
 nesnd_india_union.1.f:0 "“王公年金由[SCOPE.sCountry('india_union_empire').GetName]国库支付，期限十年。”\n——[SCOPE.sCountry('india_union_empire').GetName]与[SCOPE.sCountry('india_union_prince').GetName]的加入文书"
 nesnd_india_union_merged_tt:0 "[SCOPE.sCountry('india_union_prince').GetName]的州、人口和军队归[SCOPE.sCountry('india_union_empire').GetName]所有。"
 nesnd_india_union_dominion_tt:0 "[SCOPE.sCountry('india_union_prince').GetName]是[SCOPE.sCountry('india_union_empire').GetName]的[concept_dominion]。"
 nesnd_india_union_compensated_tt:0 "我国得到 @money![SCOPE.GetValue('india_union_price')|K] 的补偿。"
