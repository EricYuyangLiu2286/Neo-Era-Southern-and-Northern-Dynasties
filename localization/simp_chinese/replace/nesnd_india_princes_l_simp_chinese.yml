 nesnd_india_indep.12.d:0 "[ROOT.GetCountry.GetName]已脱离[SCOPE.sCountry('india_free_lord').GetName]的宗主权，成为独立国家。独立之后的对外方针，政府内部尚未议定。"
 nesnd_india_indep.12.f:0 "“本国自即日起，不受任何外国的宗主权约束。”\n——独立宣言"
 nesnd_india_indep.12.a:0 "亲近[SCOPE.sCountry('india_free_empire').GetName]"
