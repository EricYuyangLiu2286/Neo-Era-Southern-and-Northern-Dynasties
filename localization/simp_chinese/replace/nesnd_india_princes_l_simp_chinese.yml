 nesnd_india_union.4.t:0 "加入帝国的方式"
 nesnd_india_union.4.d:0 "[SCOPE.sCountry('india_union_host').GetName]是印度最富有的帝国。王公可以请求让本邦并入帝国，由帝国供养王室，也可以请求成为帝国的自治领，留住本邦的政府、国库和军队，只在外交上听从帝国。"
 nesnd_india_union.4.f:0 "“本邦愿归附帝国，所请条款，伏候裁夺。”\n——王公致帝国的书信"
 nesnd_india_union.4.merge:0 "请求并入"
 nesnd_india_union_ask_merge_tt:0 "请求[SCOPE.sCountry('india_union_host').GetName]吞并本邦。获准后本邦不再作为国家存在，[SCOPE.sCountry('india_union_host').GetName]负担[GetStaticModifier('nesnd_india_princely_pensions').GetName]十年。"
 nesnd_india_union_ask_consent_tt:0 "须先经宗主国同意。"
 nesnd_india_union_ask_wait_tt:0 "请求送出后，对方在 45 天内答复。"
 nesnd_india_union.4.dominion:0 "请求成为自治领"
 nesnd_india_union_ask_not_own_subject_tt:0 "本邦不是[SCOPE.sCountry('india_union_host').GetName]的附属国（已是其附属国的只能请求并入）"
 nesnd_india_union_ask_dominion_tt:0 "请求成为[SCOPE.sCountry('india_union_host').GetName]的[concept_dominion]。获准后本邦保留政府、法律、国库和军队，收到 #v [SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|D]#!，并获得[GetStaticModifier('nesnd_india_prince_privileges').GetName]。"
