 nesnd_india_revolt.2.d:0 "[ROOT.GetCountry.GetName]的独立已经保全。政府中有人主张加入资助本国的[SCOPE.sCountry('india_revolt_sponsor').GetName]，作为自治领保留本国的政府和军队。另一些人主张本国不再隶属任何国家。"
