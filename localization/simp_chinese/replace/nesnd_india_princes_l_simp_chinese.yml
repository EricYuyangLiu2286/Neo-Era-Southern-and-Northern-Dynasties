 nesnd_india_union.4.t:0 "加入帝国的方式"
 nesnd_india_union.4.d:0 "[SCOPE.sCountry('india_union_host').GetName]是印度各帝国中最富有的一国。本邦可以请求并入帝国，由帝国供养王室，也可以请求成为帝国的自治领，保留本邦的政府、国库和军队，对外事务听从帝国。"
