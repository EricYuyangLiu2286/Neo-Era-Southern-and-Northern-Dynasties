 nesnd_india_union_invite_button:0 "邀约互保"
 nesnd_india_union_invite_button_desc:0 "向与我国关系最高且尚未缔结防御[concept_treaty]的[concept_princely_state]发出互保邀约。"
 nesnd_india_union_invite_cooldown_tt:0 "距上次发出互保邀约已满十二个月"
 nesnd_india_union_invite_target_tt:0 "存在处于和平且尚未与我国缔结防御[concept_treaty]的其他[concept_princely_state]"
 nesnd_india_union_invite_effect_tt:0 "支出我国一个月的收入（下限 @money!2,000，上限 @money!20,000），向与我国[concept_relations]最高且尚未结约的[concept_princely_state]发出互保邀约（优先选择独立土邦），十二个月内无法再次发出。对方同意则双方缔结防御[concept_treaty]、独立双方加入土邦联合并改善关系 #g 20#! 点，对方拒绝则两国关系恶化 #r 10#! 点。"
 nesnd_india_union_pact:0 "联合成约"
 nesnd_india_union_broken:0 "联合破裂"
 nesnd_india_union_pact_conclusion:0 "至少三个独立[concept_princely_state]已结成互保之盟，联合成约正式生效。"
 nesnd_india_union_pact_trigger_tt:0 "我国已加入土邦联合，且联合中至少有 3 个独立土邦（当前 [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_union_member_count')|0] / 3）"
 nesnd_india_union_pact_protect_tt:0 "联合各成员之间彼此确立护卫意向。"
 nesnd_india_union_pact_resist_tt:0 "此后帝国向联合任一成员提出并入邀请时，该成员同意并入的意愿大幅降低。"
 nesnd_india_union_broken_conclusion:0 "土邦联合的独立成员已不足两邦，互保之盟就此瓦解。"
 nesnd_india_union_broken_trigger_tt:0 "土邦联合曾经达到至少 2 个成员，如今尚存的独立成员不足 2 个"
 nesnd_india_union_broken_effect_tt:0 "若离去的原成员依然存在，我国与其[concept_relations]恶化 #r 30#! 点。十年之后，我国若仍保持独立，可重新开启「$nesnd_india_union$」。"
 nesnd_india_union.5.t:0 "互保邀约"
 nesnd_india_union.5.d:0 "[SCOPE.sCountry('india_league_inviter').GetName]遣使致书[ROOT.GetCountry.GetName]，提议两国缔结防御[concept_treaty]并共组土邦联合。来使陈词称，各邦唯有守望相助，方能抵御帝国步步紧逼的并吞。"
 nesnd_india_union.5.f:0 "“各邦唇齿相依，若不早结互保之约，恐将逐一受制于人。”\n——[SCOPE.sCountry('india_league_inviter').GetName]致[ROOT.GetCountry.GetName]的国书"
 nesnd_india_union.5.a:0 "答应结约互保。"
 nesnd_india_union.5.a_tt:0 "两国[concept_relations]改善 #g 20#! 点，缔结五年期防御[concept_treaty]（依次尝试[concept_defensive_pact]、同盟或保证独立），且独立双方加入土邦联合。"
 nesnd_india_union.5.b:0 "婉拒这项邀约。"
 nesnd_india_union.5.b_tt:0 "拒绝邀约，我国与[SCOPE.sCountry('india_league_inviter').GetName]的[concept_relations]恶化 #r 10#! 点。"
 nesnd_india_union.6.t:0 "互保邀约的答复"
 nesnd_india_union.6.d_accept:0 "[SCOPE.sCountry('india_league_target').GetName]的政府已接受[ROOT.GetCountry.GetName]的互保邀约，两国使节签署了防御[concept_treaty]。"
 nesnd_india_union.6.d_decline:0 "[SCOPE.sCountry('india_league_target').GetName]的政府婉拒了[ROOT.GetCountry.GetName]的互保邀约，双方未能达成协议。"
 nesnd_india_union.6.f:0 "“来书所议互保事宜，本国政府业已作出答复。”\n——[SCOPE.sCountry('india_league_target').GetName]政府的答复照会"
 nesnd_india_union.6.accept_tt:0 "两国[concept_relations]改善 #g 20#! 点，防御[concept_treaty]生效，独立双方均列入土邦联合。"
 nesnd_india_union.6.decline_tt:0 "两国[concept_relations]恶化 #r 10#! 点，邀约未能成行。"
 nesnd_india_union.7_outcome_tt:0 "收到事件「$nesnd_india_union.7.t$」：成员各国永久获得「$nesnd_india_union_pact$」（部队[concept_defense] #g +10%#!），成员间互设护卫意向，并大幅降低日后接受帝国并入的意愿。"
 nesnd_india_union.7.t:0 "联合成约缔结"
 nesnd_india_union.7.d:0 "随着更多独立土邦入盟，[ROOT.GetCountry.GetName]与各盟邦之间的互保网络已经成形。诸邦政府互相照会，重申共同防务之约，以应对帝国施加的并入压力。"
 nesnd_india_union.7.f:0 "“凡入盟诸邦，遇外患则相援，遇威逼则相持，此约由各国政府共同昭告。”\n——土邦联合成约公告"
 nesnd_india_union.7.a:0 "各邦共守此约。"
 nesnd_india_union.7.a_tt:0 "我国已永久获得「$nesnd_india_union_pact$」，联合各成员互设护卫意向。帝国再提并入时，联合成员接受的意愿大幅降低。"
 nesnd_india_union.8_outcome_tt:0 "收到事件「$nesnd_india_union.8.t$」：若离去的原成员依然存在，我国与其[concept_relations]恶化 #r 30#! 点，并获得持续十年的「$nesnd_india_union_broken$」（[concept_legitimacy] #r -5#!）。十年后可再开日志。"
 nesnd_india_union.8.t:0 "土邦联合破裂"
 nesnd_india_union.8.d_departed:0 "[SCOPE.sCountry('india_league_departed').GetName]已不再作为独立土邦留在盟中，土邦联合的独立成员已不足两邦，互保之盟难以为继。"
 nesnd_india_union.8.d_gone:0 "盟友相继丧失独立地位或覆亡，土邦联合的独立成员已不足两邦，互保之盟难以为继。"
 nesnd_india_union.8.f:0 "“盟邦离散，原订互保之局已难维系。”\n——[ROOT.GetCountry.GetName]政府公告"
 nesnd_india_union.8.a:0 "重整防务，以待后图。"
 nesnd_india_union.8.a_departed_tt:0 "我国与[SCOPE.sCountry('india_league_departed').GetName]的[concept_relations]已恶化 #r 30#! 点，并获得十年的「$nesnd_india_union_broken$」。十年后可重新开启「$nesnd_india_union$」。"
 nesnd_india_union.8.a_gone_tt:0 "我国获得十年的「$nesnd_india_union_broken$」。十年后可重新开启「$nesnd_india_union$」。"
