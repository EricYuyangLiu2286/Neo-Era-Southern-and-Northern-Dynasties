 nesnd_india_contact_tt:0 "联络费用为我国一个月的收入，联络期间[concept_government_wage]支出增加 #r [GetStaticModifier('nesnd_india_contact_cost').GetValueFor('country_government_wages_mult')|0%]#!。当地[concept_turmoil]达到 #v 15%#! 或[concept_sol]低于 #v 10#! 时，组织才有可能发展。[concept_market_access]、[concept_turmoil]和[GetStaticModifier('nesnd_india_french_officers').GetName]会影响筹备速度。暂停联络后，维护费停付，筹备进度每月减少 #r 2#! 点。"
