 nesnd_india_revolt_former_claim_tt:0 "原统治者对我们起义地区的州获得[concept_claim]。"
 nesnd_india_revolt_former_goal_tt:0 "原统治者以资助起义的帝国为敌。"
 nesnd_india_revolt_failed_effect_tt:0 "起义地区的州回到原统治者手中，当地参加起义的文化有 #r 20%#! 的人口转为[concept_radical]。"
 nesnd_india_revolt.2_outcome_tt:0 "我们将决定加入资助我们的帝国，还是独立自主。"
 nesnd_india_revolt.2.t:0 "独立之后"
 nesnd_india_revolt.2.d:0 "[ROOT.GetCountry.GetName]守住了独立。资助我们的[SCOPE.sCountry('india_revolt_sponsor').GetName]希望我们加入帝国，作为自治领保留自己的政府和军队。也有人主张，既然流了血，就不必再向任何人称臣。"
 nesnd_india_revolt.2.f:0 "“本议会认为，本国不应向任何君主称臣。”\n——独立政府议会的动议"
 nesnd_india_revolt.2.a:0 "加入帝国"
 nesnd_india_revolt.2.a_tt:0 "成为[SCOPE.sCountry('india_revolt_sponsor').GetName]的[concept_dominion]，获得[GetStaticModifier('nesnd_india_prince_privileges').GetName]。"
 nesnd_india_revolt.2.b:0 "独立自主"
 nesnd_india_indep_fervor_tt:0 "本国[Concept('concept_primary_cultures','$concept_primary_culture$')]的[concept_fervor]目标长期提高。"
 nesnd_india_south_calm_conclusion:0 "十年来，我们在印度统治的州里没有出现新的起义组织。"
 nesnd_india_south_calm_tt:0 "十年之内，没有组织在本国的州里筹备起义"
 nesnd_india_south_calm_cooldown_tt:0 "十年之内不再获得这项奖励。"
 nesnd_india_indep.12_outcome_tt:0 "我们将决定新的国家倒向何方。"
 nesnd_india_indep.12.t:0 "新的独立国家"
 nesnd_india_indep.12.d:0 "[ROOT.GetCountry.GetName]摆脱了[SCOPE.sCountry('india_free_lord').GetName]的宗主权。政府中有人主张亲近印度的帝国，有人主张结交与原宗主国交恶的列强或主要政权，也有人主张不依附任何一方。"
 nesnd_india_indep.12.f:0 "“本国自即日起，不受任何外国的宗主权约束。”\n——独立宣言"
 nesnd_india_indep.12.a:0 "亲近[SCOPE.sCountry('india_free_empire').GetName]"
 nesnd_india_indep.12.b:0 "独立自主"
 nesnd_india_indep.12.c:0 "结交[SCOPE.sCountry('india_free_rival').GetName]"
 nesnd_india_indep_rival_involvement_tt:0 "[SCOPE.sCountry('india_free_rival').GetName]开始关注本国所在的战略区域。"
 nesnd_india_indep.13.t:0 "独立受挫"
 nesnd_india_indep.13.d:0 "我们争取独立的外交博弈没有成功，[ROOT.GetCountry.GetName]仍是[ROOT.GetCountry.GetOverlord.GetName]的附属国。为独立所做的经济和武装准备都损失了一半，首都的民众中激进情绪高涨。"
 nesnd_india_indep.13.f:0 "“此次挫折，政府难辞其咎。”\n——首都的传单"
 nesnd_india_indep.13.a:0 "从头再来"
 nesnd_india_indep.13.a_tt:0 "$nesnd_india_indep_economy_bar$与$nesnd_india_indep_military_bar$各减半，首都所在州有 #r 10%#! 的人口转为[concept_radical]。"
 nesnd_india_lord_calm_conclusion:0 "十年来，没有一个附属国走到独立的边缘。"
 nesnd_india_lord_calm_tt:0 "十年之内，没有附属国的[concept_liberty_desire]达到 75"
 nesnd_india_lord_calm_cooldown_tt:0 "十年之内不再获得这项奖励。"
 nesnd_india_indep_lord_can_pay_tt:0 "我们的[concept_gold_reserves]足以支付这笔钱"

