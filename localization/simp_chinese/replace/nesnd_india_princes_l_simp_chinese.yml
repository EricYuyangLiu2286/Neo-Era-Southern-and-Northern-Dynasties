 nesnd_india_union:0 "王公同盟"
 nesnd_india_union_reason:0 "土邦拒绝归附，印度的帝国便对该邦的土地提出宣称。仍然独立的几个土邦开始互通使节，商量彼此担保：一邦遭到攻击，其余各邦出兵相救。"
 nesnd_india_union_status_open:0 ""
