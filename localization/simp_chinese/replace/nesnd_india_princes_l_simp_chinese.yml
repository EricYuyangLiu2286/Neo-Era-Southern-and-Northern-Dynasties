 nesnd_india_revolt_war:0 "保卫地方自主"
 nesnd_india_revolt_war_reason:0 "旧统治者要求收回起义地区，新政府则要求承认独立。我们曾接受外国资助，但援助并未赋予资助国管辖这片土地的权利。"
 nesnd_india_revolt_resolved_tt:0 "本次争端已经结束，我国仍然独立，并保有起义所在的州。"
 nesnd_india_revolt_survived:0 "守住自主"
 nesnd_india_mission_button_desc:0 "请对方派遣顾问并提供拨款。"
 nesnd_india_choose_mission_tt:0 "选择教师、工程师或教官。"
 nesnd_india_diplomatic_desc:0 "向对方正式提出请求，由其政府作答。"
 nesnd_india_request_tt:0 "请求送交对方政府，对方在 #v 45#! 天内答复，接受则条款生效。此后六个月内我国不能再提出交涉。"
 nesnd_india_request_liberty_tt:0 "请求遭拒时，我国的[concept_liberty_desire]增加 #v 10#!，两国[concept_relations]恶化 #r 30#! 点。"
 nesnd_india_defence_upkeep_tt:0 "对方同意后，两国缔结[concept_defensive_pact]。条约存续期间，双方各承担 @inf!#v [GetArticleType('defensive_pact').GetCost|0]#! 点[concept_influence]的基础维护费。"
 nesnd_india_union_request_tt:0 "选择一个[concept_princely_state]，邀请它加入我国。对方可以并入我国，或者成为我国的[concept_dominion]，也可以婉拒。对方若是别国的[concept_subject]，邀请先送它的[concept_overlord]许可。对方接受时，我国支付安置费，并承担一份王公年金。每接纳一邦，年金增加一份，十年期限重新计算。年金最多 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_pension_cap')|0]#! 份。对方脱离原宗主国时，我国另付给原宗主国一笔与安置费相同的补偿。"
 nesnd_india_pension_full_tt:0 "王公年金已满 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_pension_cap')|0]#! 份，这次接纳不再增加份数，只把十年期限重新计算。"
 nesnd_india_project_start_desc:0 "在我国的一个[concept_state]兴办[GetBuildingType('building_university').GetName]、[GetBuildingType('building_tooling_workshop').GetName]或[GetBuildingType('building_railway').GetName]，也可以先请别国的工程人员来考察。"
 nesnd_india_project_start_tt:0 "先选项目和地点，再决定由我国出资，还是请别的[concept_princely_state]、莫卧儿（泛指莫卧儿、印度、达罗毗荼这类帝国）或外国的政府出资。选定以前不花钱。"
 nesnd_india_project_withdraw_button_desc:0 "不再等候对方答复。"
 nesnd_india_project_waiting_tt:0 "我国的项目请求正在等候答复"
 nesnd_india_project_withdraw_tt:0 "这项请求作废，对方不必再答复。提出请求之日起六个月内，我国仍不能再提出交涉。"
 nesnd_india_union_ask_button_desc:0 "请[SCOPE.sCountry('nesnd_label_india_empire').GetName]接纳我国。加入的方式由我国选择：并入，或者成为它的[concept_dominion]。"
 nesnd_india_union_ask_button_tt:0 "选择加入的方式。"
 nesnd_india_contact_desc:0 "地方组织筹备起义，有赖于本国的经费支持。"
 nesnd_india_contact_tt:0 "联络费用为我国一个月的收入，联络期间[concept_government_wage]支出增加 #r [GetStaticModifier('nesnd_india_contact_cost').GetValueFor('country_government_wages_mult')|0%]#!。当地[concept_turmoil]达到 #v 15%#! 或[concept_sol]低于 #v 10#! 时，组织才有可能发展。[concept_market_access]、[concept_turmoil]和[GetStaticModifier('nesnd_india_french_officers').GetName]会影响筹备速度。暂停联络后，维护费停付，筹备进度每月减少 #r 2#! 点。"
 nesnd_india_pause_tt:0 "暂停联络，联络经费停付。当地筹备每月减少 #r 2#! 点。"
 nesnd_india_contact_cost:0 "地方联络经费"
 nesnd_india_resume_tt:0 "恢复联络与维护开支。不再支付首次联络费。"
 nesnd_india_launch_tt:0 "拿出我国一个季度的收入支持举事，这笔钱交给起义者。当地成立自己的国家，并按人口组建 #v 2#! 至 #v 8#! 个营的非正规步兵。殖民统治者以[concept_diplomatic_play]要求收复本[concept_state]，起义者以羞辱对方为反诉求。我国若不是[concept_subject]国，且不在战争中，便加入起义一方。资助不会使当地并入本国。"
 nesnd_india_case_popular_ready_tt:0 "当地[concept_turmoil]达到 #v 25%#!，或当地印度文化在所属国存在活跃的文化少数[concept_political_movement]"
 nesnd_india_suppression_desc:0 "以额外的警务开支打击地方秘密组织。"
 nesnd_india_suppression_tt:0 "支付我国一个月的收入，至多 @money!50,000，使当地筹备减少 #g 25#! 点。筹备已满的组织退回暂停状态。六个月内不能再次侦缉。"
 nesnd_india_abandon_tt:0 "放弃在这一地区的联络，当地的筹备清零，联络经费停付。#v 36#! 个月内不能再联络这一地区，我国可以改为联络别的地区。"
 nesnd_india_case_watch:0 "缉查地方组织"
 nesnd_india_case_watch_reason:0 "莫卧儿或承继它的帝国正在出钱联络[ROOT.GetCountry.GetName]在$region_north_india$与$region_south_india$的[Concept('concept_state', '$concept_states|q$')]里的地方组织，筹备起义。筹备完成以后，对方随时可以资助举事，当地就会成立自己的国家，我国要以[concept_diplomatic_play]把它收回。加派警务能够拖慢筹备。"
 nesnd_india_case_watch_open_tt:0 "我国治下有地方组织正在筹备起义"
 nesnd_india_case_watch_closure_tt:0 "我国已不再是$USM$，也不是$USM$所属的$TZ1$"
