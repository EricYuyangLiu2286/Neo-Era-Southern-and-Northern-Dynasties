 nesnd_india_project.1.d:0 "[ROOT.GetCountry.GetName]的政府拟在本邦兴办一项新式事业，可选的有四项。一是兴建大学，为本邦培养官员和工程师。二是兴建工具厂，使工匠不再依赖外来的工具。三是修筑铁路，把内地的粮食和货物运往港口。四是先聘请专业人员测绘本邦的土地和道路。"
