 nesnd_india_prince_strong_conclusion:0 "[ROOT.GetCountry.GetName]没有投靠任何一方，凭自己办成的项目站稳了脚跟。"
 nesnd_india_prince_projects_tt:0 "已建成 #v 3#! 个本地项目（目前 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_projects_done_value')|0]#! 个）"
 nesnd_india_prince_joined_conclusion:0 "[ROOT.GetCountry.GetName]作为[concept_dominion]加入了帝国，保留本邦的政府、法律、国库和军队。"
 nesnd_india_prince_joined_tt:0 "本邦已作为[concept_dominion]加入印度的帝国"
 nesnd_india_prince_joined_effect_tt:0 "在脱离帝国之前，本邦不再有这个[concept_journal_entry]。"
 nesnd_india_south_settled_conclusion:0 "六个起义地区已经全部回到印度人自己的国家手中。"
