 nesnd_india_project_name_0:0 "本地项目"
 nesnd_india_diplomacy.1.t:0 "[SCOPE.sCountry('india_sender').GetName]的来使"
 nesnd_india_diplomacy.1.t9:0 "土邦的项目请求"
 nesnd_india_diplomacy.1.t10:0 "出售产业的提议"
 nesnd_india_diplomacy.1.t11:0 "赎回产业的提议"
 nesnd_india_diplomacy.1.t12:0 "赈灾求援"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName]的使者请求我们拨款，并选派教师到他们的学校授课四年。作为回报，[SCOPE.sCountry('india_sender').GetName]将对我们负有一项义务，我们的教师也会把本国的语言和学说带进印度的课堂。"
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName]的使者请求我们拨款，并派工程师去帮助他们兴建$building_tooling_workshop$。这笔拨款将折算为我们在那座工厂里的所有权，[SCOPE.sCountry('india_sender').GetName]还将对我们负有一项义务。"
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName]的使者请求我们拨款，并派军官去训练他们的军队四年。为此，[SCOPE.sCountry('india_sender').GetName]愿意向我军开放领土五年，并对我们负有一项义务。"
 nesnd_india_diplomacy.1.d4:0 "[SCOPE.sCountry('india_sender').GetName]正式请求提高自治，要求更多地处理本国事务。若是拒绝，[SCOPE.sCountry('india_sender').GetName]对我们的不满将公开化。"
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName]的使者提议两国缔结为期三年的防御条约，任何一方遭到攻击，另一方都要出兵相助。"
 nesnd_india_diplomacy.1.d6_own:0 "[ROOT.GetCountry.GetName]本就是[SCOPE.sCountry('india_sender').GetName]的附属国，如今[SCOPE.sCountry('india_sender').GetName]邀请本邦正式并入帝国。王公的家族将由帝国供养，本邦则不再作为国家存在。拒绝的话，[SCOPE.sCountry('india_sender').GetName]会对本邦的土地提出宣称。"
 nesnd_india_diplomacy.1.d6_former:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]加入帝国。本邦眼下的宗主国已经同意放手，[SCOPE.sCountry('india_sender').GetName]会另行补偿。王公可以让本邦并入帝国，也可以作为帝国的自治领，保留本邦的政府、法律、国库和军队。拒绝的话，[SCOPE.sCountry('india_sender').GetName]会对本邦的土地提出宣称。"
 nesnd_india_diplomacy.1.d6_merge_only:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]并入帝国，王公的家族将由帝国供养。按两国的地位，本邦无法以自治领的身份加入。拒绝的话，[SCOPE.sCountry('india_sender').GetName]会对本邦的土地提出宣称。"
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]加入帝国。王公可以让本邦并入帝国，由帝国供养王室，也可以作为帝国的自治领，保留本邦的政府、法律、国库和军队，并收下帝国的一笔款项。拒绝的话，[SCOPE.sCountry('india_sender').GetName]会对本邦的土地提出宣称。"
 nesnd_india_diplomacy.1.d8_dominion:0 "[SCOPE.sCountry('india_sender').GetName]的王公请求成为我们的[concept_dominion]。该邦将保留自己的政府、法律、国库和军队，我们须付给王公一笔款项，并负担王公年金十年。"
 nesnd_india_diplomacy.1.d8_merge:0 "[SCOPE.sCountry('india_sender').GetName]的王公请求将本邦并入我们的帝国，王公的家族由帝国供养。我们须支付一笔款项，并负担王公年金十年。"
 nesnd_india_diplomacy.1.d9_survey:0 "[SCOPE.sCountry('india_sender').GetName]请我们派工程师去测绘他们的土地，测绘费用由他们支付。"
 nesnd_india_diplomacy.1.d9_grant:0 "[SCOPE.sCountry('india_sender').GetName]请我们拨款，在[SCOPE.sState('india_project_site').GetName]兴建一所大学。作为回报，对方将对我们负有一项义务。"
 nesnd_india_diplomacy.1.d9_workshop:0 "[SCOPE.sCountry('india_sender').GetName]请我们出资在[SCOPE.sState('india_project_site').GetName]建一座$building_tooling_workshop$，建成的一级归我们所有，对方还将对我们负有一项义务。"
 nesnd_india_diplomacy.1.d9_railway:0 "[SCOPE.sCountry('india_sender').GetName]请我们出资在[SCOPE.sState('india_project_site').GetName]修一段$building_railway$，建成的一级归我们所有，对方还将对我们负有一项义务。"
 nesnd_india_diplomacy.1.d10:0 "[SCOPE.sCountry('india_sender').GetName]提出把[SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_mug_deal_state').GetState.GetName]一处产业中的一级作价 #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#! 卖给我们。"
 nesnd_india_diplomacy.1.d11:0 "[SCOPE.sCountry('india_sender').GetName]提出出价 #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#!，赎回我们在[SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_mug_deal_state').GetState.GetName]持有的一处产业中的一级。"
 nesnd_india_diplomacy.1.d12:0 "[SCOPE.sCountry('india_sender').GetName]发生饥荒，请求我们拨款 #v [SCOPE.sCountry('india_sender').MakeScope.Var('nesnd_india_request_quote').GetValue|D]#! 赈济受灾的州。"
 nesnd_india_diplomacy.1.d:0 "[SCOPE.sCountry('india_sender').GetName]的使者带来了一项请求。"
