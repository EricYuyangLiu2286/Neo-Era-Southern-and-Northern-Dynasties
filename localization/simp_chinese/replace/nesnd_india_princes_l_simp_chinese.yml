 nesnd_india_north.1.t:0 "东方的边备"
 nesnd_india_north.1.d:0 "据报，[SCOPE.sCountry('india_north_defender').GetName]正在整顿其受我国宣称各州的边备。该国显然已知悉我国的意图。"
 nesnd_india_north.1.f:0 "“[SCOPE.sCountry('india_north_defender').GetName]近来整顿边备，其意在防我东进，应如何应对，请示遵行。”\n——边境官员的报告"
 nesnd_india_north.1.a:0 "施压"
 nesnd_india_north.1.b:0 "暂且收手"
 nesnd_india_north.2_outcome_tt:0 "边备完成，受宣称的各州得以保全。"
 nesnd_india_north.2.t:0 "西北无虞"
 nesnd_india_north.2.d:0 "本国在受$nesnd_lobby_name_per$宣称的各州完成了边备，这些州仍在本国治下。$nesnd_lobby_name_per$没有撤回宣称，两国的关系更为冷淡。"
 nesnd_india_north.2.f:0 "“受宣称各州的边备业已完成，各州均在我方治下。”\n——边防官员的报告"
 nesnd_india_north.2.a:0 "论功行赏"
 nesnd_india_north.2.a_tt:0 "边境驻防延续十年，本国主要文化在这些州有 #g 5%#! 的人口转为效忠者。"
 nesnd_india_north.3.t:0 "东进受阻"
 nesnd_india_north.3.d:0 "[SCOPE.sCountry('india_north_defender').GetName]已完成其受我国宣称各州的边备。我国的宣称不变，东进之事暂缓。"
 nesnd_india_north.3.f:0 "“该国边备已成，此时进兵，未必得手。”\n——边境官员的报告"
 nesnd_india_north.3.a:0 "来日方长"
 nesnd_india_north.3.a_tt:0 "与[SCOPE.sCountry('india_north_defender').GetName]的[concept_relations] #r -10#!。"
 nesnd_india_north.4_outcome_tt:0 "受宣称的一个地区落入$nesnd_lobby_name_per$一方之手。"
 nesnd_india_north.4.t:0 "西北失地"
 nesnd_india_north.4.d:0 "受$nesnd_lobby_name_per$宣称的一个地区已不在本国治下，现归$nesnd_lobby_name_per$或其宗主国、附属国所有。本国已对该地区提出领土要求。首都所在的州激进者增多。"
 nesnd_india_north.4.f:0 "“失地一日不复，本国一日不安。”\n——首都集会的标语"
 nesnd_india_north.4.a:0 "誓复失地"
 nesnd_india_north.4.a_tt:0 "我们对失去的地区提出[concept_claim]，首都所在州有 #r 10%#! 的人口转为[concept_radical]。"
 nesnd_india_north.5.t:0 "东进得手"
 nesnd_india_north.5.d:0 "我国宣称的[SCOPE.sCountry('india_north_defender').GetName]属地，已有一个地区归我方所有。该地区自此视为我国主体民族的故土。"
 nesnd_india_north.5.f:0 "“所宣称之地现已归我方管辖，谨此报闻。”\n——边境官员的报告"
 nesnd_india_north.5.a:0 "巩固新土"
 nesnd_india_north.5.a_tt:0 "我们的[Concept('concept_primary_cultures','$concept_primary_culture$')]把夺得的地区视为故土。"
