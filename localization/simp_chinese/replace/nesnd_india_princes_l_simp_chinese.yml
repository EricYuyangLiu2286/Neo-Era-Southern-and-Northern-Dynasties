 nesnd_india_union_broken_effect_tt:0 "与最后离开的盟友[concept_relations] #r -30#!。十年之内不能再组织同盟。"
 nesnd_india_union.5.t:0 "王公的使者"
 nesnd_india_union.5.d:0 "[SCOPE.sCountry('india_league_inviter').GetName]遣使提议两邦互保：一邦遭受攻击，另一邦出兵援助。该邦并拟联络其他土邦，结成同盟。"
 nesnd_india_union.5.f:0 "“敝邦愿与贵邦订约互保，一邦受侵，另一邦出兵援助。”\n——王公的来信"
 nesnd_india_union.5.a:0 "缔结盟约"
 nesnd_india_union.5.a_tt:0 "与[SCOPE.sCountry('india_league_inviter').GetName]的[concept_relations] #g +20#!，两邦缔结[concept_defensive_pact]、同盟或独立保障中能够缔结的一项，本邦加入$nesnd_india_union$。"
