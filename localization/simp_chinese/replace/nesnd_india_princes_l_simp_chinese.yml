 nesnd_india_revolt_war_reason:0 "[ROOT.GetCountry.GetName]宣告脱离[JournalEntry.GetCountry.MakeScope.Var('nesnd_india_revolt_former').GetCountry.GetName]的统治。起义军的经费来自[JournalEntry.GetCountry.MakeScope.Var('nesnd_india_revolt_sponsor').GetCountry.GetName]，军队是匆忙招募的非正规步兵。[JournalEntry.GetCountry.MakeScope.Var('nesnd_india_revolt_former').GetCountry.GetName]不会承认一个在其殖民地上建立的国家，必将出兵收复。"
