 nesnd_india_union_invite_button:0 "联络王公"
 nesnd_india_union_invite_button_desc:0 "遣使前往与我们关系最好的一个土邦，提议互相担保。对方若同意，两邦缔结[concept_defensive_pact]、同盟或独立保障中的一项，并一同加入$nesnd_india_union$。"
 nesnd_india_union_invite_cooldown_tt:0 "十二个月内没有派出过使者"
 nesnd_india_union_invite_target_tt:0 "有可以联络的土邦"
 nesnd_india_union_invite_effect_tt:0 "使者出发，对方随后答复。十二个月后才能再派使者。"
 nesnd_india_union_pact:0 "王公同盟"
 nesnd_india_union_broken:0 "同盟瓦解"
 nesnd_india_union_pact_conclusion:0 "三个以上的独立土邦结成了同盟，约定彼此担保。"
 nesnd_india_union_pact_trigger_tt:0 "$nesnd_india_union$中至少有 #v 3#! 个独立土邦"
 nesnd_india_union_pact_protect_tt:0 "同盟各邦互以保护对方为外交目标。"
 nesnd_india_union_pact_resist_tt:0 "帝国邀请同盟中的一邦遭拒时，其余各邦与帝国的[concept_relations] #r -10#!。"
 nesnd_india_union_broken_conclusion:0 "盟友或被吞并，或已离去，同盟名存实亡。"
 nesnd_india_union_broken_trigger_tt:0 "$nesnd_india_union$曾有两个以上的独立土邦，如今只剩本邦"
 nesnd_india_union_broken_effect_tt:0 "与最后离开的盟友[concept_relations] #r -30#!。十年之内不能再组织同盟。"
 nesnd_india_union.5.t:0 "王公的使者"
 nesnd_india_union.5.d:0 "[SCOPE.sCountry('india_league_inviter').GetName]的使者来到[ROOT.GetCountry.GetName]的宫廷，提议两邦互相担保：任何一邦遭到攻击，另一邦出兵相救。[SCOPE.sCountry('india_league_inviter').GetName]还在联络别的土邦，希望结成一个同盟，使帝国和外国人不敢轻易进犯。"
 nesnd_india_union.5.f:0 "“两邦唇齿相依，一邦有难，一邦相救。”\n——王公致王公的书信"
 nesnd_india_union.5.a:0 "缔结盟约"
 nesnd_india_union.5.a_tt:0 "与[SCOPE.sCountry('india_league_inviter').GetName]的[concept_relations] #g +20#!，两邦缔结[concept_defensive_pact]、同盟或独立保障中能够缔结的一项，本邦加入$nesnd_india_union$。"
 nesnd_india_union.5.b:0 "婉言谢绝"
 nesnd_india_union.5.b_tt:0 "与[SCOPE.sCountry('india_league_inviter').GetName]的[concept_relations] #r -10#!"
 nesnd_india_union.6.t:0 "使者归来"
 nesnd_india_union.6.d_accept:0 "[SCOPE.sCountry('india_league_target').GetName]同意了我们的提议，两邦缔结了盟约。"
 nesnd_india_union.6.d_decline:0 "[SCOPE.sCountry('india_league_target').GetName]谢绝了我们的提议。"
 nesnd_india_union.6.f:0 "“使臣已归，谨将对方答复呈上。”\n——使臣的呈报"
 nesnd_india_union.6.accept_tt:0 "[SCOPE.sCountry('india_league_target').GetName]加入$nesnd_india_union$。"
 nesnd_india_union.6.decline_tt:0 "与[SCOPE.sCountry('india_league_target').GetName]的[concept_relations] #r -10#!"
 nesnd_india_union.7_outcome_tt:0 "同盟各邦互以保护对方为目标，共同面对帝国的邀请与宣称。"
 nesnd_india_union.7.t:0 "王公同盟"
 nesnd_india_union.7.d:0 "三个以上的独立土邦订立了盟约。各邦仍旧各有政府、各管各的军队，但约定互相保护。"
 nesnd_india_union.7.f:0 "“缔约各邦，一邦受侵，诸邦共御之。”\n——王公同盟盟约"
 nesnd_india_union.7.a:0 "诸邦一心"
 nesnd_india_union.7.a_tt:0 "同盟各邦互以保护对方为外交目标。"
 nesnd_india_union.8_outcome_tt:0 "同盟只剩下我们一邦。"
 nesnd_india_union.8.t:0 "同盟瓦解"
 nesnd_india_union.8.d_departed:0 "[SCOPE.sCountry('india_league_departed').GetName]离开了同盟，剩下的独立土邦已不足两个。$nesnd_india_union$名存实亡。"
 nesnd_india_union.8.d_gone:0 "盟友们或被吞并，或成了别国的附属国，剩下的独立土邦已不足两个。$nesnd_india_union$名存实亡。"
 nesnd_india_union.8.f:0 "“盟约已无可守之人。”\n——本邦政府的决议"
 nesnd_india_union.8.a:0 "各自为战"
 nesnd_india_union.8.a_departed_tt:0 "与[SCOPE.sCountry('india_league_departed').GetName]的[concept_relations] #r -30#!。十年之内不能再组织同盟。"
 nesnd_india_union.8.a_gone_tt:0 "十年之内不能再组织同盟。"
 # ==== 印度批次 16：波斯东征宣称的应对 ====
 nesnd_india_north:0 "西北边防"
 nesnd_india_north_reason:0 "$nesnd_lobby_name_per$图谋东进，已对[ROOT.GetCountry.GetName]西北的几个州提出了宣称。[ROOT.GetCountry.GetName]须在$nesnd_lobby_name_per$的军队越过山口之前，加强这几个州的守备。"
 nesnd_india_north_bar:0 "边备"
 nesnd_india_north_bar_readout:0 "$nesnd_india_north_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_india_north_bar_monthly_desc:0 "与$nesnd_lobby_name_per$相安无事，受宣称的州都在我们手中"
 nesnd_india_north_status_watch:0 ""
 nesnd_india_north_status_war:0 "我们正在与$nesnd_lobby_name_per$交战。"
 nesnd_india_north_garrison:0 "边境驻防"
 nesnd_india_north_held:0 "守住西北"
 nesnd_india_north_lost:0 "西北失地"
 nesnd_india_north_garrison_button:0 "加强驻防"
 nesnd_india_north_garrison_button_desc:0 "出钱修缮要塞，在受宣称的州里人口最多的一州增募守军。"
 nesnd_india_north_envoy_button:0 "遣使$nesnd_lobby_name_qe1$"
 nesnd_india_north_envoy_button_desc:0 "派使节前往与$nesnd_lobby_name_per$东境、北境相接的$nesnd_lobby_name_qe1$。与$nesnd_lobby_name_qe1$交好，可使$nesnd_lobby_name_per$有后顾之忧。"
 nesnd_india_north_overlord_button:0 "请宗主国出面"
 nesnd_india_north_overlord_button_desc:0 "请宗主国向$nesnd_lobby_name_per$提出交涉。"
 nesnd_india_north_pay_tt:0 "我们付得起这笔钱，且没有[concept_default]或[concept_bankruptcy]"
 nesnd_india_north_garrison_wait_tt:0 "一年内没有加强过驻防"
 nesnd_india_north_has_held_state_tt:0 "我们仍然领有受宣称的州"
 nesnd_india_north_qe1_alive_tt:0 "$nesnd_lobby_name_qe1$仍然存在，且没有与我们交战"
 nesnd_india_north_envoy_wait_tt:0 "一年内没有派过使节"
 nesnd_india_north_overlord_ready_tt:0 "我们是附属国，且宗主国不是$nesnd_lobby_name_per$"
 nesnd_india_north_overlord_wait_tt:0 "两年内没有请宗主国出面"
 nesnd_india_north_garrison_effect_tt:0 "$nesnd_india_north_bar$ #g +10#!，受宣称的州里人口最多的一州获得[GetStaticModifier('nesnd_india_north_garrison').GetName]五年。一年之内不能再加强驻防。"
 nesnd_india_north_envoy_effect_tt:0 "$nesnd_india_north_bar$ #g +10#!，与$nesnd_lobby_name_qe1$的[concept_relations] #g +15#!。一年之内不能再派使节。"
 nesnd_india_north_overlord_effect_tt:0 "$nesnd_india_north_bar$ #g +10#!，宗主国与$nesnd_lobby_name_per$的[concept_relations] #r -10#!。两年之内不能再请宗主国出面。"
 nesnd_india_north_bar_plus_10_other_tt:0 "[SCOPE.sCountry('india_north_defender').GetName]的$nesnd_india_north_bar$ #g +10#!"
 nesnd_india_north_held_trigger_tt:0 "$nesnd_india_north_bar$达到 #v 100#!"
 nesnd_india_north_held_effect_tt:0 "受宣称的每个州获得[GetStaticModifier('nesnd_india_north_garrison').GetName]，本国主要文化在这些州有 #g 5%#! 的人口转为效忠者。与$nesnd_lobby_name_per$的[concept_relations] #r -10#!。十年之内这本日志不会再开。"
 nesnd_india_north_held_conclusion:0 "西北的边境守住了，$nesnd_lobby_name_per$的东进计划暂时搁置。"
 nesnd_india_north_lost_trigger_tt:0 "受宣称的一个地区落入$nesnd_lobby_name_per$、其宗主国或其附属国手中"
 nesnd_india_north_lost_effect_tt:0 "我们对失去的地区提出[concept_claim]，首都所在州有 #r 10%#! 的人口转为[concept_radical]。十年之内这本日志不会再开。"
 nesnd_india_north_lost_conclusion:0 "$nesnd_lobby_name_per$夺走了我们西北的土地。"
 nesnd_india_north.1.t:0 "东方的边备"
 nesnd_india_north.1.d:0 "据报，[SCOPE.sCountry('india_north_defender').GetName]正在加固西北的要塞，增募守军，并遣使求援。对方显然已经察觉我们的意图。我们可以施压，让对方知道宣称不是空话，也可以暂且收手，等待时机。"
 nesnd_india_north.1.f:0 "“印度人的要塞日夜施工，山口一带已增兵数营。”\n——边境总督的报告"
 nesnd_india_north.1.a:0 "施压"
 nesnd_india_north.1.b:0 "暂且收手"
 nesnd_india_north.2_outcome_tt:0 "西北的边境守住了。"
 nesnd_india_north.2.t:0 "西北无虞"
 nesnd_india_north.2.d:0 "要塞修好了，守军也已到齐。$nesnd_lobby_name_per$的军队没有越过山口，东进的计划暂时搁置。"
 nesnd_india_north.2.f:0 "“山口各要塞已经完工，守备充足。”\n——西北边防的报告"
 nesnd_india_north.2.a:0 "论功行赏"
 nesnd_india_north.2.a_tt:0 "边境驻防延续十年，本国主要文化在这些州有 #g 5%#! 的人口转为效忠者。"
 nesnd_india_north.3.t:0 "东进受阻"
 nesnd_india_north.3.d:0 "[SCOPE.sCountry('india_north_defender').GetName]已经在山口筑起了坚固的要塞，我们东进的计划只能暂时搁置。"
 nesnd_india_north.3.f:0 "“敌军据险而守，强攻恐难得手。”\n——边境总督的报告"
 nesnd_india_north.3.a:0 "来日方长"
 nesnd_india_north.3.a_tt:0 "与[SCOPE.sCountry('india_north_defender').GetName]的[concept_relations] #r -10#!。"
 nesnd_india_north.4_outcome_tt:0 "$nesnd_lobby_name_per$夺走了我们西北的土地。"
 nesnd_india_north.4.t:0 "西北失地"
 nesnd_india_north.4.d:0 "$nesnd_lobby_name_per$占领了我们西北的土地。消息传开后，首都出现了要求收复失地的集会。"
 nesnd_india_north.4.f:0 "“失地一日不复，本国一日不安。”\n——首都集会的标语"
 nesnd_india_north.4.a:0 "誓复失地"
 nesnd_india_north.4.a_tt:0 "我们对失去的地区提出[concept_claim]，首都所在州有 #r 10%#! 的人口转为[concept_radical]。"
 nesnd_india_north.5.t:0 "东进得手"
 nesnd_india_north.5.d:0 "我们夺取了[SCOPE.sCountry('india_north_defender').GetName]西北的土地。新领土成了我们主体民族的故土。"
 nesnd_india_north.5.f:0 "“大军已越山口，东方诸州悉入版图。”\n——前线的捷报"
 nesnd_india_north.5.a:0 "巩固新土"
 nesnd_india_north.5.a_tt:0 "我们的[Concept('concept_primary_cultures','$concept_primary_culture$')]把夺得的地区视为故土。"
