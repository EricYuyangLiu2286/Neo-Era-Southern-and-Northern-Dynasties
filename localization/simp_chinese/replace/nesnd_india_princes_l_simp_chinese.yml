 nesnd_india_uprising_spent_conclusion:0 "我们资助的起义被镇压了下去。"
 nesnd_india_uprising_spent_goal_tt:0 "起义所针对的国家将以我们为敌。"
 nesnd_india_uprising_quiet_tt:0 "五年之内不能再筹备起义。"
