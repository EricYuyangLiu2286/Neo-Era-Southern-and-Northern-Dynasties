 nesnd_india_lord_calm:0 "属邦安定"
 nesnd_india_prince_strong_conclusion:0 "[ROOT.GetCountry.GetName]不受任何宗主节制，已经办成三项地方工程。"
 nesnd_india_prince_projects_tt:0 "已完成的地方工程：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_projects_done_value')|0] / 3"
 nesnd_india_prince_joined_conclusion:0 "[ROOT.GetCountry.GetName]已作为[concept_dominion]加入[ROOT.GetCountry.GetOverlord.GetName]。"
 nesnd_india_prince_joined_tt:0 "我国已作为[concept_dominion]加入印度的帝国"
 nesnd_india_prince_joined_effect_tt:0 "我国保留本国的政府、法律、国库与军队。"
 nesnd_india_south_settled_conclusion:0 "六个起事地区已经全部归首都在印度的国家所有。"
 nesnd_india_south_settled_tt:0 "$STATE_CIRCARS$、$STATE_KURNOOL$、$STATE_MADRAS$、$STATE_MYSORE$、$STATE_TRAVANCORE$、$STATE_GUJARAT$的每个[concept_state]都归首都在印度的国家所有"
 nesnd_india_uprising_spent_conclusion:0 "我国资助的一次举事失败了。"
 nesnd_india_uprising_spent_goal_tt:0 "这次举事所反抗的统治者，此后把我国视为敌手。"
 nesnd_india_uprising_quiet_tt:0 "五年内我国不再资助举事，「$nesnd_india_uprising$」也不再出现。"
 nesnd_india_uprising_quiet_cond_tt:0 "我国不在停止资助举事的五年之内"
 nesnd_india_revolt_former_claim_tt:0 "原统治者对本地区提出[concept_claim]。"
 nesnd_india_revolt_former_goal_tt:0 "原统治者此后把资助举事的帝国视为敌手。"
 nesnd_india_revolt_failed_effect_tt:0 "原统治者收回本地区以后，当地我国主体文化的人口中，激进派增加 #r 20%#!。"
 nesnd_india_revolt.2_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n•作为资助举事的帝国的[concept_dominion]加入帝国，保留本国的政府、法律、国库与军队，得到「$nesnd_india_prince_privileges$」。\n•自立：五十年内主体文化的[concept_fervor]目标 #g +10#!。#!"
 nesnd_india_revolt.2.t:0 "举事之后"
 nesnd_india_revolt.2.d:0 "[ROOT.GetCountry.GetName]守住了举事夺得的土地，原统治者已经无力收回。举事的经费来自印度的一个帝国，那个帝国希望我国归附。许多起义者却认为，刚刚摆脱外国的统治，不应再向另一个国家称臣。"
 nesnd_india_revolt.2.f:0 "“本邦的赋税由本邦征收，本邦的军队由本邦统率。”\n——地方议会的决议"
 nesnd_india_revolt.2.a:0 "作为[SCOPE.sCountry('india_revolt_sponsor').GetName]的自治领加入帝国。"
 nesnd_india_revolt.2.a_tt:0 "我国保留本国的政府、法律、国库与军队。"
 nesnd_india_revolt.2.b:0 "不归附任何国家。"
 nesnd_india_indep_fervor_tt:0 "五十年内，我国每个主体文化的[concept_fervor]目标 #g +10#!。"
 nesnd_india_south_calm_conclusion:0 "十年来，我国治下没有地方组织筹备针对我国的举事。"
 nesnd_india_south_calm_tt:0 "已有十年没有地方组织筹备针对我国的举事"
 nesnd_india_south_calm_cooldown_tt:0 "十年内不再给予这项奖励。"
 nesnd_india_indep.12_outcome_tt:0 "$event_effect_choose_one$#indent_newline:3 \n•与关系最好的印度帝国结好：与其关系 #g +30#!。\n•自立：[concept_legitimacy]永久 #g +5#!，五十年内主体文化的[concept_fervor]目标 #g +10#!。\n•投向旧宗主的对手（与旧宗主关系最差的大国或列强）：与其关系 #g +30#!，对方在我国首都所在[concept_strategic_region]的[concept_involvement]一时提高 #g 1000#!。#!"
 nesnd_india_indep.12.t:0 "独立之后"
 nesnd_india_indep.12.d:0 "[ROOT.GetCountry.GetName]已经摆脱宗主的控制。旧宗主不会轻易放弃这片土地，新政府必须决定依靠谁来保住独立。有人主张与印度的帝国结好，有人只相信本国的军队和国库，也有人主张投向旧宗主的对手。"
 nesnd_india_indep.12.f:0 "“本国自今日起自主内政外交，不受任何外国节制。”\n——独立宣言"
 nesnd_india_indep.12.a:0 "与[SCOPE.sCountry('india_free_empire').GetName]结好。"
 nesnd_india_indep.12.b:0 "依靠本国的军队和国库。"
 nesnd_india_indep.12.c:0 "投向[SCOPE.sCountry('india_free_rival').GetName]。"
 nesnd_india_indep_rival_involvement_tt:0 "[SCOPE.sCountry('india_free_rival').GetName]在我国首都所在[concept_strategic_region]的[concept_involvement]一时提高 #g 1000#!。"
 nesnd_india_indep.13.t:0 "独立受挫"
 nesnd_india_indep.13.d:0 "[ROOT.GetCountry.GetName]争取独立的[concept_diplomatic_play]以失败告终，我国仍是宗主的[concept_subject]。首都的独立派对政府深感失望。"
 nesnd_india_indep.13.f:0 "“我们的要求被驳回了，但没有被忘记。”\n——一份秘密传单"
 nesnd_india_indep.13.a:0 "重新筹备。"
