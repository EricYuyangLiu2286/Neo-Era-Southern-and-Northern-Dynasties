l_simp_chinese:
 amendment_nesnd_cne_estate_ownership:0 "营产完全所有律"
 amendment_nesnd_cne_estate_ownership_desc:0 "以营队、师团为单位，允许他们在驻扎地或军官的家乡拥有专属产权的土地。无论在城市或是乡村，并将其上获得的产出完全收归该军事单位所有。"
 amendment_nesnd_cne_chartered_districts:0 "设置特许军州"
 amendment_nesnd_cne_chartered_districts_desc:0 "鉴于一些紧要地方和优质兵源地对军方的重要性，政府允许当地驻军截留当地的税收，并给予其自行指定对应行政系统官员的权限。"
 lawgroup_nesnd_cne_estate_rights:0 "营产权利"
 lawgroup_nesnd_cne_estate_rights_desc:0 "$law_nesnd_cne_estate_rights_desc$"
 law_nesnd_cne_estate_rights:0 "营产特权"
 law_nesnd_cne_estate_rights_desc:0 "营伍对田产收益、驻地赋税及地方官员任命享有特许权。"
 ideology_nesnd_cne_estate_rights:0 "维护营产"
 ideology_nesnd_cne_estate_rights_desc:0 "这一集团支持将田产授予营伍，并由特许军州的驻军掌握当地赋税和官员任命权。"
 nesnd_cne_estate_settlement:0 "营产与军州二十年之约"
 nesnd_cne_estate_settlement_desc:0 "在约定期限内，政府不得更改土地改革法与军队类型法，也不得废止两项营产修正案。"
 nesnd_cne_estate_settled_tt:0 "政府已与营伍订立#bold $nesnd_cne_estate_settlement$#!"
 nesnd_cne_estate_lock_tt:0 "必须待营产与军州的 #v 20#! 年约期届满，才能改法或废止这两项修正案。"
 nesnd_cne_estate_settlement_tt:0 "[GetLawType('law_tenant_farmers').GetName]附加[GetAmendmentType('amendment_nesnd_cne_estate_ownership').GetName]，[GetLawType('law_professional_army').GetName]附加[GetAmendmentType('amendment_nesnd_cne_chartered_districts').GetName]。两案均获$ig_armed_forces$与$ig_landowners$支持。两部法律和两项修正案锁定 #v 20#! 年。"
