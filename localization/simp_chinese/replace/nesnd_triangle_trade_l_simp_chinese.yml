l_simp_chinese:
 geographic_region_nesnd_north_triangle:0 "北洋"
 geographic_region_nesnd_west_triangle:0 "西洋"

 nesnd_north_triangle_trade:0 "北洋三角贸易"
 nesnd_north_triangle_trade_reason:0 "东洲的屯垦地和远南的矿场常年缺人。从鄂霍次克海到南洋，各处港口都有船主向官府收买欠租的佃户、欠债的劳工和边地部族的人口。卖方的国库按批收款。货物上岸以后，这些人便成了奴隶。\n\n儒家文化圈的人口受各国礼法保护，不在买卖之列，女真人除外。任何国家也不买卖本国主体民族。日本可以买卖日本人和朝鲜人，登莱可以买卖辽东人，只卖不买的国家可以卖出日本人。俄国不买卖斯拉夫人。\n\n参与国必须有港口或可借道的邻国，并且没有禁止蓄奴。地域内的国家全都禁止蓄奴、研究了人权思想，或者都没有港口时，这条航线便永久断绝。"

 nesnd_west_triangle_trade:0 "西洋三角贸易"
 nesnd_west_triangle_trade_reason:0 "欧洲的船在几内亚湾和安哥拉海岸用布匹、火器和烈酒换取各王国掳来的俘虏，运往加勒比、巴西和北美南方的种植园。巴巴里海岸的私掠者扣押欧洲水手，转卖给新大陆上愿意出钱的偏远农庄。欧洲各国也以契约工的名义把本国受歧视的穷人送往殖民地。卖方的国库按批收款。\n\n欧洲和北非的国家可以买入，也可以卖出。美洲的国家只买入。撒哈拉以南的国家只卖出。任何国家都不买卖本国[concept_primary_cultures]人群，卖方只能卖出在本国受歧视[concept_culture]的人口。\n\n参与国必须有港口或可借道的邻国，并且没有禁止蓄奴。地域内的国家全都禁止蓄奴、研究了人权思想，或者都没有港口时，这条航线便永久断绝。"

 nesnd_north_trade_bar:0 "下一批货物成交"
 nesnd_north_trade_bar_desc:0 "$nesnd_north_trade_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_west_trade_bar:0 "下一批货物成交"
 nesnd_west_trade_bar_desc:0 "$nesnd_west_trade_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"

 nesnd_north_trade_order_status:0 "下一单：[GetGlobalVariable('nesnd_north_trade_source').GetState.GetOwner.GetName]将从[GetGlobalVariable('nesnd_north_trade_source').GetState.GetName]卖出约 #v [GetGlobalVariable('nesnd_north_trade_amount').GetValue|0]#! 名[GetGlobalVariable('nesnd_north_trade_pop').GetPop.GetCulture.GetName]人，运往[GetGlobalVariable('nesnd_north_trade_dest').GetState.GetOwner.GetName]的[GetGlobalVariable('nesnd_north_trade_dest').GetState.GetName]。"
 nesnd_west_trade_order_status:0 "下一单：[GetGlobalVariable('nesnd_west_trade_source').GetState.GetOwner.GetName]将从[GetGlobalVariable('nesnd_west_trade_source').GetState.GetName]卖出约 #v [GetGlobalVariable('nesnd_west_trade_amount').GetValue|0]#! 名[GetGlobalVariable('nesnd_west_trade_pop').GetPop.GetCulture.GetName]人，运往[GetGlobalVariable('nesnd_west_trade_dest').GetState.GetOwner.GetName]的[GetGlobalVariable('nesnd_west_trade_dest').GetState.GetName]。"
 nesnd_triangle_trade_no_order_status:0 "下一单：目前没有可以成交的买卖。进度满时若仍无订单，这一单即告失败。"

 nesnd_north_trade_last_done:0 "\n上一单已成交：#v [GetGlobalVariable('nesnd_north_trade_last_moved').GetValue|0]#! 人运抵目的地，成为奴隶，另有 #v [GetGlobalVariable('nesnd_north_trade_last_dead').GetValue|0]#! 人死于途中。"
 nesnd_west_trade_last_done:0 "\n上一单已成交：#v [GetGlobalVariable('nesnd_west_trade_last_moved').GetValue|0]#! 人运抵目的地，成为奴隶，另有 #v [GetGlobalVariable('nesnd_west_trade_last_dead').GetValue|0]#! 人死于途中。"
 nesnd_triangle_trade_last_no_order:0 "\n上一单#r 失败#!：没有可用的成交单。"
 nesnd_north_trade_last_no_slavery:0 "\n上一单#r 失败#!：[GetGlobalVariable('nesnd_north_trade_failed_dest').GetState.GetOwner.GetName]的[GetGlobalVariable('nesnd_north_trade_failed_dest').GetState.GetName]不允许蓄奴。"
 nesnd_west_trade_last_no_slavery:0 "\n上一单#r 失败#!：[GetGlobalVariable('nesnd_west_trade_failed_dest').GetState.GetOwner.GetName]的[GetGlobalVariable('nesnd_west_trade_failed_dest').GetState.GetName]不允许蓄奴。"

 nesnd_triangle_trade_base_row:0 "各港船主收买人口"
 nesnd_triangle_trade_law_row:0 "参与国实行[GetLawType('law_slave_trade').GetName]或[GetLawType('law_colonial_slavery').GetName]"
 nesnd_triangle_trade_navy_row:0 "参与国实行[GetLawType('law_merchant_navy').GetName]"

 nesnd_north_trade_end_tt:0 "北洋地域内有可卖人口的国家，全都已禁止蓄奴、研究了人权思想，或没有港口"
 nesnd_west_trade_end_tt:0 "西洋地域内有可卖人口的国家，全都已禁止蓄奴、研究了人权思想，或没有港口"
 nesnd_north_trade_end_conclusion:0 "北洋航线上不再有贩奴船。"
 nesnd_west_trade_end_conclusion:0 "西洋航线上不再有贩奴船。"
 nesnd_triangle_trade_end_effect_tt:0 "这条贸易#bold 永久终止#!，各国日后恢复奴隶制也不会重开。"

 nesnd_triangle_buy:0 "买入奴隶"
 nesnd_triangle_buy_desc:0 "我们向这条航线上的卖方订购人口，货物运到以后分给本国准许蓄奴的州。卖方每交一批货物，按本国三周固定收入的数目收取货款。本国两年半之内税收减少 #r 2.5%#!，每成交一批重新计算期限。\n\n本国做买主期间，不能同时卖出人口。"
 nesnd_triangle_sell:0 "卖出奴隶"
 nesnd_triangle_sell_desc:0 "我们把境内贫穷、不识字的人卖给这条航线上的买主，每交一批货物，国库按买方三周固定收入的数目收取货款。\n\n本国做卖主期间，不能同时买入人口。"
 nesnd_triangle_none:0 "暂停交易"
 nesnd_triangle_none_desc:0 "政府暂不在这条航线上买卖人口，随时可以恢复。已经排定、经本国之手的那一批货物，到期时不再交割。"
 nesnd_triangle_import:0 "$nesnd_triangle_buy$"
 nesnd_triangle_import_desc:0 "我们向这条航线上的卖方订购人口，货物运到以后分给本国准许蓄奴的州。卖方每交一批货物，按本国三周固定收入的数目收取货款。本国两年半之内税收减少 #r 2.5%#!，每成交一批重新计算期限。"
 nesnd_triangle_export:0 "$nesnd_triangle_sell$"
 nesnd_triangle_export_desc:0 "我们把境内贫穷、不识字的人卖给这条航线上的买主，每交一批货物，国库按买方三周固定收入的数目收取货款。"
 nesnd_triangle_refuse:0 "$nesnd_triangle_none$"
 nesnd_triangle_refuse_desc:0 "$nesnd_triangle_none_desc$"
 nesnd_triangle_not_buying_tt:0 "本国尚未向这条航线订购人口"
 nesnd_triangle_not_selling_tt:0 "本国尚未在这条航线上出售人口"
 nesnd_triangle_trading_tt:0 "本国正在这条航线上买卖人口"
 nesnd_triangle_to_buying_tt:0 "政府开始向这条航线#bold 订购人口#!，运来的人将在本国准许蓄奴的州成为奴隶。"
 nesnd_triangle_to_selling_tt:0 "政府开始把境内的穷人#bold 卖给#!这条航线上的买主。"
 nesnd_triangle_to_none_tt:0 "政府#bold 暂停#!这条航线上的人口买卖。"

 nesnd_triangle_trade_credit:0 "买入奴隶"
 nesnd_triangle_trade_credit_desc:0 "本国近期在三角贸易中买入了奴隶。"

 nesnd_triangle_trade.1.t:0 "一批货物离港"
 nesnd_triangle_trade.1.d:0 "一批[SCOPE.sCulture('nesnd_tt_culture').GetName]人从[SCOPE.sState('nesnd_tt_source').GetName]被押上船，运往[SCOPE.sCountry('nesnd_tt_buyer').GetName]的[SCOPE.sState('nesnd_tt_dest').GetName]。途中死亡 #v [SCOPE.GetValue('nesnd_tt_dead')|0]#! 人，运抵的 #v [SCOPE.GetValue('nesnd_tt_moved')|0]#! 人在那里成为奴隶。地方官府按人头点交，货款 @money!#v [SCOPE.GetValue('nesnd_tt_price')|0]#! 已经解入国库。"
 nesnd_triangle_trade.1.a:0 "照数入账。"
 nesnd_triangle_trade.2.t:0 "一批货物抵港"
 nesnd_triangle_trade.2.d:0 "从[SCOPE.sCountry('nesnd_tt_seller').GetName]的[SCOPE.sState('nesnd_tt_source').GetName]运来的一批货物在[SCOPE.sState('nesnd_tt_dest').GetName]上岸，#v [SCOPE.GetValue('nesnd_tt_moved')|0]#! 名[SCOPE.sCulture('nesnd_tt_culture').GetName]人被分给本地业主，成为奴隶，另有 #v [SCOPE.GetValue('nesnd_tt_dead')|0]#! 人死于途中。此后两年半之内，本国税收减少 #r 2.5%#!。"
 nesnd_triangle_trade.2.a:0 "收下这批货物。"

 nesnd_triangle_trade.10.t:0 "北洋三角贸易的瓦解"
 nesnd_triangle_trade.10.d:0 "北洋沿岸再也找不到肯收货的港口，也找不到肯放船出海的官府。船主拆下货舱里的铁环，改运煤炭和茶叶，做人口生意的经纪人散到码头上另谋营生。\n\n被卖到异乡的人并没有因此回家。他们仍在东洲的屯垦地、远南的矿井和南洋的种植园里劳作。他们自由的日子，还要等所在国家的法律来决定。"
 nesnd_triangle_trade.10.a:0 "这条航线断了。"
 nesnd_triangle_trade.11.t:0 "西洋三角贸易的瓦解"
 nesnd_triangle_trade.11.d:0 "几内亚湾的商站不再收容待运的俘虏，巴巴里的私掠船也不再押着水手进港。往返于欧洲、非洲与美洲之间的船只改运糖、棉花和机器，这条航线上不再有人买卖人口。\n\n被运到大洋彼岸的人并没有因此回家。他们和他们的子女仍在种植园里劳作。他们自由的日子，还要等所在国家的法律来决定。"
 nesnd_triangle_trade.11.a:0 "这条航线断了。"
