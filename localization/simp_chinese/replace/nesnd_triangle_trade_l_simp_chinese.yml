 nesnd_triangle_buy:0 "买入奴隶"
 nesnd_triangle_buy_desc:0 "我们向这条航线上的卖方订购人口，货物运到以后分给本国准许蓄奴的[concept_state]。卖方每交一批货物，按本国三周固定收入的数目收取货款。本国两年半之内税收减少 #r 2.5%#!，每成交一批重新计算期限。\n\n本国做买主期间，不能同时卖出人口。"
 nesnd_triangle_sell:0 "卖出奴隶"
 nesnd_triangle_sell_desc:0 "我们把境内贫穷、不识字的人卖给这条航线上的买主，每交一批货物，国库按买方三周固定收入的数目收取货款。\n\n本国做卖主期间，不能同时买入人口。"
 nesnd_triangle_none:0 "暂停交易"
 nesnd_triangle_none_desc:0 "政府暂不在这条航线上买卖人口，随时可以恢复。已经排定、经本国之手的那一批货物，到期时不再起运。"
 nesnd_triangle_import:0 "$nesnd_triangle_buy$"
 nesnd_triangle_import_desc:0 "我们向这条航线上的卖方订购人口，货物运到以后分给本国准许蓄奴的[concept_state]。卖方每交一批货物，按本国三周固定收入的数目收取货款。本国两年半之内税收减少 #r 2.5%#!，每成交一批重新计算期限。"
 nesnd_triangle_export:0 "$nesnd_triangle_sell$"
 nesnd_triangle_export_desc:0 "我们把境内贫穷、不识字的人卖给这条航线上的买主，每交一批货物，国库按买方三周固定收入的数目收取货款。"
 nesnd_triangle_refuse:0 "$nesnd_triangle_none$"
 nesnd_triangle_refuse_desc:0 "$nesnd_triangle_none_desc$"
 nesnd_triangle_not_buying_tt:0 "本国尚未向这条航线订购人口"
 nesnd_triangle_not_selling_tt:0 "本国尚未在这条航线上出售人口"
 nesnd_triangle_trading_tt:0 "本国正在这条航线上买卖人口"
 nesnd_triangle_to_buying_tt:0 "政府开始向这条航线#bold 订购人口#!，运来的人将在本国准许蓄奴的[concept_state]成为奴隶。选定后三个月内不能改选或暂停交易。"
 nesnd_triangle_to_selling_tt:0 "政府开始把境内的穷人#bold 卖给#!这条航线上的买主。选定后三个月内不能改选或暂停交易。"
 nesnd_triangle_to_none_tt:0 "政府#bold 暂停#!这条航线上的人口买卖。"

 nesnd_triangle_trade_credit:0 "买入奴隶"
 nesnd_triangle_trade_credit_desc:0 "本国近期在三角贸易中买入了奴隶。"

 nesnd_triangle_trade.1.t:0 "一批货物离港"
 nesnd_triangle_trade.1.d:0 "一批[SCOPE.sCulture('nesnd_tt_culture').GetName]人从[SCOPE.sState('nesnd_tt_source').GetName]被押上船，运往[SCOPE.sCountry('nesnd_tt_buyer').GetName]的[SCOPE.sState('nesnd_tt_dest').GetName]。途中死亡 #v [SCOPE.GetValue('nesnd_tt_dead')|0]#! 人，运抵的 #v [SCOPE.GetValue('nesnd_tt_moved')|0]#! 人在那里成为奴隶。地方官府按人头点交，货款 @money!#v [SCOPE.GetValue('nesnd_tt_price')|0]#! 已经解入国库。"
 nesnd_triangle_trade.1.a:0 "照数入账。"
 nesnd_triangle_trade.2.t:0 "一批货物抵港"
 nesnd_triangle_trade.2.d:0 "从[SCOPE.sCountry('nesnd_tt_seller').GetName]的[SCOPE.sState('nesnd_tt_source').GetName]运来的一批货物在[SCOPE.sState('nesnd_tt_dest').GetName]上岸，#v [SCOPE.GetValue('nesnd_tt_moved')|0]#! 名[SCOPE.sCulture('nesnd_tt_culture').GetName]人被分给本地业主，成为奴隶，另有 #v [SCOPE.GetValue('nesnd_tt_dead')|0]#! 人死于途中。此后两年半之内，本国税收减少 #r 2.5%#!。"
 nesnd_triangle_trade.2.a:0 "收下这批货物。"

 nesnd_triangle_trade.10.t:0 "北洋三角贸易的瓦解"
 nesnd_triangle_trade.10.d:0 "北洋沿岸再也找不到肯收货的港口，也找不到肯放船出海的官府。船主拆下货舱里的铁环，改运煤炭和茶叶，做人口生意的经纪人散到码头上另谋营生。\n\n被卖到异乡的人并没有因此回家。他们仍在东洲的屯垦地、远南的矿井和南洋的种植园里劳作。他们自由的日子，还要等所在国家的法律来决定。"
 nesnd_triangle_trade.10.f:0 "“厩焚。子退朝，曰：‘伤人乎？’不问马。”\n——《论语·乡党》"
 nesnd_triangle_trade.10.a:0 "这条航线断了。"
 nesnd_triangle_trade.11.t:0 "西洋三角贸易的瓦解"
 nesnd_triangle_trade.11.d:0 "几内亚湾的商站不再收容待运的俘虏，巴巴里的私掠船也不再押着水手进港。往返于欧洲、非洲与美洲之间的船只改运糖、棉花和机器，这条航线上不再有人买卖人口。\n\n被运到大洋彼岸的人并没有因此回家。他们和他们的子女仍在种植园里劳作。他们自由的日子，还要等所在国家的法律来决定。"
 nesnd_triangle_trade.11.f:0 "“往来欧洲、非洲、美洲的船只，今后只承运糖、棉花与机器等货物，不再载运人口。”\n——港口的航运公告"
 nesnd_triangle_trade.11.a:0 "这条航线断了。"
