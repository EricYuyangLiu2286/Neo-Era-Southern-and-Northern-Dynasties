 nesnd_north_triangle_trade:0 "北洋三角贸易"
 nesnd_north_triangle_trade_reason:0 "东洲的屯垦地和远南的矿场常年缺人。从鄂霍次克海到南洋，各处港口都有船主向官府收买欠租的佃户、欠债的劳工和边地部族的人口。卖方的国库按批收款。货物上岸以后，这些人便成了奴隶。\n\n儒家文化圈的人口受各国礼法保护，不在买卖之列，女真人除外。任何国家也不买卖自己的主体民族。日本可以买卖日本人和朝鲜人，登莱可以买卖辽东人，只卖不买的国家可以卖出日本人。俄国不买卖斯拉夫人。\n\n参与国必须有港口或可借道的邻国，并且没有禁止蓄奴。地域内的国家全都禁止蓄奴、研究了人权思想，或者都没有港口时，这条航线便永久断绝。"

 nesnd_west_triangle_trade:0 "西洋三角贸易"
 nesnd_west_triangle_trade_reason:0 "欧洲的船在几内亚湾和安哥拉海岸用布匹、火器和烈酒换取各王国掳来的俘虏，运往加勒比、巴西和北美南方的种植园。巴巴里海岸的私掠者扣押欧洲水手，转卖给新大陆上愿意出钱的偏远农庄。欧洲各国也以契约工的名义把国内受歧视的穷人送往殖民地。卖方的国库按批收款。\n\n欧洲和北非的国家可以买入，也可以卖出。美洲的国家只买入。撒哈拉以南的国家只卖出。任何国家都不买卖自己的[concept_primary_cultures]人群，卖方只能卖出在其国内受歧视[concept_culture]的人口。\n\n参与国必须有港口或可借道的邻国，并且没有禁止蓄奴。地域内的国家全都禁止蓄奴、研究了人权思想，或者都没有港口时，这条航线便永久断绝。"

