 nesnd_great_han_name:0 "大汉"
 nesnd_great_han_adj:0 "汉"
 nesnd_postwar_sih_title:0 "蜀军入南京"
 nesnd_postwar_sih_desc:0 "南京已入我军之手，郑氏朝廷无力再维持南方的统治。蜀军起兵时以反吴为号，如今却必须决定天下由谁来统治。有人请求迎回朱氏天子，也有人劝蜀王承继汉统，自立新朝。"
 nesnd_postwar_hna_title:0 "南京的国体之议"
 nesnd_postwar_hna_desc:0 "襄阳将士以反吴复明为号南下，如今礼议院与各省都在等候新的国体。朱氏复位可以重续明统，共和派却不愿再把国家交给一家一姓。旧日士大夫对于共和政体的疑惧，也不会随着郑氏的失败一并消失。"
 nesnd_postwar_gng_title:0 "朱氏再掌明廷"
 nesnd_postwar_gng_desc:0 "淮国宗室仍承朱氏皇统。南京既定，朝臣请淮王正皇帝位，重建明廷的号令。战争留下的分裂尚待弥合，礼议院与各省都将见证这个重新执掌天下的朝廷。"
 nesnd_postwar_restore_ming_option:0 "迎奉朱氏，重建明廷。"
 nesnd_postwar_restore_ming_tt:0 "优先迎回原明朝天子或其合法继承人；若没有可迎奉的在世宗室，则按王系行辈推举新宗室继位，恢复大明国号。不强请别国在位君主或储君。"
 nesnd_postwar_great_han_option:0 "汉家再兴，当在今日。"
 nesnd_postwar_great_han_tt:0 "更改国号为大汉，由本国现任君主继续统治。"
 nesnd_postwar_hna_republic_option:0 "天下不是一家一姓的私产。"
 nesnd_postwar_hna_republic_tt:0 "建立共和国。部分士大夫拒绝承认新政体，共和派则将扩大在知识分子与小市民中的影响。"
 nesnd_postwar_gng_option:0 "奉淮王为帝，复大明之号。"
 nesnd_postwar_gng_tt:0 "由淮王本支朱氏继承帝位；本宗无人可迎奉时，依淮王行辈推举新宗室，恢复大明国号。"
 nesnd_postwar_wait_option:0 "继统之事，尚须再议。"
 nesnd_postwar_wait_tt:0 "目前没有合适的在世继统人选，暂不改变国体或君主。"
