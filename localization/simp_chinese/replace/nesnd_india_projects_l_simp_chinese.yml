 nesnd_india_project.4.t:0 "项目议定"
 nesnd_india_project.4.d_stake:0 "[SCOPE.sCountry('india_matter_to').GetName]政府已按约定拨款。[SCOPE.sState('india_project_site').GetName]的[ROOT.GetCountry.GetCustom('nesnd_india_project_name')]已经落成，产权归[SCOPE.sCountry('india_matter_to').GetName]政府。此后五年内，我国不在该地另订出资约定。"
 nesnd_india_project.4.d_grant:0 "[SCOPE.sCountry('india_matter_to').GetName]政府已按约定拨款资助办学，不取得产权。[SCOPE.sState('india_project_site').GetName]的[ROOT.GetCountry.GetCustom('nesnd_india_project_name')]已进入我国政府的建造队列。此后五年内，我国不在该地另订出资约定。"
 nesnd_india_project.4.d_survey:0 "[SCOPE.sCountry('india_matter_to').GetName]同意派工程人员来我国考察，并培训本地工匠。考察费已经支付。"
