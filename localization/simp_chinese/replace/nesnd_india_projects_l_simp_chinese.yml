 nesnd_india_project_status_funder:0 "已就[ROOT.GetCountry.GetCustom('nesnd_india_project_name')]向[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府提出请求，正在等候答复。"
 nesnd_india_project_status_building:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]的[ROOT.GetCountry.GetCustom('nesnd_india_project_name')]正在施工。"
 nesnd_india_project.1.t:0 "本地项目"
 nesnd_india_project.1.d:0 "[ROOT.GetCountry.GetName]准备兴办一项本地建设。先定办什么，再定办在哪里、由谁出资。由我国出资，工程进入政府的建造队列。请别国政府出资，对方可能要求取得产权。如果我国是别国的附属国，宗主国也可能过问。"
 nesnd_india_project.1.f:0 "“[ROOT.GetCountry.GetName]政府拟兴办一项公共工程，所需款项另行筹措。”\n——[ROOT.GetCountry.GetName]政府公告"
 nesnd_india_project.1.a:0 "兴办[GetBuildingType('building_university').GetName]"
 nesnd_india_project.1.b:0 "兴办[GetBuildingType('building_tooling_workshop').GetName]"
 nesnd_india_project.1.c:0 "兴办[GetBuildingType('building_railway').GetName]"
