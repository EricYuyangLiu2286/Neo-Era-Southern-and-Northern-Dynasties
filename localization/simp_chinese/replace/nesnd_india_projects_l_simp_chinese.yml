 nesnd_india_foreign_affairs_reason:0 "$region_north_india$、$region_south_india$和喜马拉雅山区各国的政府，常有事务要请别国政府答复：请对方出资兴办[GetBuildingType('building_university').GetName]、[GetBuildingType('building_tooling_workshop').GetName]或[GetBuildingType('building_railway').GetName]，出资的政府可以取得产权，或者两国商订[concept_trade_privilege]、[concept_military_access]的[concept_treaty]。附属国让别国政府取得产权或军事通行权，或者要脱离宗主国、加入别国，都须先经[concept_overlord]许可。现在有一件这样的事务，等候[ROOT.GetCountry.GetName]答复。"
 nesnd_india_matter_status_consent_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]，在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]，产权归[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]是我国的附属国，此事须经我国许可。"
 nesnd_india_matter_status_consent_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]，资助在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]不取得产权。"
 nesnd_india_matter_status_consent_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：聘请[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]的工程人员考察并培训工匠，由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]支付 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]。"
 nesnd_india_matter_status_fund_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请我国政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]，在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]。一级建筑立即落成，产权归我国政府。"
 nesnd_india_matter_status_fund_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请我国政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0]，资助在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]。我国不取得产权。"
