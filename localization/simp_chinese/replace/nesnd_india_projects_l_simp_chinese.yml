 nesnd_india_project_own_tt:0 "在选定的[concept_state]兴建一级，工程进入我国政府的建造队列，费用由我国承担。"
 nesnd_india_project_ask_stake_tt:0 "请对方政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0]。对方同意后，一级建筑立即落成，产权归对方政府。我国得到拨款，并欠对方一份[concept_obligation]。"
 nesnd_india_project_ask_grant_tt:0 "请对方政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_grant')|0] 资助办学，对方不取得产权。对方同意后，工程进入我国政府的建造队列，我国欠对方一份[concept_obligation]。"
