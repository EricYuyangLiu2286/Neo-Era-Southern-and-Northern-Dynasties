 nesnd_india_project.7.f:0 "“本约定以五年为期。期满以后，已经取得的产权仍然有效。”\n——[ROOT.GetCountry.GetName]与[SCOPE.sCountry('india_matter_to').GetName]的约定"
 nesnd_india_project_term_over_tt:0 "该地可以另订出资约定。"
