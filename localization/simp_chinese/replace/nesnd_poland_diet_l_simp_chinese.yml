l_simp_chinese:
 nesnd_poland_red_white_name: "红党与白党"
 nesnd_poland_rw_land: "$ig_landowners$或$ig_industrialists$势力强大"
 nesnd_poland_rw_franchise: "财产选举或新闻审查"
 nesnd_poland_rw_paris: "巴黎愿意出面交涉"
 nesnd_poland_rw_prosperity: "生活水平达到15"
 nesnd_poland_rw_settlement: "和议稳固"
 nesnd_poland_rw_university: "国内有三级[GetBuildingType('building_university').GetName]"
 nesnd_poland_rw_intellectuals: "$ig_intelligentsia$或$ig_rural_folk$强势或不满"
 nesnd_poland_rw_speech: "出版与集会自由"
 nesnd_poland_rw_isolation: "巴黎不愿干预"
 nesnd_poland_rw_poverty: "生活水平低于10"
 nesnd_poland_rw_radicals: "国内激进派达到一成"
 nesnd_poland_rw_warsaw: "首都设在华沙"
 nesnd_poland_rw_abroad: "境外故土的[GetCulture('polish').GetName]激进派达到两成"
 nesnd_poland_university_name: "资助华沙大学"
 nesnd_poland_university_desc: "将华沙的[GetBuildingType('building_university').GetName]扩充至三级，支出相当于四周固定收入的款项。"
 nesnd_poland_diet_name: "召开议会"
 nesnd_poland_diet_desc: "请议会决定先派代表谈判，还是公开支持境外请愿。"
 nesnd_poland_paris_name: "向巴黎求援"
 nesnd_poland_paris_desc: "请巴黎出面交涉。未来两年内法国的意志提高10点，白党获得支持。"
 nesnd_poland_agitators_name: "派遣鼓动者"
 nesnd_poland_agitators_desc: "向瓜分国境内的[GetCulture('polish').GetName]聚居地派出鼓动者。"
 nesnd_poland_rising_name: "发动起义"
 nesnd_poland_rising_desc: "选择瓜分国，向它索取一个复国所需的州。起义失利后，镇压将持续十年。"
 dp_nesnd_poland_rising: "波兰起义"
 dp_nesnd_poland_rising_tooltip: "为收回故土发动起义。"
 nesnd_poland_repression: "起义后的镇压"
 nesnd_polish_diet.1.t: "报纸上的边界"
 nesnd_polish_diet.1.d: "一家报纸将1829年和议附图与今日各州的边界印在同一页上。白党要把这一期送往外国使馆，红党则想在边境集市上散发。印刷商要求先付第二版的纸钱。"
 nesnd_polish_diet.1.a: "把复本送交各国使馆。"
 nesnd_polish_diet.1.b: "拨款加印。"
 nesnd_polish_diet.2.t: "越境的租佃契约"
 nesnd_polish_diet.2.d: "有的佃户凭一份租约耕种边境两侧的田地，每到收割季节，都要为过界的雇工领取通行证。田主请政府与邻国订立通行办法。佃户派来的人带了一份要求取消通行证的请愿书。"
 nesnd_polish_diet.2.a: "请田主推举谈判代表。"
 nesnd_polish_diet.2.b: "将佃户的请愿书交付议会。"
 nesnd_polish_diet.3.t: "起义者的抚恤金"
 nesnd_polish_diet.3.d: "申请抚恤的妇女要把战死者的部队名称写在表上。有些部队从未列入政府的名册，承认这些申请也就等于承认了当年自行起兵的人。"
 nesnd_polish_diet.3.a: "按军籍核给。"
 nesnd_polish_diet.3.b: "准许同袍作证，拨款抚恤。"
 nesnd_polish_diet.4.t: "华沙来信"
 nesnd_polish_diet.4.d: "几位教师请求把本国边界以外的地图也送进课堂。红党愿付印费，条件是由他们挑选地图。白党议员已把另一套地图送交审阅，上面标出了和议承认的国界。"
 nesnd_polish_diet.4.a: "采用和议附图。"
 nesnd_polish_diet.4.b: "准许教师自选。"
 nesnd_polish_diet.5.t: "商人赴会"
 nesnd_polish_diet.5.d: "经营陆路贸易的商人请政府担保货栈，以免下一次边境争端使他们破产。白党主张担保的条件是商人共同出资赴邻国谈判，红党则要求政府先公布打算收回哪些土地。"
 nesnd_polish_diet.5.a: "拨款担保，让代表团启程。"
 nesnd_polish_diet.5.b: "先在议会辩论领土要求。"
 nesnd_polish_diet.6.t: "请愿书上的签名"
 nesnd_polish_diet.6.d: "一份要求收复故土的请愿书已送到议会。若将签名付印，住在边界另一侧的人回去时就可能受盘查。请愿者为此争执起来，有人甚至要当场取回自己签过的那一页。"
 nesnd_polish_diet.6.a: "封存签名，由议员递交。"
 nesnd_polish_diet.6.b: "让愿意署名的人公开发表。"
 nesnd_polish_diet.7.t: "议会开幕"
 nesnd_polish_diet.7.d: "议会取得了向外国派出代表的经费。白党提名一批熟悉各国使馆的议员，红党的动议则要求代表团先听取境外波兰人的请愿。"
 nesnd_polish_diet.7.a: "授权议员与保证国交涉。"
 nesnd_polish_diet.7.b: "先听取境外代表陈情。"
 nesnd_polish_diet.8.t: "收复故土"
 nesnd_polish_diet.8.d: "红党已要求政府支持边境另一侧的起义。议会须决定先向哪个瓜分国索地。一旦发出要求，起义者的去留就要在外交博弈中决定。"
 nesnd_polish_diet.8.pru: "要求归还[SCOPE.sState('rising_pru').GetName]。"
 nesnd_polish_diet.8.aus: "要求归还[SCOPE.sState('rising_aus').GetName]。"
 nesnd_polish_diet.8.rus: "要求归还[SCOPE.sState('rising_rus').GetName]。"
 nesnd_polish_diet.8.wait: "暂缓发难。"
 nesnd_polish_diet.9.t: "起义者归乡"
 nesnd_polish_diet.9.d: "起义所争的土地已归本国管辖。红党派往边境的代表现在要把当地的税收和征兵事务交给政府。"
 nesnd_polish_diet.9.a: "派人接管。"
 nesnd_polish_diet.10.t: "起义失败"
 nesnd_polish_diet.10.d: "起义未能收回所争的土地。白党要求收回红党在边境各委员会的职权，准许越境逃来的家属在国内安置。"
 nesnd_polish_diet.10.a: "准许家属入境。"
 nesnd_poland_rw_pressure: "红党要求修改边界"
 nesnd_poland_fund_15: "宣称经费增加15点。"
 nesnd_poland_claim_fund_tt: "可用于领土交涉的经费达到20点。"
 nesnd_poland_negotiation_terms: "交涉结束后，五年内不能再向该国索地。同属一个权力集团时，拒绝即告谈判破裂。在集团之外，拒绝会引发领土博弈，对方将要求吞并$nesnd_lobby_name_kra$。"
 nesnd_poland_rw_status_white: "白党已承诺遵守1829年和议。红党越过中线时，议会将撤回这一承诺。领土交涉经费为[ROOT.GetCountry.MakeScope.Var('nesnd_poland_claim_fund').GetValue|0]/100。\n$nesnd_poland_rw_rules_link$"
 nesnd_poland_rw_status: "领土交涉经费为[ROOT.GetCountry.MakeScope.Var('nesnd_poland_claim_fund').GetValue|0]/100。每项宣称耗费20点。\n$nesnd_poland_rw_rules_link$"
 nesnd_poland_rw_rules_link: "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_poland_rw_rules $nesnd_poland_red_white_name$#!#!"
 nesnd_poland_rw_rules: "#bold 白党 100%#!　月度结算时，议会承诺遵守[Glossary('glossary_nesnd_settlement_of_1829','1829年的和议')]。守约期间，列强更倾向于支持波兰的提案。若法国意志达到60，战后领土提案通过时，波兰最多可收回华沙公国旧疆内的两州。红党超过50%后，议会将在月度结算时撤回承诺。\n\n#bold 红党至少 75%#!　议会可在瓜分国境内组织秘密社团。若社团遭揭发，该国可向大陆会议提请制裁波兰。\n\n#bold 红党 100%#!　议会可发动起义，向一个瓜分国索取一州，也可暂缓行动。若波兰的提案遭大陆会议否决，议会在随后五年内也可凭这次授权发动一次起义。起义失败后，镇压持续十年，白党占比回到75%。"
 je_ce_tp_tsar_gendarme_of_europe: "$je_tp_tsar_gendarme_of_europe$"
 je_ce_tp_tsar_gendarme_of_europe_reason: "$je_tp_tsar_gendarme_of_europe_reason$"
 je_ce_tp_tsar_gendarme_of_europe_button_1_name: "东方的盟约"
 je_ce_tp_tsar_gendarme_of_europe_button_1_desc: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]希望欧洲各君主国缔结同盟或防御协定，以便在巴黎再次干预东欧疆界时彼此声援。"
 je_ce_tp_tsar_gendarme_of_europe_button_1_complete_tt: "已完成「东方的盟约」。"
 je_ce_tp_tsar_gendarme_of_europe_button_5_name: "维护1829年的和议"
 je_ce_tp_tsar_gendarme_of_europe_button_5_desc: "使$nesnd_lobby_name_kra$的首都留在华沙以外，并在大陆会议上否决一次波兰议程。"
 je_ce_tp_tsar_gendarme_of_europe_button_5_complete_tt: "已维护1829年的和议。"
 nesnd_poland_veto_tt: "曾在大陆会议上否决波兰议程。"
 nesnd_poland_suppressed_tt: "镇压过波兰起义或波兰分离运动。"
 nesnd_poland_eastern_allies_tt: "与至少三个欧洲君主制大国结盟或订有防御协定。"
 nesnd_poland_rising_target_tt: "瓜分国持有可争取的复国州，且双方可以展开领土博弈。"
 nesnd_poland_agitator_target_tt: "至少一个瓜分国仍统治[GetCulture('polish').GetName]故土。"
 dp_nesnd_poland_rising_desc: "以归还所选州为首要要求。"
