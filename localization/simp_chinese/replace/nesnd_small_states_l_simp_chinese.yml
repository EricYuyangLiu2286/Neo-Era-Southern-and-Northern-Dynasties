 nesnd_small_states.2.far_south:0 "澳洲的加工与人口中心已经同新西兰的地方生产保持了有效联系。港口能够雇用工人，货物也能进入市场。远南可以从这些已有的产业继续成长，政府也将从中获得维持地方事务的收入。"
 nesnd_small_states.2.burma:0 "$STATE_MANDALAY$所在的上游与$STATE_PEGU$下游已有能够经营的生产，并通过现有交通参与市场。农户与商人的收入改善了地方生计，也使政府有余力考虑上下游的行政与教育。"
 nesnd_small_states.2.siam:0 "曼谷之外的生产已经同人口与财政中心保持了联系。现有军队仍要从全国收入中获得供养，地方经营的成果也将检验政府如何分配行政与教育的资源。"
 nesnd_small_states.6.far_south:0 "澳洲与新西兰的生产和海运已经相互联系，学校与行政机关也能维持地方事务。政府有了更多税收与人才，可以据此处理对外关系，安排两地今后的建设。"
 nesnd_small_states.6.burma:0 "上游与$STATE_PEGU$下游的生产和公共事务已有了稳定的支持。连接两地的市场与交通增加了政府收入，学校也在培养人才。缅甸可以据此争取更有利的对外关系。"
 nesnd_small_states.6.siam:0 "曼谷与地方的生产、公共事务和防务已能相互支撑。政府的收入要供养军队，也要维持学校与地方行政；如何分配这些收入，仍是各方争论的国事。"
 nesnd_small_livelihood_journal:0 "邦国的生计"
 nesnd_small_livelihood_journal_reason:0 "本国的农户、工匠和商人承受着地租、税负与市场变动。政府要争取更多自主，就需要地方生产提供收入，学校与行政机关培养办事的人。外国投资可以提供资金和技术，宗主的支持也能减轻一些负担，但国家仍须依靠本地的劳动与经营。"
 nesnd_small_subject_status:0 "[ROOT.GetCountry.TryGetOverlordTooltipEntry]\n失业率不高于10%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]。市场接入达80%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]。"
 nesnd_small_independent_status:0 "本国已独立。失业率不高于10%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]。市场接入达80%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]。"
 nesnd_small_targets_lost:0 "原定地区已失去足够的人口或实际支点，地区建设暂停。可待条件恢复，也可重订当前国土上的两区目标。"
 nesnd_small_economy_journal:0 "活下去"
 nesnd_small_economy_journal_reason:0 "农户与雇工能否维持生活，取决于生产、就业和货物运输。现有产业也可成为发展的根基。"
 nesnd_small_economy_months_tt:0 "已累计12个达标月"
 nesnd_small_governance_journal:0 "地方的根基"
 nesnd_small_governance_journal_reason:0 "地方需要教师、行政人员和稳定的公共经费。把学校与政府机构办到首都以外，才能使更多居民受教育、从事新的职业。"
 nesnd_small_governance_months_tt:0 "已累计12个达标月"
 nesnd_small_regional_economy_journal:0 "地区生产与市场"
 nesnd_small_regional_economy_journal_reason:0 "人口中心和其他地区各有农牧、矿产、渔林与加工产业。连接这些产地与市场的交通，可以使各地利用自己的出产，形成互相依存的分工。"
 nesnd_small_regional_economy_months_tt:0 "已累计12个达标月"
 nesnd_small_regional_governance_journal:0 "地区治理"
 nesnd_small_regional_governance_journal_reason:0 "地方的收入不能只供养首都。两个地区都须有人办理公共事务，学校和大学才能使越来越多的居民承担新的职业。"
 nesnd_small_regional_governance_months_tt:0 "已累计12个达标月"
 nesnd_small_order_journal:0 "自主后的秩序"
 nesnd_small_order_journal_reason:0 "独立或高度自主使政府有权安排更多事务，也要求本国承担贸易、法律与防御的责任。地方生产需要稳定的销路，学校需要经费，边境则需要可靠的盟友和军队。"
 nesnd_small_order_months_tt:0 "已累计24个达标月"
 nesnd_small_working_status:0 "本月条件满足，经营观察可以继续。"
 nesnd_small_paused_status:0 "本月尚未满足全部条件，已积累的有效月份保留。"
 nesnd_small_dispute_journal:0 "国内争议"
 nesnd_small_dispute_journal_reason:0 "生活的困顿与法律上的束缚，使地方运动得到支持。政府可以容许组织、承诺改法，或动用警察压制；每一种做法都会触及具体人群的利益。"
 nesnd_small_dispute_status:0 "地方运动正在争取支持。改革承诺只有实际改法才能兑现。"
 nesnd_small_observation_months:0 "达标月数"
 nesnd_small_bar_desc:0 "[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]个月"
 nesnd_small_qualified_month:0 "当前建设条件满足"
 nesnd_small_public:0 "培养地方人才"
 nesnd_small_public_desc:0 "行政与产业都缺少能够承担新职责的人。政府可用一年的公共投入帮助地方培养人才。"
 nesnd_small_public_tt:0 "按开始时的报价承担12个月每周开支；资格与税收能力暂时提高。此项投入不能中途撤销或重复开办。"
 nesnd_small_specialise_button:0 "依托现有市场"
 nesnd_small_specialise_button_desc:0 "商人和行会希望借现有市场扩大销路，政府将给地方经营更多余地。"
 nesnd_small_specialise_button_tt:0 "12个月内资格增长提高，权威减少25。市场主人改变或取得自有市场后，这项安排结束。"
 nesnd_small_own_market_button:0 "筹办自有市场"
 nesnd_small_own_market_button_desc:0 "本国可以争取市场自主，但许可本身不能代替原料、运输和销路。"
 nesnd_small_own_market_button_tt:0 "选择12个月的自有市场筹备方向，不立即改变市场归属。实际自有市场后，可承担公共投入；达标产业须没有投入品短缺。"
 nesnd_small_retarget_button:0 "重订地区目标"
 nesnd_small_retarget_button_desc:0 "失去旧地区后，政府仍可在现有国土上组织生产和公共事务。重订也意味着重新检验这项安排。"
 nesnd_small_retarget_button_tt:0 "按当前人口最大州与其余直接州重订两区及支点，当前地区观察月数归零。24个月内不能再重订；既有奖励不重复发放。"
 nesnd_small_restore_geography_button:0 "重建本土地理联系"
 nesnd_small_restore_geography_button_desc:0 "收复的地区可以重新纳入本土经营，但旧日成果不能代替今日的交通和公共服务。"
 nesnd_small_restore_geography_button_tt:0 "只有原定本土地理组重新满足人口与支点条件时，才重订目标并重新观察；同样受24个月间隔限制。"
 nesnd_small_order_button:0 "经营自主后的秩序"
 nesnd_small_order_button_desc:0 "巩固本国的法律、公共服务与防务。"
 nesnd_small_order_button_tt:0 "选择与当前主权事实相符的目标，在120个月内累计24个达标月。主权分支变化后须重新观察；共同奖励一生只发一次。"
 nesnd_small_request_autonomy:0 "要求扩大自治"
 nesnd_small_request_autonomy_desc:0 "地方政府希望以已有的经营能力争取更多自行处理事务的权利。"
 nesnd_small_request_autonomy_tt:0 "向实际直接宗主提出请求。批准后执行原生自治提升，核对实际结果，并按原生安排减少自由渴望、订立停战。"
 nesnd_small_request_independence:0 "商谈和平独立"
 nesnd_small_request_independence_desc:0 "本国希望由自己承担内外事务，也必须使宗主相信放手已有现实依据。"
 nesnd_small_request_independence_tt:0 "向实际直接宗主请求和平独立。只有实际独立才算成功；拒绝后仍可依原生外交规则争取自主。"
 nesnd_small_request_market:0 "请求自有市场"
 nesnd_small_request_market_desc:0 "市场自主将把更多供需与运输责任交给本国，政府须争取当前市场主人的同意。"
 nesnd_small_request_market_tt:0 "向实际市场主人请求原生自有市场 pact。核对真实市场归属；pact已生效但市场尚未重算时，最多等候30日。"
 nesnd_small_defence_fra:0 "与$FRA$商谈防御协定"
