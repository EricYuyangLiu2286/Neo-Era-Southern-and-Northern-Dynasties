 nesnd_small_states.20.t:0 "地方政府的提议"
 nesnd_small_states.20.autonomy:0 "[SCOPE.sCountry('canon_sender').GetName]的政府认为，地方经济与行政已经能够承担更多事务，要求我们放宽对其内政的限制。接受提议将提高它的自治权。"
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName]请求以和平方式结束直接宗属关系，由自己承担内外事务。放弃宗主权将改变双方的权利与义务，也可使一场冲突止于谈判。"
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName]请求自行主持市场。当地商人与生产者将自行安排货物的供给和销路，我们需要决定是否授予这一权利。"
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName]提出缔结防御条约。双方将承担实际条款规定的义务，既有生产与外交联系也可能因此受到战争的考验。"
 nesnd_small_accept_tt:0 "接受提议中的自治、独立、市场或防御安排。"
 nesnd_small_refuse_tt:0 "拒绝提议。拒绝提高自治权的请求会增加对方的独立倾向，并损害双边关系。"
 nesnd_small_states.21.t:0 "邻邦的选择"
 nesnd_small_states.21.d:0 "[SCOPE.sCountry('small_receiver').GetName]是当前关系最好的合格邻邦。政府可以正式提出防御协定，也可以暂缓此事。"
 nesnd_small_states.21.a:0 "向他们正式提出协定。"
 nesnd_small_states.21.b:0 "暂缓此事。"
