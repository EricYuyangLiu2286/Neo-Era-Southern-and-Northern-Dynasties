 nesnd_small_defence_dai:0 "与$DAI$商谈防御协定"
 nesnd_small_defence_dai_desc:0 "商谈防御条约，约定共同应对外来进攻。"
 nesnd_small_defence_dai_tt:0 "向对方提出五年防御条约请求。对方同意后，订立条约。"
 nesnd_small_defence_neighbour:0 "与邻邦商谈防御"
 nesnd_small_defence_neighbour_desc:0 "寻找关系友好的邻邦，商谈共同应对外来进攻。"
 nesnd_small_defence_neighbour_tt:0 "先查看关系最好的合格邻邦，再决定是否提出防御条约。关系相同时优先选择GDP较高者。"
 nesnd_small_request_defence_tt:0 "正式提出五年防御条约请求。"
 nesnd_small_states.continue:0 "我们还有许多事要做。"
 nesnd_small_states.2.t:0 "民生经济渐有根基"
 nesnd_small_states.2.d:0 "本国的产业开始给农户和雇工一条稳当的出路。货卖得出去，东家付得起工钱，越来越多的人家靠自己的力气过上了日子。\n\n这些人家安顿下来，国库也有了靠得住的税源。"
 nesnd_small_states.3.t:0 "地方事务有人承担"
 nesnd_small_states.3.d:0 "官署和学校总算办起来了，也维持得下去。公事有人办，书有人教，作坊也开始招得到识字、懂行的人。\n\n百姓读的书多了，就说得清自己要政府做什么。"
 nesnd_small_states.4.t:0 "市场关系震荡"
 nesnd_small_states.4.d:0 "本国换了市场，商会和企业借原有市场谈下的临时买卖也跟着作废。原料、买主、运输，都得在新市场里重新找。\n\n政府说转向就转向，货却还压在生产者的仓里。"
 nesnd_small_states.5.t:0 "秩序仍待建立"
 nesnd_small_states.5.d:0 "这些年过去，法律、市场和地方产业还是没能把自主的事业立起来。已有的作坊和学校照常运转，国事需要的条件却始终凑不齐。\n\n这件事只能暂且放下。等条件齐了，还可以接着办。"
 nesnd_small_states.6.t:0 "能够维持的秩序"
 nesnd_small_states.6.d:0 "地方产业养得起学校和官署，市场和防务也足以自立。政府手里有了人、有了钱，同外国打交道时也多了几分本钱。\n\n这份家底，是百姓一笔笔税、一天天的活计攒下来的。"
 nesnd_small_states.11.t:0 "改革承诺兑现"
 nesnd_small_states.11.d:0 "政府兑现了许给地方的法律改革。当初组织起来的人，这回知道自己真能撼动国政。从前只能忍着的事，如今可以拿国法去争。\n\n吃了亏的东家们不会就此罢休。新法写进了条文，还得有人去执行。"
 nesnd_small_states.12.t:0 "落空的承诺"
 nesnd_small_states.12.d:0 "许诺的期限已经过去，民众等待的法律改革仍未到来。首都的老爷们曾要求地方耐心等候，如今原有的束缚还在，他们却拿不出足以兑现承诺的改变。\n\n那些相信过政府的人开始失望。生活中的困难不会因为期限过去而减轻，未被回答的要求，也渐渐变成了更深的不满……"
 nesnd_small_states.10.t:0 "地方组织的要求"
 nesnd_small_states.10.land:0 "地方农户与雇工日子难过，土地改革运动有了支持。地归谁、活计听谁支配，决定着他们辛苦一年能剩下多少，也决定着他们能不能摆脱旧主。\n\n要求变革的人已经组织起来了。叫他们接着忍，凭什么还要他们信这套秩序？"
 nesnd_small_states.10.labor:0 "雇工的日子越来越难，劳动运动在地方上得了人心。工人要谈工钱、工时和做工的保障，不想再一个人去同东家争。在东家看来，这些要求动的是他们的利润，还有他们对工人的支配。"
 nesnd_small_states.10.representation:0 "地方的自由派与激进派正在拉拢人心。被身份或政治资格挡在门外的人，想对管着自己的事说上话；已经在门里的人，未必肯给他们让座。\n\n他们已经组织起来，这场争论再也留不在纸上了。"
 nesnd_small_states.10.organise:0 "让他们组织起来，公开说出要求。"
 nesnd_small_states.10.organise_tt:0 "相关运动的支持权重#p +15%#!，权威#n −25#!，持续#v 12个月#!。受影响人群的#v 1%#!转为激进派。运动中若有本国支持者，其人气#p +10#!，持续#v 12个月#!。"
 nesnd_small_states.10.promise_land:0 "我们将改变土地制度。"
 nesnd_small_states.10.promise_land_tt:0 "在24个月内通过立法改变土地制度，实行自耕农、土地商品化或集体农业。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_debt:0 "承诺废除债役。"
 nesnd_small_states.10.promise_debt_tt:0 "在24个月内通过立法改变奴隶制，实行禁止奴隶制。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_labor:0 "劳动者应当得到法律保障。"
 nesnd_small_states.10.promise_labor_tt:0 "在24个月内通过立法改变劳动权利，实行监管机构或工人保护。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_caste:0 "我们将解除种姓的限制。"
 nesnd_small_states.10.promise_caste_tt:0 "在24个月内通过立法改变种姓制度，实行不执行印度种姓或平权措施。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_representation:0 "承诺让更多人参与国事。"
 nesnd_small_states.10.promise_representation_tt:0 "在24个月内通过立法改变权力分配，实行财产选举、资格选举或普选。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.suppress:0 "让警察去制止这些组织。"
 nesnd_small_states.10.suppress_tt:0 "相关运动的支持权重#n −15%#!，权威#n −50#!，持续#v 12个月#!。受影响人群的#v 2%#!转为激进派。"
 nesnd_small_states.20.t:0 "地方政府的提议"
 nesnd_small_states.20.autonomy:0 "[SCOPE.sCountry('canon_sender').GetName]的政府拿地方经济和行政的长进作凭据，要求多管一些自己的事。照他们的说法，他们担得起这些责任，宗主的约束也该松一松。\n\n答应下来，他们的自治就升了一等。"
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName]请求谈判结束宗属关系，由他们自己的政府担起内外事务，独立以后两家仍和平相处。\n\n这一回他们要的，是这个国家的将来由谁作主。答应，就是交出宗主权，也免了为保住它而起的争端。"
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName]请求另立市场，自己经营生产与贸易。原料和销路从此由当地商人自己张罗，两家原有的供需往来也要跟着变。"
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName]请求同我国缔结防御条约。他们想要一个靠得住的盟友。\n\n约一签，他们挨了打，我们就可能要出兵。"
 nesnd_small_accept_tt:0 "同意对方提出的安排。"
 nesnd_small_refuse_tt:0 "拒绝提议。拒绝提高自治权的请求会增加对方的独立倾向，并损害双边关系。"
 nesnd_small_states.21.t:0 "邻邦的选择"
 nesnd_small_states.21.d:0 "政府打算向[SCOPE.sCountry('small_receiver').GetName]提议共同防御。两国交好，国土又挨得近，兵马能互相照应，来犯的人就得掂量掂量。\n\n使者的国书已经拟好。"
 nesnd_small_states.21.a:0 "向他们正式提出协定。"
 nesnd_small_states.21.b:0 "暂缓此事。"
