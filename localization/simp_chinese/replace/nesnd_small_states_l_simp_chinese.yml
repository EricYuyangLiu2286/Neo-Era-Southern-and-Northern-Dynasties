 nesnd_small_own_market_button_tt:0 "筹备期为12个月，不立即改变市场归属。已经拥有本国市场时，可开办公共投入。筹备期间，达标产业须没有投入品短缺。"
 nesnd_small_retarget_button:0 "重划建设范围"
 nesnd_small_retarget_button_desc:0 "将人口最多的一州单列，其余有人居住的州合为另一组，重订建设目标。"
 nesnd_small_retarget_button_tt:0 "以当前人口最多的本国持有州为一区，其余本国持有州为另一区，重新选定两地支点。当前地区达标月数归零，24个月内不能再次重订。已领取的奖励不能再次领取。"
 nesnd_small_restore_geography_button:0 "重建本土地理联系"
 nesnd_small_restore_geography_button_desc:0 "重新把本土两地纳入共同经营，让收复的地区恢复同国内生产和公共事务的联系。"
 nesnd_small_restore_geography_button_tt:0 "原定本土两区重新满足人口与支点条件后，恢复原定地区目标并重新累计达标月份。仍须遵守24个月的重订间隔。"
 nesnd_small_order_button:0 "经营自主后的秩序"
 nesnd_small_order_button_desc:0 "既已自主，法律、市场、公事和防务，便由本国一手经营。"
 nesnd_small_order_button_tt:0 "依当前独立或高度自主的地位开展建设，在120个月内累计24个达标月。独立与属国地位改变，或不再享有高度自主时，须重新累计。完成奖励只能领取一次。"
 nesnd_small_request_autonomy:0 "要求扩大自治"
 nesnd_small_request_autonomy_desc:0 "我们自己收得上税，也有人手办理政务。宗主该把更多国事交还给我们了。"
 nesnd_small_request_autonomy_tt:0 "向直接宗主请求提高自治权。批准后提高自治权，减少自由渴望，并与宗主订立停战。"
 nesnd_small_request_independence:0 "商谈和平独立"
 nesnd_small_request_independence_desc:0 "同宗主好好谈，体体面面地结束宗属关系，内外事务从此自己担。"
 nesnd_small_request_independence_tt:0 "请求直接宗主同意和平独立。遭到拒绝后，仍可通过外交争取自主。"
 nesnd_small_request_market:0 "请求自有市场"
