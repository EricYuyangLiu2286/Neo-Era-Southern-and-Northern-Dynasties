 nesnd_small_livelihood_journal:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('nesnd_small_economy_name')]"
 nesnd_small_livelihood_journal_reason:0 "[ROOT.GetCountry.GetName]的国库，取自农户、雇工和商人的收入。货物要运得到有买主的市场，工场和种植园要有人做工、有盈余，政府才收得上税，才供养得起行政与军队。\n\n在别国主导的市场里，商人和行会可以借现成的商路扩大经营。政府也可以着手建立本国自己的市场，自己掌握原料与销路。无论走哪条路，国家都不能落到无力偿债的地步。"
 nesnd_small_dispute_journal:0 "国内争议"
 nesnd_small_dispute_journal_reason:0 "生活的困顿使地方民众开始寻找共同的出路。有人要求改变土地与劳动的关系，有人希望取得更多参与国事的权利。原先各家承受的负担，正在成为运动提出的诉求。\n\n地主、雇主和原有特权的持有者，不愿让出已有的利益。要求改变的人则在等待政府的答复。"
 nesnd_small_observation_months:0 "达标月数"
 nesnd_small_qualified_month:0 "本月三项条件都满足"
 nesnd_small_public:0 "培养地方人才"
 nesnd_small_public_desc:0 "地方行政与产业都需要识字、有本领的人。投入一年的公共经费，帮助居民取得从事新职业的机会。"
 nesnd_small_public_tt:0 "按开始时的报价承担12个月的每周开支，暂时提高资格增长与税收能力。投入期间不能撤销或再次开办。"
 nesnd_small_specialise_button:0 "依托现有市场"
 nesnd_small_specialise_button_desc:0 "商人和行会希望凭现有市场扩大经营。支持他们利用已有商路，让地方生产找到更多买主。"
 nesnd_small_specialise_button_tt:0 "12个月内资格增长提高，[concept_authority]减少25。市场主人改变或取得自有市场后，这项效果结束。"
 nesnd_small_own_market_button:0 "筹办自有市场"
 nesnd_small_own_market_button_desc:0 "筹办本国市场，使原料、生产与销路能够由本国自行经营。"
 nesnd_small_own_market_button_tt:0 "筹备期为12个月，不立即改变市场归属。已经拥有本国市场时，可开办公共投入。筹备期间，达标产业必须没有投入品短缺。"
 nesnd_small_request_market:0 "请求自有市场"
 nesnd_small_request_market_desc:0 "请求当前市场主人同意本国另立市场，由本国承担供需与运输的经营。"
 nesnd_small_request_market_tt:0 "向[concept_market_owner]请求另立本国[concept_market]"
 nesnd_small_request_defence_tt:0 "正式提出五年防御条约请求。"
 nesnd_small_states.continue:0 "我们还有许多事要做。"
 nesnd_small_states.4.t:0 "市场关系震荡"
 nesnd_small_states.4.d:0 "我国所在的市场已经变了，商会与企业在原有市场里得到的临时许可也随之结束。原先依靠的原料、买主和运输，都要在新的市场里重新找。\n\n找不到新销路的工场和商号可能停工，在那里做工的人也要另找生计。"
 nesnd_small_states.4.f:0 "“本国所属市场已经变更，原有的临时许可随之失效。各会员须在新市场重新寻找原料、买主与运输。”\n——商会致会员的通告"
 nesnd_small_states.11.t:0 "改革承诺兑现"
 nesnd_small_states.11.d:0 "政府已经实行了向地方许诺的法律改革。曾为此组织起来的人们，相信自己也能左右国政。他们可以援引国家的法律，反对长期忍受的做法。\n\n原有利益的持有者不会轻易释怀。政治上的争执将随新法进入日常生活，政府也必须让自己的法令得到执行。"
 nesnd_small_states.11.f:0 "“徒善不足以为政，徒法不能以自行。”\n——《孟子·离娄上》"
 nesnd_small_states.12.t:0 "落空的承诺"
 nesnd_small_states.12.d:0 "许诺的期限已经过去，民众等待的法律改革仍未实行。\n\n曾经相信政府、耐心等候的人开始失望，未得回应的要求渐渐变成更深的不满。"
 nesnd_small_states.12.f:0 "“政府许诺的法律改革，期限已过，至今没有实行。我们请求政府说明何时兑现。”\n——民众的请愿书"
 nesnd_small_states.10.t:0 "地方组织的要求"
 nesnd_small_states.10.land:0 "地方农户与雇工的困顿，正在给土地改革运动带来支持。土地的占有与劳动的支配，决定着他们辛苦一年能留下多少，也决定着他们能否离开旧有的依附。\n\n要求改变的人已经组织起来。政府若回应这些诉求，便会触动原有权利的持有者。若只让他们继续忍耐，又凭什么要求他们相信现行的秩序？"
 nesnd_small_states.10.labor:0 "雇工的生活日渐困顿，劳动运动因而取得了地方支持。工人要求讨论工资、工时与工作中的保障，希望不再独自同雇主争执。对雇主而言，这些要求会改变经营的成本，也会改变他们支配劳动的余地。\n\n工人已经组织起来，要政府表明态度。"
 nesnd_small_states.10.representation:0 "地方的自由派与激进派运动正在争取更多支持。受身份或政治资格限制的人，希望在支配自己生活的事情上说得上话。原有权力的持有者，则未必愿意让这些新来者加入。\n\n这些人已经组织起来，不愿再让争论停留在纸面上。"
 nesnd_small_states.10.f:0 "“我们请求政府改革现行制度，使劳动的人能够保有自己辛苦所得。”\n——运动向政府递交的请愿书"
 nesnd_small_states.10.organise:0 "让他们组织起来，公开说出要求。"
 nesnd_small_states.10.organise_tt:0 "相关运动的支持权重#p +15%#!，[concept_authority]#n −25#!，持续#v 12个月#!。受影响人群的#v 1%#!转为[Concept('concept_radical','$concept_radicals|q$')]。运动中若有本国支持者，其人气#p +10#!，持续#v 12个月#!。"
 nesnd_small_states.10.promise_land:0 "我们将改变土地制度。"
 nesnd_small_states.10.promise_land_tt:0 "在24个月内通过立法改变土地制度，实行自耕农、土地商品化或集体农业。期间相关[concept_interest_group]认可提高2。按期立法可争取[Concept('concept_loyalist','$concept_loyalists|q$')]。到期仍未兑现且诉求未解，会增加[Concept('concept_radical','$concept_radicals|q$')]。"
 nesnd_small_states.10.promise_debt:0 "承诺废除债役。"
 nesnd_small_states.10.promise_debt_tt:0 "在24个月内通过立法改变奴隶制，实行[GetLawType('law_slavery_banned').GetName]。期间相关[concept_interest_group]认可提高2。按期立法可争取[Concept('concept_loyalist','$concept_loyalists|q$')]。到期仍未兑现且诉求未解，会增加[Concept('concept_radical','$concept_radicals|q$')]。"
 nesnd_small_states.10.promise_labor:0 "劳动者应当得到法律保障。"
 nesnd_small_states.10.promise_labor_tt:0 "在24个月内通过立法改变劳动权利，实行[GetLawType('law_regulatory_bodies').GetName]或[GetLawType('law_worker_protections').GetName]。期间相关[concept_interest_group]认可提高2。按期立法可争取[Concept('concept_loyalist','$concept_loyalists|q$')]。到期仍未兑现且诉求未解，会增加[Concept('concept_radical','$concept_radicals|q$')]。"
 nesnd_small_states.10.promise_caste:0 "我们将解除种姓的限制。"
 nesnd_small_states.10.promise_caste_tt:0 "在24个月内通过立法改变种姓制度，实行[GetLawType('law_hindu_caste_not_enforced').GetName]或[GetLawType('law_affirmative_action').GetName]。期间相关[concept_interest_group]认可提高2。按期立法可争取[Concept('concept_loyalist','$concept_loyalists|q$')]。到期仍未兑现且诉求未解，会增加[Concept('concept_radical','$concept_radicals|q$')]。"
 nesnd_small_states.10.promise_representation:0 "承诺让更多人参与国事。"
 nesnd_small_states.10.promise_representation_tt:0 "在24个月内通过立法改变权力分配，实行财产选举、资格选举或普选。期间相关[concept_interest_group]认可提高2。按期立法可争取[Concept('concept_loyalist','$concept_loyalists|q$')]。到期仍未兑现且诉求未解，会增加[Concept('concept_radical','$concept_radicals|q$')]。"
 nesnd_small_states.10.suppress:0 "让警察去制止这些组织。"
 nesnd_small_states.10.suppress_tt:0 "相关运动的支持权重#n −15%#!，[concept_authority]#n −50#!，持续#v 12个月#!。受影响人群的#v 2%#!转为[Concept('concept_radical','$concept_radicals|q$')]。"
 nesnd_small_states.20.t:0 "地方政府的提议"
 nesnd_small_states.20.autonomy:0 "[SCOPE.sCountry('canon_sender').GetName]的政府以地方经济与行政的进展为据，要求自己处理更多的内政。他们认为，自己已经有能力担起这些责任，宗主的限制也应相应放宽。\n\n我国的一些大臣担心，今天放宽的限制，日后会被对方当作提出更多要求的先例。"
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName]请求通过谈判结束宗属关系，由他们自己的政府掌管内政与外交。他们希望双方在承认独立以后仍能和平相处。\n\n同意便意味着放弃宗主权，也放下为维持它而可能引起的争端。当地要的已经不是自己处理几件公事，而是由谁来决定这个国家的将来。"
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName]提出另立市场的请求，希望自己掌管国内的生产与贸易。当地商人与生产者从此要自己找原料、找销路，双方原有的供需关系也会随之改变。"
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName]请求同我国缔结防御条约，希望在遭到进攻时有一个可以依靠的盟友。\n\n军方要先估量我国同对方的关系，以及对方周围有哪些强邻。"
 nesnd_small_accept_tt:0 "同意对方的提议。"
 nesnd_small_refuse_tt:0 "拒绝提议。拒绝提高自治权的请求会增加对方的[concept_liberty_desire]，并损害双边关系。"
