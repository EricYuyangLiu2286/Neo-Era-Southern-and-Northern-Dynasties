 nesnd_small_states.continue:0 "我们还有许多事要做。"
 nesnd_small_states.2.t:0 "民生经济渐有根基"
 nesnd_small_states.2.d:0 "本国已有的产业开始给农户与雇工提供较为稳定的出路。货物能够进入市场，经营者付得起工钱，越来越多家庭可以凭自己的劳动维持生活。\n\n这些人的安定，也给政府带来了可以依靠的税源。国库中的收入，原来正是无数家庭生活的一部分。要使地方安堵、国内安宁，就须让创造这些财富的人能够继续经营。"
 nesnd_small_states.3.t:0 "地方事务有人承担"
 nesnd_small_states.3.d:0 "本国的行政与教育已有了能够维持的根基。公共事务有人办理，学识有机会传播，地方产业也有望从中取得能够承担新职业的人。\n\n民众学得越多，越能够参与国家的生活，也越能说清自己对政府有什么要求。这些事业使治理有了更多人手，同时也要求治理者认真回应民生。"
 nesnd_small_states.4.t:0 "市场关系震荡"
 nesnd_small_states.4.d:0 "本国的市场关系已经改变，商会与企业凭原有市场取得的临时经营安排也随之结束。此前依靠的原料、买主和运输往来，需要在新的关系中重新经营。\n\n政府可以改变自己的方向，生产者却还要为货物寻找销路。他们的生意能否接续，将影响地方接下来的收入与就业。"
 nesnd_small_states.5.t:0 "秩序仍待建立"
 nesnd_small_states.5.d:0 "多年过去，政府仍未能使法律、市场与地方经营共同支撑原定的自主事业。已有的产业和学校可以继续发挥作用，维持国事所需的条件却还不齐备。\n\n这项事业只得暂缓。等本国重新具备所需的条件，还可以继续经营，但过去积累的财富与人才，需要在此后的生活中得到维持。"
 nesnd_small_states.6.t:0 "能够维持的秩序"
 nesnd_small_states.6.d:0 "地方产业已能支撑教育与行政，本国也具备了维持自主所需的市场联系和防御力量。政府有了可用的人才与财源，在同外部势力交涉时，也多了一些可以依靠的本钱。\n\n民众为这些事业付出了税款与劳动。他们希望得到的，终究还是能够安定谋生的国家。"
 nesnd_small_states.11.t:0 "改革承诺兑现"
 nesnd_small_states.11.d:0 "政府已经实行了向地方许诺的法律改革。曾为此组织起来的人们，有了相信自己能够影响国政的理由。过去他们只能忍受的事情，如今终于可以援引国家的法律来反对。\n\n原有利益的持有者当然不会轻易释怀。政治上的争执将随新法进入日常生活，而政府也须让自己的法令得到执行。"
 nesnd_small_states.12.t:0 "落空的承诺"
 nesnd_small_states.12.d:0 "许诺的期限已经过去，民众等待的法律改革仍未到来。首都的老爷们曾要求地方耐心等候，如今原有的束缚还在，他们却拿不出足以兑现承诺的改变。\n\n那些相信过政府的人开始失望。生活中的困难不会因为期限过去而减轻，未被回答的要求，也渐渐变成了更深的不满……"
 nesnd_small_states.10.t:0 "地方组织的要求"
 nesnd_small_states.10.land:0 "地方农户与雇工的困顿，正在给土地改革运动带来支持。土地的占有与劳动的支配，决定着他们辛苦一年能留下多少，也决定着他们能否离开旧有的依附。\n\n要求改变的人已经组织起来。政府若回应这些诉求，便会触动原有权利的持有者。若只让他们继续忍耐，又凭什么要求他们相信现行的秩序？"
 nesnd_small_states.10.labor:0 "雇工的生活日渐困顿，劳动运动因而取得了地方支持。工人要求讨论工资、工时与工作中的保障，希望不再独自同雇主争执。对雇主而言，这些要求会改变经营的成本，也会改变他们支配劳动的余地。\n\n政府须决定怎样对待这些组织。容许工人发声、承诺立法，或派警察压制，都将影响劳资双方今后凭什么争取自己的利益。"
 nesnd_small_states.10.representation:0 "地方的自由派与激进派运动正在争取更多支持。受身份或政治资格限制的人，希望对支配自身生活的事务取得发言权。原有权力的持有者，则未必愿意让这些新来者加入。\n\n要求扩大参与的人已经组织起来，政府不能只把争论留在纸上。是否容许他们活动，是否愿意改变法律，将决定这些人怎样看待国家。"
 nesnd_small_states.10.organise:0 "让他们组织起来，公开说出要求。"
 nesnd_small_states.10.organise_tt:0 "相关运动的支持权重#p +15%#!，权威#n −25#!，持续#v 12个月#!。受影响人群的#v 1%#!转为激进派。运动中若有本国支持者，其人气#p +10#!，持续#v 12个月#!。"
 nesnd_small_states.10.promise_land:0 "我们将改变土地制度。"
 nesnd_small_states.10.promise_land_tt:0 "在24个月内通过立法改变土地制度，实行自耕农、土地商品化或集体农业。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_debt:0 "承诺废除债役。"
 nesnd_small_states.10.promise_debt_tt:0 "在24个月内通过立法改变奴隶制，实行禁止奴隶制。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_labor:0 "劳动者应当得到法律保障。"
 nesnd_small_states.10.promise_labor_tt:0 "在24个月内通过立法改变劳动权利，实行监管机构或工人保护。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_caste:0 "我们将解除种姓的限制。"
 nesnd_small_states.10.promise_caste_tt:0 "在24个月内通过立法改变种姓制度，实行不执行印度种姓或平权措施。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_representation:0 "承诺让更多人参与国事。"
 nesnd_small_states.10.promise_representation_tt:0 "在24个月内通过立法改变权力分配，实行财产选举、资格选举或普选。期间相关利益集团认可提高2。按期立法可争取效忠。到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.suppress:0 "让警察去制止这些组织。"
 nesnd_small_states.10.suppress_tt:0 "相关运动的支持权重#n −15%#!，权威#n −50#!，持续#v 12个月#!。受影响人群的#v 2%#!转为激进派。"
 nesnd_small_states.20.t:0 "地方政府的提议"
 nesnd_small_states.20.autonomy:0 "[SCOPE.sCountry('canon_sender').GetName]的政府以地方经济与行政的进展为据，要求自行处理更多事务。他们认为，本国已经有能力承担这些责任，宗主的限制也应相应放宽。\n\n同意提议，将使当地政府取得更大的自治权。我们必须判断，减少干涉能否维持这段关系，以及我们还愿意为维持现有权力付出多少。"
 nesnd_small_states.20.independence:0 "[SCOPE.sCountry('canon_sender').GetName]请求通过谈判结束宗属关系，由本国政府承担内外事务。他们希望双方在承认独立以后仍能和平相处。\n\n同意便意味着放弃宗主权，也放下为维持它而可能引起的争端。当地要求的已经超出了自行办理几件事务，而是由谁决定这个国家的将来。"
 nesnd_small_states.20.market:0 "[SCOPE.sCountry('canon_sender').GetName]提出另立市场的请求，希望自行经营本国的生产与贸易。当地商人与生产者将因此承担原料和销路的安排，双方原有的供需关系也会随之改变。\n\n我们需要决定，是否同意让他们取得这种自主。"
 nesnd_small_states.20.defence:0 "[SCOPE.sCountry('canon_sender').GetName]请求同我国缔结防御条约。对方希望取得一个足以依靠的盟友，我们也将因此多一个共同抵御外敌的伙伴。\n\n一旦签约，对方遭受的进攻便可能使我国参战。这份友好的提议，也需要军队和国库准备承担。"
 nesnd_small_accept_tt:0 "同意对方提出的安排。"
 nesnd_small_refuse_tt:0 "拒绝提议。拒绝提高自治权的请求会增加对方的独立倾向，并损害双边关系。"
 nesnd_small_states.21.t:0 "邻邦的选择"
 nesnd_small_states.21.d:0 "政府准备向[SCOPE.sCountry('small_receiver').GetName]提出共同防御的请求。两国关系友好，彼此的国土又十分接近，军队若能相互支援，便可使外来进攻者有所顾忌。\n\n使者已经拟好提议，等待我们的决定。"
 nesnd_small_states.21.a:0 "向他们正式提出协定。"
 nesnd_small_states.21.b:0 "暂缓此事。"
