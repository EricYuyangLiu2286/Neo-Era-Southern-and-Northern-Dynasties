 nesnd_small_native_two_share:0 "第二本土地理组人口占比"
 nesnd_small_states.2.far_south:0 "澳洲与新西兰之间的海面上，来往的货船多了起来。港口雇得起码头工人，内地的出产也找到了买主，远南不再只靠一处产地过活。\n\n农户和雇工的日子有了着落，政府的税收也跟着多了。往后学校和地方上的开支，就指望这条海路上的货物，和生产它们的人。"
 nesnd_small_states.2.burma:0 "上游的$STATE_MANDALAY$和下游的$STATE_PEGU$，都有了站得住的产业。交通把两地的出产送进了市场，农户、雇工和商人都有了进项。\n\n税款有了来处，办官署、开学堂不再只是空话。只是这笔钱怎么分，上游和下游各有各的算盘。"
 nesnd_small_states.2.siam:0 "曼谷和外府的买卖做稳了。都城人多钱多，要外府的出产；外府的作坊和田庄有了销路，才付得起工钱、交得起税。\n\n国库进了钱，伸手要钱的人也跟着来了：军队要饷，外府要学堂和公事的经费。替国家挣下这份财源的人，也等着国家替他们的日子出点力。"
 nesnd_small_states.6.far_south:0 "澳洲与新西兰的生产和海运，已经养得起两地的公事。官署里有人办事，学校也办起来了，远南自己挣得出钱、带得出人。\n\n同外国打交道，政府的腰杆也硬了些。两地百姓挣下的家业，就是远南要求自主的底气。"
 nesnd_small_states.6.burma:0 "上游和下游$STATE_PEGU$的生产、交通和公事都站稳了脚跟。国库有了进项，地方上也有人办政务、教书，上下游之间来往的不只是货物了。\n\n缅甸可以凭这份家底安排自己的国事。外国再提要求，王庭手里有钱，也有人。"
 nesnd_small_states.6.siam:0 "曼谷和外府的生产已经养得起公事，行政、教育和防务都有了底子。国库的进项，正一点点变成暹罗自立的本钱。\n\n钱多了，争的也多了：外府要学堂和工程，军队要按时发饷，都城自有开销。如今争的不光是钱从哪来，还有拿这些钱把暹罗办成什么样子。"
 nesnd_small_livelihood_journal:0 "国计在民生"
 nesnd_small_livelihood_journal_reason:0 "小国要自主，凭的是寻常百姓的饭碗。农户交得起税，雇工找得到活，商人把货运到有买主的地方，政府才养得起官吏、学堂和军队。生产的人若整日被地租、债务和失业压着，再大的国事也只能从他们身上刮。\n\n外国资本带来钱和技术，宗主也肯分担一些。可要在这些人面前说得上话，本国的产业得自己转得起来，百姓得学得会新本事。"
 nesnd_small_subject_status:0 "[ROOT.GetCountry.TryGetOverlordTooltipEntry]\n失业率不高于10%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]。市场接入达80%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]。"
 nesnd_small_independent_status:0 "本国已独立。失业率不高于10%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]。市场接入达80%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]。"
 nesnd_small_targets_lost:0 "原定地区的人口或支点已不足以维持建设。可以等待当地恢复，也可以在现有国土上重新选择两区。"
 nesnd_small_economy_journal:0 "活下去"
 nesnd_small_economy_journal_reason:0 "国库的钱出自百姓的生产，可生产的人先得养活自己。农户要把收成卖出去，工匠和雇工要有活干，货物要过得了路、上得了船，才到得了买主手里。哪一环卡久了，穷困就会一路传下去。\n\n先从现有的产业做起。作坊雇得起人、挣得到钱，百姓手里才攒得下余钱，国家也才谈得上往后。"
 nesnd_small_economy_months_tt:0 "已累计12个达标月"
 nesnd_small_governance_journal:0 "地方的根基"
 nesnd_small_governance_journal_reason:0 "产业有了进项，地方上就缺能办事的人。收税、管公事、教孩子，不能老靠几个熟人帮衬。教员和办事员要有按时发的薪水，读书的人也要看得见学成后的出路。\n\n百姓交上来的税，总得有一部分变成他们用得上的学校和公署。"
 nesnd_small_governance_months_tt:0 "已累计12个达标月"
 nesnd_small_regional_economy_journal:0 "地区生产与市场"
 nesnd_small_regional_economy_journal_reason:0 "人多钱多的地方，要别处的出产；别处的农牧、矿山、渔场、林场和作坊，也要更大的销路。产地和市场隔着，地里的东西再多，也变不成居民口袋里的钱。\n\n两地的生产都得办起来，中间的路也得打通。出产不同的，可以互通有无；行当相近的，可以分工合作。生意做长了，两地谁也离不开谁。"
 nesnd_small_regional_economy_months_tt:0 "已累计12个达标月"
 nesnd_small_regional_governance_journal:0 "地区治理"
 nesnd_small_regional_governance_journal_reason:0 "两地的货物已经通了，办事的人却不能都挤在一处。税从两地收，官署和学校也该在两地都扎下根。不然，产出越多，地方上的事就越要去远处请示。\n\n办事的人要有，接班的人也要学校去教。本地人担得起新差事，国家才不必事事都往几座大城里找人。"
 nesnd_small_regional_governance_months_tt:0 "已累计12个达标月"
 nesnd_small_order_journal:0 "自主后的秩序"
 nesnd_small_order_journal_reason:0 "独立了，或者高度自主了，许多事可以自己拿主意，市场和防务的担子也落到了自己肩上。百姓盼着不再受人摆布，更盼着日子真能好起来。\n\n作坊要原料和销路，地方要学校和办事的人，军队要有人养。家底撑得住这些，自主才不是一句空话。"
 nesnd_small_order_months_tt:0 "已累计24个达标月"
 nesnd_small_working_status:0 "本月各项条件满足，达标月数增加。"
 nesnd_small_paused_status:0 "本月条件尚未齐备，达标月数暂不增加。"
 nesnd_small_dispute_journal:0 "国内争议"
 nesnd_small_dispute_journal_reason:0 "日子过不下去，地方上的人开始抱团找出路。有人要改土地和雇工的规矩，有人要在国事上说得上话。从前各家关起门来受的苦，如今成了运动的诉求。\n\n准他们结社，答应立法，还是叫警察来——不管怎么办，东家地主和要求变革的人，都会看清政府站在哪边。"
