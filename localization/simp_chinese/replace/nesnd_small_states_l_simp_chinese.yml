 nesnd_small_public:0 "培养地方人才"
 nesnd_small_public_desc:0 "地方行政与产业都需要识字、有本领的人。投入一年的公共经费，帮助居民取得从事新职业的机会。"
 nesnd_small_public_tt:0 "按开始时的报价承担12个月的每周开支，暂时提高资格增长与税收能力。投入期间不能撤销或再次开办。"
 nesnd_small_specialise_button:0 "依托现有市场"
 nesnd_small_specialise_button_desc:0 "商人和行会希望凭现有市场扩大经营。支持他们利用已有商路，让地方生产找到更多买主。"
 nesnd_small_specialise_button_tt:0 "12个月内资格增长提高，[concept_authority]减少25。市场主人改变或取得自有市场后，这项效果结束。"
 nesnd_small_own_market_button:0 "筹办自有市场"
 nesnd_small_own_market_button_desc:0 "筹办本国市场，使原料、生产与销路能够由本国自行经营。"
 nesnd_small_own_market_button_tt:0 "筹备期为12个月，不立即改变市场归属。已经拥有本国市场时，可开办公共投入。筹备期间，达标产业必须没有投入品短缺。"
 nesnd_small_retarget_button:0 "重划建设范围"
 nesnd_small_retarget_button_desc:0 "将人口最多的一州单列，其余有人居住的[concept_state]合为另一组，重订建设目标。"
 nesnd_small_retarget_button_tt:0 "以当前人口最多的本国持有州为一区，其余本国持有州为另一区，重新选定两地支点。当前地区达标月数归零，24个月内不能再次重订。已领取的奖励不能再次领取。"
 nesnd_small_restore_geography_button:0 "重建本土地理联系"
 nesnd_small_restore_geography_button_desc:0 "把本土两地重新连成一体，让收复的地区重新接上国内的生产和官署。"
 nesnd_small_restore_geography_button_tt:0 "原定本土两区重新满足人口与支点条件后，恢复原定地区目标并重新累计达标月份。仍必须遵守24个月的重订间隔。"
 nesnd_small_order_button:0 "巩固自主后的秩序"
 nesnd_small_order_button_desc:0 "用现有的自主权治理我们的法律、市场、官署与防务。"
 nesnd_small_order_button_tt:0 "依当前独立或高度自主的地位开展建设，在120个月内累计24个达标月。独立与属国地位改变，或不再享有高度自主时，必须重新累计。完成奖励只能领取一次。"
 nesnd_small_request_autonomy:0 "要求扩大自治"
 nesnd_small_request_autonomy_desc:0 "以地方已经具备的经济与行政能力为据，要求宗主让我们自己处理更多的内政。"
 nesnd_small_request_autonomy_tt:0 "向直接宗主请求提高自治权。批准后提高自治权，减少自由渴望，并与宗主订立停战。"
 nesnd_small_request_independence:0 "商谈和平独立"
 nesnd_small_request_independence_desc:0 "向宗主提出和平独立，由我们自己掌管内政与外交，争取以谈判结束宗属关系。"
 nesnd_small_request_independence_tt:0 "请求直接宗主同意和平独立。遭到拒绝后，仍可通过外交争取自主。"
 nesnd_small_request_market:0 "请求自有市场"
