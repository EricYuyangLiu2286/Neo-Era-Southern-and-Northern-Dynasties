 nesnd_small_public_desc:0 "官署和作坊都缺识字、有手艺的人。拨一年的公款，教居民学会新行当。"
 nesnd_small_public_tt:0 "按开始时的报价承担12个月的每周开支，暂时提高资格增长与税收能力。投入期间不能撤销或再次开办。"
 nesnd_small_specialise_button:0 "依托现有市场"
 nesnd_small_specialise_button_desc:0 "商人和行会想借现成的市场做大生意。就顺着现有的商路，替本地出产多找些买主。"
 nesnd_small_specialise_button_tt:0 "12个月内资格增长提高，权威减少25。市场主人改变或取得自有市场后，这项安排结束。"
 nesnd_small_own_market_button:0 "筹办自有市场"
