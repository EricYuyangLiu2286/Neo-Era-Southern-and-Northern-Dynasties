 nesnd_small_states.2.far_south:0 "澳洲与新西兰之间的海面，正在成为两地生产者共同的商路。港口雇得起工人，地方产业也有了通向市场的出路，远南的经营因而不再只系于一处产地。\n\n农户与雇工的生计渐有根基，政府也能从这些经营中取得收入。接下来要维持的学校与地方事务，终究还要靠往来两地的货物和生产它们的人供养。"
 nesnd_small_states.2.burma:0 "$STATE_MANDALAY$所在的上游与$STATE_PEGU$下游，已有能够维持经营的产业。交通使两地的出产得以进入市场，农户、雇工与商人的生计，也逐渐有了可以依靠的来源。\n\n上下游的联系给政府带来了经营地方的余地。税款有了出处，行政与教育便不必只停在愿望上，但这些钱怎样分配，仍关系着两地能从发展中各得多少。"
 nesnd_small_states.2.siam:0 "曼谷与地方的生产已有了较为稳定的市场联系。人口与财源集中的地方，需要别处的出产。地方经营者也需要销路，才能付出工钱、承担税款。\n\n这样的联系给政府增加了收入，也带来了分配收入的要求。军队需要供养，地方还要办学与办理公共事务。生产者为国家创造了财源，也会期待国家能回应自己的生活。"
 nesnd_small_states.6.far_south:0 "澳洲与新西兰的生产和海运，已经能够支撑两地的地方事务。行政机关有人办事，教育也有了基础，远南开始拥有维持自身经营所需的收入与人才。\n\n这使政府在对外往来中有了更多底气。无论同谁商谈，两地民众创造的财富与逐渐形成的公共生活，都是本国争取自主的凭据。"
 nesnd_small_states.6.burma:0 "上游与$STATE_PEGU$下游的生产、交通和公共事务已有了较为稳定的根基。政府能够取得收入，地方也有人从事行政与教育，上下游的联系因而超出了货物的往来。\n\n缅甸可以凭这些积累安排自己的国事。对外关系仍须审慎经营，但面对外部要求时，本国已有更多可以依靠的财源与人才。"
 nesnd_small_states.6.siam:0 "曼谷与地方的生产已能支持公共事务，行政、教育和防务也有了相应的根基。政府所得的收入，正在转成维持自主所需的能力。\n\n这些成果当然不会消除分歧。地方希望多得学校与建设，军队需要稳定的供养，中央也有自己的开支。如今各方争论的不再只是钱从哪里来，还包括应当拿这些钱经营怎样的国家。"
 nesnd_small_livelihood_journal:0 "国计在民生"
 nesnd_small_livelihood_journal_reason:0 "小国的自主，往往要从普通人的生计里寻找根据。农户付得起税，雇工找得到活计，商人能够把货物运到有买主的地方，政府才有供养行政、教育与防务的财源。若生产者终日困于地租、债务和失业，再多宏大的国事也只能向他们索取。\n\n外国资本可以带来资金与技术，宗主的支持也能分担一些负担。本国若要在这些关系中取得更多说话的余地，就须使地方产业能够经营，使民众有机会学会新的本领。国计的根基，正在这些看似细小的生活之中。"
 nesnd_small_subject_status:0 "[ROOT.GetCountry.TryGetOverlordTooltipEntry]\n失业率不高于10%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]。市场接入达80%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]。"
 nesnd_small_independent_status:0 "本国已独立。失业率不高于10%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_job_coverage')|%1]。市场接入达80%的州内人口占比：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_small_transport')|%1]。"
 nesnd_small_targets_lost:0 "原定地区的人口或支点已不足以维持建设。可以等待当地恢复，也可以在现有国土上重新选择两区。"
 nesnd_small_economy_journal:0 "活下去"
 nesnd_small_economy_journal_reason:0 "政府的开支来自民众的生产，生产者却须先能养活自己。农户需要卖出收成，工匠与雇工需要活计，货物还要经过道路和港口，才能到达买主手中。任何一处长期受阻，都会把困顿传给别的人。\n\n本国已有的产业可以作为起点。使这些经营雇得起人、取得收入，民众才有余力积累，国家也才有余力谈论更远的将来。"
 nesnd_small_economy_months_tt:0 "已累计12个达标月"
 nesnd_small_governance_journal:0 "地方的根基"
 nesnd_small_governance_journal_reason:0 "产业有了收入，地方便需要更多能够办事的人。征税、管理公共事务和教育子弟，都不能长久依靠少数熟人的帮衬。教师与行政人员要靠稳定的经费生活，求学的人也要看见学成以后的去处。\n\n把这些事业办起来，政府才能从地方取得持续的支持。民众交出的税款，至少应当有一部分变成他们能够依靠的公共生活。"
 nesnd_small_governance_months_tt:0 "已累计12个达标月"
 nesnd_small_regional_economy_journal:0 "地区生产与市场"
 nesnd_small_regional_economy_journal_reason:0 "人口与财富集中的地方，需要其他地区的出产，地方的农牧、矿业、渔林与工场也需要更大的销路。若产地与市场彼此隔绝，土地上的资源再多，也难变成居民的收入。\n\n政府应当使两地各自的生产得到经营，并疏通货物往来的道路。共同市场能让不同的出产相互补充，也能让擅长相近产业的地方分工协作。这些分工若能维持经营，两地便有理由长久依赖彼此。"
 nesnd_small_regional_economy_months_tt:0 "已累计12个达标月"
 nesnd_small_regional_governance_journal:0 "地区治理"
 nesnd_small_regional_governance_journal_reason:0 "地区之间的货物已经往来，办理公共事务的人却不能只留在一处。税款从两地征来，行政与教育也应在两地取得根基。否则生产越多，地方要交给远处决定的事情也越多。\n\n政府需要有人处理这些事务，也需要学校培养接替他们的人。让地方居民能够承担新的职业，国家才不至于每办一件事，都向少数城市寻找人才。"
 nesnd_small_regional_governance_months_tt:0 "已累计12个达标月"
 nesnd_small_order_journal:0 "自主后的秩序"
 nesnd_small_order_journal_reason:0 "独立或高度自主，使本国可以自行决定更多事务。经营市场与防务的负担，也更多地落在本国政府身上。民众既期待摆脱干涉，又希望自主能够改善自己的生活。\n\n产业需要原料与销路，地方需要学校与行政人员，军队也要有人供养。把国内的财富与人才用于这些事业，才能使自主的政治地位维持下去。"
 nesnd_small_order_months_tt:0 "已累计24个达标月"
 nesnd_small_working_status:0 "本月各项条件满足，达标月数增加。"
 nesnd_small_paused_status:0 "本月条件尚未齐备，达标月数暂不增加。"
 nesnd_small_dispute_journal:0 "国内争议"
 nesnd_small_dispute_journal_reason:0 "生活的困顿使地方民众开始寻找共同的出路。有人要求改变土地与劳动的关系，有人希望取得更多参与国事的权利。原先各家承受的负担，正在成为运动提出的诉求。\n\n政府可以容许他们组织起来，也可以承诺通过法律回应，或依靠警察压下这些声音。无论怎样处置，原有利益的持有者与要求改变的人，都将据此判断政府站在哪一边。"
