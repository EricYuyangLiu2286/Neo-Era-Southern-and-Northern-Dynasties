 nesnd_small_defence_neighbour:0 "与邻邦商谈防御"
 nesnd_small_defence_neighbour_desc:0 "先选关系最好的合格邻邦，再决定是否正式提出防御条约。"
 nesnd_small_defence_neighbour_tt:0 "显示合格邻邦的名称供确认。关系相同时优先选择GDP较高者。"
 nesnd_small_request_defence_tt:0 "正式提出五年防御条约请求。"
 nesnd_small_states.continue:0 "事情还要继续。"
 nesnd_small_states.2.t:0 "生计渐有根基"
 nesnd_small_states.2.d:0 "农户与雇工已经在本国的生产中得到较为稳定的出路。政府可以从这样的经营中征收收入、培养人才，地方的发展也因此有了继续下去的条件。"
 nesnd_small_states.3.t:0 "地方事务有人承担"
 nesnd_small_states.3.d:0 "行政与教育已能承担更多地方事务。新的职业和知识逐渐进入社会，政府也有了扩大自主的现实基础。如何使用这些能力，仍取决于它对国内利益和对外关系的选择。"
 nesnd_small_states.4.t:0 "市场关系改变"
 nesnd_small_states.4.d:0 "原市场主人已不再主持本国的市场，商人与行会据此获得的临时经营安排随之结束。现有产业仍在本地，今后的供需和运输须按新的市场关系调整。"
 nesnd_small_states.5.t:0 "秩序仍待建立"
 nesnd_small_states.5.d:0 "多年过去，法律、市场和防御还未能共同支撑原定安排。政府可以在条件改善后重新经营这项事业，已有的产业、学校与法律并不因这一挫折消失。"
 nesnd_small_states.6.t:0 "能够维持的秩序"
 nesnd_small_states.6.d:0 "地方生产、学校与行政已有了稳定的支持，对外协定也为国家争取了余地。政府有更多收入与人才，可以应对市场变化、地方争执和外部压力。"
 nesnd_small_states.11.t:0 "改革承诺兑现"
 nesnd_small_states.11.d:0 "政府承诺的法律改革已经实施。获益的人群有理由相信自己的要求能够得到回应，原有利益的持有者则要面对新的分配。地方争议由此进入了另一个阶段。"
 nesnd_small_states.12.t:0 "落空的承诺"
 nesnd_small_states.12.d:0 "许诺的期限已经过去，原有法律仍约束着提出要求的人群。政府未能以实际改革回答他们，失望正在加深地方的不满。"
 nesnd_small_states.10.t:0 "地方组织的要求"
 nesnd_small_states.10.land:0 "地租与债役压着地方农户和雇工，主张土地改革的人正在组织他们。人们要求改变土地与劳动的支配关系，政府则必须决定如何回应已有运动。"
 nesnd_small_states.10.labor:0 "雇工的生活困顿使劳动运动得到支持。工资、工时和工作中的保障成为争议的中心，政府对组织与立法的态度，将影响劳资双方的力量。"
 nesnd_small_states.10.representation:0 "现有的自由派或激进派运动正在争取地方支持。种姓和政治权利的限制使一些居民难以参与公共事务，运动要求改变现状，政府也将面对权力重新分配的压力。"
 nesnd_small_states.10.organise:0 "允许地方组织。"
 nesnd_small_states.10.organise_tt:0 "相关运动的支持权重#p +15%#!，权威#n −25#!，持续#v 12个月#!；受影响人群的#v 1%#!转为激进派。运动中若有本国支持者，其人气#p +10#!，持续#v 12个月#!。"
 nesnd_small_states.10.promise_land:0 "承诺改变土地制度。"
 nesnd_small_states.10.promise_land_tt:0 "在24个月内通过立法改变土地制度，实行自耕农、土地商品化或集体农业。期间相关利益集团认可提高2；按期立法可争取效忠；到期仍未兑现且诉求未解，会增加激进派。"
 nesnd_small_states.10.promise_debt:0 "承诺结束债役。"
