 nesnd_sha_yan_suppression:0 "镇压徐氏叛乱"
 nesnd_sha_yan_suppression_desc:0 "出兵镇压徐氏在东北复立的朝廷。"
 nesnd_sha_yan_suppression_tooltip:0 "要求吞并徐氏政权。"
 nesnd_sha_yan_war:0 "复燕战争"
 nesnd_sha_annex_yan:0 "吞并大燕"
 nesnd_sha_annex_yan_desc:0 "收回徐氏政权占据的领土。起事前已经整编的[concept_state]，收回后恢复整编。"
 nesnd_sha_yan_holds_terms_tt:0 "登莱实际占有约书划给的东北各[concept_state]。"
 nesnd_sha_yan_survived_tt:0 "燕廷在镇压战争后存续，约书所定的土地已经移交。"
 nesnd_sha_yan_complete_desc:0 "燕廷保住了，登莱取得了约书所定的领土。"
 nesnd_sha_yan_defeat_tt:0 "徐氏起事政权灭亡，或战后未能履行划界条款。"
 nesnd_sha_yan_defeat_desc:0 "我们和起义军达成的协议无法被履行了。"
 nesnd_sha_yan_time_header:0 "起事期限"
 nesnd_sha_yan_time_effect_header:0 "期限届满后"
 nesnd_sha_yan_time_tt:0 "筹备已满 #v 12#! 年，东燕残党仍未起事。"
 nesnd_sha_yan_timeout_desc:0 "十二年筹备期已过，我们必须放弃这个计划。"
 nesnd_sha_yan_two_terms_tt:0 "甲约：登莱取得$STATE_OUTER_MANCHURIA$、$STATE_BOLI$及$STATE_AMUR$。"
 nesnd_sha_yan_port_terms_tt:0 "乙约：登莱取得$STATE_AMUR$及$STATE_OUTER_MANCHURIA$，大燕保留$STATE_BOLI$并增编 #v 8#! 个步兵营。"
 nesnd_sha_yan_war_terms_tt:0 "整军路线：登莱立即接受割地，成为燕廷的宗主国，并在镇压战争中出兵援燕。"
 nesnd_sha_yan_peace_terms_tt:0 "通商路线：登莱支付 GDP 的 #v 5%#!，至少 @money!#v 7,500#!，燕廷增编 #v 6#! 个步兵营。登莱不参战，燕廷存续后交地结盟。"
 nesnd_sha_yan_recruit:0 "招徕东北流民"
 nesnd_sha_yan_recruit_desc:0 "起事筹备结束后，可以派船招徕东北八州的流民。船商在$STATE_SHENGJING$、$STATE_SOUTHERN_MANCHURIA$、$STATE_SONGJIANG$、$STATE_NORTHERN_MANCHURIA$、$STATE_AMUR$、$STATE_OUTER_MANCHURIA$、$STATE_BOLI$之中寻找燕廷或汴梁方面治下的辽东人和女真人。沿用招徕流民的费用与三年船期。"
 nesnd_sha_yan_migrant_origin_tt:0 "燕廷或汴梁方面治下的东北八州，仍有可以迁来本国的辽东人或女真人。"
 nesnd_sha_korean_compact:0 "朝鲜密约"
 nesnd_sha_korean_compact_desc:0 "登莱请求朝鲜为燕人会党传递消息。起事后，朝鲜与登莱、燕廷两方的关系都会改善。"
 nesnd_sha_yan_korean_cooldown_tt:0 "朝鲜在过去 #v 36#! 个月内未曾拒绝此约。"
 nesnd_sha_yan_korea_accept_tt:0 "朝鲜存续期间，「燕旗」每月多 #v 0.25#! 点。举事后，朝鲜与登莱、燕廷的关系分别提高 #g 15#! 点。"
 nesnd_sha_yan.1.t:0 "燕旗再举"
 nesnd_sha_yan.1.d:0 "松江传来了徐景衡即位的消息。旧燕的军官终于可以把徐氏的名字写进军令，领过燕国田契的地主也肯开仓供粮。沿江的女真首领到得稍晚。他们带来各部愿意出战的人数，也带来[SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName]清丈以来历次争地的文书。待到众义士的兵马物资云集准备，大燕忠臣才能正式倡议起兵。\n\n同时，东北的变动如此之大，终于被无能的东北官员发现。汴梁朝野震动，正在调集大军镇压。但近年以来[SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName]多事，加上老兵退伍、新兵缺乏实战，[SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName]的诸经略军已不像当初那样令行禁止，行动迅速。据信，不仅牧家大部还在汇聚顺天的途中，许多来自河北、辽东的士兵都不愿意同“复国军”作战，甚至在行军途中爆发了许多次哗变。"
 nesnd_sha_yan.1.f:0 "“伐暴合兵，义同骨肉。弑杀独夫，功在千秋！君子一体，肝胆相照。国人革命，生死同担！”——1813年辽阳府共和党人袭击盖州镇府前的约定（被东燕官军击败，多战死，余党问斩）"
 nesnd_sha_yan.1.a:0 "收下燕廷的国书。"
 nesnd_sha_yan.2.t:0 "八州约书"
 nesnd_sha_yan.2.d:0 "最后的商谈开始了，东燕皇族后人的首领徐景衡这次终于肯从大兴安岭之外的寨堡南下。这次的会场设在黑龙江源一处林场中央的寨子里，距离最近的木场监官署只有二里路。起草约书的时候，松江府还在牧朝军中的旧部代表问复国起兵后对于帝位的安排。登莱代表在纸上写下徐景衡的名字，无人反对。签字画押转瞬间，这桩事便谈妥了。随后，登莱人又拿出一幅画着海参崴、外东北诸府界线的新地图，与会各方就陷入了良久的沉默。\n\n登莱人想把海参崴和通往内地的道路一并拿下。燕人，尤其是旧燕军簇拥着他们的新“主人”叽叽喳喳。他们愿意给共和国一个出海口，却希望多留下些地方招募兵员。女真诸部的渠帅代表则出奇地沉默。这些林海中的古老居民熟悉的河汊和冬营地横跨那些墨线。无论哪家取得这片土地对他们都没有什么区别，但他们会确保自己将有必要的武力和地位维护...一切。"
 nesnd_sha_yan.2.f:0 "“海参崴让与北人，我们吃什么？”——新燕五路湖镇总兵李合德"
 nesnd_sha_yan.2.a:0 "订甲约，将外东北州府与黑龙江北段诸寨划归登莱以谢兵。"
 nesnd_sha_yan.2.b:0 "订乙约，划给海参崴，此外双方战后再谈..."
 nesnd_sha_yan.3.t:0 "海参崴"
 nesnd_sha_yan.3.d:0 "燕廷在战后存续，《八州约书》开始兑现。海参崴及约定的土地自此归[ROOT.GetCountry.GetName]管辖。登莱的船从此在自己的港口停泊、征税，不必再向燕朝或牧家的关吏纳捐放行。\n\n议会随即着手经营这座港口：修筑炮台，招募守军，把远北的船厂和商号迁来。港内尚未撤走的燕军，限期交出营房和仓库。"
 nesnd_sha_yan.3.f:0 "“港里的燕军，三日之内交出炮台和仓库。逾期不交的，按敌军论处。”——登莱接收海参崴的军令"
 nesnd_sha_yan.3.a:0 "海参崴自此归共和国管辖。"
 nesnd_sha_yan.4.t:0 "松江来书"
 nesnd_sha_yan.4.d:0 "燕廷已被[SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName]攻灭，《八州约书》无从兑现。起事的军将和渠帅，有的战死，有的投降，有的逃进山林。汴梁已经查明登莱为会党出过钱、运过军械，两国关系降到了冰点。\n\n东北还有败兵和家眷想渡海来投。议会可以决定接纳多少。"
 nesnd_sha_yan.4.f:0 "“账上记的是军费，换回来的是一张废纸。”——国人议会的一名议员"
 nesnd_sha_yan.4.a:0 "准许接运东北流民的船只入港。"
 nesnd_sha_yan.5.t:0 "旧都司的名册"
 nesnd_sha_yan.5.d:0 "燕人会党弄到了一册旧都司的官兵名录。燕廷当年按册颁给官诰，各寨人马都记作天子的兵。会党照着册上的官阶，自上而下派人联络。\n\n十多年过去，册上的次序早已不作数。有的辽东军官还收着官诰，部下却已散到别的营寨。有的女真渠帅在册上排在末尾，如今山口两侧的寨子都听他调遣。登莱若按旧官阶拨饷，银子多半落不到真正带兵的人手里。"
 nesnd_sha_yan.5.f:0 "“燕廷给我爹的是一纸官诰，我手下的是三千张嘴。要我出兵，先把粮饷运到寨前。”——一位女真渠帅答燕人会党来使"
 nesnd_sha_yan.5.a:0 "请会党查明各寨如今听谁调遣。"
 nesnd_sha_yan.6.t:0 "清丈队过江"
 nesnd_sha_yan.6.d:0 "[SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName]的清丈官渡江以后，把女真诸部历来轮用的一片渔场划进了待分的田地。官署按户发给地契，领地的人带着文书来接收，才发觉一条河上的渔汛无法照契上的亩数分给各家。随行的兵马奉命驱走了岸上的女真人。等到来年鱼群溯江，这些人还会回来。\n\n燕人会党已经派人去拉拢沿江的渠帅。往日燕廷征兵，要请渠帅调集各寨人马，渔场也由他们分派。会党若肯承认这项旧权，渠帅们便有理由再替徐氏出一次兵。"
 nesnd_sha_yan.6.f:0 "“岸上的人，你们今日驱得走。明年鱼汛到了，江上哪条船先下网，你们打算派多少兵马来管？”——一位女真渠帅质问清丈官"
 nesnd_sha_yan.6.a:0 "把沿江诸部所争的渔权列入商谈。"
 nesnd_sha_yan.7.t:0 "朝鲜流亡者"
 nesnd_sha_yan.7.d:0 "朝鲜亡国以后，再没有一个朝鲜政府能在密约上落款。一些逃出来的朝鲜人找到了登莱的船商。他们熟悉边境，知道哪些营寨收留过朝鲜商旅，也有亲族仍在江边，可以代为转信。\n\n船商愿意捎上他们，条件是由他们替燕人会党传递书信。"
 nesnd_sha_yan.7.f:0 "“朝廷没了，路还在。我的人认得每一条山道，价钱照旧。”——一名朝鲜流亡者对登莱船商说"
 nesnd_sha_yan.7.a:0 "由船商出面，接通燕人会党的书信。"
 nesnd_sha_yan_exiles_progress_tt:0 "燕旗进度增加 #v 10#! 点。"
 nesnd_sha_yan.8.t:0 "十二年之期"
 nesnd_sha_yan.8.d:0 "十二年前，国人议会看准[SCOPE.sCountry('nesnd_sha_yan_northern_government').GetName]内外多事，辽东人和女真人中又多有痛恨牧家的人，便授权筹备复燕，指望借徐氏的名号取得东北出海口。十二年过去，燕人会党始终没有起事。\n\n议会撤回了筹备起事的授权。此后，船商可以向政府申请船费，招徕东北的辽东人和女真人渡海来投。"
 nesnd_sha_yan.8.f:0 "“十二年的经费，换来一册名单。名单上的人既然不肯起事，就让他们来勘察加伐木。”——一名登莱议员"
 nesnd_sha_yan.8.a:0 "结束起事筹备，准许船商招徕东北移民。"
 nesnd_sha_yan.4.d_land:0 "徐景衡保住了帝位，《八州约书》划给登莱的土地却仍有一部分不在登莱手中。燕廷既不肯、也无力交出这些地方，议会只能承认约书落空。"
 nesnd_sha_korean_compact_action_name:0 "朝鲜密约"
 nesnd_sha_korean_compact_action_propose_name:0 "商订朝鲜密约"
 nesnd_sha_korean_compact_proposal_notification_name:0 "登莱来书商订密约"
 nesnd_sha_korean_compact_proposal_notification_desc:0 "[INITIATOR_COUNTRY.GetName]请求我国为燕人会党转递书信。消息一旦传到汴梁，朝鲜便要为这些来往承担干系。"
 nesnd_sha_korean_compact_proposal_notification_effects_desc:0 "$nesnd_sha_korean_compact_desc$"
 nesnd_sha_korean_compact_proposal_accepted_name:0 "朝鲜密约议定"
