 nesnd_sha_yan_turmoil_row:0 "东北八州起事地区的平均动荡达到25%"
 nesnd_sha_yan_compact_row:0 "朝鲜密约生效"
 nesnd_sha_yan_ten_battalions:0 "登莱拥有至少十个营"
 nesnd_sha_yan_prep_status:0 "议会为复燕筹备划定了十二年期限。资助燕人会党可以推高燕旗。燕旗达到 #v 100#! 以后，还要等到[JournalEntry.GetCountry.MakeScope.Var('nesnd_sha_yan_north').GetCountry.GetName]卷入战争、爆发革命或地权革命失败，才能起事。"
 nesnd_sha_yan_ready_status:0 "燕旗已经备好。八州之中，$STATE_SONGJIANG$、$STATE_NORTHERN_MANCHURIA$、$STATE_AMUR$、$STATE_OUTER_MANCHURIA$和$STATE_BOLI$须仍各有汴梁方面管辖的土地。起事时，这五州连同汴梁方面仍管辖的$STATE_SHENGJING$、$STATE_SOUTHERN_MANCHURIA$一并归燕廷。徐氏尚未在别处立国，会党已经得到登莱资助。待[JournalEntry.GetCountry.MakeScope.Var('nesnd_sha_yan_north').GetCountry.GetName]陷入战乱或地权革命失败，议会方可敲定分地条款。"
 nesnd_sha_yan_existing_status:0 "徐氏已在别处复立燕廷，松江的会党不能再立一个朝廷。筹备期限照常计算。"
 nesnd_sha_yan_war_status:0 "登莱以宗主国的身份出兵援燕，约定的土地已先行划归登莱。燕廷能否存续，要看这场战争的胜负。"
 nesnd_sha_yan_observer_status:0 "登莱已拨付军费，燕廷据此增编六个步兵营。登莱不参战。燕廷在战后存续，即按约书交地结盟。"
 nesnd_sha_yan_root_active:0 "松江与黑龙江的燕国旧部正与登莱往来。议会对东北出海口的交涉见「复燕之路」。"
 nesnd_sha_yan_root_port:0 "东北燕军起义以我方胜利告终，我们也顺利取得了良港海参崴，是时候决定下一步的建设计划..."
 nesnd_sha_yan_root_no_port:0 "我们与东燕余党的图谋终究是一无所获，但共和派的起义本来就是败多胜少，我们的优势在于毅力...以及总有下一步计划。"
 nesnd_sha_yan_subsidy:0 "资助燕人会党"
