l_simp_chinese:
 YAN:0 "大燕"
 YAN_ADJ:0 "大燕"
 YAN_FLAVOR_TEXT:0 "1824年，燕朝宗庙社稷为牧军所灭。如今徐氏远支在松江复立朝廷，所能依靠的是林海里的旧燕军将、各寨女真渠帅，以及地权革命以后北上的失地者和逃兵。"
 nesnd_sha_yan_xu:0 "徐"
 nesnd_sha_yan_jingheng:0 "景衡"
 nesnd_sha_restore_yan:0 "复燕之路"
 nesnd_sha_restore_yan_reason:0 "1822年，北朝牧仲棠[Glossary('glossary_nesnd_southern_campaign','南征')]败绩，归国后加紧策划对其他方向的统一事业。次年，随着东燕烈帝徐鼎元病逝，牧皇遣大将张百里、花一官东出、北上，耗时六月，深入不毛，终于覆灭燕国宗庙社稷。这一战不仅扫荡了龟缩奉天府的东燕皇室，也对沿途服从燕朝的女真、汉族军阀进行了严厉的惩治。\n\n然而，自徐祁烨开府天津以来，历代徐氏之主频繁征伐草原、东北廓建大业，威加辽东雪海四百有余年。虽然执政粗犷疏漏，时时遭遇叛乱、匪乱，却也有地方军阀头人归心。北朝张百里虽然领兵清洗一次，但茫茫林海广袤无垠，牧军国内尚且不稳，清理一次也只能是去皮留骨，以稳定为要。加上残余的北燕部众或者渡海前往南明，或者逃亡大兴安岭。以及紧随其后的地权革命事务，许多不满失地破产的人员、逃兵悄悄北上。这些人各怀鬼胎，流动隐匿于山谷林地之间结寨自保。缺乏人手的东北官府就更难对此地进行有效管辖。\n\n虽然如此，要想在东北重光燕祚，共和国和燕人需要的却不仅仅是一腔热血。粮食、兵器、弹药、金银自不必说。联络计划、团结盟友，彻底联通东北内外反牧势力形成合力，乃至成功后如何分赃、失败后如何逃亡,也是起义的关键......"
