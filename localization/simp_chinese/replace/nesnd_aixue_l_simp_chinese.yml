 alaska.2.t: "购买皑雪"
 alaska.2.d: "[SCOPE.sCountry('alaska_seller').GetName]接受了我方的出价。条约将卖方及其属国在皑雪的领地一并划归我国。"
 alaska.3.t: "购买皑雪失败"
 alaska.3.d: "我国与[SCOPE.sCountry('alaska_seller').GetName]就皑雪购地一事未能达成协议。"
