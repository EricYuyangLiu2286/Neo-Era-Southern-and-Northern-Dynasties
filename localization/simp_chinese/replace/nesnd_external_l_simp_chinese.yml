 nesnd_external_offer_arms_tt:0 "使节将在#v 7日#!后提出由本国供应#v 10#!单位小武器的条约，交对方决定是否签署。"
 nesnd_external_request_money_tt:0 "使节将在#v 7日#!后向对方请求每周拨给本国@money!#v 500#!，由对方决定是否应允。"
