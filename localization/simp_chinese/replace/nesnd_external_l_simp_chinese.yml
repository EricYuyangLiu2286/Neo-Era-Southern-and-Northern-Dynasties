l_simp_chinese:
 nesnd_external_choose_wu:0 "与[SCOPE.sCountry('nesnd_label_usm').GetName]通使"
 nesnd_external_choose_sih:0 "联络[SCOPE.sCountry('nesnd_label_sih').GetName]"
 nesnd_external_choose_hus:0 "共和使节赴[SCOPE.sCountry('nesnd_label_hus').GetName]"
 nesnd_external_choose_fra:0 "向[SCOPE.sCountry('nesnd_label_fra').GetName]致书"
 nesnd_external_hus_title:0 "海东的来信"
 nesnd_external_hus_desc:0 "南朝易代的消息传到了东洲。曾与我们争夺独立的郑氏海上帝国，如今又因谁应当主持天下而分裂。反对郑氏的势力可能向共和国寻求援助，商人则在关注港口与航路的去向。\n\n我们可以借此扩大对外交往，援助别国却必须动用自己的国库与工厂。政府应当判断哪些关系有利于共和国，又能承担多少承诺。"
 nesnd_external_fra_title:0 "两海之间"
 nesnd_external_fra_desc:0 "南朝使者请求承认易代并延续旧约，印度方面则仍有南部海岸与殖民地的争执。法国商人、债权人与军官在两地都有利益。政府必须决定支持谁，又愿意为外交主张付出多少资金与军械。"
 nesnd_external_qe1_title:0 "巴蜀关山"
 nesnd_external_qe1_desc:0 "四川商队带来了南朝的消息。敦煌败绩以后，西秦更必须慎用兵力与财赋。东方若再起兵戈，进出巴蜀的道路就同时关系到商贸与边防。我们应当决定，是联络川中、支持反吴联盟，还是先把财力留在国内。"
 nesnd_external_sha_title:0 "风雪中的国书"
 nesnd_external_sha_desc:0 "南朝争位的消息传到了北地共和国。流亡者从往事中认出参与争斗的名字，也有人开始联络东洲的同道。共和国或可从这些关系中求得资金与军械，但政府必须先决定自己需要什么援助，又愿意与谁结交到什么程度。"
 nesnd_external_bur_title:0 "江口与王庭"
 nesnd_external_bur_desc:0 "南朝易代将改变王庭与这个强邻的关系。沿江贸易与既有条约所定的义务都不能置之不理。在向任何一方许诺资金或军械以前，朝廷必须先考虑我国的地位，以及谁能维护我们的利益。"
 nesnd_external_mug_title:0 "南方的海岸"
 nesnd_external_mug_desc:0 "南朝易代使印度海岸的旧争端再受关注。明人在迈索尔的属地和沿海的通商特权，一直是帝国的心病。朝臣可以向法国请求资金或军械。若南朝仍占据迈索尔土地，我们也可借此重新提出领土主张。"
 nesnd_external_gbr_title:0 "封锁之后"
 nesnd_external_gbr_desc:0 "法兰西与明人的旧同盟曾使英国航路备受挤压。如今南朝争位，商人希望借局势变化进入新的港口，政府也可重新选择交往的对象。若要用资金与军械争取影响，我们仍必须衡量这笔支出对我们有什么用处。"
 nesnd_external_rus_title:0 "东方驿报"
 nesnd_external_rus_desc:0 "俄国的东方疆界漫长，南朝之争同样关系到俄国的利益。一个可靠的贸易伙伴，或愿意接受援助的政府，都可能改善我们在东方的处境。朝廷可以等待胜负分明，也可以趁各方仍在寻求外援时，以资金和军械争取交往。"
 nesnd_external.1.f:0 "“请速报南朝易代的详情，以及各港口现在由谁管辖。”\n——外交部致驻外使节的训令"
 nesnd_external_policy:0 "南朝变局与外交"
 nesnd_external_policy_reason:0 "南朝易代让旧约、商路与海外属邦的归属都悬而未决。政府必须决定与谁结交，是否提供援助，又是否需要向外国求助。各项新提议还在商议，既有条约则仍约束着签署它们的国家。"
 nesnd_external_follow:0 "备好国书，继续查问。"
 nesnd_external_decline:0 "先管好我们自己的事。"
 nesnd_external_choose_desc:0 "使节先与对方商定收受国书的途径。"
 nesnd_external_choose_opposition:0 "联络反吴盟主"
 nesnd_external_choose_opposition_desc:0 "遣使拜会领兵反吴的盟主，探问军中所需。"
 nesnd_external_offer_money:0 "支给军费"
 nesnd_external_offer_money_desc:0 "拟从本国国库每周拨给接洽国@money!#v 500#!，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_offer_arms:0 "商议军械输送"
 nesnd_external_offer_arms_desc:0 "向接洽国提议输送#v 10#!单位小武器，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_status_choose:0 "先选择接洽国，再检查可行的条款。"
 nesnd_external_status_selected:0 "使节已与#bold [ROOT.Var('nesnd_external_target').GetCountry.GetName]#!取得联系，正在等候本国训令。"
 nesnd_external_status_pending:0 "使节正在等候回信。可撤回尚未签成的请求。"
 nesnd_external_status_committed:0 "条约已经签成。实际履行、冻结及退出条件可在外交条约界面查看。"
 nesnd_external_money_title:0 "一份拨款提议"
 nesnd_external_money_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者带来了拨款提案。其国库拟每周支付@money!#v 500#!，约束期为#v 1年#!。承诺将记入双方的外交条约和收支。"
 nesnd_external.2.f:0 "“本国国库愿按周拨款，以一年为期，此项承诺载入两国条约。”\n——来使呈递的拨款提案"
 nesnd_external_arms_title:0 "军械清单"
 nesnd_external_arms_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]送来一份军械清单，拟向我国转移#v 10#!小武器，约束期为#v 1年#!。使者附上了条约草案，由我们决定是否签署。"
 nesnd_external.3.f:0 "“总之，借来的武器，不是从你背上滑落，就是把你压垮，或者把你捆住。”\n——马基雅维利《君主论》第十三章"
 nesnd_external_accept:0 "准予签署。"
 nesnd_external_refuse:0 "谢绝这份提议。"
 nesnd_external_commitment_tt:0 "条约即日生效，约束期过后仍会继续输送，直至撤回或重议。"
 nesnd_external_request_money:0 "请求财政协助"
 nesnd_external_request_money_desc:0 "请接洽国每周拨给本国@money!#v 500#!，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_request_arms:0 "请求军械协助"
 nesnd_external_request_arms_desc:0 "请接洽国向本国输送#v 10#!单位小武器，约束期#v 1年#!。对方可以谢绝。"
 nesnd_external_request_money_title:0 "一封求助的国书"
 nesnd_external_request_money_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]的使者请求财政协助。他呈上每周@money!#v 500#!的拨款方案，希望与我国订立约束期#v 1年#!的条约。"
 nesnd_external.5.f:0 "“敝国财用不足，恳请贵国按周拨款相助，以一年为期，订约为凭。”\n——求助的国书"
 nesnd_external_request_arms_title:0 "远方的军械请求"
 nesnd_external_request_arms_event_desc:0 "[SCOPE.sCountry('nesnd_external_requester').GetName]遣使请求输送#v 10#!小武器，并提出约束期#v 1年#!的条约。货单已经送至外交部，是否答应这批输送，要由我们决定。"
 nesnd_external.6.f:0 "“敝国恳请贵国输送小武器一批，以一年为期，订立条约。”\n——随国书附送的货单说明"
 nesnd_external_accept_request:0 "同意援助，签署条约。"
 nesnd_external_refuse_request:0 "本国另有用度，暂不允准。"
 nesnd_external_reconsider:0 "另择接洽国"
 nesnd_external_reconsider_desc:0 "在援助尚未签成时，另选接洽对象。"
 nesnd_external_mysore:0 "重提迈索尔之议"
 nesnd_external_mysore_desc:0 "在[SCOPE.sCountry('nesnd_label_usm').GetName]仍占据迈索尔土地时提出领土主张。与[SCOPE.sCountry('nesnd_label_usm').GetName]关系降低#v 10#!。获得[concept_claim]，但不立即转移土地或发动战争。"
 nesnd_external_mysore_tt:0 "获得对迈索尔的[concept_claim]，与南朝的关系降低#v 10#!。"
 nesnd_external_cancel_request:0 "撤回使节请求"
 nesnd_external_cancel_request_desc:0 "尚未签成的请求作废，既有条约继续有效。"
 nesnd_external_dismiss:0 "暂罢此议"
 nesnd_external_dismiss_desc:0 "结束此次外交议程并撤回待答请求。已经生效的条约仍必须在外交界面分别处理。"
 nesnd_external_resume:0 "重开南朝外交议程"
 nesnd_external_resume_desc:0 "南朝危机尚未结束，可以恢复接洽。此次议程已经签成的援助不能重复议定。"
 nesnd_external_end_title:0 "使臣归国"
 nesnd_external_end_desc:0 "南朝争位已有定局，使臣也已完成此行的使命。已经签成的条约仍然有效，政府必须继续承担相应义务，经营这场变局留下的关系。"
 nesnd_external_end_option:0 "将文书分送各署。"
 nesnd_external_contact_offer_tt:0 "选定接洽国后，可向其提议拨款或输送军械。"
 nesnd_external_contact_request_tt:0 "选定接洽国后，可向其请求拨款或军械。"
 nesnd_external_agenda_live_tt:0 "南朝之争尚容本国遣使接洽。"
 nesnd_external_no_target_tt:0 "使节尚未选定接洽国。"
 nesnd_external_no_pending_tt:0 "使节手中没有待答的提案。"
 nesnd_external_no_commitment_tt:0 "本国尚未为南朝之争议定援助。"
 nesnd_external_wu_available_tt:0 "吴朝仍在，且两国之间并无战事。"
 nesnd_external_sih_available_tt:0 "川蜀政权仍在，且两国之间并无战事。"
 nesnd_external_hus_available_tt:0 "华夏东洲共和国仍在，且两国之间并无战事。"
 nesnd_external_fra_available_tt:0 "法国仍在，且两国之间并无战事。"
 nesnd_external_opposition_available_tt:0 "反吴联盟已有盟主，且本国未与盟主交战。"
 nesnd_external_target_valid_tt:0 "接洽国仍能以原来的身份与本国交涉，双方并未交战。"
 nesnd_external_no_cooldown_tt:0 "过去#v 6个月#!内，本国未曾为此递交提案。"
 nesnd_external_india_free_tt:0 "我国在印度的外交中没有待答请求，也没有尚在期限内的援助承诺。"
 nesnd_external_export_room_tt:0 "小武器的剩余出口额度至少为#v 10#!。"
