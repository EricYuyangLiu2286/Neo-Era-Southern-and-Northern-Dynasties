 nesnd_usm_western_provinces:0 "西部置省"
 nesnd_usm_western_provinces_reason:0 "吴军已入西部，反吴复明的旧部却没有随败军一同消失。成都、襄阳与桂北仍有人怀念旧主，地方士人也不愿轻易承认杭州的新朝。军队能够攻下城池，朝廷却还要让三地接受布政司与礼议院的秩序。\n\n朝廷须在#v 1850年以前#!将三地变为[concept_incorporated_state]。拖延下去，西府的怨愤还会向荆楚、西南、客家与粤地蔓延。"
 nesnd_usm_western_provinces_status:0 "反吴复明的旧部仍在地方活动。生活水平下降会进一步激化民怨。"
 nesnd_usm_ming_resistance:0 "反吴复明运动"
 nesnd_usm_western_before_1850:0 "尚未到#v 1850年#!。"
 nesnd_usm_western_deadline:0 "已到#v 1850年#!，三地尚未在期限内整合。"
 nesnd_usm_western_failure_tt:0 "本国的#v 荆楚、西南、客家与粤#!文化人口中，各有#n 25%#!变得更加激进。"
 nesnd_western_provinces.1.t:0 "西府余愤"
 nesnd_western_provinces.1.d:0 "朝廷给西部置省留下的期限已经过去，三地却未能如期接受新朝的统治。流亡旧臣把拖延视为吴朝无力服众的证据，各地失意的士人也开始附和。荆楚、西南、客家与粤地的怨言汇在一起，反吴复明已不只是败军将领的私愿。"
 nesnd_western_provinces.1.a:0 "这场争执还没有过去。"
