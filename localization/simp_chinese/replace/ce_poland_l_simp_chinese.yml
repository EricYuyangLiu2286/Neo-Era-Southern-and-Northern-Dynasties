 ce_poland_events.12.t: "波兰复国运动式微"
 ce_poland_events.12.d: "波兰的民族运动已经被各大帝国所抛弃。无论是东方局势的新变化、欧洲强国间权力平衡的调整、还是1829年妥协框架的最终瓦解，波兰这个曾经撼动欧洲政治格局的议题已经失去了其历史地位。那些为波兰独立而战的理想主义者、那些反对波兰自决的现实主义者，都发现他们为之奋战的一切已经过时。欧洲进入了一个新的时代，波兰问题只是这个时代转折中的一个漆黑脚注。列强们已经转向了新的战场，而波兰的命运也被历史的大浪淘洗到了边缘。"
 ce_poland_events.12.a: "一个时代结束了。历史无情地前进。"

 ce_poland_events.13.t: "列强声援"
 ce_poland_events.13.d: "最近，[SCOPE.sCountry('ce_strong_power').GetName]的外交官和驻外军事人员与海外波兰人代表进行了秘密接触。并对波兰民族运动集中进行了一波资助和情报支援。"
 ce_poland_events.13.f: "“拿着这个，还有这个。这些都是用来保卫你们个人安全的，你们可千万不要拿它来进行什么危险活动啊！尤其是对......人，引发国际事件了可不好。”神秘西装男用[SCOPE.sCountry('ce_strong_power').GetName]口音对某波兰激进派说。"
 ce_poland_events.13.a: "一个时代结束了。历史无情地前进。"
 ce_poland_events.13.b: "过去的故事。"
 ce_this_is_a_bug: "This is a bug"

 ce_poland_events.97.t: "欧洲的氤氲"
 ce_poland_events.97.d: "1828年，由于拿破仑大帝病重不能理事，长子弗朗索瓦（又称拿破仑二世）被元老院任命为帝国摄政，并于翌年随着父亲的去世登基称帝，是为法兰西皇帝弗朗索瓦一世。世人称为“拿破仑浪潮”的时代由此落幕了。失去了皇帝的帝国一度风雨飘摇。但意外颇具外交才能的罗马王在顾问们的辅佐下稳定了局势。欧洲大陆的紧张气氛最终在1829年秋天的一系列会议后得到改善。\n\n随着会议建立的是名为“波兰共识”的条约体系。其目的是确保极富争议的波兰问题得到最终解决（通过建立一个以克拉科夫而不是华沙为中心的波兰国家），团结欧洲强权以对抗东方的世界帝国。\n\n然而，随着开封和南京相继陷入困顿以及弗朗索瓦一世的英年早逝，欧洲强权们的压力骤然减少，彼此之间的分歧再次显露出来。围绕着东欧的波兰国，新的战争阴云缓缓升起。"
 ce_poland_events.97.f: "“如此以后，欧洲问题的结局将不取决于欧洲民族的意志，而将取决于南京和巴黎......”——梅特涅公使，1829年于莫斯科"
 ce_poland_events.97.a: "波兰崛起有利于东欧的均势。"
 ce_poland_events.97.b: "没有什么波兰问题。"
 ce_poland_events.97.c: "波兰永不灭亡。"
