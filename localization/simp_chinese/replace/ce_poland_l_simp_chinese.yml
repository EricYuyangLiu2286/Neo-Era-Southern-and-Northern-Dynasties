 ce_poland_events.1.t: "波兰对我们的领土声索"
 ce_poland_events.1.d: "所谓的会议波兰当局向我们递交了备忘录。表面上尊重1829年的波兰和议与我们对'临时自治领地'的管辖权，但字里行间透露着对现状的深深怨恨。他们声称某些波兰人聚居区的'真实主权'受到了侵害，暗示1829年的和解不过是欧洲强国们掩耳盗铃的把戏。这不仅是对领土的争议，更是对整个波兰妥协方案合法性的质疑。我们必须权衡与克拉科夫的关系，以及与欧洲其他列强的态度。"
 ce_poland_events.1.f: "该死的波兰！1829年的和议还不够吗？他们要独立政权，那就让俄国人和奥地利人去头痛吧。或者...我们也可以让他们看看真正的独立意味着什么。"
 ce_poland_events.1.b: "我们绝不妥协！蕞尔小国不会讹诈我们！"

 ce_poland_events.2.t: "最后通牒"
 ce_poland_events.2.d: "今天我们收到了从[SCOPE.sCountry('ce_from_country').GetCapital.GetName]发来的正式照会。他们无视1829年协议的固有框架，从历史和民族角度严正抗议我们对于“前波兰领土”的所谓“非法占领”，并通过公开渠道向我们的政府下达了名为“战争或土地”的最后通牒。外交部门的相关人员利用一些繁琐的行政条文和惯例拖住了对方代表。但正式且将充满火药味的“领土谈判”迟早会开始。更何况，随着这份通牒的出现，局势的升级已经不可避免了......"
 ce_poland_events.2.f: "'[SCOPE.sCountry('ce_from_country').GetAdjectiveNoFormatting]人都疯了，'外交大臣从[SCOPE.sCountry('ce_from_country').GetCapital.GetName]返回时说道。'他们以为东方的混乱给了他们机会。也许他们是对的。但代价将是什么？'"
 ce_poland_events.2.a: "宣布军队退出，举行全民公投。"
 ce_poland_events.2.b: "通知军队方面做好准备，欧洲的战争开始了。"
 ce_poland_betray_your_commitment: "背叛承诺"
 ce_peaceful_vote_for_polish: "仓促并入"
 ce_loss_of_international_status: "在领土问题上让步"

 ce_poland_events.3.t: "波兰复兴"
 ce_poland_events.3.d: "波兰成功了。在我们的支持下，这个被欧洲列强长期压制的民族终于打破了1829年和议的枷锁。克拉科夫不再是法国朝贡国的首都，而是一个真正独立波兰国的不朽象征。几个世纪的分裂与被压制已成过往。波兰人用枪炮和鲜血为自己赢得了这一刻——历史上第一次，他们不再是被列强安排和妥协的棋子，而是欧洲大陆上的独立力量。这个决定必然引发保守派列强的愤怒，但波兰的复兴已经无可挽回。"
 ce_poland_events.3.f: "波兰没有灭亡！几个世纪的压制和妥协无法摧毁一个民族的灵魂。华沙的钟声铿锵而起，克拉科夫的旗帜在自由的风中飘扬——这一刻，整个欧洲都听到了波兰人的呐喊。"
 ce_poland_events.3.a: "波兰自由了！一个新的独立国家诞生在欧洲。"

 ce_poland_events.4.t: "复国运动被打击"
 ce_poland_events.4.d: "我们的情报部门揭露了一场隐秘的颠覆活动。有些#bold [SCOPE.sCountry('ce_from_country').GetName] #!特工打着'维护秩序'的名义，一直在我们国内秘密资助激进派和分裂分子，企图在我国内部制造混乱以打压我们所支持的波兰复国运动。同时，我们在海外的一些波兰裔支持者也被逮捕或驱逐出了他们的活动区域。"
 ce_poland_events.4.a: "这是列强对自由的打击！"
 lost_progress_ce_poland_war: "[SCOPE.sCountry('ce_to_country').GetName]的复国运动和战争准备日志 #R 失去大量进度#!"

 ce_poland_events.5.t: "支持波兰的代价"
 ce_poland_events.5.d: "我们曾试图利用东方局势的混乱来对反对者施压，但我们终究棋差一招。那些对波兰独立持反对态度的列强联合起来，对我们的支持者采取了协调一致的军事和经济打击。"
 ce_poland_events.5.f: "“你最近看见那个波兰裔朋友了吗？”\n\n“他有天出去买酒，就再也没回来...”"
 ce_poland_events.5.a: "这场赌博失败了。我们低估了列强对秩序维持的决心。"

 ce_poland_events.6.t: "欧洲的军事竞赛"
 ce_poland_events.6.d: "波兰问题已经成为欧洲各大国竞相扩军的借口。我们的战争部团结一致地呼请增加军费。无论是建设炼钢厂来强化工业基础、建立武器厂来装备军队、还是建造炸药厂来提升火力投射——所有这些工业设施都被视为与列强争霸的必需品。每一项选择都代表着对未来战争形态的战略判断。而我们的决定，也将影响整个欧洲的战争准备趋势。"
 ce_poland_events.6.f: "'波兰开启了潘多拉魔盒，'一些中等国家的军事顾问在外国报刊上指出，'俄国在扩招步兵，奥地利在升级火炮，英国在建造战舰。如果我们不立即着手军事现代化，到时候我们将毫无还手之力。'"
 ce_poland_events.6.a: "建立炼钢厂——强化工业基础以供应未来的战争。"
 ce_poland_events.6.b: "建立武器厂——确保我们的军队装备精良。"
 ce_poland_events.6.c: "建立炸药厂——提升我们在炮战中的优势。"

 ce_poland_events.7.t: "[SCOPE.sCountry('ce_from_country').GetCapital.GetName]打破僵局"
 ce_poland_events.7.d: "[SCOPE.sCountry('ce_claim_state_target').GetCapital.GetName]长期以来就占据了波兰人所谓波兰领土的一部分。我们也一直以来试图颠覆其在波兰领土上的统治，以达到我们对东欧的重大目标。但是，当战争真要降临的时候，我们真的已经做好和[SCOPE.sCountry('ce_claim_state_target').GetCapital.GetName]长期对抗的准备了吗？"
 ce_poland_events.7.f: "'......此次会议要促成的是一个不以战争为破裂状态的纲领性条约体系，并非要颁布上帝的和平（Pax et treuga Dei）......'\n——法国摄政约瑟夫·夏尔·波拿巴，1829年于克拉科夫"
 ce_poland_events.7.a: "我们不会为[SCOPE.sCountry('ce_from_country').GetCapital.GetName]火中取栗。"
 ce_poland_events.7.b: "通知军队方面做好准备。欧洲的战争开始了。"

