 je_ce_block_polish_advance: "阻击波兰"
 je_ce_block_polish_advance_reason: "1829年的华沙 - 克拉科夫议定书并不符合所有欧洲强权的利益，只不过是欧洲帝国们对东方局势的一次应变。而且随着明国大洲的情况进一步变化，欧洲强权所感受到的东方压力逐渐减弱。而欧洲列强之间的脆弱同盟也随之演变。在这种情况下，我们一定要阻止狼子野心之辈继续纵容波兰这一问题民族在东欧搅扰和平！"
