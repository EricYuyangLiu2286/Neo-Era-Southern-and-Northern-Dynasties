 ce_poland_events.10.t: "波兰的胜利"
 ce_poland_events.10.d: "波兰的独立逆转了1829年妥协方案对中欧秩序的束缚。这个被列强掩耳盗铃般压制了一个世纪的民族，终于通过流血和抗争赢得了自决权。克拉科夫不再是供养殖民地，华沙成为了一个真正主权国家的首都。这一突破不仅改变了波兰本身的未来，更向整个欧洲宣示：民族自决的力量已经无法被冷战后的秩序所完全压制。一个新的欧洲正在形成，而波兰成为了这次变革的先驱。"
 ce_poland_events.10.a: "波兰回来了。一个旧时代落幕，新时代随之开启。"

 ce_poland_events.11.t: "波兰的失败"
 ce_poland_events.11.d: "波兰的独立梦在列强的联合绞杀中破灭了。1829年的妥协方案虽然备受争议，但时间证明了它的有效性——只要欧洲的强权联合起来维护秩序，任何民族主义的冲动都将被无情地压制。波兰人从克拉科夫的短暂独立梦中醒来，发现自己再次陷入了列强的阴影。这一次的失败不仅击碎了波兰复国运动的声势，也预示着在大国齐心合力维持现状的时代，民族独立的路已然绝望。波兰的命运再次被列强的合议所决定。"
 ce_poland_events.11.a: "梦想在列强的联合压力下破灭了。历史再次选择了秩序而非自由。"
