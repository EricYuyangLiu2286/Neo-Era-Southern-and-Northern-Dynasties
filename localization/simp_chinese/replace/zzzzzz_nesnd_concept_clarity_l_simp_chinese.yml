l_simp_chinese:
 nesnd_reform_failure_tt:0 "失序达到#v 90#!，连续#v 12#!个月发生严重民生危机，全国动乱超过#v 40%#!，合法性低于#v 25#!，且正在战争或仍受[concept_bankruptcy]惩罚。"
 nesnd_land_rules:0 "#bold 本月统计#!\n无业劳动力占比：#v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!\n劳动力家庭欠食份额：#v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!\n劳动力家庭[concept_sol]：#v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!\n人口加权[concept_market_access]：#v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!\n\n#bold 巩固条件#!\n自耕农、商业化农业或集体化农业制度；学校机构至少#v 2#!级，识字率至少#v 48%#!；无业劳动力占比至多#v 6%#!，欠食份额至多#v 8%#!，生活水平至少#v 11#!，市场接入至少#v 85%#!；行政非负、和平且未受[concept_bankruptcy]惩罚。社保至少#v 2#!级且生活水平达到#v 12#!时，失业上限为#v 12%#!。\n\n达标月份增加#p 2#!改革进度，减少#p 1#!失序。已落实地权制度、失业至多#v 10%#!、欠食至多#v 12%#!、生活水平至少#v 10.5#!、市场接入至少#v 80%#!、学校至少#v 1#!级且未受[concept_bankruptcy]惩罚时，可每月增加#p 0.5#!进度。完成需进度#v 100#!、连续#v 12#!个达标月及失序低于#v 50#!；四十八个月内完成、连续达标至少#v 24#!个月且失序低于#v 30#!，另获快速改革奖励。\n\n统计采本国拥有的改革地区，包含盛京、外东北与阿穆尔：失业按无业劳动力除以总劳动力；市场接入按州人口加权；生活水平与欠食按各人口群体劳动力加权，每月更新。自给农业从业者属于有业人口。全国与地方失业采用同一口径。\n\n#bold 地方民生底线#!\n人口至少#v 50万#!的州，若连续六个月无业劳动力占比超过#v 20%#!、欠食劳动力超过#v 25%#!或严重饥饿劳动力超过#v 10%#!，将中断巩固月份并增加失序。可用有资质的岗位、粮食与日用品供给、救济或产业转型改善当地状况；须实际降到上述严重困境线以内。"
 nesnd_ten_status_bankruptcy:0 "国家仍受[concept_bankruptcy]惩罚，巩固月份已中断。"
 nesnd_ten_conditions_bar_detail:0 "无业劳动力：#v [Country.MakeScope.Var('nesnd_ten_unemployment').GetValue|%1]#!\n欠食劳动力：#v [Country.MakeScope.Var('nesnd_ten_starving').GetValue|%1]#!\n其中在岗且欠食：#v [Country.MakeScope.Var('nesnd_ten_working_hungry').GetValue|%1]#!\n劳动力家庭[concept_sol]：#v [Country.MakeScope.Var('nesnd_ten_sol').GetValue|1]#!\n[concept_market_access]：#v [Country.MakeScope.Var('nesnd_ten_access').GetValue|%1]#!\n\n四项条件：无业至多#v 12%#!；欠食至多#v 25%#!且生活水平至少#v 6.5#!；接入至少#v 85%#!；和平且未受[concept_bankruptcy]惩罚。份额按丹那沙林本国州的劳动力计算，自给农属于有业人口，每月更新。"
 nesnd_supply_status_bankruptcy:0 "#n [concept_bankruptcy]惩罚尚未结束。#!连续合格周数归零，待该修正到期后继续检验。\n$nesnd_supply_rules_link$"
