l_simp_chinese:
 ce_decisions_developing: "对应日志未制作完成"
 ce_culture_reunification: "整合民族文化"
 ce_culture_event.1.t: "统一的中华民族"
 ce_culture_event.1.d: "在试图改革明廷政治的成化皇帝死后足有四个多世纪，自黎何足、赵明笛发起第一次国人革命后近百年，广袤的神州大地终于统一在[ROOT.GetCountry.GetName]的旗帜之下。当世之人造就了不世之功。但我们这个时代的领袖们却已经在展望未来。崭新的中国究竟会以怎样的面貌傲立于世界民族之林？"
 ce_culture_event.1.f: "秦王扫六合，虎视何雄哉！挥剑决浮云，诸侯尽西来。明断自天启，大略驾群才。收兵铸金人，函谷正东开。铭功会稽岭，骋望琅琊台。刑徒七十万，起土骊山隈。\n——《古风五十九首》李白"
 ce_culture_event.1.1: "万族共合，大国堪成！"
 
 ce_culture_event.2.t: "中华民族复兴"
 ce_culture_event.2.d: "分裂许久的大明之地最近发生了巨大的变动。南明北华的局面已经打破。天下再度归为一统。自近代“开蒙运动”以来进步的士人、国人所讲述的崭新的中华民族认同从理想照进现实。\n中华民族，这一世界上人口最广，历史最悠久的民族之一，又一次站在同一面旗帜下，急切地想要在世界上重新找到属于统一的中华国家的位置。"
 ce_culture_event.2.f: "人猿相揖别。只几个石头磨过，小儿时节。铜铁炉中翻火焰，为问何时猜得？不过几千寒热。人世难逢开口笑，上疆场彼此弯弓月。流遍了，郊原血......——东方国际无名氏"
 ce_culture_event.2.1: "天命攸归？"
 ce_culture_event.2.2: "希望他们想的不是中央帝国的位置。"
 
 ce_unification_chinese_culture: "混一华夏"
 ce_unification_chinese_culture_desc: "随着北明战国世的终结，人们已经厌恶了诸候藩镇军阀之间无休止的争权夺利。从最初的黎何足到最近的陈东阳、牧仲棠。人们知道唯有将中华民族按照近现代的思潮统一在一个民族概念之下，才能获得最终的和平，而不是君君臣臣父父子子的封建治世。正所谓——“六国灭，四海一。书同文，车同轨，尔来两千岁矣。”"
 
