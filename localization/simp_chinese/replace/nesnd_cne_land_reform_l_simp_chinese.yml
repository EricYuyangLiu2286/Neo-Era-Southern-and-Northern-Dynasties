 nesnd_cne_confidence_journal:0 "帝国人民的信心"
 nesnd_cne_confidence_journal_reason:0 "大革命的烽火已经远去，却还照着这一代人的前路。县署中的吏员、营垒里的中下军官与士兵，以及渴望摆脱旧日束缚的农民，仍把地权革命视为当年誓言的延续。\n\n牧仲棠称帝以后，六部掌理政务，元老院中的开国将领与勋旧大臣独掌立法之权。咨议局收集陈情、提出建议，能否施行仍须由掌权者裁定。南方与西北的流亡共和党人将牧仲棠斥作叛国者。在许多支持改革的人心中，牧皇及其同道仍代表着开蒙运动与进步的希望。帝国的政令得以推行，也有赖于这些官员、士兵和农民尚未冷却的热情。一次次清丈、迁业与整营，都在要求他们继续忍耐。"
 nesnd_cne_confidence_status:0 "各省仍相信朝廷能完成大革命未竟之业。"
 nesnd_cne_republic_restored_name:0 "大汉共和邦"
 nesnd_cne_republic_army:0 "共和救国军"
 nesnd_cne_republic_war:0 "大汉共和战争"
 nesnd_cne_republic_journal:0 "重建大汉共和邦"
 nesnd_cne_republic_journal_reason:0 "共和之名曾将北方的士人与军民召集在同一面旗帜下。后来皇座重立，旧日同道散作君臣，也散作仇敌。如今各地的共和派再次起兵，声言要结束牧氏的帝业，重建大革命尚未完成的共和国。\n\n这场战争不能以一纸边界收场。燕京与中原的皇权仍在，各地举兵的盟友还在观望战局。共和军的旗帜，还能召回多少当年的同道？"
 nesnd_cne_republic_status:0 "与中华帝国交战期间，共和军直接控制其至少#v 80%#!的州即可获胜。双方均以吞并对方为战争诉求。\n若战争结束时中华帝国仍然存在，共和事业便告失败。"
 nesnd_cne_confidence.1.t:0 "旧日的旗帜"
 nesnd_cne_confidence.1.d:0 "北方传来急报：地方共和派已经举兵，营中的军官与乡间的旧党人共同宣布，不再承认牧氏朝廷。他们以“大汉共和军”为号，指斥帝国背弃了大革命的誓言。昔日支持地权革命的人群，正在分裂。"
 nesnd_cne_confidence.1.a:0 "召集尚忠于朝廷的军队。"
 nesnd_cne_confidence.2.t:0 "再举共和之旗"
 nesnd_cne_confidence.2.d:0 "各地盟誓既成，共和军已经起兵。新政府宣布废除帝制，重建大汉共和邦。军中有人还记得当年与牧仲棠并肩作战的岁月，但这一次，他们的旗帜将向帝国的腹地推进。"
 nesnd_cne_confidence.2.a:0 "愿共和之志不再负于天下。"
 nesnd_cne_confidence.3.t:0 "大汉共和邦"
 nesnd_cne_confidence.3.d:0 "帝国旧政府已经倒下。共和军接收了其州郡与官署，以大汉共和邦之名建立新政府。对于湖南、湖北与四川尚未归本国或其附属统辖的地区，新政府重申了大革命以来统一国家的主张。"
 nesnd_cne_confidence.3.a:0 "重建共和国。"
 nesnd_cne_confidence.4.t:0 "共和军归降"
 nesnd_cne_confidence.4.d:0 "共和军已无力继续战争，各地盟约随之解散。帝国重新接收了这些州郡，地方官署与营伍又奉朝廷号令。战事虽然结束，举兵者留下的质问却仍在民间流传。"
 nesnd_cne_confidence.4.a:0 "接收州郡，重整秩序。"
 nesnd_cne_delta_land:0 "土地商品化"
 nesnd_cne_delta_urban:0 "国家城市化"
 nesnd_cne_delta_estates:0 "各省营产整顿"
 nesnd_cne_delta_consolidation:0 "民生安定"
 nesnd_cne_delta_distress:0 "民生危机"
 nesnd_cne_delta_admin:0 "行政力不足"
 nesnd_cne_delta_turmoil:0 "全国动乱超过25%"
 nesnd_cne_delta_war:0 "战争"
 nesnd_cne_delta_bankruptcy:0 "破产"
 nesnd_cne_delta_appeals:0 "受理地方申诉"
 nesnd_cne_conf_base_desc:0 "革命热情消退"
 nesnd_cne_conf_radicals_desc:0 "激进派超过15%"
 nesnd_cne_conf_intelligentsia_desc:0 "知识分子执政"
 nesnd_cne_conf_petty_bourgeoisie_desc:0 "小市民执政"
 nesnd_cne_conf_trade_unions_desc:0 "工会执政"
 nesnd_cne_conf_industrialists_desc:0 "实业家执政"
 nesnd_cne_confidence_bar_desc:0 "$nesnd_cne_confidence_journal$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 1000#!"
 nesnd_cne_confidence.5.t:0 "革命的余烬"
 nesnd_cne_confidence.5.republic:0 "君主制已经废除，牧皇主持地权革命的政治约定也随之终止。新政府接收了官署与案卷。如何处理田产、城镇与军营，将由新的权力格局决定。"
 nesnd_cne_confidence.5.war:0 "内战已经爆发，地方官署与营伍各奉其主。清丈与迁业的命令被军令取代，朝廷再也无法依照原定的章程推行地权革命。"
 nesnd_cne_confidence.5.coup:0 "政变改变了朝廷的权力归属。承办地权革命的官员被召回，地方营伍等待新令。这场以牧皇名义发动的运动，已经失去了继续推行的政治基础。"
 nesnd_cne_confidence.5.exhausted:0 "昔日大革命所激起的热情终于消退。官员不愿再担保下一轮变革，军官与士兵不再相信旧日的许诺，乡间也只盼望清丈与征调早些结束。朝廷仍有诏令，却已无人愿意将它变成新的生活。"
 nesnd_cne_confidence.5.a:0 "停止改制，收束诸项新政。"
