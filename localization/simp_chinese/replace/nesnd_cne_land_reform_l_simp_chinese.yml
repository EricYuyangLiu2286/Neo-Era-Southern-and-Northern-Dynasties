 nesnd_cne_funding_requirements:0 "地权革命尚未结束，国库足够，距上次拨款至少一年，且没有待答复的拨款案。"
 nesnd_land_survey_outcome_tt:0 "为失业率最高的州拟定实业拨款，呈请批准。"
 nesnd_land_military_outcome_tt:0 "为欠食人口所在、失业率最高的州拟定救济拨款，呈请批准。"
 nesnd_cne_funding.1.t:0 "[SCOPE.sState('nesnd_cne_funding_state').GetName]的实业拨款"
 nesnd_cne_funding.1.d:0 "[SCOPE.sState('nesnd_cne_funding_state').GetName]的省督呈报，许多离开田庄的乡民尚不熟悉工坊所需的手艺，在城镇中难以谋生。户部据此拟定拨款，供当地兴办实业学堂，并扶助工坊扩建。若能使乡民学会新业，地权改革所许诺的自由便有了生活的依托。"
 nesnd_cne_funding.2.t:0 "[SCOPE.sState('nesnd_cne_funding_state').GetName]的转业救济"
 nesnd_cne_funding.2.d:0 "[SCOPE.sState('nesnd_cne_funding_state').GetName]的省督请求增拨救济。失去收入的家庭已经开始减少口粮，城内的招工尚不足以安置他们。户部拟在原有救济上加发一年的补助，供这些家庭度过转业的难关，现已呈请批准。"
 nesnd_cne_funding.accept:0 "照此拨付。"
 nesnd_cne_funding.cancel:0 "暂缓议定。"
 nesnd_land_rules_link:0 "在牧皇的伟大构想下，帝国提出了以下三项革命目标：#bold $nesnd_cne_land_journal$#!、#bold $nesnd_cne_urban_journal$#!与#bold $nesnd_cne_camps_journal$#!。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_land_rules 本月民生统计#!#!"
 nesnd_land_rules:0 "无业劳动力：#v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!\n欠食劳动力：#v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!\n劳动力家庭生活水平：#v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!\n市场接入：#v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!"
 nesnd_cne_consolidation_rules:0 "#bold 民生巩固#!\n学校至少#v 2#!级、识字率至少#v 48%#!。无业劳动力至多#v 6%#!、欠食至多#v 8%#!、生活水平至少#v 11#!、市场接入至少#v 85%#!。社保至少#v 2#!级且生活水平至少#v 12#!时，无业劳动力上限放宽至#v 12%#!。行政力须非负、处于和平且未受破产惩罚。\n\n#bold 地方失序#!\n至少#v 50万#!人口的州，连续六个月无业劳动力超过#v 20%#!、欠食超过#v 25%#!或严重饥饿超过#v 10%#!，会中断巩固并增加失序。\n\n总进度达到#v 100#!、连续巩固#v 12#!个月且失序低于#v 50#!方可完成。四十八个月内完成、连续巩固至少二十四个月且失序低于三十，获得快速改革奖励。"
 nesnd_cne_arable_share_tt:0 "本国中华本土及东北诸州：农业用地至少占可耕地的#v 6%#!。"
