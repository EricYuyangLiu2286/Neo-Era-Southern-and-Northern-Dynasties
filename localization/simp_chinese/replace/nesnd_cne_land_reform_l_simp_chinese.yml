 nesnd_land_survey_desc:0 "由户部拨助工坊与实业学堂，使离开田庄的乡民学会新业，参与产业的增长。"
 nesnd_land_review:0 "复核地权争讼"
 nesnd_land_review_desc:0 "由刑部会同户部复核地权争讼，责令省督查明地方官员执行[Concept('concept_law','新法')]的情形。已经取得田产的农户，应当能够依法保有他们的生活。"
 nesnd_land_military:0 "增拨转业救济"
 nesnd_land_military_desc:0 "由户部向已有救济机关增拨款项，接济离开田庄、尚未找到生业的农户，使失去收入的人仍能维持日用。"
