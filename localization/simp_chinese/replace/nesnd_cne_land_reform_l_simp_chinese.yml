 nesnd_cne_land_journal:0 "土地商品化"
 nesnd_cne_land_journal_reason:0 "军功爵与地方宗族积累的田产，使许多农户世代依附于旧主。新法准许土地流转，也让经营农业的商人有了扩张的机会。然而，一纸买卖契约并不能使失去田地的人立即找到新的营生。田庄改作、雇工与迁居带来的争执，将伴随这场变革走进乡村。"
 nesnd_cne_land_start_button:0 "推行土地商品化"
 nesnd_cne_land_start_button_desc:0 "丈量田亩，疏通买卖，让土地与农民脱离宗族的束缚。"
 nesnd_cne_land_stop_button:0 "暂停土地商品化"
 nesnd_cne_land_stop_button_desc:0 "暂缓田亩清丈与转让，召回地方承办官员。"
 nesnd_cne_urban_journal:0 "国家城市化"
 nesnd_cne_urban_journal_reason:0 "乡民离开田庄之后，必须在工坊、矿山与城市中找到新的位置。帝国需要从煤铁到钢铁、工具与机器的连续生产，也需要让劳动者能够承受疾病、失业与衰老。六部所议的实业、学政与救济，到了地方都须由省督筹措、施行。城市扩张所带来的新职业和新学问，也将动摇旧日乡校与士人的权威。"
 nesnd_cne_urban_start_button:0 "推行国家城市化"
 nesnd_cne_urban_start_button_desc:0 "以工坊、矿业与城镇建设吸纳乡民，并使救济随新产业一道扩展。"
 nesnd_cne_urban_stop_button:0 "暂停国家城市化"
 nesnd_cne_urban_stop_button_desc:0 "暂缓官办迁业与城镇扩建，收回本项拨助。"
 nesnd_cne_camps_journal:0 "结束营产制度"
 nesnd_cne_camps_journal_reason:0 "自1444年以来，北明秦藩的军屯逐渐发展为遍及北方的营产制度。军队凭借地产取得粮饷，朝廷借助军队推动征税、扩张与征服，军国与农业的利益由此紧密相连。如今要让田产与矿业转入民用经营，便必须触动军中的旧利。\n\n户部要求各省将营产纳入通常的赋税与经营，兵部则须应付将领对军饷和旧功的索求。省督负责推行新法，手中却未必有足以压服驻军的力量。元老院里的开国勋旧，也不会轻易答应剥去自己的产业。各省可以分别办理，遇到难以收束的争端时再予暂缓。军队失去的地产，终须由新的财政与生产来弥补。"
 nesnd_cne_land_status:0 "$nesnd_cne_land_requirements$\n土地产权须确立为自耕农、商业化农业或集体化农业。"
 nesnd_cne_urban_status:0 "$nesnd_cne_urban_requirements$\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_cne_consolidation_rules 就业、教育与福利#!#!"
 nesnd_cne_camps_status:0 "正在整顿营产的地区：#v [ROOT.GetCountry.MakeScope.Var('nesnd_cne_camps_active').GetValue|0]#!。"
 nesnd_cne_start_requirements:0 "地权革命尚未结束。行政力非负、未受破产惩罚、地方失序低于65，且拥有该州。"
 nesnd_cne_land_requirements:0 "研究集约农业。改革地区已开发的农业用地至少占可耕地的#v 6%#!。行政力非负、未破产、失序低于#v 65#!。"
 nesnd_cne_urban_requirements:0 "至少#v 5#!州拥有#v 5#!级城镇中心。铁矿#v 25#!、煤矿#v 40#!、钢厂#v 10#!、工具厂#v 30#!、发动机厂#v 6#!、伐木场#v 60#!、船厂#v 12#!级。\n解锁福利相关科技，实行济贫法、工资补贴或养老金，社会保障机构至少#v 1#!级。行政力非负、未破产、失序低于#v 65#!。"
 nesnd_cne_land_start_tt:0 "每月改革进度#p +0.25#!。军功爵支持#n −2#!、乡村民众支持#n −1#!。地主吸引力#n −15%#!、实业家吸引力#p +15%#!。立法成功率#p +5个百分点#!、最低工资#p +5%#!。 每年消耗人民的信心#n 5#!。"
 nesnd_cne_urban_start_tt:0 "每月改革进度#p +0.35#!。儒生支持#n −2#!、实业家支持#n −1#!。小市民吸引力#p +15%#!。立法成功率#p +5个百分点#!、最低工资#p +5%#!。 每年消耗人民的信心#n 5#!。"
 nesnd_cne_land_stop_tt:0 "停止土地商品化带来的进度增长、信心消耗及临时修正。"
 nesnd_cne_urban_stop_tt:0 "停止国家城市化带来的进度增长、信心消耗及临时修正。"
 nesnd_cne_camp_start_tt:0 "本州每月增加#p 0.05#!改革进度。农业、矿业吞吐量各#p +10%#!，税收能力与建造速度各#p +10%#!。军队支持#n −1#!、全体在职陆海军将领忠诚#n −1#!。同时推进多州会叠加。 每年消耗人民的信心#n 5#!。"
 nesnd_cne_camp_stop_tt:0 "停止本州月度进度，撤回本州的农业、矿业、税收与建设收益，以及对应的军队支持和将领忠诚惩罚。"
