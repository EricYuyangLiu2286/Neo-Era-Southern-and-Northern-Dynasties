 nesnd_cne_stability_detail_tt:0 "从改革第 #v 4#! 次月度统计起，以下各项同时达标就累计一个月。当月有一项未达标，连续月数即归零。\n\n#bold 全国条件#!\n• 实行[GetLawType('law_peasant_proprietorship').GetName]、[GetLawType('law_commercialized_agriculture').GetName]或[GetLawType('law_collectivized_agriculture').GetName]，相应法律变体也可。\n• [GetInstitutionType('institution_schools').GetName]机构至少 #v 2#! 级，[concept_literacy]至少 #v 48%#!。\n• [concept_bureaucracy]至少为 #v 0#!，国家处于和平且未受[concept_bankruptcy]惩罚。\n\n#bold 改革地区的民生#!\n统计范围内须有[concept_workforce]。\n• [concept_unemployed]劳动力占 #v [Country.MakeScope.Var('nesnd_reform_unemployment').GetValue|%1]#!，上限 #v 6%#!。若[GetInstitutionType('institution_social_security').GetName]机构至少 #v 2#! 级，且劳动力平均[concept_sol]至少为 #v 12#!，上限放宽至 #v 12%#!。\n• 欠食劳动力占 #v [Country.MakeScope.Var('nesnd_reform_starving').GetValue|%1]#!，上限 #v 8%#!。\n• 劳动力平均[concept_sol]为 #v [Country.MakeScope.Var('nesnd_reform_sol').GetValue|1]#!，至少须达到 #v 11#!。\n• 平均[concept_market_access]为 #v [Country.MakeScope.Var('nesnd_reform_access').GetValue|%1]#!，至少须达到 #v 85%#!。\n\n#bold 持续困苦的州#!\n改革地区须为 #v 0#! 个，当前 #v [Country.MakeScope.Var('nesnd_reform_neglected_regions').GetValue|0]#! 个。人口至少 #v 50 万#! 且有劳动力的州，若连续 #v 6#! 个月每月出现以下任一情形，即计入：失业劳动力超过 #v 20%#!、欠食劳动力超过 #v 25%#!、严重饥饿劳动力超过 #v 10%#!。"
