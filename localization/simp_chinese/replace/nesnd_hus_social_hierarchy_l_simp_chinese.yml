l_simp_chinese:
 lawgroup_nesnd_hus_social_hierarchy:0 "东洲等级制度"
 lawgroup_nesnd_hus_social_hierarchy_desc:0 "以族籍划定共和国各族居民的社会地位。"
 nesnd_hus_social_hierarchy:0 "东洲等级制度"
 nesnd_hus_social_hierarchy_desc:0 "汉人、满蒙、美洲原住民与白人的族籍，决定了他们在共和国中获得的接纳与待遇。"
 nesnd_hus_han_class_pop_tt:0 "具有#b $heritage_han$#!传承的[concept_culture]，满蒙除外"
 nesnd_hus_manchu_pop_tt:0 "#b $manchu$#![concept_culture]，或具有#b $heritage_mongolian$#!传承的文化"
 nesnd_hus_native_class_pop_tt:0 "属于#b $heritage_group_indigenous_american$#!传承组的[concept_culture]，汉人及满蒙除外"
 nesnd_hus_white_class_pop_tt:0 "属于#b $heritage_group_european$#!传承组的[concept_culture]，汉人、满蒙及美洲原住民除外"
 law_nesnd_hus_four_tier_system:0 "四等户籍"
 law_nesnd_hus_four_tier_system_desc:0 "汉人居于一等，满蒙居于二等，美洲原住民居于三等，白人居于四等。族籍限定各族居民的社会地位。财富与职业不能使人越过这一界限。"
 law_nesnd_hus_manchu_registration:0 "满蒙编户"
 law_nesnd_hus_manchu_registration_desc:0 "满蒙居民取得与汉人相同的一等户籍，美洲原住民与白人仍分别列为三等、四等。共和国借此扩大享有最高待遇的公民之列。"
 law_nesnd_hus_native_registration:0 "原住民编户"
 law_nesnd_hus_native_registration_desc:0 "美洲原住民取得与汉人相同的一等户籍，满蒙与白人仍分别列为二等、四等。共和国以共同的公民地位，重新界定殖居者与原住民的关系。"
 law_nesnd_hus_hierarchy:0 "$law_nesnd_hus_four_tier_system$"
 law_nesnd_hus_hierarchy_desc:0 "$law_nesnd_hus_four_tier_system_desc$"
 law_nesnd_hus_registry_manchu:0 "$law_nesnd_hus_manchu_registration$"
 law_nesnd_hus_registry_manchu_desc:0 "$law_nesnd_hus_manchu_registration_desc$"
 law_nesnd_hus_registry_native:0 "$law_nesnd_hus_native_registration$"
 law_nesnd_hus_registry_native_desc:0 "$law_nesnd_hus_native_registration_desc$"
 nesnd_hus_registration:0 "共和国的族籍"
 nesnd_hus_registration_reason:0 "$HUS$的公民之名，向来有不同的分量。汉人居于等级之首，满蒙、美洲原住民与白人依次列后。同在共和国生活，并不意味着得到相同的待遇。如今，扩大公民之列的争论已经进入政府。满蒙希望凭借与汉人的联系取得平等地位，原住民则要求共和国承认他们对这片土地与国家的权利。\n\n政府将选择一方编入一等户籍，经过一年的登记后施行新法。这一决定也将改变共和国与被留在旧等级中的人们的关系。"
 nesnd_hus_registration_lock_tt:0 "东洲等级制度存续期间，不能更改$lawgroup_citizenship$法律"
 nesnd_hus_registration_uncommitted_tt:0 "尚未决定编户对象"
 nesnd_hus_registration_enacted:0 "编户已完成，相应法律已施行"
 nesnd_hus_registration_choose:0 "政府尚未决定将哪一方编入一等户籍。"
 nesnd_hus_registration_pending_manchu:0 "满蒙编户已经开始。自作出选择满一年后，$law_nesnd_hus_manchu_registration$将自动施行。"
 nesnd_hus_registration_pending_native:0 "原住民编户已经开始。自作出选择满一年后，$law_nesnd_hus_native_registration$将自动施行。"
 nesnd_hus_registration_pending:0 "编户正在进行。"
 nesnd_hus_registration_completed:0 "编户完成，新法已经施行。"
 nesnd_hus_registration_conflict:0 "既有编户决议相互抵牾，现行户籍等级暂且维持。"
 nesnd_hus_registration_manchu_conclusion:0 "满蒙居民已与汉人同列一等户籍。美洲原住民仍列三等，白人仍列四等。共和国扩大了享有最高待遇的公民之列，族籍间的分别仍然存在。"
 nesnd_hus_registration_native_conclusion:0 "美洲原住民已与汉人同列一等户籍。满蒙仍列二等，白人仍列四等。共和国承认了原住民的平等地位，也把满蒙居民留在了旧等级之中。"
 nesnd_hus_registration_closed:0 "原东洲政府的族籍改革已经结束。"
 nesnd_hus_registration_closed_tt:0 "原东洲政府的族籍改革已不再适用"
 nesnd_hus_registration.20.t:0 "扩大公民之列"
 nesnd_hus_registration.20.manchu:0 "政府已经决定将满蒙居民编入一等户籍。从今日起进行为期十二个月的登记，到期后施行$law_nesnd_hus_manchu_registration$。"
 nesnd_hus_registration.20.native:0 "政府已经决定将美洲原住民编入一等户籍。从今日起进行为期十二个月的登记，到期后施行$law_nesnd_hus_native_registration$。"
 nesnd_hus_registration.20.f:0 "“凡应编入一等户籍者，自即日起十二个月内携家口到户籍处登记。期满即依新法施行。”\n——户籍登记告示"
 nesnd_hus_registration.20.a:0 "让新法如期施行。"
 nesnd_hus_registration.21.t:0 "编户新法施行"
 nesnd_hus_registration.21.manchu:0 "$law_nesnd_hus_manchu_registration$已经施行。满蒙居民取得与汉人相同的一等户籍，美洲原住民仍列三等，白人仍列四等。"
 nesnd_hus_registration.21.native:0 "$law_nesnd_hus_native_registration$已经施行。美洲原住民取得与汉人相同的一等户籍，满蒙仍列二等，白人仍列四等。"
 nesnd_hus_registration.21.f:0 "“本法自公布之日起施行，各地户籍官员应据此换发户籍证明。”\n——法令末条"
 nesnd_hus_registration.21.a:0 "这一决定已成为法律。"
 nesnd_hus_register_manchu:0 "将满蒙编入一等户籍"
 nesnd_hus_register_manchu_desc:0 "满蒙居民与汉人之间的联系，为扩大共和国的公民之列提供了一条道路。政府将承认他们与汉人相同的社会地位。"
 nesnd_hus_register_manchu_tt:0 "经过#bold 12个月#!施行$law_nesnd_hus_manchu_registration$。美洲原住民仍列三等，白人仍列四等。选择后不能改换编户对象。"
 nesnd_hus_register_native:0 "将原住民编入一等户籍"
 nesnd_hus_register_native_desc:0 "原住民同样生活于共和国的土地之上，政府将承认他们与汉人相同的社会地位。"
 nesnd_hus_register_native_tt:0 "经过#bold 12个月#!施行$law_nesnd_hus_native_registration$。满蒙仍列二等，白人仍列四等。此后满蒙居民将迁往$CNE$或美国西部。选择后不能改换编户对象。"
