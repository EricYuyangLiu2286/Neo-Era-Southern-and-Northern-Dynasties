 nesnd_india_diplomacy.1.t:0 "印度使团"
 nesnd_india_diplomacy.1.d:0 "[SCOPE.sCountry('india_sender').GetName]的使团已呈交国书，等候我国政府答复。"
 nesnd_india_diplomacy.1.a:0 "接受这些条件。"
 nesnd_india_diplomacy.1.b:0 "我们不能答应。"
 nesnd_india_diplomacy.2.t:0 "使者归来"
 nesnd_india_diplomacy.2.d:0 "[SCOPE.sCountry('india_partner').GetName]已接受我国提出的条件。"
 nesnd_india_diplomacy.3.t:0 "未获应允"
 nesnd_india_diplomacy.3.d:0 "[SCOPE.sCountry('india_partner').GetName]拒绝了使团提出的条件。"
 nesnd_india_diplomacy_ack:0 "知道了。"
 nesnd_india_reply_aid_tt:0 "提供一笔拨款及四年的专业援助。受援国承担顾问费用。双方交战或受援国改投其他宗主后，顾问撤离。"
 nesnd_india_reply_autonomy_tt:0 "提高对方一级自治权。"
 nesnd_india_reply_independence_tt:0 "承认对方独立，缔结五年停战。"
 nesnd_india_reply_union_tt:0 "我国并入对方，原有土地与人民成为统一国家的一部分。"
 nesnd_india_reply_defence_tt:0 "缔结防御条约，约束期三年。"
 nesnd_india_request_1:0 "延请[SCOPE.sCountry('nesnd_label_fra').GetName]教师"
 nesnd_india_request_2:0 "延请[SCOPE.sCountry('nesnd_label_fra').GetName]工程师"
 nesnd_india_request_3:0 "延请[SCOPE.sCountry('nesnd_label_fra').GetName]教官"
 nesnd_india_request_4:0 "商议自治"
 nesnd_india_request_7:0 "请求独立"
 nesnd_india_request_6:0 "邀请土邦加入"
 nesnd_india_defence_fra:0 "与[SCOPE.sCountry('nesnd_label_fra').GetName]商议互保"
 nesnd_india_defence_mug:0 "与[SCOPE.sCountry('nesnd_label_mug').GetName]商议互保"
 nesnd_india_defence_usm:0 "与[SCOPE.sCountry('nesnd_label_usm').GetName]商议互保"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName]请求法国派遣教师，并拨款支持当地学校的开办。"
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName]拟扩充其国内的矿业与工业，请法国派遣工程师，并资助有关工场的建设。"
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName]请求法国派遣军事教官，并拨款协助整训军队。"
 nesnd_india_diplomacy.1.d4:0 "[SCOPE.sCountry('india_sender').GetName]的使者要求扩大自治权，让当地政府自己处理更多的内政。"
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName]提议缔结共同防御条约。对方希望在受到进攻时得到援助，也愿承担保卫我们的义务。"
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName]邀请我国并入统一的印度，并提出以年金保障原有王公。接受这一提议，就意味着结束我国的单独统治，将土地与人民交由对方政府管辖。"
 nesnd_india_diplomacy.1.d7:0 "[SCOPE.sCountry('india_sender').GetName]的来使请求结束两国宗藩关系，真正行使国家主权。"
 nesnd_india_diplomacy.1.f:0 "“我们请的是教师和工程师，不是驻扎官。”\n——土邦的一位大臣"
 nesnd_india_uprising:0 "南方的烽火"
 nesnd_india_uprising_reason:0 "南朝依靠港口、驻军和当地盟友维持统治。反对南朝的地方组织若要公开举事，需要外来的经费和支持。我们可以资助他们争取独立，举事地区的归属仍应由当地人决定。"
 nesnd_india_uprising_status:0 "地方的行动还在等待时机。"
 nesnd_india_contact_desc:0 "地方组织筹备起义，有赖于本国的经费支持。"
 nesnd_india_contact_tt:0 "支付£5,000联络费用，政府工资增加2%。当地存在严重失序或[concept_sol]低于10时，组织才能发展。交通、失序程度和法国教官影响筹备速度。暂停后不再支付维护费，筹备每月减少2。"
 nesnd_india_pause_tt:0 "暂停联络并撤去维护开支。当地组织每月损失2筹备。"
 nesnd_india_resume_tt:0 "恢复联络与维护开支。不再支付首次联络费。"
 nesnd_india_launch_tt:0 "支付£20,000支持举事。当地将成立自己的国家，殖民统治者要求收复本[concept_state]，起义者以羞辱对方为反诉求。独立的赞助国加入起义一方。资助不会自动使当地并入本国。"
 nesnd_india_contact_cost:0 "南方联络经费"
 nesnd_india_revolt_war:0 "保卫地方自主"
 nesnd_india_revolt_war_reason:0 "旧统治者要求收回起义地区，新政府则要求承认独立。我们曾接受外国资助，但援助并未赋予资助国管辖这片土地的权利。"
 nesnd_india_revolt_resolved_tt:0 "本次争端已经结束，仍独立保有起义地区。"
 nesnd_india_revolt_survived:0 "守住自主"
 nesnd_india_suppression_desc:0 "以额外的警务开支打击地方秘密组织。"
 nesnd_india_suppression_tt:0 "支付£10,000，使当地筹备减少25。六个月内不能再次采取同一行动。"
 nesnd_india_revolt.1.t:0 "南方举事"
 nesnd_india_revolt.1.d:0 "[SCOPE.sState('india_case_state').GetName]的起义者已经占领地方官署，宣布独立。原统治者仍要求收回该地。"
 nesnd_india_revolt.1.f:0 "“本邦自今日起独立。”\n——起义者张贴在官署门前的告示"
 nesnd_india_revolt_ack:0 "通报举事经过。"
