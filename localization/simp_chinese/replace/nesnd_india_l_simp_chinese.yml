l_simp_chinese:
 nesnd_india_imperial_army:0 "印度帝国军"
 nesnd_india_reform:0 "德里的改革"
 nesnd_india_reform_reason:0 "莫卧儿的旧帝国曾靠君主的声望维系各省，如今的统治者却必须面对新的问题。法国商人与教官带来了财富和新式兵器，也带来了新的债主。国家需要自己的学校和工场，让地方的赋税变成能够保卫它的力量。"
 nesnd_india_reform_status:0 "政府正在筹办学校与工场。"
 nesnd_india_schools:0 "学校与官署"
 nesnd_india_schools_reason:0 "帝国需要能看懂账簿的官员，也需要能教会下一代读书的人。德里的一所学院无法代替各省的学校。纸张、教师与稳定的经费，必须一同送到地方。"
 nesnd_india_industry:0 "工场与军队"
 nesnd_india_industry_reason:0 "孟加拉的织物远销海外，帝国军队却仍仰赖旧式武备。矿井、工具厂和铁路可以把地方的资源与生产联系起来，为军队供应武器，也为雇工提供新的岗位。"
 nesnd_india_school_service:0 "各省学务"
 nesnd_india_industrial_service:0 "帝国工场"
 nesnd_india_society:0 "王朝与印度"
 nesnd_india_society_reason:0 "住在同一个国家，不等于把彼此当同胞。各省有自己的语言、信仰和旧日王公。学校和城市办起来以后，人们开始争论：谁有资格代表印度？王朝、地方领袖和新起的国民力量，各有各的答案。"
 nesnd_india_society_status:0 "各省正在寻找共同的政治归属。"
 nesnd_india_dynasty_bar:0 "王朝接受度"
 nesnd_india_community_bar:0 "印度共同体"
 nesnd_india_dynasty_legitimacy:0 "政府合法性"
 nesnd_india_dynasty_religion:0 "宗教待遇"
 nesnd_india_dynasty_dependence:0 "对法国的依赖"
 nesnd_india_community_education:0 "学校与识字"
 nesnd_india_community_representation:0 "政治参与"
 nesnd_india_community_unrest:0 "社会动荡"
 nesnd_india_caste:0 "身份与公职"
 nesnd_india_caste_reason:0 "学校的大门已经打开，旧有身份仍决定着人们能够走多远。让军官与官员凭才干任职，需要改变成文法律，也需要把教育送到原先被排斥的家庭。"
 nesnd_india_equal_service:0 "公职开放"
 nesnd_india_princes:0 "诸邦之间"
 nesnd_india_princes_reason:0 "德里、南京和巴黎都给印度诸邦开出了条件。王公们要保的不只是祖传的宫殿，还有土地、税收和自己国家的命运。谁的援助都不白给。"
 nesnd_india_princes_status:0 "本国的主权与地方利益仍待守护。"
 nesnd_india_usm:0 "天竺的土地"
 nesnd_india_usm_reason:0 "南朝在印度的领地隔海相望，商人、驻军与地方王公各有利益。南京可以派遣官员直接治理，也可以把这些土地交给另设的宣慰司。一切为了天朝的荣光和税金！"
 nesnd_india_usm_status:0 "海路把天竺与南朝的市场联系起来。"
 nesnd_india_unified:0 "印度的新秩序"
 nesnd_india_unified_reason:0 "统一使许多边界从地图上消失，却没有消除各省的差别。新的国家必须把税收、教育与公共事务维持下去，让共同的法律在宫廷以外也具有意义。"
 nesnd_india_unified_reward:0 "共同的国家"
 nesnd_india_choose_schools:0 "先办学务"
 nesnd_india_choose_industry:0 "先兴实业"
 nesnd_india_priority_desc:0 "将政府的人力与经费集中到这项事业上。"
 nesnd_india_priority_tt:0 "将此事列为当前改革重点。另一项工作暂停，已取得的成果保留。"
