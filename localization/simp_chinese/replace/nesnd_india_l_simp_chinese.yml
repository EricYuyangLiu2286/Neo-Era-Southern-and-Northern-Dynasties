 nesnd_tianzhu.1.t:0 "宣慰司开府"
 nesnd_tianzhu.1.d:0 "诏书随季风抵达天竺，宣慰使在港口的炮声中接过了印信。从此，天竺的驻军、关税与讼案不必再等半年一趟的海船，由宣慰司就地决断，南京只管任免宣慰使，按时收取岁入。\n\n王公们换了一位打交道的上官，商行换了一处递送账簿的衙门，村社的田赋照旧要交。对南京而言，这桩买卖再划算不过：功劳记在朝廷，麻烦留在天竺。"
 nesnd_tianzhu.1.f:0 "“天竺驻军、关税、讼案，由宣慰司就地决断。宣慰使由南京任免，岁入按时解送。”\n——开府诏书"
 nesnd_tianzhu.1.a:0 "朝廷的恩德，由宣慰使代为布施。"
 nesnd_tianzhu_founding_reward:0 "天竺开府"
