 nesnd_india_twelve_months_tt:0 "上述条件已累计维持十二个月。"
 nesnd_india_reform_finished_tt:0 "完成学校与官署、工场与军队。"
 TZ1:0 "天竺"
 TZ1_ADJ:0 "天竺"
 nesnd_tianzhu_commission_name:0 "天竺宣慰司"
 nesnd_establish_tianzhu:0 "设立天竺宣慰司"
 nesnd_establish_tianzhu_desc:0 "将天竺的领地交由中央委任的宣慰使治理。"
 nesnd_establish_tianzhu_tt:0 "将本国在印度与相关岛屿的直辖领地划归天竺宣慰司，建立[concept_puppet]关系。各土邦仍直属本国。"
 nesnd_tianzhu_commission:0 "筹建天竺宣慰司"
 nesnd_tianzhu_commission_reason:0 "印度的领地与南京相隔万里。驻军和商人需要一个能在当地作出决定的官署，朝廷也需要一个能为这些决定负责的人。"
 nesnd_tianzhu_governance:0 "天竺的庶务"
 nesnd_tianzhu_governance_reason:0 "天竺的商人熟悉海路，乡村却有另一套秩序。宣慰使既要维持港口与驻军，也要让学校和税务进入内地。当地王公与村社不会仅因南京的任命就放弃自己的利益。"
 YU1:0 "远山"
 YU1_ADJ:0 "远山"
 nesnd_yuanshan_commission_name:0 "远山宣慰司"
 nesnd_establish_yuanshan:0 "设立远山宣慰司"
 nesnd_establish_yuanshan_desc:0 "将远山的领地交由中央委任的宣慰使治理。"
 nesnd_establish_yuanshan_tt:0 "将本国在南非指定地区的实有领土划归远山宣慰司，建立[concept_puppet]关系。其他国家及其领土不变。"
 nesnd_yuanshan_commission:0 "筹建远山宣慰司"
 nesnd_yuanshan_commission_reason:0 "远山的港口面向两洋，也是南朝船队进入非洲腹地的起点。只有真正取得并经营这片土地，朝廷才能在那里设立自己的宣慰司。"
 nesnd_yuanshan_governance:0 "远山的庶务"
 nesnd_yuanshan_governance_reason:0 "远山的港口已经成为南朝航路上的据点，腹地的治理却刚刚开始。道路、税务与学校必须随着驻军一同建立，否则沿海的旗帜仍无法代表整个宣慰司。"
 nesnd_commission_governance_reward:0 "地方行政渐备"
 nesnd_india_foreign:0 "借法自强"
 nesnd_india_foreign_reason:0 "法国想靠贸易、投资和军援守住在印度的影响，德里则缺教师、工程师和军官。跟着法国人学出来的人才是自己的，靠山却还是巴黎。"
 nesnd_india_foreign_status:0 "法国的援助要收，自己的主意也要拿。"
 nesnd_india_diplomatic_desc:0 "向对方正式提出请求，由其政府作答。"
 nesnd_india_request_tt:0 "请求将交给对方决定。六个月后可再次交涉。法国援助获准后四年内不可再次领取。"
 nesnd_india_union_request_tt:0 "向一国提出并入印度的条件。对方可拒绝。同意后支付安置费，并承担十年的王公年金开支。"
 nesnd_india_french_advisers:0 "法国顾问团"
 nesnd_india_french_teachers:0 "法国教师"
 nesnd_india_french_engineers:0 "法国工程师"
 nesnd_india_french_officers:0 "法国教官"
 nesnd_india_princely_pensions:0 "王公年金"
 nesnd_india_diplomacy.1.t:0 "印度使团"
 nesnd_india_diplomacy.1.d:0 "[SCOPE.sCountry('india_sender').GetName]的使团已经抵达，带来了有关两国关系的请求。使者正在等待答复。"
 nesnd_india_diplomacy.1.a:0 "接受这些条件。"
 nesnd_india_diplomacy.1.b:0 "我们不能答应。"
 nesnd_india_diplomacy.2.t:0 "使者归来"
 nesnd_india_diplomacy.2.d:0 "[SCOPE.sCountry('india_partner').GetName]答应了我们的请求。约定已经交付执行。"
 nesnd_india_diplomacy.3.t:0 "未获应允"
 nesnd_india_diplomacy.3.d:0 "[SCOPE.sCountry('india_partner').GetName]回绝了使团的条件。只能另想办法了。"
 nesnd_india_diplomacy_ack:0 "知道了。"
 nesnd_india_reply_aid_tt:0 "提供一笔拨款及四年的专业援助。受援国承担顾问费用。双方交战或受援国改投其他宗主后，顾问撤离。"
 nesnd_india_reply_autonomy_tt:0 "提高对方一级自治权。"
 nesnd_india_reply_independence_tt:0 "承认对方独立，缔结五年停战。"
 nesnd_india_reply_union_tt:0 "本国并入对方，原有土地与人民成为统一国家的一部分。"
 nesnd_india_reply_defence_tt:0 "缔结防御条约，约束期三年。"
 nesnd_india_request_1:0 "延请法国教师"
 nesnd_india_request_2:0 "延请法国工程师"
 nesnd_india_request_3:0 "延请法国教官"
 nesnd_india_request_4:0 "商议自治"
 nesnd_india_request_7:0 "请求独立"
 nesnd_india_request_6:0 "邀请土邦加入"
 nesnd_india_defence_fra:0 "与$FRA$商议互保"
 nesnd_india_defence_mug:0 "与$MUG$商议互保"
 nesnd_india_defence_usm:0 "与$USM$商议互保"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName]请法国派教师来，并拨款帮他们办起头几所学校。他们要的是自己的人才；顾问团进了学堂，法国在当地教育里的分量也跟着重了。"
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName]请法国派矿业和工业工程师，并拨款帮他们开办产业。他们想学新的生产技术，法国企业则盯着其中的生意。"
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName]请法国派军事教官，并拨款帮他们整训军队。他们想练出一支像样的兵，法国则有机会替这支军队定下日后的规矩。"
 nesnd_india_diplomacy.1.d4:0 "[SCOPE.sCountry('india_sender').GetName]的使者要求扩大自治，许多事想由当地政府自己来办。"
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName]提议缔结共同防御条约。对方希望在受到进攻时得到援助，也愿承担保卫我们的义务。"
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName]邀请本国并入统一的印度，并提出以年金保障原有王公。接受这一安排，就意味着结束本国的单独统治，将土地与人民交由对方政府管辖。"
 nesnd_india_diplomacy.1.d7:0 "[SCOPE.sCountry('india_sender').GetName]请求我们承认其独立，由当地政府自行决定内外事务。接受请求将结束现有的宗属关系。"
 nesnd_india_uprising:0 "南方的烽火"
 nesnd_india_uprising_reason:0 "南朝的统治依靠港口、驻军和愿意合作的地方势力。反对者同样需要组织、经费与盟友。德里可以帮助他们行动，却不能因此把他们的土地视作自己的奖赏。"
 nesnd_india_uprising_status:0 "地方的行动尚待时机。"
 nesnd_india_contact_desc:0 "资助当地的反殖民组织，为公开举事作准备。"
 nesnd_india_contact_tt:0 "支付£5,000联络费用，政府工资增加2%。当地存在严重失序或生活水平低于10时，组织才能发展。交通、失序程度和法国教官影响筹备速度。暂停后不再支付维护费，筹备每月减少2。"
 nesnd_india_pause_tt:0 "暂停联络并撤去维护开支。当地组织每月损失2筹备。"
 nesnd_india_resume_tt:0 "恢复联络与维护开支。不再支付首次联络费。"
 nesnd_india_launch_tt:0 "支付£20,000支持举事。当地将成立自己的国家，殖民统治者要求收复本州，起义者以羞辱对方为反诉求。独立的赞助国加入起义一方。资助不会自动使当地并入本国。"
 nesnd_india_preparation_tt:0 "本地区的筹备已达100。"
 nesnd_india_contact_cost:0 "南方联络经费"
 nesnd_india_revolt_war:0 "保卫地方自主"
 nesnd_india_revolt_war_reason:0 "旧统治者要求收回这片土地。独立的命运将由这场交涉与战争决定。外国资助不应成为另一个国家吞并我们的借口。"
 nesnd_india_revolt_resolved_tt:0 "本次争端已经结束，仍独立保有起义地区。"
 nesnd_india_revolt_survived:0 "守住自主"
 nesnd_india_suppression_desc:0 "以额外的警务开支打击地方秘密组织。"
 nesnd_india_suppression_tt:0 "支付£10,000，使当地筹备减少25。六个月内不能再次采取同一行动。"
 nesnd_india_revolt.1.t:0 "南方举事"
 nesnd_india_revolt.1.d:0 "[SCOPE.sState('india_case_state').GetName]的反对者已经公开举事。他们占据地方官署，宣布不再服从旧统治者。承不承认这块地分出去，成了两国之间的争端。"
 nesnd_india_revolt_ack:0 "局势已变。"
