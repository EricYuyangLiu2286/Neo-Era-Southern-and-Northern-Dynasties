 nesnd_board_stance_neutral:0 "中立"
 nesnd_board_stance_autonomy:0 "自主"
 nesnd_board_stance_available_tt:0 "内战尚未爆发，本国不受固定立场约束，距上次改换立场已满#v 6个月#!。襄樊大营固定拥明；朝廷不能选择中立或自主。"
 nesnd_board_stance_effect_tt:0 "公开本国立场，#v 6个月#!内不再更改。撤回既有盟书时，尚未执行的并省或割地承诺一并作废，与中央关系#n −15#!。"
 nesnd_board_choose_ming:0 "拥护明廷"
 nesnd_board_choose_ming_desc:0 "朱氏帝统历经诸侯分争，仍是南朝诸邦共同奉行的正朔。遣使南京，表明本国奉明的主张。"
 nesnd_board_choose_wu:0 "支持郑氏"
 nesnd_board_choose_wu_desc:0 "郑氏经营海陆、掌握军财已久。遣使杭州，支持吴王以今日的功业改定天下的名位。"
 nesnd_board_choose_neutral:0 "守持中立"
 nesnd_board_choose_neutral_desc:0 "南京与杭州各有主张，本国的军队暂且留守境内，商旅仍照旧往来。"
 nesnd_board_choose_autonomy:0 "争取自主"
 nesnd_board_choose_autonomy_desc:0 "朝廷将议改制，本国也当自掌财赋、官员与防务。以此向两方陈明条件。"
 nesnd_board_ming_bar_name:0 "拥明表态"
