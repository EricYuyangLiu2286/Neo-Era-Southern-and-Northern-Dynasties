 nesnd_sha_plot_hardship:0 "平均[concept_sol]较上月下降"
 nesnd_sha_plot_out_of_office:0 "三个集团均未掌权，在野且势弱"
 nesnd_sha_plot_schooling:0 "学校机构至少三级"
