l_simp_chinese:
 nesnd_sha_conspiracy:0 "君主主义阴谋"
 nesnd_sha_conspiracy_reason:0 "国人共和派在勘察加打败了齐王的旧部，却没能让每一个随齐王渡海的家族都认同，儿孙的前程应当由选票决定。远北的共和国是在刀兵中立国的，旧族也记得这一点。如今[JournalEntry.GetCountry.GetName]取得了山东，议会要向当地地主征税、从乡间征粮，还要军队执行命令。盼望重立君主的人，终于有了同政府讲条件的本钱。\n\n共和国收复山东，凭的是齐国的旧疆，齐国旧族要讨回名分，凭的也是同一段往事。"
 nesnd_sha_plot_bar:0 "阴谋"
 nesnd_sha_plot_bar_desc:0 "阴谋 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_sha_plot_royal_status:0 "立宪君主派要在共和国之上奉立一位君主。阴谋越盛，他们与反动派在各[concept_state]越容易招募支持者。"
 nesnd_sha_plot_corporate_status:0 "法团派要求按行业组织国家，把议席交给各业代表。阴谋越盛，他们与反动派在各[concept_state]越容易招募支持者。"
 nesnd_sha_plot_quiet_status:0 "阴谋进度已经降为零。连续十二个月维持在零，调查便可结束。"
 nesnd_sha_plot_landowners_power:0 "地主势力强大"
 nesnd_sha_plot_landowners_office:0 "地主在政府中"
 nesnd_sha_plot_rural_folk_power:0 "乡村民众势力强大"
 nesnd_sha_plot_rural_folk_office:0 "乡村民众在政府中"
 nesnd_sha_plot_armed_forces_power:0 "军队势力强大"
 nesnd_sha_plot_armed_forces_office:0 "军队在政府中"
