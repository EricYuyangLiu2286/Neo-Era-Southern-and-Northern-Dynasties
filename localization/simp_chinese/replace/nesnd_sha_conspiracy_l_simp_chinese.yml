 nesnd_sha_plot_royal_ledgers:0 "旧族资助君主派的账目"
 nesnd_sha_plot_corporate_ledgers:0 "旧族资助法团派的账目"
 nesnd_sha_plot_investigate:0 "查办复辟党"
 nesnd_sha_plot_investigate_desc:0 "授权官署追查复辟党人的经费和联络人。调查占用[concept_authority]一年，结束后再过两年才能重办。大举搜查也会使更多人转而反对政府。"
 nesnd_sha_plot_publish:0 "公布旧族账册"
 nesnd_sha_plot_publish_desc:0 "由国库出资清理并刊布旧族的收支账目，使各[concept_state]的人能看清是谁在出钱鼓吹改制。公布账册的影响持续两年，此后四年才能再办。"
 nesnd_sha_plot_inquiry:0 "查办复辟党"
 nesnd_sha_plot_stable:0 "共和已稳"
 nesnd_sha_plot_new_order:0 "政变后的新秩序"
 nesnd_sha_plot_coup_tt:0 "阴谋进度达到 #v 100#!，全国[concept_radicals]至少占 #v 20%#!。"
 nesnd_sha_plot_quiet_tt:0 "阴谋进度连续 #v 12#! 个月为零。"
 nesnd_sha_plot_institutions_tt:0 "地主、乡村民众和军队都已边缘化，学校机构至少三级，且已掌握平等主义、人权、政治鼓动中的至少两项。"
 nesnd_sha_plot_deadline:0 "二十五年期限"
 nesnd_sha_plot_on_deadline:0 "期限届满后"
 nesnd_sha_plot.1.t:0 "共和堪成"
 nesnd_sha_plot.1.d:0 "君主派和法团派的组织相继瓦解。地主、乡村民众和军队在议会中失势，学校培养出来的一代人只认共和国的法律。齐国旧族的子弟要做官，也只能像别人一样去争选票。"
 nesnd_sha_plot.1.f:0 "“凡欲出任公职者，不论出身，一律经由选举。”\n——共和国选举法条文"
 nesnd_sha_plot.1.a:0 "下一届议员仍由国人选出。"
 nesnd_sha_plot.2.t:0 "共和历的末页"
 nesnd_sha_plot.2.d:0 "军队倒向了君主派。士兵封锁议场，按名单逮捕共和派议员和报馆主笔，抵抗的人当场被枪杀。次日起，调动部队的文书改用君主的名义颁发，幸存的议员被召回议场，向新君宣誓效忠。旧族多年奔走所求的名分，就此写进了国法。"
 nesnd_sha_plot.2.f:0 "“名单上的人，一个也不许放走。”——守卫议场的军官"
 nesnd_sha_plot.2.a:0 "以君主名义颁行政令。"
 nesnd_sha_plot.3.t:0 "各业代表入席"
 nesnd_sha_plot.3.d:0 "法团派没有抬出齐王的名号。各业推举的代表在军队护送下进入议场，接管了国人选出的政府。不肯让出席位的议员被押走，码头和工场里带头抗议的人遭到逮捕。城里的雇主从此以本业的名义说话，乡间的大地主也自称代表在他们地里耕作的佃户。"
 nesnd_sha_plot.3.f:0 "“行会替我投了票，老板替我选了代表。我只剩下上工的份。”——一名码头工人"
 nesnd_sha_plot.3.a:0 "由各业法团组成新政府。"
