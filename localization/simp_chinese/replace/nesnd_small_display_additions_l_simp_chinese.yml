l_simp_chinese:
 nesnd_small_review_dispute:0 "回应地方诉求"
 nesnd_small_review_available_tt:0 "地方诉求仍待答复，且答复期限未过。"
 nesnd_small_dispute_law_promised_tt:0 "政府已承诺通过立法回应地方诉求。"
 nesnd_small_review_dispute_desc:0 "听取地方组织的要求，决定政府如何回应。"
 nesnd_small_review_dispute_tt:0 "查看各项回应及其代价，作出决定。答复期限不会因此延长。"
 nesnd_small_dispute_unanswered:0 "地方组织正等待政府答复。"
 nesnd_small_dispute_organised:0 "政府准许地方组织活动，运动可以公开拉拢支持者了。"
 nesnd_small_dispute_suppressed:0 "警察正在压制地方组织，运动没法公开活动。"
 nesnd_small_dispute_promised_1:0 "政府已承诺改革土地制度，须在期限内实行$law_peasant_proprietorship$、$law_commercialized_agriculture$或$law_collectivized_agriculture$。"
 nesnd_small_dispute_promised_2:0 "政府已承诺结束债役，须在期限内实行$law_slavery_banned$。"
 nesnd_small_dispute_promised_3:0 "政府已承诺保障劳动者，须在期限内实行$law_regulatory_bodies$或$law_worker_protections$。"
 nesnd_small_dispute_promised_4:0 "政府已承诺解除种姓限制，须在期限内实行$law_hindu_caste_not_enforced$或$law_affirmative_action$。"
 nesnd_small_dispute_promised_5:0 "政府已承诺扩大政治参与，须在期限内实行$law_wealth_voting$、$law_census_voting$或$law_universal_suffrage$。"
 nesnd_small_dispute_time:0 "处置期限"
 nesnd_small_dispute_time_desc:0 "已持续#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_small_dispute_elapsed_months')|0] / [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_small_dispute_term_months')|0]#!个月"
 nesnd_small_dispute_fulfilled_conclusion:0 "政府按期兑现了立法承诺，地方提出的要求得到了回应。"
 nesnd_small_dispute_expired_conclusion:0 "许诺的期限已经过去，承诺的改革却未实行。仍未得到回应的人们，对政府更加失望。"
 nesnd_small_dispute_finished_conclusion:0 "围绕地方诉求的这一轮交涉已经告一段落。"
 nesnd_small_dispute_ended_conclusion:0 "政局或国家的处境变了，原先的处置也就作罢。"
 nesnd_small_dispute_expired_tt:0 "改革承诺到期未兑现，原有诉求仍未解决。"
 nesnd_small_dispute_finished_tt:0 "答复或处置期限已到，或原有争议已不再延续。"
 nesnd_small_dispute_ended_tt:0 "这轮处置已被革命或政局、国土的变化中断。"
 nesnd_journal_closures_italy_agenda_tt:0 "本国的主流文化已不再包括意大利文化，或已无有人居住的意大利领地。"
 nesnd_journal_closures_italy_agenda_conclusion:0 "意大利的公共建设与政治合作，到此告一段落。"
 nesnd_journal_closures_hus_agenda_tt:0 "原东洲政权已被取代，或旧户籍制度已终止。"
 nesnd_journal_closures_hus_agenda_conclusion:0 "原东洲政府主持的地方工程与公民事务，就此停办。"
 nesnd_journal_closures_usm_agenda_tt:0 "本国已不再属于明吴两朝，已无有人居住的领土，或明吴之争尚未形成定局或停战。"
 nesnd_journal_closures_usm_agenda_conclusion:0 "南朝原定的礼法、教育与实业筹议，没有下文了。"
 nesnd_journal_closures_small_livelihood_tt:0 "本国已转为帝国政权，已不再属于印度地方邦国或南方诸国，或已失去当地有人居住的领土。"
 nesnd_journal_closures_small_livelihood_conclusion:0 "国家的地位或国土变了，地方民生的建设也就停了下来。"
