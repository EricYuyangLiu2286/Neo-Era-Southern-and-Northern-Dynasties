l_simp_chinese:
 nesnd_phi_service_recovery:0 "吕宋驻屯经费"
 nesnd_phi_service_recovery_reason:0 "楚军南渡之后，吕宋的营垒里又添了许多湖广乡音。随林则徐出海的将士在此领饷、操练，把故乡的消息夹在家书里传回军中。群岛要供养这些驻军，也须为朝廷的远洋征调备齐舰船与水手。\n\n宣慰司因而请求重议驻屯军费、海防与岁贡。兵船既听候朝廷征调，军饷与供给便不能长久只取于吕宋州县。地方还要安置军民、屯垦兴业，收入却不断流向营房与舰队。中央肯承担多少，吕宋能够留下多少，关系着这支海外军队与供养它的人们将怎样生活。"
 nesnd_phi_status_external:0 "维持原定军费协定的宗属、市场或和平关系已经改变，补贴不再续付。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_stalled:0 "中央未履行议定的拨款，可能已经陷入[concept_default]或暂停履约。眼前的军民开支须另筹财源。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_pending:0 "两国须在120天内确认议案。签署后才开始拨款，并按议案安排舰船。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_active:0 "中央正在依约拨款，补贴自签订起持续12个月。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_review:0 "补贴已经结束。此后连续三个月维持军费、驻军与民生，即可巩固成果。续签须由两国重新议定。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_proposal:0 "可请求中央分担驻屯军费，或商议分任舰队与地方海防。\n$nesnd_phi_status_details_link$"
 nesnd_phi_service_bar:0 "军民经费"
 nesnd_phi_service_bar_desc:0 "$nesnd_phi_service_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_phi_service_bar_detail:0 "非建设周结余：#v £[Country.MakeScope.Var('nesnd_phi_budget').GetValue|0]#!\n舰队满员所需水手：#v [Country.MakeScope.Var('nesnd_phi_needed_crew').GetValue|0]#!\n无业劳动力：#v [Country.MakeScope.Var('nesnd_phi_unemployment').GetValue|%1]#!\n欠食劳动力：#v [Country.MakeScope.Var('nesnd_phi_starving').GetValue|%1]#!\n\n每月更新。无业与欠食份额均按全国劳动力计算。"
 nesnd_phi_continuity_bar:0 "经费巩固"
 nesnd_phi_continuity_bar_desc:0 "$nesnd_phi_continuity_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_phi_continuity_bar_detail:0 "四项条件：\n财政：非建设收支非负，未陷入[concept_default]，且未受[concept_bankruptcy]惩罚。补贴有效期间，宗主须履行付款。\n陆军：至少#v 35营#!。\n海军：驻屯方案至少#v 40舰#!、海防分任至少#v 20舰#!存活且各有#v 75%#!水手，海军维护履行至少#v 80%#!。\n民生：无业劳动力至多#v 12%#!，欠食劳动力至多#v 15%#!。\n\n和平且四项达标时，每月增加#p 1个月#!。条件中断或补贴结束，连续月份归零。军费协定曾经生效，且补贴结束后连续#v 3个月#!达标，日志即可完成。"
 nesnd_phi_request_a_button:0 "议定驻屯军费"
 nesnd_phi_request_a_button_desc:0 "请中央依双方已有的政治承诺，分担海外驻屯军费。\n\n$nesnd_phi_route_1_terms_tt$"
 nesnd_phi_request_b_button:0 "议定海防分任"
 nesnd_phi_request_b_button_desc:0 "请中央接管远洋战舰，吕宋留下护卫舰与西府驻屯大营，分任群岛海防。\n\n$nesnd_phi_route_2_terms_tt$"
 nesnd_phi_cancel_request_button:0 "撤回议案"
 nesnd_phi_cancel_request_button_desc:0 "撤回尚未签成的议案，30天后可重提。已有外交协定仍然有效。"
 nesnd_phi_withdraw_button:0 "提前终止钱款协定"
 nesnd_phi_withdraw_button_desc:0 "由吕宋提前退出议定的补贴条约。约束期内退出将招致条约规定的恶名与关系损失。减贡、免役及其他条约仍依各自条款履行，已经移交的舰船仍归中央。"
 nesnd_phi_route_1_terms_tt:0 "中央每周向吕宋支付#v £8,000#!，持续#v 12个月#!。另以减贡协定将收入转移比例降低#v 10个百分点#!。吕宋保留舰队与驻军。中央须有至少#v £10,000#!非建设周结余、#v £100,000#!储备，并具备签署两项协定的资格。补贴条约于一年后撤回，减贡协定仍依自身条款履行。"
 nesnd_phi_route_2_terms_tt:0 "首次签订时，吕宋向中央移交所持且未参战的#v 20艘战列舰#!，保留#v 20艘护卫舰#!与驻屯军。中央每周支付#v £3,000#!，持续#v 12个月#!，并另行签署减贡与免役协定。中央须有至少#v £5,000#!非建设周结余、#v £60,000#!储备。续签不再交舰。一年后补贴结束，减贡与免役仍依各自条款履行。"
 nesnd_phi_usm_accept_tt:0 "核准议案，交吕宋最后确认。签署时双方仍须符合议定的财力、宗属与舰队条件，方可拨款、交舰。"
 nesnd_phi_reject_tt:0 "退回议案，90天后可再提。"
 nesnd_phi_defer_tt:0 "本次不签约，30天后可再议。"
 nesnd_phi_finance.reject:0 "此项开支暂不核拨。"
 nesnd_phi_finance.defer:0 "退回重议。"
 nesnd_phi_finance.cancel:0 "暂缓签署。"
 nesnd_phi_finance.1.t:0 "吕宋军饷"
 nesnd_phi_finance.1.d:0 "吕宋宣慰司以北朝威胁渐消为由，要求朝廷重新分担驻屯军与远洋舰队的开销。兵船本来就听候朝廷征调，军饷和日常供给却长久取于吕宋州县，地方既要纳贡，又要供养随时可能出海的军队。\n\n宣慰司认为，吕宋虽大，南蛮宾服，又靠近中国腹地，眼前更迫切的事务已是屯垦殖业。若收入尽用于养兵，地方便难以恢复生计，而兵船最后也无从得到长久供养。议案因此请中央每周拨给#v £8,000#!，支给一年，并另行减贡。这笔军费应当由谁承担，如今要请朝廷作出答复。"
 nesnd_phi_finance.1.a:0 "准此军费，交吕宋核议。"
 nesnd_phi_finance.2.t:0 "水师归朝"
 nesnd_phi_finance.2.d:0 "吕宋提议分任远洋与群岛海防，南洋分遣舰队中的战列舰归入三洋水师本队，由中央安排远洋征调与供养。轻装护卫舰留守群岛，西府驻屯大营也继续由宣慰司编练，以备威慑岛内生番诸部。\n\n这套分任的办法，要把朝廷的远洋事业同吕宋的地方开支分开。宣慰司请求免除从征义务、减轻岁贡，并由中央每周支付#v £3,000#!，支给一年。地方希望把省下的财源用于殖产兴业，使军民摆脱战争以来的低迷。朝廷接过战舰，也就要接过养舰的负担。"
 nesnd_phi_finance.2.a:0 "元辅此议有理，准。"
 nesnd_phi_finance.3.t:0 "核拨文书"
 nesnd_phi_finance.3.d:0 "中央已核准驻屯军费，愿意每周拨给#v £8,000#!，支给一年，减贡条款也列入了议案。驻屯大营与吕宋分队照旧部署，不必归入朝廷本队。\n\n宣慰司争取到了分担开支的机会，军队与舰船却仍须由吕宋维持。签署以后，这笔钱应当怎样兼顾营饷与民生，便要由我们自己安排。"
 nesnd_phi_finance.3.a:0 "这真的是杭州的指示吗？钤印，依约支用。"
 nesnd_phi_finance.4.t:0 "大船归队"
 nesnd_phi_finance.4.d:0 "中央已经同意分任海防的提议。按此安排，战列舰归朝廷本队，护卫舰与西府驻屯大营留在吕宋。中央承担远洋战舰的供养，宣慰司则集中经营群岛的驻屯与海防。\n\n交舰、减贡与免役的安排都在议案之中，每周#v £3,000#!的补贴先支给一年。战舰一经移交，此后便由中央掌管，吕宋若仍有困难，可以再议军费。眼前这一份安排，还等宣慰司最后签署。"
 nesnd_phi_finance.4.a:0 "这真的是杭州的指示吗？钤印，依约支用。"
 nesnd_phi_finance.5.t:0 "支用新章"
 nesnd_phi_finance.5.d:0 "军费协定已经签署，朝廷开始拨付议定的钱款。宣慰司终于可以重新安排经费，不必把群岛的收入都填进营房与舰队的开支。\n\n这一年的援助来得正是时候。安置军户、屯垦兴业，都要赶在拨款结束以前做出些成果。否则明年的同一时候，我们还得为同样的军饷去向朝廷伸手。"
 nesnd_phi_finance.5.a:0 "吕宋州县屯垦兴业，恢复民生，是我责任所在。"
 nesnd_phi_finance.6.t:0 "补贴到期"
 nesnd_phi_finance.6.d:0 "朝廷来信，支给吕宋的年度补贴已经到期。从今以后，宣慰司须以现有收入维持军民事务，再有困难，另行奏请。其余军事与外交义务，仍依各项条陈办理。\n\n营中的将士还要领饷，州县的屯垦也不能停下。我们争取到的一年时间，如今已经用完了。"
 nesnd_phi_finance.6.a:0 "当真是铁公鸡..."
 nesnd_phi_finance.7.t:0 "军费中止"
 nesnd_phi_finance.7.d:0 "原议的拨款已经中止，宣慰司须重新筹措军饷与日常开支。州县能留给屯垦和民生的钱，本来就不充裕，这一下又要从中挪用了。\n\n两国如今的关系已不同于签约之时。要再得到援助，恐怕还得费一番口舌。"
 nesnd_phi_finance.7.a:0 "当真是铁公鸡..."
 nesnd_phi_finance.8.t:0 "营饷有经"
 nesnd_phi_finance.8.d:0 "中央补贴结束以后，吕宋已连续三个月维持军民经费。驻屯大营与水师有饷可领，地方的生产与就业，也能够支持眼前的开支。\n\n宣慰司终于不必每逢筹措军费，就先停下州县的民生事务。海外将士安于驻守，供养他们的军户与百姓，也有了可以经营下去的生计。"
 nesnd_phi_finance.8.a:0 "这是我们的成功。"
 nesnd_phi_finance.10.t:0 "另订条款"
 nesnd_phi_finance.10.d:0 "两国经过交涉，已经改订军费条约。先前议定的拨款与义务，将依新的条款办理。\n\n宣慰司须据此重排开支。何时付款、由谁承担哪些事务，都关系着营饷与州县能够留下多少财源，应当细读新约以后再作打算。"
 nesnd_phi_finance.10.a:0 "哦，哦，让本使检查一下..."

 nesnd_phi_request_cash_a_button:0 "驻屯岁费（定额）"
 nesnd_phi_request_cash_a_button_desc:0 "请中央依双方已有的政治承诺，每周分担驻屯与远洋海防的岁费。\n\n$nesnd_phi_cash_1_terms_tt$"
 nesnd_phi_request_cash_b_button:0 "海防分任（定额）"
 nesnd_phi_request_cash_b_button_desc:0 "议定由中央接管战列舰，吕宋保留护卫舰与驻屯大营，再按分任的军务筹措岁费。\n\n$nesnd_phi_cash_2_terms_tt$"
 nesnd_phi_cash_1_terms_tt:0 "中央每周向吕宋支付#v £8,700#!，持续#v 12个月#!。吕宋保留驻屯军与舰队，贡赋仍依现有宗属关系支付。此约不改贡率与独立倾向。中央须有至少#v £10,000#!非建设周结余、#v £100,000#!储备，并具备签约资格。两国确认后开始付款，一年后结束。"
 nesnd_phi_cash_2_terms_tt:0 "首次签订时向中央移交#v 20艘战列舰#!，吕宋保留#v 20艘护卫舰#!与驻屯军。符合资格后免除军事服务。中央每周支付#v £3,700#!，持续#v 12个月#!。贡赋仍按原有比例支付。中央须有至少#v £5,000#!非建设周结余、#v £60,000#!储备。续签不再交舰。一年后仅结束这项补贴。"
 nesnd_phi_finance.11.t:0 "驻屯岁费"
 nesnd_phi_finance.11.d:0 "吕宋请求中央分担驻屯与海防的岁费。宣慰司愿意照旧解送贡赋，但认为听候朝廷征调的军队与舰船，也应从中央国库取得一部分供养。\n\n此次议案请每周支付#v £8,700#!，支给一年。朝廷的远洋军力与吕宋的地方生计，都从群岛取得财源。若只让州县承担，地方恢复生产的余地便将日益缩小。"
 nesnd_phi_finance.11.a:0 "核准岁费，交吕宋签议。"
 nesnd_phi_finance.12.t:0 "岁费签押"
 nesnd_phi_finance.12.d:0 "中央已经核准每周#v £8,700#!、支给一年的补贴。贡赋照旧解送，舰队与驻屯大营也继续由宣慰司维持，朝廷则从国库分担一部分开支。\n\n拨款尚待吕宋最后签署。这笔岁费能减轻眼前的压力，却不能替我们料理地方。如何让营中将士得到供养，也让州县能够恢复生计，仍是宣慰司的责任。"
 nesnd_phi_finance.12.a:0 "签押，分册支用。"
 nesnd_phi_finance.13.t:0 "分任海防岁费"
 nesnd_phi_finance.13.d:0 "吕宋请求按远洋与地方海防分任军务：二十艘战列舰交由中央海军掌管，驻地、船员与供给也由中央安排，护卫舰和驻屯大营则留守群岛。归队后的战舰，由朝廷持续供养。\n\n宣慰司照旧解送贡款，另请每周#v £3,700#!、支给一年的补贴，并依议定条件免除从征义务。地方希望从不断筹措远洋军需的负担中腾出手来，经营自己的屯垦与民生。"
 nesnd_phi_finance.13.a:0 "按册分任，核拨岁费。"
 nesnd_phi_finance.14.t:0 "交舰与岁费"
 nesnd_phi_finance.14.d:0 "中央已经接受分任海防的提议。依照章程，二十艘战列舰归中央掌管，护卫舰与驻屯军留守群岛。交出的战舰，今后由中央承担供养。\n\n宣慰司将取得每周#v £3,700#!、支给一年的补贴，贡赋与免役另依各自条款办理。军务分定，留下的财源便要用来维持吕宋自己的生计。这份协定还等我们最后签署。"
 nesnd_phi_finance.14.a:0 "签押，照册交接。"

 nesnd_phi_propose_native_a_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟议条款：\n\n$nesnd_phi_route_1_terms_tt$"

