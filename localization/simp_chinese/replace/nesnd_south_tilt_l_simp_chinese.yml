 nesnd_south_balance_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_balance_tt 政治天平的摆动#!#!"
 nesnd_tilt_line_election_p2:0 "#p 选举制度：蜀、楚、淮与吕宋每月 +2#!"
