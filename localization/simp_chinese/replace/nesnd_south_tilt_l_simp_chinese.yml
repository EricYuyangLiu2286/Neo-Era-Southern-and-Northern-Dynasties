 nesnd_tilt_src_envoy:0 "他国遣使"
 nesnd_tilt_src_declared:0 "本藩表态"
 nesnd_tilt_declare_ming_button:0 "表态支持明室"
 nesnd_tilt_declare_ming_button_desc:0 "本藩奉大明正朔，天下共知。"
 nesnd_tilt_declare_ming_tt:0 "政治天平每月 #v −1#!，持续 #v 6#! 个月。#v 12#! 个月后可再次表态。"
 nesnd_tilt_declare_wu_button:0 "表态支持郑氏"
 nesnd_tilt_declare_wu_button_desc:0 "本藩的前程在杭州，不在金陵。"
 nesnd_tilt_declare_wu_tt:0 "政治天平每月 #v +1#!，持续 #v 6#! 个月。#v 12#! 个月后可再次表态。"
 nesnd_tilt_declare_cooldown_tt:0 "距上次表态已满 #v 12#! 个月。"
 nesnd_south_side_ming_button:0 "忠于明室"
 nesnd_south_side_ming_button_desc:0 "世受国恩，岂能坐视权臣窃国！"
 nesnd_south_side_ming_tt:0 "我国站到明室一边。蜀、楚、淮的政治天平每月 #v −1#!。#v 12#! 个月内不能再改。"
 nesnd_south_side_wu_button:0 "追随郑氏"
 nesnd_south_side_wu_button_desc:0 "从牧氏的铁蹄下拯救了南朝的是郑氏，不是金陵宫城里的朱家天子。"
 nesnd_south_side_wu_tt:0 "我国追随郑氏。#v 12#! 个月内不能再改。"
 nesnd_south_side_cooldown_tt:0 "距上次改换立场已满 #v 12#! 个月。"
 nesnd_south_pledge_full_tt:0 "改制承诺已满 #v 100#!。"
 nesnd_south_lock_effect_tt:0 "各属国按政治天平定下立场。\n有属国起兵时，郑氏易代，第二次靖难战争同日开始。\n无人起兵时，不经战争而定局。"
 nesnd_south_tilt.100.t:0 "图穷匕见"
 nesnd_south_tilt.100.d:0 "杭州南府的檄文到了。吴王以“天命改易”为辞，限令各藩在十日之内上表劝进，逾期者以叛逆论。三年来在礼议会、报馆与书院里争了又争的那个问题，南府不打算再争下去了。\n\n"
 nesnd_south_tilt.100.f:0 "“今日一见，朱家小子亦凡人尔。”\n——郑昭"
 nesnd_south_tilt.100.a:0 "$usm_civilwar.1.1$"
 nesnd_south_tilt.100.b:0 "朱家与郑家，都不配再做天下的主人。"
 nesnd_south_tilt.100.c_cne:0 "遣使北上，请$nesnd_lobby_name_cne$出兵。"
 nesnd_south_tilt.100.c_qe1:0 "遣使西行，请$nesnd_lobby_name_qe1$出兵。"
 nesnd_south_tilt.100.c_hus:0 "遣使渡海，请$nesnd_lobby_name_hus$庇护。"
 nesnd_south_tilt.100.i:0 "本藩从此自理国政，内地的战事与我无涉。"
 nesnd_south_tilt.100.e:0 "谨守封疆，静观其变。"
 nesnd_south_tilt.100.w:0 "$usm_civilwar.1.3$"
 nesnd_south_tilt.100.g:0 "$usm_civilwar.1.2$"
 nesnd_south_tilt.100.h:0 "大势已去，上表称臣。"
 nesnd_south_tilt.110.t:0 "$flavorUSM.4.t$"
 nesnd_south_tilt.110.d:0 "吴王郑钦薨，其子郑莒嗣位。当是时，南京百官不论出身，俱来杭州朝贺。以至于宁王系的明恭宗朝会上唯有故帅朱班博之子，兵部侍郎朱绛臣仍在。如此三日后，吴国辅郝廷疆与吴臣十人入金陵宫城。次日，明恭宗行效尧舜，禅让于吴。郑莒登基称帝，建号大吴。大赦，改元天演。\n\n消息传出，不肯奉大吴正朔的藩镇以“反吴复明，奉天靖难”为旗帜举兵。"
 nesnd_south_tilt.110.d_peace:0 "吴王郑钦薨，其子郑莒嗣位。当是时，南京百官不论出身，俱来杭州朝贺。以至于宁王系的明恭宗朝会上唯有故帅朱班博之子，兵部侍郎朱绛臣仍在。如此三日后，吴国辅郝廷疆与吴臣十人入金陵宫城。次日，明恭宗行效尧舜，禅让于吴。郑莒登基称帝，建号大吴。大赦，改元天演。\n\n各藩或上表称贺，或闭境自守，竟无一家举兵。"
 nesnd_south_tilt.110.f:0 "$flavorUSM.4.f$"
 nesnd_south_tilt.110.a:0 "$flavorUSM.4.1$"
 nesnd_south_tilt.111.t:0 "杭州三日"
 nesnd_south_tilt.111.d:0 "各藩无一家肯为郑氏火中取栗，杭州的南府一夜之间成了孤城。明廷没有给吴王父子留下任何辩白的机会：忠于朱室的兵马封锁了五军都督府行在，郑钦、郑莒父子及其亲信被就地处决，南府的属官、幕僚与归化倭人卫队遭到了整整三日的搜杀。把持朝政数十年的吴王一系，就此断绝。\n\n邓明舆又一次及时地背叛了自己的恩主，摇身成为江浙绅商在新朝廷里的代言人。\n\n然而，权力的斗争是永无止息的。明廷众正盈朝，却又围绕南府覆灭之后的权力真空开始了新一轮的争抢。但这一次，拥有政治理想的人们将不再被南府的阴云所笼罩......或许也不再为它所护佑？"
 nesnd_south_tilt.111.f:0 "“多行不义，必自毙。”\n——《左传·隐公元年》"
 nesnd_south_tilt.111.a:0 "肃清逆党！"
 nesnd_south_tilt.111.tt:0 "郑钦、郑莒已死。邓明舆成为实业家集团的领袖。南朝的争端不经战争而定局。"
 nesnd_south_tilt.120.t:0 "错失良机"
 nesnd_south_tilt.120.d_wu:0 "南朝的藩镇曾遣使求援，许诺内应。然而郑氏代明竟未遇到任何像样的抵抗，各藩或称臣，或自守，求援的使者也再无下文。[ROOT.GetCountry.GetName]原本可以借这场内乱在南方有所作为，如今只能眼看着一个完整的大吴立于江南。"
 nesnd_south_tilt.120.d_ming:0 "南朝的藩镇曾遣使求援，许诺内应。然而杭州的南府一夜覆灭，明廷重掌大权，求援的使者也再无下文。[ROOT.GetCountry.GetName]原本可以借这场内乱在南方有所作为，如今只能眼看着南朝度过了这场危机。"
 nesnd_south_tilt.120.f:0 "“天与弗取，反受其咎。时至不行，反受其殃。”\n——《史记·淮阴侯列传》"
 nesnd_south_tilt.120.a:0 "来日方长。"
 nesnd_south_tilt.130.t:0 "襄阳共和"
 nesnd_south_tilt.130.d:0 "[ROOT.GetCountry.GetName]脱离了南朝，襄阳城中的共和派掌握了局面。眼下要推举一位领袖。一派属意朱班博当年的后继者、远在吕宋的林则徐，愿意秘密迎他回国。另一派认为朱班博之子朱绛臣就在军中，名正言顺。"
 nesnd_south_tilt.130.f:0 "“先帅若在，襄阳何至于仰人鼻息。”\n——襄阳军中的议论"
 nesnd_south_tilt.130.a:0 "迎林则徐回国。"
 nesnd_south_tilt.130.b:0 "推举朱绛臣。"
 nesnd_south_tilt.131.t:0 "佛国"
 nesnd_south_tilt.131.d:0 "[ROOT.GetCountry.GetName]宣布自理国政的当夜，掌兵的杨秀清以“清君侧”为名带兵入宫。腐朽的淮王一系没有做出任何像样的抵抗，淮王朱仲桯与世子朱靖堙被处死。杨秀清随即宣布废除王号，奉佛法治国，以科举选出的士人议政。"
 nesnd_south_tilt.131.f:0 "“一切有为法，如梦幻泡影。”\n——《金刚经》"
 nesnd_south_tilt.131.a:0 "天命已去朱家。"
 nesnd_south_tilt.131.tt:0 "淮王一家已死。杨秀清成为统治者，淮国改行神权制与科举投票制。"
 nesnd_south_peace_secession_tt:0 "#n 谋求独立的割据藩镇发动了战争！#!"
 nesnd_south_loyal_autonomy:0 "拥戴之功"
 nesnd_board_tilt_row:0 "[Country.GetCustom('nesnd_board_tilt_loc')]"
 nesnd_board_tilt_line:0 "$nesnd_south_tilt_bar$ #v [Country.MakeScope.Var('nesnd_tilt_value').GetValue|0]#!（本月 [Country.MakeScope.Var('nesnd_tilt_delta').GetValue|+0]）"
 nesnd_board_tilt_none:0 ""
 nesnd_south_tilt.1.a_tt:0 "$nesnd_lobby_name_sih$、$nesnd_lobby_name_hna$、$nesnd_lobby_name_gng$的政治天平每月 #v −1#!\n$nesnd_lobby_name_dei$的政治天平每月 #v +1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.1.b_tt:0 "$nesnd_lobby_name_phi$的政治天平每月 #v −1#!\n$nesnd_lobby_name_dei$的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.1.t:0 "飞鸟尽，良弓藏"
 nesnd_south_tilt.1.d:0 "自西元1818年吴国主郑钦收纳南逃的共和党人、推陈东阳为首辅以来，南朝的改革已经进行了十八个年头。废藩改省，旧日的诸侯被恩养在京师，地方交给布政、按察、指挥三使司。削弱勋贵特权，武勋世家不得再直接统兵，免税的田额一律撤销，换成按额发放的年金，卫所的屯田则被赎买，投入市场任由富户与种植园公司竞购。到今天，南朝的藩王只剩下蜀、淮两家。\n\n这一切都以首辅的名义颁行，却无一不仰赖南府的舰队与银库。陈东阳想要的“国人共和”，在郑钦看来不过是扫除藩镇的一件利器。如今藩镇已去，共和派却还想把礼议会的权柄伸到南府头上，吴王的耐心也就到了尽头。陈东阳被罢免，邓明舆取而代之，金陵的礼议会噤若寒蝉。\n\n明朝朱姓，还是吴国郑氏？[ROOT.GetCountry.GetName]再也不能装作听不见这个问题了。"
 nesnd_south_tilt.1.f:0 "“予取予求，孤当自专。”\n——郑钦"
 nesnd_south_tilt.2.a:0 "公开审理。让天下人看看是谁在乡间煽动暴乱。"
 nesnd_south_tilt.2.a_tt:0 "$nesnd_lobby_name_hna$的政治天平每月 #v +1#!\n$nesnd_lobby_name_phi$的政治天平每月 #v +1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v −2#!\n$nesnd_lobby_name_sih$的政治天平每月 #v −2#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.2.b:0 "此案不宜张扬。禁止报章刊载，庭外了结。"
 nesnd_south_tilt.2.b_tt:0 "$nesnd_lobby_name_hna$的政治天平每月 #v −1#!\n$nesnd_lobby_name_phi$的政治天平每月 #v −1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v +2#!\n$nesnd_lobby_name_sih$的政治天平每月 #v +2#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.2.t:0 "卫所田案"
 nesnd_south_tilt.2.d:0 "按照废除田额的章程，一处卫所的屯田被朝廷赎买，即将公开拍卖。共和派中的激进分子却下乡鼓动农民，要求把这片土地直接分给耕种它的人。世代从勋贵手中承租这片田地的一户承租地主坚称土地理应归他所有，拒不退让。愤怒的农民冲进了他的宅院，他的家人在冲突中受伤。\n\n这户人家托了关系，把案子直接递进刑部，刑部决定公开开庭。一桩乡间的田土纠纷，就此成了地主、勋旧与共和派在全国报章上的角力场：是借这桩案子敲打共和派的激进分子，还是把它压下去，以免改革的名声受损？"
 nesnd_south_tilt.2.f:0 "“官家赎了老爷的田，没说赎不赎我们的命。”\n——涉案乡民在刑部堂上的供词"
 nesnd_south_tilt.3.a:0 "屯垦地是朝廷自己的地方，理应先出这笔钱。"
 nesnd_south_tilt.3.a_tt:0 "$nesnd_lobby_name_phi$的政治天平每月 #v −1#!\n$nesnd_lobby_name_dei$的政治天平每月 #v −1#!，持续 #v 12#! 个月。"
 nesnd_south_tilt.3.b:0 "藩王与土王受庇护多年，也该出一份力了。"
 nesnd_south_tilt.3.b_tt:0 "南洋诸邦的政治天平每月 #v −1#!\n中南半岛诸藩的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.3.t:0 "年金从何而来"
 nesnd_south_tilt.3.d:0 "撤销田额换来的年金，头一年由赎买卫所屯田的款项抵付。这笔钱如今成了户部账上最大的亏空。南府遥制之下，税款层层经手，实际入库的总不足额。首辅邓明舆拿出的办法只有加派海外：或者向$nesnd_lobby_name_phi$与$nesnd_lobby_name_dei$这些朝廷直辖的屯垦地多要，或者把数目摊到南洋的藩王与土邦头上。无论选哪一种，海外都要有人替内地的改革付账。"
 nesnd_south_tilt.3.f:0 "“百姓足，君孰与不足？百姓不足，君孰与足？”\n——《论语·颜渊》"
 nesnd_south_tilt.4.a:0 "这是《国制大纲》许过的事，可以放宽。"
 nesnd_south_tilt.4.a_tt:0 "$nesnd_lobby_name_hna$的政治天平每月 #v +1#!\n$nesnd_lobby_name_phi$的政治天平每月 #v +1#!\n$nesnd_lobby_name_yn1$的政治天平每月 #v +1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v −1#!\n$nesnd_lobby_name_sih$的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.4.b:0 "礼议会是议事的地方，不是发号施令的地方。"
 nesnd_south_tilt.4.b_tt:0 "$nesnd_lobby_name_hna$的政治天平每月 #v −1#!\n$nesnd_lobby_name_phi$的政治天平每月 #v −1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v +1#!\n$nesnd_lobby_name_sih$的政治天平每月 #v +1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.4.t:0 "杭州夜议"
 nesnd_south_tilt.4.d:0 "共和派上书，要求扩大代议制，让礼议会有更多的议席和更大的权限。吴王[SCOPE.sCharacter('nesnd_wu_king').GetFullName]在杭州南府召见吴国辅郝廷疆与首辅邓明舆。郝廷疆以为，礼议会本是朝廷赐给士绅的体面，体面不可以变成权柄。邓明舆则提醒吴王，$nesnd_lobby_name_hna$与$nesnd_lobby_name_phi$的官吏多出自共和派门下，一味驳回只会把他们推向金陵。\n\n《国制大纲》写着“众人天下”。这四个字究竟算不算数，今夜要有一个说法。"
 nesnd_south_tilt.4.f:0 "“民惟邦本，本固邦宁。”\n——《尚书·五子之歌》"
 nesnd_south_tilt.5.a:0 "照旧例加贡。"
 nesnd_south_tilt.5.a_tt:0 "中南半岛诸藩的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.5.b:0 "减免贡额，换他们的兵。"
 nesnd_south_tilt.5.b_tt:0 "中南半岛诸藩的政治天平每月 #v +1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v −1#!\n$nesnd_lobby_name_sih$的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.5.t:0 "职贡之议"
 nesnd_south_tilt.5.d:0 "中南半岛诸藩岁输贡米与方物，朝廷则为它们抵御外侮。如今户部主张照旧例加贡，以补赎买之费。兵部却更看重这些藩王的兵：减免贡额，换他们在将来随朝廷出征。藩王们的使者已经在杭州等了一个月，等朝廷拿出定议。"
 nesnd_south_tilt.5.f:0 "“溥天之下，莫非王土。率土之滨，莫非王臣。”\n——《诗经·小雅·北山》"
 nesnd_south_tilt.6.a:0 "废藩改省，不该止于海岸。"
 nesnd_south_tilt.6.a_tt:0 "南洋诸邦的政治天平每月 #v −2#!\n$nesnd_lobby_name_dei$的政治天平每月 #v +2#!\n$nesnd_lobby_name_phi$的政治天平每月 #v +1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.6.b:0 "海外不比内地，旧封仍旧。"
 nesnd_south_tilt.6.b_tt:0 "南洋诸邦的政治天平每月 #v +1#!\n$nesnd_lobby_name_dei$的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.6.t:0 "流官渡海"
 nesnd_south_tilt.6.d:0 "内地的藩国已经改成行省，南洋的藩王与土王却仍旧各领其地。$nesnd_lobby_name_dei$上书，请将邻近的几处土邦改设流官，归宣慰司节制。南洋诸邦的使者则在杭州四处陈情：他们的祖辈凭着吴国的册封才坐稳了王位，朝廷不应自毁信义。\n\n废藩改省在内地流了多少血，南府的人都还记得。"
 nesnd_south_tilt.6.f:0 "“诸侯不死，新法难成！”\n——陈东阳《废藩疏》"
 nesnd_south_tilt.7.a:0 "陈东阳虽已去位，他的道理并没有错。"
 nesnd_south_tilt.7.a_tt:0 "$nesnd_lobby_name_gng$的政治天平每月 #v −3#!\n$nesnd_lobby_name_sih$的政治天平每月 #v −3#!\n$nesnd_lobby_name_hna$的政治天平每月 #v −1#!\n$nesnd_lobby_name_phi$的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.7.b:0 "天子有旨，臣下奉行而已。"
 nesnd_south_tilt.7.b_tt:0 "$nesnd_lobby_name_hna$的政治天平每月 #v −3#!\n$nesnd_lobby_name_phi$的政治天平每月 #v −1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v −1#!\n$nesnd_lobby_name_sih$的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.7.t:0 "金陵的枪声"
 nesnd_south_tilt.7.d:0 "共和派吸引来的年轻士人与劳工在金陵街头示威，被奉旨弹压的明朝军队拦住。没有人料到皇帝会站在保守派一边。他同情那些在改革中失去特权的勋贵旧友。军队向人群开了火。\n\n血案之后的礼议会上，已经去位却尚未离京的陈东阳与朱绛臣等激进派，同淮王朱仲桯为首的保皇派针锋相对。广东学政梅铮与日本丰臣家的代表渡边华山领着直属各省的议员表态观望。辩论的走向，取决于温和派的邓明舆和南府的郝廷疆。\n\n无论南府怎样选，有两件事已经无可挽回：共和派正在脱离帝国的控制，帝国也不愿再把“国人共和”扩大下去。"
 nesnd_south_tilt.7.f:0 "“防民之口，甚于防川。”\n——《国语·周语上》"
 nesnd_south_tilt.9.a:0 "化外之地，非兵威不能移风易俗。"
 nesnd_south_tilt.9.a_tt:0 "中南半岛诸藩的政治天平每月 #v −1#!\n南洋诸邦的政治天平每月 #v −1#!\n$nesnd_lobby_name_sih$的政治天平每月 #v +1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v +1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.9.b:0 "海外初定，宜从缓。"
 nesnd_south_tilt.9.b_tt:0 "$nesnd_lobby_name_phi$的政治天平每月 #v +1#!\n$nesnd_lobby_name_dei$的政治天平每月 #v +1#!\n$nesnd_lobby_name_yn1$的政治天平每月 #v +1#!\n中南半岛诸藩的政治天平每月 #v +1#!\n$nesnd_lobby_name_sih$的政治天平每月 #v −1#!\n$nesnd_lobby_name_gng$的政治天平每月 #v −1#!，持续 #v 6#! 个月。"
 nesnd_south_tilt.9.t:0 "用夏变夷"
 nesnd_south_tilt.9.d:0 "海外各地应否改从华俗，朝中吵了多年。出人意料的是，保守派与进步派混杂的西府在这件事上最为激烈：他们主张禁绝土语土俗，有不从者以兵镇压了事。$nesnd_lobby_name_phi$与南洋屯垦地出身的共和派实务官僚则请朝廷缓行，不要过分刺激海外。缅甸等藩王国的代表只求保住自己的自治和文化。"
 nesnd_south_tilt.9.f:0 "“吾闻用夏变夷者，未闻变于夷者也。”\n——《孟子·滕文公上》"
 nesnd_south_tilt.1.common_tt:0 "选举延期，政府不得改组，直到内战爆发或和平定局。实业家与地主的势力和吸引力 #v +15%#!。合法性在一年内提高。所有附庸的自主欲望每月上升。"
 nesnd_south_tilt.1.a:0 "天下事出于杭州，早已不是一日。"
 nesnd_south_tilt.1.b:0 "首辅是天子的首辅，不是吴王的家臣。"
 nesnd_south_tilt.50.t:0 "请饷"
 nesnd_south_tilt.50.d:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName]的驻军已有数月没有领到全饷，营中军心浮动。[SCOPE.sCountry('nesnd_tilt_subject').GetName]的官员上书户部，请朝廷拨款补足欠饷，并说再拖下去，就只能向本地的商户和田主摊派。"
 nesnd_south_tilt.50.f:0 "“……营中存粮仅支半月，伏乞速拨。”\n——[SCOPE.sCountry('nesnd_tilt_subject').GetName]的请饷文书"
 nesnd_south_tilt.50.a:0 "照数拨给。"
 nesnd_south_tilt.50.b:0 "户部无款，令其自筹。"
 nesnd_south_tilt.51.t:0 "厘金归谁"
 nesnd_south_tilt.51.d:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName]境内的海关和厘卡每年收入可观。户部要求把这笔税款全数解送金陵，[SCOPE.sCountry('nesnd_tilt_subject').GetName]的官员则请求留下一半，用于本地的学校、道路和驻军。户部的理由是，各地若都自留税款，朝廷就无从统筹开支。"
 nesnd_south_tilt.51.f:0 "“仓廪实则知礼节，衣食足则知荣辱。”\n——《管子·牧民》"
 nesnd_south_tilt.51.a:0 "留给地方。"
 nesnd_south_tilt.51.b:0 "全数解送户部。"
 nesnd_south_tilt.52.t:0 "营兵滋事"
 nesnd_south_tilt.52.d:0 "驻在[SCOPE.sCountry('nesnd_tilt_subject').GetName]的官军与本地人起了冲突，死伤数人。[SCOPE.sCountry('nesnd_tilt_subject').GetName]的官府要审理此案，带兵的将官却不肯交人，说是本地人先动的手。两边的公文都送到了金陵，等朝廷裁断。"
 nesnd_south_tilt.52.f:0 "“贼来如梳，兵来如篦。”\n——[SCOPE.sCountry('nesnd_tilt_subject').GetName]乡间的谚语"
 nesnd_south_tilt.52.a:0 "惩办军官。"
 nesnd_south_tilt.52.b:0 "军纪自有军法，地方不得过问。"
 nesnd_south_tilt.53.t:0 "科场学额"
 nesnd_south_tilt.53.d:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName]的士绅联名请求增加本地书院的学额。书院监生是礼议院议员的预备，学额多了，将来就有更多[SCOPE.sCountry('nesnd_tilt_subject').GetName]的子弟能考进礼议院。别省的学政已经表示反对，担心学额一旦松动，各地都会来争。"
 nesnd_south_tilt.53.f:0 "“学而优则仕。”\n——《论语·子张》"
 nesnd_south_tilt.53.a:0 "准其增额。"
 nesnd_south_tilt.53.b:0 "学额自有定制。"
 nesnd_south_tilt.54.t:0 "使者入杭"
 nesnd_south_tilt.54.d:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName]的使者没有去金陵朝见天子，而是径直到了杭州，求见吴王。按旧例，来使应先到金陵，由礼部引见。南府若以厚礼相待，就等于当众表明，杭州也可以替朝廷接待来使。"
 nesnd_south_tilt.54.f:0 "“礼尚往来。”\n——《礼记·曲礼上》"
 nesnd_south_tilt.54.a:0 "厚加赏赐。"
 nesnd_south_tilt.54.b:0 "令其先往金陵朝见天子。"
 nesnd_south_tilt.55.t:0 "盐引之争"
 nesnd_south_tilt.55.d:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName]请户部增发本地的盐引。盐引的数目由户部核定，只有持引的盐商才能运销官盐。增发可以压低[SCOPE.sCountry('nesnd_tilt_subject').GetName]的盐价，原先持引的盐商却要让出一部分生意，他们已经联名递了呈文。"
 nesnd_south_tilt.55.f:0 "“天下熙熙，皆为利来。天下壤壤，皆为利往。”\n——《史记·货殖列传》"
 nesnd_south_tilt.55.a:0 "准增盐引。"
 nesnd_south_tilt.55.b:0 "盐引仍按原额核发。"
 nesnd_south_tilt.56.t:0 "海防协饷"
 nesnd_south_tilt.56.d:0 "朝廷整顿海防，要添造战船、修筑炮台，户部按各地的财力摊派协饷，[SCOPE.sCountry('nesnd_tilt_subject').GetName]分到的一份不小。[SCOPE.sCountry('nesnd_tilt_subject').GetName]的官员上书称本地财力有限，请求减免。"
 nesnd_south_tilt.56.f:0 "“兵者，国之大事，死生之地，存亡之道，不可不察也。”\n——《孙子兵法·始计》"
 nesnd_south_tilt.56.a:0 "免其协饷。"
 nesnd_south_tilt.56.b:0 "照数摊派。"
 nesnd_south_tilt.57.t:0 "灾年请免"
 nesnd_south_tilt.57.d:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName]遭了灾，田亩歉收，不少人家已经断粮。[SCOPE.sCountry('nesnd_tilt_subject').GetName]的官员请求截留本年应解户部的税银，就地买粮赈济灾民。"
 nesnd_south_tilt.57.d_tribute:0 "[SCOPE.sCountry('nesnd_tilt_subject').GetName]遭了灾，不少人家已经断粮。[SCOPE.sCountry('nesnd_tilt_subject').GetName]派使者到金陵，请求免去今年应缴的贡赋，把这笔钱粮留在本国赈济灾民。"
 nesnd_south_tilt.57.f:0 "“民为贵，社稷次之，君为轻。”\n——《孟子·尽心下》"
 nesnd_south_tilt.57.a:0 "准其所请。"
 nesnd_south_tilt.57.b:0 "照常解送，不得减免。"
