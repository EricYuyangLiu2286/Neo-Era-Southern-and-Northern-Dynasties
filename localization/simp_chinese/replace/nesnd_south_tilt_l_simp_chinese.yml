 nesnd_south_allegiance:0 "[ROOT.GetCountry.GetName]藩的命运"
 nesnd_south_allegiance_reason:0 "[ROOT.GetCountry.GetCustom('nesnd_south_allegiance_reason_loc')]"
 nesnd_south_allegiance_status_ming:0 "本藩忠心日月可鉴，绝不允许倭吴贼子窃据大权！"
 nesnd_south_allegiance_status_neutral:0 "南京朝争非外臣可以与闻，藩中诸君子只求保境安民。"
 nesnd_south_allegiance_status_wu:0 "且看今日之南朝乃是谁人之天下？无能朱氏及其蠢臣不过是螳臂当车而已。"
 nesnd_south_allegiance_conclusion:0 "[ROOT.GetCountry.GetName]的立场已定。"
 nesnd_south_allegiance_invalid_conclusion:0 "[ROOT.GetCountry.GetName]不再是南朝的属国。"
 nesnd_south_locked_tt:0 "易代压力已满，或改制承诺已满。"
 nesnd_south_fate_effect_tt:0 "按政治天平所在的一侧决定本国的立场：#v −12#! 及以下拥明，#v +12#! 及以上拥吴，其间中立。"
