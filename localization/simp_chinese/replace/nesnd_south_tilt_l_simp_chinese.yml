 nesnd_south_appease_button:0 "安抚藩国"
 nesnd_south_appease_button_desc:0 "派员携恩赏前往，申明我们的好意。"
 nesnd_south_appease_tt:0 "离己方一侧最近、尚未站到己方的属国，政治天平每月向己方移动 #v 1#! 点，持续 #v 6#! 个月。#v 6#! 个月后可再次安抚。"
