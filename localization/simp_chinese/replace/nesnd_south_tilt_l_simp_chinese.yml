 nesnd_lobby_name_dei:0 "[GetGlobalVariable('nesnd_lobby_dei').GetCountry.GetName]"
 nesnd_lobby_name_yn1:0 "[GetGlobalVariable('nesnd_lobby_yn1').GetCountry.GetName]"
 nesnd_south_allegiance_reason_mainland:0 "第二次襄阳会战葬送了朱班博，也葬送了西府诸藩与南府分庭抗礼的本钱。此后吴国的权力侵夺再无人可以抗衡：废藩改省的章程一路西来，勋贵的田额与兵权被年金赎走，昔日的藩镇一个接一个变成了三使司治下的行省。\n\n[ROOT.GetCountry.GetName]还没有忘记自己是谁的臣子。藩中的将吏在暗中联络，等待着郑氏露出篡逆面目的那一天。然而等待本身也是有代价的。每多等一年，南府的舰队和银库就离金陵的御座更近一步。"
 nesnd_south_allegiance_reason_colony:0 "[ROOT.GetCountry.GetName]是朝廷在海外的屯垦地。官军与官吏都由内地派来，饷银和征调出自杭州的南府，名分却系于金陵的天子。杭州罢免首辅之后，这里的人们开始计算：倘若两处朝廷终有一战，海外的屯垦地经得起站错一次吗？"
 nesnd_south_allegiance_reason_vassal:0 "[ROOT.GetCountry.GetName]的王位来自吴国的册封，贡赋也解往杭州，只有朝觐还要去金陵。内地废藩改省的消息一年比一年近，藩中上下都明白，朱家与郑家无论谁胜，下一个被改成行省的都可能是自己。"
 nesnd_south_tilt.100.d_ming:0 "[ROOT.GetCountry.GetName]的回答早已不是秘密。自陈东阳去位以来，藩中文武与郑氏渐行渐远，到今天已无转圜的余地。檄文被当众撕毁。剩下的问题只是打出哪一面旗帜：是奉朱明正朔起兵靖难，是索性另立共和，还是引外兵以自固？"
 nesnd_south_tilt.100.d_neutral:0 "三年里[ROOT.GetCountry.GetName]上下只拿定了一个主意：这场改朝换代的血，不该由本藩来流。回书措辞恭顺，贡赋照旧，至于勤王还是讨逆的兵马，本藩一概不出。"
 nesnd_south_tilt.100.d_wu:0 "[ROOT.GetCountry.GetName]的劝进表早已写好。本藩的商路、官缺与驻军粮饷无一不系于南府。朱家天子于本藩有名而无实，郑氏代明，不过是把早已如此的事情写进诏书。"
 nesnd_tilt_src_concession:0 "朝廷让权"
 da_nesnd_south_concede_autonomy:0 "让权换取效忠"
 da_nesnd_south_concede_autonomy_action_name:0 "$da_nesnd_south_concede_autonomy$"
 da_nesnd_south_concede_autonomy_desc:0 "朝廷放宽对一个拥吴属国的管束，换取它在明室与郑氏之间改变立场。"
 da_nesnd_south_concede_autonomy_action_notification_name:0 "[INITIATOR_COUNTRY.GetName]向[TARGET_COUNTRY.GetName]让权"
 da_nesnd_south_concede_autonomy_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName]放宽了对[TARGET_COUNTRY.GetName]的管束，换取它倒向明室。"
 da_nesnd_south_concede_autonomy_action_notification_third_party_name:0 "[INITIATOR_COUNTRY.GetName]向一个属国让权"
 da_nesnd_south_concede_autonomy_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName]放宽了对我们的管束，希望我们倒向明室。"
 nesnd_south_concede_wu_zone_tt:0 "该国的政治天平在拥吴一侧。"
 nesnd_south_concede_cooldown_tt:0 "距上次向该国让权已满#v 12个月#!。"
 nesnd_south_concede_swing_tt:0 "该国的政治天平每月向明室一侧移动#v 1.5#!，持续#v 12个月#!。如果它的自主程度已无法再提高，它将独立。"
 nesnd_south_concede_keep_tt:0 "吕宋、南洋宣慰司与蜀、楚、淮不得放归独立：该国的自主程度还能再提高。"
