l_simp_chinese:
 nesnd_shu_army_journal:0 "蜀军"
 nesnd_shu_army_journal_reason:0 "蜀中四面皆山，北出剑阁是汉中，东下夔门是荆楚。蜀藩兵马守惯了这些关隘：萧虎力当年凭剑阁挡住北朝，又一度反攻到汉中城下。如今靖难事起，藩府把防北的营伍调转向东，军械与粮饷就地征办，不必等江南转运。\n\n只要我们仍在靖难战事之中，蜀中营伍便按战时规制征调。"
 nesnd_shu_army:0 "蜀军"
 nesnd_shu_army_end_tt:0 "本国参加第二次靖难战争的日志已经结束。"
 nesnd_shu_army_conclusion:0 "靖难战事已了，蜀中营伍撤回原有驻防，战时征调随之停止。"

 nesnd_continue_war_bar_name:0 "继续战争"
 nesnd_continue_war_bar_desc:0 "#tooltippable;tooltip:[JournalEntry.GetTooltipTag],nesnd_continue_war_bar_rules_tt $nesnd_continue_war_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 5#! 个月#!"
 nesnd_continue_war_bar_rules_tt:0 "#title 继续战争#!\n仍有反吴国家未与我国交战时，每月进度 #v +1#!。没有这样的国家时归零。\n满 #v 5#! 个月，朝廷对其中一国发起靖难博弈，其余未参战的反吴国家一并卷入，战争依旧#bold 不许议和#!。\n[concept_truce]不能阻止开战。正在答复残余战事来书，或已成为他国附属的国家不计。"
 nesnd_continue_war_bar_month:0 "尚有反吴国家未参战"

 nesnd_celestial_collapse_mainland_tt:0 "本国在中国大陆已无领土（台湾、海南不计）。"
 nesnd_celestial_collapse_peace_tt:0 "本国没有与任何反吴国家交战，也没有进行中的靖难博弈。"
 nesnd_celestial_collapse_outcome_tt:0 "#bold 天朝帝国解体#!：本国解散所领导的国家集团，所有附属国独立。拥明各国推举一国为#bold 大明行在#!，组成大明联邦。"
 nesnd_celestial_collapse_conclusion:0 "大陆尽失，天朝帝国的名分已无从维持。"

 nesnd_celestial_collapse.1.t:0 "天朝帝国解体"
 nesnd_celestial_collapse.1.d:0 "吴军撤出了中国大陆最后的州县。郑氏朝廷所能号令的，只剩海上的岛屿和沿途的港口。\n\n天朝帝国建立在吴廷对各省、各藩的统辖之上：属邦向吴廷纳贡、出兵，由吴廷代为对外交涉。大陆一失，吴廷既无兵力护持属邦，也无从征收贡赋。吴廷宣布解散天朝帝国，诸属邦各自独立。拥明各国则开始商议推举行在，重建大明的名分。"
 nesnd_celestial_collapse.1.f:0 "一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。\n——《过秦论》贾谊"
 nesnd_celestial_collapse.1.a:0 "海上仍有吴的旗号。"
 nesnd_celestial_collapse.2.a:0 "天朝帝国已成旧名。"

 nesnd_ming_federation_bloc:0 "大明联邦"
 nesnd_celestial_collapse.3.t:0 "大明联邦"
 nesnd_celestial_collapse.3.d:0 "拥明各国推举[ROOT.GetCountry.GetName]为行在。行在政府将以通商为纽带组成大明联邦，其余拥明国家以附庸身份加入，保留各自的政府与军队，奉行在为宗主。\n\n明室天子若仍流寓他处，而未为他国之主，行在将遣使迎驾。"
 nesnd_celestial_collapse.3.f:0 "九族既睦，平章百姓。百姓昭明，协和万邦。\n——《尚书·尧典》"
 nesnd_celestial_collapse.3.a:0 "协和万邦，自行在始。"

 nesnd_celestial_collapse.4.t:0 "行在来使"
 nesnd_celestial_collapse.4.d:0 "[SCOPE.sCountry('nesnd_federation_court').GetName]的使者抵达[ROOT.GetCountry.GetName]，请我国以附庸身份加入大明联邦，奉行在为宗主。\n\n来文同时言明：若我国拒绝，行在将视我国所辖各地为大明故土，保留收复的权利。"
 nesnd_celestial_collapse.4.f:0 "溥天之下，莫非王土，率土之滨，莫非王臣。\n——《诗经·小雅·北山》"
 nesnd_celestial_collapse.4.a:0 "奉行在为宗主，加入大明联邦。"
 nesnd_celestial_collapse.4.b:0 "我国自主其事，不受行在节制。"
 nesnd_celestial_collapse.4.b_tt:0 "[SCOPE.sCountry('nesnd_federation_court').GetName]获得对我国所有领土所在地区的#bold [Concept('concept_claim','$concept_claims$')]#!。"

 nesnd_celestial_collapse.5.t:0 "复立君统"
 nesnd_celestial_collapse.5.d:0 "行在原以共和之制立国。如今既受拥明各国推举，承奉大明正朔，朝中议定改行君主制，奉[SCOPE.sCharacter('nesnd_federation_emperor').GetFullName]为天子。\n\n若原行独裁之制，改为按田产资格选举。技官治国及其他选举规制照旧。"
 nesnd_celestial_collapse.5.f:0 "天无二日，土无二王，家无二主，尊无二上。\n——《礼记·坊记》"
 nesnd_celestial_collapse.5.a:0 "奉天子以正名分。"
