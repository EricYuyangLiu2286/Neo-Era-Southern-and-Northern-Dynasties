 nesnd_india_union.1.d_former_dominion:0 "[SCOPE.sCountry('india_union_prince').GetName]已经脱离我国，成为[SCOPE.sCountry('india_union_empire').GetName]的[concept_dominion]。此事经我国许可在先，[SCOPE.sCountry('india_union_empire').GetName]已付给我国 @money![SCOPE.GetValue('india_union_price')|0] 的补偿。"
