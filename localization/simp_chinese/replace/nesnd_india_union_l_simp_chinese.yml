 nesnd_india_union_ask_dominion_tt:0 "请[SCOPE.sCountry('india_union_host').GetName]接纳我国为[concept_dominion]。[SCOPE.sCountry('india_union_host').GetName]同意后，付给我国 @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0]，并为我国王公记一份王公年金，我国保留自己的州、政府、法律、[concept_treasury]和军队。"
 nesnd_india_union_ask_consent_tt:0 "我国是[ROOT.GetCountry.GetOverlord.GetName]的[concept_subject]，请求须先经[ROOT.GetCountry.GetOverlord.GetName]许可，许可以后才送到[SCOPE.sCountry('india_union_host').GetName]。[SCOPE.sCountry('india_union_host').GetName]同意时，另付给[ROOT.GetCountry.GetOverlord.GetName] @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0] 的补偿。"
