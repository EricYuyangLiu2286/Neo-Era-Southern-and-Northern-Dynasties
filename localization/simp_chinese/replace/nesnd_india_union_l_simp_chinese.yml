 nesnd_india_union_status_consent_invite:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]邀请我国的[concept_subject][ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]加入，愿意付给它 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] 的安置费。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]若接受，将脱离我国，并入[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]或成为[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]的[concept_dominion]。我国许可以后，邀请才送到[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]，[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]仍可以婉拒。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]接受时，[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]付给我国 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|0] 的补偿。"
