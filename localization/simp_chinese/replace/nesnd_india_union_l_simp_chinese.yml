 nesnd_india_union.4.t:0 "请求加入"
 nesnd_india_union.4.d:0 "[ROOT.GetCountry.GetName]可以请求加入[SCOPE.sCountry('india_union_host').GetName]。并入以后，我国的土地与人民由[SCOPE.sCountry('india_union_host').GetName]的政府管辖。成为[SCOPE.sCountry('india_union_host').GetName]的[concept_dominion]，我国保留自己的政府、法律、[concept_treasury]和军队。[SCOPE.sCountry('india_union_host').GetName]若同意，无论哪种方式，都要支付 @money![SCOPE.sCountry('india_union_host').MakeScope.ScriptValue('nesnd_india_grant')|0]，并为我国王公承担一份王公年金。"
