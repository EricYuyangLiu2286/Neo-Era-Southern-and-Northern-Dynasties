l_simp_chinese:
 nesnd_india_diplomacy.1.d6_former:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]加入，愿意支付 @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] 的安置费，并为我国王公承担一份王公年金。[SCOPE.sCountry('india_partner').GetOverlord.GetName]已经以[concept_overlord]的身份许可此事。我国接受邀请，就将脱离[SCOPE.sCountry('india_partner').GetOverlord.GetName]，[SCOPE.sCountry('india_sender').GetName]另付给[SCOPE.sCountry('india_partner').GetOverlord.GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] 的补偿。如果婉拒，我国仍是[SCOPE.sCountry('india_partner').GetOverlord.GetName]的[concept_subject]。"
 nesnd_india_diplomacy.1.d6_own:0 "[SCOPE.sCountry('india_sender').GetName]邀请[ROOT.GetCountry.GetName]并入，愿意支付 @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] 的安置费，并为我国王公承担一份王公年金。我国已经是[SCOPE.sCountry('india_sender').GetName]的[concept_subject]，并入以后，土地与人民由[SCOPE.sCountry('india_sender').GetName]的政府直接管辖。如果婉拒，我国维持现状。"
 nesnd_india_diplomacy.1.d8_merge:0 "[SCOPE.sCountry('india_sender').GetName]请求并入[ROOT.GetCountry.GetName]。它的土地与人民将由我国政府管辖。我国须支付 @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0] 的安置费，并为它的王公承担一份王公年金。"
 nesnd_india_diplomacy.1.d8_dominion:0 "[SCOPE.sCountry('india_sender').GetName]请求成为[ROOT.GetCountry.GetName]的[concept_dominion]，保留它自己的政府、法律、[concept_treasury]和军队。我国须付给[SCOPE.sCountry('india_sender').GetName] @money![SCOPE.sCountry('india_sender').MakeScope.ScriptValue('nesnd_india_request_quote')|0]，并为它的王公承担一份王公年金。"
 nesnd_india_diplomacy.1.merge:0 "并入[SCOPE.sCountry('india_sender').GetName]。"
 nesnd_india_diplomacy.1.dominion:0 "成为[SCOPE.sCountry('india_sender').GetName]的自治领。"
