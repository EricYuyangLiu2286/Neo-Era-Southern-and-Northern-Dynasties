l_simp_chinese:
 nesnd_india_overseas:0 "民族资本出海"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName]现为独立国家，并已获各国承认。近一个世纪，印度的对外贸易和航运一直被外国人垄断，列强瓜分世界市场的格局长期存在。印度的民族资本要出境经营，势必不能仅仅是“公平竞争”，更要在国家力量支持下主动进行投资和收购，甚至将关键资源产区直接纳入国家领土。然而，印度周边各地区多为列强的属地。本国在这些地区的扩张恐怕会引起新一轮列强干涉。在此情势之下，我们应当做好保卫印度利益时的战争准备......"
