l_simp_chinese:
 nesnd_india_overseas:0 "海外往来"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName]已获国际承认，开始向周边五个战略区拓展商贸与外交联系。政府凭借在当地维持的[concept_interest_tier]、生效[concept_treaty]、良好[concept_relations]与双边[concept_trade]积累往来，进而争取[concept_foreign_investment_rights]或提出领土[concept_claim]。\n\n[GetStrategicRegion('region_himalayas').GetName]：[concept_interest_tier] [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_himalayas').Self).GetName]，有[concept_treaty]国 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_himalayas')|0]#!，达$relations_cordial$ #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_himalayas')|0]#!，贸易合计 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_himalayas')|0]#!，往来 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_himalayas')|1]#!（距签约还差 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_himalayas')|1]#!）\n[GetStrategicRegion('region_indonesia').GetName]：[concept_interest_tier] [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_indonesia').Self).GetName]，有[concept_treaty]国 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_indonesia')|0]#!，达$relations_cordial$ #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_indonesia')|0]#!，贸易合计 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_indonesia')|0]#!，往来 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_indonesia')|1]#!（距签约还差 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_indonesia')|1]#!）\n[GetStrategicRegion('region_east_africa').GetName]：[concept_interest_tier] [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_east_africa').Self).GetName]，有[concept_treaty]国 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_east_africa')|0]#!，达$relations_cordial$ #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_east_africa')|0]#!，贸易合计 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_east_africa')|0]#!，往来 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_east_africa')|1]#!（距签约还差 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_east_africa')|1]#!）\n[GetStrategicRegion('region_arabia').GetName]：[concept_interest_tier] [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_arabia').Self).GetName]，有[concept_treaty]国 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_arabia')|0]#!，达$relations_cordial$ #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_arabia')|0]#!，贸易合计 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_arabia')|0]#!，往来 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_arabia')|1]#!（距签约还差 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_arabia')|1]#!）\n[GetStrategicRegion('region_greater_persia').GetName]：[concept_interest_tier] [ROOT.GetCountry.GetCurrentInterestTierTypeIn(GetStrategicRegion('region_greater_persia').Self).GetName]，有[concept_treaty]国 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_treaty_count_persia')|0]#!，达$relations_cordial$ #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_cordial_count_persia')|0]#!，贸易合计 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_trade_sum_persia')|0]#!，往来 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_bar_persia')|1]#!（距签约还差 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_need_persia')|1]#!）"
 nesnd_india_overseas_status_ongoing:0 "当前签订[concept_foreign_investment_rights]费用为 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!。已有[concept_foreign_investment_rights]且[concept_interest_tier]达标的方向：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_established_dirs')|0] / 3#!。\n[concept_foreign_investment_rights][concept_treaty]也可以在[concept_diplomatic_play]中强制对方签订。"
 nesnd_india_overseas_status_done:0 "印度洋商路已经贯通。当前签订[concept_foreign_investment_rights]费用为 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!。\n[concept_foreign_investment_rights][concept_treaty]也可以在[concept_diplomatic_play]中强制对方签订。"
 nesnd_india_overseas_lost_conclusion:0 "[ROOT.GetCountry.GetName]失去了独立或国际承认，海外往来就此中断。"
 nesnd_india_overseas_lost_effect_tt:0 "已签订的[concept_foreign_investment_rights][concept_treaty]照常存续至期满，已取得的[concept_claim]照常保留。"
 nesnd_india_overseas_void_conclusion:0 "[ROOT.GetCountry.GetName]不再执掌全印政权，海外往来就此停止。"
