 nesnd_india_overseas_has_fir_target_tt:0 "该地区有可以签订$foreign_investment_rights$的国家"
 nesnd_india_overseas_has_claim_target_tt:0 "该地区有国家领有我们尚未宣称的州"
 nesnd_india_overseas_no_existing_fir_tt:0 "两国之间还没有$foreign_investment_rights$条约"
 nesnd_india_overseas_interest_2_tt:0 "我们在对方首都所在战略区域的[concept_interest_tier]至少为 2"
 nesnd_india_overseas_autonomy_tt:0 "两国都能自主开展进取性外交"
 nesnd_india_overseas_treaty_allowed_tt:0 "两国目前可以签订这项条约"
 nesnd_india_overseas_has_unclaimed_state_tt:0 "对方仍然领有该州，且我们尚未宣称"
 nesnd_india_overseas_spend_50_tt:0 "该方向的往来 #r -50#!"
 nesnd_india_overseas_diaspora_tt:0 "本国人口最多的[Concept('concept_primary_cultures','$concept_primary_culture$')]在对方首都形成[concept_cultural_community]。"
 nesnd_india_overseas_reset_bar_tt:0 "该方向的往来清零。"
 nesnd_india_overseas_not_now_tt:0 "暂不签约。"
 nesnd_india_overseas_claim_not_now_tt:0 "暂不主张。"
 nesnd_india_overseas.1.t:0 "投资权"
 nesnd_india_overseas.1.d:0 "我们与[SCOPE.sStrategicRegion('india_overseas_region').GetName]的往来已经足够密切，可以同当地政府商谈$foreign_investment_rights$了。签约之后，本国的商行和银行可以在对方境内开设产业，侨民也会随之而去。"
 nesnd_india_overseas.1.f:0 "“缔约对方准许本国商民在其境内寄居，开设商行，购置产业，贸易通商无碍。”\n——投资权条约"
 nesnd_india_overseas.1.a:0 "[SCOPE.sCountry('india_overseas_pick_1').GetName]"
 nesnd_india_overseas.1.b:0 "[SCOPE.sCountry('india_overseas_pick_2').GetName]"
 nesnd_india_overseas.1.c:0 "[SCOPE.sCountry('india_overseas_pick_3').GetName]"
 nesnd_india_overseas.1.d_opt:0 "暂不签约"
 nesnd_india_overseas.2.t:0 "印度的投资者"
 nesnd_india_overseas.2.d:0 "[SCOPE.sCountry('india_overseas_investor').GetName]与我们签订了$foreign_investment_rights$条约。[SCOPE.sCountry('india_overseas_investor').GetName]的商行将陆续到我国开设，首都已经有了他们的侨民。"
 nesnd_india_overseas.2.f:0 "“本国准许[SCOPE.sCountry('india_overseas_investor').GetName]商民在境内寄居，开设商行，购置产业，贸易通商无碍。”\n——投资权条约"
 nesnd_india_overseas.2.a:0 "知道了"
 nesnd_india_overseas.2.a_tt:0 "[SCOPE.sCountry('india_overseas_investor').GetName]的投资者可以在我国投资十年，我国首都形成了对方侨民的[concept_cultural_community]。"
 nesnd_india_overseas.3.t:0 "主张权益"
 nesnd_india_overseas.3.d:0 "我们与[SCOPE.sStrategicRegion('india_overseas_region').GetName]的往来已经十分密切。帝国可以对当地一国的土地提出宣称。"
 nesnd_india_overseas.3.f:0 "“本国商民在该地的人身与产业，理应由本国政府保护。”\n——外交部的照会"
 nesnd_india_overseas.3.a:0 "[SCOPE.sCountry('india_overseas_pick_1').GetName]：[SCOPE.sState('india_overseas_claim_state_1').GetName]"
 nesnd_india_overseas.3.b:0 "[SCOPE.sCountry('india_overseas_pick_2').GetName]：[SCOPE.sState('india_overseas_claim_state_2').GetName]"
 nesnd_india_overseas.3.c:0 "[SCOPE.sCountry('india_overseas_pick_3').GetName]：[SCOPE.sState('india_overseas_claim_state_3').GetName]"
 nesnd_india_overseas.3.d_opt:0 "暂不主张"
 nesnd_india_overseas.4.t:0 "印度的宣称"
 nesnd_india_overseas.4.d:0 "[SCOPE.sCountry('india_overseas_claimer').GetName]对我们的[SCOPE.sState('india_overseas_claimed_state').GetName]提出了宣称。"
 nesnd_india_overseas.4.f:0 "“本国商民在该地的人身与产业，理应由本国政府保护。”\n——对方的照会"
 nesnd_india_overseas.4.a:0 "记下此事"
 nesnd_india_overseas.4.a_tt:0 "[SCOPE.sCountry('india_overseas_claimer').GetName]现在宣称我们的[SCOPE.sState('india_overseas_claimed_state').GetName]。"
 nesnd_india_overseas.5.t:0 "印度人的扩张"
 nesnd_india_overseas.5.d:0 "[SCOPE.sCountry('india_overseas_actor').GetName]在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的影响日益扩大，那里也有我们自己或附属国的领土。"
 nesnd_india_overseas.5.f:0 "“[SCOPE.sCountry('india_overseas_actor').GetName]的商行和侨民在当地日见增多。”\n——属地官员的报告"
 nesnd_india_overseas.5.a:0 "提出抗议"
 nesnd_india_overseas.5.b:0 "视为对手"
 nesnd_india_overseas.5.b_tt:0 "我们以[SCOPE.sCountry('india_overseas_actor').GetName]为敌。"
 nesnd_india_overseas.5.c:0 "不予理会"
 nesnd_india_overseas.5.c_tt:0 "不作回应。"
 nesnd_india_overseas.6.t:0 "列强的回应"
 nesnd_india_overseas.6.d_protest:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]对我们在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的扩张提出了抗议。"
 nesnd_india_overseas.6.d_rival:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]已经把我们视为在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的对手。"
 nesnd_india_overseas.6.d_ignore:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]对我们在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的扩张没有作出回应。"
 nesnd_india_overseas.6.f:0 "“对方的态度已经明确。”\n——外交部的报告"
 nesnd_india_overseas.6.a:0 "知道了"
 nesnd_india_overseas.6.a_protest_tt:0 "与[SCOPE.sCountry('india_overseas_reactor').GetName]的[concept_relations] #r -20#!。"
 nesnd_india_overseas.6.a_rival_tt:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]以我们为敌。"
 nesnd_india_overseas.6.a_ignore_tt:0 "没有变化。"
 nesnd_india_overseas.7.t:0 "海外立足"
 nesnd_india_overseas.7.d:0 "本国已在三个方向立足。本国的资本在海外开设了产业，各国的都城也有了本国侨民的社区。"
 nesnd_india_overseas.7.f:0 "“本港往来的印度船只日渐增多。”\n——海关的年报"
 nesnd_india_overseas.7.a:0 "扬帆远航"
