 nesnd_india_overseas_fir_button_desc:0 "动用该方向积累的往来与国库资金，与当地一国签订十年[concept_foreign_investment_rights][concept_treaty]。"
 nesnd_india_overseas_claim_button_desc:0 "动用该方向满额往来，对当地一国在该战略区人口最多的未宣称州提出[concept_claim]。"
 nesnd_india_overseas_fir_button_tt:0 "从该方向按[concept_relations]由高到低列出至多三个国家。选定后扣除 #v 50#! 点往来并支付一季收入（不低于 @money!10,000），直接签订十年[concept_foreign_investment_rights]，同时在对方首都州建立我国最大主体文化的[concept_cultural_community]。"
 nesnd_india_overseas_claim_button_tt:0 "从该方向按[concept_relations]由低到高列出至多三个国家。选定后该方向往来清零，我国获得对方在该战略区人口最多且尚无[concept_claim]之州的宣称。"
 nesnd_india_overseas_bar_50_tt:0 "该方向往来达到 #v 50#!"
 nesnd_india_overseas_bar_100_tt:0 "该方向往来达到 #v 100#!"
 nesnd_india_overseas_treasury_tt:0 "[concept_gold_reserves]不少于签约费用 @money!#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_overseas_fir_cost')|K]#!"
 nesnd_india_overseas_has_fir_target_tt:0 "该战略区至少有一个能够与我国签订[concept_foreign_investment_rights]的国家"
 nesnd_india_overseas_has_claim_target_tt:0 "该战略区至少有一个国家持有我国尚无[concept_claim]的州"
 nesnd_india_overseas_no_existing_fir_tt:0 "我国与该国尚未签有生效的[concept_foreign_investment_rights][concept_treaty]"
 nesnd_india_overseas_interest_2_tt:0 "我国在该国首都所在战略区的[concept_interest_tier]至少达到$interest_tier_engaged$"
 nesnd_india_overseas_autonomy_tt:0 "双方均具备自主发起[concept_diplomatic_play]的外交权限"
 nesnd_india_overseas_treaty_allowed_tt:0 "双方符合签订[concept_foreign_investment_rights][concept_treaty]的条件"
 nesnd_india_overseas_has_unclaimed_state_tt:0 "该国在该战略区尚有我国未提出[concept_claim]的州"
 nesnd_india_overseas_spend_50_tt:0 "该方向往来减少 #r 50#! 点。"
 nesnd_india_overseas_diaspora_tt:0 "在对方首都所在州建立我国人口最多主体文化的[concept_cultural_community]（若已存在则维持不变）。"
 nesnd_india_overseas_reset_bar_tt:0 "该方向往来清零。"
 nesnd_india_overseas_not_now_tt:0 "暂不签订条约，往来与国库均不变动。"
 nesnd_india_overseas_claim_not_now_tt:0 "暂不宣示利益，往来读数保持不变。"
 nesnd_india_overseas.1.t:0 "订立海外投资约章"
 nesnd_india_overseas.1.d:0 "派往[SCOPE.sStrategicRegion('india_overseas_region').GetName]的商务代表已经带回各地政府的覆函。国内的银行与商行准备出资设厂兴业，只待[ROOT.GetCountry.GetName]定下签约国，随代表团前去的商行职员与会计也将落脚对方都城。"
 nesnd_india_overseas.1.f:0 "“各口岸商行均已备妥汇票与章程，一俟政府定下签约之国，即派员赴其都城设立分行。”\n——海外商务总会呈报财政部文书"
 nesnd_india_overseas.1.a:0 "与[SCOPE.sCountry('india_overseas_pick_1').GetName]签约"
 nesnd_india_overseas.1.b:0 "与[SCOPE.sCountry('india_overseas_pick_2').GetName]签约"
 nesnd_india_overseas.1.c:0 "与[SCOPE.sCountry('india_overseas_pick_3').GetName]签约"
 nesnd_india_overseas.1.d_opt:0 "暂不签约"
 nesnd_india_overseas.2.t:0 "印度商行进驻都城"
 nesnd_india_overseas.2.d:0 "[SCOPE.sCountry('india_overseas_investor').GetName]的代表已在我国都城签署约章，获准在我国境内兴办工场与商号。随首批资金抵达的[SCOPE.sCulture('india_overseas_culture').GetName]商人与工匠开始在商埠与集市附近租屋设行，长驻经营。"
 nesnd_india_overseas.2.f:0 "“自本日起，准该国商民于本城租赁地皮、开设货栈并雇佣本地工匠，照约纳税。”\n——首都商务公署通告"
 nesnd_india_overseas.2.a:0 "照约施行。"
 nesnd_india_overseas.2.a_tt:0 "我国与[SCOPE.sCountry('india_overseas_investor').GetName]已签订十年[concept_foreign_investment_rights][concept_treaty]，首都州已出现[SCOPE.sCulture('india_overseas_culture').GetName]的[concept_cultural_community]。"
 nesnd_india_overseas.3.t:0 "在海外宣示利益"
 nesnd_india_overseas.3.d:0 "[ROOT.GetCountry.GetName]在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的商贸与交通网络已经成形，外交官员与军方将领要求政府明确划定利益所及之地。内阁须在关系紧张的邻近政权中择定目标，正式宣布我国对其领土的主张。"
 nesnd_india_overseas.3.f:0 "“若不明示我国之主张，则此地要道与商路迟早落入他国之手。”\n——外交部密呈内阁节略"
 nesnd_india_overseas.3.a:0 "对[SCOPE.sCountry('india_overseas_pick_1').GetName]宣示利益"
 nesnd_india_overseas.3.b:0 "对[SCOPE.sCountry('india_overseas_pick_2').GetName]宣示利益"
 nesnd_india_overseas.3.c:0 "对[SCOPE.sCountry('india_overseas_pick_3').GetName]宣示利益"
 nesnd_india_overseas.3.d_opt:0 "暂不宣示"
 nesnd_india_overseas.4.t:0 "[SCOPE.sCountry('india_overseas_claimer').GetName]的领土主张"
 nesnd_india_overseas.4.d:0 "[SCOPE.sCountry('india_overseas_claimer').GetName]照会我国政府，正式对[SCOPE.sState('india_overseas_claimed_state').GetName]提出主权要求。驻军与地方政府已奉命加强戒备，防备对方借机生事。"
 nesnd_india_overseas.4.f:0 "“贵国公文无理主张本国固有领土，本政府断难承认。”\n——外交部覆照"
 nesnd_india_overseas.4.a:0 "记下这份照会。"
 nesnd_india_overseas.4.a_tt:0 "[SCOPE.sCountry('india_overseas_claimer').GetName]已获得对[SCOPE.sState('india_overseas_claimed_state').GetName]的[concept_claim]。"
 nesnd_india_overseas.5.t:0 "印度势力进入[SCOPE.sStrategicRegion('india_overseas_region').GetName]"
 nesnd_india_overseas.5.d:0 "驻外领事报称，[SCOPE.sCountry('india_overseas_actor').GetName]近来在[SCOPE.sStrategicRegion('india_overseas_region').GetName]频频派驻商号、缔结条约并拓展商路。该区涉及[ROOT.GetCountry.GetName]或本国属地的切身利益，政府须决定如何回应。"
 nesnd_india_overseas.5.f:0 "“该国商行与代表团在各地往来日密，当地政府已开始直接与[SCOPE.sCountry('india_overseas_actor').GetName]洽谈商约。”\n——驻外领事馆急报"
 nesnd_india_overseas.5.a:0 "递交外交抗议。"
 nesnd_india_overseas.5.b:0 "将其视为对手。"
 nesnd_india_overseas.5.b_tt:0 "我国将在外交上把[SCOPE.sCountry('india_overseas_actor').GetName]视作敌对竞争者。"
 nesnd_india_overseas.5.c:0 "暂不理会。"
 nesnd_india_overseas.5.c_tt:0 "不对[SCOPE.sCountry('india_overseas_actor').GetName]采取外交行动。"
 nesnd_india_overseas.6.t:0 "列强对我国海外拓展的回应"
 nesnd_india_overseas.6.d_protest:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]大使向我国外交部递交正式照会，抗议[ROOT.GetCountry.GetName]在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的商贸与外交活动损害了该国既有地位。"
 nesnd_india_overseas.6.d_rival:0 "驻外使节密报，[SCOPE.sCountry('india_overseas_reactor').GetName]内阁已就[ROOT.GetCountry.GetName]在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的扩张召开会议，并下令外交与军事部门将我国列为主要对手。"
 nesnd_india_overseas.6.d_ignore:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]政府虽知悉[ROOT.GetCountry.GetName]在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的动向，但并未递交抗议，也没有采取反制措施。"
 nesnd_india_overseas.6.f:0 "“各强国驻节人员均在密切注视我国在周边各区的商约与往来。”\n——外交部月报"
 nesnd_india_overseas.6.a:0 "知道了。"
 nesnd_india_overseas.6.a_protest_tt:0 "我国与[SCOPE.sCountry('india_overseas_reactor').GetName]的[concept_relations]已经下降 #r 20#!。"
 nesnd_india_overseas.6.a_rival_tt:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]已将我国视为敌手。"
 nesnd_india_overseas.6.a_ignore_tt:0 "[SCOPE.sCountry('india_overseas_reactor').GetName]没有采取行动。"
 nesnd_india_overseas.7.t:0 "印度洋商路"
 nesnd_india_overseas.7.d:0 "经过多年经营，[ROOT.GetCountry.GetName]已在三个周边战略区站稳脚跟并签下投资约章。各方向的港湾与商埠之间，印度商行、侨民社区与定期班轮连成一张常年运转的商业网络，把各地原料与本国工场的制品联结起来。"
 nesnd_india_overseas.7.f:0 "“本季赴各洋口岸的定期轮船班次再度增加，各地分行汇兑畅通无阻。”\n——印度洋航运商会年报"
 nesnd_india_overseas.7.a:0 "季风与汽船皆为我们所用。"
