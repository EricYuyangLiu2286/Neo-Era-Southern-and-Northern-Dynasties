l_simp_chinese:
 nesnd_india_overseas:0 "海外通商"
 nesnd_india_overseas_reason:0 "[ROOT.GetCountry.GetName]不受任何外国的宗主权约束。一百多年来，次大陆的海上贸易和对外航运多由法国人和明朝人经营。本国的资本要到海外经营，只能由政府出面，同周边各地的政府订立条约。这些地方大多已在列强治下，或者向$nesnd_lobby_name_qe1$称藩，[ROOT.GetCountry.GetName]在那里开设产业、安置侨民，都要同已经在那里的国家相争。"
