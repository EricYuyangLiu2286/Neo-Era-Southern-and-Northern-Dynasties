 nesnd_india_overseas.1.t:0 "投资权"
 nesnd_india_overseas.1.d:0 "本国在[SCOPE.sStrategicRegion('india_overseas_region').GetName]的势力已达到可以商订$foreign_investment_rights$的程度。条约订立后，本国的投资者可以在缔约国境内开设产业，本国人也将在其首都聚居。"
