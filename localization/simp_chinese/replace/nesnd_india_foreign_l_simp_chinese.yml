 nesnd_india_overseas_fir_button_desc:0 "从该方向的往来中拿出 50，并支付签约费用，与该地区一国签订为期十年的$foreign_investment_rights$条约，本国的投资者可以到对方境内投资。本国主要文化在对方首都形成[concept_cultural_community]。"
 nesnd_india_overseas_claim_button_desc:0 "该方向的往来清零，对该地区一国人口最多、尚未被我们宣称的州提出[concept_claim]。"
