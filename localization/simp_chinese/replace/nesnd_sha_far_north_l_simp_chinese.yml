l_simp_chinese:
 nesnd_sha_far_north:0 "远北的阴谋"
 nesnd_sha_far_north_reason:0 "在勘察加长大的孩子，很难相信祖父曾在贝加尔湖以西种过麦子。可老人指得出哪一道河弯泊得了船，哪一片草甸初夏就能放马。俄国移民起事、哥萨克人东征以来，那些地方已经换了主人。人却没有走尽。伊尔库茨克和上叶尼塞斯克仍有辽东人，他们同登莱的亲眷说着一样的话，冬天也一样长。\n\n议会里最急于收复远北的人也明白，靠登莱眼下的兵力，连把粮食护送到湖边都难。先听听湖那边的人自己怎么说。"
 nesnd_sha_gold_alliance:0 "黄金与同盟"
 nesnd_sha_gold_alliance_reason:0 "苦兀的老船商同东洲做了几代人的买卖。当年一船女真、蒙古俘虏运到东洲，屯垦地的买主付清价银，便把人领走。有些登莱商人自己也在屯垦地投了本钱。两国商家的旧账里，船价、地价和人价原本就记在同一页上。\n\n如今登莱想开科雷马的金矿，苦兀的商人首先想到的，还是海那边那些熟悉的字号。矿上要支坑的木料，要过冬的粮食，头一批金沙还没淘出来，就有几船货要付账。东洲商家肯不肯入股，得看登莱愿意出让多少开矿的利权。"
 nesnd_sha_far_north_bar:0 "远北人心"
 nesnd_sha_far_north_bar_desc:0 "俄属边地分离进度 #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_sha_relief_status:0 "湖东的来信仍能送到登莱。俄属边地各族的分离进度每周见报。"
 nesnd_sha_revolt_status:0 "俄属边地已有人举兵起事。湖东归谁，还要等这场分离战争见分晓。"
 nesnd_sha_lake_status:0 "起事国已经在伊尔库茨克站稳。议会可以向它提出归并。"
 nesnd_sha_gold_status:0 "矿山、人口和东洲的市场，是议会许给远来移民的三项保障。对东洲的请求可在外交界面提出。北方一州有三级金矿或捕鲸站时，可在公司界面筹办$nesnd_sha_north_sea_company$。"
 nesnd_sha_gold_eight_tt:0 "全国金矿与金矿场合计达到 #v 8#! 级。"
 nesnd_sha_partner_tt:0 "与东洲同属一个市场，或两国间有投资权条约。"
 nesnd_sha_merge_defeat_tt:0 "登莱在归并远北的博弈中被执行了对方的[concept_war_goal]。"
 nesnd_sha_relief:0 "接济远北同乡"
 nesnd_sha_relief_desc:0 "拨出一年的经费，恢复同俄属远北各聚落的联系。送去的每一袋粮，都有人记得是谁肯在这个冬天伸手。"
 nesnd_sha_relief_ready_tt:0 "上一轮接济与休整已结束，湖东尚未独立。"
 nesnd_sha_relief_terms_tt:0 "对俄国建立「支持分离主义」。两地的非俄罗斯族人口立即增加 #v 10%#! [Concept('concept_radical','$concept_radicals$')]，此后一年每三个月增加 #v 3%#!。"
