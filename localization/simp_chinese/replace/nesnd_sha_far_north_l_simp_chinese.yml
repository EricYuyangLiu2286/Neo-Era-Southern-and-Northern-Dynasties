 nesnd_sha_score_warm:0 "两国关系友善"
 nesnd_sha_score_friendly:0 "两国关系友好"
 nesnd_sha_score_four_mines:0 "登莱已有四级金矿及金矿场"
 nesnd_sha_score_two_goals:0 "登莱三项目标已达两项"
 nesnd_sha_score_west:0 "东洲西疆得手"
 nesnd_sha_score_war:0 "东洲正在交战"
 nesnd_sha_north.1.t:0 "远北起事"
 nesnd_sha_north.1.d:0 "俄国同边地起事者的战争已经结束。伊尔库茨克的土地握在新政府手里，送往湖边的公文，终于不必先经俄国官署拆阅。登莱同俄国有了五年停战之约。我们可以同新政府谈归并了，只是那些刚刚自己挣得自由的人，未必肯在另一面旗帜前低头。"
 nesnd_sha_north.1.f:0 "“本政府感谢登莱的援助。至于两国合并一事，须经本地民众公议，方能答复。”\n——伊尔库茨克新政府的复函"
 nesnd_sha_north.1.a:0 "把回信交给议会。"
 nesnd_sha_north.2.t:0 "湖东"
 nesnd_sha_north.2.d:0 "展开登莱的舆图，伊尔库茨克又能涂上登莱的颜色了。最先到岸的人没有带地图。他们拿着先人留下的邻里姓名，一家一家地问过去，常常问到第三家，头一家才有人追出来，喊的是来人的乳名。"
 nesnd_sha_north.2.f:0 "“我们照着先人留下的邻里姓名一家家打听，已经找到了旧日的邻居。”\n——寄回登莱的家信"
 nesnd_sha_north.2.a:0 "登岸吧。"
 nesnd_sha_north.3.t:0 "退回雪线"
 nesnd_sha_north.3.d:0 "来信的路断了。登莱曾盼望同乡能在湖东立住脚，而从伊尔库茨克送来的消息，已经不足以让议会再拨下一笔钱。边地的家属还在港口等人。政府必须先把肯回来的人接回去。"
 nesnd_sha_north.3.f:0 "“少了一封公函，可以明年再写。少了一个人，你叫他娘明年到哪里去找？”"
 nesnd_sha_north.3.a:0 "暂停接济，十二个月后再议。"
 nesnd_sha_north.4.t:0 "粮袋上的姓名"
 nesnd_sha_north.4.d:0 "送去边地的粮袋该由谁具领，议会吵了一上午。军官要按义勇的名册分发，渔户却带来几张家书，说名册里的人若是冻死，未必就比名册外的人少一分可惜。"
 nesnd_sha_north.4.f:0 "“名册以外的人家也在挨冻。请议会准许按户发粮，不只照义勇名册分发。”\n——渔户递交议会的请愿"
 nesnd_sha_north.4.a:0 "先按户送粮。"
 nesnd_sha_north.4.b:0 "照义勇名册签领。"
 nesnd_sha_north.5.t:0 "一封未封口的信"
 nesnd_sha_north.5.d:0 "湖东寄来一封公开信，请登莱的报馆照原文刊登。写信人要在当地自行推举代表，末尾署着各聚落的名字。议会里的共和派要把这些名字登在头版，好让大陆上也知道还有谁肯响应。军官们读到落款却踌躇起来。报纸同商船一道进了俄境，哥萨克人也就知道该往哪些村子去拿人了。"
 nesnd_sha_north.5.f:0 "“我签了自己的名字，当然知道落到俄国人手里是什么下场。只求诸位宽限两天，让送信的人先回去。他可没在上头签字。”——随信附言"
 nesnd_sha_north.5.a:0 "让报馆付印。"
 nesnd_sha_north.5.b:0 "等信使先回家。"
 nesnd_sha_north.6.t:0 "雪线以东"
 nesnd_sha_north.6.d:0 "十二年过去，政府仍不能在伊尔库茨克替一户人家登记田地。早年的接济簿已经翻得起毛，簿上有的孩子如今也有了孩子。议会同意结清远北这笔账，把余下的经费留给下一步的海上经营。"
 nesnd_sha_north.6.f:0 "“湖还在那里。我们先去找一个冬天也能靠船的港。”"
 nesnd_sha_north.6.a:0 "结清远北的经费。"
 nesnd_sha_north.7.t:0 "金沙"
 nesnd_sha_north.7.d:0 "勘探队把一小包金沙倒在议事桌上。议员们传看了好一会儿，商人才开口。他们愿意运铁铲、木料和粮食来，条件是放开私采。掌管国库的人伸手把那包金沙收拢，他今冬要付的账，可都已经写好了。"
 nesnd_sha_north.7.f:0 "“我等愿运铁铲、木料与粮食前往金场，惟请议会准许私采。”\n——商人的呈请"
 nesnd_sha_north.7.a:0 "开放私采，准许各地来人投矿。"
 nesnd_sha_north.7.b:0 "收归国营，收入解交国库。"
 nesnd_sha_north.8.t:0 "黄金之国"
 nesnd_sha_north.8.d:0 "从前怕冬天断粮，家家都爱数一数港里的船。如今一样有人数船，只是数到最后，会说出哪条装木头、哪条收鲸油、哪条要带着东洲买家的货款回来。能在北方安顿下来的人多了，议会里那幅海图，终于也可以向南展开一截。"
 nesnd_sha_north.8.f:0 "“本年进出港船只中，运木料、收鲸油与载东洲货款回港的商船均有增加。”\n——港务局年报"
 nesnd_sha_north.8.a:0 "沿着海岸向南看。"
 nesnd_sha_north.9.t:0 "金尽"
 nesnd_sha_north.9.d:0 "十二年前议会许下的三件事，至今还没有办全。淘金的人有些已经成家，有些又登船去了别处。库房里还有粮，港外也还有海。等不到北方事事齐备才动身，登莱必须带着手头这点家当往前走。"
 nesnd_sha_north.9.f:0 "“欠你的余款我记着。你若往南去，我把数目写给你带上。”"
 nesnd_sha_north.9.a:0 "照实结账。"
 nesnd_sha_north.10.t:0 "鱼汛与矿界"
 nesnd_sha_north.10.d:0 "新划的矿界把一段下网的河岸圈了进去。矿工要在那里卸木料，当地渔户则拿出了用过多年的网桩。可矿场手上有官署盖印的文书。鱼群过境只有几天，等渔户找来肯替他们向官署说话的人，木料恐怕已经堆满了河岸。"
 nesnd_sha_north.10.f:0 "“请您在那张纸上给我们留出下网的地方。明年换一位管矿的，他认得官印，可未必肯认我的网桩。”——河边的一名渔户"
 nesnd_sha_north.10.a:0 "留出下网的河岸。"
 nesnd_sha_north.10.b:0 "准矿场照界搭棚。"
 nesnd_sha_north.11.t:0 "冰里的客船"
 nesnd_sha_north.11.d:0 "招徕流民的船在鄂霍次克海遇上了浮冰。岸上一时还接触不到船身，只能听见夜里有人隔着冰喊，船上有孩子，先送些炭来。渔户们听得懂这句话，天还没亮便套好了雪橇。"
 nesnd_sha_north.11.f:0 "“船名没听清，人说的话我听清了。走吧。”"
 nesnd_sha_north.11.a:0 "给救援的人让开码头。"
 nesnd_sha_north.12.t:0 "盟内的税单"
 nesnd_sha_north.12.d:0 "盟内商人带来一份关税账，想请登莱替北方的货物说句话。东洲的买家关心鲸油和木料抵港时要值多少钱。码头上卖鱼的人算的却是另一笔账，下一条船若空着粮舱回来，他这筐鱼还能换到几升米？"
 nesnd_sha_north.12.f:0 "“我等以鱼换米。船空舱回来，米价便涨。议定税则之时，请将运粮一项一并算入。”\n——码头渔户的呈文"
 nesnd_sha_north.12.a:0 "替出口商陈情。"
 nesnd_sha_north.12.b:0 "先听码头渔户的意见。"
