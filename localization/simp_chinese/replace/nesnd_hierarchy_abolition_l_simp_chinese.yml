l_simp_chinese:
 law_nesnd_hus_hierarchy_abolished:0 "取消等级制度"
 law_nesnd_hus_hierarchy_abolished_desc:0 "户籍不再按族属分等。各族居民的公民地位依本国的$lawgroup_citizenship$法律而定。"
 law_nesnd_per_hierarchy_abolished:0 "取消等级制度"
 law_nesnd_per_hierarchy_abolished_desc:0 "唐律中按族属划分等第的条文已经废止。唐人、伊朗人与境内其他居民的待遇，依现行的$lawgroup_citizenship$法律而定。"
 nesnd_hierarchy_abolition.1.t:0 "废除族籍等第"
 nesnd_hierarchy_abolition.1.d:0 "[ROOT.GetCountry.GetName]如今承认为主体的民族，已非旧日户籍列为一等的那些人所能涵盖。政府废除了户籍中的族属等第，今后可依国情修订公民法。"
 nesnd_hierarchy_abolition.1.a:0 "废止旧例。"
 nesnd_hierarchy_abolition.2.t:0 "唐律分等的终结"
 nesnd_hierarchy_abolition.2.d:0 "唐人已不再是[ROOT.GetCountry.GetName]的主体民族。唐律中将唐人列为一等、将伊朗人另列一等的条文，今日一并废止。"
 nesnd_hierarchy_abolition.2.a:0 "颁行新法。"
