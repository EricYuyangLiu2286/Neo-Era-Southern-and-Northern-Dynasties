l_simp_chinese:
 nesnd_external_intervene:0 "出兵反吴"

 nesnd_wu_resolve_bar_name:0 "军心"
 nesnd_wu_resolve_bar_desc:0 "#tooltippable;tooltip:[JournalEntry.GetTooltipTag],nesnd_wu_resolve_bar_rules_tt $nesnd_wu_resolve_bar_name$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!#!"
 nesnd_wu_resolve_bar_rules_tt:0 "#title 军心#!\n只在第二次靖难战争进行时变化，起点为 #v 30#!。\n本轮战争未满 #v 24#! 个月时每月 #r -1#!，满 #v 24#! 个月后每月 #r -1.5#!。\n与我国交战的外国，[SCOPE.sCountry('nesnd_label_cne').GetName]计 #v 2#! 点，其余每国计 #v 1#! 点，合计至多 #v 4#! 点，每点每月 #g +1#!。外国参战后的头两个月，每点每月另加 #g +7.5#!。反吴的南方各国与$nesnd_lobby_name_jap$不算外国。\n军心高于 #v 50#! 时，越接近 #v 100#!，越接近进攻 #g +15%#!、防御 #g +15%#!、士气损失 #g -20%#!、军用商品花费 #g -15%#!。\n军心低于 #v 50#! 时，越接近 #v 0#!，越接近进攻 #r -10%#!、防御 #r -5%#!、士气损失 #r +25%#!、军用商品花费 #r +10%#!。"
 nesnd_wu_resolve_drag:0 "同室操戈"
 nesnd_wu_resolve_drag_long:0 "战事已拖过两年"
 nesnd_wu_resolve_foreign:0 "外国站在敌方参战"
 nesnd_wu_resolve_fresh:0 "外国新近参战"
 nesnd_wu_resolve_high:0 "同仇敌忾"
 nesnd_wu_resolve_low:0 "军心涣散"

 nesnd_jingnan_aid.1.t:0 "出兵各国的要求"
 nesnd_jingnan_aid.1.d:0 "吴廷已经覆灭。靖难战争中，有外国派兵站在反吴一方与吴军作战。如今这些国家的使节来到[ROOT.GetCountry.GetName]，按照各自出兵的情形，向新朝提出割地、订约等要求。"
 nesnd_jingnan_aid.1.a:0 "按各国所求酬谢。"
 nesnd_jingnan_aid.1.b:0 "只遣使道谢。"
 nesnd_jingnan_aid_cne_east_tt:0 "[SCOPE.sCountry('nesnd_aid_cne').GetName]得到苏北、滁州、合肥三州中我国现有的部分，双方停战十年。"
 nesnd_jingnan_aid_cne_west_tt:0 "我国欠[SCOPE.sCountry('nesnd_aid_cne').GetName]一个人情，并给予它在我国的投资权和贸易特权，条约约束期十年。双方停战十年。"
 nesnd_jingnan_aid_qe1_tt:0 "我国欠[SCOPE.sCountry('nesnd_aid_qe1').GetName]一个人情，并给予它在我国的贸易特权和过境权，条约约束期十年。"
 nesnd_jingnan_aid_hus_tt:0 "我国给予[SCOPE.sCountry('nesnd_aid_hus').GetName]一处条约港，条约约束期九十九年，另给予它在我国的贸易特权，约束期十年。条约港先设在浙江，浙江不成时依次改在福建、闽江、粤中。四处都不在我国手中或都不能设港时，没有条约港。"
 nesnd_jingnan_aid_treaty_note_tt:0 "各项条约按原生条约规则订立，不满足条件的条款不会生效。"
 nesnd_jingnan_aid_refuse_tt:0 "出兵各国与我国的关系各 #r -30#!。"

 nesnd_jingnan_aid.2.t:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName]的答复"
 nesnd_jingnan_aid.2.d0:0 "吴廷覆灭后，[SCOPE.sCountry('nesnd_aid_patron').GetName]只派使节前来道谢，没有割地，也没有订约。我国出兵所求的东西都落了空。"
 nesnd_jingnan_aid.2.d1:0 "吴廷覆灭后，[SCOPE.sCountry('nesnd_aid_patron').GetName]把苏北、滁州、合肥三州中它所据有的部分割给了我国，双方停战十年。"
 nesnd_jingnan_aid.2.d2:0 "吴廷覆灭后，[SCOPE.sCountry('nesnd_aid_patron').GetName]承认欠我国一个人情，并给予我国在其境内的投资权和贸易特权。双方停战十年。"
 nesnd_jingnan_aid.2.d3:0 "吴廷覆灭后，[SCOPE.sCountry('nesnd_aid_patron').GetName]承认欠我国一个人情，并给予我国在其境内的贸易特权和过境权。"
 nesnd_jingnan_aid.2.d4:0 "吴廷覆灭后，[SCOPE.sCountry('nesnd_aid_patron').GetName]在[SCOPE.sState('nesnd_aid_port').GetName]给了我国一处条约港，并给予我国在其境内的贸易特权。"
 nesnd_jingnan_aid.2.d5:0 "吴廷覆灭后，[SCOPE.sCountry('nesnd_aid_patron').GetName]给予我国在其境内的贸易特权。浙江、福建、闽江、粤中都没能设成条约港。"
 nesnd_jingnan_aid.2.a:0 "就这样吧。"
 nesnd_jingnan_aid_land_reform_tt:0 "地权革命的完成进度 #g +10#!"

 nesnd_jingnan_aid.3.t:0 "吴廷索赔"
 nesnd_jingnan_aid.3.d:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName]平定了南方，要求出兵反吴的国家赔偿战费。我国被迫订约，此后五年每周向[SCOPE.sCountry('nesnd_aid_patron').GetName]支付订约时本国固定收入的十分之一。"
 nesnd_jingnan_aid.3.d_cne:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName]平定了南方，要求出兵反吴的国家赔偿战费。我国被迫订约，此后五年每周向[SCOPE.sCountry('nesnd_aid_patron').GetName]支付订约时本国固定收入的十分之一。[SCOPE.sCountry('nesnd_aid_patron').GetName]同时宣称了汉中与皖北。"
 nesnd_jingnan_aid.3.d_no_treaty:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName]平定了南方，要求出兵反吴的国家赔偿战费。赔款条约没有订成，我国眼下不必付款。"
 nesnd_jingnan_aid.3.d_cne_no_treaty:0 "[SCOPE.sCountry('nesnd_aid_patron').GetName]平定了南方，要求出兵反吴的国家赔偿战费。赔款条约没有订成，我国眼下不必付款，但[SCOPE.sCountry('nesnd_aid_patron').GetName]已经宣称了汉中与皖北。"
 nesnd_jingnan_aid.3.a:0 "只能如此。"

