l_simp_chinese:
 nesnd_usm_duan_first: "敬川"
 nesnd_usm_duan_last: "段"
 nesnd_civic_characters.14.t: "川中书院的学额"
 nesnd_civic_characters.14.d: "[SCOPE.sCharacter('c2_duan').GetFullName]呈上了一份章程，请[SCOPE.sState('c2_duan_school').GetName]的书院增收学生。院中肯让出讲席，肯不肯替学生付束脩，却是另一回事。有田产的人家尽可送子弟来听一回新课，靠工钱吃饭的人家想问的是，听过这一回，下个月还上得起学么？"
 nesnd_civic_characters.14.f: "“先生肯教，我儿也肯学。我只想打听一句，纸墨钱从哪一天算起？”"
 nesnd_civic_characters.14.a: "由国库拨款，给付不起束脩的学生留出学额。"
 nesnd_civic_characters.14.b: "先请这位教习登坛，让地方听听他的学问。"
 nesnd_civic_characters.200.t: "礼议院的席位"
 nesnd_civic_characters.200.d: "礼议院既开了取士的新门，[SCOPE.sState('c2_duan_school').GetName]的教习[SCOPE.sCharacter('c2_duan').GetFullName]便有资格请任学政。授他席位，他就能在决定各省学额时为本乡开口。书院若留下他，学生倒还能照常听课，至于他们的名字能不能列进下一份名册，就要听凭别人议定了。"
 nesnd_civic_characters.200.f: "“往年都是京里问川中有多少学生。今年要是先生去了，也请替我们问一声，京里肯给多少学额。”"
 nesnd_civic_characters.200.a: "准其出任学政，入礼议院议事。"
 nesnd_civic_characters.200.b: "留他在书院执教，增收本地学生。"
 nesnd_civic_public_tuition: "官费学额"
 nesnd_civic_local_tuition: "地方助学"
 nesnd_civic_academy_exchange: "书院互派教习"
 nesnd_duan_lecturer: "书院讲学"
 nesnd_duan_delegate: "新任学政"
