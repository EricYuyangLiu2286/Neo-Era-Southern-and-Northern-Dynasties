 nesnd_c2_person_usm_luo_support: "支持女工识字"
 nesnd_c2_person_usm_han_support: "支持工匠教育"
 nesnd_c2_person_usm_jiang_support: "支持公开跨省预算"
 nesnd_civic_characters.200.t: "从教习到学政"
 nesnd_civic_characters.200.d: "段敬川通过了礼议院的考试，取得了担任学政的资格。这位巴蜀教习曾经为实学课程与地方学额奔走，如今终于能够进入议席，亲自参与那些决定学生前程的国事。\n\n地方的教习与学生对他寄予厚望，其他各省的学政也有自己的要求。过去他只须说明巴蜀缺少什么，今后却得回答这些需要应由谁来负担。"
 nesnd_civic_characters.200.a: "既入议席，就为地方担起责任。"
