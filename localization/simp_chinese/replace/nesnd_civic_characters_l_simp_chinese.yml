 nesnd_c2_person_usm_jiang_support: "各省的所得与负担的主张"
 nesnd_civic_characters.200.t: "从教习到学政"
 nesnd_civic_characters.200.d: "实学与地方资格的安排已经经过礼法程序，段敬川也取得了相应考试资格。教习如今可以以学政身份参与礼议院，代表省里的教育与公共利益。布政司的行政职权仍有自己的归属。"
 nesnd_civic_characters.200.a: "资格与责任，一并承担。"
