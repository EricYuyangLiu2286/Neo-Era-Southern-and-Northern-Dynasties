l_simp_chinese:
 nesnd_ita_valdieri_first: "乔万尼"
 nesnd_ita_valdieri_last: "瓦尔迪耶里"
 nesnd_civic_characters.1.t: "信贷的条件"
 nesnd_civic_characters.1.d: "瓦尔迪耶里愿意为工场筹措信用，却要求政府说明军需订货与偿款的先后。他的商人朋友期待法国关系带来稳定生意，地方纳税人则不愿成为每一份担保的最后债务人。"
 nesnd_civic_characters.1.a: "赞同他争取工商业信用。"
 nesnd_civic_characters.1.b: "借款条件仍由商人议论。"
 nesnd_civic_characters.101.t: "担保与偿款"
 nesnd_civic_characters.101.d: "瓦尔迪耶里仍在要求军需订货有明确的偿款安排。厂主肯不肯垫资，与政府肯负担多少担保连在一起。法国关系带来的商机，也要经过商人的账目才能变成信用。"
 nesnd_civic_characters.101.organisation: "瓦尔迪耶里已不在本国的公共活动中，厂主对担保与偿款的要求却留了下来。商人仍须判断国库的信用，政府也仍面对借款条件。"
 nesnd_civic_characters.101.a: "信用须有偿款的根据。"
 nesnd_ita_bellandi_first: "特蕾莎"
 nesnd_ita_bellandi_last: "贝兰迪"
 nesnd_civic_characters.2.t: "报馆旁的女校"
 nesnd_civic_characters.2.d: "贝兰迪在报馆与女校之间奔走，把识字教育同公民资格联系起来。她支持共和，却不肯把共和国三个字当作限制妇女和穷人求学的理由。"
 nesnd_civic_characters.2.a: "赞同她争取求学机会。"
 nesnd_civic_characters.2.b: "让报章继续讨论求学资格。"
 nesnd_civic_characters.102.t: "女校与公民"
 nesnd_civic_characters.102.d: "贝兰迪把女校的需要写进报章，求学资格也因此成为共和论说中的具体问题。她仍要求读者回答：赞美公民的独立，是否也肯让妇女和穷人有求学的机会？"
 nesnd_civic_characters.102.organisation: "贝兰迪的身影已从本国的报馆与讲坛上消失。关于妇女和穷人求学的争论仍在，女校的经费和入学资格还需要有人争取。"
 nesnd_civic_characters.102.a: "女校的需要应当受到重视。"
 nesnd_ita_rusciani_first: "马泰奥"
 nesnd_ita_rusciani_last: "鲁夏尼"
 nesnd_civic_characters.3.t: "南方留下的税款"
 nesnd_civic_characters.3.d: "鲁夏尼带来的地方意见并不拒绝合作。他要求先说清矿权收益、道路和学校的负担，再谈把更多税款送往共同的政治中心。"
 nesnd_civic_characters.3.a: "赞同南方争取地方财源。"
 nesnd_civic_characters.3.b: "地方意见不必由政府代言。"
 nesnd_civic_characters.103.t: "共同财政中的南方"
 nesnd_civic_characters.103.d: "鲁夏尼仍将南方的道路、学校和矿权收入放在一起讨论。地方商户愿从合作中取得商路，也要求共同财政说明：税款送出以后，哪些负担会得到分担。"
 nesnd_civic_characters.103.organisation: "鲁夏尼已不在本国的公共活动中。南方税款该留下多少、公共开支该由谁负担，仍是地方商户衡量合作得失时要问的问题。"
 nesnd_civic_characters.103.a: "共同开支须说清地方的份额。"
 nesnd_ita_sereni_first: "卢卡"
 nesnd_ita_sereni_last: "塞雷尼"
 nesnd_civic_characters.4.t: "军费与工程学校"
 nesnd_civic_characters.4.d: "塞雷尼把军队统一指挥的主张同军费和退伍生计联系起来。共和信念能把志愿者召到旗帜下，这却不意味着军人会对欠薪和虐待逆来顺受。"
 nesnd_civic_characters.4.a: "赞同他！"
 nesnd_civic_characters.4.b: "他们要哗变吗？"
 nesnd_civic_characters.104.t: "志愿军的日后"
 nesnd_civic_characters.104.d: "塞雷尼仍积极地奔走着，为他的老兵同袍们争取薪饷与退伍后的社会保障、工作条件。"
 nesnd_civic_characters.104.organisation: "名人塞雷尼不再活跃于我国。但军队薪饷与退伍待遇的争论仍随军队存在。军人家庭关心的开支，必须在公共财政中找到承担者。"
 nesnd_civic_characters.104.a: "军人的生计也是军费。"
 nesnd_ita_vitali_first: "保罗"
 nesnd_ita_vitali_last: "维塔利"
 nesnd_civic_characters.5.t: "学校由谁负担"
 nesnd_civic_characters.5.d: "维塔利承认学校需要稳定的公共经费，也要求地方教会承担教育责任。教宗旧地的居民关心教师和学费，不愿只听见新旧政权争夺一块招牌。"
 nesnd_civic_characters.5.a: "赞同教会承担教育责任。"
 nesnd_civic_characters.5.b: "让地方自行讨论办学责任。"
 nesnd_civic_characters.105.t: "教会与学费"
 nesnd_civic_characters.105.d: "维塔利仍主张教会承担地方教育的责任。争论一旦落到教师的薪水和学生的学费，公共拨款与教会责任便很难各说各话。家庭要知道孩子是否读得起书。"
 nesnd_civic_characters.105.organisation: "维塔利已不再参与本国的公共活动。地方教会、教师与学生家庭仍围绕学费和经费提出要求，教育责任的归属也仍在争论之中。"
 nesnd_civic_characters.105.a: "办学须顾及学生家庭。"
 nesnd_ita_martelli_first: "罗莎"
 nesnd_ita_martelli_last: "马尔泰利"
 nesnd_civic_characters.6.t: "矿工的伤口"
 nesnd_civic_characters.6.d: "马尔泰利把矿工的伤病与家庭收入带进公共争论。地方工业从矿井取得财富，工人的组织要求其中一部分用于安全、教育和无法下井者的补偿性福利。"
 nesnd_civic_characters.6.a: "赞同矿工争取安全与教育。"
 nesnd_civic_characters.6.b: "让工人的要求自行传开。"
 nesnd_civic_characters.106.t: "离开矿井以后"
 nesnd_civic_characters.106.d: "马尔泰利继续为伤病矿工发言。矿井的盈利源源不绝地汇入矿主的利润和国库，因伤病导致不能下井的人和家庭却上顿不接下顿。工人组织要求把这些人的安全和教育列入地方开支。"
 nesnd_civic_characters.106.organisation: "马尔泰利已不在本国的公共活动中，伤病矿工的家庭仍靠自己和互助组织维持生活。矿业财富是否应承担安全与教育的开支，仍有人追问。"
 nesnd_civic_characters.106.a: "矿井以外也有工人的生活。"
 nesnd_hus_tong_first: "世衡"
 nesnd_hus_tong_last: "佟"
 nesnd_civic_characters.7.t: "承包人的账"
 nesnd_civic_characters.7.d: "佟世衡主张用长期承包把港口、木材和内陆道路连在一起。商人愿意垫资的条件是稳定收益。政府面前的问题，是特许经营将留下道路，还是留下另一道征敛的关卡。"
 nesnd_civic_characters.7.a: "赞同他以商人资本推进工程。"
 nesnd_civic_characters.7.b: "让承包主张接受地方议论。"
 nesnd_civic_characters.107.t: "特许经营的边界"
 nesnd_civic_characters.107.d: "佟世衡仍主张以长期承包把海港与内陆连接起来。工程若依赖商人垫资，公共道路的去向也会受到收益预期牵动。地方商户因而紧盯承包条件。"
 nesnd_civic_characters.107.organisation: "佟世衡已不在本国的公共活动中，港口与内陆的运输仍牵连着承包商、地方商户和国库。特许经营的条件将继续影响谁能从道路中获利。"
 nesnd_civic_characters.107.a: "道路所经，皆是繁荣。"
 nesnd_hus_shen_first: "季川"
 nesnd_hus_shen_last: "沈"
 nesnd_civic_characters.8.t: "债契与求学"
 nesnd_civic_characters.8.d: "沈季川收集债役家庭的陈述，也为已经摆脱奴役的人争取识字和结社的空间。法律可以改变一张债契的效力，旧日依附留下的贫穷和门第却不会随之消失。"
 nesnd_civic_characters.8.a: "赞同他为债役家庭争取教育。"
 nesnd_civic_characters.8.b: "让这些陈述进入公共讨论。"
 nesnd_civic_characters.108.t: "债役家庭的明天"
 nesnd_civic_characters.108.d: "沈季川仍在收集债役家庭的陈述。债契的效力取决于现行法律，求学、谋职与结社的机会则影响这些家庭日后怎样生活。他把这些要求带进本国关于身份的争论。"
 nesnd_civic_characters.108.organisation: "沈季川已不在本国的公共活动中。债役家庭仍要面对债契与求学谋职的困难，他们的陈述并未随着倡议者的离去得到答复。"
 nesnd_civic_characters.108.a: "听取那些家庭的要求。"
 nesnd_hus_bayant_first: "巴彦图"
 nesnd_hus_bayant_last: ""
 nesnd_civic_characters.9.t: "牧道上的界桩"
 nesnd_civic_characters.9.d: "巴彦图把受工程影响的牧民带到地方协商中。他要求留下牲畜通行与季节迁徙的道路，或者向失去牧地者支付补偿。承包者划下的地界，已经触及这些家庭逐水草而居的生活。"
 nesnd_civic_characters.9.a: "赞同保留牧民的通行空间。"
 nesnd_civic_characters.9.b: "让地方继续商议牧道。"
 nesnd_civic_characters.109.t: "牧道仍须通行"
 nesnd_civic_characters.109.d: "巴彦图仍要求工程给季节迁徙留下通道。对承包商而言可以补偿的一块土地，可能正连着牧民往返水草之地的路线。地方协商须把这条路线说清。"
 nesnd_civic_characters.109.organisation: "巴彦图已不再参与本国的公共活动，迁徙的牧民仍须经过工程附近。保留通道与支付补偿的要求，继续由受影响的家庭向地方提出。"
 nesnd_civic_characters.109.a: "先顾到牲畜和人的去路。"
 nesnd_hus_lin_first: "素岚"
 nesnd_hus_lin_last: "林"
 nesnd_civic_characters.10.t: "工棚里的夜学"
 nesnd_civic_characters.10.d: "林素岚在移民工人的互助中筹办夜学。识字使人能够读懂工钱、债契和法令，也使有些雇主担心工人学会为自己说话。"
 nesnd_civic_characters.10.a: "赞同工人自助求学。"
 nesnd_civic_characters.10.b: "让互助者自行倡议。"
 nesnd_civic_characters.110.t: "夜学与工钱"
 nesnd_civic_characters.110.d: "林素岚继续在工人互助中主张识字教育。能读懂工钱和债契，便能在雇佣争执中提出自己的解释。夜学因此也成了工人结交、议论的地方。"
 nesnd_civic_characters.110.organisation: "林素岚已不在本国的公共活动中。工人互助中的识字要求仍在：工钱、债契和法令还要有人读懂，求学的机会也仍须争取。"
 nesnd_civic_characters.110.a: "读得懂，才说得清。"
 nesnd_hus_lu_first: "景铎"
 nesnd_hus_lu_last: "陆"
 nesnd_civic_characters.11.t: "公开工程的收支"
 nesnd_civic_characters.11.d: "陆景铎把工程账目摊在承包者与地方代表面前。作为工程师，他要求按真实施工与就业付款，不愿把专业资格当成取得特许和股权的凭据。"
 nesnd_civic_characters.11.a: "赞同公开核算工程收支。"
 nesnd_civic_characters.11.b: "让工程账目留待公共议论。"
 nesnd_civic_characters.111.t: "按什么付工程款"
 nesnd_civic_characters.111.d: "陆景铎仍要求把工程的进度、就业和付款放在一起看。承包者凭专业名望取得信任之后，地方还要知道公共开支究竟换来了什么。"
 nesnd_civic_characters.111.organisation: "陆景铎已不再参与本国的公共活动，公共工程的账目仍留在承包者与地方面前。工程款如何支付、地方得到了什么，继续是收支讨论中的问题。"
 nesnd_civic_characters.111.a: "把开支与所得一并说清。"
 nesnd_hus_guan_first: "廷宪"
 nesnd_hus_guan_last: "关"
 nesnd_civic_characters.12.t: "油税的去处"
 nesnd_civic_characters.12.d: "关廷宪要求说明油井带来的收益将用于何处。特许公司期待扩张，地方商户和居民则要求修路、学校和稳定的财政分配。"
 nesnd_civic_characters.12.a: "赞同地方争取油业收益。"
 nesnd_civic_characters.12.b: "让各方继续讨论油税。"
 nesnd_civic_characters.112.t: "产油地的要求"
 nesnd_civic_characters.112.d: "关廷宪仍在追问产油地应留下多少收入。油业扩张吸引公司资本，修路和办学却要由地方安排。商户因此要求在财政分配中取得发言的份额。"
 nesnd_civic_characters.112.organisation: "关廷宪已不在本国的公共活动中，产油地对税款和公共开支的要求仍在。油业公司与地方商户将继续围绕收益的去向提出不同的安排。"
 nesnd_civic_characters.112.a: "产油地也要有自己的所得。"
 nesnd_usm_ji_first: "文衡"
 nesnd_usm_ji_last: "季"
 nesnd_civic_characters.13.t: "商工能否入仕"
 nesnd_civic_characters.13.d: "季文衡把商工经历与考试资格一起呈到礼法争论中。他要求礼议院承认实学与产权经验的价值，也必须回答：财产能否成为另一道把普通人挡在门外的门第。"
 nesnd_civic_characters.13.a: "赞同以实学拓宽入仕之路。"
 nesnd_civic_characters.13.b: "让资格争论继续展开。"
 nesnd_civic_characters.113.t: "实学与门第"
 nesnd_civic_characters.113.d: "季文衡仍要求礼议院承认商工经历的价值。懂得实业和账务的人希望取得入仕之路，既有士绅则要维持资格的分量。考试如何衡量新旧学问，成为双方都回避不了的问题。"
 nesnd_civic_characters.113.organisation: "季文衡已不在本国的公共活动中，商工之士对入仕资格的要求仍传到礼议院。实学、财产与经学应占多大分量，继续牵动新进之士和旧有士绅的利益。"
 nesnd_civic_characters.113.a: "礼法须回应新进之士。"
 nesnd_usm_duan_first: "敬川"
 nesnd_usm_duan_last: "段"
 nesnd_civic_characters.14.t: "教习与学额"
 nesnd_civic_characters.14.d: "巴蜀教习段敬川主张调整书院课程和学额。教习要把实学教给学生，学生还盼着由求学走向国政。课程能否获得承认，因而与礼法规定的资格和考试连在一起。"
 nesnd_civic_characters.14.a: "赞同他为课程与学额发言。"
 nesnd_civic_characters.14.b: "让教习自行讨论课程。"
 nesnd_civic_characters.114.t: "巴蜀教习的课程"
 nesnd_civic_characters.114.d: "段敬川仍关心巴蜀课程与学额。学生求学的需要使实学课程有了依据，怎样取得参与国政的资格，则仍须经过相应的礼法与考试程序。"
 nesnd_civic_characters.114.organisation: "段敬川已不在本国的公共活动中，巴蜀教习和学生对于课程、学额的要求仍在。地方教育与国政资格的关系，仍须由有关制度作出安排。"
 nesnd_civic_characters.114.a: "先把学生需要的学问教好。"
 nesnd_usm_xu_first: "廷璋"
 nesnd_usm_xu_last: "许"
 nesnd_civic_characters.15.t: "旧资格与任意征敛"
 nesnd_civic_characters.15.d: "许廷璋反对仓促扩大入仕资格，也反对把地方财富当作可以任意征取的战后财源。士绅要守住既有秩序，却不能回避学校、军费和赋税已经改变的事实。"
 nesnd_civic_characters.15.a: "赞同维护旧资格与地方财产。"
 nesnd_civic_characters.15.b: "让士绅自行陈述理由。"
 nesnd_civic_characters.115.t: "士绅与地方开支"
 nesnd_civic_characters.115.d: "许廷璋仍坚持旧有资格，也不愿地方财富被任意征取。他的主张得到士绅呼应，学校、军费和实业的支出却仍须有人承担。维护地方利益因而也要回答公共财政的要求。"
 nesnd_civic_characters.115.organisation: "许廷璋已不在本国的公共活动中。守住资格与抵制任意征敛的主张仍有士绅支持，地方如何负担学校和军费，也继续摆在他们面前。"
 nesnd_civic_characters.115.a: "地方利益也有公共负担。"
 nesnd_usm_luo_first: "映棠"
 nesnd_usm_luo_last: "罗"
 nesnd_civic_characters.16.t: "账簿与女工识字"
 nesnd_civic_characters.16.d: "罗映棠从工场账务和女工互助入手筹办识字教育。女工读懂账目，便能追问工钱和债务。求学的需要从工棚传向书院，也把教育资格带进公共争论。"
 nesnd_civic_characters.16.a: "赞同女工争取识字教育。"
 nesnd_civic_characters.16.b: "让互助与教育的主张自行传播。"
 nesnd_civic_characters.116.t: "识字之后的资格"
 nesnd_civic_characters.116.d: "罗映棠仍从账务与女工互助谈起教育。读懂工钱和货单，使女工在工场里有了更多说话的根据。这种学问能否得到公共资格的承认，也随之成为她们的问题。"
 nesnd_civic_characters.116.organisation: "罗映棠已不在本国的公共活动中，女工互助中的识字要求仍传到工场和学校。学会账务之后能取得什么机会，仍由求学者和现行资格制度共同面对。"
 nesnd_civic_characters.116.a: "让求学者说出自己的需要。"
 nesnd_usm_han_first: "士铎"
 nesnd_usm_han_last: "韩"
 nesnd_civic_characters.17.t: "工匠的学堂"
 nesnd_civic_characters.17.d: "韩士铎主张为工匠开办技能教育，把工钱、伤病和招工争执带进学堂的讨论。厂主需要熟练工，工人也要靠手艺谋生。谁来付教育的费用，成了双方都关心的事。"
 nesnd_civic_characters.17.a: "多劳多得，赞同工匠争取应得的回报。"
 nesnd_civic_characters.17.b: "让工匠自行陈述要求。"
 nesnd_civic_characters.117.t: "手艺与谋生"
 nesnd_civic_characters.117.d: "韩士铎仍把工匠学堂与工钱、伤病放在一起议论。厂场需要熟练的人，工匠也要知道学成之后能否改善谋生的条件。技能教育由此进入劳工与雇主的争执。"
 nesnd_civic_characters.117.organisation: "韩士铎已不再参与本国的公共活动，工匠求学和谋生的要求仍在厂场间传开。教什么手艺、谁付学费、学成后拿多少工钱，仍需地方各方回答。"
 nesnd_civic_characters.117.a: "学堂要通向谋生的道路。"
 nesnd_usm_jiang_first: "绍衡"
 nesnd_usm_jiang_last: "蒋"
 nesnd_civic_characters.18.t: "跨省投资的账目"
 nesnd_civic_characters.18.d: "蒋绍衡要求把跨省工程与资本集中的账目放进公开的预算讨论。沿海的利润、内陆的税负和各省的学额都有不同的承担者，不能只凭一份总数结束争论。"
 nesnd_civic_characters.18.a: "赞同公开讨论跨省投入。"
 nesnd_civic_characters.18.b: "让各省继续争论分配。"
 nesnd_civic_characters.118.t: "各省的所得与负担"
 nesnd_civic_characters.118.d: "蒋绍衡仍要求把跨省投资逐项摆进预算讨论。沿海利润和内陆税负不能互相抵销成一个无主的总数。礼议院中的各省学政还要向本省说明所得与负担。"
 nesnd_civic_characters.118.organisation: "蒋绍衡已不在本国的公共活动中，跨省工程仍牵连着出资者和纳税者。各省学政面对本省的要求，仍须在礼议院的预算讨论中说明地方所得。"
 nesnd_civic_characters.118.a: "把各省的负担说清。"
