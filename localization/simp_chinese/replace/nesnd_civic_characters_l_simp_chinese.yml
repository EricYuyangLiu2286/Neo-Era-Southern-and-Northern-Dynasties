l_simp_chinese:
 nesnd_ita_valdieri_first: "乔万尼"
 nesnd_ita_valdieri_last: "瓦尔迪耶里"
 nesnd_civic_characters.1.t: "信贷的条件"
 nesnd_civic_characters.1.d: "军队的订货能养活一批工场，也能拖垮一批工场。原料、机器和工人的薪水都要先行支付，国库的偿款却未必赶得上商人的期限。瓦尔迪耶里愿意出面筹措信用，条件是政府说明哪些订货由谁担保、又靠什么偿还。\n\n他的商人朋友看好同法国往来的生意。地方纳税人关心的则是另一件事：倘若生意做坏了，政府许下的担保，最后会落到谁的头上？"
 nesnd_civic_characters.1.a: "支持他，工场需要可靠的信用。"
 nesnd_civic_characters.1.b: "商人借钱，自有商人的条件。"
 nesnd_civic_characters.101.t: "担保与偿款"
 nesnd_civic_characters.101.d: "瓦尔迪耶里发现，厂主们并不缺少承接军需的热情。他们缺少的是垫付下一批原料的把握。政府的信用越被看重，偿款安排便越不能含糊，否则所谓繁荣，便只是把国库的欠款转成工场的欠债。\n\n他为此继续奔走。同法国做生意的机会固然诱人，商人却还要凭本国的付款承诺决定肯拿出多少钱。"
 nesnd_civic_characters.101.organisation: "军需承包商们又带着垫款的难处来找政府了。工场要开工，原料商要现钱，国库许下的偿款却总在日后。此前由瓦尔迪耶里出面商谈的担保，如今成了借款人与放款人共同关心的事。没有谁愿意先替另一方承担损失。"
 nesnd_civic_characters.101.a: "信用终究要靠偿还来维持。"
 nesnd_ita_bellandi_first: "特蕾莎"
 nesnd_ita_bellandi_last: "贝兰迪"
 nesnd_civic_characters.2.t: "报馆旁的女校"
 nesnd_civic_characters.2.d: "报馆旁的女校里，贝兰迪正在教学生读那些讨论公民权利的文章。她很快发现，文章中的许多道理恰好可以用来追问办学的人。一个人若从幼年起便无从识字，成年以后，又怎能独立判断那些以他的名义决定的国事？\n\n这位拥护共和的教师因此要求扩大妇女与穷人的求学机会。她的读者中不乏赞美自由的体面人物，等到需要为女校付钱、承认女子学成后的资格时，他们的热情却未必同样充足。"
 nesnd_civic_characters.2.a: "支持她，公民应当有求学的机会。"
 nesnd_civic_characters.2.b: "文章可以登，政府暂不表态。"
 nesnd_civic_characters.102.t: "女校与公民"
 nesnd_civic_characters.102.d: "贝兰迪在报章上写女校的经费、学生的家境，也写那些因无力求学而被挡在公民生活之外的人。共和论说中的自由和独立，经她一问，便成了谁来付学费、谁准许入学的难题。\n\n赞同她的读者可以在纸上同声喝彩。要让妇女和穷人真正走进学校，仍须有人承担办学的费用，也须有人肯让他们取得知识带来的力量。"
 nesnd_civic_characters.102.organisation: "贝兰迪的倡议在女校与报馆之间留下了回响。关于公民教育的文章有人读，也有人赞同。然而，教师的薪水与贫困学生的学费，尚须从赞同者的口袋里拿出来。曾经称许这位女士的人，现在也开始被问到自己肯出多少力了。"
 nesnd_civic_characters.102.a: "公民的学问，要从识字开始。"
 nesnd_ita_rusciani_first: "马泰奥"
 nesnd_ita_rusciani_last: "鲁夏尼"
 nesnd_civic_characters.3.t: "南方留下的税款"
 nesnd_civic_characters.3.d: "共同的政治中心要有人供养，南方的道路和学校也要有人供养。鲁夏尼带来的地方意见，正是要把这两笔开支放在一起算。商户愿意借合作打开商路，却不愿把地方的税款送出去以后，修路办学仍须自己承担。\n\n矿权能带来多少收入，收入又应留给地方多少？鲁夏尼要求先把这些事情谈清。对南方人而言，合作的好处总该有一部分能够留在南方。"
 nesnd_civic_characters.3.a: "支持南方留下应有的财源。"
 nesnd_civic_characters.3.b: "地方的账，让他们自己争取。"
 nesnd_civic_characters.103.t: "共同财政中的南方"
 nesnd_civic_characters.103.d: "鲁夏尼谈论共同财政时，总要回到南方的道路与学校。政治中心希望取得可靠的税源，地方商户也希望取得可靠的商路。双方都赞成合作，分歧在于谁先出钱，又由谁承担此后不断增加的开支。\n\n矿权收入因而成了争论的要处。若地方先交出财源，再等着别人决定拨款，合作便很难取得纳税人的信任。"
 nesnd_civic_characters.103.organisation: "南方商户要求共同财政给本地留下明确的份额。税款送去容易，再要回来修路办学却须处处求人，鲁夏尼当初提出的忧虑因而仍能得到许多呼应。中央与地方都指望矿权带来的收入，至于对方的需要，似乎总可以稍等一等。"
 nesnd_civic_characters.103.a: "南方的税款，也该用来经营南方。"
 nesnd_ita_sereni_first: "卢卡"
 nesnd_ita_sereni_last: "塞雷尼"
 nesnd_civic_characters.4.t: "军费与工程学校"
 nesnd_civic_characters.4.d: "共和信念能把志愿者召到旗帜下，却不能替军人供养家庭。塞雷尼主张统一军队的指挥，也要求把军饷、工程学校和退伍后的生计一并列入军费讨论。国家希望得到训练有素、服从号令的军队，就不能只在需要士兵时才想起他们。\n\n这些主张使老兵们愿意听他说话。欠薪和虐待并不会因为军旗上写着共和而变得容易忍受。至于离开军营以后，他们还要靠什么过日子？"
 nesnd_civic_characters.4.a: "赞同他！"
 nesnd_civic_characters.4.b: "他们要哗变吗？"
 nesnd_civic_characters.104.t: "志愿军的日后"
 nesnd_civic_characters.104.d: "塞雷尼仍积极地奔走着，为他的老兵同袍们争取薪饷与退伍后的社会保障、工作条件。军费讨论往往止于军队能够作战，老兵却还要考虑自己不能再作战时的生活。工程学校所能传授的手艺，正与他们的日后相连。\n\n让志愿者为共同事业服役并不难理解。要他们连家人的生计也一并奉献，事情就不那么简单了。"
 nesnd_civic_characters.104.organisation: "服役的人要领饷，退伍的人要谋生。塞雷尼曾把这些要求带到军费讨论中，老兵们也记住了那些赞同过他的言辞。军队需要他们时，共和的利益就是大家的利益。等到他们需要供养时，国库又会拿什么来答复呢？"
 nesnd_civic_characters.104.a: "服役的人，也要有退伍后的生活。"
 nesnd_ita_vitali_first: "保罗"
 nesnd_ita_vitali_last: "维塔利"
 nesnd_civic_characters.5.t: "学校由谁负担"
 nesnd_civic_characters.5.d: "教宗旧地的教育争论，已经从谁有权教导孩子延伸到谁来支付学费。维塔利主张由公共经费分担办学开支，同时要求地方教会负起教育责任。这种意见，使他在维护教会权威的人当中也显得不大讨喜。\n\n教会要保有学校，政府要培养国民，普通家庭则盼着孩子学会一些有用的知识。几种愿望原可相容，到了教师的薪水与穷学生的学费上，却又没有谁愿意多承担一点。"
 nesnd_civic_characters.5.a: "支持教会承担办学的责任。"
 nesnd_civic_characters.5.b: "谁主张办学，谁先想办法。"
 nesnd_civic_characters.105.t: "教会与学费"
 nesnd_civic_characters.105.d: "维塔利把教会教育的争论引向了教师的薪水和学生的学费。他认为，若要使教会保有教育民众的地位，就必须让普通家庭送得起孩子读书。仅仅反对政府干预，并不能替学校付清开支。\n\n地方教会需要公共拨款，却不愿放弃办学的权力。政府愿意出钱，又希望对课程有所过问。维塔利试图让双方接受共同负担，结果双方也都在问他准备替谁说话。"
 nesnd_civic_characters.105.organisation: "办学的开支使地方教会与居民再次发生争论。维塔利主张的共同负担得到了不少口头支持，到了出钱的时候，却各有各的困难。教会希望保住教育民众的地位，家庭希望孩子能够读书，教师则只想先领到自己的薪水。"
 nesnd_civic_characters.105.a: "先让孩子读得起书。"
 nesnd_ita_martelli_first: "罗莎"
 nesnd_ita_martelli_last: "马尔泰利"
 nesnd_civic_characters.6.t: "矿工的伤口"
 nesnd_civic_characters.6.d: "矿工因伤离开矿井以后，家庭往往也随之失去生计。矿主与地方政府都要从矿业中取得收入，这些为它付出劳动的人，却可能连孩子的学费也无力缴纳。\n\n马尔泰利与工人组织要求从矿业所得中拿出一部分，用于劳动安全、教育和伤病补偿。矿主说经营已有许多成本，地方又说财政另有许多用途。工人们听过这些理由以后，更想知道自己究竟在这份事业中占了什么位置。"
 nesnd_civic_characters.6.a: "支持矿工，他们有权得到保障。"
 nesnd_civic_characters.6.b: "让工人自己向矿主提出要求。"
 nesnd_civic_characters.106.t: "离开矿井以后"
 nesnd_civic_characters.106.d: "马尔泰利继续为伤病矿工发言。矿业的收入养活了矿主的事业，也成为地方财政的来源，因伤不能下井的家庭却可能上顿不接下顿。工人组织要求把安全与教育列入地方开支，让已经创造过财富的人也能分享它。\n\n围绕这些开支的争论，正在把原先各家的不幸变成共同的要求。矿井需要工人的时候承认他们的用处，工人受伤以后又该由谁负责？"
 nesnd_civic_characters.106.organisation: "矿井里受伤的人不断增加，互助组织已经难以供养他们的家庭。马尔泰利曾要求从矿业收入中拨款救济，矿工们如今也以同样的理由向地方提出要求：这笔财富既然出自他们的劳动，总该容许不能劳动的人分得一点。"
 nesnd_civic_characters.106.a: "不能下井，便不配活下去吗？"
 nesnd_hus_tong_first: "世衡"
 nesnd_hus_tong_last: "佟"
 nesnd_civic_characters.7.t: "承包人的账"
 nesnd_civic_characters.7.d: "佟世衡看中了海港与内陆之间尚未接通的生意。木材运得出去，货物运得进来，道路便有收入，商人也就愿意先替政府垫付工程的钱。为此，他主张以长期承包换取私人资本。\n\n商人当然不会白白修路。他们索取稳定收益的条件，也将决定地方以后怎样使用这些道路。特许经营能替国库分担眼前的开支，却可能把沿途的生产与贸易长期交到承包者手里。"
 nesnd_civic_characters.7.a: "支持他，让商人的资本修成道路。"
 nesnd_civic_characters.7.b: "承包条件还得让地方议论。"
 nesnd_civic_characters.107.t: "特许经营的边界"
 nesnd_civic_characters.107.d: "佟世衡的承包主张把工程和商业利益紧紧联在一起。港口希望内陆有更多货物，商人希望出资后取得稳定的收入，地方则希望道路能够通到自己需要的地方。这几种愿望有时相合，有时却很不一样。\n\n所以，商人愿意垫资还不足以平息争论。承包期限和收益的安排，会决定哪些工程值得他们动工，也会影响地方往后的运输负担。"
 nesnd_civic_characters.107.organisation: "港口商人与内陆承包者仍在争取长期特许。佟世衡提出的垫资办法让政府有望少拿一笔现钱，沿途商户却担心日后须多付许多运费。双方都愿意道路早日建成，只是希望由旁人多承担一点代价。"
 nesnd_civic_characters.107.a: "道路所经，皆是繁荣。"
 nesnd_hus_shen_first: "季川"
 nesnd_hus_shen_last: "沈"
 nesnd_civic_characters.8.t: "债契与求学"
 nesnd_civic_characters.8.d: "债契能规定一个人欠多少钱，也能把一个家庭长久地束缚在债主身边。沈季川收集这些家庭的陈述，主张结束债役，并为已经摆脱奴役的人争取识字与结社的机会。\n\n旧日依附留下的贫穷不会随自由一同消失。不识字的人仍难读懂下一张契约，无从结交同伴的人也难独自对抗势力深厚的债主。沈季川因此把教育同人身自由放在一起谈：获得自由之后，人总该有些守住它的本领。"
 nesnd_civic_characters.8.a: "支持他们求学，也支持他们摆脱依附。"
 nesnd_civic_characters.8.b: "先让人们听见这些家庭的陈述。"
 nesnd_civic_characters.108.t: "债役家庭的明天"
 nesnd_civic_characters.108.d: "沈季川带来的陈述，反复触及债役家庭日后的生计。债契的效力受法律支配，能否找到别的工作、读懂新的契约，则又取决于他们拥有多少学识与机会。\n\n他因而要求把识字和结社看作这些家庭自己的事业。过去由债主替他们决定去向，如今若连求学和互助的余地也没有，穷困仍会迫使他们重新依附于人。"
 nesnd_civic_characters.108.organisation: "沈季川收集过的债役家庭陈述，仍在求学与废除债役的倡议者之间传阅。欠债者的子弟也要做工，无暇识字。等他们长成，又只能听债主解释自己究竟欠了多少。这种一代接着一代的依附，正是要求改变法律的人所要打破的东西。"
 nesnd_civic_characters.108.a: "自由以后，也须有自由谋生的本领。"
 nesnd_hus_bayant_first: "巴彦图"
 nesnd_hus_bayant_last: ""
 nesnd_civic_characters.9.t: "牧道上的界桩"
 nesnd_civic_characters.9.d: "工程的地界在图上只是一条线，在牧民的生活中却可能截断整季的迁徙。牲畜要沿旧路寻找水草，承包者则要按自己的经营划定土地。巴彦图把受影响的牧民带到地方协商中，要求保留通道，或向失去牧地的家庭作出补偿。\n\n对于常居一地的人，绕开一处工地也许不算难事。但牧群的去路牵连着水源、草场与季节，不能只看界桩附近那一点土地值多少钱。"
 nesnd_civic_characters.9.a: "支持牧民保住迁徙的通道。"
 nesnd_civic_characters.9.b: "让地方与承包者接着商议。"
 nesnd_civic_characters.109.t: "牧道仍须通行"
 nesnd_civic_characters.109.d: "巴彦图要求地方协商沿着牧群迁徙的路线来谈。承包者可以给占用的土地估价，牧民却要算失去通道以后，牲畜还能到哪里去。若绕行的路上没有足够水草，一笔补偿未必能换回原来的生计。\n\n工程带来的收益有人期待，工程占去的道路也有人依赖。这些家庭要求自己的生活同样被列入地方的打算。"
 nesnd_civic_characters.109.organisation: "牧民要在季节变换以前确定通道，工程的地界却已经划了下来。巴彦图曾为他们争取牧道与补偿，如今这些家庭还得向地方说明：少了通往水草的路，损失的便远不止被占去的那一块地。"
 nesnd_civic_characters.109.a: "牧群总得有路可走。"
 nesnd_hus_lin_first: "素岚"
 nesnd_hus_lin_last: "林"
 nesnd_civic_characters.10.t: "工棚里的夜学"
 nesnd_civic_characters.10.d: "移民工人在工棚里彼此帮衬，林素岚便从这些互助往来中筹办夜学。工钱、债契和法令都是写在纸上的，许多人的生活却只能交给识字的人解释。雇主说扣了多少，债主说还欠多少，他们很难自己分辨。\n\n识字因而有了切身的用处，也使一些雇主感到不安。工人读懂契约之后，也许还会聚在一起问：这些条件为什么只能由别人来定？"
 nesnd_civic_characters.10.a: "支持夜学，让工人自己读懂契约。"
 nesnd_civic_characters.10.b: "互助求学，由他们自行操办。"
 nesnd_civic_characters.110.t: "夜学与工钱"
 nesnd_civic_characters.110.d: "林素岚所倡导的夜学，把识字同工人的日常争执联在一起。能看懂工钱和债契的人，可以自己核算所得，也能替身边的同伴读出条文。这点学问未必立即改变雇佣关系，却让工人在争论时多了一份根据。\n\n互助也在求学中继续。原先各自承受的困难，如今可以拿来相互议论。雇主所担心的，正是这些人不再把自己的遭遇当作孤零零的一件事。"
 nesnd_civic_characters.110.organisation: "工棚里的夜学继续有人求教。有人带来工钱的账，有人带来债契，希望识字的同伴替自己读明白。林素岚倡导的互助便在这些小事中延续。大家聚在一起以后，也渐渐发现自己遇到的麻烦原来如此相似。"
 nesnd_civic_characters.110.a: "读得懂，才说得清。"
 nesnd_hus_lu_first: "景铎"
 nesnd_hus_lu_last: "陆"
 nesnd_civic_characters.11.t: "公开工程的收支"
 nesnd_civic_characters.11.d: "工程师的名望可以替一项工程招来资本，也可以替一份特许取得信任。陆景铎不愿让专业资格停在这里。他要求公开工程收支，按施工与就业的实情付款，让承包者说明公共开支究竟换来了什么。\n\n地方代表未必懂工程，出资和纳税的人却有理由知道钱用在何处。倘若技术只用来证明承包者比旁人高明，特许与股权便容易落到有名望的人手里，而工程本身反倒无人过问。"
 nesnd_civic_characters.11.a: "支持公开收支，按工程实情付款。"
 nesnd_civic_characters.11.b: "先让他们把这笔账议论明白。"
 nesnd_civic_characters.111.t: "按什么付工程款"
 nesnd_civic_characters.111.d: "陆景铎提出，工程的进度、雇用了多少人和付出了多少钱，应当能相互说明。承包者可以凭专业赢得信任，却不能要求地方把此后的一切开支也一并信任。\n\n在他看来，公开账目关系着工程师以什么立身。专业知识若只替持有特许的人说话，地方迟早会把工程师与承包商当作一回事。"
 nesnd_civic_characters.111.organisation: "地方代表又在追问工程款的去处。承包者希望他们相信专业判断，纳税人却要求看见花钱的结果。陆景铎所主张的公开收支，因此也得到了一批未必懂得工程的人支持。他们不懂技术，但懂得自己的钱是怎样挣来的。"
 nesnd_civic_characters.111.a: "既用了公款，就须说得清所得。"
 nesnd_hus_guan_first: "廷宪"
 nesnd_hus_guan_last: "关"
 nesnd_civic_characters.12.t: "油税的去处"
 nesnd_civic_characters.12.d: "关廷宪要求产油地从油税中取得固定的份额。公司把利润用于开采新井，中央也把新增收入列入国用，地方居民却还在为道路与学校的经费争取拨款。地下出油，至少应该让地上的人先得些好处。\n\n这项主张得到了地方商户的支持，也触动了特许公司的打算。公司希望扩大事业，关廷宪则认为，若每笔收入都先满足下一笔投资，地方便只能永远等候。"
 nesnd_civic_characters.12.a: "支持产油地争取自己的收益。"
 nesnd_civic_characters.12.b: "油税的分配，还可继续商议。"
 nesnd_civic_characters.112.t: "产油地的要求"
 nesnd_civic_characters.112.d: "关廷宪把产油地的要求带进财政讨论。油业公司要以收益扩充事业，地方商户则要道路和学校支持自己的经营与生活。若每逢分配收入，都须先等公司安排完下一笔投资，地方所能留下的便总是余数。\n\n所以，他要求的既是一笔财源，也是地方在分配时说话的份额。"
 nesnd_civic_characters.112.organisation: "油井的收入使公司有钱开办更多油井，产油地的学校与道路却未必分得到经费。关廷宪要求地方取得固定份额，正好说中了商户与居民的不满。地下的油毕竟出自这里，总不能每逢分款便让这里的人等到最后。"
 nesnd_civic_characters.112.a: "产油地总不能只留下等拨款的人。"
 nesnd_usm_ji_first: "文衡"
 nesnd_usm_ji_last: "季"
 nesnd_civic_characters.13.t: "商工能否入仕"
 nesnd_civic_characters.13.d: "经营工商业的人越来越多地参与地方经济，通向国政的资格却未必承认他们所学。季文衡要求礼议院在考试与入仕资格中重视实学，使熟悉产业、账务与产权的人有机会参与公共事务。\n\n这会触动既有士绅凭学问与资格维持的地位，也给新进的商工之士带来声望。不过，承认经营实业的本领，是否就要连财产一并当作资格？若由家产替代门第，求学而无产的人又能从中得到多少好处？"
 nesnd_civic_characters.13.a: "支持实学，为商工之士拓宽入仕之路。"
 nesnd_civic_characters.13.b: "资格之争，留待诸士继续辩论。"
 nesnd_civic_characters.113.t: "实学与门第"
 nesnd_civic_characters.113.d: "季文衡的主张使商工之士与旧有士绅都开始追问考试应当考什么。熟悉实业的人要求自己的经验得到承认，久习经学的人则担心资格一旦改变，积累多年的地位也将随之动摇。\n\n礼议院所面对的因而不只是课程的增减。什么知识足以使人参与国政，背后连着什么人能够进入政界。"
 nesnd_civic_characters.113.organisation: "礼议院的考试该怎样对待实学，商工之士与旧士绅依然各执一词。季文衡曾为前者争取入仕资格，后者却认为不能让经商致富成为参政的捷径。双方都声称国家需要真正有学问的人，只是在各自看来，这样的人恰好都在自己一边。"
 nesnd_civic_characters.113.a: "既要他们经营实业，也应听他们议政。"
 nesnd_usm_duan_first: "敬川"
 nesnd_usm_duan_last: "段"
 nesnd_civic_characters.14.t: "教习与学额"
 nesnd_civic_characters.14.d: "巴蜀教习段敬川主张调整书院课程与学额，让实学在地方教育中取得更多位置。学生求学，为的是谋生，也为日后参与国政。所教的学问若得不到资格与考试的承认，教习讲得再好，也难使学生相信这条路走得通。\n\n段敬川因此把课程与学额一并提出。增加几门学问关乎课堂，承认学成者的资格却关乎政界愿意接纳怎样的人。"
 nesnd_civic_characters.14.a: "支持教习，让实学有路可进。"
 nesnd_civic_characters.14.b: "先听巴蜀教习们如何议论。"
 nesnd_civic_characters.114.t: "巴蜀教习的课程"
 nesnd_civic_characters.114.d: "段敬川关心的课程问题，始终绕不开学生的去向。书院可以传授实学，地方也需要这些本领，但求学者还希望所得的知识能帮助自己取得参与国政的资格。\n\n课程与考试各有所重时，教习便夹在其中。一边是学生的前程，一边是现有资格的分量，段敬川所争取的学额与承认，正要在两者之间找出一条可行的路。"
 nesnd_civic_characters.114.organisation: "巴蜀教习们还在争取实学课程与学额。段敬川当初提出的问题，眼下仍摆在他们面前：学生学成之后，究竟能凭这些本领取得什么资格？若课堂里教的东西进不了考试，许多人宁愿回去读那些已经读熟的旧书。"
 nesnd_civic_characters.114.a: "求学总该有可以走向的前程。"
 nesnd_usm_xu_first: "廷璋"
 nesnd_usm_xu_last: "许"
 nesnd_civic_characters.15.t: "旧资格与任意征敛"
 nesnd_civic_characters.15.d: "许廷璋对扩大入仕资格的主张抱有戒心。既有士绅凭多年求学取得的地位，不能因一时需要便轻易让给新进之士。地方积累的财富，也不能被当作战后可以任意征取的财源。这样的意见，在他的同道中并不孤单。\n\n然而，学校、军费与赋税的需要已经改变。许廷璋希望守住地方财产和旧资格，仍须解释这些不断增加的公共开支应由何处筹措。"
 nesnd_civic_characters.15.a: "支持士绅维护旧资格与地方财产。"
 nesnd_civic_characters.15.b: "让他们把守旧的理由说完。"
 nesnd_civic_characters.115.t: "士绅与地方开支"
 nesnd_civic_characters.115.d: "许廷璋反对任意征敛，得到地方士绅的呼应。他们不愿财产被战后的财政需要吞去，也不愿旧有资格在实学的名义下失去分量。\n\n可地方学校仍要办，军费仍要筹。维护旧秩序的人若希望继续主持地方事务，就不能只说哪些钱动不得、哪些人进不得。许廷璋的主张因而也在经受公共财政的追问。"
 nesnd_civic_characters.115.organisation: "地方士绅以许廷璋曾经提出的理由抵制新征敛。他们认为既有财产与入仕资格应受保护，不能任由战后财政的需要处置。不过，学校与军队还等着钱用。若这些财富不能动，又该去向谁征取呢？"
 nesnd_civic_characters.115.a: "要主持地方，也须负担地方。"
 nesnd_usm_luo_first: "映棠"
 nesnd_usm_luo_last: "罗"
 nesnd_civic_characters.16.t: "账簿与女工识字"
 nesnd_civic_characters.16.d: "罗映棠从工场账务与女工互助中看见了识字的用处。工钱如何结算，债务为何增加，货物又按什么数目交付，原本由识字的人解释的事情，女工若能自己读懂，便多了一份追问的根据。\n\n她因而筹办识字教育，把工场中的需要带到学校面前。女子学这些东西究竟有什么用？对于靠劳动维持家庭的人，答案远比争论求学资格的人想得切近。"
 nesnd_civic_characters.16.a: "赞同。求学何必分男女？"
 nesnd_civic_characters.16.b: "让互助者继续向地方倡议。"
 nesnd_civic_characters.116.t: "识字之后的资格"
 nesnd_civic_characters.116.d: "罗映棠从女工熟悉的账务谈起教育。读懂工钱与货单，既能帮助她们在工场里说话，也使她们看见自己能够承担别的事务。于是，求学的要求又触及了资格：学会以后，可以做什么？\n\n识字教育从工场传向学校，原有的身份与资格却未必随之松动。罗映棠所关心的，已经连到这些新本领能为求学者换来多少机会。"
 nesnd_civic_characters.116.organisation: "女工们从辨认货单、核算工钱开始求学，渐渐也有人希望凭这些本领取得新的职位。罗映棠倡导的识字教育因此触及了另一道门槛。过去说她们无学识，便不许她们做事。如今学会了，又拿什么理由来阻拦？"
 nesnd_civic_characters.116.a: "学会了本领，也该有施展的机会。"
 nesnd_usm_han_first: "士铎"
 nesnd_usm_han_last: "韩"
 nesnd_civic_characters.17.t: "工匠的学堂"
 nesnd_civic_characters.17.d: "厂主需要熟练工，工匠要靠手艺谋生，技能教育看似是双方都乐于见到的事情。韩士铎提出开办工匠学堂时，却把工钱、伤病和招工争执也带进讨论。学成之后所得多少，不能只听雇主一面安排。\n\n谁付学费，谁承担不能做工时的生活，决定着工匠是否有余力求学。厂场若希望取得熟练劳动，就须面对这些劳动者自己的要求。"
 nesnd_civic_characters.17.a: "多劳多得，赞同工匠争取应得的回报。"
 nesnd_civic_characters.17.b: "让工匠自己同雇主议论。"
 nesnd_civic_characters.117.t: "手艺与谋生"
 nesnd_civic_characters.117.d: "韩士铎要求工匠学堂同时讨论学费、工钱与伤病保障。雇主称赞培养手艺的益处，却不愿预先答应学成以后加薪。工人若得不到更好的生计，又为什么要从有限的收入中拿钱求学？\n\n学堂还没有替双方培养出熟练工，围绕它的费用与报酬，倒先把劳资之间的分歧显露出来了。"
 nesnd_civic_characters.117.organisation: "工匠与雇主都赞成传授手艺，却对学堂的费用各有打算。雇主希望找到更熟练的工人，工人希望学成之后多得些报酬。韩士铎曾把教育与工钱放在一起讨论，围绕这两件事的争执，如今也就一同留在厂场之间。"
 nesnd_civic_characters.117.a: "手艺长进了，日子也该有些长进。"
 nesnd_usm_jiang_first: "绍衡"
 nesnd_usm_jiang_last: "蒋"
 nesnd_civic_characters.18.t: "跨省投资的账目"
 nesnd_civic_characters.18.d: "跨省工程与资本集中，使不同地方的利益越来越难分开。沿海取得的利润、内陆承担的税负、各省所需的学额，并不总落在同一批人身上。总收入增加了，不能因此认定每一省都得到了好处。\n\n蒋绍衡要求把这些分别列入公开的预算讨论。各省学政到礼议院议事，既要考虑共同的事业，也要向本省说明为什么出钱、又将得到什么。"
 nesnd_civic_characters.18.a: "支持公开预算，让各省说清所得与负担。"
 nesnd_civic_characters.18.b: "各省自会为自己的份额争论。"
 nesnd_civic_characters.118.t: "各省的所得与负担"
 nesnd_civic_characters.118.d: "蒋绍衡要求预算讨论说明跨省投资的得失究竟归谁。沿海利润增加，不能替内陆纳税人缴税。一省多得学额，也不能回答别省学生的需要。把这些合成总数，容易使共同事业看起来人人有份，实际承担却仍有分别。\n\n礼议院中的各省学政因此须向本省解释：地方的财源用于何处，又凭什么值得承担。"
 nesnd_civic_characters.118.organisation: "跨省工程的收入与开支再度引起学政们争论。沿海商人称许投资带来的繁荣，内陆代表却要求说明本省出了多少税、又分得多少好处。蒋绍衡所主张的公开预算，正给了他们继续追问的理由。全国的总数再好看，也不能代替本省向纳税人作答。"
 nesnd_civic_characters.118.a: "共同的事业，也要说清各省的份额。"
 nesnd_c2_person_ita_valdieri_support: "支持工商业信用"
 nesnd_c2_person_ita_bellandi_support: "支持女校教育"
