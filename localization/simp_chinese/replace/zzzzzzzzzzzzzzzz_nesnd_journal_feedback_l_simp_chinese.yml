 nesnd_south_holdout_campaign:0 "未息的南朝战事"
 nesnd_south_holdout_campaign_reason:0 "吴朝的号令尚未遍及南方。仍然拥明的诸国各有打算：有人准备再战，有人希望借北朝之力保存基业，也有人已在议论归降。停战之后，朝廷仍须面对这些未服的对手。"
 nesnd_south_holdout_campaign_status:0 "仍有拥明势力未归附。"
 nesnd_south_holdouts_settled_tt:0 "拥明诸国的归属已经确定，南朝战事已停。"
 nesnd_south_holdouts.1.t:0 "停战之后"
 nesnd_south_holdouts.1.d:0 "本国已退出这场战争，但吴朝与拥明诸国的争执并未解决。败报与求和的消息相继传来，军中仍有人不肯放下兵器。如今，我们必须决定去向：再次举兵，向北朝寻求保护，或是承认吴朝的统治。"
 nesnd_south_holdouts.resist:0 "整军再战。"
 nesnd_south_holdouts.north:0 "遣使北上，请求庇护。"
 nesnd_south_holdouts.surrender:0 "向吴朝归降。"
 nesnd_south_holdouts_resist_tt:0 "着手再战，重新与大吴争夺南朝。"
 nesnd_south_holdouts_north_tt:0 "请求成为中华帝国的保护国。北朝将决定是否接纳；若未获保护，还须决定再战或归降。"
 nesnd_south_holdouts_surrender_tt:0 "本国将被大吴吞并。若明帝仍在本国，先安排其逃亡。"
 nesnd_south_holdouts.2.t:0 "南方来使"
 nesnd_south_holdouts.2.d:0 "[SCOPE.sCountry('nesnd_holdout_sender').GetName]的使者请求北朝保护。他们愿承认帝国的宗主地位，以求保住国土与军队。接受这份请求，便意味着帝国将在南朝纷争中承担新的责任。"
 nesnd_south_holdouts.accept:0 "接受归附。"
 nesnd_south_holdouts.refuse:0 "帝国无意承担此事。"
 nesnd_south_holdouts_accept_tt:0 "接纳来使所属国家为保护国。"
 nesnd_south_holdouts_refuse_tt:0 "不提供保护，由来使所属国家另作决定。"
 nesnd_south_holdouts.3.t:0 "北朝未允"
 nesnd_south_holdouts.3.d:0 "北朝未能给予我们保护。使者的往返没有改变眼前的局势：要保住自己的国土，便须重新迎战吴军；要结束这场争夺，便只能向吴朝归降。"
 nesnd_south_holdouts.4.t:0 "北朝的保护"
 nesnd_south_holdouts.4.d:0 "使者带回了接受归附的答复。我们的国土与军队得以保留，北朝也成为本国的宗主。战后的生计与秩序，仍须由我们自己收拾。"
 nesnd_south_holdouts.4.a:0 "先让百姓休息吧。"
