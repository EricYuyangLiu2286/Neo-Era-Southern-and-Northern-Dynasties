l_simp_chinese:
 nesnd_cne_confidence_journal:0 "帝国人民的信心"
 nesnd_cne_confidence_journal_reason:0 "大革命的烽火已经远去，却还照着这一代人的前路。县署中的吏员、营垒里的中下军官与士兵，以及渴望摆脱旧日束缚的农民，仍把地权革命视为当年誓言的延续。\n\n中华帝国终究不是一八一〇年那些青年士人与军人憧憬的共和国。南方与西北的流亡共和党人将牧仲棠斥作叛国者；然而在许多人心中，牧皇及其同道依然代表着开蒙运动与进步的希望。朝廷如今所能动员的，既是皇权，也是人们尚未冷却的热情。一次次清丈、迁业与整营，都在要求他们继续忍耐。"
 nesnd_cne_confidence_status:0 "各省仍相信朝廷能完成大革命未竟之业。"
 NRP:0 "大汉共和军"
 NRP_ADJ:0 "共和军"
 nesnd_cne_republic_restored_name:0 "大汉共和邦"
 nesnd_cne_republic_army:0 "共和救国军"
 nesnd_republic_commander_first:0 "承志"
 nesnd_republic_commander_last:0 "韩"
 dp_nesnd_cne_republic:0 "共和派起义"
 nesnd_cne_republic_war:0 "大汉共和战争"
 nesnd_cne_republic_journal:0 "重建大汉共和邦"
 nesnd_cne_republic_journal_reason:0 "共和之名曾将北方的士人与军民召集在同一面旗帜下。后来皇座重立，旧日同道散作君臣，也散作仇敌。如今各地的共和派再次起兵，声言要结束牧氏的帝业，重建大革命尚未完成的共和国。\n\n这场战争不能以一纸边界收场。共和军若无力推翻燕京与中原的皇权，地方上的盟约终将瓦解；若能夺取帝国大部州郡，便可接收其疆土，以大汉共和邦之名号召南方。"
 nesnd_cne_republic_status:0 "与中华帝国交战期间，共和军直接控制其至少#v 80%#!的州，即可吞并帝国并重建大汉共和邦。双方均以吞并对方为战争诉求。\n若战争结束时中华帝国仍然存在，共和事业便告失败，共和军领土归入帝国。胜利后，对湖南、湖北与四川尚未归本国或其附属统辖的地区取得声索。"
 nesnd_cne_confidence.1.t:0 "旧日的旗帜"
 nesnd_cne_confidence.1.d:0 "北方传来急报：地方共和派已经举兵，营中的军官与乡间的旧党人共同宣布，不再承认牧氏朝廷。他们以“大汉共和军”为号，指斥帝国背弃了大革命的誓言。昔日支持地权革命的人群，正在分裂。"
 nesnd_cne_confidence.1.a:0 "召集尚忠于朝廷的军队。"
 nesnd_cne_confidence.2.t:0 "再举共和之旗"
 nesnd_cne_confidence.2.d:0 "各地盟誓既成，共和军已经起兵。新政府宣布废除帝制，重建大汉共和邦。军中有人还记得当年与牧仲棠并肩作战的岁月，但这一次，他们的旗帜将向帝国的腹地推进。"
 nesnd_cne_confidence.2.a:0 "愿共和之志不再负于天下。"
 nesnd_cne_confidence.3.t:0 "大汉共和邦"
 nesnd_cne_confidence.3.d:0 "帝国旧政府已经倒下。共和军接收了其州郡与官署，以大汉共和邦之名建立新政府。对于仍在南方分立的湖南、湖北与四川诸地，议会重申了大革命以来统一国家的主张。"
 nesnd_cne_confidence.3.a:0 "重建共和国。"
 nesnd_cne_confidence.4.t:0 "共和军归降"
 nesnd_cne_confidence.4.d:0 "共和军已无力继续战争，各地盟约随之解散。帝国重新接收了这些州郡，地方官署与营伍又奉朝廷号令。战事虽然结束，举兵者留下的质问却仍在民间流传。"
 nesnd_cne_confidence.4.a:0 "接收州郡，重整秩序。"
