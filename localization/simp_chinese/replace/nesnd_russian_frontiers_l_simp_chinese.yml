l_simp_chinese:
 je_the_eastern_border_reason: "俄国若要让舰队常驻太平洋，就须取得黑龙江入海处的航路和滨海的港湾。西面另有一道边界。自十六世纪末以来，通往伊犁与吉尔吉斯牧地的商路便穿过西秦的辖境。海口的驻军和山口的关税，须分别与掌管当地土地的人交涉。"
 je_the_eastern_border_treaty_of_aigun_desc: "黑龙江把西伯利亚的驻地同太平洋连在一起。若缔约的中国政府拥有这段江岸，俄国便可向它提出划界与通航的条件。"
 je_the_eastern_border_treaty_of_beijing_desc: "滨海的港湾可供太平洋舰队停泊补给。若缔约的中国政府拥有这片海岸，俄国便可要求它割让土地，以便在此设港。"
 je_the_eastern_border_russia_chuguchak_protocol_desc: "塔城的界约关系到山口由谁驻兵，牧群越界向谁纳税。俄国可要求缔约的中国政府割让边地，但它只能割让自己管辖的土地。"
 russo_chinese.2.d: "边界使节已在塔城会谈。图上待划的一段线，一头通向俄国的哨所，另一头牵动山谷里的牧场和商道。俄方须决定把哪些土地列入议定书。"
 russo_chinese.2.f: "春季过山的牧户认得水草所在，商队记得哪处关口收税。使节的地图却只能画一条线。一旦界碑立定，就连原路归来的牲群也可能要换一张通行文书。"
 je_pacify_the_steppes_reason: "哈萨克牧民随季节迁徙。俄国在北缘修筑哨所，要求过路商队和附近的牧户服从边地当局。南面的绿洲与商路则自十六世纪末起便在西秦治下。沿河的一道堡垒能拦住渡口，却管不到下一个季节的牧场。\n\n驻军要维持补给，须争取与俄国有保护关系的首领合作。反抗者也在走访各营地，寻找愿意一道举兵的人。"
 je_pacify_the_steppes_lobby: "#v 由该DLC解锁：Sphere of Influence#!\n俄国在哈萨克草原北缘设有堡垒，并通过保护关系取得部分首领的协助。驻军能否在开春后得到马匹和粮草，还得看各地牧户如何回应。"
 je_the_last_kazakh_khan: "汗旗之下"
 je_the_last_kazakh_khan_reason: "举兵的哈萨克首领已经推举可汗，向俄国在草原的驻军发出挑战。俄国若要重新控制起事地区，就须击败这个新聚集起来的政权。"
 kazakhstan_events.1.d: "哈萨克首领推举可汗，召集愿意追随他们的牧户。草原上的起事已有了自己的旗号，俄国各堡之间运送粮食和弹药的道路首当其冲。"
 kazakhstan_events.1.f: "消息是随换马的信使传来的。有人牵了备用马跟他走，也有人赶着牲群远离渡口。等到下一个营地看见汗旗，前一个营地已经为自己的选择付出了粮草。"
 kazakhstan_events.3.d: "边地驻军重新掌握了通往草原的道路。归俄国管辖的哈萨克地区怎么治，商道南边还要不要再提领土要求，都摆在了圣彼得堡面前。"
 kazakhstan_events.3.f: "最后一辆粮车进堡时，渡口的人已经散了。守军把哨卡重新设在河岸上。明春牧群北返，这些哨卡收谁的税，又许谁过河，才是沿岸人家最关心的事。"
 notification_kazakhstan_ride_of_kenesary_notification_desc: "[SCOPE.sCharacter('kenesary_scope').GetFullName]开始袭击[SCOPE.sCountry('russia_scope').GetAdjective]驻军及其在草原上的盟友。"
 je_conquest_of_central_asia_reason: "向南的商队越过哈萨克草原，便到了河中与花剌子模的城镇。自十六世纪末起，布哈拉、希瓦和费尔干纳便在西秦治下。俄国若想控制通往波斯与印度的道路，就须取得关口、渡口和沿线城镇，而每一处都有守军和自己的谋生手段。"
 je_conquest_of_central_asia_lobby: "#v 由该DLC解锁：Sphere of Influence#!\n河中诸城与花剌子模的绿洲自十六世纪末以来深受西秦统治的影响。俄国要把边防线推到商队南下的道路上，就须从原有政权手中取得沿线据点。"
 russian_central_asia.1.d: "草原以南，河流把布哈拉、希瓦和费尔干纳的城镇连成一条商路。俄国的军队可以沿路前进，却不能单靠骑兵把货物送过每一道关口。"
 russian_central_asia.1.f: "一支驮队在关口等上三日，就要多备三日的草料。商人愿为一张沿途通用的凭照付钱，征税的人却不愿把这笔收入交给另一座城。使者带来的礼物和军官带来的地图，都将摆在同一张桌上。"
 russian_central_asia.2.t: "通向南方的商路"
 russian_central_asia.2.d: "俄国已把中亚的几条主要商路纳入自己的势力范围。从绿洲再往南，车队仍须经过山口，才能进入阿富汗高地，继而通往印度或波斯。边地军官主张把防线继续向前推，商人则盼着先让已经打通的道路安定下来。"
 russian_central_asia.2.f: "在山口以北，一纸通行证已经够用。在山口以南，领队照旧把几种钱币缝在腰带里，以备下一处关卡之需。军官说还须多设一座哨所，商人问的是在那里要缴几次税。"
 je_conquest_of_central_asia_turkmen_button_desc: "从里海东岸南下的驮队须经过土库曼牧地。派军队守住水井和驿路，便能控制来往车马，也会使依靠这些水源放牧的人与驻军发生冲突。"
 russian_central_asia.3.d: "沿里海东岸的道路屡有袭击，商队请驻军派人护送。俄国已决定向土库曼牧地出兵，争夺沿线的水井和停宿之地。"
 je_eastern_frontier_reason: "赫拉特的道路向西通往波斯，向北经木鹿的绿洲进入河中。波斯历代君主以呼罗珊的旧名申张权利，西秦则从十六世纪末起便在这些商道上征税驻兵。要把旧日主张化为今日的统治，波斯须实际取得东部诸州，维持驿路，并修复木鹿。\n\n若被占领的绿洲中有遭奴役的波斯人，政府还须决定是否释放他们，以及是否#tooltippable #tooltip:je_eastern_frontier_tt_5 另择州安置#!#!。"
 greater_khorasan_button_desc: "波斯的君主历来把赫拉特视为呼罗珊的门户。如今若公开声索大呼罗珊，就须准备同掌管城门与山口的政府交涉，也须承担交涉破裂后的军费。"
 persian_baluchistan_button_desc: "土库曼牧地上的水井和驿路关系到波斯边境的安全。若派兵北上，驻军便可护送商队，也要同当地牧户争用有限的水源。"
 persia_resettle_merv_button_desc: "木鹿的城墙还在，绿洲的盛衰却取决于穆尔加布河的水能否流到田里。若要招来居民，政府须先修堤疏渠，让耕作者有粮收，让经过木鹿的商队有地方停宿。"
 persia_events.1.d: "波斯及其附属国如今已控制呼罗珊、花剌子模与河中的目标地区，木鹿的修复也已完成。东部的关口和驿路从此需要长期驻军，才能把这场征服维持下去。"
 persia_events.1.f: "沿途的商人最先知道边界变了。他们把旧收据留在包袱底，又在下一处城门学会新官吏验看关文的规矩。绿洲里的田亩仍须逐渠量水，河上的渡船也照旧要有人修补。"
 persia_events.3.d: "波斯决定向北方的土库曼牧地派兵。军官们要占住沿途水井，给经过沙漠的商队设立护卫，并以驻军限制当地武装的活动。"
 persia_events.3.f: "两处水井之间有一天的路程。驮队尚能在天黑以前赶到，带着火炮的队伍却须在途中扎营。远征军出发前，向导首先问起的便是每头牲口能驮几袋水。"
 persia_events.5.d: "军队进入[SCOPE.sState('persia_slave_liberate_state_scope').GetName]后，在当地发现了遭奴役的[SCOPE.sCulture('persian_culture').GetName]人口。有人来打听失散的亲属，也有人要求政府准许他们留下或返乡。奴隶主则反对失去手中的劳力。"
 persia_events.5.f: "来找人的亲属说得出村名、乳名，甚至某人手上旧伤的位置。守门的兵卒只知道簿上记着一个价钱。直到被带来的人听见了故乡的称呼，才有人能答复究竟认错了没有。"
 persia_events.2.d: "[SCOPE.sState('herat_scope').GetName]如今已在波斯一方的管辖之下。向东是通往喀布尔的道路，向北可沿商路抵达木鹿。要守住这个路口，驻军还得等到下一支补给队抵达。"
 event_effects_kazakhstan_events.1_tt: "• #v $dyn_c_kazakh_khanate$#!从俄属大玉兹或俄国一方控制的锡尔河领地起兵，取得俄国及其哈萨克属国在锡尔河与七河的领地。\n• 仍属俄国的大、中、小玉兹中，[concept_liberty_desire]高于#v 60#!者加入汗国。\n•剩余所有[GetCulture('kazak').GetName][Concept('concept_subject', '$concept_subjects|q$')]的[GetPlayer.MakeScope.ScriptValue('large_radicals')|-=1%]的[GetCulture('kazak').GetName][Concept('concept_pop', '$concept_pops|q$')]变为[concept_radical]\n•所有剩余[GetCulture('kazak').GetName][Concept('concept_subject', '$concept_subjects|q$')]获得#tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_kazakh_ungovernable_provinces_tt $modifier_kazakh_ungovernable_provinces$#!"
 event_effects_kazakhstan_events.3_tt: "• 俄国吞并在中亚拥有领地的哈萨克属国，$BKH$除外。\n$event_effect_choose_one$\n• 俄国声索中亚地方政权控制的地区。区内可有俄国领地，但若有其他外来政权或以满、汉文化为主流的政权占地，该地区不在声索之列。\n• 俄国治下的哈萨克本土州获得#tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_defeat_of_kenesary_khan_tt $modifier_defeat_of_kenesary_khan$#!。"
