l_simp_chinese:
 nesnd_american_restoration: "旧王朝与地方共同体"
 nesnd_american_restoration_reason: "蒙特祖玛王族与安第斯宫廷的复兴有着不同的来路，却都要回答同一个问题：共和国建立以后，原住民共同体能否掌握自己的土地和地方政治？王朝的支持者从旧日盟约中寻找合法性，乡村则要求结束新统治者对地权的侵夺。承认、谈判或镇压，将决定这些诉求怎样进入国家的未来。"
 nesnd_native_recognize: "承认旧王朝与地方盟约"
 nesnd_native_recognize_desc: "让旧王朝与地方共同体共同参与新的统治安排。"
 nesnd_native_recognize_tt: "恢复原住民君主制；若印卡宫廷已经建立，则提出合并请求，须由对方在九十日内同意。"
 nesnd_native_negotiate: "谈判地方议会与地权"
 nesnd_native_negotiate_desc: "以地方议会和地权谈判换取乡村的合作。"
 nesnd_native_negotiate_tt: "复统压力立即降低十五点；谈判期间，地方议会持续缓和复统运动。"
 nesnd_native_suppress: "镇压复统组织"
 nesnd_native_suppress_desc: "动用军队摧毁复统组织，承担随之而来的迁徙和乡村激化。"
 nesnd_native_suppress_tt: "现存原住民人口各有四成迁往具备接纳州的避难国。若没有可接纳目的地，人口留在原处，此次迁徙立即结束。实际接纳迁民的目的地州在60个月内迁徙吸引力提高25%。部分政治人物将流亡；迁徙后，本国剩余原住民人口的15%转为激进派。军力门槛按潜在起兵规模的保守上限估计。"
 nesnd_native_local_councils: "地方议会与地权谈判"
 nesnd_native_restored_rule: "复兴王朝的威望"
 nesnd_native_exiles: "原住民避难网络"
 nesnd_restoration_pressure_bar: "复统压力"
 nesnd_restoration_pressure_bar_desc: "乡村共同体与旧王朝支持者联合行动的力量。压力达到顶点后，复统派将在具备足够土地和人口的地区起兵。"
 nesnd_restoration_pressure_base: "复统组织的扩展"
 nesnd_restoration_pressure_radicals: "激进人口的支持"
 nesnd_restoration_pressure_poverty: "贫困中的不满"
 nesnd_restoration_pressure_repression: "地方议会的调解"
 nesnd_restoration_existing_court_status: "印卡宫廷已经建立。承认现存宫廷，将提出须由双方同意的合并请求；两国须各自独立且未在交战。既有复统案件结束后，不再另立宫廷或重新起兵。"
 nesnd_restoration_waiting_land_status: "复统派正在寻找足以起兵的核心地区；土地、人口或当前战事尚不允许割地建国。"
 nesnd_restoration_politics_status: "旧王朝的拥护者与地方共同体正在争取政治支持。"
 nesnd_native_restoration_war: "王朝复兴之战"
 nesnd_native_restoration_war_reason: "复统派已建立自己的政府。两国争夺的既是旧王朝的名号，也是土地、军队与地方共同体究竟服从谁的权力。只有实际执行的战争要求才能决定统一；停战则保留已经存在的两国。"
 nesnd_restoration_war_status: "双方仍须以实际战争或和约决定复统的命运。"
 nesnd_restoration_war: "王朝复兴之战"
 dp_nesnd_native_restoration: "王朝复兴之战"
 dp_nesnd_native_restoration_desc: "复统王朝与共和国争夺国家的统治权，胜者将吞并败者。"
 dp_nesnd_native_restoration_tooltip: "#header $dp_nesnd_native_restoration$#!\n$dp_nesnd_native_restoration_desc$"
 wg_nesnd_restoration_settlement: "统一复国疆土"
 wg_nesnd_restoration_settlement_desc: "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 nesnd_american_restoration.1.t: "旧王朝的旗帜"
 nesnd_american_restoration.1.d: "地方共同体的武装与旧王朝的支持者公开决裂，另立政府。他们所争取的土地和盟约，已经成为两国军队必须面对的问题。"
 nesnd_american_restoration.1.a: "准备迎战。"
 nesnd_american_restoration.2.t: "避难者抵达"
 nesnd_american_restoration.2.d: "遭到镇压的原住民共同体已经越境，带来亲族、地方组织和失去故土的记忆。接纳他们的地区将成为新的避难网络；迁居并不能使他们立即恢复原来的生计。"
 nesnd_american_restoration.2.a: "让他们在这里安顿下来。"
 nesnd_american_restoration.3.t: "复统组织遭到镇压"
 nesnd_american_restoration.3.d: "军队驱散了复统组织，乡村的政治冲突却没有因此消失。有接纳地的家庭开始迁居；无处可去的人仍留在原地。被剥夺政治地位的代表走向流亡，土地和地方权力的争执继续留在国内。"
 nesnd_american_restoration.3.a: "承担这一决定的后果。"
 nesnd_american_restoration.4.t: "王朝与共同体的盟约"
 nesnd_american_restoration.4.d: "旧王朝重新进入国家的政治中心。地方共同体以支持王朝为条件，要求自己的土地和代表得到承认。宫廷、议会与乡村之间的关系，将在新的统治安排下继续展开。"
 nesnd_american_restoration.4.a: "让新的统治从这里开始。"
 nesnd_american_restoration.5.t: "战争要求得到执行"
 nesnd_american_restoration.5.d: "对方政府已经失去最后的领土，战争要求得到执行。统一后的国家继承了这些地区，也继承了战争留下的地方矛盾与流亡问题。"
 nesnd_american_restoration.5.a: "接管战争留下的国家。"
 nesnd_american_restoration.6.t: "分治的停战"
 nesnd_american_restoration.6.d: "这场争夺没有以本国统一疆土告终。仍然存在的政府各自保有实际领土，复统的主张也没有因停战自动成为既成事实。"
 nesnd_american_restoration.6.a: "接受眼前的局面。"
 nesnd_american_restoration.10.t: "共同承认一个印卡宫廷"
 nesnd_american_restoration.10.d: "[SCOPE.sCountry('nesnd_restoration_applicant').GetName]提出承认现存印卡宫廷，并将本国并入我们的统治。这个决定将结束两国并立，也使其地方共同体成为宫廷必须接纳的政治力量。"
 nesnd_american_restoration.10.a: "接受共同归于一国。"
 nesnd_american_restoration.10.b: "保留两国各自的统治。"
 nesnd_a2_itzcoatl_first: "伊特斯科亚特"
 nesnd_a2_moctezuma_last: "蒙特祖玛"
 nesnd_a2_amaru_first: "尤潘基"
 nesnd_a2_amaru_last: "阿马鲁一世"
 nesnd_a2_rumi_first: "鲁米"
 nesnd_a2_quispe_last: "基斯佩"
 nesnd_a2_tatanka_first: "塔坦卡"
 nesnd_a2_temur_last: "帖木儿"
 nesnd_khanate_emergence: "草原盟约的复兴"
 nesnd_khanate_emergence_reason: "满蒙登记已定，旧日大平原起义的记忆再次进入政治生活。支持者希望在美国大平原建立原住民汗国；只有四座相连、仍有居民的美国州能够交付给新政府，这个计划才会成为现实。"
 nesnd_khanate_waiting_status: "等待四座相连的美国大平原人口州；割地后，美国仍须保有居民和领土。"
 nesnd_khanate_established_tt: "原住民汗国已实际取得四州并建立政府。"
 nesnd_khanate_survival: "汗国的生存之战"
 nesnd_khanate_survival_reason: "新的汗国从草原盟约中取得名号，从迁入的原住民共同体中取得人口。邻国却把它视为对既有疆界的挑战。两条干涉各有自己的战争与结局；击败一方并不能替另一方决定是否停战。"
 nesnd_khanate_usa_status: "与美国的干涉尚未结束；另一场干涉单独结算。"
 nesnd_khanate_hus_status: "最初支持草原盟约的国家仍未结束其干涉；美国一侧的结果已经单独记录。"
 nesnd_khanate_survival_status: "两条干涉均已结束。实际羞辱、停战、未能开战与对方消亡各有不同结果。"
 nesnd_khanate_legacy_status: "旧日建国记录与现存领土不符；不会再迁人口或补发军队。"
 nesnd_khanate_survived_tt: "汗国仍然存活，两条独立干涉均已结束。"
 nesnd_suppress_native_khanate: "干涉大平原汗国"
 nesnd_suppress_native_khanate_reason: "大平原的割地与人口迁移改变了北美的力量分布。政府准备以吞并汗国恢复自己的主张，汗国则要求以战争迫使干涉者承认其地位。"
 nesnd_khanate_intervention_status: "本国干涉拥有独立的战争与结局；未能发动战争不会被记作胜利。"
 nesnd_khanate_destroyed_tt: "本国的吞并战争要求已经实际执行。"
 nesnd_khanate_suppression_failed_tt: "本次干涉已结束，汗国没有被本国吞并。"
 nesnd_khanate_war: "大平原干涉战争"
 dp_nesnd_khanate_suppression: "大平原干涉战争"
 dp_nesnd_khanate_suppression_desc: "干涉者要求吞并大平原汗国，汗国则要求羞辱干涉者。"
 dp_nesnd_khanate_suppression_tooltip: "#header $dp_nesnd_khanate_suppression$#!\n$dp_nesnd_khanate_suppression_desc$"
 NKH: "大平原汗国"
 NKH_ADJ: "大平原汗国"
 wg_nesnd_khanate_annex: "吞并汗国"
 wg_nesnd_khanate_annex_desc: "以实际战争要求吞并大平原汗国。"
 wg_nesnd_khanate_humiliation: "羞辱干涉者"
 wg_nesnd_khanate_humiliation_desc: "迫使这场干涉的发动国接受羞辱。"
 nesnd_khanate_army: "草原盟军"
 nesnd_native_american_republic: "建立原住民共和国"
 nesnd_native_american_republic_desc: "统一全美洲与格陵兰，在旧国家已经灭亡后，以原住民为主流重建共和国，并确立完整的普通法制。"
 nesnd_native_khanate.2.t: "草原上的新国家"
 nesnd_native_khanate.2.d: "两条干涉都已走到终点，汗国仍保有自己的政府。有人被迫接受羞辱，有人议和或未能发动战争；对手的消亡也不能算作我们的战功。草原共同体现在必须把战时盟约变成长久的统治。"
 nesnd_native_khanate.2.a: "守住已经取得的国家。"
 nesnd_native_khanate.3.t: "美洲原住民的共和国"
 nesnd_native_khanate.3.d: "从大平原到南方大陆，原住民政权已经统一全美洲与格陵兰。旧共和国不复存在，新的[ROOT.GetCountry.GetName]接过它的国号。汗号让位于共和国的制度，原住民成为主流；各地人口与军队仍承担统一后国家的日常生活。"
 nesnd_native_khanate.3.a: "由美洲的人民承担自己的未来。"
 nesnd_hus_registration.1.t: "草原盟约再起"
 nesnd_hus_registration.1.d: "[SCOPE.sCountry('nesnd_a2_khanate').GetName]已经在美国大平原取得四座相连的州。割地之后，两国仍居境内的原住民共同体各有半数迁入新国。新汗将继承旧日起义的记忆，也必须面对两国对新秩序的干涉。"
 nesnd_hus_registration.1.a: "草原已经有了新的主人。"
 nesnd_hus_registration.2.t: "登记之后的迁居"
 nesnd_hus_registration.2.a: "这一选择已经作出。"
 nesnd_a2_exodus_both_desc: "登记后的满蒙社区分别选择迁往[SCOPE.sCountry('nesnd_a2_cne_country').GetName]或[SCOPE.sCountry('nesnd_a2_usa_country').GetName]西部。每个社区有七成概率选择前者、三成选择后者；各社区人口不同，实际人数并不按七三比例分割。亲族和旧日联系随着迁居重新分布。"
 nesnd_a2_exodus_cne_desc: "美国西部已没有可接纳的目的地。满蒙社区此次全部迁往[SCOPE.sCountry('nesnd_a2_cne_country').GetName]，原定的两地分流没有实行。"
 nesnd_a2_exodus_usa_desc: "东方已没有可接纳的目的地。满蒙社区此次全部迁往[SCOPE.sCountry('nesnd_a2_usa_country').GetName]西部，原定的两地分流没有实行。"
 nesnd_a2_exodus_none_desc: "两处目的地都已无法接纳迁居的满蒙社区。各社区留在当前居地，此次迁徙到此结束；已经实行的登记选择继续有效。"
 nesnd_american_restoration.11.t: "合并请求已经逾期"
 nesnd_american_restoration.11.d: "印卡宫廷未在期限内同意合并。两国继续保有自己的政府和领土；经过一段时间，双方仍可重新商谈。"
 nesnd_american_restoration.11.a: "暂且保留各自的统治。"
 nesnd_american_restoration.12.t: "印卡宫廷拒绝合并"
 nesnd_american_restoration.12.d: "印卡宫廷拒绝了此次合并请求。承认王朝的共同传统尚不足以结束两国并立，双方仍可在等待期后重新商谈。"
 nesnd_american_restoration.12.a: "保留日后的谈判余地。"
 nesnd_restore_native_hus: "建立原住民共和国"
 nesnd_restore_native_hus_desc: "统一全美洲与格陵兰，在旧国家已经灭亡后，以原住民为主流重建共和国，并确立完整的普通法制。"
 nesnd_native_americas_unified_tt: "完整拥有全美洲与格陵兰的所有地区，包括未殖民地与外国分割州。"
 nesnd_native_hus_restored_tt: "采用原住民主流文化，改建共和国并实行完整的二十四组普通法律。"
 nesnd_american_restoration.13.t: "重建王朝的统治"
 nesnd_american_restoration.13.d: "王朝的支持者重新召集地方共同体，商定宫廷、地方代表与乡村之间的统治安排。现存国家将在新的政治盟约下继续生活，旧日战争造成的分歧也将由它承担。"
 nesnd_american_restoration.13.a: "维持国家，重立盟约。"
 nesnd_native_khanate.2.both: "两场干涉的发动者都曾被迫接受羞辱，汗国仍保有自己的政府。战时的胜利使草原盟约获得威望，各地共同体现在必须把这种联合变成长久的统治。"
 nesnd_native_khanate.2.one: "一场干涉已经以羞辱干涉者告终，另一条干涉也已结束。汗国仍保有自己的政府，草原共同体现在必须把战时盟约变成长久的统治。"
 nesnd_native_khanate.2.none: "两条干涉均已结束，汗国仍保有自己的政府。它没有取得羞辱干涉者的胜果；已经结束的争夺留下了一个必须由草原共同体共同维持的新国家。"
 war_goal_wg_nesnd_restoration_settlement_type_name: "统一复国疆土"
 war_goal_wg_nesnd_restoration_settlement_type_desc: "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 war_goal_wg_nesnd_restoration_settlement: "统一复国疆土：[WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_restoration_settlement_desc: "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 war_goal_wg_nesnd_restoration_settlement_sway_desc: "击败对方政府并吞并其疆土；镇压复国政权时，先处理原住民避难与政治流亡。"
 war_goal_wg_nesnd_khanate_annex_type_name: "吞并汗国"
 war_goal_wg_nesnd_khanate_annex_type_desc: "以实际战争要求吞并大平原汗国。"
 war_goal_wg_nesnd_khanate_annex: "吞并汗国：[WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_annex_desc: "以实际战争要求吞并大平原汗国。"
 war_goal_wg_nesnd_khanate_annex_sway_desc: "以实际战争要求吞并大平原汗国。"
 war_goal_wg_nesnd_khanate_humiliation_type_name: "羞辱干涉者"
 war_goal_wg_nesnd_khanate_humiliation_type_desc: "迫使这场干涉的发动国接受羞辱。"
 war_goal_wg_nesnd_khanate_humiliation: "羞辱干涉者：[WAR_GOAL_DRAFT.GetTarget.GetName]"
 war_goal_wg_nesnd_khanate_humiliation_desc: "迫使这场干涉的发动国接受羞辱。"
 war_goal_wg_nesnd_khanate_humiliation_sway_desc: "迫使这场干涉的发动国接受羞辱。"
 nesnd_native_khanate.4.t: "干涉前的毁约"
 nesnd_native_khanate.4.d: "[SCOPE.sCountry('nesnd_khanate_opponent').GetName]已退出与汗国之间含有联盟或防御协定条款的条约，为干涉清除障碍。若同一份条约还载有贸易或其他约定，那些条款也随之终止；毁约的外交代价仍由退出国承担。两国与第三国的条约不在此次退出之列。"
 nesnd_native_khanate.4.a: "战争先从盟约的破裂开始。"

 nesnd_final_native_restored_existing_tt:0 "复统后的统治：威望+30，乡村民众认可+3，建设效率+10%；持续120个月。"
