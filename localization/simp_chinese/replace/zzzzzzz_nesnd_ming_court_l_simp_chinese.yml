l_simp_chinese:
 nesnd_ming_host_huguang:0 "行在筹备：湖广"
 nesnd_ming_host_huguang_desc:0 "将湖广列为朝廷出京时的首选行在。当地政府须愿意拥明并具备独立行动的条件。"
 nesnd_ming_host_sichuan:0 "行在筹备：四川"
 nesnd_ming_host_sichuan_desc:0 "将四川列为朝廷出京时的首选行在。当地政府须愿意拥明并具备独立行动的条件。"
 nesnd_ming_host_effect_tt:0 "发生诸府决裂时，优先在这个国家建立行在；目标失效时再检查另一核心。"
 nesnd_ming_renew_convocation:0 "重开公议"
 nesnd_ming_renew_convocation_desc:0 "召集各府重新处置朝廷与吴王的名位。"
 nesnd_ming_court.3.t:0 "行在立朝"
 nesnd_ming_court.3.d:0 "朝廷的印信和文书已经抵达行在。地方衙署腾出了厅堂，军府继续征饷调兵，随驾的臣僚开始接收各地送来的表章。原定的京中公议已经变成诸府之间的外交对峙。使者仍在两方往返，军营里也开始清点兵额和粮秣。"
 nesnd_ming_court.3.a:0 "先整顿行在诸务。"
 nesnd_ming_court.9.t:0 "留守南京"
 nesnd_ming_court.9.d:0 "通往各府的使者没有带回可供朝廷驻跸的答复。宫门前的车驾仍未启程，印玺、库银和内阁文书也留在南京。朝廷必须在京中重新议定与吴王共处的章程，或承认郑氏提出的新名位。"
 nesnd_ming_court.9.a:0 "留京议约，暂缓易代。"
 nesnd_ming_court.9.b:0 "承认郑氏的新名位。"
 nesnd_ming_court.10.t:0 "诸府复函"
 nesnd_ming_court.10.d:0 "各府尚未结成举兵反对新朝的联盟。复函仍在追问旧有的赋额、军费、地方任官和海外贸易安排。朝廷需要逐项答复，才能把一次禅让变为可以施行的秩序。"
 nesnd_ming_court.10.a:0 "继续商定诸府条款。"
 nesnd_ming_court_country:0 "大明行在"
 nesnd_ming_interregnum_country:0 "大明监国政府"
 nesnd_ming_court_adj:0 "明廷"
 nesnd_south_succession_board_reason:0 "朱氏天子的帝统延续至今，郑氏已经掌握南朝的中央军队、财政和主要海外殖民网络。江浙、福建与江西的兵饷、货物流转维系着吴王的势力，各府也在共同市场中经营自己的军队和产业。名位更易的消息一旦传出，地方任官、赋额、军事义务和海外贸易都要重新议定。各国将为自己的政权和前途选择立场。"
 nesnd_ming_court_transfer_effect_tt:0 "你现在执掌[ROOT.GetCountry.GetName]。原有军队、财政、土地和税制继续运作；有合法君主随行时改行君主制，由同一人物主持行在。"
 nesnd_ming_court.12.t:0 "去路未定"
 nesnd_ming_court.12.d:0 "诸府已经与中央决裂，预定接驾的地方政府又发生了变故。护送队伍无法照原路启程。留在京中的官员仍能传递消息，也必须应付新朝发下的命令。"
 nesnd_ming_court.12.a:0 "暂留京中，另寻接应。"
 nesnd_ming_court.12.b:0 "留任新朝，放弃迎驾之议。"
 nesnd_ming_seek_refuge:0 "再遣迎驾使"
 nesnd_ming_seek_refuge_desc:0 "重新核对湖广和四川的接应条件；原有的外交对峙与各国独立状态继续存在。"
 nesnd_ming_after_truce:0 "行在未归"
 nesnd_ming_after_truce_reason:0 "停战以后，朝廷仍驻在地方。旧都的印信已经更换，拥明诸府还保留着自己的兵饷和官署。行在可以休养财力、结交盟友，再谋收复旧都。"
 nesnd_ming_after_truce_status:0 "在新的战争中控制南京及吴朝首都，并满足实际胜利条件后，议定复国安排。"
 nesnd_ming_refuge_available_tt:0 "对应靖难对峙或战争仍在进行；湖广或四川有独立、拥明、控制首都且未由另一玩家执掌的接应政府。"
