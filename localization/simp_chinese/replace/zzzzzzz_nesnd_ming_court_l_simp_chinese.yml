l_simp_chinese:
 nesnd_ming_host_huguang:0 "行在筹备：湖广"
 nesnd_ming_host_huguang_desc:0 "将湖广列为朝廷出京时的首选行在。当地政府须愿意拥明并具备独立行动的条件。"
 nesnd_ming_host_sichuan:0 "行在筹备：四川"
 nesnd_ming_host_sichuan_desc:0 "将四川列为朝廷出京时的首选行在。当地政府须愿意拥明并具备独立行动的条件。"
 nesnd_ming_host_effect_tt:0 "诸省与中央决裂时，优先在此建立行在；无法接驾时，再考虑另一处接应地。"
 nesnd_ming_renew_convocation:0 "重开公议"
 nesnd_ming_renew_convocation_desc:0 "召集各省与诸邦的代表，重新商议明廷与吴王的名位。"
 nesnd_ming_court.3.t:0 "行在立朝"
 nesnd_ming_court.3.d:0 "随驾臣僚已经抵达行在，地方政府正在安置朝廷。原有军队仍须征饷调兵，布政司仍须治理各地，如今又要供给天子的行朝。拥明的主张由此有了可以奉事的中央，也使接驾之地首先承担了同南府决裂的代价。\n\n各省与海外诸邦还在遣使往来。曾经在礼议院与内阁争执的名分，如今已须由彼此的军力担保。"
 nesnd_ming_court.3.a:0 "先整顿行在诸务。"
 nesnd_ming_court.9.t:0 "留守南京"
 nesnd_ming_court.9.d:0 "湖广与四川尚无能够接驾的政府，朝廷只得留在南京。拥明大臣须继续争取地方支持，也须同掌握兵财的南府商议眼前的处境。郑氏的易代主张已摆在面前，留京廷议将决定我们还能争取多少余地。"
 nesnd_ming_court.9.a:0 "留京议约，暂缓易代。"
 nesnd_ming_court.9.b:0 "承认郑氏的新名位。"
 nesnd_ming_court.10.t:0 "诸省复议"
 nesnd_ming_court.10.d:0 "反对新朝的地方尚未结成足以举兵的联盟。任官、赋额、军费与海外地位仍是各方争执的要害。南府要使郑氏的帝号为人接受，就须继续回应这些主张；拥明者也仍在寻找可以共进退的同道。"
 nesnd_ming_court.10.a:0 "继续商议地方主张。"
 nesnd_ming_court_country:0 "大明行在"
 nesnd_ming_interregnum_country:0 "大明监国政府"
 nesnd_ming_court_adj:0 "明廷"
 nesnd_south_succession_board_reason:0 "南朝的天下，究竟是朱氏皇帝的天下，还是郑氏开拓出来的天下？南京仍有朱明的帝统，杭州南府则掌握着推行新政的兵财。西府各省与南府共同抵御北朝时，尚能把君臣名分的争论留待来日；如今改革已深入地方，两方再不能回避谁来主持国政。\n\n湖广的书院和襄樊的营伍奉朱氏正朔，四川的共和派仍在议论南府的新政。南洋总督与日本诸侯也在衡量易代将向他们索取多少土地、钱粮和兵员。礼议院中的学政、内阁中的大臣以及各省带兵的将领，终须为自己的主张承担后果。"
 nesnd_ming_court_transfer_effect_tt:0 "你现在执掌[ROOT.GetCountry.GetName]。原有军队、财政、土地和税制继续运作；有合法君主随行时改行君主制，由同一人物主持行在。"
 nesnd_ming_court.12.t:0 "去路未定"
 nesnd_ming_court.12.d:0 "地方已经与中央决裂，预定接驾的政府却发生了变故。朝廷一时无法出京，拥明大臣只能继续联络湖广与四川，寻找能够保护天子、维持行朝的接应者。留在南京的每一日，都使我们更难摆脱南府的安排。"
 nesnd_ming_court.12.a:0 "暂留京中，另寻接应。"
 nesnd_ming_court.12.b:0 "留任新朝，放弃迎驾之议。"
 nesnd_ming_seek_refuge:0 "再遣迎驾使"
 nesnd_ming_seek_refuge_desc:0 "再遣使者前往湖广与四川，寻求能够接驾并维护明统的地方政府。"
 nesnd_ming_after_truce:0 "行在未归"
 nesnd_ming_after_truce_reason:0 "停战以后，朝廷仍未返回南京。拥明各省保有自己的军队与财赋，南府也没有放弃新朝的帝号。行在须休养财力、结交盟友，待有实力收复旧都时，再议天下的名分。"
 nesnd_ming_after_truce_status:0 "在新的战争中控制南京及吴朝首都，并满足实际胜利条件后，议定复国安排。"
 nesnd_ming_refuge_available_tt:0 "对应靖难对峙或战争仍在进行；湖广或四川有独立、拥明、控制首都且未由另一玩家执掌的接应政府。"
