 nesnd_per_tension_rising_effect_tt:0 "伊朗人起义：可迎立沙阿（广义伊朗人不少于全国一半时），或平叛。"
 nesnd_per_tension_rising_conclusion:0 "伊朗人揭竿而起，唐人的朝廷必须作答。"
 nesnd_per_rising.1.t:0 "伊朗人起义"
 nesnd_per_rising.1.d:0 "伊斯法罕的巴扎罢了市，礼拜寺的讲坛上不再诵念君主的名讳。各州的波斯贵人、库尔德头人与卢尔部落一夜之间合为一处，旗上只书一句：伊朗归于伊朗人。\n\n武勋门阀请命出兵。朝中也有人低声进言：与其打一场注定输掉的仗，不如迎一位波斯人为沙阿，把江山留给他们，把性命留给自己。"
 nesnd_per_rising.1.f:0 "“伊朗归于伊朗人。”——起义军的旗帜"
 nesnd_per_rising.1.a:0 "江山让给他们，性命留给我们。"
 nesnd_per_rising.1.a.tt:0 "#r 改朝换代#!：拥立波斯人沙阿，唐人退出主体文化，国教改为什叶，等级制恢复默认。「$nesnd_per_new_dynasty$」5 年，武勋门阀不满。此后进入波斯人统治阶段。"
 nesnd_per_rising.1.b:0 "唐人的江山，是刀枪打下来的。"
 nesnd_per_rising.1.b.civil_tt:0 "广义伊朗人过半的各[concept_state]另立「$IRN$」，与朝廷争夺#r 整个国家#!：败者被吞并。"
 nesnd_per_rising.1.b.independence_tt:0 "广义伊朗人过半的各[concept_state]另立「$IRN$」，朝廷出兵#v 收复#!，起义军只求自立。"
 nesnd_per_rising.1.c:0 "良禽择木而栖。"
 nesnd_per_rising.1.c.tt:0 "同上，平叛之战照常进行，但你改为操控「$IRN$」。"
 nesnd_per_rising.10.t:0 "旧唐密谋"
 nesnd_per_rising.10.d:0 "巡夜的兵丁在一座唐人祠堂里搜出了名册与兵器。名册上有旧日将门的子弟，也有几位至今仍在王廷任职的人。他们原打算在祭祖之日起事，迎回流落西秦的李氏后人。"
 nesnd_per_rising.10.f:0 "“在一座唐人祠堂内搜出名册一本、兵器若干。册上有旧日将门子弟，也有现任王廷官员。据供，原定在祭祖之日起事，迎回流落西秦的李氏后人。”\n——巡夜兵丁的报告"
 nesnd_per_rising.10.a:0 "名册上的人，一个也不放过。"
 nesnd_per_rising.10.a.tt:0 "#r 20%#!的西域汉羌转为[Concept('concept_radical','$concept_radicals$')]，旧唐人心降到#v 40#!"
 nesnd_per_rising.10.b:0 "他们要的不过是一块祖宗牌位，给他们便是。"
 nesnd_per_rising.10.b.tt:0 "旧唐人心降到#v 50#!"
 nesnd_per_rising.20.t:0 "北伐雪耻"
 nesnd_per_rising.20.d:0 "沙阿的军队开进了西秦的城池。两百年来，波斯的史书上写满了秦人西征的铁蹄。今日之后，执笔的换了人。"
 nesnd_per_rising.20.f:0 "“秦人来时的路，波斯人也认得。”——沙阿北伐诏书"
 nesnd_per_rising.20.a:0 "两百年的账，今日算清。"
 nesnd_per_rising.21.t:0 "两河与海湾"
 nesnd_per_rising.21.d:0 "从摩苏尔到拉里斯坦，两河与海湾尽入沙阿版图。地下埋着什么，眼下尚无人说得清，而地上的商路与港口，已足以供养一支新军。"
 nesnd_per_rising.21.f:0 "“自摩苏尔至拉里斯坦，两河与海湾诸地，自即日起归沙阿统辖。各港口岸税，充作新军军饷。”\n——沙阿的敕令"
 nesnd_per_rising.21.a:0 "西方已定。"
 nesnd_per_shah_invalid_tt:0 "本国不再由波斯人统治"
 nesnd_per_shah_invalid_conclusion:0 "沙阿的王廷已不复存在。"
 nesnd_per_shah_court_journal:0 "沙阿的新朝"
 nesnd_per_shah_court_journal_reason:0 "旧朝的唐人仍在：有的在军中领兵，有的在王廷任职，有的只守着祖宅度日。新朝当如何待他们？遣返东方、流放远方、改换姓名留用，还是索性一如其旧？\n\n无论哪一种做法，都会有人称快，也会有人记恨。"
 nesnd_per_court_status_many:0 "王廷之中，仍有不少旧朝的唐人。"
