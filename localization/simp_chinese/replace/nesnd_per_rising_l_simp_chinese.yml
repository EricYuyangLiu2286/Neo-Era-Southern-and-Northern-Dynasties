 nesnd_per_court_expel_tt:0 "至多#v 3#!位唐人人物被送往西秦。"
 nesnd_per_court_exile_tt:0 "至多#v 3#!位唐人人物被流放。"
 nesnd_per_court_naturalize_tt:0 "至多#v 3#!位唐人人物改为波斯文化、什叶派。"
 nesnd_per_court_tolerate_tt:0 "其余唐人人物全部留任，此事了结；此后开「$nesnd_per_old_tang_journal$」。"
 nesnd_per_old_tang_journal:0 "旧唐人心"
 nesnd_per_old_tang_journal_reason:0 "旧朝的唐人留了下来，官还是官，兵还是兵。可祠堂里的牌位没撤，族谱上的名字也没改；逢年过节，总有人朝东边磕头。\n\n再过一代人，这些心思也许就淡了。在那之前，新朝得一直留神。"
 nesnd_per_old_tang_status_high:0 "旧唐人家的祠堂里，近来常有生客出入。"
 nesnd_per_old_tang_status_low:0 "旧唐人家闭门过日子。"
 nesnd_per_old_tang_done_tt:0 "优容旧贵已满#v 20#!年"
 nesnd_per_old_tang_done_conclusion:0 "一代人过去，旧唐的心思淡了。"
