 nesnd_per_court_tolerate_tt:0 "其余唐人人物全部留任，此事了结，随后开启「$nesnd_per_old_tang_journal$」。"
 nesnd_per_old_tang_journal:0 "旧唐人心"
 nesnd_per_old_tang_journal_reason:0 "旧朝的唐人留了下来，为官者仍为官，为兵者仍为兵。可祠堂里的牌位不曾撤下，族谱上的名字也不曾更改，逢年过节，总有人朝东方叩首。\n\n再过一代人，这些心思或许就淡了。在那之前，新朝必须时时留意。"
 nesnd_per_old_tang_status_high:0 "旧唐人家的祠堂，近来常有生客出入。"
 nesnd_per_old_tang_status_low:0 "旧唐人家闭门度日。"
 nesnd_per_old_tang_done_tt:0 "优容旧贵已满#v 20#!年"
