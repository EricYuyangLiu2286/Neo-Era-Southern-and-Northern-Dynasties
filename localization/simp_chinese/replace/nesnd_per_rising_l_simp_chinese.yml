 nesnd_per_road_north_tt:0 "对西秦与我国接壤、人口最多的一个[concept_state]提出[concept_claim]，并就此向西秦发起[concept_diplomatic_play]。夺得该地区就算完成：「$nesnd_per_revenge$」10 年，西秦团结度受挫。"
