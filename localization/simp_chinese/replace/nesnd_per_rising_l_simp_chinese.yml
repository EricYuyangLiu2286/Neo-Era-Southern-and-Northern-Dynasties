 nesnd_per_shah_road_journal_reason:0 "新朝根基已稳，王廷开始争论前路。有人主张北上，向西秦讨还两百年的旧账，有人主张西进，将两河与海湾尽收囊中。\n\n两条路，只能择其一。"
