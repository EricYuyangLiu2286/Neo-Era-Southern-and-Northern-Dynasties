 nesnd_per_tension_rising_tt:0 "矛盾激化到#v 100#!"
 nesnd_per_tension_rising_effect_tt:0 "伊朗人起义：可迎立沙阿（广义伊朗人不少于全国一半时），或平叛。"
 nesnd_per_tension_rising_conclusion:0 "伊朗人揭竿而起，唐人的朝廷要为此给出答复。"
 nesnd_per_rising.1.t:0 "伊朗人起义"
 nesnd_per_rising.1.d:0 "伊斯法罕的市集罢了市，礼拜寺的讲坛上念的不再是君主的名字。各州的波斯贵人、库尔德头人和卢尔部落一夜之间站到了一起，打出的旗号只有一句：伊朗归伊朗人。\n\n武勋门阀请求出兵；也有人在朝中低声说，与其打一场打不赢的仗，不如迎一位波斯人做沙阿，把江山留给他们，把性命留给自己。"
 nesnd_per_rising.1.f:0 "“伊朗归伊朗人。”——起义者的旗号"
 nesnd_per_rising.1.a:0 "迎一位沙阿。"
 nesnd_per_rising.1.a.tt:0 "#r 改朝换代#!：拥立波斯人沙阿；唐人退出主体文化，国教改为什叶，等级制恢复默认；「$nesnd_per_new_dynasty$」5 年，武勋门阀不满。此后进入波斯人统治阶段。"
 nesnd_per_rising.1.b:0 "平叛！"
 nesnd_per_rising.1.b.civil_tt:0 "广义伊朗人过半的各州另立「$IRN$」，与朝廷争夺#r 整个国家#!：败者被吞并。"
 nesnd_per_rising.1.b.independence_tt:0 "广义伊朗人过半的各州另立「$IRN$」；朝廷出兵#v 收复#!，起义军只求自立。"
 nesnd_per_rising.1.c:0 "投向起义一方。"
 nesnd_per_rising.1.c.tt:0 "同上，平叛的战争照打，但你改为操控「$IRN$」。"
 nesnd_per_rising.10.t:0 "旧唐密谋"
 nesnd_per_rising.10.d:0 "巡夜的兵丁在一处唐人祠堂里搜出了名册和兵器。名册上有旧日的将门子弟，也有几位至今仍在朝中做官的人。他们打算在祭祖那天起事，迎回流落西秦的李氏后人。"
 nesnd_per_rising.10.f:0 "“祠堂里的牌位，比礼拜寺里的人还多。”——伊斯法罕的巡官"
 nesnd_per_rising.10.a:0 "按律严办。"
 nesnd_per_rising.10.a.tt:0 "#r 20%#!的西域汉羌转为激进；旧唐人心降到#v 40#!"
 nesnd_per_rising.10.b:0 "各退一步。"
 nesnd_per_rising.10.b.tt:0 "旧唐人心降到#v 50#!"
 nesnd_per_rising.20.t:0 "北伐雪耻"
 nesnd_per_rising.20.d:0 "沙阿的军队开进了西秦的城池。两百年来，波斯人的史书里写的都是秦人的西征；从今天起，这一页要翻过去了。"
 nesnd_per_rising.20.f:0 "“当年他们来的路，我们一样走得回去。”——沙阿的诏书"
 nesnd_per_rising.20.a:0 "此仇已报。"
 nesnd_per_rising.21.t:0 "两河与海湾"
 nesnd_per_rising.21.d:0 "从摩苏尔到拉里斯坦，两河与海湾的土地都归了沙阿。地下有什么，眼下还没人说得清；地上的商路和港口，已经够养活一支新军。"
 nesnd_per_rising.21.f:0 "“海湾的风吹到哪里，沙阿的旗就插到哪里。”——巴士拉的船主"
 nesnd_per_rising.21.a:0 "西方已定。"
 nesnd_per_shah_invalid_tt:0 "本国不再由波斯人统治"
 nesnd_per_shah_invalid_conclusion:0 "沙阿的朝廷已经不在了。"
 nesnd_per_shah_court_journal:0 "沙阿的新朝"
 nesnd_per_shah_court_journal_reason:0 "旧朝的唐人还在：有的在军中带兵，有的在朝里做官，有的只是守着祖宅。新朝要怎样对待他们，是赶回东边、流放远方、改了姓名留下来，还是索性照旧优待？\n\n每一种做法都有人叫好，也都有人记恨。"
 nesnd_per_court_status_many:0 "朝中仍有不少旧朝的唐人。"
 nesnd_per_court_status_none:0 ""
 nesnd_per_court_done_tt:0 "国中已无唐人人物，或已决定优容旧贵"
 nesnd_per_court_done_conclusion:0 "旧朝的唐人各有了去处。"
 nesnd_per_court_expel_button:0 "遣返东归"
 nesnd_per_court_expel_button_desc:0 "把他们送回西秦，让伊犁去安顿。"
 nesnd_per_court_exile_button:0 "流放远方"
 nesnd_per_court_exile_button_desc:0 "让他们去哪里都行，只要不在这里。"
 nesnd_per_court_naturalize_button:0 "改籍留任"
 nesnd_per_court_naturalize_button_desc:0 "改波斯姓名，入什叶门下，照旧做官带兵。"
 nesnd_per_court_tolerate_button:0 "优容旧贵"
 nesnd_per_court_tolerate_button_desc:0 "旧朝的人照旧各居其位。新朝需要他们的兵和官。"
 nesnd_per_court_qin_tt:0 "西秦仍在"
