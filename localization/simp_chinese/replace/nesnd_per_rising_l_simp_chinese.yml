 nesnd_per_shah_road_journal:0 "沙阿的道路"
 nesnd_per_shah_road_journal_reason:0 "新朝站稳了脚跟，朝中开始争论往哪里去。有人要北上，向西秦讨还两百年的旧账；有人要西进，把两河与海湾都收进来。\n\n两条路不能同时走。"
 nesnd_per_road_status_north:0 "沙阿的旗指向北方。"
 nesnd_per_road_status_west:0 "沙阿的旗指向西方。"
 nesnd_per_road_status_none:0 ""
 nesnd_per_road_north_done_tt:0 "夺得北伐的目标地区"
 nesnd_per_road_west_done_tt:0 "胡齐斯坦、法尔斯、拉里斯坦、巴士拉、巴格达、摩苏尔六个地区全部归本国"
 nesnd_per_road_north_conclusion:0 "北伐告成，旧耻已雪。"
 nesnd_per_road_west_conclusion:0 "两河与海湾尽归沙阿。"
 nesnd_per_road_north_button:0 "北伐雪耻"
