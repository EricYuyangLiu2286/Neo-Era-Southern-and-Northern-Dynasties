 nesnd_per_road_west_button:0 "西进两河"
 nesnd_per_road_west_button_desc:0 "两河与海湾的土地，曾经都属于波斯。"
 nesnd_per_road_north_target_tt:0 "西秦有与本国接壤的州"
 nesnd_per_road_cooldown_tt:0 "距上次北伐已满#v 5#!年"
 nesnd_per_road_west_target_tt:0 "两河与海湾尚有别国的州"
 nesnd_per_road_north_tt:0 "宣称西秦与本国接壤、人口最多的一州，并就此向西秦发起外交博弈。夺得该地区即告成：「$nesnd_per_revenge$」10 年，西秦团结度受挫。"
 nesnd_per_road_west_tt:0 "宣称两河与海湾六个地区中别国的州（此后选定西进，北伐不再可选）。全部到手即告成：「$nesnd_per_gulf_fields$」10 年。国教不是什叶、或对手中没有逊尼国家时，乌理玛不满。"
