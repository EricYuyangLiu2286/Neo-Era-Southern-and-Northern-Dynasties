l_simp_chinese:
 nesnd_south_unsettled_tt:0 "南方政局尚未完成结算。"
 nesnd_south_qin_departed_tt:0 "#v 郑钦#!已去世或离开本国。"
 nesnd_south_conflicts_failure_tt:0 "以下任一情况发生：\n本国拥有的[Concept('concept_state','州')]不足#v 2#!个；\n或四川、湖南、菲律宾、南洋联省和远南五邦均已不再是本国的直属[Concept('concept_subject','附属国')]（包括已经灭亡的邦国）。"
 nesnd_south_settled_tt:0 "南方政局已经完成结算。"
 nesnd_south_wu_established_tt:0 "吴朝已经建立。"
 nesnd_south_monarchy_ended_tt:0 "本国已经废除#v 君主制#!。"
 nesnd_south_pressure_bar_desc:0 "易代压力：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_pressure_detail_tt 变化规则#!#!"
 nesnd_south_compact_bar_desc:0 "邦国契约：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_compact_detail_tt 订约条件#!#!"
 nesnd_south_pressure_detail_tt:0 "#bold 易代压力#!：#v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\n当前每月增加#n [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!点。通常每月#n +1#!；邦国契约修正生效期间每月#n +0.4#!。\n\n每次重订契约降低压力#p 8#!点，最低降至#v 0#!。压力达到#v 70#!可提前推动易代；达到#v 100#!，且郑钦已去世或离开本国、南方政局尚未完成结算时，进入易代事件。"
 nesnd_south_compact_detail_tt:0 "#bold 邦国契约#!：#v [Country.MakeScope.ScriptValue('nesnd_south_compact_value')|0] / 100#!\n契约进度不按月自动增长。每次重订增加#p 20#!点，并降低易代压力#p 8#!点，冷却#v 18个月#!。\n\n订约须[concept_bureaucracy]非负、[concept_legitimacy]至少#v 50#!且吴明论战仍在进行。邦国契约修正持续#v 10年#!，生效时压力每月增加#n 0.4#!点。契约进度达到#v 100#!后保留朱明国号，结束这场危机。"
 nesnd_south_rules:0 "$nesnd_south_pressure_detail_tt$\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_status_succession:0 "#bold 郑钦已不在本国#!：易代压力达到#v 100#!时颁布易代诏书，各府随后表态。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules 易代与契约规则#!#!"
