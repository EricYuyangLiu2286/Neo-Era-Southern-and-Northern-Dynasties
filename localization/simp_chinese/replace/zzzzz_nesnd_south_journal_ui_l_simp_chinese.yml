l_simp_chinese:
 nesnd_south_unsettled_tt:0 "南朝的朝争尚未平息。"
 nesnd_south_qin_departed_tt:0 "郑钦已去世或离开本国，或朝争已延续至#v 1839年#!。"
 nesnd_south_conflicts_failure_tt:0 "以下任一情况发生：\n本国拥有的[Concept('concept_state','州')]不足#v 2#!个；\n或四川、湖南、菲律宾、南洋联省和远南五邦均已不再是本国的直属[Concept('concept_subject','附属国')]（包括已经灭亡的邦国）。"
 nesnd_south_settled_tt:0 "南朝的朝争已经结束。"
 nesnd_south_wu_established_tt:0 "吴朝已经建立。"
 nesnd_south_monarchy_ended_tt:0 "本国已经废除#v 君主制#!。"
 nesnd_south_pressure_bar_desc:0 "易代压力：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_pressure_detail_tt 变化规则#!#!"
 nesnd_south_compact_bar_desc:0 "改制承诺：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_compact_detail_tt 议定条件#!#!"
 nesnd_south_pressure_detail_tt:0 "#bold 易代压力#!：#v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\n当前每月净变化：#v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!。通常每月#n ＋3#!，礼法定制修正生效时#n ＋2.5#!；有效和解进程另每月减少#p 3#!。\n\n#bold 首辅案#!\n自#v 1837年7月#!起，压力超过#v 24#!时可能发生；至#v 1838年初#!，尚未结案且陈东阳仍在本国，就会进入刺杀与护卫分支。死亡使压力#n ＋25#!，受伤#n ＋10#!，脱险#n ＋3#!。\n\n首辅案已有结果后，压力达到#v 70#!可主动提前易代；达到#v 100#!且郑钦已离去，易代便会推进。自#v 1839年初#!起，若首辅案已有结果而朝争仍未解决，压力将升至#v 100#!，届时无论郑钦是否在世，都会进入易代与诸国答复。已达成和解则朝争告终。"
 nesnd_south_compact_detail_tt:0 "#bold 改制承诺#!\n大陆、海外与日本诸邦的承诺分别占#v 50%、30%、20%#!。承诺有效#v 36个月#!；改换立场、与中央交战、改投宗主或撤回支持后，相应承诺失效。\n\n#bold 和平议定国制#!\n所选一方的政治支持须达到#v 85#!，领先另一方#v 20#!，并连续维持#v 12个月#!。明廷须获#v 75%#!支持及至少两个大陆核心政府同意；吴方须获#v 80%#!支持、拟改省诸国与日本割地各方同意，并备有合格舰队。新制议定后，朝争结束。"
 nesnd_south_rules:0 "$nesnd_south_pressure_detail_tt$\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_status_succession:0 "南府已在催促改定帝统，明廷与各省仍在争取自己的主张。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules 朝争进展#!#!"