l_simp_chinese:
 nesnd_south_unsettled_tt:0 "南朝的朝争尚未平息。"
 nesnd_south_qin_departed_tt:0 "郑钦已去世或离开本国，或朝争已延续至#v 1839年#!。"
 nesnd_south_conflicts_failure_tt:0 "以下任一情况发生：\n本国拥有的[Concept('concept_state','州')]不足#v 2#!个；\n或四川、湖南、菲律宾、南洋联省和远南五邦均已不再是本国的直属[Concept('concept_subject','附属国')]（包括已经灭亡的邦国）。"
 nesnd_south_settled_tt:0 "南朝的朝争已经结束。"
 nesnd_south_wu_established_tt:0 "吴朝已经建立。"
 nesnd_south_monarchy_ended_tt:0 "本国已经废除#v 君主制#!。"
 nesnd_south_pressure_bar_desc:0 "易代压力：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_pressure_detail_tt 变化规则#!#!"
 nesnd_south_compact_bar_desc:0 "邦国契约：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_south_compact_detail_tt 订约条件#!#!"
 nesnd_south_pressure_detail_tt:0 "#bold 易代压力#!：#v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\n当前每月净变化：#v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!。通常每月#n ＋3#!，邦国契约修正生效时#n ＋2.5#!；有效和解进程另每月减少#p 3#!。\n\n#bold 首辅案#!\n自#v 1837年7月#!起，压力超过#v 24#!时可能发生；至#v 1838年初#!，尚未结案且陈东阳仍在本国，首辅便将遭遇刺杀。死亡使压力#n ＋25#!，受伤#n ＋10#!，脱险#n ＋3#!。\n\n首辅案结束后，压力达到#v 70#!可主动提前易代；达到#v 100#!且郑钦已离去，郑氏便会推动易代。至#v 1839年初#!仍未解决的朝争会达到#v 100#!，郑氏将推动易代，并要求各府表态。"
 nesnd_south_compact_detail_tt:0 "#bold 诸府盟约#!\n大陆、海外与日本诸邦的承诺分别占#v 50%、30%、20%#!。盟书有效#v 36个月#!；改换立场、交战、改投宗主或撤约后，相应承诺失效。\n\n#bold 以盟约定天下#!\n所选一方的政治支持须达到#v 85#!，领先另一方#v 20#!，并连续履约#v 12个月#!。明廷须获#v 75%#!盟书及至少两个大陆核心邦国签署；吴方须获#v 80%#!盟书、拟并省诸国与日本割地各方同意，并备有合格舰队。已达成和解，朝争便告结束。"
 nesnd_south_rules:0 "$nesnd_south_pressure_detail_tt$\n\n$nesnd_south_compact_detail_tt$"
 nesnd_south_status_succession:0 "南府的易代之议已不能再拖。首辅案结束、压力达到#v 100#!后，诏书将送往各府，等待诸国答复。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_south_rules 朝争进展#!#!"