l_simp_chinese:
 character_role_nesnd_ming_refuge:0 "明室宗亲"
 character_role_nesnd_ming_refuge_desc:0 "在明吴易代中保留宗室身份的朱氏成员。"
 nesnd_board_external_observer:0 "域外观察"
 nesnd_south_reconciliation:0 "重修盟好"
 nesnd_south_reconciliation_reason:0 "自北明藩镇割据以来，南京朝廷与地方诸府之间的往来，常伴随着贡赋、军役和名分的争执。郑氏主持南朝政务之后，海外贸易和直属军队又将这些旧关系编入了一张遍及海内的帝国网络。如今，各府已经选定自己的盟书，中央需要按所许条件安排官员与经费，使这场易代争议有一个可以共同接受的结果。"
 nesnd_south_reconciliation_status:0 "已完成#v [JournalEntry.GetCountry.MakeScope.Var('nesnd_south_reconciliation_payments').GetValue|0]#!次月度履约。当前易代压力：#v [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!。履约期间，[concept_budget_government_wages]开支#n +5%#!、[concept_authority]#n −50#!；压力降至#v 40#!时结束。"
 nesnd_south_reconciliation_start:0 "按盟书办理"
 nesnd_south_reconciliation_start_desc:0 "向已经签署盟书的诸府派遣办事官员，承担中央所许的行政费用，逐月落实双方认可的安排。"
 nesnd_south_reconciliation_stop:0 "停止会办"
 nesnd_south_reconciliation_stop_desc:0 "撤回会办官员，停止额外行政支出。此后不再通过会办降低易代压力。"
 nesnd_south_reconciliation_requirements:0 "所选明廷或吴朝路线满足其余和平条件；当前没有南朝内部的[concept_diplomatic_play]或战争，且中央不在[concept_bankruptcy]恢复期。"
 nesnd_south_reconciliation_effect_tt:0 "持续承担[concept_budget_government_wages]开支#n +5%#!和[concept_authority]#n −50#!。满#v 1个月#!后，每次月度核验符合所选路线的盟书、政治及财政条件，易代压力#p −3#!；点击或续签盟书不直接降压。条件失效即停止会办。压力降至#v 40#!后结束，正式和平结局仍须完成原定#v 12个月#!观察。"
 nesnd_south_reconciliation_cost:0 "中央会办经费"
 nesnd_ming_royal_allowance:0 "明室岁费"
 nesnd_ming_receive_court_tt:0 "如合法明室成员已在本国避居，拥明将拥立其中在世的天子或储君，并保留原有地方领袖。王室由实际人物承接；无在世继承人时维持监国。"
 nesnd_court_followup.15.t:0 "明室岁费"
 nesnd_court_followup.15.d:0 "易代之后，留在[ROOT.GetCountry.GetName]的朱氏宗亲仍需安置。礼官将其姓名录入宗室册籍，为尚在世者保留衣食与居所。数百年积累的宫廷体制由此又添了一项新朝必须承担的开支，旧朝的年号、封爵与家谱，也将随这些宗亲继续流传。"
 nesnd_court_followup.15.a:0 "照册供给。"
 nesnd_court_followup.19.t:0 "各守成约"
 nesnd_court_followup.19.d:0 "围绕易代的交涉已延续两年。各府仍按自己的主张处理政务，中央送出的盟书也未能促成一次共同承认的定议。商旅继续往来，军队驻守原地，诸府的名号与辖境沿用至今。\n\n朝廷可以据此停办此次会商，将现行安排录为成约。此后君臣之间的往来，仍由各自保有的条约和实际权力决定。"
 nesnd_court_followup.19.a:0 "各守成约，休息生民。"
 nesnd_court_followup.19.b:0 "会商继续。"
 nesnd_south_inconclusive_order:0 "议定现状"
 nesnd_south_inconclusive_order_desc:0 "在持续两年没有形成靖难对峙的僵局后，以现有主权、疆界与条约结束这次易代交涉。"
 nesnd_south_inconclusive_result_tt:0 "结束本轮明吴危机。保留各国当前领土、政体及实际条约；不吞并附属国，不颁发明廷或吴朝胜利奖励。"
 nesnd_south_pressure_detail_tt:0 "#bold 易代压力#!：#v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\n当前每月净变化：#v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!。通常每月#n ＋3#!，邦国契约修正生效时#n ＋2.5#!；有效和解进程另每月减少#p 3#!。\n\n#bold 首辅案#!\n自#v 1837年7月#!起，压力超过#v 24#!时可能发生；至#v 1838年初#!，尚未结案且陈东阳仍在本国，就会进入刺杀与护卫分支。死亡使压力#n ＋25#!，受伤#n ＋10#!，脱险#n ＋3#!。\n\n案件结算后，压力达到#v 70#!可主动提前易代；达到#v 100#!且郑钦已离去，自动推进。至#v 1839年初#!仍未解决的朝争会达到#v 100#!，不再等待郑钦自然死亡，继而进入易代、诸国答复与内战交涉。已经达成的和平结局不受影响。"
 character_role_nesnd_ming_patron:0 "行在保护人"
 character_role_nesnd_ming_patron_desc:0 "为明廷行在提供地方军政支持的旧任领袖。"
