 nesnd_acw.1.t:0 "废奴派入主"
 nesnd_acw.1.d:0 "[SCOPE.sCharacter('nesnd_acw_new_ruler').GetFullName]成为[ROOT.GetCountry.GetName]的执政者。这位以反对奴隶制闻名的政治家还没有签署任何法令，南方的报纸已经在讨论脱离联邦的手续了。\n\n对种植园主来说，新执政者究竟打算做什么并不要紧。要紧的是，选票第一次把一个他们收买不了的人送上了最高的位置。"
 nesnd_acw.1.f:0 "“一座自相纷争的房子是站立不住的。”\n——伊利诺伊州的一篇演说，1858年"
 nesnd_acw.1.a:0 "联邦会守住的。"
 nesnd_acw.1.a.tt:0 "分裂危机#r +8#!\n此人执政期间，分裂危机每月#r +0.25#!"
 nesnd_acw.10.t:0 "分离危机"
 nesnd_acw.10.d_south:0 "南方各州的议会接连开会。讨论的已经不是要不要离开联邦，而是何时离开、由谁接管当地的军火库。北方的报纸称之为叛乱，南方的报纸称之为独立。\n\n华盛顿的妥协专家还在起草新的方案，只是已经没有人坐下来听了。"
 nesnd_acw.10.d_north:0 "蓄奴派执政以来，在国会一路得胜。北方各州却不愿再替南方的奴隶主追捕逃奴、为他们的新领土流血。自由州的议会开始讨论一件过去只有南方人才谈论的事：离开联邦。"
 nesnd_acw.10.f:0 "“我们不是敌人，而是朋友。我们不能成为敌人。”\n——一篇就职演说，1861年"
 nesnd_acw.10.a:0 "那就让大炮说话吧。"
 nesnd_acw.10.a.tt:0 "分离一方的支持者中增加激进派，此后每周推进内战，直至开战\n开战前本日志保持开启"
 nesnd_acw_wilmot_a_tt:0 "此后60个月，分裂危机每月#r +0.08#!"
 nesnd_acw_wilmot_b_tt:0 "此后60个月，分裂危机每月#r +0.06#!"
 nesnd_acw_wilmot_c_tt:0 "此后60个月，分裂危机每月#r +0.10#!"
 nesnd_hus_west_lever:0 "西岸的砝码"
 nesnd_hus_west_lever_reason:0 "联邦的南北之争越演越烈，我们的边界就越安全，也越有利可图。从密苏里逃来的黑奴、被驱赶的原住民，每一批越过边境的人，都在联邦的伤口上再划一刀。议会里有人主张收容他们，有人主张关上大门。工商集团盘算的则是：联邦一旦分裂，东边那些土地还归不归华盛顿。\n\n美洲只需要一个保护者。若是华盛顿自顾不暇，这个位置会落到谁手里？"
