 nesnd_hus_west_claim_auto:0 "开启自动宣称"
 nesnd_hus_west_claim_manual:0 "关闭自动宣称"
 nesnd_hus_west_press_auto:0 "开启自动东进"
 nesnd_hus_west_press_manual:0 "关闭自动东进"
 nesnd_hus_west_claim_auto_desc:0 "每月在满足提出边境主张的条件时，自动提出一项主张。若同时开启自动东进，且东进的其他条件已经满足，则优先将$nesnd_hus_west_claim_bar_name$积累至#v 100#!点。"
 nesnd_hus_west_claim_manual_desc:0 "停止自动提出边境主张，恢复手动操作。"
 nesnd_hus_west_press_auto_desc:0 "每月在满足东进条件时，自动发起收复领土的[concept_diplomatic_play]。对方拒绝退让可能导致战争。"
 nesnd_hus_west_press_manual_desc:0 "停止自动发动东进，恢复手动操作。已经发起的[concept_diplomatic_play]继续进行。"
 nesnd_hus_west_ten_status:0 "已提出主张的州区 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_west_claim_count')|0] / 10#!，已收复并持有的州区 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_west_won_count')|0] / 10#!。"
