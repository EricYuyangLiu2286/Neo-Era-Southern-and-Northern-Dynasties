 nesnd_hus_west_open:0 "开放西境"
 nesnd_hus_west_open_desc:0 "准许来自$nesnd_lobby_name_usa$的逃亡者越境定居。"
 nesnd_hus_west_open_tt:0 "与$nesnd_lobby_name_usa$保持和平期间，每六个月可收容一批来自该国边境州的[GetPopType('slaves').GetName]或原住民。当地须有符合迁入条件的人口，接收地须与其接壤并由本国完整持有。\n抵达的[GetPopType('slaves').GetName]转为[GetPopType('laborers').GetName]。每批使两国关系#r −5#!，并在奴隶制之争仍在进行时加剧分裂危机。"
 nesnd_hus_west_close:0 "关闭西境"
 nesnd_hus_west_close_desc:0 "暂停接收来自$nesnd_lobby_name_usa$的逃亡者。"
 nesnd_hus_west_close_tt:0 "停止收容来自$nesnd_lobby_name_usa$的逃亡者"
 nesnd_hus_west_border_policy_tt:0 "尚未调整过边境政策，或距上次调整已满#v 24#!个月"
 nesnd_hus_west_fund:0 "资助自由州移民"
 nesnd_hus_west_fund_desc:0 "拨款资助$nesnd_lobby_name_usa$的自由州移民。"
 nesnd_hus_west_fund_tt:0 "资助持续#v 12#!个月，本国的$nesnd_hus_west_claim_bar_name$每月#g +1#!。\n期间若$nesnd_lobby_name_usa$尚未实行[GetLawType('law_slavery_banned').GetName]，且分离危机尚未开始，其分裂危机每月#r +0.15#!。"
 nesnd_hus_west_fund_active_tt:0 "当前没有正在进行的移民资助"
 nesnd_hus_west_claim:0 "提出边境主张"
 nesnd_hus_west_claim_desc:0 "向边境土地的占有国提出领土主张。"
 nesnd_hus_west_claim_tt:0 "对符合条件的边境州中人口最多的一州提出主张。$nesnd_hus_west_claim_bar_name$#r −50#!，与占有该州的国家关系#r −10#!。"
 nesnd_hus_west_claim_cooldown_tt:0 "尚未提出过边境主张，或距上次提出主张已满#v 6#!个月"
 nesnd_hus_west_claim_candidate_tt:0 "$nesnd_lobby_name_usa$或其分离政权在美洲拥有一处有居民、与本国接壤且尚未被本国宣称的州"
 nesnd_hus_west_press:0 "东进"
 nesnd_hus_west_press_desc:0 "要求占有国交出本国已经宣称的边境土地。对方拒绝退让可能导致战争。"
 nesnd_hus_west_press_tt:0 "向占有国发起收复领土的[concept_diplomatic_play]，索取符合条件的边境州中人口最多的一州。$nesnd_hus_west_claim_bar_name$降至#v 0#!。"
 nesnd_hus_west_press_bar_tt:0 "$nesnd_hus_west_claim_bar_name$达到#v 100#!点"
 nesnd_hus_west_press_divided_tt:0 "$nesnd_lobby_name_usa$的分裂危机达到#v 80#!，或内战正在进行，或奴隶制之争已结束且当前没有内战"
 nesnd_hus_west_press_target_tt:0 "有一处经本日志提出主张的州与本国接壤，由$nesnd_lobby_name_usa$或其分离政权占有，且不属于条约港。\n本国与占有国没有停战协定，也不是该国的附属国。双方关系低于$relations_cordial$，占有国如为附属国，其宗主及最高宗主与本国的关系也须低于$relations_cordial$。"
 nesnd_hus_west_press_cooldown_tt:0 "尚未发动过东进，或距上次东进已满#v 24#!个月"
 nesnd_hus_west_success_tt:0 "在本日志宣称的#v 十个州区#!内，本国已通过收复或征服要求取得并保有提出主张时属于$nesnd_lobby_name_usa$及其分离政权的全部土地。相关战争已经结束，上述国家在这些州区内均已没有领土。"
