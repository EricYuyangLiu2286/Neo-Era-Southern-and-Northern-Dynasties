 ce_french_bourbon_dynasty_button: "波旁复辟"
 ce_french_bourbon_dynasty_button_desc: "革命是一场几乎要摧毁[ROOT.GetCountry.GetAdjective]民族的暴风。我们传统中的虔诚、忠义、高雅和骑士精神都因它而受害。随之产生的颠覆性思想和腐化行径荼毒至今，让我们与天主的国渐行渐远。这时代不能再被继续了。我们必须要荣耀的[ROOT.GetCountry.GetAdjective]王权归来。"
 je_ce_bourbon_dynasty_support: "复辟一个旧王朝"
 je_ce_bourbon_dynasty_support_reason: "波拿巴和共和派一样痴迷于“革命”和“民权”的呓语。而这种呓语自诞生之日起带给人类的就只有杀戮、践踏和毁灭。他使君臣反目，使父子相残，使农民和士兵杀害他们的长官，使一国之经济因为罢工和街垒而衰退。基督教文明正在与东方的无神论者进行一场生死竞赛，我们不允许这样的思想继续肆虐。而应该迎接受神圣秩序所命的真王归来！"
 je_ce_bourbon_dynasty_support_goal: "复辟一个旧王朝" 

