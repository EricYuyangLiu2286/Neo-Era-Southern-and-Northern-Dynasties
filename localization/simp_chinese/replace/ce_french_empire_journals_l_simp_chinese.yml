 fra_unrest.21.t: "错失良机"
 fra_unrest.21.d: "改换新王朝的时机已被我们错失，现在法兰西政局正向原先的君主主义者们无法想象的方向滑去..."
 fra_unrest.21.f: "“愚蠢在于急于下结论。”——《一封回信》古斯塔夫·福楼拜"
 fra_unrest.21.1: "拭目以待。"

 fra_unrest.22.t: "错失良机"
 fra_unrest.22.d: "改换新王朝的时机已被我们错失，现在波拿巴们已经站稳了脚跟。聚集在我们领袖间的秘密支持飞快退散。好像从未发生过。"
 fra_unrest.22.f: "“愚蠢在于急于下结论。”——《一封回信》古斯塔夫·福楼拜"
 fra_unrest.22.1: "拭目以待。"

