 # flavor random events
 fra_unrest.4.t: "异梦同床"
 fra_unrest.4.d: "[SCOPE.gsInterestGroup('monarchists_in_opposition').GetLeader.GetIdeology.GetName][SCOPE.gsInterestGroup('monarchists_in_opposition').GetName]和[SCOPE.gsInterestGroup('republicans_in_opposition').GetLeader.GetIdeology.GetName][SCOPE.gsInterestGroup('republicans_in_opposition').GetName]意识到了他们的共同目标，即推翻现存政权。一些铁杆的支持者在这一方向上甚至更进一步，在法庭案件、印刷传单等等各种反对活动中相互提携，结党营私。"
 fra_unrest.4.f: "“敌人的敌人就是朋友，不是吗？当然，那帮无赖摸不清形势发展的方向，等我们达到目的后就可以过河拆桥了。”"
 fra_unrest.4.a: "若要摧毁建制，当求各方团结一致。"
 fra_unrest.4.b: "与其狐朋狗友成群，还不如独善其身。"
 fra_unrest.4.c: "这种合作实在过于勉强，前途无望。"
 
 fra_unrest.6.b: "这归功于士兵，而非领袖。"
 fra_unrest.6.4: "听说在遥远西秦，铁靴推举皇帝，而不是反过来。"
 
 fra_unrest.7.4: "创业者们应该有更高的地位！"
 
 fra_unrest.8.t: "平民政治风潮"
 fra_unrest.8.d: "[ROOT.GetCountry.GetAdjective]的城市中，一种不同于以往的[SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName]的情绪在酝酿。随着最近一些泥腿子政客在国家高层受重用。那些曾经只有力气早出晚归，对邻里生活毫不关心的打工仔竟也开始积极地参与社区活动。仿佛只要选上一个自己中意的高人，床头屋漏、风卷乱瓦的住房问题就能立刻得到国家的帮助。"
 fra_unrest.8.f: "“屋倒会管，水臭会管，太热会管，太冷会管，传染病会管，黑中介会管，欺行霸市也会管！陛下也是我们的人啊！”"
 fra_unrest.8.1: "高高在上的波拿巴是过去的波拿巴。"
 fra_unrest.8.2: "鼓励社区政治也没什么不好..."
 fra_unrest.8.3: "[SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName]的要义就是要为国计民生解决问题，而不是念经祈祷！"
 fra_unrest.8.4: "这难道不是一种共和主义情绪？"

 fra_unrest.9.t: "神圣干预"
 fra_unrest.9.d: "[ROOT.GetCountry.GetAdjective]的教士自古以来就在政治上十分活跃。红衣主教黎塞留不过是其中最著名的一份子。在历任[ROOT.GetCountry.GetAdjective]宫廷中担任顾问、官僚、宣传鼓动者等角色。就算学者们将皇帝们的统治术称为[SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName]并加以理性化、现代化的解释，也不妨碍教士们中的一部分不断对波拿巴王朝施加神授王权的影响。"
 fra_unrest.9.f: "“难道上帝不是要求君主去施行统治吗？难道牧羊人的权力是由羊儿赋予？难道牧羊人不会全心全意为他的羊儿们福祉繁荣而劳作吗？难道不该是上帝而非凡人对不称职的君王做出评判？”"
 fra_unrest.9.1: "黑色衣服的朋友们，进来吧。"
 fra_unrest.9.2: "允许一部分教士担任政府公职就好是吧？"
 fra_unrest.9.3: "[SCOPE.sCharacter('bonapartist_character').GetIdeology.GetName]离不开对主的忠诚。"
 fra_unrest.9.4: "上帝的归上帝，凯撒的归凯撒。"

 fra_unrest.10.t: "一篇来自[SCOPE.sCharacter('partisan_character').GetFullName]的诘问"
 fra_unrest.10.d: "随着社会情绪在今日的政治经济改革中不断高涨，一些有别于一般波拿巴主义的君主立宪思考开始传播。或者是对其单纯的反思，或者是某种全新的思潮，指向政府中的来自非波拿巴家族的某些贵族高层。著名政客[SCOPE.sCharacter('partisan_character').GetFullName]就是其中之一。\n\n今日，[SCOPE.sCharacter('partisan_character').GetFullName]自称代表[SCOPE.sCharacter('partisan_character').GetInterestGroup.GetName]全体向我国重要报社发表了关于现有政局的一些评论。尽管[SCOPE.sCharacter('partisan_character').GetHerHis]已经尽力遮掩自己批判时局的欲望，并用各种中立性分析和数据包装辞藻，却在[ROOT.GetCountry.GetAdjective]的民间和政界掀起了轩然大波。"
 fra_unrest.10.f: "#bold [SCOPE.sCharacter('partisan_character').GetFullNameNoFormatting]：“我一片赤诚之心，朝向[SCOPE.sCharacter('partisan_character').GetCustom('french_dynasty_name')]。但就近日来各个大学发表的统计数据来看，我们社会上的很多现象实在不能说是合乎情理...”#!\n\n[SCOPE.sCharacter('partisan_character').GetFullNameNoFormatting]，作为一名多产的君主派人士和[SCOPE.sCharacter('partisan_character').GetInterestGroup.GetNameNoFormatting]政治人物，长期以来发表的文字和宣讲都以呼吁和解而著称，极少表达自己对实际政策的批判。[SCOPE.sState('capital_scope').GetCityHubName]的人们对[SCOPE.sCharacter('partisan_character').GetLastNameNoFormatting]今天早上的宣言，既有持支持态度的，也有发表诽谤之声的。（下接第二页）"
 fra_unrest.10.1: "我们必须深刻的反思..."
 fra_unrest.10.2: "用支持政府的社论反驳他！"

 fra_unrest.12.t: "查理十世之死"
 fra_unrest.12.d: "波拿巴王朝打起所谓“革命君主制”招牌大谈[ROOT.GetCountry.GetAdjective]民族之荣耀，总也会强化人们对于那太阳王年代的记忆。\n\n由是，自约瑟夫皇帝开放言论管制之日起，民间总传出推翻共和派时期判决的声音。这些声音为“公民路易”叫屈。呼吁着要恢复波旁家族公民身份，重新接纳他们归国。但越是如此，波拿巴王朝的掌权者就越警惕。只是让其家族得以在[SCOPE.sCountry('slovenia_owner_scope').GetName]受表亲庇护，绝口不提什么赦免。\n\n然而，也不知是顺上了哪波社会议题发酵的风味，当代波旁之主，自称“流亡法国国王查理十世”的夏尔·菲利普去世的消息在国内激起波澜。从各省和乡村中，旧君主的支持者聚集起数千人在[SCOPE.sState('capital_scope').GetCityHubName]街头请愿将他的遗体送回[ROOT.GetCountry.GetNameNoFormatting]安葬。共和派和现政权的支持者则发动了对立游行试图阻挠。"
 fra_unrest.12.f: "无冕之王已经去世了，但几乎没有人准备像以前那样哭泣。成千上万的人呼吁流亡国外的国王的遗体回到法国安葬。“传统，”他们说。另外成千上万的人发誓要焚烧尸体。“霍乱，”他们说。"
 fra_unrest.12.1: "查理此人怎么会跟你们分享权力，真是胡闹！"
 fra_unrest.12.2: "比起动辄挥起屠刀的共和，我还是更喜欢旧制度。"
 ce_allow_you_to_chose_bourbon_tt: "解锁一个新的日志选项：#b 波旁复辟#!"

 fra_unrest.13.t: "大游行"
 fra_unrest.13.d: "大革命爆发后，[ROOT.GetCountry.GetAdjective]人总是闲不下来，并乐于为自己的诉求发声。正如今日早些时候，一些不知从何处而来的人聚集在[SCOPE.sState('capital_scope').GetCityHubName]郊外的一处教堂内。还不等附近警局有所动作，这些人就完成了整队。在午饭时间后一会，他们就集体出现在了[SCOPE.sState('capital_scope').GetCityHubName]的街道上，高举着横幅与红白两色旗帜，口中喊着“共和”或“公民权”等口号和一些谩骂当朝陛下的污言秽语。步伐整齐地向皇宫迈进......"
 fra_unrest.13.f: "“小小拿破仑，治国靠佞臣。岛夷非正主，依旧让民权！”"
 fra_unrest.13.1: "给我出动军警！"
 fra_unrest.13.2: "他们骂小拿破仑跟我[SCOPE.sCharacter('ruler_of_france_character').GetFullNameNoFormatting]有什么关系？"
 

 fra_unrest.14.t: "密室交易"
 fra_unrest.14.d: "[ROOT.GetCountry.GetAdjective]军队并非铁板一块。即使是在拿破仑大帝的日子里，人们也有自己的利益和圈子。除了那些和波拿巴所代表的建制和传统有强大联系的人外，处于上升期的政治派系总是能够找到人心的突破口。就连拿破仑大帝本人当年不也曾是“共和国”的爱将与拥趸吗？"
 fra_unrest.14.f: "“[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting]，看看街头，看看世界，想想你自己，想想这张存单，你真的要站在这些东西和历史本身的对立面吗？”"
 fra_unrest.14.1: "[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting]给予他们有限的支持。"
 fra_unrest.14.2: "[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting]被共和主义说服了！"
 fra_unrest.14.3: "[SCOPE.sCharacter('ce_french_republican_buying').GetFullNameNoFormatting]被社会主义说服了！"

 fra_unrest.15.t: "为共和主义发声"
 fra_unrest.15.d: "共和主义在街头巷尾蔓延，在今年尤其如此。或许是因为股市的短期震荡使一些工厂倒闭，或许是因为劳资纠纷带来的一些恶性案件，或许是某些神秘力量的策动，许多[SCOPE.gsInterestGroup('ce_republican_ig').GetName]的意见领袖走上街头，开始呼吁一个更加开放和人民主权的政府。"
 fra_unrest.15.f: "“[SCOPE.gsInterestGroup('ce_republican_ig').GetName]难道是由懦弱的人们组成的吗？真正的君主制是人们在心中做自己的君王！”"
 fra_unrest.15.1: "魑魅魍魉，镇之以静。"
 fra_unrest.15.2: "发起对立游行来对抗他们。"
 ce_french_republican_unity: "共和主义思潮"

 fra_unrest.16.t: "重大丑闻"
 fra_unrest.16.d: "本月早些时候，一本臭名昭著的亲共和派报纸刊载了一份有关[SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting]先生的调查报告。报告作者详述了自己在一间明显与[SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting]亲信有关的企业卧底采访的见闻。他发现这家企业近乎当局的黑手套一般，不仅在我国境内经营着鸦片、高利贷等在道德上应谴责的营生，还参与了对儿童和年轻女性公民的拐卖活动。\n\n在本朝现行法律体系下，对有公民身份者的奴隶化明确非法。但他们却借着与[SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting]亲信的关系大肆牟利。"
 fra_unrest.16.f: "“[SCOPE.sCharacter('ce_republican_attacked').GetFullNameNoFormatting]或许真的对这事一无所知。但他选择了那种人作为自己的侍从，这不也证明他的无能吗？”"
 fra_unrest.16.1: "有人要被畏罪自杀了。"
 fra_unrest.16.2: "让那个蠢货离开国内躲一阵。"
 fra_unrest.16.3: "想办法攻击案件的真实性，然后让那个蠢货和记者都给我消失！"

 fra_unrest.17.t: "共和派暴动"
 fra_unrest.17.d: "由于经济问题、人民不满、社会矛盾或是其他什么乱七八糟的问题。民间对于共和主义的呼声终于达到了一个巅峰。于是，时隔多年，巴黎和外省的大城市中出现了零散的街垒和集中的游行队伍。政府高层中，许多人焦头烂额，不知道该如何调集资源解决这次大乱......"
 fra_unrest.17.f: "“真理已经上路，任何东西都不能阻止它！”"
 fra_unrest.17.1: "好吧！好吧！我们应当在关键议题上向他们让步。"
 fra_unrest.17.2: "绝不与他们妥协！我们还有政治力量可以调集。"
 fra_unrest.17.3: "向企业家们筹款，有钱就有办法..."
 fra_unrest.17.4: "我的将军们呢？"
 fra_unrest.17.5: "发动勋贵和乡绅们的影响力！"

 fra_unrest.18.t: "帝国的奥尔良派"
 fra_unrest.18.d: "路易 - 腓力是奥尔良公爵路易 - 腓力二世之子。大革命爆发后，他因故一度逃亡英国，在英国与拿破仑议和后又辗转旅居美国和大明，对这些国家的宪政民主印象深刻。并在流亡南明期间受聘为皇太子的法语老师和西方史教师，领受翰林院学士的礼服和俸禄。\n\n1830年初，路易 - 腓力响应约瑟夫皇帝的和解号召而归国。作为归国旧贵族中的第一个大贵族和东方通，他很快得到了约瑟夫皇帝的召见，成为其东方事务顾问并跻身帝国元老院议员之列。他随后接触到了皇储路易·波拿巴，并敏锐地混入了后者的亲信队伍。在1832年约瑟夫暴毙、路易登基后，腓力一跃成为帝国的外交大臣，为稳定拿破仑三世政权发挥了重要作用。\n\n作为拿破仑政权的门面，外交大臣路易 - 腓力对帝国内外上下展示他忠厚和蔼的形象，并因多次完成保卫帝国利益的重要条约而为市民所拥戴。借助皇帝对他的放纵，路易及其储君膝下聚拢了一批被称为“奥尔良派”的追随者，在各类沙龙和报刊中隐晦但持久地表达着自己对扩大宪政和票选制度的看法。时至今日，路易 - 腓力及其拥趸的印记几乎遍布帝国外事和贸易事务的每一个角落。"
 fra_unrest.18.f: "“真机遇只偏爱有准备的头脑。”"
 fra_unrest.18.1: "我认为，帝国的政治家该有一种更高尚的忠诚。"
 FRA_ORL_popularity: "人气高涨的温和派"

