 fra_unrest.1.t: "帝国内务"
 fra_unrest.1.d: "拿破仑大帝建立的帝国是繁荣的、神圣的、强大的，却独不能说是和平与稳定的。法兰西的内外敌人在他生前组织了四次反法同盟，并在大陆封锁问题上阳奉阴违，在他死后就更是如此了。法兰西人天生的勇敢和正义心也让他们总不满足于成为某个人的臣民——无论他是全欧罗巴的皇帝还是住在一楼的房东。\n\n于是，拿破仑大帝开始了全欧洲的“反激进派恐怖”运动。而聪慧仁爱的第二代波拿巴帝王又废止了它。然而，统治半个地球（法国视角）所需的威严似乎对于仁爱的约瑟夫来说还是太过沉重，他于是在1832年冬天死于心脏骤停。在那时，蛮横的波拿巴和他的铁靴们缔造的秩序似乎要卷土重来...\n\n好在上帝 （主要是借当时的权贵们之手表现）并无如此计划。继承帝位的是年轻、野心勃勃且对新事物充满热情的路易。以他为轴心，一个宣称以上层主导的社会平等和社会繁荣为主要事业的内阁迅速建立起来。以民族主义和民生繁荣为纲领，试图建立一个强势君主主导的宪政秩序。然而，自从第一个拿破仑第一次对法国人承诺荣耀和繁荣以来已经过去了二十余年，而法国人民也为此坚韧不拔了二十余年。波拿巴王朝及其追随者的承诺究竟还要多少时候才能兑现？"
 fra_unrest.1.f: "“帝国，即和平。”——1832年，夏尔·路易·拿破仑·波拿巴皇帝在兰斯大教堂的登基仪式上"
 fra_unrest.1.1: "权力是一个帝国人的次级需求。"
 fra_unrest.2.t: "波拿巴主义胜利"
 fra_unrest.2.d: "我们终于向人民证明——自从1829年以来，波拿巴王朝承诺的改革是真实且现实的。波拿巴主义的愿景不是一种搬弄法条、议程或社会矛盾的统治术，而是一种基于宪政国家和大政府的真理。起码在一定程度上，我们遵循着拿破仑皇帝的教导，在激进派和旧制度、精英和大众之间寻找到了属于法兰西民族和社会的平衡状态。"
 fra_unrest.2.f: "“...法律庄严地平等禁止富人和穷人睡桥洞、乞讨、偷面包...”——《红百合》阿纳托尔·法朗士"
 fra_unrest.2.1: "巴黎繁荣，欧洲昌盛。巴黎贫困，欧洲衰亡。"
 fra_unrest.3.t: "后波拿巴时代"
 fra_unrest.3.d: "帝国的消亡不总是轰轰烈烈，也可以是悄无声息。1835年的元老院改革完善了“帝国公民”而非“臣民”的概念，并试图（至少是再次试图）赋予有产公民们“尊严、义务和选举权”。从那时开始，大革命和拿破仑浪潮后的专权时代的那种“属于王朝和国家”法国人就消失了。就好像他们从没存在过，也不应该存在。如此，那个帝国的改革和它在改革中的自我消亡就不可避免。"
 fra_unrest.3.f: "“民族的存在，是每日的公民投票。”——《什么是民族？》欧内斯特·勒南"
 fra_unrest.3.1: "没了拿破仑，我们还有什么？"
