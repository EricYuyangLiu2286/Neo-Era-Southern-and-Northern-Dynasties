 fra_unrest.19.t: "奥尔良派政变"
 fra_unrest.19.d: "在风波诡谲的帝国政局中谁也没料到波拿巴王朝几乎在一夜之间崩溃。随着支持路易 - 腓力理念的军警势力突入皇宫和各省政府，波拿巴派领袖[SCOPE.sCharacter('fra_old_ruler_scope').GetFullNameNoFormatting]仓皇出逃。外国评论家们怎么也搞不懂，原本被视为宪政支柱的奥尔良派如何能走到[SCOPE.sCharacter('fra_old_ruler_scope').GetFullNameNoFormatting]的对立面，并且从内部篡取了拿破仑大帝的帝国。\n\n与此同时，法兰西帝国之内，新生的奥尔良王朝在[SCOPE.sCharacter('french_monarch_scope').GetFullNameNoFormatting]在论功行赏之余，也在紧张地接管或重塑帝国上下的行政架构，以符合他们及他们支持者君主立宪愿景。"
 fra_unrest.19.f: "事物变化越多，它们就越保持不变。古代的男爵们拥有铁匠铺和农田。今天，他们把控着机器和商品仓库。对于明智的国王来说，这些男爵持有哪些钥匙并不重要，只要这些钥匙掌握在正确的人手中就可以了。"
 fra_unrest.19.1: "我对宪政和公民的忠诚还在我个人荣辱之上。"
 fra_unrest.19.2: "只有坚决的改革才能挽救法兰西帝国。"
 fra_unrest.19.3: "只有坚决的改革才能挽救法兰西经济。"
 ce_successful_coup_legitimacy: "成功的政变"
 FRA_ORL_success: "实业家君主"

 fra_unrest.20.t: "波旁王室归国"
 fra_unrest.20.d: "自称“拿破仑三世”的路易·波拿巴醉心于他的“工业化”大计。在他浪迹于巴黎上流社会的资本圈子里时，法兰西的农村正在死亡。积功购买田产和农庄的军人因为工业品的冲击而连年亏损，几近破产。\n\n正因如此，乡村中有一种情绪在蔓延，那是一种感到被背叛的情绪。这种情绪在查理十世去世时被有心人利用而达到了一个节点。最终，借查理十世棺椁归葬的契机和保守派、农民抗议的压力，波旁王室的新一代领袖、圣路易的继承者[SCOPE.sCharacter('FRA_ce_bor_leader_scope').GetFullNameNoFormatting]宣布和波拿巴们达成了协定，以放弃“流亡法国王位”为条件回归祖国。\n\n进行了一段时间的准备后，[SCOPE.sCharacter('FRA_ce_bor_leader_scope').GetFullNameNoFormatting]在上星期六抵达巴黎，次日现身圣母院的例行弥撒。尽管提前派驻军警监视和控制，但现场还是引发大批市民围观..."
 fra_unrest.20.f: "“...欧洲的正统君主们必须了解的是...我们的真正的问题是魂灵上不再向往救赎，是和异教徒（尤其是明国人）在各个领域的殊死搏斗，是我们不再用神圣的秩序规定我们自己和臣民们的位置...”——《1831年12月26日自巴塞罗那来信》波旁储君夏尔 - 菲利普（流亡法国国王查理十世）"
 fra_unrest.20.1: "君权神受，不可侵犯。"
 

 fra_unrest.23.t: "波旁复辟"
 fra_unrest.23.d: "由于政府上下对波拿巴政权的完全失望，一场迅速的政变使得[ROOT.GetCountry.GetRuler.GetFullName]顺利上台。令人惊讶又在意料之中的是，波旁家族的继承人没有选择传统的奢华仪式，而是穿着与教士一般简朴的黑色披风与查理十世的旧袍服出现在了加冕仪式。在持续一个上午的虔诚礼拜和对乡镇代表、教会人士的接见后，[ROOT.GetCountry.GetRuler.GetSheHe|U]在兰斯主教座堂接受了膏立，并被加冕为[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]。"
 fra_unrest.23.f: "“神意召叫朕归此圣土，以承法兰西国王之重任。在以如一之天平衡量众多君主与邦国的主的祭坛之前，朕承诺忠于这片土地的宪章、神圣秩序与基督教文明，并再度庄严宣誓致力维护之。”"
 fra_unrest.23.1: "圣路易的继承人万岁！"
 fra_unrest.23.2: "统治不绝对，则绝对无统治。"
 fra_unrest.23.3: "神圣的秩序将降临！"
