l_simp_chinese:
 nesnd_egypt_independence:0 "独立的代价"
 nesnd_egypt_independence_reason:0 "1825年的协定承认埃及摆脱奥斯曼的统辖，六国以保证独立换取在尼罗河沿岸投资的权利。政府得到了喘息的机会，工场、学校和军队却也开始依赖外国的资金与技术。\n\n选择投资伙伴，可以引进机器、教师和新的产业。外资占据的份额越大，埃及自主决策的余地就越小。未来三十年，政府必须在发展与独立之间作出取舍。"
 nesnd_egypt_with_investor_status:0 "寻求投资国：[ROOT.GetCountry.MakeScope.Var('nesnd_egypt_investor').GetCountry.GetName]。外国持有的经济份额：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]。"
 nesnd_egypt_without_investor_status:0 "尚未承诺由一国主持投资。外国持有的经济份额：[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_egypt_foreign_share')|%1]。"
 nesnd_egypt_investment_accounts:0 "尼罗河的学校与工场"
 nesnd_egypt_investment_accounts_reason:0 "埃及需要能够制造、修理和使用机器的人。大学培养的技术人才要有工场可去，工具厂生产的器械也要有工人使用。政府希望外国投资能带起本国的产业，使学校与工场不再长久依赖外来的教师和技师。"
 nesnd_egypt_independence_bar:0 "独立性"
 nesnd_egypt_independence_bar_desc:0 "$nesnd_egypt_independence_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_egypt_sponsor_drain:0 "对投资国的政治承诺"
 nesnd_egypt_foreign_drain:0 "超过25%的外资经济份额"
 nesnd_egypt_generation_passed:0 "独立安排已维持三十年"
 nesnd_egypt_still_independent:0 "独立性仍高于0"
 nesnd_egypt_dependence_reached:0 "独立性降至0"
 nesnd_egypt_dependence_result:0 "独立性耗尽时，埃及将接受主导投资国（按照[Concept('concept_gdp', '$concept_gdp_short$')]份额）的保护。若无人能够承担，或保护关系未能成立，政府将承受保障落空的政治后果。"
 nesnd_egypt_investor_desc:0 "选择主要投资伙伴，以建设、教育与产业合作换取长期支持。"
 nesnd_egypt_choose_cost:0 "有效投资承诺每月消耗1独立性。十二个月内不能更改这项安排。"
 nesnd_egypt_investor_none:0 "不指定投资国"
 nesnd_egypt_investor_none_desc:0 "由埃及自行承担发展的政治责任。"
 nesnd_egypt_none_effect:0 "撤回投资承诺并失去赞助利益，但既有外资所有权仍会影响独立性。十二个月内不能更改这项安排。"
