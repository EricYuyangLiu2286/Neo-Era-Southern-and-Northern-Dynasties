 subject_type_nesnd_egypt_protectorate_no_icon:0 "保护国"
 nesnd_egypt_protectorate:0 "埃及保护关系"
 nesnd_egypt_protectorate_desc:0 "埃及保留本国政府与对外行动，其主权受保护国协定约束。"
 nesnd_egypt_protectorate_pact_desc:0 "埃及接受投资国的保护。"
 nesnd_egypt.1.t:0 "独立的一代"
 nesnd_egypt.1.d:0 "三十年间，埃及保住了自己的政府与外交自主。外国商人仍在尼罗河沿岸经营，列强也没有放弃在这里的利益，但它们未能取得决定埃及国事的权力。本国的学校和工场将继续支撑这份独立。"
 nesnd_egypt.1.a:0 "让下一代接过它。"
 nesnd_egypt.2.t:0 "保护国协定"
 nesnd_egypt.2.d:0 "埃及已经接受投资国的保护。曾经支持工场、军备和学校的外国力量，如今有了干预国家事务的权利。本国政府仍将处理日常政务，但对外行动必须顾及保护国协定。"
 nesnd_egypt.2.a:0 "承认已经签下的协定。"
 nesnd_egypt.3.t:0 "保障落空"
 nesnd_egypt.3.d:0 "政府已经无力维持原有的独立安排，却又找不到能够提供保护的投资伙伴。引进的产业和外资仍在，外部保障却已落空，执政者必须独自面对国内的不满与列强的压力。"
 nesnd_egypt.3.a:0 "政府必须承担责任。"
 nesnd_egypt.4.t:0 "本国的技师与工人"
 nesnd_egypt.4.d:0 "大学培养的技术人才开始进入工场，工具厂和新兴产业也有了稳定的劳动力。埃及正在形成自己的生产与教育力量，今后的建设将有更多本国技师与工人参与。"
 nesnd_egypt.4.a:0 "继续培养本国人才。"
 subject_type_nesnd_egypt_protectorate_desc:0 "埃及保留本国政府，在保护国协定下承担对宗主的义务。"
 nesnd_egypt_protectorate_action_name:0 "保护关系"
 nesnd_egypt_protectorate_action_propose_name:0 "建立保护关系"
 nesnd_egypt_protectorate_action_notification_name:0 "$protectorate_action_notification_name$"
 nesnd_egypt_protectorate_action_notification_desc:0 "$protectorate_action_notification_desc$"
 nesnd_egypt_protectorate_action_break_name:0 "解除保护关系"
 nesnd_egypt_protectorate_action_notification_break_name:0 "保护关系解除"
 nesnd_egypt_protectorate_action_notification_break_desc:0 "保护国协定已经终止，双方不再承担这项保护关系规定的义务。"
 nesnd_egypt.3.unworkable:0 "投资伙伴仍在，保护国协定却未能成立。政府曾以这份保障争取国内支持，如今只能自行应对埃及面临的压力。"
 nesnd_egypt.6.t:0 "自主局面的终结"
 nesnd_egypt.6.d:0 "埃及已经归于另一个宗主，原来的投资安排随之结束。政府今后的外交与内政，将受到新的宗属关系约束。"
 nesnd_egypt.6.a:0 "面对新的处境。"
