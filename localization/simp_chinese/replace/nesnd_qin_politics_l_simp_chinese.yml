 nesnd_qe1_court_status:0 "皇族、地方士人与军府正在争夺帝国的中枢。"
 nesnd_qe1_court_journal:0 "伊犁的朝议"
 nesnd_qe1_court_journal_reason:0 "皇族以旧日征服的威望维系奉宸官僚，地方士人依靠学堂、商号和官署经营政务，军队则掌握帝国赖以扩张的武力。三方都要借助另外两方治理各地，也都在争取任官、征税和调兵的决定权。"
 nesnd_qe1_patron_crown_button:0 "奖掖奉宸官僚"
 nesnd_qe1_patron_crown_button_desc:0 "让拥护皇室的军士与官员掌握更多职位。"
 nesnd_qe1_patron_literati_button:0 "奖掖地方士人"
 nesnd_qe1_patron_literati_button_desc:0 "让学堂、商号与文官的意见更多地进入朝廷。"
 nesnd_qe1_patron_army_button:0 "奖掖军府"
 nesnd_qe1_patron_army_button_desc:0 "让军队及支持军府的市民取得更多的政治声望。"
 nesnd_qe1_patron_cancel_button:0 "撤回奖掖"
 nesnd_qe1_patron_cancel_button_desc:0 "朝廷停止对这一方的特别扶持。"
 nesnd_qe1_coup_army_button:0 "军府接掌中枢"
 nesnd_qe1_coup_army_button_desc:0 "以军队与职业团体重组国家，专制的权力将由法团机关行使。"
 nesnd_qe1_coup_literati_button:0 "改立共和"
 nesnd_qe1_coup_literati_button_desc:0 "改立总统共和，由民选总统与按地产投票选出的议会主持国政。"
 nesnd_qe1_coup_crown_button:0 "重整皇权"
 nesnd_qe1_coup_crown_button_desc:0 "以君主制与技术官僚重组政府，使皇室重新掌握国家的统治。"
