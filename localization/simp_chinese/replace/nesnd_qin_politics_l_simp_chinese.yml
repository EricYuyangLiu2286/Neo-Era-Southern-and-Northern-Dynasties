 nesnd_qe1_unity_journal:0 "帝国的稳定"
 nesnd_qe1_unity_journal_reason:0 "商路、村社与军屯曾将许多不同来历的人联结在陈秦皇帝的治下。西域汉羌既是帝国扩张的产物，也为这个国家提供了兵员与税源。人们在繁荣中接受共同的身份，也会在征役与贫困中重新寻找旧日的族名、信仰和乡里。"
 nesnd_qe1_uprising_journal:0 "羌种暴动"
 nesnd_qe1_uprising_journal_reason:0 "边地的社团已不再满足于请愿。他们募集粮饷，联系旧贵族与宗教领袖，以本地人的名义向帝国征税的官署和征兵的军府发出挑战。伊犁仍有机会恢复人心，但拖延将使各地的反抗连成一片。"
 nesnd_qe1_conversion_cohort:0 "西域汉羌"
 nesnd_qe1_identity.1.a:0 "地方已不再相信旧日的许诺。"
 nesnd_qe1_identity.1.t:0 "认同的衰退"
 nesnd_qe1_identity.1.d:0 "[SCOPE.sStateRegion('nesnd_qe1_declining_region').GetName]的村社与军屯正在重述自己的来历。旧时的族名、经文与乡里关系重新成为人们彼此信任的凭据。当地约半数西域汉羌如今重新以[SCOPE.sCulture('nesnd_qe1_return_culture').GetName]自称，信奉[SCOPE.sReligion('nesnd_qe1_return_religion').GetName]。"
