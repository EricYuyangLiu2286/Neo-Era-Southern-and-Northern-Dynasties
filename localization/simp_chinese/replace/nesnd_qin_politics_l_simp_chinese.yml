 nesnd_qe1_court_journal:0 "伊犁的朝议"
 nesnd_qe1_court_journal_reason:0 "[ROOT.GetCountry.GetName]的皇族以旧日征服的威望维系奉宸官僚，地方士人依靠学堂、商号和官署经营政务，军队则掌握帝国赖以扩张的武力。三方都要借助另外两方治理各地，也都在争取任官、征税和调兵的决定权。"
 nesnd_qe1_court_journal_lobby:0 "$nesnd_lobby_name_qe1$的皇族凭着旧日征服的威望维系奉宸官僚，地方士人依靠学堂、商号和官署经营政务，军队握着帝国扩张所需的武力。三方治理各地都要借助另外两方，也都在争夺任官、征税和调兵的决定权。"
