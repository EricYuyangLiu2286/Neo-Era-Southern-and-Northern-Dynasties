 nesnd_qe1_agenda_status_econ:0 "安国之策渐占上风。"
 nesnd_qe1_agenda_status_army:0 "军府正在争取朝廷的支持。"
 nesnd_qe1_agenda_status_neutral:0 "朝臣仍在争论帝国的出路。"
 nesnd_qe1_agenda_journal:0 "西部帝国的自救"
 nesnd_qe1_agenda_journal_reason:0 "秦军退守伊犁以后，陈秦皇族仍时常东顾玉门，军士和武勋门阀却已不敢轻言东征。帝国需要恢复生产和税收，军府也需要新的兵员与军饷。安国派主张先改旧法，使农工商各得其利。统治派则认为，没有强兵护持，朝廷的法令终究到不了地方。"
 nesnd_qe1_economy_journal:0 "安国之策"
 nesnd_qe1_economy_journal_reason:0 "安国派要求让田地自由买卖，让商人自行经营，并使有产之家进入朝议。他们相信，西部帝国只有先养民力，才能重新取得同东方争雄的财力。"
 nesnd_qe1_army_journal:0 "军府之议"
 nesnd_qe1_army_journal_reason:0 "军府不愿再为一次仓促的东征耗尽兵力。他们要求先扩充营伍，稳住波斯，向印度与俄国的边地取得新的土地和税源，然后再议玉门以东的天下。"
 nesnd_qe1_quiet_status:0 ""
 nesnd_qe1_econ_ready_status:0 "安国派的三项法案已成，新的工场与铁路正在支持他们的主张。"
 nesnd_qe1_army_ready_status:0 "新军已有规模，西部边疆的胜利使军府声望日隆。"
 nesnd_qe1_agenda_gate_tt:0 "此议案半年内不能再次提出。"
 nesnd_qe1_law_push_button:0 "责令议法"
 nesnd_qe1_law_push_button_desc:0 "朝廷责成官员加紧议法，军府与地主的反对不得再使议程久拖不决。"
 nesnd_qe1_economy_push_button:0 "裁军兴业"
 nesnd_qe1_economy_push_button_desc:0 "朝廷力推安国之策，要求军府与乡民团体让步，使恢复生产与改造旧法的主张占据朝议。"
 nesnd_qe1_army_petition_button:0 "呈报边功"
 nesnd_qe1_army_petition_button_desc:0 "军府将新营名册与边地战果送到伊犁，要求朝廷承认统治派的功劳。"
 nesnd_qe1_economy_petition_button:0 "呈报新政"
 nesnd_qe1_economy_petition_button_desc:0 "工场、铁路与新法已见成效，安国派请求朝廷继续推行其议程。"
 nesnd_qe1_law_push:0 "责令议法"
 nesnd_qe1_economy_push:0 "裁军兴业"
 nesnd_qe1_angovernment:0 "安国派执政"
 nesnd_qe1_military_government:0 "统治派执政"
 nesnd_qe1_stalled:0 "久议不决"
 nesnd_qe1_angovernment_desc:0 "工商业的新秩序使生活改善更易赢得人心。"
 nesnd_qe1_stalled_desc:0 "朝廷的争执拖延日久，生活困顿更易使人心转向激愤。"
 nesnd_qe1.1.a:0 "先养民力。"
 nesnd_qe1.1.t:0 "安国之策"
 nesnd_qe1.1.d:0 "安国派的主张成为朝廷施政的方向。支持改制的士人与工商业者声望日隆，军府及其市民拥护者则失去了原有的政治优势。恢复生产与改造旧法，将成为新政府争取人心的凭借。"
 nesnd_qe1.2.a:0 "整饬军政。"
 nesnd_qe1.2.t:0 "军府得势"
 nesnd_qe1.2.d:0 "统治派取得了朝廷的支持，军府将掌握更多征募、军需与任官事务。此前要求恢复生产、改造旧法的官员未能主导新政府，伊犁已把扩充军队列为国策。"
 nesnd_qe1.3.a:0 "朝廷失去了许多时间。"
 nesnd_qe1.3.t:0 "十年空议"
 nesnd_qe1.3.d:0 "朝议延续了十年，田地、军饷与官职的争论仍没有结果。地方听过太多振兴帝国的许诺，越来越少的人相信下一道法令能改变自己的处境。"
