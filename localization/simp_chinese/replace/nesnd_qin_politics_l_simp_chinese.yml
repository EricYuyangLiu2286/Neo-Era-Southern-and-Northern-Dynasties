 nesnd_qe1_subsidy_material_tt:0 "按当前情形，每月团结度#g +[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_subsidy_material_rate')|2]#!。国家举债时这一数值减半，违约或破产时为零。它还随[concept_sol]、当前团结度和连续施行的期数变化，团结度达到#v 70#!后为零。"
 nesnd_qe1_subsidy_political_tt:0 "按当前情形，每月团结度#g +[ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_subsidy_political_rate')|2]#!。[concept_legitimacy]低于#v 50#!或[concept_radical]达到两成时这一数值减半，[concept_legitimacy]低于#v 25#!或[concept_radical]达到三成半时为零。它还随当前团结度和连续施行的期数变化，团结度达到#v 70#!后为零。"
