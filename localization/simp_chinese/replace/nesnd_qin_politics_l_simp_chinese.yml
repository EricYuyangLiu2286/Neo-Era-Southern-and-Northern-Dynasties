 nesnd_qe1_unity_hope:0 "田野、市镇与营伍仍把自身的前途寄托在帝国之中。"
 nesnd_qe1_unity_doubt:0 "地方正在重新讲述自己的来历，朝廷的号令越来越难抵达。"
 nesnd_qe1_unity_crisis:0 "旧日族名已成为结社与举兵的旗帜。"
 nesnd_qe1_forecast_state:0 "\n下次月结：[ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_state').GetState.GetName]约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_next_size')|D]#! 名[GetCulture('ce_xiyu').GetName]改称[ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_culture').GetCulture.GetName]，改信[ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_religion').GetReligion.GetName]。届时团结度须仍低于 #v 50#!。"
 nesnd_qe1_forecast_all:0 "\n下次月结：全国约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_next_size')|D]#! 名中华文化圈以外的居民转为[GetCulture('ce_xiyu').GetName]。届时团结度须仍高于 #v 75#!。"
 nesnd_qe1_forecast_none:0 "\n下次月结：不转化。"
 nesnd_qe1_forecast_state_undrawn:0 "\n下次月结：[ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_state').GetState.GetName]约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_next_size')|D]#! 名[GetCulture('ce_xiyu').GetName]转回当地旧有的文化与信仰，具体哪一种届时按当地原有人口抽定。届时团结度须仍低于 #v 50#!。"
 nesnd_qe1_forecast_missed:0 "\n下次月结：不转化。本月没有抽中任何[concept_state]，团结度低于 #v 50#! 时每月有 #v 20%#! 的几率。"
