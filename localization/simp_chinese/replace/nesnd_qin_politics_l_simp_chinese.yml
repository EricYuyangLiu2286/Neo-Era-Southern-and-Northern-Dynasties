 nesnd_qe1_recovery_journal:0 "恢复故土"
 nesnd_qe1_recovery_journal_reason:0 "河西的关隘与关中的田地仍在陈秦皇族的记忆之中。若帝国能够重新控制通往东方的道路，恢复军队与官署的力量，朝廷便有机会以故土为起点，再次争夺华夏的天下。"
 nesnd_qe1_recovered_military:0 "再造秦军"
 nesnd_qe1_recovered_civil:0 "故土新政"
 nesnd_qe1_recovery.1.a:0 "以故土重整军伍。"
 nesnd_qe1_recovery.1.b:0 "先把新政推向各地。"
 nesnd_qe1_recovery.1.t:0 "重返故土"
 nesnd_qe1_recovery.1.d:0 "秦军重新控制了河西与关中的道路。故土的归属已经改变，朝廷却仍须决定如何使用这次胜利：以新军继续向东，还是先把新的官署、产业与共同身份扎根于各省。"
