 nesnd_qe1_commander_last:0 "梁"
 nesnd_qe1_fracture.1.a:0 "向朝廷效忠的军队，听候调遣。"
 nesnd_qe1_fracture.2.a:0 "帝国只剩下最后的疆土。"
 nesnd_qe1_fracture.1.t:0 "朝议之外"
 nesnd_qe1_fracture.1.d:0 "被排除在朝议之外的官员与军人已经集结成军。他们自称讨逆，宣告伊犁已被一派私党控制，要求以武力重新决定帝国的政务。朝廷内部的争执终于走出了官署。"
 nesnd_qe1_fracture.2.t:0 "西部帝国的崩解"
 nesnd_qe1_fracture.2.d:0 "地方官署已经改换旗帜。布哈拉、花剌子模与草原的旧名重新进入军令和税册，各地不再承认伊犁对人丁、土地与征赋的支配。朝廷保住的疆土之外，昔日帝国正在变成彼此争夺的新国家。"
