 nesnd_qe1_forecast_state:0 "\n下次月结：[ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_state').GetState.GetName]约 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_qe1_next_size')|D]#! 名[GetCulture('ce_xiyu').GetName]改称[ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_culture').GetCulture.GetName]，改信[ROOT.GetCountry.MakeScope.Var('nesnd_qe1_next_religion').GetReligion.GetName]。届时团结度须仍低于 #v 50#!。"
