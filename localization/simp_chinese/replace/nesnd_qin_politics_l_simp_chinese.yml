 nesnd_qe1_forecast_mid:0 "\n下次月结：不转化。团结度在 #v 50#! 到 #v 75#! 之间。"
 nesnd_qe1_unity_journal:0 "帝国的稳定"
 nesnd_qe1_unity_journal_reason:0 "商路、村社与军屯曾将许多不同来历的人联结在陈秦皇帝的治下。[GetCulture('ce_xiyu').GetName]在帝国扩张中形成，如今提供了国家很大一部分兵员与税源。年景好时，人们愿意以同一个身份自称。征役繁重、生计艰难时，他们又会想起旧日的族名、信仰和乡里。"
 nesnd_qe1_conversion_cohort:0 "西域汉羌"
 nesnd_qe1_identity.1.a:0 "地方已不再相信旧日的许诺。"
 nesnd_qe1_identity.1.t:0 "认同的衰退"
 nesnd_qe1_identity.1.d:0 "[SCOPE.sStateRegion('nesnd_qe1_declining_region').GetName]的村社与军屯正在重述自己的来历。旧时的族名、经文与乡里关系重新成为人们彼此信任的凭据。当地约半数[GetCulture('ce_xiyu').GetName]如今重新以[SCOPE.sCulture('nesnd_qe1_return_culture').GetName]自称，信奉[SCOPE.sReligion('nesnd_qe1_return_religion').GetName]。"
 nesnd_qe1_identity.1.f:0 "“我们的先人从河西来。先人的先人，从更西的地方来。”\n——西域村社里传诵的家谱"
