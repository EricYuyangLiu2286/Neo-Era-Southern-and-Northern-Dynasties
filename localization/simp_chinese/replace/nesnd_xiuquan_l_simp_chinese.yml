 nesnd_xiuquan.1.t:0 "追认圣徒"
 nesnd_xiuquan.1.d:0 "洪秀全最终死在了永无止尽的旅途中。在他临终时刻，这个可敬的人身边照例围着一群在恸哭着的病患。最忠实那批追随者把他葬在当地，在坟前立了一个木头十字架。没过几年，十字架换成了石头的。再过几年，坟边多了几间小屋，屋里常年住着往来朝拜的人。\n\n他生前没有写过书，也没有筹建过什么教堂。罗马派来的调查员只能循着他的足迹和传闻寻访。他们记下了几百份证词。一个吴军老兵说自己在山沟里躺了三天，是洪大夫循着一个“声音”找到了他。一个曾做过明军伙夫的老汉说，洪先生帮他取过胃里的子弹，后来连随军的江浙医官都不敢相信。还有一个村妇说，她儿子的高烧，是在洪大人祷告之后退的。调查员把这些证词带回了罗马。\n\n教廷最后宣布，洪秀全是天主教会的圣徒。\n\n消息传回来，各地的信众却都有自己的说法。两广的人说他是天主教的教士，沿江的人说他是景教的传人，还有人坚持他是洋人誓反宗、改革宗、福音会什么的派来的。几处供奉他的小屋里，挂着样式各不相同的十字架。哪一个是对的？他救过的人大概不在乎。"
 nesnd_xiuquan.1.f:0 "“我问他怎么知道沟里还有人。他说，是有人告诉他的。那条沟里除了我，只剩死人。”\n——一名吴军老兵在封圣调查中的证词"
 nesnd_xiuquan.1.a:0 "他救下的人，自会记得他。"
