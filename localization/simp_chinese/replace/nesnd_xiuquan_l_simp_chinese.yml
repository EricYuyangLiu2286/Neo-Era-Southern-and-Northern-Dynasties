l_simp_chinese:
 nesnd_xiuquan_journey:0 "教士秀全的旅途"
 nesnd_xiuquan_journey_concluded:0 "教士秀全的旅途"
 nesnd_xiuquan_journey_reason:0 "客家人洪秀全是天主教的教士，讲道却只用乡下土话。他身后跟着一群说不清来历的人：有病愈的、为众人搬运行李的佃户，有讲故事、知道老爷们在打什么的逃兵，有会在夜晚给大家补衣服的寡妇。\n\n人们传说，他能听见一个声音。那声音告诉他山谷的哪一条沟里还躺着人，林子的哪一棵树下还有人在喘气。他把这些人背出来，接上断骨，缝起肚肠，退了高烧。郎中们看过他的伤者，都说这样的伤本该治不好。\n\n这片土地上的人认识基督，多半是从西秦复兴景教的故事里听来的。于是有人说他传的是景教，有人说是洋人的新教，也有人干脆管他叫和尚。他自己不大争辩，只问哪里还有伤者。人们要到什么时候，才会弄清楚自己跟着的是谁？"
 nesnd_xiuquan_journey_ended:0 "洪秀全已经去世。"

 nesnd_xq_status_location:0 "洪秀全和追随者在#v [GetGlobalVariable('nesnd_xq_state').GetState.GetName]#!（[GetGlobalVariable('nesnd_xq_state').GetState.GetOwner.GetName]）。传教满100时，当地#v 0.1%#!人口改信一种基督教，传教进度归零。"
