l_simp_chinese:
 nesnd_hus_road_parent_choose:0 "特许承包、公开竞标与地方港路出资各有承办人。选定一项，便可查看工程州与验收条件。"
 nesnd_hus_road_parent_active:0 "工程州已定。所选工程的日志列明施工要求和连续达标月数。原拨款到期后可改选方案或另择地区。"
 nesnd_hus_road_reselect:0 "改选方案或工程州"
 nesnd_hus_road_reselect_desc:0 "这一期拨款已定。十二个月到期后，政府可以结束原方案，再按地方需要的工程发包。"
 nesnd_hus_road_reselect_tt:0 "结束现有工程方案，清除其经营月数。已付拨款不退，再次选择方案时重新定价。"
 nesnd_hus_road_missing_site:0 "本项工程所在的[concept_state]或开工记录已无法核实。拨款到期后可以改选工程地区。"
 nesnd_hus_road_site_tt:0 "工程州仍在本国治下并有居民。"
 nesnd_hus_road_peace_tt:0 "本国未在工程州所属战略区域交战。"
 nesnd_hus_road_credit_tt:0 "本国未处于债务违约状态。"
 nesnd_hus_road_access_tt:0 "工程州的[concept_market_access]至少为#v 80%#!。"
 nesnd_hus_road_link_tt:0 "[concept_state]内至少有#v 1级#!港口或铁路，雇用率达到#v 50%#!。"
 nesnd_hus_road_charter_capacity_tt:0 "$building_tooling_workshop$、$building_iron_mine$与$building_logging_camp$中，雇用率至少#v 75%#!且每周盈利的等级合计必须达到承包目标。"
 nesnd_hus_road_tender_capacity_tt:0 "[concept_state]内有至少#v 1级#!的铁路，雇用率至少为#v 50%#!。"
 nesnd_hus_road_local_capacity_tt:0 "[concept_state]内有至少#v 1级#!的港口或铁路，雇用率至少为#v 50%#!。"
 nesnd_hus_road_charter_project:0 "特许承包：厂场与货运"
 nesnd_hus_road_charter_project_chosen_tt:0 "已选择特许承包。"
 nesnd_hus_road_charter_project_reason:0 "东青行要把木材与铁料送到港口，靠承包商添置厂房还不够。工人必须进厂，货物必须有销路，运送原料的港路也要有人经营。承包目标是在开工等级上增加两成，向上取整，最少增两级、最多增八级。"
 nesnd_hus_road_charter_project_bar:0 "厂场稳定经营"
 nesnd_hus_road_charter_project_bar_desc:0 "$nesnd_hus_road_charter_project_bar$　#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#! 个月"
 nesnd_hus_road_charter_project_status:0 "承包方：[ROOT.GetCountry.GetCustom('nesnd_hus_road_signatory')]\n[ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_target').GetState.GetName]　厂场总等级：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_levels')|0]#!　开工：#v [ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_baseline').GetValue|0]#!　目标：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_goal')|0]#!　计入验收：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_operating_levels')|0]#!\n[concept_market_access]：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_market_access')|0%]#!　连续达标：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_months')|0] / 3#! 个月。"
 nesnd_hus_road_charter_project_conclusion: "[ROOT.GetCountry.GetCustom('nesnd_hus_road_signatory')]承办的工程已完。厂场开工、货路通行，连续三个月合于契约。[ROOT.GetCountry.GetCustom('nesnd_hus_road_site_receipt')]"
 nesnd_hus_road_tender_project:0 "公开竞标：铁路工程"
 nesnd_hus_road_tender_project_chosen_tt:0 "已选择公开竞标。"
 nesnd_hus_road_tender_project_reason:0 "投标商户要让内地市镇看见定期通行的列车。政府按实际雇工与经营情况验收，州内已经通车的铁路也可承办。"
 nesnd_hus_road_tender_project_bar:0 "铁路稳定经营"
 nesnd_hus_road_tender_project_bar_desc:0 "$nesnd_hus_road_tender_project_bar$　#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#! 个月"
 nesnd_hus_road_tender_project_status:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_target').GetState.GetName]　铁路总等级：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_levels')|0]#!　雇用率达五成的等级：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_staffed_rail_levels')|0] / 1#!\n[concept_market_access]：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_market_access')|0%]#!　连续达标：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_months')|0] / 3#! 个月。"
 nesnd_hus_road_tender_project_conclusion:0 "公开招标的铁路已连续三个月达到验收要求。"
 nesnd_hus_road_local_project:0 "地方出资：港口与支路"
 nesnd_hus_road_local_project_chosen_tt:0 "已选择地方港路出资。"
 nesnd_hus_road_local_project_reason:0 "沿岸商户和内地市镇筹款，各有自己的打算。有人要把码头办起来，有人要让铁路恢复班次。港口或铁路只要雇足人手、接通市场，便可承担本地的货运。"
 nesnd_hus_road_local_project_bar:0 "港路稳定经营"
 nesnd_hus_road_local_project_bar_desc:0 "$nesnd_hus_road_local_project_bar$　#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#! 个月"
 nesnd_hus_road_local_project_status:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_c2_hus_transport_target').GetState.GetName]　港口与铁路总等级：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_levels')|0]#!　雇用率达五成的等级：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_staffed_link_levels')|0] / 1#!\n[concept_market_access]：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_hus_road_market_access')|0%]#!　连续达标：#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_c2_hus_transport_months')|0] / 3#! 个月。"
 nesnd_hus_road_local_project_conclusion:0 "地方出资的港路已连续三个月达到验收要求。"
 nesnd_hus_road_executive: "[ROOT.GetCountry.MakeScope.Var('nesnd_road_contractor').GetCompany.GetName]（经理：[ROOT.GetCountry.MakeScope.Var('nesnd_road_contractor').GetCompany.GetExecutive.GetFullName]）"
 nesnd_hus_road_company: "[ROOT.GetCountry.MakeScope.Var('nesnd_road_contractor').GetCompany.GetName]"
 nesnd_hus_road_merchants: "本国承包商"
