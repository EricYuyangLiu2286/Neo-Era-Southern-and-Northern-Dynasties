l_simp_chinese:
 nesnd_polish_windows.1.a:0 "响应革命，准备行动。"
 nesnd_polish_windows.1.b:0 "维持中立。"
 nesnd_polish_windows.1.c:0 "向瓜分国提出镇压与补偿的交换。"
 nesnd_polish_windows.1.t:0 "欧洲的革命"
 nesnd_polish_windows.1.d:0 "欧洲的革命运动给[ROOT.GetCountry.GetName]带来了争取边界变更的机会。红党要求准备行动，白党仍希望用维持秩序的承诺换取列强的让步。"
 nesnd_polish_windows.2.a:0 "参加$nesnd_lobby_name_fra$一方的战争。"
 nesnd_polish_windows.2.b:0 "等待战后的谈判。"
 nesnd_polish_windows.2.t:0 "$nesnd_lobby_name_fra$与瓜分国交战"
 nesnd_polish_windows.2.d:0 "[SCOPE.sCountry('window_enemy').GetName]已经与[SCOPE.sCountry('window_france').GetName]交战。[ROOT.GetCountry.GetName]可以加入$nesnd_lobby_name_fra$一方，并要求把对方仍占有的一处华沙公国旧疆列入战争要求。没有这样的州时，参战只能争取战后的外交支持。"
 nesnd_polish_windows.3.a:0 "维持中立，向$nesnd_lobby_name_fra$要求补偿。"
 nesnd_polish_windows.3.b:0 "援助$nesnd_lobby_name_fra$的对手。"
 nesnd_polish_windows.3.t:0 "战争中的中立国"
 nesnd_polish_windows.3.d:0 "[SCOPE.sCountry('window_france').GetName]与[SCOPE.sCountry('window_enemy').GetName]的战争关系到1829年和议的边界。[ROOT.GetCountry.GetName]可以向$nesnd_lobby_name_fra$表示中立善意，或者援助另一方，以保住瓜分国对波兰问题的共同立场。"
 nesnd_polish_windows.4.a:0 "支付补偿，接受协助。"
 nesnd_polish_windows.4.b:0 "我们不会为此支付补偿。"
 nesnd_polish_windows.4.t:0 "镇压的条件"
 nesnd_polish_windows.4.d:0 "[SCOPE.sCountry('window_krakow').GetName]愿意劝止境内[GetCulture('polish').GetName]人的激进行动，换取财政补偿。接受提议将减少我国各州[GetCulture('polish').GetName]人口中的激进派，并由我国国库支付援助款。"
 nesnd_polish_windows.5.a:0 "向$nesnd_lobby_name_aus$请求保护。"
 nesnd_polish_windows.5.b:0 "拒绝接受新的保护国地位。"
 nesnd_polish_windows.5.t:0 "瓜分的危险"
 nesnd_polish_windows.5.d:0 "$nesnd_lobby_name_fra$已无暇维护波兰问题上的共识。列强对[ROOT.GetCountry.GetName]的安排可能再次改变，而我们尚未恢复所要求的疆域。向$nesnd_lobby_name_aus$请求保护，将把国家的存续寄托在另一位强邻身上。"
 nesnd_polish_windows.6.a:0 "与其他瓜分国一同施压。"
 nesnd_polish_windows.6.b:0 "维持1829年的安排。"
 nesnd_polish_windows.6.t:0 "重新安排波兰"
 nesnd_polish_windows.6.d:0 "[SCOPE.sCountry('window_krakow').GetName]拒绝接受新的保护国地位。[ROOT.GetCountry.GetName]可以施加外交压力，或者维持现有安排。共同施压将削弱波兰筹备战争的能力。"
 nesnd_polish_windows.7.a:0 "提交会议。"
 nesnd_polish_windows.7.t:0 "战后的波兰议程"
 nesnd_polish_windows.7.d:0 "$nesnd_lobby_name_fra$与瓜分国之间的战争已经结束。关于[ROOT.GetCountry.GetName]的议程将提交大陆会议，边界变更须由战败国让地。白和平只能重议担保，不能当作战胜国的割地要求。"
 nesnd_polish_windows.8.a:0 "继续筹备。"
 nesnd_polish_windows.8.t:0 "外交机会消退"
 nesnd_polish_windows.8.d:0 "此次外交机会已经过去，[ROOT.GetCountry.GetName]仍须继续准备，等待列强之间出现新的分歧。"
 nesnd_polish_windows.9.a:0 "重新评估我们的处境。"
 nesnd_polish_windows.9.t:0 "未能主持和会"
 nesnd_polish_windows.9.d:0 "这场战争没有留下足以由$nesnd_lobby_name_fra$主持波兰和会的条件。[ROOT.GetCountry.GetName]的领土要求仍未解决。"
 nesnd_polish_windows.11.a:0 "重申$nesnd_lobby_name_fra$的支持。"
 nesnd_polish_windows.11.b:0 "避免作出新的承诺。"
 nesnd_polish_windows.11.t:0 "波兰使团的请求"
 nesnd_polish_windows.11.d:0 "[SCOPE.sCountry('window_krakow').GetName]请求$nesnd_lobby_name_fra$再次公开支持恢复波兰的疆域。作出承诺会鼓励波兰政府，也会损害我们与瓜分国的关系。"
 nesnd_polish_windows.12.a:0 "批准军备援款。"
 nesnd_polish_windows.12.b:0 "保留这笔款项。"
 nesnd_polish_windows.12.t:0 "波兰的军备"
 nesnd_polish_windows.12.d:0 "[SCOPE.sCountry('window_krakow').GetName]希望$nesnd_lobby_name_fra$出资支持军备。款项能加快其备战，但须由我们的国库承担。"
 nesnd_polish_windows.13.a:0 "资助波兰的外交活动。"
 nesnd_polish_windows.13.b:0 "劝波兰政府暂缓提出要求。"
 nesnd_polish_windows.13.t:0 "和议与波兰的要求"
 nesnd_polish_windows.13.d:0 "波兰的领土要求使$nesnd_lobby_name_fra$面临选择。资助[SCOPE.sCountry('window_krakow').GetName]的外交活动有助于扩大我国影响，也将使1829年的边界争议延续下去。"
 nesnd_poland_partition_pressure:0 "瓜分国的压力"
 wg_nesnd_poland_restoration:0 "恢复波兰领土"
 wg_nesnd_poland_restoration_desc:0 "将目标州交给$nesnd_lobby_name_kra$。"
 wg_nesnd_poland_restoration_tooltip:0 "将目标州交给$nesnd_lobby_name_kra$。"
 nesnd_polish_windows.10.a:0 "支付补偿，改善关系。"
 nesnd_polish_windows.10.b:0 "拒绝支付。"
 nesnd_polish_windows.10.t:0 "中立的条件"
 nesnd_polish_windows.10.d:0 "[SCOPE.sCountry('window_neutral').GetName]提出，在当前战争中维持中立，以换取财政补偿。接受提议需要支付相当于对方两周固定收入的款项。"
 nesnd_polish_windows.3.c:0 "参加战争，要求波兰割地。"
 nesnd_poland_window_status_1: "欧洲的革命已波及波兰问题。议会须决定是否声援起义。"
 nesnd_poland_window_status_2: "东方战争爆发，巴黎与圣彼得堡已在战场上争夺东欧秩序的主导权。"
 nesnd_poland_window_status_3: "莱茵与易北河一带的战争使波兰边界再度成为交战国可以谈判的条件。"
 nesnd_poland_window_status_4: "停战之后，波兰的边界与独立保证将由大陆会议审议。"
 nesnd_poland_window_status_5: "巴黎已无力维持和议。克拉科夫可向维也纳请求保护，或承受瓜分国的压力。"
 nesnd_poland_window_map_tt: "本次危机涉及此地的归属。"
 nesnd_poland_window_preparation: "欧洲危机期间的备战"
 nesnd_poland_order_from_congress: "大陆会议所维系的秩序"
 nesnd_poland_veto_mandate_tt: "大陆会议否决了我国的提案，议会已授权发动一次起义。"
 war_goal_wg_nesnd_poland_restoration_type_name: "$wg_nesnd_poland_restoration$"
 war_goal_wg_nesnd_poland_restoration_type_desc: "$wg_nesnd_poland_restoration_desc$"
 war_goal_wg_nesnd_poland_restoration: "向波兰归还[WAR_GOAL_DRAFT.GetTargetState.GetName]"
 war_goal_wg_nesnd_poland_restoration_desc: "[WAR_GOAL_DRAFT.GetTarget.GetName]将[WAR_GOAL_DRAFT.GetTargetState.GetName]交还$nesnd_lobby_name_kra$。"
