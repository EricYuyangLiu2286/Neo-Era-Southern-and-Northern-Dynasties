 ce_cne_reform_limited_market_access_reason: "在过去的动荡岁月中，战争和社会革命带来的特殊繁荣时期导致了地方经济的野蛮生长。由此引发了国内市场的一系列动荡与内贸失调。是时候扭转这一局面了。"
 ce_cne_war_with_western_qin_reason: "盘踞在西域、河中地区的所谓“西秦”政权割据华夏疆土人民，并持续对我国西部省份与军民的袭扰渗透。他们的存在大大干扰了我们在西北地区的政治经济改革。这一敌对势力必须被消灭或者无害化。"
 ce_cne_war_with_usm_reason: "南方僭伪在开国帝牧仲棠时期就是帝国大敌。然而，其中如朱班博、林则徐、萧虎力、林汉涵等军事人才却阻截了我民族军队南征统一之大势。使我不得不与之维持暂时和平。然而，我中华毕竟是以统一之愿景众建为国。南北一日分裂，则国内疑虑动荡就一日不会止歇。"
 ce_cne_technology_advantage_reason: "在南征失败后，许多思想家对我国存在的意义开始了反思。其中不仅有许多前朝余孽怀念秦燕帝国，更有甚者声称开国帝所创立的各项制度都不如古人所想。如此反动思潮在共和愿景寂灭的今天，竟也能吸引许多信徒。为了彻底消灭这股反贼思潮，我们必须在思想领域大踏步地前进！"
 ce_cne_reform_legal_system_reason: "开国帝牧仲棠上承西秦大革命之伟业，下启民族帝国之雄图。为了国家的发展和国人的利益，帝国第一代宰相查万方、张百里以《众建大同四策》来阐释开国诸杰对帝国经济民生的规划。但仅有这些还不够。为了安定民心，战胜贫困，建立“意志自由之永恒帝国”，我们还必须持续不断地革新帝国政治的身体。把我们的努力和思想化为法律，刻入石头！"


