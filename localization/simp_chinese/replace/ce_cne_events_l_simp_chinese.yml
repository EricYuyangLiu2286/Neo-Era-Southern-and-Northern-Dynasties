 flavorCNE.11.t: "中国北朝宣布放弃君主制"
 flavorCNE.11.d: "自1818年牧仲棠任大汉共和邦周公（总统）兼国务总理以来，这个前西秦青年军官所建立的军事“训政”已经走过了遥远的路程。毫无疑问，这个以憧憬法国皇帝拿破仑为同学耻笑的年轻人已经永远改变了历史前进的道路。或者，在他兴起的东方世界的“大统一运动”的推动下，至少让历史的车轮在前进的路上大大偏转。\n\n与他同时代的人们或许永远也不会知道，牧仲棠散播的“神洲一国，普世汉土”究竟会带来怎样的明天。但他所建立的许多事业中尤其惹眼的一项——涵盖几乎整个中国北部的牧氏王朝，今天已然画上了句号。"
 flavorCNE.11.f: "失败反把失败者变得更崇高了，倒了的波拿巴仿佛比立着的拿破仑还要更高大些。\n——维克多·雨果"
 flavorCNE.11.1: "希望这一改变能把我们带向更遥远的时代。"
 
 flavorCNE.12.t: "牧仲棠逝世"
 flavorCNE.12.d: "1852年，中华帝国开国帝牧仲棠崩于汴梁城郊梦华别宫。享年七十岁。是为华太祖高皇帝。作为北明中国历史上最成功的军事家、政治家、战略家之一，牧仲棠建立了一套足以流传后世的民族主义理论体系。同时在实践中结合其理论，建立了涵括整个华北、东北、蒙古地区的庞大帝国。极大发展了东方的近代化工业革命，并在一定程度上继承并维护了19世纪初西秦大革命的遗产。\n\n在牧仲棠去世前，他预料到宫内诸子相争，而苏宏等亲贵元老亦将为乱。将幼妹牧沐子托付给南国公费西翼，并嘱咐幼妹一定尽量避免参与政治的斗争。"
 flavorCNE.12.f: "无念尔祖，聿修厥德。永言配命，自求多福。"
 flavorCNE.12.1: "扶保太子，屏退乱贼！"
 flavorCNE.12.2: "太子素来孱弱，为君岂能安国？二皇子牧驰声贤望也，可王中国。"
 
 flavorCNE.13.t: "诸子之乱"
 flavorCNE.13.d: "十月初牧仲棠驾崩后，其长皇子牧驰悯在东陪都青岛即皇帝位。随后他紧急赶回京师汴梁，会见了包括莒王牧驰声、太宰查万方、中都守华莱石等涉及继位事宜的重要官员。第二天，新皇便召集分镇四方的牧氏诸王回京吊丧。其真正意图不明。\n\n十一月十八日，牧朝五皇子牧驰武、六皇子牧驰光抵达当夜，牧驰悯突然心绞痛病发而死。死前并未选任继承人，仅留下两个尚无明辨是非之能的幼童。皇位空悬之下，牧朝诸子之乱爆发。"
 flavorCNE.13.f: "主少国疑，大臣未附，百姓不信，方是之时，属之于子乎？属之于我乎？\n——《史记·孙子吴起列传》"
 flavorCNE.13.1: "依国法，父子相继。我等当扶保太孙。"
 flavorCNE.13.2: "南方未定，西秦扰攘。当立长君！"
 
 flavorCNE.14.t: "沐子东渡"
 flavorCNE.14.d: "牧仲棠的小妹牧沐子比兄长年轻近二十岁。生性聪明，长而端庄，胸有忠志。在牧仲棠晚年独得宠爱，不仅地位高于后宫诸女，更常常代因为襄阳旧伤而腿脚不便的皇帝劳军料民。牧仲棠甚至派遣自己的京营大将费西翼往来护送。这位长公主因此拥有了很大的威望。而在牧仲棠去世后，她挺身而出维护国政稳定，实位列于扶龙功臣之列。\n\n然而，稳定后宫、安定军民，这样重要的角色由新君的姑姑担任，不由得让东方帝国的权臣勋旧们纷纷想起了太平公主的故事。加之汴梁城郊东苑的文官之间，难免有许多心存更共和的理想者对于这位亲民贵族抱有期待。因此，帝国枢密院的武勋故旧老臣们最终一致决定——以一种温和的方式将这位大人及其他不安定分子移出决策圈外。\n\n于是，在一心退休的帝国元勋大将费西翼“表率”下，一干曾经的京营老臣“护送”牧沐子往东洲国“旅行居住”。从此以后再未回到牧氏华朝。"
 flavorCNE.14.f: "少年离别意非轻，老去相逢亦怆情。草草杯盘共笑语，昏昏灯火话平生。自怜湖海三年隔，又作尘沙万里行。欲问后期何日是，寄书应见雁南征。\n——《示长安君》王安石"
 flavorCNE.14.1: "长公主殿下，非是侄儿无情，实在国事。"
 flavorCNE.14.2: "费元老实乃国之柱石，岂能擅离？"
 
 ce_novelist: "著名小说家"
 ce_novelist_desc: "该角色撰写的故事具有某种精神力量，已经成为全人类文化史上的一枚瑰宝。"
 bm_the_book: "《北明战国事》"
 
 flavorCNE.15.t: "《北明战国世》出版"
 flavorCNE.15.d: "《北明战国世》为北明世界中华大革命后，中华帝国太祖牧仲棠幼妹牧沐子中晚年所作小说，全书分为五大，十小卷，四百八十回，近二百万字。创作时间长达三十五年。本书中，牧沐子扬弃了章回体小说的格式和对王侯将相的刻板刻画，学习《水浒传》、《聊斋志异》和《西游记》等通俗故事的成功经验，从社会历史的各个阶层、各个人群中塑造人物。用类似近代历史小说的手法了从1408年北明永乐帝暴崩于田猎，直至1835年南北两朝签订《扬州条约》划江而治以来，中华大地四百余年的历史。由于本书“承历史之厚重，化小说之灵性”、“既讲述了中国人的英雄气概和成就，又总得使我们晓得旧时代的苦难”、“是任何希望真正了解亚洲现代性成因的必读作”。后世将本书评为“中国五大名著”之一，也是人类历史上最长的小说作品之一。"
 flavorCNE.15.f: "燕明倾颓日月尽，诸候作乐春秋吟，霸主分国东风紧，逐鹿大将堆骸骨，襄阳梦华花落屏。\n——《北明战国事》开篇词"
 flavorCNE.15.1: "“带来人世间的苦难和幸运，莫大于历史。其次，则是对它的反抗。”"

