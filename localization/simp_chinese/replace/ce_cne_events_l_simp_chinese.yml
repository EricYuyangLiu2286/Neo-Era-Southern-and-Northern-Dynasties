 flavorCNE.4.t: "“万民书”"
 flavorCNE.4.d: "地权革命是经济上的革新，同样也是一项冷酷的政治运动。它要将一整个旧社会窃夺数千年的利益，转移到诞生不过数十年的新贵手中。这一过程不仅仅是金钱赎买就能结束的，必然存在法律机关的追捕、诓骗、来回的争夺、执行者的背叛，甚至是残酷的暴力手段。\n\n这样的过程不仅仅会激怒那些地方乡绅，也会吓到仍处懵懂中的社会中层成员。后者由此就容易被前者纠集，化为前者的马前卒、排头兵了。"
 flavorCNE.4.f: "天杀尤无奈，地卷不能逃。岁末小积蓄，官人何忍收？"
 flavorCNE.4.1: "胡言乱语，正不必忧心。"
 flavorCNE.4.2: "风头正盛，需暂避锋芒。"

 CNE_land_related_uprising: "地权纠纷"

 flavorCNE.5.t: "飞舞的雪片"
 flavorCNE.5.d: "军人自己也有生活，也有家庭。他们许多人都是曾经被寄予厚望的宗族子弟。也有少部分是被宗族抛弃而来的破落户，希望藉军旅生活改变面貌和命运。后者在运动中过于积极，而前者则大多成了我们运动的绊脚石。\n\n最近就有关于基层军官与士绅串联勾结的消息。他们大多是收到了家乡的来信，发现自己族人拥有的土地被政府划为非法，或是强要赎买的。他们组织起来，按照军人的典范、效率做了些事。当地政局一时动荡，在地方上造成了非常坏的影响。"
 flavorCNE.5.f: ""
 flavorCNE.5.1: "是时候加饷了。"
 flavorCNE.5.2: "彼等有何能耐？翻天了不成？"

