 flavorCNE.2.t: "土地改革失道"
 flavorCNE.2.d: "随着时间的推移和政治局势的变动，由开国帝牧仲棠发起的帝权革命已不能再被推进。我们不得不承认国内土地产权的现状。所有原先与此有关的政策、法令将在未来的几个月中遭受一次审核。对政府和经济工作其他方面有益的将被保留，未通过的那些则必须被迅速且果断地取缔。以避免国家的进一步动荡。"
 flavorCNE.2.f: "民众之利益构建帝国，无能维护者虽强亦亡。 \n——牧仲棠《巡海河谕臣十句》"
 flavorCNE.2.1: "我们承认失败，维持现状。"

 flavorCNE.3.t: "地权革命胜利"
 flavorCNE.3.d: "我们完善的土地法案、雇工法案、民法家庭相关条文已被推行至帝国的每一个角落，建起来一个崭新的经济秩序。在这一秩序中，我们解放了被血亲家族束缚了数千年的人们。高高的田垄回归了它自然资源的本来面目。\n\n随着旧宗族和土地不再能锁住农民，无数稚嫩、满是灰土却充满朝气的脸孔源源不断地从郊野涌入城市。他们憧憬新的生活。一种用人类的智慧和科学力量构建的生活。许多血缘的余孽用各种各样的地方团体伪装自己，试图重新夺回对这些人的控制。但巡捕的警棍和判官的惊堂木终会粉碎他们的野心。\n\n我们又一次将开国帝牧仲棠的理想照进现实。我们证明了这个帝国是为了华夏民族之利益而构建。为此，它将保护哪怕最细小无助者自由选择自己命运的权力——他们如今在城市中追求幸福，给帝国带来新的繁荣。"
 flavorCNE.3.f: "各尽所能，自由意志。国抒民愿，众建帝国。 \n——查万方《众人授权为帝命疏》"
 flavorCNE.3.1: "人类的力量为改变其命运而抒发，是至上的财富之源。"
 
