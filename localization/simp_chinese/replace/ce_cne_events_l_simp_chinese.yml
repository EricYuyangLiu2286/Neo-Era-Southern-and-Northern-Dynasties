 ce_cne_land_draft_failing_reason: "掌握权力的中华帝国统治集团是以牧氏家族为核心的武勋贵族集团，以及围绕着他们成长起来的一批新派士绅。他们对摧毁了华北秦燕帝国的西秦大革命记忆犹新，因此在一定程度上愿意对社会下层让利以自保。然而，随着时间的推移与势力内部的斗争，理智和恐惧会同时衰退。他们也将不可避免地走到某些进步政策的对立面去......"
