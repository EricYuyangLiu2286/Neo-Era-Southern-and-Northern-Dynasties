 flavorCNE.1.t: "推动地权革命"
 flavorCNE.1.d: "中华帝国的统治集团起源于那场距今不过二十年的大革命时代。他们目睹了北明藩阀世家在那场宏大的运动中碾为尘埃。在此之上，以牧仲棠为首的新军官团体为民请命，排除腐败浊流和激进派的恐怖统治。最终建立了这一建立在“平均地权，共和治理”的伟大帝国。\n\n一切本该如此......\n\n1819年，伴随着开国皇帝牧仲棠及诸武勋功臣对全华北的土地清理的完成，帝国在平民的欢呼声中代共和而立。但欢呼备至的改革远非圆满，辽东、西北地主就因为他们与军队的密切联络未遭处理。1820-22年南征的失败而导致的战债暴跌更将无数小民家庭推入深渊。当此危难时刻，开国帝果断重唱“地权革命”之口号。以整理土地带来的巨大利润和人口流动为基础，夯实了摇摇欲坠的帝国经济。然而，随着和平的持续和工作的深入，一股暗流在阴影中聚集。军队中的既得利益者、富商、官员，甚至是那些被剥夺过剩土地而失势的旧士绅卷土重来。他们的阴谋、不满情绪和欲望如致命酸液，缓慢腐蚀着帝国伟业的基石......"
 flavorCNE.1.f: "政治就像修桌子...一只脚长了要削，一只脚短了要补。 \n——本杰明·富兰克林"
 flavorCNE.1.1: "民众之利益构建帝国，无能维护者虽强亦亡。"

 ce_cne_land_reform: "地权革命"
