l_simp_chinese:
 nesnd_usm_western_provinces:0 "西部置省"
 nesnd_usm_western_provinces_reason:0 "吴军已经进入西部，反吴复明的旧部并没有随败军一同消失。成都、襄阳与桂北仍有人怀念旧主，地方士人也不愿轻易承认杭州的新朝。城池已经攻下，朝廷还要让三地接受布政司与礼议院的管辖。\n\n朝廷必须在#v 1850年以前#!将三地变为[concept_incorporated_state]。"
 nesnd_usm_western_provinces_status:0 "反吴复明的旧部仍在地方活动。[concept_sol]下降会进一步激化民怨。"
 nesnd_usm_ming_resistance:0 "反吴复明运动"
 nesnd_usm_western_before_1850:0 "尚未到#v 1850年#!。"
 nesnd_usm_western_deadline:0 "已到#v 1850年#!，三地尚未在期限内整合。"
 nesnd_usm_western_failure_tt:0 "本国的#v [GetCulture('ce_chu').GetName]、[GetCulture('ce_xinan').GetName]、[GetCulture('hakka').GetName]与[GetCulture('yue').GetName]#!文化人口中，各有#n 25%#!转为[Concept('concept_radical','$concept_radicals|q$')]。"
 nesnd_western_provinces.1.t:0 "西府余愤"
 nesnd_western_provinces.1.d:0 "朝廷给西部置省留下的期限已经过去，三地却未能如期接受新朝的统治。流亡旧臣把拖延视为吴朝无力服众的证据，各地失意的士人也开始附和。荆楚、西南、客家与粤地的怨言汇在一起，反吴复明已不只是败军将领的私愿。"
 nesnd_western_provinces.1.f:0 "“置省期限已过，三地不服新朝。吴朝无力服众，于此可见。”\n——流亡旧臣的檄文"
 nesnd_western_provinces.1.a:0 "这场争执还没有过去。"
