 nesnd_india_treaty_renewed:0 "旧约续订"
 nesnd_india_treaty_renewed_overlord:0 "印度旧约续订"
 nesnd_india_treaty_void:0 "废约明志"
 nesnd_mug.30.t:0 "旧约的继承"
 nesnd_mug.30.d:0 "[ROOT.GetCountry.GetName]与[SCOPE.sCountry('mug_dispute_subject').GetName]订立朝贡与产业旧约，已是多年以前的事。对方近年推行改革，同各邦的往来也多了起来，[ROOT.GetCountry.GetName]国内有人要求重新审查旧约是否仍然有效。"
 nesnd_mug.30.f:0 "“关于印度属国旧约之延续效力，外交部谨请政府核定是否照会重议。”\n——外交委员会呈文"
 nesnd_mug.30.a:0 "正式质疑旧约的效力"
 nesnd_mug.30.a_tt:0 "[ROOT.GetCountry.GetName]与[SCOPE.sCountry('mug_dispute_subject').GetName]就旧约展开谈判，「$nesnd_india_treaty_dispute$」[concept_journal_entry]开启，谈判进度自 #v 50#! 起算。"
 nesnd_mug.30.b:0 "暂不追究此事"
 nesnd_mug.30.b_tt:0 "十年之内不会再次出现旧约继承之争。"
 nesnd_mug.31.t:0 "旧约续订"
 nesnd_mug.31.d_subject:0 "经过多轮往复折冲，[ROOT.GetCountry.GetName]与[SCOPE.sCountry('india_dispute_lord').GetName]终就旧约条款达成妥协。新的确认照会已经交换，朝贡与产业安排继续施行，两国之间的紧张气氛暂时平息下来。"
 nesnd_mug.31.d_overlord:0 "[ROOT.GetCountry.GetName]与[SCOPE.sCountry('india_dispute_subject').GetName]就旧约的继承与细节达成协议。双方互换确认文书，我国在印度北部的既有特权得到重申，双边往来重回正轨。"
 nesnd_mug.31.f:0 "“兹确认前约各项条款继续有效，双方各守成规。”\n——续约照会正文"
 nesnd_mug.31.a:0 "照会归档"
 nesnd_mug.31.a_subject_tt:0 "两国关系改善，本国获得永久[concept_legitimacy]加成，「$nesnd_mug_france$」照常维持。"
 nesnd_mug.31.a_overlord_tt:0 "两国关系改善，本国获得永久[concept_influence]加成，二十年内不再重起旧约之争。"
 nesnd_mug.31_outcome_tt:0 "双方各自收到事件「$nesnd_mug.31.t$」，确认续订旧约并交换正式照会。"
 nesnd_mug.32.t:0 "旧约作废"
 nesnd_mug.32.d_subject:0 "交涉最终无果而终，[ROOT.GetCountry.GetName]宣布不再承认与[SCOPE.sCountry('india_dispute_lord').GetName]之间历年沿袭的旧约条款。消息传开后，城中舆论群情激昂，各邦亦在观望宗主国下一步的动向。"
 nesnd_mug.32.d_overlord:0 "谈判彻底破裂，[SCOPE.sCountry('india_dispute_subject').GetName]拒绝承认旧约的约束力。[ROOT.GetCountry.GetName]已正式宣告对方毁约。"
 nesnd_mug.32.f:0 "“旧约既已为对方所背弃，本国亦不再受其任何条款约束。”\n——断交与废约声明"
 nesnd_mug.32.a:0 "静观其变"
 nesnd_mug.32.a_subject_tt:0 "废约在朝野激起声望与民族情绪，本国在十年内获得[concept_legitimacy]与[concept_fervor]提升。"
 nesnd_mug.32.a_overlord_tt:0 "我国已取得对方首都州的[concept_claim]并产生负面[concept_diplomatic_catalyst]，后续交锋由外交与战事决定。"
 nesnd_mug.32_outcome_tt:0 "双方各自收到事件「$nesnd_mug.32.t$」。附属一方获得十年[concept_legitimacy]加成与主体文化的[concept_fervor]提升，正在谋求独立的，两项进度各推进 10 点。宗主一方取得对方首都州的[concept_claim]，并生成负面[concept_diplomatic_catalyst]。"
