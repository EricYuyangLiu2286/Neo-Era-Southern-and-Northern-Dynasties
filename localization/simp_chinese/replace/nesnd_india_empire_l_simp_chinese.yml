 nesnd_mug.12.d_defence:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]邀请我国出席王公会议，商议共同防务。出席的土邦与[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]同享会议的约定，不出席的不受约束。"
 nesnd_mug.12.f:0 "“本国政府邀请贵邦派代表出席会议，商议各邦共同关心的事务。”\n——[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]政府致各土邦的邀请函"
 nesnd_mug.12.a:0 "出席"
 nesnd_mug_attend_rail_tt:0 "我国出席。会议结算时，我国得「$nesnd_mug_council_rail$」十年：[concept_infrastructure] #g +2#!，地区建造力效率 #g +5%#!。"
 nesnd_mug_attend_relief_tt:0 "我国出席。会议结算时，我国得「$nesnd_mug_council_relief$」十年：[GetHarvestConditionType('drought').GetName]和[GetHarvestConditionType('flood').GetName]的影响 #g −20%#!。"
 nesnd_mug_attend_defence_tt:0 "我国出席。会议结算时，我国与[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]订立[concept_defensive_pact]，[concept_binding_period]五年。条约订不成时，这一项落空。"
