 nesnd_mug.13.d_defence_unsigned:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! 个土邦出席，#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! 个婉拒或没有答复。我国与出席的各邦订立[concept_defensive_pact]，其中 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_unsigned_value')|0]#! 份没能订立。"
 nesnd_mug.13.d_defence:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! 个土邦出席，#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! 个婉拒或没有答复。我国与出席的各邦都订立了[concept_defensive_pact]。"
 nesnd_mug.13.f:0 "“王公会议已经闭会。”\n——[ROOT.GetCountry.GetName]政府公告"
 nesnd_mug_council_none_tt:0 "没有修正，也没有条约。"
