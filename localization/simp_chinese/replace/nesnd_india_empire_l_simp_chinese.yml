 nesnd_mug.30.t:0 "旧约之争"
 nesnd_mug.30.d:0 "[SCOPE.sCountry('mug_dispute_subject').GetName]近年来日渐强盛，对方政府里有人公开质疑，当年与我国订立的旧约是否还约束得了今天的帝国。我们可以与对方重议旧约，也可以暂且不提。"
 nesnd_mug.30.f:0 "“旧约订立之时，彼此情形与今日大不相同。”\n——外交部的备忘录"
 nesnd_mug.30.a:0 "重议旧约"
 nesnd_mug.30.a_tt:0 "开启「$nesnd_india_treaty_dispute$」。"
 nesnd_mug.30.b:0 "暂且不提"
 nesnd_mug.30.b_tt:0 "十年之内不再提起此事。"
 nesnd_mug.31.t:0 "旧约重订"
 nesnd_mug.31.d_subject:0 "我们与宗主国重新订立了旧约。国内的不满暂时平息，两国的使节在新约上签了字。"
 nesnd_mug.31.d_overlord:0 "我们与附属的帝国重新订立了旧约，对方重新确认了宗属关系。"
 nesnd_mug.31.f:0 "“双方重申旧约各款继续有效。”\n——新约的前言"
 nesnd_mug.31.a:0 "签字"
 nesnd_mug.31.a_subject_tt:0 "二十年之内不再重议旧约。"
 nesnd_mug.31.a_overlord_tt:0 "二十年之内不再重议旧约。"
 nesnd_mug.31_outcome_tt:0 "两国重订旧约。"
 nesnd_mug.32.t:0 "旧约作废"
 nesnd_mug.32.d_subject:0 "谈判破裂，我们宣布不再受旧约约束。宗主国随即对我们的首都提出了宣称。"
 nesnd_mug.32.d_overlord:0 "谈判破裂，附属的帝国宣布不再受旧约约束。我们对其首都所在的州提出了宣称。"
 nesnd_mug.32.f:0 "“旧约各款，本国概不承认。”\n——帝国的照会"
 nesnd_mug.32.a:0 "知道了"
 nesnd_mug.32.a_subject_tt:0 "十年之内不再重议旧约。"
 nesnd_mug.32.a_overlord_tt:0 "十年之内不再重议旧约。"
 nesnd_mug.32_outcome_tt:0 "旧约作废。"
