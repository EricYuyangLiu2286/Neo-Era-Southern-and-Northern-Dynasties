 nesnd_india_order_tax_desc:0 "决定[Concept('concept_subject', '$concept_subjects|q$')]向我国上缴多少收入。"
 nesnd_india_order_tax_central_tt:0 "我国本国直辖的州[concept_tax_capacity] +5%。我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$raise_payments$」[concept_diplomatic_pact]：对方上缴的收入增加，每周的[concept_liberty_desire]上升，每份占用我国 25 点[concept_influence]。[concept_protectorate]、[concept_personal_union]、不向我国上缴收入的附属国，以及陷入[concept_default]或[concept_liberty_desire]达到 75 的附属国无法签署，这一项落空。"
 nesnd_india_order_switch_tt:0 "「$nesnd_india_order$」为这件事原先的选择订立的[concept_diplomatic_pact]和所加的修正先行撤销。暂时无法撤销的条约每月再撤销一次，撤销以前不为这个[concept_subject]国订立新的条约。此后 60 个月内不能再改选。之后加入的附属国在每月结算时补上。"
 nesnd_india_order_tax_local_tt:0 "我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$decrease_payments$」[concept_diplomatic_pact]：对方上缴的收入减少，每周的[concept_liberty_desire]下降。[concept_protectorate]、[concept_personal_union]和不向我国上缴收入的附属国无法签署，这一项落空。我国本国不加修正。"
 nesnd_india_order_army_desc:0 "决定[Concept('concept_subject', '$concept_subjects|q$')]是否随我国参加[Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')]和战争。"
 nesnd_india_order_army_central_tt:0 "我国每有一个[concept_subject]，[concept_authority] +10。在$region_north_india$、$region_south_india$的每个[concept_subject]每周的[concept_liberty_desire]上升。附属国的类型不变。"
 nesnd_india_order_army_local_tt:0 "我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$exempt_from_service$」[concept_diplomatic_pact]：对方不必随我国参加[Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')]和战争，每周的[concept_liberty_desire]下降。[concept_tributary]和[concept_protectorate]本来就不随[concept_overlord]参战，无法签署，这一项落空。我国本国不加修正。"
 nesnd_india_order_school_desc:0 "决定学校和官职的资格由谁来定。"
 nesnd_india_order_school_central_tt:0 "我国本国直辖的州[concept_pop_qualifications] +5%。我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$da_knowledge_sharing$」[concept_diplomatic_pact]：我国的[concept_technology_spread]变慢，对方的变快，对方每周的[concept_liberty_desire]下降，每份占用我国 50 点[concept_influence]。我国已研究的科技不多于对方时无法签署，这一项落空。"
 nesnd_india_order_school_local_tt:0 "在$region_north_india$、$region_south_india$的每个[concept_subject]的[concept_pop_qualifications] +5%，每周的[concept_liberty_desire]下降。我国本国不加修正。"
