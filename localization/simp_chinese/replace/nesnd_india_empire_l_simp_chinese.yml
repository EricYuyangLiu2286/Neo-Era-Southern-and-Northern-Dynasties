 # Old treaty dispute (India batch 15)
 nesnd_india_treaty_dispute:0 "旧约争议"
 nesnd_india_treaty_dispute_reason:0 "[GetGlobalVariable('nesnd_india_dispute_g_lord').GetCountry.GetName]对两国之间的旧约提出了质疑。按照旧约，我们是对方的附属国，按时纳贡。改革以来，我们的政府越来越不愿意把这份约定当作理所当然，宗主国的大臣们则担心，再这样下去，旧约迟早只剩一纸空文。双方都派出了使节，谈判在两国之间来回进行。"
 nesnd_india_treaty_dispute_overlord_reason:0 "[GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName]近年来日渐强盛，对方政府里有人公开质疑当年订立的旧约。我们要让对方重新确认这份约定。双方都派出了使节，谈判在两国之间来回进行。"
 nesnd_india_treaty_dispute_bar:0 "旧约谈判"
 nesnd_india_treaty_dispute_bar_void_desc:0 "废约"
 nesnd_india_treaty_dispute_bar_renew_desc:0 "续约"
 nesnd_india_dispute_rel_good_prog:0 "两国关系良好"
 nesnd_india_dispute_rel_bad_prog:0 "两国关系恶劣"
 nesnd_india_dispute_can_pay_tt:0 "我们付得起这笔钱，且没有[concept_default]或[concept_bankruptcy]"
 nesnd_india_dispute_petition_button:0 "遣使陈情"
 nesnd_india_dispute_petition_button_desc:0 "派使节到宗主国说明我们的处境，请求在旧约的框架内解决分歧。"
 nesnd_india_dispute_petition_wait_tt:0 "一年内没有遣使陈情"
 nesnd_india_dispute_petition_effect_tt:0 "$nesnd_india_treaty_dispute_bar$向续约一侧 #v +10#!。一年之内不能再遣使。"
 nesnd_india_dispute_withhold_button:0 "拖欠贡金"
 nesnd_india_dispute_withhold_button_desc:0 "停缴今年的贡金，让宗主国明白旧约不再是理所当然。"
 nesnd_india_dispute_withhold_wait_tt:0 "一年内没有拖欠过贡金"
 nesnd_india_dispute_withhold_effect_tt:0 "$nesnd_india_treaty_dispute_bar$向废约一侧 #v 15#!，本国[Concept('concept_primary_cultures','$concept_primary_culture$')]的[concept_fervor]目标在五年内提高。一年之内不能再这样做。"
 nesnd_india_dispute_reaffirm_button:0 "重申旧约"
 nesnd_india_dispute_reaffirm_button_desc:0 "照会对方，旧约的每一条都仍然有效。"
 nesnd_india_dispute_reaffirm_wait_tt:0 "一年内没有重申过旧约"
 nesnd_india_dispute_reaffirm_effect_tt:0 "$nesnd_india_treaty_dispute_bar$向废约一侧 #v 10#!，与对方的[concept_relations] #r -10#!。一年之内不能再重申。"
 nesnd_india_dispute_concede_button:0 "修订条款"
 nesnd_india_dispute_concede_button_desc:0 "出钱让步，修订旧约中对方最不满的条款。"
 nesnd_india_dispute_concede_wait_tt:0 "一年内没有修订过条款"
 nesnd_india_dispute_concede_effect_tt:0 "$nesnd_india_treaty_dispute_bar$向续约一侧 #v +10#!，与对方的[concept_relations] #g +10#!。一年之内不能再修订。"
 nesnd_india_dispute_renew_trigger_tt:0 "$nesnd_india_treaty_dispute_bar$到达续约一端"
 nesnd_india_dispute_void_trigger_tt:0 "$nesnd_india_treaty_dispute_bar$到达废约一端"
