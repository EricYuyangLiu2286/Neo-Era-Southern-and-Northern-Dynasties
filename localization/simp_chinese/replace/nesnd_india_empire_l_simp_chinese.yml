 nesnd_mug.22.t:0 "农田受灾"
 nesnd_mug.22.d:0 "我国有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州遭遇[concept_harvest_condition]，农田减产。我国可以自己拨款赈济，也可以请[SCOPE.sCountry('mug_famine_mughal').GetName]援助。如果我国是别国的附属国，还可以请[concept_overlord]援助。"
 nesnd_mug.22.d_alone:0 "我国有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州遭遇[concept_harvest_condition]，农田减产。我国可以自己拨款赈济。如果我国是别国的附属国，还可以请[concept_overlord]援助。"
 nesnd_mug.22.f:0 "“本州农田减产，请速拨款赈济。”\n——受灾各州呈[ROOT.GetCountry.GetName]政府的灾情报告"
 nesnd_mug.22.a:0 "自己赈济"
 nesnd_mug.22.b:0 "请[SCOPE.sCountry('mug_famine_mughal').GetName]援助"
 nesnd_mug_ask_mughal_tt:0 "我国请[SCOPE.sCountry('mug_famine_mughal').GetName]拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|0]。对方同意后，受灾的州各得「$nesnd_mug_famine_relief$」十二个月，两国[concept_relations] #g +25#!。"
 nesnd_mug_aid_wait_tt:0 "对方有三十日答复。不同意或不答复时，我国还可以自己赈济。"
 nesnd_mug.22.c:0 "请[concept_overlord]援助"
 nesnd_mug_ask_overlord_tt:0 "我国请[ROOT.GetCountry.GetOverlord.GetName]拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|0]。对方同意后，受灾的州各得「$nesnd_mug_famine_relief$」十二个月，两国[concept_relations] #g +25#!。附属关系和[concept_liberty_desire]都不变。"
 nesnd_mug.22.e:0 "不赈济"
 nesnd_mug.23.t:0 "赈济款到位"
 nesnd_mug.23.d_mughal:0 "[SCOPE.sCountry('india_matter_to').GetName]同意援助，拨款赈济我国受灾的州。这些州的灾情因此减轻，两国[concept_relations]也有改善。"
 nesnd_mug.23.d_overlord:0 "[SCOPE.sCountry('india_matter_to').GetName]同意援助，拨款赈济我国受灾的州。这些州的灾情因此减轻，两国[concept_relations]也有改善。我国的附属关系不因此改变。"
