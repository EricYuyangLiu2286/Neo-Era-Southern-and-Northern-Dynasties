 nesnd_india_indep.4.d:0 "宗主国察觉了我们的秘密行动，却只是记录在案，没有追究。"
 nesnd_india_indep.4.f:0 "“此事已存档备查。”\n——宗主国的批示"
 nesnd_india_indep.4.result:0 "这次没有损失。"
 nesnd_india_indep.5.t:0 "选择对象"
 nesnd_india_indep.5.d_conciliate:0 "几个附属国的效忠派都需要钱。我们只能先扶植其中一个。"
 nesnd_india_indep.5.d_coerce:0 "几个附属国都在谋求独立。我们先向其中哪一个施压？"
 nesnd_india_indep.5.f:0 "“请就以下附属国择一施行。”\n——帝国政府的备忘录"
 nesnd_india_indep.6.t:0 "宗主国的怀柔"
 nesnd_india_indep.6.d:0 "宗主国出钱扶植了我们国内的效忠派。"
 nesnd_india_indep.6.f:0 "“效忠者自有其报。”\n——宗主国使节的讲话"
 nesnd_india_indep.6.result:0 "本国的$lobby_pro_overlord$得到宗主国的支持。"
 nesnd_india_indep.7.t:0 "宗主国的威压"
 nesnd_india_indep.7.d:0 "宗主国向我们施压，囤积的军械被收缴一空，为独立所做的准备也付诸东流。"
 nesnd_india_indep.7.f:0 "“如再有违约之举，后果自负。”\n——宗主国的照会"
 nesnd_india_indep.7.result:0 "$nesnd_india_indep_economy_bar$和$nesnd_india_indep_military_bar$各 -50，囤积的军械全部收缴，与宗主国的[concept_relations] -30。"
 nesnd_india_indep_support_regime_terms:0 "我们与对方签订$da_support_regime$协定。"
 nesnd_india_indep.5.d_support_regime:0 "几个附属国的政府都摇摇欲坠。我们先扶持其中哪一个？"
 nesnd_india_indep.10.t:0 "宗主国的扶持"
 nesnd_india_indep.10.d:0 "宗主国与我们的政府签订了$da_support_regime$协定，准备在政府站不稳时出手相助。"
 nesnd_india_indep.10.f:0 "“贵国政府的安定，即是本国的关切。”\n——宗主国的照会"
 nesnd_india_indep.10.result:0 "宗主国与本国签订$da_support_regime$协定。"
 nesnd_india_indep.11.t:0 "怀柔之策"
 nesnd_india_indep.11.d:0 "对付心怀二意的附属国，未必要动刀兵。可以出钱扶植当地的效忠派，让他们在议事时替我们说话，也可以与当地政府订约，在政府站不稳时出手扶持。"
 nesnd_india_indep.11.f:0 "“与其防其叛，不如使其不愿叛。”\n——帝国政府的备忘录"
 nesnd_india_indep.11.a:0 "扶植效忠派"
 nesnd_india_indep.11.b:0 "扶持其政府"
