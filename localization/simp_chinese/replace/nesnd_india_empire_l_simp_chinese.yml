 nesnd_mug_council_no_free_prince_tt:0 "印度已经没有独立的土邦，也没有归属别国的土邦"
 nesnd_mug_council_complete_conclusion:0 "印度诸邦都已归入帝国，王公会议成了帝国自己的议事机构。"
 nesnd_mug.14.t:0 "会议成为定制"
 nesnd_mug.14.d:0 "铁路、赈灾和防务三项都已在王公会议上议定过。各邦已经习惯了每隔十年到帝国的都城议事，会议有了自己的章程，不再只是皇帝一时的召集。"
 nesnd_mug.14.f:0 "“本会议每十年召集一次，诸邦王公皆得与会。”\n——王公会议章程"
 nesnd_mug.14.a:0 "定为常制"
