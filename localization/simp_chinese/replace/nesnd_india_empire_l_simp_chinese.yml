 nesnd_india_order:0 "中央与各邦"
 nesnd_india_order_reason_0_0_0:0 "[ROOT.GetCountry.GetName]的[Concept('concept_subject', '$concept_subjects|q$')]里已有$region_north_india$、$region_south_india$的国家。它们与我国之间，税由谁收，军队由谁指挥、外交由谁办理，学校由谁兴办、官员由谁任命，至今没有定规。每一件都可以收归中央，也可以留给各邦。\n\n税收：尚未选定。\n军务与外交：尚未选定。\n学务与公职：尚未选定。"
