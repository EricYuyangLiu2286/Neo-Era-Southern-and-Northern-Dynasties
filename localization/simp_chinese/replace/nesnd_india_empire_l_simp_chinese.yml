 nesnd_india_order_tax_desc:0 "决定[Concept('concept_subject', '$concept_subjects|q$')]向我国上缴多少收入。"
 nesnd_india_order_tax_central_tt:0 "我国本国直辖的州[concept_tax_capacity] +5%。我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$raise_payments$」[concept_diplomatic_pact]：对方上缴的收入增加，每周的[concept_liberty_desire]上升，每份占用我国 25 点[concept_influence]。[concept_protectorate]、陷入[concept_default]或[concept_liberty_desire]达到 75 的附属国签不了，这一项落空。"
 nesnd_india_order_switch_tt:0 "这件事上「中央与各邦」为另一端订立的[concept_diplomatic_pact]和加的修正先撤掉。此后 60 个月内不能再改选。之后加入的附属国在每月结算时补上。"
 nesnd_india_order_tax_local_tt:0 "我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$decrease_payments$」[concept_diplomatic_pact]：对方上缴的收入减少，每周的[concept_liberty_desire]下降。[concept_protectorate]签不了，这一项落空。我国本国不加修正。"
 nesnd_india_order_army_desc:0 "决定[Concept('concept_subject', '$concept_subjects|q$')]是否随我国参加[Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')]和战争。"
 nesnd_india_order_army_central_tt:0 "我国每有一个[concept_subject]，[concept_authority] +10。在$region_north_india$、$region_south_india$的每个[concept_subject]每周的[concept_liberty_desire]上升。附属国的类型不变。"
 nesnd_india_order_army_local_tt:0 "我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$exempt_from_service$」[concept_diplomatic_pact]：对方不必随我国参加[Concept('concept_diplomatic_play', '$concept_diplomatic_plays|q$')]和战争，每周的[concept_liberty_desire]下降。[concept_tributary]和[concept_protectorate]本来就不随宗主国参战，签不了，这一项落空。我国本国不加修正。"
 nesnd_india_order_school_desc:0 "决定学校和官职的资格由谁来定。"
 nesnd_india_order_school_central_tt:0 "我国本国直辖的州[concept_pop_qualifications] +5%。我国与在$region_north_india$、$region_south_india$的每个[concept_subject]订立「$da_knowledge_sharing$」[concept_diplomatic_pact]：我国的[concept_technology_spread]变慢，对方的变快，对方每周的[concept_liberty_desire]下降，每份占用我国 50 点[concept_influence]。我国已研究的科技不多于对方时签不了，这一项落空。"
 nesnd_india_order_school_local_tt:0 "在$region_north_india$、$region_south_india$的每个[concept_subject]的[concept_pop_qualifications] +5%，每周的[concept_liberty_desire]下降。我国本国不加修正。"
 nesnd_mug_loan_button_desc:0 "向[concept_overlord]借一笔钱，五年内连本带息付回。"
 nesnd_mug_ask_loan_tt:0 "向[ROOT.GetCountry.GetOverlord.GetName]请求借款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0]。对方同意后，款项一次付给我国，两国订立还款[concept_treaty]，我国每周付还 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_weekly')|0]，五年合计约 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0]。"
