 nesnd_india_dispute_void_conclusion:0 "旧约作废了。"
 nesnd_india_dispute_renew_wait_tt:0 "二十年之内不再重议旧约。"
 nesnd_india_dispute_renew_involvement_tt:0 "宗主国开始关注北印度和南印度两个战略区域。"
 nesnd_india_dispute_void_fervor_tt:0 "[GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName]的[Concept('concept_primary_cultures','$concept_primary_culture$')]的[concept_fervor]目标在十年内提高。"
 nesnd_india_dispute_void_indep_tt:0 "「$nesnd_india_indep$」的$nesnd_india_indep_economy_bar$与$nesnd_india_indep_military_bar$各 #g +10#!。"
 nesnd_india_dispute_void_claim_tt:0 "[GetGlobalVariable('nesnd_india_dispute_g_lord').GetCountry.GetName]对[GetGlobalVariable('nesnd_india_dispute_g_subject').GetCountry.GetName]首都所在州提出[concept_claim]。"
