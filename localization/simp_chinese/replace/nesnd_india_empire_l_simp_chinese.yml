 nesnd_mug_council_no_free_prince_tt:0 "印度所有的[concept_princely_state]都已是我国的[concept_subject]"
 nesnd_mug_council_complete_conclusion:0 "印度的土邦都已归于帝国，王公会议成为帝国常设的议事机构。"
 nesnd_mug.14.t:0 "常设的王公会议"
 nesnd_mug.14.d:0 "铁路、赈济和共同防务三件事，王公会议都已达成过约定。出席过的王公习惯了在会上与[ROOT.GetCountry.GetName]商量共同的事务，会议从临时的召集变成了诸邦共同遵守的制度。"
 nesnd_mug.14.f:0 "“此后凡事关诸邦，先在这里商量。”\n——王公会议的开幕致辞"
 nesnd_mug.14.a:0 "让会议常设下去。"
