 nesnd_mug_france_status_buyback_asked:0 "我国买回产业的请求正等[ROOT.GetCountry.GetOverlord.GetName]答复。"
 nesnd_mug_sell_button:0 "出售产业"
 nesnd_mug_sell_button_desc:0 "把本国的一级产业卖给[concept_overlord]政府。"
 nesnd_mug_buyback_button:0 "买回产业"
