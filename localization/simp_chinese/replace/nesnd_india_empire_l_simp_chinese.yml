 nesnd_mug.21.d:0 "我国有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州遭遇[concept_harvest_condition]，农田减产。政府可以拨款赈济。"
