 nesnd_mug.21.a:0 "拨款赈济"
 nesnd_mug_relief_tt:0 "受灾的 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州各得「$nesnd_mug_famine_relief$」十二个月：[GetHarvestConditionType('drought').GetName]、[GetHarvestConditionType('flood').GetName]、[GetHarvestConditionType('wildfire').GetName]、[GetHarvestConditionType('heatwave').GetName]、[GetHarvestConditionType('extreme_winds').GetName]和[GetHarvestConditionType('disease_outbreak').GetName]的影响 #g −20%#!，粮食安全 #g +5%#!。"
 nesnd_mug.21.b:0 "不赈济"
