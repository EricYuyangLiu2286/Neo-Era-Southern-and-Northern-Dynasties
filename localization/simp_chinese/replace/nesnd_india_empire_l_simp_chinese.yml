 nesnd_mug.11.t:0 "召集王公会议"
 nesnd_mug.11.d:0 "政府准备把[concept_princely_state]的王公召到一处开会。一次会议只议一件事：修筑铁路、赈济灾荒，或者共同防务。"
 nesnd_mug.11.f:0 "“会议所议，以各邦共同的事务为限，不涉各邦的内政。”\n——[ROOT.GetCountry.GetName]政府致各[concept_princely_state]的通告"
 nesnd_mug.11.a:0 "议铁路"
 nesnd_mug_council_rail_tt:0 "议题为铁路。出席的[concept_princely_state]与我国各得「$nesnd_mug_council_rail$」十年：[concept_infrastructure] #g +2#!，地区建造力效率 #g +5%#!。"
 nesnd_mug_council_invite_tt:0 "三十日后结算，无人出席则散会。再次召集须在十年以后。"
 nesnd_mug.11.b:0 "议赈济"
 nesnd_mug_council_relief_tt:0 "议题为赈济。出席的[concept_princely_state]与我国各得「$nesnd_mug_council_relief$」十年：[GetHarvestConditionType('drought').GetName]和[GetHarvestConditionType('flood').GetName]的影响 #g −20%#!。"
 nesnd_mug.11.c:0 "议共同防务"
 nesnd_mug_council_defence_tt:0 "议题为共同防务。只邀请眼下能与我国订立[concept_defensive_pact]的[concept_princely_state]，我国的[Concept('concept_subject', '$concept_subjects|q$')]和按条约本身的条件无法签署的土邦不在其列。我国与每个出席的土邦订立[concept_defensive_pact]，[concept_binding_period]五年。每份条约的[concept_influence]维持费是双方各 @inf!#v [GetArticleType('defensive_pact').GetCost|0]#! 点，以眼下能受邀的土邦计，我国至多承担 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_defence_influence')|0]#! 点。结算时仍无法订立的条约写明数目。"
 nesnd_mug_council_defence_guests_tt:0 "至少有一个[concept_princely_state]眼下能与我国订立[concept_defensive_pact]"
 nesnd_mug.11.e:0 "暂不召集"
 nesnd_mug_council_later_tt:0 "这一次不召集，可以随时再召集。"
 nesnd_mug.12.t:0 "王公会议的邀请"
 nesnd_mug.12.d_rail:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]邀请我国出席王公会议，商议共同修筑铁路。出席的[concept_princely_state]与[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]同享会议的约定，不出席的不受约束。"
 nesnd_mug.12.d_relief:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]邀请我国出席王公会议，商议共同赈济灾荒。出席的[concept_princely_state]与[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]同享会议的约定，不出席的不受约束。"
 nesnd_mug.12.d_defence:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]邀请我国出席王公会议，商议共同防务。出席的[concept_princely_state]与[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]同享会议的约定，不出席的不受约束。"
 nesnd_mug.12.f:0 "“本国政府邀请贵邦派代表出席会议，商议各邦共同关心的事务。”\n——[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]政府致各[concept_princely_state]的邀请函"
 nesnd_mug.12.a:0 "出席"
 nesnd_mug_attend_rail_tt:0 "我国出席。会议结算时，我国得「$nesnd_mug_council_rail$」十年：[concept_infrastructure] #g +2#!，地区建造力效率 #g +5%#!。"
 nesnd_mug_attend_relief_tt:0 "我国出席。会议结算时，我国得「$nesnd_mug_council_relief$」十年：[GetHarvestConditionType('drought').GetName]和[GetHarvestConditionType('flood').GetName]的影响 #g −20%#!。"
 nesnd_mug_attend_defence_tt:0 "我国出席。会议结算时，我国与[ROOT.GetCountry.MakeScope.Var('nesnd_mug_council_invite').GetCountry.GetName]订立[concept_defensive_pact]，[concept_binding_period]五年，条约的[concept_influence]维持费是双方各 @inf!#v [GetArticleType('defensive_pact').GetCost|0]#! 点。条约无法订立时，这一项落空。"
 nesnd_mug.12.b:0 "婉拒"
 nesnd_mug_decline_council_tt:0 "我国不出席，不得修正，也不订立条约。"
 nesnd_mug.13.t:0 "王公会议的结果"
 nesnd_mug.13.d_none:0 "受邀的[concept_princely_state]无一出席，会议就此解散。"
 nesnd_mug.13.d_rail:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! 个[concept_princely_state]出席，#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! 个婉拒或没有答复。会议议定共同修筑铁路，我国与出席的各邦各得「$nesnd_mug_council_rail$」。"
 nesnd_mug.13.d_relief:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! 个[concept_princely_state]出席，#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! 个婉拒或没有答复。会议议定共同赈济灾荒，我国与出席的各邦各得「$nesnd_mug_council_relief$」。"
 nesnd_mug.13.d_defence_unsigned:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! 个[concept_princely_state]出席，#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! 个婉拒或没有答复。我国与出席的各邦订立[concept_defensive_pact]，其中 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_unsigned_value')|0]#! 份未能订立。"
 nesnd_mug.13.d_defence:0 "#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_yes_value')|0]#! 个[concept_princely_state]出席，#v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_council_no_value')|0]#! 个婉拒或没有答复。我国与出席的各邦都订立了[concept_defensive_pact]。"
 nesnd_mug.13.f:0 "“王公会议已经闭会。”\n——[ROOT.GetCountry.GetName]政府公告"
 nesnd_mug_council_none_tt:0 "没有修正，也没有条约。"
 nesnd_mug_council_done_tt:0 "会议的约定已经生效。"
 nesnd_mug.21.t:0 "农田受灾"
 nesnd_mug.21.d:0 "我国有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州遭遇[concept_harvest_condition]，农田减产。政府可以拨款赈济。"
 nesnd_mug.21.f:0 "“本州农田减产，请速拨款赈济。”\n——受灾各州呈[ROOT.GetCountry.GetName]政府的灾情报告"
 nesnd_mug.21.a:0 "拨款赈济"
 nesnd_mug_relief_tt:0 "受灾的 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州各得「$nesnd_mug_famine_relief$」十二个月：[GetHarvestConditionType('drought').GetName]、[GetHarvestConditionType('flood').GetName]、[GetHarvestConditionType('wildfire').GetName]、[GetHarvestConditionType('heatwave').GetName]、[GetHarvestConditionType('extreme_winds').GetName]和[GetHarvestConditionType('disease_outbreak').GetName]的影响 #g −20%#!，粮食安全 #g +5%#!。"
 nesnd_mug.21.b:0 "不赈济"
 nesnd_mug_no_relief_tt:0 "政府不拨款，受灾的州没有修正。二十四个月内不会再为灾情收到这类报告。"
 nesnd_mug.22.t:0 "农田受灾"
 nesnd_mug.22.d:0 "我国有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州遭遇[concept_harvest_condition]，农田减产。我国可以自己拨款赈济，也可以请[SCOPE.sCountry('mug_famine_mughal').GetName]援助。如果我国是别国的[concept_subject]国，还可以请[concept_overlord]援助。"
 nesnd_mug.22.d_alone:0 "我国有 #v [ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州遭遇[concept_harvest_condition]，农田减产。我国可以自己拨款赈济。如果我国是别国的[concept_subject]国，还可以请[concept_overlord]援助。"
 nesnd_mug.22.f:0 "“本州农田减产，请速拨款赈济。”\n——受灾各州呈[ROOT.GetCountry.GetName]政府的灾情报告"
 nesnd_mug.22.a:0 "自己赈济"
 nesnd_mug.22.b:0 "请[SCOPE.sCountry('mug_famine_mughal').GetName]援助"
 nesnd_mug_ask_mughal_tt:0 "我国请[SCOPE.sCountry('mug_famine_mughal').GetName]拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|K]。对方同意后，受灾的州各得「$nesnd_mug_famine_relief$」十二个月，两国[concept_relations] #g +25#!。"
 nesnd_mug_aid_wait_tt:0 "对方有三十日答复。不同意或不答复时，我国还可以自己赈济。"
 nesnd_mug.22.c:0 "请[concept_overlord]援助"
 nesnd_mug_ask_overlord_tt:0 "我国请[ROOT.GetCountry.GetOverlord.GetName]拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_cost')|K]。对方同意后，受灾的州各得「$nesnd_mug_famine_relief$」十二个月，两国[concept_relations] #g +25#!。"
 nesnd_mug.22.e:0 "不赈济"
 nesnd_mug.23.t:0 "赈济款到位"
 nesnd_mug.23.d_mughal:0 "[SCOPE.sCountry('india_matter_to').GetName]同意援助，拨款赈济我国受灾的州。这些州的灾情因此减轻，两国[concept_relations]也有改善。"
 nesnd_mug.23.d_overlord:0 "[SCOPE.sCountry('india_matter_to').GetName]同意援助，拨款赈济我国受灾的州。这些州的灾情因此减轻，两国[concept_relations]也有改善。"
 nesnd_mug.23.f:0 "“赈济款项已经拨出。”\n——[SCOPE.sCountry('india_matter_to').GetName]政府公告"
 nesnd_mug_aid_given_tt:0 "受灾的州各得「$nesnd_mug_famine_relief$」十二个月，两国[concept_relations] #g +25#!。"
 nesnd_mug.24.t:0 "援助没有来"
 nesnd_mug.24.d_forbid:0 "[SCOPE.sCountry('india_matter_permit').GetName]以[concept_overlord]的身份不许可此事，援助请求没有送出。我国还可以自己拨款赈济受灾的州。"
 nesnd_mug.24.d_decline:0 "[SCOPE.sCountry('india_matter_to').GetName]婉拒了我国的援助请求。我国还可以自己拨款赈济受灾的州。"
 nesnd_mug.24.d_silent:0 "[SCOPE.sCountry('india_matter_to').GetName]三十日内没有答复。我国还可以自己拨款赈济受灾的州。"
 nesnd_mug.24.d_queued:0 "[SCOPE.sCountry('india_matter_to').GetName]一直忙于别的交涉，我国的援助请求未能送达，就此作罢。我国还可以自己拨款赈济受灾的州。"
 nesnd_mug.24.d_void:0 "情形已经改变，援助请求无法再办。我国还可以自己拨款赈济仍在受灾的州。"
 nesnd_mug.24.f:0 "“请求援助一事暂告中止。”\n——[ROOT.GetCountry.GetName]政府公告"

 # Independence
 nesnd_india_indep_fund_tt:0 "受助运动的活跃度增加 10 个百分点，活跃度增长提高 25%，持续 24 个月。再获资助时重新计时。"
 nesnd_india_indep_conciliate_terms:0 "选定属邦后支出 @money!20,000。已有$lobby_pro_overlord$时，其[concept_political_lobby_appeasement]增加 4。尚无该团体时，由合格的[concept_interest_group]中政治力量最大的一个发起组建。12 个月后可再次拨款。"
 nesnd_india_indep_coerce_terms:0 "两项储备各扣减至多 50 点，没收全部私储军械，两国[concept_relations]下降 30。12 个月后可再次威压。"
 nesnd_india_indep_defer:0 "暂缓决定"
 nesnd_india_indep_defer_tt:0 "本次不采取行动，亦无开支。"
 nesnd_india_indep_impound_tt:0 "没收一批尚存的私储军械，两国[concept_relations]下降 30。"
 nesnd_india_indep_trace_tt:0 "两国[concept_relations]下降 30。这笔资助若仍在生效，予以撤销。"
 nesnd_india_indep_file_only_tt:0 "仅将此事存档，准许对方保留款项或军械。"
 nesnd_india_indep_movement_1:0 "[SCOPE.sPoliticalMovement('indep_choice_1').GetName]"
 nesnd_india_indep_target_1:0 "[SCOPE.sCountry('indep_subject_1').GetName]"
 nesnd_india_indep_movement_2:0 "[SCOPE.sPoliticalMovement('indep_choice_2').GetName]"
 nesnd_india_indep_target_2:0 "[SCOPE.sCountry('indep_subject_2').GetName]"
 nesnd_india_indep_movement_3:0 "[SCOPE.sPoliticalMovement('indep_choice_3').GetName]"
 nesnd_india_indep_target_3:0 "[SCOPE.sCountry('indep_subject_3').GetName]"
 nesnd_india_indep.1.t:0 "[concept_overlord]内的[concept_political_movement]"
 nesnd_india_indep.1.d:0 "我国准备接济[SCOPE.sCountry('indep_lord').GetName]国内的[concept_political_movement]。拨款时优先考虑得到富裕阶层支持的运动，军需物资则优先供应在军中有影响的运动。受助者可以借此组织更多活动，[concept_overlord]也可能从钱物的来源查到我国。"
 nesnd_india_indep.1.f:0 "「请指明受款团体，以便将款项或物资拨付其代表。」——拨付指令草案"
 nesnd_india_indep.2.t:0 "属邦活动败露"
 nesnd_india_indep.2.d_arms:0 "我国已获悉[SCOPE.sCountry('indep_actor').GetName]政府私下储存军械。若予追查，可以要求交出一批存货。"
 nesnd_india_indep.2.d_funding:0 "我国已查明[SCOPE.sCountry('indep_actor').GetName]向[SCOPE.sPoliticalMovement('indep_movement').GetName]提供资助。是否向对方正式交涉，由我国决定。"
 nesnd_india_indep.2.d_gone:0 "我国获得了[SCOPE.sCountry('indep_actor').GetName]资助国内[concept_political_movement]的记录。受助的运动现已解散，我国仍可向资助方提出交涉。"
 nesnd_india_indep.2.f:0 "「是否据此向对方政府提出交涉，尚待指示。」——调查报告"
 nesnd_india_indep.2.a:0 "正式追查"
 nesnd_india_indep.2.b:0 "将报告存档"
 nesnd_india_indep.3.t:0 "[concept_overlord]提出交涉"
 nesnd_india_indep.3.d:0 "[SCOPE.sCountry('indep_lord').GetName]已就我国的秘密筹备提出正式交涉。此次追查使两国[concept_relations]恶化。"
 nesnd_india_indep.3.f:0 "「本政府已将此事正式通知贵国。」——外交照会"
 nesnd_india_indep.3.result:0 "两国[concept_relations]已因追查下降 30。"
 nesnd_india_indep.4.t:0 "[concept_overlord]将报告存档"
 nesnd_india_indep.4.d:0 "[SCOPE.sCountry('indep_lord').GetName]已获悉我国的行动，决定存档。对方没有要求追回这次提供的款物或交出军械。"
 nesnd_india_indep.4.f:0 "「关于此次调查，本政府无进一步要求。」——外交答复"
 nesnd_india_indep.4.result:0 "本次调查到此结束。"
 nesnd_india_indep.5.t:0 "对属邦的处置"
 nesnd_india_indep.5.d_conciliate:0 "有些属邦的[concept_interest_group]愿意维持与我国的宗藩关系。我国可以拨款扶持当地的$lobby_pro_overlord$，让这些利益集团向本国政府陈明立场。"
 nesnd_india_indep.5.d_coerce:0 "我国可以要求一个属邦削减工业筹款和军工储备，交出私储的军械。两国[concept_relations]将因此进一步恶化。"
 nesnd_india_indep.5.f:0 "「请定明此项决定应通知哪一国政府。」——外交公函草案"
 nesnd_india_indep.6.t:0 "[concept_overlord]资助$lobby_pro_overlord$"
 nesnd_india_indep.6.d:0 "[SCOPE.sCountry('indep_lord').GetName]已出资扶持我国的$lobby_pro_overlord$。该团体主张维持两国的宗藩关系。"
 nesnd_india_indep.6.f:0 "“请将这笔款项用于陈述继续维持两国[concept_relations]的理由。”——拨款函"
 nesnd_india_indep.6.result:0 "本国的$lobby_pro_overlord$已获[concept_overlord]资助。"
 nesnd_india_indep.7.t:0 "[concept_overlord]下令削减筹备"
 nesnd_india_indep.7.d:0 "[SCOPE.sCountry('indep_lord').GetName]已下令削减我国的筹款和军工储备，并没收私储的军械。两国[concept_relations]因这道命令而恶化。"
 nesnd_india_indep.7.f:0 "「私下储存的军械，悉数收缴。」——没收令"
 nesnd_india_indep.7.result:0 "两项储备各扣减至多 50 点，私储军械已没收，两国[concept_relations]下降 30。"
 nesnd_india_indep_support_regime_terms:0 "选定属邦后订立“$da_support_regime$”协议。我国承担 @inf!50 的维持费，[concept_legitimacy]降低 10，属邦政府的合法性增加 20。协议至少维持 12 个月。"
 nesnd_india_indep.5.d_support_regime:0 "我国可以公开支持一个直属属邦的执政者。现在须选定与我国订立协议的政府。"
 nesnd_india_indep.10.t:0 "[concept_overlord]支持本届政府"
 nesnd_india_indep.10.d:0 "[SCOPE.sCountry('indep_lord').GetName]已与我国订立协议，公开支持本届政府继续执政。"
 nesnd_india_indep.10.f:0 "“本政府确认对贵国政府的支持。”——外交照会"
 nesnd_india_indep.10.result:0 "“$da_support_regime$”协议已生效。"
 nesnd_india_indep.11.t:0 "维持属邦的效忠"
 nesnd_india_indep.11.d:0 "属邦内部愿意维持宗藩关系的[concept_interest_group]，可以获得我国资助。如果当地政府本身需要支持，我国也可以与它直接订立协议。"
 nesnd_india_indep.11.f:0 "“款项拨给当地的$lobby_pro_overlord$。”——外交训令"
 nesnd_india_indep.11.a:0 "拨款扶持$lobby_pro_overlord$。"
 nesnd_india_indep.11.b:0 "订立“$da_support_regime$”协议。"
