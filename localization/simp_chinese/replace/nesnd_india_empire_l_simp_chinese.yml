 nesnd_mug_france_reason_loan_script:0 "$nesnd_mug_france_intro$\n\n我国向[ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName]借了 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0]。还款[concept_treaty]没能订立，我国每月直接付还 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_monthly')|0]，五年合计 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0]，[TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_mug_loan_term'))]到期。担保是：到期以前我国陷入[concept_default]或宣布[concept_bankruptcy]，即为违约，未还的部分不再追讨，改为给予[ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName][concept_trade_privilege]十年。这笔借款付清以前不能再借。赎回附属关系的价钱是 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0]。"
 nesnd_mug_france_reason_loan:0 "$nesnd_mug_france_intro$\n\n我国向[ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName]借了 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_sum')|0]，按还款[concept_treaty]每周付还 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_weekly')|0]，五年合计约 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_loan_total')|0]，[TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_mug_loan_term'))]到期。担保是：到期以前我国陷入[concept_default]或宣布[concept_bankruptcy]，即为违约，我国退出还款条约，未还的部分不再追讨，改为给予[ROOT.GetCountry.MakeScope.Var('nesnd_mug_loan_from').GetCountry.GetName][concept_trade_privilege]十年。这笔借款付清以前不能再借。赎回附属关系的价钱是 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_mug_redeem_price')|0]。"
