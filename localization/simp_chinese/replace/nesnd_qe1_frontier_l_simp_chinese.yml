 # 波斯将军府「将军府的忠心」
 nesnd_per_stance_journal:0 "将军府的忠心"
 nesnd_per_stance_journal_reason:0 "[ROOT.GetCountry.GetName]向伊犁称臣纳贡，是因为秦军在呼罗珊仍有威势。西秦的边地若接连丧失，将军府便不必继续奉伊犁为宗主。幕府正在两种方略之间权衡：出兵助秦，借西秦之力向西经略，或者乘机自立。"
 nesnd_per_stance_journal_lobby:0 "$nesnd_lobby_name_per$向伊犁称臣纳贡，是因为秦军在呼罗珊仍有威势。西秦的边地若接连丧失，将军府便不必继续奉伊犁为宗主。幕府正在两种方略之间权衡：出兵助秦，借西秦之力向西经略，或者乘机自立。"
