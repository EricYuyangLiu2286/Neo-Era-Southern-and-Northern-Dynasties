 nesnd_per_stance_status_out:0 "幕府中主张自立的意见已占多数。"
 nesnd_per_stance_status_qin:0 "将军府准备出兵助秦。"
 nesnd_per_stance_status_mid:0 "将军府尚在观望。"
 nesnd_per_stance_done_conclusion:0 "将军府已不再是西秦的藩属。"
 nesnd_per_stance_done_tt:0 "不再是$nesnd_lobby_name_qe1$的附属国"
 nesnd_per_stance_endings_tt:0 "忠心升到 #v 80#!：方略若尚未定下，即定为西向，将军府借$nesnd_lobby_name_qe1$之力向西经营。忠心满 #v 100#! 而$nesnd_lobby_name_qe1$正与边地叛军交战时，将军府出兵助剿，忠心回落到 #v 70#!，三年内不再出兵。\n忠心降到 #v 0#!：将军府在不打仗时脱离$nesnd_lobby_name_qe1$自立，方略若尚未定下，即定为东向。\n忠心达到 #v 60#! 时，$nesnd_lobby_name_qe1$不时派员扶助。"
 nesnd_per_stance_lean_qin_button:0 "遣使伊犁输诚"
 nesnd_per_stance_lean_qin_button_desc:0 "遣使申明，呼罗珊各军听候伊犁调遣。"
 nesnd_per_stance_lean_qin_tt:0 "此后每月忠心 #g +1#!，直到改为接见边地来的使者。"
 nesnd_per_stance_lean_out_button:0 "接见边地来的使者"
 nesnd_per_stance_lean_out_button_desc:0 "接见阿富汗和草原诸部的来使，听取他们的陈请。"
 nesnd_per_stance_lean_out_tt:0 "此后每月忠心 #r -1#!，直到再次遣使伊犁输诚。"
 nesnd_per_stance.2.t:0 "波斯绝贡"
 nesnd_per_stance.2.d:0 "$nesnd_lobby_name_per$今年没有遣使入贡，并在朝会上宣布不再向伊犁称臣。\n\n波斯将军府原是陈秦的四大军府之一，1821年曾随安北、安西、安南三府奉调东进。兰州战败以后，它仍奉伊犁为宗主，是因为秦军在呼罗珊尚有威势。如今将军府认定[ROOT.GetCountry.GetName]已经无力西顾，决定自行其是，波斯的军令从此不再出自伊犁。这一消息传入群山，当地主张脱离朝廷的头人由此得到了一个可以求助的邻国。"
 nesnd_per_stance.2.f:0 "“自今以后，本朝的军令出自本朝。”\n——波斯朝会上颁布的诏书"
 nesnd_per_stance.2.a:0 "重新部署西南边防。"
 nesnd_per_stance.3.t:0 "呼罗珊的援兵"
 nesnd_per_stance.3.d:0 "$nesnd_lobby_name_per$出兵助剿，骑兵已抵达群山，与官军会合。\n\n将军府此次出兵，名义上是履行藩属的职责，出师文书中申明各营听候伊犁调遣。幕府中一直有人主张乘西秦内乱之机自立，这次出兵表明，主张借助西秦之力向西经略的一派占了上风。波斯援军的到来使官军在群山的兵力大为增强，起事各部的声势随之受挫。将军府期望日后向西用兵时，能够得到[ROOT.GetCountry.GetName]的支持。"
 nesnd_per_stance.3.f:0 "“奉命率马步各营东出，听候伊犁调遣。”\n——波斯将军府的出师文书"
 nesnd_per_stance.3.a:0 "传令嘉奖。"
