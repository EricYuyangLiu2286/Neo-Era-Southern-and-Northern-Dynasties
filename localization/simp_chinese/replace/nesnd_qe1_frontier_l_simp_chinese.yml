 nesnd_qe1_frontier.1.t:0 "户帖上的族名"
 nesnd_qe1_frontier.1.d:0 "群山各州的头人和乡兵队正结成会社，向官府联名呈文。他们要求补发积欠的军饷，准许以本族文字审理讼案，并重开清真寺。呈文的落款没有沿用“汉羌”，各人署上了自己部族的名字。\n\n陈秦西进之时，将兴都库什山两侧的居民一概编入“羌”籍，教以汉字和农耕，凭军功授予官职。两百年来，[GetCulture('pashtun').GetName]头人世代出任乡兵队正，为朝廷把守山口。如今在呈文上署名的正是这些人。他们领受朝廷的武职，所部乡兵都在军籍之内。1821年兰州一战以后，秦军主力退守伊犁，[ROOT.GetCountry.GetName]对边地的威权已经大不如前。头人们选在此时改换落款，是要朝廷承认，群山之中的各部从来不是汉羌。"
 nesnd_qe1_frontier.1.f:0 "“普什图、塔吉克、哈扎拉各部，世守山口，于今二百年。自今请以本名列于户帖。”\n——阿富汗各部头人联名的呈文"
 nesnd_qe1_frontier.1.a:0 "命衙署查核所请各项。"
 nesnd_qe1_frontier.2.t:0 "草原上的会盟"
 nesnd_qe1_frontier.2.d:0 "草原各部的苏丹、比官与安北骑营中的本族军官举行会盟。会盟议定，军屯圈占的牧地应当归还各部，草原居民从此不再以汉羌自称。\n\n安北将军幕府设于伊犁、楚河一线，所辖军屯以牧场和牧民村落为主。两百多年前，陈秦景公以“长鲸扫地”之策，凭决战和长途奔袭扫灭了占据漠西草原的乌兹别克汗国，在其故地设置羌人军屯。此后草原各部的子弟编入骑营，随秦军四出征战，军屯的界桩则不断向牧地推进。与会者重新打出了乌兹别克汗国的名号。他们当中有许多人是安北幕府的现任军官，所部骑兵仍在朝廷的军籍之内。"
 nesnd_qe1_frontier.2.f:0 "“军屯所占牧地，悉数归还各部。汉羌之名，自今不用。”\n——草原会盟的誓词"
 nesnd_qe1_frontier.2.a:0 "命安北幕府查明领头的人。"
 nesnd_qe1_frontier.3.t:0 "群山举兵"
 nesnd_qe1_frontier.3.d:0 "[SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName]宣告成立，群山各州的乡兵营不再听从伊犁的号令。举兵者并不限于山地部族，许多领受朝廷武职的军官也在其中，所部乡兵随之倒戈。\n\n起事者否认汉羌的名分，要求以本族的族名和教门立国。在他们看来，陈秦两百年的治理只是把[GetCulture('pashtun').GetName]、[GetCulture('tajik').GetName]、[GetCulture('hazara').GetName]各部编进同一本户帖，再让各部替东来的秦人守边纳粮。[ROOT.GetCountry.GetName]必须出兵越过兴都库什山。河中与草原的头人正在观望这一战的结局，朝廷若不能取胜，汉羌之名在其余各镇也将难以维系。"
 nesnd_qe1_frontier.3.f:0 "“自今日起，兴都库什以南不纳秦粮，不应秦役。”\n——起事者传檄各城的文告"
 nesnd_qe1_frontier.3.a:0 "调集兵力，南下平叛。"
 nesnd_qe1_frontier.4.t:0 "草原举兵"
 nesnd_qe1_frontier.4.d:0 "草原诸部举兵，建号[SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName]。安北各营的本族骑兵大多倒戈，屯堡中的[GetCulture('ce_xiyu').GetName]也有不少人随之而去。\n\n起事者要求收回军屯圈占的牧地，驱逐屯官。安北幕府两百年来依靠这些部族的骑兵守卫帝国的北疆，如今这些骑兵成了朝廷的敌人，幕府能够倚仗的兵力大为减少。草原无险可守，各处屯堡相距遥远，守军只能各自据守。[ROOT.GetCountry.GetName]若要保住北疆，就必须在旷野上击败这支由安北幕府训练出来的骑军。"
 nesnd_qe1_frontier.4.f:0 "“凡我各部，收回牧地，逐出屯官。从者为民，拒者为敌。”\n——汗帐传谕各部的檄文"
 nesnd_qe1_frontier.4.a:0 "命安北诸营固守本镇。"
 nesnd_qe1_frontier.5.t:0 "山口以南"
 nesnd_qe1_frontier.5.d:0 "战事已经停止，[SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName]得以立国。群山各州不再向伊犁缴纳粮赋、承担兵役，兴都库什山的各处山口改由新政权的军队把守。\n\n这一结局很快传遍了河中各城。各地的头人和队正由此得知，否认汉羌的名分、与朝廷兵戎相见的人，最终迫使伊犁停战并承认了现有的疆界。[ROOT.GetCountry.GetName]借以统合西域各族的户籍与名分，已经在群山之间被公开废弃。其余各镇的头人不会忽视这一先例，朝廷在边地的威权将因此进一步衰落。"
 nesnd_qe1_frontier.5.f:0 "“两国罢兵，各守现界。”\n——停战文书"
 nesnd_qe1_frontier.5.a:0 "整顿其余各镇的防务。"
 nesnd_qe1_frontier.6.t:0 "草原易主"
 nesnd_qe1_frontier.6.d:0 "战事已经停止，[SCOPE.sCountry('nesnd_qe1_fr_rising_country').GetName]控制了草原。安北幕府经营两百余年的军屯牧场不再归伊犁管辖，留居屯堡的[GetCulture('ce_xiyu').GetName]从此成为汗国的属民。\n\n陈秦景公当年扫灭草原上的汗国，是为了使帝国的北面不再有游牧王庭。如今这个汗国的名号重新立于草原，统率它的是出身安北骑营的军官。伊犁以北已经没有屏障，[ROOT.GetCountry.GetName]必须重新划定北疆的防线。朝廷还要回答一个问题：两百年的军屯和教化，为什么没有使草原各部成为秦人？"
 nesnd_qe1_frontier.6.f:0 "“两国罢兵，各守现界。”\n——停战文书"
 nesnd_qe1_frontier.6.a:0 "加固伊犁以北的防线。"
 nesnd_qe1_frontier.7.t:0 "群山平定"
 nesnd_qe1_frontier.7.d:0 "群山的起事已被平定，各州重归伊犁管辖。军府惩办了为首的头人，对随从举兵的乡兵不予追究，各营仍然编在军籍之内。\n\n这场战事表明，[ROOT.GetCountry.GetName]仍有力量越过兴都库什山用兵。军府估计，边地在十年之内难以再度起事。然而，起事者提出的要求并没有随着战败而消失。汉羌的名分是靠这一战保住的，朝廷在群山的统治今后也只能继续倚仗驻军。"
 nesnd_qe1_frontier.7.f:0 "“首恶既除，胁从不问。各营照常点卯。”\n——军府的安民告示"
 nesnd_qe1_frontier.7.a:0 "重整群山各营。"
 nesnd_qe1_frontier.8.t:0 "草原平定"
 nesnd_qe1_frontier.8.d:0 "草原的起事已被平定，各州重归伊犁管辖，军屯的地界得以恢复。安北幕府惩办了为首的苏丹，其余各部仍按旧例纳赋，倒戈的骑兵重新造册入籍。\n\n秦军再一次在旷野上击败了草原的骑兵，汗国的名号随之取消。军府估计，草原在十年之内难以再度起事。然而，牧地与军屯之争并未就此了结。各部仍然否认汉羌的名分，这一主张在汗国取消之后继续流传。"
 nesnd_qe1_frontier.8.f:0 "“首恶既除，胁从不问。各部照常纳赋。”\n——安北幕府的安民告示"
 nesnd_qe1_frontier.8.a:0 "重造安北的军籍。"
 nesnd_qe1_frontier.9.t:0 "河中告急"
 nesnd_qe1_frontier.9.d:0 "[GetCulture('turkmen').GetName]各部和希瓦的土官相继举兵，不再听从伊犁的号令。两路兵马分别自黑沙漠和花剌子模出发，兵锋指向河中。\n\n边疆的战事和朝廷威权的衰落，使这些地方的首领相信，脱离伊犁的时机已经到来。陈秦当年视葱岭以西为适宜农耕的沃土，河中各城是它最早取得的土地之一，宁羌镇就是由此攻入撒马尔罕的。[ROOT.GetCountry.GetName]已经不能把边疆的战事当作一隅之乱。朝廷正在同时面对数个以本族之名建国的敌人，康国一旦有失，帝国在葱岭以西的统治便无从维持。"
 nesnd_qe1_frontier.9.f:0 "“贼分两路，一出黑沙漠，一出花剌子模。请速发援兵。”\n——康国守将的急报"
 nesnd_qe1_frontier.9.a:0 "康国不能有失。"
 nesnd_qe1_frontier.10.t:0 "费尔干纳举兵"
 nesnd_qe1_frontier.10.d:0 "费尔干纳的头人以浩罕为号举兵，谷地各城关闭城门，驿路断绝，不再听从伊犁的号令。\n\n费尔干纳谷地位于天山与帕米尔之间，是伊犁通往河中的要道。[GetCulture('turkmen').GetName]各部与希瓦举兵在前，谷地的头人随后响应，[ROOT.GetCountry.GetName]在葱岭以西的各镇由此被分隔开来。起事者同样否认汉羌的名分，打出的是本地旧有的名号。朝廷如果不能迅速收复谷地，对河中的增援将大受阻碍。"
 nesnd_qe1_frontier.10.f:0 "“谷地各城闭门，驿路不通。”\n——边关的急报"
 nesnd_qe1_frontier.10.a:0 "调兵进剿。"
 nesnd_qe1_frontier.11.t:0 "欠饷"
 nesnd_qe1_frontier.11.d:0 "群山各乡兵营联名呈文，称营中饷银久未足额发放，请求朝廷如数补发。领衔者都是本地头人出身的队正。\n\n乡兵是[ROOT.GetCountry.GetName]在群山的主要兵力，由本地部族的子弟充任，平日把守山口、弹压地方。士卒长期领不到足额的饷银，队正便难以约束部下，头人在族中的威信也随之受损。朝廷如果拨款补发，国库要为此支出一笔银两。如果置之不理，营中的不满就会转向朝廷。"
 nesnd_qe1_frontier.11.f:0 "“营中子弟枵腹荷戈，恐非朝廷之福。”\n——群山乡兵营的呈文"
 nesnd_qe1_frontier.11.a:0 "由国库拨款，如数补发。"
 nesnd_qe1_frontier.11.b:0 "军府同样欠饷，暂不补发。"
 nesnd_qe1_frontier.12.t:0 "界桩"
 nesnd_qe1_frontier.12.d:0 "安北军屯今年继续向北拓垦，新垦的土地是[GetCulture('kazak').GetName]部落的冬牧场。屯长持有朝廷颁发的垦荒令，牧民则声称这片草场是祖辈传下的牧地。双方争执不下，呈报伊犁裁决。\n\n垦荒令规定，无主荒地准许军户报垦，三年后起征田赋。在屯长看来，牧民逐水草迁徙，冬来春去，这片草场自然是无主之地。牧民一年之中只在冬季驻牧于此，失去冬牧场，畜群便无法过冬。[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]历来是军屯拓垦的受益者，他们要求朝廷维持成法。草原各部的苏丹则把这件事看作朝廷是否顾及他们生计的凭据。"
 nesnd_qe1_frontier.12.f:0 "“凡无主荒地，许军户报垦，三年起科。”\n——朝廷的垦荒令"
 nesnd_qe1_frontier.12.a:0 "维持垦荒令。"
 nesnd_qe1_frontier.12.b:0 "撤回界桩，归还牧场。"
 nesnd_qe1_frontier.13.t:0 "改宗的人"
 nesnd_qe1_frontier.13.d:0 "按察司呈报，边地的[GetCulture('ce_xiyu').GetName]近年来成批改信祖上的教门。其中有人在佛寺登记了法名，同时到阿訇家中礼拜，也有人师从来自波斯的[GetReligion('shiite').GetName]教师。\n\n陈秦将河中、草原和群山的居民编入羌籍以后，这些人在户帖上登记为佛门信众，僧籍由此成为汉羌身份的一部分。两百年间，祖上的教门只在家中和乡里私下传承。朝廷的威权衰落以后，改宗的人日渐增多。[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]主张查封经堂、究办教师，以维持朝廷的法度。然而，改宗者照常纳粮服役，其中有许多是在营的军户，一旦追究，牵连的将是边地各营的兵源。"
 nesnd_qe1_frontier.13.f:0 "“查各屯军户，名隶僧籍而私习回教者，十居三四。”\n——按察司的呈报"
 nesnd_qe1_frontier.13.a:0 "查封经堂，究办教师。"
 nesnd_qe1_frontier.13.b:0 "照常纳粮服役的人，朝廷不追究其信仰。"

