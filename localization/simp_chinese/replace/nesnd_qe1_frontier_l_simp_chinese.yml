 # 西秦「边疆诸部」
 nesnd_qe1_frontier_journal:0 "边疆诸部"
 nesnd_qe1_frontier_journal_reason:0 "陈秦西进之际，将河中、草原和兴都库什山两侧的居民一概编入“羌”籍，教以汉字和农耕，准许他们凭军功入仕。此后两百年间，[GetCulture('pashtun').GetName]头人出任乡兵队正，[GetCulture('kazak').GetName]苏丹统领安北幕府的骑营。他们的子弟学习汉文，遵从秦俗，在户帖上登记为“汉羌”。\n\n1821年兰州战败以后，秦军退守伊犁，朝廷的威权随之衰落。边地汉羌的信仰和文化长期受到压制，族人贫困，在仕途和军中的地位又在老秦人之下。各部头人既统率营伍，又领有朝廷的官职。他们开始否认“汉羌”这一名分，要求恢复本族的族名和教门。"
 nesnd_qe1_frontier_journal_lobby:0 "陈秦将河中、草原和兴都库什山两侧的居民一概编入“羌”籍，准许他们凭军功入仕。两百年后，$nesnd_lobby_name_qe1$退守伊犁，朝廷的威权已经衰落。边地汉羌的信仰和文化长期受到压制，族人贫困，在仕途和军中的地位又在老秦人之下。各部头人既统率营伍，又领有朝廷的官职。他们开始否认“汉羌”这一名分，要求恢复本族的族名和教门。"
