l_simp_chinese:
 nesnd_per_future_progress:0 "近西帝国的前途"
 nesnd_per_future_delta_desc:0 "朝廷的部署"
 nesnd_per_future_bar_desc:0 "$nesnd_per_future_progress$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_per_future_status_choice:0 "朝廷尚未决定与伊犁的关系。"
 nesnd_per_future_status_aid:0 "朝廷已选定求援伊犁、向西经营的方针。"
 nesnd_per_future_status_covert:0 "朝廷的使者正在中亚联络不满伊犁的地方势力。"
 nesnd_per_future_journal:0 "近西帝国的未来"
 nesnd_per_future_journal_reason:0 "唐衣大食的君臣，熟悉秦国的军府，也熟悉波斯的商旅与地方家族。近西战争留下了土地和声望，帝国往哪里走却还没定：借伊犁之力向西，还是趁西秦的地方纷争自己往东打？"
 nesnd_per_civil_journal:0 "唐衣之下"
 nesnd_per_civil_journal_reason:0 "军府带来的官制，同本地的书院、宗教学校和家族并存。要让出身各异的官员在一处办事，得有靠得住的任官规矩，还得有培养新人的学堂。"
 nesnd_per_economy_journal:0 "波斯的市镇"
 nesnd_per_economy_journal_reason:0 "棉田、织工和往来的商旅撑着波斯的繁荣。朝廷想用铁路把产地和市镇连起来，让近西战争打下来的土地除了养兵，也养得起新工场。"
 nesnd_per_west_journal:0 "重启远西战争"
 nesnd_per_west_journal_reason:0 "朝廷已把目光投向两河以西。来自秦国的军事传统与波斯的财力将服务于新的扩张，而奥斯曼、埃及及阿拉伯的诸国也会寻找自己的强国援手。"
 nesnd_per_east_journal:0 "近西战争重启"
 nesnd_per_east_journal_reason:0 "伊犁的权威正在受到挑战。朝廷准备沿中亚与印度的道路追求自己的利益，昔日宗主的边疆如今也进入了军府的地图。"
 nesnd_per_seek_aid_button:0 "遣使伊犁"
 nesnd_per_seek_aid_button_desc:0 "请求秦国帮助朝廷整顿官署与军政，为向西扩张准备力量。"
 nesnd_per_subvert_button:0 "联络西秦诸部"
 nesnd_per_subvert_button_desc:0 "结交不满伊犁的地方领袖，准备摆脱宗主并经营东方。"
 nesnd_per_civil_commit_button:0 "整顿官署"
 nesnd_per_civil_commit_button_desc:0 "任用受过训练的官员，把书院与官署的培养连在一起。"
 nesnd_per_economy_commit_button:0 "奖掖工商业"
 nesnd_per_economy_commit_button_desc:0 "支持已有的棉田、织造与铁路，使商路和工场相互接续。"
 nesnd_per_claim_levant_button:0 "申明黎凡特旧权"
 nesnd_per_claim_levant_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_egypt_button:0 "申明尼罗河流域旧权"
 nesnd_per_claim_egypt_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_arabia_button:0 "申明阿拉伯旧权"
 nesnd_per_claim_arabia_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_central_asia_button:0 "申明中亚旧权"
 nesnd_per_claim_central_asia_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_claim_india_button:0 "申明印度西北诸地的权利"
 nesnd_per_claim_india_button_desc:0 "向有关国家递交领土照会，申明我方对当地的主张。与该地区有利害关系的强国可能出面阻挠。"
 nesnd_per_aid_law:0 "伊犁的议法官"
 nesnd_per_aid_building:0 "援建工匠"
 nesnd_per_aid_legitimacy:0 "秦使的认可"
 nesnd_per_claim_cost:0 "边地交涉"
 nesnd_per_civil_order:0 "官署渐整"
 nesnd_per_industry_order:0 "市镇渐兴"
 nesnd_per.1.a:0 "接纳这些援助。"
 nesnd_per.1.t:0 "伊犁的议法官"
 nesnd_per.1.d:0 "秦国派来的官员带来了军府之外的另一种经验。他们与本地书吏共同整理法令，希望使官员、商人和田主不必再为同一件事奔走于几套不同的规矩之间。"
 nesnd_per.2.a:0 "接纳这些援助。"
 nesnd_per.2.t:0 "援建工匠"
 nesnd_per.2.d:0 "随使团来的工匠已经进了当地工场，教人测量、营造和修机器。这些手艺能不能变成长久的产业，就看本地的工人和商人了。"
 nesnd_per.3.a:0 "接纳这些援助。"
 nesnd_per.3.t:0 "秦使入朝"
 nesnd_per.3.d:0 "秦国使者在朝会上确认了对本朝的支持。与伊犁保持联系的军官和商人因此安下心来，朝廷也得以暂时压低反对者的声势。"
 nesnd_per.4.a:0 "向西经营。"
 nesnd_per.4.t:0 "西向之策"
 nesnd_per.4.d:0 "本朝与伊犁已经确定朝贡往来，朝廷也将扩张的方向转向西方。军府准备新的远征，商人则打算沿着军队前进的道路寻找市场。"
 nesnd_per.5.a:0 "近西战争将有新的篇章。"
 nesnd_per.5.t:0 "东方的机会"
 nesnd_per.5.d:0 "联络西秦地方势力的部署已经完成。朝廷准备以自身的名义经营中亚与印度，来自伊犁的号令将不再决定这条道路。"
 nesnd_per.6.a:0 "将照会交予各国。"
 nesnd_per.6.t:0 "边地照会"
 nesnd_per.6.d:0 "朝廷已正式申明对[SCOPE.sStateRegion('nesnd_per_claim_region').GetName]的权利。照会是递出去了，地到底归谁，还得靠外交和刀兵。"
 nesnd_per.7.a:0 "暂缓这次交涉。"
 nesnd_per.7.t:0 "强国的反对"
 nesnd_per.7.d:0 "关于[SCOPE.sStateRegion('nesnd_per_claim_region').GetName]的照会被强国拦了下来。要讨得这份承认，先得改变那里的外交局面。"
 nesnd_per_future_complete_tt:0 "“$nesnd_per_future_progress$”进度达到#v 100#!。"
 nesnd_per.4.d_unavailable:0 "朝廷已经定了西进，原定同伊犁的朝贡之约却没能成立。西边照样可以经营，只是兵和钱，都得自己去凑。"
 nesnd_per_border_claim_desc:0 "向邻州递交领土照会，为朝廷的扩张提出主张。"
