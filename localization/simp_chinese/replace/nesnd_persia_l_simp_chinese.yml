 dyn_c_per_arab_empire:0 "阿拉伯帝国"
 dyn_c_per_arab_empire_adj:0 "阿拉伯"
 nesnd_per.8.d_shia:0 "黑衣大食的巴格达、白衣大食的大马士革、绿衣大食的开罗，如今都挂上了唐衣的旗号。麦加的谢里夫遣使献上圣城的钥匙，什叶派的乌理玛却不肯为任何君主诵念哈里发的名号，只在讲坛上尊唐衣大食的君主为伊玛目的护持者。\n\n朝中的唐人说，这是秦国西进两百年未竟的功业，逊尼派的学者则痛陈圣城落入了异端之手。从今往后，天下的穆斯林都须回答：唐衣伊玛目国的诏令，作不作数？"
 nesnd_per.8.d_other:0 "黑衣大食的巴格达、白衣大食的大马士革、绿衣大食的开罗，如今都挂上了唐衣的旗号。朝廷没有向乌理玛索要任何名号，只在诏书上写下一个古老的字：唐。\n\n唐人说，西辽当年在河中立国，也不曾改从当地的信仰。乌理玛说，一个不拜真主的朝廷执掌圣城，是天下穆斯林的耻辱。西唐的诏令能行多远，要看它的兵能走多远。"
 nesnd_per.8.d_foreign:0 "巴格达、大马士革与开罗都已归入本朝版图。唐人当年的军府未竟之业，如今由新朝完成。圣城的钥匙送进了宫中，讲坛上诵念的是新的名号。\n\n旧日的唐衣已然褪色，远西的山河依旧。新朝要回答的是：凭什么维系这样辽阔的国度？"
 nesnd_per.9.t:0 "使团的国书"
 nesnd_per.9.d:0 "使团即将启程，朝廷还须决定这封国书交给谁。军中请遣使伊犁，求西秦派员整军，以备西征。熟悉中亚的商人则愿替朝廷走一趟，私下联络那些不肯再听命于伊犁的部族首领。"
