 nesnd_per_west_complete_conclusion:0 "从地中海岸到红海与阿曼湾，远西的土地都已归于唐衣之下。"
 dyn_c_per_tang_caliphate:0 "唐衣哈里发国"
 dyn_c_per_tang_caliphate_adj:0 "唐衣哈里发国"
 nesnd_per.8.t:0 "三衣归一"
 nesnd_per.8.d:0 "黑衣大食的巴格达、白衣大食的大马士革、绿衣大食的开罗，如今都挂上了唐衣的旗号。麦加的谢里夫遣使献上圣城的钥匙，主麻日的讲坛上，乌理玛为唐衣大食的君主诵念哈里发的名号。一位唐人的后裔，坐上了阿拔斯家族虚悬已久的位子。\n\n朝中的唐人说，这是秦国西进两百年未竟的功业，波斯人却说，这不过是又一顶戴在异族头上的冠冕。从今往后，天下的穆斯林都须回答一个问题：唐衣哈里发的诏令，作不作数？"
 nesnd_per.8.f:0 "“衣分三色，天下一家。”——巴格达新刻的碑铭"
 nesnd_per.8.a:0 "从此天方也在唐衣之下。"
 nesnd_per.8.a.tt:0 "国号随执政文化与国教改变：唐人奉逊尼为「$dyn_c_per_tang_caliphate$」，奉什叶为「$dyn_c_per_tang_imamate$」，奉其他宗教为「$dyn_c_per_western_tang$」，波斯人、阿拉伯人执政时另有名号。旗帜改为黑、白、绿三色旗。"
