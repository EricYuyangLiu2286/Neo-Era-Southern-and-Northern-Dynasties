 nesnd_palace.24.d_ousted:0 "宠臣[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]的人罗织罪名，[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]被捕入狱，随后被逐出[ROOT.GetCountry.GetNameNoFlag]。"
