 nesnd_palace.17.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]称病，请求[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]准其辞去职务回乡休养。各派都在猜这是真病还是以退为进。"
