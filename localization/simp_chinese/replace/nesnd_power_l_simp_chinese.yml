 nesnd_palace.21.d_b_escaped:0 "其余集团合谋除掉[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]，事机不密，[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]躲过了这一次。"
