 # Generated by WORK/reports/2026-11-11-court-power/loc_power.py
 nesnd_palace_journal:0 "宫廷力量"
 nesnd_palace_journal_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]身边从不缺少请托与进言的人。得宠之臣替[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]奔走，也替自己的亲信谋取官职和财路。[ROOT.GetCountry.GetName]最大的利益集团要么与宠臣分庭抗礼，要么干脆由宠臣本人统领。宠臣权势越大，政令越畅通，贪墨与怨恨也越多。"
 nesnd_palace_status_a:0 "宠臣[ROOT.GetCountry.GetCustom('nesnd_power_holder_name')]不是[ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]的领袖，该集团由[ROOT.GetCountry.GetCustom('nesnd_power_leader_name')]领导。权力平衡表示[ROOT.GetCountry.GetCustom('nesnd_power_holder_name')]一方与[ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]之间的消长。[ROOT.GetCountry.GetCustom('nesnd_power_relation_text')]平衡高于 #v 90#! 或低于 #v 10#! 时，满条的宫廷事件有可能演变为极端事件。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_palace_end_rules 失效条件#!#!"
 nesnd_palace_status_b:0 "宠臣[ROOT.GetCountry.GetCustom('nesnd_power_holder_name')]兼领[ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]。权力平衡表示这位大权臣与其余各派之间的消长。平衡高于 #v 90#! 或低于 #v 10#! 时，满条的宫廷事件有可能演变为极端事件。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_palace_end_rules 失效条件#!#!"
 nesnd_palace_status_vacant:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]尚未任命宠臣。宠臣权势每月流失，直到任命新的宠臣，届时权势保留一半。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_palace_end_rules 失效条件#!#!"
 nesnd_cabinet_journal:0 "执政者与派系"
 nesnd_cabinet_journal_reason:0 "[ROOT.GetCountry.GetName]的[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]凭选票与集团的支持掌权。社会中最大的派系未必在野，常常就是执政联盟中的同僚。理念相近时合作顺畅，却可能被对方逐渐取而代之。理念相左时，对方便处处掣肘。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]的权势越大，施政越顺手，酬庸亲信的机会也越多。"
 nesnd_cabinet_status_a:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]不是最大[concept_interest_group]的领袖。派系平衡表示[ROOT.GetCountry.GetRuler.GetFullName]一方与[ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]的领袖[ROOT.GetCountry.GetCustom('nesnd_power_leader_name')]之间的消长。[ROOT.GetCountry.GetCustom('nesnd_power_relation_text')]平衡高于 #v 90#! 或低于 #v 10#! 时，满条的政潮有可能演变为极端事件。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_cabinet_end_rules 失效条件#!#!"
 nesnd_cabinet_status_b:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFullName]兼领[ROOT.GetCountry.GetCustom('nesnd_power_top_ig_name')]。派系平衡表示[ROOT.GetCountry.GetRuler.GetFullName]与其余各派之间的消长。平衡高于 #v 90#! 或低于 #v 10#! 时，满条的政潮有可能演变为极端事件。\n#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_cabinet_end_rules 失效条件#!#!"
