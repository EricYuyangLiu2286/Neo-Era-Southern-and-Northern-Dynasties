 nesnd_palace.11.d_b:0 "兼领[SCOPE.sCharacter('nesnd_power_holder_scope').GetInterestGroup.GetName]的宠臣[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]在[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]面前斥责其他集团的代表，要他们撤回对其亲信的指控。被斥责的一方等着[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]主持公道。"
 nesnd_palace.11.f:0 "“今日君前议事，有人当廷争执，诸臣皆不敢言。”\n——宫廷日志"
