 nesnd_palace.12.d_b:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]的亲信在[ROOT.GetCountry.GetNameNoFlag]几处税关包揽征收，多收的部分落入私囊。其余集团不敢公开抗议，只把账目悄悄送给了[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]。"
