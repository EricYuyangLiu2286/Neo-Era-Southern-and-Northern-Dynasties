 nesnd_cabinet.16.b:0 "撤回预算"
 nesnd_cabinet.17.t:0 "健康传闻"
 nesnd_cabinet.17.d_a:0 "坊间传言[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]身染重病，[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]已在物色继任者。"
 nesnd_cabinet.17.d_b:0 "坊间传言[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]身染重病，执政党内已有人暗中串联。"
 nesnd_cabinet.17.f:0 "“外间所传执政者病重一事，本报尚未得到证实。”\n——报纸的消息"
 nesnd_cabinet.17.a:0 "公开露面"
 nesnd_cabinet.17.b:0 "委托副手理事"
 nesnd_cabinet.21.t:0 "行刺执政者"
 nesnd_cabinet.21.d_dead:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]在公开场合遇刺身亡。凶手的来历众说纷纭。"
 nesnd_cabinet.21.d_wounded:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]在公开场合遇刺，身负重伤，但保住了性命。"
 nesnd_cabinet.21.d_escaped:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]在公开场合遭人行刺，刺客失手被擒。"
 nesnd_cabinet.21.f:0 "“今日执政者在公开场合遇刺。凶手的身份正在调查。”\n——报纸号外"
 nesnd_cabinet.21.a:0 "戒严严查"
 nesnd_cabinet.21.b:0 "照常施政"
 nesnd_cabinet.22.t:0 "不信任风潮"
 nesnd_cabinet.22.d:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]在议会内外鼓动不信任案，要求[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]提前改选。"
 nesnd_cabinet.22.f:0 "“本院对现政府不予信任，要求提前改选。”\n——不信任案案文"
 nesnd_cabinet.22.a:0 "提前改选"
 nesnd_cabinet.22.b:0 "坚持到任期届满"
 nesnd_cabinet.23.t:0 "强人专断"
 nesnd_cabinet.23.d:0 "兼领最大利益集团的[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]打算绕开议会，以行政命令推行政策。"
 nesnd_cabinet.23.f:0 "“兹以行政命令施行下列政策，不再提交议会审议。”\n——政府的行政命令"
 nesnd_cabinet.23.a:0 "绕开议会"
 nesnd_cabinet.23.b:0 "回到议会"
 nesnd_cabinet.24.t:0 "派系领袖的厄运"
 nesnd_cabinet.24.d_dead:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]遇刺身亡。执政党的人被指为幕后主使，[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]矢口否认。"
 nesnd_cabinet.24.d_ousted:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]被控叛国，被捕后逐出国境。"
 nesnd_cabinet.24.d_escaped:0 "有人图谋加害[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]，[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]察觉后避居外地，安然无恙。"
 nesnd_cabinet.24.f:0 "“反对派领袖一事，各方说法不一，本报将续有报道。”\n——报纸的消息"
 nesnd_cabinet.24.a:0 "彻查此案"
 nesnd_cabinet.24.b:0 "敷衍了事"
 nesnd_cabinet.26.t:0 "调查派系领袖"
 nesnd_cabinet.26.d_success:0 "调查找到了[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]的把柄。[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]被定罪后逐出国境。"
 nesnd_cabinet.26.d_fail:0 "调查拿不出实据，[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]安然无恙。[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]指责政府构陷。"
 nesnd_cabinet.26.f:0 "“对反对派领袖的调查已经结束，结论随后公布。”\n——政府公报"
 nesnd_cabinet.26.a:0 "事已至此"
 nesnd_palace_end_rules:0 "出现以下任一情况时，本日志暂停，日志带来的修正随之撤销，三项数值保留：\n- 国家等级不再是帝国或霸权\n- 改行共和政体（改由「执政者与派系」接续，权势保留三成）\n- 权力分配不再允许任命宠臣（如改行财产投票或普选）\n- 开启明内战、维持拿破仑王朝、宫廷与外省或伊犁的朝议日志\n条件恢复后日志自动重新开始。"
 nesnd_cabinet_end_rules:0 "出现以下任一情况时，本日志暂停，日志带来的修正随之撤销，三项数值保留：\n- 国家等级不再是帝国或霸权\n- 不再是共和政体（若可任命宠臣，改由「宫廷力量」接续，权势保留三成）\n- 开启明内战、维持拿破仑王朝、宫廷与外省或伊犁的朝议日志\n条件恢复后日志自动重新开始。"
 nesnd_palace.31.t:0 "宠臣的生日宴会"
 nesnd_palace.31.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]举办生日宴会，各部官员与地方长官的贺礼堆满了宅邸。[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]的亲信都在等着看[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]会不会亲临。"
 nesnd_palace.31.f:0 "“各部官员与地方长官所送贺礼，开列于后。”\n——宠臣府上的礼单"
 nesnd_palace.31.a:0 "亲临赴宴"
 nesnd_palace.31.b:0 "遣人致贺"
 nesnd_palace.31.c:0 "托故不往"
 nesnd_palace.32.t:0 "使节的门路"
 nesnd_palace.32.d:0 "一位外国使节绕开[ROOT.GetCountry.GetNameNoFlag]的外交部门，托[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]代为向[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]转达其本国政府的要求，并奉上了一份厚礼。"
 nesnd_palace.32.f:0 "“敝国政府有所请求，敬烦阁下代为转达君上。另附薄礼一份。”\n——外国使节致宠臣的信"
 nesnd_palace.32.a:0 "准其代为转达"
 nesnd_palace.32.b:0 "令其循正式途径递交"
 nesnd_palace.33.t:0 "宠臣插手军职"
 nesnd_palace.33.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]向[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]举荐几名亲信出任要地的指挥官，军中将领联名反对。"
 nesnd_palace.33.f:0 "“军职任免，向由军中议定。今宫廷举荐之人，我等不能接受。”\n——将领联名的抗议书"
 nesnd_palace.33.a:0 "准其所荐"
 nesnd_palace.33.b:0 "军职由军中自定"
 nesnd_palace.34.t:0 "地方长官的密报"
 nesnd_palace.34.d:0 "一位地方长官向[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]呈递密报，列举[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]的亲信在地方上的种种不法。"
 nesnd_palace.34.f:0 "“宠臣亲信在本地有种种不法，详列于后。”\n——地方长官的密报"
 nesnd_palace.34.a:0 "压下不发"
 nesnd_palace.34.b:0 "令宠臣自辩"
 nesnd_palace.34.c:0 "交调查官员核实"
 nesnd_palace.35.t:0 "救济之争"
 nesnd_palace.35.d:0 "[ROOT.GetCountry.GetNameNoFlag]有地方发生动乱，政府要拨款救济。[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]请求[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]让其亲信经手这笔赈款。"
 nesnd_palace.35.f:0 "“地方动乱，灾民待赈。请准由臣所荐之人经手赈款。”\n——宠臣的请求"
 nesnd_palace.35.a:0 "交宠臣的亲信经办"
 nesnd_palace.35.b:0 "交主管部门经办"
 nesnd_palace.41.t:0 "私人卫队"
 nesnd_palace.41.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]以防备刺客为名，在宅邸周围养了一支卫队，人数已经不少于[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]的宫廷卫队。"
 nesnd_palace.41.f:0 "“宠臣宅邸周围所驻卫队，人数已不少于宫廷卫队。”\n——宫廷卫队长的报告"
 nesnd_palace.41.a:0 "默许"
 nesnd_palace.41.b:0 "勒令解散"
 nesnd_palace.41.c:0 "收编为宫廷卫队"
 nesnd_palace.42.t:0 "大臣抵制议事"
 nesnd_palace.42.d:0 "多名大臣称病不出席议事，并告诉[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_ruler_scope').GetFullName]，[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]一日不去，他们一日不回。"
 nesnd_palace.42.f:0 "“宠臣一日不去，臣等一日不回。”\n——大臣们联名的奏疏"
 nesnd_palace.42.a:0 "罢免宠臣"
 nesnd_palace.42.b:0 "强令大臣复职"
 nesnd_palace.42.c:0 "宠臣闭门谢客"
 nesnd_cabinet.31.t:0 "议员倒戈"
 nesnd_cabinet.31.d:0 "几名执政党议员转投[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]，执政党在议会的多数岌岌可危。"
 nesnd_cabinet.31.f:0 "“昨日又有几名执政党议员宣布退党，转投[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]。执政党在议会的多数已岌岌可危。”\n——报纸的议会通讯"
 nesnd_cabinet.31.a:0 "许以官职挽留"
 nesnd_cabinet.31.b:0 "开除党籍"
 nesnd_cabinet.32.t:0 "地方选举失利"
 nesnd_cabinet.32.d:0 "几个大州的地方选举中，[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]所属的一方接连落败。"
 nesnd_cabinet.32.f:0 "“几个大州的地方选举结果已经揭晓，执政一方在多处落败。”\n——报纸的选举报道"
 nesnd_cabinet.32.a:0 "承认结果"
 nesnd_cabinet.32.b:0 "指控舞弊"
 nesnd_cabinet.33.t:0 "外交质询"
 nesnd_cabinet.33.d:0 "[SCOPE.sCharacter('nesnd_power_leader_scope').GetInterestGroup.GetName]的领袖[SCOPE.sCharacter('nesnd_power_leader_scope').GetFullName]在议会质询政府的外交政策，要求[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]亲自答复。"
 nesnd_cabinet.33.f:0 "“本院就政府的外交政策提出质询，请执政者亲自答复。”\n——议会质询书"
 nesnd_cabinet.33.a:0 "闭门答复"
 nesnd_cabinet.33.b:0 "公开答辩"
 nesnd_cabinet.34.t:0 "工潮"
 nesnd_cabinet.34.d:0 "几座工业城市的工人罢工，要求加薪与缩短工时。工厂主请政府出面恢复秩序。"
 nesnd_cabinet.34.f:0 "“我们要求增加工资，缩短工时。在得到答复以前，工厂不复工。”\n——罢工工人的声明"
 nesnd_cabinet.34.a:0 "出动警察"
 nesnd_cabinet.34.b:0 "居间调解"
 nesnd_cabinet.35.t:0 "党魁之争"
 nesnd_cabinet.35.d:0 "[SCOPE.sCharacter('nesnd_power_holder_scope').GetInterestGroup.GetName]内部有人公开挑战[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]的领导地位。"
 nesnd_cabinet.35.f:0 "“本党领导地位问题，应提交党内大会表决。”\n——党内反对派的公开信"
 nesnd_cabinet.35.a:0 "压下挑战"
 nesnd_cabinet.35.b:0 "公开竞争"
 nesnd_cabinet.41.t:0 "军方干政"
 nesnd_cabinet.41.d:0 "政局僵持不下，几位将领联名通电，要求各派以国事为重，并暗示军队不会坐视。"
 nesnd_cabinet.41.f:0 "“政局僵持，国事危殆。望各派以国家为重，速谋解决。军人职在卫国，不能坐视。”\n——将领联名通电"
 nesnd_cabinet.41.a:0 "安抚军方"
 nesnd_cabinet.41.b:0 "撤换将领"
 nesnd_cabinet.42.t:0 "街头对峙"
 nesnd_cabinet.42.d:0 "反对[SCOPE.sCharacter('nesnd_power_holder_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]的群众占据了首都的广场，执政党的支持者也聚集在对面。"
 nesnd_cabinet.42.f:0 "广场上两边都举着国旗。"
 nesnd_cabinet.42.a:0 "戒严驱散"
 nesnd_cabinet.42.b:0 "让步"
 nesnd_cabinet.42.c:0 "静观其变"
 nesnd_power_n_holder:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_holder').GetCharacter.GetFullName]"
 nesnd_power_n_leader:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_leader').GetCharacter.GetFullName]"
 nesnd_power_n_leader_generic:0 "最大利益集团的领袖"
 nesnd_power_n_holder_ig:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_holder_ig').GetInterestGroup.GetName]"
 nesnd_power_n_holder_ig_generic:0 "当权者所属的集团"
 nesnd_power_n_top_ig:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_top_ig').GetInterestGroup.GetName]"
 nesnd_power_n_top_ig_generic:0 "最大利益集团"
 nesnd_power_n_holder_side:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_power_holder').GetCharacter.GetFullName]一方"
 nesnd_power_relation_aligned:0 "两派理念相近，合作顺畅，但最大派系也在逐渐吸纳当权一方的支持者。"
 nesnd_power_relation_opposed:0 "两派理念相左，最大派系处处掣肘。"
 nesnd_power_relation_mixed:0 "两派理念不尽相同。"
