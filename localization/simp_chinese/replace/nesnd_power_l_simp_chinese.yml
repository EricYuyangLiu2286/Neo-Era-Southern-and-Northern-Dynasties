 nesnd_palace.16.d_b:0 "[ROOT.GetCountry.GetNameNoFlag]国库入不敷出。[SCOPE.sCharacter('nesnd_power_holder_scope').GetFullName]建议[SCOPE.sCharacter('nesnd_power_ruler_scope').GetPrimaryRoleTitle]加征一笔临时税，由其亲信经办。"
