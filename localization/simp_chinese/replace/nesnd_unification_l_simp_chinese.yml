l_simp_chinese:
 nesnd_uni_trend:0 "天下一统之大势"
 nesnd_uni_trend_reason:0 "1433年宣德帝驾崩以后，中洲四百年来再没有一个能号令全境的朝廷。燕、秦、明三朝各以统一天下为名穷兵黩武，最终激起了[Glossary('glossary_nesnd_chinese_revolution','中华大革命')]。1816年，中华联邦把“混一寰宇，再兴国族”定为最终目标，1820年开始的[Glossary('glossary_nesnd_southern_campaign','南征')]却在襄阳城下失败。\n\n1835年的[Glossary('glossary_nesnd_treaty_of_yangzhou','扬州条约')]让南北两朝划江而治，西秦退守伊犁。但是，大小诸侯仍在各自的地盘上整军经武，统一天下的理想没有随着停战消失。"
 nesnd_uni_trend_status_none:0 "尚无争霸国家完整据有任何中洲地区。"
 nesnd_uni_trend_status_order:0 "#bold 定乱向治#!：#v [GetGlobalVariable('nesnd_uni_rivals').GetValue|0]#!国争霸，[GetGlobalVariable('nesnd_uni_leader').GetCountry.GetName]居于领先。"
 nesnd_uni_trend_status_tripod:0 "#bold 鼎足之势#!：#v [GetGlobalVariable('nesnd_uni_rivals').GetValue|0]#!国争霸，[GetGlobalVariable('nesnd_uni_leader').GetCountry.GetName]居于领先。"
