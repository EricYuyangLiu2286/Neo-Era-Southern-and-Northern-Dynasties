 nesnd_uni_country_concluded:0 "逐鹿"
 nesnd_uni_country_reason_cn:0 "[Glossary('glossary_nesnd_treaty_of_yangzhou','扬州条约')]签订以后，南北暂息兵戈，可是[ROOT.GetCountry.GetName]的军人、士绅和报人仍然相信分裂的时代终将结束，只是谁也不愿让别人来结束它。军官想要战功，商人想要撤去关卡，文人在策论里重提“大一统”。"
 nesnd_uni_country_reason_out:0 "中原王朝久不能定乱向治，纷争早已越过中洲的边界，牵动着[ROOT.GetCountry.GetName]的商路、移民和边防。六百年前，蒙古人从漠北南下时，面对的同样是一个南北分立的中洲。"
