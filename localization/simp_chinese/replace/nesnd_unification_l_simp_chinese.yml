 nesnd_uni.1.d:0 "多年来，[SCOPE.sStateRegion('nesnd_uni_lost_region').GetName]只出现在[ROOT.GetCountry.GetName]的公文和报章上，没有一兵一卒为它越过边界。国内渐渐很少再有人提起这片土地，政府也不再把它列为本国的领土要求。"
