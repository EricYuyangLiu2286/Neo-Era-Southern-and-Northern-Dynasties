l_simp_chinese:
 nesnd_board_ming_bar_name:0 "朱明统绪"
 nesnd_board_wu_bar_name:0 "郑氏新政"
 nesnd_board_ming_bar_desc:0 "统绪支持：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_wu_bar_desc:0 "新政基础：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_compact_bar_name:0 "诸府盟约"
 nesnd_board_compact_bar_desc:0 "中央所选路线的有效盟书：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_south_politics_summary:0 "#bold 宗盟分组#!：大陆#v 50#!、海外#v 30#!、日本#v 20#!；按各组有效代表权重归一。外国援助者不计宗盟票。\n#bold 共同基础#!：财政行政#v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!，政府合作#v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!。合法朱氏君主提供统绪#v 20#!；吴方军务投射提供#v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!。\n#bold 有效盟书#!：拥明#v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!；拥吴#v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!。本国路线已通过连续月度核验#v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#!次；实际履约期另须满#v 12个月#!，条件每周复核。\n和平须本国明确选定路线、政治分至少#v 85#!且领先#v 20#!。明廷须盟书#v 75%#!及两大陆核心签署；吴朝须#v 80%#!、全部拟整合国与日本方面同意、真实海军配员和维护达标。"
 nesnd_south_offer_accord:0 "遣使议约"
 nesnd_south_offer_accord_desc:0 "依照本国选定的路线，将朝廷与诸府的约章送交各国作答。"
 nesnd_south_offer_available_tt:0 "选择拥明或拥吴，尚未决裂；本国未违约且不在战争中，邀请冷却结束，并有具备答复条件的帝国成员。"
 nesnd_south_accord_offer_tt:0 "向可参与的诸国提出盟书。对方自行决定接受或拒绝。邀请冷却#v 6个月#!；议约期间政府工资#n +3%#!、[concept_authority]#n −25#!。"
 nesnd_south_accord_accept_tt:0 "本国明确支持此路线，签署有效#v 36个月#!的盟书；立场在#v 6个月#!内固定。改变立场、对吴交战、改投其他宗主或盟书到期时，签署失效。吴方大陆条款包括中国范围州省整合；日本条款包括让出本国实际持有的四国及九州，保留其他辖地。 与中央关系#p +15#!。"
 nesnd_south_leave_accord:0 "退出盟书"
 nesnd_south_leave_accord_desc:0 "撤回本国的政治承诺，重新决定与朝廷的关系。"
 nesnd_south_accord_leave_tt:0 "停止计入有效盟书，撤销尚未执行的整合或割地同意；与中央关系#n −15#!，换派冷却#v 6个月#!。"
 nesnd_board_stance_effect_tt:0 "记录本国的新立场，撤回与之不符的既有盟书；#v 6个月#!内不能再次更改。 已签盟书的成员同时撤销尚未执行的整合或割地同意，与中央关系#n −15#!。"
 nesnd_south_retry_confrontation:0 "再提诸府交涉"
 nesnd_south_retry_confrontation_desc:0 "此前外交程序未能建立对峙。按现存国家和反对联盟重新提出要求。"
 nesnd_south_accords.1.t:0 "诸府约章"
 nesnd_south_accords.1.ming:0 "内阁将新编的盟书送到了[ROOT.GetCountry.GetName]。朱氏天子继续主持国政，各府保留自己的政府、领土和既有法制，以共同的朝廷协调诸邦事务。随文送来的还有一册任官与赋额的议事记录。来使要带回本国的正式答复，好让这些条款在日后的朝会上有据可循。"
 nesnd_south_accords.1.integration:0 "郑氏的使者带来了改设州省的议案。参加新朝的大陆诸邦将交出中国范围内的辖地，由中央统一施政，原有田契、工坊和人口仍留在当地。地方官员须将各衙署的簿册逐项移交。使者要求在文书上写明同意的范围，署名用印以后，再由朝廷与各府共同等候改制。"
 nesnd_south_accords.1.japan:0 "南朝使团把新的东洋安排交到了本国政府手中。议案要求日本诸政权承认吴朝的新秩序，并将本国实际持有的四国、九州辖地交由吴朝直接治理。剩余领土仍由本国政府管理。使者正在等候答复，港口与军府也已收到核清所属辖地的命令。"
 nesnd_south_accords.1.overseas:0 "新朝的国书沿航路送到了[ROOT.GetCountry.GetName]。使者请本国承认郑氏的名位，继续维持现有的政府、辖地和宗属安排。港务、贸易与军费仍依各项具体条约处理。这份盟书记录的是政治承诺，各项开支与货物往来还要由有关衙署分别议定。"
 nesnd_south_accords.1.a:0 "署名用印，承认约章。"
 nesnd_south_accords.1.b:0 "接受州省整合条款。"
 nesnd_south_accords.1.c:0 "接受东洋秩序与割地条款。"
 nesnd_south_accords.1.d:0 "暂不签署。"
 nesnd_south_accords.20.t:0 "重订宗盟"
 nesnd_south_accords.20.d:0 "诸府的盟书已在内阁归档。过去一年的交涉使新的赋额与议事规程逐渐站稳，地方政府也开始依照共同承认的朝廷安排行政。朱氏的帝统有了继续施政的依凭。天子将颁布重订宗盟的诏书，把这份持续履行的约定传示诸邦。"
 nesnd_south_accords.20.a:0 "颁诏重订宗盟。"
 nesnd_south_accords.21.t:0 "建制之议"
 nesnd_south_accords.21.d:0 "各府已将同意改制的文书送达中央，海外与日本方面的答复也列入了议案。过去一年的履约使军饷、政务与航路维持了运转。吴王府将新朝的名位和州省规制一并提交，准备依照已接受的条款接收辖地、颁发印信。"
 nesnd_south_accords.21.a:0 "依约建立吴朝。"
 nesnd_south_accords.reconsider:0 "继续商议，重新计算履约期。"
 nesnd_south_ming_peace_result_tt:0 "保全真实朱氏君主与明廷国号；各成员保留现有领土、政府和经济法律。中央承担#v 10年#!宗盟约束；已履约者按结算时的军政筹备获得有期限的声望奖励。"
 nesnd_south_wu_peace_result_tt:0 "建立吴朝，并整合明确同意且控制本地的中国范围辖地。海外国家保留本国及海外领土；日本仅转让自己实际持有的四国、九州。整国并入的玩家成员若已同意且中央无人类玩家，则转为执掌吴朝。新并入州承担#v 12个月#!过渡成本。"
 nesnd_south_accords.22.t:0 "宗盟既定"
 nesnd_south_accords.22.d:0 "诏书已经颁下，各府的署名与印信汇入了同一册盟书。朱氏天子继续主持南朝国政，地方政府依约办理本地事务。新约带来的议事与财政义务将长期留在朝廷的簿册中，日后的建设和外交也须从这个秩序出发。"
 nesnd_south_accords.23.t:0 "吴朝立国"
 nesnd_south_accords.23.d:0 "新朝的印信送到了接受改制的州省。府库和军署交接簿册，海外政府换发承认新朝的国书，日本割让的辖地也开始更换官署。郑氏用多年掌握的军财与航路支撑起了新的名位。接下来的施政，将由朝廷对已经许下的条款负责。"
 nesnd_south_accords.done:0 "依约施行。"
 nesnd_south_negotiation_cost:0 "诸府议约"
 nesnd_south_accord_respected:0 "践行宗盟"
 nesnd_south_prepared_member:0 "军政有备"
 nesnd_south_prepared_mobilization:0 "有备奉调"
 nesnd_south_hasty_mobilization:0 "仓促奉调"
 nesnd_south_peace_administration:0 "和平建制"
 nesnd_south_new_province:0 "州省交接"
 nesnd_south_ready_unknown:0 "军政筹备：尚未核定。"
 nesnd_south_ready_known:0 "军政筹备 #v [Country.MakeScope.Var('nesnd_ready_total').GetValue|1]/100#!（财政[Country.MakeScope.Var('nesnd_ready_finance').GetValue|1]/20，军务[Country.MakeScope.Var('nesnd_ready_military').GetValue|1]/35，供给[Country.MakeScope.Var('nesnd_ready_supply').GetValue|0]/25，政府[Country.MakeScope.Var('nesnd_ready_domestic').GetValue|1]/20）\n水手 #v [Country.MakeScope.Var('nesnd_ready_actual_crew').GetValue|D]#!；配员达标舰 #v [Country.MakeScope.Var('nesnd_ready_ships_ready').GetValue|0]/[Country.MakeScope.Var('nesnd_ready_ships').GetValue|0]#!；海军投射 #v [Country.MakeScope.Var('nesnd_ready_naval_projection').GetValue|1]#!。"
 nesnd_south_compact_detail_tt:0 "诸府盟约按对方真实接受且尚有效的承诺计算。大陆、海外、日本三组分别占#v 50/30/20#!权重，组内按约定代表权重归一。盟书有效#v 36个月#!；改宗主、改立场、交战或撤约都会重算。和平条件须连续满足#v 12个月#!，旧议约数值不会直接判定胜利。"
 nesnd_board_country_metrics:0 "常备营 #v [Country.GetRegularBattalions|0]#! / 可动员 #v [Country.CalcConscriptableBattalions|0]#!　舰船 #v [Country.GetNumShips|0]#!\n固定收支 @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　陆军力量 #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\n供给准备：[Country.GetCustom('nesnd_board_supply_loc')]\n[Country.GetCustom('nesnd_south_ready_loc')]"
 nesnd_south_failed_alignment:0 "失据之盟"
