l_simp_chinese:
 nesnd_india_foreign_affairs:0 "印度事务"
 nesnd_india_foreign_affairs_reason:0 "$region_north_india$、$region_south_india$的各国政府，以及不丹和尼泊尔，常有事务要请别国政府答复。它们请对方出资兴办[GetBuildingType('building_university').GetName]、[GetBuildingType('building_tooling_workshop').GetName]或[GetBuildingType('building_railway').GetName]，出资的政府可以取得产权。它们与别国商订[concept_trade_privilege]、[concept_military_access]或[concept_treaty_port]的[concept_treaty]。莫卧儿向宗主国借款或赎回附属关系，遇灾的国家向莫卧儿或宗主国求援。附属国让别国政府取得产权或军事通行权，或者要脱离宗主国、加入莫卧儿或承继它的帝国，都须先经[concept_overlord]许可，[concept_puppet]提出任何一件事务都须先经许可。现在有一件这样的事务，等候[ROOT.GetCountry.GetName]答复。"
 nesnd_india_matter_status_consent_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：聘请[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]的工程人员考察并培训工匠，由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]支付 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]。"
 nesnd_india_matter_status_consent_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，资助在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]不取得产权。"
