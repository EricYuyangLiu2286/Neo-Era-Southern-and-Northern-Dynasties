 nesnd_india_frontier_status_answer_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国给予[concept_trade_privilege]。我国签约时一次付给[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，[concept_treaty]的[concept_binding_period]为五年。条约生效后，由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]承担[concept_trade_privilege]条款 @inf!#v [GetArticleType('trade_privilege').GetCost|0]#! 的[concept_influence]基础维护费用。此事由我国自行决定。"
