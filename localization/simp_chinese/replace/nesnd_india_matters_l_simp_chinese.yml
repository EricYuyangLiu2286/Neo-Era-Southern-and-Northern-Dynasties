l_simp_chinese:
 nesnd_india_foreign_affairs:0 "印度事务"
 nesnd_india_foreign_affairs_reason:0 "$region_north_india$、$region_south_india$的各国政府常有事务要请别国政府答复。它们请对方出资兴办[GetBuildingType('building_university').GetName]、[GetBuildingType('building_tooling_workshop').GetName]或[GetBuildingType('building_railway').GetName]，出资的政府可以取得产权。莫卧儿向宗主国出售或买回产业，遇灾的国家向莫卧儿或宗主国求援。[concept_subject]国让别国政府取得产权，或者要脱离宗主国、加入莫卧儿或承继它的帝国，都须先经[concept_overlord]许可，[concept_puppet]提出任何一件事务都须先经许可。现在有一件这样的事务，等候[ROOT.GetCountry.GetName]答复。"
 nesnd_india_matter_status_consent_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：聘请[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]的工程人员考察并培训工匠，由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]支付 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]。"
 nesnd_india_matter_status_consent_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，资助在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]不取得产权。"
 nesnd_india_matter_status_consent_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求我国许可：由[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]，产权归[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]政府。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]是我国的[concept_subject]国，此事须经我国许可。"
 nesnd_india_matter_status_fund_survey:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]愿支付 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，聘请我国的工程人员前往考察，并培训当地工匠。"
 nesnd_india_matter_status_fund_grant:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请我国政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，资助在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]。我国不取得产权。"
 nesnd_india_matter_status_fund_stake:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请我国政府拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，在[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_project_site').GetState.GetName]兴办[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetCustom('nesnd_india_project_name')]。一级建筑立即落成，产权归我国政府。"
 nesnd_india_union_status_consent_ask_dominion:0 "我国的[concept_subject][ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求成为[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]的[concept_dominion]，将脱离我国。我国许可以后，请求才送到[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]，[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]可以同意，也可以婉拒。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]同意时，付给我国 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] 的补偿。"
 nesnd_india_union_status_consent_ask_merge:0 "我国的[concept_subject][ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求并入[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]，将脱离我国。我国许可以后，请求才送到[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]，[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]可以同意，也可以婉拒。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]同意时，付给我国 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] 的补偿。"
 nesnd_india_union_status_consent_invite:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]邀请我国的[concept_subject][ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]加入，愿意付给它 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] 的安置费。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]若接受，将脱离我国，并入[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]或成为[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]的[concept_dominion]。我国许可以后，邀请才送到[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]，[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]仍可以婉拒。[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]接受时，[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]付给我国 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] 的补偿。"
 nesnd_mug_status_answer_9:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]有 #v [ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.ScriptValue('nesnd_mug_famine_states')|0]#! 个州遭遇[concept_harvest_condition]，农田减产，请求我国拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] 赈济。"
 nesnd_mug_status_consent_9_1:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]是我国的[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetSubjectType.GetName]，有州遭遇[concept_harvest_condition]，请求[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] 赈济。此事须经我国许可，许可以后才送交对方。"
 nesnd_mug_status_consent_9_2:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]有州遭遇[concept_harvest_condition]，请求我国的[Concept('concept_subject', '$concept_subjects|q$')][ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.MakeScope.Var('nesnd_india_matter_to').GetCountry.GetName]拨款 @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K] 赈济。对方出这笔钱须经我国许可。"
