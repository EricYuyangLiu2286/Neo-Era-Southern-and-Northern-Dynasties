 nesnd_india_frontier_status_answer_4:0 "[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]请求两国之间的[concept_trade_privilege]条约续约，[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName]继续从我国获得这项特权，到期日顺延五年。续约时我国付给[ROOT.GetCountry.MakeScope.Var('nesnd_india_matter_from').GetCountry.GetName] @money![ROOT.GetCountry.MakeScope.ScriptValue('nesnd_india_matter_quote')|K]，是签约时价钱的一半。[concept_binding_period]不随之延长。此事由我国自行决定。"
