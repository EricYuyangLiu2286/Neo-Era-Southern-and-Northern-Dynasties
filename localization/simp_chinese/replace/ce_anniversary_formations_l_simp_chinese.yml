l_simp_chinese:
 je_confederation_of_the_rhine_reason: "从1806年到1828年，在拿破仑·波拿巴的设计下，许多德意志邦国被统一在一个政府下——#bold 莱茵邦联#!。在这个体系下，拿破仑通过代理人巩固了对德意志的控制，遏制了#bold 普鲁士#!和#bold 奥地利#!的力量。然而，随着邦联自身的经济问题和拿破仑身体状况的恶化和罗马王对其他强国的妥协。邦联的统一被破坏，许多邦国恢复独立并给普鲁士的关税同盟计划留了可乘之机。但罗马王的时代也远去了！[SCOPE.sCountry('rhine_overlord').GetName]必须重整邦联事态，以确保德意志人不会成长为大陆霸权的威胁。"

 je_confederation_of_the_rhine_confederate_button: "恢复邦联"
 je_confederation_of_the_rhine_confederate_button_desc: "随着普鲁士同盟的垮台，我们将恢复统一的#bold 莱茵邦联#!，遏制德意志强国在该地区的野心。"

 formation.20.d: "为了对抗奥地利和普鲁士对其土地的图谋，众多德意志国家团结起来组成邦联，重建了[ROOT.GetCountry.GetName]。邦联团结一致，以在敌人面前维护主权。"
 formation.20.f: "拿破仑去世近十年之后，整个欧洲依然可以感受到他的影响力。这个邦联只是他宰割欧洲的众多计划之一。也许在法兰西帝国的控制之外，邦联可以发挥更崇高的作用。"
 formation.20.a: "敬德意志莱茵！"
