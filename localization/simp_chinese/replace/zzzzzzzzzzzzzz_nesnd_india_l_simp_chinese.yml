l_simp_chinese:
 nesnd_india_imperial_army:0 "印度帝国军"
 nesnd_india_reform:0 "德里的朝廷"
 nesnd_india_reform_reason:0 "莫卧儿的旧帝国曾靠君主的声望维系各省，如今的统治者却必须面对新的问题。法国商人与教官带来了财富和新式兵器，也带来了新的债主。国家需要自己的学校和工场，让地方的赋税变成能够保卫它的力量。"
 nesnd_india_reform_status:0 "朝廷正在筹办学校与工场。"
 nesnd_india_schools:0 "学校与官署"
 nesnd_india_schools_reason:0 "帝国需要能看懂账簿的官员，也需要能教会下一代读书的人。德里的一所学院无法代替各省的学校；纸张、教师与稳定的经费，必须一同送到地方。"
 nesnd_india_industry:0 "工场与军队"
 nesnd_india_industry_reason:0 "孟加拉的织物远销海外，帝国军队却仍仰赖旧式武备。矿井、工具厂和铁路将把这些分散的财富联系起来。朝廷的军工不必包办所有买卖，但不能只在名册上存在。"
 nesnd_india_school_service:0 "各省学务"
 nesnd_india_industrial_service:0 "帝国工场"
 nesnd_india_society:0 "王朝与印度"
 nesnd_india_society_reason:0 "生活在同一个国家里，不代表人们已经把彼此看作同胞。各省有自己的语言、信仰和旧日王公。随着学校与城市的发展，他们开始讨论谁有权代表印度。王朝、地方领袖和新兴的国民力量，都必须回答这个问题。"
 nesnd_india_society_status:0 "各省正在寻找共同的政治归属。"
 nesnd_india_dynasty_bar:0 "王朝接受度"
 nesnd_india_community_bar:0 "印度共同体"
 nesnd_india_dynasty_legitimacy:0 "朝廷的合法性"
 nesnd_india_dynasty_religion:0 "宗教待遇"
 nesnd_india_dynasty_dependence:0 "对法国的依赖"
 nesnd_india_community_education:0 "学校与识字"
 nesnd_india_community_representation:0 "政治参与"
 nesnd_india_community_unrest:0 "失序与歧视"
 nesnd_india_caste:0 "身份与公职"
 nesnd_india_caste_reason:0 "学校的大门已经打开，旧有身份仍决定着人们能够走多远。让军官与官员凭才干任职，需要改变成文法律，也需要把教育送到原先被排斥的家庭。"
 nesnd_india_equal_service:0 "公职开放"
 nesnd_india_princes:0 "诸邦之间"
 nesnd_india_princes_reason:0 "德里、南京与巴黎都向印度诸邦递出了自己的条件。王公们所要保住的不只是祖传的宫殿，还有土地、税收和决定本国命运的权力。合作可以带来援助，却不一定带来自主。"
 nesnd_india_princes_status:0 "本国的主权与地方利益仍待守护。"
 nesnd_india_usm:0 "天竺的土地"
 nesnd_india_usm_reason:0 "南朝在印度的领地隔海相望，商人、驻军与地方王公各有利益。南京可以派遣官员直接治理，也可以把这些土地交给另设的宣慰司。无论采用何种制度，当地人的生计都不会因为一道任命而自行改善。"
 nesnd_india_usm_status:0 "海路把天竺与南朝的市场联系起来。"
 nesnd_india_unified:0 "印度的新秩序"
 nesnd_india_unified_reason:0 "统一使许多边界从地图上消失，却没有消除各省的差别。新的国家必须把税收、教育与公共事务维持下去，让共同的法律在宫廷以外也具有意义。"
 nesnd_india_unified_reward:0 "共同的国家"
 nesnd_india_choose_schools:0 "先办学务"
 nesnd_india_choose_industry:0 "先兴实业"
 nesnd_india_priority_desc:0 "将朝廷的人力与经费集中到这项事业上。"
 nesnd_india_priority_tt:0 "将此事列为当前改革重点；另一项工作暂停，已取得的成果保留。"
 nesnd_india_program_months:0 "持续达标月份"
 nesnd_india_ready_month:0 "建设与制度条件达标"
 nesnd_india_dynastic_constitution:0 "共戴皇室"
 nesnd_india_republican_settlement:0 "印度属于国民"
 nesnd_india_settlement_desc:0 "将各省共同的政治要求确立为国家的制度。"
 nesnd_india_community_ready_tt:0 "印度共同体达到75。"
 nesnd_india_dynasty_ready_tt:0 "王朝接受度达到60。"
 nesnd_india_national_settlement:0 "印度的政治和解"
 nesnd_india_twelve_months_tt:0 "上述条件已累计维持十二个月。"
 nesnd_india_reform_finished_tt:0 "完成学校与官署、工场与军队。"
 TZ1:0 "天竺"
 TZ1_ADJ:0 "天竺"
 nesnd_tianzhu_commission_name:0 "天竺宣慰司"
 nesnd_establish_tianzhu:0 "设立天竺宣慰司"
 nesnd_establish_tianzhu_desc:0 "将天竺的领地交由中央委任的宣慰使治理。"
 nesnd_establish_tianzhu_tt:0 "将本国在印度指定地区的实有领土划归天竺宣慰司，建立[concept_puppet]关系。其他国家及其领土不变。"
 nesnd_tianzhu_commission:0 "筹建天竺宣慰司"
 nesnd_tianzhu_commission_reason:0 "印度的领地与南京相隔万里。驻军和商人需要一个能在当地作出决定的官署，朝廷也需要一个能为这些决定负责的人。"
 nesnd_tianzhu_governance:0 "天竺的庶务"
 nesnd_tianzhu_governance_reason:0 "天竺的商人熟悉海路，乡村却有另一套秩序。宣慰使既要维持港口与驻军，也要让学校和税务进入内地；当地王公与村社不会仅因南京的任命就放弃自己的利益。"
 YU1:0 "远山"
 YU1_ADJ:0 "远山"
 nesnd_yuanshan_commission_name:0 "远山宣慰司"
 nesnd_establish_yuanshan:0 "设立远山宣慰司"
 nesnd_establish_yuanshan_desc:0 "将远山的领地交由中央委任的宣慰使治理。"
 nesnd_establish_yuanshan_tt:0 "将本国在南非指定地区的实有领土划归远山宣慰司，建立[concept_puppet]关系。其他国家及其领土不变。"
 nesnd_yuanshan_commission:0 "筹建远山宣慰司"
 nesnd_yuanshan_commission_reason:0 "远山的港口面向两洋，也是南朝船队进入非洲腹地的起点。只有真正取得并经营这片土地，朝廷才能在那里设立自己的宣慰司。"
 nesnd_yuanshan_governance:0 "远山的庶务"
 nesnd_yuanshan_governance_reason:0 "远山的港口已经成为南朝航路上的据点，腹地的治理却刚刚开始。道路、税务与学校必须随着驻军一同建立，否则沿海的旗帜仍无法代表整个宣慰司。"
 nesnd_commission_governance_reward:0 "地方行政渐备"
 nesnd_india_foreign:0 "借法自强"
 nesnd_india_foreign_reason:0 "法国人并非为印度的独立而来。然而，借来的知识仍可以成为自己的力量。朝廷可以请来教师、工程师或军官；他们是否动身，要看巴黎愿意为这段关系付出多少。"
 nesnd_india_foreign_status:0 "援助与自主之间，需要自己的打算。"
 nesnd_india_diplomatic_desc:0 "向对方正式提出请求，由其政府作答。"
 nesnd_india_request_tt:0 "请求将交给对方决定。六个月后可再次交涉；法国援助获准后四年内不可再次领取。"
 nesnd_india_union_request_tt:0 "向一国提出并入印度的条件。对方可拒绝；同意后支付安置费，并承担十年的王公年金开支。"
 nesnd_india_french_advisers:0 "法国顾问团"
 nesnd_india_french_teachers:0 "法国教师"
 nesnd_india_french_engineers:0 "法国工程师"
 nesnd_india_french_officers:0 "法国教官"
 nesnd_india_princely_pensions:0 "王公年金"
 nesnd_india_diplomacy.1.t:0 "印度使团"
 nesnd_india_diplomacy.1.d:0 "[SCOPE.sCountry('india_sender').GetName]的使者已带来正式请求。双方的交往并不意味着无条件的支持；我们有权决定愿意承担怎样的责任。"
 nesnd_india_diplomacy.1.a:0 "接受这些条件。"
 nesnd_india_diplomacy.1.b:0 "我们不能答应。"
 nesnd_india_diplomacy.2.t:0 "使者归来"
 nesnd_india_diplomacy.2.d:0 "[SCOPE.sCountry('india_partner').GetName]接受了我们的请求。约定已交付执行，接下来仍要靠本国将它变为成果。"
 nesnd_india_diplomacy.3.t:0 "未获应允"
 nesnd_india_diplomacy.3.d:0 "[SCOPE.sCountry('india_partner').GetName]拒绝了使团提出的条件。我们仍须寻找自己的出路。"
 nesnd_india_diplomacy_ack:0 "知道了。"
 nesnd_india_reply_aid_tt:0 "提供一笔拨款及四年的专业援助。受援国承担顾问费用；双方交战或受援国改投其他宗主后，顾问撤离。"
 nesnd_india_reply_autonomy_tt:0 "提高对方一级自治权。"
 nesnd_india_reply_independence_tt:0 "承认对方独立，缔结五年停战。"
 nesnd_india_reply_union_tt:0 "本国并入对方，原有土地与人民成为统一国家的一部分。"
 nesnd_india_reply_defence_tt:0 "缔结防御条约，约束期三年。"
 nesnd_india_request_1:0 "延请法国教师"
 nesnd_india_request_2:0 "延请法国工程师"
 nesnd_india_request_3:0 "延请法国教官"
 nesnd_india_request_4:0 "商议自治"
 nesnd_india_request_7:0 "请求独立"
 nesnd_india_request_6:0 "邀请土邦加入"
 nesnd_india_defence_fra:0 "与$FRA$商议互保"
 nesnd_india_defence_mug:0 "与$MUG$商议互保"
 nesnd_india_defence_usm:0 "与$USM$商议互保"
 nesnd_india_diplomacy.1.d1:0 "[SCOPE.sCountry('india_sender').GetName]希望我们派遣教师，并帮助支付初期的费用。这个国家需要新知识，法国也有自己的利益；接受请求意味着投入真实的经费与人员。"
 nesnd_india_diplomacy.1.d2:0 "[SCOPE.sCountry('india_sender').GetName]希望我们派遣矿业和工业的工程师，并帮助支付初期的费用。这个国家需要新知识，法国也有自己的利益；接受请求意味着投入真实的经费与人员。"
 nesnd_india_diplomacy.1.d3:0 "[SCOPE.sCountry('india_sender').GetName]希望我们派遣军队教官，并帮助支付初期的费用。这个国家需要新知识，法国也有自己的利益；接受请求意味着投入真实的经费与人员。"
 nesnd_india_diplomacy.1.d4:0 "[SCOPE.sCountry('india_sender').GetName]的使者提出了提高自治权的要求。这将改变两国今后的关系，我们可以接受，也可以保留现状。"
 nesnd_india_diplomacy.1.d5:0 "[SCOPE.sCountry('india_sender').GetName]的使者提出了共同防御的条约的要求。这将改变两国今后的关系，我们可以接受，也可以保留现状。"
 nesnd_india_diplomacy.1.d6:0 "[SCOPE.sCountry('india_sender').GetName]的使者提出了以年金保障原有王公，并入共同的印度国家的要求。这将改变两国今后的关系，我们可以接受，也可以保留现状。"
 nesnd_india_diplomacy.1.d7:0 "[SCOPE.sCountry('india_sender').GetName]的使者提出了承认独立的要求。这将改变两国今后的关系，我们可以接受，也可以保留现状。"
 nesnd_india_uprising:0 "南方的烽火"
 nesnd_india_uprising_reason:0 "南朝的统治依靠港口、驻军和愿意合作的地方势力。反对者同样需要组织、经费与盟友。德里可以帮助他们行动，却不能因此把他们的土地视作自己的奖赏。"
 nesnd_india_uprising_status:0 "地方的行动尚待时机。"
 nesnd_india_contact_desc:0 "资助当地的反殖民组织，为公开举事作准备。"
 nesnd_india_contact_tt:0 "支付£5,000联络费用，政府工资增加2%。当地存在严重失序或生活水平低于10时，组织才能发展；交通、失序程度和法国教官影响筹备速度。暂停后不再支付维护费，筹备每月减少2。"
 nesnd_india_pause_tt:0 "暂停联络并撤去维护开支；当地组织每月损失2筹备。"
 nesnd_india_resume_tt:0 "恢复联络与维护开支；不再支付首次联络费。"
 nesnd_india_launch_tt:0 "支付£20,000支持举事。当地将成立自己的国家，殖民统治者要求收复本州，起义者以羞辱对方为反诉求。独立的赞助国加入起义一方；资助不会自动使当地并入本国。"
 nesnd_india_preparation_tt:0 "本地区的筹备已达100。"
 nesnd_india_contact_cost:0 "南方联络经费"
 nesnd_india_revolt_war:0 "保卫地方自主"
 nesnd_india_revolt_war_reason:0 "旧统治者要求收回这片土地。独立的命运将由这场交涉与战争决定；外国资助不应成为另一个国家吞并我们的借口。"
 nesnd_india_revolt_resolved_tt:0 "本次争端已经结束，仍独立保有起义地区。"
 nesnd_india_revolt_survived:0 "守住自主"
 nesnd_india_suppression_desc:0 "以额外的警务开支打击地方秘密组织。"
 nesnd_india_suppression_tt:0 "支付£10,000，使当地筹备减少25；六个月内不能再次采取同一行动。"
 nesnd_india_revolt.1.t:0 "南方举事"
 nesnd_india_revolt.1.d:0 "[SCOPE.sState('india_case_state').GetName]的反对者已经公开举事。他们占据地方官署，宣布不再服从旧统治者。现在，是否承认这场分离已成为两国之间的争端。"
 nesnd_india_revolt_ack:0 "局势已变。"
