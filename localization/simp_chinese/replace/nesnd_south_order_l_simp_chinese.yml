 nesnd_usm_outcome_zheng:0 "#title 郑家的要求#!\n"
 nesnd_usm_outcome_ming:0 "#title 大明的要求#!\n"
 nesnd_usm_agenda_zheng_conclusion:0 "六部取得统筹各省政务的权力。尚存的各省接到了交印归并的通牒。"
 nesnd_usm_agenda_ming_conclusion:0 "各省布政司取得自理省务的权力。尚存的各省接到了交印归并的通牒。"
 nesnd_usm_agenda_zheng_result_tt:0 "获得[GetStaticModifier('nesnd_south_zheng_settlement').GetName|v]，持续#v 20年#!。\n向蜀、楚、淮中仍是我国属国的各省发出通牒，要求和平合并。拒绝者将获得[GetStaticModifier('nesnd_south_defied_ultimatum').GetName|v]#v 10年#!并立即与我国交战，不得议和。"
 nesnd_usm_agenda_ming_result_tt:0 "获得[GetStaticModifier('nesnd_south_ming_settlement').GetName|v]，持续#v 20年#!。\n获得对河南、山东、汉中、安徽、河北、辽东、吉林与黑龙江各地的宣称。\n向蜀、楚、淮中仍是我国属国的各省发出通牒，要求和平合并。拒绝者将获得[GetStaticModifier('nesnd_south_defied_ultimatum').GetName|v]#v 10年#!并立即与我国交战，不得议和。"
 nesnd_south_order.1.t:0 "交印归并"
 nesnd_south_order.1.d:0 "[SCOPE.sCountry('nesnd_order_sender').GetName]的咨文送到了[ROOT.GetCountry.GetName]。南朝的归属已经不战而定，朝廷如今要求各省交出印信、册籍和兵权，并入[SCOPE.sCountry('nesnd_order_sender').GetName]。咨文写明，拒绝即是叛逆，朝廷的军队不会接受求和。\n\n[ROOT.GetCountry.GetName]的军队多年没有得到朝廷的饷械，仓促应战，胜算很小。"
 nesnd_south_order.1.f:0 "“限文到一月之内交印、缴册、撤兵。逾期以叛论。”\n——[SCOPE.sCountry('nesnd_order_sender').GetName]致[ROOT.GetCountry.GetName]的咨文"
 nesnd_south_order.1.a:0 "交印，归并。"
 nesnd_south_order.1.b:0 "本省不奉此令。"
 nesnd_south_order.1.b_tt:0 "我国脱离[SCOPE.sCountry('nesnd_order_sender').GetName]，获得[GetStaticModifier('nesnd_south_defied_ultimatum').GetName|v]#v 10年#!，并立即与[SCOPE.sCountry('nesnd_order_sender').GetName]交战。这场战争不能议和。"
 nesnd_south_order.2.t:0 "[SCOPE.sCountry('nesnd_order_target').GetName]的答复"
 nesnd_south_order.2.d_accepted:0 "[SCOPE.sCountry('nesnd_order_target').GetName]遵照通牒交出了印信和册籍，军队就地听候改编。该省已经并入我国。"
 nesnd_south_order.2.d_refused:0 "[SCOPE.sCountry('nesnd_order_target').GetName]退回了咨文，宣布不再奉朝廷号令。我们的军队已经奉命进剿，这场战争不会以议和收场。"
 nesnd_south_order.2.f:0 "“……该省印信、册籍已于限内点交清楚。”\n——接收委员的呈报，或一纸原封退回的咨文"
 nesnd_south_order.2.a:0 "知道了。"
