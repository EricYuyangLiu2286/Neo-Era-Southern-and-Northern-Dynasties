 nesnd_south_order.1.d_war:0 "[SCOPE.sCountry('nesnd_order_sender').GetName]的咨文送到了[ROOT.GetCountry.GetName]。南方的内战已经打完，朝廷如今要求各省交出印信、册籍和兵权，并入[SCOPE.sCountry('nesnd_order_sender').GetName]。咨文写明，拒绝即是叛逆，朝廷的军队不会接受求和。"
