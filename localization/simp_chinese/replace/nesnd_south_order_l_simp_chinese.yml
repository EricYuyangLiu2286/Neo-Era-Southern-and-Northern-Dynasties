l_simp_chinese:
 lawgroup_nesnd_wu_fence:0 "东南藩篱"
 lawgroup_nesnd_wu_fence_desc:0 "按出身的地方划定大吴居民的待遇。"
 lawgroup_nesnd_ming_gate:0 "明祚高门"
 lawgroup_nesnd_ming_gate_desc:0 "按所操的行当划定大明居民的待遇。"
 nesnd_wu_fence_hierarchy:0 "东南等第"
 nesnd_wu_fence_hierarchy_desc:0 "吴人居首，其余各族按出身的地方依次排在后面。"
 nesnd_ming_gate_hierarchy:0 "高门等第"
 nesnd_ming_gate_hierarchy_desc:0 "勋贵、军官与读书人居首，其余各行依次排在后面。"
 law_nesnd_wu_southeast_fence:0 "东南藩篱"
 law_nesnd_wu_southeast_fence_desc:0 "那些不出身于东南藩国的宗族、乡民不可能被吴人信赖，因为吴人的繁荣需要他们贡献出自己的土地、消费和劳动。我们明里暗里地策划和控制着这些地区的经济和政治生态，将他们隔离出帝国的政治经济上层。或许他们永远也不会成为南京吴廷的子民。"
 law_nesnd_wu_registered_peoples:0 "诸族编户"
 law_nesnd_wu_registered_peoples_desc:0 "女真与和族编入户籍，列在华夏诸族之后、西南诸省之前。"
 law_nesnd_wu_southerners_one:0 "南人一体"
 law_nesnd_wu_southerners_one_desc:0 "巴蜀、荆楚与西南的居民同吴人一体看待。"
 law_nesnd_wu_no_faction_prejudice:0 "禁止派阀偏见"
 law_nesnd_wu_no_faction_prejudice_desc:0 "官府不再按出身的地方区别对待居民，东南等第就此废除。"
 law_nesnd_ming_high_gate:0 "明祚高门"
 law_nesnd_ming_high_gate_desc:0 "西府进步派军官和西南诸省勋贵门阀组成的朝廷在政治和经济上分裂。但在维持自己的胜利果实上高度统一。他们受够了因为某个亲王诸侯的命令而浪死，也全心相信服务他们就是蚁民们最好的选择。因为他们所相信的未来就是大明最繁荣的未来，也是中洲万族最繁荣的未来。"
 law_nesnd_ming_from_the_ranks:0 "行伍出身"
 law_nesnd_ming_from_the_ranks_desc:0 "士兵与军官同列高门。"
 law_nesnd_ming_enterprise_office:0 "实业入仕"
 law_nesnd_ming_enterprise_office_desc:0 "办实业的东家列入高门，工程师与店主的地位随之提高。"
 law_nesnd_ming_no_faction_prejudice:0 "禁止派阀偏见"
 law_nesnd_ming_no_faction_prejudice_desc:0 "官府不再按所操的行当区别对待居民，高门等第就此废除。"
