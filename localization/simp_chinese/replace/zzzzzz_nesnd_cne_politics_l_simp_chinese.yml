l_simp_chinese:
 nesnd_land_disorder_bar_desc: "地方失序：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!　#tooltippable #tooltip:[JournalEntry.GetCountry.GetTooltipTag],nesnd_reform_politics_tt 内阁与失序#!#!"
 nesnd_reform_politics_tt: "#bold 内阁与地方失序#!\n已实行新的地权制度时，政府内强大的地主[concept_interest_group]若[concept_approval]至多为#v −5#!，每月增加#n 0.25#!失序。\n\n政府内强大的乡村民众、实业家或知识分子中，只要有一组支持度至少为#v 5#!，每月减少#p 0.25#!失序；多组符合时仍只计算一次。两项可以同时生效。\n\n[Concept('concept_unemployed','$concept_unemployment$')]、生活水平、教育及行政条件继续决定改革成果。战争、[concept_bankruptcy]后的惩罚期和持续民生危机按原规则增加压力。"
