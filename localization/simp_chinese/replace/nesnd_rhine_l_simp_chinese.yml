l_simp_chinese:
 nesnd_prussian_identity_tt:0 "本国是普鲁士，或由普鲁士组建的北德意志邦联、德意志"
 nesnd_prussian_identity_lost_tt:0 "本国不再是普鲁士，也不是由普鲁士组建的国家"
 nesnd_rhine_after_coalition_tt:0 "已完成「德意志的共同防卫」"
 nesnd_frm_identity_tt:0 "本国由法兰克福的议会治理"
 nesnd_frm_identity_lost_tt:0 "本国不再由法兰克福的议会治理"
 nesnd_prussian_rhine:0 "莱茵问题"
 nesnd_prussian_rhine_reason:0 "莱茵联邦在法兰克福建国以来，莱茵河畔的大部分州县都归它管辖。鲁尔的煤矿、科隆和杜塞尔多夫的工场向法兰克福纳税，法兰克福长期受巴黎保护。共同防卫让[ROOT.GetCountry.GetName]重新在德意志各邦之间说得上话，可莱茵的归属不会在会议桌上解决。\n\n要等到巴黎无暇西顾，或者莱茵的议会自己转向，机会才会出现。到那时，代价要由军队来付。"
 nesnd_rhine_status_france_distracted:0 "巴黎无暇顾及莱茵。现在动员，时机最好。"
 nesnd_rhine_status_parliament:0 "[SCOPE.sCountry('nesnd_rhine_frm').GetName]的议会已经倒向德意志民族派。"
 nesnd_rhine_status_waiting:0 "巴黎仍牢牢掌握着莱茵。只能等法国陷入战争或财政违约，或者等莱茵的议会自己转向。"
 nesnd_rhine_success_tt:0 "本国已组成德意志，或莱茵兰、北莱茵、鲁尔、威斯特法伦中至少#v 3#!个地区全部归本国或本国的附庸所有"
 nesnd_rhine_deadline_tt:0 "已到#v 1880年#!"
 nesnd_rhine_shelter_exiles:0 "庇护莱茵流亡者"
 nesnd_rhine_shelter_exiles_desc:0 "法兰克福的议会里，主张与普鲁士合流的人越来越难立足。给他们一个落脚的地方，他们会把我们的声音带回莱茵。"
 nesnd_rhine_parliament_open_tt:0 "[SCOPE.sCountry('nesnd_rhine_frm').GetName]的议会仍在运作"
 nesnd_rhine_exiles_cooldown_tt:0 "距上次接纳流亡者已满#v 3年#!"
 nesnd_rhine_mobilize:0 "莱茵动员"
 nesnd_rhine_mobilize_desc:0 "征召后备军，把军火运往西部边境。这样的姿态维持不了太久，也瞒不过任何人。"
 nesnd_rhine_window_tt:0 "法国无暇顾及莱茵，或莱茵的议会已倒向德意志民族派"
 nesnd_rhine_mobilize_cooldown_tt:0 "距上次动员已满#v 5年#!"

 nesnd_frm_parliament:0 "法兰克福的议会"
 nesnd_frm_parliament_reason:0 "1829年，罗马王理政期间，莱茵的德意志民族主义者推动[ROOT.GetCountry.GetName]改行共和。此后法国的激进派为躲避拿破仑的“反激进派恐怖”逃到这里，德意志各邦的不满者也来这里办报。议会从此成了各派角力之处。亲法的一派靠巴黎的保护与市场维持地位，民族派则盼着德意志诸邦终有一天联合起来。\n\n议会倒向哪一边，决定莱茵是留在法国的秩序里，还是成为普鲁士的目标。"
 nesnd_frm_status_nationalist:0 "民族派在议会中占了上风。"
 nesnd_frm_status_french:0 "亲法的一派牢牢掌握着议会。"
 nesnd_frm_status_divided:0 "议会里亲法派与民族派相持不下。"
 nesnd_frm_nationalist_tt:0 "民族派倾向达到#v 90#!"
 nesnd_frm_deadline_tt:0 "已到#v 1900年#!"
 nesnd_frm_leaning:0 "民族派倾向"
 nesnd_frm_leaning_desc:0 "民族派倾向：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 100#!"
 nesnd_frm_leaning_movement:0 "德意志民族运动在议会内外活动"
 nesnd_frm_leaning_france_distracted:0 "巴黎无暇顾及莱茵"
 nesnd_frm_leaning_zollverein:0 "普鲁士一系领导着势力集团"
 nesnd_frm_leaning_french_protection:0 "法国的保护"
 nesnd_frm_request_garrison:0 "请求巴黎增派驻军"
 nesnd_frm_request_garrison_desc:0 "民族派在议会里的声音越来越大。只要法国的军队还驻在莱茵河上，他们就只能在议会里说话。"
 nesnd_frm_garrison_cooldown_tt:0 "距上次请求已满#v 2年#!"

 nesnd_rhine_war_footing:0 "莱茵动员"
 nesnd_rhine_customs_concession:0 "关税让步"
 nesnd_rhine_customs_firmness:0 "坚持税率"
 nesnd_rhine_protest:0 "莱茵质询"
 nesnd_rhine_press_funding:0 "资助莱茵报刊"
 nesnd_frm_french_garrison:0 "法国驻军"
 nesnd_frm_commune_aftermath:0 "公社之后"

 nesnd_rhine.1.t:0 "莱茵河畔的边界"
 nesnd_rhine.1.d:0 "[ROOT.GetCountry.GetName]的军队和官员进驻了莱茵诸州。法兰克福不再能替巴黎守住这条河，我们的疆界一直推到了法国边境。巴黎的政府不会忘记这件事。"
 nesnd_rhine.1.f:0 "“他们休想得到它，\n自由的德意志莱茵。”\n——尼古拉斯·贝克尔《莱茵之歌》（1840年）"
 nesnd_rhine.1.a:0 "守住这条河。"
 nesnd_rhine.2.t:0 "错过的时机"
 nesnd_rhine.2.d:0 "预定的年限已经过去。莱茵诸州仍在法兰克福治下，法国的保护也没有动摇。各邦的参谋还记得共同防卫的承诺，却不再相信莱茵问题能在这一代人手里解决。"
 nesnd_rhine.2.f:0 "“夜里想起德意志，\n我便难以入眠。”\n——海因里希·海涅《夜思》（1844年）"
 nesnd_rhine.2.a:0 "留给后来的人。"
 nesnd_rhine.3.t:0 "莱茵来的人"
 nesnd_rhine.3.d:0 "又一批人从[SCOPE.sCountry('nesnd_rhine_frm').GetName]越境来到我国。他们中有被议会除名的议员，有报馆被查封的编辑，也有在莱茵的工场里组织过请愿的工匠。他们请求在[ROOT.GetCountry.GetName]居留，也希望继续发表文章、写信回乡。\n\n公开接纳他们，莱茵的民族派会受到鼓舞，巴黎则会把这看作挑衅。"
 nesnd_rhine.3.f:0 "“我们不求官职，也不求救济。只求有一张桌子、一盏灯，好把信写回莱茵去。”\n——一位莱茵编辑的居留申请"
 nesnd_rhine.3.a:0 "准许他们公开居留，自由撰文。"
 nesnd_rhine.3.b:0 "安置到东部各省，不许他们发表文章。"
 nesnd_rhine.11.t:0 "关税会议"
 nesnd_rhine.11.d:0 "关税同盟的年度会议又开始讨价还价。各邦都抱怨过境税太重，[SCOPE.sCountry('nesnd_rhine_frm').GetName]的商人也在会场外打听消息。只要同盟的税率足够低，莱茵的货物就会越过边界，法兰克福的议员也会记住是谁让他们赚了钱。"
 nesnd_rhine.11.f:0 "“盟约可以撕毁，可一条大家都在用的商路，谁也不会自己去堵上。”\n——普鲁士财政大臣在关税会议上的发言"
 nesnd_rhine.11.a:0 "让出部分关税，换取各邦的好感。"
 nesnd_rhine.11.b:0 "税率不能动。"
 nesnd_rhine.12.t:0 "莱茵河上的换防"
 nesnd_rhine.12.d:0 "法国新调来的营队在[SCOPE.sCountry('nesnd_rhine_frm').GetName]的要塞里接防。巴黎的报纸称之为例行轮换，莱茵各城的人却数得清多了多少门炮。我们的公使问，是否要就此向巴黎正式提出质询。"
 nesnd_rhine.12.f:0 "“亲爱的祖国，你尽可安心，\n莱茵河上的守望坚定而忠诚！”\n——马克斯·施内肯布格尔《莱茵河上的守望》（1840年）"
 nesnd_rhine.12.a:0 "向巴黎提出质询。"
 nesnd_rhine.12.b:0 "不予置评。"
 nesnd_rhine.13.t:0 "法兰克福的笔战"
 nesnd_rhine.13.d:0 "[SCOPE.sCountry('nesnd_rhine_frm').GetName]的几家报纸为莱茵的前途吵得不可开交。亲法的报纸说，多年的和平与市场都是巴黎给的。民族派的报纸回答，莱茵人交的税养活的是法国的驻军。有人来问，我们是否愿意出钱，让后一种声音传得更远。"
 nesnd_rhine.13.f:0 "“什么是德意志人的祖国？\n……凡是德语响起的地方。”\n——恩斯特·莫里茨·阿恩特《德意志人的祖国》（1813年）"
 nesnd_rhine.13.a:0 "暗中资助民族派的报纸。"
 nesnd_rhine.13.b:0 "这是法兰克福自己的事。"
 nesnd_rhine.21.t:0 "《德法年鉴》"
 nesnd_rhine.21.d:0 "几位流亡的激进派文人在法兰克福创办了一份刊物，名为《德法年鉴》。撰稿人中有一位名叫卡尔·马克思的年轻博士，还有俄国人巴枯宁。创刊号批评的不只是巴黎，还有一切现存的秩序。法国公使已经来函，询问我们是否打算让它继续出版。"
 nesnd_rhine.21.f:0 "“……对现存的一切进行无情的批判……”\n——卡尔·马克思致阿尔诺德·卢格的信（1843年9月），刊于《德法年鉴》"
 nesnd_rhine.21.a:0 "这是共和国，任它出版。"
 nesnd_rhine.21.b:0 "应巴黎的要求查禁。"
 nesnd_rhine.22.t:0 "驱逐令"
 nesnd_rhine.22.d:0 "伦敦的共产主义者同盟大会公布了一份宣言，执笔者正是《德法年鉴》的那位马克思博士。法国驻法兰克福的代表要求将他驱逐出境，议会里的民族派却说，[ROOT.GetCountry.GetName]是共和国，不是巴黎的一个省。"
 nesnd_rhine.22.f:0 "“一个幽灵，共产主义的幽灵，在欧洲游荡。”\n——卡尔·马克思、弗里德里希·恩格斯《共产党宣言》（1848年）"
 nesnd_rhine.22.a:0 "签发驱逐令。"
 nesnd_rhine.22.b:0 "拒绝驱逐。"
 nesnd_rhine.23.t:0 "议会易帜"
 nesnd_rhine.23.d:0 "民族派在议会里取得了多数。他们的第一项提案就是罢免现任总理，理由是他在莱茵的前途上过于迁就巴黎。法国公使抗议说，这是对两国关系的公然冒犯。柏林则派人前来道贺。"
 nesnd_rhine.23.f:0 "“统一、正义与自由，\n为了德意志祖国！”\n——奥古斯特·海因里希·霍夫曼·冯·法勒斯莱本《德意志人之歌》（1841年）"
 nesnd_rhine.23.a:0 "罢免总理。"
 nesnd_rhine.23.b:0 "只通过一项谴责案。"
 nesnd_rhine.24.t:0 "法兰克福公社"
 nesnd_rhine.24.d:0 "多年的萧条之后，法兰克福的工人占领了市政厅，宣布成立公社。城里要求与普鲁士合并的民族派也趁乱上街。巴黎表示，只要我们请求，干涉军几天之内就能渡过莱茵河。"
 nesnd_rhine.24.f:0 "“市政厅归人民所有。”\n——公社贴在市政厅门口的告示"
 nesnd_rhine.24.a:0 "请法国出兵。"
 nesnd_rhine.24.b:0 "由本国军警镇压。"

 german_unification.3.d:0 "一位出身萨克森、名叫[SCOPE.sCharacter('bismarck_scope').GetFullName]的贵族在[ROOT.GetCountry.GetAdjectiveNoFormatting][SCOPE.gsInterestGroup('junkers').GetName]中声名鹊起，担任显赫职位。他倡导德意志民族统一和实用主义政治，并为这个国家效力。"
 german_unification.3.f:0 "“政治是可能性的艺术。”\n——奥托·冯·俾斯麦（1867年）"
