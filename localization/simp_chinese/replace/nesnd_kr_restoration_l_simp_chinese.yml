l_simp_chinese:
 nesnd_kr_restoration:0 "朝鲜重建运动"
 nesnd_kr_restoration_reason:0 "汉城的政府已经倒了，田册却还在各郡书吏手里。新任官员要凭它收税，乡里的代表也凭它找到了出粮、出钱和出人的各户。几国可以分治朝鲜，却没有哪一国能代其余各国答复这封请愿书。"
 nesnd_kr_restoration_concluded:0 "朝鲜重建运动"
 nesnd_kr_concluded:0 "朝鲜重获主权，本土仍有朝鲜居民的[Concept('concept_state','$concept_states|q$')]均已归其治理。"
 nesnd_kr_extinct:0 "朝鲜本土已无朝鲜文化或朝鲜传承的居民。"
 nesnd_kr_success:0 "独立的朝鲜政府掌握所有仍有朝鲜居民的本土[Concept('concept_state','$concept_states|q$')]，且没有正在进行的$dp_nesnd_kr_restoration$"
 nesnd_kr_pressure_bar:0 "复国压力"
 nesnd_kr_pressure_desc:0 "复国压力：[GetGlobalVariable('nesnd_kr_pressure').GetValue|1]/100　上月变化：[GetGlobalVariable('nesnd_kr_delta').GetValue|=+2]"
 nesnd_kr_breakdown:0 "各国治理（悬停查看月度明细）"
 nesnd_kr_row:0 "[Country.GetName]：[Country.MakeScope.Var('nesnd_kr_count').GetValue|K] 人　比重 [Country.MakeScope.Var('nesnd_kr_share').GetValue|1%]　贡献 [Country.MakeScope.Var('nesnd_kr_sum').GetValue|=+2]"
 nesnd_kr_row_tt:0 "[Country.GetName]所辖朝鲜本土人口：[Country.MakeScope.Var('nesnd_kr_count').GetValue|K]\n基础组织：+0.25\n文化待遇：[Country.MakeScope.Var('nesnd_kr_rights').GetValue|=+2]\n言论与地方参与：[Country.MakeScope.Var('nesnd_kr_voice').GetValue|=+2]\n地方[concept_turmoil]：[Country.MakeScope.Var('nesnd_kr_unrest').GetValue|=+2]\n地方议事会或查禁：[Country.MakeScope.Var('nesnd_kr_orders').GetValue|=+2]\n以上各项乘以人口比重 [Country.MakeScope.Var('nesnd_kr_share').GetValue|1%]，上月共计 [Country.MakeScope.Var('nesnd_kr_sum').GetValue|=+2]。朝鲜政府所辖人口不计入外国治理比重。"
 nesnd_kr_stateless:0 "尚无朝鲜政府。压力达到75时，人口最多的合格[concept_state]将提出复国请求。"
 nesnd_kr_subject:0 "朝鲜政府已经复建，仍受宗主约束。必须依现有外交途径取得独立。"
 nesnd_kr_reunite:0 "朝鲜已有政府。其余持地国可交还本国在朝鲜的领地。"
 nesnd_kr_petition:0 "[GetGlobalVariable('nesnd_kr_target').GetCountry.GetName]领内的请愿正在等候答复。期限90天。"
 nesnd_kr_mobilizing:0 "请愿未获准许。已动员 [GetGlobalVariable('nesnd_kr_months').GetValue|0]/12 个月。压力低于75时暂停。 朝鲜政府若仍为属国，或与对方尚有停战协定，必须待其能发起博弈。"
 nesnd_kr_fighting:0 "复国要求已进入[concept_diplomatic_play]。退让或战目标执行决定领土归属。"
 nesnd_kr_recognize:0 "商议复建与交地"
 nesnd_kr_recognize_desc:0 "把掌印的人请回来，先交出我们自己的官署。"
 nesnd_kr_deal_gate:0 "持有实际有朝鲜居民的本土[concept_state]，有关政府处于和平，领地无敌占"
 nesnd_kr_at_peace:0 "复国战争尚未开始，属国提出交地必须无其他待决案件或挫折期"
 nesnd_kr_deal_tt:0 "交还持地国实有的朝鲜本土[concept_state]。若无朝鲜政府，先在当地复建。属国必须经实际宗主同意。"
 nesnd_kr_reform:0 "准设地方议事会"
 nesnd_kr_reform_desc:0 "让各郡自己推举经手税粮的人。"
 nesnd_kr_reform_tt:0 "12个月内，本国复国压力每月−0.5，再按所辖人口加权。"
 nesnd_kr_suppress:0 "查禁复国组织"
 nesnd_kr_suppress_desc:0 "收缴名册，传讯各郡领头的人。"
 nesnd_kr_suppress_tt:0 "12个月内，本国复国压力每月−1，再按所辖人口加权。本国实际控制的朝鲜居民所在州，5%人口转向激进。"
 nesnd_kr_action_gate:0 "控制有朝鲜居民的[concept_state]，备足经费，且上一项地方措施已结束"
 nesnd_kr_councils:0 "郡邑议事"
 nesnd_kr_police:0 "查禁结社"
 nesnd_kr_registers:0 "重编田册"
 nesnd_kr_muster:0 "乡军点验"
 dp_nesnd_kr_restoration:0 "朝鲜复国之争"
 wg_nesnd_kr_restoration:0 "朝鲜复国和约"
 wg_nesnd_kr_restoration_desc:0 "朝鲜胜则收回对手在半岛的领地，持地国胜则收回此次起兵划出的根据地。"
 nesnd_kr_refuse_tt:0 "压力达到75后开始累计12个月动员，压力回落则暂停。"
 nesnd_kr.1.t:0 "旧册新署"
 nesnd_kr.1.d:0 "朝鲜官署的印信换了主人，各郡的书吏还在照旧造册。如今乡里有人另抄了一份，循着册上的姓名找担保、筹旅费，要把复国的请愿送到每一个持有朝鲜土地的政府手里。"
 nesnd_kr.1.f:0 "“我等朝鲜之民，谨请各国政府归还朝鲜土地。”\n——随册附送的复国请愿书"
 nesnd_kr.1.a:0 "收下呈文。"
 nesnd_kr.2.t:0 "请还郡印"
 nesnd_kr.2.d:0 "朝鲜代表把所请交还的郡邑列成一册。他们要接管当地的税粮和驻防。若请愿被驳回，愿意为他们出人的乡里，也已在册上具名。"
 nesnd_kr.2.f:0 "“所请交还之郡邑，开列于后。税粮、驻防，愿由朝鲜官吏接管。”\n——朝鲜代表呈递的请还郡邑册"
 nesnd_kr.2.a:0 "照册交接。"
 nesnd_kr.2.b:0 "郡印仍归本府。"
 nesnd_kr.3.t:0 "郡印交还"
 nesnd_kr.3.d:0 "交地的文书已经送到各郡。官吏照文书移交簿册，守兵在新定的界线上驻扎。仍归别国管辖的郡邑，还要另与那些政府交涉。"
 nesnd_kr.3.f:0 "“交地文书到日，各郡官吏照文书移交簿册，守兵移驻新界。”\n——交地文书"
 nesnd_kr.3.a:0 "据实登记。"
 nesnd_kr.4.t:0 "山河有主"
 nesnd_kr.4.d:0 "各郡的税册终于送到了同一个政府。如今征税、调兵或与外国订约，朝鲜的官员可以用自己的印信作准。"
 nesnd_kr.4.f:0 "“各郡税册今已汇于一处。征税、调兵、对外订约，悉以朝鲜印信为凭。”\n——朝鲜政府的布告"
 nesnd_kr.4.a:0 "用印。"
 nesnd_kr.5.t:0 "开署"
 nesnd_kr.5.d:0 "官署开门时，户曹和军官同时到了。户曹要各郡先报田粮，军官则要点验驻防，免得领了饷的兵只存在簿子上。新政府先办哪件事？"
 nesnd_kr.5.f:0 "“各郡限一月之内造报田亩与粮额，驻防兵数另册上报。”\n——新政府的第一道命令"
 nesnd_kr.5.a:0 "先清田粮。"
 nesnd_kr.5.b:0 "先点兵额。"
 dp_nesnd_kr_restoration_desc:0 "$wg_nesnd_kr_restoration_desc$"
 dp_nesnd_kr_restoration_tooltip:0 "$wg_nesnd_kr_restoration_desc$"
