 nesnd_refugee_reception:0 "安置南来流亡者"
 nesnd_maritime_security:0 "护航与通商交涉"
 nesnd_huguang_preparations:0 "襄阳之后"
 nesnd_huguang_preparations_reason:0 "朱班博整顿湖广时曾修复襄阳工事，召集青年军官任教，又用军工铁件向川蜀换取粮食。伤兵与退伍军人分入后勤、屯垦卫所，留在襄阳的共和派协助总督府改造岳麓书院。二十年间，总督府掌握的军队、田赋与书院渐成一体，朝中又有陈东阳为奥援。时人多以襄阳兵为“新西府”的魁首，南明联邦也不能缺少这根柱石。\n\n然而，曾经极力支持朱班博的郑家如今屡屡指责襄阳拖欠税款、瞒报户籍。石元辅、林汉涵等亲近湖广的南兵高层相继外调，朝中与我们交好的共和派官员也受到排挤。我们必须做好最坏的准备：重新核定屯田兵农丁口，接续上游粮运，并争取书院中即将步入政坛的监生。"
 nesnd_hna_academy_button:0 "整顿联合书院"
 nesnd_hna_academy_button_desc:0 "襄阳的岳麓书院是湖广官员与议政士子的精神中心。院中监生一面读书，一面习议国事，日后须通过礼议院的考试，才能进入南朝政坛。书院自创办以来便以忠于南朝训育诸生，如今南府步步相逼，我们须让教员讲明：把持朝政的郑吴与朱明皇室并非一体。今日在讲席间争取到的士子，或许就是来日同我们共进退的学政。"
 nesnd_hna_supply_button:0 "荆蜀密室之约"
 nesnd_hna_supply_button_desc:0 "抗击牧贼时，湖广的工坊与川蜀的粮船曾共同供养襄阳军民。如今南府与西府的裂痕日深，我们应当重新联络川中旧交，依两省所需组织军工与粮运，启用战时的沿江转运库。奸臣若要发难，襄阳总得有粮有械。"
 nesnd_hna_veterans_button:0 "使老兵集会待命"
 nesnd_hna_veterans_button_desc:0 "朱班博治楚时，楚兵待遇已远优于南朝友军。他又仿照北朝规定退伍年限、组织老兵集会，使受过训练的退伍士兵带领垦丁充实乡里，改善久困于战火的湖广民生。如今各地集会已有根基，老兵既熟悉营伍，也熟悉乡里。召集他们筹办粮食、救济与后勤，战时动员便可有所依凭。"
 nesnd_crisis.10.a:0 "以法建国，国家堪成！"
 nesnd_crisis.10.t:0 "《诸省、大营布政以礼法行事疏》通过"
 nesnd_crisis.10.d:0 "各省学政在礼议院支持新法，任官、田赋与军费条陈由此写入南明的国家礼法。明廷保全了朱氏统绪，中央与各省的权责也有了共同认可的依据。\n\n陈东阳重设行省布政司时，南朝已能够统一调度军政，却没有一并解决旧封君的名位与地方权力。南、西两府面临北朝南下，曾以共同的军队压服不从。如今，因战事而暂且搁置的争执终于有了法定的处置办法。"
 nesnd_crisis.11.a:0 "公布案情，循线查办。"
 nesnd_crisis.11.b:0 "密查严查，一查到底！"
 nesnd_crisis.11.t:0 "首辅门外"
 nesnd_crisis.11.d:0 "首辅护卫查获了一封伪造的换防手令。携信者与同伙很快被锦衣卫、大理寺捕获，分别收押；陈东阳先被送往安全之地，待案犯落网才返回住处。\n\n调查随后牵出经办军需、海运的官员，以及同他们往来的各省名绅与旧封君。大理寺主张公开案情，借此追究藏在官场中的关系；锦衣卫则坚持封锁消息，以免惊动尚未落网的人。内阁须决定如何继续查办，也须承担事情扩大后的政治后果。"
 nesnd_crisis.20.a:0 "先整顿国内。"
 nesnd_crisis.20.b:0 "接济湖广军需。"
 nesnd_crisis.20.c:0 "联络襄樊大营，准备南下。"
 nesnd_crisis.20.t:0 "伪朝禅代"
 nesnd_crisis.20.d:0 "倭吴叛明称制的消息传来，江北大臣纷纷弹冠相庆。更有人提起牧家天子当年御辇南下的盛举。伪吴与西府诸省决裂互斗，若无暇北顾，南征统一或可一举成功。\n\n边将已经请求拨饷，并派人联络湖广的“有识之士”。然而，我朝也远非太平兴国之世。国内政务仍须军队与财力维持，地权改革若尚未完成，更难兼顾南征。此时卷入南朝的混战，究竟能为帝国赢得什么？"
 nesnd_crisis.21.a:0 "保障通商，维持往来。"
 nesnd_crisis.21.b:0 "接纳南来之人。"
 nesnd_crisis.21.c:0 "向反吴诸省提供军需。"
 nesnd_crisis.21.t:0 "南方的来客"
 nesnd_crisis.21.d:0 "郑氏的舰队、商馆与属地，将南朝战争的消息带到了远方。各港商人担心货物遭到扣押，交战各方的使者则要求承认自己的政府，并为军需和借款寻求援助。\n\n[ROOT.GetCountry.GetName]在这些往来中有自己的利益。维持通商，需要与实际控制港口和航线的势力交涉；收容流亡者、接济反吴军队，也将使南朝的新旧政治力量同我国发生更深的联系。"
 nesnd_crisis.40.a:0 "分案审理，留用地方人才。"
 nesnd_crisis.40.b:0 "清查旧党，重定军政。"
 nesnd_crisis.40.t:0 "经始新朝"
 nesnd_crisis.40.d:0 "战事平定以后，地方军政陆续归入吴朝统辖。新朝须面对的已是怎样施政：被战争打断的生产与通商要恢复，各省百姓仍须生活，曾经反对郑氏的官员与士人也不会随战败一同消失。\n\n南府多年积累的军财足以支持重建。我们可以分案审理抵抗者，留用熟悉地方的人才；也可以借胜利清查旧党，使军队成为新秩序的支柱。无论如何处置，天下将从这些政令中认识郑氏自己的朝廷。"
 nesnd_crisis.41.a:0 "整顿军政，颁行新章。"
 nesnd_crisis.41.b:0 "依旧例酬赏诸军。"
 nesnd_crisis.41.t:0 "回到海峡这一边"
 nesnd_crisis.41.d:0 "参战军队陆续归国。地方领主要求兑现出兵时的许诺，港口商人催促恢复航运，中央也须重新安排驻军与征收。\n\n大陆战争使[ROOT.GetCountry.GetName]有了整理军政的机会。统一地方征收、训练官员，可以扩大中央的施政能力；先行酬赏军功，则能稳住此次出征所倚重的将领与领主。"
 nesnd_early_accession:0 "提前推动易代"
 nesnd_early_accession_desc:0 "南府已经掌握南朝兵财。召集支持郑氏的臣僚，向明廷提出禅位之请，并要求各省与海外诸邦表明立场。"
 nesnd_huguang_preparations_status:0 "完成书院、粮运、老兵集会三项准备，每项#v 30#!点；达到#v 90#!点后获得#v 10年#!地方防卫收益。"
 nesnd_crisis.11.f:0 "“人犯分别看守，往来文书悉数封存。明日入阁，仍议前案。”"
 nesnd_crisis.30.f:0 "“军中说田归营里，县里说田归国里。我们只问一句：去年交的钱，究竟赎回了什么？”"
 nesnd_crisis.33.f:0 "“当年随军出征，说是替天下人打一个有田可耕、有理可诉的世道。如今到了自己乡里，竟要重新问一遍。”"
 nesnd_crisis.31.f:0 "“饷出本省，兵守本省。京中诸公既不能给饷，也该容我等自筹。”"
 nesnd_crisis.32.f:0 "“减其租，通其行，旧业仍存。如此，诸营或可罢争。”"
 nesnd_crisis.10.f:0 "“诸省、大营，咸依礼法行事。”"
 nesnd_crisis.20.f:0 "“昔年渡江之兵，今尚有在营者。若朝廷复议南征，臣请先核粮饷。”"
 nesnd_crisis.21.f:0 "“船货已经装齐，只等贵国答复：旧日的通商文书，今日还能否通行？”"
 nesnd_crisis.40.f:0 "“诸省所急，在复业，在通商，在使军民各有所养。”"
 nesnd_crisis.41.f:0 "“出兵之约，诸家各执一份。今日归国，当一并议定。”"
