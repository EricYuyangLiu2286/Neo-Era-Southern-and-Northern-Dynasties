l_simp_chinese:
 nesnd_crisis.30.a:0 "复核田契，先停争议之案。"
 nesnd_crisis.30.b:0 "责成省督议处，酌从地方之请。"
 nesnd_crisis.30.c:0 "令各营交册，抗命聚众者依法惩办。"
 nesnd_crisis.30.t:0 "清丈风潮"
 nesnd_crisis.30.d:0 "地方呈来一桩清丈争讼：清丈官带着新法下乡勘定后，当地几处军功庄园却仍在按旧例征租。已经缴清赎价的农户被他们的“老爷”告知，所耕之田属于军籍，不许抵触租税。一些替农民代写申诉的塾师也因包庇隐产而遭拘押。\n\n涉事各县呈来的契约与军营的册籍彼此抵牾。省督要求接手复核，清丈官则请朝廷派兵收缴隐匿的文书。迁延日久，原本期待分田的农民聚集到县城，等待这个许诺解放他们的新政府作出答复。"
 nesnd_crisis.33.a:0 "撤官赔补，重审此案。"
 nesnd_crisis.33.b:0 "抗命聚众，当依国法惩办！"
 nesnd_crisis.33.t:0 "旧旗出山"
 nesnd_crisis.33.d:0 "山西的退伍军人、地方士人与失地农户，因清丈后的生计困顿和接连搜捕聚到了一处。共和派借乡校与旧日军中关系传递文书，要求各县推举代表，追究侵夺田产的军官。\n\n几处驻军大营拒绝交出涉案军官，省督派去查问的官员也被挡在营外。各县代表因而要求撤换清丈主官，重审田产并赔补受害农户。共和派已开始联络愿意倒戈的营伍，准备在请愿无门时举兵。刑部将案情呈至朝廷，请求裁定是撤官重审，还是以抗命聚众治罪。"
 nesnd_crisis.31.a:0 "议定地方章程，暂保各省归顺。"
 nesnd_crisis.31.b:0 "诸军已各奉其主。"
 nesnd_crisis.31.t:0 "兵权下移"
 nesnd_crisis.31.d:0 "各地行营开始截留本应解往户部的税款。军官以供饷为名接管关卡、仓廪与地方官署，省督或被迫迁就驻军，或依靠自己的亲军与之争夺财源。清丈官只能在驻军准许的地方办案。欠饷的营伍纷纷向主将索要田产，原有的营兵集团由此取得了更广的地方权力。\n\n兵部奉[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]之命发出的调防令接连退回。元老院中的勋旧要求承认各营与省督已经掌握的兵财之权，以换取各省继续奉朝廷正朔。咨议局送来的地方陈情也已无从逐案办理。朝廷若不能作出让步，失去约束的营兵便可能拥立自己的政府。"
 nesnd_crisis.32.a:0 "准此颁诏，收束地权革命。"
 nesnd_crisis.32.b:0 "改革仍须继续。"
 nesnd_crisis.32.t:0 "安石旧祸"
 nesnd_crisis.32.d:0 "各省请求停止地权改革的文书已经汇集到朝廷。元老院中的勋旧提出一份妥协草案，拟请[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]颁诏收束这场运动。所谓“新契”确认的土地仍归军户，但须由军户承诺减轻佃租，并准许佃农离乡务工；尚未处置的庄田、军田与宗族产业，则交由省督督办，暂列为“国家公田”，由官府招佃。\n\n这份草案使力主改革的公卿难堪，也将使依靠旧有地权组织起来的地方势力重新参与征税与乡里治理。户部与兵部都希望借此平息各省争端，将有限的财赋与人力收回常政。若予批准，地权革命便将在这些妥协中结束；余下的理想，只能留待后人。"
