 nesnd_huguang_preparations:0 "襄阳之后"
 nesnd_huguang_preparations_reason:0 "朱班博整顿湖广时，曾修复襄阳工事，召集青年军官任教，又用军工铁件向川蜀换取粮食。伤兵与退伍军人分入后勤、屯垦卫所，留在襄阳的共和派协助总督府改造岳麓书院。二十年间，总督府的军队、田赋、书院渐成一体。加上朝廷中有陈东阳为奥援。时人多以襄阳兵为“新西府”的魁首。更是南明联邦建国不可或缺的柱石。\n\n然而，曾经极力支持朱班博的郑家屡屡在朝廷中指责襄阳方面拖欠税款、瞒报户籍。又外放石元辅、林汉涵等亲湖广派的南兵高层和许多亲近湖广的共和派官员。一系列迹象表明我们必须做好最坏准备。重新核定屯田兵农丁口，接续上游的粮运，在书院中造势拉拢士子。以备不时之需。"
 nesnd_hna_academy_button:0 "整顿联合书院"
 nesnd_hna_academy_button_desc:0 "襄阳的岳麓书院是湖广派官员、议政士子的精神中心。但是它建立时起就奉行着忠于南朝的“爱国”教育。在南府频频发难的危急时刻，我们必须整顿人员，让岳麓教员们在我们的指挥下逐渐将把持朝政的倭吴丑类和朱明皇室区分开。以团结我内部思想以备不测。"
 nesnd_hna_supply_button:0 "荆蜀密室之约"
 nesnd_hna_supply_button_desc:0 "在不久前抗击牧贼的战争中，湖广的工坊与川蜀的粮船曾共同供养襄阳军民。我们应当按照需求重新组织两省军工与粮运。重新启用战时的沿江转运库。以备奸臣发难。"
 nesnd_hna_veterans_button:0 "使老兵集会待命"
 nesnd_hna_veterans_button_desc:0 "朱班博时代起，楚兵待遇优厚就远超南朝友军。其中更包括学自北朝的退伍年限和老兵集会。意图以此驱使受训听话的退伍士兵带领垦丁充实乡里，最终快速革新、改善久困于战火的湖广社会民生。时至今日，形成规模的“集会”老兵既熟悉营伍，也熟悉乡里。除了能在战时听令动员民众之外，我们也可以借助集会的力量对民众进行经济、生活上的动员准备。"
 nesnd_crisis.10.a:0 "以法建国，国家堪成！"
 nesnd_crisis.10.t:0 "《诸省、大营布政以礼法行事疏》通过"
 nesnd_crisis.10.d:0 "随着各省学政（南明国会议员）在大礼议上以多数表明了对新法的支持。以中央政府为核心的任官、田赋与军费改革终于统合为广泛承认的系列条陈，写入南明的国家“礼法”。依照新法，明廷，或者说现政权的明廷，终于为自西历15世纪初塞王之乱以来的地方割据，划定了中央与各省的权力边界。\n\n当然，在行政上的统一于陈东阳重设行省布政司时就完成了。但那时的政策并未命令废止“封君”制度，也没有确定中央政府和地方的权力边界。只是南、西两府面临北朝南下的危机空前团结，以至于无人对南京（实际是杭州）统一执行军政事权、任免官员、捕杀不从的力量发出异议。即使有，也早在两府大兵的铁蹄铁铳下碾为尘埃——如今，这一切的努力终于刻入石头，万世难改。"
 nesnd_crisis.11.a:0 "公布案情，因循查办。"
 nesnd_crisis.11.b:0 "密查严查，一查到底！"
 nesnd_crisis.11.t:0 "首辅门外"
 nesnd_crisis.11.d:0 "首辅护卫在核验随行人员时，查获了一封伪造的换防手令。携带密信的人员及其同伙很快被锦衣卫和大理寺抓捕，按照身份和参与事情分别收押。首辅本人被当即送往安全地点，在案犯落网后才得以返回住处。\n\n对案犯的调查一发不可收拾。触及承办军需、海运的一些关键岗位的官员。而这些嫌疑人又同各省名绅大户乃至圈禁的旧藩邦君往来密切。这些人似乎掌握着刑部、大理寺在首辅要求下秘密核查的一些走私案的关键信息。然而，大理寺和锦衣卫对于下一步的行动产生了分歧。由大理寺审办，对刑事官员们公开案情，被内阁认为是可以从明面上开始大规模的内部调查，方便行事。锦衣卫方面则坚持应该封锁消息、秘密调查，不能打草惊蛇，以麻痹逆贼、防止事态扩大。"
 nesnd_crisis.20.a:0 "先整顿国内。"
 nesnd_crisis.20.b:0 "接济湖广军需。"
 nesnd_crisis.20.c:0 "联络襄樊大营，准备南下。"
 nesnd_crisis.20.t:0 "伪朝禅代"
 nesnd_crisis.20.d:0 "倭吴叛明称制的消息传来，江北大臣纷纷弹冠相庆。更有人提起牧家天子当年御辇南下的盛举。毕竟伪吴郑狗与西府各省决裂互斗中无暇北顾。南征统一或可一举成功。\n\n有心人的策动下，边将请拨军饷，并派员联络湖广的“有识之士”。然而，我朝却不是什么太平兴国之世界。国内若仍在推进地权改革，此时卷入南朝的混战，未来是福是祸仍未可知也。"
 nesnd_crisis.21.a:0 "保障通商，维持往来。"
 nesnd_crisis.21.b:0 "接纳南来之人。"
 nesnd_crisis.21.c:0 "向反吴诸省提供军需。"
 nesnd_crisis.21.t:0 "南方的来客"
 nesnd_crisis.21.d:0 "郑氏的舰队、商馆与属地，将南朝战争的消息带到了远方。各港商人担心货物遭到扣押，交战各方的使者则要求承认自己的政府，并为军需和借款寻求援助。\n\n[ROOT.GetCountry.GetName]在这些往来里有自己的盘算。要保住通商，就得同实际握着港口和航线的人打交道；收留流亡者、接济反吴军队，则会把南朝的新旧势力同我国拴得更紧。"
 nesnd_crisis.40.a:0 "分案审理，留用地方人才。"
 nesnd_crisis.40.b:0 "清查旧党，重定军政。"
 nesnd_crisis.40.t:0 "经始新朝"
 nesnd_crisis.40.d:0 "战事平定，地方军政陆续归入吴朝。如今要问的是怎样施政：被战争打断的生产和通商要恢复，各省百姓还要过日子，反对过郑氏的官员和士人也不会随战败一起消失。\n\n南府多年攒下的军财，撑得起重建。天下人要从头几道政令里，看清郑氏自己的朝廷是什么样子。"
 nesnd_crisis.41.a:0 "整顿军政，颁行新章。"
 nesnd_crisis.41.b:0 "依旧例酬赏诸军。"
 nesnd_crisis.41.t:0 "回到海峡这一边"
 nesnd_crisis.41.d:0 "参战军队陆续归国。地方领主要求兑现出兵时的许诺，港口商人催促恢复航运，中央也须重新安排驻军与征收。\n\n大陆一战，给了[ROOT.GetCountry.GetName]整理军政的机会。"
 nesnd_early_accession:0 "提前推动易代"
 nesnd_early_accession_desc:0 "南府已经掌握南朝兵财。召集支持郑氏的臣僚，向明廷提出禅位之请，并要求各省与海外诸邦表明立场。"
 nesnd_huguang_preparations_status:0 "完成书院、粮运、老兵集会三项准备，每项#v 30#!点。达到#v 90#!点后获得#v 10年#!地方防卫收益。"
 nesnd_crisis.11.f:0 "“人犯分别看守，往来文书悉数封存。明日入阁，仍议前案。”"
 nesnd_crisis.30.f:0 "“军中说田归营里，县里说田归国里。我们只问一句：去年交的钱，究竟赎回了什么？”"
 nesnd_crisis.33.f:0 "“当年随军出征，说是替天下人打一个有田可耕、有理可诉的世道。如今到了自己乡里，竟要重新问一遍。”"
 nesnd_crisis.31.f:0 "“饷出本省，兵守本省。京中诸公既不能给饷，也该容我等自筹。”"
 nesnd_crisis.32.f:0 "“减其租，通其行，旧业仍存。如此，诸营或可罢争。”"
 nesnd_crisis.10.f:0 "“诸省、大营，咸依礼法行事。”"
 nesnd_crisis.20.f:0 "“昔年渡江之兵，今尚有在营者。若朝廷复议南征，臣请先核粮饷。”"
 nesnd_crisis.21.f:0 "“船货已经装齐，只等贵国答复：旧日的通商文书，今日还能否通行？”"
 nesnd_crisis.40.f:0 "“诸省所急，在复业，在通商，在使军民各有所养。”"
 nesnd_crisis.41.f:0 "“出兵之约，诸家各执一份。今日归国，当一并议定。”"
