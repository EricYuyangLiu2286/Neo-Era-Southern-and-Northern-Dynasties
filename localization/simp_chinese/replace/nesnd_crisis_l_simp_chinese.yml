l_simp_chinese:
 nesnd_crisis.30.a:0 "复核田契，先停争议之案。"
 nesnd_crisis.30.b:0 "责成地方议局办理。"
 nesnd_crisis.30.c:0 "令各营交册，抗命聚众者依法惩办。"
 nesnd_crisis.30.t:0 "清丈风潮"
 nesnd_crisis.30.d:0 "在某一些地区，[ROOT.GetCountry.GetName]的清丈官带着新法下乡勘定后，军功庄园却仍在按旧例征租。已经缴清赎价的农户被他们的“老爷”告知所耕之田属于军籍，不许抵触租税。一些替农民代写申诉的塾师也因包庇隐产而遭拘押。\n\n各县呈来的契约与军营的册籍彼此抵牾。县府、省府要求接手复核，清丈官则请朝廷派兵收缴隐匿的文书。迁延日久，原本期待分田的农民聚集到他们的县城，等待这个许诺解放他们的新政府作出答复。"
 nesnd_crisis.33.a:0 "撤官赔补，重审此案。"
 nesnd_crisis.33.b:0 "抗命聚众，当依国法惩办！"
 nesnd_crisis.33.t:0 "旧旗出山"
 nesnd_crisis.33.d:0 "清丈引起的搜捕，将山西的退伍军人、地方士人与失地农户聚到了一处。共和派借乡校与旧日军中关系传递文书，要求各县推举代表，审问侵夺田产的军官。\n\n然而，随着多处驻军大营拒绝交出祸首。被煽动选出的代表转而要求撤换清丈主官，重新审查田产，并赔补遭到侵夺的农户。"
 nesnd_crisis.31.a:0 "议定地方章程，暂保各省归顺。"
 nesnd_crisis.31.b:0 "诸军已各奉其主。"
 nesnd_crisis.31.t:0 "兵权下移"
 nesnd_crisis.31.d:0 "各地行营开始截留本应解往中央的税款。军官以供饷为名接管关卡、仓廪与地方官署，清丈官只能在驻军准许的地方办案。欠饷的营伍纷纷向主将索要田产，原有的营兵集团由此取得了更广的地方权力。\n\n[ROOT.GetCountry.GetName]发出的调防命令接连退回。朝廷须重新承认各营与省督的既得权力，才能维持各省对中央的归顺；继续失去军饷与官员的控制，各地便将自行建立政府。"
 nesnd_crisis.32.a:0 "准此颁诏，收束地权革命。"
 nesnd_crisis.32.b:0 "改革仍须继续。"
 nesnd_crisis.32.t:0 "安石旧祸"
 nesnd_crisis.32.d:0 "各省请求停止地权改革的文书已经汇集到朝廷，但这些不过是迫使朝廷公卿乃至天子难堪的妥协文字。[ROOT.GetCountry.GetName]的统治者们却不得不向现实的困难妥协。根据拟议的妥协政策，所谓“新契”所确认的土地将照旧归属军户，只是需要军户们承诺对佃农进行一定的减租，并不得阻止佃农离开本地务工。尚未处置的庄田、军田与宗族产业将交由地方官署继续保管，成为所谓“国家公田”，并由官府招募租佃。\n\n虽然是朝廷的屈辱，但若颁下这样一份诏书，[ROOT.GetCountry.GetName]朝廷便可使各省从清丈、申诉、聚众闹事的循环中脱身。依靠旧有地权组织起来的地方势力也将重新参与税赋的征解和乡里的治理。"
