l_simp_chinese:
 nesnd_protect_chen_button:0 "首辅警卫案"
 nesnd_protect_chen_button_desc:0 "陈东阳主持的改制触及士族、旧封君与军官的田产和爵位。东关先生本人虽无所畏惧，朝廷却不能轻视这些敌意。安排专任护卫，并决定是否令他暂留官署、清查内应，以保全继续推动新政的力量。\n\n警卫任期#v 六个月#!。详细经费与续办办法见警卫议案。"
 nesnd_protect_chen_button_requirements:0 "陈东阳仍在本国，明吴危机尚未结束，本案尚未发生。"
 nesnd_protect_chen_button_outcome_tt:0 "陈东阳遇刺时将出现护卫救援的事件分支。"
 nesnd_chen_inner_guard:0 "内阁警卫"
 nesnd_chen_residence_guard:0 "留署警卫"
 nesnd_chen_intelligence:0 "清查内应"
 nesnd_chen.1.t:0 "首辅亲卫"
 nesnd_chen.1.d:0 "陈东阳从西秦流亡南明，与吴王郑钦合力推动改制，国人共和派也由此进入南朝政权的中心。如今新政触及士族、旧封君和军官的田产与爵位，反诗、威胁信接连传来。东关先生仍以国事为念，内阁却不能把他的安危全托付给旧日同盟。\n\n朝廷可以给饷选派亲卫，也可以令首辅暂留官署，另行清查随从与接应人员。保护改革的领袖需要经费，也会使掌管警卫的内阁取得更多权力。\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.active:0 "陈东阳的专任护卫已由内阁调集，居所与行程另立班次，饷银按周支给。\n\n#bold 警卫期限#!：至#v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!。第五月后可重新拨款，续办六个月。\n#bold 内阁警卫#!：每周@money!#v 500#!、占用#v 40#![concept_authority]。本案死亡／负伤／脱险#v 15／25／60#!。\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.f:0 "其唯生生地，其唯立立民，其唯治治产。\n——《大国论》陈东阳"
 nesnd_chen.1.a:0 "亲卫归内阁调度，由朝廷给饷。"
 nesnd_chen.1.b:0 "留署理事，暂缓东行。"
 nesnd_chen.1.c:0 "彻查内应，荐举者一并问责。"
 nesnd_chen.1.e:0 "撤去专卫，恢复旧例。"
 nesnd_chen.1.z:0 "仍照旧章办理。"
 nesnd_chen.guard_tt:0 "支出@money!#v 12,000#!。六个月内每周另付@money!#v 500#!，占用#v 40#![concept_authority]。本案发生时，死亡、负伤、脱险的概率为#v 15／25／60#!。"
 nesnd_chen.residence_tt:0 "支出@money!#v 24,000#!。六个月内每周另付@money!#v 1,000#!，占用#v 80#![concept_authority]。本案发生时，死亡、负伤、脱险的概率为#v 10／20／70#!。"
 nesnd_chen.intel_tt:0 "支出@money!#v 18,000#!，武装力量[concept_approval]#n −2#!，持续六个月。警卫和情报均有效时，本案死亡、负伤、脱险的概率为#v 8／22／70#!。\n\n清查最多持续六个月。撤回专卫、陈东阳死亡或本案结案时，清查一并结束。警卫到期、陈东阳离国或明吴危机结束时，调查的护卫作用终止。续办警卫不会顺延清查期限。"
 nesnd_chen.3.t:0 "陈公负伤"
 nesnd_chen.3.d:0 "陈东阳在前往东洲讲学的航船上遭到袭击。铳弹贯穿了他的肩臂，随从将他抬入船舱，停船延医。入夜以后，渡口传出陈公尚在人世的消息，赶来探视的门生才各自退去。\n\n这位从西秦革命走到南明改制的政治家，如今负伤卧床。他在南方的追随者将遇刺经过刊入报章，要求朝廷查明随行人手的来历。各省送往内阁的文书，也开始追问南府经办的船务和警戒。朝廷围绕新政与权力归属的争执，又添了一桩不能置之不问的血案。"
 nesnd_chen.3.f:0 "以无限之天地为圆郭，取正道为方城。\n——《大国论》陈东阳"
 nesnd_chen.3.a:0 "延医诊治，仍议国事。"
 nesnd_chen.wounded_tt:0 "陈东阳获得#n 负伤#!特质。兵戈之势增加#n 10#!。本次案件已经结案，专任警卫支出停止。"
 nesnd_chen.4.t:0 "死士败露"
 nesnd_chen.4.d:0 "陈东阳的航船尚未启行，船工便发现了一只封口被换过的食盒。经手的随从供出了接应之人，循线搜得的荐书又牵出了替首辅安排船务的官员。渡口当日封闭，陈东阳在门生陪同下返回官署。\n\n西秦革命流亡者与南府郑氏共同主持改革的岁月，原已在党争中渐渐远去。如今一场未遂的谋杀，使陈东阳的行止成为[ROOT.GetCountry.GetName]朝野议论的国事。共和派继续以他的名义发表文章，内阁则派员审问人犯，将船务和随行人员的任用一并查核。"
 nesnd_chen.4.f:0 "虽一城、一郭、一隅之地，犹大国也。\n——《大国论》陈东阳"
 nesnd_chen.4.a:0 "入阁议事，另委官员查办。"
 nesnd_chen.escape_tt:0 "陈东阳在本案中脱险。兵戈之势增加#n 3#!。本次案件已经结案，专任警卫支出停止。"
 nesnd_chen.3.residence:0 "官署中的铳声惊动了值夜人员。陈东阳中弹倒在案边，医官赶来取出弹丸时，他的肩臂已经失血甚多。守卫封住院门，登楼报信，门下诸生在外等到天明，才听到陈公醒转的消息。\n\n这位从西秦革命走到南明改制的政治家，如今负伤卧床。他在南方的追随者将遇刺经过刊入报章，要求朝廷查明刺客如何进入首辅居所。专任亲卫的设立已将这处官署置于内阁的调度之下，院内的职役、引荐和交接由谁负责，须由朝廷逐项追究。"
 nesnd_chen.4.residence:0 "官署送来的食盒被换过封口，值守人员当场扣下经手的随从。荐书上列明了接应的住处，前往搜查的人从那里带回了药包与书信。陈东阳在内堂等到天明，才获知昨夜拘押的经过。\n\n西秦革命流亡者与南府郑氏共同主持改革的岁月，原已在党争中渐渐远去。如今一场未遂的谋杀，使陈东阳的行止成为[ROOT.GetCountry.GetName]朝野议论的国事。共和派继续以他的名义发表文章，内阁则派员审问人犯，将官署职役的引荐和任用一并查核。"
 nesnd_chen.death_residence_desc:0 "陈东阳暂缓了远行，仍在官署批阅奏牍。厨房送来的汤药经过两道签押，守卫直到夜间才发现封口被换过。医官赶到时，陈东阳已经不能言语。\n\n天明后，内阁封存了药盏与值夜名册。南方进步派失去了主持改制的领袖，各省派驻南京的官员聚在门外，等候朝廷公布继任人选。"
 nesnd_chen.1.residence:0 "陈东阳的专任护卫已由内阁调集，居所与行程另立班次，饷银按周支给。\n\n#bold 警卫期限#!：至#v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!。第五月后可重新拨款，续办六个月。\n#bold 留署警卫#!：每周@money!#v 1,000#!、占用#v 80#![concept_authority]。本案死亡／负伤／脱险#v 10／20／70#!。\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.intel:0 "陈东阳的专任护卫已由内阁调集，居所与行程另立班次，饷银按周支给。\n\n#bold 警卫期限#!：至#v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!。第五月后可重新拨款，续办六个月。\n#bold 内应清查#!生效至#v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_intel_ready'))]#!。警卫与清查均有效，本案死亡／负伤／脱险#v 8／22／70#!。既有警卫的周费继续支付。\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.finance_rules:0 "#bold 经费条件#!\n购办或续办须有足额[concept_gold_reserves]，未[concept_default]，且不处于[concept_bankruptcy]后的恢复期。警卫满五个月后可再次拨款续办。已有警卫时可以另拨调查经费。"
 nesnd_chen.withdraw_tt:0 "撤回专卫并停止每周警卫支出，解除警卫占用的权威。现有清查与武装力量好感修正同时结束。"
 nesnd_chen_case_concluded_tt:0 "首辅案已经结案，或陈东阳已不在本国。遇刺死亡的后续事件须先完成。"
