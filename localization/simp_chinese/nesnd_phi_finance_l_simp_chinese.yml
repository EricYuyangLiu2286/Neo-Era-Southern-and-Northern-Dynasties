l_simp_chinese:
 nesnd_phi_service_recovery:0 "吕宋驻屯经费"
 nesnd_phi_service_recovery_reason:0 "楚军南渡之后，吕宋的营垒里又添了许多湖广乡音。随林则徐出海的将士在此领饷、操练，把故乡的消息夹在家书里传回军中。群岛要供养这些驻军，也须为朝廷的远洋征调备齐舰船与水手。\n\n宣慰司请求重新商议驻屯军费、海防和岁贡。当地收入须同时维持军队与百姓的生计，中央承担多少，吕宋留下多少，将决定这支海外军队能够长久驻守的根基。"
 nesnd_phi_status_external:0 "宗属、共同市场或两国间的和平已经改变，原定补贴停止续付。今后的军费须依当前收入与军事义务重新商定。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_stalled:0 "议定的拨款尚未到账。付款国可能陷入[concept_default]，条约也可能暂停履行。驻屯经费暂须依靠已经收到的收入。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_pending:0 "两国须在120天内确认议案。签署之前，钱款与舰船仍由原有政府掌管。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_active:0 "协定正在履行，钱款将在签订12个月后终止。驻军、舰员与居民的生计仍须由现有收入维持。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_review:0 "补贴已经结束。军费、驻军与民生须再维持三个月。若需续款，仍须取得两国同意。\n$nesnd_phi_status_details_link$"
 nesnd_phi_status_proposal:0 "可请求中央分担驻屯军费，或商议分任舰队与地方海防。\n$nesnd_phi_status_details_link$"
 nesnd_phi_service_bar:0 "军民经费"
 nesnd_phi_service_bar_desc:0 "$nesnd_phi_service_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 4#!"
 nesnd_phi_service_bar_detail:0 "非建设周结余：#v £[Country.MakeScope.Var('nesnd_phi_budget').GetValue|0]#!\n舰队满员所需水手：#v [Country.MakeScope.Var('nesnd_phi_needed_crew').GetValue|0]#!\n无业劳动力：#v [Country.MakeScope.Var('nesnd_phi_unemployment').GetValue|%1]#!\n欠食劳动力：#v [Country.MakeScope.Var('nesnd_phi_starving').GetValue|%1]#!\n\n每月更新。无业与欠食份额均按全国劳动力计算。"
 nesnd_phi_continuity_bar:0 "经费巩固"
 nesnd_phi_continuity_bar_desc:0 "$nesnd_phi_continuity_bar$：#v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0] / 3#!"
 nesnd_phi_continuity_bar_detail:0 "四项条件：\n财政：非建设收支非负，未陷入[concept_default]，且未受[concept_bankruptcy]惩罚。补贴有效期间，宗主须履行付款。\n陆军：至少#v 35营#!。\n海军：驻屯方案至少#v 40舰#!、海防分任至少#v 20舰#!存活且各有#v 75%#!水手，海军维护履行至少#v 80%#!。\n民生：无业劳动力至多#v 12%#!，欠食劳动力至多#v 15%#!。\n\n和平且四项达标时，每月增加#p 1个月#!。条件中断或补贴结束，连续月份归零。军费协定曾经生效，且补贴结束后连续#v 3个月#!达标，日志即可完成。"
 nesnd_phi_request_a_button:0 "议定驻屯军费"
 nesnd_phi_request_a_button_desc:0 "依据双方已经确认且仍然一致的拥明或拥吴承诺，请中央分担海外驻屯军费。中央同意支出后，再由吕宋最后确认。\n\n$nesnd_phi_route_1_terms_tt$"
 nesnd_phi_request_b_button:0 "议定海防分任"
 nesnd_phi_request_b_button_desc:0 "议定远洋舰队与群岛海防的分工，保留西府驻屯大营。此次交涉不改变两国的政治立场。\n\n$nesnd_phi_route_2_terms_tt$"
 nesnd_phi_cancel_request_button:0 "撤回议案"
 nesnd_phi_cancel_request_button_desc:0 "撤回尚未签成的议案，30天后可重提。已有外交协定仍然有效。"
 nesnd_phi_withdraw_button:0 "提前终止钱款协定"
 nesnd_phi_withdraw_button_desc:0 "由吕宋提前退出议定的补贴条约。约束期内退出将招致条约规定的恶名与关系损失。减贡、免役及其他条约仍依各自条款履行，已经移交的舰船仍归中央。"
 nesnd_phi_route_1_terms_tt:0 "中央每周向吕宋支付#v £8,000#!，持续#v 12个月#!。另以减贡协定将收入转移比例降低#v 10个百分点#!。吕宋保留舰队与驻军。中央须有至少#v £10,000#!非建设周结余、#v £100,000#!储备，并具备签署两项协定的资格。补贴条约于一年后撤回，减贡协定仍依自身条款履行。"
 nesnd_phi_route_2_terms_tt:0 "首次签订时，吕宋向中央移交所持且未参战的#v 20艘战列舰#!，保留#v 20艘护卫舰#!与驻屯军。中央每周支付#v £3,000#!，持续#v 12个月#!，并另行签署减贡与免役协定。中央须有至少#v £5,000#!非建设周结余、#v £60,000#!储备。续签不再交舰。一年后补贴结束，减贡与免役仍依各自条款履行。"
 nesnd_phi_usm_accept_tt:0 "把核准的条款交回吕宋，待其最后确认。届时两国的签约资格、财力、宗属与舰队仍须符合议案条件，之后才支付补贴、交接舰船。"
 nesnd_phi_reject_tt:0 "退回议案，90天后可再提。"
 nesnd_phi_defer_tt:0 "本次不签约，30天后可再议。"
 nesnd_phi_finance.reject:0 "此项开支暂不核拨。"
 nesnd_phi_finance.defer:0 "退回重议。"
 nesnd_phi_finance.cancel:0 "暂缓签署。"
 nesnd_phi_finance.1.t:0 "吕宋军饷"
 nesnd_phi_finance.1.d:0 "吕宋请求中央分担驻屯军与远洋舰队的开销。宣慰司认为，这些兵船听候朝廷征调，其军饷和日常供给也不宜长久只靠群岛的收入维持。\n\n议案请中央每周拨给#v £8,000#!，支给一年，并另行减贡。是否承接这笔开支，须由中央议定。"
 nesnd_phi_finance.1.a:0 "准此军费，交吕宋核议。"
 nesnd_phi_finance.2.t:0 "海船归属"
 nesnd_phi_finance.2.d:0 "吕宋提议将二十艘战列舰交由中央海军，护卫舰留下守备群岛，驻屯大营仍归宣慰司。中央接管这些海船，也须承担它们的驻地、船员与日常供给。\n\n为此，吕宋请求免除从征义务，减轻岁贡，并由中央每周支付#v £3,000#!，支给一年，以备海防整顿。"
 nesnd_phi_finance.2.a:0 "按此分任海防。"
 nesnd_phi_finance.3.t:0 "核拨文书"
 nesnd_phi_finance.3.d:0 "中央已经核准吕宋的请求，愿意每周拨给#v £8,000#!，支给一年，减贡则另依新议。驻屯大营与舰队仍由吕宋维持。\n\n宣慰司还须最后确认，钱款才能开始支付。"
 nesnd_phi_finance.3.a:0 "钤印，依约支用。"
 nesnd_phi_finance.4.t:0 "交舰议定"
 nesnd_phi_finance.4.d:0 "中央已经同意分任海防。护卫舰将守备群岛，西府驻屯大营仍留吕宋。\n\n宣慰司此次签署，将确认交舰、减贡与免役的安排，以及每周#v £3,000#!、支给一年的补贴。续签时沿用已经交舰的结果，不再另交舰船。"
 nesnd_phi_finance.4.a:0 "签押，照册办理。"
 nesnd_phi_finance.5.t:0 "支用新章"
 nesnd_phi_finance.5.d:0 "两国已经签署协定。中央须按约支付钱款，吕宋则须统筹驻军、舰队与地方民生的开支。\n\n这一年的援助能否让群岛在款项结束后维持自己的军政，还要看现有收入能够承担多少义务。"
 nesnd_phi_finance.5.a:0 "按月查核。"
 nesnd_phi_finance.6.t:0 "一年军费"
 nesnd_phi_finance.6.d:0 "一年的拨款已经付完，补贴条约依约终止。吕宋须以现有收入维持所留军队，或再向中央商议援助。其他军事与外交义务，仍按当前宗属关系及各项条约办理。"
 nesnd_phi_finance.6.a:0 "重核来岁经费。"
 nesnd_phi_finance.7.t:0 "军费中止"
 nesnd_phi_finance.7.d:0 "中央已不能按原议继续拨款。吕宋的军需与海军官员须重新安排开支，下一份军费协定也须依当前宗属、市场与军事义务商定。"
 nesnd_phi_finance.7.a:0 "查明账目，另议支用。"
 nesnd_phi_finance.8.t:0 "营饷有经"
 nesnd_phi_finance.8.d:0 "钱款支用期结束后，吕宋已连续三个月维持军民经费。驻屯大营仍能受领军需，海船已有足够水手，地方居民的生计也达到了此前议定的条件。宣慰司可以依实际收入安排下一季开支。"
 nesnd_phi_finance.8.a:0 "照章续办。"
 nesnd_phi_finance.10.t:0 "另订的条款"
 nesnd_phi_finance.10.d:0 "两国已经通过外交交涉改订条约，其条款与此前军费协定不同。吕宋今后依新约办理，付款期限与其余义务可在外交界面查看。"
 nesnd_phi_finance.10.a:0 "依新约办理。"

 nesnd_phi_request_cash_a_button:0 "驻屯岁费（定额）"
 nesnd_phi_request_cash_a_button_desc:0 "依据双方已经确认且仍然一致的拥明或拥吴承诺，商议中央每周分担的驻屯与远洋海防经费。\n\n$nesnd_phi_cash_1_terms_tt$"
 nesnd_phi_request_cash_b_button:0 "海防分任（定额）"
 nesnd_phi_request_cash_b_button_desc:0 "中央接管战列舰，吕宋留护卫舰守备群岛，驻屯大营照旧编练，再议定分任后的军费。协议不改变拥明、拥吴、中立或自主立场。\n\n$nesnd_phi_cash_2_terms_tt$"
 nesnd_phi_cash_1_terms_tt:0 "中央每周向吕宋支付#v £8,700#!，持续#v 12个月#!。吕宋保留驻屯军与舰队，贡赋仍依现有宗属关系支付。此约不改贡率与独立倾向。中央须有至少#v £10,000#!非建设周结余、#v £100,000#!储备，并具备签约资格。两国确认后开始付款，一年后结束。"
 nesnd_phi_cash_2_terms_tt:0 "首次签订时向中央移交#v 20艘战列舰#!，吕宋保留#v 20艘护卫舰#!与驻屯军。符合资格后免除军事服务。中央每周支付#v £3,700#!，持续#v 12个月#!。贡赋仍按原有比例支付。中央须有至少#v £5,000#!非建设周结余、#v £60,000#!储备。续签不再交舰。一年后仅结束这项补贴。"
 nesnd_phi_finance.11.t:0 "驻屯岁费"
 nesnd_phi_finance.11.d:0 "吕宋请求中央分担每年的驻屯与海防开销。岁贡仍依现有章程解送，中央另从国库承担一部分军费。\n\n此次议案请每周支付#v £8,700#!，支给一年。"
 nesnd_phi_finance.11.a:0 "核准岁费，交吕宋签议。"
 nesnd_phi_finance.12.t:0 "岁费签押"
 nesnd_phi_finance.12.d:0 "中央已经核准每周#v £8,700#!、支给一年的补贴。吕宋仍按现有宗属章程解贡，舰队与驻屯大营继续由宣慰司维持。\n\n还须吕宋最后同意，拨款才能开始。"
 nesnd_phi_finance.12.a:0 "签押，分册支用。"
 nesnd_phi_finance.13.t:0 "分任海防岁费"
 nesnd_phi_finance.13.d:0 "吕宋请求中央海军接管二十艘战列舰，由中央安排驻地、船员与供给。护卫舰与驻屯大营仍留群岛。\n\n贡款照旧解送。吕宋另请每周#v £3,700#!、支给一年的补贴，并按议定条件免除从征义务。"
 nesnd_phi_finance.13.a:0 "按册分任，核拨岁费。"
 nesnd_phi_finance.14.t:0 "交舰与岁费"
 nesnd_phi_finance.14.d:0 "中央已经接受分任海防的提议。二十艘战列舰将由中央接管，护卫舰与驻屯军留守群岛。续签时仍承认此前的交舰结果。\n\n补贴每周#v £3,700#!，支给一年。贡赋与免役另依各自条款办理。吕宋尚须最后确认这份协定。"
 nesnd_phi_finance.14.a:0 "签押，照册交接。"

 nesnd_phi_propose_native_a_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟议条款：\n\n$nesnd_phi_route_1_terms_tt$"

 nesnd_phi_propose_native_b_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟议条款：\n\n$nesnd_phi_route_2_terms_tt$"

 nesnd_phi_propose_cash_a_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟议条款：\n\n$nesnd_phi_cash_1_terms_tt$"

 nesnd_phi_propose_cash_b_tt:0 "将议案送交中央审议，获准后由吕宋最后确认。拟议条款：\n\n$nesnd_phi_cash_2_terms_tt$"
 nesnd_phi_status_details_link:0 "#tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_phi_service_bar_detail 军民状况#!#! · #tooltippable #tooltip:[ROOT.GetCountry.GetTooltipTag],nesnd_phi_continuity_bar_detail 巩固条件#!#!"
