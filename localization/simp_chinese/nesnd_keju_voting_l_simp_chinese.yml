l_simp_chinese:
 law_nesnd_keju_voting:0 "科举投票制"
 law_nesnd_keju_voting_desc:0 "只有通过科考的廪生才有进入选举和被选举权，并能在地方和中央的礼议会中参政议政。在任官员不得被推举。考题由执政者拟定，应考又需脱产读书，所以选民多是识字且家有余资的人。"
 amendment_nesnd_keju_ministry_of_rites:0 "礼部的最高决定权"
 amendment_nesnd_keju_ministry_of_rites_desc:0 "各级科考的学区划分和各地应有廪生员额将由我国礼部的翰林宿儒们讨论后重新确定，以反映我国各地区德化文风的实际情况。"
 amendment_nesnd_keju_wider_admissions:0 "扩大通过率"
 amendment_nesnd_keju_wider_admissions_desc:0 "某些地区过于严格的录取线、稀少的廪生员额将极大地有害于礼法所保证的“人人参政，以法自守，以至大同”的治理目标。因此，朝廷礼部将实行严格的监察，以保证有能力的廪生一定会成为廪生。"
 nesnd_keju_can_enact_tt:0 "至少一种主要文化属于儒家文化圈，且实业家尚未成为举足轻重的[concept_interest_group]。"
 ideology_nesnd_confucian_constitutionalist:0 "儒林立宪派"
 ideology_nesnd_confucian_constitutionalist_desc:0 "$ideology_constitutionalist_desc$"
 ideology_nesnd_confucian_republican:0 "儒林共和派"
 ideology_nesnd_confucian_republican_desc:0 "$ideology_republican_desc$"
