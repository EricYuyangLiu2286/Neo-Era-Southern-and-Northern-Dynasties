l_simp_chinese:
 je_nesnd_congress:0 "大陆会议"
 je_nesnd_congress_reason:0 "1829年的和议保全了波兰政权，也让列强共同约束它的疆界。法国希望通过会议维持这一安排，瓜分国则要求波兰放弃继续扩张。土地、独立保证与波兰人的迁徙都要经过与会国表决，被拒绝的要求将加深各国对和议的不满。"
 nesnd_congress_order_bar:0 "秩序的稳固"
 nesnd_congress_order_bar_desc:0 "秩序的稳固：[GetGlobalVariable('nesnd_congress_order').GetValue|0] / 100"
 nesnd_congress_status_voting:0 "召集人：[GetGlobalVariable('nesnd_congress_chair').GetCountry.GetName]。赞成票：[GetGlobalVariable('nesnd_congress_yes').GetValue|0]，反对票：[GetGlobalVariable('nesnd_congress_no').GetValue|0]。表决期为60天，未投票者弃权，同票时提案不通过。"
 nesnd_congress_status_recess:0 "召集人：[GetGlobalVariable('nesnd_congress_chair').GetCountry.GetName]。每次会议最多审议两项提案，大国有两票，其他国家有一票。召集人加一票，法国的意志达到60时加两票。"
 nesnd_congress_status_no_chair:0 "目前没有能够召集会议的成员国。"
 nesnd_congress_request_btn:0 "提请开会"
 nesnd_congress_request_btn_desc:0 "请求召开大陆会议。筹办会议将占用100点影响力，历时一年。下次提请开会须相隔五年。"
 nesnd_congress_submit_btn:0 "提交波兰议程"
 nesnd_congress_submit_btn_desc:0 "选择向会议提交的条款。收到会议答复后，一年内不能再从此处提案。每国同时只能保留一项提案，会议开始后不再接受新提案。战后领土要求由和会提出，会议只能要求战败国交还华沙公国原有的土地。"
 nesnd_congress_sanctions_btn:0 "制裁波兰"
 nesnd_congress_sanctions_btn_desc:0 "就已揭发的秘密社团请求制裁。通过后，对象国的影响力减少100，威望减少10%，持续五年。制裁通过还将使“刺刀之林”的革命压力降低5。"
 nesnd_congress_request_cost:0 "筹备大陆会议"
 nesnd_congress_sanction:0 "大陆会议的制裁"
 nesnd_congress_guarantee_treaty:0 "大陆会议独立保证"
 nesnd_congress.1.t:0 "大陆会议的表决"
 nesnd_congress.1.d:0 "[SCOPE.sCountry('congress_proposer').GetName]向会议提交了涉及[SCOPE.sCountry('congress_target').GetName]的提案。我们的使节必须说明本国立场。大国的反对足以阻碍提案，但任何一国都不能独自否决会议。"
 nesnd_congress.1.a:0 "赞成提案。"
 nesnd_congress.1.b:0 "反对提案。"
 nesnd_congress.1.c:0 "不投票。"
 nesnd_congress.2.t:0 "会议的答复"
 nesnd_congress.2.pass:0 "我们的提案已获多数票支持，会议通过了所提条款。"
 nesnd_congress.2.veto:0 "我们的提案未获多数票支持。会议拒绝改变现状，这一要求仍将影响本国对大陆秩序的态度。"
 nesnd_congress.2.invalid:0 "提案所涉国家或条款的条件已改变，会议停止审议这一要求。"
 nesnd_congress.2.a:0 "我们已收到答复。"
 nesnd_congress.3.t:0 "波兰的要求"
 nesnd_congress.3.d:0 "1829年和议留下的独立保证与疆界仍然制约着本国的政策。我们可以请求重新保证独立，也可以要求瓜分国允许波兰人迁出。领土要求须等待战后的和会，白和平不能迫使对方割地。"
 nesnd_congress.3.guarantee:0 "请求[SCOPE.sCountry('congress_france').GetName]保证独立。"
 nesnd_congress.3.cancel:0 "暂不提交要求。"
 nesnd_congress.3.migrate_RUS:0 "请求[SCOPE.sCountry('congress_rus').GetName]准许波兰人迁出。"
 nesnd_congress.3.migrate_PRU:0 "请求[SCOPE.sCountry('congress_pru').GetName]准许波兰人迁出。"
 nesnd_congress.3.migrate_AUS:0 "请求[SCOPE.sCountry('congress_aus').GetName]准许波兰人迁出。"
 nesnd_congress.1.land:0 "[SCOPE.sCountry('congress_proposer').GetName]要求[SCOPE.sCountry('congress_target').GetName]移交华沙公国旧疆内的一州。若提案国保持守约，且法国的意志达到60，最多可移交两州。割地以战败国仍然管辖的公国旧土为限。"
 nesnd_congress.1.guarantee:0 "[SCOPE.sCountry('congress_proposer').GetName]请求[SCOPE.sCountry('congress_target').GetName]保证其独立，并作出五年的政治承诺。两国之间已有保证的，会议将重新确认这项条款。若两国已无独立保证，则签订拘束期为五年的新保证条约。"
 nesnd_congress.1.migration:0 "[SCOPE.sCountry('congress_proposer').GetName]请求[SCOPE.sCountry('congress_target').GetName]准许境内5%的波兰人迁出。这些人将分批启程，去处依接收政策决定。此项决议通过后，五年内不能再次要求同一国家放行。"
 nesnd_congress.1.sanctions:0 "[SCOPE.sCountry('congress_proposer').GetName]以秘密社团被揭发为由，请求制裁[SCOPE.sCountry('congress_target').GetName]。若提案通过，对象国的影响力减少100，威望减少10%，持续五年。制裁通过还将使“刺刀之林”的革命压力降低5。"
 nesnd_request_first_congress:0 "$nesnd_congress_request_btn$"
 nesnd_request_first_congress_desc:0 "$nesnd_congress_request_btn_desc$"
 nesnd_congress_vacancy_tt:0 "本届会议的两项议程中至少还有一项空缺"
 nesnd_congress_no_request_tt:0 "尚无成员国提请召开本次会议"
 nesnd_congress.4.t:0 "提请召开大陆会议"
 nesnd_congress.4.chair:0 "我国已向召集国[SCOPE.sCountry('congress_recipient').GetName]递交开会请求。\n\n$nesnd_congress.4.next$"
 nesnd_congress.4.pending:0 "我国已提请召开大陆会议。召集国尚待推定，请求将由就任的召集国受理。\n\n$nesnd_congress.4.next$"
 nesnd_congress.4.next:0 "召集国按月审议请求。已有议案时，与会国将收到选票。若议程尚空，须等$nesnd_lobby_name_kra$应邀提案后才能表决。"
 nesnd_congress.4.a:0 "候会。"
