l_simp_chinese:
 je_nesnd_polish_exile: "波兰朝圣者"
 je_nesnd_polish_exile_reason: "瓜分各国的统治与[GetCulture('polish').GetName]人的复国愿望始终不能相容。起义败北与排外政策使一批又一批人离开故土，投奔$nesnd_lobby_name_kra$，或前往巴黎寻找政治同盟。接收者可以得到劳动力与支持者，境外的复国运动将随之失去人口。安置流亡者所需的费用，将由接收国承担。"
 nesnd_polish_exile_speed_row: "流出国法律与两国边境政策"
 nesnd_polish_exile_complete: "本轮流亡人口已离境。此后仍可因起义失败或排外政策出现新的流亡者，最迟至1900年停止安置。"
 nesnd_polish_exile_complete_tt: "各国已没有尚待离境的[GetCulture('polish').GetName]人口。"
 nesnd_polish_exile_timeout: "1900年已至，流亡人口的特别安置停止。尚未离境的人口留在原居地。"
 nesnd_polish_exile_totals: "截止：1900年1月1日。\n本轮抵达：[GetGlobalVariable('nesnd_polish_exile_arrived').GetValue|0]人。途中死亡：[GetGlobalVariable('nesnd_polish_exile_dead').GetValue|0]人。"
 nesnd_polish_exile_waiting: "尚无可通行的迁移路线。有限接收需要接收州有未满员的建筑，交战双方之间不能迁移。\n$nesnd_polish_exile_totals$"
 ce_polish_exile_open_btn: "开放边界"
 ce_polish_exile_open_btn_desc: "此后出发的流亡者前往本国各州。每批抵达时支付三周固定收入的安置费。正常损耗为0–5%，流出国封锁边境时为5–10%。"
 ce_polish_exile_limited_btn: "有限接收"
 ce_polish_exile_limited_btn_desc: "接收州必须有未满员的建筑。启程速度减半，每批抵达时支付三周固定收入的安置费。已安排的本国路线同样受空岗位限制。"
 ce_polish_exile_paris_btn: "送往巴黎"
 ce_polish_exile_paris_btn_desc: "此后出发的流亡者前往$nesnd_lobby_name_fra$控制的[GetStateRegion('STATE_ILE_DE_FRANCE').GetName]，本国不付安置费。每批抵达使法国的意志增加1点，累计最多10点，并使红白之争向红党移动2点。"
 ce_polish_exile_release_btn: "放行流亡者"
 ce_polish_exile_release_btn_desc: "恢复正常启程速度，每批离境使本国[GetCulture('polish').GetName]人口中的激进派减少1%。"
 ce_polish_exile_blockade_btn: "封锁边境"
 ce_polish_exile_blockade_btn_desc: "启程速度降至四分之一，途中损耗增加5个百分点。每批离境使本国[GetCulture('polish').GetName]人口中的激进派增加1%。"
 nesnd_polish_exile_bar_1: "流亡者行程"
 nesnd_polish_exile_bar_1_desc: "流亡者行程：[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/100"
 nesnd_polish_exile_route_1: "[GetGlobalVariable('nesnd_polish_exile_source_1').GetCountry.GetName]的[GetCulture('polish').GetName]人正从[GetGlobalVariable('nesnd_polish_exile_from_1').GetState.GetName]前往[GetGlobalVariable('nesnd_polish_exile_to_1').GetState.GetName]。该国尚待离境：[GetGlobalVariable('nesnd_polish_exile_source_1').GetCountry.MakeScope.Var('nesnd_polish_exile_due').GetValue|0]人。"
 nesnd_polish_exile_status_1: "$nesnd_polish_exile_route_1$\n$nesnd_polish_exile_totals$"
 nesnd_polish_exile_not_open_tt:0 "本国目前尚未向波兰流亡者全面开放边界"
 nesnd_polish_exile_not_limited_tt:0 "本国目前未实行有限接收"
 nesnd_polish_exile_not_paris_tt:0 "当前没有将新出发的波兰流亡者送往巴黎"
