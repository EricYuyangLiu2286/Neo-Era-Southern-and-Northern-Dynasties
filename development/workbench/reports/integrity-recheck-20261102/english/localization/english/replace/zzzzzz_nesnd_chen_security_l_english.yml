l_english:
 nesnd_protect_chen_button: "The Chief Minister’s Security"
 nesnd_protect_chen_button_desc: "Provide a six-month guard for the Chief Minister and investigate those responsible for his travels.\n\nWithout protection, the chances of death, injury and escape are #v 40/25/35#!. The attempt can occur only once. Protection must still be in force when it occurs."
 nesnd_protect_chen_button_requirements: "Chen Dongyang remains in this country, the succession crisis is unresolved, and this plot has not occurred."
 nesnd_chen_inner_guard: "Cabinet Guard Detail"
 nesnd_chen_residence_guard: "Guarded Residence"
 nesnd_chen_intelligence: "Investigation of the Escort"
 nesnd_chen.1.t: "The Chief Minister’s Guard"
 nesnd_chen.1.d: "Chen Dongyang entered Southern Ming as an exile from the Western Qin revolution. His alliance with Prince Zheng Qin brought the national republicans into the centre of southern government. Much of the army, revenue administration and overseas trading network remained under the Southern Command; the Cabinet depended on those institutions to carry out its appointments and land measures.\n\nEvery journey now requires another arrangement of ships, attendants and local escorts. The Cabinet asks [ROOT.GetCountry.GetName] to fund a guard answerable to the Chief Minister. Its pay and authority are before the court today.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.active: "The guard detail is in place and its register is checked daily.\n\n#bold Guard expires#!: #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!. Renew after the fifth month for another six months.\n#bold Cabinet guard#!: @money!#v 500#! weekly, #v 40#! [concept_authority]; death/wounding/escape #v 15/25/60#!.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.f: "Sustain the living, establish the people, and order their livelihoods.\n— Chen Dongyang, On the Great Nation"
 nesnd_chen.1.a: "Place the guard under the Cabinet and pay it from the treasury."
 nesnd_chen.1.b: "Remain in the guarded offices and postpone the eastern journey."
 nesnd_chen.1.c: "Investigate the accomplices and those who recommended them."
 nesnd_chen.1.e: "Withdraw the special guard and restore the usual arrangements."
 nesnd_chen.1.z: "Keep the existing arrangements."
 nesnd_chen.guard_tt: "Pay @money!#v 12,000#!, then @money!#v 500#! per week and #v 40#! [concept_authority] for six months. Death/wounding/escape chances for this plot: #v 15/25/60#!."
 nesnd_chen.residence_tt: "Pay @money!#v 24,000#!, then @money!#v 1,000#! per week and #v 80#! [concept_authority] for six months. Death/wounding/escape chances: #v 10/20/70#!."
 nesnd_chen.intel_tt: "Pay @money!#v 18,000#!. Armed Forces [concept_approval]: #n −2#! for six months. With an active guard and investigation, death/wounding/escape chances are #v 8/22/70#!.\n\nThe investigation lasts at most six months. Withdrawing the guard, Chen's death, or resolution of this plot ends it as well. The investigation’s protection ends when the guard expires, Chen leaves the country or the Ming-Wu crisis ends. Renewing the guard does not extend the investigation."
 nesnd_chen.3.t: "Minister Chen Wounded"
 nesnd_chen.3.d: "Chen Dongyang was attacked aboard the vessel carrying him east to lecture. A shot passed through his shoulder and arm. His attendants took him below and summoned a physician. Only after nightfall did his waiting students hear that he was still alive.\n\nThe veteran of the Western Qin revolution and the southern reforms now lay wounded. His followers published accounts of the attack and demanded an inquiry into the escort. Provincial correspondence questioned the Southern Command’s shipping arrangements, adding the bloodshed to the struggle over reform and political authority."
 nesnd_chen.3.f: "Take the boundless world as the outer wall, and the right path as the inner city.\n— Chen Dongyang, On the Great Nation"
 nesnd_chen.3.a: "Attend to his wounds and continue the affairs of state."
 nesnd_chen.wounded_tt: "Chen Dongyang is wounded. Armed confrontation rises by #n 10#!. This plot is concluded and the special guard costs end."
 nesnd_chen.4.t: "The Assassins Discovered"
 nesnd_chen.4.d: "Before Chen’s vessel departed, a boatman noticed that a food box had been resealed. The attendant who handled it named his contact. Letters recovered from the contact’s rooms implicated officials who had arranged the journey. The landing was closed and Chen returned to his offices with his students.\n\nParty conflict had eroded the old alliance between the Western Qin exiles and the Zheng command. The attempted murder made Chen’s movements a matter of public debate across [ROOT.GetCountry.GetName]. Republicans continued publishing in his name, while the Cabinet investigated the prisoners and the appointment of the escort."
 nesnd_chen.4.f: "Even one city, one enclosure, one small corner may still be a great nation.\n— Chen Dongyang, On the Great Nation"
 nesnd_chen.4.a: "Resume the sitting and appoint an inquiry."
 nesnd_chen.escape_tt: "Chen Dongyang survives this plot. Armed confrontation rises by #n 3#!. This plot is concluded and the special guard costs end."
 nesnd_chen.3.residence: "A shot rang through the guarded offices. Chen fell beside his desk and lost much blood before the physician removed the bullet. The watch sealed the gates. His students waited outside until dawn for word that he had regained consciousness.\n\nHis followers published accounts of the attack and demanded to know how the assailant had entered the residence. The Cabinet had assumed responsibility for its security. The appointments, recommendations and handovers inside the compound would now be examined by the court."
 nesnd_chen.4.residence: "The watch found a replaced seal on the evening food box and detained the attendant who carried it. His recommendation identified an address where investigators recovered letters and a packet of medicine. Chen remained indoors until dawn, when he learned what had happened.\n\nParty conflict had eroded the old alliance between the Western Qin exiles and the Zheng command. The attempted murder made Chen’s movements a matter of public debate across [ROOT.GetCountry.GetName]. Republicans continued publishing in his name, while the Cabinet examined the appointments and recommendations within the residence."
 nesnd_chen.death_residence_desc: "Chen postponed his journey and continued working in the guarded offices. Two signatures accompanied the medicine brought from the kitchen, but its seal had been replaced. By the time the physician arrived, Chen could no longer speak.\n\nAt dawn the Cabinet sealed the bowl and the duty register. The southern reformers had lost their leader. Provincial delegates gathered outside, waiting for the appointment of a successor."
 nesnd_chen.1.residence: "The guard detail is in place and its register is checked daily.\n\n#bold Guard expires#!: #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!. Renew after the fifth month for another six months.\n#bold Guarded residence#!: @money!#v 1,000#! weekly, #v 80#! [concept_authority]; death/wounding/escape #v 10/20/70#!.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.1.intel: "The guard detail is in place and its register is checked daily.\n\n#bold Guard expires#!: #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_guard_active'))]#!. Renew after the fifth month for another six months.\n#bold Investigation#! expires #v [TimeKeeper.GetCurrentDateWithDiff(GetVarTimeRemaining(ROOT.GetCountry.MakeScope, 'nesnd_chen_intel_ready'))]#!. With both measures active, death/wounding/escape #v 8/22/70#!. Existing guard payments continue.\n\n$nesnd_chen.finance_rules$"
 nesnd_chen.finance_rules: "#bold Funding conditions#!\nPurchase or renewal requires sufficient [concept_gold_reserves], no [concept_default], and no continuing post-[concept_bankruptcy] penalty. Guards can be renewed after five months; an active guard also permits a separately funded investigation."
 nesnd_chen.withdraw_tt: "Withdraw the guard, end its weekly expenses and release its authority cost. The current investigation and its Armed Forces approval modifier also end."
