l_english:
 nesnd_board_ming_bar_name:0 "Ming Continuity"
 nesnd_board_wu_bar_name:0 "Zheng Statecraft"
 nesnd_board_ming_bar_desc:0 "Support for continuity: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_wu_bar_desc:0 "Foundations of the new order: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_board_compact_bar_name:0 "Provincial Accords"
 nesnd_board_compact_bar_desc:0 "Active accords for the central route: #v [JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1] / 100#!"
 nesnd_south_politics_summary:0 "#bold Political support#!: mainland #v 50#!, overseas #v 30#!, Japan #v 20#!. Each group's share is divided among its participating governments. Foreign sponsors have no vote in the succession.\n#bold Shared foundations#!: finances #v [GetGlobalVariable('nesnd_south_finance').GetValue|1]/20#!; cooperation in government #v [GetGlobalVariable('nesnd_south_domestic').GetValue|1]/20#!. A living, legitimate Zhu monarch contributes #v 20#! points to Ming continuity; Wu military power contributes #v [GetGlobalVariable('nesnd_south_military').GetValue|1]/20#!.\n#bold Accords in force#!: Ming #v [GetGlobalVariable('nesnd_south_ming_accord').GetValue|1]%#!; Wu #v [GetGlobalVariable('nesnd_south_wu_accord').GetValue|1]%#!. Months of uninterrupted compliance: #v [GetGlobalVariable('nesnd_south_peace_months').GetValue|0]/12#!, with a minimum #v 12-month#! period before settlement.\nPeace requires a chosen side, political support of #v 85#! and a lead of #v 20#!. Ming requires #v 75%#! accord support and two mainland strongholds. Wu requires #v 80%#!, the consent of every government surrendering territory and of the Japanese parties, and a fleet with sufficient crews and maintenance."
 nesnd_south_offer_accord:0 "Send Negotiators"
 nesnd_south_offer_accord_desc:0 "Send the proposed settlement for our chosen route to the participating governments."
 nesnd_south_offer_available_tt:0 "Choose Ming or Wu before the rupture. We must be at peace and solvent, the interval between invitations must have elapsed, and an eligible government must be willing to receive our envoys."
 nesnd_south_accord_offer_tt:0 "Ask eligible members to accept or reject the accord. Invitation cooldown: #v 6 months#!. Negotiation costs: government wages #n +3%#! and [concept_authority] #n −25#! for six months."
 nesnd_south_accord_accept_tt:0 "Support this route and sign a #v 36-month#! accord. The stance is fixed for #v 6 months#!. Changing sides, fighting USM, taking another overlord or expiry invalidates the commitment. Wu mainland terms include integration of eligible Chinese states; Japanese terms cede only our own Shikoku and Kyushu territories while retaining the remainder. Relations with the centre #p +15#!."
 nesnd_south_leave_accord:0 "Withdraw the Accord"
 nesnd_south_leave_accord_desc:0 "Withdraw our political commitment and reconsider relations with the centre."
 nesnd_south_accord_leave_tt:0 "Remove the active signature and consent to unexecuted integration or cession. Relations with the centre #n −15#!; stance cooldown #v 6 months#!."
 nesnd_board_stance_effect_tt:0 "Record the new position and withdraw incompatible accords. The position can be changed again after #v 6 months#!. A member with an active accord also withdraws consent to unexecuted integration or cession; relations with the centre #n −15#!."
 nesnd_south_retry_confrontation:0 "Renew the Provincial Demands"
 nesnd_south_retry_confrontation_desc:0 "Our demands have yet to bring the dispute to a head. Present them again to the governments still opposing us."
 nesnd_south_accords.1.t:0 "The Provincial Accord"
 nesnd_south_accords.1.ming:0 "The cabinet has delivered its proposed accord to [ROOT.GetCountry.GetName]. The Zhu emperor would continue to preside over the common court, while the provincial governments retain their territories and existing legal systems. The envoy carries records of discussions on appointments and revenues and seeks a formal reply to place before the court."
 nesnd_south_accords.1.integration:0 "The Zheng envoy proposes to bring the mainland polities under direct provincial rule. Their Chinese territories covered by the agreement would pass to the central government, together with responsibility for their people, estates and workshops. The envoy has set out the lands to be transferred and now awaits our consent."
 nesnd_south_accords.1.japan:0 "The southern mission has presented a new arrangement for the eastern seas. It asks the Japanese governments to recognize the Wu order and cede their own territories in Shikoku and Kyushu to direct Wu administration, retaining their other lands. The envoy awaits a reply while the ports and military offices verify the affected districts."
 nesnd_south_accords.1.overseas:0 "The Zheng envoy has reached [ROOT.GetCountry.GetName] seeking recognition for the new dynasty. Our government, territory and subject arrangements would remain in place. Port administration, trade and military expenses would be settled by separate agreements; the court seeks our political allegiance today."
 nesnd_south_accords.1.a:0 "Sign and recognize the accord."
 nesnd_south_accords.1.b:0 "Accept provincial integration."
 nesnd_south_accords.1.c:0 "Accept the eastern settlement and cessions."
 nesnd_south_accords.1.d:0 "Decline to sign for now."
 nesnd_south_accords.20.t:0 "A Renewed Dynastic Compact"
 nesnd_south_accords.20.d:0 "The provincial governments have honored their agreements for a year. Local administrations conduct their own affairs within the common court, and the Zhu emperor can proclaim a renewed compact among the southern polities."
 nesnd_south_accords.20.a:0 "Proclaim the renewed compact."
 nesnd_south_accords.21.t:0 "The Foundations of Wu"
 nesnd_south_accords.21.d:0 "The mainland provinces have consented to reorganization, and the overseas and Japanese governments have delivered their replies. A year of cooperation has sustained the administration, armed forces and sea routes. The Zheng court is ready to proclaim its dynasty and assume control of the agreed territories."
 nesnd_south_accords.21.a:0 "Establish Wu under the agreed terms."
 nesnd_south_accords.reconsider:0 "Continue negotiations and begin a new period of compliance."
 nesnd_south_ming_peace_result_tt:0 "Preserve the reigning Zhu monarch and the Ming state. Members retain their territories, governments and economic laws. The center accepts #v 10 years#! of obligations under the compact. Signatories that honor the agreement receive temporary Prestige according to their preparations."
 nesnd_south_wu_peace_result_tt:0 "Establish Wu and integrate only eligible Chinese territories with explicit consent and local control. Overseas countries and overseas lands remain separate. Japan cedes only its own Shikoku and Kyushu territories. A player who explicitly accepted whole-country integration takes control of Wu only if no other human controls it. New provinces face #v 12 months#! of transition costs."
 nesnd_south_accords.22.t:0 "The Compact Proclaimed"
 nesnd_south_accords.22.d:0 "The proclamation has been issued, and the provincial signatures and seals have entered a common register. The Zhu emperor continues to preside over the southern court while local governments administer their own affairs. Its obligations will shape the finances, construction and diplomacy of the renewed order."
 nesnd_south_accords.23.t:0 "The Wu Dynasty"
 nesnd_south_accords.23.d:0 "The new seals have reached the provinces that accepted integration. Treasuries and military offices exchange their registers; overseas governments issue letters recognizing the dynasty, and the ceded Japanese districts begin changing administrations. The Zheng house has converted its military, fiscal and maritime power into a new title, with obligations it must now fulfil."
 nesnd_south_accords.done:0 "Implement the agreements."
 nesnd_south_negotiation_cost:0 "Provincial Negotiations"
 nesnd_south_accord_respected:0 "Accord Honoured"
 nesnd_south_prepared_member:0 "Prepared Administration"
 nesnd_south_prepared_mobilization:0 "Prepared Mobilization"
 nesnd_south_hasty_mobilization:0 "Hasty Mobilization"
 nesnd_south_peace_administration:0 "Peaceful Reorganization"
 nesnd_south_new_province:0 "Provincial Handover"
 nesnd_south_ready_unknown:0 "National preparedness has not yet been assessed."
 nesnd_south_ready_known:0 "Preparations #v [Country.MakeScope.Var('nesnd_ready_total').GetValue|1]/100#! (finances [Country.MakeScope.Var('nesnd_ready_finance').GetValue|1]/20, military [Country.MakeScope.Var('nesnd_ready_military').GetValue|1]/35, inputs [Country.MakeScope.Var('nesnd_ready_supply').GetValue|0]/25, government [Country.MakeScope.Var('nesnd_ready_domestic').GetValue|1]/20)\nCrew #v [Country.MakeScope.Var('nesnd_ready_actual_crew').GetValue|D]#!; crew-ready ships #v [Country.MakeScope.Var('nesnd_ready_ships_ready').GetValue|0]/[Country.MakeScope.Var('nesnd_ready_ships').GetValue|0]#!; naval projection #v [Country.MakeScope.Var('nesnd_ready_naval_projection').GetValue|1]#!."
 nesnd_south_compact_detail_tt:0 "Only current signatories count toward accord support. Mainland, overseas and Japanese governments carry weights of #v 50/30/20#!, with each group's share divided among its members. Accords last #v 36 months#! and lapse if a signatory changes overlord or allegiance, goes to war or withdraws. All peace conditions must hold for #v 12 consecutive months#!. Negotiation progress alone cannot settle the crisis."
 nesnd_board_country_metrics:0 "Regular #v [Country.GetRegularBattalions|0]#! / Conscriptable #v [Country.CalcConscriptableBattalions|0]#!　Ships #v [Country.GetNumShips|0]#!\nFixed balance @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　Army projection #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\nSupply preparations: [Country.GetCustom('nesnd_board_supply_loc')]\n[Country.GetCustom('nesnd_south_ready_loc')]"
 nesnd_south_failed_alignment:0 "A Defeated Alignment"
