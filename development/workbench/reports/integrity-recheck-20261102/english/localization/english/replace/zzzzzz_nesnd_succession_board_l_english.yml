 nesnd_federal_compact_button_outcome_tt:0 "Central negotiation progress #p +20#!; succession pressure #p −8#!. Renewal is available after #v 18 months#!."
 nesnd_south_compact_detail_tt:0 "#bold Central negotiation progress#!: #v [Country.MakeScope.ScriptValue('nesnd_south_compact_value')|0] / 100#!\nEach renewal adds #p 20#! and reduces pressure by #p 8#!, with an #v 18-month#! cooldown.\nRenewal requires nonnegative [concept_bureaucracy], at least #v 50#! [concept_legitimacy], and an active Wu–Ming controversy. The Federal Compact modifier lasts #v 10 years#! and reduces monthly pressure growth to #n 0.4#!. A peaceful settlement depends on commitments and political conditions."

