l_english:
 je_group_nesnd_succession:0 "The Southern Polities"
 nesnd_south_succession_board:0 "The Southern Polities"
 nesnd_south_succession_board_reason:0 "Does the southern realm belong to the Zhu emperors, or to the Zheng rulers whose fleets and armies have carried it across the seas? Edicts travel from Nanjing to the same countries reached by Hangzhou’s merchants, tax collectors and warships. Centuries of Ming legitimacy now stand against the achievements and resources of Wu.\n\nXiangfan remains loyal to the Ming. Sichuan debates the reforms of the Southern Court, while overseas governors and Japanese lords consider the money, land and troops a new dynasty might demand. Their answers will soon have to be sustained by their own forces."
 nesnd_south_succession_board_status:0 "The provinces exchange envoys and prepare their forces. The dispute over the dynasty increasingly turns upon money and arms."
 nesnd_board_table_heading:0 "The Southern Countries"
 nesnd_board_country_metrics:0 "Regular #v [Country.GetRegularBattalions|0]#! / Conscriptable #v [Country.CalcConscriptableBattalions|0]#!　Ships #v [Country.GetNumShips|0]#!\nFixed balance @money![Country.MakeScope.Var('nesnd_board_fixed_balance').GetValue|D+]　[concept_bureaucracy] [Country.MakeScope.Var('nesnd_board_bureaucracy').GetValue|D+]\n[concept_legitimacy] #v [Country.MakeScope.Var('nesnd_board_legitimacy').GetValue|0]#!　Army projection #v [Country.MakeScope.Var('nesnd_board_army_projection').GetValue|1]#!\nSupply preparations: [Country.GetCustom('nesnd_board_supply_loc')]"
 nesnd_board_supply_known:0 "#v [Country.MakeScope.Var('nesnd_board_supply_score').GetValue|0] / 4#! conditions"
 nesnd_board_supply_unknown:0 "Not assessed"
 nesnd_board_stance_unstated:0 "Undeclared"
 nesnd_board_stance_ming:0 "Ming"
 nesnd_board_stance_wu:0 "Wu"
 nesnd_board_stance_neutral:0 "Neutral"
 nesnd_board_stance_autonomy:0 "Autonomy"
 nesnd_board_stance_available_tt:0 "The civil war has not begun, and six months have passed since our last change of allegiance. Xiangfan remains committed to Ming; the central court cannot choose neutrality or autonomy."
 nesnd_board_stance_effect_tt:0 "Record our position in the register. It can be changed again after #v 6 months#!. A member with an active accord also withdraws consent to unexecuted integration or cession; relations with the centre #n −15#!."
 nesnd_board_choose_ming:0 "Support the Ming Court"
 nesnd_board_choose_ming_desc:0 "Recognize the Zhu emperor and approach governments willing to preserve the court."
 nesnd_board_choose_wu:0 "Support the Zheng House"
 nesnd_board_choose_wu_desc:0 "Support a Zheng dynasty and negotiate our place in its order."
 nesnd_board_choose_neutral:0 "Remain Neutral"
 nesnd_board_choose_neutral_desc:0 "Withhold military commitments in the succession dispute while preserving existing trade and diplomacy."
 nesnd_board_choose_autonomy:0 "Seek Autonomy"
 nesnd_board_choose_autonomy_desc:0 "Negotiate control over our government, market and defence arrangements."
