l_english:
 character_role_nesnd_ming_refuge:0 "Ming Royal"
 character_role_nesnd_ming_refuge_desc:0 "A surviving member of the Ming dynasty during the southern succession."
 nesnd_board_external_observer:0 "External Observer"
 nesnd_south_reconciliation:0 "Renewing the Accords"
 nesnd_south_reconciliation_reason:0 "For centuries, relations between the court and the provincial governments have involved tribute, military obligations and dynastic authority. Zheng administration added overseas trade and a standing army to this imperial network. With the governments now choosing their accords, the central administration must provide the officials and funds promised in those agreements."
 nesnd_south_reconciliation_status:0 "Months of accord implementation: #v [JournalEntry.GetCountry.MakeScope.Var('nesnd_south_reconciliation_payments').GetValue|0]#!. Succession Pressure: #v [JournalEntry.GetCountry.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!. While active: [concept_budget_government_wages] #n +5%#!, [concept_authority] #n −50#!. The commission ends at #v 40#! pressure."
 nesnd_south_reconciliation_start:0 "Implement the Accords"
 nesnd_south_reconciliation_start_desc:0 "Send officials to the signatory governments and fund the administration promised under the accords."
 nesnd_south_reconciliation_stop:0 "End the Commission"
 nesnd_south_reconciliation_stop_desc:0 "Withdraw the officials and end the additional administrative expense and monthly pressure reduction."
 nesnd_south_reconciliation_requirements:0 "Meet every other peace requirement for the chosen Ming or Wu route, with no southern [concept_diplomatic_play] or war and no [concept_bankruptcy] recovery penalty."
 nesnd_south_reconciliation_effect_tt:0 "While active: [concept_budget_government_wages] #n +5%#! and [concept_authority] #n −50#!. After #v 1 month#!, each month in which the chosen side meets its accord, political and financial requirements reduces Succession Pressure by #p 3#!. Signing or renewing an accord does not reduce pressure immediately. If the requirements cease to be met, the commission ends. Its work is complete at #v 40#! pressure; a peaceful settlement still requires #v 12-month#! compliance."
 nesnd_south_reconciliation_cost:0 "Accord Commission Expenses"
 nesnd_ming_royal_allowance:0 "Ming Royal Allowances"
 nesnd_ming_receive_court_tt:0 "If legitimate Ming royals have taken refuge here, supporting Ming enthrones the surviving emperor or heir while retaining the local leader. With no living legitimate successor, a regency remains."
 nesnd_court_followup.15.t:0 "Royal Allowances"
 nesnd_court_followup.15.d:0 "The surviving Zhu royals in [ROOT.GetCountry.GetName] need provisions and lodgings. The new administration has agreed to support the household. The family retains its titles and genealogies, even as the government around it passes into new hands."
 nesnd_court_followup.15.a:0 "Provide for those registered."
 nesnd_court_followup.19.t:0 "Standing Agreements"
 nesnd_court_followup.19.d:0 "Two years of negotiations have produced no common settlement. Provincial governments continue to administer their territories, and the central accords have not secured a general agreement. The existing borders, governments and treaties remain in force.\n\nThe court may now end this round of negotiations and recognize the arrangements currently in place."
 nesnd_court_followup.19.a:0 "Confirm the existing arrangements."
 nesnd_court_followup.19.b:0 "Continue the negotiations."
 nesnd_south_inconclusive_order:0 "Confirm the Status Quo"
 nesnd_south_inconclusive_order_desc:0 "After two years of deadlock without a southern confrontation, conclude negotiations on the basis of existing sovereignty, borders and treaties."
 nesnd_south_inconclusive_result_tt:0 "End the Ming–Wu crisis on the basis of current territory, governments and treaties. No subjects are annexed, and neither side receives victory rewards."
 nesnd_south_pressure_detail_tt:0 "#bold Succession Pressure#!: #v [Country.MakeScope.ScriptValue('nesnd_south_pressure_value')|1] / 100#!\nMonthly change: #v [Country.MakeScope.ScriptValue('nesnd_south_monthly_pressure_value')|1]#!. Pressure rises by #n +3#! each month, or #n +2.5#! under the Federal Compact. Successful reconciliation reduces it by #p 3#!.\n\nAt #v 70#! pressure, an early accession may become possible once the court has resolved the outstanding crisis. At #v 100#!, the succession can no longer be deferred once Zheng Qin has departed. A peaceful settlement ends the dispute."
 character_role_nesnd_ming_patron:0 "Court Protector"
 character_role_nesnd_ming_patron_desc:0 "A former local ruler supporting the provisional Ming court."
