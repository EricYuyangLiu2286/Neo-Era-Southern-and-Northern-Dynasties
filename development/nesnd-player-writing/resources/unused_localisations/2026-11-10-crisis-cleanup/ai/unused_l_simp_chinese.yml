l_simp_chinese:
 nesnd_army_audit:0 "军籍田产审查"
 nesnd_refugee_reception:0 "安置南来流亡者"
 nesnd_maritime_security:0 "护航与通商交涉"
 nesnd_crisis.10.a:0 "以法建国，国家堪成！"
 nesnd_crisis.10.t:0 "《诸省、大营布政以礼法行事疏》通过"
 nesnd_crisis.10.d:0 "各省学政在礼议院支持新法，任官、田赋与军费条陈由此写入南明的国家礼法。明廷保全了朱氏统绪，中央与各省的权责也有了共同认可的依据。\n\n陈东阳重设行省布政司时，南朝已能够统一调度军政，却没有一并解决旧封君的名位与地方权力。南、西两府面临北朝南下，曾以共同的军队压服不从。如今，因战事而暂且搁置的争执终于有了法定的处置办法。"
 nesnd_crisis.11.a:0 "公布案情，循线查办。"
 nesnd_crisis.11.b:0 "密查严查，一查到底！"
 nesnd_crisis.11.t:0 "首辅门外"
 nesnd_crisis.11.d:0 "首辅护卫查获了一封伪造的换防手令。携信者与同伙很快被锦衣卫、大理寺捕获，分别收押。陈东阳先被送往安全之地，待案犯落网才返回住处。\n\n调查随后牵出经办军需、海运的官员，以及同他们往来的各省名绅与旧封君。大理寺主张公开案情，借此追究藏在官场中的关系。锦衣卫则坚持封锁消息，以免惊动尚未落网的人。内阁须决定如何继续查办，也须承担事情扩大后的政治后果。"
 nesnd_crisis.21.a:0 "保障通商，维持往来。"
 nesnd_crisis.21.b:0 "接纳南来之人。"
 nesnd_crisis.21.c:0 "向反吴诸省提供军需。"
 nesnd_crisis.21.t:0 "南方的来客"
 nesnd_crisis.21.d:0 "郑氏的舰队、商馆与属地，将南朝战争的消息带到了远方。各港商人担心货物遭到扣押，交战各方的使者则要求承认自己的政府，并为军需和借款寻求援助。\n\n[ROOT.GetCountry.GetName]在这些往来中有自己的利益。维持通商，需要与实际控制港口和航线的势力交涉。收容流亡者、接济反吴军队，也将使南朝的新旧政治力量同我国发生更深的联系。"
 nesnd_crisis.11.f:0 "“人犯分别看守，往来文书悉数封存。明日入阁，仍议前案。”"
 nesnd_crisis.10.f:0 "“诸省、大营，咸依礼法行事。”"
 nesnd_crisis.21.f:0 "“船货已经装齐，只等贵国答复：旧日的通商文书，今日还能否通行？”"
 nesnd_japan_reorganization:0 "日本军政整顿"
