l_english:
 nesnd_army_audit:0 "Military Estate Audit"
 nesnd_refugee_reception:0 "Receiving Southern Exiles"
 nesnd_maritime_security:0 "Convoy Protection and Trade Negotiations"
 nesnd_crisis.10.a:0 "With law as its foundation, the state can stand!"
 nesnd_crisis.10.t:0 "The Memorial on Constitutional Administration in the Provinces and Garrisons Is Adopted"
 nesnd_crisis.10.d:0 "Provincial delegates in the Assembly of Rites have supported the new provisions on appointments, land taxation and military funding, incorporating them into Southern Ming’s constitution. The Zhu succession endures, and the powers of the centre and provinces now rest on an accepted legal foundation.\n\nChen Dongyang’s restoration of provincial administrative commissions enabled common civil and military administration without fully resolving the status of former feudal lords and their local powers. Facing the northern advance, the Southern and Western Administrations had joined their armies to suppress resistance. Disputes then postponed by war have at last received a constitutional settlement."
 nesnd_crisis.11.a:0 "Publish the findings and pursue the investigation."
 nesnd_crisis.11.b:0 "Investigate in secret, and spare no one!"
 nesnd_crisis.11.t:0 "Outside the Chief Minister’s Residence"
 nesnd_crisis.11.d:0 "The chief minister’s guards have intercepted a forged order changing the watch. The Embroidered Uniform Guard and Court of Judicial Review arrested its bearer and accomplices. Chen Dongyang was taken to safety and returned only after the suspects had been secured.\n\nThe investigation then implicated officials handling military procurement and shipping, together with their contacts among provincial gentry and former feudal lords. The Court of Judicial Review favours disclosure to expose their official connections. The Embroidered Uniform Guard insists on secrecy to avoid alerting suspects still at large. The cabinet must decide how to proceed and bear the political consequences."
 nesnd_crisis.21.a:0 "Protect commerce and maintain relations."
 nesnd_crisis.21.b:0 "Receive those fleeing the South."
 nesnd_crisis.21.c:0 "Supply the provinces opposing Wu."
 nesnd_crisis.21.t:0 "Visitors from the South"
 nesnd_crisis.21.d:0 "Zheng fleets, trading houses and dependencies have carried news of the Southern war abroad. Merchants fear the seizure of their cargoes, while envoys from the rival sides seek recognition, military supplies and loans.\n\n[ROOT.GetCountry.GetName] has interests of its own in these exchanges. Keeping trade open requires dealings with those who control the ports and sea routes. Receiving exiles or supplying the anti-Wu forces would draw us more deeply into the Southern political struggle."
 nesnd_crisis.11.f:0 "“Hold the prisoners separately and secure all correspondence. Tomorrow, the cabinet will return to the case.”"
 nesnd_crisis.10.f:0 "“Let every province and garrison act according to the constitution.”"
 nesnd_crisis.21.f:0 "“The cargo is loaded. We await only your answer: will the old trading papers still be honoured?”"
 nesnd_japan_reorganization:0 "Japanese Administrative Reorganisation"
