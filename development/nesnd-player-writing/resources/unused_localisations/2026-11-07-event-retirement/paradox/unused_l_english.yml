 native_american_rights: "Ended Indian Removals"
 native_resettlement.1.a: "Is that even legal?"
 native_resettlement.1.d: "[SCOPE.sCharacter('indian_removal_president').GetPrimaryRoleTitle] [SCOPE.sCharacter('indian_removal_president').GetFullName] has defied the ruling of the Supreme Court and ordered the removal of the [SCOPE.sCulture('cherokee_culture').GetName] people to the [SCOPE.sCountry('indian_territory_scope').GetName]."
 native_resettlement.1.f: ""What does the Supreme Court's opinion matter? All we need to do is build a fire under them, and when it gets hot enough, they'll move, and what's ours will be ours.""
 native_resettlement.1.t: "Worcester v. Georgia"
 native_resettlement.2.a: "A treaty is a treaty. We cannot rescind what we have signed."
 native_resettlement.2.b: "Our conscience compels us to void the removal treaty."
 native_resettlement.2.d: "Chief John Ross, one of the principal [SCOPE.sCulture('cherokee_culture').GetName] chiefs, has presented a petition to Congress asking them to void the treaty which will compel the [SCOPE.sCulture('cherokee_culture').GetName] nation to relocate to the [SCOPE.sCountry('indian_territory_scope').GetName]. His petition has almost as many signatures as the entire eastern Cherokee population."
 native_resettlement.2.f: ""By the stipulations of this treaty, we are stripped of every attribute of freedom. Our property may be plundered before our eyes; violence may be committed on our persons, even our lives may be taken away, and there is none to regard our complaints. We are denationalized; we are disfranchised. We are deprived of membership in the human family!""
 native_resettlement.2.t: "John Ross' Protest Petition"
 native_resettlement.3.a: "Coerce them by bayonet-point."
 native_resettlement.3.b: "Offer some assistance for their journey."
 native_resettlement.3.d: "In accordance with the removal treaty, it is time for the [SCOPE.sCulture('cherokee_culture').GetName] of [SCOPE.sState('indian_removal_state').GetName] to relocate to the [SCOPE.sCountry('indian_territory_scope').GetName]. Some holdouts refuse to leave their homes, and many are poorly equipped for the journey."
 native_resettlement.3.f: ""My friends, circumstances render it impossible that you can flourish in the midst of our community. You have but one remedy within your reach, and that is to remove west. And the sooner you do this, the sooner you will commence your career of improvement and prosperity.""
 native_resettlement.3.t: "The Indian Removal"
 native_resettlement.4.a: "We did what we could."
 native_resettlement.4.b: "Their blood is on our hands."
 native_resettlement.4.d: "Our efforts to remove the [SCOPE.sCulture('cherokee_culture').GetName] from eastern lands has led to the deaths of many during their overland march westward."
 native_resettlement.4.f: ""Measles, cholera, starvation—this removal has created a trail of tears and death for our people.""
 native_resettlement.4.t: "The Trail of Tears"
 native_resettlement.5.a: "Let us pray that this shall never happen again."
 native_resettlement.5.d: "The removal of the [SCOPE.sCulture('cherokee_culture').GetName] to the [SCOPE.sCountry('indian_territory_scope').GetName] is complete. For good or ill, the matter is settled."
 native_resettlement.5.f: ""Who lived here before us? What name did they give to this place? Will any of us know? Does anyone still remember?""
 native_resettlement.5.t: "The Clearing of the East"
 native_resettlement.6.a: "Great suffering has been averted."
 native_resettlement.6.d: "With the passing of the [SCOPE.sLawType('pronativelaw').GetName] Law, the Indian Removal Act is annulled and the [SCOPE.sCulture('cherokee_culture').GetName] people are free to live on their ancestral lands."
 native_resettlement.6.f: "Some bard shall lift a voice in praise of thee,\nIn moving numbers tell the world how men\nScoffed thee, hissed thee, charged with lunacy!\nAnd who could not give 'nough honor when\nAt length, in spite of jeer, of want and need,\nThy genius shaped a dream into a deed." # Alexander Posey
 native_resettlement.6.t: "The Cherokee Nation"
 native_resettlement.7.a: "The Treaty of Payne's Landing is fulfilled at last."
 native_resettlement.7.d: "Our victory in Florida has compelled the [SCOPE.sCulture('seminole_people').GetName] people to surrender their last refuges to the government. Now is the time to build a new future for these vast lands."
 native_resettlement.7.f: "They fled deeper into the swamp, among the marl prairie and the cypress trees. The Bluecoats thought they'd all left, but they were wrong. Someday, they hoped, it would be safe to live outside of this sweltering shelter. For now, they lived."
 native_resettlement.7.t: "The Seminole Peace"
 officers:0 "@officers![Nbsp]$officers_no_icon$"
 pm_no_organization: "No Organized Training"
poland_events.1.a: "Have them foment unrest in [SCOPE.sCountry('polish_agitation_target_1_scope').GetName]."
poland_events.1.b: "Instruct them to [SCOPE.sCountry('polish_agitation_target_2_scope').GetName]."
poland_events.1.c: "The Poles of [SCOPE.sCountry('polish_agitation_target_3_scope').GetName] yearn for freedom."
poland_events.1.d: "The [SCOPE.GetRootScope.GetCountry.GetAdjective] communities of [SCOPE.sCulture('polish_culture_scope').GetName] patriots and exiles are both large and well-motivated. By giving them aid and clear directions we can ensure that their zeal does not go to waste."
poland_events.1.e: "Smuggle them across the [SCOPE.sCountry('polish_agitation_target_4_scope').GetAdjective] border."
poland_events.1.f: ""Word from the homeland, finally. We might have a chance at finally returning. Good food, songs, dance; everything!"\n\n"Let's not hope for more than we can reach. What did the messenger say?"\n\n"To the streets. We chant, we march, and we refuse work. And if it comes to it, we brawl.""
poland_events.1.t: "Poland is Not yet Lost"
poland_events.1.tt: "The target nation's choices and [Concept('concept_law','$concept_laws|q$')] may affect the amount of radicals generated and the degree of our relationship change."
poland_events.2.a: "[SCOPE.sCountry('sent_polish_agitators_country_scope').GetCapital.GetCityHubName] must answer for this."
poland_events.2.b: "Infiltrate and try to break up their groups."
poland_events.2.c: "Call up the gendarmes, promptly."
poland_events.2.d: "Large protests have erupted throughout the [SCOPE.sCulture('polish_culture_scope').GetName] communities in [SCOPE.GetRootScope.GetCountry.GetName], advocating for Polish statehood. Advisors believe the unrest may be connected to the actions of government-affiliated groups in [SCOPE.sCountry('sent_polish_agitators_country_scope').GetName]."
poland_events.2.f: "Peoples of a torn land will, invariably, pine for whatever glories and identities they once had. Such is the wisdom of empires of old: subjects of conquest kept their lands and their customs, but for a tribute and agreement to hold new laws. The consequences of stripping a people of their identity is, also invariably, catastrophe."
poland_events.2.t: "Is Poland Not yet Lost?"
poland_events.2.tt: "By establishing either a [GetLawType('law_secret_police').GetName] or a [GetLawType('law_national_guard').GetName], we may lessen the impact of such events in the future. However, only the elimination of [SCOPE.sCountry('sent_polish_agitators_country_scope').GetName] as a self-governing entity can truly eliminate this issue once and for all."
