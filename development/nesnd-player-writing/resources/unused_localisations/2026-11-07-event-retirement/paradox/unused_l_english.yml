kogi_yoron_tt: "The #b Shogunate#! will pursue a controlled restoration of the #b Emperor#!, and establishment of #b Parliamentary Government#!"
 law_commitment: "Law Commitment"
 literary: "Literary"
 meiji.1.a: "Industrial might will see us through."
 meiji.1.b: "We must look to the intellectuals."
 meiji.1.d: "The [GetLawType('law_bakufu').GetName] has fallen from power, and [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has restored the political primacy of the monarchy. This momentous occasion marks the end of centuries of military rule in #v $JAP$#!, and heralds a new era of modernization and reform. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must choose [ROOT.GetCountry.GetRuler.GetHerHis] political allies carefully."
 meiji.1.f: "The former Shōgun bows with respect and shame as he hands over his residence and seat of power, the mighty Edo Castle, to the restored Emperor. Renovations are set to begin at once; the old castle to be replaced by a glorious Imperial Palace. Though the exterior will appear much the same as the former imperial residence in Kyoto, the Emperor plans to combine Japan's rich decorative traditions with strange Western fashions. A metaphor, perhaps, for the future shape of Japan."
 meiji.1.t: "The [ROOT.Var('emperor_var').GetCharacter.GetFirstName] Restoration"
 meiji.10.a: "They provide a valuable service to our armed forces."
 meiji.10.b: "They must be shut down before this political faction gets dangerous."
 meiji.10.d: "[SCOPE.sCharacter('armed_forces_leader').GetFullName] has begun organizing private military academies in [SCOPE.sState('kyushu_state').GetName], not only teaching military theory, but [SCOPE.sCharacter('armed_forces_leader').GetHerHis] own political ideas."
 meiji.10.f: ""You may view it as a political organization, but how are we expected to instill the spirit of the samurai in our students if we do not teach them about the responsibility they have to lead and the importance of national ambition and expansion? How can we teach military tactics without discussing how an invasion of our neighbors might be undertaken? Indeed, the scope of what military force can be used for, up to and including its political applications, can and must be part of the curriculum!""
 meiji.10.t: "Shi-gakkō"
 meiji.11.a: "Fight back! Sakoku must be protected."
 meiji.11.b: "Negotiate to meet some of their demands."
 meiji.11.c: "Perhaps [SCOPE.sC('assistance_country').GetName] could help mediate this difficult situation."
 meiji.11.d: "[SCOPE.sC('infringing_country').GetName] has attempted to force open one of our harbors, demanding access to the port in [SCOPE.sState('infringed_port_state').GetName]."
 meiji.11.f: ""I saw the [SCOPE.sC('infringing_country').GetAdjectiveNoFormatting] sailors while they were still approaching the coast. By the time I'd gathered a group to drive them back out to sea, they were already at the shore. Most of us were peasants, not soldiers, but at the time I thought they might not be prepared to fight either. Prepared or not, blood was spilled. The rest of us fled. I don't know where they went after that.""
 meiji.11.t: "The [SCOPE.sState('infringed_port_state').GetPortHubName] Incident"
 meiji.12.a: "[ROOT.GetCountry.GetName] must leave Asia behind and look to the Western powers."
 meiji.12.b: "We will stand with our neighboring nations."
 meiji.12.c: "The future is uncertain. We must be prepared for anything."
 meiji.12.d: "A recently published articles has debated where [ROOT.GetCountry.GetName]'s future lies after the end of sakoku, weighing the benefits of aligning with other Asian counties or turning to the United States and the European powers."
 meiji.12.f: ""It may seem obvious a country's loyalties should be bound by the practicalities of geography, but that thinking lies in the past. The size of the world has changed. Who knows how it will be controlled in the future? The world will... keep getting smaller.""
 meiji.12.t: "Which Way the Wind Blows"
 meiji.13.a: "We must adapt to our new circumstances."
 meiji.13.d: "Forced to open itself to the world, [ROOT.GetCountry.GetName] must now contend with the economic interference of other powers. The authority of the [SCOPE.sCharacter('shogun_scope').GetLastName] Clan and the [SCOPE.gsInterestGroup('shogunate_ig').GetName] have, consequently, been greatly undermined."
 meiji.13.f: "The changing winds of time howl against our door and to preserve our establishement we must bend and open them to the whims of the world."
 meiji.13.t: "The Opening of Japan"
 meiji.14.a: "Today, the sun rests on a dream."
 meiji.14.d: "Despite the heady promises of reform championed by the new [ROOT.GetCountry.GetCustom('JAP_era_name')] government, [ROOT.GetCountry.GetNameNoFlag] has undergone no major changes. Critics lament that the state today is little different from the state before the Restoration."
 meiji.14.f: "An enormous engine huffed and chugged on the factory floor, spinning an enormous flywheel and powering tremendous lathes and drills. Those machines were carving new barrels, new locks, new triggers, for a vast new arsenal of weapons. A nation would soon wield this steam and iron to stamp their mark on the world—and that nation would not be [ROOT.GetCountry.GetNameNoFormatting]."
 meiji.14.t: "The Empty Restoration"
 meiji.2.a: "The [ROOT.GetCountry.GetAdjectiveNoFormatting] Empire shall rise."
 meiji.2.b: "We will need powerful friends, for we shall make powerful enemies."
 meiji.2.c: "Railways are the key to our future success."
 meiji.2.d: "A reformed army, an open and recognized country, a new society. [ROOT.GetCountry.GetName] stands as an equal among the powers of the world, and will perhaps begin to pursue imperial ambitions of her own."
 meiji.2.f: ""By the blessing of heaven we sit upon the sacred throne on which our ancestors reigned from time immemorial. The civilization and institutions of Japan are so different from those of other countries that we cannot expect to reach the declared end at once. It is our purpose to select from the various institutions prevailing among enlightened nations such as are best suited to our present conditions, and adapt them in gradual reforms and improvements of our policy and customs so as to be upon equality with them."" # Emperor Meiji
 meiji.2.t: "A Renewed Japan"
 meiji.3.a: "Let them keep their status as officers and nobles."
 meiji.3.b: "The era of Samurai is over."
 meiji.3.d: "[ROOT.GetCountry.GetName] has succeeded in reforming the armed forces and putting an end to the backwards system of feudalism. The [SCOPE.gsInterestGroup('samurai_ig').GetName] warrior caste seemingly no longer have a place within our modernizing society."
 meiji.3.f: "The Shōgun commanded the loyalty of the Daimyo, who in turn relied on their Samurai to help them enforce their rule over the enserfed peasantry. This was the basis of Japanese feudalism—now a relic of the past. There are those still loyal to Samurai ideals, the codes and virtues known as Bushido, and that legacy will surely endure. But the Samurai have fallen, and we will not see their like again."
 meiji.3.t: "The Fall of the Samurai"
 meiji.4.a: "We welcome [SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting] assistance."
 meiji.4.b: "We do not want their poisoned chalice."
 meiji.4.d: "Taking interest in [ROOT.GetCountry.GetName]'s modernization efforts, [SCOPE.sCountry('military_consultant_country').GetName] has offered us the service of General [SCOPE.sCharacter('military_consultant_general').GetFullName] as a military consultant. The terms of this arrangement appear favorable, but we should be wary of indebting ourselves to foreign powers."
 meiji.4.f: ""This, sir, is a Gatling gun. Two hundred rounds per minute. There is nothing, neither man nor beast nor machine, that can withstand the hellish cacophony of ammunition that this device can unleash. We will teach your soldiers to operate such machines, to maintain modern military discipline, and to obey their superiors without question.""
 meiji.4.t: "[SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting] Military Consultants"
 meiji.5.a: "Establish strong diplomatic ties."
 meiji.5.b: "[SCOPE.sCountry('japan_embassy_country').GetName] has much to teach us."
 meiji.5.c: "We have nothing to gain from [SCOPE.sCountry('japan_embassy_country').GetName]."
 meiji.5.d: "As part of an ambassadorial voyage to the West, our dignitaries have met with [SCOPE.sCharacter('japan_embassy_politician').GetFullName], a senior [SCOPE.sCountry('japan_embassy_country').GetAdjectiveNoFormatting] politician. Interested in establishing good relations with the newly opening [ROOT.GetCountry.GetAdjectiveNoFormatting] state, they have drafted several treaties we may wish to enter with [SCOPE.sCountry('japan_embassy_country').GetName]."
 meiji.5.f: ""Nations these days all appear to conduct relations with amity and courtesy. But this is entirely superficial; for behind this facade lurks mutual contempt and a struggle for supremacy. While [ROOT.GetCountry.GetNameNoFormatting] may now have diplomatic relations with a number of countries, its friendship with the [SCOPE.sCountry('japan_embassy_country').GetAdjectiveNoFormatting] state should be the closest of all, because of the true respect with which we hold the right of self-government."" # Bismarck
 meiji.5.t: "Embassy to [SCOPE.sCountry('japan_embassy_country').GetName]"
 meiji.6.a: "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting] ingenuity shall empower [ROOT.GetCountry.GetName]."
 meiji.6.b: "We no not need foreign meddling in our economy."
 meiji.6.d: "[SCOPE.sCharacter('western_investor_ig_leader').GetFullName], a wealthy and powerful industrialist from [SCOPE.sCountry('western_investor_country').GetName], sees [ROOT.GetCountry.GetName] as a lucrative and untapped market. In exchange for various political favors to be redeemed at an unspecified point in time, [SCOPE.sCharacter('western_investor_ig_leader').GetFullName] is willing to share with us the industrial technology of [SCOPE.sCharacter('western_investor_ig_leader').GetHerHis] homeland."
 meiji.6.f: ""There are those among my colleagues who disdain interest in [ROOT.GetCountry.GetNameNoFormatting], opining that its lack of valuable natural resources make it an unappealing place to do business. I, however, see the potential in this country. What today are virgin forests and fallow fields shall tomorrow become thriving urban centers, choked with the healthy smog of modern industry.""
 meiji.6.t: "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting] Investments"
 meiji.7.a: "[SCOPE.sC('railway_engineer_country_1').GetName] could assist us."
 meiji.7.b: "[SCOPE.sC('railway_engineer_country_2').GetName] has excellent engineers!"
 meiji.7.c: "[SCOPE.sC('railway_engineer_country_3').GetName] is familiar with railways."
 meiji.7.d: "In order to expedite our ambitions to build a railway network, it has been suggested that foreign advisors from countries with established railway systems could be brought in to help."
 meiji.7.e: "We have no need of foreign advice."
 meiji.7.f: ""I had only just made the gentleman's acquaintance when I asked him a question about his interest in locomotives, not expecting there to be that much to the topic. As it turns out, there is actually quite a surprising number of things to know about trains.""
 meiji.7.t: "Railway Advisors"
 meiji.8.a: "An excellent collaboration between military and industry!"
 meiji.8.b: "We will set the priorities ourselves."
 meiji.8.d: "Being privy to the government's ambition to expand [ROOT.GetCountry.GetName]'s railways, the [SCOPE.gsInterestGroup('armed_forces_ig').GetName] have offered to support these efforts in [SCOPE.sState('military_railway_state').GetName]."
 meiji.8.f: ""The military will benefit from the railroads in any case, but currently, they are one of many priorities. Allowing them to build their own lines would be quite different. In every era, a lot of power lies in the hands of those who get to draw certain maps. In our era, the railroad network may well turn out to be those maps.""
 meiji.8.t: "Military Railways"
 meiji.9.a: "It's time for this right to be abolished."
 meiji.9.b: "The right could be extended to other citizens of status."
 meiji.9.c: "To take a samurai's sword would be to tear out his soul!"
 meiji.9.d: "As the special privileges of the samurai class diminish, their special right to carry swords as a status symbol has been called into question."
 meiji.9.f: ""It is perhaps the fate of all countries to go through periods where the warrior class lose their special position in society, as their value is cast aside for contemporary priorities. However, to strip a warrior of his weapon, to take from him not only his status but the symbol of who he is and the honor of his forebearers, must be considered the height of humiliation!""
 meiji.9.t: "Students of the Blade"
