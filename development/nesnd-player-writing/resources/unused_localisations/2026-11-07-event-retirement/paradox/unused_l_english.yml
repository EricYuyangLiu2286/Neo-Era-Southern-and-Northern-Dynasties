kinmon_civil_war_tt: "The [ROOT.GetCountry.GetName] will fall into a #r $concept_civil_war$#! between #b Shogunate#! and #b Imperial Court#!"
kobu_gattai_2_tt: "$shogunate_additional_requirements_tt$ #indent_newline:3 \n$kobu_gattai_3_tt$"
kobu_gattai_no_longer_viable_tt: "Unification of the #b Shogunate#! and the #b Imperial Court#! will no longer be possible"
kobu_gattai_tt: "The #b Shogunate#! will pursue the unification of the #b Shogunate#! and the #b Imperial Court#!"
