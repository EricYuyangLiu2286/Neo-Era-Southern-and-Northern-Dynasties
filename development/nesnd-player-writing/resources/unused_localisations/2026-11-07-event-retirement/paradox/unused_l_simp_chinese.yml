 native_american_rights: "结束印第安人迁移"
 native_resettlement.1.a: "这样合法吗？"
 native_resettlement.1.d: "[SCOPE.sCharacter('indian_removal_president').GetPrimaryRoleTitle][SCOPE.sCharacter('indian_removal_president').GetFullName]违抗了最高法院的裁决，命令[SCOPE.sCulture('cherokee_culture').GetName]人民迁移到[SCOPE.sCountry('indian_territory_scope').GetName]。"
 native_resettlement.1.f: "“最高法院的意见有什么关系？我们只需要在他们身下生一把火，等足够烫了，他们就会离开，然后我们的东西就会是我们的了。”"
 native_resettlement.1.t: "伍斯特诉佐治亚州案"
 native_resettlement.2.a: "条约就是条约。我们不能撤销已经签署的条约。"
 native_resettlement.2.b: "我们的良知驱使我们废除迁移条约。"
 native_resettlement.2.d: "[SCOPE.sCulture('cherokee_culture').GetName]族的主要酋长之一的约翰·罗斯向国会提交了一份请愿书，要求他们废除该条约，该条约将迫使[SCOPE.sCulture('cherokee_culture').GetName]族迁往[SCOPE.sCountry('indian_territory_scope').GetName]。他请愿书上的签名几乎和整个东部切罗基人一样多。"
 native_resettlement.2.f: "“根据该条约的规定，我们被剥夺了自由的一切属性。我们的财产可能在我们眼前被掠夺；我们的人民可能遭受暴力，甚至我们的生命可能被剥夺，且没有人理会我们的抱怨。我们被剥夺了国籍；我们被剥夺了选举权。我们被剥夺了人类大家庭的成员资格！”"
 native_resettlement.2.t: "约翰·罗斯的抗议请愿"
 native_resettlement.3.a: "用刺刀逼迫他们。"
 native_resettlement.3.b: "为他们的旅途提供一些帮助。"
 native_resettlement.3.d: "根据迁移条约，是时候让[SCOPE.sState('indian_removal_state').GetName]的[SCOPE.sCulture('cherokee_culture').GetName]人迁移到[SCOPE.sCountry('indian_territory_scope').GetName]了。一些钉子户拒绝离开家乡，还有许多人旅行装备不足。"
 native_resettlement.3.f: "“朋友们，环境使你们不可能在我们的社区中蓬勃发展。你们只有一种补救办法，那就是迁往西部。你们越早这样做，就越早开始进步和繁荣。”"
 native_resettlement.3.t: "印第安人迁移"
 native_resettlement.4.a: "我们已经尽力了。"
 native_resettlement.4.b: "我们手上有他们的血。"
 native_resettlement.4.d: "我们从东部土地驱逐[SCOPE.sCulture('cherokee_culture').GetName]人的行动导致许多人在向西方行进的过程中死亡。"
 native_resettlement.4.f: "“麻疹、霍乱、饥饿——这次迁移给我们的人民建立了一条血泪与死亡之路。”"
 native_resettlement.4.t: "血泪之路"
 native_resettlement.5.a: "让我们祈祷这种事永远不要再发生了。"
 native_resettlement.5.d: "[SCOPE.sCulture('cherokee_culture').GetName]人已迁移到了[SCOPE.sCountry('indian_territory_scope').GetName]。无论是好是坏，这件事已经了解了。"
 native_resettlement.5.f: "“谁在我们来之前住在这里？他们给这个地方起了什么名字？我们中有人知道吗？还有人记得吗？”"
 native_resettlement.5.t: "清理东部"
 native_resettlement.6.a: "我们避免了惨剧的发生。"
 native_resettlement.6.d: "[SCOPE.sLawType('pronativelaw').GetName]法律已经通过，印第安人迁移法案也随之停止执行，[SCOPE.sCulture('cherokee_culture').GetName]族群现在可以自由地生活在他们世世代代居住的土地上了。"
 native_resettlement.6.f: "诗人必将高声赞颂你，\n在变动的民数中告诉世界人们曾怎样\n癫狂地嘲弄你，驱赶你！\n克服了嘲笑、匮乏与困窘，\n你民族的精神最终将梦想实现，\n他们怎样尊敬都不会过分。" #Alexander Posey
 native_resettlement.6.t: "切罗基之国"
 native_resettlement.7.a: "《佩恩台地条约》终于实现了。"
 native_resettlement.7.d: "我们在佛罗里达的胜利迫使[SCOPE.sCulture('seminole_people').GetName]人向政府交出了他们最后的避难所。现在是时候为这些广阔的土地建设一个新的未来了。"
 native_resettlement.7.f: "他们逃到泥灰草原和柏树林之间更深处的沼泽里。蓝外套以为他们都离开了，但他们错了。他们希望有一天能安全地住在这个闷热的避难所之外。现在，他们还活着。"
 native_resettlement.7.t: "塞米诺尔和平"
 officers: "@officers![Nbsp]$officers_no_icon$"
 pm_no_organization: "无有组织训练"
 poland_events.1.a: "让他们在[SCOPE.sCountry('polish_agitation_target_1_scope').GetName]煽动骚乱。"
 poland_events.1.b: "指示他们去[SCOPE.sCountry('polish_agitation_target_2_scope').GetName]。"
 poland_events.1.c: "[SCOPE.sCountry('polish_agitation_target_3_scope').GetName]的波兰人向往着自由。"
 poland_events.1.d: "[SCOPE.GetRootScope.GetCountry.GetAdjective]的[SCOPE.sCulture('polish_culture_scope').GetName]爱国流亡社群人数众多，而且积极性很高。通过为他们提供帮助和明确的方向，我们可以确保他们的热情不会白费。"
 poland_events.1.e: "派他们偷跨过[SCOPE.sCountry('polish_agitation_target_4_scope').GetAdjective]的边境。"
 poland_events.1.f: "“终于有来自祖国的消息。我们可能总算有机会回来了。美食，歌曲，舞蹈；一切！”\n\n“我们别抱有遥不可及的希望。使者说了什么？”\n\n“走上街头。我们高呼口号，我们游行、罢工。如果时机到来，我们就会大打出手。”"
 poland_events.1.t: "波兰仍在人间"
 poland_events.1.tt: "目标国家的选择和[Concept('concept_law','$concept_laws|q$')]会影响产生的激进派的数量以及我们关系变化的程度。"
 poland_events.2.a: "[SCOPE.sCountry('sent_polish_agitators_country_scope').GetCapital.GetCityHubName]必须给个说法。"
 poland_events.2.b: "渗透并尝试分裂他们的团体。"
 poland_events.2.c: "立即召集宪兵。"
 poland_events.2.d: "在[SCOPE.GetRootScope.GetCountry.GetName]的[SCOPE.sCulture('polish_culture_scope').GetName]社区爆发了大规模抗议活动，主张波兰建国。顾问们认为，骚乱可能与附属[SCOPE.sCountry('sent_polish_agitators_country_scope').GetName]政府的团体的行动有关。"
 poland_events.2.f: "在一片被撕裂的土地上生活的人们，总是会怀念他们曾经拥有的荣耀和身份。这就是古代帝国的智慧：被征服的臣民保留了自己的土地和习俗，但要缴纳贡金并同意遵守新的法律。剥夺一个民族的身份认同，其后果也总是一场灾难。"
 poland_events.2.t: "波兰仍在人间？"
 poland_events.2.tt: "我们可以通过建立[GetLawType('law_secret_police').GetName]或[GetLawType('law_national_guard').GetName]，减轻未来此类事件的影响。但是，只有抹除[SCOPE.sCountry('sent_polish_agitators_country_scope').GetName]作为自治实体的存在，才能真正一劳永逸地解决这个问题。"
