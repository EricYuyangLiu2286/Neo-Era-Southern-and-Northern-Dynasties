 ep2_meiji.1.a: "我们必须适应新的环境。"
 ep2_meiji.1.d: "锁国的结束激起了人们面对外国侵入时的无力感，从而削弱了[ROOT.GetCountry.GetRuler.GetLastName]家的权威。幕府的敌人以#italic 尊王攘夷#!的口号集结。"
 ep2_meiji.1.f: "在京都一家客栈的二楼，远离窗户的位置，十几名身着黑衣的浪人围坐在一张桌子旁。屋外，大雨倾盆而下，淹没了街上的所有声响。他们之间传来愤怒的低语——先是抱怨，接着是谴责，最后是立誓和对闯入者发出的死亡判决。\n\n远处，在一座俯瞰着磯的宅邸中，一名身穿绿色和服的男子凝视着一道升向天空的烟柱。山丘在海岸边的建筑上投下长长的影子。随着太阳接近地平线，下方熔炉的火光变得越来越显眼。在那火光之外，水面上倒映的，他能看到水面上船只的灯光。他希望，有朝一日，自己的大炮能将那些船只驱离至地平线外。"
 ep2_meiji.1.t: "尊王攘夷"
 ep2_meiji.1000.a: "#todo Debug Text.#!"
 ep2_meiji.1000.d: "#todo Debug Text.#!"
 ep2_meiji.1000.f: "@fish! #todo fishe#!"
 ep2_meiji.1000.t: "#todo Meiji Debug Event#!"
 ep2_meiji.2.a: "幕府必须复兴。"
 ep2_meiji.2.b: "公开议政才是开明之道。"
 ep2_meiji.2.d: "幕府改革者在两种治理理论之间分裂。#italic 公武合体#!理论试图通过与朝廷融合来恢复[GetLawType('law_bakufu').GetName]的合法性，而公议舆论理论则试图建立一个以[SCOPE.sCharacter('shogun_scope').GetLastName]家为首的公议政体。"
 ep2_meiji.2.f: "主人将一盘干菓子摆在桌上，并为每位客人斟上一碗薄茶。三人围坐桌旁，主人与第一位客人束着丁髷，第二位则是短发。蒸汽从他们面前的茶碗中袅袅升起。\n\n主人将目光投向那位短发男子，开口说道。\n\n“恭喜你归来，[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]#italic 君#!。我发现你寄来的每一封信都比上一封更有意思。能否为我们多讲讲你与那些蛮夷相处的经历？”"
 ep2_meiji.2.t: "幕府的形态"
 ep2_meiji.3.a: "为了国家的利益。"
 ep2_meiji.3.d: "天皇已同意让[SCOPE.sCharacter('shogun_scope').GetFullName]与皇女[SCOPE.sCharacter('imperial_princess_scope').GetFullName]联姻，条件是将军废除[SCOPE.sTreaty('relevant_treaty_scope').GetName]并恢复锁国政策。"
 ep2_meiji.3.d2: "天皇已同意让[SCOPE.sCharacter('shogun_scope').GetFullName]与皇女[SCOPE.sCharacter('imperial_princess_scope').GetFirstName]联姻，条件是将军驱逐外国人并恢复锁国政策。"
 ep2_meiji.3.f: "队伍几乎覆盖了整个中山道。一支由三万名劳工、随从与公主侍从组成的行列，在尾张藩士兵的外围护卫下，从饭岛町一直延伸到盐尻宿。队伍中央，公主端坐在一顶由金与红色丝绸装饰的轿中。其旁随行的是来自十余个藩的武士——[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]与[SCOPE.sCharacter('daimyo_2_scope').GetCustom('japan_domain_by_character')]，[SCOPE.sCharacter('daimyo_3_scope').GetCustom('japan_domain_by_character')]与[SCOPE.sCharacter('daimyo_4_scope').GetCustom('japan_domain_by_character')]，[SCOPE.sCharacter('daimyo_5_scope').GetCustom('japan_domain_by_character')]与[SCOPE.sCharacter('daimyo_6_scope').GetCustom('japan_domain_by_character')]。\n\n轿中，公主透过帘幕间的一道细缝向外张望。一座又一座城镇从眼前掠过，门窗紧闭，寂静无声。接下来的三十#italic 里#!路，将足够她反复思索自己的命运。"
 ep2_meiji.3.t: "皇室婚姻"
 ep2_meiji.4.a: "此乃吾等之愿：诛杀奸臣，恢复太平。" # Emperor Meiji's plausibly fraudulent imperial decree of 1867
 ep2_meiji.4.b: "天皇已受奸贼挟持。"
 ep2_meiji.4.d: "因领地与头衔被剥夺而愤懑不平的[SCOPE.sCharacter('shogun_scope').GetPrimaryRoleTitle][SCOPE.sCharacter('shogun_scope').GetFullName]带领[SCOPE.sCharacter('shogun_scope').GetHerHis]的忠诚家臣起兵反抗朝廷。[SCOPE.sCharacter('shogun_scope').GetSheHe|U]试图逆转王政复古，并恢复幕府统治。"
 ep2_meiji.4.f: "“臣[SCOPE.sCharacter('shogun_scope').GetFirstNameNoFormatting]谨自去月九日以来惶恐奉察朝廷事体，一一皆无朝廷之真意，而全然出自[SCOPE.sCharacter('councilor_scope').GetLastNameNoFormatting]大夫奸臣等人之阴谋，天下之所共知，殊以江户、长崎、野州、相州处处乱妨。\n\n此等乱行既已为天人所共憎，恳请御裁引渡前文一众奸臣，万一此请不获采用，不得不对其加以诛戮。”" # Edited petition by Yoshinobu
 ep2_meiji.4.t: "[ROOT.GetCountry.GetCustom('get_sexagenary_cycle_term')]战争"
 ep2_meiji.41.a: "必须击退这些狂徒。"
 ep2_meiji.41.b: "尊王攘夷！"
 ep2_meiji.41.d: "[SCOPE.sCharacter('shogun_scope').GetLastName]家维持权力的举措激怒了一些主张大政奉还的藩领，他们联合起来反抗[SCOPE.sCharacter('shogun_scope').GetFullName]，试图恢复天皇的政治主导地位，以摆脱德川家的影响。"
 ep2_meiji.41.d_1: "[ROOT.GetCountry.GetCapital.GetCityHubName]政府拒绝驱逐夷人的举措激怒了一些主张尊王攘夷的藩领，他们联合起来发动叛乱，试图废除天皇的西化顾问，并将外国势力驱逐出日本。"
 ep2_meiji.41.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]立于城墙之上，俯视下方。在他面前，一列列[SCOPE.sState('revolter_state').GetCustom('japan_domain_by_state')]的士兵正从城门鱼贯而出。有些士兵已完成现代化改造，身着深蓝色新式军服，戴着圆锥形头盔；另一些则仍穿着传统服饰——红、绿、蓝相间。身着新军服者被安排在队伍最前列，站在[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]左侧数米处的一群外国观察者对他们投以赞许的目光。其后是手持步枪的骑乘武士，再往后则是炮兵。\n\n他们的集结地在[SCOPE.sState('revolter_state').GetCityHubName]的郊外，他们将在那里与藩国盟友的部队会合，一同进军对抗将军的军队。远方被囚禁的天皇在那片刀剑与刺刀构成的壁垒之后正等待着。"
 ep2_meiji.41.f_1: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]立于城墙之上，俯视下方。在他面前，一列列[SCOPE.sState('revolter_state').GetCustom('japan_domain_by_state')]的士兵正从城门鱼贯而出。有些士兵已完成现代化改造，身着深蓝色新式军服，戴着圆锥形头盔；另一些则仍穿着传统服饰——红、绿、蓝相间。身着新军服者被安排在队伍最前列，之后是彩虹般的三彩羽织。其后是手持步枪的骑乘武士，再往后则是炮兵。\n\n他们的集结地在[SCOPE.sState('revolter_state').GetCityHubName]的郊外，他们将在那里与藩国盟友的部队会合，一同进军对抗将军的军队。远方被囚禁的天皇在那片刀剑与刺刀构成的壁垒之后正等待着。"
 ep2_meiji.5.a: "他脚下已空无一物。"
 ep2_meiji.5.d: "面对[GetLawType('law_bakufu').GetName]反对者日益增长的压力，[SCOPE.sCharacter('shogun_scope').GetFullName]已向天皇上奏，请求将[SCOPE.sCharacter('shogun_scope').GetHerHis]的统治权归还朝廷。"
 ep2_meiji.5.f: "“若朝权不申出于一途，而纲纪难立。故改从来之旧习，政权奉归于朝廷。\n\n既广尽天下之公议，一仰圣断，若能同心协力共仕保护皇国，必可与海外万国并立。”\n\n——德川庆喜，1867年"
 ep2_meiji.5.t: "大政奉还"
 ep2_meiji.51.a: "令人激动得发抖。"
 ep2_meiji.51.d: "天皇已对[SCOPE.sCharacter('shogun_scope').GetFullName]请求归还统治权的奏请作出回应。将军的请求已被接受，天皇的政治至上权得以恢复。"
 ep2_meiji.51.f: "“日本国天皇告诸外国帝王及其臣人：向者将军[SCOPE.sCharacter('shogun_scope').GetFullNameNoFormatting]请归政也，制允之，内外政事亲裁之。乃曰：从前条约，虽用大君名称，自今而后，当换以天皇称，而诸国交接之职，专命有司等。各国公使谅期旨。”"
 ep2_meiji.51.t: "天皇敕裁"
 ep2_meiji.52.a: "枝柯相护，根本得安。"
 ep2_meiji.52.d: "天皇已对[SCOPE.sCharacter('shogun_scope').GetFullName]请求归还统治权的奏请作出回应。回应称将军仍受朝廷信任，因此统治权仍可继续由幕府掌握。"
 ep2_meiji.52.f: "[ROOT.GetCountry.GetCustom('japan_choshu_castle_name')]城中回荡着靴声。整日以来，信使与家臣进进出出，带来对过去一周新闻愈发详尽的叙述。[SCOPE.sCharacter('choshu_daimyo_scope').GetFullNameNoFormatting]亲自接见他们，在每次会面中始终沉默。他的眉头随着消息的发展愈发沉重——将军凯旋入城的行列、会津藩守卫着皇宫。\n\n宫殿外，夕阳已落。从台上望去，[SCOPE.sCharacter('choshu_daimyo_scope').GetFirstNameNoFormatting]看向聚集的二十名家臣。“长州藩不会屈服，”[SCOPE.sCharacter('choshu_daimyo_scope').GetSheHe]说道。“务必牢记这一点。”\n\n他说完起身，离开了房间。"
 ep2_meiji.52.t: "天皇敕裁"
 ep2_meiji.6.a: "茕茕孑立于黑暗之中。"
 ep2_meiji.6.d: "朝廷中的[SCOPE.sCharacter('shogun_scope').GetLastName]家反对者说服天皇发布敕令，正式恢复其自身权力。该敕令废除幕府，并建立一个将[SCOPE.sCharacter('shogun_scope').GetFullName]排除在任何官职之外的政府。"
 ep2_meiji.6.f: "“[SCOPE.sCharacter('shogun_scope').GetFullNameNoFormatting]返上从前委任之大政，辞退将军职之两条，今已断然获准。未曾有之国难，先帝频年宸襟受恼之情由，众庶之所知。依之所决睿虑，王政复古，为立挽回国威之基。\n\n自今，废绝摄、关、幕府等；即今，先假置总裁、议定、参与之三职，可行万机。无缙绅、武弁、堂上、地下之别，竭至当之公议。”" #- Modifier text of the Great Proclamation of the Restoration of Imperial Rule
 ep2_meiji.6.t: "王政复古大号令"
 ep2_meiji.7.a: "再次站稳脚跟。"
 ep2_meiji.7.d: "由于朝廷缺乏实际治理的手段，朝廷中[SCOPE.sCharacter('shogun_scope').GetLastName]家的盟友说服天皇授予[SCOPE.sCharacter('shogun_scope').GetFullName]“大君”称号，使[SCOPE.sCharacter('shogun_scope').GetHerHim]成为帝国机构的首脑。"
 ep2_meiji.7.f: "“若乍然召之诸侯，逐渐会合，亦可成众议。诠其所处：方今时势，人情所注，则公议之事，人口脍炙，舆论如何，无不与之，此乃不得已之势也。是以伏愿有所处置，尽力使议论一致，并会议之趣意得以成立。\n\n万一议论之间，龃龉相起，争衅相开，则纵然成就御家之胜利，当此外有外国之時，可与兄弟阋于墙之义相当也。”\n\n——西 周助《议题草案》"
 ep2_meiji.7.t: "大君"
 ep2_meiji.8.a: "风暴已经结束。"
 ep2_meiji.8.d: "通过与皇室联姻，并履行[SCOPE.sCharacter('shogun_scope').GetHerHis]对天皇的承诺，[SCOPE.sCharacter('shogun_scope').GetFullName]缓和了朝廷与幕府之间的紧张关系。天皇得以继续[SCOPE.sCharacter('emperor_scope').GetHerHis]的隐居生活，确信将军会维持长久的和平。"
 ep2_meiji.8.f: "纵有暴风起，\n肆虐横行全国中，\n我将静待之，\n还回太阳于苍穹，\n恢复其本初光明。\n\n——孝明天皇"
 ep2_meiji.8.t: "朝廷与幕府"
 ep2_meiji.9.a: "将军陨落，大君崛起。"
 ep2_meiji.9.b: "天皇乃天神之子，德川家则为其器。"
 ep2_meiji.9.d: "凭借自信与高明的手腕，[SCOPE.sCharacter('taikun_scope').GetFullName]既完成了天皇权力的恢复，也保全了[SCOPE.sCharacter('taikun_scope').GetHerHis]的家族。[SCOPE.sCharacter('taikun_scope').GetLastName]家的大君将作为现代$JAP$贵族之中的第一人掌控权力。"
 ep2_meiji.9.f: "天皇不再端坐于屏风之后。群臣列坐于御前长案两侧，大君居左。众人身着新制朝服，袖襟饰以繁复金纹。勋章在众人调整不适应的坐姿时发出窸窣轻响。\n\n大君主持讨论已逾一个时辰，天皇始终未发一言。他静心倾听，逐一注视每位发言者。房间另一端，一位曾经的#italic 尊王攘夷#!拥护者正陈词阐述遣使出访美国的必要性。"
 ep2_meiji.9.t: "同侪之首"
 ep2_meiji_pulse.1.a: "[SCOPE.sCharacter('daimyo_scope').GetCustom('japan_domain_by_character')]藩只想给我们制造麻烦。"
 ep2_meiji_pulse.1.d: "在[SCOPE.sState('relevant_treaty_port_state').GetName]旅行期间，一名[SCOPE.sCountry('relevant_gp').GetAdjective]商人因在[SCOPE.sCharacter('daimyo_scope').GetFullName]经过时拒绝下马，被其随从杀死。[SCOPE.sCharacter('daimyo_scope').GetCustom('japan_domain_by_character')]藩的大名声称，根据切舍御免特权，他有权斩杀任何不尊重自己的平民。"
 ep2_meiji_pulse.1.f: "洋人冲破了火枪队的阵列，四方杀声骤起。为首洋人察觉周遭武装武士，猛勒缰绳令坐骑急转，险些将一名火枪兵撞落马下。[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]拔刀出鞘，内圈同袍随之而动。\n\n[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]挥出第一击，在闯入者肋侧划开血口。对方惨叫着再次猛拉缰绳，却已是徒劳。最近的火枪兵抽出佩刀横扫，一道血弧如赤云悬空。"
 ep2_meiji_pulse.1.t: "切舍御免"
 ep2_meiji_pulse.11.a: "必须#italic 有人#!为此付出代价。把此事提交给大君处理。"
 ep2_meiji_pulse.11.b: "我们真的想在东方越陷越深吗？"
 ep2_meiji_pulse.11.d: "在[SCOPE.sCountry('japan_scope').GetName]经商期间，一名名叫[SCOPE.sCharacter('richardson_scope').GetFullNameNoFormatting]的[ROOT.GetCountry.GetAdjectiveNoFlag]商人被当地领主[SCOPE.sCharacter('daimyo_scope').GetFullName]杀害。该领主声称，根据[SCOPE.sCharacter('daimyo_scope').GetHerHis]领地的法律，[SCOPE.sCharacter('daimyo_scope').GetHerselfHimself]的行为是正当的，并拒绝为[SCOPE.sCharacter('daimyo_scope').GetHerHis]的罪行支付任何赔偿。"
 ep2_meiji_pulse.11.f: "#b 社论#!\n\n值此局势，我们重申[ROOT.GetCountry.GetNameNoFormatting]别无选择，唯有积极准备大战，或与日本永别。放弃已在彼处获得的立足之地绝不可取，故两大帝国间冲突或可预见。诸多[SCOPE.sCulture('primary_culture_scope').GetCustom('getPluralDemonym')]不喜此念，然[ROOT.GetCountry.GetCapital.GetCityHubName][SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')]认为此举不仅无可避免，且合情合理——仅因日方拒绝惩处[SCOPE.sCharacter('richardson_scope').GetLastNameNoFormatting]遇刺案凶犯……（#italic 转第二版#!）" #largely copied from The Anglo-Japanese War, New York Times, 1863
 ep2_meiji_pulse.11.t: "[SCOPE.sCharacter('richardson_scope').GetLastNameNoFormatting]事件"
 ep2_meiji_pulse.12.a: "他们得赔偿我们。"
 ep2_meiji_pulse.12.d: "我们在远东的海军军官报告，下关海峡发生多次交火。据称袭击由当地领主、$domain_choshu$大名下令，而[SCOPE.sCountry('japan_scope').GetName]已同意通过[SCOPE.sTreaty('shimonoseki_treaty_scope').GetName][concept_treaty]结束敌对行动。"
 ep2_meiji_pulse.12.f: "这份报告在炮声沉寂很久之后，仍留在[ROOT.GetCountry.GetCapital.GetCityHubName]的一张桌子上。有传言说，一位大臣在下关的一场小规模冲突中失去了近亲。那几页纸列出了四人死亡、七人受伤，等到被归入柜中存档时，已经磨损不堪。"
 ep2_meiji_pulse.12.t: "下关协议"
 ep2_meiji_pulse.2.a: "这是他们鲁莽行径所付出的沉重代价。"
 ep2_meiji_pulse.2.d: "由于[SCOPE.sCharacter('daimyo_scope').GetCustom('japan_domain_by_character')]藩拒绝为[SCOPE.sCharacter('richardson_scope').GetFullNameNoFormatting]之死支付赔款，[SCOPE.sCountry('relevant_gp').GetAdjective]海军舰艇对[SCOPE.sCharacter('daimyo_scope').GetHomeState.GetCustom('japan_domain_seat_name')]海防进行了持续数日的炮击。"
 ep2_meiji_pulse.2.f: "海湾笼罩在炮火的烟雾中，[SCOPE.sCharacter('daimyo_scope').GetHomeState.GetCustom('japan_domain_seat_name')]正熊熊燃烧。海面彼岸，一艘外国战舰正向城北的工厂开炮。每一次发射，地狱般的红光便吞没了落日微弱的余晖。\n\n[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]炮位上最后一门仍能运作的火炮轰然开火——在良好条件下本可远射，如今却已无力回天。炮弹落在外国舰队第三艘船数个船身之外，激起巨大的水柱。[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]抓起通条，[SCOPE.sCharacter('name_a_scope').GetHerHis]冲向火炮继续操作。在后方墙外，被上一轮炮击击伤的士兵仍在惨叫。尽管[SCOPE.sCharacter('name_a_scope').GetHerHis]耳中嗡鸣不断，但依然能够听见他们的哀嚎。"
 ep2_meiji_pulse.2.t: "炮击[SCOPE.sCharacter('daimyo_scope').GetHomeState.GetCustom('japan_domain_seat_name')]"
 ep2_meiji_pulse.3.a: "外国人做了我们做不到的事。"
 ep2_meiji_pulse.3.b: "协助该藩达成和解。"
 ep2_meiji_pulse.3.c: "向西方人提议开放一个港口以换取协议。"
 ep2_meiji_pulse.3.d: "长州藩大名[SCOPE.sCharacter('choshu_daimyo_scope').GetFullName]已表示[SCOPE.sCharacter('choshu_daimyo_scope').GetHerHis]将遵从天皇驱逐外国人的命令。[SCOPE.sCharacter('choshu_daimyo_scope').GetSheHe|U]命令[SCOPE.sCharacter('choshu_daimyo_scope').GetHerHis]的海军向所有通过下关海峡的外国船只开火，并与一艘[SCOPE.sCountry('relevant_gp').GetAdjective]军舰发生交火。"
 ep2_meiji_pulse.3.f: "白昼的雷声滚过火之山缓坡，正刚抬头望天。映入眼帘的唯有蓬松白云。\n\n“看！”次郎喊道。一只手闯入视野，向下指去。一艘全速航行的战舰正穿行下方海峡，炮火轰击着正刚看不见的目标。船体木屑飞溅，却仍继续前行。这一切之上，另一朵云正在升腾。"
 ep2_meiji_pulse.3.t: "下关战争"
 ep2_meiji_pulse.4.a: "[SCOPE.sState('edo_state').GetCityHubName]已经变得无法治理。"
 ep2_meiji_pulse.4.b: "禁止[SCOPE.sCharacter('daimyo_scope').GetCustom('japan_domain_by_character')]藩在城中携带武器。"
 ep2_meiji_pulse.4.d: "[SCOPE.sCharacter('daimyo_scope').GetCustom('japan_domain_by_character')]藩的#italic 尊王攘夷#!武士袭击了[SCOPE.sCountry('relevant_gp').GetAdjective]在[SCOPE.sState('edo_state').GetCityHubName]尚未完工的公使馆建筑。这座本该是该市首座西洋式风格的建筑已被焚毁，而肇事者却不见踪影。"
 ep2_meiji_pulse.4.f: "两名兜帽蒙面者登上能俯瞰原公使馆的山丘。焦黑的残骸中仍升腾着橘色余烬。当所有易燃物燃尽，火焰在密实的梁柱间勉强维持。\n\n当余烬最终熄灭，两人仍静立不动。一人轻声开口，凝视着残留的烟柱。\n\n“若其灰烬如雪纷扬落于吾身，岂非至美？”"
 ep2_meiji_pulse.4.t: "焚毁[SCOPE.sCountry('relevant_gp').GetAdjective]使馆"
 ep2_meiji_pulse.5.a: "武士再次拔刀相向。"
 ep2_meiji_pulse.5.d: "幕府大老[SCOPE.sCharacter('tairo_scope').GetFullName]在江户城门前被来自[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]藩与[SCOPE.sCharacter('daimyo_2_scope').GetCustom('japan_domain_by_character')]藩的浪人刺杀。刺客留下的宣言表达了#italic 尊王攘夷#!思想，谴责这位首席大臣对外国人的让步。"
 ep2_meiji_pulse.5.f: "忠三郎目睹五郎黑走到队伍前面，[SCOPE.sCharacter('tairo_scope').GetCustom('japan_domain_by_character')]藩士欲上前阻拦。五郎黑未给他反应之机，拔刀疾刺。血泉从[SCOPE.sCharacter('tairo_scope').GetCustom('japan_domain_by_character')]被劈开的面庞喷涌，同袍们怒吼着涌上前复仇。\n\n忠三郎褪下雨衣，拔出手枪。他瞄准轿厢暴露的侧面，扣动扳机。枪声轰鸣盖过刀剑交击与呐喊，继而又是第二声。一名护卫转身向他冲来，而[SCOPE.sCharacter('daimyo_2_scope').GetCustom('japan_domain_by_character')]的浪人治左卫门挥刀劈向对方躯干。透过缠斗的两人，忠三郎望见鲜血如溪流般从轿门流淌至积雪的道路。他拔出胁差，朝那抹赤红奔去。"
 ep2_meiji_pulse.5.t: "血腥复仇"
 ep2_meiji_pulse.6.a: "奖励新选组的主动行动。"
 ep2_meiji_pulse.6.b: "这种残酷行为只会招致报复。"
 ep2_meiji_pulse.6.d: "在拷问一名[SCOPE.sPoliticalMovement('restorationist_movement_scope').GetName]的激进分子并获得情报后，[GetLawType('law_shinsengumi').GetName]对位于[SCOPE.sState('kyoto_state').GetName]池田屋旅馆的一次疑似密谋者集会发动突袭。突袭很快演变为在旅馆内外展开的激烈刀战。"
 ep2_meiji_pulse.6.f: "大高靠在栏杆上稳住身体，这时新选组冲破了门。他能看到他们浅蓝色#italic 羽织#!袖子上的血迹——在昏暗的灯光下显得黑白分明。他举刀摆出防御架势。\n\n两人从队伍中脱离，并排沿着他守着的楼梯向上冲来，他挥刀劈砍，感到被格挡开，随即调整姿态。撞击中溅出火花。第二个人又挥刀砍来。他后退一步，扭动手腕——\n\n一道火光映照下的钢刃闪过，紧接着他感到胸口一阵冰冷。"
 ep2_meiji_pulse.6.t: "池田屋事件"
 ep2_meiji_pulse.7.a: "[SCOPE.sCharacter('daimyo_2_scope').GetCustom('japan_domain_by_character')]藩与会津藩成功击退进攻者。"
 ep2_meiji_pulse.7.b: "皇宫落入[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]藩控制。"
 ep2_meiji_pulse.7.d: "支持[SCOPE.sPoliticalMovement('restorationist_movement_scope').GetName]的[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]藩士兵试图攻入位于[SCOPE.sState('kyoto_state').GetName]的皇宫，以武力恢复天皇权力。他们遭到[SCOPE.sCharacter('daimyo_2_scope').GetCustom('japan_domain_by_character')]藩与会津藩的士兵的阻击。"
 ep2_meiji_pulse.7.f: "蛤御门被火枪烟雾所笼罩。他们身处被火光点亮的京都。\n\n会津藩兵沿着城墙列阵，齐射的火枪弹打在道路与[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]的火炮的炮架上四散飞溅。每隔数秒，便有弹丸击中血肉，惨叫声短暂压过枪火的爆裂。幸三蜷缩在炮轮旁，拼命想要疏通卡住的火枪。在仅一#italic 剑#!之隔处，他小队的队长脸朝下倒在地上，四肢尽失，却仍在挣扎扭动。"
 ep2_meiji_pulse.7.t: "禁门之变"
 ep2_meiji_pulse.8.a: "如果能不战而胜，那就这样吧。"
 ep2_meiji_pulse.8.b: "必须从上到下清洗该藩。"
 ep2_meiji_pulse.8.d: "作为对[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]藩袭击皇宫的报复，将军已下令发动惩罚性远征，以将#italic 尊王攘夷#!派逐出该藩。一些同情[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]藩的顾问提出了一项方案：若相关责任者切腹自尽，则可换取和平。"
 ep2_meiji_pulse.8.f: "[SCOPE.sCharacter('daimyo_1_scope').GetFullNameNoFormatting]，[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]的大名，站在城堡的阳台上，向远方眺望。远处，缕缕烟雾玷污了天际——那是逼近大军的营火。\n\n“将军要求三名家老切腹，”家臣说道，“四名军官斩首，五名家臣流放。”\n\n[SCOPE.sCharacter('daimyo_1_scope').GetFirstNameNoFormatting]望向营火，那里至少有数百处。曾经湛蓝的地平线如今变得令人作呕。终于，他开口了。\n\n“……[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]藩愿降。”"
 ep2_meiji_pulse.8.t: "[SCOPE.sCharacter('daimyo_1_scope').GetCustom('japan_domain_by_character')]征讨"
 ep2_meiji_pulse.9.a: "将军必须前往京都商议此事。"
 ep2_meiji_pulse.9.b: "此伪诏也——把这件事压下去。"
 ep2_meiji_pulse.9.d: "由于西方列强强加给[ROOT.GetCountry.GetName]的不平等条约，天皇愤怒之下绕过了将军，直接颁布敕令，命令将外国人驱逐出[ROOT.GetCountry.GetAdjectiveNoFormatting]的领土。[SCOPE.sPoliticalMovement('restorationist_movement_scope').GetName]的激进分子已经响应天皇的号召。"
 ep2_meiji_pulse.9.f: "家臣站在炮身侧方，目光投向海峡。此时，正喷着蒸汽的船驶过落日下，成了黑色的剪影。一旁，长州藩的下级武士们正忙着摆弄推弹杆和一袋袋黑火药。\n\n当他抬头望向日之山的轮廓和下方的下关町时，脑海中浮现出那份诏书中的一段话。“国土纵成焦土，”诏书写道，“亦绝不许开港通商。”\n\n这值当么？他会任由那翠绿的山坡被烧成一片焦黑，任由那片片花田被烧光，任由自己的家园被摧毁吗？是的，他心想。毫不犹豫。"
 ep2_meiji_pulse.9.t: "攘夷令"
