 je_meiji_imperial_marriage: "皇室婚姻"
 je_meiji_main: "[ROOT.Var('emperor_var').GetCharacter.GetFirstName]维新"
 john_ross_enactment: "约翰·罗斯的抗议请愿"
 kinmon_civil_war_tt: "[ROOT.GetCountry.GetName]将陷入#b 幕府#!与#b 朝廷#!对抗的#r $concept_civil_war$#!"
 kobu_gattai_2_tt: "$shogunate_additional_requirements_tt$ #indent_newline:3 \n$kobu_gattai_3_tt$"
 kobu_gattai_no_longer_viable_tt: "#b 幕府#!与#b 朝廷#!的合体将不再可能"
 kobu_gattai_tt: "#b 幕府#!将推动#b 幕府#!与#b 朝廷#!的合体"
 kogi_yoron_2_tt: "$shogunate_additional_requirements_tt$ #indent_newline:3 \n$kogi_yoron_3_tt$"
 kogi_yoron_tt: "#b 幕府#!将推动在可控条件下恢复#b 天皇#!地位，并建立#b 公议政体#!"
 law_commitment: "法律承诺"
 literary: "文学家"
 meiji.1.a: "工业或许会帮助我们渡过难关。"
 meiji.1.b: "我们必须依靠知识分子。"
 meiji.1.d: "[GetLawType('law_bakufu').GetName]已经丧失了权力，王政已经归复于[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]。这一重大时刻标志着几个世纪以来武家在#v $JAP$#!统治的终结，同时也开启了一个现代化与革新的新纪元。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]必须谨慎地选择自己的政治盟友。"
 meiji.1.f: "前征夷大将军带着尊敬与羞愧向天皇行礼，将自己的住所及权力宝座——雄伟的江户城堡——交给了重新掌权的天皇。改造工作马上就要开始；一座辉煌的皇宫将取代这座老城堡。尽管外观将与京都的前皇居大同小异，但天皇计划将日本丰富的装饰传统与陌生的西方时尚结合起来。或许这就是对日本未来的一种隐喻。"
 meiji.1.t: "[ROOT.Var('emperor_var').GetCharacter.GetFirstName]维新"
 meiji.10.a: "他们为我国的武装力量贡献了有价值的服务。"
 meiji.10.b: "在这个政治派别变得危险之前，必须关停这些学校。"
 meiji.10.d: "[SCOPE.sCharacter('armed_forces_leader').GetFullName]已开始在[SCOPE.sState('kyushu_state').GetName]设立私立军校，不仅教授军事理论，还教授[SCOPE.sCharacter('armed_forces_leader').GetHerHis]自己的政治理念。"
 meiji.10.f: "“你或许会将这视作一个政治组织，然而如果我们不去教导学生需要肩负的责任，以及国家的雄心和对外扩张的重要性，我们又怎么能够将武士之魂注入他们的内心呢？如果对于侵略我们邻国的可能性闭口不谈，我们又该如何传授军事战术呢？所以说，军事力量能够被运用到哪个方面，包括将其上升到政治应用，可以并且必须成为课纲的一部分！”"
 meiji.10.t: "私学校"
 meiji.11.a: "反击！必须维持锁国。"
 meiji.11.b: "通过谈判来满足他们一部分要求。"
 meiji.11.c: "也许[SCOPE.sC('assistance_country').GetName]能帮我们调解这个艰难的局面。"
 meiji.11.d: "[SCOPE.sC('infringing_country').GetName]试图强行开放我们的一个口岸，要求进入[SCOPE.sState('infringed_port_state').GetName]港。"
 meiji.11.f: "“我先是看到[SCOPE.sC('infringing_country').GetAdjectiveNoFormatting]的水手试图接近海岸。当我召集人手想把他们赶走时，他们已经上了岸。我们大伙都是农民，不是士兵，本来也以为他们不想打斗的。结果还是发生了流血。我们其余人都逃走了。我也不知道他们后来去哪了。”"
 meiji.11.t: "[SCOPE.sState('infringed_port_state').GetPortHubName]事变"
 meiji.12.a: "[ROOT.GetCountry.GetName]必须脱亚入欧。"
 meiji.12.b: "我们将与邻国站在一起。"
 meiji.12.c: "前途未卜，我们需做好一切准备。"
 meiji.12.d: "近期发表的一篇文章讨论了锁国结束后[ROOT.GetCountry.GetName]的未来，并权衡了与亚洲其他国家结盟或者转向美国和欧洲列强的利弊。"
 meiji.12.f: "“一个国家的阵营受到地理实际情况的限制，或许这样的思维看上去是显而易见的，但这种想法已经是过去式了。如今世界的大小已经改变。谁知道它未来会被谁掌控？而世界……也在变得越来越小。”"
 meiji.12.t: "东风与西风"
 meiji.13.a: "我们必须适应新的环境。"
 meiji.13.d: "由于被迫向世界打开了国门，[ROOT.GetCountry.GetName]现在必须与其他强权的经济干涉斗争。[SCOPE.sCharacter('shogun_scope').GetLastName]家和[SCOPE.gsInterestGroup('shogunate_ig').GetName]的权威因此受到了极大的削弱。"
 meiji.13.f: "时代变革之风呼啸着撞击着我们的国门，为了维护我们的统治，我们必须向世界展开它。"
 meiji.13.t: "日本开放"
 meiji.14.a: "今日，太阳栖于梦中。"
 meiji.14.d: "尽管新[ROOT.GetCountry.GetCustom('JAP_era_name')]政府所倡导的改革承诺令人振奋，但[ROOT.GetCountry.GetNameNoFlag]并未经历重大变革。批评者感叹，今日的国家与维新之前相比并无多大不同。"
 meiji.14.f: "工厂里，一台硕大无比的引擎呼呼作响、吃力运转，带动着一个巨大的飞轮，给大型车床和钻床提供动力。这些机器正切削出新的枪管、新的枪机、新的扳机，以武装一个庞大的新武器库。不久之后，某个国家很快将运用这蒸汽与钢铁，在世界上打下自己的印记——而这个国家不会是[ROOT.GetCountry.GetNameNoFormatting]。"
 meiji.14.t: "维新一场空"
 meiji.2.a: "[ROOT.GetCountry.GetAdjectiveNoFormatting]帝国将会崛起。"
 meiji.2.b: "我们需要强大的朋友，因为我们会树立强大的敌人。"
 meiji.2.c: "铁路是走向成功的关键。"
 meiji.2.d: "一支改革完毕的军队，一个开放且被认可的国家，一个新的社会。[ROOT.GetCountry.GetName]屹立于世界强国之列，可能会开始追求自己的帝国野心。"
 meiji.2.f: "“朕赖天佑保有，践万世一系之皇祚。我国之开化未浃，政律亦从而相异，非费时月能达其期望；故勉行于开明各国，欲择诸方法，采适宜妥当者，施之于我国，渐次改革政俗，使同一致。”" #Emperor Meiji
 meiji.2.t: "全新的日本"
 meiji.3.a: "让他们保留军官和贵族的身份。"
 meiji.3.b: "武士的时代结束了。"
 meiji.3.d: "[ROOT.GetCountry.GetName]成功改革了军队，终结了落后的封建体系。[SCOPE.gsInterestGroup('samurai_ig').GetName]阶层似乎不再拥有现代社会的一席之地。"
 meiji.3.f: "将军统治大名，而大名又依靠武士来维持对被奴役农民的统治。这是日本封建制的根基，但现在已经成为了过去的遗迹。还有一些人仍忠于武士的理念，这些准则和美德被称为武士道，这一遗产当然会延续下去。但武士阶层已经倒下了，而且我们也不会再见到他们这类人了。"
 meiji.3.t: "武士的落幕"
 meiji.4.a: "我们欢迎[SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting]的援助。"
 meiji.4.b: "我们不想要他们的金杯毒酒。"
 meiji.4.d: "由于对[ROOT.GetCountry.GetName]的现代化进程颇有兴趣，[SCOPE.sCountry('military_consultant_country').GetName]提议向我们派遣[SCOPE.sCharacter('military_consultant_general').GetFullName]将军作为军事顾问。这一协议的条款看上去对我们非常有利，但在让外国势力给我们做人情这方面，我们应当三思。"
 meiji.4.f: "“这个，长官，是一挺加特林机枪。每分钟两百发。不管什么玩意，无论是人还是野兽还是机器，都无法承受这个器械释放的如地狱一般的子弹风暴。我们会教你的士兵操作这个机械，维持现代军事纪律，以及无条件地遵从上级的命令。”"
 meiji.4.t: "[SCOPE.sCountry('military_consultant_country').GetAdjectiveNoFormatting]军事顾问"
 meiji.5.a: "建立牢固的外交关系。"
 meiji.5.b: "[SCOPE.sCountry('japan_embassy_country').GetName]有许多东西要教我们。"
 meiji.5.c: "我们从[SCOPE.sCountry('japan_embassy_country').GetName]那里什么也得不到。"
 meiji.5.d: "作为使团西行旅程的一部分，我们的权贵显要同[SCOPE.sCharacter('japan_embassy_politician').GetFullName]，一位老历的[SCOPE.sCountry('japan_embassy_country').GetAdjectiveNoFormatting]的政客举行了会面。出于有兴趣同新近开国的[ROOT.GetCountry.GetAdjectiveNoFormatting]政权建立良好关系的目的，对方起草了几份我们可能希望同[SCOPE.sCountry('japan_embassy_country').GetName]签订的协议。"
 meiji.5.f: "“方今世界各国，虽皆以亲睦礼仪相交，是全为表面名义；其于阴私，强弱相凌、大小相辱之情形仍存。于当时[ROOT.GetCountry.GetNameNoFormatting]，亲睦相交之国虽多，重国权自主如[SCOPE.sCountry('japan_embassy_country').GetAdjectiveNoFormatting]者，当谓其亲睦中之最亲睦国也。”" #Bismarck
 meiji.5.t: "往[SCOPE.sCountry('japan_embassy_country').GetName]使节团"
 meiji.6.a: "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting]的心灵手巧能够让[ROOT.GetCountry.GetName]富强起来。"
 meiji.6.b: "我们不需要外国人搅局我们的经济。"
 meiji.6.d: "[SCOPE.sCharacter('western_investor_ig_leader').GetFullName]，一名来自[SCOPE.sCountry('western_investor_country').GetName]有钱又有权的实业家，将[ROOT.GetCountry.GetName]看作一个油水颇丰但尚未开发的市场。作为在未来某个时候予以政治支持的交换，[SCOPE.sCharacter('western_investor_ig_leader').GetFullName]很愿意同我们分享一些[SCOPE.sCharacter('western_investor_ig_leader').GetHerHis]母国的工业技术。"
 meiji.6.f: "“我的同僚中有一些人对[ROOT.GetCountry.GetNameNoFormatting]的利益不屑一顾，认为此地缺乏有价值的自然资源，没有做生意的吸引力。然而，我却看到了这个国家的潜力。今日为原始森林和休耕田地的地方，明天将会成长为城市中心，吞吐着现代工业的健康烟云。”"
 meiji.6.t: "[SCOPE.sCountry('western_investor_country').GetAdjectiveNoFormatting]投资"
 meiji.7.a: "[SCOPE.sC('railway_engineer_country_1').GetName]能够帮助我们。"
 meiji.7.b: "[SCOPE.sC('railway_engineer_country_2').GetName]拥有杰出的工程师！"
 meiji.7.c: "[SCOPE.sC('railway_engineer_country_3').GetName]熟悉铁路。"
 meiji.7.d: "为了更快实现我们建设铁路网的雄心，有人建议从拥有铁路系统的国家邀请外国顾问来帮助我们。"
 meiji.7.e: "我们不需要外国的建议。"
 meiji.7.f: "“我向这位先生询问了关于火车头方面的问题，算是初步结识了一下这位先生，不过没想到关于火车头会有那么多可以谈的。事实证明，关于火车，我们还有很多事情需要去了解。”"
 meiji.7.t: "铁路顾问"
 meiji.8.a: "军民融合的完美范例！"
 meiji.8.b: "我们会亲自设置优先度。"
 meiji.8.d: "[SCOPE.gsInterestGroup('armed_forces_ig').GetName]知晓了政府扩建[ROOT.GetCountry.GetName]铁路的野心勃勃的计划，提出要为[SCOPE.sState('military_railway_state').GetName]的相关工作提供支持。"
 meiji.8.f: "“军方在任何情况下都能通过铁路获利，但是当前，这些铁路需要运用于其他的优先事项。让他们修建自己的铁路线路又是另外一回事了。在每一个时代，很大一部分权力都被把握在能够制地图的人手里。在我们的时代，铁路网络或许能够成为这些地图。”"
 meiji.8.t: "军用铁路"
 meiji.9.a: "是时候废除这项权利了。"
 meiji.9.b: "让其他有地位的公民也拥有这项权利。"
 meiji.9.c: "夺走武士的刀就是在撕裂他的灵魂！"
 meiji.9.d: "随着武士阶级特权的减少，他们持刀作为身份象征的特权受到了质疑。"
 meiji.9.f: "“也许所有国家的命运都会经历这样一个时期：战士阶级失去了他们在社会中的特殊地位，因为他们的价值必须给当代的优先事项让位。然而，剥夺一名战士的武器，不仅是剥夺他的地位，更是剥夺他的象征和他先祖的荣誉，必须被视为最大的耻辱！”"
 meiji.9.t: "武刃的学生"
